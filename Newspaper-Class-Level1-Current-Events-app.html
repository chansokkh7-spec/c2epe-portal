                18: { title: "Grant Proposals", terms: ["Funding request", "Project narrative", "Budget justification", "Grant reviewer", "Impact statement", "Feasibility", "Proposal deadline", "Successful application"], passage: "A grant proposal opens with a clear funding request and compelling project narrative. Careful budget justification and a strong impact statement convince a grant reviewer of a project's feasibility before the proposal deadline.", question: "What makes a grant proposal's 'impact statement' convincing to a reviewer?", funfact: "Did you know? Many major research grants receive far more applications than can be funded, making a strong proposal essential." },
                19: { title: "Digital & Multimedia Texts", terms: ["Hypertext", "Multimedia element", "Interactive text", "Digital publishing", "Nonlinear reading", "Embedded media", "Digital annotation", "Reader engagement"], passage: "Digital and multimedia texts use hypertext and embedded media to create a genuinely interactive text. Digital publishing supports nonlinear reading and digital annotation, reshaping reader engagement compared to traditional print.", question: "How does reading a nonlinear, interactive digital text change the reading experience compared to a book?", funfact: "Did you know? Hypertext, the foundation of nearly all digital reading today, was first theorized decades before the internet became widely available." },
                20: { title: "Travel Writing", terms: ["Travel writing", "Journey", "Description", "Culture", "Narrative", "Observation", "Place", "Perspective"], passage: "Travel writing combines narrative with detailed description of place and culture. Careful observation and an honest perspective turn a journey into a meaningful story for readers.", question: "Which place would you most like to write about?", funfact: "Did you know? The 14th-century traveller Ibn Battuta journeyed tens of thousands of kilometres and recorded his travels in a famous book." },
                21: { title: "Science Journalism", terms: ["Science journalism", "Research", "Evidence", "Uncertainty", "Explain", "Expert", "Accuracy", "Public understanding"], passage: "Science journalism helps public understanding by explaining new research. Good reporters check evidence, quote an independent expert and explain uncertainty rather than exaggerating results, protecting accuracy.", question: "Why do science headlines sometimes exaggerate findings?", funfact: "Did you know? A single study rarely proves something — good science reporting explains how a new result fits with earlier research." },
                22: { title: "Book Reviews", terms: ["Review", "Summary", "Evaluation", "Plot", "Style", "Recommendation", "Critic", "Reader"], passage: "A book review gives a brief summary of the plot without spoilers, followed by evaluation of style and ideas. The critic ends with a recommendation to help the reader decide.", question: "What should a good book review include?", funfact: "Did you know? The New York Times Book Review was first published in 1896." },
                23: { title: "Speeches and Oratory", terms: ["Speech", "Oratory", "Audience", "Rhetoric", "Repetition", "Delivery", "Persuasion", "Historic"], passage: "Great oratory moves an audience. A historic speech uses rhetoric such as repetition, strong delivery and a clear message to achieve persuasion.", question: "Which famous speech do you find most powerful?", funfact: "Did you know? Martin Luther King Jr.'s 'I Have a Dream' speech was delivered in Washington, D.C., in 1963." },
                24: { title: "Data Journalism", terms: ["Data journalism", "Dataset", "Chart", "Analysis", "Trend", "Transparency", "Visualisation", "Evidence"], passage: "Data journalism uses a dataset and careful analysis to find each trend. A clear chart or visualisation presents evidence, and transparency about methods builds trust.", question: "How can data make a news story stronger?", funfact: "Did you know? In the 1850s, Florence Nightingale used innovative diagrams to show that many soldiers were dying from preventable disease." },
                25: { title: "Writing an Academic Essay", terms: ["Essay", "Thesis", "Paragraph", "Evidence", "Analysis", "Counterargument", "Conclusion", "Citation"], passage: "An academic essay starts with a clear thesis. Each paragraph presents evidence and analysis, a counterargument shows balance, and a strong conclusion and accurate citation complete the work.", question: "What is the hardest part of writing an essay for you?", funfact: "Did you know? The essay form is often traced to Michel de Montaigne, who published his 'Essais' in 1580." },
            },
        };
        Object.values(curriculum).forEach(g => Object.values(g).forEach(d => { d.vocab = d.terms; d.story = d.passage; }));

        const minWords = () => MIN_WORDS[state.level] || 3;
        function allTermsForLevel(level) {
            let words = [];

            return [...new Set(words)];

        // ===== Progress: stars/badges are earned once per activity and remembered =====
        // Saved in this browser when the page is opened as a normal web page. Inside the Hub's
        // secure "Embed Code" box the browser blocks storage, so progress then lasts until the
        // page is closed — but it still can't be farmed by tapping the same button again.
        const PROGRESS_PREFIX = 'c2epe_onlineclass_newspaper_progress_';
        const PROGRESS_KEY = () => PROGRESS_PREFIX + state.level;
        let progress = { stars: 0, badges: 0, awarded: {}, best: {}, completed: {} };
        function loadProgress() {
            progress = { stars: 0, badges: 0, awarded: {}, best: {}, completed: {} };
            try {
                const saved = JSON.parse(localStorage.getItem(PROGRESS_KEY()) || 'null');
                if (saved && typeof saved === 'object') progress = Object.assign(progress, saved);
            } catch (e) { /* storage not available (e.g. inside the Hub sandbox) */ }
            state.stars = progress.stars; state.badges = progress.badges;
            document.getElementById('star-count').textContent = state.stars;
            document.getElementById('badge-count').textContent = state.badges;
        }
        function saveProgress() {
            progress.stars = state.stars; progress.badges = state.badges;
            try { localStorage.setItem(PROGRESS_KEY(), JSON.stringify(progress)); } catch (e) {}
        }
        const unitKey = (what) => 'u' + state.unit + '|' + what;
        const wasAwarded = (key) => !!progress.awarded[state.level + '|' + key];
        // Gives stars only the first time an activity is done. Returns true if stars were given.
        function award(key, amount) {
            const k = state.level + '|' + key;
            if (progress.awarded[k]) return false;
            progress.awarded[k] = true;
            addStars(amount);
            return true;
        }
        // Shows "(+3 ⭐)" the first time, and a friendly note afterwards
        const starNote = (given, amount) => given ? ` (+${amount} ⭐)` : ' (stars already earned)';

        function isRecentlyAdded(dateStr) {
            if (!dateStr) return false;
            const added = new Date(dateStr);
            if (isNaN(added.getTime())) return false;
            const daysSince = (Date.now() - added.getTime()) / (1000 * 60 * 60 * 24);
            return daysSince >= 0 && daysSince <= 7;
        }

        function populateUnitSelect() {
            const sel = document.getElementById('unit-select');
            const levelData = curriculum[state.level];
            const prevUnit = state.unit;
            const unitCount = Object.keys(levelData).length;
            const labelEl = document.getElementById('unit-select-label');
            if (labelEl) labelEl.textContent = `Select Unit (1 to ${unitCount})`;
            // 🎬 = this unit has a video · 🆕 = video added in the last 7 days
            sel.innerHTML = Object.keys(levelData).map(u => {
                const v = videoFor(state.level, u);
                const mark = v ? (isRecentlyAdded(v.dateAdded) ? ' 🆕' : ' 🎬') : '';
                return `<option value="${u}">Unit ${u}: ${levelData[u].title}${mark}</option>`;
            }).join('');
            if (levelData[prevUnit]) {
                sel.value = prevUnit;
                state.unit = prevUnit;
            } else {
                state.unit = parseInt(sel.value);
            }
        }

        // On phones the lesson sits below the module list, so after choosing a module, a unit
        // or the next lesson, the page scrolls to the lesson by itself.
        const isPhone = () => window.matchMedia('(max-width: 767px)').matches;
        function scrollToLesson(always) {
            const area = document.getElementById('content-area');
            if (!area) return;
            if (!(isPhone() || (always && area.getBoundingClientRect().top < 0))) return;
            // Wait for the new lesson to be drawn, then glide to it; some phones stop a smooth
            // scroll that starts during the tap, so if it hasn't arrived, jump there directly.
            setTimeout(() => {
                area.scrollIntoView({ behavior: 'smooth', block: 'start' });
                setTimeout(() => { if (Math.abs(area.getBoundingClientRect().top) > 40) area.scrollIntoView({ block: 'start' }); }, 700);
            }, 60);
        }
        function jumpToModules() {
            const side = document.getElementById('module-sidebar');

        function completeActivity() {
            markActivityComplete(state.tab);

            let gotBadge = false;

            else if (gotStars) alert('🎉 Great work! You finished this activity and earned 5 Stars ⭐!');

            const levelData = curriculum[state.level];
            const unitNumbers = Object.keys(levelData).map(Number).sort((a, b) => a - b);
            const idx = unitNumbers.indexOf(state.unit);
            const nextIdx = (idx === -1 ? 0 : idx + 1) % unitNumbers.length;
            state.unit = unitNumbers[nextIdx];
            document.getElementById('unit-select').value = state.unit;
            renderContent();
            scrollToLesson(true);

        // Safe inside onclick="...('here')": escapes backslashes, single quotes and double quotes
        function escapeJsStr(s) {
            return String(s).replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '&quot;');
        }
        const escapeHtml = (s) => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

        // Splits a story into sentences. (Written without "look-behind" regex, which older
        // iPhones — before iOS 16.4 — cannot read and which made the whole page stop there.)
        function splitSentences(text) {
            return (String(text).match(/[^.!?]+[.!?]+["')]*|[^.!?]+$/g) || []).map(s => s.trim()).filter(Boolean);
        }
        const countWords = (s) => (String(s).match(/[A-Za-z\u00C0-\u024F\u1780-\u17FF]+(?:['’-][A-Za-z]+)*/g) || []).length;

        // ---------- Helper: Text-to-Speech (voices load a moment after the page opens) ----------
        let enVoice = null;
        function pickVoice() {
            if (!('speechSynthesis' in window)) return;
            enVoice = window.speechSynthesis.getVoices().find(v => v.lang && v.lang.startsWith('en')) || null;
        }
        if ('speechSynthesis' in window) { pickVoice(); window.speechSynthesis.onvoiceschanged = pickVoice; }
        function speak(text, onEnd) {
            if (!('speechSynthesis' in window)) { if (onEnd) onEnd(false); return false; }
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(text);
            u.lang = 'en-US';
            u.rate = 0.9;
            if (!enVoice) pickVoice();
            if (enVoice) u.voice = enVoice;
            if (onEnd) u.onend = () => onEnd(true);
            window.speechSynthesis.speak(u);
            return true;
        }

        function shuffle(arr) {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        function allVocabForLevel(level) {
            let words = [];
            Object.keys(curriculum[level]).forEach(u => words.push(...curriculum[level][u].vocab));
            return [...new Set(words)];
        }

        // ---------- Pictures ----------
        // When two words in the SAME unit would show the same picture, the second one gets its
        // own picture here (only inside that unit), so children can tell them apart.
        const SAME_UNIT_ALT = {
            "Goodbye": "🚶👋", "Thank you": "💝", "Sorry": "😔", "Respect": "🫡", "Tomorrow": "⏭️",
            "West": "🌇", "East": "🌄", "North": "🧭", "Between": "🥪", "Early": "🐓", "Late": "⏰",
            "Swing": "🎠", "Poster": "🪧"
        };
        function baseEmoji(word) { return WORD_EMOJI[word] || '🖼️'; }
        function emojiFor(word, unitData) {
            const u = unitData || curriculum[state.level][state.unit];
            const e = baseEmoji(word);
            if (u && SAME_UNIT_ALT[word] && (u.vocab || u.terms).some(w => w !== word && baseEmoji(w) === e)) return SAME_UNIT_ALT[word];
            return e;
        }
        // Wrong answers for "look at the picture" questions never share the right answer's
        // picture, so there is always exactly one correct choice.
        function pictureDistractors(correct, pool, unitData, n) {
            const pic = emojiFor(correct, unitData);
            const ok = (w) => w !== correct && emojiFor(w, unitData) !== pic;
            let list = shuffle([...new Set(pool)].filter(ok)).slice(0, n);
            if (list.length < n) {
                const extra = shuffle(allVocabForLevel(state.level).filter(w => ok(w) && !list.includes(w)));
                list = list.concat(extra.slice(0, n - list.length));
            }

        function youtubeIdOf(link) {
            const s = String(link || '').trim();
            if (/^[A-Za-z0-9_-]{11}$/.test(s)) return s;
            const m = s.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/))([A-Za-z0-9_-]{11})/);
            return m ? m[1] : '';
        }
        function videoFor(level, unit) {
            const v = (VIDEO_LESSONS[level] || {})[unit];
            if (!v) return null;
            if (v.mp4 && /^https:\/\//.test(v.mp4)) return { mp4: v.mp4, id: v.mp4, dateAdded: v.dateAdded || '', checkpoints: Array.isArray(v.checkpoints) ? v.checkpoints : [] };
            const id = youtubeIdOf(v.videoId);
            return id ? { id, dateAdded: v.dateAdded || '', checkpoints: Array.isArray(v.checkpoints) ? v.checkpoints : [] } : null;
        }
        // The Video button shows 🆕 when this unit's video is new, and "(soon)" when there is none yet
        function updateVideoTabBadge() {
            const btn = document.querySelector('.tab-btn[data-tab="video"]');
            if (!btn) return;
            const v = videoFor(state.level, state.unit);
            btn.textContent = (v && isRecentlyAdded(v.dateAdded) ? '🆕 ' : '') + '📹 0. Video Lesson' + (v ? '' : ' (soon)');

        let ytPlayer = null;
        let ytPollInterval = null;

        let ytApiLoadPromise = null;
        let ytFallbackTimer = null;

        // Stops the video and its timers whenever the student leaves the Video tab or changes unit
        function stopVideo() {
            if (ytPollInterval) { clearInterval(ytPollInterval); ytPollInterval = null; }
            if (ytFallbackTimer) { clearTimeout(ytFallbackTimer); ytFallbackTimer = null; }
            if (ytPlayer && typeof ytPlayer.destroy === 'function') { try { ytPlayer.destroy(); } catch (e) {} }
            ytPlayer = null;
        }

        function loadYouTubeApi() {
            if (window.YT && window.YT.Player) return Promise.resolve();
            if (ytApiLoadPromise) return ytApiLoadPromise;
            ytApiLoadPromise = new Promise((resolve, reject) => {
                window.onYouTubeIframeAPIReady = resolve;
                const tag = document.createElement('script');
                tag.src = 'https://www.youtube.com/iframe_api';
                tag.onerror = () => { ytApiLoadPromise = null; reject(new Error('YouTube could not load')); };
                document.head.appendChild(tag);
            });
            return ytApiLoadPromise;
        }

        function renderVideoLesson(contentDiv) {
            stopVideo();
            ytAnsweredCheckpoints = new Set();

            if (!ytCurrentConfig) {
                contentDiv.innerHTML = `

                return;

            contentDiv.innerHTML = `
                <h2 class="text-xl font-bold text-indigo-900 mb-2">📹 Video Lesson — Unit ${state.unit}: ${unitData.title}</h2>

            const wanted = ytCurrentConfig.id;
            loadYouTubeApi().then(() => {
                if (!ytCurrentConfig || ytCurrentConfig.id !== wanted || !document.getElementById('yt-player-el')) return;
                ytPlayer = new YT.Player('yt-player-el', {

                        onStateChange: onYtStateChange,
                        onError: () => showFallback('This video cannot play inside the lesson.')
                    }
                });
            }).catch(() => showFallback('The video player could not load.'));

        const SUBTITLES = {"OC-NP1-Unit01-Reading-Local-News": [[0.35, 5.93, "Hello, everyone! I'm Ms. Emma. Welcome to Online Newspaper Class, level one."], [6.23, 9.71, "Hi! I'm Visal. Let's learn together!"], [10.01, 16.04, "Unit one: Reading Local News. Today you will read and write news headlines in the present simple."], [16.34, 18.71, "Here is our lesson map. Let's start!"], [19.67, 22.66, "Part one: words. You will learn eight new words."], [23.52, 24.38, "Headline."], [25.38, 28.44, "Headline means the short title at the top of a news story."], [29.05, 31.28, "The headline caught everyone's attention."], [31.88, 34.72, "Your turn. Say: Headline."], [37.57, 38.48, "Headline."], [39.22, 40.18, "Reporter."], [41.18, 44.48, "Reporter means a person who gathers and writes news stories."], [45.08, 46.85, "The reporter interviewed the mayor."], [47.45, 50.01, "Your turn. Say: Reporter."], [52.87, 53.8, "Reporter."], [54.55, 55.33, "Byline."], [56.32, 59.31, "Byline means the line that tells you who wrote the article."], [59.92, 61.89, "The byline shows the writer's name."], [62.48, 64.86, "Your turn. Say: Byline."], [67.7, 68.61, "Byline."], [69.35, 70.37, "Source."], [71.38, 75.68, "Source means a person or document that gives information for a story."], [76.28, 78.59, "A good reporter always checks the source."], [79.18, 81.63, "Your turn. Say: Source."], [84.47, 85.29, "Source."], [86.05, 87.2, "Breaking news."], [88.22, 92.2, "Breaking news means news that has just happened and is being reported at once."], [92.82, 94.87, "Breaking news: a bridge has reopened."], [95.48, 98.1, "Your turn. Say: Breaking news."], [100.97, 102.2, "Breaking news."], [102.95, 103.88, "Update."], [104.88, 107.53, "Update means new information added to a story."], [108.12, 110.34, "The paper published an update at noon."], [110.95, 113.31, "Your turn. Say: Update."], [116.17, 117.02, "Update."], [117.78, 118.73, "Local."], [119.72, 122.67, "Local means connected with a particular town or area."], [123.28, 125.89, "Local news tells us what is happening near us."], [126.48, 128.73, "Your turn. Say: Local."], [131.57, 132.42, "Local."], [133.18, 134.1, "Community."], [135.12, 138.72, "Community means a group of people who live in the same area."], [139.32, 141.55, "The whole community came to the festival."], [142.15, 144.65, "Your turn. Say: Community."], [147.5, 148.48, "Community."], [149.27, 152.72, "Part two: dialogue. Let's listen to a conversation."], [153.58, 160.75, "Visal, look at this headline: 'Mayor opens new market'. It is about last week, but the verb is in the present. Why?"], [161.85, 170.25, "Headlines use the present simple for past events. It makes the news feel fresh and keeps the headline short."], [171.35, 173.38, "And what do I find under the headline?"], [174.48, 181.72, "The byline names the reporter. The article then gives the full story in the past tense, with each source named."], [182.82, 185.85, "So a local story can matter to the whole community?"], [186.95, 194.75, "Yes. Local news is close to our daily lives, and a breaking news update can help people act quickly."], [195.9, 197.76, "Part three: grammar."], [198.62, 201.67, "Grammar focus: Present simple in headlines."], [201.97, 203.12, "Look at the pattern."], [203.82, 205.47, "Mayor opens new market."], [206.38, 208.06, "Flood closes main road."], [208.95, 211.04, "Students win national prize."], [212.0, 218.99, "Headlines use the present simple for events that already happened. Drop small words like 'the' and 'a': 'Mayor opens market'."], [219.75, 223.66, "Be careful! Don't say: Mayor opened new market (headline)"], [225.6, 227.97, "Say: Mayor opens new market"], [228.27, 231.08, "Headlines use the present simple for past events."], [231.87, 234.55, "Part four: reading. Read and listen."], [235.37, 237.15, "Why Local News Matters."], [237.45, 241.94, "A local newspaper tells a community what is happening on its own streets."], [242.93, 248.0, "A reporter gathers facts from a reliable source and writes a clear headline above the story."], [249.0, 253.45, "The byline shows who wrote the article, so readers know who is responsible for it."], [254.43, 259.01, "When breaking news arrives, the paper adds an update as soon as new facts are confirmed."], [260.0, 264.0, "In this way, local news helps neighbours stay informed and work together."], [265.1, 268.99, "Part five: quiz. Five questions. Are you ready?"], [269.85, 272.72, "Headlines use the present simple for blank events."], [273.02, 276.62, "A, past. B, future. C, imaginary."], [280.17, 282.06, "The answer is A: past."], [283.22, 285.45, "The line that names the writer is the blank."], [285.75, 289.1, "A, headline. B, byline. C, source."], [292.63, 294.71, "The answer is B: byline."], [295.85, 298.53, "News that has just happened is blank news."], [298.83, 301.73, "A, old. B, breaking. C, local."], [305.27, 307.29, "The answer is B: breaking."], [308.45, 309.96, "Choose the best headline."], [310.26, 315.44, "A, Mayor opened the new market. B, Mayor opens new market. C, Mayor is open market."], [319.0, 321.95, "The answer is B: Mayor opens new market."], [323.12, 325.86, "According to the reading, a paper adds an update when…"], [326.16, 331.43, "A, a reader complains. B, new facts are confirmed. C, it has no source."], [334.97, 337.72, "The answer is B: new facts are confirmed."], [338.93, 342.28, "Part six: speaking. It's your turn to talk."], [343.12, 346.17, "What makes a local news story important to a community?"], [354.98, 356.5, "Now listen to Visal."], [356.8, 379.88, "A local story is important because it affects people's daily lives. For example, news about a closed road or a new clinic tells neighbours what to do next. It also builds trust, because reporters live in the same community. Finally, local news gives ordinary people a voice and helps them solve problems together."], [380.18, 381.99, "Excellent answer, Visal!"], [382.88, 387.65, "Great work! Now you can use eight new words and present simple in headlines."], [387.95, 394.32, "Today's value is community awareness. Notice how changes affect every neighbour, not only the winners."], [394.62, 396.98, "See you in Unit two. Goodbye!"], [397.28, 400.44, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-NP1-Unit02-Weather-Environment-News": [[0.35, 5.78, "Hello, everyone! I'm Ms. Emma. Welcome to Online Newspaper Class, level one."], [6.08, 9.47, "Hi! I'm Visal. Let's learn together!"], [9.77, 16.34, "Unit two: Weather & Environment News. Today you will report forecasts with 'is expected to' and the passive."], [16.64, 19.21, "Here is our lesson map. Let's start!"], [20.17, 23.46, "Part one: words. You will learn eight new words."], [24.32, 25.38, "Forecast."], [26.38, 29.52, "Forecast means a statement about what the weather will be like."], [30.12, 32.4, "The forecast says it will rain tomorrow."], [32.98, 35.54, "Your turn. Say: Forecast."], [38.4, 39.51, "Forecast."], [40.25, 41.05, "Climate."], [42.05, 45.26, "Climate means the usual weather of a place over many years."], [45.85, 48.29, "Cambodia has a warm, tropical climate."], [48.88, 51.73, "Your turn. Say: Climate."], [54.57, 55.19, "Climate."], [55.95, 57.53, "Natural disaster."], [58.52, 62.78, "Natural disaster means a sudden event in nature that causes great damage."], [63.38, 66.5, "A natural disaster can destroy homes in minutes."], [67.08, 70.36, "Your turn. Say: Natural disaster."], [73.2, 74.72, "Natural disaster."], [75.48, 76.36, "Drought."], [77.35, 80.17, "Drought means a long period with very little rain."], [80.78, 83.24, "The drought left the fields dry and brown."], [83.85, 86.56, "Your turn. Say: Drought."], [89.4, 90.2, "Drought."], [90.95, 91.68, "Flood."], [92.68, 95.7, "Flood means a large amount of water covering dry land."], [96.32, 98.79, "The flood forced families to leave their homes."], [99.38, 102.0, "Your turn. Say: Flood."], [104.87, 105.69, "Flood."], [106.45, 107.54, "Conservation."], [108.55, 112.35, "Conservation means the protection of nature and natural resources."], [112.95, 115.46, "Conservation saves forests for the future."], [116.05, 118.55, "Your turn. Say: Conservation."], [121.4, 122.61, "Conservation."], [123.35, 124.29, "Temperature."], [125.28, 128.06, "Temperature means how hot or cold something is."], [128.65, 131.26, "The temperature reached thirty-eight degrees."], [131.85, 134.58, "Your turn. Say: Temperature."], [137.43, 138.45, "Temperature."], [139.18, 140.02, "Warning."], [141.02, 143.9, "Warning means a message telling people about danger."], [144.48, 146.43, "The government issued a storm warning."], [147.02, 149.7, "Your turn. Say: Warning."], [152.57, 153.47, "Warning."], [154.27, 157.63, "Part two: dialogue. Let's listen to a conversation."], [158.48, 163.34, "Visal, the news says heavy rain is expected on Friday. How do reporters know?"], [164.45, 172.6, "They rely on a forecast from weather experts. Reporters write 'is expected to' or 'is forecast to' because nothing is certain yet."], [173.72, 175.74, "What if the rain becomes dangerous?"], [176.85, 185.45, "Then the authorities issue a warning. In the news we read: 'A flood warning was issued for the river towns.'"], [186.55, 188.67, "Why is the passive used so often?"], [189.75, 195.63, "The action matters more than the person. 'Thousands were evacuated' tells us the important fact first."], [196.77, 198.35, "Part three: grammar."], [199.18, 202.88, "Grammar focus: Passive and 'is expected to' in reports."], [203.18, 204.35, "Look at the pattern."], [205.05, 207.98, "Heavy rain is expected to hit the coast on Friday."], [208.88, 211.76, "A flood warning was issued for three provinces."], [212.65, 215.59, "Thousands of people were evacuated before the storm."], [216.53, 223.72, "Use 'is expected to + verb' for predictions and the passive (was issued, were evacuated) when the action is more important than the person."], [224.48, 228.22, "Be careful! Don't say: Rain is expect to hit Friday."], [230.17, 232.74, "Say: Rain is expected to hit Friday."], [233.03, 235.55, "Use the participle 'expected' after is."], [236.33, 238.95, "Part four: reading. Read and listen."], [239.77, 241.0, "Reporting the Weather."], [241.3, 245.52, "Weather reporters turn a complex forecast into clear news for the public."], [246.53, 251.54, "Climate patterns are studied for years, but a daily forecast looks only a few days ahead."], [252.53, 257.91, "When a natural disaster threatens, a warning is issued and people are told to move to safe places."], [258.9, 264.13, "Drought and flood stories also remind readers why conservation of land and water matters."], [265.13, 269.17, "Accurate reporting can therefore protect lives as well as inform."], [270.27, 274.26, "Part five: quiz. Five questions. Are you ready?"], [275.12, 277.75, "Heavy rain blank to hit the coast on Friday."], [278.06, 282.49, "A, is expected. B, expects. C, was expect."], [286.03, 288.35, "The answer is A: is expected."], [289.48, 292.24, "A long period with very little rain is a blank."], [292.54, 295.47, "A, flood. B, drought. C, warning."], [299.03, 300.59, "The answer is B: drought."], [301.75, 303.81, "A message about danger is a blank."], [304.11, 307.53, "A, forecast. B, warning. C, temperature."], [311.07, 312.76, "The answer is B: warning."], [313.92, 315.64, "Choose the correct sentence."], [315.94, 321.12, "A, A warning issued was.. B, A warning was issued.. C, A warning is issue.."], [324.67, 327.18, "The answer is B: A warning was issued.."], [328.32, 331.48, "According to the reading, accurate reporting can protect…"], [331.78, 335.64, "A, lives. B, tickets. C, newspapers."], [339.2, 341.4, "The answer is A: lives."], [342.6, 346.0, "Part six: speaking. It's your turn to talk."], [346.85, 350.17, "Why is accurate weather reporting important for public safety?"], [358.98, 360.65, "Now listen to Visal."], [360.95, 383.41, "Accurate weather reporting is important because people use it to make safe choices. If a storm is forecast, families can move to higher ground and farmers can protect their crops. A wrong forecast, however, may cause panic or leave people unprepared. For this reason, journalists should always check official sources."], [383.71, 385.41, "Excellent answer, Visal!"], [386.32, 391.37, "Great work! Now you can use eight new words and passive and 'is expected to' in reports."], [391.67, 395.21, "Today's value is being prepared. Get ready before you go."], [395.51, 397.94, "See you in Unit three. Goodbye!"], [398.24, 401.29, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-NP1-Unit03-Sports-News": [[0.35, 5.56, "Hello, everyone! I'm Ms. Emma. Welcome to Online Newspaper Class, level one."], [5.86, 9.16, "Hi! I'm Visal. Let's learn together!"], [9.46, 15.88, "Unit three: Sports News. Today you will write match reports with the past simple and present perfect."], [16.18, 18.95, "Here is our lesson map. Let's start!"], [19.9, 23.09, "Part one: words. You will learn eight new words."], [23.95, 24.74, "Match."], [25.75, 28.61, "Match means a game between two teams or players."], [29.22, 30.84, "The match ended in a draw."], [31.45, 33.7, "Your turn. Say: Match."], [36.53, 37.48, "Match."], [38.22, 39.1, "Score."], [40.12, 42.86, "Score means the number of points or goals in a game."], [43.45, 45.38, "The final score was three to two."], [45.98, 48.52, "Your turn. Say: Score."], [51.37, 52.29, "Score."], [53.05, 54.1, "Championship."], [55.08, 58.94, "Championship means a competition to find the best team or player."], [59.55, 62.22, "Cambodia hosted the championship last year."], [62.82, 65.96, "Your turn. Say: Championship."], [68.8, 70.05, "Championship."], [70.78, 71.64, "Athlete."], [72.65, 75.24, "Athlete means a person who is trained in a sport."], [75.85, 78.09, "The young athlete trains every morning."], [78.68, 81.1, "Your turn. Say: Athlete."], [83.97, 84.93, "Athlete."], [85.68, 86.46, "Tournament."], [87.45, 90.95, "Tournament means a series of games in which players compete to win."], [91.55, 93.68, "Sixteen teams entered the tournament."], [94.28, 96.83, "Your turn. Say: Tournament."], [99.67, 100.54, "Tournament."], [101.28, 102.15, "Victory."], [103.15, 105.98, "Victory means success in winning a game or battle."], [106.58, 108.77, "The victory delighted the home crowd."], [109.38, 111.63, "Your turn. Say: Victory."], [114.47, 115.33, "Victory."], [116.08, 116.99, "Defeat."], [117.98, 120.58, "Defeat means the experience of losing a game."], [121.18, 123.23, "Defeat taught the team an important lesson."], [123.82, 126.43, "Your turn. Say: Defeat."], [129.3, 130.06, "Defeat."], [130.82, 131.91, "Commentary."], [132.92, 136.65, "Commentary means a spoken description of a game as it happens."], [137.25, 140.04, "The radio commentary made the match exciting."], [140.65, 143.56, "Your turn. Say: Commentary."], [146.4, 147.48, "Commentary."], [148.27, 151.79, "Part two: dialogue. Let's listen to a conversation."], [152.65, 158.52, "Visal, the report says 'The home side scored twice and won the match.' Why is it in the past?"], [159.62, 167.15, "A match report describes a finished event, so we use the past simple: scored, won, lost."], [168.25, 170.8, "But I also read 'The team has reached the final.'"], [171.88, 182.47, "That is the present perfect. It links a past result to the present situation, so it is common in sports headlines and live commentary."], [183.55, 186.47, "So the score and the commentary use different tenses?"], [187.58, 195.02, "Often yes. The report gives the past facts, while commentary and updates show what has happened so far."], [196.17, 197.68, "Part three: grammar."], [198.52, 202.83, "Grammar focus: Past simple vs present perfect in sports news."], [203.13, 204.31, "Look at the pattern."], [205.02, 207.64, "The home side scored twice in the second half."], [208.55, 211.22, "The champions lost their first match yesterday."], [212.12, 214.67, "The team has reached the final for the first time."], [215.63, 222.66, "Use the past simple with a finished time (yesterday, in the second half). Use the present perfect when the result still matters now."], [223.42, 227.45, "Be careful! Don't say: The team has won yesterday."], [229.4, 231.24, "Say: The team won yesterday."], [231.54, 234.05, "A finished time needs the past simple."], [234.83, 237.52, "Part four: reading. Read and listen."], [238.33, 239.74, "Match Day Report."], [240.04, 243.74, "Thousands of fans filled the stadium for the final match of the tournament."], [244.73, 248.62, "The home side scored twice in the second half and secured a famous victory."], [249.63, 253.44, "The visiting athletes played well, but defeat came after a late goal."], [254.43, 257.98, "The score of two to one has given the club its first championship."], [258.97, 263.08, "Radio commentary carried the excitement to listeners across the country."], [264.17, 268.61, "Part five: quiz. Five questions. Are you ready?"], [269.45, 271.86, "The home side blank twice in the second half."], [272.16, 275.87, "A, scored. B, has scored. C, scoring."], [279.43, 281.15, "The answer is A: scored."], [282.32, 284.56, "Success in winning a game is a blank."], [284.86, 288.34, "A, defeat. B, victory. C, commentary."], [291.9, 293.77, "The answer is B: victory."], [294.92, 297.25, "A spoken description of a game is blank."], [297.55, 301.72, "A, commentary. B, a byline. C, a score."], [305.27, 307.38, "The answer is A: commentary."], [308.52, 311.63, "Choose the best sentence about a result that still matters."], [311.93, 318.49, "A, The team reached yesterday the final.. B, The team has reached the final.. C, The team reach the final.."], [322.03, 325.22, "The answer is B: The team has reached the final.."], [326.38, 329.24, "According to the reading, the score gave the club its first…"], [329.54, 333.06, "A, tournament. B, championship. C, match."], [336.6, 339.04, "The answer is B: championship."], [340.23, 343.43, "Part six: speaking. It's your turn to talk."], [344.28, 347.45, "What makes sports news exciting for readers to follow?"], [356.25, 357.87, "Now listen to Visal."], [358.17, 380.64, "Sports news is exciting because the result is never certain. Readers feel the hope of victory and the pain of defeat together with the athletes. Fast scores and live commentary also create a shared experience, so fans can talk about every match. Finally, many sports stories show courage and hard work."], [380.94, 382.71, "Excellent answer, Visal!"], [383.62, 389.32, "Great work! Now you can use eight new words and past simple vs present perfect in sports news."], [389.62, 394.09, "Today's value is sportsmanship. Play fair and shake hands, win or lose."], [394.39, 396.93, "See you in Unit four. Goodbye!"], [397.23, 399.96, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-NP1-Unit04-Technology-News": [[0.35, 5.83, "Hello, everyone! I'm Ms. Emma. Welcome to Online Newspaper Class, level one."], [6.13, 9.5, "Hi! I'm Visal. Let's learn together!"], [9.8, 16.18, "Unit four: Technology News. Today you will talk about plans and launches with 'is set to' and 'is due to'."], [16.48, 19.25, "Here is our lesson map. Let's start!"], [20.2, 23.94, "Part one: words. You will learn eight new words."], [24.78, 25.81, "Innovation."], [26.82, 30.37, "Innovation means a new idea, method or invention."], [30.98, 33.66, "Innovation drives the technology industry."], [34.25, 36.94, "Your turn. Say: Innovation."], [39.8, 40.78, "Innovation."], [41.52, 42.24, "Launch."], [43.25, 46.45, "Launch means the first time a product is shown or sold."], [47.05, 49.48, "The launch attracted thousands of customers."], [50.08, 52.48, "Your turn. Say: Launch."], [55.33, 56.3, "Launch."], [57.05, 57.89, "Startup."], [58.88, 62.25, "Startup means a new company, often based on a new idea."], [62.85, 65.0, "A Phnom Penh startup created the app."], [65.62, 68.28, "Your turn. Say: Startup."], [71.13, 72.11, "Startup."], [72.85, 73.72, "Device."], [74.72, 78.24, "Device means a small machine made for a particular purpose."], [78.85, 81.12, "This device charges in ten minutes."], [81.72, 84.47, "Your turn. Say: Device."], [87.33, 88.3, "Device."], [89.05, 90.35, "Software update."], [91.35, 94.99, "Software update means a new version of a program that improves it."], [95.58, 98.14, "The software update fixed the security problem."], [98.75, 101.88, "Your turn. Say: Software update."], [104.73, 106.14, "Software update."], [106.88, 107.8, "Breakthrough."], [108.82, 112.16, "Breakthrough means an important discovery that solves a problem."], [112.75, 114.99, "Scientists announced a battery breakthrough."], [115.58, 118.03, "Your turn. Say: Breakthrough."], [120.87, 121.86, "Breakthrough."], [122.62, 123.63, "Industry."], [124.62, 128.15, "Industry means all the companies that make one kind of product."], [128.75, 131.44, "The technology industry employs millions."], [132.05, 134.7, "Your turn. Say: Industry."], [137.57, 138.56, "Industry."], [139.32, 140.28, "Consumer."], [141.28, 144.48, "Consumer means a person who buys goods or services."], [145.08, 147.65, "Consumers want cheaper, faster devices."], [148.25, 150.62, "Your turn. Say: Consumer."], [153.47, 154.5, "Consumer."], [155.3, 158.88, "Part two: dialogue. Let's listen to a conversation."], [159.72, 164.92, "Visal, this article says a new phone 'is set to launch next month'. What does 'set to' mean?"], [166.02, 174.36, "It means the event is planned and expected. 'Is due to' is similar: the company is due to announce the device on Monday."], [175.45, 176.59, "Is it certain?"], [177.68, 185.0, "It is a strong plan, but technology news also uses 'is likely to' and 'could' when a launch is not confirmed."], [186.12, 188.29, "Why do headlines love these phrases?"], [189.38, 197.0, "They are short and neutral. They tell consumers what is coming without promising it, which is important in a fast-moving industry."], [198.17, 199.85, "Part three: grammar."], [200.72, 204.55, "Grammar focus: Future news with is set to and is due to."], [204.85, 206.04, "Look at the pattern."], [206.75, 209.49, "The startup is set to launch its app next month."], [210.38, 212.88, "The new device is due to go on sale on Monday."], [213.78, 215.85, "The update is likely to fix the problem."], [216.8, 223.96, "Use is set to / is due to + base verb for planned events, and is likely to for probable ones. Do not add 'will' after them."], [224.72, 228.16, "Be careful! Don't say: The app is set to will launch."], [230.1, 232.52, "Say: The app is set to launch."], [232.82, 234.72, "Do not add will after is set to."], [235.53, 238.53, "Part four: reading. Read and listen."], [239.33, 240.89, "A Busy Week in Tech."], [241.19, 245.01, "This week the technology industry is full of news about innovation."], [246.0, 251.49, "A local startup is set to launch a learning app, and a new device is due to reach shops on Monday."], [252.5, 257.58, "Meanwhile, a software update is likely to improve security on millions of phones."], [258.57, 262.85, "Researchers also announced a battery breakthrough that could last twice as long."], [263.87, 268.51, "For consumers, each launch brings new choices and new questions about cost."], [269.6, 273.32, "Part five: quiz. Five questions. Are you ready?"], [274.18, 276.76, "The startup blank to launch its app next month."], [277.06, 280.83, "A, is set. B, set. C, will set."], [284.37, 286.24, "The answer is A: is set."], [287.38, 290.32, "A new version of a program is a software blank."], [290.62, 294.03, "A, update. B, device. C, industry."], [297.57, 299.94, "The answer is A: update."], [301.08, 304.3, "An important discovery that solves a problem is a blank."], [304.6, 308.28, "A, launch. B, breakthrough. C, consumer."], [311.83, 313.87, "The answer is B: breakthrough."], [315.02, 316.78, "Choose the correct sentence."], [317.08, 325.0, "A, The device is due to goes on sale.. B, The device is due to go on sale.. C, The device due to go on sale.."], [328.53, 332.04, "The answer is B: The device is due to go on sale.."], [333.18, 336.15, "According to the reading, the update is likely to improve…"], [336.45, 340.39, "A, price. B, security. C, battery colour."], [343.93, 346.2, "The answer is B: security."], [347.4, 350.64, "Part six: speaking. It's your turn to talk."], [351.48, 355.07, "What recent piece of technology news have you heard about?"], [363.88, 365.66, "Now listen to Visal."], [365.96, 386.25, "I recently read that a local startup is set to launch a mobile app for farmers. The app is expected to show market prices and weather forecasts in Khmer. I think it is an exciting innovation because many farmers do not have reliable information. If it works well, it could help them earn more."], [386.56, 388.26, "Excellent answer, Visal!"], [389.15, 394.57, "Great work! Now you can use eight new words and future news with is set to and is due to."], [394.87, 398.73, "Today's value is curiosity. Ask questions and find out."], [399.02, 401.62, "See you in Unit five. Goodbye!"], [401.92, 404.51, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-NP1-Unit05-Health-News": [[0.35, 5.51, "Hello, everyone! I'm Ms. Emma. Welcome to Online Newspaper Class, level one."], [5.81, 9.16, "Hi! I'm Visal. Let's learn together!"], [9.46, 15.13, "Unit five: Health News. Today you will report what experts say with reported speech."], [15.44, 18.1, "Here is our lesson map. Let's start!"], [19.03, 22.32, "Part one: words. You will learn eight new words."], [23.18, 24.21, "Outbreak."], [25.22, 28.41, "Outbreak means a sudden increase of a disease in one place."], [29.02, 31.54, "The outbreak was controlled within two weeks."], [32.15, 34.78, "Your turn. Say: Outbreak."], [37.63, 38.54, "Outbreak."], [39.28, 40.4, "Vaccine."], [41.42, 44.74, "Vaccine means a medicine that protects people from a disease."], [45.35, 47.99, "The vaccine protects children from measles."], [48.58, 50.9, "Your turn. Say: Vaccine."], [53.73, 54.84, "Vaccine."], [55.58, 56.77, "Public health."], [57.78, 60.64, "Public health means the health of the whole community."], [61.25, 63.45, "Public health depends on clean water."], [64.05, 66.67, "Your turn. Say: Public health."], [69.53, 70.71, "Public health."], [71.45, 72.88, "Research study."], [73.88, 77.48, "Research study means a careful investigation to find out facts."], [78.08, 80.57, "A research study tested the new treatment."], [81.18, 83.94, "Your turn. Say: Research study."], [86.8, 88.28, "Research study."], [89.02, 89.73, "Treatment."], [90.72, 93.52, "Treatment means medical care given to a sick person."], [94.12, 95.81, "The treatment helped her recover."], [96.42, 98.73, "Your turn. Say: Treatment."], [101.57, 102.45, "Treatment."], [103.22, 104.19, "Hospital."], [105.18, 108.54, "Hospital means a place where sick people receive medical care."], [109.15, 111.65, "The hospital opened a new children's ward."], [112.25, 114.68, "Your turn. Say: Hospital."], [117.53, 118.49, "Hospital."], [119.25, 120.63, "Awareness campaign."], [121.65, 126.24, "Awareness campaign means an effort to make people understand a health issue."], [126.85, 129.56, "The awareness campaign explained hand washing."], [130.15, 133.45, "Your turn. Say: Awareness campaign."], [136.3, 137.89, "Awareness campaign."], [138.65, 139.67, "Guideline."], [140.68, 144.12, "Guideline means official advice about the right way to do something."], [144.72, 147.28, "The ministry published new food guidelines."], [147.88, 150.28, "Your turn. Say: Guideline."], [153.13, 154.13, "Guideline."], [154.93, 158.6, "Part two: dialogue. Let's listen to a conversation."], [159.45, 164.59, "Visal, an article says 'Doctors said the vaccine was safe.' Why was 'is' changed to 'was'?"], [165.68, 175.23, "In reported speech we usually move the tense back. The doctor's words were 'The vaccine is safe', but the reporter writes 'said it was safe'."], [176.32, 178.54, "Which verbs can I use besides 'said'?"], [179.65, 188.91, "Use 'explained', 'warned' or 'announced'. Health reporters also write 'according to' a research study, which names the source."], [190.02, 191.89, "Why does the source matter so much?"], [192.98, 200.73, "Because health news affects people's choices. A named expert or official guideline makes a claim more trustworthy."], [201.87, 203.53, "Part three: grammar."], [204.38, 207.76, "Grammar focus: Reported speech in health news."], [208.06, 209.32, "Look at the pattern."], [210.02, 212.16, "Doctors said that the vaccine was safe."], [213.05, 215.53, "The minister warned that the outbreak was spreading."], [216.42, 219.08, "The researchers explained that the treatment had worked."], [220.03, 229.29, "In reported speech the tense usually moves back: is → was, has worked → had worked. Always name the source: doctors said, according to the study."], [230.05, 233.93, "Be careful! Don't say: He said that the vaccine is safe."], [235.87, 238.55, "Say: He said that the vaccine was safe."], [238.85, 241.28, "Move the tense back in reported speech."], [242.07, 244.91, "Part four: reading. Read and listen."], [245.7, 247.41, "Health News You Can Trust."], [247.71, 251.78, "Health news can change how people live, so reporters must be careful."], [252.77, 257.81, "When an outbreak begins, the ministry warned that people should follow official guidelines."], [258.8, 263.23, "A new research study explained that the vaccine had protected thousands of children."], [264.23, 268.43, "Hospitals and awareness campaigns then share the advice with every community."], [269.43, 272.76, "Reliable treatment information always names its source."], [273.87, 277.88, "Part five: quiz. Five questions. Are you ready?"], [278.72, 281.04, "Doctors said that the vaccine blank safe."], [281.34, 284.37, "A, was. B, is being. C, were."], [287.93, 289.75, "The answer is A: was."], [290.88, 294.25, "Official advice about the right way to do something is a blank."], [294.55, 298.79, "A, guideline. B, treatment. C, outbreak."], [302.33, 304.62, "The answer is A: guideline."], [305.78, 307.96, "A sudden increase of a disease is an blank."], [308.26, 312.58, "A, awareness campaign. B, outbreak. C, hospital."], [316.13, 318.57, "The answer is B: outbreak."], [319.72, 321.87, "Choose the correct reported sentence."], [322.17, 329.15, "A, She said that the study was finished.. B, She said that the study is finish.. C, She said that the study were finished.."], [332.7, 335.69, "The answer is A: She said that the study was finished.."], [336.85, 340.8, "According to the reading, reliable treatment information names its…"], [341.1, 344.87, "A, price. B, source. C, hospital."], [348.43, 350.46, "The answer is B: source."], [351.67, 354.76, "Part six: speaking. It's your turn to talk."], [355.62, 359.28, "Why is it important to get health information from a reliable source?"], [368.08, 369.71, "Now listen to Visal."], [370.01, 394.0, "It is important because wrong health information can harm people. A reliable source, such as a doctor or a ministry guideline, is based on research and tested facts. For example, a false rumour about a vaccine may stop families from protecting their children. Therefore, I always check who wrote the information and where it came from."], [394.3, 395.86, "Excellent answer, Visal!"], [396.75, 401.41, "Great work! Now you can use eight new words and reported speech in health news."], [401.71, 406.71, "Today's value is critical thinking. Think carefully and give reasons for your opinions."], [407.01, 409.65, "See you in Unit six. Goodbye!"], [409.95, 412.99, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-NP1-Unit06-Education-News": [[0.35, 5.94, "Hello, everyone! I'm Ms. Emma. Welcome to Online Newspaper Class, level one."], [6.24, 9.58, "Hi! I'm Visal. Let's learn together!"], [9.88, 14.73, "Unit six: Education News. Today you will give updates with the present perfect."], [15.03, 17.46, "Here is our lesson map. Let's start!"], [18.4, 21.37, "Part one: words. You will learn eight new words."], [22.22, 23.1, "Curriculum."], [24.12, 27.28, "Curriculum means the subjects taught in a school or course."], [27.88, 30.6, "The new curriculum includes computer skills."], [31.22, 33.85, "Your turn. Say: Curriculum."], [36.7, 37.71, "Curriculum."], [38.45, 39.31, "Enrollment."], [40.32, 43.35, "Enrollment means the number of students who join a school."], [43.95, 46.39, "Enrollment rose by ten percent this year."], [46.98, 49.28, "Your turn. Say: Enrollment."], [52.13, 53.17, "Enrollment."], [53.92, 55.09, "Scholarship."], [56.08, 59.64, "Scholarship means money given to a student to pay for study."], [60.25, 62.33, "She won a scholarship to university."], [62.92, 65.26, "Your turn. Say: Scholarship."], [68.1, 69.38, "Scholarship."], [70.12, 71.31, "Graduation."], [72.32, 75.98, "Graduation means the ceremony when a student completes a course."], [76.58, 78.48, "Parents cheered at the graduation."], [79.08, 81.97, "Your turn. Say: Graduation."], [84.83, 86.06, "Graduation."], [86.82, 88.03, "Policy reform."], [89.02, 92.47, "Policy reform means an official change to make a system better."], [93.08, 95.95, "The policy reform gave schools more teachers."], [96.55, 99.59, "Your turn. Say: Policy reform."], [102.43, 103.84, "Policy reform."], [104.58, 105.88, "Literacy rate."], [106.88, 110.47, "Literacy rate means the percentage of people who can read and write."], [111.08, 113.36, "The literacy rate has risen steadily."], [113.95, 116.61, "Your turn. Say: Literacy rate."], [119.47, 120.87, "Literacy rate."], [121.62, 122.45, "Funding."], [123.45, 126.49, "Funding means money provided for a particular purpose."], [127.08, 130.23, "Extra funding built twelve new classrooms."], [130.82, 133.11, "Your turn. Say: Funding."], [135.97, 136.91, "Funding."], [137.65, 138.64, "Access."], [139.65, 142.66, "Access means the ability to reach or use something."], [143.25, 145.89, "Rural children need better access to schools."], [146.48, 149.14, "Your turn. Say: Access."], [152.0, 152.97, "Access."], [153.77, 157.24, "Part two: dialogue. Let's listen to a conversation."], [158.08, 162.53, "Visal, an article says 'Enrollment has risen this year.' Why not 'rose'?"], [163.65, 172.69, "The present perfect links a past change to now. Education news often reports progress that continues to affect schools today."], [173.78, 175.53, "So it is good for updates?"], [176.62, 188.02, "Yes. 'The government has announced a policy reform' is new information, and 'has introduced', 'has increased' and 'has not yet' are common patterns."], [189.12, 191.21, "When do I switch to the past simple?"], [192.32, 202.62, "When you give a finished time or detail: 'It announced the reform on Monday.' The first sentence is news; the second adds the facts."], [203.77, 205.49, "Part three: grammar."], [206.35, 209.94, "Grammar focus: Present perfect for news updates."], [210.24, 211.45, "Look at the pattern."], [212.15, 214.64, "Enrollment has risen by ten percent this year."], [215.55, 218.5, "The government has announced a major policy reform."], [219.42, 221.88, "Many schools have received extra funding."], [222.83, 230.94, "Use the present perfect for recent news and changes that still matter. Do not add a finished time: say 'has announced', not 'has announced yesterday'."], [231.68, 235.45, "Be careful! Don't say: Enrollment has risen last year."], [237.4, 239.54, "Say: Enrollment rose last year."], [239.84, 242.57, "Do not use the present perfect with 'last year'."], [243.37, 246.34, "Part four: reading. Read and listen."], [247.13, 248.48, "Schools in the News."], [248.78, 252.53, "Education news tracks how well a country prepares its young people."], [253.53, 258.85, "This year enrollment has risen, and many students have received a scholarship for further study."], [259.87, 263.92, "The government has also introduced a policy reform to update the curriculum."], [264.93, 269.71, "Extra funding has helped rural schools, so access to education is slowly improving."], [270.7, 273.79, "As a result, the literacy rate has continued to grow."], [274.9, 278.86, "Part five: quiz. Five questions. Are you ready?"], [279.72, 282.18, "Enrollment blank by ten percent this year."], [282.48, 286.18, "A, has risen. B, rised. C, have rose."], [289.73, 291.44, "The answer is A: has risen."], [292.58, 295.71, "Money given to a student to pay for study is a blank."], [296.01, 300.49, "A, curriculum. B, scholarship. C, funding rate."], [304.03, 306.1, "The answer is B: scholarship."], [307.25, 310.25, "The percentage of people who can read and write is the blank."], [310.55, 314.4, "A, literacy rate. B, enrollment. C, graduation."], [317.93, 320.07, "The answer is A: literacy rate."], [321.22, 322.85, "Choose the correct sentence."], [323.14, 330.28, "A, The government has announced it yesterday.. B, The government has announced a reform.. C, The government have announce a reform.."], [333.83, 336.96, "The answer is B: The government has announced a reform.."], [338.12, 341.07, "According to the reading, extra funding has helped…"], [341.37, 345.85, "A, city schools. B, rural schools. C, private schools."], [349.4, 351.74, "The answer is B: rural schools."], [352.93, 356.05, "Part six: speaking. It's your turn to talk."], [356.92, 359.93, "What education news story would you like to read more about?"], [368.72, 370.43, "Now listen to Visal."], [370.73, 390.58, "I would like to read more about scholarships for students in rural areas. Many talented young people cannot continue their studies because their families lack money. News about funding and access could show which programmes are working. It could also encourage more organisations to help."], [390.88, 392.64, "Excellent answer, Visal!"], [393.55, 398.4, "Great work! Now you can use eight new words and present perfect for news updates."], [398.7, 404.17, "Today's value is educational equity. Every learner deserves a fair chance to succeed."], [404.47, 407.01, "See you in Unit seven. Goodbye!"], [407.31, 409.87, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-NP1-Unit07-Crime-Safety-News": [[0.35, 5.56, "Hello, everyone! I'm Ms. Emma. Welcome to Online Newspaper Class, level one."], [5.86, 9.21, "Hi! I'm Visal. Let's learn together!"], [9.51, 15.89, "Unit seven: Crime & Safety News. Today you will report carefully with passive forms and 'allegedly'."], [16.19, 18.73, "Here is our lesson map. Let's start!"], [19.67, 22.89, "Part one: words. You will learn eight new words."], [23.75, 25.1, "Investigation."], [26.08, 29.55, "Investigation means a careful search for facts about an event."], [30.15, 32.46, "The police opened an investigation."], [33.05, 35.91, "Your turn. Say: Investigation."], [38.77, 40.12, "Investigation."], [40.85, 41.84, "Suspect."], [42.85, 45.96, "Suspect means a person thought to have committed a crime."], [46.55, 49.2, "The suspect was questioned for two hours."], [49.78, 52.6, "Your turn. Say: Suspect."], [55.43, 56.42, "Suspect."], [57.18, 58.05, "Arrest."], [59.05, 62.83, "Arrest means the act of taking someone to be questioned by police."], [63.42, 65.24, "The arrest took place at dawn."], [65.85, 68.57, "Your turn. Say: Arrest."], [71.43, 72.54, "Arrest."], [73.28, 74.11, "Verdict."], [75.12, 78.25, "Verdict means the decision of a court at the end of a trial."], [78.85, 81.03, "The verdict was announced on Friday."], [81.65, 84.36, "Your turn. Say: Verdict."], [87.2, 87.95, "Verdict."], [88.68, 89.95, "Law enforcement."], [90.95, 95.16, "Law enforcement means the police and others who make sure laws are obeyed."], [95.75, 98.23, "Law enforcement agencies worked together."], [98.82, 102.05, "Your turn. Say: Law enforcement."], [104.9, 106.42, "Law enforcement."], [107.18, 108.27, "Evidence."], [109.25, 112.55, "Evidence means facts or objects that help prove something."], [113.15, 115.03, "The evidence was shown to the judge."], [115.65, 117.95, "Your turn. Say: Evidence."], [120.8, 121.86, "Evidence."], [122.62, 123.9, "Public safety."], [124.88, 128.4, "Public safety means the protection of people from danger and crime."], [129.02, 131.59, "Public safety is the police's first duty."], [132.18, 135.23, "Your turn. Say: Public safety."], [138.07, 139.15, "Public safety."], [139.88, 140.98, "Court case."], [141.98, 144.98, "Court case means a legal matter decided by a judge."], [145.58, 147.69, "The court case lasted three weeks."], [148.28, 151.06, "Your turn. Say: Court case."], [153.9, 155.11, "Court case."], [155.9, 159.77, "Part two: dialogue. Let's listen to a conversation."], [160.62, 166.91, "Visal, the report says a man 'was arrested' and 'is accused of theft'. Why not just 'he stole'?"], [168.02, 177.38, "Until a court gives a verdict, he is only a suspect. Reporters use the passive and words like 'accused' and 'allegedly' to stay fair."], [178.48, 180.34, "So the police are not named?"], [181.45, 191.37, "Often they are: 'Law enforcement officers were called to the scene.' The passive keeps the focus on the person arrested and the facts."], [192.48, 194.31, "Is this a rule of journalism?"], [195.42, 201.73, "Yes. Ethical reporters wait for evidence and a verdict before they call anyone guilty."], [202.87, 204.52, "Part three: grammar."], [205.38, 208.66, "Grammar focus: Passive and careful reporting words."], [208.96, 210.13, "Look at the pattern."], [210.85, 213.86, "A man was arrested after a police investigation."], [214.75, 217.67, "The suspect is accused of stealing three motorbikes."], [218.58, 220.69, "The evidence was presented to the court."], [221.63, 228.58, "Before a verdict, write 'is accused of', 'is alleged to have' or 'allegedly'. Never call a suspect guilty in a news report."], [229.32, 233.08, "Be careful! Don't say: The suspect is guilty of theft."], [235.03, 238.0, "Say: The suspect is accused of theft."], [238.3, 240.41, "Before a verdict, write 'accused'."], [241.2, 243.93, "Part four: reading. Read and listen."], [244.73, 246.05, "Fair Crime Reporting."], [246.35, 250.12, "Crime news must inform the public without hurting an innocent person."], [251.13, 255.86, "After an investigation, a suspect was arrested and is accused of theft."], [256.87, 262.33, "Law enforcement officers collected evidence, which will be presented in a court case next month."], [263.33, 268.17, "Until the verdict, reporters say 'allegedly' because the suspect is still presumed innocent."], [269.17, 272.69, "Careful wording protects both public safety and fairness."], [273.8, 277.65, "Part five: quiz. Five questions. Are you ready?"], [278.52, 281.57, "A man blank arrested after a police investigation."], [281.87, 284.84, "A, was. B, did. C, has."], [288.4, 290.03, "The answer is A: was."], [291.18, 294.67, "A decision of a court at the end of a trial is a blank."], [294.97, 298.68, "A, suspect. B, verdict. C, investigation."], [302.23, 304.39, "The answer is B: verdict."], [305.55, 308.33, "Facts or objects that help prove something are blank."], [308.63, 312.11, "A, evidence. B, funding. C, a headline."], [315.67, 317.55, "The answer is A: evidence."], [318.72, 322.96, "Before a verdict, a careful reporter writes that the suspect is blank of theft."], [323.26, 326.62, "A, guilty. B, accused. C, convicted."], [330.17, 332.18, "The answer is B: accused."], [333.32, 336.31, "According to the reading, careful wording protects…"], [336.62, 342.29, "A, only the police. B, public safety and fairness. C, newspaper sales."], [345.83, 349.24, "The answer is B: public safety and fairness."], [350.43, 353.45, "Part six: speaking. It's your turn to talk."], [354.28, 358.79, "Why must crime reporters be careful about how they describe a suspect before a trial?"], [367.58, 369.13, "Now listen to Visal."], [369.43, 394.02, "Crime reporters must be careful because a suspect is still innocent until a court decides otherwise. If a newspaper calls someone guilty too early, it may destroy that person's reputation, even if the evidence later proves them innocent. Therefore, reporters use words such as 'accused' and 'allegedly'. This protects fairness and public trust in the news."], [394.32, 396.07, "Excellent answer, Visal!"], [396.98, 401.97, "Great work! Now you can use eight new words and passive and careful reporting words."], [402.27, 406.37, "Today's value is justice. Stand up for what is fair for everyone."], [406.67, 408.83, "See you in Unit eight. Goodbye!"], [409.13, 412.06, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-NP1-Unit08-Business-News-Basics": [[0.35, 5.56, "Hello, everyone! I'm Ms. Emma. Welcome to Online Newspaper Class, level one."], [5.86, 9.13, "Hi! I'm Visal. Let's learn together!"], [9.43, 16.39, "Unit eight: Business News Basics. Today you will describe trends with rose by, fell to and increased from."], [16.69, 19.5, "Here is our lesson map. Let's start!"], [20.47, 23.73, "Part one: words. You will learn eight new words."], [24.58, 25.86, "Earnings report."], [26.85, 30.61, "Earnings report means a company's official statement of the money it made."], [31.22, 33.82, "The earnings report surprised investors."], [34.42, 37.34, "Your turn. Say: Earnings report."], [40.2, 41.52, "Earnings report."], [42.25, 43.69, "Quarterly results."], [44.68, 48.63, "Quarterly results means financial results published every three months."], [49.25, 51.85, "Quarterly results showed strong growth."], [52.45, 55.3, "Your turn. Say: Quarterly results."], [58.13, 59.47, "Quarterly results."], [60.22, 61.23, "Shareholder."], [62.22, 65.02, "Shareholder means a person who owns part of a company."], [65.62, 67.86, "Every shareholder received a dividend."], [68.45, 71.62, "Your turn. Say: Shareholder."], [74.47, 75.46, "Shareholder."], [76.22, 77.1, "Merger."], [78.12, 81.31, "Merger means the joining of two companies into one."], [81.92, 84.03, "The merger created a larger bank."], [84.62, 86.91, "Your turn. Say: Merger."], [89.77, 90.73, "Merger."], [91.48, 92.8, "Profit margin."], [93.78, 97.91, "Profit margin means the percentage of sales left after costs are paid."], [98.52, 101.13, "A higher profit margin means better earnings."], [101.72, 104.52, "Your turn. Say: Profit margin."], [107.37, 108.47, "Profit margin."], [109.22, 110.04, "Revenue."], [111.05, 114.79, "Revenue means the total money a company receives from sales."], [115.38, 117.77, "Revenue grew as more customers arrived."], [118.35, 120.82, "Your turn. Say: Revenue."], [123.67, 124.5, "Revenue."], [125.25, 126.45, "CEO statement."], [127.45, 130.63, "CEO statement means an official message from the head of a company."], [131.25, 133.68, "The CEO statement promised new investment."], [134.28, 137.98, "Your turn. Say: CEO statement."], [140.83, 142.08, "CEO statement."], [142.82, 144.19, "Market reaction."], [145.18, 149.15, "Market reaction means how investors and prices respond to news."], [149.75, 151.74, "The market reaction was calm."], [152.35, 155.01, "Your turn. Say: Market reaction."], [157.87, 159.39, "Market reaction."], [160.2, 163.89, "Part two: dialogue. Let's listen to a conversation."], [164.75, 170.88, "Visal, this report says 'Revenue rose by eight percent to two billion dollars.' Why two different prepositions?"], [171.98, 180.8, "'By' shows the size of the change and 'to' shows the new level. 'Profit fell from ten to eight million' gives the old and new figures."], [181.92, 183.59, "What other verbs can I use?"], [184.68, 194.67, "Rose, increased, grew, fell, dropped and declined. Business headlines also say 'Shares slump' or 'Profits jump' to attract attention."], [195.78, 197.19, "And the market reaction?"], [198.28, 205.59, "Reporters add it after the numbers: 'Shareholders welcomed the merger, and the share price climbed.'"], [206.73, 208.41, "Part three: grammar."], [209.25, 213.25, "Grammar focus: Trend language: rose by and fell to."], [213.55, 214.79, "Look at the pattern."], [215.48, 217.49, "Revenue rose by eight percent."], [218.38, 220.53, "Profit fell to eight million dollars."], [221.45, 224.27, "Sales increased from two million to three million."], [225.23, 234.28, "Use 'by' for the size of a change, 'to' for the new level, and 'from' for the old level: rose by 8%, fell to $8 million, increased from 2 to 3."], [235.02, 238.5, "Be careful! Don't say: Sales rose to five percent."], [240.47, 243.06, "Say: Sales rose by five percent."], [243.36, 245.39, "Use 'by' for the size of the change."], [246.2, 248.85, "Part four: reading. Read and listen."], [249.67, 251.05, "Company Results."], [251.35, 254.73, "Business news reports a company's results in clear numbers."], [255.73, 260.86, "In its quarterly results, the company said revenue rose by eight percent to two billion dollars."], [261.87, 267.19, "The profit margin fell slightly, but the CEO statement promised lower costs next year."], [268.2, 273.47, "A planned merger also pleased every shareholder, and the market reaction was positive."], [274.47, 278.08, "Readers should compare the numbers before they judge the earnings report."], [279.17, 283.56, "Part five: quiz. Five questions. Are you ready?"], [284.42, 286.54, "Revenue rose blank eight percent."], [286.84, 289.52, "A, by. B, of. C, at."], [293.07, 294.86, "The answer is A: by."], [296.02, 298.27, "The joining of two companies is a blank."], [298.57, 301.74, "A, merger. B, margin. C, verdict."], [305.3, 307.1, "The answer is A: merger."], [308.25, 310.95, "A person who owns part of a company is a blank."], [311.25, 315.55, "A, reporter. B, shareholder. C, consumer."], [319.1, 321.98, "The answer is B: shareholder."], [323.12, 325.48, "Profit fell blank eight million dollars."], [325.78, 328.65, "A, to. B, by of. C, in."], [332.2, 334.33, "The answer is A: to."], [335.48, 338.8, "According to the reading, the market reaction to the merger was…"], [339.1, 342.52, "A, positive. B, angry. C, unknown."], [346.07, 348.38, "The answer is A: positive."], [349.57, 352.3, "Part six: speaking. It's your turn to talk."], [353.15, 356.97, "What kind of business news would affect your decision to buy a company's stock?"], [365.78, 367.89, "Now listen to Visal."], [368.19, 386.56, "News about a company's earnings would affect my decision most. If revenue and profit margin rise steadily, I would feel more confident. A merger or a strong CEO statement could also matter, although I would check the facts first. I would never decide from one headline alone."], [386.87, 388.69, "Excellent answer, Visal!"], [389.58, 395.27, "Great work! Now you can use eight new words and trend language: rose by and fell to."], [395.57, 401.16, "Today's value is financial literacy. Understand money well enough to make wise decisions."], [401.46, 403.73, "See you in Unit nine. Goodbye!"], [404.02, 406.44, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-NP1-Unit09-Entertainment-News": [[0.35, 5.86, "Hello, everyone! I'm Ms. Emma. Welcome to Online Newspaper Class, level one."], [6.16, 9.55, "Hi! I'm Visal. Let's learn together!"], [9.85, 16.4, "Unit nine: Entertainment News. Today you will describe people and things with relative clauses (who, which)."], [16.7, 19.21, "Here is our lesson map. Let's start!"], [20.17, 23.53, "Part one: words. You will learn eight new words."], [24.38, 25.52, "Box office."], [26.52, 30.57, "Box office means the total money a film earns from ticket sales."], [31.18, 33.62, "The film topped the box office this weekend."], [34.22, 36.75, "Your turn. Say: Box office."], [39.6, 40.91, "Box office."], [41.65, 42.38, "Premiere."], [43.38, 46.45, "Premiere means the first public showing of a film or show."], [47.05, 49.17, "The premiere took place in Phnom Penh."], [49.75, 52.26, "Your turn. Say: Premiere."], [55.1, 55.87, "Premiere."], [56.62, 57.73, "Celebrity."], [58.75, 60.9, "Celebrity means a famous person."], [61.52, 63.47, "The celebrity waved to the crowd."], [64.08, 66.75, "Your turn. Say: Celebrity."], [69.6, 70.58, "Celebrity."], [71.32, 72.49, "Award season."], [73.48, 77.44, "Award season means the time of year when film and music prizes are given."], [78.05, 80.48, "Award season brings many new dramas."], [81.08, 83.67, "Your turn. Say: Award season."], [86.5, 87.63, "Award season."], [88.38, 89.45, "Critic review."], [90.45, 94.11, "Critic review means an expert's written opinion about a film or show."], [94.72, 96.69, "A critic review praised the acting."], [97.28, 100.26, "Your turn. Say: Critic review."], [103.1, 104.25, "Critic review."], [105.02, 106.52, "Streaming release."], [107.52, 111.14, "Streaming release means the day a film becomes available online."], [111.75, 114.17, "The streaming release reached many viewers."], [114.78, 117.5, "Your turn. Say: Streaming release."], [120.37, 121.83, "Streaming release."], [122.58, 124.48, "Fan reaction."], [125.48, 129.04, "Fan reaction means how a film's admirers respond to it."], [129.65, 131.66, "Fan reaction was loud and joyful."], [132.25, 135.17, "Your turn. Say: Fan reaction."], [138.03, 139.95, "Fan reaction."], [140.72, 141.68, "Publicity."], [142.68, 146.47, "Publicity means attention given to someone or something by the media."], [147.08, 149.21, "Good publicity helps a new film."], [149.82, 153.15, "Your turn. Say: Publicity."], [156.0, 157.05, "Publicity."], [157.83, 161.17, "Part two: dialogue. Let's listen to a conversation."], [162.02, 168.4, "Visal, this article says 'The film, which opened on Friday, topped the box office.' Why the commas?"], [169.48, 178.5, "That is a non-defining relative clause. It adds extra information, so we use commas and 'which' for things or 'who' for people."], [179.58, 181.01, "And without commas?"], [182.12, 189.24, "'The actor who plays the king won an award' is defining. The clause tells us which actor, so we cannot remove it."], [190.35, 192.77, "Entertainment news uses a lot of these, right?"], [193.88, 203.09, "Yes. They pack detail into one sentence: the celebrity who attended the premiere, the review which praised the music."], [204.23, 206.12, "Part three: grammar."], [206.98, 210.24, "Grammar focus: Relative clauses with who and which."], [210.54, 211.74, "Look at the pattern."], [212.45, 215.69, "The film, which opened on Friday, topped the box office."], [216.58, 219.02, "The actor who plays the king won an award."], [219.92, 223.05, "A critic review that praised the music pleased the fans."], [224.0, 231.95, "Use who for people and which for things. Add commas around non-defining clauses (extra information), but not around defining clauses."], [232.68, 236.68, "Be careful! Don't say: The film who opened Friday won."], [238.63, 241.16, "Say: The film which opened Friday won."], [241.46, 243.76, "Use which for things and who for people."], [244.57, 247.08, "Part four: reading. Read and listen."], [247.87, 249.37, "Night at the Premiere."], [249.67, 253.54, "Crowds gathered at the premiere of a film which has already won praise."], [254.53, 259.54, "The celebrity who directed it greeted fans, and publicity teams handed out posters."], [260.53, 264.41, "A critic review published that morning described the story as brave and moving."], [265.4, 270.49, "Early box office figures suggest that the film, which cost little to make, will earn much more."], [271.5, 275.83, "Fan reaction on the streaming release day will decide how long it stays popular."], [276.93, 281.26, "Part five: quiz. Five questions. Are you ready?"], [282.12, 284.71, "The actor blank plays the king won an award."], [285.01, 288.36, "A, who. B, which. C, whose is."], [291.9, 293.89, "The answer is A: who."], [295.05, 297.67, "The first public showing of a film is a blank."], [297.97, 301.58, "A, premiere. B, release. C, publicity."], [305.13, 306.84, "The answer is A: premiere."], [307.98, 311.07, "An expert's written opinion about a film is a blank."], [311.37, 315.9, "A, fan reaction. B, critic review. C, box office."], [319.43, 321.97, "The answer is B: critic review."], [323.12, 324.84, "Choose the correct sentence."], [325.14, 332.09, "A, The film who opened Friday won.. B, The film which opened on Friday won.. C, The film what opened Friday won.."], [335.63, 339.01, "The answer is B: The film which opened on Friday won.."], [340.15, 343.0, "According to the reading, the film cost…"], [343.3, 346.78, "A, a lot. B, little to make. C, nothing."], [350.33, 352.44, "The answer is B: little to make."], [353.63, 356.83, "Part six: speaking. It's your turn to talk."], [357.68, 361.23, "How much should a critic's review influence whether you watch a new film?"], [370.02, 371.56, "Now listen to Visal."], [371.86, 391.45, "A critic's review can help, but it should not decide everything. Critics often notice acting and story quality, which saves me from wasting time. However, their taste may differ from mine, so I also check fan reaction and the trailer. In the end, I trust my own interests most."], [391.75, 393.5, "Excellent answer, Visal!"], [394.42, 399.14, "Great work! Now you can use eight new words and relative clauses with who and which."], [399.44, 404.78, "Today's value is media literacy. Ask who made the message, and why, before you believe it."], [405.08, 407.45, "See you in Unit ten. Goodbye!"], [407.75, 411.17, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-NP1-Unit10-Science-News": [[0.35, 5.66, "Hello, everyone! I'm Ms. Emma. Welcome to Online Newspaper Class, level one."], [5.96, 9.59, "Hi! I'm Visal. Let's learn together!"], [9.89, 15.88, "Unit ten: Science News. Today you will use hedging language: may, could, suggests."], [16.18, 18.74, "Here is our lesson map. Let's start!"], [19.7, 22.75, "Part one: words. You will learn eight new words."], [23.58, 24.62, "Discovery."], [25.62, 28.34, "Discovery means something found for the first time."], [28.95, 31.09, "The discovery changed medicine."], [31.68, 34.48, "Your turn. Say: Discovery."], [37.33, 38.47, "Discovery."], [39.22, 40.53, "Peer-reviewed study."], [41.52, 46.12, "Peer-reviewed study means research checked by other experts before publication."], [46.72, 49.08, "A peer-reviewed study is more reliable."], [49.68, 53.02, "Your turn. Say: Peer-reviewed study."], [55.87, 57.24, "Peer-reviewed study."], [57.98, 59.18, "Research team."], [60.18, 63.84, "Research team means a group of scientists working on one project."], [64.45, 67.25, "The research team studied coral reefs."], [67.85, 70.92, "Your turn. Say: Research team."], [73.77, 74.97, "Research team."], [75.72, 76.61, "Breakthrough."], [77.62, 80.56, "Breakthrough means an important new discovery or method."], [81.15, 83.24, "The breakthrough could save many lives."], [83.85, 86.32, "Your turn. Say: Breakthrough."], [89.17, 90.27, "Breakthrough."], [91.02, 92.15, "Clinical trial."], [93.15, 96.65, "Clinical trial means a test of a medicine on volunteers."], [97.25, 99.61, "The clinical trial lasted two years."], [100.22, 102.83, "Your turn. Say: Clinical trial."], [105.7, 107.0, "Clinical trial."], [107.75, 108.76, "Data set."], [109.75, 113.35, "Data set means a collection of facts or numbers used in research."], [113.95, 116.88, "The data set included ten thousand patients."], [117.48, 119.97, "Your turn. Say: Data set."], [122.83, 123.88, "Data set."], [124.62, 126.33, "Scientific consensus."], [127.32, 131.05, "Scientific consensus means agreement among most experts."], [131.65, 134.53, "There is a scientific consensus on climate change."], [135.12, 138.66, "Your turn. Say: Scientific consensus."], [141.5, 143.55, "Scientific consensus."], [144.28, 145.38, "Publication."], [146.38, 149.37, "Publication means the printing of a study in a journal."], [149.98, 152.53, "Publication usually follows careful review."], [153.12, 155.72, "Your turn. Say: Publication."], [158.57, 159.72, "Publication."], [160.53, 163.94, "Part two: dialogue. Let's listen to a conversation."], [164.78, 171.77, "Visal, one headline says 'Coffee cures cancer'. Another says 'Coffee may reduce cancer risk'. Which is better?"], [172.88, 182.55, "The second. Scientists use hedging words such as may, could, might and suggests because one study rarely proves anything."], [183.65, 185.68, "So reporters should copy the hedging?"], [186.78, 195.75, "Yes. 'The study suggests a link' is accurate. 'The study proves' is usually not, unless there is a scientific consensus."], [196.85, 198.42, "What makes a study strong?"], [199.52, 207.7, "A large data set, a clinical trial, peer review before publication, and results repeated by another research team."], [208.87, 210.58, "Part three: grammar."], [211.42, 215.03, "Grammar focus: Hedging with may and could and suggests."], [215.33, 216.71, "Look at the pattern."], [217.42, 220.01, "The new drug may reduce the risk of infection."], [220.92, 223.8, "The study suggests a link between sleep and memory."], [224.68, 227.14, "This discovery could lead to a breakthrough."], [228.1, 234.77, "Hedge new findings with may, could, suggests or appears to. Save 'proves' for results confirmed by many studies."], [235.52, 239.24, "Be careful! Don't say: The study proves a link, maybe."], [241.2, 243.7, "Say: The study suggests a link."], [244.0, 247.45, "Use hedging words, not 'proves', for new findings."], [248.23, 251.18, "Part four: reading. Read and listen."], [251.97, 253.87, "Reporting Science Carefully."], [254.17, 258.31, "A new discovery is exciting, but a good science reporter stays careful."], [259.3, 264.17, "A peer-reviewed study from one research team suggests that a plant extract may protect the heart."], [265.17, 270.24, "The clinical trial used a large data set, yet the authors say more tests are needed."], [271.23, 277.45, "Because publication of one result is not scientific consensus, the headline says 'could' instead of 'will'."], [278.43, 280.95, "Careful words help readers trust science."], [282.07, 286.16, "Part five: quiz. Five questions. Are you ready?"], [287.02, 289.91, "The study blank a link between sleep and
