 memory."], [290.21, 294.25, "A, suggests. B, proving. C, is prove."], [297.8, 299.72, "The answer is A: suggests."], [300.88, 304.21, "Agreement among most experts is a scientific blank."], [304.51, 308.32, "A, consensus. B, data set. C, premiere."], [311.87, 314.45, "The answer is A: consensus."], [315.58, 318.49, "A test of a medicine on volunteers is a blank."], [318.79, 323.01, "A, clinical trial. B, publication. C, headline."], [326.57, 328.89, "The answer is A: clinical trial."], [330.05, 331.71, "Choose the most careful headline."], [332.01, 337.49, "A, Tea cures flu. B, Tea may help fight flu. C, Tea will stop flu."], [341.03, 344.3, "The answer is B: Tea may help fight flu."], [345.45, 348.48, "According to the reading, the authors say more blank are needed."], [348.78, 352.99, "A, tests. B, reporters. C, headlines."], [356.53, 358.6, "The answer is A: tests."], [359.8, 362.73, "Part six: speaking. It's your turn to talk."], [363.58, 367.82, "Why should a single new study be reported carefully rather than as final proof?"], [376.62, 378.23, "Now listen to Visal."], [378.53, 402.74, "A single study can be wrong or limited. It may use a small group, or the result may not be repeated by other scientists. If a newspaper calls it final proof, readers may change their health choices too early. Therefore, reporters should say that the study suggests something and explain that more research is needed."], [403.04, 405.01, "Excellent answer, Visal!"], [405.92, 410.58, "Great work! Now you can use eight new words and hedging with may and could and suggests."], [410.88, 416.55, "Today's value is scientific literacy. Understand how evidence and testing build knowledge."], [416.85, 419.57, "See you in Unit eleven. Goodbye!"], [419.87, 422.63, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-NP1-Unit11-Travel-Tourism-News": [[0.35, 5.55, "Hello, everyone! I'm Ms. Emma. Welcome to Online Newspaper Class, level one."], [5.85, 9.0, "Hi! I'm Visal. Let's learn together!"], [9.3, 16.11, "Unit eleven: Travel & Tourism News. Today you will give advice and warnings with first conditional and should / must."], [16.41, 19.03, "Here is our lesson map. Let's start!"], [19.97, 23.48, "Part one: words. You will learn eight new words."], [24.32, 25.39, "Destination."], [26.38, 28.88, "Destination means a place people travel to."], [29.48, 31.58, "Angkor is a popular destination."], [32.18, 34.89, "Your turn. Say: Destination."], [37.73, 38.95, "Destination."], [39.72, 40.96, "Travel advisory."], [41.95, 45.94, "Travel advisory means an official warning about travelling to a place."], [46.55, 49.12, "A travel advisory warned of heavy storms."], [49.72, 53.04, "Your turn. Say: Travel advisory."], [55.9, 57.46, "Travel advisory."], [58.22, 59.54, "Tourism industry."], [60.55, 64.23, "Tourism industry means all the businesses that serve travellers."], [64.82, 67.57, "The tourism industry creates many jobs."], [68.18, 70.93, "Your turn. Say: Tourism industry."], [73.77, 75.03, "Tourism industry."], [75.78, 77.08, "Visa requirement."], [78.08, 82.13, "Visa requirement means a rule about the permission needed to enter a country."], [82.72, 85.2, "A new visa requirement began in March."], [85.82, 88.76, "Your turn. Say: Visa requirement."], [91.6, 92.86, "Visa requirement."], [93.62, 94.62, "Peak season."], [95.62, 98.96, "Peak season means the busiest time of year for tourists."], [99.55, 102.0, "Hotels are expensive in peak season."], [102.62, 105.51, "Your turn. Say: Peak season."], [108.37, 109.45, "Peak season."], [110.18, 111.45, "Local economy."], [112.45, 115.73, "Local economy means the money system of a town or region."], [116.32, 118.88, "Tourists help the local economy."], [119.48, 122.16, "Your turn. Say: Local economy."], [125.0, 126.26, "Local economy."], [127.02, 128.59, "Sustainable tourism."], [129.58, 133.82, "Sustainable tourism means travel that does not harm nature or culture."], [134.42, 137.48, "Sustainable tourism protects forests and villages."], [138.08, 141.11, "Your turn. Say: Sustainable tourism."], [143.97, 145.51, "Sustainable tourism."], [146.25, 147.55, "Cultural heritage."], [148.55, 152.84, "Cultural heritage means traditions and historic places passed down over time."], [153.45, 155.9, "Cultural heritage attracts many visitors."], [156.52, 159.44, "Your turn. Say: Cultural heritage."], [162.3, 163.63, "Cultural heritage."], [164.43, 167.92, "Part two: dialogue. Let's listen to a conversation."], [168.78, 175.43, "Visal, the news says 'If tourists ignore the travel advisory, they could face delays.' Which tense is that?"], [176.52, 186.02, "It is the first conditional: if plus present simple, then will or could plus a base verb. It describes a real possibility."], [187.12, 188.65, "And the advice words?"], [189.75, 197.91, "Should gives advice: visitors should check the visa requirement. Must gives a rule: tourists must respect the temple."], [199.02, 201.64, "Why do travel articles use them so much?"], [202.75, 208.87, "Because they help readers prepare, and they protect both travellers and cultural heritage."], [210.03, 211.56, "Part three: grammar."], [212.42, 215.95, "Grammar focus: First conditional with should and must."], [216.25, 217.41, "Look at the pattern."], [218.12, 221.58, "If tourists ignore the advisory, they could face long delays."], [222.48, 224.81, "Visitors should check the visa requirement."], [225.72, 228.09, "Tourists must respect the temple rules."], [229.03, 235.99, "If + present simple gives a real possibility. Do not use 'will' in the if-clause: say 'If it rains, flights will stop'."], [236.75, 240.18, "Be careful! Don't say: If it will rain, flights stop."], [242.13, 244.86, "Say: If it rains, flights will stop."], [245.16, 246.64, "No 'will' in the if-clause."], [247.43, 250.63, "Part four: reading. Read and listen."], [251.43, 252.47, "Travel Smart."], [252.77, 256.68, "Tourism news helps travellers choose a destination and prepare for it."], [257.7, 262.25, "If visitors arrive in peak season, they will pay more, so they should book early."], [263.27, 268.95, "A travel advisory or visa requirement can change quickly, and tourists must check it before they fly."], [269.93, 275.44, "Sustainable tourism supports the local economy if travellers choose small, local businesses."], [276.43, 280.37, "Respect for cultural heritage keeps a place beautiful for the future."], [281.47, 285.35, "Part five: quiz. Five questions. Are you ready?"], [286.22, 289.81, "If tourists ignore the advisory, they blank face delays."], [290.11, 293.38, "A, could. B, would to. C, are."], [296.93, 299.08, "The answer is A: could."], [300.25, 303.54, "The busiest time of year for tourists is the blank season."], [303.84, 306.99, "A, peak. B, visa. C, quiet."], [310.53, 312.14, "The answer is A: peak."], [313.28, 316.6, "Travel that does not harm nature or culture is blank tourism."], [316.89, 320.54, "A, sustainable. B, local. C, advisory."], [324.1, 326.46, "The answer is A: sustainable."], [327.62, 329.25, "Choose the correct sentence."], [329.55, 335.79, "A, If it will rain, we stay home.. B, If it rains, we will stay home.. C, If it rain, we stay home.."], [339.33, 342.28, "The answer is B: If it rains, we will stay home.."], [343.45, 346.63, "According to the reading, visitors should book early in…"], [346.93, 350.88, "A, peak season. B, a storm. C, winter only."], [354.43, 356.76, "The answer is A: peak season."], [357.97, 361.2, "Part six: speaking. It's your turn to talk."], [362.05, 366.99, "What responsibility do tourists have when visiting a place with fragile cultural heritage?"], [375.78, 377.16, "Now listen to Visal."], [377.46, 398.86, "Tourists have a duty to protect it. They should follow the rules, avoid touching old walls or statues, and stay on the marked paths. If visitors behave carelessly, the heritage may be damaged forever. They should also support local guides, because that helps the community look after its history."], [399.16, 400.99, "Excellent answer, Visal!"], [401.88, 406.67, "Great work! Now you can use eight new words and first conditional with should and must."], [406.97, 412.27, "Today's value is cultural respect. Learn from other cultures, and give credit to their people."], [412.57, 415.27, "See you in Unit twelve. Goodbye!"], [415.57, 418.25, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-NP1-Unit12-Consumer-Product-News": [[0.35, 5.73, "Hello, everyone! I'm Ms. Emma. Welcome to Online Newspaper Class, level one."], [6.03, 9.81, "Hi! I'm Visal. Let's learn together!"], [10.11, 16.68, "Unit twelve: Consumer & Product News. Today you will explain steps with sequence words and imperatives."], [16.98, 19.55, "Here is our lesson map. Let's start!"], [20.5, 23.65, "Part one: words. You will learn eight new words."], [24.52, 25.7, "Product recall."], [26.72, 30.81, "Product recall means an order to return a product because it may be unsafe."], [31.42, 34.08, "A product recall removed the toy from shops."], [34.68, 37.65, "Your turn. Say: Product recall."], [40.5, 42.0, "Product recall."], [42.75, 44.22, "Consumer protection."], [45.22, 49.26, "Consumer protection means laws that keep buyers safe from unfair business."], [49.85, 53.06, "Consumer protection laws stop false adverts."], [53.65, 57.0, "Your turn. Say: Consumer protection."], [59.83, 61.31, "Consumer protection."], [62.05, 63.02, "Warranty."], [64.02, 67.48, "Warranty means a promise to repair or replace a faulty product."], [68.08, 70.08, "The warranty lasts for two years."], [70.68, 73.05, "Your turn. Say: Warranty."], [75.9, 76.92, "Warranty."], [77.68, 79.0, "Safety standard."], [79.98, 84.14, "Safety standard means an official rule about how safe a product must be."], [84.75, 87.14, "The helmet meets every safety standard."], [87.75, 90.74, "Your turn. Say: Safety standard."], [93.6, 95.15, "Safety standard."], [95.88, 97.05, "Market launch."], [98.05, 101.03, "Market launch means the start of selling a new product."], [101.62, 103.65, "The market launch is planned for May."], [104.25, 107.05, "Your turn. Say: Market launch."], [109.9, 111.08, "Market launch."], [111.82, 113.19, "Price increase."], [114.18, 117.24, "Price increase means a rise in the cost of something."], [117.85, 120.51, "A price increase surprised many shoppers."], [121.12, 123.94, "Your turn. Say: Price increase."], [126.8, 128.21, "Price increase."], [128.95, 130.32, "Customer complaint."], [131.32, 135.29, "Customer complaint means a statement that a buyer is unhappy with a product."], [135.88, 138.19, "Each customer complaint was recorded."], [138.78, 141.84, "Your turn. Say: Customer complaint."], [144.7, 146.19, "Customer complaint."], [146.95, 148.68, "Regulatory agency."], [149.68, 154.45, "Regulatory agency means an official body that makes sure companies follow rules."], [155.05, 157.68, "The regulatory agency tested the product."], [158.28, 161.66, "Your turn. Say: Regulatory agency."], [164.5, 166.23, "Regulatory agency."], [167.03, 170.93, "Part two: dialogue. Let's listen to a conversation."], [171.78, 176.01, "Visal, a company has announced a product recall. What should buyers do?"], [177.12, 186.68, "First, stop using the product. Next, check the model number. Then contact the company, and finally return it for a refund."], [187.78, 190.1, "You used lots of sequence words."], [191.18, 200.98, "Yes: first, next, then, after that, finally. Consumer news uses them with imperatives such as 'check', 'stop' and 'keep your receipt'."], [202.08, 204.52, "Who makes sure companies follow the rules?"], [205.62, 212.83, "A regulatory agency. It sets the safety standard, and a customer complaint can start an investigation."], [213.97, 215.47, "Part three: grammar."], [216.32, 219.62, "Grammar focus: Sequence words and imperatives."], [219.92, 220.98, "Look at the pattern."], [221.68, 223.58, "First, stop using the product."], [224.48, 226.31, "Next, check the model number."], [227.22, 229.38, "Finally, return it for a refund."], [230.33, 237.58, "Use first, next, then, after that and finally to order steps. Imperatives begin with the base verb: check, stop, keep."], [238.32, 242.25, "Be careful! Don't say: First, you are check the label."], [244.2, 246.49, "Say: First, check the label."], [246.79, 248.93, "An imperative uses the base verb."], [249.73, 252.44, "Part four: reading. Read and listen."], [253.23, 254.91, "What To Do After a Recall."], [255.21, 259.05, "A product recall means a company believes its product may be unsafe."], [260.07, 263.81, "First, stop using it. Next, check the model number on the label."], [264.8, 268.96, "Then read the company's notice, and contact it if you have a customer complaint."], [269.97, 275.5, "Finally, return the product, because the warranty and consumer protection rules often give you a refund."], [276.5, 281.13, "A regulatory agency may also publish the safety standard that was broken."], [282.23, 286.31, "Part five: quiz. Five questions. Are you ready?"], [287.15, 289.09, "blank, stop using the product."], [289.39, 292.92, "A, First. B, Finally. C, Lastly then."], [296.47, 298.22, "The answer is A: First."], [299.38, 302.79, "An order to return a possibly unsafe product is a blank."], [303.09, 306.47, "A, warranty. B, recall. C, launch."], [310.03, 311.77, "The answer is B: recall."], [312.92, 315.86, "A promise to repair a faulty product is a blank."], [316.16, 319.68, "A, warranty. B, complaint. C, agency."], [323.23, 325.46, "The answer is A: warranty."], [326.62, 328.56, "Choose the correct imperative."], [328.86, 334.06, "A, You are check the number.. B, Check the model number.. C, Checking you the number.."], [337.6, 340.42, "The answer is B: Check the model number.."], [341.58, 344.36, "According to the reading, buyers often receive a…"], [344.66, 348.55, "A, fine. B, refund. C, ticket."], [352.1, 354.09, "The answer is B: refund."], [355.3, 358.52, "Part six: speaking. It's your turn to talk."], [359.38, 362.81, "What should a consumer do first after hearing about a product recall?"], [371.62, 372.94, "Now listen to Visal."], [373.24, 394.21, "The first thing a consumer should do is stop using the product immediately, because it may be dangerous. After that, they should check the model number and read the official notice. If it is affected, they should contact the company for a refund or repair. Keeping the receipt is also useful."], [394.51, 396.42, "Excellent answer, Visal!"], [397.32, 402.0, "Great work! Now you can use eight new words and sequence words and imperatives."], [402.3, 406.09, "Today's value is safety. Be careful near cars and roads."], [406.39, 409.32, "See you in Unit thirteen. Goodbye!"], [409.62, 412.2, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-NP1-Unit13-Investigative-Journalism": [[0.35, 5.36, "Hello, everyone! I'm Ms. Emma. Welcome to Online Newspaper Class, level one."], [5.66, 9.07, "Hi! I'm Visal. Let's learn together!"], [9.37, 16.57, "Unit thirteen: Investigative Journalism. Today you will report allegations with reporting verbs and noun clauses."], [16.88, 19.55, "Here is our lesson map. Let's start!"], [20.5, 24.21, "Part one: words. You will learn eight new words."], [25.05, 26.23, "Whistleblower."], [27.22, 31.29, "Whistleblower means a person who reveals wrongdoing inside an organisation."], [31.88, 34.28, "A whistleblower contacted the newspaper."], [34.88, 37.72, "Your turn. Say: Whistleblower."], [40.57, 41.67, "Whistleblower."], [42.42, 43.95, "Confidential source."], [44.95, 48.83, "Confidential source means a person whose name a reporter keeps secret."], [49.42, 52.04, "A confidential source gave the documents."], [52.65, 56.28, "Your turn. Say: Confidential source."], [59.13, 60.62, "Confidential source."], [61.38, 62.47, "Document leak."], [63.45, 67.28, "Document leak means the secret release of private papers to the press."], [67.88, 70.45, "A document leak revealed the secret contract."], [71.05, 74.05, "Your turn. Say: Document leak."], [76.9, 78.08, "Document leak."], [78.82, 79.98, "Fact-checking."], [80.98, 84.7, "Fact-checking means the process of confirming that information is true."], [85.32, 87.26, "Fact-checking took three weeks."], [87.85, 90.32, "Your turn. Say: Fact-checking."], [93.17, 94.86, "Fact-checking."], [95.62, 96.87, "Public interest."], [97.88, 101.37, "Public interest means the welfare of the general public."], [101.98, 104.18, "The story was in the public interest."], [104.78, 107.73, "Your turn. Say: Public interest."], [110.57, 111.8, "Public interest."], [112.55, 113.8, "Accountability."], [114.78, 118.2, "Accountability means being responsible for your actions."], [118.78, 121.7, "Journalism demands accountability from leaders."], [122.32, 124.83, "Your turn. Say: Accountability."], [127.67, 129.04, "Accountability."], [129.78, 130.9, "Exposé."], [131.92, 135.44, "Exposé means a news story that reveals something shocking."], [136.05, 137.88, "The exposé shocked the nation."], [138.48, 141.24, "Your turn. Say: Exposé."], [144.1, 145.21, "Exposé."], [145.95, 147.35, "Follow-up story."], [148.35, 152.09, "Follow-up story means a later story that adds new information."], [152.68, 154.96, "A follow-up story appeared on Monday."], [155.55, 158.67, "Your turn. Say: Follow-up story."], [161.53, 163.74, "Follow-up story."], [164.53, 168.22, "Part two: dialogue. Let's listen to a conversation."], [169.08, 173.65, "Visal, an exposé claims that a company hid pollution. How does the paper know?"], [174.75, 184.22, "A whistleblower and a confidential source gave documents, and after long fact-checking the reporters confirmed that the claim was true."], [185.32, 187.51, "I notice 'claims that' and 'revealed that'."], [188.62, 198.22, "Reporting verbs show how sure the paper is: claim and allege are cautious, while reveal and confirm mean the facts are checked."], [199.32, 200.9, "Why take such a risk?"], [201.98, 208.62, "Public interest and accountability. A follow-up story can then show whether leaders respond."], [209.77, 211.43, "Part three: grammar."], [212.28, 216.45, "Grammar focus: Reporting verbs: claim, allege, reveal."], [216.75, 217.99, "Look at the pattern."], [218.68, 221.63, "The whistleblower claims that the company hid its pollution."], [222.55, 225.2, "The leak reveals that the contract was secret."], [226.08, 228.86, "The paper alleges that officials ignored the warnings."], [229.8, 237.56, "Claim and allege are cautious; reveal and confirm show checked facts. Always add 'that' for clarity: claims that the company hid it."], [238.32, 241.97, "Be careful! Don't say: The paper claim the firm lied."], [243.93, 246.53, "Say: The paper claims that the firm lied."], [246.82, 248.94, "Add -s after a singular subject."], [249.73, 252.4, "Part four: reading. Read and listen."], [253.2, 254.78, "Behind the Exposé."], [255.08, 258.5, "Investigative journalism can take months of careful work."], [259.5, 265.16, "A whistleblower and a confidential source may give a reporter secret papers after a document leak."], [266.17, 271.72, "Fact-checking then shows whether the documents are real, and the paper alleges only what it can support."], [272.73, 278.23, "If the exposé reveals that wrongdoing happened, public interest demands a follow-up story."], [279.23, 282.07, "In this way, accountability becomes possible."], [283.17, 287.18, "Part five: quiz. Five questions. Are you ready?"], [288.02, 290.76, "The whistleblower blank that the company hid pollution."], [291.06, 294.83, "A, claims. B, claiming. C, claim to."], [298.37, 300.47, "The answer is A: claims."], [301.62, 304.19, "Confirming that information is true is blank."], [304.49, 308.21, "A, fact-checking. B, a leak. C, publication."], [311.77, 313.95, "The answer is A: fact-checking."], [315.12, 319.06, "A person who reveals wrongdoing inside an organisation is a blank."], [319.36, 322.85, "A, critic. B, whistleblower. C, consumer."], [326.4, 328.61, "The answer is B: whistleblower."], [329.75, 331.96, "Which verb shows the facts are checked?"], [332.26, 336.2, "A, allege. B, reveal. C, might claim."], [339.77, 341.91, "The answer is B: reveal."], [343.05, 346.34, "According to the reading, a follow-up story is needed when…"], [346.64, 351.89, "A, wrongdoing is revealed. B, nothing happens. C, the paper wishes."], [355.43, 358.26, "The answer is A: wrongdoing is revealed."], [359.47, 362.87, "Part six: speaking. It's your turn to talk."], [363.72, 368.0, "Why do journalists sometimes protect the identity of a confidential source?"], [376.82, 378.39, "Now listen to Visal."], [378.69, 400.78, "Journalists protect a confidential source because the person may face danger or lose a job. If sources were named, few people would dare to reveal wrongdoing. Protecting them therefore helps the public learn the truth. The reporter must still check the facts carefully, because a secret source can be mistaken."], [401.08, 402.74, "Excellent answer, Visal!"], [403.65, 409.04, "Great work! Now you can use eight new words and reporting verbs: claim, allege, reveal."], [409.34, 413.74, "Today's value is moral courage. Do what is right even when it is difficult."], [414.04, 416.67, "See you in Unit fourteen. Goodbye!"], [416.97, 420.22, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-NP1-Unit14-Photojournalism": [[0.35, 6.02, "Hello, everyone! I'm Ms. Emma. Welcome to Online Newspaper Class, level one."], [6.32, 9.74, "Hi! I'm Visal. Let's learn together!"], [10.04, 15.74, "Unit fourteen: Photojournalism. Today you will describe images with participle phrases."], [16.04, 18.6, "Here is our lesson map. Let's start!"], [19.53, 23.0, "Part one: words. You will learn eight new words."], [23.85, 25.07, "Photo caption."], [26.08, 29.43, "Photo caption means the words under a photo that explain it."], [30.02, 32.57, "The photo caption named everyone in the picture."], [33.18, 35.88, "Your turn. Say: Photo caption."], [38.73, 39.92, "Photo caption."], [40.68, 41.85, "Photojournalist."], [42.85, 46.95, "Photojournalist means a person who tells news stories with photographs."], [47.55, 50.22, "The photojournalist travelled to the flood zone."], [50.82, 53.96, "Your turn. Say: Photojournalist."], [56.8, 58.13, "Photojournalist."], [58.88, 60.57, "Visual storytelling."], [61.58, 65.39, "Visual storytelling means telling a story mainly through pictures."], [65.98, 68.56, "Visual storytelling can move readers deeply."], [69.15, 72.42, "Your turn. Say: Visual storytelling."], [75.27, 76.79, "Visual storytelling."], [77.55, 78.95, "Ethical guideline."], [79.95, 83.39, "Ethical guideline means a rule about what is morally right."], [83.98, 86.88, "An ethical guideline forbids staged photos."], [87.48, 90.67, "Your turn. Say: Ethical guideline."], [93.53, 94.98, "Ethical guideline."], [95.72, 97.04, "Image manipulation."], [98.05, 101.91, "Image manipulation means changing a photo to give a false impression."], [102.52, 104.99, "Image manipulation destroys trust."], [105.58, 109.03, "Your turn. Say: Image manipulation."], [111.87, 113.94, "Image manipulation."], [114.68, 116.01, "Iconic photo."], [117.02, 121.06, "Iconic photo means a famous photograph that people remember for decades."], [121.65, 123.85, "The iconic photo shaped public opinion."], [124.45, 127.39, "Your turn. Say: Iconic photo."], [130.23, 131.84, "Iconic photo."], [132.58, 133.77, "Press pass."], [134.78, 139.49, "Press pass means an official card allowing a journalist to report at an event."], [140.08, 141.86, "The press pass opened the gate."], [142.45, 145.08, "Your turn. Say: Press pass."], [147.93, 149.06, "Press pass."], [149.82, 151.11, "Frontline coverage."], [152.12, 155.87, "Frontline coverage means reporting from the place where events are happening."], [156.48, 158.85, "Frontline coverage requires great courage."], [159.45, 162.58, "Your turn. Say: Frontline coverage."], [165.43, 166.89, "Frontline coverage."], [167.7, 171.59, "Part two: dialogue. Let's listen to a conversation."], [172.45, 179.38, "Visal, here is a photo caption: 'A girl, holding a rescued puppy, smiles after the flood.' Why two commas?"], [180.48, 189.85, "The participle phrase 'holding a rescued puppy' adds detail about the girl. Photo captions often use -ing and -ed phrases to be short."], [190.95, 192.76, "Do captions use -ed too?"], [193.85, 201.56, "Yes. 'Rescued from the flood, the puppy was cared for by volunteers.' The -ed phrase gives a passive meaning."], [202.65, 204.32, "And the photographer's duty?"], [205.42, 214.07, "An ethical guideline says photojournalists must not use image manipulation, because a changed picture can lie."], [215.23, 216.63, "Part three: grammar."], [217.48, 220.97, "Grammar focus: Participle phrases in captions."], [221.27, 222.54, "Look at the pattern."], [223.25, 226.61, "A girl, holding a rescued puppy, smiles after the flood."], [227.52, 231.26, "Rescued from the water, the puppy was cared for by volunteers."], [232.15, 235.93, "The photojournalist, working near the front line, took an iconic photo."], [236.87, 244.59, "Use an -ing phrase for an action happening at the same time and an -ed phrase for a passive meaning. Put commas around the phrase."], [245.35, 249.42, "Be careful! Don't say: A girl hold a puppy, smiles."], [251.37, 254.34, "Say: A girl, holding a puppy, smiles."], [254.64, 256.5, "Use an -ing phrase with commas."], [257.3, 260.1, "Part four: reading. Read and listen."], [260.9, 262.47, "The Power of a Picture."], [262.77, 266.39, "A single photograph can tell a story faster than a long article."], [267.4, 273.38, "A photojournalist, carrying a camera and a press pass, often works close to danger during frontline coverage."], [274.37, 278.61, "Each image needs a clear photo caption, written to explain who, where and when."], [279.6, 285.14, "An ethical guideline forbids image manipulation, because a changed picture can mislead the public."], [286.13, 289.46, "Visual storytelling is powerful only when it is honest."], [290.57, 295.04, "Part five: quiz. Five questions. Are you ready?"], [295.88, 298.75, "A girl, blank a puppy, smiles after the flood."], [299.05, 302.39, "A, holding. B, held to. C, holds."], [305.93, 307.81, "The answer is A: holding."], [308.95, 311.26, "The words under a photo are the photo blank."], [311.56, 315.03, "A, caption. B, pass. C, guideline."], [318.57, 320.15, "The answer is A: caption."], [321.28, 324.56, "Changing a photo to give a false impression is image blank."], [324.86, 328.8, "A, storytelling. B, manipulation. C, coverage."], [332.37, 334.75, "The answer is B: manipulation."], [335.88, 337.48, "Choose the correct caption."], [337.78, 345.69, "A, Rescued from water, the puppy was safe.. B, Rescue from water, the puppy safe was.. C, Rescuing water, the puppy is safe.."], [349.23, 352.59, "The answer is A: Rescued from water, the puppy was safe.."], [353.75, 358.25, "According to the reading, visual storytelling is powerful only when it is…"], [358.55, 362.07, "A, honest. B, colourful. C, expensive."], [365.63, 367.48, "The answer is A: honest."], [368.67, 371.97, "Part six: speaking. It's your turn to talk."], [372.82, 377.21, "Why is it important that a news photo is never digitally altered to change its meaning?"], [386.02, 387.55, "Now listen to Visal."], [387.85, 410.22, "A news photo is accepted as evidence of what really happened. If it is digitally altered, readers receive a false picture and may stop trusting all journalism. A changed image can also hurt innocent people. For this reason, ethical guidelines allow only small technical corrections such as brightness."], [410.52, 412.17, "Excellent answer, Visal!"], [413.08, 417.87, "Great work! Now you can use eight new words and participle phrases in captions."], [418.17, 422.15, "Today's value is truthfulness. Tell the truth and check the facts."], [422.45, 425.3, "See you in Unit fifteen. Goodbye!"], [425.6, 428.61, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-NP1-Unit15-Breaking-News-Coverage": [[0.35, 5.67, "Hello, everyone! I'm Ms. Emma. Welcome to Online Newspaper Class, level one."], [5.97, 9.56, "Hi! I'm Visal. Let's learn together!"], [9.86, 16.88, "Unit fifteen: Breaking News Coverage. Today you will give live updates with the present continuous and caution phrases."], [17.18, 19.76, "Here is our lesson map. Let's start!"], [20.7, 23.72, "Part one: words. You will learn eight new words."], [24.58, 25.77, "Live update."], [26.78, 30.09, "Live update means new information given while an event is happening."], [30.68, 33.2, "A live update appeared every ten minutes."], [33.82, 36.66, "Your turn. Say: Live update."], [39.5, 40.66, "Live update."], [41.42, 42.72, "Developing story."], [43.72, 47.25, "Developing story means a news event whose facts are still changing."], [47.85, 49.66, "This is a developing story."], [50.25, 53.04, "Your turn. Say: Developing story."], [55.9, 57.25, "Developing story."], [57.98, 59.6, "Unverified report."], [60.58, 64.5, "Unverified report means information that has not yet been confirmed."], [65.08, 68.0, "An unverified report spread quickly online."], [68.62, 72.02, "Your turn. Say: Unverified report."], [74.87, 76.54, "Unverified report."], [77.28, 78.61, "Wire service."], [79.62, 83.9, "Wire service means an agency that supplies news to many newspapers."], [84.52, 86.72, "The wire service sent the first photos."], [87.32, 90.58, "Your turn. Say: Wire service."], [93.43, 94.68, "Wire service."], [95.42, 96.34, "Correction."], [97.35, 100.3, "Correction means a published change that fixes a mistake."], [100.92, 103.54, "The paper printed a correction on page two."], [104.15, 106.43, "Your turn. Say: Correction."], [109.27, 110.21, "Correction."], [110.95, 112.12, "News alert."], [113.12, 116.39, "News alert means a short message announcing important news."], [116.98, 119.03, "A news alert appeared on my phone."], [119.62, 122.44, "Your turn. Say: News alert."], [125.3, 127.09, "News alert."], [127.85, 129.09, "Rolling coverage."], [130.08, 134.16, "Rolling coverage means continuous reporting that is updated again and again."], [134.75, 137.2, "Rolling coverage kept viewers informed."], [137.82, 140.68, "Your turn. Say: Rolling coverage."], [143.53, 145.12, "Rolling coverage."], [145.85, 147.34, "Confirmed detail."], [148.35, 151.99, "Confirmed detail means a fact that has been checked and proved true."], [152.58, 155.56, "Each confirmed detail is added to the report."], [156.15, 159.24, "Your turn. Say: Confirmed detail."], [162.1, 163.79, "Confirmed detail."], [164.6, 168.15, "Part two: dialogue. Let's listen to a conversation."], [168.98, 176.99, "Visal, a news alert says 'Police are investigating an explosion. Reports suggest two people are injured.' Why the continuous?"], [178.08, 185.71, "The present continuous shows that events are in progress. Rolling coverage uses it for a developing story."], [186.82, 189.68, "Why 'reports suggest' and not 'two people are injured'?"], [190.78, 199.86, "Because the report is unverified. Careful reporters wait for a confirmed detail from an official source or a wire service."], [200.95, 203.19, "What happens if the first report is wrong?"], [204.28, 211.46, "The paper publishes a correction and says clearly what changed, so readers can trust the next update."], [212.6, 214.1, "Part three: grammar."], [214.95, 218.61, "Grammar focus: Present continuous and caution phrases."], [218.91, 220.07, "Look at the pattern."], [220.78, 224.12, "Police are investigating an explosion in the city centre."], [225.02, 227.51, "Reports suggest that two people are injured."], [228.42, 231.45, "The wire service is reporting that the road is closed."], [232.4, 240.23, "Use the present continuous for events in progress. Add 'reports suggest', 'it is understood' or 'unconfirmed' until a detail is checked."], [240.98, 244.92, "Be careful! Don't say: Police investigate now an event."], [246.87, 250.18, "Say: Police are investigating an event."], [250.48, 253.52, "Use the present continuous for events in progress."], [254.33, 256.68, "Part four: reading. Read and listen."], [257.5, 258.76, "As It Happens."], [259.06, 263.54, "When an explosion shakes a city, rolling coverage begins within minutes."], [264.53, 269.35, "A news alert says police are investigating, but the story is still developing."], [270.37, 276.47, "An early unverified report suggests that two people are injured, yet no confirmed detail has arrived."], [277.47, 282.35, "The wire service is checking each live update, and a correction follows if a fact was wrong."], [283.33, 286.02, "Speed matters, but accuracy matters more."], [287.13, 291.43, "Part five: quiz. Five questions. Are you ready?"], [292.28, 294.98, "Police blank an explosion in the city centre."], [295.28, 300.07, "A, are investigating. B, investigate to. C, investigated now."], [303.63, 306.55, "The answer is A: are investigating."], [307.72, 310.24, "A fact that has been checked is a blank detail."], [310.54, 314.03, "A, confirmed. B, developing. C, rolling."], [317.57, 319.42, "The answer is A: confirmed."], [320.55, 323.25, "A published change that fixes a mistake is a blank."], [323.55, 327.78, "A, correction. B, wire service. C, news alert."], [331.33, 333.24, "The answer is A: correction."], [334.38, 336.32, "Which phrase is the most careful?"], [336.62, 343.28, "A, Two people are dead.. B, Reports suggest two people are injured.. C, Two people died for sure.."], [346.83, 350.7, "The answer is B: Reports suggest two people are injured.."], [351.85, 354.36, "According to the reading, accuracy matters…"], [354.66, 358.85, "A, less than speed. B, more than speed. C, never."], [362.4, 364.75, "The answer is B: more than speed."], [365.93, 369.42, "Part six: speaking. It's your turn to talk."], [370.28, 373.76, "Why might early breaking news reports sometimes turn out to be wrong?"], [382.55, 384.03, "Now listen to Visal."], [384.33, 409.74, "Early reports may be wrong because reporters are working quickly and facts are still changing. Eyewitnesses can be confused or frightened, and rumours spread fast on social media. If a newspaper publishes an unverified report, it risks making a mistake. For this reason, careful journalists wait for confirmed details and publish corrections."], [410.04, 411.69, "Excellent answer, Visal!"], [412.58, 417.89, "Great work! Now you can use eight new words and present continuous and caution phrases."], [418.19, 424.05, "Today's value is critical awareness. Use technology wisely, and always think for yourself."], [424.35, 427.2, "See you in Unit sixteen. Goodbye!"], [427.5, 430.15, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-NP1-Unit16-Fact-Checking-News": [[0.35, 5.54, "Hello, everyone! I'm Ms. Emma. Welcome to Online Newspaper Class, level one."], [5.84, 9.47, "Hi! I'm Visal. Let's learn together!"], [9.77, 16.24, "Unit sixteen: Fact-Checking News. Today you will make contrasts with although, while and however."], [16.54, 19.23, "Here is our lesson map. Let's start!"], [20.17, 23.43, "Part one: words. You will learn eight new words."], [24.28, 25.45, "Fact-checker."], [26.45, 30.12, "Fact-checker means a person who checks whether claims are true."], [30.72, 32.8, "The fact-checker found three errors."], [33.38, 35.98, "Your turn. Say: Fact-checker."], [38.83, 39.96, "Fact-checker."], [40.72, 42.15, "Claim verification."], [43.15, 47.15, "Claim verification means the process of testing whether a statement is true."], [47.75, 50.38, "Claim verification uses several sources."], [50.98, 54.16, "Your turn. Say: Claim verification."], [57.0, 58.33, "Claim verification."], [59.08, 60.36, "Misinformation."], [61.35, 65.74, "Misinformation means false information spread, often without bad intent."], [66.35, 69.13, "Misinformation spreads faster than facts."], [69.72, 72.35, "Your turn. Say: Misinformation."], [75.2, 76.41, "Misinformation."], [77.15, 78.5, "Primary source."], [79.48, 83.21, "Primary source means an original document or witness of an event."], [83.82, 86.37, "A primary source is the best evidence."], [86.98, 89.75, "Your turn. Say: Primary source."], [92.6, 94.02, "Primary source."], [94.78, 95.94, "Rating system."], [96.95, 100.3, "Rating system means a scale showing how true a claim is."], [100.88, 103.65, "The rating system used true, mixed and false."], [104.25, 107.1, "Your turn. Say: Rating system."], [109.93, 111.41, "Rating system."], [112.15, 113.14, "Context."], [114.15, 117.53, "Context means the situation that helps explain a statement."], [118.12, 120.67, "Without context, the quote is misleading."], [121.28, 123.95, "Your turn. Say: Context."], [126.8, 127.91, "Context."], [128.65, 129.49, "Debunk."], [130.48, 133.78, "Debunk means to show that a belief or story is false."], [134.38, 136.97, "The team debunked the viral rumour."], [137.58, 139.92, "Your turn. Say: Debunk."], [142.77, 143.66, "Debunk."], [144.42, 145.6, "Accuracy."], [146.62, 149.78, "Accuracy means being correct and free from mistakes."], [150.38, 152.8, "Accuracy is the heart of journalism."], [153.42, 155.99, "Your turn. Say: Accuracy."], [158.83, 159.99, "Accuracy."], [160.8, 164.57, "Part two: dialogue. Let's listen to a conversation."], [165.42, 171.02, "Visal, a post says unemployment is falling, while the fact-checker rates it 'mixed'. Why?"], [172.12, 180.38, "Although the figure is correct, it ignores context. Fact-checkers contrast what is true with what is missing."], [181.48, 183.59, "Which words show contrast?"], [184.68, 192.32, "Although and while begin a clause: 'Although the number fell, many jobs are part-time.' However begins a new sentence."], [193.42, 195.28, "And how do they verify a claim?"], [196.38, 204.18, "They find a primary source, compare other evidence, add context, and then give the claim a rating."], [205.33, 207.0, "Part three: grammar."], [207.85, 211.43, "Grammar focus: Contrast with although and while and however."], [211.73, 212.94, "Look at the pattern."], [213.65, 217.18, "Although the figure is correct, it ignores important context."], [218.08, 221.28, "While the post is popular, it contains misinformation."], [222.18, 226.79, "The claim sounds convincing. However, no primary source supports it."], [227.73, 235.3, "Although and while join two clauses with a comma. However starts a new sentence and is followed by a comma. Never use 'but' with although."], [236.05, 239.92, "Be careful! Don't say: Although true, but it misleads."], [241.87, 244.63, "Say: Although it is true, it misleads."], [244.93, 246.59, "Do not use 'but' with although."], [247.4, 250.08, "Part four: reading. Read and listen."], [250.87, 252.33, "How Facts Get Checked."], [252.63, 255.79, "A fact-checker tests whether a popular claim is true."], [256.8, 262.63, "Although a viral post may sound convincing, claim verification begins with a primary source."], [263.63, 267.65, "The fact-checker then adds context, because a true number can still mislead."], [268.67, 273.01, "While the rating system is simple, the research behind each rating takes hours."], [274.0, 277.0, "However, every debunked rumour protects accuracy."], [278.1, 281.86, "Part five: quiz. Five questions. Are you ready?"], [282.72, 285.64, "blank the figure is correct, it ignores context."], [285.94, 289.51, "A, Although. B, However. C, Because of."], [293.07, 294.94, "The answer is A: Although."], [296.08, 299.64, "False information spread, often without bad intent, is blank."], [299.94, 303.98, "A, misinformation. B, accuracy. C, a rating."], [307.53, 309.66, "The answer is A: misinformation."], [310.82, 313.18, "To show that a rumour is false is to blank it."], [313.48, 317.11, "A, debunk. B, verify. C, publish."], [320.67, 322.84, "The answer is A: debunk."], [323.98, 325.72, "Choose the correct sentence."], [326.02, 333.98, "A, Although it is true, but it misleads.. B, Although it is true, it misleads.. C, Although it true, it misleads.."], [337.53, 340.69, "The answer is B: Although it is true, it misleads.."], [341.85, 345.21, "According to the reading, claim verification begins with a…"], [345.51, 349.15, "A, rumour. B, primary source. C, rating."], [352.7, 355.33, "The answer is B: primary source."], [356.53, 359.86, "Part six: speaking. It's your turn to talk."], [360.72, 364.54, "What steps could you take yourself to fact-check a claim you see online?"], [373.35, 374.92, "Now listen to Visal."], [375.22, 397.89, "First, I would find the original source of the claim, not only the post that shares it. Next, I would search for the same information on trusted news sites and official websites. Then I would check the date and context, because old facts can be used wrongly. Finally, I would ask a teacher if I am still unsure."], [398.19, 400.1, "Excellent answer, Visal!"], [400.98, 405.84, "Great work! Now you can use eight new words and contrast with although and while and however."], [406.14, 411.96, "Today's value is intellectual honesty. Follow the evidence, even when it is inconvenient."], [412.26, 415.06, "See you in Unit seventeen. Goodbye!"], [415.36, 418.19, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-NP1-Unit17-Citizen-Journalism": [[0.35, 5.55, "Hello, everyone! I'm Ms. Emma. Welcome to Online Newspaper Class, level one."], [5.85, 9.52, "Hi! I'm Visal. Let's learn together!"], [9.82, 15.77, "Unit seventeen: Citizen Journalism. Today you will weigh benefits and risks with 'while' and 'on the other hand'."], [16.07, 18.88, "Here is our lesson map. Let's start!"], [19.83, 23.02, "Part one: words. You will learn eight new words."], [23.88, 25.24, "Eyewitness account."], [26.25, 30.19, "Eyewitness account means a description given by a person who saw an event."], [30.78, 33.18, "An eyewitness account described the storm."], [33.78, 36.49, "Your turn. Say: Eyewitness account."], [39.33, 40.72, "Eyewitness account."], [41.48, 43.13, "Social media post."], [44.15, 48.48, "Social media post means a message shared on an online platform."], [49.08, 51.83, "A social media post showed the flood first."], [52.42, 55.84, "Your turn. Say: Social media post."], [58.7, 60.34, "Social media post."], [61.08, 62.71, "User-generated content."], [63.72, 67.55, "User-generated content means videos or text made by ordinary people."], [68.15, 70.88, "User-generated content filled the news feed."], [71.48, 74.97, "Your turn. Say: User-generated content."], [77.83, 79.61, "User-generated content."], [80.35, 82.14, "Verification process."], [83.15, 87.09, "Verification process means the steps used to prove that something is true."], [87.68, 89.87, "The verification process takes time."], [90.48, 93.98, "Your turn. Say: Verification process."], [96.83, 98.97, "Verification process."], [99.72, 101.01, "First responder."], [102.02, 105.82, "First responder means a person who arrives first at an emergency."], [106.42, 108.52, "A first responder helped the injured."], [109.12, 112.13, "Your turn. Say: First responder."], [114.97, 116.3, "First responder."], [117.05, 118.3, "Local reporting."], [119.28, 122.55, "Local reporting means news gathered by people in the area."], [123.15, 126.08, "Local reporting reaches places big papers miss."], [126.68, 129.68, "Your turn. Say: Local reporting."], [132.53, 133.93, "Local reporting."], [134.68, 136.1, "Smartphone footage."], [137.12, 140.83, "Smartphone footage means video recorded on a mobile phone."], [141.45, 143.63, "Smartphone footage showed the rescue."], [144.25, 147.31, "Your turn. Say: Smartphone footage."], [150.17, 151.66, "Smartphone footage."], [152.42, 153.92, "Community voice."], [154.92, 158.77, "Community voice means the opinions and experiences of local people."], [159.38, 162.78, "Citizen journalism gives the community a voice."], [163.38, 166.45, "Your turn. Say: Community voice."], [169.3, 170.55, "Community voice."], [171.33, 174.86, "Part two: dialogue. Let's listen to a conversation."], [175.72, 181.32, "Visal, smartphone footage of the flood spread online before any reporter arrived. Is that good?"], [182.42, 193.41, "In some ways. Citizen journalism is fast and gives the community a voice, while professional news is slower but checked."], [194.52, 195.82, "What are the risks?"], [196.92, 205.36, "User-generated content can be wrong or old. On the other hand, a verification process can confirm the place and time."], [206.45, 207.78, "So we need both?"], [208.88, 217.28, "Yes. Eyewitness accounts add detail, and professional reporters add accuracy. Together they give a fuller picture."], [218.43, 219.91, "Part three: grammar."], [220.75, 224.9, "Grammar focus: Balancing views: while and on the other hand."], [225.2, 226.58, "Look at the pattern."], [227.28, 230.97, "Citizen reports are fast, while professional reports are checked."], [231.85, 236.15, "Footage shows real events. On the other hand, it may be old or edited."], [237.05, 240.68, "One benefit is speed; one risk is false information."], [241.63, 249.71, "Use while for contrast inside a sentence and 'on the other hand,' to start a contrasting sentence. Balanced writing gives both benefits and risks."], [250.45, 255.8, "Be careful! Don't say: Citizen news is fast, but professionals is slow."], [257.73, 262.08, "Say: Citizen news is fast, while professional news is slow."], [262.38, 264.74, "Use while to contrast two clauses."], [265.53, 268.14, "Part four: reading. Read and listen."], [268.93, 270.33, "Everyone a Reporter?."], [270.63, 273.58, "A smartphone can turn any witness into a reporter."], [274.57, 279.19, "An eyewitness account on a social media post may reach thousands within minutes."], [280.2, 284.68, "First responders and neighbours provide local reporting that big newsrooms may miss."], [285.7, 292.92, "On the other hand, user-generated content needs a careful verification process, because pictures can be old or edited."], [293.93, 297.98, "Citizen journalism is most valuable when it works with trained editors."], [299.07, 303.02, "Part five: quiz. Five questions. Are you ready?"], [303.88, 307.6, "Citizen reports are fast, blank professional reports are checked."], [307.9, 311.65, "A, while. B, because. C, so that."], [315.2, 316.91, "The answer is A: while."], [318.05, 321.37, "A description given by someone who saw an event is an blank."], [321.67, 325.94, "A, exposé. B, update. C, eyewitness account."], [329.5, 331.75, "The answer is C: eyewitness account."], [332.92, 335.94, "Videos made by ordinary people are blank content."], [336.24, 340.01, "A, user-generated. B, rolling. C, primary."], [343.57, 345.95, "The answer is A: user-generated."], [347.08, 349.25, "Choose the best balancing phrase."], [349.55, 356.63, "A, On the other hand, it may be false.. B, In the other hand, it may false.. C, On other hand it is false.."], [360.2, 364.17, "The answer is A: On the other hand, it may be false.."], [365.32, 368.59, "According to the reading, citizen journalism works best with…"], [368.89, 373.01, "A, trained editors. B, no checks. C, rumours."], [376.57, 378.93, "The answer is A: trained editors."], [380.13, 383.36, "Part six: speaking. It's your turn to talk."], [384.22, 389.56, "What are the benefits and risks of relying on citizen journalism during a fast-moving event?"], [398.35, 399.92, "Now listen to Visal."], [400.22, 422.72, "One benefit is speed, because witnesses can share footage within seconds, and they show the community's voice. On the other hand, there is a serious risk of false or edited content. Strangers may also spread rumours without checking. Therefore, I would trust citizen reports only after a verification process."], [423.02, 424.8, "Excellent answer, Visal!"], [425.68, 431.26, "Great work! Now you can use eight new words and balancing views: while and on the other hand."], [431.56, 436.1, "Today's value is critical reasoning. Test every argument before you accept it."], [436.39, 439.04, "See you in Unit eighteen. Goodbye!"], [439.33, 442.42, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-NP1-Unit18-Media-Literacy": [[0.35, 6.15, "Hello, everyone! I'm Ms. Emma. Welcome to Online Newspaper Class, level one."], [6.45, 9.9, "Hi! I'm Visal. Let's learn together!"], [10.2, 17.41, "Unit eighteen: Media Literacy. Today you will explain cause and effect with because of, due to and as a result."], [17.71, 20.25, "Here is our lesson map. Let's start!"], [21.2, 24.5, "Part one: words. You will learn eight new words."], [25.35, 26.06, "Bias."], [27.05, 29.77, "Bias means an unfair preference for one side."], [30.38, 32.69, "Bias can hide in the choice of words."], [33.28, 36.05, "Your turn. Say: Bias."], [38.9, 39.83, "Bias."], [40.58, 42.09, "Source credibility."], [43.08, 46.52, "Source credibility means how far a source can be trusted."], [47.12, 49.59, "Source credibility depends on evidence."], [50.18, 53.6, "Your turn. Say: Source credibility."], [56.47, 57.97, "Source credibility."], [58.72, 60.1, "Media ownership."], [61.12, 64.88, "Media ownership means who owns and controls a news company."], [65.48, 67.78, "Media ownership may shape the coverage."], [68.38, 71.5, "Your turn. Say: Media ownership."], [74.37, 75.79, "Media ownership."], [76.55, 78.03, "Sponsored content."], [79.02, 82.79, "Sponsored content means paid advertising made to look like news."], [83.38, 86.09, "Sponsored content should be clearly labelled."], [86.68, 89.85, "Your turn. Say: Sponsored content."], [92.7, 94.13, "Sponsored content."], [94.88, 96.05, "Algorithm."], [97.05, 100.93, "Algorithm means a set of rules a computer uses to choose what you see."], [101.52, 104.36, "An algorithm decides which videos you see."], [104.95, 107.78, "Your turn. Say: Algorithm."], [110.63, 111.63, "Algorithm."], [112.38, 113.5, "Echo chamber."], [114.52, 118.76, "Echo chamber means a place where you only hear opinions like your own."], [119.35, 121.98, "Social media can become an echo chamber."], [122.58, 125.67, "Your turn. Say: Echo chamber."], [128.5, 129.75, "Echo chamber."], [130.48, 131.78, "Critical reading."], [132.78, 136.14, "Critical reading means reading carefully and questioning what you read."], [136.75, 139.02, "Critical reading protects us from rumours."], [139.62, 142.34, "Your turn. Say: Critical reading."], [145.2, 146.53, "Critical reading."], [147.28, 148.66, "Diverse sources."], [149.65, 153.61, "Diverse sources means information from many different people and outlets."], [154.22, 156.6, "Diverse sources give a fuller picture."], [157.18, 160.59, "Your turn. Say: Diverse sources."], [163.43, 164.69, "Diverse sources."], [165.5, 169.37, "Part two: dialogue. Let's listen to a conversation."], [170.22, 173.87, "Visal, why do I see the same opinions on my feed every day?"], [174.95, 182.7, "Because of the algorithm. It shows you what you already like, and as a result you may live in an echo chamber."], [183.78, 185.2, "How can I escape it?"], [186.32, 196.17, "Practise critical reading and use diverse sources. Due to media ownership and bias, one outlet alone can give a limited view."], [197.28, 199.53, "Should I check who pays for a story?"], [200.62, 207.26, "Yes. Sponsored content looks like news, so ask about source credibility every time."], [208.4, 210.06, "Part three: grammar."], [210.92, 214.93, "Grammar focus: Cause and effect: because of and due to and as a result."], [215.22, 216.42, "Look at the pattern."], [217.12, 220.38, "Because of the algorithm, we see similar opinions."], [221.28, 223.99, "Bias is often due to media ownership."], [224.88, 228.75, "We read one outlet. As a result, our view becomes narrow."], [229.7, 237.06, "Because of and due to are followed by a noun. As a result starts a new sentence with a comma. Do not use 'because of' before a clause."], [237.82, 242.05, "Be careful! Don't say: Because of he lied, we doubt him."], [244.0, 246.42, "Say: Because of his lies, we doubt him."], [246.72, 248.66, "Because of is followed by a noun."], [249.47, 252.39, "Part four: reading. Read and listen."], [253.2, 254.62, "Reading Beyond the Feed."], [254.92, 258.66, "Every day, an algorithm chooses which stories appear on a phone."], [259.67, 264.16, "Because of this, many readers sit in an echo chamber and see only familiar opinions."], [265.17, 270.86, "Media ownership and sponsored content can also create bias, which is why source credibility matters."], [271.87, 276.55, "Critical reading and diverse sources help readers compare views and avoid being misled."], [277.53, 280.79, "As a result, informed citizens make better decisions."], [281.9, 285.87, "Part five: quiz. Five questions. Are you ready?"], [286.72, 289.49, "blank the algorithm, we see similar opinions."], [289.79, 294.05, "A, Because of. B, Because. C, As a result."], [297.6, 299.61, "The answer is A: Because of."], [300.75, 304.05, "A place where you only hear opinions like your own is an blank."], [304.35, 308.13, "A, echo chamber. B, algorithm. C, outlet."], [311.67, 314.17, "The answer is A: echo chamber."], [315.32, 318.45, "Paid advertising made to look like news is blank content."], [318.75, 322.45, "A, diverse. B, sponsored. C, critical."], [326.0, 328.1, "The answer is B: sponsored."], [329.25, 331.01, "Choose the correct sentence."], [331.31, 338.3, "A, Because of he is biased, we doubt him.. B, Because of his bias, we doubt him.. C, Because his bias of, we doubt him.."], [341.87, 345.39, "The answer is B: Because of his bias, we doubt him.."], [346.55, 349.65, "According to the reading, diverse sources help readers…"], [349.95, 354.24, "A, compare views. B, avoid reading. C, buy papers."], [357.8, 360.03, "The answer is A: compare views."], [361.23, 364.26, "Part six: speaking. It's your turn to talk."], [365.12, 368.96, "How can reading news from diverse sources help you avoid an echo chamber?"], [377.75, 379.32, "Now listen to Visal."], [379.62, 399.17, "Reading diverse sources shows me opinions that my feed would normally hide. If I compare two or three outlets, I can notice bias and missing facts. As a result, I understand an issue more fully and can form my own view. It also keeps me open to people who think differently."], [399.47, 401.12, "Excellent answer, Visal!"], [402.02, 408.13, "Great work! Now you can use eight new words and cause and effect: because of and due to and as a result."], [408.43, 413.23, "Today's value is open-mindedness. Listen to new ideas before you judge them."], [413.53, 416.18, "See you in Unit nineteen. Goodbye!"], [416.48, 419.12, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-NP1-Unit19-Year-in-Review": [[0.35, 5.79, "Hello, everyone! I'm Ms. Emma. Welcome to Online Newspaper Class, level one."], [6.09, 9.35, "Hi! I'm Visal. Let's learn together!"], [9.65, 15.41, "Unit nineteen: Year in Review. Today you will tell background stories with the past perfect."], [15.71, 18.34, "Here is our lesson map. Let's start!"], [19.3, 22.56, "Part one: words. You will learn eight new words."], [23.42, 24.71, "Retrospective."], [25.72, 28.66, "Retrospective means a look back at events of the past."], [29.25, 31.92, "The paper published a retrospective in December."], [32.52, 35.54, "Your turn. Say: Retrospective."], [38.4, 39.98, "Retrospective."], [40.72, 41.88, "Top story."], [42.88, 45.57, "Top story means the most important news item."], [46.18, 48.17, "The flood was the year's top story."], [48.78, 51.6, "Your turn. Say: Top story."], [54.43, 55.53, "Top story."], [56.28, 57.17, "Timeline."], [58.18, 61.18, "Timeline means a list of events in the order they happened."], [61.78, 63.98, "A timeline showed each major event."], [64.58, 67.07, "Your turn. Say: Timeline."], [69.93, 70.93, "Timeline."], [71.68, 72.85, "Turning point."], [73.85, 76.69, "Turning point means a moment when things begin to change."], [77.28, 79.19, "The election was a turning point."], [79.78, 82.42, "Your turn. Say: Turning point."], [85.27, 86.43, "Turning point."], [87.18, 88.42, "Public reaction."], [89.42, 93.0, "Public reaction means the way ordinary people respond to news."], [93.58, 95.87, "Public reaction was swift and emotional."], [96.48, 99.89, "Your turn. Say: Public reaction."], [102.73, 103.92, "Public reaction."], [104.68, 106.37, "Long-term impact."], [107.38, 110.69, "Long-term impact means an effect that lasts for many years."], [111.28, 113.77, "The reform will have a long-term impact."], [114.38, 118.06, "Your turn. Say: Long-term impact."], [120.9, 122.32, "Long-term impact."], [123.08, 124.32, "Historic moment."], [125.32, 129.01, "Historic moment means a time that will be remembered in history."], [129.62, 131.62, "The signing was a historic moment."], [132.22, 134.97, "Your turn. Say: Historic moment."], [137.83, 139.21, "Historic moment."], [139.95, 141.08, "Lessons learned."], [142.08, 145.4, "Lessons learned means useful knowledge gained from experience."], [145.98, 148.12, "Lessons learned help us prepare better."], [148.72, 151.62, "Your turn. Say: Lessons learned."], [154.47, 156.15, "Lessons learned."], [156.97, 160.7, "Part two: dialogue. Let's listen to a conversation."], [161.55, 167.06, "Visal, this retrospective says 'By December, the city had recovered from the flood.' Why 'had recovered'?"], [168.15, 174.74, "The past perfect shows an earlier past event. The recovery happened before December, so the writer adds 'had'."], [175.85, 177.45, "Is it used in timelines?"], [178.55, 187.59, "Yes, for background: 'Before the storm reached land, officials had warned families.' It explains what came first."], [188.68, 190.76, "And what do year-end reviews look for?"], [191.85, 201.66, "A turning point, the public reaction, the long-term impact and lessons learned from each historic moment."], [202.8, 204.54, "Part three: grammar."], [205.38, 208.85, "Grammar focus: Past perfect for background events."], [209.15, 210.47, "Look at the pattern."], [211.18, 213.96, "By December, the city had recovered from the flood."], [214.85, 218.09, "Before the storm arrived, officials had warned every family."], [218.98, 222.76, "When the vote began, many people had already decided who to support."], [223.7, 232.31, "Use had + past participle for the earlier of two past events. The later event uses the past simple: when the vote began, people had decided."], [233.05, 236.56, "Be careful! Don't say: When he arrived, we leave had."], [238.5, 240.49, "Say: When he arrived, we had left."], [240.79, 243.83, "Use had + past participle for the earlier event."], [244.63, 247.12, "Part four: reading. Read and listen."], [247.93, 248.92, "Looking Back."], [249.22, 253.82, "Every December, newspapers publish a retrospective of the year's top stories."], [254.83, 260.17, "A timeline shows what had happened before each turning point, such as the flood and the election."], [261.17, 267.51, "By the end of the year, many families had rebuilt their homes, and public reaction had changed from fear to hope."], [268.5, 272.15, "Editors ask about the long-term impact of each historic moment."], [273.13, 276.33, "The lessons learned help readers prepare for the year ahead."], [277.43, 281.56, "Part five: quiz. Five questions. Are you ready?"], [282.42, 284.78, "By December, the city blank from the flood."], [285.08, 289.38, "A, had recovered. B, recovers. C, has recover."], [292.93, 294.92, "The answer is A: had recovered."], [296.08, 298.62, "A list of events in time order is a blank."], [298.92, 303.21, "A, timeline. B, retrospective. C, turning point."], [306.77, 308.7, "The answer is A: timeline."], [309.85, 312.44, "A moment when things begin to change is a blank."], [312.74, 317.03, "A, top story. B, turning point. C, reaction."], [320.6, 322.94, "The answer is B: turning point."], [324.08, 325.85, "Choose the correct sentence."], [326.15, 336.49, "A, Before the storm came, officials warned had.. B, Before the storm came, officials had warned families.. C, Before the storm came, officials has warned.."], [340.03, 344.45, "The answer is B: Before the storm came, officials had warned families.."], [345.58, 348.88, "According to the reading, public reaction changed from fear to…"], [349.18, 352.65, "A, hope. B, anger. C, silence."], [356.2, 357.93, "The answer is A: hope."], [359.13, 362.49, "Part six: speaking. It's your turn to talk."], [363.35, 366.88, "What do you think will be remembered as this year's most important news story?"], [375.68, 377.14, "Now listen to Visal."], [377.44, 399.45, "I think the biggest story will be the recent flood, because it affected so many families. Before it happened, officials had warned people, so the response also showed how important preparation is. Its long-term impact may be better flood defences and stronger communities. I will remember the lessons learned."], [399.75, 401.52, "Excellent answer, Visal!"], [402.42, 407.36, "Great work! Now you can use eight new words and past perfect for background events."], [407.66, 413.41, "Today's value is remembrance. Remember the victims, so that history is never repeated."], [413.71, 416.15, "See you in Unit twenty. Goodbye!"], [416.45, 420.04, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-NP1-Unit20-Human-Interest-Stories": [[0.35, 5.62, "Hello, everyone! I'm Ms. Emma. Welcome to Online Newspaper Class, level one."], [5.92, 9.33, "Hi! I'm Visal. Let's learn together!"], [9.63, 16.53, "Unit twenty: Human-Interest Stories. Today you will describe people with adjectives and adverbs of manner."], [16.83, 19.53, "Here is our lesson map. Let's start!"], [20.47, 23.82, "Part one: words. You will learn eight new words."], [24.65, 25.81, "Human interest."], [26.82, 30.62, "Human interest means news about the personal lives and feelings of people."], [31.22, 34.22, "A human interest story touched thousands of readers."], [34.82, 37.84, "Your turn. Say: Human interest."], [40.7, 41.81, "Human interest."], [42.55, 43.48, "Profile."], [44.48, 47.88, "Profile means a short description of a person's life and work."], [48.48, 50.96, "The profile described her years as a nurse."], [51.55, 54.13, "Your turn. Say: Profile."], [56.97, 57.86, "Profile."], [58.62, 59.65, "Interview."], [60.65, 63.93, "Interview means a meeting where a reporter asks questions."], [64.52, 66.26, "The interview lasted an hour."], [66.85, 69.23, "Your turn. Say: Interview."], [72.1, 72.95, "Interview."], [73.72, 74.68, "Emotion."], [75.68, 79.28, "Emotion means a strong feeling such as joy or sadness."], [79.88, 81.8, "The story filled readers with emotion."], [82.42, 85.07, "Your turn. Say: Emotion."], [87.93, 88.9, "Emotion."], [89.65, 90.63, "Community."], [91.62, 95.3, "Community means a group of people who live in the same area."], [95.88, 98.19, "The community raised money for the school."], [98.78, 101.34, "Your turn. Say: Community."], [104.2, 105.22, "Community."], [105.98, 106.79, "Feature."], [107.78, 111.49, "Feature means a long, detailed article on a topic or person."], [112.08, 114.65, "The Sunday feature explored village life."], [115.25, 117.52, "Your turn. Say: Feature."], [120.37, 121.15, "Feature."], [121.88, 122.62, "Quote."], [123.62, 126.21, "Quote means the exact words that a person said."], [126.82, 128.66, "The quote gave the story life."], [129.25, 131.59, "Your turn. Say: Quote."], [134.43, 134.96, "Quote."], [135.72, 136.51, "Story."], [137.52, 139.74, "Story means an account of events or people."], [140.35, 142.12, "Every person has a story."], [142.72, 145.43, "Your turn. Say: Story."], [148.27, 149.1, "Story."], [149.9, 153.47, "Part two: dialogue. Let's listen to a conversation."], [154.32, 160.94, "Visal, a feature describes a 'quietly determined teacher who works tirelessly for her village'. Why these words?"], [162.05, 171.74, "Human interest writers use vivid adjectives for people and adverbs of manner for actions: quietly, tirelessly, bravely."], [172.85, 175.12, "How does a reporter find such a story?"], [176.22, 183.26, "Through an interview. A short quote from the person adds emotion and proves the details are real."], [184.35, 186.63, "Why do readers enjoy these stories?"], [187.72, 195.71, "Because a profile of one person makes a large issue feel personal, and the community sees itself in the story."], [196.87, 198.58, "Part three: grammar."], [199.42, 202.9, "Grammar focus: Adjectives and adverbs of manner."], [203.2, 204.35, "Look at the pattern."], [205.05, 208.13, "A determined teacher works tirelessly for her village."], [209.02, 211.74, "The shy farmer spoke softly during the interview."], [212.65, 214.79, "The brave volunteers acted quickly."], [215.73, 224.83, "Adjectives describe nouns (a determined teacher); adverbs of manner describe verbs and usually end in -ly (works tirelessly). Good → well is irregular."], [225.58, 229.87, "Be careful! Don't say: She speaks soft in interviews."], [231.83, 234.5, "Say: She speaks softly in interviews."], [234.8, 237.31, "Use an adverb (-ly) to describe a verb."], [238.1, 240.82, "Part four: reading. Read and listen."], [241.63, 242.9, "A Teacher's Story."], [243.2, 246.2, "A good human interest story begins with one person."], [247.2, 252.98, "In this profile, a determined teacher walks six kilometres every morning to reach a small school."], [254.0, 258.69, "She speaks gently in the interview, and one short quote moves readers to tears."], [259.7, 265.15, "The community now supports her work generously, and the feature has inspired new volunteers."], [266.13, 270.41, "Emotion, truth and detail together make a story unforgettable."], [271.5, 275.43, "Part five: quiz. Five questions. Are you ready?"], [276.28, 279.2, "A determined teacher works blank for her village."], [279.5, 284.34, "A, tirelessly. B, tireless. C, tireless-ly of."], [287.9, 290.13, "The answer is A: tirelessly."], [291.28, 293.76, "The exact words a person said are a blank."], [294.06, 297.43, "A, quote. B, feature. C, profile."], [301.0, 302.66, "The answer is A: quote."], [303.82, 306.62, "A short description of a person's life is a blank."], [306.92, 310.69, "A, profile. B, emotion. C, community."], [314.23, 316.31, "The answer is A: profile."], [317.45, 319.19, "Choose the correct sentence."], [319.49, 324.23, "A, She speaks gentle.. B, She speaks gently.. C, She gently speak.."], [327.77, 330.68, "The answer is B: She speaks gently.."], [331.85, 334.06, "According to the reading, the teacher walks…"], [334.36, 339.54, "A, six kilometres. B, ten kilometres. C, two kilometres."], [343.1, 345.61, "The answer is A: six kilometres."], [346.8, 350.17, "Part six: speaking. It's your turn to talk."], [351.02, 354.31, "Why do readers connect with stories about individual people?"], [363.12, 364.73, "Now listen to Visal."], [365.03, 387.07, "Readers connect with individual people because they can imagine the person's feelings. A story about one brave teacher is easier to remember than a list of statistics. It also shows how a large issue, such as education, affects real lives. This emotion can make readers care and even take action."], [387.37, 389.4, "Excellent answer, Visal!"], [390.32, 394.97, "Great work! Now you can use eight new words and adjectives and adverbs of manner."], [395.27, 399.69, "Today's value is compassion. Care about the suffering of others and help."], [400.0, 402.95, "See you in Unit twenty-one. Goodbye!"], [403.25, 406.45, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-NP1-Unit21-Transport-and-Road-Safety-News": [[0.35, 5.69, "Hello, everyone! I'm Ms. Emma. Welcome to Online Newspaper Class, level one."], [5.99, 9.47, "Hi! I'm Visal. Let's learn together!"], [9.77, 16.81, "Unit twenty-one: Transport and Road Safety News. Today you will describe numbers and amounts with quantifiers."], [17.11, 19.77, "Here is our lesson map. Let's start!"], [20.73, 24.34, "Part one: words. You will learn eight new words."], [25.18, 26.02, "Traffic."], [27.02, 29.71, "Traffic means the vehicles moving along a road."], [30.32, 32.66, "Heavy traffic slowed the morning commute."], [33.25, 36.1, "Your turn. Say: Traffic."], [38.93, 39.77, "Traffic."], [40.52, 41.65, "Road safety."], [42.65, 46.08, "Road safety means keeping people safe when they use roads."], [46.68, 49.05, "Road safety lessons begin at school."], [49.65, 52.96, "Your turn. Say: Road safety."], [55.8, 56.98, "Road safety."], [57.72, 58.54, "Helmet."], [59.55, 62.15, "Helmet means a hard hat that protects the head."], [62.75, 64.81, "A helmet saved the rider's life."], [65.42, 68.22, "Your turn. Say: Helmet."], [71.07, 72.0, "Helmet."], [72.75, 73.67, "Accident."], [74.68, 78.18, "Accident means an unexpected event that causes harm or damage."], [78.78, 80.53, "The accident closed the bridge."], [81.12, 84.0, "Your turn. Say: Accident."], [86.87, 87.67, "Accident."], [88.42, 89.69, "Infrastructure."], [90.68, 95.16, "Infrastructure means roads, bridges and other basic public structures."], [95.75, 98.06, "New infrastructure improved the city."], [98.65, 101.88, "Your turn. Say: Infrastructure."], [104.73, 106.26, "Infrastructure."], [107.02, 107.96, "Commuter."], [108.95, 112.59, "Commuter means a person who travels regularly to work or school."], [113.18, 115.36, "Every commuter waited at the station."], [115.95, 118.14, "Your turn. Say: Commuter."], [121.0, 121.84, "Commuter."], [122.58, 123.7, "Statistics."], [124.72, 127.95, "Statistics means numbers that describe facts about something."], [128.55, 130.91, "Statistics show that accidents are falling."], [131.52, 134.25, "Your turn. Say: Statistics."], [137.1, 138.46, "Statistics."], [139.22, 140.22, "Campaign."], [141.22, 144.06, "Campaign means an organised effort to achieve a goal."], [144.65, 147.14, "The helmet campaign reached every province."], [147.75, 150.34, "Your turn. Say: Campaign."], [153.2, 154.07, "Campaign."], [154.87, 158.38, "Part two: dialogue. Let's listen to a conversation."], [159.22, 166.92, "Visal, the report says 'A number of accidents involve motorbikes, and the majority of riders were not wearing helmets.' What do those phrases mean?"], [168.02, 176.57, "They are quantifiers. 'A number of' means several and 'the majority of' means more than half. They are common in statistics."], [177.68, 178.95, "Are there others?"], [180.05, 189.75, "Yes: a few, most, many, a large proportion of, hardly any. With plural nouns the verb is plural: most commuters use the bus."], [190.85, 192.69, "And with uncountable nouns?"], [193.78, 204.03, "Use much, a great deal of or little: 'Much of the infrastructure is old.' A road safety campaign can then target the problem."], [205.17, 207.01, "Part three: grammar."], [207.85, 210.8, "Grammar focus: Quantifiers in statistics."], [211.1, 212.24, "Look at the pattern."], [212.95, 215.81, "The majority of riders were not wearing helmets."], [216.72, 219.35, "A number of accidents involve motorbikes."], [220.25, 222.39, "Much of the infrastructure is old."], [223.33, 230.88, "Use many / a number of / the majority of with plural nouns, and much / a great deal of with uncountable nouns. The verb agrees with the noun."], [231.65, 234.93, "Be careful! Don't say: Much of the roads are old."], [236.87, 239.41, "Say: Many of the roads are old."], [239.71, 241.36, "Many goes with plural nouns."], [242.17, 244.87, "Part four: reading. Read and listen."], [245.67, 246.67, "On the Road."], [246.97, 251.34, "Statistics show that road accidents remain a serious problem in many cities."], [252.33, 256.69, "The majority of victims are motorbike riders, and many were not wearing a helmet."], [257.7, 262.95, "Much of the infrastructure is old, so heavy traffic makes every commute more dangerous."], [263.97, 267.7, "A number of campaigns now teach commuters about road safety."], [268.7, 271.77, "Better habits and better roads together can save lives."], [272.87, 276.76, "Part five: quiz. Five questions. Are you ready?"], [277.62, 280.39, "The majority of riders blank not wearing helmets."], [280.69, 283.63, "A, were. B, was. C, is."], [287.17, 288.74, "The answer is A: were."], [289.88, 292.39, "Roads and bridges are part of a country's blank."], [292.69, 296.59, "A, infrastructure. B, campaign. C, commuter."], [300.13, 302.82, "The answer is A: infrastructure."], [303.98, 306.31, "A hard hat that protects the head is a blank."], [306.61, 310.42, "A, helmet. B, statistic. C, traffic."], [313.97, 315.81, "The answer is A: helmet."], [316.95, 318.69, "Choose the correct sentence."], [318.99, 324.7, "A, Much of the roads are old.. B, Many of the roads are old.. C, Many of the road is old.."], [328.27, 331.07, "The answer is B: Many of the roads are old.."], [332.22, 335.92, "According to the reading, a number of blank teach road safety."], [336.22, 340.04, "A, campaigns. B, helmets. C, victims."], [343.6, 345.82, "The answer is A: campaigns."], [347.03, 350.44, "Part six: speaking. It's your turn to talk."], [351.28, 353.94, "What transport issue most affects your city?"], [362.75, 364.2, "Now listen to Visal."], [364.5, 385.89, "The transport issue that most affects my city is heavy traffic. Many commuters spend a long time on the road, and a number of accidents happen at busy junctions. Better public transport and safer infrastructure could help. If more people used buses, there would be fewer vehicles and fewer accidents."], [386.19, 387.76, "Excellent answer, Visal!"], [388.65, 393.22, "Great work! Now you can use eight new words and quantifiers in statistics."], [393.52, 397.68, "Today's value is road safety. Look left and right, and wear a helmet."], [397.98, 400.92, "See you in Unit twenty-two. Goodbye!"], [401.22, 403.92, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-NP1-Unit22-Agriculture-and-Rural-News": [[0.35, 5.69, "Hello, everyone! I'm Ms. Emma. Welcome to Online Newspaper Class, level one."], [5.99, 9.79, "Hi! I'm Visal. Let's learn together!"], [10.09, 16.98, "Unit twenty-two: Agriculture and Rural News. Today you will link causes and results with 'lead to' and 'result in'."], [17.28, 19.92, "Here is our lesson map. Let's start!"], [20.87, 24.07, "Part one: words. You will learn eight new words."], [24.92, 26.15, "Agriculture."], [27.15, 30.1, "Agriculture means the science and practice of farming."], [30.72, 32.88, "Agriculture feeds the whole country."], [33.48, 36.02, "Your turn. Say: Agriculture."], [38.87, 40.04, "Agriculture."], [40.78, 41.58, "Farmer."], [42.58, 46.12, "Farmer means a person who grows crops or raises animals."], [46.72, 48.79, "The farmer planted rice in June."], [49.38, 52.08, "Your turn. Say: Farmer."], [54.93, 55.73, "Farmer."], [56.48, 57.4, "Harvest."], [58.42, 60.88, "Harvest means the gathering of ripe crops."], [61.48, 63.59, "The harvest was larger than last year."], [64.18, 66.86, "Your turn. Say: Harvest."], [69.7, 70.57, "Harvest."], [71.32, 72.12, "Rice."], [73.12, 77.24, "Rice means a grain grown in flooded fields and eaten daily by millions."], [77.85, 79.98, "Rice is Cambodia's main crop."], [80.58, 83.32, "Your turn. Say: Rice."], [86.17, 87.13, "Rice."], [87.88, 88.67, "Drought."], [89.68, 92.52, "Drought means a long period with very little rain."], [93.12, 95.09, "Drought can lead to a poor harvest."], [95.68, 97.94, "Your turn. Say: Drought."], [100.8, 101.63, "Drought."], [102.38, 103.48, "Irrigation."], [104.48, 108.41, "Irrigation means supplying water to crops through channels or pipes."], [109.02, 111.72, "Irrigation protects the rice from dry weather."], [112.32, 114.8, "Your turn. Say: Irrigation."], [117.63, 118.69, "Irrigation."], [119.45, 120.65, "Market price."], [121.65, 124.95, "Market price means the price at which goods are sold at present."], [125.55, 128.06, "The market price of rice fell in July."], [128.65, 131.38, "Your turn. Say: Market price."], [134.23, 135.5, "Market price."], [136.25, 137.24, "Rural."], [138.25, 140.54, "Rural means connected with the countryside."], [141.15, 143.37, "Rural families depend on farming."], [143.98, 146.4, "Your turn. Say: Rural."], [149.27, 150.19, "Rural."], [151.0, 154.43, "Part two: dialogue. Let's listen to a conversation."], [155.28, 161.81, "Visal, the news says 'Drought could lead to a poor harvest and result in higher prices.' What do 'lead to' and 'result in' do?"], [162.92, 169.33, "They connect a cause with its effect. 'Drought leads to a poor harvest' means the drought is the cause."], [170.42, 172.37, "Which preposition comes after?"], [173.48, 183.89, "Both take a noun: lead to a shortage, result in higher prices. With 'result from' the order reverses: higher prices result from drought."], [184.98, 187.35, "Why does this matter to people in cities?"], [188.45, 195.35, "Because a poor harvest in rural areas changes the market price, so city families pay more for rice."], [196.5, 197.95, "Part three: grammar."], [198.82, 203.52, "Grammar focus: Cause and result: lead to and result in and result from."], [203.82, 204.95, "Look at the pattern."], [205.65, 207.66, "Drought can lead to a poor harvest."], [208.55, 210.93, "Poor irrigation results in lower yields."], [211.82, 214.28, "Higher prices result from a poor harvest."], [215.23, 224.18, "Cause + lead to / result in + effect. For 'result from', put the effect first: higher prices result from drought. Do not say 'result to'."], [224.92, 228.6, "Be careful! Don't say: Drought results to a poor harvest."], [230.57, 232.93, "Say: Drought results in a poor harvest."], [233.23, 235.45, "Say 'result in', not 'result to'."], [236.23, 238.83, "Part four: reading. Read and listen."], [239.63, 240.99, "From Field to Market."], [241.29, 245.13, "Agriculture news explains how rural life affects the whole country."], [246.13, 251.94, "A long drought can lead to a poor harvest, and a poor harvest may result in a high market price for rice."], [252.93, 257.39, "Irrigation helps farmers, because reliable water leads to steadier crops."], [258.4, 262.8, "City shoppers then pay less, which shows how rural events reach every table."], [263.8, 267.24, "Farmers therefore deserve attention in the daily news."], [268.33, 272.31, "Part five: quiz. Five questions. Are you ready?"], [273.15, 275.07, "Drought can blank a poor harvest."], [275.37, 279.62, "A, lead to. B, result of. C, cause to."], [283.17, 285.58, "The answer is A: lead to."], [286.75, 289.64, "Supplying water to crops through channels is blank."], [289.94, 293.35, "A, irrigation. B, harvest. C, rural."], [296.9, 299.21, "The answer is A: irrigation."], [300.35, 303.41, "The price at which goods are sold now is the blank price."], [303.71, 306.87, "A, market. B, rural. C, farm."], [310.43, 312.55, "The answer is A: market."], [313.68, 315.38, "Choose the correct sentence."], [315.68, 323.58, "A, Poor rain results to a bad harvest.. B, Poor rain results in a bad harvest.. C, Poor rain result a bad harvest.."], [327.13, 330.58, "The answer is B: Poor rain results in a bad harvest.."], [331.75, 334.88, "According to the reading, reliable water leads to steadier…"], [335.18, 338.97, "A, crops. B, cities. C, prices only."], [342.53, 344.32, "The answer is A: crops."], [345.53, 348.72, "Part six: speaking. It's your turn to talk."], [349.58, 352.31, "How does agriculture news affect people in cities?"], [361.12, 362.66, "Now listen to Visal."], [362.96, 384.5, "Agriculture news affects people in cities because food prices depend on farming. If a drought leads to a poor rice harvest, shops may charge more, and families have to spend more money. Good news about irrigation or a large harvest can keep prices steady. So city people should care about rural news too."], [384.8, 386.37, "Excellent answer, Visal!"], [387.28, 393.72, "Great work! Now you can use eight new words and cause and result: lead to and result in and result from."], [394.02, 398.91, "Today's value is food responsibility. Value food and the people who produce it."], [399.21, 402.46, "See you in Unit twenty-three. Goodbye!"], [402.76, 405.72, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-NP1-Unit23-Arts-and-Culture-News": [[0.35, 5.79, "Hello, everyone!
