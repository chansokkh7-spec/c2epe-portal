 I'm Ms. Emma. Welcome to Online Newspaper Class, level one."], [6.09, 8.9, "Hi! I'm Visal. Let's learn together!"], [9.2, 15.82, "Unit twenty-three: Arts and Culture News. Today you will express opinions with -ing and -ed adjectives."], [16.12, 18.63, "Here is our lesson map. Let's start!"], [19.57, 22.93, "Part one: words. You will learn eight new words."], [23.78, 24.67, "Arts."], [25.68, 29.6, "Arts means activities such as painting, music, dance and theatre."], [30.18, 32.34, "The arts bring joy to every community."], [32.95, 35.45, "Your turn. Say: Arts."], [38.3, 39.32, "Arts."], [40.08, 41.18, "Exhibition."], [42.18, 45.22, "Exhibition means a public display of works of art."], [45.82, 48.71, "The exhibition showed paintings from five provinces."], [49.32, 51.77, "Your turn. Say: Exhibition."], [54.63, 55.77, "Exhibition."], [56.52, 57.45, "Review."], [58.45, 62.57, "Review means an article giving an opinion about a book, show or film."], [63.18, 65.15, "The review praised the dancers."], [65.75, 68.7, "Your turn. Say: Review."], [71.57, 72.41, "Review."], [73.15, 74.23, "Performance."], [75.22, 78.02, "Performance means a show given in front of an audience."], [78.62, 80.89, "The performance ended with loud applause."], [81.48, 84.18, "Your turn. Say: Performance."], [87.03, 88.21, "Performance."], [88.95, 89.84, "Festival."], [90.85, 95.03, "Festival means a public celebration with music, food or events."], [95.62, 97.85, "The water festival attracted millions."], [98.45, 101.03, "Your turn. Say: Festival."], [103.87, 104.76, "Festival."], [105.52, 106.59, "Heritage."], [107.58, 111.17, "Heritage means traditions and objects handed down from the past."], [111.78, 114.2, "Heritage connects the present with history."], [114.82, 117.26, "Your turn. Say: Heritage."], [120.1, 121.11, "Heritage."], [121.85, 122.56, "Critic."], [123.55, 126.8, "Critic means a person who judges art, books or films."], [127.42, 129.69, "The critic admired the stage design."], [130.28, 132.45, "Your turn. Say: Critic."], [135.3, 136.12, "Critic."], [136.85, 137.83, "Audience."], [138.82, 142.3, "Audience means the people who watch or listen to a performance."], [142.92, 144.57, "The audience stood and cheered."], [145.18, 147.59, "Your turn. Say: Audience."], [150.43, 151.43, "Audience."], [152.23, 155.78, "Part two: dialogue. Let's listen to a conversation."], [156.62, 162.43, "Visal, a review says 'The performance was moving, and the audience was deeply moved.' Why -ing and -ed?"], [163.52, 174.73, "-ing adjectives describe the thing that causes a feeling: a moving performance. -ed adjectives describe the person who feels it: moved, amazed, bored."], [175.82, 177.65, "So the critic can choose either?"], [178.75, 187.23, "Yes, but the meaning changes. An astonishing exhibition makes people astonished. Reviews use both to show opinion."], [188.32, 191.18, "Why is heritage so common in culture news?"], [192.28, 200.67, "Because a festival or an exhibition can protect heritage, and critics help readers decide which events are worth visiting."], [201.83, 203.18, "Part three: grammar."], [204.02, 207.43, "Grammar focus: -ing and -ed adjectives in reviews."], [207.73, 208.78, "Look at the pattern."], [209.48, 211.1, "The performance was moving."], [211.98, 213.81, "The audience was deeply moved."], [214.72, 218.54, "The exhibition was astonishing, and visitors were astonished."], [219.5, 225.77, "Use -ing adjectives for the thing that causes a feeling (a boring film) and -ed adjectives for the person who feels it (I am bored)."], [226.52, 229.51, "Be careful! Don't say: The show was bored."], [231.47, 233.22, "Say: The show was boring."], [233.52, 235.65, "Use -ing for the thing causing the feeling."], [236.43, 239.03, "Part four: reading. Read and listen."], [239.83, 241.36, "A Night at the Festival."], [241.66, 246.01, "A cultural festival fills the city with colour, music and heritage."], [247.0, 251.14, "One critic called the dance performance oodbye!"], [387.84, 391.06, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-NP1-Unit24-Letters-to-the-Editor": [[0.35, 5.62, "Hello, everyone! I'm Ms. Emma. Welcome to Online Newspaper Class, level one."], [5.92, 9.21, "Hi! I'm Visal. Let's learn together!"], [9.51, 16.6, "Unit twenty-four: Letters to the Editor. Today you will write formal letters with 'I am writing to' and purpose infinitives."], [16.9, 19.54, "Here is our lesson map. Let's start!"], [20.5, 23.85, "Part one: words. You will learn eight new words."], [24.68, 25.48, "Letter."], [26.48, 30.2, "Letter means a written message sent to a person or a newspaper."], [30.82, 32.77, "The letter appeared on page ten."], [33.38, 35.87, "Your turn. Say: Letter."], [38.73, 39.76, "Letter."], [40.52, 41.41, "Editor."], [42.42, 45.81, "Editor means the person in charge of what a newspaper prints."], [46.42, 48.82, "The editor chose three letters for the weekend."], [49.42, 51.53, "Your turn. Say: Editor."], [54.4, 55.23, "Editor."], [55.98, 56.95, "Opinion."], [57.95, 60.84, "Opinion means what you think or believe about something."], [61.45, 63.26, "Everyone may share an opinion."], [63.85, 66.73, "Your turn. Say: Opinion."], [69.6, 70.52, "Opinion."], [71.28, 72.06, "Reader."], [73.05, 76.28, "Reader means a person who reads a newspaper or book."], [76.88, 78.93, "A reader wrote to praise the story."], [79.52, 81.82, "Your turn. Say: Reader."], [84.67, 85.64, "Reader."], [86.38, 87.3, "Respond."], [88.32, 90.99, "Respond means to answer or react to something."], [91.58, 93.4, "Please respond within one week."], [93.98, 96.58, "Your turn. Say: Respond."], [99.43, 100.43, "Respond."], [101.18, 102.41, "Concise."], [103.42, 106.79, "Concise means short and clear, using few words."], [107.38, 109.48, "A concise letter is easy to read."], [110.08, 112.67, "Your turn. Say: Concise."], [115.5, 116.67, "Concise."], [117.42, 118.27, "Argument."], [119.28, 122.07, "Argument means reasons used to support an idea."], [122.68, 125.14, "A clear argument persuades readers."], [125.75, 128.21, "Your turn. Say: Argument."], [131.07, 131.93, "Argument."], [132.68, 133.58, "Publish."], [134.58, 137.94, "Publish means to print or put something online for the public."], [138.55, 140.83, "The paper will publish the best letters."], [141.42, 144.07, "Your turn. Say: Publish."], [146.93, 147.82, "Publish."], [148.63, 151.99, "Part two: dialogue. Let's listen to a conversation."], [152.85, 155.37, "Visal, how should I start a letter to the editor?"], [156.48, 164.31, "Write 'Dear Editor,' and then 'I am writing to respond to your article on road safety.' The infinitive shows your purpose."], [165.42, 166.77, "What comes next?"], [167.85, 177.44, "State your opinion, give one clear argument with evidence, and end by asking for action: 'I hope the authorities will respond.'"], [178.55, 180.72, "Why is it important to be concise?"], [181.82, 188.25, "Editors have little space. A concise letter with a strong argument is more likely to be published."], [189.4, 191.04, "Part three: grammar."], [191.88, 194.92, "Grammar focus: Purpose: I am writing to plus verb."], [195.22, 196.3, "Look at the pattern."], [196.98, 200.13, "I am writing to respond to your article on road safety."], [201.02, 202.89, "I would like to share my opinion."], [203.78, 205.71, "Readers write to ask for action."], [206.67, 215.93, "Use 'to + base verb' to show purpose: I am writing to complain, to respond, to suggest. Do not use 'for + verb': not 'I write for complain'."], [216.68, 220.56, "Be careful! Don't say: I write for complain about noise."], [222.5, 225.34, "Say: I am writing to complain about noise."], [225.63, 227.73, "Use to + verb for purpose."], [228.53, 231.17, "Part four: reading. Read and listen."], [231.97, 233.07, "Dear Editor."], [233.37, 237.0, "A letter to the editor lets a reader respond to an article in public."], [238.0, 243.39, "The writer begins by saying, 'I am writing to share my opinion on your report about plastic waste.'"], [244.4, 248.29, "A concise letter then gives one clear argument supported by an example."], [249.3, 252.26, "It ends politely and asks the authorities to respond."], [253.27, 256.19, "If the editor likes the letter, the paper may publish it."], [257.3, 261.34, "Part five: quiz. Five questions. Are you ready?"], [262.18, 264.45, "I am writing blank respond to your article."], [264.75, 267.58, "A, to. B, for. C, that."], [271.13, 272.92, "The answer is A: to."], [274.08, 275.97, "Short and clear writing is blank."], [276.27, 279.82, "A, concise. B, published. C, rural."], [283.37, 285.34, "The answer is A: concise."], [286.48, 288.78, "To print something for the public is to blank it."], [289.08, 292.33, "A, publish. B, respond. C, argue."], [295.87, 297.67, "The answer is A: publish."], [298.82, 300.41, "Choose the correct sentence."], [300.71, 307.57, "A, I write for complain about noise.. B, I am writing to complain about noise.. C, I am writing complain noise.."], [311.13, 314.47, "The answer is B: I am writing to complain about noise.."], [315.62, 319.78, "According to the reading, a letter ends politely and asks the authorities to…"], [320.08, 324.4, "A, respond. B, resign. C, publish."], [327.97, 330.19, "The answer is A: respond."], [331.4, 335.02, "Part six: speaking. It's your turn to talk."], [335.85, 338.49, "What issue would you write a letter to the editor about?"], [347.28, 348.9, "Now listen to Visal."], [349.2, 366.78, "I would write a letter about plastic waste in rivers. I am concerned because it harms fish and spoils the beauty of our country. In the letter, I would give one clear argument and one example from my town. I would also ask the authorities to respond with a recycling plan."], [367.08, 368.79, "Excellent answer, Visal!"], [369.68, 375.17, "Great work! Now you can use eight new words and purpose: i am writing to plus verb."], [375.47, 381.14, "Today's value is civic responsibility. Take care of your city, because it is everyone's home."], [381.44, 384.46, "See you in Unit twenty-five. Goodbye!"], [384.76, 387.07, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-NP1-Unit25-Comparing-News-Sources": [[0.35, 5.82, "Hello, everyone! I'm Ms. Emma. Welcome to Online Newspaper Class, level one."], [6.12, 9.44, "Hi! I'm Visal. Let's learn together!"], [9.74, 17.1, "Unit twenty-five: Comparing News Sources. Today you will compare with whereas, similarly and in contrast."], [17.4, 19.83, "Here is our lesson map. Let's start!"], [20.77, 24.23, "Part one: words. You will learn eight new words."], [25.08, 26.02, "Source."], [27.02, 30.2, "Source means a person or document that provides information."], [30.82, 33.35, "Each source told a different part of the story."], [33.95, 36.63, "Your turn. Say: Source."], [39.47, 40.41, "Source."], [41.15, 42.07, "Outlet."], [43.08, 47.83, "Outlet means a newspaper, television channel or website that publishes news."], [48.45, 50.51, "Every outlet covered the election."], [51.12, 53.39, "Your turn. Say: Outlet."], [56.23, 57.11, "Outlet."], [57.85, 58.78, "Bias."], [59.78, 62.55, "Bias means an unfair preference for one side."], [63.15, 65.27, "Bias may appear in headlines."], [65.85, 68.62, "Your turn. Say: Bias."], [71.47, 72.38, "Bias."], [73.12, 74.2, "Perspective."], [75.18, 78.31, "Perspective means a particular way of looking at a topic."], [78.92, 81.31, "Each outlet shows a different perspective."], [81.92, 84.7, "Your turn. Say: Perspective."], [87.53, 88.49, "Perspective."], [89.25, 90.08, "Coverage."], [91.08, 94.79, "Coverage means the amount and kind of attention a story receives."], [95.38, 97.56, "Coverage of the storm lasted a week."], [98.15, 100.36, "Your turn. Say: Coverage."], [103.2, 104.31, "Coverage."], [105.05, 106.05, "Compare."], [107.05, 110.77, "Compare means to look at things to find similarities and differences."], [111.38, 113.7, "Compare two outlets before you decide."], [114.28, 116.6, "Your turn. Say: Compare."], [119.43, 120.27, "Compare."], [121.02, 121.8, "Framing."], [122.78, 126.08, "Framing means the way a story is presented to shape its meaning."], [126.68, 128.9, "Framing can change how readers feel."], [129.52, 132.11, "Your turn. Say: Framing."], [134.97, 135.78, "Framing."], [136.52, 137.45, "Reliable."], [138.45, 141.31, "Reliable means able to be trusted to be accurate."], [141.92, 144.58, "A reliable outlet corrects its mistakes."], [145.18, 148.0, "Your turn. Say: Reliable."], [150.83, 151.93, "Reliable."], [152.73, 157.03, "Part two: dialogue. Let's listen to a conversation."], [157.88, 166.69, "Visal, two outlets reported the same story. One headline says 'Protest grows', and the other says 'Protest causes chaos'. Why?"], [167.78, 176.75, "That is framing. The first outlet focuses on the crowd, whereas the second focuses on disorder. Their perspectives are different."], [177.85, 179.5, "Is it wrong to compare them?"], [180.62, 190.33, "No, it is smart. Similarly, you can compare the sources each outlet used. In contrast, one outlet may quote officials only."], [191.42, 193.56, "So how do I choose a reliable one?"], [194.65, 202.6, "Look for a named source, a correction policy and balanced coverage. Compare several outlets before judging."], [203.73, 205.15, "Part three: grammar."], [206.02, 210.14, "Grammar focus: Comparing with whereas and similarly and in contrast."], [210.44, 211.67, "Look at the pattern."], [212.38, 216.9, "Outlet A focuses on the crowd, whereas Outlet B focuses on disorder."], [217.82, 222.31, "Both outlets quote officials. Similarly, both use strong photographs."], [223.22, 226.86, "One headline is calm. In contrast, the other is dramatic."], [227.8, 237.28, "Whereas contrasts two ideas inside one sentence; similarly shows likeness and in contrast shows difference at the start of a sentence, followed by a comma."], [238.02, 241.66, "Be careful! Don't say: A is calm, whereas, B is loud."], [243.6, 245.98, "Say: A is calm, whereas B is loud."], [246.28, 248.71, "Whereas joins two clauses with a comma."], [249.5, 252.41, "Part four: reading. Read and listen."], [253.2, 254.92, "Two Outlets, One Story."], [255.22, 258.78, "When an event happens, each outlet gives its own coverage."], [259.77, 264.0, "Outlet A focuses on the crowd, whereas Outlet B focuses on the disorder."], [265.0, 269.46, "Similarly, both use official sources, but their framing and headlines differ."], [270.47, 275.6, "In contrast, a third outlet quotes ordinary people and offers a new perspective."], [276.6, 280.56, "A careful reader compares them all before deciding which source is reliable."], [281.67, 285.54, "Part five: quiz. Five questions. Are you ready?"], [286.38, 289.86, "Outlet A shows the crowd, blank Outlet B shows disorder."], [290.16, 293.9, "A, whereas. B, because. C, so."], [297.47, 299.52, "The answer is A: whereas."], [300.68, 303.75, "The way a story is presented to shape meaning is blank."], [304.05, 307.58, "A, coverage. B, framing. C, a source."], [311.13, 312.79, "The answer is B: framing."], [313.95, 316.96, "A particular way of looking at a topic is a blank."], [317.26, 321.05, "A, perspective. B, outlet. C, headline."], [324.6, 326.97, "The answer is A: perspective."], [328.12, 329.88, "Choose the correct sentence."], [330.18, 337.36, "A, In contrast, the other is dramatic.. B, In contrast the other dramatic is.. C, Whereas, the other is dramatic is.."], [340.9, 344.45, "The answer is A: In contrast, the other is dramatic.."], [345.62, 349.07, "According to the reading, a careful reader compares…"], [349.37, 354.17, "A, all outlets. B, no outlets. C, only one outlet."], [357.73, 360.29, "The answer is A: all outlets."], [361.5, 364.56, "Part six: speaking. It's your turn to talk."], [365.42, 368.97, "Why is it useful to read the same story in two different outlets?"], [377.78, 379.41, "Now listen to Visal."], [379.71, 400.34, "It is useful because every outlet has a different perspective. One may stress the facts that another leaves out, and their headlines may use different framing. By comparing them, I can notice bias and find the details that appear in both. As a result, I trust the information more and form my own opinion."], [400.64, 402.5, "Excellent answer, Visal!"], [403.42, 409.39, "Great work! Now you can use eight new words and comparing with whereas and similarly and in contrast."], [409.69, 414.84, "Today's value is critical thinking. Think carefully and give reasons for your opinions."], [415.14, 422.23, "Congratulations! You have finished Online Newspaper Class, level one. See you in Online Newspaper Class, level two!"], [422.53, 425.59, "Thank you, Ms. Emma! Bye, everyone!"]]};
        // English subtitles: added to the player with code, so no subtitle files are needed online.
        let subsOn = true;
        function addSubtitles(el) {
            const cues = SUBTITLES[(el.getAttribute('src') || '').split('/').pop().split('?')[0].replace('.mp4', '')]; const btn = document.getElementById('subs-btn');
            if (!cues || !el.addTextTrack || typeof VTTCue === 'undefined') { if (btn) btn.style.display = 'none'; return; }
            const tr = el.addTextTrack('subtitles', 'English', 'en');
            cues.forEach(c => { try { const q = new VTTCue(c[0], c[1], c[2]); q.line = -2; tr.addCue(q); } catch (e) {} });
            const apply = () => { tr.mode = subsOn ? 'showing' : 'hidden'; if (btn) btn.textContent = subsOn ? '💬 Subtitles: ON' : '💬 Subtitles: OFF'; };
            if (btn) btn.onclick = () => { subsOn = !subsOn; apply(); };
            apply();
        }
        function renderMp4Lesson(contentDiv, unitData) {
            contentDiv.innerHTML = `
                <h2 class="text-xl font-bold text-indigo-900 mb-2">📹 Video Lesson — Unit ${state.unit}: ${unitData.title}</h2>
                <p class="text-gray-600 mb-4">${ytCurrentConfig.checkpoints.length ? 'Watch the video. It will pause at a few points so you can answer a quick question!' : 'Watch Ms. Emma and Visal, then try the other learning modules!'}</p>
                <div class="relative bg-black rounded-2xl overflow-hidden" style="aspect-ratio:16/9;">
                    <video id="mp4-player" src="${ytCurrentConfig.mp4}" controls playsinline preload="metadata" class="w-full h-full" style="object-fit:contain;"></video>
                    <div id="checkpoint-overlay" class="absolute inset-0 bg-indigo-900/95 flex items-center justify-center p-6" style="display:none;"></div>
                </div>
                <p id="video-msg" class="text-sm text-gray-500 mt-3 text-center min-h-[1.25rem]">▶️ Press play to start the lesson!</p>
                <div class="text-center mt-2 flex justify-center gap-3 flex-wrap"><button id="subs-btn" class="bg-white border border-indigo-300 text-indigo-700 font-bold px-4 py-2 rounded-full shadow cursor-pointer">💬 Subtitles: ON</button><button onclick="nextLesson()" class="bg-emerald-700 hover:bg-emerald-800 text-white font-bold px-4 py-2 rounded-full shadow cursor-pointer">Next Lesson ▶️</button></div>`;
            const el = document.getElementById('mp4-player');
            addSubtitles(el);
            { const a = document.getElementById('footer-next-module'), b = document.getElementById('footer-next-lesson'); if (a) a.style.display = ''; if (b) b.style.display = 'none'; }
            ytPlayer = {
                getCurrentTime: () => el.currentTime,
                pauseVideo: () => el.pause(),
                playVideo: () => { const p = el.play(); if (p && p.catch) p.catch(() => {}); },
                destroy: () => { try { el.pause(); el.removeAttribute('src'); el.load(); } catch (e) {} }
            };
            el.addEventListener('play', () => { const m = document.getElementById('video-msg'); if (m) m.textContent = ''; });
            el.addEventListener('timeupdate', () => { if (ytCurrentConfig && ytCurrentConfig.checkpoints.length) checkVideoCheckpoints(); });
            el.addEventListener('ended', () => {
                const got = award(unitKey('video-' + ytCurrentConfig.id), 5);
                const m = document.getElementById('video-msg');
                if (m) m.textContent = '🎉 Great job watching the whole video!' + (got ? ' (+5 ⭐)' : '');
            });
            el.addEventListener('error', () => {
                const m = document.getElementById('video-msg');
                if (m) m.innerHTML = '⚠️ The video could not load. Check the internet, or <a href="' + ytCurrentConfig.mp4 + '" target="_blank" rel="noopener" class="text-indigo-600 underline font-semibold">open it here ↗</a>';
            });
        }

        function onYtStateChange(event) {
            const msg = document.getElementById('video-msg');
            if (event.data === YT.PlayerState.PLAYING) {
                if (ytPollInterval) clearInterval(ytPollInterval);
                if (ytCurrentConfig && ytCurrentConfig.checkpoints.length) ytPollInterval = setInterval(checkVideoCheckpoints, 400);
                if (msg) msg.textContent = '';
            } else if (event.data === YT.PlayerState.PAUSED || event.data === YT.PlayerState.ENDED) {
                if (ytPollInterval) { clearInterval(ytPollInterval); ytPollInterval = null; }
                if (event.data === YT.PlayerState.ENDED) {
                    const got = award(unitKey('video-' + ytCurrentConfig.id), 5);
                    markActivityComplete('video');
                    if (msg) msg.textContent = '🎉 Great job watching the whole video!' + (got ? ' (+5 ⭐)' : '');
                }
            }
        }

        function checkVideoCheckpoints() {
            if (!ytPlayer || typeof ytPlayer.getCurrentTime !== 'function' || !ytCurrentConfig) return;
            let t = 0;
            try { t = ytPlayer.getCurrentTime(); } catch (e) { return; }
            ytCurrentConfig.checkpoints.forEach((cp, idx) => {
                if (!ytAnsweredCheckpoints.has(idx) && t >= cp.time) {
                    ytAnsweredCheckpoints.add(idx);
                    showVideoCheckpoint(idx);
                }
            });
        }

        function showVideoCheckpoint(idx) {
            const cp = ytCurrentConfig.checkpoints[idx];
            ytPlayer.pauseVideo();
            if (ytPollInterval) { clearInterval(ytPollInterval); ytPollInterval = null; }
            const overlay = document.getElementById('checkpoint-overlay');
            overlay.style.display = 'flex';
            overlay.innerHTML = `
                <div class="bg-white rounded-2xl p-6 max-w-md w-full text-center">
                    <p class="text-sm font-bold text-indigo-600 mb-2">🤔 Quick Question!</p>
                    <p class="font-bold text-lg text-gray-800 mb-4">${cp.question}</p>
                    <div class="flex flex-col gap-2" id="checkpoint-options">
                        ${cp.options.map((opt, i) => `<button onclick="answerVideoCheckpoint(${idx}, ${i})" class="bg-indigo-50 hover:bg-indigo-100 text-indigo-900 font-semibold p-3 rounded-xl cursor-pointer">${opt}</button>`).join('')}
                    </div>
                    <p id="checkpoint-feedback" class="mt-3 font-bold min-h-[1.5rem]"></p>
                </div>`;
        }

        function answerVideoCheckpoint(idx, chosenIndex) {
            const cp = ytCurrentConfig.checkpoints[idx];
            const feedback = document.getElementById('checkpoint-feedback');
            const optionsDiv = document.getElementById('checkpoint-options');
            optionsDiv.querySelectorAll('button').forEach(b => b.disabled = true);
            if (chosenIndex === cp.correct) {
                feedback.className = 'mt-3 font-bold min-h-[1.5rem] text-green-600';
                feedback.textContent = award(unitKey('video-' + ytCurrentConfig.id + '-q' + idx), 2) ? '🎉 Correct! (+2 ⭐)' : '🎉 Correct!';
            } else {
                feedback.className = 'mt-3 font-bold min-h-[1.5rem] text-red-500';
                feedback.textContent = `❌ Not quite — the answer was "${cp.options[cp.correct]}"`;
            }
            const nextBtn = document.createElement('button');
            nextBtn.textContent = 'Next ▶️';
            nextBtn.className = 'mt-4 bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-6 py-2 rounded-full shadow cursor-pointer';
            nextBtn.onclick = resumeVideoAfterCheckpoint;
            feedback.insertAdjacentElement('afterend', nextBtn);
        }

        function resumeVideoAfterCheckpoint() {
            document.getElementById('checkpoint-overlay').style.display = 'none';
            if (ytPlayer) ytPlayer.playVideo();
        }

        function renderContent() {
            let contentDiv = document.getElementById('module-content');
            const unitData = curriculum[state.level][state.unit];
            stopVideo();                 // never leave a video playing in the background
            stopTalkTimer();             // ...or a Let's Talk timer running
            updateVideoTabBadge();
            // Always shows the real level and unit (it used to say "A1" on every level)
            document.getElementById('platform-info').textContent = `C2-EPE Newspaper Class - ${gradeName(state.level)} (Unit ${state.unit}: ${unitData.title})`;
            if (state.tab === 'video') { renderVideoLesson(contentDiv); return; }

            if (state.tab === 'learn') renderLearn(contentDiv, unitData);
            else if (state.tab === 'terms') renderTerms(contentDiv, unitData);
            else if (state.tab === 'quiz') renderQuiz(contentDiv, unitData);
            else if (state.tab === 'think') renderThink(contentDiv, unitData);
            else if (state.tab === 'funfact') renderFunFact(contentDiv, unitData);
            else if (state.tab === 'vocabgame') renderVocabGame(contentDiv, unitData);
            else if (state.tab === 'spelling') renderSpelling(contentDiv, unitData);
            else if (state.tab === 'sentence') renderSentenceBuilding(contentDiv, unitData);

            else if (state.tab === 'headline') renderHeadlineWriting(contentDiv, unitData);
            else if (state.tab === 'factopinion') renderFactOpinion(contentDiv, unitData);
            else if (state.tab === 'debate') renderDebateCorner(contentDiv, unitData);

            else if (state.tab === 'dictation') renderDictation(contentDiv, unitData);
            else if (state.tab === 'review') renderReview(contentDiv, unitData);
            else if (state.tab === 'pronunciation') renderPronunciationDrill(contentDiv, unitData);
            else if (state.tab === 'exam') renderExamPractice(contentDiv, unitData);
            else if (state.tab === 'challenge') renderGoal(contentDiv, unitData);
            else if (state.tab === 'codelab') renderCodeLab(contentDiv, unitData);
        }

        // ===== MY PROGRESS =====
        const ALL_TABS = ['video','learn','terms','quiz','think','funfact','vocabgame','spelling','sentence','summary','headline','factopinion','debate','discussion','dictation','review','pronunciation','exam','challenge'];
        function markActivityComplete(tab) {
            progress.completed = progress.completed || {};
            const key = state.level + '_' + state.unit + '_' + tab;
            if (!progress.completed[key]) { progress.completed[key] = true; saveProgress(); }
        }
        function showMyProgress() {
            const lines = LEVELS_ORDER.map(lvl => {
                let data = null;
                if (lvl === state.level) data = progress;
                else { try { data = JSON.parse(localStorage.getItem(PROGRESS_PREFIX + lvl) || 'null'); } catch (e) {} }
                const done = data && data.completed ? Object.keys(data.completed).filter(k => k.startsWith(lvl + '_')).length : 0;
                const total = Object.keys(curriculum[lvl]).length * ALL_TABS.length;
                return `${gradeName(lvl)}: ${done} / ${total} activities (${Math.round(done / total * 100)}%)${lvl === state.level ? ' ← current' : ''}`;
            }).join('\n');
            const unitDone = ALL_TABS.filter(t => progress.completed && progress.completed[state.level + '_' + state.unit + '_' + t]).length;
            alert(`📊 My Progress\n\n⭐ Stars: ${state.stars}\n🏆 Badges: ${state.badges}\n\nThis unit (Unit ${state.unit}): ${unitDone} / ${ALL_TABS.length} modules done\n\n${lines}\n\n(Saved on this device/browser only. Inside the Hub, progress lasts until the page is closed.)`);
        }

        // ===== 1. LEARN =====
        function renderLearn(contentDiv, unitData) {
            contentDiv.innerHTML = `
                <h2 class="text-xl font-bold text-slate-900 mb-2">📖 Learn: ${unitData.title}</h2>

                    <div class="flex gap-3 flex-wrap items-center">
                        <button onclick="readPassageAloud()" class="bg-slate-600 hover:bg-slate-700 text-white font-bold px-5 py-2 rounded-full shadow cursor-pointer">🔊 Read Aloud</button>
                        <button onclick="finishReading()" class="bg-white border border-slate-300 text-slate-800 font-bold px-5 py-2 rounded-full shadow cursor-pointer">✅ I read it</button>
                    </div>
                    <p id="learn-msg" class="text-sm mt-3 font-semibold text-green-600 min-h-[1.25rem]"></p>
                </div>`;
        }
        // Reading counts as done after listening OR tapping "I read it" (listening used to be the
        // only way, and speech doesn't work in every browser)
        function finishReading() {
            markActivityComplete('learn');
            document.getElementById('learn-msg').textContent = '✅ Well done!' + (award(unitKey('learn'), 2) ? ' (+2 ⭐)' : '');
        }
        function readPassageAloud() {
