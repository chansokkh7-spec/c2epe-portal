 words."], [24.45, 25.78, "Policy premium."], [26.78, 30.95, "Policy premium means the amount paid regularly for insurance cover."], [31.55, 33.72, "The policy premium is paid monthly."], [34.32, 37.54, "Your turn. Say: Policy premium."], [40.4, 41.74, "Policy premium."], [42.48, 43.7, "Risk assessment."], [44.72, 48.81, "Risk assessment means the process of judging how likely a loss is."], [49.42, 51.83, "A risk assessment decides the price."], [52.45, 55.75, "Your turn. Say: Risk assessment."], [58.6, 59.84, "Risk assessment."], [60.58, 62.0, "Claim process."], [63.02, 67.04, "Claim process means the steps for asking an insurer to pay for a loss."], [67.65, 70.09, "The claim process takes about two weeks."], [70.68, 73.67, "Your turn. Say: Claim process."], [76.53, 77.95, "Claim process."], [78.72, 79.76, "Underwriting."], [80.75, 85.11, "Underwriting means evaluating risk to decide whether to offer insurance."], [85.72, 88.1, "Underwriting rejected the risky applicant."], [88.68, 91.13, "Your turn. Say: Underwriting."], [93.97, 94.98, "Underwriting."], [95.72, 96.73, "Deductible."], [97.72, 101.55, "Deductible means the amount you pay yourself before insurance pays."], [102.15, 104.43, "A higher deductible lowers the premium."], [105.02, 107.59, "Your turn. Say: Deductible."], [110.43, 111.66, "Deductible."], [112.42, 113.62, "Coverage limit."], [114.62, 118.6, "Coverage limit means the maximum amount an insurer will pay."], [119.22, 121.81, "The coverage limit was ten thousand dollars."], [122.42, 125.25, "Your turn. Say: Coverage limit."], [128.1, 129.3, "Coverage limit."], [130.05, 131.1, "Actuary."], [132.08, 136.52, "Actuary means an expert who calculates risk and insurance costs."], [137.12, 139.93, "An actuary studies accident statistics."], [140.52, 143.27, "Your turn. Say: Actuary."], [146.13, 147.19, "Actuary."], [147.95, 149.39, "Insurance fraud."], [150.38, 154.54, "Insurance fraud means lying to an insurer to get money you do not deserve."], [155.15, 158.07, "Insurance fraud raises premiums for everyone."], [158.68, 161.43, "Your turn. Say: Insurance fraud."], [164.27, 166.15, "Insurance fraud."], [166.97, 170.79, "Part two: dialogue. Let's listen to a conversation."], [171.65, 177.91, "Visal, my policy says 'The insurer will pay provided that you report the loss within a week.' What does 'provided that' mean?"], [179.02, 187.07, "It means 'only if'. Provided that, as long as and on condition that set a condition for something to happen."], [188.18, 189.57, "And 'unless'?"], [190.68, 198.64, "Unless means 'if not'. 'Unless you pay the premium, your cover will end.' We do not add a second negative."], [199.75, 201.88, "So the claim process has conditions?"], [202.98, 213.11, "Always. As long as the damage is within the coverage limit and there is no insurance fraud, the claim will be paid after the deductible."], [214.27, 215.98, "Part three: grammar."], [216.82, 220.93, "Grammar focus: Conditions: unless and provided that and as long as."], [221.23, 222.52, "Look at the pattern."], [223.22, 226.4, "The insurer will pay provided that you report the loss within a week."], [227.32, 229.88, "Your cover will end unless you pay the premium."], [230.78, 234.18, "A claim is paid as long as it is within the coverage limit."], [235.13, 242.42, "Unless = if not, so never add a negative: 'unless you pay', not 'unless you don't pay'. Provided that and as long as mean 'only if'."], [243.18, 247.16, "Be careful! Don't say: Unless you don't pay, cover ends."], [249.1, 252.05, "Say: Unless you pay, cover ends."], [252.35, 254.22, "Unless already means 'if not'."], [255.03, 257.6, "Part four: reading. Read and listen."], [258.4, 259.71, "Reading the Small Print."], [260.01, 263.89, "An insurance policy is a promise that depends on conditions."], [264.9, 270.38, "An insurer will pay a claim provided that the loss is reported quickly and falls within the coverage limit."], [271.37, 274.61, "Unless you pay the policy premium, the cover will end."], [275.6, 280.7, "Underwriting and risk assessment decide the price, as long as the information given is honest."], [281.7, 285.31, "Insurance fraud, however, makes honest customers pay more."], [286.4, 290.22, "Part five: quiz. Five questions. Are you ready?"], [291.05, 293.42, "Your cover will end blank you pay the premium."], [293.72, 297.4, "A, unless. B, if not. C, provided."], [300.93, 302.97, "The answer is A: unless."], [304.12, 307.65, "The maximum amount an insurer will pay is the blank limit."], [307.95, 311.64, "A, coverage. B, premium. C, claim."], [315.2, 317.05, "The answer is A: coverage."], [318.18, 320.94, "An expert who calculates risk is an blank."], [321.24, 325.6, "A, actuary. B, underwriter's deductible. C, agent."], [329.13, 331.16, "The answer is A: actuary."], [332.32, 334.03, "Choose the correct sentence."], [334.33, 340.78, "A, Unless you don't pay, cover ends.. B, Unless you pay, cover ends.. C, Unless pay you, cover ends.."], [344.33, 347.33, "The answer is B: Unless you pay, cover ends.."], [348.48, 351.83, "According to the reading, fraud makes honest customers pay…"], [352.13, 355.35, "A, more. B, less. C, nothing."], [358.9, 360.49, "The answer is A: more."], [361.7, 364.9, "Part six: speaking. It's your turn to talk."], [365.75, 370.5, "Why do insurance companies employ actuaries to study statistics and risk?"], [379.32, 380.86, "Now listen to Visal."], [381.16, 408.47, "Insurance companies employ actuaries because prices must match the real chance of loss. If premiums are too low, the company loses money; if they are too high, customers go elsewhere. Actuaries use statistics on accidents, illness and disasters to calculate fair premiums. As long as the calculations are accurate, both customers and insurers are protected."], [408.77, 410.45, "Excellent answer, Visal!"], [411.35, 417.64, "Great work! Now you can use eight new words and conditions: unless and provided that and as long as."], [417.94, 422.33, "Today's Be careful! Don't say: She saved so that to buy a shop."], [241.17, 244.14, "Say: She saved so that she could buy a shop."], [244.44, 246.0, "So that needs a clause."], [246.8, 249.15, "Part four: reading. Read and listen."], [249.97, 251.33, "A Bakery Grows."], [251.63, 255.25, "A local entrepreneur opened a small bakery with her own savings."], [256.27, 261.2, "She took a business loan in order to buy a second oven and so as to serve more customers."], [262.2, 266.31, "She watched her cash flow carefully so that she could always pay suppliers."], [267.3, 272.11, "Because neighbours bought bread every day, her customer base grew, and she made a hiring decision."], [273.1, 275.8, "Community support helped her begin scaling up."], [276.9, 280.82, "Part five: quiz. Five questions. Are you ready?"], [281.68, 283.9, "She took a loan blank buy a second oven."], [284.2, 287.89, "A, in order to. B, in order for. C, for."], [291.43, 293.38, "The answer is A: in order to."], [294.52, 297.63, "The money moving into and out of a business is cash blank."], [297.93, 301.1, "A, flow. B, base. C, budget."], [304.63, 306.33, "The answer is A: flow."], [307.48, 309.49, "Making a business bigger is blank."], [309.79, 313.85, "A, scaling up. B, hiring. C, supporting."], [317.4, 319.46, "The answer is A: scaling up."], [320.62, 322.35, "Choose the correct sentence."], [322.65, 330.37, "A, She saved so that she can buy a shop.. B, She saved so that she could buy a shop.. C, She saved so that to buy a shop.."], [333.9, 337.24, "The answer is B: She saved so that she could buy a shop.."], [338.38, 342.43, "According to the reading, her customer base grew because neighbours bought bread…"], [342.73, 346.67, "A, every day. B, once a year. C, online."], [350.23, 352.57, "The answer is A: every day."], [353.77, 356.67, "Part six: speaking. It's your turn to talk."], [357.52, 361.26, "How can a community help a small local business succeed?"], [370.05, 371.38, "Now listen to Visal."], [371.68, 396.22, "A community can help by buying from local shops regularly, which gives a small business steady income. People can also recommend it to friends so that its customer base grows. In addition, local officials can offer training or simple loans so that owners can expand. Community support is often the difference between failure and success."], [396.52, 398.23, "Excellent answer, Visal!"], [399.12, 405.06, "Great work! Now you can use eight new words and purpose clauses: in order to and so as to and so that."], [405.36, 409.87, "Today's value is community spirit. Help and care for people in your town."], [410.17, 413.03, "See you in Unit seventeen. Goodbye!"], [413.33, 416.78, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-NP2-Unit17-Economic-Indicators": [[0.35, 6.0, "Hello, everyone! I'm Ms. Emma. Welcome to Online Newspaper Class, level two."], [6.3, 10.48, "Hi! I'm Visal. Let's learn together!"], [10.78, 17.98, "Unit seventeen: Economic Indicators. Today you will make predictions with the future perfect and future continuous."], [18.28, 20.78, "Here is our lesson map. Let's start!"], [21.73, 25.26, "Part one: words. You will learn eight new words."], [26.12, 27.66, "Gross domestic product."], [28.65, 33.38, "Gross domestic product means the total value of goods and services a country produces."], [33.98, 36.84, "Gross domestic product rose by five percent."], [37.45, 40.62, "Your turn. Say: Gross domestic product."], [43.47, 44.98, "Gross domestic product."], [45.72, 46.91, "Inflation rate."], [47.92, 50.96, "Inflation rate means how fast prices are rising."], [51.55, 53.98, "The inflation rate fell to two percent."], [54.58, 57.53, "Your turn. Say: Inflation rate."], [60.37, 61.75, "Inflation rate."], [62.52, 64.24, "Consumer price index."], [65.25, 69.62, "Consumer price index means a measure of the average price of everyday goods."], [70.22, 73.14, "The consumer price index guides wage talks."], [73.75, 77.71, "Your turn. Say: Consumer price index."], [80.5  will be recovering.'"], [207.98, 210.28, "Which indicators do analysts watch?"], [211.38, 222.73, "Gross domestic product, the inflation rate, the consumer price index and leading indicators. A recession signal makes forecasts more cautious."], [223.87, 225.68, "Part three: grammar."], [226.52, 230.81, "Grammar focus: Future perfect and future continuous."], [231.12, 232.3, "Look at the pattern."], [233.02, 236.21, "By next year, the economy will have grown by three percent."], [237.12, 240.43, "This time next year, the economy will be recovering slowly."], [241.32, 244.48, "By June, inflation will have fallen below two percent."], [245.43, 253.94, "Future perfect = will have + past participle (finished by a future time). Future continuous = will be + -ing (in progress at a future time)."], [254.68, 258.37, "Be careful! Don't say: By June, inflation will fall."], [260.33, 263.0, "Say: By June, inflation will have fallen."], [263.3, 266.08, "Use the future perfect for completed actions."], [266.9, 269.66, "Part four: reading. Read and listen."], [270.47, 271.79, "Reading the Numbers."], [272.09, 275.82, "Economists use indicators to read the health of an economy."], [276.83, 282.24, "Gross domestic product measures output, while the consumer price index measures the cost of everyday goods."], [283.23, 287.73, "By next year, the inflation rate will have fallen, if the interest rate decision succeeds."], [288.73, 294.33, "A leading indicator such as new orders may be a recession signal long before unemployment figures change."], [295.33, 297.66, "No single number tells the whole story."], [298.77, 302.76, "Part five: quiz. Five questions. Are you ready?"], [303.62, 306.63, "By next year, the economy blank by three percent."], [306.93, 311.32, "A, will have grown. B, will grow have. C, has will grown."], [314.87, 316.75, "The answer is A: will have grown."], [317.92, 321.88, "A measure that signals change before it happens is a blank indicator."], [322.18, 325.44, "A, ental impact."], [145.22, 146.43, "Stakeholder value."], [147.42, 152.44, "Stakeholder value means benefit for everyone affected by a company, not only owners."], [153.05, 155.94, "Stakeholder value includes workers and neighbours."], [156.55, 159.28, "Your turn. Say: Stakeholder value."], [162.13, 163.51, "Stakeholder value."], [164.25, 165.99, "Long-term sustainability."], [166.98, 172.49, "Long-term sustainability means the ability of a business to continue without exhausting resources."], [173.08, 176.52, "Long-term sustainability protects future profits."], [177.12, 180.77, "Your turn. Say: Long-term sustainability."], [183.63, 186.36, "Long-term sustainability."], [187.17, 191.06, "Part two: dialogue. Let's listen to a conversation."], [191.92, 199.21, "Visal, a news analysis says 'Large firms may soon be required to report their carbon footprint.' What does 'be required to' show?"], [200.32, 209.67, "A legal or formal obligation. Be required to, be obliged to and be bound by all describe duties that come from a rule."], [210.78, 212.32, "Is it different from must?"], [213.42, 226.83, "Must is direct. The passive forms sound more formal and let us omit the person who makes the rule: 'Companies are obliged to disclose their environmental impact.'"], [227.95, 229.28, "And 'be bound to'?"], [230.38, 238.98, "Be bound to + verb means 'certain to'. 'Weak corporate responsibility is bound to damage long-term sustainability.'"], [240.13, 241.85, "Part three: grammar."], [242.72, 247.79, "Grammar focus: Obligation: be required to and be obliged to and be bound to."], [248.09, 249.29, "Look at the pattern."], [249.98, 253.53, "Large firms may be required to report their carbon footprint."], [254.42, 258.49, "Companies are obliged to disclose their environmental impact."], [259.38, 262.24, "Weak responsibility is bound to damage the brand."], [263.2, 270.71, "Be required/obliged to + base verb states a duty. Be bound to + base verb means 'certain to'. Do not add 'must' 5, 412.25, "Now listen to Visal."], [412.55, 440.22, "I believe companies should be required by law to reduce their environmental impact, because voluntary action is often too slow and uneven. A legal duty creates fair competition, since every firm follows the same rule. On the other hand, regulation should be realistic, with enough time and support for small businesses. Overall, I think clear laws would protect everyone's future."], [440.52, 442.2, "Excellent answer, Visal!"], [443.08, 449.72, "Great work! Now you can use eight new words and obligation: be required to and be obliged to and be bound to."], [450.02, 456.45, "Today's value is environmental responsibility. Small green actions at home help the whole planet."], [456.75, 459.22, "See you in Unit nineteen. Goodbye!"], [459.52, 462.07, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-NP2-Unit19-Global-Trade-Disputes": [[0.35, 5.44, "Hello, everyone! I'm Ms. Emma. Welcome to Online Newspaper Class, level two."], [5.74, 9.25, "Hi! I'm Visal. Let's learn together!"], [9.55, 18.18, "Unit nineteen: Global Trade Disputes. Today you will use verbs with dependent prepositions: impose on, retaliate against, ban on."], [18.48, 21.23, "Here is our lesson map. Let's start!"], [22.2, 25.47, "Part one: words. You will learn eight new words."], [26.32, 27.4, "Trade war."], [28.38, 32.62, "Trade war means a conflict in which countries raise tariffs against each other."], [33.22, 35.67, "The trade war disrupted many industries."], [36.28, 39.05, "Your turn. Say: Trade war."], [41.9, 42.75, "Trade war."], [43.52, 45.16, "Retaliatory tariff."], [46.15, 51.48, "Retaliatory tariff means a tax placed on imports as a response to another country's tariff."], [52.08, 54.93, "A retaliatory tariff hit farm exports."], [55.52, 58.8, "Your turn. Say: Retaliatory tariff."], [61.63, 63.31, "Retaliatory tariff."], [64.05, 66.21, "World Trade Organization."], [67.22, 71.9, "World Trade Organization means the international body that supervises ogether."], [202.05, 203.96, "Why do they matter in trade news?"], [205.05, 216.62, "Precision. 'A ban on exports' is correct; 'a ban of exports' is not. Writers also say sanctions against a country and an agreement between two states."], [217.72, 219.36, "How does a trade war end?"], [220.45, 229.97, "Usually through trade negotiation. The World Trade Organization may rule on the dispute, or a bilateral agreement removes the tariffs."], [231.13, 232.77, "Part three: grammar."], [233.62, 237.08, "Grammar focus: Dependent prepositions in trade English."], [237.38, 238.6, "Look at the pattern."], [239.32, 241.94, "The state imposed a tariff on imported steel."], [242.85, 245.22, "Its partner retaliated against the move."], [246.12, 248.89, "The export ban on grain caused shortages."], [249.83, 259.2, "Learn the preposition with the word: impose ON, retaliate AGAINST, a ban ON, a dispute OVER, sanctions AGAINST. Do not translate prepositions word for word."], [259.95, 264.01, "Be careful! Don't say: The state imposed a tariff of steel."], [265.97, 268.62, "Say: The state imposed a tariff on steel."], [268.92, 271.06, "Impose takes the preposition on."], [271.87, 274.65, "Part four: reading. Read and listen."], [275.43, 277.41, "When Trade Turns Into a Fight."], [277.71, 282.24, "A trade war begins when one country imposes a tariff on another country's goods."], [283.23, 289.3, "The partner often retaliates against the move with a retaliatory tariff, and an import restriction may follow."], [290.3, 294.57, "An export ban on grain or fuel can quickly raise prices worldwide."], [295.57, 301.44, "The World Trade Organization may rule on the dispute, but a bilateral agreement is usually the real solution."], [302.43, 305.27, "Patient trade negotiation is cheaper than conflict."], [306.37, 310.4, "Part five: quiz. Five questions. Are you ready?"], [311.25, 313.99, "The state imposed a tariff blank imported steel."], [314.29, 316.77, "A, on. B, at. C, of."], [320.33, 321.79, ng whose and where."], [16.64, 19.24, "Here is our lesson map. Let's start!"], [20.2, 23.66, "Part one: words. You will learn eight new words."], [24.52, 25.66, "Inflation."], [26.65, 29.95, "Inflation means a general rise in prices over time."], [30.55, 32.84, "Inflation made food more expensive."], [33.45, 36.15, "Your turn. Say: Inflation."], [39.0, 40.07, "Inflation."], [40.82, 41.8, "Prices."], [42.78, 46.28, "Prices means the amounts of money asked for goods and services."], [46.88, 48.84, "Prices rose in every market."], [49.45, 51.93, "Your turn. Say: Prices."], [54.77, 55.74, "Prices."], [56.48, 58.19, "Consumer Price Index."], [59.18, 64.07, "Consumer Price Index means a measure of changes in the average price of household goods."], [64.68, 67.66, "The Consumer Price Index rose by two percent."], [68.25, 72.23, "Your turn. Say: Consumer Price Index."], [75.07, 77.01, "Consumer Price Index."], [77.75, 78.87, "Interest rate."], [79.88, 83.11, "Interest rate means the percentage charged for borrowing money."], [83.72, 86.09, "The interest rate was raised to fight inflation."], [86.68, 89.53, "Your turn. Say: Interest rate."], [92.37, 93.51, "Interest rate."], [94.25, 95.72, "Purchasing power."], [96.72, 99.91, "Purchasing power means the amount of goods your money can buy."], [100.52, 102.93, "Inflation reduces purchasing power."], [103.55, 106.63, "Your turn. Say: Purchasing power."], [109.47, 110.91, "Purchasing power."], [111.65, 112.59, "Wages."], [113.58, 116.22, "Wages means money paid to workers for their work."], [116.82, 119.26, "Wages did not keep up with prices."], [119.85, 122.08, "Your turn. Say: Wages."], [124.93, 125.93, "Wages."], [126.68, 127.67, "Central bank."], [128.68, 132.83, "Central bank means the national bank that controls money and interest rates."], [133.42, 136.09, "The central bank watches inflation closely."], [136.68, 139.19, "Your turn. Say: Central bank."], [142.03, 143.22, "Central bank."], [143.98, 145.16, "Cost of living."], [146.15, 149.89, "Cost of living means the amount of money needed to pay for basic needs."], [150.48, 152.85, "The cost of living is higher in the capital."], [153.45, 156.11, "Your turn. Say: Cost of living."], [158.97, 160.21, "Cost of living."], [161.0, 164.63, "Part two: dialogue. Let's listen to a conversation."], [165.48, 171.14, "Visal, a news story says 'Families whose wages have not risen are struggling.' What does 'whose' do?"], [172.25, 179.81, "It shows possession in a relative clause. 'Families whose wages have not risen' means 'the families' wages have not risen'."], [180.92, 181.91, "And 'where'?"], [183.02, 191.32, "Where refers to a place: 'The market where prices rose fastest is in the capital.' It replaces in which."], [192.42, 194.45, "How does this help in economic news?"], [195.55, 204.21, "It lets reporters add detail: a central bank whose main goal is stable prices, or a country where the cost of living is soaring."], [205.37, 207.11, "Part three: grammar."], [207.95, 211.4, "Grammar focus: Relative clauses with whose and where."], [211.7, 212.91, "Look at the pattern."], [213.62, 216.44, "Families whose wages have not risen are struggling."], [217.35, 220.48, "The market where prices rose fastest is in the capital."], [221.38, 225.19, "A central bank whose goal is stable prices may raise the interest rate."], [226.13, 235.06, "Whose + noun shows possession for people, things and organisations. Where replaces 'in which' for places. Do not add a possessive pronoun again."], [235.82, 240.31, "Be careful! Don't say: Families whose their wages fell."], [242.27, 244.86, "Say: Families whose wages fell."], [245.16, 247.35, "Do not repeat a possessive after whose."], [248.17, 251.28, "Part four: reading. Read and listen."], [252.1, 253.59, "When Prices Climb."], [253.89, 258.61, "Inflation is a general rise in prices, and the Consumer Price Index measures it."], [259.6, 263.45, "Families whose wages have not risen lose purchasing power every month."], [264.43, 269.73, "A central bank whose main goal is stable prices may raise the interest rate to slow inflation."], [270.73, 274.47, "In cities where the cost of living is highest, the pressure is greatest."], [275.47, 279.13, "Good policy therefore protects the people whose incomes are lowest."], [280.23, 284.29, "Part five: quiz. Five questions. Are you ready?"], [285.15, 288.06, "Families blank wages have not risen are struggling."], [288.36, 291.81, "A, whose. B, who. C, which."], [295.37, 297.15, "The answer is A: whose."], [298.28, 301.91, "The market blank prices rose fastest is in the capital."], [302.21, 305.43, "A, where. B, whose. C, who."], [308.97, 310.48, "The answer is A: where."], [311.62, 314.17, "The amount your money can buy is your blank power."], [314.47, 317.88, "A, purchasing. B, interest. C, wage."], [321.43, 323.35, "The answer is A: purchasing."], [324.52, 326.33, "Choose the correct sentence."], [326.63, 335.01, "A, A bank whose its goal is stable prices.. B, A bank whose goal is stable prices.. C, A bank which goal is stable prices.."], [338.57, 342.52, "The answer is B: A bank whose goal is stable prices.."], [343.68, 347.72, "According to the reading, good policy protects people whose incomes are…"], [348.01, 351.59, "A, lowest. B, highest. C, average."], [355.13, 356.82, "The answer is A: lowest."], [358.03, 361.16, "Part six: speaking. It's your turn to talk."], [362.02, 364.2, "How does inflation affect families?"], [373.02, 374.49, "Now listen to Visal."], [374.79, 400.92, "Inflation reduces the purchasing power of a family's money, so the same income buys less food, rent and transport. Families whose wages do not rise suffer most, and savers may also lose value. As a result, households must cut spending or borrow more. Central banks raise the interest rate to control inflation, but this can make loans more expensive."], [401.22, 402.72, "Excellent answer, Visal!"], [403.62, 408.45, "Great work! Now you can use eight new words and relative clauses with whose and where."], [408.75, 414.48, "Today's value is economic awareness. Understand how money and work affect your life choices."], [414.78, 417.44, "See you in Unit twenty-one. Goodbye!"], [417.75, 420.86, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-NP2-Unit21-The-Tourism-Economy": [[0.35, 5.85, "Hello, everyone! I'm Ms. Emma. Welcome to Online Newspaper Class, level two."], [6.15, 9.99, "Hi! I'm Visal. Let's learn together!"], [10.29, 16.92, "Unit twenty-one: The Tourism Economy. Today you will use inversion for emphasis: not only ... but also."], [17.22, 20.05, "Here is our lesson map. Let's start!"], [21.0, 23.98, "Part one: words. You will learn eight new words."], [24.82, 25.61, "Tourism."], [26.62, 30.28, "Tourism means the business of providing services for travellers."], [30.88, 33.45, "Tourism is a major industry in Cambodia."], [34.05, 36.61, "Your turn. Say: Tourism."], [39.47, 40.27, "Tourism."], [41.02, 42.03, "Visitors."], [43.02, 46.54, "Visitors means people who travel to a place for a short time."], [47.15, 49.48, "Millions of visitors arrive each year."], [50.08, 52.57, "Your turn. Say: Visitors."], [55.43, 56.52, "Visitors."], [57.25, 58.25, "Hotel."], [59.25, 62.23, "Hotel means a building where travellers pay to stay."], [62.82, 65.48, "The new hotel employs one hundred workers."], [66.08, 68.57, "Your turn. Say: Hotel."], [71.43, 72.62, "Hotel."], [73.38, 74.3, "Jobs."], [75.32, 78.16, "Jobs means paid work for which people are employed."], [78.75, 81.59, "Tourism creates jobs for guides and drivers."], [82.18, 84.8, "Your turn. Say: Jobs."], [87.67, 88.73, "Jobs."], [89.48, 90.33, "Revenue."], [91.35, 94.57, "Revenue means the money a business or government receives."], [95.18, 97.38, "Tourist revenue rose by ten percent."], [97.98, 100.03, "Your turn. Say: Revenue."], [102.87, 103.81, "Revenue."], [104.55, 105.47, "Season."], [106.48, 109.99, "Season means a period of the year when something typically happens."], [110.58, 113.01, "The dry season brings the most visitors."], [113.62, 116.04, "Your turn. Say: Season."], [118.9, 119.77, "Season."], [120.52, 121.73, "Heritage site."], [122.72, 126.12, "Heritage site means a place of historic or cultural importance."], [126.72, 129.25, "A heritage site needs careful protection."], [129.85, 132.75, "Your turn. Say: Heritage site."], [135.6, 136.84, "Heritage site."], [137.58, 138.5, "Economy."], [139.52, 143.11, "Economy means the system of money, trade and jobs in a country."], [143.72, 146.46, "The economy depends on tourism and garments."], [147.05, 149.41, "Your turn. Say: Economy."], [152.27, 153.26, "Economy."], [154.07, 157.73, "Part two: dialogue. Let's listen to a conversation."], [158.58, 165.65, "Visal, an article says 'Not only does tourism create jobs, but it also brings revenue.' Why does 'does' come before 'tourism'?"], [166.75, 175.72, "After 'not only' at the start of a sentence, we invert the subject and auxiliary, as in a question: not only does tourism create..."], [176.82, 177.97, "Is it common?"], [179.08, 189.35, "In formal writing, yes. 'Not only did visitors fill the hotels, but they also supported local guides.' It gives strong emphasis."], [190.45, 192.37, "What are the risks of tourism?"], [193.48, 201.94, "Rarely does growth come without cost. A heritage site may be damaged, and the economy may depend on one season."], [203.1, 204.81, "Part three: grammar."], [205.65, 210.11, "Grammar focus: Inversion: not only  but also; rarely and seldom."], [210.41, 211.47, "Look at the pattern."], [212.18, 215.82, "Not only does tourism create jobs, but it also brings revenue."], [216.72, 221.25, "Not only did visitors fill hotels, but they also supported local guides."], [222.15, 224.53, "Rarely does growth come without cost."], [225.47, 234.04, "After Not only / Rarely / Seldom at the start, invert the subject and auxiliary: Not only does it..., Rarely did they... Use 'but also' for the second part."], [234.78, 239.08, "Be careful! Don't say: Not only tourism creates jobs."], [241.03, 244.17, "Say: Not only does tourism create jobs."], [244.47, 246.61, "Invert the subject and auxiliary."], [247.4, 249.97, "Part four: reading. Read and listen."], [250.77, 252.43, "Tourism and the Economy."], [252.73, 255.59, "Tourism is a pillar of many national economies."], [256.6, 262.87, "Not only does it create jobs for hotel staff and guides, but it also brings revenue to small towns."], [263.87, 268.85, "Rarely do visitors realise how much a single season can matter to a family's income."], [269.83, 273.71, "However, a heritage site that receives too many visitors may be damaged."], [274.7, 278.08, "Balanced tourism therefore protects both people and places."], [279.17, 283.27, "Part five: quiz. Five questions. Are you ready?"], [284.12, 287.94, "Not only blank tourism create jobs, but it also brings revenue."], [288.24, 291.57, "A, does. B, is. C, do."], [295.13, 297.1, "The answer is A: does."], [298.25, 300.8, "A place of historic importance is a blank site."], [301.1, 304.35, "A, heritage. B, season. C, revenue."], [307.9, 310.14, "The answer is A: heritage."], [311.28, 313.91, "The money a business or government receives is blank."], [314.21, 318.1, "A, revenue. B, tourism. C, hotel."], [321.63, 323.67, "The answer is A: revenue."], [324.82, 326.62, "Choose the correct sentence."], [326.92, 333.99, "A, Rarely growth does come free.. B, Rarely does growth come free.. C, Rarely growth comes does free.."], [337.53, 340.76, "The answer is B: Rarely does growth come free.."], [341.92, 346.11, "According to the reading, balanced tourism protects both people and…"], [346.41, 350.52, "A, places. B, hotels only. C, seasons."], [354.07, 355.92, "The answer is A: places."], [357.1, 360.1, "Part six: speaking. It's your turn to talk."], [360.95, 363.89, "How does tourism help or harm local communities?"], [372.68, 374.31, "Now listen to Visal."], [374.61, 398.02, "Tourism helps communities by creating jobs and bringing revenue to hotels, shops and farms. Not only does it support families, but it also encourages the protection of heritage. However, it can harm a place if too many visitors damage a heritage site, raise prices or crowd out local people. Good planning is therefore essential."], [398.32, 399.98, "Excellent answer, Visal!"], [400.88, 407.15, "Great work! Now you can use eight new words and inversion: not only  but also; rarely and seldom."], [407.45, 412.08, "Today's value is sustainable thinking. Choose what can last for the long term."], [412.38, 415.35, "See you in Unit twenty-two. Goodbye!"], [415.65, 418.71, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-NP2-Unit22-Microfinance": [[0.35, 5.84, "Hello, everyone! I'm Ms. Emma. Welcome to Online Newspaper Class, level two."], [6.14, 9.98, "Hi! I'm Visal. Let's learn together!"], [10.28, 17.75, "Unit twenty-two: Microfinance. Today you will use gerunds and infinitives after verbs: risk, enable, help."], [18.05, 20.69, "Here is our lesson map. Let's start!"], [21.63, 24.96, "Part one: words. You will learn eight new words."], [25.82, 27.18, "Microfinance."], [28.18, 32.37, "Microfinance means small loans and financial services for poor people."], [32.95, 36.13, "Microfinance helps women start small shops."], [36.75, 39.68, "Your turn. Say: Microfinance."], [42.53, 44.03, "Microfinance."], [44.78, 45.58, "Loan."], [46.58, 49.19, "Loan means money borrowed that must be repaid."], [49.78, 52.1, "She used the loan to buy a sewing machine."], [52.68, 54.99, "Your turn. Say: Loan."], [57.83, 58.64, "Loan."], [59.38, 60.31, "Borrower."], [61.32, 63.51, "Borrower means a person who takes a loan."], [64.12, 66.13, "Each borrower signs an agreement."], [66.72, 68.96, "Your turn. Say: Borrower."], [71.8, 72.69, "Borrower."], [73.45, 74.36, "Interest."], [75.35, 78.01, "Interest means the extra money paid for borrowing."], [78.62, 81.1, "The interest on the loan was twelve percent."], [81.72, 84.18, "Your turn. Say: Interest."], [87.03, 87.93, "Interest."], [88.68, 89.66, "Repayment."], [90.65, 93.07, "Repayment means paying back borrowed money."], [93.68, 96.33, "Weekly repayment is easier than one large payment."], [96.92, 99.75, "Your turn. Say: Repayment."], [102.6, 103.52, "Repayment."], [104.28, 105.58, "Small business."], [106.58, 110.14, "Small business means a company with few workers and little capital."], [110.75, 113.37, "A small business may sell food or clothes."], [113.95, 116.71, "Your turn. Say: Small business."], [119.57, 121.04, "Small business."], [121.78, 122.44, "Debt."], [123.45, 125.97, "Debt means money that a person or company owes."], [126.58, 128.68, "A heavy debt can trap a family."], [129.28, 132.04, "Your turn. Say: Debt."], [134.9, 135.65, "Debt."], [136.38, 137.51, "Regulation."], [138.52, 142.61, "Regulation means official rules that control an activity."], [143.22, 146.46, "Regulation protects borrowers from unfair interest."], [147.05, 149.5, "Your turn. Say: Regulation."], [152.37, 153.56, "Regulation."], [154.37, 158.31, "Part two: dialogue. Let's listen to a conversation."], [159.15, 167.26, "Visal, a report says 'Microfinance enables families to start businesses, but some borrowers risk falling into debt.' Why 'to start' but 'falling'?"], [168.35, 178.15, "Some verbs take an infinitive (enable someone to, help someone to) and some take a gerund (risk, avoid, suggest, involve)."], [179.25, 180.56, "How can I remember?"], [181.65, 193.76, "Learn them in pairs: enable + object + to; risk + -ing; help + infinitive or base verb; avoid + -ing; manage + to."], [194.85, 197.05, "Why does it matter for microfinance?"], [198.15, 211.38, "The benefits are clear: loans help women to expand. The risks are also clear: high interest may involve paying more than expected, so regulation is needed."], [212.53, 214.15, "Part three: grammar."], [214.98, 219.11, "Grammar focus: Gerunds and infinitives after verbs."], [219.41, 220.61, "Look at the pattern."], [221.32, 224.7, "Microfinance enables families to start small businesses."], [225.58, 227.87, "Some borrowers risk falling into debt."], [228.78, 231.48, "Good regulation helps to protect borrowers."], [232.43, 241.37, "Enable / allow / help + object + to + verb. Risk / avoid / involve + -ing. Never use 'to' after risk: risk losing, not risk to lose."], [242.12, 245.79, "Be careful! Don't say: They risk to lose their money."], [247.73, 250.2, "Say: They risk losing their money."], [250.5, 252.25, "Risk is followed by -ing."], [253.07, 255.65, "Part four: reading. Read and listen."], [256.43, 258.48, "Small Loans, Big Choices."], [258.78, 262.73, "Microfinance offers a small loan to people that banks usually ignore."], [263.73, 267.8, "A loan can enable a borrower to buy tools or stock for a small business."], [268.8, 273.21, "However, high interest and weekly repayment may risk pushing a family into debt."], [274.2, 278.63, "Regulation helps to protect each borrower and avoids charging unfair fees."], [279.63, 283.42, "Used wisely, microfinance can lift families out of poverty."], [284.53, 288.41, "Part five: quiz. Five questions. Are you ready?"], [289.25, 292.41, "Microfinance enables families blank start businesses."], [292.71, 295.84, "A, to. B, for. C, -ing."], [299.4, 300.94, "The answer is A: to."], [302.08, 304.42, "Some borrowers risk blank into debt."], [304.72, 308.13, "A, falling. B, to fall. C, fall."], [311.67, 313.5, "The answer is A: falling."], [314.65, 316.65, "Money that a person owes is blank."], [316.95, 320.53, "A, debt. B, repayment. C, interest."], [324.07, 325.74, "The answer is A: debt."], [326.88, 328.62, "Choose the correct sentence."], [328.92, 334.47, "A, They risk to lose money.. B, They risk losing money.. C, They risk lose money.."], [338.03, 341.04, "The answer is B: They risk losing money.."], [342.18, 345.38, "According to the reading, regulation helps protect each…"], [345.68, 348.82, "A, borrower. B, bank. C, tourist."], [352.37, 354.41, "The answer is A: borrower."], [355.6, 358.6, "Part six: speaking. It's your turn to talk."], [359.45, 362.24, "What are the benefits and risks of microfinance?"], [371.05, 372.56, "Now listen to Visal."], [372.86, 397.54, "The main benefit of microfinance is that it gives poor families access to credit, so they can start a small business and earn a stable income. It also helps women to gain independence. However, high interest and strict repayment may push some borrowers into debt. Therefore, regulation and financial education are essential."], [397.84, 399.66, "Excellent answer, Visal!"], [400.55, 405.9, "Great work! Now you can use eight new words and gerunds and infinitives after verbs."], [406.2, 411.97, "Today's value is social impact. Use your skills and ideas to improve other people's lives."], [412.27, 415.3, "See you in Unit twenty-three. Goodbye!"], [415.6, 417.89, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-NP2-Unit23-Digital-Payments": [[0.35, 5.72, "Hello, everyone! I'm Ms. Emma. Welcome to Online Newspaper Class, level two."], [6.02, 9.07, "Hi! I'm Visal. Let's learn together!"], [9.37, 16.42, "Unit twenty-three: Digital Payments. Today you will express preferences with would rather, prefer and had better."], [16.72, 19.23, "Here is our lesson map. Let's start!"], [20.17, 23.33, "Part one: words. You will learn eight new words."], [24.18, 25.28, "Digital payment."], [26.28, 29.8, "Digital payment means paying with electronic methods instead of cash."], [30.42, 33.0, "A digital payment takes only seconds."], [33.58, 36.71, "Your turn. Say: Digital payment."], [39.57, 40.79, "Digital payment."], [41.55, 42.57, "QR code."], [43.58, 47.36, "QR code means a square pattern of dots that a phone can scan."], [47.95, 49.82, "Scan the QR code to pay."], [50.42, 53.52, "Your turn. Say: QR code."], [56.37, 57.4, "QR code."], [58.15, 59.37, "Mobile wallet."], [60.38, 63.95, "Mobile wallet means an app that stores payment information on a phone."], [64.55, 66.9, "She keeps her cards in a mobile wallet."], [67.48, 70.09, "Your turn. Say: Mobile wallet."], [72.93, 74.21, "Mobile wallet."], [74.95, 75.68, "Bank."], [76.68, 80.28, "Bank means an institution that keeps money safe and lends it."], [80.88, 83.07, "The bank introduced a new payment app."], [83.68, 85.94, "Your turn. Say: Bank."], [88.8, 89.63, "Bank."], [90.38, 91.23, "Cash."], [92.25, 95.16, "Cash means money in the form of coins and notes."], [95.75, 98.28, "Many street sellers still prefer cash."], [98.88, 101.12, "Your turn. Say: Cash."], [103.97, 104.92, "Cash."], [105.68, 106.72, "Security."], [107.72, 111.77, "Security means protection against theft, fraud or danger."], [112.38, 115.36, "Security is the biggest concern in online payments."], [115.95, 118.64, "Your turn. Say: Security."], [121.5, 122.35, "Security."], [123.12, 124.03, "Fees."], [125.02, 127.5, "Fees means money charged for a service."], [128.12, 130.23, "Some apps charge small fees."], [130.82, 133.09, "Your turn. Say: Fees."], [135.93, 136.57, "Fees."], [137.32, 138.33, "Transaction."], [139.32, 143.37, "Transaction means an act of buying, selling or transferring money."], [143.98, 146.31, "Each transaction is recorded instantly."], [146.92, 149.53, "Your turn. Say: Transaction."], [152.4, 153.47, "Transaction."], [154.27, 158.12, "Part two: dialogue. Let's listen to a conversation."], [158.95, 162.01, "Visal, do you prefer cash or digital payments?"], [163.12, 173.64, "I'd rather pay digitally, because I prefer using a QR code to carrying coins. However, I'd rather not use public Wi-Fi for a transaction."], [174.75, 176.2, "What is the grammar there?"], [177.32, 188.84, "'Would rather + base verb' states a preference. 'Prefer + -ing' or 'prefer A to B' is another pattern: I prefer paying digitally to paying with cash."], [189.95, 191.16, "And advice?"], [192.25, 201.94, "You'd better check the fees and security settings. 'Had better' gives strong advice and, like would rather, takes the base verb."], [203.1, 204.66, "Part three: grammar."], [205.52, 210.49, "Grammar focus: Preferences and advice: would rather and prefer and had better."], [210.79, 211.99, "Look at the pattern."], [212.68, 214.51, "I would rather pay with my phone."], [215.42, 218.32, "She prefers paying digitally to paying with cash."], [219.22, 221.24, "You had better check the fees first."], [222.2, 233.13, "Would rather + base verb (no 'to'): I'd rather pay. Prefer + -ing, or prefer A to B. Had better + base verb for strong advice; negative: had better not."], [233.88, 237.29, "Be careful! Don't say: You had better to check fees."], [239.23, 241.41, "Say: You had better check fees."], [241.71, 243.8, "Use the base verb after had better."], [244.6, 247.26, "Part four: reading. Read and listen."], [248.07, 249.23, "Cash or Code?."], [249.53, 253.97, "Digital payment has spread quickly, from the bank app to the QR code on a street stall."], [254.97, 260.62, "Many customers would rather use a mobile wallet than carry cash, because each transaction takes seconds."], [261.63, 267.28, "Others prefer paying with cash to using an app, mainly because of security worries and fees."], [268.27, 272.56, "Experts say users had better turn on security settings and check every message."], [273.57, 277.23, "In practice, most people will use both for some years."], [278.33, 282.3, "Part five: quiz. Five questions. Are you ready?"], [283.15, 285.14, "I would rather blank with my phone."], [285.44, 288.91, "A, pay. B, to pay. C, paying."], [292.47, 294.33, "The answer is A: pay."], [295.48, 298.39, "She prefers paying digitally blank paying with cash."], [298.69, 301.31, "A, to. B, than. C, from."], [304.87, 306.61, "The answer is A: to."], [307.75, 310.35, "Protection against theft or fraud is blank."], [310.65, 314.79, "A, security. B, a transaction. C, a fee."], [318.33, 320.66, "The answer is A: security."], [321.82, 323.44, "Choose the correct sentence."], [323.75, 330.08, "A, You had better to check fees.. B, You had better check fees.. C, You had better checking fees.."], [333.63, 336.83, "The answer is B: You had better check fees.."], [337.98, 340.67, "According to the reading, most people will use…"], [340.97, 345.39, "A, both for some years. B, only cash. C, only codes."], [348.93, 351.7, "The answer is A: both for some years."], [352.9, 356.02, "Part six: speaking. It's your turn to talk."], [356.88, 359.95, "Do you prefer cash or digital payments? Why?"], [368.75, 370.27, "Now listen to Visal."], [370.57, 391.41, "I would rather pay digitally because it is fast and I do not need to carry money. A QR code or mobile wallet records each transaction, so it is easy to check my spending. However, I keep a little cash for places that do not accept apps. I also check the fees and security settings first."], [391.71, 393.48, "Excellent answer, Visal!"], [394.38, 400.54, "Great work! Now you can use eight new words and preferences and advice: would rather and prefer and had better."], [400.84, 405.22, "Today's value is digital trust. Protect the trust that others place in you."], [405.52, 408.27, "See you in Unit twenty-four. Goodbye!"], [408.57, 411.01, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-NP2-Unit24-Manufacturing-and-Garments": [[0.35, 6.37, "Hello, everyone! I'm Ms. Emma. Welcome to Online Newspaper Class, level two."], [6.67, 10.35, "Hi! I'm Visal. Let's learn together!"], [10.65, 17.59, "Unit twenty-four: Manufacturing and Garments. Today you will talk about services done for us with the causative have / get."], [17.89, 20.58, "Here is our lesson map. Let's start!"], [21.53, 24.78, "Part one: words. You will learn eight new words."], [25.62, 26.83, "Manufacturing."], [27.82, 32.29, "Manufacturing means the making of goods in large numbers, usually in factories."], [32.88, 35.49, "Manufacturing employs many young workers."], [36.08, 39.11, "Your turn. Say: Manufacturing."], [41.97, 43.43, "Manufacturing."], [44.18, 44.92, "Garment."], [45.92, 47.77, "Garment means a piece of clothing."], [48.35, 50.69, "Each garment is checked before it is packed."], [51.28, 53.55, "Your turn. Say: Garment."], [56.4, 57.08, "Garment."], [57.82, 58.75, "Factory."], [59.75, 63.61, "Factory means a building where goods are made by machines and workers."], [64.22, 66.18, "The factory opened a new training room."], [66.78, 69.31, "Your turn. Say: Factory."], [72.17, 73.05, "Factory."], [73.82, 74.77, "Export."], [75.78, 78.58, "Export means a product sold to another country."], [79.18, 81.5, "Garments are the country's top export."], [82.08, 84.47, "Your turn. Say: Export."], [87.33, 88.14, "Export."], [88.88, 89.88, "Workers."], [90.88, 94.3, "Workers means people who do a job, especially manual work."], [94.88, 97.17, "Workers asked for safer conditions."], [97.78, 100.23, "Your turn. Say: Workers."], [103.07, 104.08, "Workers."], [104.82, 106.03, "Supply chain."], [107.02, 111.05, "Supply chain means the network that moves a product from maker to buyer."], [111.65, 114.61, "The supply chain stretches across three countries."], [115.22, 118.02, "Your turn. Say: Supply chain."], [120.87, 122.24, "Supply chain."], [122.98, 123.93, "Wages."], [124.92, 127.56, "Wages means money paid to workers for their work."], [128.15, 130.32, "Fair wages reduce worker turnover."], [130.92, 133.22, "Your turn. Say: Wages."], [136.07, 137.22, "Wages."], [137.98, 139.01, "Standards."], [140.02, 143.85, "Standards means official levels of quality, safety or behaviour."], [144.45, 146.93, "International standards protect workers."], [147.52, 150.05, "Your turn. Say: Standards."], [152.9, 153.84, "Standards."], [154.63, 158.09, "Part two: dialogue. Let's listen to a conversation."], [158.95, 166.16, "Visal, a report says 'The factory had its machines inspected and got its safety standards checked.' Who did the inspecting?"], [167.25, 177.02, "Not the factory. That is the causative: have / get + object + past participle. It means someone else did the job for us."], [178.12, 180.34, "What is the difference between have and get?"], [181.45, 190.16, "Have is neutral and slightly formal; get is more informal. 'Brands have their suppliers audited' means an inspector audits them."], [191.25, 193.95, "Why is it useful for manufacturing news?"], [195.05, 205.48, "Because reports focus on actions done to the factory: having standards verified, getting wages reviewed, having products tested before export."], [206.63, 208.33, "Part three: grammar."], [209.18, 214.14, "Grammar focus: Causative have and get plus object plus past participle."], [214.44, 215.61, "Look at the pattern."], [216.32, 218.64, "The factory had its machines inspected."], [219.55, 222.05, "The brand has its suppliers audited every year."], [222.95, 225.4, "Workers got their wages reviewed by the union."], [226.37, 235.24, "Causative: have/get + object + past participle means someone else does the action. Do not use the base verb: had it repaired, not had it repair."], [235.98, 239.25, "Be careful! Don't say: She had her car repair."], [241.2, 243.38, "Say: She had her car repaired."], [243.69, 246.57, "Use the past participle after have + object."], [247.37, 249.93, "Part four: reading. Read and listen."], [250.73, 252.64, "Inside a Garment Factory."], [252.94, 256.73, "Manufacturing is one of the largest employers in the garment industry."], [257.73, 263.37, "A factory that sells exports abroad often has its safety standards checked by outside auditors."], [264.37, 269.69, "Global brands have their suppliers audited every year, and workers get their wages reviewed with the union."], [270.7, 274.94, "Each garment must meet international standards before it leaves the supply chain."], [275.93, 279.23, "Fair conditions keep both workers and buyers satisfied."], [280.33, 284.2, "Part five: quiz. Five questions. Are you ready?"], [285.05, 287.63, "The factory blank its machines inspected."], [287.93, 290.92, "A, had. B, made. C, was." ill give advice with should, ought to and had better."], [17.36, 20.03, "Here is our lesson map. Let's start!"], [20.97, 24.84, "Part one: words. You will learn eight new words."], [25.68, 26.51, "Budget."], [27.52, 30.32, "Budget means a plan for how to spend and save money."], [30.92, 33.38, "A monthly budget helps control spending."], [33.98, 36.19, "Your turn. Say: Budget."], [39.03, 39.88, "Budget."], [40.65, 41.6, "Savings."], [42.62, 45.58, "Savings means money that has been saved and not spent."], [46.18, 48.34, "Her savings paid for university."], [48.95, 51.67, "Your turn. Say: Savings."], [54.53, 55.67, "Savings."], [56.42, 57.8, "Compound interest."], [58.82, 63.99, "Compound interest means interest that is calculated on both the original money and earlier interest."], [64.58, 67.34, "Compound interest makes savings grow faster."], [67.95, 71.14, "Your turn. Say: Compound interest."], [74.0, 75.91, "Compound interest."], [76.65, 77.29, "Debt."], [78.28, 80.14, "Debt means money that someone owes."], [80.75, 82.7, "Paying off debt should come first."], [83.32, 86.16, "Your turn. Say: Debt."], [89.0, 89.85, "Debt."], [90.62, 91.65, "Investment."], [92.65, 95.84, "Investment means money put into something to make a profit."], [96.45, 99.38, "A long-term investment can grow for decades."], [99.98, 102.19, "Your turn. Say: Investment."], [105.03, 106.16, "Investment."], [106.92, 108.19, "Emergency fund."], [109.18, 112.82, "Emergency fund means money saved for unexpected problems."], [113.42, 116.03, "An emergency fund covers sudden repairs."], [116.62, 119.97, "Your turn. Say: Emergency fund."], [122.8, 124.3, "Emergency fund."], [125.05, 126.49, "Financial literacy."], [127.48, 131.44, "Financial literacy means the knowledge needed to manage money well."], [132.05, 135.4, "Financial literacy helps families avoid debt."], [135.98, 139.12, "Your turn. Say: Financial literacy."], [141.97, 143.33, "Financial literacy."], [144.08, 144.96, "Goal."], [145.95, 148.26, "Goal means something you plan to achieve."], [148.85, 150.81, "A clear goal keeps you saving."], [151.42, 153.63, "Your turn. Say: Goal."], [156.47, 157.35, "Goal."], [158.17, 161.99, "Part two: dialogue. Let's listen to a conversation."], [162.85, 170.69, "Visal, a finance column says 'You ought to build an emergency fund, and you had better avoid high-interest debt.' How do these differ?"], [171.78, 179.28, "Ought to and should give general advice. Had better is stronger and suggests a bad result if you ignore it."], [180.38, 182.0, "Can I use them in the negative?"], [183.08, 190.21, "Yes: shouldn't, ought not to, had better not. 'You had better not spend your savings on a risky investment.'"], [191.32, 193.55, "What is the best advice for beginners?"], [194.65, 202.48, "Write a budget, set a goal and use compound interest. Financial literacy will give you more choices later."], [203.63, 205.23, "Part three: grammar."], [206.08, 210.59, "Grammar focus: Giving advice: should and ought to and had better."], [210.89, 212.15, "Look at the pattern."], [212.85, 214.56, "You should write a monthly budget."], [215.45, 218.11, "Families ought to build an emergency fund."], [219.02, 221.86, "You had better not ignore high-interest debt."], [222.8, 232.18, "Should and ought to + base verb give advice. Had better + base verb is stronger, and its negative is had better not. All three are followed by the base verb."], [232.92, 236.1, "Be careful! Don't say: You had better saving more."], [238.07, 240.37, "Say: You had better save more."], [240.67, 242.81, "Use the base verb after had better."], [243.6, 246.5, "Part four: reading. Read and listen."], [247.3, 248.92, "Money Tips for Beginners."], [249.22, 251.85, "Good money habits begin with a simple budget."], [252.87, 257.79, "Experts say you should save a part of every income and ought to build an emergency fund first."], [258.8, 262.5, "You had better pay off high-interest debt before you start an investment."], [263.5, 268.74, "Compound interest then rewards patient savers, because savings grow on top of earlier interest."], [269.73, 274.18, "A clear goal and strong financial literacy make every decision easier."], [275.27, 279.38, "Part five: quiz. Five questions. Are you ready?"], [280.25, 282.13, "You blank write a monthly budget."], [282.43, 286.38, "A, should. B, should to. C, must to."], [289.93, 291.83, "The answer is A: should."], [292.98, 295.82, "Families ought blank build an emergency fund."], [296.12, 299.24, "A, to. B, -ing. C, not."], [302.8, 304.37, "The answer is A: to."], [305.52, 308.75, "Interest calculated on earlier interest is blank interest."], [309.05, 312.49, "A, compound. B, simple. C, debt."], [316.03, 318.38, "The answer is A: compound."], [319.52, 321.28, "Choose the correct sentence."], [321.58, 327.47, "A, You had better to save.. B, You had better save.. C, You had better saving.."], [331.0, 333.59, "The answer is B: You had better save.."], [334.75, 338.54, "According to the reading, you should pay off high-interest debt before…"], [338.84, 342.12, "A, investing. B, sleeping. C, budgeting."], [345.67, 347.68, "The answer is A: investing."], [348.87, 351.76, "Part six: speaking. It's your turn to talk."], [352.62, 355.15, "What is your most important financial goal?"], [363.95, 365.38, "Now listen to Visal."], [365.68, 387.69, "My most important financial goal is to build an emergency fund and then save for university. I should write a budget so that I know where my money goes, and I ought to avoid unnecessary debt. After that, I would like to begin a small investment. Compound interest means that starting early will help me a lot."], [387.99, 389.67, "Excellent answer, Visal!"], [390.55, 396.0, "Great work! Now you can use eight new words and giving advice: should and ought to and had better."], [396.3, 401.11, "Today's value is planning ahead. Make a plan and take small steps every day."], [401.41, 408.85, "Congratulations! You have finished Online Newspaper Class, level two. See you in Online Newspaper Class, level three!"], [409.15, 412.36, "Thank you, Ms. Emma! Bye, everyone!"]]};
        // English subtitles: added to the player with code, so no subtitle files are needed online.
        let subsOn = true;
        function addSubtitles(el) {
            const cues = SUBTITLES[(el.getAttribute('src') || '').split('/').pop().split('?')[0].replace('.mp4', '')]; const btn = document.getElementById('subs-btn');
            if (!cues || !el.addTextTrack || typeof VTTCue === 'undefined') { if (btn) btn.style.display = 'none'; return; }
            const tr = el.addTextTrack('subtitles', 'English', 'en');
            cues.forEach(c => { try { const q = new VTTCue(c[0], c[1], c[2]); q.line = -2; tr.addCue(q); } catch (e) {} });
            const apply = () => { tr.mode = subsOn ? 'showing' : 'hidden'; if (btn) btn.textContent = subsOn ? '💬 Subtitles: ON' : '💬 Subtitles: OFF'; };
            if (btn) btn.onclick = () => { subsOn = !subsOn; apply(); };
            apply();
        }
        function renderMp4Lesson(contentDiv, unitData) {
            contentDiv.innerHTML = `
                <h2 class="text-xl font-bold text-indigo-900 mb-2">📹 Video Lesson — Unit ${state.unit}: ${unitData.title}</h2>
                <p class="text-gray-600 mb-4">${ytCurrentConfig.checkpoints.length ? 'Watch the video. It will pause at a few points so you can answer a quick question!' : 'Watch Ms. Emma and Visal, then try the other learning modules!'}</p>
                <div class="relative bg-black rounded-2xl overflow-hidden" style="aspect-ratio:16/9;">
                    <video id="mp4-player" src="${ytCurrentConfig.mp4}" controls playsinline preload="metadata" class="w-full h-full" style="object-fit:contain;"></video>
                    <div id="checkpoint-overlay" class="absolute inset-0 bg-indigo-900/95 flex items-center justify-center p-6" style="display:none;"></div>
                </div>
                <p id="video-msg" class="text-sm text-gray-500 mt-3 text-center min-h-[1.25rem]">▶️ Press play to start the lesson!</p>
                <div class="text-center mt-2 flex justify-center gap-3 flex-wrap"><button id="subs-btn" class="bg-white border border-indigo-300 text-indigo-700 font-bold px-4 py-2 rounded-full shadow cursor-pointer">💬 Subtitles: ON</button><button onclick="nextLesson()" class="bg-emerald-700 hover:bg-emerald-800 text-white font-bold px-4 py-2 rounded-full shadow cursor-pointer">Next Lesson ▶️</button></div>`;
            const el = document.getElementById('mp4-player');
            addSubtitles(el);
            { const a = document.getElementById('footer-next-module'), b = document.getElementById('footer-next-lesson'); if (a) a.style.display = ''; if (b) b.style.display = 'none'; }
            ytPlayer = {
                getCurrentTime: () => el.currentTime,
                pauseVideo: () => el.pause(),
                playVideo: () => { const p = el.play(); if (p && p.catch) p.catch(() => {}); },
                destroy: () => { try { el.pause(); el.removeAttribute('src'); el.load(); } catch (e) {} }
            };
            el.addEventListener('play', () => { const m = document.getElementById('video-msg'); if (m) m.textContent = ''; });
            el.addEventListener('timeupdate', () => { if (ytCurrentConfig && ytCurrentConfig.checkpoints.length) checkVideoCheckpoints(); });
            el.addEventListener('ended', () => {
                const got = award(unitKey('video-' + ytCurrentConfig.id), 5);
                const m = document.getElementById('video-msg');
                if (m) m.textContent = '🎉 Great job watching the whole video!' + (got ? ' (+5 ⭐)' : '');
            });
            el.addEventListener('error', () => {
                const m = document.getElementById('video-msg');
                if (m) m.innerHTML = '⚠️ The video could not load. Check the internet, or <a href="' + ytCurrentConfig.mp4 + '" target="_blank" rel="noopener" class="text-indigo-600 underline font-semibold">open it here ↗</a>';
            });
        }

        function onYtStateChange(event) {
            const msg = document.getElementById('video-msg');
            if (event.data === YT.PlayerState.PLAYING) {
                if (ytPollInterval) clearInterval(ytPollInterval);
                if (ytCurrentConfig && ytCurrentConfig.checkpoints.length) ytPollInterval = setInterval(checkVideoCheckpoints, 400);
                if (msg) msg.textContent = '';
            } else if (event.data === YT.PlayerState.PAUSED || event.data === YT.PlayerState.ENDED) {
                if (ytPollInterval) { clearInterval(ytPollInterval); ytPollInterval = null; }
                if (event.data === YT.PlayerState.ENDED) {
                    const got = award(unitKey('video-' + ytCurrentConfig.id), 5);
                    markActivityComplete('video');
                    if (msg) msg.textContent = '🎉 Great job watching the whole video!' + (got ? ' (+5 ⭐)' : '');
                }
            }
        }

        function checkVideoCheckpoints() {
            if (!ytPlayer || typeof ytPlayer.getCurrentTime !== 'function' || !ytCurrentConfig) return;
            let t = 0;
            try { t = ytPlayer.getCurrentTime(); } catch (e) { return; }
            ytCurrentConfig.checkpoints.forEach((cp, idx) => {
                if (!ytAnsweredCheckpoints.has(idx) && t >= cp.time) {
                    ytAnsweredCheckpoints.add(idx);
                    showVideoCheckpoint(idx);
                }
            });
        }

        function showVideoCheckpoint(idx) {
            const cp = ytCurrentConfig.checkpoints[idx];
            ytPlayer.pauseVideo();
            if (ytPollInterval) { clearInterval(ytPollInterval); ytPollInterval = null; }
            const overlay = document.getElementById('checkpoint-overlay');
            overlay.style.display = 'flex';
            overlay.innerHTML = `
                <div class="bg-white rounded-2xl p-6 max-w-md w-full text-center">
                    <p class="text-sm font-bold text-indigo-600 mb-2">🤔 Quick Question!</p>
                    <p class="font-bold text-lg text-gray-800 mb-4">${cp.question}</p>
                    <div class="flex flex-col gap-2" id="checkpoint-options">
                        ${cp.options.map((opt, i) => `<button onclick="answerVideoCheckpoint(${idx}, ${i})" class="bg-indigo-50 hover:bg-indigo-100 text-indigo-900 font-semibold p-3 rounded-xl cursor-pointer">${opt}</button>`).join('')}
                    </div>
                    <p id="checkpoint-feedback" class="mt-3 font-bold min-h-[1.5rem]"></p>
                </div>`;
        }

        function answerVideoCheckpoint(idx, chosenIndex) {
            const cp = ytCurrentConfig.checkpoints[idx];
            const feedback = document.getElementById('checkpoint-feedback');
            const optionsDiv = document.getElementById('checkpoint-options');
            optionsDiv.querySelectorAll('button').forEach(b => b.disabled = true);
            if (chosenIndex === cp.correct) {
                feedback.className = 'mt-3 font-bold min-h-[1.5rem] text-green-600';
                feedback.textContent = award(unitKey('video-' + ytCurrentConfig.id + '-q' + idx), 2) ? '🎉 Correct! (+2 ⭐)' : '🎉 Correct!';
            } else {
                feedback.className = 'mt-3 font-bold min-h-[1.5rem] text-red-500';
                feedback.textContent = `❌ Not quite — the answer was "${cp.options[cp.correct]}"`;
            }
            const nextBtn = document.createElement('button');
            nextBtn.textContent = 'Next ▶️';
            nextBtn.className = 'mt-4 bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-6 py-2 rounded-full shadow cursor-pointer';
            nextBtn.onclick = resumeVideoAfterCheckpoint;
            feedback.insertAdjacentElement('afterend', nextBtn);
        }

        function resumeVideoAfterCheckpoint() {
            document.getElementById('checkpoint-overlay').style.display = 'none';
            if (ytPlayer) ytPlayer.playVideo();
        }

        function renderContent() {
            let contentDiv = document.getElementById('module-content');
            const unitData = curriculum[state.level][state.unit];
            stopVideo();                 // never leave a video playing in the background
            stopTalkTimer();             // ...or a Let's Talk timer running
            updateVideoTabBadge();
            // Always shows the real level and unit (it used to say "A1" on every level)
            document.getElementById('platform-info').textContent = `C2-EPE Newspaper Class - ${gradeName(state.level)} (Unit ${state.unit}: ${unitData.title})`;
            if (state.tab === 'video') { renderVideoLesson(contentDiv); return; }

            if (state.tab === 'learn') renderLearn(contentDiv, unitData);
            else if (state.tab === 'terms') renderTerms(contentDiv, unitData);
            else if (state.tab === 'quiz') renderQuiz(contentDiv, unitData);
            else if (state.tab === 'think') renderThink(contentDiv, unitData);
            else if (state.tab === 'funfact') renderFunFact(contentDiv, unitData);
            else if (state.tab === 'vocabgame') renderVocabGame(contentDiv, unitData);
            else if (state.tab === 'spelling') renderSpelling(contentDiv, unitData);
            else if (state.tab === 'sentence') renderSentenceBuilding(contentDiv, unitData);
            else if (state.tab === 'summary') renderSummaryWriting(contentDiv, unitData);
            else if (state.tab === 'headline') renderHeadlineWriting(contentDiv, unitData);
            else if (state.tab === 'factopinion') renderFactOpinion(contentDiv, unitData);
            else if (state.tab === 'debate') renderDebateCorner(contentDiv, unitData);
            else if (state.tab === 'discussion') renderDiscussion(contentDiv, unitData);
            else if (state.tab === 'dictation') renderDictation(contentDiv, unitData);
            else if (state.tab === 'review') renderReview(contentDiv, unitData);
            else if (state.tab === 'pronunciation') renderPronunciationDrill(contentDiv, unitData);
            else if (state.tab === 'exam') renderExamPractice(contentDiv, unitData);
            else if (state.tab === 'challenge') renderGoal(contentDiv, unitData);
            else if (state.tab === 'codelab') renderCodeLab(contentDiv, unitData);
        }

        // ===== MY PROGRESS =====
        const ALL_TABS = ['video','learn','terms','quiz','think','funfact','vocabgame','spelling','sentence','summary','headline','factopinion','debate','discussion','dictation','review','pronunciation','exam','challenge'];
        function markActivityComplete(tab) {
            progress.completed = progress.completed || {};
            const key = state.level + '_' + state.unit + '_' + tab;
            if (!progress.completed[key]) { progress.completed[key] = true; saveProgress(); }
        }
        function showMyProgress() {
            const lines = LEVELS_ORDER.map(lvl => {
                let data = null;
                if (lvl === state.level) data = progress;
                else { try { data = JSON.parse(localStorage.getItem(PROGRESS_PREFIX + lvl) || 'null'); } catch (e) {} }
                const done = data && data.completed ? Object.keys(data.completed).filter(k => k.startsWith(lvl + '_')).length : 0;
                const total = Object.keys(curriculum[lvl]).length * ALL_TABS.length;
                return `${gradeName(lvl)}: ${done} / ${total} activities (${Math.round(done / total * 100)}%)${lvl === state.level ? ' ← current' : ''}`;
            }).join('\n');
            const unitDone = ALL_TABS.filter(t => progress.completed && progress.completed[state.level + '_' + state.unit + '_' + t]).length;
            alert(`📊 My Progress\n\n⭐ Stars: ${state.stars}\n🏆 Badges: ${state.badges}\n\nThis unit (Unit ${state.unit}): ${unitDone} / ${ALL_TABS.length} modules done\n\n${lines}\n\n(Saved on this device/browser only. Inside the Hub, progress lasts until the page is closed.)`);
        }

        // ===== 1. LEARN =====
        function renderLearn(contentDiv, unitData) {
            contentDiv.innerHTML = `

        // ===== 3. QUIZ (listen and choose) =====

        // ===== 4. THINK ABOUT IT =====

        // ===== 5. DID YOU KNOW =====

        function textCheck(msg, text, need, okText, key, amount) {
            const n = countWords(text);

        function usedUnitWords(text, unitData) {
            const t = ' ' + String(text).toLowerCase().replace(/[^a-z0-9'’\- ]+/g, ' ').replace(/\s+/g, ' ') + ' ';
            return unitData.vocab.filter(w => {
                const base = w.toLowerCase().replace(/[^a-z0-9'’\- ]+/g, ' ').trim();
                if (!base) return false;
                // whole word, allowing simple endings: s, es, ed, ing
                const re = new RegExp('[ ]' + base.replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace(/ /g, '[ ]') + '(s|es|ed|d|ing)?[ ]');
                return re.test(t);

        // ===== 7. VOCABULARY GAME (picture -> word) =====

        // ===== 8. SPELLING PRACTICE (tap scrambled letters in order) =====

        function resetSpelling() { renderSpellingUI(); }
        // ===== 9. SENTENCE BUILDING (reorder scrambled words from the story) =====
        let sentenceState = { correctOrder: [], current: [], picked: [], target: '', done: false };
