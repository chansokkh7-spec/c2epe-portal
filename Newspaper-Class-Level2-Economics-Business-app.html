es the feature praise?"], [183.58, 192.18, "Risk-taking, innovation and a clear business plan. She spotted a market gap that was so obvious that nobody saw it."], [193.28, 195.63, "And what happens after the funding round?"], [196.72, 203.11, "The startup tries to scale. Success can be so rapid that managing growth becomes the next challenge."], [204.27, 205.99, "Part three: grammar."], [206.85, 211.04, "Grammar focus: Result clauses: so  that and such  that."], [211.34, 212.57, "Look at the pattern."], [213.25, 216.39, "She was so determined that she sold her car to start the firm."], [217.28, 220.34, "It was such a strong idea that investors queued up."], [221.25, 224.34, "The growth was so rapid that managing it became difficult."], [225.3, 232.59, "Use so + adjective/adverb and such + (a/an) + adjective + noun before 'that': so rapid that..., such a good plan that..."], [233.35, 237.04, "Be careful! Don't say: It was so good idea that we won."], [239.0, 241.7, "Say: It was such a good idea that we won."], [242.0, 244.98, "Use such + a/an + adjective + noun."], [245.77, 248.23, "Part four: reading. Read and listen."], [249.03, 250.48, "Making a Startup Work."], [250.78, 254.25, "Entrepreneurs notice a market gap that other people overlook."], [255.23, 259.65, "Their innovation may be so simple that rivals wonder why they did not think of it first."], [260.63, 265.49, "A clear business plan and some risk-taking attract venture capital in a funding round."], [266.5, 270.67, "Success can be so fast that the company must scale before its systems are ready."], [271.67, 276.55, "Resilience is therefore such an important quality that investors often judge founders by it."], [277.63, 281.6, "Part five: quiz. Five questions. Are you ready?"], [282.45, 285.05, "She was blank determined that she sold her car."], [285.35, 288.45, "A, so. B, such. C, very that."], [292.0, 293.72, "The answer is A: so."], [294.88, 297.66, "It was blank a strong idea that investors queued up."], [297.96, 301.43, "A, so. B, such. C, too."], [304.97, 307.09, "The answer is B: such."], [308.25, 311.17, "A need that no company satisfies is a market blank."], [311.47, 314.45, "A, gap. B, round. C, plan."], [318.0, 319.76, "The answer is A: gap."], [320.92, 322.74, "Choose the correct sentence."], [323.04, 329.75, "A, It was so good idea that we won.. B, It was such a good idea that we won.. C, It was such good idea that we won.."], [333.3, 336.44, "The answer is B: It was such a good idea that we won.."], [337.58, 341.32, "According to the reading, investors often judge founders by…"], [341.62, 344.88, "A, resilience. B, age. C, luck."], [348.43, 351.04, "The answer is A: resilience."], [352.23, 355.64, "Part six: speaking. It's your turn to talk."], [356.48, 359.63, "What qualities do you think a successful entrepreneur needs?"], [368.42, 369.84, "Now listen to Visal."], [370.14, 396.43, "A successful entrepreneur needs creativity to spot a market gap and courage for risk-taking. However, determination matters just as much, because most startups face failure before success. Good entrepreneurs are also so organised that they can follow a clear business plan, and they are open to advice. Above all, they learn from their mistakes."], [396.73, 398.31, "Excellent answer, Visal!"], [399.22, 404.59, "Great work! Now you can use eight new words and result clauses: so  that and such  that."], [404.89, 409.15, "Today's value is resourcefulness. Make more from less and waste nothing."], [409.45, 411.94, "See you in Unit four. Goodbye!"], [412.24, 415.22, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-NP2-Unit04-Banking-Finance": [[0.35, 5.75, "Hello, everyone! I'm Ms. Emma. Welcome to Online Newspaper Class, level two."], [6.04, 9.27, "Hi! I'm Visal. Let's learn together!"], [9.57, 15.3, "Unit four: Banking & Finance. Today you will explain processes with modal passives."], [15.6, 18.34, "Here is our lesson map. Let's start!"], [19.3, 22.71, "Part one: words. You will learn eight new words."], [23.55, 24.7, "Interest rate."], [25.72, 29.78, "Interest rate means the percentage charged for borrowing or paid for saving."], [30.38, 32.99, "A higher interest rate makes loans costlier."], [33.58, 36.45, "Your turn. Say: Interest rate."], [39.3, 40.5, "Interest rate."], [41.25, 42.04, "Loan."], [43.05, 45.84, "Loan means money borrowed that must be paid back."], [46.45, 48.68, "The loan was repaid over five years."], [49.28, 51.3, "Your turn. Say: Loan."], [54.13, 55.1, "Loan."], [55.85, 56.61, "Credit."], [57.62, 60.56, "Credit means the ability to borrow money and pay later."], [61.15, 63.61, "Good credit helps you borrow at low cost."], [64.22, 66.68, "Your turn. Say: Credit."], [69.53, 70.23, "Credit."], [70.98, 72.29, "Savings account."], [73.28, 77.06, "Savings account means a bank account that pays interest on money you keep."], [77.65, 80.08, "Her savings account grows slowly."], [80.68, 83.02, "Your turn. Say: Savings account."], [85.87, 87.15, "Savings account."], [87.88, 89.05, "Inflation."], [90.05, 93.43, "Inflation means a general rise in prices over time."], [94.02, 96.67, "Inflation reduces what savings can buy."], [97.25, 99.72, "Your turn. Say: Inflation."], [102.57, 103.74, "Inflation."], [104.48, 105.7, "Central bank."], [106.72, 110.82, "Central bank means the national bank that controls money and interest rates."], [111.42, 113.47, "The central bank raised rates again."], [114.08, 117.22, "Your turn. Say: Central bank."], [120.07, 121.32, "Central bank."], [122.08, 123.04, "Deposit."], [124.05, 126.62, "Deposit means money placed in a bank account."], [127.22, 130.05, "Her monthly deposit is small but regular."], [130.65, 133.06, "Your turn. Say: Deposit."], [135.9, 136.87, "Deposit."], [137.62, 139.13, "Financial literacy."], [140.12, 143.75, "Financial literacy means the knowledge needed to manage money well."], [144.35, 147.12, "Financial literacy should be taught in schools."], [147.72, 150.59, "Your turn. Say: Financial literacy."], [153.43, 154.82, "Financial literacy."], [155.63, 159.24, "Part two: dialogue. Let's listen to a conversation."], [160.08, 162.59, "Visal, how can a loan be repaid safely?"], [163.68, 172.2, "The cost should be calculated first. The interest rate must be compared, and the repayment schedule can be adjusted to fit your income."], [173.28, 175.39, "Why do you use so many passives?"], [176.48, 186.39, "In finance the process matters more than the person. Loans can be approved, deposits may be insured, and rates are set by the central bank."], [187.48, 189.4, "What helps people choose well?"], [190.52, 197.38, "Financial literacy. Credit should be used carefully, and inflation must be considered whenever savings are planned."], [198.53, 200.51, "Part three: grammar."], [201.35, 205.91, "Grammar focus: Modal passives: can be and must be and should be."], [206.22, 207.36, "Look at the pattern."], [208.05, 211.04, "The cost of a loan should be calculated before you sign."], [211.95, 214.5, "Interest rates are set by the central bank."], [215.38, 217.67, "Deposits may be insured up to a limit."], [218.63, 227.52, "Form modal passives with modal + be + past participle: can be repaid, must be compared. Add 'by + agent' only when the agent matters."], [228.28, 231.6, "Be careful! Don't say: Rates can set by the bank."], [233.53, 235.67, "Say: Rates can be set by the bank."], [235.97, 239.57, "Modal passive: modal + be + past participle."], [240.37, 243.21, "Part four: reading. Read and listen."], [244.0, 245.15, "How Banks Work."], [245.45, 249.41, "A bank takes deposits from savers and lends the money to borrowers."], [250.4, 255.96, "Interest rates are set by the central bank, so a loan can become cheaper or costlier overnight."], [256.97, 261.47, "Credit must be used carefully, because borrowed money has to be repaid with interest."], [262.47, 269.02, "Inflation should also be considered, since a savings account may lose value if prices rise faster than interest."], [270.03, 273.44, "Financial literacy therefore protects every household."], [274.53, 278.55, "Part five: quiz. Five questions. Are you ready?"], [279.38, 282.0, "The cost of a loan should blank before you sign."], [282.3, 286.49, "A, be calculated. B, calculated. C, to calculate."], [290.03, 292.58, "The answer is A: be calculated."], [293.72, 295.94, "A general rise in prices is blank."], [296.24, 300.25, "A, inflation. B, credit. C, a deposit."], [303.8, 306.0, "The answer is A: inflation."], [307.15, 310.55, "The national bank that controls interest rates is the blank bank."], [310.85, 314.36, "A, central. B, savings. C, credit."], [317.9, 319.89, "The answer is A: central."], [321.05, 322.78, "Choose the correct sentence."], [323.08, 329.72, "A, Rates can set by banks.. B, Rates can be set by banks.. C, Rates can be setting by banks.."], [333.27, 336.09, "The answer is B: Rates can be set by banks.."], [337.25, 341.11, "According to the reading, a savings account may lose value if…"], [341.41, 347.14, "A, prices rise faster than interest. B, you deposit often. C, rates fall."], [350.7, 354.05, "The answer is A: prices rise faster than interest."], [355.23, 358.26, "Part six: speaking. It's your turn to talk."], [359.12, 363.0, "Why is financial literacy important for making good money decisions?"], [371.78, 373.27, "Now listen to Visal."], [373.57, 400.64, "Financial literacy is important because money decisions affect people's whole lives. Someone who understands interest rates and inflation can compare loans, avoid dangerous debt and choose a suitable savings account. Without this knowledge, even an intelligent person may sign a costly contract by mistake. Therefore, schools should teach it early."], [400.94, 402.56, "Excellent answer, Visal!"], [403.45, 409.25, "Great work! Now you can use eight new words and modal passives: can be and must be and should be."], [409.55, 415.05, "Today's value is financial literacy. Understand money well enough to make wise decisions."], [415.35, 418.11, "See you in Unit five. Goodbye!"], [418.41, 421.24, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-NP2-Unit05-Labor-Market": [[0.35, 5.58, "Hello, everyone! I'm Ms. Emma. Welcome to Online Newspaper Class, level two."], [5.88, 9.54, "Hi! I'm Visal. Let's learn together!"], [9.84, 16.24, "Unit five: Labor Market. Today you will describe ongoing change with the present perfect continuous."], [16.54, 19.32, "Here is our lesson map. Let's start!"], [20.27, 23.62, "Part one: words. You will learn eight new words."], [24.45, 26.0, "Unemployment rate."], [26.98, 31.47, "Unemployment rate means the percentage of workers who have no job but want one."], [32.08, 34.5, "The unemployment rate fell to four percent."], [35.12, 37.88, "Your turn. Say: Unemployment rate."], [40.73, 42.2, "Unemployment rate."], [42.95, 44.02, "Job market."], [45.02, 48.17, "Job market means the supply of and demand for workers."], [48.75, 51.21, "The job market is strong for engineers."], [51.82, 54.86, "Your turn. Say: Job market."], [57.7, 58.81, "Job market."], [59.55, 60.87, "Minimum wage."], [61.85, 65.74, "Minimum wage means the lowest pay an employer may legally give."], [66.35, 68.28, "The minimum wage rose in January."], [68.88, 71.71, "Your turn. Say: Minimum wage."], [74.57, 75.95, "Minimum wage."], [76.72, 77.97, "Workforce."], [78.98, 82.57, "Workforce means all the people who work in a company or country."], [83.18, 85.07, "A young workforce drives growth."], [85.68, 88.17, "Your turn. Say: Workforce."], [91.03, 92.1, "Workforce."], [92.85, 93.87, "Labor union."], [94.88, 98.74, "Labor union means an organisation that defends workers' rights."], [99.35, 102.19, "The labor union negotiated better conditions."], [102.78, 105.45, "Your turn. Say: Labor union."], [108.3, 109.52, "Labor union."], [110.28, 111.54, "Skill gap."], [112.55, 116.94, "Skill gap means the difference between skills employers need and workers have."], [117.55, 120.03, "A skill gap slows many factories."], [120.62, 123.56, "Your turn. Say: Skill gap."], [126.4, 127.8, "Skill gap."], [128.55, 130.12, "Employment contract."], [131.12, 135.16, "Employment contract means a written agreement between employer and employee."], [135.75, 138.3, "Read the employment contract carefully."], [138.88, 141.9, "Your turn. Say: Employment contract."], [144.73, 146.41, "Employment contract."], [147.15, 148.24, "Remote work."], [149.25, 153.56, "Remote work means working from home or another place away from the office."], [154.15, 156.28, "Remote work has changed city life."], [156.88, 159.66, "Your turn. Say: Remote work."], [162.5, 163.64, "Remote work."], [164.43, 168.21, "Part two: dialogue. Let's listen to a conversation."], [169.05, 174.71, "Visal, the paper says 'Companies have been hiring remotely since the pandemic.' Why 'have been hiring'?"], [175.82, 186.62, "The present perfect continuous shows an action that began in the past and is still in progress. It stresses the process, not just the result."], [187.72, 189.55, "What other labor news uses it?"], [190.65, 198.74, "'Unions have been demanding a higher minimum wage' or 'The skill gap has been widening for years.'"], [199.85, 201.86, "Does it change the job market?"], [202.95, 211.57, "Yes. Remote work has been reshaping the workforce, and employment contracts have been changing to match."], [212.73, 214.19, "Part three: grammar."], [215.05, 218.97, "Grammar focus: Present perfect continuous for ongoing change."], [219.26, 220.46, "Look at the pattern."], [221.15, 224.12, "Companies have been hiring remotely since the pandemic."], [225.02, 227.46, "The skill gap has been widening for years."], [228.35, 231.24, "Unions have been demanding a higher minimum wage."], [232.2, 241.19, "Use have/has been + -ing for actions that started in the past and continue now, often with for or since. State verbs (know, own) do not take this form."], [241.95, 245.62, "Be careful! Don't say: Unions have been demand more pay."], [247.57, 250.1, "Say: Unions have been demanding more pay."], [250.4, 251.92, "Use -ing after have been."], [252.73, 255.11, "Part four: reading. Read and listen."], [255.9, 257.48, "A Changing Workplace."], [257.78, 261.05, "The labor market has been changing quickly over the past decade."], [262.03, 267.65, "Remote work has been reshaping the workforce, and many employment contracts now allow flexible hours."], [268.67, 275.45, "A labor union has been campaigning for a higher minimum wage, while employers have been complaining about a skill gap."], [276.43, 280.94, "The unemployment rate has been falling slowly, but good jobs are not equally available."], [281.93, 284.54, "Workers and employers will need to keep adapting."], [285.63, 289.69, "Part five: quiz. Five questions. Are you ready?"], [290.55, 292.97, "The skill gap blank widening for years."], [293.27, 296.97, "A, has been. B, is been. C, have being."], [300.53, 302.44, "The answer is A: has been."], [303.58, 307.09, "The lowest pay an employer may legally give is the blank."], [307.39, 311.41, "A, minimum wage. B, workforce. C, contract."], [314.97, 317.16, "The answer is A: minimum wage."], [318.32, 321.66, "An organisation that defends workers' rights is a labor blank."], [321.96, 325.14, "A, union. B, gap. C, market."], [328.7, 330.52, "The answer is A: union."], [331.68, 333.49, "Choose the correct sentence."], [333.79, 340.96, "A, Unions have been demand higher pay.. B, Unions have been demanding higher pay.. C, Unions has been demanding higher pay.."], [344.5, 347.94, "The answer is B: Unions have been demanding higher pay.."], [349.08, 352.37, "According to the reading, the unemployment rate has been…"], [352.67, 357.32, "A, rising fast. B, falling slowly. C, constant."], [360.87, 363.54, "The answer is B: falling slowly."], [364.73, 367.86, "Part six: speaking. It's your turn to talk."], [368.72, 371.45, "How has remote work changed the modern labor market?"], [380.25, 381.9, "Now listen to Visal."], [382.2, 406.8, "Remote work has opened the labor market to people who live far from big cities, so employers can hire from a wider pool. It has also saved commuting time, although some workers feel isolated. Companies have been rewriting employment contracts to include flexible hours. However, jobs that need physical presence cannot benefit in the same way."], [407.1, 408.93, "Excellent answer, Visal!"], [409.82, 415.71, "Great work! Now you can use eight new words and present perfect continuous for ongoing change."], [416.01, 421.04, "Today's value is adaptability. Be ready for rain or sun and change your plans."], [421.34, 423.89, "See you in Unit six. Goodbye!"], [424.19, 426.99, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-NP2-Unit06-Economic-Policy": [[0.35, 5.84, "Hello, everyone! I'm Ms. Emma. Welcome to Online Newspaper Class, level two."], [6.14, 9.44, "Hi! I'm Visal. Let's learn together!"], [9.74, 16.16, "Unit six: Economic Policy. Today you will compare with double comparatives: the more..., the more...."], [16.46, 19.0, "Here is our lesson map. Let's start!"], [19.97, 23.21, "Part one: words. You will learn eight new words."], [24.05, 25.41, "Fiscal policy."], [26.42, 30.27, "Fiscal policy means government decisions about taxes and spending."], [30.88, 33.58, "Fiscal policy can boost a weak economy."], [34.18, 37.16, "Your turn. Say: Fiscal policy."], [40.0, 41.27, "Fiscal policy."], [42.02, 43.67, "Monetary policy."], [44.68, 49.47, "Monetary policy means central bank decisions about money and interest rates."], [50.08, 53.15, "Monetary policy aims to control inflation."], [53.75, 56.82, "Your turn. Say: Monetary policy."], [59.67, 61.34, "Monetary policy."], [62.08, 63.03, "Subsidy."], [64.02, 67.53, "Subsidy means money the government gives to support an industry."], [68.12, 70.51, "A subsidy kept fuel prices low."], [71.12, 73.95, "Your turn. Say: Subsidy."], [76.8, 77.8, "Subsidy."], [78.55, 79.68, "Tax reform."], [80.68, 84.12, "Tax reform means a major change to how taxes are collected."], [84.72, 86.83, "Tax reform simplified the system."], [87.42, 90.71, "Your turn. Say: Tax reform."], [93.57, 94.84, "Tax reform."], [95.58, 96.86, "Budget deficit."], [97.85, 101.47, "Budget deficit means when a government spends more than it collects."], [102.08, 104.29, "A budget deficit means more borrowing."], [104.88, 108.08, "Your turn. Say: Budget deficit."], [110.93, 112.21, "Budget deficit."], [112.95, 114.12, "Economic growth."], [115.12, 119.16, "Economic growth means an increase in the value of what a country produces."], [119.75, 122.17, "Economic growth creates new jobs."], [122.78, 125.98, "Your turn. Say: Economic growth."], [128.83, 130.36, "Economic growth."], [131.12, 132.26, "Regulation."], [133.25, 136.94, "Regulation means an official rule made to control an activity."], [137.55, 139.92, "New regulation protects consumers."], [140.52, 142.89, "Your turn. Say: Regulation."], [145.73, 146.98, "Regulation."], [147.72, 148.91, "Public spending."], [149.92, 154.18, "Public spending means money a government spends on services."], [154.78, 156.91, "Public spending on schools increased."], [157.52, 160.31, "Your turn. Say: Public spending."], [163.17, 164.57, "Public spending."], [165.37, 169.27, "Part two: dialogue. Let's listen to a conversation."], [170.12, 176.76, "Visal, an editorial says 'The more the government spends, the larger the budget deficit becomes.' What is this structure?"], [177.85, 183.04, "A double comparative: the + comparative, the + comparative. It shows that two things change together."], [184.15, 185.91, "Can I use it for policy?"], [187.02, 198.85, "Of course. 'The lower the interest rate, the cheaper the loans.' Fiscal policy and monetary policy both involve these trade-offs."], [199.95, 202.5, "So how do tax reform and subsidies fit?"], [203.58, 211.59, "The bigger the subsidy, the greater the cost to the budget. Economists use the structure to explain relationships clearly."], [212.73, 214.58, "Part three: grammar."], [215.42, 219.32, "Grammar focus: Double comparatives: the more, the more."], [219.62, 220.78, "Look at the pattern."], [221.48, 224.8, "The more the state spends, the larger the budget deficit becomes."], [225.68, 228.79, "The lower the interest rate, the cheaper loans become."], [229.68, 233.04, "The bigger the subsidy, the greater the cost to the budget."], [234.0, 241.92, "Use the + comparative, the + comparative to show that two changes happen together. Keep the order subject + verb in each part."], [242.68, 246.76, "Be careful! Don't say: The lower the rate, cheaper the loan."], [248.7, 251.71, "Say: The lower the rate, the cheaper the loan."], [252.01, 253.47, "Both parts need 'the'."], [254.27, 257.16, "Part four: reading. Read and listen."], [257.97, 259.6, "Two Kinds of Policy."], [259.89, 264.22, "Governments manage the economy through fiscal policy and monetary policy."], [265.2, 272.34, "Fiscal policy uses taxes and public spending, while monetary policy uses interest rates set by the central bank."], [273.33, 278.65, "The more a state spends, the larger its budget deficit becomes unless tax reform raises income."], [279.67, 284.96, "The bigger a subsidy is, the greater its cost, but economic growth may justify it."], [285.97, 289.0, "Careful regulation balances all of these goals."], [290.1, 293.86, "Part five: quiz. Five questions. Are you ready?"], [294.72, 297.3, "The more the state spends, the blank the deficit."], [297.6, 301.15, "A, larger. B, large. C, largest."], [304.7, 306.63, "The answer is A: larger."], [307.78, 311.06, "Decisions about taxes and spending are blank policy."], [311.36, 314.93, "A, fiscal. B, monetary. C, foreign."], [318.47, 320.23, "The answer is A: fiscal."], [321.38, 324.66, "Money given by the government to support an industry is a blank."], [324.96, 329.19, "A, subsidy. B, regulation. C, deficit."], [332.73, 334.81, "The answer is A: subsidy."], [335.95, 337.71, "Choose the correct sentence."], [338.01, 345.83, "A, The lower the rate, cheaper the loans.. B, The lower the rate, the cheaper the loans.. C, The more low the rate, the cheap loans.."], [349.37, 352.48, "The answer is B: The lower the rate, the cheaper the loans.."], [353.62, 357.89, "According to the reading, monetary policy uses rates set by the…"], [358.19, 362.53, "A, central bank. B, parliament. C, tax office."], [366.07, 368.52, "The answer is A: central bank."], [369.73, 372.83, "Part six: speaking. It's your turn to talk."], [373.68, 377.29, "What is the difference between fiscal policy and monetary policy?"], [386.08, 387.79, "Now listen to Visal."], [388.09, 414.37, "Fiscal policy is controlled by the government and uses taxes and public spending to influence the economy. Monetary policy is controlled by the central bank and uses interest rates and the supply of money. In short, fiscal policy changes how much the government taxes and spends, whereas monetary policy changes how expensive it is to borrow."], [414.67, 416.3, "Excellent answer, Visal!"], [417.22, 422.39, "Great work! Now you can use eight new words and double comparatives: the more, the more."], [422.69, 427.91, "Today's value is economic literacy. Understand how money and work shape people's lives."], [428.21, 430.71, "See you in Unit seven. Goodbye!"], [431.01, 433.86, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-NP2-Unit07-Corporate-Strategy": [[0.35, 5.95, "Hello, everyone! I'm Ms. Emma. Welcome to Online Newspaper Class, level two."], [6.25, 10.02, "Hi! I'm Visal. Let's learn together!"], [10.32, 16.76, "Unit seven: Corporate Strategy. Today you will use participle clauses to link strategic actions."], [17.06, 19.59, "Here is our lesson map. Let's start!"], [20.53, 23.56, "Part one: words. You will learn eight new words."], [24.42, 26.05, "Competitive advantage."], [27.05, 31.05, "Competitive advantage means something that helps a company beat its rivals."], [31.65, 34.37, "Low costs gave the firm a competitive advantage."], [34.98, 38.13, "Your turn. Say: Competitive advantage."], [41.0, 42.66, "Competitive advantage."], [43.42, 44.64, "Market positioning."], [45.65, 49.89, "Market positioning means how a company wants customers to see its brand."], [50.48, 53.11, "Careful market positioning attracted young buyers."], [53.72, 56.76, "Your turn. Say: Market positioning."], [59.6, 60.9, "Market positioning."], [61.65, 62.95, "Growth strategy."], [63.95, 68.12, "Growth strategy means a plan for increasing sales and market share."], [68.72, 71.48, "The growth strategy focused on new countries."], [72.08, 75.31, "Your turn. Say: Growth strategy."], [78.17, 79.63, "Growth strategy."], [80.38, 81.71, "Diversification."], [82.72, 87.5, "Diversification means expanding into new products or markets to reduce risk."], [88.12, 91.27, "Diversification protected the company in a recession."], [91.85, 94.78, "Your turn. Say: Diversification."], [97.63, 99.11, "Diversification."], [99.85, 100.87, "Core business."], [101.88, 105.83, "Core business means the main activity from which a company earns most money."], [106.45, 109.01, "Rice milling is the firm's core business."], [109.62, 112.56, "Your turn. Say: Core business."], [115.4, 116.75, "Core business."], [117.48, 118.83, "Strategic plan."], [119.82, 124.53, "Strategic plan means a detailed plan for reaching long-term goals."], [125.12, 127.43, "The strategic plan covers five years."], [128.02, 130.8, "Your turn. Say: Strategic plan."], [133.63, 135.12, "Strategic plan."], [135.88, 137.0, "Business model."], [138.02, 141.35, "Business model means the way a company creates and earns money."], [141.95, 144.96, "A subscription business model brings steady income."], [145.55, 148.46, "Your turn. Say: Business model."], [151.3, 152.38, "Business model."], [153.12, 154.47, "Long-term vision."], [155.45, 160.16, "Long-term vision means a clear idea of where a company wants to be in the future."], [160.75, 163.5, "A long-term vision guides every decision."], [164.12, 167.72, "Your turn. Say: Long-term vision."], [170.57, 172.12, "Long-term vision."], [172.93, 176.91, "Part two: dialogue. Let's listen to a conversation."], [177.75, 185.44, "Visal, a business report says 'Having expanded abroad, the firm now faces new competition.' What is 'Having expanded'?"], [186.55, 194.43, "A perfect participle clause. It shows that one action happened before another, and both have the same subject."], [195.52, 196.87, "Are there other forms?"], [197.95, 209.41, "Yes. 'Focusing on its core business, the company grew steadily' gives a reason or a time. 'Supported by a clear strategic plan, it succeeded' is passive."], [210.52, 212.78, "Why do strategy articles use them?"], [213.88, 223.52, "They link actions concisely: building a competitive advantage, adopting diversification, and shaping a long-term vision."], [224.67, 225.99, "Part three: grammar."], [226.85, 230.16, "Grammar focus: Participle clauses in business writing."], [230.46, 231.69, "Look at the pattern."], [232.38, 236.14, "Having expanded abroad, the firm now faces new competition."], [237.05, 240.14, "Focusing on its core business, the company grew steadily."], [241.05, 244.78, "Supported by a clear strategic plan, it reached its targets."], [245.73, 256.29, "The subject of the participle clause must be the same as the subject of the main clause. Use -ing (active), having + past participle (earlier action) or -ed (passive)."], [257.05, 261.45, "Be careful! Don't say: Expanded abroad, the firm now faces it."], [263.4, 267.02, "Say: Having expanded abroad, the firm now faces it."], [267.32, 270.36, "Use having + participle for an earlier action."], [271.17, 274.09, "Part four: reading. Read and listen."], [274.9, 276.42, "Strategy in Action."], [276.72, 281.27, "A successful company needs both a strong core business and a long-term vision."], [282.27, 287.85, "Having built a competitive advantage in its home market, the firm adopted a growth strategy abroad."], [288.87, 294.09, "Supported by a detailed strategic plan, its managers chose careful market positioning."], [295.1, 299.46, "Diversification followed, reducing the risk of relying on one product."], [300.47, 304.2, "A flexible business model keeps such a company strong over time."], [305.3, 309.29, "Part five: quiz. Five questions. Are you ready?"], [310.15, 313.5, "blank abroad, the firm now faces new competition."], [313.8, 318.08, "A, Having expanded. B, Expand. C, To have expanding."], [321.63, 324.32, "The answer is A: Having expanded."], [325.48, 329.07, "Something that helps a company beat its rivals is a competitive blank."], [329.37, 332.89, "A, model. B, advantage. C, positioning."], [336.43, 338.33, "The answer is B: advantage."], [339.48, 342.69, "Expanding into new products to reduce risk is blank."], [342.99, 348.07, "A, diversification. B, a core business. C, a strategic vision."], [351.63, 354.13, "The answer is A: diversification."], [355.28, 357.03, "Choose the correct sentence."], [357.33, 366.19, "A, Focusing on costs, profits rose.. B, Focusing on costs, rose the profits it.. C, Focused on costs, profits rise it.."], [369.73, 373.83, "The answer is A: Focusing on costs, profits rose.."], [374.98, 378.46, "According to the reading, a flexible business model keeps a company…"], [378.76, 382.35, "A, strong. B, small. C, secret."], [385.9, 387.97, "The answer is A: strong."], [389.17, 392.06, "Part six: speaking. It's your turn to talk."], [392.92, 396.56, "What makes a company's business model successful over the long term?"], [405.35, 406.72, "Now listen to Visal."], [407.02, 433.06, "A successful business model solves a real problem for customers and earns money in a way that can last. It should also be flexible, because technology and customer needs change. Companies that have focused on quality, controlled costs and built loyal customers tend to survive. A clear long-term vision helps managers avoid short-term mistakes."], [433.36, 435.05, "Excellent answer, Visal!"], [435.95, 440.68, "Great work! Now you can use eight new words and participle clauses in business writing."], [440.98, 446.22, "Today's value is strategic thinking. Think ahead, and choose your path with purpose."], [446.52, 449.2, "See you in Unit eight. Goodbye!"], [449.5, 452.01, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-NP2-Unit08-Marketing-Advertising": [[0.35, 5.55, "Hello, everyone! I'm Ms. Emma. Welcome to Online Newspaper Class, level two."], [5.85, 9.15, "Hi! I'm Visal. Let's learn together!"], [9.45, 15.61, "Unit eight: Marketing & Advertising. Today you will emphasise ideas with cleft sentences."], [15.91, 18.57, "Here is our lesson map. Let's start!"], [19.53, 22.44, "Part one: words. You will learn eight new words."], [23.28, 24.63, "Target audience."], [25.62, 29.16, "Target audience means the group of people an advertisement is made for."], [29.75, 31.74, "The target audience was teenagers."], [32.35, 35.29, "Your turn. Say: Target audience."], [38.13, 39.42, "Target audience."], [40.18, 41.52, "Brand awareness."], [42.52, 45.89, "Brand awareness means how well consumers recognise a brand."], [46.48, 49.1, "Sponsoring the match raised brand awareness."], [49.68, 52.67, "Your turn. Say: Brand awareness."], [55.53, 57.07, "Brand awareness."], [57.82, 59.46, "Advertising campaign."], [60.45, 64.56, "Advertising campaign means a planned series of advertisements with one goal."], [65.15, 67.73, "The advertising campaign ran for three months."], [68.32, 71.67, "Your turn. Say: Advertising campaign."], [74.5, 76.22, "Advertising campaign."], [76.98, 78.41, "Consumer insight."], [79.42, 83.9, "Consumer insight means a deeper understanding of why customers behave as they do."], [84.52, 87.16, "A consumer insight inspired the slogan."], [87.75, 90.7, "Your turn. Say: Consumer insight."], [93.57, 95.06, "Consumer insight."], [95.82, 97.43, "Market segmentation."], [98.42, 103.02, "Market segmentation means dividing customers into groups with similar needs."], [103.62, 106.87, "Market segmentation helped the firm target students."], [107.48, 110.72, "Your turn. Say: Market segmentation."], [113.57, 115.64, "Market segmentation."], [116.38, 117.56, "Call to action."], [118.55, 122.2, "Call to action means a phrase that urges the audience to do something."], [122.78, 124.92, "'Buy now' is a common call to action."], [125.52, 128.18, "Your turn. Say: Call to action."], [131.03, 132.25, "Call to action."], [133.02, 134.5, "Return on investment."], [135.52, 139.53, "Return on investment means the profit gained compared with the money spent."], [140.12, 142.99, "The campaign delivered a strong return on investment."], [143.58, 146.51, "Your turn. Say: Return on investment."], [149.37, 151.12, "Return on investment."], [151.88, 153.13, "Brand loyalty."], [154.12, 157.69, "Brand loyalty means the habit of buying the same brand repeatedly."], [158.28, 160.93, "Brand loyalty keeps customers returning."], [161.52, 164.26, "Your turn. Say: Brand loyalty."], [167.1, 168.38, "Brand loyalty."], [169.17, 172.72, "Part two: dialogue. Let's listen to a conversation."], [173.58, 181.67, "Visal, an article says 'What persuades customers is a clear call to action.' Why not simply 'A clear call to action persuades customers'?"], [182.78, 191.31, "The cleft sentence adds emphasis. 'What' + clause + is/was + focus puts the important idea at the end."], [192.42, 194.22, "Are there other cleft forms?"], [195.32, 201.42, "'It was the consumer insight that made the campaign work.' We move the key phrase after 'it was' to stress it."], [202.52, 204.98, "Why does marketing writing love emphasis?"], [206.08, 214.7, "Because every campaign wants the target audience to remember one thing: the brand. Cleft sentences help it stand out."], [215.87, 217.54, "Part three: grammar."], [218.38, 221.96, "Grammar focus: Cleft sentences for emphasis."], [222.26, 223.47, "Look at the pattern."], [224.18, 227.31, "What persuades customers is a clear call to action."], [228.22, 231.25, "It was the consumer insight that made the campaign work."], [232.15, 234.59, "What the brand needs is stronger loyalty."], [235.53, 244.77, "Use What + clause + is/was + focus, or It is/was + focus + that + clause, to emphasise one idea. Do not drop 'that' in the it-cleft."], [245.52, 249.0, "Be careful! Don't say: It was the insight made it work."], [250.97, 253.58, "Say: It was the insight that made it work."], [253.88, 255.52, "Keep 'that' in an it-cleft."], [256.33, 258.8, "Part four: reading. Read and listen."], [259.6, 261.4, "What Makes an Advert Work."], [261.7, 265.38, "An advertising campaign starts with a clear target audience."], [266.4, 271.17, "What marketers need first is a consumer insight, because it explains how people think."], [272.17, 276.75, "It is market segmentation that lets a brand speak to each group in its own way."], [277.77, 282.15, "What customers remember is usually a simple message and a strong call to action."], [283.13, 287.27, "In the end, it is brand loyalty that produces the best return on investment."], [288.37, 292.39, "Part five: quiz. Five questions. Are you ready?"], [293.25, 296.5, "blank persuades customers is a clear call to action."], [296.8, 299.63, "A, What. B, It. C, That."], [303.17, 304.8, "The answer is A: What."], [305.95, 309.23, "How well consumers recognise a brand is brand blank."], [309.53, 313.78, "A, awareness. B, loyalty. C, segmentation."], [317.33, 319.83, "The answer is A: awareness."], [320.98, 324.14, "Profit compared with money spent is the blank on investment."], [324.44, 327.96, "A, return. B, call. C, target."], [331.5, 333.37, "The answer is A: return."], [334.52, 336.24, "Choose the correct sentence."], [336.54, 342.84, "A, It was the insight made it work.. B, It was the insight that made it work.. C, What the insight made it work.."], [346.4, 349.56, "The answer is B: It was the insight that made it work.."], [350.72, 354.81, "According to the reading, the best return on investment comes from brand…"], [355.11, 358.77, "A, loyalty. B, colour. C, slogans."], [362.33, 364.03, "The answer is A: loyalty."], [365.23, 368.42, "Part six: speaking. It's your turn to talk."], [369.28, 372.88, "What is an advertisement that made a strong impression on you, and why?"], [381.68, 383.09, "Now listen to Visal."], [383.39, 403.95, "One advertisement that impressed me was a short film about a family sharing a meal. What made it powerful was the story, not the product. It was the emotion that stayed in my memory, and the brand name appeared only at the end. As a result, I still remember the message and the company."], [404.25, 405.9, "Excellent answer, Visal!"], [406.82, 411.35, "Great work! Now you can use eight new words and cleft sentences for emphasis."], [411.65, 415.83, "Today's value is creativity. Use your imagination when you play."], [416.13, 418.79, "See you in Unit nine. Goodbye!"], [419.09, 422.34, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-NP2-Unit09-E-commerce-Trends": [[0.35, 6.01, "Hello, everyone! I'm Ms. Emma. Welcome to Online Newspaper Class, level two."], [6.31, 9.5, "Hi! I'm Visal. Let's learn together!"], [9.8, 16.63, "Unit nine: E-commerce Trends. Today you will express concession with despite, in spite of and even though."], [16.93, 19.46, "Here is our lesson map. Let's start!"], [20.4, 23.55, "Part one: words. You will learn eight new words."], [24.42, 26.01, "Online marketplace."], [27.02, 31.22, "Online marketplace means a website where many sellers offer goods to buyers."], [31.82, 35.47, "Small sellers reach customers on an online marketplace."], [36.05, 39.0, "Your turn. Say: Online marketplace."], [41.87, 43.4, "Online marketplace."], [44.15, 45.5, "Checkout process."], [46.48, 50.83, "Checkout process means the steps a customer follows to pay for an online order."], [51.42, 54.15, "A simple checkout process increases sales."], [54.75, 57.89, "Your turn. Say: Checkout process."], [60.73, 62.14, "Checkout process."], [62.88, 63.94, "Digital payment."], [64.95, 68.64, "Digital payment means paying for goods using electronic methods."], [69.25, 71.53, "Digital payment is fast and convenient."], [72.12, 75.09, "Your turn. Say: Digital payment."], [77.93, 79.04, "Digital payment."], [79.78, 81.3, "Shipping logistics."], [82.28, 86.44, "Shipping logistics means the organisation of delivering goods to customers."], [87.05, 90.4, "Shipping logistics decide how quickly parcels arrive."], [90.98, 94.37, "Your turn. Say: Shipping logistics."], [97.23, 98.81, "Shipping logistics."], [99.55, 100.8, "Customer review."], [101.78, 105.22, "Customer review means an opinion written by a buyer about a product."], [105.82, 108.31, "A good customer review builds trust."], [108.92, 111.85, "Your turn. Say: Customer review."], [114.7, 116.28, "Customer review."], [117.02, 118.3, "Mobile shopping."], [119.28, 122.34, "Mobile shopping means buying goods using a smartphone."], [122.95, 124.98, "Mobile shopping grows every year."], [125.58, 128.53, "Your turn. Say: Mobile shopping."], [131.37, 132.56, "Mobile shopping."], [133.32, 134.65, "Conversion rate."], [135.65, 139.56, "Conversion rate means the percentage of visitors who actually buy something."], [140.15, 142.41, "A better photo raised the conversion rate."], [143.02, 145.52, "Your turn. Say: Conversion rate."], [148.37, 149.62, "Conversion rate."], [150.38, 151.48, "Cart abandonment."], [152.48, 156.34, "Cart abandonment means when a shopper leaves without completing a purchase."], [156.95, 159.17, "Hidden fees cause cart abandonment."], [159.78, 162.22, "Your turn. Say: Cart abandonment."], [165.07, 166.37, "Cart abandonment."], [167.17, 171.17, "Part two: dialogue. Let's listen to a conversation."], [172.02, 179.28, "Visal, an article says 'Despite rapid growth, online shops still lose many customers at checkout.' What does 'despite' mean?"], [180.38, 191.9, "It shows contrast, like although, but it is followed by a noun or -ing: despite rapid growth, despite having low prices."], [193.02, 193.97, "And 'even though'?"], [195.08, 204.3, "Even though is followed by a clause and is stronger: 'Even though the shipping was free, many shoppers abandoned their carts.'"], [205.38, 206.86, "Why do shoppers leave?"], [207.95, 216.8, "In spite of attractive prices, a slow checkout process or unexpected fees can reduce the conversion rate."], [217.93, 219.42, "Part three: grammar."], [220.28, 224.38, "Grammar focus: Concession: despite and in spite of and even though."], [224.68, 225.96, "Look at the pattern."], [226.65, 230.54, "Despite rapid growth, many shops lose customers at checkout."], [231.45, 235.19, "Even though shipping was free, many shoppers left their carts."], [236.08, 239.82, "In spite of having low prices, the site had a low conversion rate."], [240.77, 249.04, "Despite / in spite of + noun or -ing (never 'despite of'). Even though / although + subject + verb. All three show a surprising contrast."], [249.78, 254.08, "Be careful! Don't say: Despite of the price, we bought it."], [256.03, 259.08, "Say: Despite the price, we bought it."], [259.38, 261.41, "Say 'despite', not 'despite of'."], [262.2, 264.89, "Part four: reading. Read and listen."], [265.7, 267.47, "Why Carts Are Left Behind."], [267.77, 272.13, "Online shopping has grown quickly, and mobile shopping now leads the trend."], [273.13, 277.61, "Despite this growth, cart abandonment remains high on every online marketplace."], [278.6, 283.71, "Even though a digital payment takes seconds, a long checkout process can drive buyers away."], [284.7, 290.58, "In spite of good prices, poor shipping logistics and weak customer reviews also reduce the conversion rate."], [291.57, 295.47, "Successful shops therefore make buying simple, clear and trustworthy."], [296.57, 300.51, "Part five: quiz. Five questions. Are you ready?"], [301.35, 304.78, "blank rapid growth, many shops lose customers."], [305.08, 309.04, "A, Despite. B, Even though. C, Despite of."], [312.6, 314.67, "The answer is A: Despite."], [315.82, 318.91, "blank shipping was free, shoppers left their carts."], [319.21, 323.09, "A, Even though. B, Despite. C, Because of."], [326.63, 328.53, "The answer is A: Even though."], [329.68, 332.91, "The percentage of visitors who actually buy is the blank rate."], [333.21, 336.74, "A, conversion. B, shipping. C, review."], [340.3, 342.22, "The answer is A: conversion."], [343.38, 345.08, "Choose the correct sentence."], [345.38, 352.3, "A, Despite of the price, we bought it.. B, Despite the price, we bought it.. C, Despite the price was low, we bought it.."], [355.83, 358.95, "The answer is B: Despite the price, we bought it.."], [360.08, 362.9, "According to the reading, successful shops make buying…"], [363.2, 368.56, "A, simple, clear and trustworthy. B, slow and secret. C, expensive."], [372.1, 375.48, "The answer is A: simple, clear and trustworthy."], [376.67, 380.05, "Part six: speaking. It's your turn to talk."], [380.92, 385.32, "Why might a customer abandon their shopping cart before completing an online purchase?"], [394.12, 395.7, "Now listen to Visal."], [396.0, 418.51, "A customer might abandon a cart because of unexpected costs such as shipping or taxes, which appear only at the end. Others leave when the checkout process is long, or when they do not trust the payment security. Some are only comparing prices, even though they like the product. Clear information and a simple checkout can reduce this problem."], [418.81, 420.48, "Excellent answer, Visal!"], [421.38, 428.13, "Great work! Now you can use eight new words and concession: despite and in spite of and even though."], [428.43, 432.94, "Today's value is digital trust. Protect the trust that others place in you."], [433.24, 435.69, "See you in Unit ten. Goodbye!"], [435.99, 439.07, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-NP2-Unit10-Real-Estate-Market": [[0.35, 5.46, "Hello, everyone! I'm Ms. Emma. Welcome to Online Newspaper Class, level two."], [5.75, 9.13, "Hi! I'm Visal. Let's learn together!"], [9.43, 16.4, "Unit ten: Real Estate Market. Today you will describe trends with noun phrases of change and prepositions."], [16.7, 19.47, "Here is our lesson map. Let's start!"], [20.43, 24.16, "Part one: words. You will learn eight new words."], [25.02, 26.31, "Property value."], [27.32, 30.91, "Property value means the amount of money a building or land is worth."], [31.52, 34.31, "The property value rose after the new road opened."], [34.92, 37.72, "Your turn. Say: Property value."], [40.57, 41.72, "Property value."], [42.48, 43.7, "Mortgage rate."], [44.72, 47.99, "Mortgage rate means the interest charged on a loan to buy a home."], [48.58, 51.36, "A lower mortgage rate helps first-time buyers."], [51.95, 54.65, "Your turn. Say: Mortgage rate."], [57.5, 58.67, "Mortgage rate."], [59.42, 60.8, "Housing supply."], [61.82, 65.47, "Housing supply means the number of homes available to buy or rent."], [66.05, 68.66, "Limited housing supply pushed prices up."], [69.25, 71.94, "Your turn. Say: Housing supply."], [74.8, 76.41, "Housing supply."], [77.15, 78.66, "Real estate agent."], [79.65, 84.44, "Real estate agent means a person who helps people buy, sell or rent property."], [85.05, 87.8, "A real estate agent showed us three flats."], [88.42, 91.28, "Your turn. Say: Real estate agent."], [94.13, 95.81, "Real estate agent."], [96.55, 97.66, "Down payment."], [98.65, 102.19, "Down payment means the first part of the price paid when buying a home."], [102.78, 105.11, "She saved for years for a down payment."], [105.72, 108.54, "Your turn. Say: Down payment."], [111.4, 112.55, "Down payment."], [113.32, 114.49, "Rental market."], [115.48, 118.96, "Rental market means the part of the economy where homes are rented."], [119.55, 122.33, "The rental market is busy near universities."], [122.92, 125.79, "Your turn. Say: Rental market."], [128.63, 129.83, "Rental market."], [130.58, 131.78, "Property tax."], [132.78, 136.95, "Property tax means a yearly tax paid by owners of land and buildings."], [137.55, 140.08, "Property tax pays for local services."], [140.68, 143.6, "Your turn. Say: Property tax."], [146.47, 147.77, "Property tax."], [148.52, 149.63, "Housing bubble."], [150.65, 155.31, "Housing bubble means a period when house prices rise unrealistically and then fall."], [155.92, 158.46, "The housing bubble burst in 2008."], [159.05, 161.81, "Your turn. Say: Housing bubble."], [164.67, 165.95, "Housing bubble."], [166.73, 170.69, "Part two: dialogue. Let's listen to a conversation."], [171.55, 178.32, "Visal, a report says 'A two-percent rise in mortgage rates has led to a sharp fall in demand.' What kind of phrase is that?"], [179.42, 189.78, "A noun phrase of change: a rise in, a fall in, an increase of, a drop of. They describe trends without long verbs."], [190.88, 192.82, "Which prepositions do I use?"], [193.92, 206.7, "'In' follows the thing that changes: a rise in property value. 'Of' follows the amount: a rise of two percent. 'By' belongs to verbs: rose by two percent."], [207.78, 209.99, "How does that help real estate news?"], [211.08, 219.34, "A shortage in housing supply, an increase in down payments and an expansion of the rental market can all be reported in one clear line."], [220.5, 221.94, "Part three: grammar."], [222.78, 227.82, "Grammar focus: Noun phrases of change: a rise in and a rise of."], [228.12, 229.31, "Look at the pattern."], [230.02, 232.89, "A sharp rise in mortgage rates cooled the market."], [233.78, 236.69, "An increase of five percent raised property values."], [237.58, 240.28, "A shortage in housing supply pushed rents up."], [241.23, 248.3, "Say a rise IN prices but a rise OF five percent. The verb forms use by: prices rose BY five percent."], [249.05, 252.81, "Be careful! Don't say: A rise by prices."], [254.77, 257.06, "Say: A rise in prices."], [257.36, 258.94, "Use 'in' after a rise."], [259.73, 262.51, "Part four: reading. Read and listen."], [263.3, 264.87, "Reading the Housing Market."], [265.17, 267.81, "Property news depends on a few key numbers."], [268.8, 273.88, "A sharp rise in mortgage rates makes a down payment harder to save for, so demand falls."], [274.87, 280.28, "A shortage in housing supply, however, can push property value up even when buyers are few."], [281.27, 284.85, "The rental market often grows when buying becomes too expensive."], [285.83, 290.33, "Experts warn that a housing bubble can burst when prices rise faster than incomes."], [291.43, 295.6, "Part five: quiz. Five questions. Are you ready?"], [296.45, 299.59, "A sharp rise blank mortgage rates cooled the market."], [299.89, 302.8, "A, in. B, by. C, to of."], [306.33, 307.96, "The answer is A: in."], [309.12, 314.02, "A period when prices rise unrealistically, then fall, is a housing blank."], [314.32, 317.53, "A, bubble. B, supply. C, agent."], [321.07, 323.04, "The answer is A: bubble."], [324.18, 326.72, "The first part of the price paid is the blank payment."], [327.02, 330.1, "A, down. B, tax. C, rental."], [333.67, 335.35, "The answer is A: down."], [336.52, 338.28, "Choose the correct sentence."], [338.58, 344.57, "A, A rise by 2%.. B, A rise of 2%.. C, A rise in of 2%.."], [348.13, 351.04, "The answer is B: A rise of 2%.."], [352.18, 356.37, "According to the reading, the rental market often grows when buying is too…"], [356.67, 360.02, "A, expensive. B, cheap. C, easy."], [363.57, 365.47, "The answer is A: expensive."], [366.67, 369.69, "Part six: speaking. It's your turn to talk."], [370.55, 374.34, "How do rising mortgage rates affect whether people can afford to buy a home?"], [383.15, 384.84, "Now listen to Visal."], [385.14, 406.42, "Rising mortgage rates increase the monthly cost of a loan, so a home that was affordable becomes too expensive. Buyers may need a larger down payment or may delay buying altogether. As demand falls, property values can stop rising. Meanwhile, more families rent, which strengthens the rental market."], [406.72, 408.68, "Excellent answer, Visal!"], [409.58, 415.9, "Great work! Now you can use eight new words and noun phrases of change: a rise in and a rise of."], [416.2, 421.99, "Today's value is economic awareness. Understand how money and work affect your life choices."], [422.29, 424.86, "See you in Unit eleven. Goodbye!"], [425.16, 428.22, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-NP2-Unit11-Cryptocurrency-Basics": [[0.35, 5.55, "Hello, everyone! I'm Ms. Emma. Welcome to Online Newspaper Class, level two."], [5.85, 9.66, "Hi! I'm Visal. Let's learn together!"], [9.96, 17.3, "Unit eleven: Cryptocurrency Basics. Today you will talk about risk with may well, run the risk of and is liable to."], [17.59, 20.49, "Here is our lesson map. Let's start!"], [21.43, 25.3, "Part one: words. You will learn eight new words."], [26.15, 27.22, "Blockchain."], [28.22, 32.35, "Blockchain means a shared digital record that cannot easily be changed."], [32.95, 35.72, "Blockchain records every transaction in order."], [36.32, 38.61, "Your turn. Say: Blockchain."], [41.47, 42.77, "Blockchain."], [43.52, 44.88, "Digital currency."], [45.88, 49.59, "Digital currency means money that exists only in electronic form."], [50.18, 52.6, "A digital currency can be sent worldwide."], [53.22, 55.98, "Your turn. Say: Digital currency."], [58.83, 60.22, "Digital currency."], [60.98, 62.16, "Volatility."], [63.15, 66.89, "Volatility means how quickly and sharply a price goes up and down."], [67.48, 70.09, "High volatility makes planning difficult."], [70.68, 74.0, "Your turn. Say: Volatility."], [76.83, 78.06, "Volatility."], [78.82, 79.97, "Crypto wallet."], [80.98, 85.02, "Crypto wallet means a program or device that stores digital currency."], [85.62, 88.01, "She lost access to her crypto wallet."], [88.62, 91.71, "Your turn. Say: Crypto wallet."], [94.57, 95.78, "Crypto wallet."], [96.52, 97.78, "Decentralized."], [98.78, 101.97, "Decentralized means not controlled by one central authority."], [102.58, 105.29, "A decentralized system has no single owner."], [105.88, 108.9, "Your turn. Say: Decentralized."], [111.73, 113.12, "Decentralized."], [113.88, 114.7, "Mining."], [115.68, 120.0, "Mining means using computers to confirm transactions and create new coins."], [120.62, 123.01, "Mining uses a great deal of electricity."], [123.62, 125.7, "Your turn. Say: Mining."], [128.57, 129.54, "Mining."], [130.28, 131.81, "Exchange platform."], [132.82, 137.32, "Exchange platform means a website where digital currencies are bought and sold."], [137.92, 140.17, "The exchange platform closed suddenly."], [140.78, 143.53, "Your turn. Say: Exchange platform."], [146.37, 148.11, "Exchange platform."], [148.85, 149.9, "Regulation."], [150.88, 154.26, "Regulation means official rules that control an activity."], [154.85, 157.43, "Stronger regulation may protect investors."], [158.02, 161.01, "Your turn. Say: Regulation."], [163.87, 165.11, "Regulation."], [165.9, 169.63, "Part two: dialogue. Let's listen to a conversation."], [170.48, 177.23, "Visal, a news analysis says 'Investors may well lose money, and they run the risk of fraud.' What do these phrases do?"], [178.35, 185.75, "They express risk. 'May well' means it is quite likely. 'Run the risk of' is followed by -ing or a noun."], [186.85, 188.52, "Any other risk language?"], [189.62, 198.21, "'Is liable to' also means likely, often for something negative: 'Prices are liable to fall suddenly because of volatility.'"], [199.32, 201.64, "Why is this crucial for crypto news?"], [202.75, 215.78, "A decentralized currency has little regulation, so a crypto wallet or exchange platform may fail without warning. Honest reporting shows both opportunity and danger."], [216.93, 218.36, "Part three: grammar."], [219.22, 224.06, "Grammar focus: Risk language: may well and run the risk of and liable to."], [224.36, 225.58, "Look at the pattern."], [226.28, 228.62, "Investors may well lose all their money."], [229.52, 233.53, "Anyone using an unregulated platform runs the risk of losing funds."], [234.42, 236.62, "Prices are liable to fall suddenly."], [237.57, 247.34, "Run the risk of + -ing: runs the risk of losing. Is liable to + base verb: is liable to fall. May well + base verb means quite likely."], [248.08, 251.37, "Be careful! Don't say: Prices are liable fall."], [253.33, 256.19, "Say: Prices are liable to fall."], [256.49, 258.08, "Add 'to' after liable."], [258.9, 261.48, "Part four: reading. Read and listen."], [262.27, 263.89, "Digital Money, Real Risk."], [264.19, 270.4, "A digital currency runs on blockchain, a decentralized record that no single bank controls."], [271.4, 276.95, "Mining and exchange platforms make trading possible, but a crypto wallet can be hacked or lost."], [277.97, 282.51, "Prices are liable to swing wildly, and investors may well lose their savings."], [283.5, 287.08, "Because regulation is still limited, buyers run the risk of fraud."], [288.07, 292.14, "Anyone considering crypto should invest only what they can afford to lose."], [293.23, 297.44, "Part five: quiz. Five questions. Are you ready?"], [298.28, 300.71, "Investors blank well lose all their money."], [301.01, 304.28, "A, may. B, might to. C, are."], [307.83, 309.47, "The answer is A: may."], [310.62, 314.92, "Anyone using an unregulated platform runs the risk of blank funds."], [315.21, 318.42, "A, losing. B, lose. C, to lose."], [321.97, 323.85, "The answer is A: losing."], [325.02, 327.93, "How quickly a price goes up and down is its blank."], [328.23, 332.07, "A, volatility. B, mining. C, regulation."], [335.63, 338.1, "The answer is A: volatility."], [339.25, 341.13, "Choose the correct sentence."], [341.43, 347.66, "A, Prices are liable fall.. B, Prices are liable to fall.. C, Prices liable to falling are.."], [351.2, 354.06, "The answer is B: Prices are liable to fall.."], [355.22, 358.99, "According to the reading, buyers should invest only what they can afford to…"], [359.29, 362.41, "A, lose. B, borrow. C, hide."], [365.97, 367.73, "The answer is A: lose."], [368.93, 372.04, "Part six: speaking. It's your turn to talk."], [372.88, 376.87, "What risks come with investing in a highly volatile digital currency?"], [385.68, 387.04, "Now listen to Visal."], [387.34, 408.61, "The biggest risk is volatility: the price may fall by half in a few days, so investors may well lose their savings. There is also a risk of fraud or hacking, because regulation is limited and a crypto wallet can be lost. For these reasons, I would invest only a small amount that I could afford to lose."], [408.91, 410.69, "Excellent answer, Visal!"], [411.58, 417.8, "Great work! Now you can use eight new words and risk language: may well and run the risk of and liable to."], [418.1, 422.57, "Today's value is prudence. Think carefully about risks before you act."], [422.88, 425.46, "See you in Unit twelve. Goodbye!"], [425.76, 429.11, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-NP2-Unit12-Supply-Chain-Management": [[0.35, 5.85, "Hello, everyone! I'm Ms. Emma. Welcome to Online Newspaper Class, level two."], [6.15, 9.51, "Hi! I'm Visal. Let's learn together!"], [9.81, 15.62, "Unit twelve: Supply Chain Management. Today you will speculate about the past with the third conditional."], [15.92, 18.73, "Here is our lesson map. Let's start!"], [19.67, 23.36, "Part one: words. You will learn eight new words."], [24.22, 25.67, "Logistics network."], [26.68, 31.17, "Logistics network means the system of transport and storage that moves goods."], [31.78, 34.6, "The logistics network connects farms to cities."], [35.18, 38.55, "Your turn. Say: Logistics network."], [41.4, 42.97, "Logistics network."], [43.72, 45.29, "Inventory control."], [46.28, 50.09, "Inventory control means managing how much stock a company keeps."], [50.68, 52.97, "Inventory control reduces waste."], [53.58, 56.82, "Your turn. Say: Inventory control."], [59.67, 61.47, "Inventory control."], [62.22, 63.86, "Supplier relationship."], [64.85, 69.91, "Supplier relationship means the ongoing business connection with a company that provides goods."], [70.52, 73.46, "A strong supplier relationship prevents delays."], [74.05, 77.5, "Your turn. Say: Supplier relationship."], [80.37, 82.09, "Supplier relationship."], [82.85, 84.36, "Just-in-time delivery."], [85.35, 89.15, "Just-in-time delivery means receiving goods only when they are needed."], [89.75, 92.59, "Just-in-time delivery saves storage costs."], [93.18, 96.98, "Your turn. Say: Just-in-time delivery."], [99.83, 101.54, "Just-in-time delivery."], [102.28, 103.82, "Distribution center."], [104.82, 108.88, "Distribution center means a large building where goods are stored and sent out."], [109.48, 112.7, "The distribution center employs two hundred people."], [113.32, 116.31, "Your turn. Say: Distribution center."], [119.17, 120.66, "Distribution center."], [121.42, 122.42, "Bottleneck."], [123.42, 126.22, "Bottleneck means a point where progress is slowed down."], [126.82, 128.6, "The port became a bottleneck."], [129.18, 131.66, "Your turn. Say: Bottleneck."], [134.5, 135.48, "Bottleneck."], [136.22, 137.43, "Freight cost."], [138.42, 141.33, "Freight cost means the price of transporting goods."], [141.95, 144.73, "Higher freight costs raised shop prices."], [145.32, 147.98, "Your turn. Say: Freight cost."], [150.83, 152.21, "Freight cost."], [152.95, 154.58, "Supply disruption."], [155.58, 159.09, "Supply disruption means an interruption in the flow of goods."], [159.68, 162.18, "A supply disruption emptied the shelves."], [162.78, 165.69, "Your turn. Say: Supply disruption."], [168.53, 169.94, "Supply disruption."], [170.73, 174.34, "Part two: dialogue. Let's listen to a conversation."], [175.18, 181.04, "Visal, a report says 'If the port had stayed open, the shelves would not have emptied.' What is that tense?"], [182.15, 190.2, "The third conditional: if + past perfect, would have + past participle. It imagines a different past."], [191.32, 193.79, "Is it common in business analysis?"], [194.88, 204.33, "Very. 'If the firm had held more inventory, the supply disruption would not have stopped production.' Analysts use it to learn lessons."], [205.42, 206.99, "What else could have been done?"], [208.08, 216.78, "If managers had built stronger supplier relationships, the bottleneck might have been avoided, and freight costs would have stayed lower."], [217.93, 219.46, "Part three: grammar."], [220.32, 225.28, "Grammar focus: Third conditional: if plus had plus past participle."], [225.58, 226.75, "Look at the pattern."], [227.45, 230.61, "If the port had stayed open, shelves would not have emptied."], [231.52, 234.85, "If the firm had held more stock, production would have continued."], [235.75, 239.55, "If suppliers had warned them, managers might have avoided the bottleneck."], [240.5, 249.36, "Third conditional = if + had + past participle, would have + past participle. It talks about unreal past situations and regrets."], [250.12, 253.44, "Be careful! Don't say: If he knew, he would have help."], [255.4, 258.21, "Say: If he had known, he would have helped."], [258.51, 261.49, "Third conditional: had + past participle."], [262.3, 265.13, "Part four: reading. Read and listen."], [265.93, 267.71, "Lessons from a Disruption."], [268.01, 272.59, "When a major port closed, a global logistics network suffered a serious bottleneck."], [273.6, 277.4, "If managers had held more inventory, factories would not have stopped."], [278.4, 284.58, "Just-in-time delivery had saved money for years, yet it left no safety margin during the supply disruption."], [285.57, 291.78, "If suppliers and distribution centers had shared information earlier, freight costs might have stayed lower."], [292.77, 295.86, "Companies now balance efficiency with resilience."], [296.97, 300.91, "Part five: quiz. Five questions. Are you ready?"], [301.75, 304.75, "If the port blank open, shelves would not have emptied."], [305.05, 309.08, "A, had stayed. B, stayed. C, would stay."], [312.63, 314.77, "The answer is A: had stayed."], [315.92, 318.58, "A point where progress is slowed down is a blank."], [318.88, 322.36, "A, bottleneck. B, freight. C, network."], [325.9, 327.78, "The answer is A: bottleneck."], [328.95, 331.94, "Receiving goods only when needed is blank delivery."], [332.24, 335.99, "A, bulk. B, just-in-time. C, inventory."], [339.53, 342.07, "The answer is B: just-in-time."], [343.22, 344.91, "Choose the correct sentence."], [345.21, 351.51, "A, If he had known, he would have helped.. B, If he knew, he would have help.. C, If he had known, he would helped.."], [355.07, 357.82, "The answer is A: If he had known, he would have helped.."], [358.98, 362.23, "According to the reading, companies now balance efficiency with…"], [362.52, 366.58, "A, resilience. B, luck. C, advertising."], [370.13, 372.49, "The answer is A: resilience."], [373.7, 376.89, "Part six: speaking. It's your turn to talk."], [377.75, 381.81, "How can a supply disruption in one country affect stores in another country?"], [390.62, 392.06, "Now listen to Visal."], [392.36, 417.59, "Many products depend on parts or materials from several countries. If a factory or port stops working in one place, the next stage cannot begin, and goods arrive late or not at all. Stores in another country then have empty shelves or must raise prices because freight costs rise. This shows how connected the modern supply chain is."], [417.89, 419.49, "Excellent answer, Visal!"], [420.38, 426.87, "Great work! Now you can use eight new words and third conditional: if plus had plus past participle."], [427.17, 431.96, "Today's value is systems thinking. See how the parts connect to make the whole."], [432.26, 434.95, "See you in Unit thirteen. Goodbye!"], [435.25, 438.53, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-NP2-Unit13-Mergers-Acquisitions": [[0.35, 5.46, "Hello, everyone! I'm Ms. Emma. Welcome to Online Newspaper Class, level two."], [5.75, 9.34, "Hi! I'm Visal. Let's learn together!"], [9.64, 15.8, "Unit thirteen: Mergers & Acquisitions. Today you will report claims with passive reporting structures."], [16.1, 18.83, "Here is our lesson map. Let's start!"], [19.77, 23.0, "Part one: words. You will learn eight new words."], [23.85, 25.44, "Acquisition target."], [26.45, 30.13, "Acquisition target means a company that another company wants to buy."], [30.72, 33.3, "The small brewer became an acquisition target."], [33.88, 37.08, "Your turn. Say: Acquisition target."], [39.93, 41.75, "Acquisition target."], [42.48, 43.67, "Due diligence."], [44.68, 48.84, "Due diligence means a careful check of a company's finances before buying it."], [49.45, 51.75, "Due diligence revealed hidden debts."], [52.35, 55.19, "Your turn. Say: Due diligence."], [58.03, 59.31, "Due diligence."], [60.05, 61.41, "Hostile takeover."], [62.42, 66.88, "Hostile takeover means an attempt to buy a company against its management's wishes."], [67.48, 69.56, "The board fought the hostile takeover."], [70.15, 72.79, "Your turn. Say: Hostile takeover."], [75.63, 77.03, "Hostile takeover."], [77.78, 78.55, "Synergy."], [79.55, 83.65, "Synergy means extra value created when two companies work together."], [84.25, 86.42, "The merger promised synergy in marketing."], [87.02, 89.4, "Your turn. Say: Synergy."], [92.27, 93.21, "Synergy."], [93.95, 95.25, "Deal valuation."], [96.25, 100.01, "Deal valuation means the price put on a company in a merger or sale."], [100.62, 103.27, "The deal valuation was higher than expected."], [103.85, 106.85, "Your turn. Say: Deal valuation."], [109.7, 111.12, "Deal valuation."], [111.88, 113.41, "Regulatory approval."], [114.42, 118.47, "Regulatory approval means official permission needed to complete a deal."], [119.08, 121.62, "Regulatory approval took six months."], [122.22, 125.48, "Your turn. Say: Regulatory approval."], [128.33, 130.12, "Regulatory approval."], [130.88, 132.0, "Shareholder vote."], [133.02, 136.98, "Shareholder vote means a formal decision made by the owners of a company."], [137.58, 140.14, "A shareholder vote approved the merger."], [140.75, 143.56, "Your turn. Say: Shareholder vote."], [146.4, 147.56, "Shareholder vote."], [148.32, 150.05, "Integration process."], [151.05, 155.4, "Integration process means combining the people and systems of two companies."], [155.98, 158.65, "The integration process lasted two years."], [159.25, 162.45, "Your turn. Say: Integration process."], [165.3, 166.96, "Integration process."], [167.77, 171.2, "Part two: dialogue. Let's listen to a conversation."], [172.05, 180.1, "Visal, a headline says 'The merger is expected to create synergy.' But another says 'It is said that jobs will be cut.' What are these patterns?"], [181.22, 189.95, "Passive reporting structures: it is said that..., the merger is expected to... They report opinions without naming who holds them."], [191.05, 193.11, "Why use them in business news?"], [194.22, 202.36, "Because reporters often cannot prove a claim. 'The firm is believed to be an acquisition target' is more careful than a flat statement."], [203.45, 205.4, "Can synergy always be trusted?"], [206.52, 217.38, "Not always. After due diligence, a valuation and a shareholder vote, the integration process may reveal that promised savings were exaggerated."], [218.53, 220.16, "Part three: grammar."], [221.02, 225.23, "Grammar focus: Passive reporting: is said to and it is believed that."], [225.53, 226.88, "Look at the pattern."], [227.58, 229.98, "The merger is expected to create synergy."], [230.88, 233.87, "It is believed that the firm is an acquisition target."], [234.78, 237.43, "The bidder is said to have offered a high valuation."], [238.37, 246.15, "Use subject + is said / believed / expected to + verb, or It is said that + clause. For past events use to have + past participle."], [246.92, 250.47, "Be careful! Don't say: It said that he resign."], [252.43, 254.7, "Say: It is said that he resigned."], [255.0, 257.6, "Use the passive: it is said that..."], [258.4, 260.83, "Part four: reading. Read and listen."], [261.63, 262.8, "Behind the Deal."], [263.1, 266.11, "Merger announcements often promise more than they deliver."], [267.1, 274.19, "A company is believed to be an acquisition target when rivals show interest, and a hostile takeover is said to be the most aggressive route."], [275.2, 280.9, "Due diligence is meant to reveal hidden risks, yet the deal valuation may still be too high."], [281.9, 286.85, "After regulatory approval and a shareholder vote, the integration process begins."], [287.83, 291.34, "Synergy is often promised, but it is not always achieved."], [292.43, 296.17, "Part five: quiz. Five questions. Are you ready?"], [297.02, 298.99, "The merger blank to create synergy."], [299.29, 303.47, "A, is expected. B, expects. C, is expecting."], [307.03, 309.44, "The answer is A: is expected."], [310.58, 314.03, "A careful check of a company's finances is blank diligence."], [314.33, 317.45, "A, late. B, due. C, hostile."], [321.0, 323.03, "The answer is B: due."], [324.18, 327.38, "Extra value from two companies working together is blank."], [327.68, 331.81, "A, valuation. B, approval. C, synergy."], [335.37, 337.22, "The answer is C: synergy."], [338.35, 340.04, "Choose the correct sentence."], [340.34, 346.66, "A, It is said that he has resigned.. B, It said that he has resign.. C, It is saying that he resigned.."], [350.2, 353.24, "The answer is A: It is said that he has resigned.."], [354.38, 358.1, "According to the reading, synergy is often promised but not always…"], [358.4, 361.85, "A, achieved. B, spoken. C, valued."], [365.4, 367.18, "The answer is A: achieved."], [368.37, 371.55, "Part six: speaking. It's your turn to talk."], [372.42, 377.96, "Why might two companies claim a merger will create 'synergy,' and is that always true?"], [386.75, 388.4, "Now listen to Visal."], [388.7, 415.82, "Companies claim synergy because it persuades shareholders and regulators that a merger will bring savings or new sales. Sometimes it is true, for example when two firms share a distribution network. However, cultures may clash and systems may not fit, so promised savings often disappear. Therefore, I would treat such claims with caution."], [416.12, 417.82, "Excellent answer, Visal!"], [418.72, 424.74, "Great work! Now you can use eight new words and passive reporting: is said to and it is believed that."], [425.04, 429.91, "Today's value is critical thinking. Think carefully and give reasons for your opinions."], [430.21, 432.89, "See you in Unit fourteen. Goodbye!"], [433.19, 435.69, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-NP2-Unit14-Consumer-Behavior": [[0.35, 6.13, "Hello, everyone! I'm Ms. Emma. Welcome to Online Newspaper Class, level two."], [6.43, 9.74, "Hi! I'm Visal. Let's learn together!"], [10.04, 16.46, "Unit fourteen: Consumer Behavior. Today you will use gradable adverbs and strong collocations."], [16.76, 19.59, "Here is our lesson map. Let's start!"], [20.53, 23.59, "Part one: words. You will learn eight new words."], [24.45, 25.74, "Purchase decision."], [26.75, 30.47, "Purchase decision means the choice a customer makes about what to buy."], [31.08, 33.81, "Reviews strongly influence a purchase decision."], [34.42, 37.16, "Your turn. Say: Purchase decision."], [40.0, 41.21, "Purchase decision."], [41.95, 43.36, "Brand perception."], [44.35, 48.35, "Brand perception means the ideas and feelings people have about a brand."], [48.95, 51.46, "Brand perception improved after the recall."], [52.05, 55.16, "Your turn. Say: Brand perception."], [58.0, 59.45, "Brand perception."], [60.22, 61.65, "Impulse buying."], [62.65, 65.9, "Impulse buying means buying something suddenly without planning."], [66.52, 69.1, "Sweets near the till encourage impulse buying."], [69.68, 72.88, "Your turn. Say: Impulse buying."], [75.73, 77.06, "Impulse buying."], [77.82, 79.25, "Price sensitivity."], [80.25, 84.15, "Price sensitivity means how much a change in price affects demand."], [84.75, 88.12, "High price sensitivity means shoppers compare carefully."], [88.72, 92.12, "Your turn. Say: Price sensitivity."], [94.97, 96.71, "Price sensitivity."], [97.45, 98.89, "Loyalty program."], [99.88, 103.59, "Loyalty program means a scheme that rewards repeat customers."], [104.18, 107.29, "The loyalty program gives points on each purchase."], [107.88, 110.76, "Your turn. Say: Loyalty program."], [113.6, 115.1, "Loyalty program."], [115.85, 117.07, "Social proof."], [118.08, 122.32, "Social proof means the tendency to follow what other people choose."], [122.92, 126.16, "Social proof makes popular products more popular."], [126.75, 129.61, "Your turn. Say: Social proof."], [132.47, 134.09, "Social proof."], [134.85, 136.73, "Psychology of pricing."], [137.75, 141.83, "Psychology of pricing means how the way prices are shown affects buyers."], [142.42, 146.66, "The psychology of pricing explains the $9.99 tag."], [147.25, 150.44, "Your turn. Say: Psychology of pricing."], [153.3, 155.12, "Psychology of pricing."], [155.88, 156.88, "Buying journey."], [157.88, 161.59, "Buying journey means the steps a customer takes from need to purchase."], [162.18, 164.23, "The buying journey begins with a search."], [164.82, 167.48, "Your turn. Say: Buying journey."], [170.33, 171.52, "Buying journey."], [172.33, 176.27, "Part two: dialogue. Let's listen to a conversation."], [177.12, 184.23, "Visal, a study says shoppers are 'highly influenced by reviews' and 'strongly attracted to discounts'. Why those adverbs?"], [185.32, 197.14, "Strong collocations: highly influenced, deeply concerned, strongly recommend. Gradable adverbs show how much, and the right pair sounds natural."], [198.25, 199.98, "Which words do not combine?"], [201.08, 210.49, "We say 'completely satisfied' but not 'very satisfied' with absolute adjectives. And 'highly unlikely', not 'strongly unlikely'."], [211.58, 213.87, "How does that help describe the buying journey?"], [214.98, 224.32, "Consumers are fairly price-sensitive, extremely influenced by social proof, and occasionally prone to impulse buying."], [225.47, 226.89, "Part three: grammar."], [227.75, 231.25, "Grammar focus: Adverb plus adjective collocations."], [231.55, 232.76, "Look at the pattern."], [233.45, 236.16, "Shoppers are highly influenced by reviews."], [237.05, 239.91, "Many buyers are strongly attracted to discounts."], [240.82, 244.3, "Customers feel completely satisfied with the loyalty program."], [245.27, 256.05, "Learn adverb + adjective pairs as chunks: highly influenced, deeply concerned, strongly attracted, completely satisfied. Do not use 'very' with absolute adjectives."], [256.78, 261.18, "Be careful! Don't say: Shoppers are strongly unlikely to buy."], [263.13, 266.18, "Say: Shoppers are highly unlikely to buy."], [266.48, 268.8, "Learn the natural pair: highly unlikely."], [269.6, 272.14, "Part four: reading. Read and listen."], [272.93, 274.67, "Inside the Shopper's Mind."], [274.97, 278.79, "Marketers study the buying journey to understand every purchase decision."], [279.8, 286.01, "Shoppers are highly influenced by social proof, and many are strongly attracted to a clear discount."], [287.0, 293.07, "The psychology of pricing explains why a price like $9.99 feels much smaller than $10."], [294.07, 299.47, "Customers who join a loyalty program often feel completely satisfied and rarely change brand."], [300.47, 304.61, "Impulse buying, however, shows that emotion can overrule careful thinking."], [305.7, 309.56, "Part five: quiz. Five questions. Are you ready?"], [310.42, 312.82, "Shoppers are blank influenced by reviews."], [313.12, 316.95, "A, highly. B, very much of. C, strong."], [320.5, 322.52, "The answer is A: highly."], [323.68, 326.25, "Following
