                19: { title: "Digital & Multimedia Texts", terms: ["Hypertext", "Multimedia element", "Interactive text", "Digital publishing", "Nonlinear reading", "Embedded media", "Digital annotation", "Reader engagement"], passage: "Digital and multimedia texts use hypertext and embedded media to create a genuinely interactive text. Digital publishing supports nonlinear reading and digital annotation, reshaping reader engagement compared to traditional print.", question: "How does reading a nonlinear, interactive digital text change the reading experience compared to a book?", funfact: "Did you know? Hypertext, the foundation of nearly all digital reading today, was first theorized decades before the internet became widely available." },
                20: { title: "Travel Writing", terms: ["Travel writing", "Journey", "Description", "Culture", "Narrative", "Observation", "Place", "Perspective"], passage: "Travel writing combines narrative with detailed description of place and culture. Careful observation and an honest perspective turn a journey into a meaningful story for readers.", question: "Which place would you most like to write about?", funfact: "Did you know? The 14th-century traveller Ibn Battuta journeyed tens of thousands of kilometres and recorded his travels in a famous book." },
                21: { title: "Science Journalism", terms: ["Science journalism", "Research", "Evidence", "Uncertainty", "Explain", "Expert", "Accuracy", "Public understanding"], passage: "Science journalism helps public understanding by explaining new research. Good reporters check evidence, quote an independent expert and explain uncertainty rather than exaggerating results, protecting accuracy.", question: "Why do science headlines sometimes exaggerate findings?", funfact: "Did you know? A single study rarely proves something — good science reporting explains how a new result fits with earlier research." },
                22: { title: "Book Reviews", terms: ["Review", "Summary", "Evaluation", "Plot", "Style", "Recommendation", "Critic", "Reader"], passage: "A book review gives a brief summary of the plot without spoilers, followed by evaluation of style and ideas. The critic ends with a recommendation to help the reader decide.", question: "What should a good book review include?", funfact: "Did you know? The New York Times Book Review was first published in 1896." },
                23: { title: "Speeches and Oratory", terms: ["Speech", "Oratory", "Audience", "Rhetoric", "Repetition", "Delivery", "Persuasion", "Historic"], passage: "Great oratory moves an audience. A historic speech uses rhetoric such as repetition, strong delivery and a clear message to achieve persuasion.", question: "Which famous speech do you find most powerful?", funfact: "Did you know? Martin Luther King Jr.'s 'I Have a Dream' speech was delivered in Washington, D.C., in 1963." },
                24: { title: "Data Journalism", terms: ["Data journalism", "Dataset", "Chart", "Analysis", "Trend", "Transparency", "Visualisation", "Evidence"], passage: "Data journalism uses a dataset and careful analysis to find each trend. A clear chart or visualisation presents evidence, and transparency about methods builds trust.", question: "How can data make a news story stronger?", funfact: "Did you know? In the 1850s, Florence Nightingale used innovative diagrams to show that many soldiers were dying from preventable disease." },
                25: { title: "Writing an Academic Essay", terms: ["Essay", "Thesis", "Paragraph", "Evidence", "Analysis", "Counterargument", "Conclusion", "Citation"], passage: "An academic essay starts with a clear thesis. Each paragraph presents evidence and analysis, a counterargument shows balance, and a strong conclusion and accurate citation complete the work.", question: "What is the hardest part of writing an essay for you?", funfact: "Did you know? The essay form is often traced to Michel de Montaigne, who published his 'Essais' in 1580." },
            },
        };
        Object.values(curriculum).forEach(g => Object.values(g).forEach(d => { d.vocab = d.terms; d.story = d.passage; }));

        const minWords = () => MIN_WORDS[state.level] || 3;
        function allTermsForLevel(level) {
            let words = [];

            return [...new Set(words)];

        // ===== Progress: stars/badges are earned once per activity and remembered =====
        // Saved in this browser when the page is opened as a normal web page. Inside the Hub's
        // secure "Embed Code" box the browser blocks storage, so progress then lasts until the
        // page is closed — but it still can't be farmed by tapping the same button again.
        const PROGRESS_PREFIX = 'c2epe_onlineclass_newspaper_progress_';
        const PROGRESS_KEY = () => PROGRESS_PREFIX + state.level;
        let progress = { stars: 0, badges: 0, awarded: {}, best: {}, completed: {} };
        function loadProgress() {
            progress = { stars: 0, badges: 0, awarded: {}, best: {}, completed: {} };
            try {
                const saved = JSON.parse(localStorage.getItem(PROGRESS_KEY()) || 'null');
                if (saved && typeof saved === 'object') progress = Object.assign(progress, saved);
            } catch (e) { /* storage not available (e.g. inside the Hub sandbox) */ }
            state.stars = progress.stars; state.badges = progress.badges;
            document.getElementById('star-count').textContent = state.stars;
            document.getElementById('badge-count').textContent = state.badges;
        }
        function saveProgress() {
            progress.stars = state.stars; progress.badges = state.badges;
            try { localStorage.setItem(PROGRESS_KEY(), JSON.stringify(progress)); } catch (e) {}
        }
        const unitKey = (what) => 'u' + state.unit + '|' + what;
        const wasAwarded = (key) => !!progress.awarded[state.level + '|' + key];
        // Gives stars only the first time an activity is done. Returns true if stars were given.
        function award(key, amount) {
            const k = state.level + '|' + key;
            if (progress.awarded[k]) return false;
            progress.awarded[k] = true;
            addStars(amount);
            return true;
        }
        // Shows "(+3 ⭐)" the first time, and a friendly note afterwards
        const starNote = (given, amount) => given ? ` (+${amount} ⭐)` : ' (stars already earned)';

        function isRecentlyAdded(dateStr) {
            if (!dateStr) return false;
            const added = new Date(dateStr);
            if (isNaN(added.getTime())) return false;
            const daysSince = (Date.now() - added.getTime()) / (1000 * 60 * 60 * 24);
            return daysSince >= 0 && daysSince <= 7;
        }

        function populateUnitSelect() {
            const sel = document.getElementById('unit-select');
            const levelData = curriculum[state.level];
            const prevUnit = state.unit;
            const unitCount = Object.keys(levelData).length;
            const labelEl = document.getElementById('unit-select-label');
            if (labelEl) labelEl.textContent = `Select Unit (1 to ${unitCount})`;
            // 🎬 = this unit has a video · 🆕 = video added in the last 7 days
            sel.innerHTML = Object.keys(levelData).map(u => {
                const v = videoFor(state.level, u);
                const mark = v ? (isRecentlyAdded(v.dateAdded) ? ' 🆕' : ' 🎬') : '';
                return `<option value="${u}">Unit ${u}: ${levelData[u].title}${mark}</option>`;
            }).join('');
            if (levelData[prevUnit]) {
                sel.value = prevUnit;
                state.unit = prevUnit;
            } else {
                state.unit = parseInt(sel.value);
            }
        }

        // On phones the lesson sits below the module list, so after choosing a module, a unit
        // or the next lesson, the page scrolls to the lesson by itself.
        const isPhone = () => window.matchMedia('(max-width: 767px)').matches;
        function scrollToLesson(always) {
            const area = document.getElementById('content-area');
            if (!area) return;
            if (!(isPhone() || (always && area.getBoundingClientRect().top < 0))) return;
            // Wait for the new lesson to be drawn, then glide to it; some phones stop a smooth
            // scroll that starts during the tap, so if it hasn't arrived, jump there directly.
            setTimeout(() => {
                area.scrollIntoView({ behavior: 'smooth', block: 'start' });
                setTimeout(() => { if (Math.abs(area.getBoundingClientRect().top) > 40) area.scrollIntoView({ block: 'start' }); }, 700);
            }, 60);
        }
        function jumpToModules() {
            const side = document.getElementById('module-sidebar');

        function completeActivity() {
            markActivityComplete(state.tab);

            let gotBadge = false;

            else if (gotStars) alert('🎉 Great work! You finished this activity and earned 5 Stars ⭐!');

            const levelData = curriculum[state.level];
            const unitNumbers = Object.keys(levelData).map(Number).sort((a, b) => a - b);
            const idx = unitNumbers.indexOf(state.unit);
            const nextIdx = (idx === -1 ? 0 : idx + 1) % unitNumbers.length;
            state.unit = unitNumbers[nextIdx];
            document.getElementById('unit-select').value = state.unit;
            renderContent();
            scrollToLesson(true);

        // Safe inside onclick="...('here')": escapes backslashes, single quotes and double quotes
        function escapeJsStr(s) {
            return String(s).replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '&quot;');
        }
        const escapeHtml = (s) => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

        // Splits a story into sentences. (Written without "look-behind" regex, which older
        // iPhones — before iOS 16.4 — cannot read and which made the whole page stop there.)
        function splitSentences(text) {
            return (String(text).match(/[^.!?]+[.!?]+["')]*|[^.!?]+$/g) || []).map(s => s.trim()).filter(Boolean);
        }
        const countWords = (s) => (String(s).match(/[A-Za-z\u00C0-\u024F\u1780-\u17FF]+(?:['’-][A-Za-z]+)*/g) || []).length;

        // ---------- Helper: Text-to-Speech (voices load a moment after the page opens) ----------
        let enVoice = null;
        function pickVoice() {
            if (!('speechSynthesis' in window)) return;
            enVoice = window.speechSynthesis.getVoices().find(v => v.lang && v.lang.startsWith('en')) || null;
        }
        if ('speechSynthesis' in window) { pickVoice(); window.speechSynthesis.onvoiceschanged = pickVoice; }
        function speak(text, onEnd) {
            if (!('speechSynthesis' in window)) { if (onEnd) onEnd(false); return false; }
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(text);
            u.lang = 'en-US';
            u.rate = 0.9;
            if (!enVoice) pickVoice();
            if (enVoice) u.voice = enVoice;
            if (onEnd) u.onend = () => onEnd(true);
            window.speechSynthesis.speak(u);
            return true;
        }

        function shuffle(arr) {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        function allVocabForLevel(level) {
            let words = [];
            Object.keys(curriculum[level]).forEach(u => words.push(...curriculum[level][u].vocab));
            return [...new Set(words)];
        }

        // ---------- Pictures ----------
        // When two words in the SAME unit would show the same picture, the second one gets its
        // own picture here (only inside that unit), so children can tell them apart.
        const SAME_UNIT_ALT = {
            "Goodbye": "🚶👋", "Thank you": "💝", "Sorry": "😔", "Respect": "🫡", "Tomorrow": "⏭️",
            "West": "🌇", "East": "🌄", "North": "🧭", "Between": "🥪", "Early": "🐓", "Late": "⏰",
            "Swing": "🎠", "Poster": "🪧"
        };
        function baseEmoji(word) { return WORD_EMOJI[word] || '🖼️'; }
        function emojiFor(word, unitData) {
            const u = unitData || curriculum[state.level][state.unit];
            const e = baseEmoji(word);
            if (u && SAME_UNIT_ALT[word] && (u.vocab || u.terms).some(w => w !== word && baseEmoji(w) === e)) return SAME_UNIT_ALT[word];
            return e;
        }
        // Wrong answers for "look at the picture" questions never share the right answer's
        // picture, so there is always exactly one correct choice.
        function pictureDistractors(correct, pool, unitData, n) {
            const pic = emojiFor(correct, unitData);
            const ok = (w) => w !== correct && emojiFor(w, unitData) !== pic;
            let list = shuffle([...new Set(pool)].filter(ok)).slice(0, n);
            if (list.length < n) {
                const extra = shuffle(allVocabForLevel(state.level).filter(w => ok(w) && !list.includes(w)));
                list = list.concat(extra.slice(0, n - list.length));
            }

        function youtubeIdOf(link) {
            const s = String(link || '').trim();
            if (/^[A-Za-z0-9_-]{11}$/.test(s)) return s;
            const m = s.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/))([A-Za-z0-9_-]{11})/);
            return m ? m[1] : '';
        }
        function videoFor(level, unit) {
            const v = (VIDEO_LESSONS[level] || {})[unit];
            if (!v) return null;
            if (v.mp4 && /^https:\/\//.test(v.mp4)) return { mp4: v.mp4, id: v.mp4, dateAdded: v.dateAdded || '', checkpoints: Array.isArray(v.checkpoints) ? v.checkpoints : [] };

            return id ? { id, dateAdded: v.dateAdded || '', checkpoints: Array.isArray(v.checkpoints) ? v.checkpoints : [] } : null;
        }

            if (ytPlayer && typeof ytPlayer.destroy === 'function') { try { ytPlayer.destroy(); } catch (e) {} }
            ytPlayer = null;
        }

        function loadYouTubeApi() {
            if (window.YT && window.YT.Player) return Promise.resolve();
            if (ytApiLoadPromise) return ytApiLoadPromise;
            ytApiLoadPromise = new Promise((resolve, reject) => {
                window.onYouTubeIframeAPIReady = resolve;
                const tag = document.createElement('script');
                tag.src = 'https://www.youtube.com/iframe_api';
                tag.onerror = () => { ytApiLoadPromise = null; reject(new Error('YouTube could not load')); };
                document.head.appendChild(tag);
            });
            return ytApiLoadPromise;

ct from maker to buyer."], [96.68, 99.0, "A fire stopped the whole supply chain."], [99.58, 102.51, "Your turn. Say: Supply chain."], [105.37, 106.81, "Supply chain."], [107.55, 108.97, "Currency exchange."], [109.98, 113.86, "Currency exchange means the swapping of one country's money for another's."], [114.45, 116.8, "Currency exchange rates change every day."], [117.38, 120.73, "Your turn. Say: Currency exchange."], [123.57, 125.22, "Currency exchange."], [125.98, 127.07, "Trade agreement."], [128.05, 131.81, "Trade agreement means a deal between countries about buying and selling goods."], [132.42, 135.03, "The trade agreement removed several tariffs."], [135.62, 138.48, "Your turn. Say: Trade agreement."], [141.33, 142.56, "Trade agreement."], [143.32, 144.55, "Globalization."], [145.55, 149.08, "Globalization means the growing connection of the world's economies."], [149.68, 152.22, "Globalization has made products cheaper."], [152.82, 155.83, "Your turn. Say: Globalization."], [158.67, 159.96, "Globalization."], [160.77, 164.44, "Part two: dialogue. Let's listen to a conversation."], [165.28, 172.49, "Visal, a headline says 'Imports rose sharply'. A formal report says 'There was a sharp rise in imports.' Why the change?"], [173.58, 183.93, "That is nominalisation: a verb becomes a noun. It makes the text more formal and lets us add detail, such as 'the rise in imports of fuel'."], [185.02, 186.76, "Does it help in economics?"], [187.85, 197.57, "Very much. 'The introduction of a tariff led to a reduction in exports' packs cause and effect into one sentence."], [198.68, 201.08, "Which prepositions follow these nouns?"], [202.18, 210.69, "A rise in, a decline in, an increase of five percent. The globalization of supply chains is another typical phrase."], [211.83, 213.34, "Part three: grammar."], [214.18, 218.66, "Grammar focus: Nominalisation: a rise in and a fall in."], [218.96, 220.11, "Look at the pattern."], [220.82, 223.33, "There was a sharp rise in imports last year."], [224.22, 226.89, "The introduction of a tariff reduced exports."], [227.78, 230.83, "A widening of the trade deficit worried economists."], [231.77, 241.35, "Turn verbs into nouns (rise → a rise, introduce → the introduction) for formal reports. Use 'in' for the thing that changes and 'of' for the size or the action."], [242.12, 246.05, "Be careful! Don't say: There was a rise of imports."], [248.0, 250.77, "Say: There was a rise in imports."], [251.07, 253.04, "Use 'in' for the thing that changes."], [253.83, 256.39, "Part four: reading. Read and listen."], [257.2, 258.64, "The Language of Trade."], [258.94, 263.01, "Economic reports often replace verbs with nouns to sound precise."], [264.0, 270.69, "Instead of saying that imports rose, a writer may report a sharp rise in imports, which allows more detail."], [271.7, 277.0, "The introduction of a tariff can cause a reduction in exports and a widening of the trade deficit."], [278.0, 283.28, "Meanwhile, globalization has linked every supply chain and every currency exchange."], [284.3, 288.48, "A trade agreement may then lead to a fall in prices for ordinary shoppers."], [289.57, 293.94, "Part five: quiz. Five questions. Are you ready?"], [294.78, 297.57, "There was a sharp rise blank imports last year."], [297.87, 300.62, "A, in. B, on. C, to."], [304.17, 306.19, "The answer is A: in."], [307.35, 309.5, "A tax on imported goods is a blank."], [309.8, 313.34, "A, tariff. B, deficit. C, export."], [316.9, 318.77, "The answer is A: tariff."], [319.92, 322.79, "The growing connection of the world's economies is blank."], [323.09, 328.4, "A, globalization. B, currency exchange. C, an agreement."], [331.97, 334.45, "The answer is A: globalization."], [335.62, 337.43, "Which sentence is nominalised?"], [337.73, 343.62, "A, Imports rose sharply.. B, There was a sharp rise in imports.. C, Imports are rising sharp.."], [347.17, 350.65, "The answer is B: There was a sharp rise in imports.."], [351.82, 355.45, "According to the reading, a trade agreement may lead to a fall in…"], [355.75, 360.56, "A, prices. B, tariffs on nothing. C, supply chains only."], [364.1, 366.17, "The answer is A: prices."], [367.37, 370.7, "Part six: speaking. It's your turn to talk."], [371.55, 375.41, "How does globalization affect prices for everyday products?"], [384.22, 385.7, "Now listen to Visal."], [386.0, 412.66, "Globalization usually lowers prices because companies can make goods where costs are lowest and sell them worldwide. A trade agreement that reduces tariffs makes imports cheaper still. However, long supply chains are fragile, so a disruption in one country can quickly raise prices everywhere. For everyday shoppers, the effect is mostly positive but not guaranteed."], [412.96, 414.65, "Excellent answer, Visal!"], [415.55, 421.41, "Great work! Now you can use eight new words and nominalisation: a rise in and a fall in."], [421.71, 427.14, "Today's value is global economic literacy. Understand how money and trade connect the world."], [427.44, 429.9, "See you in Unit three. Goodbye!"], [430.2, 432.99, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-NP2-Unit03-Entrepreneurship": [[0.35, 5.84, "Hello, everyone! I'm Ms. Emma. Welcome to Online Newspaper Class, level two."], [6.14, 9.8, "Hi! I'm Visal. Let's learn together!"], [10.1, 15.72, "Unit three: Entrepreneurship. Today you will describe qualities with so ... that and such ... that."], [16.02, 18.74, "Here is our lesson map. Let's start!"], [19.7, 22.86, "Part one: words. You will learn eight new words."], [23.72, 24.59, "Startup."], [25.58, 28.61, "Startup means a new business built on a new idea."], [29.22, 31.43, "The startup began in a small garage."], [32.02, 34.4, "Your turn. Say: Startup."], [37.27, 38.26, "Startup."], [39.02, 40.11, "Venture capital."], [41.12, 45.07, "Venture capital means money given to young companies with high growth potential."], [45.68, 48.53, "Venture capital helped the firm hire engineers."], [
