ns a belief that a secret group is behind events, usually without evidence."],[50.1,53.39,"Conspiracy theories spread quickly during crises."],[54.09,57.38,"Your turn. Say: conspiracy theory."],[60.08,61.63,"conspiracy theory."],[62.62,64.22,"information disorder."],[64.92,69.56,"information disorder means the polluted state of the information environment."],[69.86,72.98,"Information disorder makes it hard to know what is true."],[73.68,77.47,"Your turn. Say: information disorder."],[80.17,81.72,"information disorder."],[82.72,84.32,"media manipulation."],[85.02,91.83,"media manipulation means using media to mislead or influence people unfairly."],[92.13,95.89,"Edited clips are a common form of media manipulation."],[96.59,100.39,"Your turn. Say: media manipulation."],[103.09,104.9,"media manipulation."],[105.88,106.88,"bot network."],[107.58,111.71,"bot network means many fake automated accounts working together."],[112.01,114.6,"A bot network made the hashtag trend."],[115.3,118.32,"Your turn. Say: bot network."],[121.02,122.11,"bot network."],[123.12,124.59,"fact-based debate."],[125.29,129.6,"fact-based debate means discussion grounded in verified evidence."],[129.9,132.62,"Democracy needs fact-based debate."],[133.32,136.86,"Your turn. Say: fact-based debate."],[139.56,141.14,"fact-based debate."],[142.15,143.55,"epistemic trust."],[144.25,148.29,"epistemic trust means trust in the sources from which we gain knowledge."],[148.59,151.27,"Epistemic trust in experts is declining."],[151.97,155.32,"Your turn. Say: epistemic trust."],[158.02,159.53,"epistemic trust."],[160.55,162.16,"content moderation."],[162.85,167.19,"content moderation means reviewing and removing harmful online content."],[167.49,171.03,"Content moderation is difficult at a global scale."],[171.73,174.99,"Your turn. Say: content moderation."],[177.69,178.98,"content moderation."],[179.98,182.23,"Now let's listen to a conversation."],[182.53,186.3,"My uncle shared a conspiracy theory about vaccines yesterday."],[187.62,190.89,"If he had checked the source, he might not have shared it."],[192.18,195.37,"He says he doesn't trust experts anymore."],[196.68,200.77,"That loss of epistemic trust is at the heart of information disorder."],[202.08,205.21,"Some of the posts seemed to come from a bot network."],[206.52,211.66,"Very likely. Disinformation campaigns often use fake accounts to look popular."],[212.95,215.59,"Shouldn't platforms do more content moderation?"],[216.88,222.46,"They should. If moderation were stronger, those campaigns wouldn't have spread so fast."],[223.75,227.44,"Grammar focus: Mixed conditionals in analysis."],[227.75,230.99,"Mixed conditionals help analyse causes across time."],[231.29,234.73,"If he had checked the source, he wouldn't believe it now."],[235.03,238.86,"If moderation were stronger, the campaign wouldn't have spread."],[239.16,244.2,"Mixed conditionals are useful for analysing causes and consequences across time."],[245.22,247.88,"Now read and listen. The Infodemic."],[248.18,253.48,"During major crises, false information can spread faster than the facts."],[254.78,260.31,"The World Health Organization even used the word 'infodemic' to describe this problem."],[261.62,267.71,"Disinformation campaigns are deliberately designed to deceive, often using bot networks."],[269.02,275.0,"Conspiracy theories, meanwhile, offer simple explanations for complex and frightening events."],[276.28,281.44,"If people had greater epistemic trust in experts, such theories would struggle to spread."],[282.75,288.39,"Platforms have increased content moderation, but critics argue it remains inconsistent."],[289.68,294.77,"Fact-based debate requires both reliable sources and critical audiences."],[296.08,301.66,"Media literacy education may be the most powerful long-term solution."],[302.95,305.75,"Quiz time! Choose the correct answer."],[306.05,309.71,"Many fake automated accounts working together are a blank."],[310.01,315.79,"A, bot network. B, conspiracy theory. C, content moderation."],[319.78,322.81,"The answer is A: bot network."],[324.32,327.16,"If she had left earlier, she blank here now."],[327.46,331.11,"A, would be. B, would have been. C, is."],[335.12,337.5,"The answer is A: would be."],[338.98,342.61,"If I were braver, I blank the job last year."],[342.91,346.25,"A, would take. B, would have taken. C, took."],[350.25,352.82,"The answer is B: would have taken."],[354.32,356.83,"Trust in the sources of our knowledge is blank."],[357.13,364.03,"A, epistemic trust. B, information disorder. C, media manipulation."],[368.02,370.53,"The answer is A: epistemic trust."],[372.02,376.76,"According to the text, what may be the most powerful long-term solution?"],[377.06,382.56,"A, more bots. B, media literacy education. C, banning the internet."],[386.55,390.25,"The answer is B: media literacy education."],[391.75,397.13,"Now it's your turn. Part one: Who is responsible for stopping misinformation?"],[402.43,409.34,"Part two: Use a mixed conditional, assign responsibility to two groups, and justify it."],[415.64,429.27,"Responsibility is shared. Platforms must moderate content, and schools must teach media literacy. If my generation had learned these skills earlier, fewer of us would be sharing false stories today."],[429.57,431.85,"That is a well-argued answer!"],[432.85,438.51,"Great work today! You learned eight new words and mixed conditionals in analysis."],[438.81,442.68,"Today's value is honesty. Always tell the truth."],[442.98,446.92,"See you in Unit thirty-seven. Goodbye!"],[447.22,450.37,"Thank you, Ms. Sarah! Bye, everyone!"]],"OC-Advanced-Unit37-Architecture-and-Space":[[0.35,4.94,"Hello, everyone! I'm Ms. Sarah. Welcome to Online Advanced."],[5.24,8.17,"Hi! I'm Rithy. Let's learn together!"],[8.47,18.15,"Unit thirty-seven: Architecture and Space. In this unit, you will discuss how buildings shape the way we live."],[19.15,20.95,"sustainable architecture."],[21.65,27.7,"sustainable architecture means design that reduces a building's environmental impact."],[28.0,32.35,"Sustainable architecture uses local materials and natural light."],[33.05,37.12,"Your turn. Say: sustainable architecture."],[39.82,41.56,"sustainable architecture."],[42.55,44.33,"vernacular architecture."],[45.03,50.36,"vernacular architecture means traditional buildings designed for local climate and culture."],[50.66,54.38,"Khmer stilt houses are an example of vernacular architecture."],[55.08,59.45,"Your turn. Say: vernacular architecture."],[62.15,63.85,"vernacular architecture."],[64.85,65.93,"passive cooling."],[66.63,70.55,"passive cooling means keeping buildings cool without air conditioning."],[70.85,74.54,"High ceilings and shaded windows provide passive cooling."],[75.24,78.23,"Your turn. Say: passive cooling."],[80.93,82.3,"passive cooling."],[83.32,84.53,"adaptive reuse."],[85.23,89.43,"adaptive reuse means giving an old building a new purpose."],[89.73,93.32,"The old warehouse became a gallery through adaptive reuse."],[94.02,97.55,"Your turn. Say: adaptive reuse."],[100.25,101.58,"adaptive reuse."],[102.58,104.22,"biophilic design."],[104.92,108.75,"biophilic design means design that brings nature into buildings."],[109.05,112.84,"Biophilic design includes plants, water and wood."],[113.54,116.97,"Your turn. Say: biophilic design."],[119.67,121.23,"biophilic design."],[122.22,123.33,"modernist."],[124.03,129.7,"modernist means related to the 20th-century style focused on function and simplicity."],[130.0,133.44,"The modernist building has clean lines and no decoration."],[134.14,136.85,"Your turn. Say: modernist."],[139.55,140.48,"modernist."],[141.48,142.51,"brutalism."],[143.21,148.02,"brutalism means an architectural style using raw, heavy concrete."],[148.32,152.92,"Brutalism divides opinion: some love it, others hate it."],[153.62,156.79,"Your turn. Say: brutalism."],[159.49,160.39,"brutalism."],[161.38,162.92,"public housing estate."],[163.62,168.59,"public housing estate means a group of homes built by the government for rent."],[168.89,171.91,"The public housing estate houses ten thousand families."],[172.61,176.58,"Your turn. Say: public housing estate."],[179.28,180.75,"public housing estate."],[181.75,183.92,"Now let's listen to a conversation."],[184.22,187.97,"Rithy, have you seen the buildings designed by Vann Molyvann?"],[189.25,196.09,"Yes! The National Olympic Stadium. It's a modernist building that makes clever use of passive cooling."],[197.38,200.72,"He drew heavily on vernacular architecture, didn't he?"],[202.02,207.58,"Exactly. Raised floors and wide roofs, just like traditional stilt houses."],[208.88,212.32,"Many of his buildings have since been demolished, unfortunately."],[213.62,217.92,"That's a real loss. Adaptive reuse would have breathed new life into them."],[219.22,225.78,"Today, architects pay close attention to sustainable architecture again."],[227.08,232.36,"And biophilic design. Our new library has trees growing inside!"],[233.65,237.55,"Grammar focus: Collocations in academic discussion."],[237.85,241.42,"Academic collocations are fixed phrases that sound natural."],[241.72,248.07,"Make clever use of, draw heavily on, pay close attention to, and breathe new life into."],[248.37,250.22,"Learn them as complete chunks."],[250.52,256.62,"Strong collocations make academic speech precise and natural; learn them as complete chunks."],[257.62,260.65,"Now read and listen. Building for the Climate."],[260.95,265.47,"Before air conditioning, builders had to work with the climate rather than against it."],[266.78,273.47,"Vernacular architecture across Southeast Asia made clever use of shade, height and airflow."],[274.78,284.21,"In the 1950s and 1960s, Cambodian architect Vann Molyvann combined these ideas with modernist design."],[285.52,291.7,"His style, later called New Khmer Architecture, drew heavily on local traditions."],[292.98,297.93,"Sadly, several of his buildings were demolished as Phnom Penh developed rapidly."],[299.22,306.24,"Today, sustainable architecture is reviving interest in passive cooling and natural materials."],[307.55,313.33,"Adaptive reuse and biophilic design are also gaining popularity worldwide."],[314.65,318.81,"The buildings of the future may look surprisingly like the wisdom of the past."],[320.12,322.72,"Quiz time! Choose the correct answer."],[323.02,326.3,"Keeping buildings cool without air conditioning is blank."],[326.6,331.62,"A, passive cooling. B, brutalism. C, adaptive reuse."],[335.62,338.66,"The answer is A: passive cooling."],[340.15,343.39,"The design blank clever use of local materials."],[343.69,347.16,"A, does. B, makes. C, takes."],[351.15,353.24,"The answer is B: makes."],[354.75,357.38,"The architect drew heavily blank tradition."],[357.68,360.68,"A, on. B, in. C, at."],[364.68,367.18,"The answer is A: on."],[368.68,371.45,"Giving an old building a new purpose is blank."],[371.75,378.72,"A, adaptive reuse. B, vernacular architecture. C, public housing estate."],[382.72,385.63,"The answer is A: adaptive reuse."],[387.15,390.47,"According to the text, what did Vann Molyvann combine?"],[390.77,400.02,"A, vernacular ideas and modernist design. B, Greek and Roman styles. C, glass and steel only."],[404.02,407.99,"The answer is A: vernacular ideas and modernist design."],[409.48,415.91,"Now it's your turn. Part one: What should modern buildings in Cambodia learn from traditional architecture?"],[421.21,427.5,"Part two: Use two collocations, give two lessons, and describe one building you know."],[433.8,446.43,"Modern buildings should make better use of shade and airflow, and draw on local materials. The Olympic Stadium, for example, pays close attention to ventilation and still feels cool on hot days."],[446.73,449.15,"That is a well-argued answer!"],[450.15,455.27,"Great work today! You learned eight new words and collocations in academic discussion."],[455.57,460.11,"Today's value is love of country. Love and take care of Cambodia."],[460.41,463.56,"See you in Unit thirty-eight. Goodbye!"],[463.86,466.91,"Thank you, Ms. Sarah! Bye, everyone!"]],"OC-Advanced-Unit38-Risk-and-Uncertainty":[[0.35,5.34,"Hello, everyone! I'm Ms. Sarah. Welcome to Online Advanced."],[5.64,8.77,"Hi! I'm Rithy. Let's learn together!"],[9.07,17.74,"Unit thirty-eight: Risk and Uncertainty. In this unit, you will discuss how individuals and organisations deal with risk."],[18.75,19.91,"risk assessment."],[20.61,26.19,"risk assessment means identifying and evaluating possible dangers."],[26.49,29.78,"The school carried out a risk assessment before the trip."],[30.48,33.77,"Your turn. Say: risk assessment."],[36.47,37.69,"risk assessment."],[38.68,39.88,"probability."],[40.58,43.63,"probability means how likely something is to happen."],[43.93,47.35,"The probability of rain today is seventy percent."],[48.05,50.8,"Your turn. Say: probability."],[53.5,54.53,"probability."],[55.55,57.39,"worst-case scenario."],[58.09,62.42,"worst-case scenario means the most serious possible outcome."],[62.72,66.47,"In the worst-case scenario, the project could be cancelled."],[67.17,70.71,"Your turn. Say: worst-case scenario."],[73.41,74.87,"worst-case scenario."],[75.88,77.48,"precautionary principle."],[78.18,85.77,"precautionary principle means the idea that action should be taken to prevent harm even without full certainty."],[86.07,89.43,"The precautionary principle guided the ban on the chemical."],[90.13,93.8,"Your turn. Say: precautionary principle."],[96.5,98.16,"precautionary principle."],[99.15,100.15,"black swan."],[100.85,105.77,"black swan means a rare, unpredictable event with huge consequences."],[106.06,109.68,"The pandemic was a black swan for the tourism industry."],[110.38,113.37,"Your turn. Say: black swan."],[116.07,117.18,"black swan."],[118.18,119.36,"risk appetite."],[120.06,125.23,"risk appetite means how much risk a person or organisation is willing to accept."],[125.53,128.96,"Start-ups usually have a high risk appetite."],[129.66,133.27,"Your turn. Say: risk appetite."],[135.97,137.3,"risk appetite."],[138.28,139.71,"contingency plan."],[140.41,144.67,"contingency plan means a plan for what to do if something goes wrong."],[144.97,148.29,"Every event needs a contingency plan for bad weather."],[148.99,152.84,"Your turn. Say: contingency plan."],[155.54,157.03,"contingency plan."],[158.02,159.69,"uncertainty principle."],[160.39,166.14,"uncertainty principle means in physics, the limit on how precisely some quantities can be known."],[166.44,172.07,"Heisenberg's uncertainty principle is often used as a metaphor for unknowable risks."],[172.77,176.16,"Your turn. Say: uncertainty principle."],[178.86,180.36,"uncertainty principle."],[181.35,183.59,"Now let's listen to a conversation."],[183.89,187.82,"Ms. Sarah, how do companies plan for things they can't predict?"],[189.12,193.33,"They carry out a risk assessment and draw up contingency plans."],[194.65,197.86,"But what about black swans, like the pandemic?"],[199.15,204.08,"Those are hard to foresee. Still, firms that had built up reserves pulled through."],[205.38,207.46,"So it comes down to risk appetite?"],[208.75,213.1,"Partly. Some take on huge risks; others play it safe."],[214.38,215.59,"And governments?"],[216.88,222.63,"They often fall back on the precautionary principle: act early, even without certainty."],[223.92,228.39,"Grammar focus: Advanced phrasal verbs (extended)."],[228.69,231.22,"Phrasal verbs are common in business English."],[231.52,235.76,"Draw up a plan, pull through a crisis, and fall back on a principle."],[236.06,238.34,"Know their formal equivalents for writing."],[238.64,247.94,"Many phrasal verbs have formal equivalents: draw up = prepare; pull through = survive; fall back on = rely on."],[248.95,252.18,"Now read and listen. Thinking About the Unthinkable."],[252.48,257.63,"Every decision involves some degree of risk and uncertainty."],[258.92,265.62,"Organisations carry out risk assessments to estimate the probability and impact of possible problems."],[266.92,272.27,"They then draw up contingency plans for the most likely and most damaging scenarios."],[273.58,279.09,"However, some events, known as black swans, are almost impossible to predict."],[280.38,287.22,"The 2008 financial crisis and the COVID-19 pandemic are often given as examples."],[288.52,294.12,"Companies with strong reserves and flexible strategies were more likely to pull through."],[295.42,300.81,"Governments frequently fall back on the precautionary principle when facing uncertain threats."],[302.12,307.79,"Accepting uncertainty, rather than ignoring it, may be the wisest strategy of all."],[309.08,312.04,"Quiz time! Choose the correct answer."],[312.34,317.09,"A rare, unpredictable event with huge consequences is a blank."],[317.39,321.71,"A, black swan. B, risk assessment. C, probability."],[325.72,327.82,"The answer is A: black swan."],[329.32,331.27,"The team blank a detailed plan."],[331.57,336.05,"A, drew up. B, pulled through. C, fell back."],[340.05,341.99,"The answer is A: drew up."],[343.48,345.64,"Few businesses blank the crisis."],[345.94,349.61,"A, took on. B, pulled through. C, drew up."],[353.62,355.58,"The answer is B: pulled through."],[357.08,360.46,"A plan for what to do if something goes wrong is a blank."],[360.76,366.37,"A, contingency plan. B, risk appetite. C, worst-case scenario."],[370.38,373.24,"The answer is A: contingency plan."],[374.75,378.97,"According to the text, which companies were more likely to pull through?"],[379.27,385.49,"A, those with strong reserves. B, the largest ones. C, the newest ones."],[389.48,392.46,"The answer is A: those with strong reserves."],[393.95,399.76,"Now it's your turn. Part one: How do you personally deal with risk in important decisions?"],[405.06,411.22,"Part two: Use two phrasal verbs, describe your approach, and give a real example."],[417.52,432.3,"I usually draw up a list of pros and cons and think about the worst-case scenario. When I chose my university, I took on extra risk by moving to Phnom Penh, but I had a contingency plan: I could fall back on my family's support."],[432.6,434.62,"That is a well-argued answer!"],[435.62,440.75,"Great work today! You learned eight new words and advanced phrasal verbs (extended)."],[441.05,445.1,"Today's value is being prepared. Get ready before you go."],[445.4,448.97,"See you in Unit thirty-nine. Goodbye!"],[449.27,452.04,"Thank you, Ms. Sarah! Bye, everyone!"]],"OC-Advanced-Unit39-Global-Trade":[[0.35,5.42,"Hello, everyone! I'm Ms. Sarah. Welcome to Online Advanced."],[5.72,8.64,"Hi! I'm Rithy. Let's learn together!"],[8.94,15.99,"Unit thirty-nine: Global Trade. In this unit, you will discuss international trade and its effects."],[16.98,18.32,"free trade agreement."],[19.02,24.19,"free trade agreement means a deal that reduces barriers to trade between countries."],[24.49,27.54,"Cambodia signed a free trade agreement with China."],[28.23,31.54,"Your turn. Say: free trade agreement."],[34.24,35.49,"free trade agreement."],[36.48,37.57,"protectionism."],[38.27,43.06,"protectionism means protecting local industries by limiting imports."],[43.36,46.79,"Protectionism can lead to higher prices for consumers."],[47.49,50.64,"Your turn. Say: protectionism."],[53.34,54.53,"protectionism."],[55.52,57.1,"global value chain."],[57.8,62.77,"global value chain means the international steps involved in producing a product."],[63.07,67.53,"A smartphone passes through a global value chain of many countries."],[68.23,71.68,"Your turn. Say: global value chain."],[74.38,75.8,"global value chain."],[76.82,78.69,"export-led growth."],[79.39,84.11,"export-led growth means economic growth based on selling goods abroad."],[84.41,88.06,"Cambodia's garment sector drove export-led growth."],[88.77,92.43,"Your turn. Say: export-led growth."],[95.13,96.63,"export-led growth."],[97.62,99.17,"comparative advantage."],[99.88,105.9,"comparative advantage means the ability to produce something more efficiently than others."],[106.2,109.24,"Countries trade based on comparative advantage."],[109.94,113.67,"Your turn. Say: comparative advantage."],[116.37,118.08,"comparative advantage."],[119.08,120.05,"trade war."],[120.75,126.34,"trade war means a conflict where countries raise tariffs against each other."],[126.64,129.43,"The trade war hurt farmers on both sides."],[130.13,132.79,"Your turn. Say: trade war."],[135.49,136.48,"trade war."],[137.48,138.58,"customs union."],[139.28,145.49,"customs union means a group of countries with no tariffs between them and a shared external tariff."],[145.79,147.69,"The EU is a customs union."],[148.39,151.44,"Your turn. Say: customs union."],[154.15,155.38,"customs union."],[156.38,157.26,"dumping."],[157.96,161.85,"dumping means selling goods abroad below their real cost."],[162.15,164.93,"The country was accused of dumping cheap steel."],[165.63,168.42,"Your turn. Say: dumping."],[171.12,171.91,"dumping."],[172.92,175.18,"Now let's listen to a conversation."],[175.48,178.8,"Rithy, how has trade shaped Cambodia's economy?"],[180.08,184.35,"Enormously. Garments have been the engine of export-led growth."],[185.65,190.23,"But relying on one industry means putting all your eggs in one basket."],[191.52,196.33,"That's true. When orders fell during the pandemic, factories were hit hard."],[197.62,201.84,"And trade wars between big economies create ripple effects everywhere."],[203.15,206.54,"Small countries are caught between a rock and a hard place."],[207.85,211.01,"Free trade agreements can help diversify markets."],[212.32,215.8,"As long as local industries aren't wiped out by dumping."],[217.12,221.19,"Grammar focus: Idiomatic language in economics."],[221.49,224.06,"Idioms make economic discussion vivid."],[224.36,230.06,"Don't put all your eggs in one basket. Small economies are caught between a rock and a hard place."],[230.36,232.94,"Trade wars create ripple effects."],[233.24,238.34,"Idioms add colour to discussion, but in formal reports use neutral language instead."],[239.35,242.44,"Now read and listen. Trade and Development."],[242.74,247.37,"International trade has lifted hundreds of millions of people out of poverty."],[248.68,254.63,"According to the theory of comparative advantage, countries benefit by specialising in what they do best."],[255.92,262.33,"Cambodia's garment and footwear industries have been the engine of export-led growth for decades."],[263.62,268.61,"However, depending heavily on a few products and markets creates vulnerability."],[269.92,275.15,"Trade wars between major economies have caused ripple effects across global value chains."],[276.45,281.56,"Some governments respond with protectionism, while others sign new free trade agreements."],[282.85,286.42,"Accusations of dumping show that trade can also create tension."],[287.72,292.86,"For developing countries, diversification may be the key to sustainable growth."],[294.15,296.88,"Quiz time! Choose the correct answer."],[297.18,301.1,"Protecting local industries by limiting imports is blank."],[301.4,306.15,"A, protectionism. B, dumping. C, customs union."],[310.15,313.23,"The answer is A: protectionism."],[314.72,318.03,"Relying on one thing is putting all your eggs in one blank."],[318.33,321.6,"A, box. B, basket. C, bag."],[325.58,327.7,"The answer is B: basket."],[329.18,333.27,"Two bad choices: caught between a rock and a blank place."],[333.57,336.97,"A, hard. B, difficult. C, stone."],[340.98,343.14,"The answer is A: hard."],[344.65,348.88,"Selling goods abroad below their real cost is blank."],[349.18,354.25,"A, dumping. B, trade war. C, comparative advantage."],[358.25,360.54,"The answer is A: dumping."],[362.05,365.93,"According to the text, what may be key to sustainable growth?"],[366.23,371.1,"A, protectionism. B, diversification. C, trade wars."],[375.12,378.01,"The answer is B: diversification."],[379.52,384.82,"Now it's your turn. Part one: Is free trade good for countries like Cambodia?"],[390.12,396.31,"Part two: Use one idiom, give a benefit and a risk, and suggest a strategy."],[402.61,414.51,"Overall, yes. Free trade has been the engine of job creation. However, Cambodia shouldn't put all its eggs in one basket: it should diversify into electronics, agriculture and tourism."],[414.81,416.62,"That is a well-argued answer!"],[417.62,423.4,"Great work today! You learned eight new words and idiomatic language in economics."],[423.7,427.48,"Today's value is hard work. Work hard and never give up."],[427.78,430.53,"See you in Unit forty. Goodbye!"],[430.83,433.51,"Thank you, Ms. Sarah! Bye, everyone!"]],"OC-Advanced-Unit40-Human-Rights":[[0.35,5.03,"Hello, everyone! I'm Ms. Sarah. Welcome to Online Advanced."],[5.33,8.1,"Hi! I'm Rithy. Let's learn together!"],[8.4,15.76,"Unit forty: Human Rights. In this unit, you will discuss the principles and protection of human rights."],[16.75,18.55,"universal declaration."],[19.25,27.14,"universal declaration means the 1948 UN document listing basic human rights."],[27.44,33.18,"The Universal Declaration of Human Rights was adopted in 1948."],[33.88,37.46,"Your turn. Say: universal declaration."],[40.16,41.9,"universal declaration."],[42.92,44.3,"freedom of expression."],[45.0,49.5,"freedom of expression means the right to share opinions and information."],[49.8,53.57,"Freedom of expression includes the right to criticise."],[54.27,57.41,"Your turn. Say: freedom of expression."],[60.11,61.39,"freedom of expression."],[62.38,63.74,"right to education."],[64.44,69.02,"right to education means every person's right to learn and go to school."],[69.32,72.23,"The right to education applies to every child."],[72.93,76.55,"Your turn. Say: right to education."],[79.25,80.8,"right to education."],[81.82,83.24,"due process rights."],[83.94,88.78,"due process rights means rights to fair legal treatment, such as a fair trial."],[89.08,92.52,"Due process rights protect people from unfair punishment."],[93.22,96.53,"Your turn. Say: due process rights."],[99.23,100.55,"due process rights."],[101.55,103.16,"human rights defender."],[103.85,107.91,"human rights defender means a person who works to protect others' rights."],[108.21,111.17,"Human rights defenders often face risks."],[111.87,115.27,"Your turn. Say: human rights defender."],[117.97,119.5,"human rights defender."],[120.52,121.81,"civil liberties."],[122.51,125.99,"civil liberties means basic freedoms protected by law."],[126.29,129.12,"Civil liberties include freedom of movement."],[129.82,133.36,"Your turn. Say: civil liberties."],[136.06,137.38,"civil liberties."],[138.38,139.84,"freedom of assembly."],[140.54,143.9,"freedom of assembly means the right to gather peacefully."],[144.19,147.03,"Freedom of assembly allows peaceful protest."],[147.73,151.28,"Your turn. Say: freedom of assembly."],[153.98,155.43,"freedom of assembly."],[156.42,158.07,"non-discrimination."],[158.77,163.43,"non-discrimination means treating everyone equally regardless of identity."],[163.73,168.05,"Non-discrimination is a core human rights principle."],[168.75,172.83,"Your turn. Say: non-discrimination."],[175.53,176.99,"non-discrimination."],[177.98,180.22,"Now let's listen to a conversation."],[180.51,184.5,"Ms. Sarah, where does the idea of universal human rights come from?"],[185.78,193.19,"Formally, from the Universal Declaration of 1948, adopted after the Second World War."],[194.48,197.78,"My friends sometimes say rights are a Western idea."],[199.08,204.31,"That's a common view, but the drafting committee included members from several continents."],[205.62,207.8,"Which rights matter most, in your opinion?"],[209.12,214.31,"They're indivisible. However, the right to education enables all the others."],[215.62,218.41,"I'd say freedom of expression is pretty key too."],[219.72,226.26,"Indeed. In formal terms, it is considered essential to accountability and participation."],[227.55,231.16,"Grammar focus: Register in formal discussion."],[231.46,235.74,"Serious topics usually require a formal register."],[236.04,242.78,"Informally, freedom of expression is pretty key; formally, it is considered essential."],[243.07,245.96,"It is widely held that rights are universal."],[246.26,252.94,"In essays and presentations on serious topics, choose formal, precise vocabulary."],[253.95,256.94,"Now read and listen. Rights for Everyone."],[257.24,263.79,"In 1948, the United Nations adopted the Universal Declaration of Human Rights."],[265.08,270.88,"It was drafted by representatives from many regions, cultures and religious traditions."],[272.18,277.91,"The declaration states that all human beings are born free and equal in dignity and rights."],[279.22,285.06,"It includes civil liberties, such as freedom of expression and freedom of assembly."],[286.35,291.74,"It also recognises social rights, including the right to education and health."],[293.05,297.51,"Non-discrimination is a principle that runs through the entire document."],[298.82,303.24,"Human rights defenders around the world work to ensure these principles are respected."],[304.55,310.93,"It is widely held that rights are indivisible: progress in one area supports progress in others."],[312.22,315.03,"Quiz time! Choose the correct answer."],[315.33,317.56,"The right to gather peacefully is blank."],[317.86,324.64,"A, freedom of assembly. B, due process rights. C, non-discrimination."],[328.65,332.05,"The answer is A: freedom of assembly."],[333.55,335.22,"Which phrase is most formal?"],[335.52,340.8,"A, pretty key. B, a big deal. C, considered essential."],[344.82,347.33,"The answer is C: considered essential."],[348.82,351.92,"'It is widely blank that education is a right.'"],[352.22,356.21,"A, held. B, told. C, said us."],[360.22,362.36,"The answer is A: held."],[363.85,367.3,"Treating everyone equally regardless of identity is blank."],[367.6,373.29,"A, civil liberties. B, non-discrimination. C, universal declaration."],[377.28,380.79,"The answer is B: non-discrimination."],[382.28,386.36,"According to the text, when was the Universal Declaration adopted?"],[386.66,394.82,"A, 1918. B, 1948. C, 1990."],[398.82,402.62,"The answer is B: 1948."],[404.12,410.18,"Now it's your turn. Part one: Which human right do you consider most important, and why?"],[415.48,422.17,"Part two: Answer in a formal register: give your choice, two reasons and an example."],[428.47,443.19,"I consider the right to education fundamental. Firstly, it enables people to understand and claim their other rights; secondly, it reduces poverty. Free primary education, for example, has transformed opportunities for millions of children."],[443.49,446.05,"That is a well-argued answer!"],[447.05,451.58,"Great work today! You learned eight new words and register in formal discussion."],[451.88,455.22,"Today's value is respect. Thank the people who help us."],[455.52,458.3,"See you in Unit forty-one. Goodbye!"],[458.6,461.14,"Thank you, Ms. Sarah! Bye, everyone!"]],"OC-Advanced-Unit41-Biotechnology":[[0.35,5.49,"Hello, everyone! I'm Ms. Sarah. Welcome to Online Advanced."],[5.79,8.85,"Hi! I'm Rithy. Let's learn together!"],[9.15,16.37,"Unit forty-one: Biotechnology. In this unit, you will debate the promise and dangers of biotechnology."],[17.35,18.59,"gene editing."],[19.3,24.57,"gene editing means changing the DNA of a living thing in a precise way."],[24.87,27.41,"Gene editing may cure inherited diseases."],[28.11,31.76,"Your turn. Say: gene editing."],[34.46,35.63,"gene editing."],[36.62,37.45,"CRISPR."],[38.16,41.74,"CRISPR means a powerful tool that can cut and edit DNA."],[42.05,45.72,"CRISPR has made gene editing faster and cheaper."],[46.42,49.39,"Your turn. Say: CRISPR."],[52.09,52.91,"CRISPR."],[53.92,55.49,"synthetic biology."],[56.19,61.65,"synthetic biology means designing and building new biological parts or organisms."],[61.95,65.33,"Synthetic biology could produce fuel from bacteria."],[66.03,69.42,"Your turn. Say: synthetic biology."],[72.12,73.72,"synthetic biology."],[74.72,76.36,"biotech start-up."],[77.06,82.14,"biotech start-up means a new company developing products from biology."],[82.44,86.55,"The biotech start-up is developing a malaria test."],[87.25,90.59,"Your turn. Say: biotech start-up."],[93.29,95.26,"biotech start-up."],[96.25,97.47,"designer baby."],[98.17,102.26,"designer baby means a baby whose genes have been chosen or altered."],[102.56,105.55,"Most scientists oppose creating designer babies."],[106.25,109.74,"Your turn. Say: designer baby."],[112.44,113.76,"designer baby."],[114.75,116.35,"genetic modification."],[117.06,121.18,"genetic modification means changing the genes of crops or animals."],[121.48,125.08,"Genetic modification has produced drought-resistant rice."],[125.78,129.49,"Your turn. Say: genetic modification."],[132.19,133.83,"genetic modification."],[134.82,135.89,"stem cell."],[136.59,141.29,"stem cell means a cell that can develop into many types of cells."],[141.59,144.9,"Stem cell research offers hope for spinal injuries."],[145.6,148.45,"Your turn. Say: stem cell."],[151.15,152.11,"stem cell."],[153.12,154.36,"biosafety."],[155.06,160.05,"biosafety means rules and practices to prevent harm from biological research."],[160.34,163.33,"Strict biosafety rules govern the laboratory."],[164.03,167.28,"Your turn. Say: biosafety."],[169.98,171.1,"biosafety."],[172.12,174.34,"Now let's listen to a conversation."],[174.64,182.15,"Rithy, by the time CRISPR was announced in 2012, scientists had been searching for such a tool for decades."],[183.45,187.23,"And within a few years, labs everywhere were using it."],[188.52,196.2,"Then, in 2018, a researcher shocked the world. He had secretly edited the genes of twin babies."],[197.48,201.13,"The so-called designer babies? I remember reading about it."],[202.45,207.12,"He was going to present it as a medical breakthrough, but scientists condemned it."],[208.42,211.48,"Because nobody knew the long-term effects?"],[212.78,220.92,"Exactly. Gene editing to cure disease is one thing; changing future generations is quite another."],[222.22,225.91,"So strong biosafety rules must keep pace with the science."],[227.22,230.82,"Grammar focus: Narrative tenses (mastery)."],[231.12,235.05,"Mastering narrative tenses means controlling time and emphasis."],[235.34,240.34,"Scientists had been searching for decades. He was going to present it as a breakthrough."],[240.64,243.65,"Labs everywhere were using it within a few years."],[243.95,249.88,"Mastery means choosing tenses to control the reader's sense of time, background and surprise."],[250.88,253.42,"Now read and listen. Editing Life."],[253.72,259.28,"For most of history, humans could only change living things through slow selective breeding."],[260.58,268.28,"In 2012, scientists announced CRISPR, a tool that could edit DNA with remarkable precision."],[269.58,277.14,"Since then, gene editing has been used to develop disease-resistant crops and potential cures for blood disorders."],[278.45,284.19,"Synthetic biology goes further, designing entirely new biological systems."],[285.48,291.27,"However, in 2018 a researcher claimed to have created the first gene-edited babies."],[292.58,297.39,"The scientific community reacted with alarm, and he was later imprisoned."],[298.68,304.33,"The case showed that biosafety and ethics must develop as quickly as the technology itself."],[305.62,313.76,"Biotechnology may transform medicine and agriculture, but it also forces us to ask what kind of future we want."],[315.05,317.8,"Quiz time! Choose the correct answer."],[318.1,321.42,"A tool that can cut and edit DNA is blank."],[321.72,326.12,"A, CRISPR. B, stem cell. C, biosafety."],[330.12,332.52,"The answer is A: CRISPR."],[334.02,338.31,"By 2012, scientists blank for such a tool for years."],[338.62,343.07,"A, searched. B, had been searching. C, have searched."],[347.08,349.84,"The answer is B: had been searching."],[351.35,354.81,"He blank announce the results, but he changed his mind."],[355.11,359.23,"A, was going to. B, had. C, would have."],[363.22,365.71,"The answer is A: was going to."],[367.22,370.6,"A baby whose genes have been chosen or altered is a blank."],[370.9,376.87,"A, designer baby. B, stem cell. C, biotech start-up."],[380.88,383.43,"The answer is A: designer baby."],[384.92,390.07,"According to the text, what happened to the researcher who edited babies' genes?"],[390.37,396.68,"A, he won a prize. B, he was imprisoned. C, he became famous."],[400.68,403.39,"The answer is B: he was imprisoned."],[404.88,410.09,"Now it's your turn. Part one: Should gene editing be allowed in humans?"],[415.39,420.94,"Part two: Narrate one real case, then give your position and two reasons."],[427.24,443.32,"In 2018, a scientist edited babies' genes in secret, which shocked the world. I believe editing should be allowed only to treat serious diseases in adults, because the risks to future generations are unknown and consent is impossible."],[443.62,446.11,"That is a well-argued answer!"],[447.12,452.05,"Great work today! You learned eight new words and narrative tenses (mastery)."],[452.35,456.99,"Today's value is responsibility. Help at home and do your jobs."],[457.29,460.07,"See you in Unit forty-two. Goodbye!"],[460.37,463.42,"Thank you, Ms. Sarah! Bye, everyone!"]],"OC-Advanced-Unit42-Cultural-Heritage-and-Tourism":[[0.35,5.25,"Hello, everyone! I'm Ms. Sarah. Welcome to Online Advanced."],[5.55,8.51,"Hi! I'm Rithy. Let's learn together!"],[8.81,18.05,"Unit forty-two: Cultural Heritage and Tourism. In this unit, you will discuss how to protect heritage sites while welcoming visitors."],[19.05,20.52,"heritage management."],[21.21,26.22,"heritage management means planning and protecting important historical sites."],[26.52,30.0,"Heritage management at Angkor involves many experts."],[30.7,34.59,"Your turn. Say: heritage management."],[37.29,38.7,"heritage management."],[39.68,41.27,"authenticity debate."],[41.97,46.79,"authenticity debate means discussion about whether restored sites remain genuine."],[47.09,51.04,"The authenticity debate surrounds every major restoration."],[51.74,55.18,"Your turn. Say: authenticity debate."],[57.88,59.34,"authenticity debate."],[60.35,61.61,"living heritage."],[62.31,67.17,"living heritage means traditions and places still used by communities today."],[67.47,72.03,"Angkor is living heritage: monks still pray there."],[72.73,76.17,"Your turn. Say: living heritage."],[78.87,80.11,"living heritage."],[81.12,82.92,"site carrying capacity."],[83.62,88.71,"site carrying capacity means the number of visitors a site can receive without damage."],[89.01,93.08,"Experts calculate the site carrying capacity of each temple."],[93.78,98.14,"Your turn. Say: site carrying capacity."],[100.84,102.59,"site carrying capacity."],[103.58,105.25,"restoration ethics."],[105.95,110.49,"restoration ethics means principles about how old buildings should be repaired."],[110.79,115.56,"Restoration ethics require using original materials where possible."],[116.26,119.98,"Your turn. Say: restoration ethics."],[122.68,124.43,"restoration ethics."],[125.42,126.79,"heritage tourism."],[127.49,132.03,"heritage tourism means travel to experience historical and cultural sites."],[132.33,135.97,"Heritage tourism supports thousands of jobs in Siem Reap."],[136.67,139.75,"Your turn. Say: heritage tourism."],[142.45,143.76,"heritage tourism."],[144.75,146.37,"community stewardship."],[147.07,152.54,"community stewardship means local people taking responsibility for caring for a place."],[152.84,156.69,"Community stewardship protects heritage for the long term."],[157.39,160.78,"Your turn. Say: community stewardship."],[163.48,164.95,"community stewardship."],[165.95,167.32,"cultural landscape."],[168.02,172.85,"cultural landscape means an area shaped by both nature and human culture."],[173.16,176.87,"Angkor's rice fields and reservoirs form a cultural landscape."],[177.57,180.83,"Your turn. Say: cultural landscape."],[183.53,184.93,"cultural landscape."],[185.92,188.03,"Now let's listen to a conversation."],[188.33,194.55,"Ms. Sarah, by 2030, Angkor will have been a World Heritage Site for nearly forty years."],[195.85,200.73,"And for all that time, experts will have been balancing tourism and protection."],[202.02,205.41,"Is there a limit to how many visitors the temples can take?"],[206.72,212.75,"Yes. That's the site carrying capacity. Some steps have been closed to prevent erosion."],[214.05,216.76,"There's also the authenticity debate about restoration."],[218.05,223.91,"Right. Restoration ethics say repairs should be visible and reversible."],[225.22,228.18,"And local villagers still live inside the park."],[229.48,233.87,"Which makes it living heritage. Community stewardship is essential."],[235.15,238.95,"Grammar focus: Future perfect continuous (mastery)."],[239.25,242.13,"Compare the future perfect continuous and simple."],[242.43,247.77,"By 2030, experts will have been balancing tourism and protection for decades."],[248.07,254.09,"By 2030, Angkor will have been a World Heritage Site for nearly forty years."],[254.39,260.72,"Use the continuous form for ongoing effort; use the simple form for states and completed results."],[261.72,264.37,"Now read and listen. Protecting Angkor."],[264.67,270.14,"Angkor was inscribed on the World Heritage List in 1992."],[271.45,276.22,"At that time, many temples were damaged and the site was considered at risk."],[277.52,283.16,"Since then, international teams and Cambodian experts have restored major monuments."],[284.45,290.04,"Heritage tourism has grown dramatically, bringing millions of visitors and significant income."],[291.35,296.75,"However, large crowds can damage stone surfaces and strain water resources."],[298.05,304.62,"Managers now consider the site carrying capacity and encourage visitors to explore less famous temples."],[305.92,312.07,"Because people still live and worship there, Angkor is a living heritage and a cultural landscape."],[313.38,319.95,"Its future will depend on community stewardship as much as on international expertise."],[321.25,324.25,"Quiz time! Choose the correct answer."],[324.55,328.35,"The number of visitors a site can receive without damage is its blank."],[328.65,335.07,"A, site carrying capacity. B, heritage management. C, restoration ethics."],[339.05,341.77,"The answer is A: site carrying capacity."],[343.28,346.29,"By next year, she blank here for a decade."],[346.59,350.57,"A, will have been working. B, will work. C, works."],[354.58,357.33,"The answer is A: will have been working."],[358.82,361.27,"By 2030, the project blank."],[361.57,366.27,"A, will have been finished. B, will have been finishing. C, finishes."],[370.28,372.84,"The answer is A: will have been finished."],[374.35,377.95,"Local people taking responsibility for a place is blank."],[378.25,384.43,"A, community stewardship. B, authenticity debate. C, heritage tourism."],[388.42,391.6,"The answer is A: community stewardship."],[393.12,398.01,"According to the text, when was Angkor inscribed on the World Heritage List?"],[398.31,405.9,"A, 1979. B, 1992. C, 2008."],[409.88,413.33,"The answer is B: 1992."],[414.85,420.75,"Now it's your turn. Part one: How can Cambodia balance tourism and heritage protection?"],[426.05,432.51,"Part two: Propose two measures, explain their benefits and one possible conflict."],[438.81,451.59,"By limiting visitor numbers at fragile temples and training local guides, Cambodia could protect sites while creating jobs. However, limiting visitors might reduce income for some businesses in the short term."],[451.89,454.18,"That is a well-argued answer!"],[455.18,460.8,"Great work today! You learned eight new words and future perfect continuous (mastery)."],[461.1,466.36,"Today's value is love of country. Love and take care of Cambodia."],[466.66,470.53,"See you in Unit forty-three. Goodbye!"],[470.83,474.0,"Thank you, Ms. Sarah! Bye, everyone!"]],"OC-Advanced-Unit43-Energy-Transition":[[0.35,5.21,"Hello, everyone! I'm Ms. Sarah. Welcome to Online Advanced."],[5.51,8.76,"Hi! I'm Rithy. Let's learn together!"],[9.06,18.1,"Unit forty-three: Energy Transition. In this unit, you will discuss the shift from fossil fuels to clean energy."],[19.08,20.51,"energy transition."],[21.21,25.79,"energy transition means the shift from fossil fuels to renewable energy."],[26.09,29.62,"The energy transition requires huge investment."],[30.32,33.37,"Your turn. Say: energy transition."],[36.07,37.54,"energy transition."],[38.55,39.8,"grid storage."],[40.49,44.84,"grid storage means storing electricity for later use in the power network."],[45.14,47.81,"Batteries for grid storage are getting cheaper."],[48.51,51.58,"Your turn. Say: grid storage."],[54.28,55.27,"grid storage."],[56.28,57.62,"baseload power."],[58.32,64.21,"baseload power means the minimum electricity a network needs all the time."],[64.51,67.72,"Hydropower provides baseload power in the rainy season."],[68.42,71.56,"Your turn. Say: baseload power."],[74.26,75.56,"baseload power."],[76.55,77.74,"coal phase-out."],[78.44,82.61,"coal phase-out means gradually closing coal power stations."],[82.91,85.65,"Several countries have announced a coal phase-out."],[86.35,89.75,"Your turn. Say: coal phase-out."],[92.44,93.7,"coal phase-out."],[94.72,96.04,"energy security."],[96.74,101.18,"energy security means reliable access to affordable energy."],[101.48,104.69,"Imported fuel threatens energy security."],[105.39,109.11,"Your turn. Say: energy security."],[111.81,113.25,"energy security."],[114.25,115.95,"decentralised energy."],[116.65,122.39,"decentralised energy means electricity produced near where it is used."],[122.69,126.61,"Rooftop solar is a form of decentralised energy."],[127.31,131.18,"Your turn. Say: decentralised energy."],[133.88,135.67,"decentralised energy."],[136.68,137.96,"feed-in tariff."],[138.66,143.28,"feed-in tariff means payment for selling home-produced electricity to the grid."],[143.57,147.05,"A feed-in tariff encourages households to install panels."],[147.75,150.7,"Your turn. Say: feed-in tariff."],[153.4,154.44,"feed-in tariff."],[155.45,156.85,"green hydrogen."],[157.55,161.94,"green hydrogen means hydrogen fuel produced using renewable electricity."],[162.24,165.2,"Green hydrogen could power ships and factories."],[165.9,168.89,"Your turn. Say: green hydrogen."],[171.59,172.75,"green hydrogen."],[173.75,175.89,"Now let's listen to a conversation."],[176.19,180.44,"Rithy, could Cambodia run entirely on renewable energy?"],[181.75,185.85,"Were grid storage cheaper, it might be possible within twenty years."],[187.15,190.76,"What about baseload power when the sun isn't shining?"],[192.05,198.37,"Hydropower and batteries could provide it. Should demand rise faster, imports would still be needed."],[199.68,202.86,"And coal? Some new plants were built recently."],[204.15,209.03,"Had the country invested earlier in solar, those plants might not have been necessary."],[210.32,213.5,"Decentralised energy could help rural areas too."],[214.82,219.08,"Yes, especially with a feed-in tariff to reward households."],[220.38,223.82,"Grammar focus: Inverted conditionals (mastery)."],[224.12,228.42,"Mastering inverted conditionals means using all three forms naturally."],[228.72,234.53,"Were storage cheaper, it might be possible. Should demand rise, imports would be needed."],[234.83,239.38,"Had the country invested earlier, those plants might not have been necessary."],[239.69,244.65,"Mastery means using all three forms naturally in formal speech and writing."],[245.65,248.64,"Now read and listen. Powering the Future."],[248.94,252.62,"The world is in the middle of a historic energy transition."],[253.92,258.06,"Solar and wind power have become cheaper than coal in many regions."],[259.35,264.81,"However, renewable energy depends on the weather, so grid storage is essential."],[266.12,270.88,"Several countries have committed to a coal phase-out within the next two decades."],[272.18,276.52,"Others are investing in green hydrogen for heavy industry and shipping."],[277.82,284.06,"Decentralised energy, such as rooftop solar, gives communities more control over their power."],[285.35,292.17,"Were these technologies to spread rapidly, energy security would improve in import-dependent countries."],[293.48,300.57,"The transition is not only technical but also social: workers and communities must not be left behind."],[301.88,304.43,"Quiz time! Choose the correct answer."],[304.73,307.57,"Storing electricity for later use is blank."],[307.87,312.65,"A, grid storage. B, baseload power. C, feed-in tariff."],[316.65,319.5,"The answer is A: grid storage."],[320.98,323.31,"blank you require help, please ask."],[323.61,326.67,"A, Had. B, Should. C, Were."],[330.68,333.11,"The answer is B: Should."],[334.62,337.68,"blank we left earlier, we would have caught the train."],[337.98,341.16,"A, Had. B, Should. C, Were."],[345.15,347.42,"The answer is A: Had."],[348.92,352.32,"Electricity produced near where it is used is blank."],[352.62,358.57,"A, decentralised energy. B, green hydrogen. C, coal phase-out."],[362.58,365.89,"The answer is A: decentralised energy."],[367.38,371.21,"According to the text, why is grid storage essential?"],[371.51,378.15,"A, renewables depend on the weather. B, coal is cheap. C, hydrogen is dangerous."],[382.15,385.32,"The answer is A: renewables depend on the weather."],[386.82,393.79,"Now it's your turn. Part one: What should Cambodia's energy priorities be for the next twenty years?"],[399.09,405.98,"Part two: Use an inverted conditional, propose two priorities and explain one trade-off."],[412.27,424.9,"Solar expansion and grid storage should be top priorities. Were the government to offer feed-in tariffs, households would invest too. The trade-off is that storage remains expensive in the short term."],[425.2,427.88,"That is a well-argued answer!"],[428.88,434.38,"Great work today! You learned eight new words and inverted conditionals (mastery)."],[434.68,439.48,"Today's value is caring for nature. Care for plants, birds and our planet."],[439.78,442.5,"See you in Unit forty-four. Goodbye!"],[442.8,445.48,"Thank you, Ms. Sarah! Bye, everyone!"]],"OC-Advanced-Unit44-Rhetoric-and-Public-Speaking":[[0.35,5.4,"Hello, everyone! I'm Ms. Sarah. Welcome to Online Advanced."],[5.7,8.9,"Hi! I'm Rithy. Let's learn together!"],[9.2,17.85,"Unit forty-four: Rhetoric and Public Speaking. In this unit, you will analyse and use persuasive speaking techniques."],[18.85,19.87,"ethos."],[20.57,24.39,"ethos means persuasion based on the speaker's credibility."],[24.68,28.11,"A doctor speaking about health has strong ethos."],[28.81,31.22,"Your turn. Say: ethos."],[33.92,34.92,"ethos."],[35.92,36.84,"pathos."],[37.54,39.94,"pathos means persuasion through emotion."],[40.24,43.3,"The charity advert relied heavily on pathos."],[44.0,46.83,"Your turn. Say: pathos."],[49.52,50.63,"pathos."],[51.62,52.56,"logos."],[53.26,56.57,"logos means persuasion through logic and evidence."],[56.87,60.97,"Her argument was full of logos: data, facts and clear reasoning."],[61.67,64.45,"Your turn. Say: logos."],[67.15,67.99,"logos."],[68.98,70.4,"rhetorical question."],[71.1,75.5,"rhetorical question means a question asked for effect, not for an answer."],[75.81,79.28,"'Who doesn't want a better future?' is a rhetorical question."],[79.98,83.3,"Your turn. Say: rhetorical question."],[86.0,87.31,"rhetorical question."],[88.32,89.28,"tricolon."],[89.98,93.83,"tricolon means a series of three parallel words or phrases."],[94.13,99.04,"'Government of the people, by the people, for the people' is a famous tricolon."],[99.74,102.66,"Your turn. Say: tricolon."],[105.36,106.29,"tricolon."],[107.28,108.15,"anaphora."],[108.84,113.05,"anaphora means repeating words at the start of successive sentences."],[113.35,117.09,"'We shall fight on the beaches, we shall fight...' uses anaphora."],[117.79,120.57,"Your turn. Say: anaphora."],[123.27,124.33,"anaphora."],[125.32,126.84,"persuasive technique."],[127.54,132.01,"persuasive technique means a method used to convince an audience."],[132.31,136.31,"Repetition is a simple but effective persuasive technique."],[137.01,140.47,"Your turn. Say: persuasive technique."],[143.17,144.59,"persuasive technique."],[145.58,147.26,"audience analysis."],[147.96,152.65,"audience analysis means studying who your listeners are before you speak."],[152.95,156.63,"Good audience analysis shapes the tone of a speech."],[157.33,160.54,"Your turn. Say: audience analysis."],[163.24,165.02,"audience analysis."],[166.02,168.18,"Now let's listen to a conversation."],[168.48,173.19,"Ms. Sarah, I have to give a speech next week. What makes a speech persuasive?"],[174.48,178.46,"What matters first is audience analysis. Who will be listening?"],[179.75,181.8,"Students and some lecturers."],[183.08,187.32,"Then it's credibility, or ethos, that you'll need to establish early."],[188.62,189.59,"And emotion?"],[190.88,197.43,"Pathos helps, but what really convinces academics is logos: clear evidence."],[198.75,201.66,"Should I use techniques like rhetorical questions?"],[202.95,208.54,"Yes, sparingly. What audiences remember most is a powerful tricolon at the end."],[209.85,213.23,"Grammar focus: Cleft sentences (mastery)."],[213.53,216.82,"Cleft sentences are powerful tools in public speaking."],[217.12,222.67,"What matters first is audience analysis. It's credibility that you'll need to establish."],[222.97,226.7,"What audiences remember most is a powerful ending."],[227.0,231.99,"Speakers use cleft sentences to signal their most important points to listeners."],[232.98,236.02,"Now read and listen. The Power of Words."],[236.32,242.02,"More than two thousand years ago, Aristotle identified three ways to persuade an audience."],[243.32,249.41,"Ethos relies on the speaker's credibility, pathos on emotion, and logos on logic."],[250.72,255.92,"Great speeches combine all three, adapting them through careful audience analysis."],[257.22,261.2,"Speakers also use rhetorical techniques to make their messages memorable."],[262.52,267.55,"A rhetorical question invites the audience to think, while a tricolon creates rhythm."],[268.85,274.93,"Anaphora, the repetition of words at the start of sentences, builds emotional intensity."],[276.22,281.57,"Martin Luther King's famous speech used anaphora when he repeated 'I have a dream'."],[282.88,287.8,"It is not only what we say, but how we say it, that moves people to act."],[289.08,291.83,"Quiz time! Choose the correct answer."],[292.13,295.19,"Persuasion through logic and evidence is blank."],[295.49,299.37,"A, ethos. B, pathos. C, logos."],[303.38,305.71,"The answer is C: logos."],[307.22,309.08,"blank you need is confidence."],[309.38,312.32,"A, That. B, What. C, It."],[316.32,318.39,"The answer is B: What."],[319.88,323.15,"It was his final sentence blank everyone remembered."],[323.45,326.69,"A, that. B, what. C, which it."],[330.68,332.37,"The answer is A: that."],[333.88,337.26,"Repeating words at the start of successive sentences is blank."],[337.56,342.9,"A, tricolon. B, anaphora. C, audience analysis."],[346.92,349.25,"The answer is B: anaphora."],[350.75,354.21,"According to the text, which speech used anaphora?"],[354.51,361.18,"A, Martin Luther King's 'I have a dream'. B, Aristotle's lecture. C, a charity advert."],[365.18,369.07,"The answer is A: Martin Luther King's 'I have a dream'."],[370.58,377.31,"Now it's your turn. Part one: Prepare the opening of a short speech about the importance of learning English."],[382.61,389.19,"Part two: Use ethos, pathos and logos, and include a tricolon or rhetorical question."],[395.49,409.76,"As a student who once struggled with English, I know how it feels. Who doesn't want more opportunities? English opens doors to education, to employment, and to the world. What it gives us, above all, is a voice."],[410.06,412.44,"That is a well-argued answer!"],[413.45,418.49,"Great work today! You learned eight new words and cleft sentences (mastery)."],[418.79,422.85,"Today's value is self-confidence. Believe in yourself."],[423.15,426.07,"See you in Unit forty-five. Goodbye!"],[426.37,429.49,"Thank you, Ms. Sarah! Bye, everyone!"]],"OC-Advanced-Unit45-Poverty-and-Development":[[0.35,5.27,"Hello, everyone! I'm Ms. Sarah. Welcome to Online Advanced."],[5.57,8.57,"Hi! I'm Rithy. Let's learn together!"],[8.87,16.23,"Unit forty-five: Poverty and Development. In this unit, you will discuss how countries reduce poverty."],[17.22,18.31,"poverty line."],[19.01,23.59,"poverty line means the minimum income needed to meet basic needs."],[23.89,27.59,"Millions of people have risen above the poverty line."],[28.29,31.23,"Your turn. Say: poverty line."],[33.92,35.03,"poverty line."],[36.02,37.49,"extreme poverty."],[38.19,41.99,"extreme poverty means living on less than about two dollars a day."],[42.29,47.43,"Extreme poverty has fallen sharply since 1990."],[48.13,51.44,"Your turn. Say: extreme poverty."],[54.14,55.61,"extreme poverty."],[56.62,57.95,"microfinance."],[58.65,63.65,"microfinance means small loans for people without access to normal banks."],[63.95,67.21,"Microfinance helped her open a small shop."],[67.91,71.16,"Your turn. Say: microfinance."],[73.86,75.19,"microfinance."],[76.18,77.77,"social safety net."],[78.47,83.75,"social safety net means government support that protects people from falling into poverty."],[84.05,87.69,"A strong social safety net helps families during crises."],[88.39,91.59,"Your turn. Say: social safety net."],[94.28,95.85,"social safety net."],[96.85,98.71,"human development index."],[99.41,105.89,"human development index means a UN measure combining health, education and income."],[106.19,110.28,"Cambodia's human development index has risen steadily."],[110.98,115.22,"Your turn. Say: human development index."],[117.92,120.05,"human development index."],[121.05,122.89,"conditional cash transfer."],[123.59,131.0,"conditional cash transfer means money given to poor families if they meet conditions like school attendance."],[131.3,134.63,"Conditional cash transfers increased school enrolment."],[135.33,139.16,"Your turn. Say: conditional cash transfer."],[141.86,143.75,"conditional cash transfer."],[144.75,146.1,"rural development."],[146.8,151.07,"rural development means improving life and income in the countryside."],[151.37,154.25,"Roads and electricity drive rural development."],[154.94,158.24,"Your turn. Say: rural development."],[160.94,162.12,"rural development."],[163.12,164.47,"inclusive growth."],[165.17,170.12,"inclusive growth means economic growth that benefits all groups in society."],[170.41,173.3,"Inclusive growth reduces inequality."],[174.0,176.89,"Your turn. Say: inclusive growth."],[179.59,180.88,"inclusive growth."],[181.88,184.07,"Now let's listen to a conversation."],[184.37,188.69,"Rithy, Cambodia's poverty rate has fallen dramatically, hasn't it?"],[189.98,196.84,"Yes. Measured against the national poverty line, it has more than halved since the early 2000s."],[198.15,201.2,"Impressive. What do you think made the difference?"],[202.48,208.75,"Rapid growth, mainly. Combined with better roads, it transformed rural development."],[210.05,212.11,"But growth alone isn't enough, is it?"],[213.42,218.73,"No. Without a social safety net, families can fall back into poverty quickly."],[220.02,225.69,"What about microfinance? Once seen as a miracle, it's now more controversial."],[226.98,232.03,"Because of debt. If poorly regulated, small loans can become heavy burdens."],[233.32,237.66,"Grammar focus: Participle and verbless clauses (mastery)."],[237.96,241.53,"Reduced clauses make your English concise and sophisticated."],[241.83,248.15,"Measured against the poverty line, it has halved. If poorly regulated, loans can become burdens."],[248.45,252.5,"Once seen as a miracle, microfinance is now debated."],[252.8,257.96,"These reduced clauses are hallmarks of sophisticated academic and journalistic writing."],[258.95,262.47,"Now read and listen. Escaping Poverty."],[262.77,268.05,"Over the past three decades, extreme poverty worldwide has fallen dramatically."],[269.35,274.37,"Driven largely by economic growth in Asia, more than a billion people have escaped it."],[275.68,280.77,"Cambodia's human development index has also risen steadily over this period."],[282.08,288.4,"Investment in rural development, such as roads and electricity, connected farmers to markets."],[289.72,296.56,"Conditional cash transfers, first tested in Latin America, have encouraged families to keep children in school."],[297.85,304.41,"Microfinance, once celebrated as a solution, now faces criticism over rising household debt."],[305.72,311.37,"Economists increasingly argue that inclusive growth and strong social safety nets are essential."],[312.68,318.24,"Measured over a lifetime, education remains one of the most reliable routes out of poverty."],[319.55,322.23,"Quiz time! Choose the correct answer."],[322.53,325.98,"Small loans for people without access to banks are blank."],[326.28,331.13,"A, microfinance. B, poverty line. C, inclusive growth."],[335.12,338.24,"The answer is A: microfinance."],[339.75,343.54,"blank by many experts, the plan was finally approved."],[343.84,347.99,"A, Supported. B, Supporting. C, Support."],[351.98,354.22,"The answer is A: Supported."],[355.72,358.12,"blank in doubt, ask your teacher."],[358.42,361.44,"A, When. B, Being. C, Had."],[365.45,367.68,"The answer is A: When."],[369.18,372.8,"Growth that benefits all groups in society is blank."],[373.1,378.42,"A, inclusive growth. B, rural development. C, extreme poverty."],[382.42,385.32,"The answer is A: inclusive growth."],[386.82,391.24,"According to the text, what is one of the most reliable routes out of poverty?"],[391.54,395.85,"A, microfinance. B, education. C, debt."],[399.85,402.63,"The answer is B: education."],[404.12,409.18,"Now it's your turn. Part one: What is the most effective way to reduce poverty?"],[414.48,421.57,"Part two: Use a reduced clause: propose two strategies and evaluate one risk."],[427.87,441.72,"Given the evidence, I'd prioritise education and rural infrastructure. Combined, they raise productivity and connect people to markets. If poorly managed, however, loans for these projects could create long-term debt."],[442.02,444.38,"That is a well-argued answer!"],[445.38,450.93,"Great work today! You learned eight new words and participle and verbless clauses (mastery)."],[451.23,455.1,"Today's value is kindness. Be kind to everyone."],[455.4,459.9,"See you in Unit forty-six. Goodbye!"],[460.2,463.6,"Thank you, Ms. Sarah! Bye, everyone!"]],"OC-Advanced-Unit46-Privacy-and-Surveillance-States":[[0.35,5.12,"Hello, everyone! I'm Ms. Sarah. Welcome to Online Advanced."],[5.42,8.9,"Hi! I'm Rithy. Let's learn together!"],[9.2,17.45,"Unit forty-six: Privacy and Surveillance States. In this unit, you will debate surveillance, security and privacy."],[18.45,20.37,"mass surveillance."],[21.07,26.68,"mass surveillance means monitoring large populations rather than specific suspects."],[26.98,30.67,"Mass surveillance raises serious privacy concerns."],[31.37,34.84,"Your turn. Say: mass surveillance."],[37.54,38.99,"mass surveillance."],[39.98,41.76,"surveillance capitalism."],[42.46,48.03,"surveillance capitalism means an economy where companies profit from collecting personal data."],[48.33,51.74,"Surveillance capitalism turns our behaviour into profit."],[52.44,56.02,"Your turn. Say: surveillance capitalism."],[58.72,60.39,"surveillance capitalism."],[61.38,62.72,"state monitoring."],[63.42,67.99,"state monitoring means government observation of citizens' activities."],[68.29,71.56,"Some citizens accept state monitoring for security."],[72.26,75.51,"Your turn. Say: state monitoring."],[78.21,79.49,"state monitoring."],[80.48,81.91,"biometric data."],[82.61,87.69,"biometric data means physical information such as fingerprints or face scans."],[87.99,90.97,"Airports increasingly collect biometric data."],[91.66,94.73,"Your turn. Say: biometric data."],[97.44,98.78,"biometric data."],[99.78,101.14,"privacy rights."],[101.84,106.44,"privacy rights means legal protections for personal information and private life."],[106.75,109.85,"Privacy rights must keep pace with technology."],[110.55,113.72,"Your turn. Say: privacy rights."],[116.42,117.66,"privacy rights."],[118.65,119.8,"chilling effect."],[120.5,126.19,"chilling effect means when people avoid legal actions because they fear being watched."],[126.49,129.86,"Surveillance can create a chilling effect on free speech."],[130.56,133.51,"Your turn. Say: chilling effect."],[136.21,137.29,"chilling effect."],[138.28,139.6,"data retention."],[140.3,144.89,"data retention means keeping records of communications for a period of time."],[145.19,148.72,"Data retention laws require companies to store records."],[149.42,152.86,"Your turn. Say: data retention."],[155.56,156.77,"data retention."],[157.78,159.12,"social credit."],[159.82,164.43,"social credit means a system that scores citizens' or companies' behaviour."],[164.73,167.97,"Critics worry that social credit systems limit freedom."],[168.68,172.19,"Your turn. Say: social credit."],[174.89,176.18,"social credit."],[177.18,179.44,"Now let's listen to a conversation."],[179.74,184.52,"Ms. Sarah, cameras are being installed on every street corner in many cities."],[185.82,190.28,"Yes. They're said to reduce crime, but the evidence is mixed."],[191.58,195.05,"And facial scans are now required at some airports."],[196.35,200.93,"Biometric data is being collected on an unprecedented scale."],[202.22,203.44,"Is there a risk?"],[204.75,211.49,"Researchers warn of a chilling effect: people may stop expressing opinions if they feel watched."],[212.78,216.05,"Companies collect data too, not only governments."],[217.35,222.53,"That's surveillance capitalism. Privacy rights need to be strengthened against both."],[223.82,227.1,"Grammar focus: Advanced passives (mastery)."],[227.41,231.04,"Mastering passives helps you discuss policy objectively."],[231.34,235.46,"Cameras are being installed everywhere. They are said to reduce crime."],[235.76,238.01,"Privacy rights need to be strengthened."],[238.31,245.15,"Mastery of passives lets you discuss policy objectively, without naming responsible actors unless necessary."],[246.15,248.98,"Now read and listen. Watched All the Time?."],[249.28,253.75,"In many cities, citizens are now recorded hundreds of times a day."],[255.05,260.79,"Cameras, phones and online platforms all collect information about our movements and habits."],[262.08,266.57,"Supporters argue that state monitoring helps prevent crime and terrorism."],[267.88,272.61,"Critics warn that mass surveillance can be misused against ordinary citizens."],[273.92,278.74,"Biometric data, once collected, cannot be changed like a password."],[280.05,286.82,"Meanwhile, private companies profit from personal data in what has been called surveillance capitalism."],[288.12,293.48,"Studies suggest that people who feel watched are less likely to express controversial opinions."],[294.78,300.46,"Balancing security and privacy rights may be one of the defining challenges of this century."],[301.75,304.44,"Quiz time! Choose the correct answer."],[304.74,309.38,"When people avoid legal actions because they feel watched, it is a blank."],[309.68,315.47,"A, chilling effect. B, social credit. C, data retention."],[319.48,322.27,"The answer is A: chilling effect."],[323.78,325.77,"New cameras blank at the moment."],[326.07,331.3,"A, are installing. B, are being installed. C, have installing."],[335.32,337.75,"The answer is B: are being installed."],[339.25,341.16,"The system is said blank crime."],[341.46,345.64,"A, reducing. B, to reduce. C, reduced."],[349.65,351.98,"The answer is B: to reduce."],[353.48,356.37,"Physical information like fingerprints is blank."],[356.67,362.15,"A, biometric data. B, privacy rights. C, mass surveillance."],[366.15,369.19,"The answer is A: biometric data."],[370.68,374.38,"According to the text, why is biometric data special?"],[374.68,381.29,"A, it is cheap. B, it cannot be changed like a password. C, it is public."],[385.28,388.97,"The answer is B: it cannot be changed like a password."],[390.45,397.04,"Now it's your turn. Part one: Is it acceptable to give up some privacy for greater security?"],[402.34,409.1,"Part two: Use passive forms: state your position, two arguments and one safeguard."],[415.4,427.21,"Some privacy can be given up, but only with limits. Data should be collected for specific purposes, and it must be deleted after a set time. Independent oversight needs to be guaranteed by law."],[427.51,430.53,"That is a well-argued answer!"],[431.55,436.4,"Great work today! You learned eight new words and advanced passives (mastery)."],[436.7,441.98,"Today's value is online safety. Keep your password secret and be kind online."],[442.28,445.32,"See you in Unit forty-seven. Goodbye!"],[445.62,448.64,"Thank you, Ms. Sarah! Bye, everyone!"]],"OC-Advanced-Unit47-Psychology-of-Persuasion":[[0.35,5.26,"Hello, everyone! I'm Ms. Sarah. Welcome to Online Advanced."],[5.56,8.48,"Hi! I'm Rithy. Let's learn together!"],[8.78,17.23,"Unit forty-seven: Psychology of Persuasion. In this unit, you will analyse the psychological principles behind persuasion."],[18.22,19.52,"social proof."],[20.22,24.92,"social proof means doing something because many others do it."],[25.22,27.63,"'Best-seller' labels use social proof."],[28.33,31.91,"Your turn. Say: social proof."],[34.61,35.79,"social proof."],[36.78,38.03,"reciprocity."],[38.73,41.9,"reciprocity means the urge to return favours."],[42.2,45.14,"Free samples work through reciprocity."],[45.84,48.91,"Your turn. Say: reciprocity."],[51.61,52.74,"reciprocity."],[53.75,54.91,"commitment bias."],[55.61,59.81,"commitment bias means the tendency to stick with a choice once we've made it."],[60.11,62.91,"Commitment bias keeps people in bad projects."],[63.61,66.46,"Your turn. Say: commitment bias."],[69.16,70.46,"commitment bias."],[71.45,72.83,"authority bias."],[73.53,78.85,"authority bias means trusting someone too much because they seem to be an expert."],[79.15,82.01,"Adverts with doctors use authority bias."],[82.71,85.38,"Your turn. Say: authority bias."],[88.08,89.3,"authority bias."],[90.28,91.83,"scarcity principle."],[92.53,97.13,"scarcity principle means valuing things more when they seem rare."],[97.43,100.92,"'Only three left!' uses the scarcity principle."],[101.62,104.91,"Your turn. Say: scarcity principle."],[107.61,109.11,"scarcity principle."],[110.12,111.5,"liking principle."],[112.2,116.94,"liking principle means being persuaded more easily by people we like."],[117.24,120.01,"Friendly salespeople use the liking principle."],[120.71,124.17,"Your turn. Say: liking principle."],[126.87,128.22,"liking principle."],[129.22,130.49,"foot-in-the-door."],[131.19,135.98,"foot-in-the-door means getting a small yes first, then asking for more."],[136.28,138.69,"The survey used a foot-in-the-door technique."],[139.39,142.87,"Your turn. Say: foot-in-the-door."],[145.56,146.68,"foot-in-the-door."],[147.68,148.99,"door-in-the-face."],[149.69,155.06,"door-in-the-face means asking for something big first, then a smaller request."],[155.36,158.62,"He used door-in-the-face to get a discount."],[159.32,163.18,"Your turn. Say: door-in-the-face."],[165.88,167.56,"door-in-the-face."],[168.55,170.71,"Now let's listen to a conversation."],[171.01,174.8,"Rithy, why do you think you bought that course after the free webinar?"],[176.08,179.98,"It must have been reciprocity. They gave me something for free first."],[181.28,183.68,"And the countdown timer on the page?"],[184.98,188.38,"That might have triggered the scarcity principle. I panicked!"],[189.68,191.66,"Did they show testimonials?"],[192.95,195.72,"Lots. That would have been social proof."],[197.02,202.12,"These techniques can't be called dishonest in themselves, but they can be misused."],[203.42,207.68,"Next time, I should wait twenty-four hours before buying anything."],[208.98,212.22,"Grammar focus: Modals of deduction (mastery)."],[212.53,215.19,"Use modals to analyse why something happened."],[215.49,219.61,"It must have been reciprocity. The timer might have triggered scarcity."],[219.91,221.87,"That would have been social proof."],[222.17,228.24,"'Would have been' can express a confident logical assumption about the past, not only a conditional."],[229.25,232.87,"Now read and listen. The Hidden Forces of Influence."],[233.17,239.73,"Psychologist Robert Cialdini identified several principles that make people say yes."],[241.02,245.6,"Reciprocity explains why free samples often lead to purchases."],[246.92,251.71,"Social proof makes us follow the crowd, especially when we feel uncertain."],[253.02,257.33,"Authority bias leads us to trust people in uniforms or white coats."],[258.62,262.44,"The scarcity principle makes limited offers seem more valuable."],[263.75,270.02,"Commitment bias means that once we agree to something small, we are more likely to agree to more."],[271.32,276.07,"Marketers, politicians and even charities use these principles every day."],[277.38,281.07,"Understanding them may be the best defence against manipulation."],[282.35,285.24,"Quiz time! Choose the correct answer."],[285.53,287.92,"The urge to return favours is blank."],[288.22,293.62,"A, reciprocity. B, authority bias. C, scarcity."],[297.62,300.34,"The answer is A: reciprocity."],[301.85,304.4,"He's late. He blank missed the bus."],[304.7,308.52,"A, must have. B, can't have. C, shouldn't."],[312.52,315.43,"The answer is A: must have."],[316.95,321.99,"She blank seen the advert; it was only on TV, and she has no TV."],[322.29,326.42,"A, must have. B, can't have. C, would have."],[330.42,333.43,"The answer is B: can't have."],[334.92,337.45,"'Only three left!' uses the blank."],[337.75,344.24,"A, scarcity principle. B, liking principle. C, foot-in-the-door."],[348.25,351.75,"The answer is A: scarcity principle."],[353.25,357.54,"According to the text, what may be the best defence against manipulation?"],[357.84,363.95,"A, avoiding shops. B, understanding these principles. C, trusting experts."],[367.95,371.42,"The answer is B: understanding these principles."],[372.92,379.46,"Now it's your turn. Part one: Describe a time you were persuaded to buy or do something."],[384.76,390.26,"Part two: Analyse it with modals of deduction and name two principles involved."],[396.56,409.96,"Last month, I bought expensive headphones. It must have been social proof: thousands of five-star reviews. The 'sale ends tonight' banner might also have triggered the scarcity principle."],[410.26,412.88,"That is a well-argued answer!"],[413.88,419.5,"Great work today! You learned eight new words and modals of deduction (mastery)."],[419.8,423.6,"Today's value is good habits. Do good things every day."],[423.9,426.6,"See you in Unit forty-eight. Goodbye!"],[426.9,429.48,"Thank you, Ms. Sarah! Bye, everyone!"]],"OC-Advanced-Unit48-Inequality":[[0.35,5.21,"Hello, everyone! I'm Ms. Sarah. Welcome to Online Advanced."],[5.51,8.68,"Hi! I'm Rithy. Let's learn together!"],[8.98,17.78,"Unit forty-eight: Inequality. In this unit, you will discuss causes and solutions to economic inequality."],[18.78,19.87,"wealth gap."],[20.57,24.91,"wealth gap means the difference in wealth between rich and poor."],[25.21,28.0,"The wealth gap has widened in many countries."],[28.7,31.84,"Your turn. Say: wealth gap."],[34.54,35.53,"wealth gap."],[36.52,38.05,"income inequality."],[38.75,42.88,"income inequality means unequal distribution of earnings."],[43.18,47.96,"Income inequality affects health and education."],[48.66,52.15,"Your turn. Say: income inequality."],[54.85,56.34,"income inequality."],[57.35,58.68,"social mobility."],[59.38,64.33,"social mobility means the ability to move to a different social or economic position."],[64.62,67.31,"Education increases social mobility."],[68.01,71.64,"Your turn. Say: social mobility."],[74.34,75.81,"social mobility."],[76.82,78.29,"Gini coefficient."],[78.99,83.55,"Gini coefficient means a number from 0 to 1 that measures inequality."],[83.85,87.08,"A higher Gini coefficient means more inequality."],[87.78,91.02,"Your turn. Say: Gini coefficient."],[93.72,95.05,"Gini coefficient."],[96.05,97.82,"structural inequality."],[98.52,103.33,"structural inequality means unfairness built into a society's systems."],[103.63,107.48,"Structural inequality limits opportunities for rural children."],[108.18,112.38,"Your turn. Say: structural inequality."],[115.08,116.75,"structural inequality."],[117.75,118.75,"privilege."],[119.45,122.96,"privilege means advantages that some people have and others don't."],[123.26,126.78,"Recognising privilege is the first step to fairness."],[127.48,130.28,"Your turn. Say: privilege."],[132.98,133.82,"privilege."],[134.82,136.12,"redistribution."],[136.82,142.37,"redistribution means sharing wealth more evenly through taxes and benefits."],[142.67,145.91,"Redistribution funds schools and hospitals."],[146.61,150.09,"Your turn. Say: redistribution."],[152.79,154.06,"redistribution."],[155.05,156.64,"progressive taxation."],[157.34,162.26,"progressive taxation means a system where richer people pay a higher tax rate."],[162.56,165.64,"Progressive taxation is common in Europe."],[166.34,170.29,"Your turn. Say: progressive taxation."],[172.99,174.48,"progressive taxation."],[175.48,177.7,"Now let's listen to a conversation."],[178.0,182.62,"Ms. Sarah, is inequality really a problem if everyone is getting richer?"],[183.92,189.27,"Many economists insist that it be taken seriously, even in growing economies."],[190.58,191.33,"Why?"],[192.62,198.78,"High inequality reduces social mobility. Children of poor families find it harder to move up."],[200.08,201.66,"So what should governments do?"],[202.95,208.26,"Some propose that taxation be made more progressive, and that the money fund education."],[209.55,211.55,"Wouldn't that discourage investment?"],[212.85,217.99,"That's the counter-argument. It is vital that policies balance fairness and growth."],[219.28,223.66,"Grammar focus: Subjunctive and formal structures (mastery)."],[223.96,227.94,"The passive subjunctive is common in formal proposals."],[228.24,235.03,"Economists insist that inequality be taken seriously. They propose that taxation be made more progressive."],[235.33,238.42,"It is vital that policies balance fairness and growth."],[238.72,245.63,"The passive subjunctive (that it be done) is typical of formal proposals and policy documents."],[246.65,249.65,"Now read and listen. The Shape of Inequality."],[249.95,256.75,"Over recent decades, global poverty has fallen, yet inequality within many countries has risen."],[258.05,263.86,"Economists measure income inequality using tools such as the Gini coefficient."],[265.15,271.03,"High inequality is associated with lower social mobility, poorer health and weaker trust."],[272.32,279.2,"Structural inequality, such as unequal access to quality schools, can persist across generations."],[280.52,286.31,"Some economists propose that taxation be made more progressive to fund public services."],[287.62,293.26,"Others warn that excessive redistribution may discourage investment and innovation."],[294.55,299.5,"Most agree, however, that equal opportunity in education is essential."],[300.78,304.56,"It is imperative that growth benefit the many, not only the few."],[305.85,308.44,"Quiz time! Choose the correct answer."],[308.74,312.49,"The ability to move to a different social position is blank."],[312.79,319.33,"A, social mobility. B, privilege. C, Gini coefficient."],[323.32,326.18,"The ans
