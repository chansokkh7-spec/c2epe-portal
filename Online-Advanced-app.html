 of interest in politics."],[137.87,141.46,"Political apathy is common when people feel unheard."],[142.16,145.75,"Your turn. Say: political apathy."],[148.45,149.86,"political apathy."],[150.85,152.49,"representation gap."],[153.19,158.53,"representation gap means the difference between a population and those who represent it."],[158.83,162.71,"There is a representation gap for young people in decision-making."],[163.41,167.61,"Your turn. Say: representation gap."],[170.31,171.97,"representation gap."],[172.98,175.12,"Now let's listen to a conversation."],[175.42,180.17,"Ms. Sarah, why are young people around the world often uninterested in politics?"],[181.48,186.12,"Political apathy usually grows when people feel their voices don't matter."],[187.42,191.62,"Is that why voter turnout is low among students in many countries?"],[192.92,197.66,"Often, yes. Were young people better represented, they might participate more."],[198.95,201.7,"There is definitely a representation gap."],[203.02,208.64,"Civic engagement isn't only voting, though. Grassroots campaigns can achieve a great deal."],[209.95,213.39,"Like the students who organised a clean-up of the riverside?"],[214.68,219.12,"Exactly. Had they waited for someone else, nothing would have changed."],[220.42,223.75,"Grammar focus: Inverted conditionals in argument."],[224.05,227.24,"Inverted conditionals sound formal and persuasive."],[227.53,234.02,"Were young people better represented, they would participate more. Had they waited, nothing would have changed."],[234.32,237.71,"Should turnout fall further, reforms will be needed."],[238.01,243.82,"Inverted conditionals make arguments sound formal and persuasive in essays and debates."],[244.82,247.57,"Now read and listen. More Than a Vote."],[247.87,253.85,"Democracy depends not only on elections but also on active citizens."],[255.15,261.2,"Around the world, voter turnout among young people tends to be lower than among older generations."],[262.52,268.2,"Researchers link this to political apathy and a sense that institutions are distant."],[269.48,274.15,"However, young people are often highly active in other forms of civic engagement."],[275.45,282.22,"They organise grassroots campaigns, volunteer for civil society groups and debate issues online."],[283.52,289.08,"Online debate, though, can also increase polarisation when people only hear similar views."],[290.38,297.43,"Deliberation, in which citizens listen carefully to opposing arguments, is essential for healthy societies."],[298.72,303.71,"Were more spaces created for respectful discussion, participation might grow."],[305.02,307.86,"Quiz time! Choose the correct answer."],[308.15,310.8,"Lack of interest in politics is blank."],[311.1,317.28,"A, civic engagement. B, political apathy. C, deliberation."],[321.28,324.0,"The answer is B: political apathy."],[325.52,327.81,"blank I known, I would have helped."],[328.11,331.07,"A, If. B, Had. C, Were."],[335.08,337.15,"The answer is B: Had."],[338.65,341.04,"blank you need assistance, please call us."],[341.34,344.46,"A, Should. B, Had. C, Were."],[348.45,351.22,"The answer is A: Should."],[352.72,355.89,"The division of society into opposing groups is blank."],[356.19,362.25,"A, polarisation. B, voter turnout. C, civil society."],[366.25,368.95,"The answer is A: polarisation."],[370.45,374.11,"According to the text, what can increase polarisation?"],[374.41,380.57,"A, volunteering. B, online debate with similar views. C, deliberation."],[384.58,388.12,"The answer is B: online debate with similar views."],[389.62,395.44,"Now it's your turn. Part one: How can young people participate more in their communities?"],[400.74,405.87,"Part two: Use an inverted conditional, give two methods and one example."],[412.17,428.98,"Were schools to teach civic skills, students would feel more confident to participate. Volunteering and student councils are two effective methods. My university's environmental club, for example, persuaded the city to install recycling bins."],[429.28,431.91,"That is a well-argued answer!"],[432.92,438.32,"Great work today! You learned eight new words and inverted conditionals in argument."],[438.62,442.21,"Today's value is community. Help the people in your town."],[442.51,445.8,"See you in Unit twenty-four. Goodbye!"],[446.1,448.68,"Thank you, Ms. Sarah! Bye, everyone!"]],"OC-Advanced-Unit24-The-Future-of-Cities-in-Asia":[[0.35,5.55,"Hello, everyone! I'm Ms. Sarah. Welcome to Online Advanced."],[5.85,9.06,"Hi! I'm Rithy. Let's learn together!"],[9.36,17.18,"Unit twenty-four: The Future of Cities in Asia. In this unit, you will discuss rapid urban growth in Asia."],[18.18,19.84,"rapid urbanisation."],[20.54,25.75,"rapid urbanisation means the fast growth of cities as people move from rural areas."],[26.05,30.02,"Rapid urbanisation is transforming Southeast Asia."],[30.72,34.23,"Your turn. Say: rapid urbanisation."],[36.94,38.62,"rapid urbanisation."],[39.62,41.09,"informal settlement."],[41.79,46.58,"informal settlement means an area of homes built without official permission."],[46.88,50.45,"Many workers live in informal settlements near factories."],[51.15,54.25,"Your turn. Say: informal settlement."],[56.95,58.34,"informal settlement."],[59.35,60.85,"satellite city."],[61.55,65.3,"satellite city means a new town built near a larger city."],[65.6,69.04,"Several satellite cities are planned around Phnom Penh."],[69.74,73.09,"Your turn. Say: satellite city."],[75.79,77.01,"satellite city."],[78.02,79.88,"special economic zone."],[80.58,86.62,"special economic zone means an area with special business and tax rules to attract investment."],[86.92,90.83,"The special economic zone in Sihanoukville attracted foreign factories."],[91.53,95.34,"Your turn. Say: special economic zone."],[98.05,99.99,"special economic zone."],[100.98,102.25,"flood management."],[102.95,106.28,"flood management means measures to reduce damage from floods."],[106.58,110.63,"Better flood management is vital for low-lying cities."],[111.33,114.66,"Your turn. Say: flood management."],[117.35,118.54,"flood management."],[119.55,121.02,"smart transport."],[121.72,126.87,"smart transport means transport systems that use data and technology."],[127.17,129.97,"Smart transport can reduce traffic jams."],[130.67,134.22,"Your turn. Say: smart transport."],[136.92,138.41,"smart transport."],[139.42,140.81,"urban migration."],[141.51,145.51,"urban migration means people moving from the countryside to cities."],[145.81,148.84,"Urban migration has doubled the capital's population."],[149.54,153.06,"Your turn. Say: urban migration."],[155.76,157.07,"urban migration."],[158.08,159.56,"land speculation."],[160.26,164.91,"land speculation means buying land to sell later at a higher price."],[165.21,168.11,"Land speculation has pushed up housing costs."],[168.81,172.36,"Your turn. Say: land speculation."],[175.06,176.5,"land speculation."],[177.52,179.69,"Now let's listen to a conversation."],[179.99,183.14,"Rithy, what struck you most when you moved to Phnom Penh?"],[184.45,187.72,"What struck me most was how fast everything was changing."],[189.02,193.32,"Rapid urbanisation, yes. It's the same across much of Asia."],[194.62,199.47,"It's land speculation that worries me. Ordinary families can't afford homes."],[200.78,204.63,"And many end up in informal settlements without proper services."],[205.92,207.85,"Are satellite cities the answer?"],[209.15,215.44,"Only if they're well connected. What these cities need is smart transport and serious flood management."],[216.75,220.26,"All we need, really, is planning that puts people first."],[221.55,225.34,"Grammar focus: Cleft sentences in discussion."],[225.64,229.19,"Cleft sentences help you highlight your main point in a discussion."],[229.49,235.02,"What struck me most was the speed of change. It's land speculation that worries me."],[235.32,237.29,"All we need is better planning."],[237.59,242.6,"In discussions, cleft sentences help you highlight your main concern clearly."],[243.58,247.0,"Now read and listen. Asia's Urban Century."],[247.3,253.91,"By 2050, Asia's cities are expected to house an additional one billion people."],[255.22,260.68,"Urban migration brings workers to factories, offices and special economic zones."],[261.98,266.42,"What often follows, however, is a severe shortage of affordable housing."],[267.72,273.91,"Land speculation drives up prices, pushing low-income families into informal settlements."],[275.22,283.21,"Many Asian cities are also low-lying, making flood management an urgent priority."],[284.52,289.18,"Governments are planning satellite cities to reduce pressure on overcrowded centres."],[290.48,296.2,"It is good transport connections, though, that determine whether these new towns succeed."],[297.48,302.12,"The future of Asia's cities will shape the lives of billions of people."],[303.42,306.15,"Quiz time! Choose the correct answer."],[306.45,310.44,"An area of homes built without official permission is an blank."],[310.74,316.85,"A, informal settlement. B, satellite city. C, special economic zone."],[320.85,323.6,"The answer is A: informal settlement."],[325.12,327.53,"blank surprised me was the traffic."],[327.83,330.91,"A, It. B, What. C, That."],[334.92,336.63,"The answer is B: What."],[338.12,340.53,"It was the noise blank annoyed me most."],[340.83,344.32,"A, what. B, that. C, which it."],[348.32,350.72,"The answer is B: that."],[352.22,355.78,"Buying land to sell later at a higher price is blank."],[356.08,362.02,"A, land speculation. B, urban migration. C, flood management."],[366.02,368.82,"The answer is A: land speculation."],[370.32,374.78,"According to the text, what determines whether satellite cities succeed?"],[375.08,380.72,"A, good transport connections. B, shopping malls. C, tall buildings."],[384.72,388.27,"The answer is A: good transport connections."],[389.78,395.13,"Now it's your turn. Part one: What is the biggest challenge facing Asian cities?"],[400.43,405.45,"Part two: Use a cleft sentence, explain two causes, and propose one solution."],[411.75,424.03,"What concerns me most is housing affordability. It's caused by land speculation and rapid migration. All we really need is a large public housing programme connected to good transport."],[424.33,426.64,"That is a well-argued answer!"],[427.65,432.51,"Great work today! You learned eight new words and cleft sentences in discussion."],[432.81,436.69,"Today's value is community. Help the people in your town."],[436.99,441.37,"See you in Unit twenty-five. Goodbye!"],[441.67,444.69,"Thank you, Ms. Sarah! Bye, everyone!"]],"OC-Advanced-Unit25-Space-Exploration":[[0.35,5.05,"Hello, everyone! I'm Ms. Sarah. Welcome to Online Advanced."],[5.35,8.63,"Hi! I'm Rithy. Let's learn together!"],[8.93,16.96,"Unit twenty-five: Space Exploration. In this unit, you will debate the value and future of space exploration."],[17.95,19.14,"space race."],[19.84,24.4,"space race means competition between nations to achieve success in space."],[24.7,30.1,"The space race led to the first Moon landing in 1969."],[30.8,33.88,"Your turn. Say: space race."],[36.59,37.68,"space race."],[38.68,40.28,"commercial spaceflight."],[40.98,45.74,"commercial spaceflight means space travel run by private companies."],[46.04,49.09,"Commercial spaceflight has cut the cost of launches."],[49.8,53.56,"Your turn. Say: commercial spaceflight."],[56.26,57.68,"commercial spaceflight."],[58.68,59.8,"lunar base."],[60.5,63.74,"lunar base means a permanent station on the Moon."],[64.04,66.81,"Several countries plan to build a lunar base."],[67.51,70.61,"Your turn. Say: lunar base."],[73.31,74.36,"lunar base."],[75.35,76.92,"Mars colonisation."],[77.62,82.45,"Mars colonisation means establishing permanent human settlements on Mars."],[82.75,86.34,"Mars colonisation remains a distant and risky goal."],[87.04,91.13,"Your turn. Say: Mars colonisation."],[93.83,95.47,"Mars colonisation."],[96.48,97.62,"space debris."],[98.32,103.82,"space debris means pieces of old satellites and rockets orbiting the Earth."],[104.12,106.92,"Space debris threatens working satellites."],[107.62,110.92,"Your turn. Say: space debris."],[113.62,114.84,"space debris."],[115.85,116.89,"exoplanet."],[117.59,121.71,"exoplanet means a planet that orbits a star other than our Sun."],[122.01,125.18,"Astronomers have discovered thousands of exoplanets."],[125.88,128.45,"Your turn. Say: exoplanet."],[131.15,132.17,"exoplanet."],[133.15,134.47,"astrobiology."],[135.16,138.88,"astrobiology means the study of possible life beyond Earth."],[139.18,143.04,"Astrobiology searches for signs of life on distant moons."],[143.74,147.15,"Your turn. Say: astrobiology."],[149.85,151.24,"astrobiology."],[152.25,153.68,"reusable rocket."],[154.38,158.39,"reusable rocket means a rocket that can land and fly again."],[158.69,161.99,"Reusable rockets have made launches much cheaper."],[162.69,166.08,"Your turn. Say: reusable rocket."],[168.78,170.07,"reusable rocket."],[171.08,173.33,"Now let's listen to a conversation."],[173.63,176.9,"Rithy, is space exploration worth the cost?"],[178.22,181.76,"Given the problems on Earth, I'm not always sure."],[183.05,188.85,"A fair point. Once considered science fiction, commercial spaceflight is now routine."],[190.15,192.74,"Thanks to reusable rockets, I suppose?"],[194.05,200.5,"Exactly. Seen from a scientific perspective, the discovery of exoplanets is extraordinary."],[201.78,205.68,"And astrobiology might one day prove we're not alone."],[206.98,213.14,"But space debris is becoming a serious problem. If unchecked, it could make some orbits unusable."],[214.45,219.34,"So exploration should be balanced with responsibility, just like on Earth."],[220.65,225.34,"Grammar focus: Participle and verbless clauses (extended)."],[225.64,229.51,"Participle and verbless clauses make formal arguments concise."],[229.81,236.02,"Given the problems on Earth, I'm unsure. Once considered fiction, spaceflight is now routine."],[236.32,238.88,"If unchecked, space debris could spread."],[239.19,243.59,"These structures add sophistication and conciseness to formal arguments."],[244.58,247.63,"Now read and listen. Why Go to Space?."],[247.93,256.66,"Launched in 1957, the first artificial satellite began a new era of exploration."],[257.95,262.46,"The space race between superpowers soon led to astronauts walking on the Moon."],[263.75,268.83,"Today, commercial spaceflight companies compete to reduce costs with reusable rockets."],[270.12,275.38,"Several nations are planning a lunar base as a step towards Mars colonisation."],[276.68,282.46,"Meanwhile, telescopes have detected thousands of exoplanets, some possibly habitable."],[283.75,287.53,"Critics argue that the money would be better spent solving problems on Earth."],[288.82,296.13,"Supporters reply that space research has produced technologies we use every day, from GPS to weather forecasting."],[297.45,302.38,"If managed responsibly, space exploration could benefit all of humanity."],[303.68,306.29,"Quiz time! Choose the correct answer."],[306.59,310.53,"A planet orbiting a star other than our Sun is an blank."],[310.83,315.77,"A, exoplanet. B, lunar base. C, space debris."],[319.78,322.42,"The answer is A: exoplanet."],[323.92,326.38,"blank the cost, the project was cancelled."],[326.68,330.71,"A, Given. B, Gave. C, Giving to."],[334.72,337.11,"The answer is A: Given."],[338.62,344.19,"blank in 1957, the satellite changed history."],[344.49,348.26,"A, Launching. B, Launched. C, Launch."],[352.25,354.54,"The answer is B: Launched."],[356.05,358.95,"The study of possible life beyond Earth is blank."],[359.25,365.49,"A, astrobiology. B, space race. C, Mars colonisation."],[369.48,372.31,"The answer is A: astrobiology."],[373.82,380.11,"According to the text, which everyday technologies came from space research?"],[380.41,387.83,"A, GPS and weather forecasting. B, smartphones only. C, electric cars."],[391.82,395.93,"The answer is A: GPS and weather forecasting."],[397.42,402.73,"Now it's your turn. Part one: Should governments spend money on space exploration?"],[408.03,415.37,"Part two: Use a participle clause: give your view, two reasons and one counter-argument."],[421.67,433.73,"Considering its benefits, I think they should, within limits. Space research improves communication and climate monitoring. Given the urgent problems on Earth, however, budgets should be balanced carefully."],[434.03,436.4,"That is a well-argued answer!"],[437.38,443.72,"Great work today! You learned eight new words and participle and verbless clauses (extended)."],[444.02,448.04,"Today's value is wonder. Look up and wonder at the world."],[448.34,451.87,"See you in Unit twenty-six. Goodbye!"],[452.17,454.86,"Thank you, Ms. Sarah! Bye, everyone!"]],"OC-Advanced-Unit26-Language-Endangerment":[[0.35,5.51,"Hello, everyone! I'm Ms. Sarah. Welcome to Online Advanced."],[5.81,8.85,"Hi! I'm Rithy. Let's learn together!"],[9.15,17.36,"Unit twenty-six: Language Endangerment. In this unit, you will discuss why languages disappear and how to protect them."],[18.35,19.87,"endangered language."],[20.57,24.81,"endangered language means a language at risk of disappearing."],[25.11,28.12,"Nearly half of the world's languages are endangered."],[28.82,32.28,"Your turn. Say: endangered language."],[34.98,36.57,"endangered language."],[37.58,39.47,"language revitalisation."],[40.17,45.3,"language revitalisation means efforts to bring a language back into everyday use."],[45.6,48.9,"Hawaiian is a model of language revitalisation."],[49.6,53.51,"Your turn. Say: language revitalisation."],[56.21,58.02,"language revitalisation."],[59.02,60.67,"linguistic diversity."],[61.37,66.36,"linguistic diversity means the variety of languages in a region or the world."],[66.66,70.09,"Papua New Guinea has extraordinary linguistic diversity."],[70.79,74.13,"Your turn. Say: linguistic diversity."],[76.83,78.46,"linguistic diversity."],[79.45,80.75,"last speaker."],[81.45,85.06,"last speaker means the final fluent speaker of a language."],[85.36,88.76,"When the last speaker dies, the language is lost."],[89.46,92.82,"Your turn. Say: last speaker."],[95.52,96.64,"last speaker."],[97.65,98.88,"oral tradition."],[99.58,103.91,"oral tradition means stories and knowledge passed down by speaking."],[104.2,108.49,"Many indigenous histories survive only through oral tradition."],[109.19,112.24,"Your turn. Say: oral tradition."],[114.94,116.08,"oral tradition."],[117.08,118.58,"language policy."],[119.28,124.89,"language policy means government decisions about which languages are used and taught."],[125.19,129.56,"Language policy shapes education in multilingual countries."],[130.26,133.48,"Your turn. Say: language policy."],[136.18,137.57,"language policy."],[138.58,140.04,"minority language."],[140.74,145.29,"minority language means a language spoken by a small group in a country."],[145.59,148.39,"Bunong is a minority language in Mondulkiri."],[149.09,152.39,"Your turn. Say: minority language."],[155.09,156.44,"minority language."],[157.45,159.1,"mother-tongue education."],[159.8,164.05,"mother-tongue education means teaching children in their first language."],[164.35,168.05,"Mother-tongue education improves early literacy."],[168.75,172.81,"Your turn. Say: mother-tongue education."],[175.5,177.23,"mother-tongue education."],[178.22,180.4,"Now let's listen to a conversation."],[180.7,186.51,"Ms. Sarah, I heard that some indigenous languages in northeastern Cambodia are endangered."],[187.82,194.03,"That's right. Many are being replaced by national languages as young people move to cities."],[195.32,196.89,"Is anything being done?"],[198.18,202.62,"Yes. Bilingual programmes have been introduced in several provinces."],[203.92,206.61,"So children are being taught in their mother tongue first?"],[207.92,213.52,"Exactly. Mother-tongue education is known to improve learning outcomes."],[214.82,219.2,"And when the last speaker dies, a whole oral tradition is lost."],[220.48,226.75,"Which is why linguistic diversity needs to be protected, just like biodiversity."],[228.05,231.59,"Grammar focus: Advanced passives (extended)."],[231.89,235.68,"Varied passive forms keep academic writing objective."],[235.98,239.97,"Languages are being replaced. Programmes have been introduced."],[240.27,243.34,"Mother-tongue education is known to improve learning."],[243.64,249.98,"Varied passives keep academic writing objective and focused on the issue rather than the actors."],[250.98,254.83,"Now read and listen. Every Language Is a Library."],[255.13,258.88,"Around seven thousand languages are spoken in the world today."],[260.18,265.02,"Linguists estimate that almost half of them could disappear by the end of this century."],[266.32,270.37,"Many endangered languages are spoken only by elderly people."],[271.68,279.35,"When the last speaker dies, centuries of oral tradition, medicine and ecological knowledge can be lost."],[280.65,285.94,"In Cambodia, several indigenous languages are spoken in the northeastern provinces."],[287.25,292.95,"Bilingual mother-tongue education programmes have been introduced to support these communities."],[294.25,301.03,"Language revitalisation has also been successful in places such as Hawaii and New Zealand."],[302.32,307.31,"Protecting linguistic diversity is increasingly seen as protecting human heritage itself."],[308.62,311.26,"Quiz time! Choose the correct answer."],[311.56,314.69,"Efforts to bring a language back into use are blank."],[315.0,321.23,"A, language revitalisation. B, oral tradition. C, language policy."],[325.22,328.42,"The answer is A: language revitalisation."],[329.92,332.02,"The old school blank at the moment."],[332.32,337.94,"A, is renovated. B, is being renovated. C, renovating."],[341.95,345.12,"The answer is B: is being renovated."],[346.62,348.89,"Reading blank to improve vocabulary."],[349.19,352.94,"A, is known. B, knows. C, has known."],[356.95,358.86,"The answer is A: is known."],[360.35,363.14,"Teaching children in their first language is blank."],[363.44,369.24,"A, mother-tongue education. B, minority language. C, linguistic diversity."],[373.25,376.71,"The answer is A: mother-tongue education."],[378.22,383.17,"According to the text, how many languages could disappear by the end of the century?"],[383.46,388.43,"A, about ten percent. B, almost half. C, all of them."],[392.42,394.88,"The answer is B: almost half."],[396.38,401.57,"Now it's your turn. Part one: Why should we protect minority languages?"],[406.87,412.56,"Part two: Give two reasons using passive forms, and suggest one practical step."],[418.86,430.92,"Minority languages should be protected because they carry unique knowledge, and identity is closely linked to language. One step would be that more teachers are trained to teach in children's first language."],[431.21,434.01,"That is a well-argued answer!"],[435.02,440.17,"Great work today! You learned eight new words and advanced passives (extended)."],[440.46,444.78,"Today's value is respect for culture. Be proud of our Khmer culture."],[445.08,448.39,"See you in Unit twenty-seven. Goodbye!"],[448.69,451.16,"Thank you, Ms. Sarah! Bye, everyone!"]],"OC-Advanced-Unit27-Ethical-Consumption":[[0.35,5.75,"Hello, everyone! I'm Ms. Sarah. Welcome to Online Advanced."],[6.04,8.97,"Hi! I'm Rithy. Let's learn together!"],[9.27,17.09,"Unit twenty-seven: Ethical Consumption. In this unit, you will discuss responsible shopping and corporate honesty."],[18.08,19.41,"conscious consumer."],[20.11,28.2,"conscious consumer means a shopper who considers the social and environmental impact of purchases."],[28.5,31.47,"Conscious consumers check where products are made."],[32.17,35.64,"Your turn. Say: conscious consumer."],[38.34,39.67,"conscious consumer."],[40.68,41.84,"greenwashing."],[42.53,47.24,"greenwashing means making false or exaggerated environmental claims."],[47.54,50.8,"Calling plastic bottles 'eco' is greenwashing."],[51.51,53.96,"Your turn. Say: greenwashing."],[56.66,57.78,"greenwashing."],[58.78,60.21,"ethical sourcing."],[60.91,66.57,"ethical sourcing means buying materials in ways that respect workers and the environment."],[66.87,69.53,"The brand promotes ethical sourcing of cotton."],[70.23,73.41,"Your turn. Say: ethical sourcing."],[76.11,77.35,"ethical sourcing."],[78.35,80.36,"supply chain transparency."],[81.06,85.88,"supply chain transparency means openness about where and how products are made."],[86.18,90.1,"Supply chain transparency reveals hidden labour abuses."],[90.8,94.97,"Your turn. Say: supply chain transparency."],[97.67,99.79,"supply chain transparency."],[100.78,101.76,"boycott."],[102.46,105.76,"boycott means refusing to buy something as a protest."],[106.06,108.64,"Students organised a boycott of the brand."],[109.34,112.54,"Your turn. Say: boycott."],[115.24,116.12,"boycott."],[117.12,118.14,"fair wage."],[118.84,122.34,"fair wage means pay that is enough to live on decently."],[122.64,125.35,"Garment workers are demanding a fair wage."],[126.05,129.21,"Your turn. Say: fair wage."],[131.91,133.05,"fair wage."],[134.05,135.48,"product lifecycle."],[136.18,140.77,"product lifecycle means all the stages of a product from production to disposal."],[141.07,144.33,"A product lifecycle analysis measures total emissions."],[145.03,148.46,"Your turn. Say: product lifecycle."],[151.16,152.53,"product lifecycle."],[153.52,154.65,"upcycling."],[155.34,160.12,"upcycling means turning old items into new, more valuable products."],[160.42,163.41,"Upcycling turns old saris into bags."],[164.11,166.69,"Your turn. Say: upcycling."],[169.39,170.45,"upcycling."],[171.45,173.76,"Now let's listen to a conversation."],[174.06,179.68,"Rithy, this shirt claims to be '100% eco'. What do you think?"],[180.98,184.52,"It might be greenwashing. There's no certification label."],[185.82,189.33,"It can't be fully eco if it was shipped across the world."],[190.62,194.77,"True. And the workers who made it may not have been paid a fair wage."],[196.08,202.35,"Many garment factories are in Cambodia. Supply chain transparency should be the norm."],[203.65,207.59,"Some of my friends support a boycott of brands that hide information."],[208.88,212.21,"Boycotts must have an effect if enough people join."],[213.52,218.42,"Personally, I prefer upcycling. My sister makes bags from old clothes."],[219.72,223.53,"Grammar focus: Modals of deduction (extended)."],[223.83,226.31,"Use modals to make logical deductions."],[226.62,230.47,"It might be greenwashing, but it can't be fully eco."],[230.77,233.1,"The workers may not have been paid fairly."],[233.4,239.02,"Use passive modal perfects (may not have been paid) to speculate about past actions done to people."],[240.02,243.06,"Now read and listen. Shopping With a Conscience."],[243.36,246.61,"More consumers than ever say they want to shop ethically."],[247.92,252.45,"However, it is often difficult to know whether a product's claims are true."],[253.75,260.06,"Greenwashing has become so common that some regulators now fine companies for misleading labels."],[261.35,267.15,"Ethical sourcing and supply chain transparency allow shoppers to see how goods are made."],[268.45,275.12,"Cambodia's garment industry, which employs hundreds of thousands of workers, is under increasing scrutiny."],[276.42,281.92,"Campaigners argue that brands must guarantee a fair wage throughout their supply chains."],[283.22,289.18,"Some consumers organise boycotts, while others choose second-hand clothes or upcycling."],[290.48,295.33,"Every purchase, it is often said, is a vote for the kind of world we want."],[296.62,299.48,"Quiz time! Choose the correct answer."],[299.78,303.29,"Making false environmental claims is blank."],[303.59,308.19,"A, upcycling. B, greenwashing. C, ethical sourcing."],[312.18,314.77,"The answer is B: greenwashing."],[316.28,319.42,"He isn't answering. He blank be in a meeting."],[319.72,323.24,"A, might. B, can't. C, mustn't."],[327.25,329.1,"The answer is A: might."],[330.58,333.81,"That blank be true. I saw her yesterday."],[334.11,337.49,"A, must. B, can't. C, should."],[341.48,343.53,"The answer is B: can't."],[345.02,348.64,"Refusing to buy something as a protest is a blank."],[348.94,353.94,"A, boycott. B, fair wage. C, product lifecycle."],[357.95,360.37,"The answer is A: boycott."],[361.88,365.86,"According to the text, what have some regulators started doing?"],[366.16,373.35,"A, banning shopping. B, fining companies for misleading labels. C, closing factories."],[377.35,381.83,"The answer is B: fining companies for misleading labels."],[383.35,388.97,"Now it's your turn. Part one: Can individual shoppers really change how companies behave?"],[394.27,398.91,"Part two: Speculate with modals, give two arguments and one example."],[405.21,419.59,"They might, if enough of them act together. Consumer pressure can force companies to publish their supply chains, and boycotts may damage reputations. The campaign for garment workers' wages, for example, must have influenced several brands."],[419.89,422.08,"That is a well-argued answer!"],[423.08,427.86,"Great work today! You learned eight new words and modals of deduction (extended)."],[428.16,432.36,"Today's value is responsibility. Help at home and do your jobs."],[432.66,435.54,"See you in Unit twenty-eight. Goodbye!"],[435.84,438.52,"Thank you, Ms. Sarah! Bye, everyone!"]],"OC-Advanced-Unit28-Sports-and-Ethics":[[0.35,5.51,"Hello, everyone! I'm Ms. Sarah. Welcome to Online Advanced."],[5.81,9.25,"Hi! I'm Rithy. Let's learn together!"],[9.55,17.83,"Unit twenty-eight: Sports and Ethics. In this unit, you will discuss fairness and money in modern sport."],[18.82,20.35,"performance enhancement."],[21.05,26.73,"performance enhancement means improving athletic results, sometimes through banned methods."],[27.03,29.7,"Performance enhancement through drugs is banned."],[30.41,33.92,"Your turn. Say: performance enhancement."],[36.62,38.26,"performance enhancement."],[39.25,40.36,"gene doping."],[41.06,45.84,"gene doping means illegally changing genes to improve athletic ability."],[46.14,49.58,"Gene doping could become sport's next big scandal."],[50.28,53.37,"Your turn. Say: gene doping."],[56.07,57.3,"gene doping."],[58.28,59.64,"sportswashing."],[60.34,65.47,"sportswashing means using sport to improve a country's or company's damaged reputation."],[65.77,68.25,"Critics accused the hosts of sportswashing."],[68.95,72.41,"Your turn. Say: sportswashing."],[75.11,76.44,"sportswashing."],[77.45,78.94,"athlete welfare."],[79.64,85.04,"athlete welfare means the health, safety and wellbeing of athletes."],[85.34,87.98,"Athlete welfare must come before medals."],[88.68,92.07,"Your turn. Say: athlete welfare."],[94.77,96.41,"athlete welfare."],[97.42,99.01,"concussion protocol."],[99.71,105.35,"concussion protocol means official rules for treating head injuries in sport."],[105.66,108.62,"The player was removed under the concussion protocol."],[109.32,113.03,"Your turn. Say: concussion protocol."],[115.73,117.24,"concussion protocol."],[118.25,120.04,"commercialisation of sport."],[120.74,126.12,"commercialisation of sport means the growing influence of money and business in sport."],[126.42,129.9,"The commercialisation of sport has raised ticket prices."],[130.6,134.1,"Your turn. Say: commercialisation of sport."],[136.8,138.77,"commercialisation of sport."],[139.78,140.89,"amateurism."],[141.59,145.4,"amateurism means doing sport for love, not money."],[145.7,148.74,"The Olympics once required strict amateurism."],[149.44,152.58,"Your turn. Say: amateurism."],[155.28,156.41,"amateurism."],[157.42,158.84,"integrity unit."],[159.54,164.29,"integrity unit means an organisation that investigates cheating in sport."],[164.59,167.45,"Tennis has an independent integrity unit."],[168.15,171.78,"Your turn. Say: integrity unit."],[174.49,175.93,"integrity unit."],[176.92,179.07,"Now let's listen to a conversation."],[179.37,183.85,"Ms. Sarah, should athletes be allowed to use any performance enhancement?"],[185.15,189.67,"Most experts insist that drugs be banned, mainly for athlete welfare."],[190.98,193.28,"But what about gene doping in the future?"],[194.58,199.24,"It is essential that regulators prepare now, before it becomes possible."],[200.55,204.77,"And head injuries? Some players return far too soon."],[206.08,210.73,"Doctors recommend that every league follow a strict concussion protocol."],[212.02,214.53,"Money seems to dominate everything now."],[215.82,221.1,"Yes. Were it not for commercialisation, sportswashing would be far less tempting."],[222.42,226.68,"Grammar focus: Subjunctive and formal structures (extended)."],[226.98,231.27,"The subjunctive is common in formal rules and recommendations."],[231.57,236.9,"Experts insist that drugs be banned. It is crucial that every league follow the protocol."],[237.2,239.86,"Were it not for money, sport would be different."],[240.16,245.18,"The subjunctive is typical of rules, policies and formal recommendations."],[246.18,249.2,"Now read and listen. Winning at What Cost?."],[249.5,254.7,"Modern sport is a global industry worth hundreds of billions of dollars."],[255.98,261.28,"The commercialisation of sport has brought professionalism, but also new ethical problems."],[262.58,267.37,"Doping scandals have damaged trust in cycling, athletics and other sports."],[268.68,272.6,"Scientists warn that gene doping may soon be difficult to detect."],[273.88,278.55,"At the same time, concussion research has forced leagues to rethink player safety."],[279.85,284.18,"Some countries have been accused of sportswashing by hosting major tournaments."],[285.48,290.18,"Independent integrity units now investigate corruption and match-fixing."],[291.48,295.32,"It is essential that the spirit of fair play survive the pressure of money."],[296.62,299.94,"Quiz time! Choose the correct answer."],[300.24,303.84,"Using sport to improve a damaged reputation is blank."],[304.14,310.1,"A, amateurism. B, sportswashing. C, athlete welfare."],[314.08,316.9,"The answer is B: sportswashing."],[318.38,321.47,"The coach insisted that every player blank on time."],[321.77,325.47,"A, arrives. B, arrive. C, arrived."],[329.48,331.46,"The answer is B: arrive."],[332.95,335.33,"It is essential that she blank informed."],[335.63,338.69,"A, be. B, is. C, was."],[342.68,344.36,"The answer is A: be."],[345.85,348.75,"Official rules for treating head injuries are a blank."],[349.06,355.31,"A, concussion protocol. B, integrity unit. C, gene doping."],[359.32,362.89,"The answer is A: concussion protocol."],[364.38,368.27,"According to the text, what may soon be difficult to detect?"],[368.57,373.59,"A, match-fixing. B, gene doping. C, injuries."],[377.58,379.99,"The answer is B: gene doping."],[381.48,386.37,"Now it's your turn. Part one: Has money damaged the spirit of sport?"],[391.67,398.17,"Part two: Use the subjunctive in a recommendation, give two arguments and one example."],[404.47,419.0,"To some extent, yes. High salaries create pressure to cheat, and sportswashing exploits fans. I would recommend that every federation publish its finances. Cycling's doping scandals show what happens when money outweighs ethics."],[419.3,421.98,"That is a well-argued answer!"],[422.98,428.69,"Great work today! You learned eight new words and subjunctive and formal structures (extended)."],[428.99,433.25,"Today's value is fair play. Play fairly and follow the rules."],[433.56,437.73,"See you in Unit twenty-nine. Goodbye!"],[438.03,440.75,"Thank you, Ms. Sarah! Bye, everyone!"]],"OC-Advanced-Unit29-Memory-and-History":[[0.35,5.7,"Hello, everyone! I'm Ms. Sarah. Welcome to Online Advanced."],[6.0,9.34,"Hi! I'm Rithy. Let's learn together!"],[9.64,17.27,"Unit twenty-nine: Memory and History. In this unit, you will discuss how societies remember the past."],[18.28,19.6,"collective memory."],[20.3,24.32,"collective memory means the shared memories of a group or nation."],[24.62,27.75,"War leaves deep marks on a nation's collective memory."],[28.45,31.87,"Your turn. Say: collective memory."],[34.57,35.76,"collective memory."],[36.75,38.27,"historical narrative."],[38.97,43.67,"historical narrative means the story a society tells about its past."],[43.97,46.91,"Every country builds its own historical narrative."],[47.61,51.73,"Your turn. Say: historical narrative."],[54.43,55.95,"historical narrative."],[56.95,58.15,"commemoration."],[58.85,63.18,"commemoration means an event or act that honours and remembers the past."],[63.48,65.85,"The commemoration was held in silence."],[66.55,69.82,"Your turn. Say: commemoration."],[72.52,73.65,"commemoration."],[74.65,75.85,"revisionism."],[76.55,82.24,"revisionism means reinterpreting history, sometimes to deny or distort facts."],[82.54,85.96,"Historians warn against revisionism that denies suffering."],[86.66,89.47,"Your turn. Say: revisionism."],[92.17,93.14,"revisionism."],[94.15,95.47,"oral testimony."],[96.16,100.09,"oral testimony means spoken accounts from people who lived through events."],[100.39,103.49,"Oral testimony from survivors preserves history."],[104.19,107.37,"Your turn. Say: oral testimony."],[110.07,111.36,"oral testimony."],[112.35,113.77,"reconciliation."],[114.47,119.03,"reconciliation means restoring peaceful relationships after conflict."],[119.33,121.9,"Reconciliation can take generations."],[122.6,126.29,"Your turn. Say: reconciliation."],[128.99,130.25,"reconciliation."],[131.25,132.8,"transitional justice."],[133.5,140.18,"transitional justice means legal and social processes to deal with past abuses after conflict."],[140.47,144.3,"Cambodia's tribunal was a form of transitional justice."],[145.0,148.95,"Your turn. Say: transitional justice."],[151.65,153.21,"transitional justice."],[154.22,155.43,"memorial site."],[156.13,160.44,"memorial site means a place created to remember victims of the past."],[160.74,164.64,"Memorial sites help younger generations understand history."],[165.34,168.53,"Your turn. Say: memorial site."],[171.23,172.48,"memorial site."],[173.48,175.77,"Now let's listen to a conversation."],[176.07,180.77,"Rithy, how do young Cambodians learn about the Khmer Rouge period?"],[182.05,187.51,"Mostly from family stories, and arguably more from oral testimony than textbooks."],[188.82,193.26,"That's very powerful. Memorial sites play a role too, I suppose."],[194.55,199.26,"Yes. Visiting them tends to leave a lasting impression on students."],[200.55,203.92,"What about the tribunal? Was it seen as successful?"],[205.22,211.06,"Opinions differ. It could be argued that it brought some justice, though many felt it came late."],[212.35,215.41,"Transitional justice is rarely perfect anywhere."],[216.72,222.12,"Perhaps reconciliation depends less on courts and more on honest remembrance."],[223.42,227.0,"Grammar focus: Hedging in sensitive topics."],[227.3,232.09,"Hedging is especially important when discussing sensitive history."],[232.39,239.32,"Arguably, family stories teach more than textbooks. Visiting memorials tends to leave a lasting impression."],[239.62,242.96,"Opinions differ, and careful language shows respect."],[243.26,250.34,"On painful historical topics, hedging shows respect for different experiences and avoids over-generalising."],[251.35,254.18,"Now read and listen. Remembering to Heal."],[254.48,260.17,"Every society must decide how to remember painful periods of its history."],[261.48,270.4,"In Cambodia, the years from 1975 to 1979 remain central to the nation's collective memory."],[271.72,278.63,"Memorial sites such as Tuol Sleng and Choeung Ek now help visitors understand what happened."],[279.92,287.65,"Between 2006 and 2022, a special tribunal tried senior leaders of the regime."],[288.95,295.11,"This process of transitional justice was welcomed by many, although some felt it was too limited."],[296.42,302.11,"Oral testimony from survivors has also been recorded to preserve personal histories."],[303.42,307.95,"Historians warn that revisionism can arise when such memories are not shared openly."],[309.25,314.91,"Commemoration, it seems, is not only about the past but also about building a peaceful future."],[316.22,318.81,"Quiz time! Choose the correct answer."],[319.11,323.2,"Restoring peaceful relationships after conflict is blank."],[323.5,329.69,"A, revisionism. B, reconciliation. C, commemoration."],[333.68,336.79,"The answer is B: reconciliation."],[338.28,339.78,"Which sentence is hedged?"],[340.08,348.31,"A, The tribunal failed.. B, It could be argued that the tribunal was too limited.. C, The tribunal was perfect.."],[352.32,356.72,"The answer is B: It could be argued that the tribunal was too limited.."],[358.22,361.26,"Young people blank learn history from their families."],[361.56,365.21,"A, tend to. B, are tending. C, tends."],[369.22,371.8,"The answer is A: tend to."],[373.28,376.57,"Spoken accounts from people who lived through events are blank."],[376.87,382.96,"A, oral testimony. B, historical narrative. C, memorial sites."],[386.95,389.93,"The answer is A: oral testimony."],[391.42,395.34,"According to the text, when did the special tribunal operate?"],[395.64,408.6,"A, 1975–1979. B, 2006–2022. C, 1993–2000."],[412.58,416.6,"The answer is B: 2006–2022."],[418.12,425.02,"Now it's your turn. Part one: Why is it important for societies to remember difficult periods of history?"],[430.32,436.14,"Part two: Use hedging: give two reasons and describe one way of remembering."],[442.44,456.14,"It could be argued that remembering protects future generations from repeating mistakes. It also tends to help survivors feel recognised. Recording oral testimony from grandparents is, arguably, one of the most meaningful ways to remember."],[456.44,458.5,"That is a well-argued answer!"],[459.52,464.63,"Great work today! You learned eight new words and hedging in sensitive topics."],[464.93,468.47,"Today's value is empathy. Think about how others feel."],[468.76,471.62,"See you in Unit thirty. Goodbye!"],[471.92,474.6,"Thank you, Ms. Sarah! Bye, everyone!"]],"OC-Advanced-Unit30-Negotiation-and-Diplomacy":[[0.35,5.42,"Hello, everyone! I'm Ms. Sarah. Welcome to Online Advanced."],[5.72,8.96,"Hi! I'm Rithy. Let's learn together!"],[9.26,17.19,"Unit thirty: Negotiation and Diplomacy. In this unit, you will discuss how conflicts are resolved through negotiation."],[18.18,19.41,"diplomatic channel."],[20.11,25.18,"diplomatic channel means an official route of communication between governments."],[25.48,28.27,"The dispute was resolved through diplomatic channels."],[28.97,32.23,"Your turn. Say: diplomatic channel."],[34.93,36.39,"diplomatic channel."],[37.38,38.62,"bargaining power."],[39.32,44.22,"bargaining power means the ability to influence the terms of an agreement."],[44.52,48.6,"Large economies have more bargaining power in trade talks."],[49.3,52.46,"Your turn. Say: bargaining power."],[55.16,56.44,"bargaining power."],[57.45,58.5,"concession."],[59.2,62.89,"concession means something you agree to give up to reach an agreement."],[63.19,65.9,"Both sides made concessions to end the strike."],[66.6,69.06,"Your turn. Say: concession."],[71.75,72.83,"concession."],[73.82,74.82,"stalemate."],[75.52,80.03,"stalemate means a situation where neither side can make progress."],[80.33,82.95,"The negotiations ended in stalemate."],[83.65,86.43,"Your turn. Say: stalemate."],[89.13,90.17,"stalemate."],[91.18,92.3,"mediation."],[93.0,97.48,"mediation means help from a neutral third party to settle a dispute."],[97.78,101.21,"Mediation by a neighbouring country helped both sides."],[101.91,104.33,"Your turn. Say: mediation."],[107.03,107.93,"mediation."],[108.92,110.42,"bilateral talks."],[111.12,114.73,"bilateral talks means discussions between two countries."],[115.03,117.81,"The leaders held bilateral talks on trade."],[118.51,122.26,"Your turn. Say: bilateral talks."],[124.96,126.42,"bilateral talks."],[127.42,128.72,"multilateralism."],[129.42,134.61,"multilateralism means cooperation between many countries on shared problems."],[134.91,138.24,"ASEAN is an example of regional multilateralism."],[138.94,142.6,"Your turn. Say: multilateralism."],[145.3,146.73,"multilateralism."],[147.72,148.88,"soft power."],[149.58,154.52,"soft power means influence through culture and values rather than force."],[154.82,158.12,"K-pop has increased South Korea's soft power."],[158.82,161.91,"Your turn. Say: soft power."],[164.61,165.77,"soft power."],[166.78,168.99,"Now let's listen to a conversation."],[169.29,173.11,"Ms. Sarah, how do countries avoid conflict when they disagree?"],[174.42,179.29,"First of all, through diplomatic channels. Talking is always cheaper than fighting."],[180.58,183.79,"But what if one side has much more bargaining power?"],[185.08,191.62,"In that case, mediation by a neutral party can help. Moreover, multilateral groups balance power."],[192.92,194.14,"Like ASEAN?"],[195.45,202.11,"Exactly. That said, multilateralism can be slow, and talks sometimes reach stalemate."],[203.42,205.52,"Then someone must make concessions."],[206.82,212.42,"Indeed. On the whole, the best agreements leave both sides feeling they have gained something."],[213.72,217.04,"Grammar focus: Discourse markers in debate."],[217.34,219.78,"Discourse markers structure a debate."],[220.08,226.5,"First of all introduces your first point; that said concedes a weakness; on the whole concludes."],[226.8,230.61,"For example: That said, multilateralism can be slow."],[230.91,235.49,"In debates, concession markers like 'that said' make you sound balanced and persuasive."],[236.48,239.39,"Now read and listen. The Art of Agreement."],[239.69,243.96,"Diplomacy is often described as the art of letting others have your way."],[245.25,250.57,"Successful negotiators prepare carefully and understand the other side's interests."],[251.88,257.09,"When bargaining power is unequal, mediation can help create a fairer process."],[258.38,263.83,"Regional organisations such as ASEAN encourage dialogue through multilateralism."],[265.12,269.03,"That said, consensus-based decision-making can make progress slow."],[270.32,275.85,"Countries also use soft power, from culture to education, to build influence."],[277.15,281.37,"When talks reach stalemate, small concessions can restore trust."],[282.68,288.77,"On the whole, history suggests that patient diplomacy prevents more wars than military strength."],[290.08,292.82,"Quiz time! Choose the correct answer."],[293.12,296.64,"A situation where neither side can make progress is a blank."],[296.94,300.73,"A, concession. B, stalemate. C, mediation."],[304.72,307.1,"The answer is B: stalemate."],[308.58,311.57,"The plan is expensive. blank, it could save lives."],[311.87,316.71,"A, First of all. B, That said. C, In that case."],[320.72,322.66,"The answer is B: That said."],[324.15,326.46,"blank, I think the agreement is fair."],[326.76,330.83,"A, On the whole. B, That said. C, In that case."],[334.85,337.43,"The answer is A: On the whole."],[338.92,342.08,"Influence through culture rather than force is blank."],[342.38,347.55,"A, soft power. B, bargaining power. C, bilateral talks."],[351.55,354.62,"The answer is A: soft power."],[356.12,360.76,"According to the text, what can restore trust when talks reach stalemate?"],[361.06,367.62,"A, military threats. B, small concessions. C, silence."],[371.62,374.57,"The answer is B: small concessions."],[376.08,380.35,"Now it's your turn. Part one: What makes a good negotiator?"],[385.65,391.46,"Part two: Use three discourse markers to give two qualities and one example."],[397.76,411.57,"First of all, a good negotiator listens carefully. Moreover, they understand what the other side truly needs. That said, they must also know their own limits. On the whole, patience is the most important skill."],[411.87,413.93,"That is a well-argued answer!"],[414.92,420.15,"Great work today! You learned eight new words and discourse markers in debate."],[420.45,424.85,"Today's value is patience. Wait calmly and take your time."],[425.15,427.98,"See you in Unit thirty-one. Goodbye!"],[428.28,431.15,"Thank you, Ms. Sarah! Bye, everyone!"]],"OC-Advanced-Unit31-Ocean-Futures":[[0.35,5.56,"Hello, everyone! I'm Ms. Sarah. Welcome to Online Advanced."],[5.86,9.27,"Hi! I'm Rithy. Let's learn together!"],[9.57,16.46,"Unit thirty-one: Ocean Futures. In this unit, you will discuss threats to the oceans and how to protect them."],[17.45,19.36,"ocean acidification."],[20.06,26.04,"ocean acidification means the ocean becoming more acidic as it absorbs carbon dioxide."],[26.34,29.79,"Ocean acidification weakens shells and coral."],[30.49,33.7,"Your turn. Say: ocean acidification."],[36.4,38.02,"ocean acidification."],[39.02,40.08,"overfishing."],[40.78,44.45,"overfishing means catching fish faster than they can reproduce."],[44.75,47.63,"Overfishing has emptied many coastal waters."],[48.33,51.37,"Your turn. Say: overfishing."],[54.06,55.17,"overfishing."],[56.18,57.87,"marine protected area."],[58.57,63.23,"marine protected area means a part of the sea where human activity is limited."],[63.53,65.97,"Koh Rong has a marine protected area."],[66.67,70.7,"Your turn. Say: marine protected area."],[73.4,74.93,"marine protected area."],[75.92,77.11,"coral bleaching."],[77.81,83.23,"coral bleaching means coral turning white when the water becomes too warm."],[83.53,86.41,"Coral bleaching has damaged reefs worldwide."],[87.11,90.01,"Your turn. Say: coral bleaching."],[92.71,93.81,"coral bleaching."],[94.82,96.14,"deep-sea mining."],[96.84,100.7,"deep-sea mining means extracting minerals from the ocean floor."],[101.0,105.82,"Scientists fear deep-sea mining could destroy unknown ecosystems."],[106.52,110.1,"Your turn. Say: deep-sea mining."],[112.8,114.03,"deep-sea mining."],[115.05,116.64,"blue economy."],[117.34,122.31,"blue economy means sustainable use of ocean resources for economic growth."],[122.61,125.95,"Tourism and fishing are part of the blue economy."],[126.65,129.92,"Your turn. Say: blue economy."],[132.62,133.85,"blue economy."],[134.85,136.04,"plastic gyre."],[136.74,141.22,"plastic gyre means a huge area where ocean currents collect plastic waste."],[141.52,145.6,"The Pacific plastic gyre is larger than many countries."],[146.3,149.86,"Your turn. Say: plastic gyre."],[152.56,153.91,"plastic gyre."],[154.92,155.85,"bycatch."],[156.55,161.28,"bycatch means sea animals caught accidentally while fishing for other species."],[161.58,163.75,"Turtles are often killed as bycatch."],[164.45,168.03,"Your turn. Say: bycatch."],[170.73,171.71,"bycatch."],[172.72,174.9,"Now let's listen to a conversation."],[175.2,177.96,"Rithy, have you dived near Koh Rong?"],[179.25,184.17,"Yes. The establishment of the marine protected area has made a real difference."],[185.45,190.01,"That's encouraging. Elsewhere, the decline of fish stocks is alarming."],[191.32,193.68,"Because of overfishing and bycatch?"],[194.98,199.66,"Partly. The warming of the oceans also causes coral bleaching."],[200.95,204.25,"And acidification makes it harder for coral to recover."],[205.55,208.47,"There's growing concern about deep-sea mining too."],[209.78,214.32,"Surely the protection of ecosystems should come before the extraction of minerals."],[215.62,219.89,"Grammar focus: Nominalisation in academic writing."],[220.19,223.41,"Nominalisation turns actions into nouns."],[223.71,229.74,"The establishment of the protected area made a difference. The decline of fish stocks is alarming."],[230.04,232.71,"It is a key feature of academic English."],[233.01,240.32,"Nominalisation lets you turn whole events into subjects, a key feature of academic and scientific English."],[241.32,244.31,"Now read and listen. The Ocean in Crisis."],[244.61,250.98,"The ocean covers more than seventy percent of our planet and produces much of the oxygen we breathe."],[252.28,255.94,"Yet it faces unprecedented pressure from human activity."],[257.25,260.7,"The warming of the seas has caused widespread coral bleaching."],[262.02,269.14,"Ocean acidification, caused by the absorption of carbon dioxide, threatens shellfish and coral."],[270.45,274.97,"Overfishing and bycatch have led to the collapse of several fish populations."],[276.28,280.68,"Meanwhile, plastic gyres continue to grow in the world's major oceans."],[281.98,286.58,"The creation of marine protected areas has allowed some ecosystems to recover."],[287.88,294.4,"A sustainable blue economy will depend on the protection, not the exploitation, of the seas."],[295.68,298.39,"Quiz time! Choose the correct answer."],[298.69,302.88,"Sea animals caught accidentally while fishing are blank."],[303.18,307.7,"A, bycatch. B, blue economy. C, overfishing."],[311.72,314.71,"The answer is A: bycatch."],[316.22,318.29,"The noun form of 'protect' is blank."],[318.59,322.62,"A, protecting. B, protection. C, protector."],[326.62,328.78,"The answer is B: protection."],[330.28,333.45,"'The seas are warming' → 'The blank of the seas'"],[333.75,337.01,"A, warm. B, warming. C, warmth."],[341.02,343.5,"The answer is B: warming."],[345.02,347.61,"Coral turning white in warm water is blank."],[347.91,353.81,"A, coral bleaching. B, ocean acidification. C, plastic gyre."],[357.82,360.75,"The answer is A: coral bleaching."],[362.25,366.51,"According to the text, what has allowed some ecosystems to recover?"],[366.81,372.51,"A, deep-sea mining. B, marine protected areas. C, more fishing."],[376.52,379.94,"The answer is B: marine protected areas."],[381.45,388.2,"Now it's your turn. Part one: How can Cambodia protect its coastal and marine environment?"],[393.5,399.78,"Part two: Use nominalisation: propose two measures and evaluate one challenge."],[406.08,417.58,"The expansion of marine protected areas and the reduction of plastic waste would be effective measures. The main challenge is the enforcement of fishing rules, given the dependence of many families on the sea."],[417.88,419.88,"That is a well-argued answer!"],[420.88,426.68,"Great work today! You learned eight new words and nominalisation in academic writing."],[426.98,432.12,"Today's value is caring for nature. Care for plants, birds and our planet."],[432.42,435.23,"See you in Unit thirty-two. Goodbye!"],[435.53,437.9,"Thank you, Ms. Sarah! Bye, everyone!"]],"OC-Advanced-Unit32-Work-and-Meaning":[[0.35,5.16,"Hello, everyone! I'm Ms. Sarah. Welcome to Online Advanced."],[5.46,8.85,"Hi! I'm Rithy. Let's learn together!"],[9.15,16.39,"Unit thirty-two: Work and Meaning. In this unit, you will discuss motivation, purpose and attitudes to work."],[17.38,18.4,"vocation."],[19.1,23.38,"vocation means a type of work you feel especially suited to."],[23.68,26.01,"Teaching is her true vocation."],[26.71,29.59,"Your turn. Say: vocation."],[32.29,33.27,"vocation."],[34.28,35.03,"calling."],[35.73,39.49,"calling means a strong feeling that you should do a particular job."],[39.79,42.06,"For many nurses, caring is a calling."],[42.76,45.49,"Your turn. Say: calling."],[48.19,48.93,"calling."],[49.92,51.67,"intrinsic motivation."],[52.37,58.81,"intrinsic motivation means doing something because you enjoy it or find it meaningful."],[59.11,62.1,"Intrinsic motivation lasts longer than bonuses."],[62.8,66.18,"Your turn. Say: intrinsic motivation."],[68.88,70.42,"intrinsic motivation."],[71.42,72.89,"extrinsic reward."],[73.59,77.44,"extrinsic reward means an outside reward such as money or praise."],[77.74,80.46,"Extrinsic rewards can reduce creativity."],[81.16,84.67,"Your turn. Say: extrinsic reward."],[87.37,88.88,"extrinsic reward."],[89.88,91.13,"job crafting."],[91.83,95.58,"job crafting means reshaping your job to make it more meaningful."],[95.88,99.51,"Through job crafting, she added mentoring to her role."],[100.21,103.36,"Your turn. Say: job crafting."],[106.06,107.31,"job crafting."],[108.32,109.63,"meaningful work."],[110.33,114.29,"meaningful work means work that feels important and worthwhile."],[114.59,118.08,"Young people increasingly seek meaningful work."],[118.78,122.29,"Your turn. Say: meaningful work."],[124.99,126.7,"meaningful work."],[127.68,128.77,"quiet quitting."],[129.47,133.01,"quiet quitting means doing only the minimum required at work."],[133.31,136.25,"Quiet quitting became a trend after the pandemic."],[136.95,140.11,"Your turn. Say: quiet quitting."],[142.81,143.88,"quiet quitting."],[144.88,146.05,"workaholism."],[146.75,150.82,"workaholism means an unhealthy need to work all the time."],[151.12,154.22,"Workaholism can damage health and relationships."],[154.92,158.1,"Your turn. Say: workaholism."],[160.8,161.92,"workaholism."],[162.92,165.1,"Now let's listen to a conversation."],[165.4,169.2,"Ms. Sarah, do you see teaching as a job or a vocation?"],[170.52,174.92,"A vocation, definitely. Do you think you'll find yours in engineering?"],[176.22,180.51,"I hope so. My father didn't. He worked only for the salary."],[181.82,186.94,"Many do. Extrinsic rewards matter, but rarely satisfy on their own."],[188.25,191.49,"What about quiet quitting? Some friends say they do it."],[192.78,197.77,"Understandable, if their work feels meaningless. Job crafting might help."],[199.08,201.57,"And workaholism is the opposite extreme."],[202.88,207.37,"Exactly. Neither is healthy. Meaningful work with balance is."],[208.68,213.21,"Grammar focus: Ellipsis and substitution (extended)."],[213.51,216.81,"Ellipsis and substitution avoid repetition."],[217.11,220.44,"I hope so. My father didn't. Many do."],[220.74,223.74,"They make spoken English sound natural and fluent."],[224.04,229.8,"Ellipsis is natural in speech and makes conversations sound fluent rather than repetitive."],[230.82,233.47,"Now read and listen. Why Do We Work?."],[233.77,237.62,"For most of history, people worked simply to survive."],[238.92,244.36,"Today, many also expect their work to provide purpose and identity."],[245.65,251.61,"Psychologists distinguish intrinsic motivation from extrinsic rewards such as salary and status."],[252.92,257.95,"Research suggests that people who find their work meaningful are healthier and more productive."],[259.25,264.06,"However, not everyone has a calling, and many jobs are repetitive."],[265.35,271.06,"Job crafting allows employees to reshape tasks and relationships to increase meaning."],[272.35,276.37,"Trends such as quiet quitting suggest that many workers feel disconnected."],[277.68,283.15,"Workaholism, on the other hand, shows that too much devotion can also be harmful."],[284.45,287.24,"Quiz time! Choose the correct answer."],[287.54,290.35,"Doing only the minimum required at work is blank."],[290.65,295.51,"A, job crafting. B, quiet quitting. C, workaholism."],[299.52,302.03,"The answer is B: quiet quitting."],[303.52,306.31,"'Will it rain tomorrow?' 'I hope blank.'"],[306.61,309.78,"A, not. B, no. C, isn't."],[313.78,315.71,"The answer is A: not."],[317.22,320.46,"I enjoy my job, and so blank my sister."],[320.76,324.01,"A, is. B, does. C, has."],[328.02,330.28,"The answer is B: does."],[331.78,334.51,"An outside reward such as money is an blank."],[334.81,340.5,"A, intrinsic motivation. B, extrinsic reward. C, vocation."],[344.48,347.59,"The answer is B: extrinsic reward."],[349.08,352.91,"According to the text, people who find their work meaningful are blank."],[353.21,358.96,"A, healthier and more productive. B, richer. C, more stressed."],[362.95,366.23,"The answer is A: healthier and more productive."],[367.72,374.84,"Now it's your turn. Part one: Is it more important to earn a high salary or to do meaningful work?"],[380.14,386.09,"Part two: Give your position, two reasons, and use ellipsis at least once."],[392.39,403.68,"Meaningful work, for me. Money matters, of course, but it doesn't satisfy for long; meaning does. Will I always find it? I hope so, and if not, I'll try job crafting."],[403.98,406.08,"That is a well-argued answer!"],[407.08,413.29,"Great work today! You learned eight new words and ellipsis and substitution (extended)."],[413.59,417.82,"Today's value is hard work. Work hard and never give up."],[418.12,421.27,"See you in Unit thirty-three. Goodbye!"],[421.57,424.52,"Thank you, Ms. Sarah! Bye, everyone!"]],"OC-Advanced-Unit33-Trust-and-Institutions":[[0.35,4.97,"Hello, everyone! I'm Ms. Sarah. Welcome to Online Advanced."],[5.27,8.42,"Hi! I'm Rithy. Let's learn together!"],[8.72,18.22,"Unit thirty-three: Trust and Institutions. In this unit, you will discuss why people trust or distrust public institutions."],[19.22,20.82,"institutional trust."],[21.52,27.69,"institutional trust means confidence in organisations such as courts, banks and schools."],[27.99,31.25,"Institutional trust has fallen in many countries."],[31.95,35.6,"Your turn. Say: institutional trust."],[38.3,39.82,"institutional trust."],[40.82,41.96,"legitimacy."],[42.66,47.16,"legitimacy means the quality of being accepted as fair and lawful."],[47.46,50.14,"Elections give a government its legitimacy."],[50.84,54.21,"Your turn. Say: legitimacy."],[56.91,58.12,"legitimacy."],[59.12,60.49,"social contract."],[61.19,66.16,"social contract means the unwritten agreement between citizens and the state."],[66.46,69.38,"Paying taxes is part of the social contract."],[70.08,73.24,"Your turn. Say: social contract."],[75.94,77.25,"social contract."],[78.25,79.37,"due process."],[80.07,84.62,"due process means fair treatment through the normal legal system."],[84.92,88.59,"Everyone deserves due process, including suspects."],[89.29,92.05,"Your turn. Say: due process."],[94.75,95.85,"due process."],[96.85,98.35,"public confidence."],[99.05,103.09,"public confidence means the trust that people have in an institution."],[103.39,106.26,"The scandal damaged public confidence in the bank."],[106.96,110.75,"Your turn. Say: public confidence."],[113.45,115.0,"public confidence."],[116.02,117.53,"transparency measure."],[118.23,122.85,"transparency measure means an action that makes decisions open and visible."],[123.15,127.09,"Publishing budgets online is a transparency measure."],[127.79,130.97,"Your turn. Say: transparency measure."],[133.66,135.03,"transparency measure."],[136.02,137.63,"integrity agency."],[138.33,143.03,"integrity agency means an independent body that investigates misconduct."],[143.33,146.46,"The integrity agency investigated the contract."],[147.16,150.56,"Your turn. Say: integrity agency."],[153.26,154.82,"integrity agency."],[155.82,157.05,"bureaucracy."],[157.75,162.56,"bureaucracy means a system of government with many complicated rules and officials."],[162.86,166.02,"Too much bureaucracy slows down small businesses."],[166.72,169.52,"Your turn. Say: bureaucracy."],[172.22,173.35,"bureaucracy."],[174.35,176.5,"Now let's listen to a conversation."],[176.8,181.24,"Rithy, why do you think institutional trust is falling in so many places?"],[182.55,187.04,"Scandals, mostly. And slow bureaucracy frustrates ordinary people."],[188.35,191.67,"Trust, once lost, is very hard to rebuild."],[192.98,195.2,"What can institutions actually do?"],[196.52,202.27,"Transparency measures help. Publishing budgets and decisions online, for example."],[203.58,206.06,"And independent integrity agencies?"],[207.35,212.96,"Crucial. Without due process and accountability, legitimacy disappears."],[214.25,218.42,"So the social contract depends on fairness, not just power."],[219.72,223.05,"Grammar focus: Fronting in formal argument."],[223.35,226.85,"Fronting places the key idea at the beginning for impact."],[227.15,233.23,"Trust, once lost, is hard to rebuild. Crucial to this is independent oversight."],[233.53,236.72,"Without due process, legitimacy disappears."],[237.02,242.04,"Fronting places your key idea first, giving formal arguments rhetorical force."],[243.05,246.38,"Now read and listen. The Currency of Trust."],[246.68,252.06,"Trust is often described as the invisible currency of a healthy society."],[253.35,259.3,"When citizens trust institutions, they pay taxes, follow laws and cooperate more willingly."],[260.58,265.67,"Surveys show, however, that institutional trust has declined in many countries."],[266.98,273.02,"Corruption scandals, slow bureaucracy and unequal treatment are frequently cited as causes."],[274.32,280.16,"Particularly damaging is the perception that rules apply differently to the powerful."],[281.45,287.66,"Transparency measures, such as open data and public hearings, can help restore public confidence."],[288.95,293.41,"Independent integrity agencies and due process are equally essential."],[294.72,300.75,"Ultimately, legitimacy is earned through consistent fairness, not demanded through authority."],[302.05,304.73,"Quiz time! Choose the correct answer."],[305.03,308.86,"The quality of being accepted as fair and lawful is blank."],[309.16,313.78,"A, legitimacy. B, bureaucracy. C, due process."],[317.78,320.53,"The answer is A: legitimacy."],[322.02,323.94,"Which sentence uses fronting?"],[324.24,332.36,"A, Independent oversight is crucial.. B, Crucial is independent oversight.. C, Oversight is independent.."],[336.35,339.96,"The answer is B: Crucial is independent oversight.."],[341.45,344.6,"Respect, once blank, is hard to regain."],[344.9,348.46,"A, lose. B, lost. C, losing."],[352.45,354.26,"The answer is B: lost."],[355.75,359.38,"A system with many complicated rules and officials is blank."],[359.68,365.34,"A, bureaucracy. B, integrity agency. C, social contract."],[369.35,372.02,"The answer is A: bureaucracy."],[373.52,377.59,"According to the text, what is particularly damaging to trust?"],[377.89,385.13,"A, open data. B, the perception that rules apply differently to the powerful. C, public hearings."],[389.15,393.92,"The answer is B: the perception that rules apply differently to the powerful."],[395.42,400.38,"Now it's your turn. Part one: What makes people trust an institution?"],[405.68,411.49,"Part two: Use fronting at least once, give two factors and one example."],[417.79,431.25,"Most important is consistency: rules must apply to everyone. Transparency, too, plays a key role. When my university published its scholarship criteria online, students' confidence in the process grew immediately."],[431.55,433.86,"That is a well-argued answer!"],[434.85,439.56,"Great work today! You learned eight new words and fronting in formal argument."],[439.86,443.33,"Today's value is honesty. Always tell the truth."],[443.63,446.52,"See you in Unit thirty-four. Goodbye!"],[446.82,449.59,"Thank you, Ms. Sarah! Bye, everyone!"]],"OC-Advanced-Unit34-The-Science-of-Learning":[[0.35,5.63,"Hello, everyone! I'm Ms. Sarah. Welcome to Online Advanced."],[5.93,9.07,"Hi! I'm Rithy. Let's learn together!"],[9.37,16.35,"Unit thirty-four: The Science of Learning. In this unit, you will understand how the brain learns most effectively."],[17.35,18.54,"metacognition."],[19.24,22.79,"metacognition means thinking about your own thinking and learning."],[23.09,26.66,"Metacognition helps students plan and check their learning."],[27.36,30.44,"Your turn. Say: metacognition."],[33.14,34.33,"metacognition."],[35.32,36.85,"spaced repetition."],[37.55,42.11,"spaced repetition means reviewing information at increasing intervals."],[42.41,47.24,"Spaced repetition apps help learners remember vocabulary."],[47.94,51.37,"Your turn. Say: spaced repetition."],[54.07,55.37,"spaced repetition."],[56.38,57.85,"retrieval practice."],[58.55,63.17,"retrieval practice means learning by trying to recall information from memory."],[63.47,67.09,"Self-testing is a powerful form of retrieval practice."],[67.79,70.88,"Your turn. Say: retrieval practice."],[73.58,75.16,"retrieval practice."],[76.15,77.42,"cognitive load."],[78.12,82.41,"cognitive load means the amount of mental effort a task requires."],[82.7,85.62,"Too much cognitive load makes learning difficult."],[86.32,89.83,"Your turn. Say: cognitive load."],[92.53,93.75,"cognitive load."],[94.75,96.03,"working memory."],[96.73,101.93,"working memory means the brain's short-term space for holding and using information."],[102.23,106.23,"Working memory can hold only a few items at once."],[106.93,109.71,"Your turn. Say: working memory."],[112.41,113.49,"working memory."],[114.48,115.9,"neuroplasticity."],[116.6,121.55,"neuroplasticity means the brain's ability to change and form new connections."],[121.85,125.17,"Neuroplasticity means we can learn at any age."],[125.87,129.34,"Your turn. Say: neuroplasticity."],[132.04,133.41,"neuroplasticity."],[134.42,135.86,"growth trajectory."],[136.56,140.35,"growth trajectory means the path of a learner's development over time."],[140.65,145.85,"Her growth trajectory accelerated after she changed methods."],[146.55,150.21,"Your turn. Say: growth trajectory."],[152.91,154.24,"growth trajectory."],[155.25,156.36,"interleaving."],[157.06,161.05,"interleaving means mixing different topics or skills during practice."],[161.35,164.42,"Interleaving maths problems improves understanding."],[165.12,167.8,"Your turn. Say: interleaving."],[170.5,171.58,"interleaving."],[172.58,174.83,"Now let's listen to a conversation."],[175.13,179.77,"Ms. Sarah, I read my notes again and again, but I still forget."],[181.08,186.14,"Rereading is the method on which most students rely, yet it's the least effective."],[187.45,189.6,"Really? What should I do instead?"],[190.92,197.4,"Retrieval practice: test yourself. Recalling information strengthens memory far more."],[198.72,202.27,"And spaced repetition, which my vocabulary app uses?"],[203.58,210.02,"Exactly. Reviewing at increasing intervals is the approach for which the evidence is strongest."],[211.32,213.91,"Is it true that the brain can change at any age?"],[215.22,222.56,"Yes. Neuroplasticity, the discovery of which transformed education, shows learning never stops."],[223.85,227.75,"Grammar focus: Advanced relative clauses (extended)."],[228.05,231.81,"Formal relative clauses put the preposition before which or whom."],[232.11,234.79,"It's the method on which most students rely."],[235.09,240.78,"Neuroplasticity, the discovery of which transformed education, shows learning never stops."],[241.08,247.97,"These structures are typical of academic writing; in speech, we usually move the preposition to the end."],[248.98,251.96,"Now read and listen. Learning How to Learn."],[252.26,256.58,"Many students spend hours studying, yet remember surprisingly little."],[257.88,263.53,"Cognitive scientists have identified techniques that make learning far more efficient."],[264.82,270.67,"Retrieval practice, in which learners test themselves, consistently outperforms rereading."],[271.98,277.75,"Spaced repetition, the effectiveness of which is supported by decades of research, prevents forgetting."],[279.05,285.24,"Interleaving different topics may feel harder, but it improves long-term understanding."],[286.55,292.11,"Teachers are also advised to manage cognitive load, since working memory is limited."],[293.42,297.99,"Metacognition helps learners monitor what they know and adjust their strategies."],[299.28,304.38,"Thanks to neuroplasticity, improvement is possible at every age and stage of life."],[305.68,308.4,"Quiz time! Choose the correct answer."],[308.7,310.94,"Thinking about your own thinking is blank."],[311.24,317.21,"A, metacognition. B, interleaving. C, neuroplasticity."],[321.22,324.26,"The answer is A: metacognition."],[325.75,327.74,"This is the book blank I told you."],[328.04,331.71,"A, which. B, about which. C, of whom."],[335.72,338.75,"The answer is B: about which."],[340.25,343.68,"The researcher, blank I worked, was very kind."],[343.98,347.9,"A, with whom. B, with who. C, whom with."],[351.88,354.48,"The answer is A: with whom."],[355.98,359.56,"Learning by recalling information from memory is blank."],[359.86,366.78,"A, retrieval practice. B, spaced repetition. C, cognitive load."],[370.78,374.34,"The answer is A: retrieval practice."],[375.85,379.9,"According to the text, what consistently outperforms rereading?"],[380.2,385.06,"A, interleaving. B, retrieval practice. C, highlighting."],[389.05,392.23,"The answer is B: retrieval practice."],[393.75,399.63,"Now it's your turn. Part one: How could students in Cambodia study more effectively?"],[404.93,411.32,"Part two: Recommend two techniques, explain the science, and give an example."],[417.62,431.3,"I'd recommend retrieval practice and spaced repetition, both of which are supported by strong evidence. Instead of rereading notes, students could test themselves with flashcards, reviewing them after one day, three days and a week."],[431.6,433.83,"That is a well-argued answer!"],[434.82,440.21,"Great work today! You learned eight new words and advanced relative clauses (extended)."],[440.51,444.57,"Today's value is pride in learning. Be proud of what you learned."],[444.87,448.5,"See you in Unit thirty-five. Goodbye!"],[448.81,452.54,"Thank you, Ms. Sarah! Bye, everyone!"]],"OC-Advanced-Unit35-Ageing-Societies":[[0.35,5.32,"Hello, everyone! I'm Ms. Sarah. Welcome to Online Advanced."],[5.62,8.87,"Hi! I'm Rithy. Let's learn together!"],[9.17,18.08,"Unit thirty-five: Ageing Societies. In this unit, you will discuss the challenges and opportunities of ageing populations."],[19.08,20.51,"ageing population."],[21.21,25.8,"ageing population means a population with a growing proportion of older people."],[26.1,29.41,"Japan has one of the world's oldest ageing populations."],[30.11,33.65,"Your turn. Say: ageing population."],[36.35,37.8,"ageing population."],[38.82,40.33,"dependency ratio."],[41.03,46.76,"dependency ratio means the number of non-working people compared to working people."],[47.05,50.42,"A rising dependency ratio puts pressure on taxes."],[51.12,54.4,"Your turn. Say: dependency ratio."],[57.1,58.56,"dependency ratio."],[59.55,60.97,"retirement age."],[61.67,66.92,"retirement age means the age at which people usually stop working."],[67.22,70.31,"Several countries are raising the retirement age."],[71.01,74.09,"Your turn. Say: retirement age."],[76.79,78.2,"retirement age."],[79.18,80.49,"pension crisis."],[81.19,86.56,"pension crisis means a situation where pension funds cannot pay future retirees."],[86.86,89.69,"Economists warn of a coming pension crisis."],[90.39,93.2,"Your turn. Say: pension crisis."],[95.9,97.25,"pension crisis."],[98.25,99.41,"elder care."],[100.11,103.18,"elder care means care and support for older people."],[103.48,105.91,"Demand for elder care is rising quickly."],[106.61,109.69,"Your turn. Say: elder care."],[112.39,113.43,"elder care."],[114.42,115.72,"longevity."],[116.42,118.49,"longevity means long life."],[118.79,121.46,"Healthy diets contribute to longevity."],[122.16,125.37,"Your turn. Say: longevity."],[128.07,129.25,"longevity."],[130.25,132.52,"intergenerational solidarity."],[133.22,139.43,"intergenerational solidarity means support and cooperation between young and old."],[139.73,144.69,"Family meals encourage intergenerational solidarity."],[145.39,149.55,"Your turn. Say: intergenerational solidarity."],[152.25,154.39,"intergenerational solidarity."],[155.38,156.63,"silver economy."],[157.33,161.69,"silver economy means products and services designed for older people."],[161.99,165.73,"The silver economy creates new business opportunities."],[166.43,169.84,"Your turn. Say: silver economy."],[172.54,173.97,"silver economy."],[174.98,177.31,"Now let's listen to a conversation."],[177.61,182.31,"Rithy, did you know Cambodia is one of the youngest countries in Asia?"],[183.62,188.01,"Yes, but a report I read warned that this would change within a few decades."],[189.32,194.45,"It will. Japan and Korea have already reached very high dependency ratios."],[195.75,200.03,"Economists there admitted having underestimated the pension crisis."],[201.32,205.01,"And governments have urged citizens to save more for retirement."],[206.32,211.31,"My grandmother insists that families, not governments, should care for the elderly."],[212.62,217.73,"That's a strong tradition here. Intergenerational solidarity is valuable."],[219.02,224.2,"Still, as cities grow, professional elder care will be needed too."],[225.48,229.77,"Grammar focus: Reported speech with nuance (extended)."],[230.07,233.05,"Reporting verbs carry meaning about attitude."],[233.34,239.62,"A report warned that this would change. Economists admitted having underestimated the crisis."],[239.92,243.99,"Concede suggests reluctance, and claim suggests some doubt."],[244.29,251.86,"Choose reporting verbs carefully: 'concede' suggests reluctance, 'claim' suggests doubt, 'reveal' suggests surprise."],[252.85,255.8,"Now read and listen. The Grey Revolution."],[256.1,259.42,"People around the world are living longer than ever before."],[260.72,265.85,"Longevity is a remarkable achievement, but it also creates economic challenges."],[267.15,272.13,"In many developed countries, the dependency ratio is rising rapidly."],[273.42,277.75,"Governments have warned that pension systems may become unsustainable."],[279.05,283.29,"Several have raised the retirement age, despite public protests."],[284.58,289.16,"Demand for elder care is growing, while fewer young workers are available."],[290.45,297.43,"At the same time, the silver economy is creating new markets in health, tourism and technology."],[298.72,304.19,"Experts insist that intergenerational solidarity will be essential for the future."],[305.48,308.35,"Quiz time! Choose the correct answer."],[308.64,313.06,"The number of non-working people compared to workers is the blank."],[313.36,319.3,"A, dependency ratio. B, retirement age. C, silver economy."],[323.28,326.2,"The answer is A: dependency ratio."],[327.72,330.18,"The minister blank that taxes might rise."],[330.48,334.59,"A, warned. B, told. C, said us."],[338.58,340.37,"The answer is A: warned."],[341.88,343.73,"He admitted blank the mistake."],[344.03,347.73,"A, to make. B, having made. C, make."],[351.72,354.41,"The answer is B: having made."],[355.92,357.51,"Long life is blank."],[357.81,362.22,"A, longevity. B, elder care. C, pension crisis."],[366.22,369.02,"The answer is A: longevity."],[370.52,374.21,"According to the text, what is the silver economy creating?"],[374.51,379.3,"A, new markets. B, higher taxes. C, fewer jobs."],[383.32,386.25,"The answer is A: new markets."],[387.75,393.15,"Now it's your turn. Part one: Who should be responsible for caring for older people?"],[398.45,404.28,"Part two: Report one view you disagree with, then give your position and two reasons."],[410.58,422.85,"Some people insist that families alone should care for the elderly. I'd concede that family care is valuable, but I believe the state must help too, because families are smaller and many young people work far from home."],[423.15,425.88,"That is a well-argued answer!"],[426.88,433.0,"Great work today! You learned eight new words and reported speech with nuance (extended)."],[433.3,436.62,"Today's value is kindness. Be kind to everyone."],[436.92,440.53,"See you in Unit thirty-six. Goodbye!"],[440.83,443.99,"Thank you, Ms. Sarah! Bye, everyone!"]],"OC-Advanced-Unit36-Misinformation-and-Society":[[0.35,5.05,"Hello, everyone! I'm Ms. Sarah. Welcome to Online Advanced."],[5.35,8.54,"Hi! I'm Rithy. Let's learn together!"],[8.84,18.82,"Unit thirty-six: Misinformation and Society. In this unit, you will analyse how false information spreads and how to counter it."],[19.82,21.61,"disinformation campaign."],[22.31,28.05,"disinformation campaign means an organised effort to spread false information deliberately."],[28.34,31.47,"The disinformation campaign targeted voters online."],[32.17,36.37,"Your turn. Say: disinformation campaign."],[39.07,40.77,"disinformation campaign."],[41.75,43.34,"conspiracy theory."],[44.04,49.8,"conspiracy theory mea
