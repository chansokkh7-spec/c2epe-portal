otifications?"],[190.25,195.32,"Exactly. In other words, persuasive design keeps you hooked."],[196.62,200.09,"Still, I enjoy social media. It isn't all bad."],[201.38,206.89,"Of course. Nevertheless, engagement metrics reward outrage more than truth."],[208.18,209.53,"So what should I do?"],[210.82,216.27,"To begin with, turn off non-essential notifications. Then, set clear time limits."],[217.58,220.25,"Grammar focus: Discourse markers."],[220.55,223.89,"Discourse markers organise your ideas and guide the listener."],[224.19,229.14,"Moreover adds, nevertheless contrasts, and in other words clarifies."],[229.44,236.84,"For example: Moreover, the design is deliberate. Nevertheless, social media can be useful."],[237.14,242.19,"Discourse markers guide your listener through an argument; avoid overusing the same one."],[243.18,246.57,"Now read and listen. Your Attention Is for Sale."],[246.87,249.7,"Many of the most popular apps are free to use."],[251.02,255.78,"However, as the saying goes, if you are not paying, you are the product."],[257.08,262.93,"In the attention economy, companies earn money by keeping us online for as long as possible."],[264.22,270.19,"To achieve this, designers use features such as infinite scroll and unpredictable rewards."],[271.48,277.14,"Moreover, engagement metrics tend to favour emotional and controversial content."],[278.45,284.27,"Each notification triggers a small release of dopamine, which keeps us checking our phones."],[285.58,291.48,"Nevertheless, users are not powerless; digital wellbeing tools can help us regain control."],[292.78,297.31,"In other words, attention is a resource, and we can choose how to spend it."],[298.62,301.47,"Quiz time! Choose the correct answer."],[301.77,305.07,"A brain chemical linked to pleasure and reward is blank."],[305.37,310.53,"A, dopamine. B, clickstream. C, engagement metric."],[314.52,316.95,"The answer is A: dopamine."],[318.45,321.63,"The app is free. blank, it collects a lot of data."],[321.93,325.96,"A, Moreover. B, Nevertheless. C, In other words."],[329.95,332.82,"The answer is B: Nevertheless."],[334.32,337.66,"The task is hard. blank, it requires patience."],[337.96,342.7,"A, In other words. B, Nevertheless. C, Still."],[346.68,348.9,"The answer is A: In other words."],[350.42,353.61,"Tiredness caused by constant alerts is blank."],[353.91,360.22,"A, digital wellbeing. B, notification fatigue. C, persuasive design."],[364.22,367.21,"The answer is B: notification fatigue."],[368.72,372.82,"According to the text, engagement metrics tend to favour blank."],[373.12,378.98,"A, calm content. B, emotional and controversial content. C, long articles."],[382.98,387.86,"The answer is B: emotional and controversial content."],[389.35,394.77,"Now it's your turn. Part one: Do tech companies have too much control over our attention?"],[400.07,406.11,"Part two: Use at least three discourse markers to give your view, reasons and a solution."],[412.4,425.99,"To begin with, I believe they do. Moreover, their designs exploit our psychology. Nevertheless, users can take back control: in other words, we should turn off notifications and set daily limits."],[426.29,429.11,"That is a well-argued answer!"],[430.12,434.41,"Great work today! You learned eight new words and discourse markers."],[434.71,438.32,"Today's value is good habits. Do good things every day."],[438.62,441.37,"See you in Unit eleven. Goodbye!"],[441.67,444.49,"Thank you, Ms. Sarah! Bye, everyone!"]],"OC-Advanced-Unit11-Education-Reform":[[0.35,5.58,"Hello, everyone! I'm Ms. Sarah. Welcome to Online Advanced."],[5.88,9.01,"Hi! I'm Rithy. Let's learn together!"],[9.31,16.45,"Unit eleven: Education Reform. In this unit, you will discuss how education systems should change."],[17.45,18.43,"pedagogy."],[19.13,22.52,"pedagogy means the method and practice of teaching."],[22.82,25.97,"Modern pedagogy focuses on active learning."],[26.67,29.98,"Your turn. Say: pedagogy."],[32.68,33.75,"pedagogy."],[34.75,36.42,"standardised testing."],[37.12,42.0,"standardised testing means the same exam given to all students to compare results."],[42.3,45.46,"Critics say standardised testing narrows the curriculum."],[46.16,49.94,"Your turn. Say: standardised testing."],[52.64,54.28,"standardised testing."],[55.28,56.94,"holistic education."],[57.63,63.74,"holistic education means education that develops the whole person, not only academic skills."],[64.04,67.77,"Holistic education includes arts, sport and character."],[68.47,72.16,"Your turn. Say: holistic education."],[74.86,76.35,"holistic education."],[77.35,78.75,"curriculum reform."],[79.45,82.99,"curriculum reform means changes to what is taught in schools."],[83.29,86.37,"The curriculum reform introduced coding lessons."],[87.07,90.65,"Your turn. Say: curriculum reform."],[93.35,94.66,"curriculum reform."],[95.65,97.72,"inquiry-based learning."],[98.42,103.48,"inquiry-based learning means learning by asking questions and investigating."],[103.78,106.84,"Inquiry-based learning makes students more curious."],[107.54,111.86,"Your turn. Say: inquiry-based learning."],[114.56,116.24,"inquiry-based learning."],[117.25,118.6,"rote memorisation."],[119.3,124.07,"rote memorisation means learning by repeating information without understanding."],[124.37,128.01,"Rote memorisation helps in exams but not in life."],[128.71,131.94,"Your turn. Say: rote memorisation."],[134.64,135.97,"rote memorisation."],[136.98,138.67,"educational equity."],[139.37,144.57,"educational equity means fair access to quality education for all students."],[144.87,148.32,"Educational equity requires support for rural schools."],[149.02,152.57,"Your turn. Say: educational equity."],[155.27,156.84,"educational equity."],[157.85,159.03,"teacher training."],[159.72,163.77,"teacher training means programmes that prepare and develop teachers."],[164.07,167.22,"Better teacher training improves learning outcomes."],[167.92,171.17,"Your turn. Say: teacher training."],[173.87,175.05,"teacher training."],[176.05,178.22,"Now let's listen to a conversation."],[178.52,183.7,"Rithy, if you could change one thing about education in Cambodia, what would it be?"],[185.02,189.82,"The reliance on rote memorisation. The introduction of inquiry-based learning would help."],[191.12,195.14,"But standardised testing still rewards memorisation, doesn't it?"],[196.45,201.09,"Exactly. Any curriculum reform needs a change in assessment too."],[202.38,204.49,"What about educational equity?"],[205.78,210.61,"The improvement of rural schools should be a priority. The gap is enormous."],[211.92,213.22,"And teacher training?"],[214.52,219.26,"Absolutely. The success of any reform depends on the quality of teachers."],[220.55,223.04,"Grammar focus: Nominalisation."],[223.34,227.12,"Nominalisation means turning verbs or adjectives into nouns."],[227.43,232.06,"Introduce becomes the introduction of; improve becomes the improvement of."],[232.36,235.58,"It makes academic writing more formal and concise."],[235.88,241.81,"Nominalisation makes writing more formal and lets you pack more information into the subject."],[242.82,246.38,"Now read and listen. Learning for the Real World."],[246.68,251.01,"Across Asia, education systems are under pressure to change."],[252.32,257.71,"For decades, success was measured mainly through standardised testing and rote memorisation."],[259.02,265.4,"However, employers increasingly demand creativity, communication and problem-solving."],[266.72,274.3,"The introduction of inquiry-based learning encourages students to ask questions rather than repeat answers."],[275.62,282.27,"Holistic education also places greater emphasis on wellbeing, arts and character."],[283.58,289.38,"Yet the implementation of reforms is often slow, especially in rural areas."],[290.68,296.51,"Educational equity requires investment in teacher training and school resources."],[297.82,303.95,"Ultimately, the transformation of education depends on teachers more than on policies."],[305.25,308.02,"Quiz time! Choose the correct answer."],[308.32,310.98,"The method and practice of teaching is blank."],[311.28,316.56,"A, pedagogy. B, curriculum reform. C, rote memorisation."],[320.55,323.33,"The answer is A: pedagogy."],[324.82,326.84,"The noun form of 'improve' is blank."],[327.14,331.78,"A, improving. B, improvement. C, improver."],[335.78,338.18,"The answer is B: improvement."],[339.68,343.53,"'They developed the city quickly' → 'The rapid blank of the city...'"],[343.83,348.17,"A, develop. B, development. C, developed."],[352.18,354.29,"The answer is B: development."],[355.78,359.05,"Fair access to quality education for all is blank."],[359.35,364.95,"A, educational equity. B, standardised testing. C, teacher training."],[368.95,372.08,"The answer is A: educational equity."],[373.58,377.56,"According to the text, employers increasingly demand blank."],[377.86,384.88,"A, memorisation. B, creativity and problem-solving. C, exam scores."],[388.88,392.42,"The answer is B: creativity and problem-solving."],[393.92,399.34,"Now it's your turn. Part one: What is the most important reform for schools in Cambodia?"],[404.64,410.8,"Part two: Use nominalisation to present your proposal, two benefits and one challenge."],[417.1,428.68,"In my opinion, the introduction of inquiry-based learning is essential. Its benefits include greater curiosity and stronger problem-solving. The main challenge is the training of enough teachers."],[428.98,430.73,"That is a well-argued answer!"],[431.72,436.14,"Great work today! You learned eight new words and nominalisation."],[436.44,439.99,"Today's value is pride in learning. Be proud of what you learned."],[440.29,442.97,"See you in Unit twelve. Goodbye!"],[443.27,446.07,"Thank you, Ms. Sarah! Bye, everyone!"]],"OC-Advanced-Unit12-Migration":[[0.35,4.91,"Hello, everyone! I'm Ms. Sarah. Welcome to Online Advanced."],[5.21,8.32,"Hi! I'm Rithy. Let's learn together!"],[8.62,14.76,"Unit twelve: Migration. In this unit, you will discuss the causes and effects of migration."],[15.75,17.33,"economic migrant."],[18.03,22.53,"economic migrant means a person who moves to another country to find work."],[22.83,26.2,"Many economic migrants from Cambodia work in Thailand."],[26.9,30.22,"Your turn. Say: economic migrant."],[32.92,34.41,"economic migrant."],[35.42,36.52,"remittance."],[37.22,40.82,"remittance means money sent home by people working abroad."],[41.12,44.06,"Remittances support thousands of rural families."],[44.76,48.21,"Your turn. Say: remittance."],[50.91,51.86,"remittance."],[52.85,53.98,"brain drain."],[54.68,57.98,"brain drain means the emigration of highly skilled people."],[58.28,61.45,"The brain drain has left hospitals short of doctors."],[62.15,64.51,"Your turn. Say: brain drain."],[67.21,68.14,"brain drain."],[69.15,70.58,"asylum seeker."],[71.28,76.1,"asylum seeker means a person who asks for protection in another country."],[76.4,79.41,"The asylum seeker waited two years for a decision."],[80.11,83.82,"Your turn. Say: asylum seeker."],[86.52,87.88,"asylum seeker."],[88.88,90.52,"integration policy."],[91.22,95.99,"integration policy means government plans to help migrants join society."],[96.29,99.5,"Language classes are part of the integration policy."],[100.2,103.91,"Your turn. Say: integration policy."],[106.61,108.4,"integration policy."],[109.42,110.63,"border control."],[111.33,115.5,"border control means checks on people and goods entering a country."],[115.8,119.5,"Border control has become stricter since the pandemic."],[120.2,123.36,"Your turn. Say: border control."],[126.06,127.33,"border control."],[128.35,129.7,"labour migration."],[130.4,133.68,"labour migration means moving abroad for employment."],[133.98,139.1,"Labour migration to South Korea is popular among young Cambodians."],[139.8,143.08,"Your turn. Say: labour migration."],[145.78,147.12,"labour migration."],[148.12,149.37,"undocumented."],[150.07,154.77,"undocumented means without official permission to live or work in a country."],[155.07,158.33,"Undocumented workers often face exploitation."],[159.03,162.45,"Your turn. Say: undocumented."],[165.15,166.28,"undocumented."],[167.28,169.47,"Now let's listen to a conversation."],[169.77,173.81,"My uncle works in Korea. He sends remittances every month."],[175.12,177.99,"Many families do. Does he want to come back?"],[179.28,182.71,"He hopes to, eventually. My aunt doesn't, though."],[184.02,187.35,"Labour migration brings income, but also costs."],[188.65,190.27,"Such as the brain drain?"],[191.55,195.92,"That's one. Skilled workers leave, and fewer return than expected."],[197.22,199.12,"And undocumented workers?"],[200.42,206.57,"They're at greater risk. Fair integration policies could help, and so could safer legal routes."],[207.88,211.74,"Grammar focus: Ellipsis and substitution."],[212.04,215.91,"Ellipsis means leaving out words that are already understood."],[216.21,221.2,"Substitution replaces them with words like so, do, one or that."],[221.5,226.41,"For example: Does he want to come back? He hopes to. My aunt doesn't, though."],[226.71,232.36,"Ellipsis and substitution avoid repetition and make speech sound natural and fluent."],[233.35,237.09,"Now read and listen. Leaving Home to Support Home."],[237.39,240.9,"Over one million Cambodians are estimated to work abroad."],[242.22,248.01,"Most are economic migrants seeking better wages in Thailand, Korea or Malaysia."],[249.32,254.65,"The remittances they send home pay for school fees, healthcare and new houses."],[255.95,260.21,"Some migrants return with savings and skills; others never do."],[261.52,266.89,"Highly educated migrants are less likely to return, which contributes to brain drain."],[268.18,274.04,"Undocumented workers face particular risks, including low pay and unsafe conditions."],[275.35,280.38,"Governments on both sides are trying to create safer, legal migration routes."],[281.68,286.69,"Migration, then, is neither simply good nor simply bad; it is both."],[287.98,290.64,"Quiz time! Choose the correct answer."],[290.94,293.94,"Money sent home by people working abroad is blank."],[294.25,299.01,"A, remittance. B, border control. C, brain drain."],[303.02,305.79,"The answer is A: remittance."],[307.28,310.03,"'Are you coming tonight?' 'I hope blank.'"],[310.33,313.07,"A, it. B, so. C, that."],[317.08,319.21,"The answer is B: so."],[320.72,323.49,"She likes coffee, and blank her brother."],[323.79,328.18,"A, so does. B, so is. C, does so."],[332.18,334.59,"The answer is A: so does."],[336.08,339.03,"The emigration of highly skilled people is blank."],[339.33,344.64,"A, labour migration. B, brain drain. C, integration policy."],[348.65,351.09,"The answer is B: brain drain."],[352.58,356.02,"According to the text, who is less likely to return?"],[356.32,361.57,"A, undocumented workers. B, highly educated migrants. C, farmers."],[365.55,368.91,"The answer is B: highly educated migrants."],[370.42,375.98,"Now it's your turn. Part one: Is labour migration good or bad for Cambodia?"],[381.28,387.54,"Part two: Weigh up two benefits and two drawbacks, then give your conclusion."],[393.84,409.56,"It brings real benefits: remittances reduce poverty, and returning workers bring skills. However, families are separated, and skilled people may not return. Overall, I think it helps, but only if migration is safe and legal."],[409.86,412.28,"That is a well-argued answer!"],[413.28,418.68,"Great work today! You learned eight new words and ellipsis and substitution."],[418.98,422.71,"Today's value is empathy. Think about how others feel."],[423.01,426.06,"See you in Unit thirteen. Goodbye!"],[426.36,428.96,"Thank you, Ms. Sarah! Bye, everyone!"]],"OC-Advanced-Unit13-Science-Communication":[[0.35,4.63,"Hello, everyone! I'm Ms. Sarah. Welcome to Online Advanced."],[4.93,7.96,"Hi! I'm Rithy. Let's learn together!"],[8.26,15.58,"Unit thirteen: Science Communication. In this unit, you will discuss how science is explained to the public."],[16.58,18.4,"scientific consensus."],[19.1,24.57,"scientific consensus means general agreement among scientists based on evidence."],[24.87,28.33,"There is a strong scientific consensus on climate change."],[29.03,32.52,"Your turn. Say: scientific consensus."],[35.22,37.09,"scientific consensus."],[38.08,39.54,"misinterpretation."],[40.24,43.83,"misinterpretation means understanding information wrongly."],[44.13,47.55,"Headlines often lead to misinterpretation of research."],[48.26,51.67,"Your turn. Say: misinterpretation."],[54.37,55.79,"misinterpretation."],[56.78,58.33,"popular science."],[59.03,62.89,"popular science means science explained for a general audience."],[63.19,66.59,"Popular science books made physics exciting for me."],[67.29,70.48,"Your turn. Say: popular science."],[73.18,74.53,"popular science."],[75.52,76.39,"jargon."],[77.09,82.31,"jargon means special words used by experts that others find hard to understand."],[82.61,84.71,"The report was full of medical jargon."],[85.41,88.05,"Your turn. Say: jargon."],[90.75,91.52,"jargon."],[92.52,94.11,"data visualisation."],[94.81,99.64,"data visualisation means showing information as charts, maps or graphics."],[99.94,103.1,"Good data visualisation makes complex trends clear."],[103.8,106.81,"Your turn. Say: data visualisation."],[109.52,111.03,"data visualisation."],[112.02,113.17,"uncertainty."],[113.87,119.7,"uncertainty means not being completely sure; the range of possible results."],[120.0,123.73,"Scientists always report the uncertainty in their results."],[124.43,127.27,"Your turn. Say: uncertainty."],[129.97,130.94,"uncertainty."],[131.95,133.73,"replication crisis."],[134.43,139.73,"replication crisis means the problem that many studies cannot be repeated with the same results."],[140.03,143.05,"The replication crisis has shaken psychology."],[143.75,147.41,"Your turn. Say: replication crisis."],[150.11,151.84,"replication crisis."],[152.85,154.07,"public trust."],[154.77,159.64,"public trust means the confidence people have in institutions or experts."],[159.94,163.32,"Clear communication helps build public trust in science."],[164.02,167.24,"Your turn. Say: public trust."],[169.94,171.06,"public trust."],[172.05,174.18,"Now let's listen to a conversation."],[174.48,178.43,"Rithy, why do so many people distrust science these days?"],[179.72,185.32,"Jargon, mainly. Scientists often speak in a language nobody else understands."],[186.62,191.25,"That's part of it. Uncertainty, too, is often misunderstood."],[192.55,196.48,"Yes. When a study says 'probably', the media report 'definitely'."],[197.78,202.75,"Exactly. Much more damaging, though, is the replication crisis."],[204.05,207.69,"Really? I thought that only affected a few fields."],[208.98,214.96,"It has affected several. Still, the scientific consensus on major issues remains strong."],[216.25,221.23,"What we need, then, is better popular science and clearer data visualisation."],[222.52,225.49,"Grammar focus: Fronting for emphasis."],[225.79,229.64,"Fronting means moving a part of the sentence to the front for emphasis."],[229.94,236.47,"Uncertainty, too, is often misunderstood. Much more damaging is the replication crisis."],[236.77,241.09,"After a fronted adjective phrase, the verb comes before the subject."],[241.39,248.11,"Fronting highlights contrast or new information; it is common in persuasive speech and writing."],[249.12,254.89,"Now read and listen. Lost in Translation: Science and the Public."],[255.19,260.48,"Science shapes decisions about health, energy and the environment."],[261.78,267.45,"Yet many people find scientific information confusing or even suspicious."],[268.75,273.84,"Part of the problem is jargon, which excludes non-experts from the conversation."],[275.15,279.4,"Equally important is the way uncertainty is communicated."],[280.72,286.12,"Scientists use words like 'likely' carefully, but headlines often turn them into certainties."],[287.42,292.25,"The replication crisis has also given critics reasons to doubt research."],[293.55,300.43,"Clear data visualisation and honest explanations of uncertainty can rebuild public trust."],[301.72,304.73,"Good science, in short, needs good storytellers."],[306.02,308.69,"Quiz time! Choose the correct answer."],[308.99,312.11,"Special words used by experts are blank."],[312.41,316.85,"A, jargon. B, uncertainty. C, consensus."],[320.85,323.11,"The answer is A: jargon."],[324.62,326.42,"Which sentence uses fronting?"],[326.72,333.6,"A, The results were surprising.. B, Surprising were the results.. C, The results surprised us.."],[337.58,340.69,"The answer is B: Surprising were the results.."],[342.18,345.2,"Much more important blank the quality of the data."],[345.5,348.69,"A, is. B, are. C, be."],[352.68,354.8,"The answer is A: is."],[356.28,359.83,"The problem that many studies cannot be repeated is the blank."],[360.13,365.38,"A, replication crisis. B, public trust. C, popular science."],[369.38,372.73,"The answer is A: replication crisis."],[374.22,377.77,"According to the text, what can rebuild public trust?"],[378.07,384.93,"A, more jargon. B, clear data visualisation and honesty. C, fewer studies."],[388.92,393.03,"The answer is B: clear data visualisation and honesty."],[394.52,400.88,"Now it's your turn. Part one: How can scientists communicate more effectively with the public?"],[406.18,412.38,"Part two: Use fronting at least once: propose two strategies and give an example."],[418.68,432.35,"Most important of all is avoiding jargon. Simple language and clear visuals would help enormously. During the pandemic, for example, simple charts explained the spread of the virus better than long reports."],[432.65,435.01,"That is a well-argued answer!"],[436.02,441.03,"Great work today! You learned eight new words and fronting for emphasis."],[441.33,445.46,"Today's value is honesty. Always tell the truth."],[445.76,448.66,"See you in Unit fourteen. Goodbye!"],[448.96,451.65,"Thank you, Ms. Sarah! Bye, everyone!"]],"OC-Advanced-Unit14-Art-and-Society":[[0.35,5.13,"Hello, everyone! I'm Ms. Sarah. Welcome to Online Advanced."],[5.43,8.43,"Hi! I'm Rithy. Let's learn together!"],[8.73,16.86,"Unit fourteen: Art and Society. In this unit, you will discuss the role and value of art in society."],[17.85,19.41,"censorship of art."],[20.11,24.77,"censorship of art means banning or controlling artworks considered offensive."],[25.07,29.06,"Censorship of art has a long and controversial history."],[29.76,33.26,"Your turn. Say: censorship of art."],[35.96,37.65,"censorship of art."],[38.65,39.73,"public art."],[40.43,44.14,"public art means art placed in public spaces for everyone."],[44.44,47.24,"Public art can transform a neglected street."],[47.94,51.08,"Your turn. Say: public art."],[53.78,54.73,"public art."],[55.75,57.11,"cultural value."],[57.81,62.48,"cultural value means the importance of something to a society's culture."],[62.78,66.23,"Traditional dance has enormous cultural value."],[66.93,69.77,"Your turn. Say: cultural value."],[72.47,73.81,"cultural value."],[74.82,75.81,"patronage."],[76.51,79.83,"patronage means financial support given to artists."],[80.13,83.69,"Royal patronage supported Khmer artists for centuries."],[84.39,87.01,"Your turn. Say: patronage."],[89.71,90.56,"patronage."],[91.55,92.84,"commodification."],[93.54,98.07,"commodification means turning something into a product to be bought and sold."],[98.37,101.29,"Critics worry about the commodification of culture."],[101.99,105.47,"Your turn. Say: commodification."],[108.16,109.39,"commodification."],[110.38,111.42,"street art."],[112.12,116.71,"street art means art painted on public walls, often without permission."],[117.01,120.61,"Street art in Phnom Penh tells stories about modern life."],[121.31,124.53,"Your turn. Say: street art."],[127.23,128.44,"street art."],[129.45,130.97,"cultural institution."],[131.67,137.52,"cultural institution means an organisation such as a museum, theatre or library."],[137.82,141.13,"The National Museum is a key cultural institution."],[141.83,145.14,"Your turn. Say: cultural institution."],[147.84,149.39,"cultural institution."],[150.38,151.49,"art market."],[152.19,155.16,"art market means the buying and selling of artworks."],[155.46,158.54,"The global art market is worth billions of dollars."],[159.24,161.58,"Your turn. Say: art market."],[164.28,165.27,"art market."],[166.28,168.43,"Now let's listen to a conversation."],[168.73,173.12,"Ms. Sarah, is street art really art, or just graffiti?"],[174.42,180.4,"That depends on whom you ask. Many artists whose work began on walls now exhibit in galleries."],[181.72,184.83,"So the art market eventually accepts it?"],[186.12,189.94,"Often, yes, which raises questions about commodification."],[191.25,193.33,"And what about censorship of art?"],[194.62,199.15,"Every society draws lines, some of which are hard to justify."],[200.45,202.59,"Who should decide what is acceptable?"],[203.88,209.49,"Ideally, cultural institutions in which artists and the public both have a voice."],[210.78,214.25,"Grammar focus: Advanced relative clauses."],[214.55,220.89,"Advanced relative clauses include whom after prepositions and quantifiers with of which or of whom."],[221.19,226.89,"It depends on whom you ask. Every society draws lines, some of which are hard to justify."],[227.19,228.63,"Whose shows possession."],[228.94,235.08,"Use 'whom' after prepositions and in formal writing; use 'of which / of whom' after quantifiers."],[236.08,238.84,"Now read and listen. Who Is Art For?."],[239.14,242.84,"Art has always reflected the societies in which it is created."],[244.15,250.41,"For centuries, artists depended on patronage from kings, temples and wealthy families."],[251.72,257.8,"Today, the global art market, much of which is controlled by a few collectors, sets high prices."],[259.12,264.1,"Critics argue that this commodification turns culture into a luxury product."],[265.38,270.74,"In contrast, public art and street art are free for anyone to enjoy."],[272.05,278.04,"Many street artists, some of whom started illegally, are now invited to paint city walls."],[279.35,284.46,"Censorship of art remains a sensitive issue in many countries."],[285.75,291.95,"Ultimately, art is valuable not because of its price, but because of the conversations it starts."],[293.25,295.88,"Quiz time! Choose the correct answer."],[296.18,298.85,"Financial support given to artists is blank."],[299.15,304.18,"A, patronage. B, censorship. C, commodification."],[308.18,310.75,"The answer is A: patronage."],[312.25,316.1,"The students, most of blank were tired, finished the test."],[316.4,320.25,"A, who. B, whom. C, which."],[324.25,326.41,"The answer is B: whom."],[327.92,330.96,"There are many museums, some of blank are free."],[331.26,334.07,"A, whom. B, which. C, that."],[338.08,340.35,"The answer is B: which."],[341.85,344.64,"Turning culture into a product to sell is blank."],[344.94,349.71,"A, commodification. B, cultural value. C, public art."],[353.72,356.27,"The answer is A: commodification."],[357.78,361.2,"According to the text, why is art valuable?"],[361.5,366.62,"A, its price. B, the conversations it starts. C, its age."],[370.62,374.16,"The answer is B: the conversations it starts."],[375.65,380.71,"Now it's your turn. Part one: Should governments fund the arts with public money?"],[386.01,392.13,"Part two: Give your position, two reasons and one example from Cambodia."],[398.43,410.76,"I believe they should. Art strengthens identity and creates jobs. For example, Cambodian classical dance, which almost disappeared, survived thanks to public and international support."],[411.06,413.78,"That is a well-argued answer!"],[414.78,420.29,"Great work today! You learned eight new words and advanced relative clauses."],[420.59,425.04,"Today's value is creativity. Use your imagination when you play."],[425.34,428.05,"See you in Unit fifteen. Goodbye!"],[428.35,430.96,"Thank you, Ms. Sarah! Bye, everyone!"]],"OC-Advanced-Unit15-Corporate-Power":[[0.35,5.04,"Hello, everyone! I'm Ms. Sarah. Welcome to Online Advanced."],[5.34,8.63,"Hi! I'm Rithy. Let's learn together!"],[8.93,15.54,"Unit fifteen: Corporate Power. In this unit, you will discuss the influence of large companies."],[16.55,17.98,"market dominance."],[18.68,23.08,"market dominance means control of most of a market by one company."],[23.38,26.34,"The company's market dominance worries regulators."],[27.04,30.27,"Your turn. Say: market dominance."],[32.97,34.32,"market dominance."],[35.32,36.48,"antitrust."],[37.18,42.0,"antitrust means related to laws that prevent unfair business monopolies."],[42.3,45.6,"The government launched an antitrust investigation."],[46.3,49.35,"Your turn. Say: antitrust."],[52.05,53.22,"antitrust."],[54.22,55.57,"shareholder value."],[56.27,60.68,"shareholder value means profit and returns for the owners of company shares."],[60.98,65.2,"Some CEOs focus only on shareholder value."],[65.9,69.21,"Your turn. Say: shareholder value."],[71.91,73.26,"shareholder value."],[74.25,76.04,"corporate tax avoidance."],[76.74,81.57,"corporate tax avoidance means legal methods companies use to pay less tax."],[81.87,85.25,"Corporate tax avoidance costs governments billions."],[85.95,89.65,"Your turn. Say: corporate tax avoidance."],[92.35,93.98,"corporate tax avoidance."],[94.98,96.17,"conglomerate."],[96.87,102.18,"conglomerate means a large company made up of many different businesses."],[102.48,106.68,"The conglomerate owns banks, hotels and TV channels."],[107.38,110.5,"Your turn. Say: conglomerate."],[113.2,114.32,"conglomerate."],[115.32,116.16,"merger."],[116.85,119.78,"merger means when two companies join to become one."],[120.08,122.77,"The merger created the country's largest bank."],[123.47,126.68,"Your turn. Say: merger."],[129.38,130.1,"merger."],[131.12,132.65,"regulatory capture."],[133.35,139.81,"regulatory capture means when regulators serve the industry they are supposed to control."],[140.11,143.63,"Critics accuse the agency of regulatory capture."],[144.33,147.62,"Your turn. Say: regulatory capture."],[150.32,151.88,"regulatory capture."],[152.88,154.12,"supply chain."],[154.82,159.72,"supply chain means all the steps and companies involved in making a product."],[160.02,162.87,"The pandemic disrupted global supply chains."],[163.57,167.16,"Your turn. Say: supply chain."],[169.86,171.2,"supply chain."],[172.18,174.39,"Now let's listen to a conversation."],[174.69,178.79,"Rithy, did you read about the merger of the two biggest tech companies?"],[180.08,184.88,"Yes. The regulator warned that it would create too much market dominance."],[186.18,189.84,"The CEO insisted that the merger would benefit consumers."],[191.15,195.78,"He would say that, wouldn't he? Critics claimed it was only about shareholder value."],[197.08,199.91,"There were also reports of regulatory capture."],[201.22,206.14,"Apparently, an official admitted having met company lobbyists dozens of times."],[207.45,208.6,"And tax?"],[209.92,215.12,"A journalist revealed that the conglomerate had paid almost no corporate tax for years."],[216.42,219.8,"Grammar focus: Reported speech with nuance."],[220.1,226.39,"At C1, choose reporting verbs that show attitude: insist, warn, claim and reveal."],[226.69,230.89,"Admit and deny can be followed by having plus past participle."],[231.19,235.07,"For example: The official admitted having met lobbyists."],[235.37,240.33,"Choosing a precise reporting verb shows the speaker's attitude without extra words."],[241.32,244.16,"Now read and listen. Too Big to Control?."],[244.46,250.85,"A handful of global companies now influence what billions of people buy, read and watch."],[252.15,255.81,"Supporters claim that large firms create jobs and drive innovation."],[257.12,262.47,"Critics, however, warn that market dominance can lead to higher prices and less choice."],[263.78,269.61,"Investigations have revealed that some conglomerates pay very little tax through complex structures."],[270.92,275.14,"Antitrust authorities have the power to block mergers, but they rarely do."],[276.45,280.46,"Some economists argue that regulatory capture weakens these authorities."],[281.75,286.4,"Meanwhile, consumers are demanding greater transparency in supply chains."],[287.68,293.27,"The question is no longer whether corporations are powerful, but how that power should be balanced."],[294.58,297.32,"Quiz time! Choose the correct answer."],[297.62,301.11,"When two companies join to become one, it is a blank."],[301.41,306.25,"A, merger. B, supply chain. C, conglomerate."],[310.25,312.48,"The answer is A: merger."],[313.98,316.81,"The manager blank that the report was accurate."],[317.11,321.61,"A, insisted. B, told. C, said us."],[325.62,328.35,"The answer is A: insisted."],[329.85,331.7,"He denied blank the documents."],[332.0,335.83,"A, to take. B, having taken. C, take."],[339.82,342.86,"The answer is B: having taken."],[344.35,347.71,"When regulators serve the industry they control, it is blank."],[348.01,354.82,"A, regulatory capture. B, antitrust. C, shareholder value."],[358.82,361.92,"The answer is A: regulatory capture."],[363.42,366.65,"According to the text, what are consumers demanding?"],[366.95,373.49,"A, lower taxes. B, transparency in supply chains. C, more mergers."],[377.48,381.68,"The answer is B: transparency in supply chains."],[383.18,388.52,"Now it's your turn. Part one: Do large corporations have too much power today?"],[393.82,399.53,"Part two: Report what supporters and critics say, then give your own conclusion."],[405.83,417.4,"Supporters claim that big companies drive innovation, while critics warn that they avoid tax and limit competition. Personally, I'd argue that they need stronger regulation, especially regarding tax and data."],[417.7,420.55,"That is a well-argued answer!"],[421.55,426.36,"Great work today! You learned eight new words and reported speech with nuance."],[426.66,430.67,"Today's value is honesty. Always tell the truth."],[430.97,433.74,"See you in Unit sixteen. Goodbye!"],[434.04,437.3,"Thank you, Ms. Sarah! Bye, everyone!"]],"OC-Advanced-Unit16-Happiness-and-Wellbeing":[[0.35,4.99,"Hello, everyone! I'm Ms. Sarah. Welcome to Online Advanced."],[5.29,8.41,"Hi! I'm Rithy. Let's learn together!"],[8.71,15.69,"Unit sixteen: Happiness and Wellbeing. In this unit, you will explore what makes a good and happy life."],[16.68,18.14,"subjective wellbeing."],[18.84,23.31,"subjective wellbeing means how happy and satisfied people say they feel."],[23.61,26.86,"Surveys measure subjective wellbeing across countries."],[27.56,31.14,"Your turn. Say: subjective wellbeing."],[33.84,35.29,"subjective wellbeing."],[36.28,37.87,"life satisfaction."],[38.56,43.01,"life satisfaction means how good people believe their life is overall."],[43.31,48.0,"Life satisfaction is higher in countries with strong communities."],[48.7,51.95,"Your turn. Say: life satisfaction."],[54.65,56.2,"life satisfaction."],[57.18,58.18,"hedonic."],[58.88,61.74,"hedonic means related to pleasure and enjoyment."],[62.04,64.61,"Eating ice cream gives hedonic pleasure."],[65.31,68.74,"Your turn. Say: hedonic."],[71.44,72.33,"hedonic."],[73.32,74.62,"eudaimonia."],[75.32,81.56,"eudaimonia means a deep happiness that comes from living with purpose and virtue."],[81.86,86.43,"Aristotle believed eudaimonia was the highest human good."],[87.13,89.86,"Your turn. Say: eudaimonia."],[92.56,93.73,"eudaimonia."],[94.72,95.67,"flourishing."],[96.37,100.4,"flourishing means growing and living in a healthy, successful way."],[100.7,103.5,"Education is essential for human flourishing."],[104.2,107.15,"Your turn. Say: flourishing."],[109.85,110.75,"flourishing."],[111.75,112.69,"contentment."],[113.39,116.79,"contentment means a calm feeling of being satisfied."],[117.09,120.23,"My grandmother lives a simple life full of contentment."],[120.94,123.64,"Your turn. Say: contentment."],[126.34,127.35,"contentment."],[128.35,130.48,"positive psychology."],[131.18,136.36,"positive psychology means the study of strengths and what makes life worth living."],[136.66,139.78,"Positive psychology studies gratitude and hope."],[140.48,143.83,"Your turn. Say: positive psychology."],[146.53,148.3,"positive psychology."],[149.28,150.76,"social connection."],[151.46,155.57,"social connection means meaningful relationships with other people."],[155.87,159.28,"Social connection is the strongest predictor of happiness."],[159.98,162.92,"Your turn. Say: social connection."],[165.62,167.06,"social connection."],[168.05,170.34,"Now let's listen to a conversation."],[170.64,174.23,"Ms. Sarah, would you be happier now if you had stayed in America?"],[175.52,181.05,"Not necessarily. If I hadn't come to Cambodia, I wouldn't have found work I love."],[182.35,184.58,"So purpose matters more than pleasure?"],[185.88,191.41,"Psychologists distinguish hedonic happiness from eudaimonia, a deeper sense of meaning."],[192.72,197.03,"My grandfather has very little money, yet he seems more content than anyone."],[198.32,204.94,"That's typical. Research shows social connection matters more than income above a certain level."],[206.25,208.68,"If people knew that, would they work less?"],[209.98,214.57,"Perhaps. If I were younger, I'd certainly spend more time with friends."],[215.88,219.32,"Grammar focus: Mixed conditionals (advanced)."],[219.62,222.27,"Mixed conditionals connect different times."],[222.57,225.97,"If I hadn't come to Cambodia, I wouldn't be so happy now."],[226.26,229.62,"If she were less ambitious, she wouldn't have moved abroad."],[229.92,236.91,"Mixed conditionals let you link imagined pasts and presents precisely, which is useful for reflection and argument."],[237.92,240.93,"Now read and listen. What Really Makes Us Happy?."],[241.23,245.17,"For decades, governments measured success mainly through economic growth."],[246.48,251.44,"Today, many also measure subjective wellbeing and life satisfaction."],[252.75,259.29,"Research suggests that, above a certain income, more money adds surprisingly little happiness."],[260.58,265.57,"Instead, social connection, purpose and health appear to matter most."],[266.85,272.4,"Philosophers distinguish hedonic pleasure from eudaimonia, a deeper kind of fulfilment."],[273.72,278.99,"Positive psychology encourages habits such as gratitude, kindness and mindful attention."],[280.28,285.09,"Bhutan famously measures Gross National Happiness alongside economic data."],[286.38,291.26,"Perhaps flourishing, rather than wealth, should be the true goal of society."],[292.55,295.39,"Quiz time! Choose the correct answer."],[295.69,298.62,"A deep happiness from living with purpose is blank."],[298.92,302.94,"A, eudaimonia. B, hedonic. C, contentment."],[306.95,309.41,"The answer is A: eudaimonia."],[310.92,313.73,"If I had studied medicine, I blank a doctor now."],[314.03,318.24,"A, would be. B, would have been. C, will be."],[322.25,324.76,"The answer is A: would be."],[326.25,329.79,"If he were more careful, he blank the accident yesterday."],[330.09,333.82,"A, wouldn't have had. B, wouldn't have. C, won't have."],[337.82,340.11,"The answer is A: wouldn't have had."],[341.62,344.81,"Meaningful relationships with others are blank."],[345.11,352.37,"A, social connection. B, life satisfaction. C, positive psychology."],[356.35,359.15,"The answer is A: social connection."],[360.65,365.05,"According to the text, which country measures Gross National Happiness?"],[365.35,369.13,"A, Japan. B, Bhutan. C, Cambodia."],[373.15,374.96,"The answer is B: Bhutan."],[376.45,381.39,"Now it's your turn. Part one: What is the secret of a happy life?"],[386.69,393.03,"Part two: Use a mixed conditional, give two factors, and support them with an example."],[399.33,409.37,"I'd say purpose and relationships. If I hadn't joined my volunteer group, I wouldn't feel so connected to my community now. Pleasure fades quickly, but meaning lasts."],[409.67,411.56,"That is a well-argued answer!"],[412.55,417.62,"Great work today! You learned eight new words and mixed conditionals (advanced)."],[417.92,421.51,"Today's value is kindness. Be kind to everyone."],[421.81,424.49,"See you in Unit seventeen. Goodbye!"],[424.79,427.72,"Thank you, Ms. Sarah! Bye, everyone!"]],"OC-Advanced-Unit17-Food-Systems":[[0.35,5.5,"Hello, everyone! I'm Ms. Sarah. Welcome to Online Advanced."],[5.8,8.72,"Hi! I'm Rithy. Let's learn together!"],[9.02,16.77,"Unit seventeen: Food Systems. In this unit, you will analyse how food is produced, traded and shared."],[17.78,19.27,"food sovereignty."],[19.97,25.14,"food sovereignty means the right of communities to control their own food production."],[25.44,28.25,"Farmers' groups campaign for food sovereignty."],[28.95,31.94,"Your turn. Say: food sovereignty."],[34.64,36.06,"food sovereignty."],[37.05,38.26,"agribusiness."],[38.96,43.95,"agribusiness means large-scale commercial farming and food companies."],[44.26,47.72,"Agribusiness controls much of the world's seed supply."],[48.42,51.72,"Your turn. Say: agribusiness."],[54.42,55.69,"agribusiness."],[56.68,57.88,"monoculture."],[58.58,63.1,"monoculture means growing only one crop over a large area."],[63.4,66.49,"Monoculture makes crops vulnerable to disease."],[67.19,69.97,"Your turn. Say: monoculture."],[72.67,73.8,"monoculture."],[74.82,75.98,"food miles."],[76.68,80.41,"food miles means the distance food travels from farm to plate."],[80.71,83.15,"Imported apples have high food miles."],[83.85,87.09,"Your turn. Say: food miles."],[89.8,90.89,"food miles."],[91.88,94.2,"supply chain disruption."],[94.9,100.7,"supply chain disruption means interruption to the flow of goods from producers to consumers."],[101.0,104.05,"The pandemic caused major supply chain disruption."],[104.75,108.36,"Your turn. Say: supply chain disruption."],[111.06,112.97,"supply chain disruption."],[113.98,115.58,"smallholder farmer."],[116.28,120.4,"smallholder farmer means a farmer with a small piece of land."],[120.7,124.24,"Most Cambodian rice is grown by smallholder farmers."],[124.94,129.14,"Your turn. Say: smallholder farmer."],[131.84,133.32,"smallholder farmer."],[134.32,135.7,"food insecurity."],[136.4,140.92,"food insecurity means not having reliable access to enough nutritious food."],[141.22,145.1,"Food insecurity rises when prices suddenly increase."],[145.8,149.69,"Your turn. Say: food insecurity."],[152.4,153.85,"food insecurity."],[154.85,156.21,"lab-grown meat."],[156.91,161.28,"lab-grown meat means meat produced from animal cells in a laboratory."],[161.58,164.53,"Lab-grown meat could reduce emissions from farming."],[165.23,169.16,"Your turn. Say: lab-grown meat."],[171.86,173.16,"lab-grown meat."],[174.15,176.44,"Now let's listen to a conversation."],[176.74,179.88,"Rithy, where does the rice in your local market come from?"],[181.18,185.31,"Mostly from smallholder farmers in Takeo and Battambang."],[186.62,191.5,"That's good for food miles. But agribusiness is expanding fast here, isn't it?"],[192.78,197.87,"Yes, and some companies are pushing monoculture, which raises serious concerns."],[199.18,204.22,"It certainly poses risks. One disease can wipe out an entire harvest."],[205.52,209.77,"The pandemic also showed how fragile global supply chains are."],[211.08,217.38,"Indeed. Supply chain disruption caused a sharp rise in food insecurity worldwide."],[218.68,221.55,"That's why food sovereignty makes so much sense to me."],[222.85,225.38,"Grammar focus: Collocations."],[225.68,228.89,"Collocations are words that naturally go together."],[229.19,235.99,"We say pose a risk, raise concerns and a sharp rise, not make a risk or a fast rise."],[236.28,239.55,"Learning collocations makes your English sound natural."],[239.85,245.11,"Learning words in natural combinations makes your English sound fluent and precise."],[246.12,249.14,"Now read and listen. Who Feeds the World?."],[249.44,253.33,"Smallholder farmers produce around a third of the world's food."],[254.62,257.92,"Yet many of them face food insecurity themselves."],[259.22,265.04,"Over recent decades, agribusiness has grown rapidly, often promoting monoculture."],[266.35,273.49,"This model can increase yields, but it also poses risks to biodiversity and soil health."],[274.78,281.43,"Global supply chains deliver cheap food, but disruptions can cause sharp rises in prices."],[282.72,288.75,"Supporters of food sovereignty argue that communities should control their own food systems."],[290.05,296.72,"New technologies, such as lab-grown meat, may reduce the environmental impact of farming."],[298.02,302.7,"The challenge is to meet growing demand without harming people or the planet."],[303.98,306.75,"Quiz time! Choose the correct answer."],[307.05,310.29,"Growing only one crop over a large area is blank."],[310.59,315.56,"A, monoculture. B, food miles. C, agribusiness."],[319.55,321.92,"The answer is A: monoculture."],[323.42,326.31,"The new policy blank serious concerns."],[326.61,330.02,"A, makes. B, raises. C, does."],[334.02,336.72,"The answer is B: raises."],[338.22,340.67,"There has been a blank rise in rice prices."],[340.97,345.14,"A, sharp. B, strong. C, high."],[349.15,351.61,"The answer is A: sharp."],[353.12,356.12,"Not having reliable access to enough food is blank."],[356.42,363.24,"A, food sovereignty. B, food insecurity. C, smallholder farmer."],[367.25,370.58,"The answer is B: food insecurity."],[372.08,377.29,"According to the text, smallholder farmers produce about blank of the world's food."],[377.59,382.55,"A, a tenth. B, a third. C, a half."],[386.55,388.76,"The answer is B: a third."],[390.25,396.47,"Now it's your turn. Part one: How can Cambodia ensure that everyone has enough healthy food?"],[401.77,408.19,"Part two: Use at least three collocations: propose two solutions and explain one risk."],[414.49,428.7,"Firstly, the government should support smallholder farmers to meet local demand. Secondly, diverse crops would reduce reliance on imports. However, heavy reliance on monoculture still poses serious risks to soil and income."],[429.0,430.76,"That is a well-argued answer!"],[431.75,435.57,"Great work today! You learned eight new words and collocations."],[435.88,440.42,"Today's value is responsibility. Help at home and do your jobs."],[440.72,443.46,"See you in Unit eighteen. Goodbye!"],[443.76,446.65,"Thank you, Ms. Sarah! Bye, everyone!"]],"OC-Advanced-Unit18-Water-and-Conflict":[[0.35,5.08,"Hello, everyone! I'm Ms. Sarah. Welcome to Online Advanced."],[5.38,8.68,"Hi! I'm Rithy. Let's learn together!"],[8.98,17.03,"Unit eighteen: Water and Conflict. In this unit, you will discuss shared rivers, water rights and cooperation."],[18.02,19.41,"water scarcity."],[20.11,23.92,"water scarcity means a lack of enough clean water to meet demand."],[24.22,27.49,"Water scarcity affects billions of people."],[28.19,31.83,"Your turn. Say: water scarcity."],[34.53,35.92,"water scarcity."],[36.92,38.36,"transboundary river."],[39.06,43.87,"transboundary river means a river that flows through more than one country."],[44.17,48.12,"The Mekong is a transboundary river shared by six countries."],[48.82,51.97,"Your turn. Say: transboundary river."],[54.67,56.22,"transboundary river."],[57.22,58.41,"hydropower dam."],[59.12,64.02,"hydropower dam means a dam that uses flowing water to produce electricity."],[64.32,67.13,"New hydropower dams have changed the river's flow."],[67.83,70.91,"Your turn. Say: hydropower dam."],[73.61,75.14,"hydropower dam."],[76.15,77.38,"water rights."],[78.08,81.61,"water rights means legal rights to use water from a source."],[81.91,85.04,"Farmers and factories are arguing over water rights."],[85.74,88.37,"Your turn. Say: water rights."],[91.07,92.21,"water rights."],[93.22,94.16,"aquifer."],[94.86,98.45,"aquifer means an underground layer of rock that holds water."],[98.75,101.04,"Over-pumping is draining the aquifer."],[101.74,104.83,"Your turn. Say: aquifer."],[107.53,108.52,"aquifer."],[109.52,111.03,"drought resilience."],[111.73,116.35,"drought resilience means the ability to cope with long periods without rain."],[116.65,119.57,"Rainwater tanks improve drought resilience."],[120.27,123.94,"Your turn. Say: drought resilience."],[126.64,127.9,"drought resilience."],[128.88,130.3,"water diplomacy."],[131.0,135.39,"water diplomacy means negotiation between countries about shared water."],[135.69,139.14,"Water diplomacy can prevent conflict between neighbours."],[139.84,143.03,"Your turn. Say: water diplomacy."],[145.73,147.1,"water diplomacy."],[148.12,149.38,"sediment flow."],[150.09,154.69,"sediment flow means the movement of soil and sand carried by a river."],[154.99,157.39,"Dams reduce sediment flow to the delta."],[158.09,161.16,"Your turn. Say: sediment flow."],[163.86,165.06,"sediment flow."],[166.05,168.34,"Now let's listen to a conversation."],[168.64,172.38,"Ms. Sarah, why are fishermen on the Tonle Sap worried?"],[173.68,177.9,"Upstream dams have cut down the natural flood pulse that feeds the lake."],[179.22,182.03,"So hydropower dams affect countries downstream?"],[183.32,188.91,"Absolutely. They hold back water and sediment flow, which the delta relies on."],[190.22,192.61,"Can the countries sort this out peacefully?"],[193.92,199.45,"Through water diplomacy, yes. Nobody can afford to back out of negotiations."],[200.75,202.23,"And if droughts get worse?"],[203.52,208.27,"Then communities must step up drought resilience and protect their aquifers."],[209.58,213.7,"Grammar focus: Advanced phrasal verbs."],[214.0,217.81,"Advanced phrasal verbs are common in natural speech."],[218.11,223.75,"Hold back means restrain, sort out means resolve, and step up means increase."],[224.05,227.98,"For academic writing, you can often use the formal equivalent."],[228.28,234.02,"At C1, know both the phrasal verb (natural speech) and its formal equivalent (academic writing)."],[235.02,238.09,"Now read and listen. The Mekong Under Pressure."],[238.39,242.89,"The Mekong River flows through six countries before reaching the sea in Vietnam."],[244.18,248.96,"Over sixty million people rely on it for food, water and income."],[250.25,256.25,"In recent years, dozens of hydropower dams have been built along the river and its tributaries."],[257.55,262.31,"These dams produce clean electricity, but they hold back water and sediment."],[263.62,269.33,"Fishermen on the Tonle Sap report falling catches as the natural flood pulse weakens."],[270.62,275.77,"Meanwhile, droughts and water scarcity are becoming more frequent."],[277.08,283.22,"The Mekong River Commission encourages water diplomacy and data sharing between countries."],[284.52,289.94,"Whether the river remains a source of life or conflict depends on cooperation."],[291.25,293.88,"Quiz time! Choose the correct answer."],[294.18,297.43,"A river that flows through more than one country is a blank."],[297.73,303.77,"A, transboundary river. B, aquifer. C, sediment flow."],[307.75,311.08,"The answer is A: transboundary river."],[312.58,315.2,"We need to blank this problem before the meeting."],[315.5,319.74,"A, sort out. B, back out. C, hold back."],[323.75,326.1,"The answer is A: sort out."],[327.58,330.51,"The government must blank its efforts to save water."],[330.81,335.17,"A, cut down. B, step up. C, hold back."],[339.18,341.55,"The answer is B: step up."],[343.05,346.61,"An underground layer of rock that holds water is an blank."],[346.9,351.6,"A, aquifer. B, hydropower dam. C, water right."],[355.62,358.23,"The answer is A: aquifer."],[359.72,363.43,"According to the text, how many people rely on the Mekong?"],[363.73,369.62,"A, six million. B, over sixty million. C, six hundred million."],[373.62,376.39,"The answer is B: over sixty million."],[377.88,382.9,"Now it's your turn. Part one: How should countries share the Mekong River fairly?"],[388.2,394.22,"Part two: Use two phrasal verbs, propose a solution, and explain one difficulty."],[400.52,412.79,"Countries should step up data sharing and agree on limits before building new dams. The main difficulty is that upstream countries may not want to cut down on hydropower, because it brings income and energy."],[413.09,415.0,"That is a well-argued answer!"],[416.02,421.11,"Great work today! You learned eight new words and advanced phrasal verbs."],[421.41,425.86,"Today's value is love of country. Love and take care of Cambodia."],[426.16,428.85,"See you in Unit nineteen. Goodbye!"],[429.15,432.12,"Thank you, Ms. Sarah! Bye, everyone!"]],"OC-Advanced-Unit19-Cybersecurity":[[0.35,5.63,"Hello, everyone! I'm Ms. Sarah. Welcome to Online Advanced."],[5.93,9.16,"Hi! I'm Rithy. Let's learn together!"],[9.46,17.46,"Unit nineteen: Cybersecurity. In this unit, you will understand digital threats and how to defend against them."],[18.45,19.54,"ransomware."],[20.24,25.09,"ransomware means malicious software that locks files until a payment is made."],[25.39,27.63,"The hospital was hit by ransomware."],[28.33,31.23,"Your turn. Say: ransomware."],[33.93,35.11,"ransomware."],[36.12,37.23,"zero-day."],[37.93,42.55,"zero-day means a software weakness unknown to its makers, with no fix yet."],[42.85,45.81,"Hackers exploited a zero-day vulnerability."],[46.51,49.68,"Your turn. Say: zero-day."],[52.38,53.37,"zero-day."],[54.38,55.8,"phishing campaign."],[56.5,62.69,"phishing campaign means a large-scale attempt to trick people into revealing information."],[62.99,65.89,"A phishing campaign targeted bank customers."],[66.59,69.72,"Your turn. Say: phishing campaign."],[72.41,73.78,"phishing campaign."],[74.78,75.69,"firewall."],[76.39,80.1,"firewall means a security system that controls network traffic."],[80.4,83.16,"The firewall blocked thousands of attacks."],[83.86,86.89,"Your turn. Say: firewall."],[89.59,90.41,"firewall."],[91.42,92.84,"penetration test."],[93.54,98.68,"penetration test means an authorised simulated attack to find weaknesses."],[98.98,102.28,"The penetration test revealed three serious flaws."],[102.98,106.3,"Your turn. Say: penetration test."],[109.0,110.41,"penetration test."],[111.42,112.62,"threat actor."],[113.31,117.57,"threat actor means a person or group responsible for a cyber attack."],[117.87,120.62,"Security teams track known threat actors."],[121.32,124.33,"Your turn. Say: threat actor."],[127.03,128.46,"threat actor."],[129.45,130.69,"state-sponsored."],[131.4,134.9,"state-sponsored means supported or directed by a government."],[135.2,137.05,"The attack was state-sponsored."],[137.75,140.8,"Your turn. Say: state-sponsored."],[143.5,144.86,"state-sponsored."],[145.85,146.87,"data leak."],[147.57,151.61,"data leak means the accidental release of private information."],[151.91,154.67,"The data leak exposed millions of passwords."],[155.37,158.37,"Your turn. Say: data leak."],[161.07,162.1,"data leak."],[163.08,165.4,"Now let's listen to a conversation."],[165.7,169.58,"Rithy, did you hear about the ransomware attack on the clinic?"],[170.88,175.09,"Yes. Apparently, the hackers got in through a phishing campaign."],[176.38,180.74,"Typical. The weakest link is often human, not technical."],[182.05,184.15,"Couldn't a firewall have stopped it?"],[185.45,190.05,"Not if someone opens the door from inside. It's a cat-and-mouse game."],[191.35,194.34,"Some experts think it was state-sponsored."],[195.65,200.58,"Possibly. Either way, they should have done a penetration test long ago."],[201.88,206.37,"Better safe than sorry. I'm changing all my passwords tonight."],[207.68,210.66,"Grammar focus: Idiomatic language."],[210.96,214.68,"Idiomatic language makes your speech natural and expressive."],[214.98,221.72,"The weakest link is the weakest part of a system; a cat-and-mouse game is a constant chase."],[222.02,225.12,"Better safe than sorry means it's wise to be careful."],[225.41,230.65,"Idioms make speech vivid, but avoid them in very formal writing such as reports."],[231.65,234.58,"Now read and listen. The Invisible War."],[234.88,240.35,"Every day, millions of cyber attacks target governments, companies and individuals."],[241.65,247.24,"Ransomware can shut down hospitals, factories and even city services."],[248.55,253.24,"Many attacks begin with a simple phishing campaign that tricks one employee."],[254.55,259.07,"Some threat actors are criminal gangs, while others are state-sponsored groups."],[260.38,265.75,"Security experts describe their work as a cat-and-mouse game with attackers."],[267.05,271.92,"Penetration tests help organisations find weaknesses before criminals do."],[273.22,278.2,"Even so, a single data leak can damage a company's reputation for years."],[279.48,283.6,"In cybersecurity, as in life, prevention is better than cure."],[284.88,287.43,"Quiz time! Choose the correct answer."],[287.73,291.43,"Software that locks files until a payment is made is blank."],[291.73,296.06,"A, ransomware. B, firewall. C, zero-day."],[300.05,302.36,"The answer is A: ransomware."],[303.85,306.71,"Humans are often the weakest blank in security."],[307.01,310.88,"A, chain. B, link. C, point."],[314.88,316.91,"The answer is B: link."],[318.42,320.09,"'Better safe than blank.'"],[320.39,323.4,"A, sorry. B, sad. C, late."],[327.38,329.12,"The answer is A: sorry."],[330.62,334.71,"An authorised simulated attack to find weaknesses is a blank."],[335.01,341.0,"A, data leak. B, penetration test. C, phishing campaign."],[345.02,348.44,"The answer is B: penetration test."],[349.95,353.39,"According to the text, how do many attacks begin?"],[353.69,359.27,"A, with a firewall. B, with a phishing campaign. C, with a penetration test."],[363.28,365.92,"The answer is B: with a phishing campaign."],[367.42,372.98,"Now it's your turn. Part one: How can ordinary people protect themselves from cybercrime?"],[378.28,385.43,"Part two: Use at least one idiom, give two practical tips and explain why they matter."],[391.73,402.22,"Better safe than sorry: I always use two-step verification and never click unknown links. These matter because people are usually the weakest link, not the technology."],[402.51,404.79,"That is a well-argued answer!"],[405.78,410.7,"Great work today! You learned eight new words and idiomatic language."],[411.0,416.4,"Today's value is online safety. Keep your password secret and be kind online."],[416.7,420.18,"See you in Unit twenty. Goodbye!"],[420.48,423.6,"Thank you, Ms. Sarah! Bye, everyone!"]],"OC-Advanced-Unit20-Gender-and-Equality":[[0.35,4.87,"Hello, everyone! I'm Ms. Sarah. Welcome to Online Advanced."],[5.17,8.23,"Hi! I'm Rithy. Let's learn together!"],[8.54,16.99,"Unit twenty: Gender and Equality. In this unit, you will discuss gender equality at work and in society."],[17.98,19.07,"gender gap."],[19.77,24.46,"gender gap means a difference between men and women in opportunities or outcomes."],[24.76,27.47,"The gender gap in science careers is narrowing."],[28.17,30.81,"Your turn. Say: gender gap."],[33.51,34.47,"gender gap."],[35.48,36.59,"pay equity."],[37.29,40.66,"pay equity means equal pay for work of equal value."],[40.96,43.71,"The company published a report on pay equity."],[44.41,46.97,"Your turn. Say: pay equity."],[49.67,50.62,"pay equity."],[51.62,52.68,"glass ceiling."],[53.38,58.48,"glass ceiling means an invisible barrier that stops women reaching top positions."],[58.77,61.63,"She broke the glass ceiling by becoming CEO."],[62.33,65.47,"Your turn. Say: glass ceiling."],[68.17,69.23,"glass ceiling."],[70.22,71.62,"representation."],[72.32,76.53,"representation means the presence of a group in important roles."],[76.83,80.57,"Women's representation in parliament is increasing."],[81.27,84.88,"Your turn. Say: representation."],[87.58,88.83,"representation."],[89.82,90.96,"gender norm."],[91.66,96.45,"gender norm means social expectations about how men and women should behave."],[96.75,100.12,"Gender norms influence career choices from childhood."],[100.82,103.6,"Your turn. Say: gender norm."],[106.3,107.87,"gender norm."],[108.88,110.35,"empowerment programme."],[111.05,115.51,"empowerment programme means a programme that gives people skills and confidence."],[115.81,118.85,"The empowerment programme trained women entrepreneurs."],[119.55,122.73,"Your turn. Say: empowerment programme."],[125.43,127.01,"empowerment programme."],[128.02,129.62,"unconscious bias."],[130.32,134.36,"unconscious bias means prejudice we have without realising it."],[134.66,137.87,"Training can reduce unconscious bias in hiring."],[138.57,142.14,"Your turn. Say: unconscious bias."],[144.84,146.43,"unconscious bias."],[147.45,149.24,"work-life policy."],[149.94,155.33,"work-life policy means workplace rules that support family and personal life."],[155.63,159.86,"A strong work-life policy helps parents stay in their jobs."],[160.56,164.36,"Your turn. Say: work-life policy."],[167.06,169.09,"work-life policy."],[170.08,172.25,"Now let's listen to a conversation."],[172.55,176.05,"Ms. Sarah, is the gender gap still a serious issue?"],[177.35,182.46,"In many sectors, yes. Women remain under-represented in senior positions."],[183.75,186.33,"Is that because of the glass ceiling?"],[187.62,193.43,"Partly. Unconscious bias in promotion decisions also plays a role."],[194.72,199.59,"My sister says her boss always gives the big projects to the guys."],[200.88,206.38,"That's a common complaint. Formally, we'd call it unequal access to opportunities."],[207.68,209.17,"What could companies do?"],[210.48,215.87,"Introduce transparent pay equity reviews and better work-life policies, for a start."],[217.18,219.81,"Grammar focus: Register and tone."],[220.11,223.7,"Register is the level of formality in your language."],[224.0,233.03,"Informally, we might say the boss gives the big projects to the guys. Formally, male employees receive greater access to high-profile projects."],[233.33,235.95,"Choose your register to suit your audience."],[236.25,244.74,"At C1, choose your register deliberately: informal with friends, formal in reports, presentations and emails to managers."],[245.75,248.25,"Now read and listen. Closing the Gap."],[248.55,255.22,"Over the past fifty years, women have made significant progress in education and employment."],[256.52,261.16,"Nevertheless, a considerable gender gap persists in pay and leadership."],[262.45,267.64,"Women remain under-represented in senior management and political office."],[268.95,275.64,"Research suggests that unconscious bias influences recruitment and promotion decisions."],[276.95,281.81,"Traditional gender norms also shape expectations about caregiving and careers."],[283.12,288.96,"Organisations that implement transparent pay equity reviews tend to reduce disparities."],[290.25,296.1,"Empowerment programmes and flexible work-life policies have proved particularly effective."],[297.42,304.11,"Equality, it is increasingly recognised, benefits not only women but entire economies."],[305.42,308.27,"Quiz time! Choose the correct answer."],[308.57,312.61,"An invisible barrier stopping women reaching top jobs is the blank."],[312.91,317.76,"A, glass ceiling. B, gender norm. C, pay equity."],[321.75,324.17,"The answer is A: glass ceiling."],[325.68,327.16,"Which is the most formal?"],[327.46,333.92,"A, It's a big deal.. B, It is a significant issue.. C, It's kind of important.."],[337.92,341.26,"The answer is B: It is a significant issue.."],[342.75,344.09,"Which is informal?"],[344.39,349.12,"A, male employees. B, the guys. C, male colleagues."],[353.12,355.98,"The answer is B: the guys."],[357.48,360.27,"Prejudice we have without realising it is blank."],[360.57,366.0,"A, representation. B, unconscious bias. C, empowerment."],[370.02,373.43,"The answer is B: unconscious bias."],[374.92,379.05,"According to the text, what tends to reduce disparities?"],[379.35,386.8,"A, transparent pay equity reviews. B, longer working hours. C, fewer women in leadership."],[390.82,394.65,"The answer is A: transparent pay equity reviews."],[396.15,402.16,"Now it's your turn. Part one: What can be done to achieve gender equality in the workplace?"],[407.46,413.68,"Part two: Answer in a formal register: give two measures and justify each."],[419.98,433.8,"Firstly, organisations should conduct transparent pay equity reviews, as these reveal hidden disparities. Secondly, flexible work-life policies would enable parents of both genders to pursue their careers."],[434.1,436.56,"That is a well-argued answer!"],[437.55,441.87,"Great work today! You learned eight new words and register and tone."],[442.17,445.77,"Today's value is respect. Thank the people who help us."],[446.07,449.31,"See you in Unit twenty-one. Goodbye!"],[449.61,452.14,"Thank you, Ms. Sarah! Bye, everyone!"]],"OC-Advanced-Unit21-Philosophy-of-Mind":[[0.35,5.86,"Hello, everyone! I'm Ms. Sarah. Welcome to Online Advanced."],[6.16,9.2,"Hi! I'm Rithy. Let's learn together!"],[9.5,18.11,"Unit twenty-one: Philosophy of Mind. In this unit, you will explore questions about the mind, choice and identity."],[19.12,20.02,"free will."],[20.73,26.1,"free will means the ability to make choices that are not determined by outside causes."],[26.4,30.03,"Do we really have free will, or are our choices predictable?"],[30.73,33.32,"Your turn. Say: free will."],[36.02,36.98,"free will."],[37.98,39.12,"determinism."],[39.82,44.27,"determinism means the belief that every event is caused by earlier events."],[44.57,48.81,"Determinism suggests that our decisions are already fixed."],[49.51,52.29,"Your turn. Say: determinism."],[54.99,56.1,"determinism."],[57.08,59.12,"mind-body problem."],[59.82,64.23,"mind-body problem means the question of how the mind relates to the physical brain."],[64.53,68.6,"The mind-body problem has puzzled philosophers for centuries."],[69.3,73.22,"Your turn. Say: mind-body problem."],[75.92,77.54,"mind-body problem."],[78.55,80.44,"subjective experience."],[81.14,85.26,"subjective experience means what it feels like from the inside to be you."],[85.56,88.81,"No scan can fully capture subjective experience."],[89.51,93.19,"Your turn. Say: subjective experience."],[95.88,97.68,"subjective experience."],[98.68,99.93,"rationality."],[100.63,105.41,"rationality means the quality of thinking based on reason and logic."],[105.71,108.67,"Economists once assumed perfect rationality."],[109.37,112.54,"Your turn. Say: rationality."],[115.24,116.39,"rationality."],[117.38,118.91,"personal identity."],[119.61,123.48,"personal identity means what makes you the same person over time."],[123.78,126.91,"Memory plays a key role in personal identity."],[127.61,130.65,"Your turn. Say: personal identity."],[133.35,134.83,"personal identity."],[135.82,137.47,"moral responsibility."],[138.17,142.8,"moral responsibility means being rightly praised or blamed for your actions."],[143.1,146.39,"Moral responsibility seems to require free will."],[147.09,150.73,"Your turn. Say: moral responsibility."],[153.43,155.12,"moral responsibility."],[156.12,156.98,"qualia."],[157.68,163.5,"qualia means the individual qualities of experiences, such as the redness of red."],[163.8,167.84,"Philosophers debate whether qualia can be explained by science."],[168.54,170.83,"Your turn. Say: qualia."],[173.53,174.34,"qualia."],[175.35,177.64,"Now let's listen to a conversation."],[177.94,182.08,"Ms. Sarah, I'd been reading about free will all week when I started to doubt it."],[183.38,184.74,"What made you doubt it?"],[186.05,192.16,"An article on determinism. It claimed that every decision had already been caused by brain activity."],[193.45,200.26,"Some experiments do suggest that. But were we really just machines, would moral responsibility make sense?"],[201.55,204.91,"That's what worries me. Punishment would seem unfair."],[206.22,211.56,"Then there's the mind-body problem: how does the brain produce subjective experience at all?"],[212.85,216.42,"Like the taste of mango or the colour of the sunset?"],[217.72,223.39,"Exactly. Philosophers call those qualia, and science still struggles to explain them."],[224.68,228.12,"Grammar focus: Narrative tenses in reflection."],[228.42,231.86,"Narrative tenses can describe how our thinking developed."],[232.16,235.87,"I had been reading about free will when I started to doubt it."],[236.17,241.49,"The decision had already been made, and I was about to disagree, but I stopped."],[241.79,246.98,"Combining these forms lets you narrate thinking processes precisely in essays and discussions."],[247.98,250.5,"Now read and listen. Are We Free?."],[250.8,254.98,"For thousands of years, people have assumed that they make free choices."],[256.28,261.12,"In the twentieth century, however, neuroscientists began to challenge this assumption."],[262.42,268.2,"In famous experiments, brain activity appeared to start before people were aware of deciding."],[269.52,274.27,"Some concluded that determinism was true and that free will was an illusion."],[275.58,281.27,"Others argued that the experiments measured only simple actions, not meaningful decisions."],[282.58,288.2,"The debate matters because moral responsibility seems to depend on our ability to choose."],[289.52,296.38,"Meanwhile, the mind-body problem remains unsolved: no theory fully explains subjective experience."],[297.68,303.76,"Perhaps the most honest conclusion is that the mind is still one of science's greatest mysteries."],[305.05,307.62,"Quiz time! Choose the correct answer."],[307.92,311.77,"The belief that every event is caused by earlier events is blank."],[312.07,316.97,"A, free will. B, determinism. C, qualia."],[320.98,323.41,"The answer is B: determinism."],[324.92,327.97,"I blank for hours when the answer suddenly came to me."],[328.27,332.19,"A, had been thinking. B, have thought. C, was think."],[336.18,338.97,"The answer is A: had been thinking."],[340.48,343.76,"By the time I arrived, they blank the decision."],[344.06,349.23,"A, already made. B, had already made. C, have already made."],[353.25,356.13,"The answer is B: had already made."],[357.62,360.43,"What makes you the same person over time is blank."],[360.73,368.05,"A, personal identity. B, rationality. C, subjective experience."],[372.05,375.4,"The answer is A: personal identity."],[376.88,379.92,"According to the text, why does the debate matter?"],[380.22,387.33,"A, for economics. B, because moral responsibility seems to depend on choice. C, for sport."],[391.32,397.01,"The answer is B: because moral responsibility seems to depend on choice."],[398.52,402.93,"Now it's your turn. Part one: Do you believe humans have free will?"],[408.23,414.44,"Part two: Give your position, two reasons, and explain what it means for responsibility."],[420.74,433.34,"I believe we have a limited form of free will. Our genes and environment shape us, but we can still reflect and change our habits. That's why people should be held responsible, but also given chances to change."],[433.64,436.12,"That is a well-argued answer!"],[437.12,442.22,"Great work today! You learned eight new words and narrative tenses in reflection."],[442.52,446.77,"Today's value is curiosity. Ask questions and find out."],[447.07,449.69,"See you in Unit twenty-two. Goodbye!"],[449.99,452.86,"Thank you, Ms. Sarah! Bye, everyone!"]],"OC-Advanced-Unit22-Global-Health":[[0.35,5.44,"Hello, everyone! I'm Ms. Sarah. Welcome to Online Advanced."],[5.74,8.61,"Hi! I'm Rithy. Let's learn together!"],[8.91,16.23,"Unit twenty-two: Global Health. In this unit, you will discuss how the world can protect health for everyone."],[17.22,18.96,"pandemic preparedness."],[19.66,24.89,"pandemic preparedness means being ready to respond quickly to a global outbreak."],[25.19,28.35,"Pandemic preparedness saves lives and money."],[29.05,32.0,"Your turn. Say: pandemic preparedness."],[34.7,36.37,"pandemic preparedness."],[37.35,39.2,"universal health coverage."],[39.9,45.74,"universal health coverage means access to health services for everyone without financial hardship."],[46.04,49.98,"Thailand achieved universal health coverage in 2002."],[50.68,54.52,"Your turn. Say: universal health coverage."],[57.22,58.99,"universal health coverage."],[59.98,61.54,"health inequity."],[62.24,66.16,"health inequity means unfair differences in health between groups."],[66.46,70.0,"Health inequity is visible between cities and villages."],[70.7,73.92,"Your turn. Say: health inequity."],[76.62,78.31,"health inequity."],[79.32,80.9,"neglected disease."],[81.6,87.46,"neglected disease means a disease that affects poor people and receives little research funding."],[87.76,90.65,"Dengue was long considered a neglected disease."],[91.35,95.22,"Your turn. Say: neglected disease."],[97.92,99.55,"neglected disease."],[100.55,102.58,"antimicrobial resistance."],[103.28,109.3,"antimicrobial resistance means when bacteria and other germs stop responding to medicines."],[109.6,113.74,"Antimicrobial resistance could make simple infections deadly."],[114.44,118.18,"Your turn. Say: antimicrobial resistance."],[120.88,123.03,"antimicrobial resistance."],[124.02,125.4,"vaccine equity."],[126.1,130.53,"vaccine equity means fair distribution of vaccines between countries."],[130.83,134.37,"Vaccine equity was a major issue during COVID-19."],[135.07,138.12,"Your turn. Say: vaccine equity."],[140.82,142.49,"vaccine equity."],[143.48,145.32,"health system capacity."],[146.02,152.43,"health system capacity means the ability of a health system to treat patients."],[152.73,155.47,"The outbreak tested health system capacity."],[156.17,159.87,"Your turn. Say: health system capacity."],[162.57,164.63,"health system capacity."],[165.62,167.13,"disease surveillance."],[167.83,171.38,"disease surveillance means monitoring the spread of diseases."],[171.68,174.44,"Disease surveillance detected the outbreak early."],[175.14,178.79,"Your turn. Say: disease surveillance."],[181.49,183.01,"disease surveillance."],[184.02,186.28,"Now let's listen to a conversation."],[186.58,193.39,"Rithy, by 2030, the world will have been talking about pandemic preparedness for a decade."],[194.68,197.93,"Yet many countries still lack the capacity to respond."],[199.22,205.12,"True. And antimicrobial resistance is a quieter but equally serious threat."],[206.42,209.01,"Because people overuse antibiotics?"],[210.32,217.3,"Partly, and in farming too. By the time new drugs arrive, bacteria will have been adapting for years."],[218.58,223.23,"What about vaccine equity? Poorer countries waited months during COVID-19."],[224.52,228.48,"That was a clear example of health inequity on a global scale."],[229.78,235.01,"So universal health coverage should be the long-term goal for every country."],[236.32,240.64,"Grammar focus: Future perfect continuous in argument."],[240.94,246.86,"In arguments, the future perfect continuous emphasises how long a problem will have continued."],[247.16,251.85,"By the time new drugs arrive, bacteria will have been adapting for years."],[252.16,254.19,"It adds urgency to your point."],[254.49,260.51,"In arguments, this tense highlights how long a problem will have continued, adding urgency."],[261.52,264.54,"Now read and listen. Health Without Borders."],[264.84,270.18,"Diseases do not respect national borders, as COVID-19 clearly demonstrated."],[271.48,277.82,"Strong pandemic preparedness requires disease surveillance, trained staff and emergency funding."],[279.12,283.98,"Yet health system capacity varies enormously between countries."],[285.28,290.39,"During the pandemic, wealthy nations secured vaccines months before poorer ones."],[291.68,296.05,"This lack of vaccine equity prolonged the crisis for everyone."],[297.35,303.19,"Another growing threat is antimicrobial resistance, which could make common infections untreatable."],[304.48,309.95,"Neglected diseases such as dengue continue to affect millions in tropical regions."],[311.25,317.74,"Universal health coverage is increasingly seen as the foundation of global health security."],[319.05,321.88,"Quiz time! Choose the correct answer."],[322.18,325.69,"When germs stop responding to medicines, it is blank."],[325.99,332.84,"A, vaccine equity. B, antimicrobial resistance. C, disease surveillance."],[336.85,340.45,"The answer is B: antimicrobial resistance."],[341.95,346.06,"By 2030, she blank as a nurse for fifteen years."],[346.36,351.05,"A, will be working. B, will have been working. C, has worked."],[355.05,358.52,"The answer is B: will have been working."],[360.02,363.12,"By the time we finish, we blank for ten hours."],[363.42,367.77,"A, will have been travelling. B, will travel. C, travelled."],[371.78,374.48,"The answer is A: will have been travelling."],[375.98,379.79,"Fair distribution of vaccines between countries is blank."],[380.09,386.82,"A, vaccine equity. B, health inequity. C, health system capacity."],[390.82,393.76,"The answer is A: vaccine equity."],[395.25,399.86,"According to the text, what is the foundation of global health security?"],[400.16,406.39,"A, private hospitals. B, universal health coverage. C, new vaccines."],[410.38,414.37,"The answer is B: universal health coverage."],[415.88,421.68,"Now it's your turn. Part one: What should be the top global health priority in the next decade?"],[426.98,433.6,"Part two: Choose one priority, give two reasons, and suggest one action for Cambodia."],[439.9,452.09,"I'd choose antimicrobial resistance. It threatens basic medicine, and it is growing quietly. Cambodia could stop the sale of antibiotics without prescriptions and educate farmers about their use."],[452.39,455.54,"That is a well-argued answer!"],[456.55,462.36,"Great work today! You learned eight new words and future perfect continuous in argument."],[462.66,467.24,"Today's value is healthy body. Move your body every day."],[467.54,471.38,"See you in Unit twenty-three. Goodbye!"],[471.68,474.75,"Thank you, Ms. Sarah! Bye, everyone!"]],"OC-Advanced-Unit23-Democracy-and-Participation":[[0.35,5.38,"Hello, everyone! I'm Ms. Sarah. Welcome to Online Advanced."],[5.68,8.76,"Hi! I'm Rithy. Let's learn together!"],[9.06,17.93,"Unit twenty-three: Democracy and Participation. In this unit, you will discuss how citizens take part in public life."],[18.92,20.43,"civic engagement."],[21.13,26.25,"civic engagement means citizens taking part in community and public life."],[26.55,29.47,"Volunteering is one form of civic engagement."],[30.17,33.75,"Your turn. Say: civic engagement."],[36.45,37.93,"civic engagement."],[38.92,40.23,"voter turnout."],[40.93,44.68,"voter turnout means the percentage of eligible people who vote."],[44.98,48.27,"Voter turnout is often lower among young people."],[48.97,51.84,"Your turn. Say: voter turnout."],[54.55,55.64,"voter turnout."],[56.65,57.78,"polarisation."],[58.48,62.85,"polarisation means the division of society into opposing groups."],[63.15,66.26,"Social media can increase polarisation."],[66.96,69.9,"Your turn. Say: polarisation."],[72.6,73.7,"polarisation."],[74.68,76.08,"grassroots campaign."],[76.78,81.9,"grassroots campaign means a movement started by ordinary people rather than leaders."],[82.2,84.96,"A grassroots campaign saved the local park."],[85.66,88.75,"Your turn. Say: grassroots campaign."],[91.45,93.0,"grassroots campaign."],[93.98,95.25,"deliberation."],[95.95,99.72,"deliberation means careful discussion before making a decision."],[100.02,102.77,"Good decisions require time for deliberation."],[103.47,106.54,"Your turn. Say: deliberation."],[109.24,110.38,"deliberation."],[111.38,112.8,"civil society."],[113.5,119.04,"civil society means organisations and groups outside government and business."],[119.34,123.01,"Civil society groups support education and health."],[123.71,126.74,"Your turn. Say: civil society."],[129.44,130.94,"civil society."],[131.95,133.36,"political apathy."],[134.06,137.57,"political apathy means lack
