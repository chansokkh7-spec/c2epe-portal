        // ===== Progress: stars/badges are earned once per activity and remembered =====
        // Saved in this browser when the page is opened as a normal web page. When it runs

        const PROGRESS_KEY = () => 'c2epe_onlineclass_progress_' + state.level;
        let progress = { stars: 0, badges: 0, awarded: {}, bestQuiz: {} };
        function loadProgress() {
            try {
                const saved = JSON.parse(localStorage.getItem(PROGRESS_KEY()) || 'null');
                if (saved && typeof saved === 'object') progress = Object.assign({ stars: 0, badges: 0, awarded: {}, bestQuiz: {} }, saved);
            } catch (e) { /* storage not available (e.g. inside the Hub sandbox) */ }
            state.stars = progress.stars; state.badges = progress.badges;
            document.getElementById('star-count').innerText = state.stars;
            document.getElementById('badge-count').innerText = state.badges;
        }
        function saveProgress() {
            progress.stars = state.stars; progress.badges = state.badges;
            try { localStorage.setItem(PROGRESS_KEY(), JSON.stringify(progress)); } catch (e) {}
        }
        // Gives stars only the first time a given activity is done. Returns true if stars were given.
        function award(key, amount) {
            const k = state.level + '|' + key;
            if (progress.awarded[k]) return false;
            progress.awarded[k] = true;
            addStars(amount);
            return true;
        }
        const unitKey = (what) => 'u' + state.unit + '|' + what;

        function populateUnitSelect() {
            const sel = document.getElementById('unit-select');

            const labelEl = document.getElementById('unit-select-label');
            if (labelEl) labelEl.textContent = `Select Unit (1 to ${unitCount})`;
            // 🎬 marks units that have a video (🆕 = added in the last 7 days)
            sel.innerHTML = Object.keys(levelData).map(u => {
                const v = videoFor(state.level, u);
                const mark = v ? (isRecentlyAdded(v.added) ? ' 🆕' : ' 🎬') : '';
                return `<option value="${u}">Unit ${u}: ${levelData[u].title}${mark}</option>`;
            }).join('');
            if (typeof OC_TRIAL !== 'undefined' && OC_TRIAL) { [...sel.options].forEach(o => { if (Number(o.value) > 3) { o.disabled = true; o.textContent = '🔒 ' + o.textContent + ' (after the trial)'; } }); }
            // keep the same unit number selected if it still exists for this level
            if (levelData[prevUnit]) {
                sel.value = prevUnit;

        function nextLesson() {

                b.classList.remove('bg-blue-50', 'text-blue-700');

            if (!area) return;

            // Wait for the new lesson to be drawn, then glide to it. Some phones stop a smooth

            setTimeout(() => {

        function speak(text, onEnd) {
            if (!('speechSynthesis' in window)) { if (onEnd) onEnd(false); return false; }

            if (enVoice) u.voice = enVoice;
            if (onEnd) u.onend = () => onEnd(true);
            window.speechSynthesis.speak(u);
            return true;

            // stop the "Hear it" voice first, or the speaker can bleed into the microphone
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();

            traceDrawn = false;
            const canvas = document.getElementById('trace-canvas');
            const ctx = canvas.getContext('2d');
            ctx.lineWidth = 6;
            ctx.lineCap = 'round';
            ctx.strokeStyle = '#2563eb';
            let drawing = false;
            function pos(e) {
                const rect = canvas.getBoundingClientRect();
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;
                const cx = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
                const cy = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
                return { x: cx * scaleX, y: cy * scaleY };
            }
            function start(e) { drawing = true; traceDrawn = true; const p = pos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); e.preventDefault(); }
            function move(e) { if (!drawing) return; const p = pos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); e.preventDefault(); }
            function end() { drawing = false; }
            canvas.addEventListener('mousedown', start);
            canvas.addEventListener('mousemove', move);
            if (traceMouseUpHandler) window.removeEventListener('mouseup', traceMouseUpHandler);
            traceMouseUpHandler = end;
            window.addEventListener('mouseup', traceMouseUpHandler);
            canvas.addEventListener('touchstart', start, { passive: false });
            canvas.addEventListener('touchmove', move, { passive: false });
            canvas.addEventListener('touchend', end);
        }

        // ===== 9. ABC PHONICS — "Letters of the Week" (K0/K1 only) =====

        const LETTER_PLAN = {"1": ["A"], "2": ["B"], "3": ["C"], "4": ["D"], "5": ["E"], "6": ["F"], "7": ["G"], "8": ["H"], "9": ["I"], "10": ["J"], "11": ["K"], "12": ["L"], "13": ["M"], "14": ["N"], "15": ["O"], "16": ["P"], "17": ["Q"], "18": ["R"], "19": ["S"], "20": ["T"], "21": ["U"], "22": ["V"], "23": ["W"], "24": ["X"], "25": ["Y"], "26": ["Z"], "27": ["A", "E", "I", "O", "U"], "28": ["B", "D", "P", "T"], "29": ["M", "N", "S", "Z"]};
        // Four picture words per letter (the first one is the "A is for ..." word).
        // X is taught as the sound at the END of a word (fox, box, six), as in most phonics courses.
        const PHONICS_WORDS = {
            A: [['Apple','🍎'],['Ant','🐜'],['Alligator','🐊'],['Airplane','✈️']],
            B: [['Ball','⚽'],['Bear','🐻'],['Banana','🍌'],['Bird','🐦']],

            E: [['Egg','🥚'],['Elephant','🐘'],['Envelope','✉️'],['Elbow','💪']],
            F: [['Fish','🐟'],['Frog','🐸'],['Flower','🌷'],['Fire','🔥']],
            G: [['Grape','🍇'],['Goat','🐐'],['Gift','🎁'],['Guitar','🎸']],
            H: [['Hat','👒'],['House','🏠'],['Horse','🐴'],['Hand','✋']],
            I: [['Insect','🐛'],['Iguana','🦎'],['Ink','🖋️'],['Ice cream','🍦']],
            J: [['Juice','🧃'],['Jellyfish','🪼'],['Jacket','🧥'],['Jeep','🚙']],
            K: [['Kite','🪁'],['Key','🔑'],['King','🤴'],['Kangaroo','🦘']],
            L: [['Lion','🦁'],['Leaf','🍃'],['Lemon','🍋'],['Lamp','💡']],
            M: [['Moon','🌙'],['Monkey','🐒'],['Milk','🥛'],['Mouse','🐭']],
            N: [['Nose','👃'],['Nest','🪺'],['Nut','🥜'],['Net','🥅']],
            O: [['Octopus','🐙'],['Orange','🍊'],['Ox','🐂'],['Olive','🫒']],

            R: [['Rabbit','🐰'],['Rain','🌧️'],['Robot','🤖'],['Rainbow','🌈']],

            Z: [['Zebra','🦓'],['Zero','0️⃣'],['Zigzag','〰️'],['Zip','🤐']]

        const ALPHABET = Object.keys(PHONICS_WORDS);
        // K0 follows the videos: one letter per lesson (Lesson 1 = A … Lesson 16 = P)
        const lettersFor = (unit) => LETTER_PLAN[unit] || LETTER_PLAN[1];
        const letterIntro = (L) => L === 'X'
            ? 'X. Listen for X at the end: fox, box, six.'
            : `${L}. ${L} is for ${PHONICS_WORDS[L][0][0]}.`;
        let phonicsGame = { rounds: [], index: 0, score: 0, locked: false };

        function renderPhonics(contentDiv) {
            const letters = lettersFor(state.unit);

            contentDiv.innerHTML = `

                <p class="text-gray-600 mb-4">Unit ${state.unit}: letter${letters.length > 1 ? 's' : ''} <b>${letters.join(' and ')}</b>
                   <span class="text-sm text-gray-400">(letters ${firstNo === lastNo ? firstNo : firstNo + '–' + lastNo} of 26)</span></p>
                <div class="flex flex-col gap-5">
                    ${letters.map(L => `
                    <div class="bg-yellow-50 border-2 border-dashed border-yellow-300 rounded-2xl p-5">
                        <div class="flex items-center gap-4 flex-wrap mb-4">
                            <button onclick="sayLetter('${L}')" id="ph-big-${L}" class="bg-white rounded-2xl shadow px-6 py-3 cursor-pointer hover:bg-yellow-100 ${progress.awarded[state.level + '|phonics-letter-' + L] ? 'ring-4 ring-green-400' : ''}" aria-label="Hear the letter ${L}">

        // Colours the letter being learned inside each word (first letter, or the x at the end)
        function highlightLetter(word, L) {
            const i = L === 'X' ? word.toLowerCase().lastIndexOf('x') : 0;
            if (i < 0) return word;
            return word.slice(0, i) + `<span class="text-pink-500 text-base">${word[i]}</span>` + word.slice(i + 1);
        }
        function sayLetter(L) {
            speak(letterIntro(L));

        function sayPhonicsWord(L, i) {
            speak(PHONICS_WORDS[L][i][0]);
            if (award('phonics-word-' + L + i, 1)) document.getElementById(`ph-${L}-${i}`).classList.add('ring-4', 'ring-green-400');

        // Mini game: "Which one starts with B?" — 4 rounds, answers lock after the first tap
        function startPhonicsGame() {
            const letters = lettersFor(state.unit);
            const others = ALPHABET.filter(L => !letters.includes(L));
            const rounds = [];
            for (let r = 0; r < 4; r++) {
                const L = letters[r % letters.length];
                const right = PHONICS_WORDS[L][r % 4];
                const fits = ([w]) => L === 'X' ? /x/i.test(w) : w[0].toUpperCase() === L;
                const pool = others.flatMap(o => PHONICS_WORDS[o]).filter(p => !fits(p) && p[1] !== right[1]);
                const wrong = shuffle(pool).slice(0, 2);
                rounds.push({ L, right, options: shuffle([right, ...wrong]) });
            }
            phonicsGame = { rounds, index: 0, score: 0, locked: false };
            showPhonicsRound();
        }
        function showPhonicsRound() {
            const box = document.getElementById('phonics-game');
            if (!box) return;
            phonicsGame.locked = false;
            const g = phonicsGame;
            if (g.index >= g.rounds.length) {
                const perfect = g.score === g.rounds.length;
                const got = perfect && award(unitKey('phonics-game'), 3);
                if (perfect) triggerConfetti();
                box.innerHTML = `
                    <p class="font-bold text-purple-900 text-lg text-center mb-2">${perfect ? '🏆' : '💪'} ${g.score} / ${g.rounds.length} correct${got ? ' (+3 ⭐)' : ''}</p>

                return;
            }
            const round = g.rounds[g.index];
            const ask = round.L === 'X' ? 'Which one ends with X?' : `Which one starts with ${round.L}?`;
            box.innerHTML = `
                <p class="font-bold text-purple-900 mb-1">🎮 Letter game (${g.index + 1}/${g.rounds.length})</p>
                <p class="text-lg font-bold text-gray-800 mb-3">${ask} <button onclick="speak('${ask}')" class="text-sm text-blue-600 underline cursor-pointer">🔊</button></p>
                <div class="grid grid-cols-3 gap-3" id="phonics-options">
                    ${round.options.map(([w, e]) => `<button onclick="answerPhonics('${jsArg(w)}')" class="bg-white p-3 rounded-xl shadow hover:bg-purple-100 cursor-pointer flex flex-col items-center gap-1"><span class="text-4xl">${e}</span><span class="text-sm font-semibold">${w}</span></button>`).join('')}

                el.textContent = `❌ It was ${round.right[0]} ${round.right[1]}`;

            phonicsGame.index++;
            setTimeout(showPhonicsRound, 1300);

        function youtubeIdOf(link) {
            const s = String(link || '').trim();
            if (/^[A-Za-z0-9_-]{11}$/.test(s)) return s;
            const m = s.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/))([A-Za-z0-9_-]{11})/);
            return m ? m[1] : '';
        }
        function videoFor(level, unit) {
            const v = VIDEO_LESSONS[level + '-' + unit];
            if (!v) return null;
            if (v.mp4 && /^https:\/\//.test(v.mp4)) return { mp4: v.mp4, id: v.mp4, added: v.added || '', questions: Array.isArray(v.questions) ? v.questions : [] };
            const id = youtubeIdOf(v.youtube);
            return id ? { id, added: v.added || '', questions: Array.isArray(v.questions) ? v.questions : [] } : null;
        }
        function isRecentlyAdded(dateStr) {
            if (!dateStr) return false;
            const added = new Date(dateStr);
            if (isNaN(added.getTime())) return false;
            const daysSince = (Date.now() - added.getTime()) / (1000 * 60 * 60 * 24);
            return daysSince >= 0 && daysSince <= 7;
        }
        // The Video tab shows 🆕 when THIS unit has a new video; the unit list shows 🎬 / 🆕 per unit
        function updateVideoTabBadge() {
            const btn = document.getElementById('video-tab-btn');
            if (!btn) return;
            const v = videoFor(state.level, state.unit);
            btn.textContent = (v && isRecentlyAdded(v.added) ? '🆕 ' : '') + '📹 0. Video Lesson' + (v ? '' : ' (soon)');
        }

        let ytPlayer = null;
        let ytPollInterval = null;
        let ytAnsweredCheckpoints = new Set();
        let ytApiLoadPromise = null;
        let ytFallbackTimer = null;
        let currentVideo = null;

        // Stops the player and its timers whenever the student leaves the Video tab or changes unit
        function stopVideo() {
            if (ytPollInterval) { clearInterval(ytPollInterval); ytPollInterval = null; }
            if (ytFallbackTimer) { clearTimeout(ytFallbackTimer); ytFallbackTimer = null; }
            if (ytPlayer && typeof ytPlayer.destroy === 'function') { try { ytPlayer.destroy(); } catch (e) {} }
            ytPlayer = null;
        }

        function loadYouTubeApi() {
            if (window.YT && window.YT.Player) return Promise.resolve();
            if (ytApiLoadPromise) return ytApiLoadPromise;
            ytApiLoadPromise = new Promise((resolve, reject) => {
                window.onYouTubeIframeAPIReady = resolve;
                const tag = document.createElement('script');
                tag.src = 'https://www.youtube.com/iframe_api';
                tag.onerror = () => { ytApiLoadPromise = null; reject(new Error('YouTube could not load')); };
                document.head.appendChild(tag);
            });
            return ytApiLoadPromise;
        }

        function renderVideoLesson(contentDiv) {
            stopVideo();
            ytAnsweredCheckpoints = new Set();
            const unitData = realCurriculum[state.level][state.unit];
            currentVideo = videoFor(state.level, state.unit);

            if (!currentVideo) {
                contentDiv.innerHTML = `
                    <h2 class="text-xl font-bold text-blue-800 mb-2">📹 Video Lesson — Unit ${state.unit}: ${unitData.title}</h2>
                    <div class="bg-blue-50 border-2 border-dashed border-blue-200 rounded-2xl p-10 text-center">
                        <div class="text-5xl mb-4">🎬</div>
                        <p class="text-xl font-bold text-blue-900 mb-2">Video Coming Soon!</p>
                        <p class="text-gray-600 mb-4">Your teacher is preparing the video for this unit. For now, try the other learning modules!</p>
                        <button onclick="switchTab('listening')" class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-5 py-2 rounded-full shadow cursor-pointer">🔊 Start with Listening</button>
                    </div>`;
                return;
            }

            if (currentVideo.mp4) { renderMp4Lesson(contentDiv, unitData); return; }
            const watchUrl = 'https://www.youtube.com/watch?v=' + currentVideo.id;
            contentDiv.innerHTML = `
                <h2 class="text-xl font-bold text-blue-800 mb-2">📹 Video Lesson — Unit ${state.unit}: ${unitData.title}</h2>
                <p class="text-gray-600 mb-4">${currentVideo.questions.length ? 'Watch the video. It will pause a few times so you can answer a quick question!' : 'Watch the video, then try the other learning modules!'}</p>
                <div class="relative bg-black rounded-2xl overflow-hidden" style="aspect-ratio:16/9;">
                    <div id="yt-player-el" class="w-full h-full"></div>
                    <div id="checkpoint-overlay" class="absolute inset-0 bg-blue-900/95 flex items-center justify-center p-6" style="display:none;"></div>
                </div>
                <p id="video-msg" class="text-sm text-gray-500 mt-3 text-center min-h-[1.25rem]">Loading video player…</p>
                <p class="text-center mt-1"><a href="${watchUrl}" target="_blank" rel="noopener" class="text-sm text-blue-600 underline">If the video does not play here, tap to open it in YouTube ↗</a></p>`;

            const showFallback = (why) => {
                const msg = document.getElementById('video-msg');
                if (msg) msg.innerHTML = `⚠️ ${why} <a href="${watchUrl}" target="_blank" rel="noopener" class="text-blue-600 underline font-semibold">Open the video in YouTube ↗</a>`;
            };
            // If the player hasn't started after 10 seconds, offer YouTube directly
            ytFallbackTimer = setTimeout(() => { if (!ytPlayer || typeof ytPlayer.getPlayerState !== 'function') showFallback('The video is taking long to load.'); }, 10000);

            const wanted = currentVideo.id;
            loadYouTubeApi().then(() => {
                if (!currentVideo || currentVideo.id !== wanted || !document.getElementById('yt-player-el')) return;   // student moved on
                ytPlayer = new YT.Player('yt-player-el', {
                    videoId: wanted,
                    playerVars: { rel: 0, modestbranding: 1, playsinline: 1 },
                    events: {
                        onReady: () => { if (ytFallbackTimer) clearTimeout(ytFallbackTimer); const m = document.getElementById('video-msg'); if (m) m.textContent = '▶️ Press play to start the lesson!'; },
                        onStateChange: onYtStateChange,
                        onError: () => showFallback('This video cannot play inside the lesson.')
                    }
                });
            }).catch(() => showFallback('The video player could not load.'));
        }

        const SUBTITLES = {"OC-Advanced-Unit01-Language-and-Thought":[[0.35,5.3,"Hello, everyone! I'm Ms. Sarah. Welcome to Online Advanced."],[5.6,8.57,"Hi! I'm Rithy. Let's learn together!"],[8.87,15.55,"Unit one: Language and Thought. In this unit, you will explore how language shapes the way we think."],[16.55,18.48,"linguistic relativity."],[19.18,25.21,"linguistic relativity means the idea that the language you speak influences how you think."],[25.51,33.51,"Linguistic relativity suggests that Khmer speakers may notice relationships differently from English speakers."],[34.21,37.76,"Your turn. Say: linguistic relativity."],[40.46,42.23,"linguistic relativity."],[43.25,44.25,"nuance."],[44.95,49.47,"nuance means a very small difference in meaning, feeling or tone."],[49.77,52.86,"Translation apps often miss the nuance of a joke."],[53.56,56.31,"Your turn. Say: nuance."],[59.01,59.91,"nuance."],[60.92,62.12,"connotation."],[62.81,68.0,"connotation means the feeling or idea a word suggests beyond its basic meaning."],[68.3,72.57,"'Cheap' has a negative connotation, but 'affordable' sounds positive."],[73.27,76.22,"Your turn. Say: connotation."],[78.92,80.1,"connotation."],[81.12,82.36,"ambiguity."],[83.06,87.84,"ambiguity means the possibility of understanding something in more than one way."],[88.14,91.35,"The ambiguity in the contract caused a long dispute."],[92.05,95.04,"Your turn. Say: ambiguity."],[97.74,99.0,"ambiguity."],[100.02,101.37,"articulate thought."],[102.07,106.72,"articulate thought means an idea expressed clearly and precisely."],[107.02,111.83,"Writing every day helps turn feelings into articulate thought."],[112.53,115.67,"Your turn. Say: articulate thought."],[118.37,119.79,"articulate thought."],[120.78,121.82,"inner voice."],[122.52,125.95,"inner voice means the voice you 'hear' in your head when you think."],[126.25,129.53,"My inner voice now speaks English when I study."],[130.24,133.28,"Your turn. Say: inner voice."],[135.98,137.13,"inner voice."],[138.15,139.36,"semantics."],[140.06,142.85,"semantics means the study of meaning in language."],[143.15,146.55,"The argument was really about semantics, not facts."],[147.25,149.96,"Your turn. Say: semantics."],[152.66,153.68,"semantics."],[154.68,156.11,"bilingual advantage."],[156.81,162.62,"bilingual advantage means the mental benefits some researchers link to speaking two languages."],[162.92,166.74,"The bilingual advantage may include better focus and flexibility."],[167.44,170.86,"Your turn. Say: bilingual advantage."],[173.56,175.11,"bilingual advantage."],[176.12,178.34,"Now let's listen to a conversation."],[178.64,182.45,"Rithy, do you ever think in English rather than in Khmer?"],[183.75,189.33,"Increasingly, yes. I'd been studying for years before my inner voice started switching languages."],[190.62,197.67,"That's fascinating. Some researchers argue for linguistic relativity: language shapes how we see the world."],[198.98,203.93,"I'm not entirely convinced. Surely thought comes first and language simply labels it?"],[205.25,212.82,"Perhaps, but consider connotation. 'Cheap' and 'affordable' describe the same price, yet they make us feel quite differently."],[214.12,219.87,"True. And Khmer has words for family relationships that English simply doesn't distinguish."],[221.18,226.08,"Exactly. Those nuances may train speakers to notice different things."],[227.38,232.44,"So being bilingual gives me two lenses rather than one. I like that idea."],[233.75,237.65,"Grammar focus: Narrative tenses for nuance."],[237.95,242.58,"At C1 level, narrative tenses express nuance as well as time."],[242.88,253.12,"Use the past perfect continuous to stress duration, the past continuous for interrupted actions, and the past perfect for completed earlier events."],[253.42,258.14,"For example: I had been studying for years before I started thinking in English."],[258.44,264.87,"At C1, choose tenses not just for time but for emphasis: duration, interruption or completion."],[265.88,268.96,"Now read and listen. Do We Think in Words?."],[269.26,273.94,"For centuries, philosophers have argued about whether thought is possible without language."],[275.25,281.22,"The theory of linguistic relativity claims that the language we speak shapes how we perceive reality."],[282.52,288.32,"Early versions of the theory were extreme, suggesting that language completely determines thought."],[289.62,295.94,"Modern research supports a weaker version: language influences, but does not control, our thinking."],[297.25,303.28,"For example, speakers of languages with many words for colours may distinguish shades more quickly."],[304.58,310.69,"Bilingual people often report that their personality feels slightly different in each language."],[311.98,317.69,"This may be because each language carries its own connotations, values and cultural memories."],[318.98,323.67,"Language, then, is not a prison for the mind, but it is certainly a lens."],[324.95,327.68,"Quiz time! Choose the correct answer."],[327.98,332.25,"The feeling a word suggests beyond its basic meaning is its blank."],[332.55,336.57,"A, semantics. B, connotation. C, ambiguity."],[340.58,343.27,"The answer is B: connotation."],[344.78,347.84,"I blank for an hour when I finally understood the text."],[348.14,353.07,"A, was reading. B, had been reading. C, have read."],[357.08,360.06,"The answer is B: had been reading."],[361.55,364.9,"While she blank the report, she noticed an error."],[365.2,369.04,"A, was checking. B, had checked. C, checks."],[373.05,375.76,"The answer is A: was checking."],[377.25,381.43,"The possibility of understanding something in two ways is blank."],[381.73,386.25,"A, nuance. B, ambiguity. C, inner voice."],[390.25,392.66,"The answer is B: ambiguity."],[394.15,398.78,"According to the text, modern research supports which version of the theory?"],[399.08,405.48,"A, an extreme version. B, a weaker version. C, no version."],[409.48,412.24,"The answer is B: a weaker version."],[413.75,419.06,"Now it's your turn. Part one: Does the language you speak change the way you think?"],[424.36,429.46,"Part two: Give two reasons and an example from Khmer and English."],[435.76,449.77,"I believe it does, to some extent. Firstly, Khmer forces me to notice age and status when I speak to people; secondly, English lets me be more direct. For example, I find it easier to disagree politely in English."],[450.07,452.25,"That is a well-argued answer!"],[453.25,458.03,"Great work today! You learned eight new words and narrative tenses for nuance."],[458.33,462.52,"Today's value is curiosity. Ask questions and find out."],[462.82,465.22,"See you in Unit two. Goodbye!"],[465.52,468.03,"Thank you, Ms. Sarah! Bye, everyone!"]],"OC-Advanced-Unit02-Identity-in-a-Globalised-World":[[0.35,4.9,"Hello, everyone! I'm Ms. Sarah. Welcome to Online Advanced."],[5.2,8.28,"Hi! I'm Rithy. Let's learn together!"],[8.58,17.4,"Unit two: Identity in a Globalised World. In this unit, you will discuss culture, belonging and identity in a connected world."],[18.38,19.95,"cultural hybridity."],[20.65,24.99,"cultural hybridity means the mixing of different cultures to create something new."],[25.29,28.7,"Phnom Penh's food scene shows real cultural hybridity."],[29.4,32.96,"Your turn. Say: cultural hybridity."],[35.66,37.07,"cultural hybridity."],[38.08,39.23,"assimilation."],[39.94,45.1,"assimilation means the process of becoming part of a new culture, often losing your own."],[45.4,49.04,"Full assimilation can mean losing your heritage language."],[49.74,52.5,"Your turn. Say: assimilation."],[55.2,56.31,"assimilation."],[57.32,58.48,"diaspora."],[59.18,64.43,"diaspora means people who live outside the country their family came from."],[64.73,69.05,"The Cambodian diaspora in California is large and active."],[69.75,72.41,"Your turn. Say: diaspora."],[75.11,76.16,"diaspora."],[77.15,78.58,"heritage language."],[79.28,85.26,"heritage language means the language of your family, learned at home rather than at school."],[85.56,89.62,"Many diaspora children speak Khmer only as a heritage language."],[90.32,93.59,"Your turn. Say: heritage language."],[96.28,97.72,"heritage language."],[98.72,99.82,"displacement."],[100.52,104.04,"displacement means being forced to leave your home or country."],[104.34,107.44,"War caused the displacement of millions of people."],[108.15,110.81,"Your turn. Say: displacement."],[113.51,114.63,"displacement."],[115.62,116.45,"rootless."],[117.16,120.37,"rootless means feeling that you don't belong anywhere."],[120.67,124.45,"After moving six times, she felt completely rootless."],[125.15,127.89,"Your turn. Say: rootless."],[130.59,131.56,"rootless."],[132.55,134.06,"global identity."],[134.76,140.49,"global identity means a sense of belonging to the world rather than one country."],[140.79,145.72,"Social media is helping young people develop a global identity."],[146.43,149.66,"Your turn. Say: global identity."],[152.36,153.79,"global identity."],[154.78,155.99,"acculturation."],[156.69,161.01,"acculturation means adapting to a new culture while keeping parts of your own."],[161.31,164.94,"Acculturation is often healthier than complete assimilation."],[165.64,168.65,"Your turn. Say: acculturation."],[171.35,172.55,"acculturation."],[173.55,175.75,"Now let's listen to a conversation."],[176.05,180.1,"My cousin grew up in Long Beach. She says she feels rootless."],[181.42,186.23,"That's common in the diaspora. She's neither fully American nor fully Cambodian."],[187.52,191.98,"She speaks Khmer only as a heritage language, mostly with her grandmother."],[193.28,200.06,"Many families experience that. By next year, she'll have been living there for twenty-five years."],[201.35,204.09,"Do you think she should try to assimilate completely?"],[205.38,211.41,"Researchers usually recommend acculturation instead: adapt, but keep your roots."],[212.72,217.04,"I suppose cultural hybridity can be a strength rather than a loss."],[218.35,223.62,"Absolutely. Many people now describe themselves as having a global identity."],[224.92,227.72,"Grammar focus: Future perfect continuous."],[228.02,235.03,"Use the future perfect continuous to stress how long an activity will have continued by a point in the future."],[235.33,239.49,"Will have been plus -ing, often with by and for."],[239.79,245.48,"For example: By 2030, I will have been living abroad for ten years."],[245.78,250.92,"It emphasises how long an activity will have continued by a certain future time."],[251.92,254.75,"Now read and listen. Between Two Worlds."],[255.06,261.35,"Around the world, over two hundred and eighty million people live outside the country where they were born."],[262.65,268.77,"For many of them, identity is not a single answer but a complex combination of places and languages."],[270.08,276.02,"Children of migrants often grow up speaking a heritage language at home and another language at school."],[277.32,282.09,"Some families choose assimilation, hoping their children will fit in more easily."],[283.38,288.94,"Others prefer acculturation, encouraging children to adapt while keeping their traditions."],[290.25,295.04,"Psychologists suggest that the second approach often leads to stronger self-esteem."],[296.35,303.38,"Feeling rootless is common, yet many people eventually see cultural hybridity as a source of creativity."],[304.68,310.8,"In a globalised world, belonging may depend less on geography and more on shared values."],[312.12,314.91,"Quiz time! Choose the correct answer."],[315.21,319.61,"People living outside their family's country of origin are the blank."],[319.91,324.38,"A, diaspora. B, displacement. C, assimilation."],[328.38,331.14,"The answer is A: diaspora."],[332.65,335.67,"By December, I blank English for five years."],[335.97,341.3,"A, will have been learning. B, will learn. C, have learned."],[345.28,348.07,"The answer is A: will have been learning."],[349.58,352.01,"How long blank there by the time you retire?"],[352.31,357.13,"A, will you work. B, will you have been working. C, have you worked."],[361.12,364.27,"The answer is B: will you have been working."],[365.75,369.39,"Adapting to a new culture while keeping your own is blank."],[369.69,375.43,"A, assimilation. B, acculturation. C, rootless."],[379.42,382.06,"The answer is B: acculturation."],[383.55,388.12,"According to the text, which approach often leads to stronger self-esteem?"],[388.42,394.19,"A, assimilation. B, acculturation. C, isolation."],[398.18,400.81,"The answer is B: acculturation."],[402.32,408.05,"Now it's your turn. Part one: Is it possible to belong to more than one culture?"],[413.35,418.44,"Part two: Explain your view with two reasons and a personal example."],[424.75,438.05,"I think it is. First, people can switch naturally between cultural codes; second, mixed identities often bring creativity. My cousin, for example, celebrates both Khmer New Year and Thanksgiving with equal pride."],[438.35,440.33,"That is a well-argued answer!"],[441.35,446.52,"Great work today! You learned eight new words and future perfect continuous."],[446.82,451.43,"Today's value is respect for culture. Be proud of our Khmer culture."],[451.73,454.13,"See you in Unit three. Goodbye!"],[454.43,457.6,"Thank you, Ms. Sarah! Bye, everyone!"]],"OC-Advanced-Unit03-The-Ethics-of-AI":[[0.35,5.18,"Hello, everyone! I'm Ms. Sarah. Welcome to Online Advanced."],[5.48,8.53,"Hi! I'm Rithy. Let's learn together!"],[8.83,17.09,"Unit three: The Ethics of AI. In this unit, you will debate the risks and responsibilities of artificial intelligence."],[18.08,19.65,"algorithmic bias."],[20.35,26.65,"algorithmic bias means unfair results produced by a computer system because of biased data."],[26.95,31.48,"Algorithmic bias led the hiring tool to reject female applicants."],[32.18,36.27,"Your turn. Say: algorithmic bias."],[38.97,40.7,"algorithmic bias."],[41.72,43.24,"accountability gap."],[43.94,49.86,"accountability gap means a situation where nobody can be held responsible for a harmful decision."],[50.16,54.9,"When an AI makes a mistake, there is often an accountability gap."],[55.6,59.08,"Your turn. Say: accountability gap."],[61.78,63.26,"accountability gap."],[64.25,65.72,"autonomous weapon."],[66.42,71.63,"autonomous weapon means a weapon that can choose and attack targets without human control."],[71.93,74.97,"Many scientists want to ban autonomous weapons."],[75.67,79.08,"Your turn. Say: autonomous weapon."],[81.78,83.22,"autonomous weapon."],[84.22,85.68,"explainability."],[86.38,91.4,"explainability means the ability to explain how an AI reached its decision."],[91.7,96.39,"Banks must ensure explainability when AI rejects a loan."],[97.09,99.84,"Your turn. Say: explainability."],[102.54,103.93,"explainability."],[104.95,106.29,"ethical framework."],[106.99,111.48,"ethical framework means a set of principles that guide right and wrong decisions."],[111.78,115.72,"The company published an ethical framework for its AI products."],[116.42,119.49,"Your turn. Say: ethical framework."],[122.19,123.4,"ethical framework."],[124.42,125.95,"data exploitation."],[126.65,131.65,"data exploitation means using people's data unfairly for profit."],[131.95,136.08,"Critics accuse social networks of data exploitation."],[136.78,140.81,"Your turn. Say: data exploitation."],[143.5,145.26,"data exploitation."],[146.25,147.62,"machine ethics."],[148.32,152.78,"machine ethics means the study of how machines should make moral decisions."],[153.08,157.28,"Self-driving cars raise difficult questions of machine ethics."],[157.98,161.44,"Your turn. Say: machine ethics."],[164.14,165.6,"machine ethics."],[166.58,167.97,"moral agency."],[168.67,173.65,"moral agency means the ability to make moral choices and be responsible for them."],[173.95,176.51,"Can a machine ever have moral agency?"],[177.21,180.41,"Your turn. Say: moral agency."],[183.11,184.43,"moral agency."],[185.42,187.6,"Now let's listen to a conversation."],[187.9,192.25,"Rithy, should AI be allowed to make decisions about people's lives?"],[193.55,198.78,"Only with strict limits. Algorithmic bias has already caused serious harm."],[200.08,201.08,"Such as?"],[202.38,207.03,"Hiring systems that rejected women because the training data came mostly from men."],[208.32,212.44,"And who is responsible when that happens? There's a real accountability gap."],[213.75,219.13,"Exactly. Had the company tested the system properly, the problem would have been found."],[220.42,223.4,"Should companies be forced to guarantee explainability?"],[224.72,229.96,"Definitely. Were I a regulator, I would require it for every high-risk system."],[231.25,234.71,"Grammar focus: Inversion in conditionals."],[235.01,239.32,"In formal English, we can drop if and invert the subject and auxiliary."],[239.62,245.89,"Had they tested means if they had tested; were I means if I were; should you need means if you need."],[246.19,250.56,"For example: Had they tested the system, they would have found the bias."],[250.86,256.8,"Inverted conditionals drop 'if' and are common in formal writing, reports and speeches."],[257.78,263.05,"Now read and listen. Who Is Responsible When AI Gets It Wrong?."],[263.35,268.69,"Artificial intelligence now helps decide who gets a loan, a job or even medical treatment."],[269.98,275.4,"These systems learn from data, and if the data is biased, the results will be biased too."],[276.68,283.91,"In one famous case, a recruitment tool learned to prefer male candidates because past hires were mostly men."],[285.22,290.81,"When such mistakes occur, it is often unclear who should be held accountable."],[292.12,296.44,"Is it the programmer, the company, or the users who trusted the system?"],[297.75,304.92,"Many experts argue that explainability should be a legal requirement for high-risk AI."],[306.22,311.95,"Others warn that autonomous weapons represent the most dangerous accountability gap of all."],[313.25,318.06,"Should these issues remain unresolved, public trust in technology may collapse."],[319.35,321.96,"Quiz time! Choose the correct answer."],[322.26,326.46,"Unfair results caused by biased data are called blank."],[326.76,332.23,"A, machine ethics. B, algorithmic bias. C, moral agency."],[336.22,339.26,"The answer is B: algorithmic bias."],[340.75,344.53,"blank we known about the bias, we would have stopped the project."],[344.83,347.53,"A, If. B, Had. C, Were."],[351.52,353.95,"The answer is B: Had."],[355.45,358.1,"blank I in charge, I would change the policy."],[358.4,361.26,"A, Were. B, Had. C, Should."],[365.25,366.68,"The answer is A: Were."],[368.18,372.21,"The ability to explain how an AI reached its decision is blank."],[372.51,379.37,"A, explainability. B, data exploitation. C, ethical framework."],[383.38,386.22,"The answer is A: explainability."],[387.72,391.54,"According to the text, why did the recruitment tool prefer men?"],[391.84,397.77,"A, it was programmed to. B, past hires were mostly men. C, women applied less."],[401.78,405.7,"The answer is B: past hires were mostly men."],[407.18,413.34,"Now it's your turn. Part one: Should there be international laws controlling artificial intelligence?"],[418.64,423.99,"Part two: Give your position, two reasons, and one example of a risk."],[430.29,448.01,"Yes, I strongly believe so. Firstly, AI crosses borders, so national laws alone are not enough; secondly, the risks are too serious to leave to companies. Autonomous weapons, for example, could make life-or-death decisions without any human control."],[448.31,450.75,"That is a well-argued answer!"],[451.75,457.12,"Great work today! You learned eight new words and inversion in conditionals."],[457.42,461.85,"Today's value is responsibility. Help at home and do your jobs."],[462.15,464.59,"See you in Unit four. Goodbye!"],[464.89,467.52,"Thank you, Ms. Sarah! Bye, everyone!"]],"OC-Advanced-Unit04-Leadership":[[0.35,4.92,"Hello, everyone! I'm Ms. Sarah. Welcome to Online Advanced."],[5.22,8.21,"Hi! I'm Rithy. Let's learn together!"],[8.51,15.56,"Unit four: Leadership. In this unit, you will analyse different leadership styles and qualities."],[16.55,17.49,"visionary."],[18.19,23.06,"visionary means having a clear, inspiring idea of the future."],[23.36,28.38,"She is a visionary leader who saw the potential of online learning early."],[29.08,32.14,"Your turn. Say: visionary."],[34.84,35.8,"visionary."],[36.82,37.84,"delegation."],[38.54,42.95,"delegation means giving tasks and responsibility to other people."],[43.26,46.64,"Good delegation frees leaders to focus on strategy."],[47.34,50.26,"Your turn. Say: delegation."],[52.96,53.98,"delegation."],[54.98,57.2,"decision-making."],[57.9,62.0,"decision-making means the process of choosing between options."],[62.3,64.73,"Clear data improves decision-making."],[65.43,69.0,"Your turn. Say: decision-making."],[71.7,74.03,"decision-making."],[75.02,75.96,"charisma."],[76.66,81.63,"charisma means a strong personal charm that attracts and influences people."],[81.93,84.67,"His charisma made everyone want to follow him."],[85.37,88.0,"Your turn. Say: charisma."],[90.7,91.55,"charisma."],[92.55,93.88,"servant leadership."],[94.58,100.78,"servant leadership means a style where the leader focuses on helping the team grow."],[101.08,104.02,"Servant leadership builds loyalty and trust."],[104.72,107.99,"Your turn. Say: servant leadership."],[110.69,112.07,"servant leadership."],[113.08,114.22,"micromanage."],[114.92,118.95,"micromanage means to control every small detail of other people's work."],[119.25,122.0,"Nobody likes a boss who micromanages."],[122.7,126.26,"Your turn. Say: micromanage."],[128.96,130.07,"micromanage."],[131.08,132.34,"consensus."],[133.04,135.98,"consensus means general agreement among a group."],[136.28,139.35,"The team reached a consensus after a long discussion."],[140.05,143.28,"Your turn. Say: consensus."],[145.98,147.09,"consensus."],[148.08,149.53,"inspire trust."],[150.23,154.2,"inspire trust means to make people believe in you and rely on you."],[154.5,157.89,"Honest leaders inspire trust even in difficult times."],[158.59,161.74,"Your turn. Say: inspire trust."],[164.44,165.93,"inspire trust."],[166.92,169.12,"Now let's listen to a conversation."],[169.43,172.13,"Rithy, what do you think makes a great leader?"],[173.42,179.0,"It's not charisma that matters most. What really counts is the ability to inspire trust."],[180.28,184.19,"Interesting. Many people would say charisma is essential."],[185.48,190.55,"Charisma helps, but it was my first manager's honesty that made me respect her."],[191.85,193.34,"Was she a visionary?"],[194.65,199.86,"Not really. What she did brilliantly was delegation. She never micromanaged us."],[201.15,203.17,"That sounds like servant leadership."],[204.48,210.12,"Exactly. All she wanted was for the team to grow, and we reached consensus easily."],[211.42,214.81,"Grammar focus: Advanced cleft sentences."],[215.11,219.19,"Advanced cleft sentences help you emphasise exactly what you want."],[219.49,224.13,"What really counts is, it was something that, and all she wanted was."],[224.43,228.15,"For example: It was her honesty that made me respect her."],[228.45,233.52,"Cleft sentences let you control emphasis in speeches, essays and debates."],[234.52,238.23,"Now read and listen. The Quiet Power of Servant Leaders."],[238.53,243.43,"For decades, leadership was associated with charisma, confidence and command."],[244.72,251.44,"However, research increasingly shows that the most effective leaders are often quiet and humble."],[252.75,256.78,"What these leaders share is a focus on helping their teams succeed."],[258.08,262.45,"This style, known as servant leadership, puts the needs of employees first."],[263.75,269.21,"Servant leaders delegate responsibility instead of trying to micromanage every task."],[270.52,274.47,"They also involve their teams in decision-making and look for consensus."],[275.78,279.58,"It is this sense of respect that inspires trust and loyalty."],[280.88,286.34,"In a fast-changing world, the best leaders may be those who listen more than they speak."],[287.65,290.15,"Quiz time! Choose the correct answer."],[290.45,293.63,"Giving tasks and responsibility to others is blank."],[293.94,298.77,"A, delegation. B, charisma. C, consensus."],[302.78,305.4,"The answer is A: delegation."],[306.88,309.0,"blank I need is a little more time."],[309.3,312.12,"A, What. B, It. C, That."],[316.12,318.26,"The answer is A: What."],[319.75,322.71,"It was the coach blank changed the team's attitude."],[323.01,326.39,"A, what. B, who. C, which."],[330.38,332.32,"The answer is B: who."],[333.82,337.37,"To control every small detail of others' work is to blank."],[337.67,343.28,"A, inspire trust. B, micromanage. C, delegate."],[347.28,350.01,"The answer is B: micromanage."],[351.52,355.12,"According to the text, what do servant leaders put first?"],[355.42,360.88,"A, profit. B, the needs of employees. C, their own image."],[364.88,368.32,"The answer is B: the needs of employees."],[369.82,374.61,"Now it's your turn. Part one: What kind of leader would you like to be?"],[379.9,385.4,"Part two: Explain two qualities you value and describe a leader you admire."],[391.7,404.69,"What I'd most like to be is a servant leader. I value honesty and good delegation. It was my high-school teacher who showed me this: she trusted us with real responsibility, and we never wanted to let her down."],[404.99,407.15,"That is a well-argued answer!"],[408.15,413.17,"Great work today! You learned eight new words and advanced cleft sentences."],[413.47,417.04,"Today's value is respect. Thank the people who help us."],[417.34,420.02,"See you in Unit five. Goodbye!"],[420.32,422.76,"Thank you, Ms. Sarah! Bye, everyone!"]],"OC-Advanced-Unit05-Behavioural-Economics":[[0.35,5.63,"Hello, everyone! I'm Ms. Sarah. Welcome to Online Advanced."],[5.93,9.12,"Hi! I'm Rithy. Let's learn together!"],[9.42,18.48,"Unit five: Behavioural Economics. In this unit, you will understand how psychology shapes our economic decisions."],[19.48,20.33,"nudge."],[21.03,26.34,"nudge means a small change that gently encourages people to choose something."],[26.64,30.49,"Placing fruit at eye level is a nudge towards healthier eating."],[31.19,34.19,"Your turn. Say: nudge."],[36.89,37.59,"nudge."],[38.58,40.03,"cognitive bias."],[40.73,45.83,"cognitive bias means a common error in thinking that affects our judgements."],[46.12,49.91,"Confirmation bias is a well-known cognitive bias."],[50.61,53.96,"Your turn. Say: cognitive bias."],[56.66,58.17,"cognitive bias."],[59.18,60.49,"loss aversion."],[61.19,66.81,"loss aversion means the tendency to fear losses more than we value equal gains."],[67.11,70.87,"Loss aversion explains why people keep losing investments."],[71.57,75.37,"Your turn. Say: loss aversion."],[78.07,79.28,"loss aversion."],[80.28,81.22,"anchoring."],[81.91,85.63,"anchoring means relying too much on the first number or fact you hear."],[85.93,89.31,"Shops use anchoring by showing a high 'original' price."],[90.01,92.59,"Your turn. Say: anchoring."],[95.28,96.19,"anchoring."],[97.18,98.35,"herd behaviour."],[99.05,103.75,"herd behaviour means following what a crowd does instead of deciding independently."],[104.05,107.1,"Herd behaviour can cause sudden market crashes."],[107.8,111.04,"Your turn. Say: herd behaviour."],[113.74,114.83,"herd behaviour."],[115.85,117.33,"rational choice."],[118.03,124.21,"rational choice means a decision based purely on logic and self-interest."],[124.51,128.75,"Classical economics assumes everyone makes a rational choice."],[129.45,132.76,"Your turn. Say: rational choice."],[135.46,136.95,"rational choice."],[137.95,138.99,"incentive."],[139.69,142.79,"incentive means something that motivates people to act."],[143.09,147.03,"Tax discounts are an incentive to install solar panels."],[147.73,151.15,"Your turn. Say: incentive."],[153.84,154.97,"incentive."],[155.98,157.34,"impulse control."],[158.04,161.94,"impulse control means the ability to resist sudden desires."],[162.24,164.96,"Online shopping tests our impulse control."],[165.66,168.7,"Your turn. Say: impulse control."],[171.4,172.67,"impulse control."],[173.68,175.93,"Now let's listen to a conversation."],[176.23,180.42,"Rithy, do you think people usually make rational choices with money?"],[181.72,186.18,"Not really. Faced with a sale, most of us forget all logic."],[187.48,194.31,"That's anchoring. Shown a 'before' price of a hundred dollars, a fifty-dollar price feels like a bargain."],[195.62,202.61,"And loss aversion is even stronger. I once kept a bad investment for months, hoping to avoid a loss."],[203.92,208.55,"Very common. Governments now use nudges to help people decide better."],[209.85,214.66,"Like automatic pension savings? Once enrolled, people rarely opt out."],[215.95,220.99,"Exactly. Simple incentives can change behaviour more than long lectures."],[222.28,225.76,"Though, if overused, nudges might feel manipulative."],[227.05,230.84,"Grammar focus: Participle and verbless clauses."],[231.14,235.23,"Participle and verbless clauses make sentences shorter and more formal."],[235.53,240.42,"Faced with a sale, we forget logic. Once enrolled, people rarely leave."],[240.72,244.31,"The understood subject must match the subject of the main clause."],[244.61,251.24,"These compact clauses make academic writing concise; make sure the subject matches the main clause."],[252.25,255.91,"Now read and listen. Why We Don't Behave Like Economists."],[256.21,260.89,"Traditional economics assumed that people always make rational choices."],[262.18,267.84,"Behavioural economists, however, have shown that our decisions are full of predictable errors."],[269.15,273.87,"Asked to estimate a price, we are strongly influenced by the first number we hear."],[275.15,280.26,"Fearing losses more than we value gains, we often hold on to bad investments."],[281.55,285.19,"Herd behaviour makes us follow crowds, even when they are wrong."],[286.48,292.18,"Recognising these biases, governments began designing 'nudges' to guide better choices."],[293.48,299.51,"Once introduced, automatic saving plans dramatically increased pension savings in several countries."],[300.82,305.34,"Used responsibly, nudges respect freedom while improving wellbeing."],[306.65,309.26,"Quiz time! Choose the correct answer."],[309.56,312.53,"Relying too much on the first number you hear is blank."],[312.83,317.46,"A, anchoring. B, herd behaviour. C, incentive."],[321.45,324.62,"The answer is A: anchoring."],[326.12,329.69,"blank with a difficult choice, she asked for advice."],[330.0,334.21,"A, Facing. B, Faced. C, To face."],[338.22,340.12,"The answer is B: Faced."],[341.62,343.69,"blank in doubt, check the facts."],[343.99,346.92,"A, When. B, Being. C, Had."],[350.92,352.75,"The answer is A: When."],[354.25,357.62,"Fearing losses more than valuing equal gains is blank."],[357.92,364.31,"A, loss aversion. B, impulse control. C, rational choice."],[368.32,371.07,"The answer is A: loss aversion."],[372.58,376.5,"According to the text, what increased pension savings?"],[376.8,383.39,"A, higher salaries. B, automatic saving plans. C, new taxes."],[387.38,391.18,"The answer is B: automatic saving plans."],[392.68,398.57,"Now it's your turn. Part one: Are nudges a fair way for governments to influence people?"],[403.88,409.69,"Part two: State your position, give two reasons, and suggest one nudge for Cambodia."],[415.99,429.27,"I think they are fair, if used transparently. Firstly, they preserve freedom of choice; secondly, they are cheap and effective. For instance, Cambodian schools could place water, not sugary drinks, at the front of canteens."],[429.57,432.27,"That is a well-argued answer!"],[433.28,438.33,"Great work today! You learned eight new words and participle and verbless clauses."],[438.63,443.9,"Today's value is responsibility. Help at home and do your jobs."],[444.2,446.9,"See you in Unit six. Goodbye!"],[447.2,449.62,"Thank you, Ms. Sarah! Bye, everyone!"]],"OC-Advanced-Unit06-Urban-Futures":[[0.35,5.26,"Hello, everyone! I'm Ms. Sarah. Welcome to Online Advanced."],[5.56,8.62,"Hi! I'm Rithy. Let's learn together!"],[8.92,16.25,"Unit six: Urban Futures. In this unit, you will discuss how cities can become sustainable and liveable."],[17.25,18.27,"megacity."],[18.97,22.59,"megacity means a city with more than ten million people."],[22.89,26.04,"Jakarta and Manila are megacities."],[26.74,29.88,"Your turn. Say: megacity."],[32.58,33.58,"megacity."],[34.58,36.11,"green infrastructure."],[36.81,42.49,"green infrastructure means parks, trees and wetlands used to manage water and heat in cities."],[42.79,45.75,"Green infrastructure can reduce flooding."],[46.45,49.62,"Your turn. Say: green infrastructure."],[52.33,53.95,"green infrastructure."],[54.95,56.16,"vertical farming."],[56.86,61.68,"vertical farming means growing crops in stacked layers inside buildings."],[61.98,65.01,"Vertical farming uses ninety percent less water."],[65.71,68.89,"Your turn. Say: vertical farming."],[71.59,72.76,"vertical farming."],[73.75,75.3,"mixed-use development."],[76.0,81.7,"mixed-use development means a project combining homes, shops and offices in one area."],[82.0,84.93,"Mixed-use developments reduce the need to drive."],[85.63,89.11,"Your turn. Say: mixed-use development."],[91.81,93.17,"mixed-use development."],[94.15,95.48,"walkability."],[96.18,101.03,"walkability means how easy and pleasant it is to walk in an area."],[101.33,103.82,"Shaded pavements improve walkability."],[104.52,107.94,"Your turn. Say: walkability."],[110.64,111.81,"walkability."],[112.82,114.25,"urban heat island."],[114.95,119.52,"urban heat island means a city area much hotter than its surroundings."],[119.82,123.08,"Concrete and traffic create an urban heat island."],[123.78,127.14,"Your turn. Say: urban heat island."],[129.84,131.08,"urban heat island."],[132.08,133.12,"public realm."],[133.82,138.16,"public realm means streets, squares and parks open to everyone."],[138.46,141.81,"Investing in the public realm makes cities fairer."],[142.51,145.5,"Your turn. Say: public realm."],[148.2,149.24,"public realm."],[150.25,151.29,"smart grid."],[151.99,157.47,"smart grid means an electricity network that uses data to manage supply efficiently."],[157.77,160.78,"A smart grid can balance solar power and demand."],[161.48,164.1,"Your turn. Say: smart grid."],[166.8,167.87,"smart grid."],[168.85,171.09,"Now let's listen to a conversation."],[171.39,173.68,"Phnom Penh is getting hotter every year."],[174.98,179.68,"That's the urban heat island effect. Concrete has been allowed to replace trees."],[180.98,182.18,"Can it be reversed?"],[183.48,189.23,"It's being tackled in Singapore through green infrastructure: rooftop gardens, parks and canals."],[190.52,195.19,"I've read that vertical farms are expected to be built in several Asian megacities."],[196.48,200.43,"Yes, and mixed-use developments are said to improve walkability."],[201.75,205.87,"Our public realm needs to be redesigned for people, not just cars."],[207.18,210.87,"Agreed. The best cities are being planned around pedestrians."],[212.18,214.66,"Grammar focus: Advanced passives."],[214.96,219.37,"Advanced passives include continuous and infinitive forms."],[219.67,226.03,"The problem is being tackled. Farms are expected to be built. The plan is thought to have reduced traffic."],[226.33,228.48,"They are typical of formal reports."],[228.78,235.05,"Advanced passives are common in reports, news and academic writing about planning and policy."],[236.05,239.46,"Now read and listen. Designing Cities for People."],[239.76,245.21,"By 2050, nearly seven in ten people are expected to live in cities."],[246.52,250.44,"Many megacities are already struggling with heat, traffic and pollution."],[251.75,257.3,"In some neighbourhoods, temperatures have been measured several degrees higher than in the countryside."],[258.62,265.1,"Green infrastructure, such as trees and wetlands, is now being used to cool streets and absorb rainwater."],[266.38,273.26,"Planners are also promoting mixed-use developments, where people can live, work and shop within walking distance."],[274.55,279.32,"Vertical farming is thought to have great potential for feeding dense populations."],[280.62,286.19,"Meanwhile, smart grids are being installed to manage energy more efficiently."],[287.48,293.33,"The cities of the future, it is argued, must be designed around people rather than cars."],[294.62,297.54,"Quiz time! Choose the correct answer."],[297.84,300.89,"A city with more than ten million people is a blank."],[301.19,305.26,"A, megacity. B, smart grid. C, public realm."],[309.25,311.78,"The answer is A: megacity."],[313.28,315.32,"A new park blank at the moment."],[315.62,319.72,"A, is building. B, is being built. C, has built."],[323.72,326.44,"The answer is B: is being built."],[327.95,330.32,"The bridge is expected blank next year."],[330.62,334.81,"A, to complete. B, to be completed. C, completing."],[338.82,341.72,"The answer is B: to be completed."],[343.22,346.05,"How easy it is to walk in an area is blank."],[346.35,352.03,"A, walkability. B, vertical farming. C, green infrastructure."],[356.02,358.78,"The answer is A: walkability."],[360.28,364.15,"According to the text, what is being used to cool streets?"],[364.45,371.0,"A, air conditioning. B, green infrastructure. C, smart grids."],[374.98,377.82,"The answer is B: green infrastructure."],[379.32,384.35,"Now it's your turn. Part one: How could Phnom Penh become a more liveable city?"],[389.65,394.6,"Part two: Propose two changes and explain how each would help residents."],[400.9,413.47,"First, more shade trees should be planted along major roads to reduce heat; second, mixed-use neighbourhoods should be encouraged so that people can walk to work. Together, these would cut traffic and improve health."],[413.76,415.93,"That is a well-argued answer!"],[416.92,421.8,"Great work today! You learned eight new words and advanced passives."],[422.1,425.85,"Today's value is community. Help the people in your town."],[426.15,428.76,"See you in Unit seven. Goodbye!"],[429.06,432.14,"Thank you, Ms. Sarah! Bye, everyone!"]],"OC-Advanced-Unit07-Medical-Ethics":[[0.35,5.69,"Hello, everyone! I'm Ms. Sarah. Welcome to Online Advanced."],[5.99,9.19,"Hi! I'm Rithy. Let's learn together!"],[9.49,16.81,"Unit seven: Medical Ethics. In this unit, you will discuss difficult ethical questions in medicine."],[17.82,19.28,"informed consent."],[19.98,24.55,"informed consent means agreeing to treatment after understanding the risks."],[24.85,28.34,"Doctors must obtain informed consent before surgery."],[29.05,32.7,"Your turn. Say: informed consent."],[35.4,36.99,"informed consent."],[37.98,39.03,"euthanasia."],[39.73,43.37,"euthanasia means ending a patient's life to stop suffering."],[43.67,47.59,"Euthanasia is legal in only a few countries."],[48.29,51.7,"Your turn. Say: euthanasia."],[54.4,55.51,"euthanasia."],[56.52,57.91,"organ donation."],[58.61,63.16,"organ donation means giving a body organ to help another person."],[63.45,66.75,"Organ donation saves thousands of lives every year."],[67.45,70.99,"Your turn. Say: organ donation."],[73.69,74.96,"organ donation."],[75.95,77.36,"patient autonomy."],[78.06,82.97,"patient autonomy means a patient's right to make decisions about their own care."],[83.27,87.3,"Patient autonomy means respecting a refusal of treatment."],[88.0,91.97,"Your turn. Say: patient autonomy."],[94.67,96.14,"patient autonomy."],[97.15,98.84,"confidentiality."],[99.54,103.27,"confidentiality means keeping private information secret."],[103.57,107.24,"Medical confidentiality protects patients' trust."],[107.94,111.54,"Your turn. Say: confidentiality."],[114.24,115.61,"confidentiality."],[116.62,117.92,"clinical ethics."],[118.62,122.71,"clinical ethics means moral principles guiding medical decisions."],[123.01,125.66,"The hospital has a clinical ethics committee."],[126.36,129.7,"Your turn. Say: clinical ethics."],[132.4,133.88,"clinical ethics."],[134.88,136.1,"life support."],[136.81,140.95,"life support means machines that keep a seriously ill person alive."],[141.25,143.75,"The family had to decide about life support."],[144.45,147.45,"Your turn. Say: life support."],[150.15,151.28,"life support."],[152.28,153.53,"genetic testing."],[154.23,159.12,"genetic testing means analysing DNA to find health risks."],[159.42,162.42,"Genetic testing can reveal inherited diseases."],[163.12,166.18,"Your turn. Say: genetic testing."],[168.88,170.22,"genetic testing."],[171.22,173.52,"Now let's listen to a conversation."],[173.82,177.99,"Rithy, imagine a patient refuses treatment that could save her life."],[179.28,182.61,"Then the doctors must respect her autonomy, mustn't they?"],[183.92,187.04,"Generally, yes, but they might have misunderstood her wishes."],[188.35,193.53,"True. She can't have given informed consent if nobody explained the risks clearly."],[194.82,200.35,"Exactly. And what about genetic testing? Should employers ever see the results?"],[201.65,204.99,"Absolutely not. That would break confidentiality."],[206.28,210.51,"Some argue the family should be told if the result affects them too."],[211.82,215.36,"That must be one of the hardest questions in clinical ethics."],[216.65,220.07,"Grammar focus: Modals of deduction (nuance)."],[220.37,224.73,"Modals of deduction show how certain you are, about the present or the past."],[225.03,230.8,"Must and can't for strong certainty, might and could for possibility, and should for expectation."],[231.09,236.69,"For example: She can't have understood the risks. The results should be ready by now."],[236.99,243.74,"'Should' can express logical expectation, not only advice: The parcel should arrive today."],[244.75,247.61,"Now read and listen. Who Decides?."],[247.91,251.56,"Modern medicine can keep people alive longer than ever before."],[252.85,256.97,"Yet this power raises difficult questions about who should make decisions."],[258.28,262.54,"Patient autonomy means that adults have the right to accept or refuse treatment."],[263.85,268.09,"However, decisions are only valid if they are based on informed consent."],[269.38,273.9,"Life support creates further dilemmas when patients cannot express their wishes."],[275.22,280.06,"Genetic testing adds another layer, since results may affect relatives as well."],[281.35,287.98,"Hospital ethics committees must balance autonomy, confidentiality and the duty to protect life."],[289.28,293.86,"There are rarely perfect answers, which is why open discussion is essential."],[295.15,297.79,"Quiz time! Choose the correct answer."],[298.09,300.83,"Keeping private information secret is blank."],[301.13,306.6,"A, confidentiality. B, euthanasia. C, life support."],[310.58,313.77,"The answer is A: confidentiality."],[315.28,318.64,"He looks exhausted. He blank been working all night."],[318.94,322.8,"A, can't have. B, must have. C, should."],[326.78,328.7,"The answer is B: must have."],[330.22,333.53,"She blank have received my message; her phone was off."],[333.83,336.98,"A, must. B, can't. C, should."],[340.98,343.63,"The answer is B: can't."],[345.12,348.51,"A patient's right to make decisions about their care is blank."],[348.81,353.67,"A, patient autonomy. B, organ donation. C, genetic testing."],[357.68,360.82,"The answer is A: patient autonomy."],[362.32,366.87,"According to the text, decisions are only valid if they are based on blank."],[367.17,373.27,"A, family wishes. B, informed consent. C, doctors' opinions."],[377.28,380.22,"The answer is B: informed consent."],[381.72,388.7,"Now it's your turn. Part one: Should organ donation be automatic unless people choose to opt out?"],[394.0,398.39,"Part two: Give your position, two arguments, and one possible problem."],[404.69,418.79,"I support an opt-out system. Firstly, it would save many lives; secondly, most people say they agree with donation but never register. However, families might feel their wishes were ignored, so clear communication is essential."],[419.09,421.59,"That is a well-argued answer!"],[422.58,428.3,"Great work today! You learned eight new words and modals of deduction (nuance)."],[428.6,432.9,"Today's value is empathy. Think about how others feel."],[433.2,435.85,"See you in Unit eight. Goodbye!"],[436.15,438.89,"Thank you, Ms. Sarah! Bye, everyone!"]],"OC-Advanced-Unit08-Creativity-and-Innovation":[[0.35,4.89,"Hello, everyone! I'm Ms. Sarah. Welcome to Online Advanced."],[5.19,8.28,"Hi! I'm Rithy. Let's learn together!"],[8.58,16.64,"Unit eight: Creativity and Innovation. In this unit, you will discuss how new ideas are created and developed."],[17.65,18.82,"divergent thinking."],[19.52,24.3,"divergent thinking means producing many different ideas from one starting point."],[24.6,27.35,"Brainstorming encourages divergent thinking."],[28.05,31.66,"Your turn. Say: divergent thinking."],[34.36,35.6,"divergent thinking."],[36.62,37.8,"ideation."],[38.5,42.35,"ideation means the process of forming new ideas."],[42.65,45.81,"The ideation session produced fifty suggestions."],[46.51,49.62,"Your turn. Say: ideation."],[52.31,53.45,"ideation."],[54.45,55.94,"disruptive innovation."],[56.64,62.06,"disruptive innovation means a new idea that completely changes an industry."],[62.36,66.1,"Ride-hailing apps were a disruptive innovation for taxis."],[66.8,69.69,"Your turn. Say: disruptive innovation."],[72.39,73.83,"disruptive innovation."],[74.82,76.18,"lateral thinking."],[76.88,81.5,"lateral thinking means solving problems in creative, unexpected ways."],[81.8,84.08,"The puzzle requires lateral thinking."],[84.78,87.95,"Your turn. Say: lateral thinking."],[90.65,91.98,"lateral thinking."],[92.98,94.37,"creative process."],[95.07,100.06,"creative process means the stages of developing an original idea."],[100.36,103.19,"Every artist has a different creative process."],[103.89,107.17,"Your turn. Say: creative process."],[109.87,111.35,"creative process."],[112.35,113.43,"incubator."],[114.13,118.27,"incubator means an organisation that helps new businesses grow."],[118.57,121.76,"The university incubator supports ten start-ups."],[122.46,125.8,"Your turn. Say: incubator."],[128.5,129.5,"incubator."],[130.52,131.8,"breakthrough idea."],[132.5,137.34,"breakthrough idea means an idea that solves a problem in a completely new way."],[137.64,140.78,"Mobile money was a breakthrough idea for rural banking."],[141.48,144.65,"Your turn. Say: breakthrough idea."],[147.35,148.55,"breakthrough idea."],[149.55,150.57,"iteration."],[151.27,156.0,"iteration means a repeated version of something, improved each time."],[156.3,159.34,"The app went through twelve iterations before launch."],[160.03,162.94,"Your turn. Say: iteration."],[165.64,166.68,"iteration."],[167.68,169.89,"Now let's listen to a conversation."],[170.19,172.96,"Ms. Sarah, where do breakthrough ideas come from?"],[174.25,179.08,"Usually from a long creative process, not a single moment of genius."],[180.38,182.56,"So divergent thinking comes first?"],[183.85,190.08,"Yes. During ideation, it's essential that everyone suggest ideas freely, without judgement."],[191.38,192.28,"And then?"],[193.58,198.5,"Then you test, fail and improve. The first iteration is rarely the best."],[199.78,205.1,"Our university incubator insists that each team build a prototype within a month."],[206.42,211.91,"Sensible. Were it not for constant testing, few disruptive innovations would succeed."],[213.22,216.8,"Grammar focus: Subjunctive and formal structures."],[217.09,224.35,"The subjunctive uses the base verb after verbs like insist, suggest and recommend, and after it is essential that."],[224.65,229.88,"They insist that each team build a prototype. It is essential that everyone be heard."],[230.18,232.64,"Were it not for means if it were not for."],[232.94,239.07,"In the subjunctive, use the base form for all persons: I suggest that he go (not goes)."],[240.08,243.58,"Now read and listen. How Innovation Really Happens."],[243.88,247.8,"We often imagine inventors having sudden moments of inspiration."],[249.08,255.24,"In reality, most breakthrough ideas emerge from a slow, messy creative process."],[256.55,261.5,"It begins with divergent thinking, when people generate as many ideas as possible."],[262.78,266.44,"Experts recommend that judgement be delayed during this stage."],[267.75,273.44,"The best ideas are then developed into prototypes and tested through repeated iterations."],[274.75,280.27,"Many start-ups are supported by incubators that provide mentoring, space and funding."],[281.58,287.04,"Some of these projects become disruptive innovations that transform whole industries."],[288.35,292.93,"Were it not for persistence, however, most good ideas would never leave the drawing board."],[294.22,297.1,"Quiz time! Choose the correct answer."],[297.4,301.52,"Producing many different ideas from one starting point is blank."],[301.82,306.81,"A, divergent thinking. B, iteration. C, incubator."],[310.82,314.19,"The answer is A: divergent thinking."],[315.68,318.46,"The teacher suggested that he blank the essay again."],[318.76,321.79,"A, writes. B, write. C, wrote."],[325.78,328.08,"The answer is B: write."],[329.58,332.53,"It is vital that every student blank on time."],[332.83,335.59,"A, is. B, be. C, was."],[339.58,341.57,"The answer is B: be."],[343.08,346.71,"A new idea that completely changes an industry is a blank."],[347.01,352.74,"A, disruptive innovation. B, creative process. C, lateral thinking."],[356.75,360.03,"The answer is A: disruptive innovation."],[361.52,365.59,"According to the text, experts recommend that judgement be blank."],[365.89,370.37,"A, immediate. B, delayed. C, avoided completely."],[374.38,377.1,"The answer is B: delayed."],[378.62,384.0,"Now it's your turn. Part one: What conditions help people become more creative?"],[389.3,394.3,"Part two: Describe two conditions and give an example from school or work."],[400.6,412.93,"It is essential that people feel safe to fail, and it helps if teams include different backgrounds. In my university project, for example, a design student suggested an idea the engineers had never considered."],[413.23,415.37,"That is a well-argued answer!"],[416.35,421.79,"Great work today! You learned eight new words and subjunctive and formal structures."],[422.09,426.38,"Today's value is creativity. Use your imagination when you play."],[426.68,429.13,"See you in Unit nine. Goodbye!"],[429.43,432.36,"Thank you, Ms. Sarah! Bye, everyone!"]],"OC-Advanced-Unit09-Climate-Justice":[[0.35,5.57,"Hello, everyone! I'm Ms. Sarah. Welcome to Online Advanced."],[5.87,9.0,"Hi! I'm Rithy. Let's learn together!"],[9.3,16.1,"Unit nine: Climate Justice. In this unit, you will discuss fairness in responding to climate change."],[17.08,18.42,"climate justice."],[19.12,24.65,"climate justice means the idea that climate action should be fair to the people most affected."],[24.95,28.17,"Climate justice asks who should pay for climate damage."],[28.87,32.21,"Your turn. Say: climate justice."],[34.91,36.26,"climate justice."],[37.25,38.92,"carbon inequality."],[39.62,45.15,"carbon inequality means the unequal amount of carbon produced by rich and poor people."],[45.45,51.17,"The richest ten percent cause about half of global emissions: that's carbon inequality."],[51.87,55.45,"Your turn. Say: carbon inequality."],[58.15,59.56,"carbon inequality."],[60.55,61.98,"loss and damage."],[62.68,67.95,"loss and damage means harm from climate change that cannot be avoided or adapted to."],[68.25,71.6,"Small islands are demanding funds for loss and damage."],[72.3,76.12,"Your turn. Say: loss and damage."],[78.83,80.55,"loss and damage."],[81.55,83.0,"adaptation fund."],[83.7,89.59,"adaptation fund means money to help communities adjust to climate impacts."],[89.89,92.96,"The adaptation fund paid for stronger sea walls."],[93.66,96.88,"Your turn. Say: adaptation fund."],[99.58,100.93,"adaptation fund."],[101.92,103.55,"vulnerable nation."],[104.25,108.89,"vulnerable nation means a country at high risk from climate impacts."],[109.19,112.18,"Cambodia is considered a climate-vulnerable nation."],[112.88,115.91,"Your turn. Say: vulnerable nation."],[118.61,119.91,"vulnerable nation."],[120.92,122.36,"climate finance."],[123.06,128.47,"climate finance means money from rich countries to support climate action in poorer ones."],[128.77,132.37,"Climate finance promises have often not been met."],[133.07,136.5,"Your turn. Say: climate finance."],[139.2,140.51,"climate finance."],[141.52,142.74,"polluter pays."],[143.44,147.61,"polluter pays means the principle that those who cause pollution should pay for it."],[147.91,151.53,"The polluter pays principle is widely accepted in law."],[152.23,155.63,"Your turn. Say: polluter pays."],[158.33,159.5,"polluter pays."],[160.52,161.75,"just transition."],[162.45,167.07,"just transition means moving to clean energy without leaving workers behind."],[167.37,170.93,"A just transition protects coal miners' livelihoods."],[171.63,174.9,"Your turn. Say: just transition."],[177.6,178.89,"just transition."],[179.88,182.13,"Now let's listen to a conversation."],[182.43,186.63,"Rithy, who should pay for climate damage in countries like Cambodia?"],[187.92,191.52,"It would seem fair that the biggest polluters contribute the most."],[192.82,198.27,"That's the polluter pays principle. But richer nations argue that everyone emits now."],[199.58,204.03,"Arguably, yes. However, their historical emissions are far larger."],[205.35,208.66,"And carbon inequality exists within countries too."],[209.95,214.47,"True. It could be argued that wealthy individuals should pay more as well."],[215.78,218.38,"What about workers in polluting industries?"],[219.68,225.05,"That's where a just transition matters. Nobody should lose their livelihood without support."],[226.35,228.76,"Grammar focus: Hedging language."],[229.06,232.4,"Hedging language makes your claims more careful and academic."],[232.7,236.75,"It would seem, it could be argued that, arguably, and tend to."],[237.05,241.6,"For example: Arguably, rich nations bear more responsibility."],[241.9,247.01,"Hedging makes academic arguments sound balanced and careful rather than absolute."],[248.02,251.35,"Now read and listen. Who Pays for a Warming World?."],[251.65,255.93,"Climate change affects everyone, but not equally."],[257.22,262.7,"Countries that have contributed least to global emissions tend to suffer the most severe impacts."],[263.98,269.89,"Rising seas, floods and droughts threaten farmers in vulnerable nations such as Cambodia."],[271.18,276.84,"It could be argued that wealthy countries, which industrialised first, owe a moral debt."],[278.15,282.99,"At recent climate summits, a fund for loss and damage was finally agreed."],[284.28,288.71,"However, climate finance has arguably fallen short of what was promised."],[290.02,296.71,"Many experts suggest that a just transition must also protect workers in fossil-fuel industries."],[298.02,303.52,"Climate justice, it would seem, is as much about fairness as about carbon."],[304.82,307.23,"Quiz time! Choose the correct answer."],[307.52,311.86,"Moving to clean energy without leaving workers behind is a blank."],[312.16,318.34,"A, just transition. B, loss and damage. C, carbon inequality."],[322.35,325.24,"The answer is A: just transition."],[326.75,328.41,"Which sentence is hedged?"],[328.71,337.22,"A, Rich nations must pay.. B, It could be argued that rich nations should pay.. C, Rich nations always pay.."],[341.22,345.64,"The answer is B: It could be argued that rich nations should pay.."],[347.15,349.69,"Poor communities blank suffer first."],[350.0,353.85,"A, tend to. B, are tending. C, tends."],[357.85,360.05,"The answer is A: tend to."],[361.55,364.56,"The principle that polluters should pay is called blank."],[364.86,370.93,"A, adaptation fund. B, polluter pays. C, climate finance."],[374.92,377.65,"The answer is B: polluter pays."],[379.15,382.9,"According to the text, what was finally agreed at recent summits?"],[383.2,389.9,"A, a ban on coal. B, a loss and damage fund. C, free energy."],[393.88,397.46,"The answer is B: a loss and damage fund."],[398.95,404.87,"Now it's your turn. Part one: Should rich countries pay for climate damage in poorer countries?"],[410.17,416.58,"Part two: Use hedging language: give your view, two reasons and one counter-argument."],[422.88,435.73,"It would seem fair that they contribute more. Firstly, their historical emissions are much higher; secondly, they have greater resources. It could be argued, however, that fast-growing economies should also share the cost."],[436.02,438.42,"That is a well-argued answer!"],[439.42,443.49,"Great work today! You learned eight new words and hedging language."],[443.79,448.52,"Today's value is caring for nature. Care for plants, birds and our planet."],[448.82,451.18,"See you in Unit ten. Goodbye!"],[451.48,454.27,"Thank you, Ms. Sarah! Bye, everyone!"]],"OC-Advanced-Unit10-The-Attention-Economy":[[0.35,4.76,"Hello, everyone! I'm Ms. Sarah. Welcome to Online Advanced."],[5.06,8.66,"Hi! I'm Rithy. Let's learn together!"],[8.96,16.85,"Unit ten: The Attention Economy. In this unit, you will analyse how technology competes for our attention."],[17.85,19.27,"attention economy."],[19.97,25.23,"attention economy means a system where companies compete to capture and sell our attention."],[25.53,28.47,"In the attention economy, our time is the product."],[29.17,32.45,"Your turn. Say: attention economy."],[35.15,36.67,"attention economy."],[37.68,39.01,"infinite scroll."],[39.71,45.88,"infinite scroll means a design where new content loads endlessly as you scroll."],[46.18,49.17,"Infinite scroll makes it hard to stop using an app."],[49.88,52.9,"Your turn. Say: infinite scroll."],[55.6,56.84,"infinite scroll."],[57.85,58.75,"dopamine."],[59.45,63.04,"dopamine means a brain chemical linked to pleasure and reward."],[63.34,66.54,"Each notification gives a small hit of dopamine."],[67.24,69.72,"Your turn. Say: dopamine."],[72.42,73.42,"dopamine."],[74.42,76.05,"engagement metric."],[76.75,82.11,"engagement metric means a measurement of how much users interact with content."],[82.41,85.59,"Likes and shares are key engagement metrics."],[86.3,89.52,"Your turn. Say: engagement metric."],[92.22,93.79,"engagement metric."],[94.78,96.21,"persuasive design."],[96.91,101.82,"persuasive design means designing technology to change users' behaviour."],[102.12,106.48,"Red notification dots are an example of persuasive design."],[107.18,110.59,"Your turn. Say: persuasive design."],[113.29,115.05,"persuasive design."],[116.05,117.82,"notification fatigue."],[118.52,123.23,"notification fatigue means tiredness caused by constant alerts."],[123.53,127.04,"Notification fatigue made her turn off every alert."],[127.74,131.42,"Your turn. Say: notification fatigue."],[134.12,135.81,"notification fatigue."],[136.82,138.21,"digital wellbeing."],[138.91,142.61,"digital wellbeing means a healthy relationship with technology."],[142.91,146.13,"Phones now include digital wellbeing tools."],[146.83,150.43,"Your turn. Say: digital wellbeing."],[153.13,154.31,"digital wellbeing."],[155.32,156.28,"clickstream."],[156.98,161.0,"clickstream means the record of everything a user clicks online."],[161.3,164.87,"Advertisers analyse our clickstream to target us."],[165.57,168.58,"Your turn. Say: clickstream."],[171.28,172.14,"clickstream."],[173.15,175.39,"Now let's listen to a conversation."],[175.69,179.05,"I spent four hours on my phone yesterday without noticing."],[180.35,185.13,"That's the attention economy at work. Moreover, it's carefully designed."],[186.42,188.96,"You mean infinite scroll and n
