wer is A: social mobility."],[327.68,331.05,"The committee recommends that the law blank changed."],[331.35,334.36,"A, is. B, be. C, was."],[338.35,340.12,"The answer is B: be."],[341.62,345.15,"It is imperative that every child blank access to school."],[345.45,348.55,"A, has. B, have. C, had."],[352.55,354.98,"The answer is B: have."],[356.48,360.11,"A tax system where richer people pay a higher rate is blank."],[360.41,365.3,"A, redistribution. B, progressive taxation. C, wealth gap."],[369.32,372.02,"The answer is B: progressive taxation."],[373.52,377.45,"According to the text, what is high inequality associated with?"],[377.75,383.45,"A, higher trust. B, lower social mobility. C, better health."],[387.45,390.79,"The answer is B: lower social mobility."],[392.28,397.3,"Now it's your turn. Part one: What should governments do about inequality?"],[402.6,409.2,"Part two: Use the subjunctive in a recommendation, give two policies and one counter-argument."],[415.5,427.74,"I would propose that public education be strengthened in rural areas and that taxation become more progressive. Critics might argue this discourages investment, but it is vital that every child have a fair start."],[428.04,430.41,"That is a well-argued answer!"],[431.42,437.23,"Great work today! You learned eight new words and subjunctive and formal structures (mastery)."],[437.53,440.95,"Today's value is kindness. Be kind to everyone."],[441.25,444.4,"See you in Unit forty-nine. Goodbye!"],[444.7,447.47,"Thank you, Ms. Sarah! Bye, everyone!"]],"OC-Advanced-Unit49-Innovation-in-Agriculture":[[0.35,5.51,"Hello, everyone! I'm Ms. Sarah. Welcome to Online Advanced."],[5.81,9.04,"Hi! I'm Rithy. Let's learn together!"],[9.34,18.27,"Unit forty-nine: Innovation in Agriculture. In this unit, you will discuss how technology can transform farming."],[19.28,20.96,"precision agriculture."],[21.66,28.7,"precision agriculture means farming that uses data and sensors to apply exactly what crops need."],[29.0,32.73,"Precision agriculture reduces fertiliser waste."],[33.43,37.85,"Your turn. Say: precision agriculture."],[40.55,42.07,"precision agriculture."],[43.05,44.53,"drip irrigation."],[45.23,50.67,"drip irrigation means watering plants slowly through small tubes at their roots."],[50.98,53.66,"Drip irrigation saves up to half the water."],[54.36,57.59,"Your turn. Say: drip irrigation."],[60.29,61.56,"drip irrigation."],[62.55,64.11,"climate-smart farming."],[64.81,69.75,"climate-smart farming means farming methods that adapt to and reduce climate change."],[70.05,73.17,"Climate-smart farming helps farmers cope with drought."],[73.87,77.2,"Your turn. Say: climate-smart farming."],[79.9,81.39,"climate-smart farming."],[82.38,83.53,"soil health."],[84.23,88.22,"soil health means the ability of soil to support plants and life."],[88.52,91.08,"Too many chemicals damage soil health."],[91.78,95.25,"Your turn. Say: soil health."],[97.95,99.23,"soil health."],[100.25,101.54,"crop rotation."],[102.24,106.57,"crop rotation means growing different crops in the same field in turn."],[106.87,109.25,"Crop rotation keeps soil fertile."],[109.95,113.11,"Your turn. Say: crop rotation."],[115.81,117.04,"crop rotation."],[118.05,119.24,"agritech."],[119.94,123.27,"agritech means technology designed for agriculture."],[123.57,127.32,"Cambodian agritech start-ups connect farmers with buyers."],[128.02,130.85,"Your turn. Say: agritech."],[133.55,134.65,"agritech."],[135.65,137.21,"post-harvest loss."],[137.91,142.69,"post-harvest loss means food lost after harvesting, during storage or transport."],[142.99,145.93,"Post-harvest loss reduces farmers' income."],[146.63,150.32,"Your turn. Say: post-harvest loss."],[153.02,154.49,"post-harvest loss."],[155.48,156.93,"cooperative farming."],[157.63,163.09,"cooperative farming means farmers working together to share costs and sell products."],[163.38,167.46,"Cooperative farming gives small farmers more bargaining power."],[168.16,171.66,"Your turn. Say: cooperative farming."],[174.36,175.69,"cooperative farming."],[176.68,178.81,"Now let's listen to a conversation."],[179.11,182.42,"Rithy, your family farms in Battambang, doesn't it?"],[183.72,189.26,"Yes, rice and vegetables. It would seem that farming is changing faster than ever."],[190.55,191.69,"In what way?"],[192.98,198.61,"My cousins use an agritech app to check prices. Arguably, it has increased their income."],[199.92,201.45,"And drip irrigation?"],[202.75,208.58,"It tends to be too expensive for individual farmers, so they share it through cooperative farming."],[209.88,212.48,"That's smart. What's the biggest problem?"],[213.78,218.87,"Post-harvest loss, possibly. A lot of produce spoils before it reaches the market."],[220.18,223.01,"Grammar focus: Hedging (mastery)."],[223.31,227.09,"Mastering hedging makes you sound confident but careful."],[227.4,233.33,"It would seem that farming is changing fast. Arguably, the app has increased their income."],[233.63,235.41,"It tends to be too expensive."],[235.71,242.4,"Mastery of hedging means sounding confident yet careful: never absolute without strong evidence."],[243.42,247.93,"Now read and listen. Smart Farms, Strong Communities."],[248.23,252.55,"Agriculture employs a large share of Cambodia's workforce."],[253.85,258.62,"Climate change, however, appears to be making rainfall less predictable."],[259.92,267.23,"Climate-smart farming techniques, such as drip irrigation and crop rotation, may help farmers adapt."],[268.55,273.86,"Agritech apps now provide weather forecasts, market prices and farming advice."],[275.15,280.9,"Precision agriculture, though still rare, could reduce costs and protect soil health."],[282.18,287.93,"Post-harvest loss remains a serious problem, arguably due to poor storage and transport."],[289.22,295.73,"Cooperative farming allows small farmers to share equipment and negotiate better prices."],[297.02,301.48,"Innovation, it would seem, works best when combined with community cooperation."],[302.78,305.62,"Quiz time! Choose the correct answer."],[305.92,308.94,"Watering plants slowly at their roots is blank."],[309.24,314.31,"A, drip irrigation. B, crop rotation. C, agritech."],[318.32,320.42,"The answer is A: drip irrigation."],[321.92,323.73,"Which sentence is hedged?"],[324.03,331.28,"A, Farming is changing.. B, It would seem that farming is changing.. C, Farming always changes.."],[335.28,338.92,"The answer is B: It would seem that farming is changing.."],[340.42,343.31,"This method blank work better in dry areas."],[343.61,347.35,"A, tends to. B, tend. C, is tending."],[351.35,353.51,"The answer is A: tends to."],[355.02,357.25,"Food lost after harvesting is blank."],[357.55,362.85,"A, post-harvest loss. B, soil health. C, precision agriculture."],[366.85,369.57,"The answer is A: post-harvest loss."],[371.08,375.71,"According to the text, what allows small farmers to share equipment?"],[376.01,382.03,"A, cooperative farming. B, precision agriculture. C, drip irrigation."],[386.02,389.25,"The answer is A: cooperative farming."],[390.75,396.21,"Now it's your turn. Part one: How could technology help Cambodian farmers?"],[401.51,407.34,"Part two: Use hedging: suggest two technologies and one limitation."],[413.64,428.11,"It would seem that price apps and drip irrigation could help most. Apps arguably give farmers stronger bargaining power, while drip irrigation saves water. However, costs may limit access unless farmers form cooperatives."],[428.4,430.54,"That is a well-argued answer!"],[431.55,436.19,"Great work today! You learned eight new words and hedging (mastery)."],[436.49,440.21,"Today's value is hard work. Work hard and never give up."],[440.51,443.16,"See you in Unit fifty. Goodbye!"],[443.46,446.35,"Thank you, Ms. Sarah! Bye, everyone!"]],"OC-Advanced-Unit50-Media-Ownership":[[0.35,5.57,"Hello, everyone! I'm Ms. Sarah. Welcome to Online Advanced."],[5.87,9.1,"Hi! I'm Rithy. Let's learn together!"],[9.39,16.75,"Unit fifty: Media Ownership. In this unit, you will discuss who owns the media and why it matters."],[17.75,19.52,"media conglomerate."],[20.22,26.23,"media conglomerate means a large company owning many newspapers, TV channels and websites."],[26.53,30.57,"A single media conglomerate controls several major channels."],[31.27,34.82,"Your turn. Say: media conglomerate."],[37.52,39.09,"media conglomerate."],[40.08,42.41,"editorial independence."],[43.11,49.54,"editorial independence means the freedom of journalists to decide content without outside pressure."],[49.84,52.81,"Editorial independence protects honest reporting."],[53.51,57.23,"Your turn. Say: editorial independence."],[59.93,61.76,"editorial independence."],[62.75,64.44,"public broadcaster."],[65.14,71.31,"public broadcaster means a TV or radio service funded for the public, not for profit."],[71.61,74.98,"The BBC is a well-known public broadcaster."],[75.69,79.13,"Your turn. Say: public broadcaster."],[81.83,83.36,"public broadcaster."],[84.35,85.83,"media pluralism."],[86.53,90.85,"media pluralism means the existence of many different media voices."],[91.15,94.8,"Media pluralism gives citizens diverse perspectives."],[95.5,98.95,"Your turn. Say: media pluralism."],[101.65,103.1,"media pluralism."],[104.12,105.22,"state media."],[105.92,109.8,"state media means media owned or controlled by the government."],[110.1,113.34,"State media often present the official view."],[114.04,117.28,"Your turn. Say: state media."],[119.98,121.21,"state media."],[122.22,123.94,"advertiser influence."],[124.64,129.93,"advertiser influence means pressure on media content from companies that buy adverts."],[130.23,133.51,"Advertiser influence can discourage critical stories."],[134.21,138.0,"Your turn. Say: advertiser influence."],[140.7,142.57,"advertiser influence."],[143.58,144.78,"press ownership."],[145.48,150.2,"press ownership means who owns newspapers and news organisations."],[150.5,154.44,"Press ownership affects editorial direction."],[155.14,158.01,"Your turn. Say: press ownership."],[160.71,161.87,"press ownership."],[162.88,165.34,"citizen journalism."],[166.04,172.05,"citizen journalism means news reported by ordinary people, often on social media."],[172.35,176.08,"Citizen journalism spread news of the flood quickly."],[176.78,180.27,"Your turn. Say: citizen journalism."],[182.97,184.77,"citizen journalism."],[185.78,187.94,"Now let's listen to a conversation."],[188.25,191.86,"Ms. Sarah, does it matter who owns a newspaper?"],[193.15,197.68,"Very much so. To begin with, owners can shape what is reported."],[198.98,202.14,"Even if journalists have editorial independence?"],[203.45,209.86,"In theory, no. In practice, however, advertiser influence and owners' interests can matter."],[211.15,213.28,"What about public broadcasters?"],[214.58,219.88,"They're designed to serve citizens. That said, their funding can make them vulnerable too."],[221.18,223.04,"And citizen journalism?"],[224.35,230.12,"It adds voices. All things considered, media pluralism is the best protection."],[231.42,234.81,"Grammar focus: Discourse markers (mastery)."],[235.11,239.66,"Mastering discourse markers helps you build balanced arguments."],[239.96,245.58,"In theory, no. In practice, owners matter. That said, funding can be a weakness."],[245.88,248.74,"All things considered, pluralism is best."],[249.04,254.15,"Contrasting 'in theory' and 'in practice' is a powerful way to show critical thinking."],[255.15,258.27,"Now read and listen. Who Controls the News?."],[258.57,264.9,"In many countries, a small number of media conglomerates own most major news outlets."],[266.18,273.55,"In theory, journalists enjoy editorial independence; in practice, ownership can influence coverage."],[274.85,280.63,"Advertiser influence may also discourage stories that criticise powerful companies."],[281.95,286.56,"Public broadcasters aim to serve citizens rather than shareholders."],[287.85,293.17,"That said, their funding often depends on governments, which can create other pressures."],[294.48,298.0,"State media typically present official perspectives."],[299.32,305.79,"Meanwhile, citizen journalism has given ordinary people the ability to report events directly."],[307.08,314.03,"All things considered, media pluralism remains the strongest safeguard for an informed public."],[315.32,318.06,"Quiz time! Choose the correct answer."],[318.36,321.66,"The existence of many different media voices is blank."],[321.96,326.78,"A, media pluralism. B, state media. C, press ownership."],[330.78,333.58,"The answer is A: media pluralism."],[335.08,339.02,"blank, the plan sounds perfect. blank, it is very expensive."],[339.32,345.29,"A, In theory / In practice. B, That said / To begin with. C, Ultimately / Even so."],[349.28,352.7,"The answer is A: In theory / In practice."],[354.18,356.94,"blank, I believe the policy is fair."],[357.24,361.7,"A, All things considered. B, In theory. C, That said."],[365.72,369.19,"The answer is A: All things considered."],[370.68,373.43,"News reported by ordinary people is blank."],[373.73,380.0,"A, citizen journalism. B, public broadcaster. C, media conglomerate."],[384.02,387.35,"The answer is A: citizen journalism."],[388.85,394.12,"According to the text, what is the strongest safeguard for an informed public?"],[394.42,399.82,"A, state media. B, media pluralism. C, advertising."],[403.82,406.95,"The answer is B: media pluralism."],[408.45,414.62,"Now it's your turn. Part one: Why does media ownership matter to ordinary citizens?"],[419.92,425.56,"Part two: Use 'in theory / in practice' and one concluding marker to build your answer."],[431.87,446.42,"In theory, any outlet can report freely. In practice, owners and advertisers shape what we see. That said, social media adds new voices. All things considered, citizens need many sources to stay informed."],[446.72,448.77,"That is a well-argued answer!"],[449.78,454.92,"Great work today! You learned eight new words and discourse markers (mastery)."],[455.22,458.92,"Today's value is honesty. Always tell the truth."],[459.22,462.23,"See you in Unit fifty-one. Goodbye!"],[462.53,465.11,"Thank you, Ms. Sarah! Bye, everyone!"]],"OC-Advanced-Unit51-Mental-Health-in-Society":[[0.35,5.33,"Hello, everyone! I'm Ms. Sarah. Welcome to Online Advanced."],[5.63,8.89,"Hi! I'm Rithy. Let's learn together!"],[9.19,17.39,"Unit fifty-one: Mental Health in Society. In this unit, you will discuss mental health with understanding and accuracy."],[18.38,19.91,"mental health stigma."],[20.61,25.29,"mental health stigma means negative attitudes that make people ashamed to seek help."],[25.59,29.12,"Mental health stigma stops many people from talking."],[29.82,33.41,"Your turn. Say: mental health stigma."],[36.11,37.66,"mental health stigma."],[38.65,40.49,"psychological resilience."],[41.19,46.05,"psychological resilience means the ability to cope with and recover from difficulties."],[46.35,49.68,"Supportive friendships build psychological resilience."],[50.38,53.85,"Your turn. Say: psychological resilience."],[56.55,58.54,"psychological resilience."],[59.55,61.17,"anxiety disorder."],[61.87,67.19,"anxiety disorder means a condition causing strong, persistent worry or fear."],[67.49,70.09,"Anxiety disorders are common and treatable."],[70.79,74.47,"Your turn. Say: anxiety disorder."],[77.17,78.66,"anxiety disorder."],[79.65,80.63,"depression."],[81.33,86.12,"depression means a medical condition causing long-lasting low mood."],[86.42,88.92,"Depression is an illness, not a weakness."],[89.62,91.99,"Your turn. Say: depression."],[94.69,95.64,"depression."],[96.65,98.12,"therapy access."],[98.81,103.45,"therapy access means the ability to reach professional psychological support."],[103.75,107.09,"Therapy access is limited in many rural areas."],[107.78,110.92,"Your turn. Say: therapy access."],[113.62,115.19,"therapy access."],[116.18,117.27,"peer support."],[117.97,122.02,"peer support means help from people with similar experiences."],[122.32,125.77,"Peer support groups help students feel less alone."],[126.47,129.12,"Your turn. Say: peer support."],[131.82,132.95,"peer support."],[133.95,135.32,"burnout culture."],[136.02,140.37,"burnout culture means a work or study culture that encourages overwork."],[140.67,143.68,"Burnout culture treats exhaustion as normal."],[144.38,147.54,"Your turn. Say: burnout culture."],[150.24,151.37,"burnout culture."],[152.38,154.12,"emotional regulation."],[154.82,159.95,"emotional regulation means the ability to manage and respond to emotions."],[160.25,163.69,"Breathing exercises can improve emotional regulation."],[164.39,167.74,"Your turn. Say: emotional regulation."],[170.44,172.11,"emotional regulation."],[173.12,175.47,"Now let's listen to a conversation."],[175.76,180.07,"Rithy, do students at your university talk openly about mental health?"],[181.38,184.47,"More than before, but the stigma is still strong."],[185.78,187.32,"Why do you think that is?"],[188.62,194.22,"The fear of being judged. Many people see depression as weakness rather than an illness."],[195.52,200.51,"That perception is changing, fortunately. Is therapy access improving?"],[201.82,205.92,"Slowly. Our university has introduced a peer support programme."],[207.22,211.54,"Excellent. The reduction of stigma begins with conversations like these."],[212.85,217.56,"And with the rejection of burnout culture. Rest is not laziness."],[218.85,222.49,"Grammar focus: Nominalisation (mastery)."],[222.79,226.63,"Nominalisation helps discuss sensitive topics objectively."],[226.93,231.07,"The fear of being judged stops people. That perception is changing."],[231.37,234.03,"The reduction of stigma begins with conversation."],[234.33,239.44,"Nominalisation allows you to discuss sensitive topics in a measured, objective tone."],[240.45,244.04,"Now read and listen. Talking About Mental Health."],[244.34,248.93,"Mental health conditions affect roughly one in eight people worldwide."],[250.22,254.99,"Anxiety disorders and depression are among the most common, and both are treatable."],[256.28,260.64,"Yet the fear of being judged prevents many people from seeking help."],[261.95,268.23,"In many communities, therapy access is limited by cost, distance and a shortage of professionals."],[269.55,274.42,"Peer support programmes have shown promising results, especially among young people."],[275.72,282.12,"The promotion of emotional regulation skills in schools may also strengthen psychological resilience."],[283.42,288.65,"Experts warn that burnout culture, which glorifies overwork, can damage wellbeing."],[289.95,294.78,"Anyone who is struggling is encouraged to talk to someone they trust or to a health professional."],[296.08,298.83,"Quiz time! Choose the correct answer."],[299.13,302.21,"Help from people with similar experiences is blank."],[302.51,308.06,"A, peer support. B, therapy access. C, burnout culture."],[312.05,314.49,"The answer is A: peer support."],[315.98,318.12,"The noun form of 'reduce' is blank."],[318.42,323.48,"A, reducing. B, reduction. C, reducement."],[327.48,329.91,"The answer is B: reduction."],[331.42,335.59,"'People fear being judged.' → 'The blank of being judged...'"],[335.89,339.44,"A, fear. B, fearing. C, fearful."],[343.45,346.15,"The answer is A: fear."],[347.65,351.24,"The ability to cope with and recover from difficulties is blank."],[351.54,357.07,"A, psychological resilience. B, anxiety disorder. C, stigma."],[361.08,364.44,"The answer is A: psychological resilience."],[365.95,371.33,"According to the text, what does the text encourage people who are struggling to do?"],[371.63,377.71,"A, stay silent. B, talk to someone they trust or a professional. C, work harder."],[381.72,385.84,"The answer is B: talk to someone they trust or a professional."],[387.35,394.75,"Now it's your turn. Part one: How can schools and universities better support students' mental health?"],[400.05,406.26,"Part two: Use nominalisation: propose two measures and explain their benefits."],[412.56,424.37,"The introduction of peer support groups and the training of teachers to recognise warning signs would make a real difference. Their main benefit would be the reduction of stigma and earlier access to help."],[424.67,427.36,"That is a well-argued answer!"],[428.35,433.3,"Great work today! You learned eight new words and nominalisation (mastery)."],[433.6,437.44,"Today's value is empathy. Think about how others feel."],[437.74,440.71,"See you in Unit fifty-two. Goodbye!"],[441.01,443.83,"Thank you, Ms. Sarah! Bye, everyone!"]],"OC-Advanced-Unit52-The-Sharing-Economy":[[0.35,5.64,"Hello, everyone! I'm Ms. Sarah. Welcome to Online Advanced."],[5.94,9.07,"Hi! I'm Rithy. Let's learn together!"],[9.37,16.84,"Unit fifty-two: The Sharing Economy. In this unit, you will discuss platforms, sharing and the future of ownership."],[17.85,19.11,"sharing economy."],[19.81,24.62,"sharing economy means an economic system where people share or rent assets."],[24.92,29.04,"The sharing economy includes car sharing and home rentals."],[29.74,33.44,"Your turn. Say: sharing economy."],[36.14,37.82,"sharing economy."],[38.82,40.25,"platform economy."],[40.95,46.33,"platform economy means business activity organised through digital platforms."],[46.62,49.32,"Delivery apps are part of the platform economy."],[50.02,53.19,"Your turn. Say: platform economy."],[55.88,57.31,"platform economy."],[58.32,59.53,"peer-to-peer."],[60.23,64.62,"peer-to-peer means directly between individuals, without a company in the middle."],[64.92,67.96,"Peer-to-peer lending connects borrowers and lenders."],[68.66,71.28,"Your turn. Say: peer-to-peer."],[73.98,74.97,"peer-to-peer."],[75.98,77.17,"gig platform."],[77.87,81.41,"gig platform means an app that offers short-term jobs."],[81.71,84.39,"She finds design work through a gig platform."],[85.09,88.22,"Your turn. Say: gig platform."],[90.91,92.02,"gig platform."],[93.02,94.26,"asset sharing."],[94.96,99.43,"asset sharing means using items together instead of each person owning one."],[99.73,101.84,"Asset sharing reduces waste."],[102.54,105.63,"Your turn. Say: asset sharing."],[108.33,109.65,"asset sharing."],[110.65,111.66,"trust rating."],[112.36,116.29,"trust rating means a score showing how reliable a user is."],[116.59,119.94,"Drivers with low trust ratings may lose their accounts."],[120.64,123.88,"Your turn. Say: trust rating."],[126.58,127.67,"trust rating."],[128.68,130.04,"platform worker."],[130.74,134.84,"platform worker means a person who earns money through digital platforms."],[135.15,137.59,"Platform workers often lack sick pay."],[138.29,141.28,"Your turn. Say: platform worker."],[143.97,145.22,"platform worker."],[146.22,147.86,"collaborative consumption."],[148.56,153.88,"collaborative consumption means sharing, swapping or renting goods instead of buying them."],[154.18,157.35,"Clothes-swapping events encourage collaborative consumption."],[158.05,161.51,"Your turn. Say: collaborative consumption."],[164.21,165.82,"collaborative consumption."],[166.82,169.05,"Now let's listen to a conversation."],[169.35,171.93,"Do you use ride-hailing apps, Ms. Sarah?"],[173.22,175.05,"Every day. Do you?"],[176.35,181.26,"Sometimes. My brother works on one, actually. He's a platform worker."],[182.55,183.91,"Does he enjoy it?"],[185.22,190.27,"He says he does, mostly. The hours are flexible, but the pay isn't stable."],[191.58,195.88,"Many platform workers say the same. Some have no insurance at all."],[197.18,202.26,"His trust rating matters enormously. One bad review, and he loses income."],[203.55,208.49,"The sharing economy offers freedom, but security too often doesn't come with it."],[209.78,214.53,"Grammar focus: Ellipsis and substitution (mastery)."],[214.83,217.45,"Fluent speakers use ellipsis constantly."],[217.75,221.19,"Every day. Do you? He says he does, mostly."],[221.49,223.57,"Many platform workers say the same."],[223.88,232.2,"Native-like fluency depends on ellipsis: repeating full sentences sounds unnatural in conversation."],[233.22,236.39,"Now read and listen. Access Over Ownership."],[236.69,241.47,"The sharing economy has changed how millions of people travel, eat and work."],[242.75,247.48,"Instead of owning cars or tools, consumers can access them when needed."],[248.78,254.67,"Peer-to-peer platforms connect individuals directly, often across cities and countries."],[255.98,260.72,"Supporters say asset sharing reduces waste and makes services cheaper."],[262.02,265.83,"Critics say the same platforms can leave workers without protection."],[267.12,272.24,"Platform workers usually depend on trust ratings, which can be harsh and unpredictable."],[273.55,278.22,"Some governments now require gig platforms to provide insurance; others don't."],[279.52,284.35,"The future of work may depend on how fairly the platform economy treats its workers."],[285.65,288.55,"Quiz time! Choose the correct answer."],[288.85,293.5,"Directly between individuals, without a company in the middle, is blank."],[293.8,298.56,"A, peer-to-peer. B, platform economy. C, asset sharing."],[302.55,305.08,"The answer is A: peer-to-peer."],[306.58,309.34,"'I love this app.' 'So blank I.'"],[309.64,312.67,"A, am. B, do. C, have."],[316.68,319.25,"The answer is B: do."],[320.75,324.27,"Some countries regulate platforms; others blank."],[324.57,328.85,"A, don't. B, doesn't. C, aren't."],[332.85,335.29,"The answer is A: don't."],[336.78,340.18,"A score showing how reliable a user is, is a blank."],[340.48,345.78,"A, trust rating. B, gig platform. C, collaborative consumption."],[349.78,352.39,"The answer is A: trust rating."],[353.88,357.45,"According to the text, what do some governments now require?"],[357.75,363.33,"A, higher prices. B, insurance for platform workers. C, fewer drivers."],[367.32,370.62,"The answer is B: insurance for platform workers."],[372.12,377.09,"Now it's your turn. Part one: Is the sharing economy good for workers?"],[382.39,389.44,"Part two: Use ellipsis or substitution twice, give one benefit, one problem and a solution."],[395.74,409.22,"Partly. It offers flexible hours; traditional jobs often don't. The problem is security: many workers have none. A solution would be basic insurance, and some countries already require it."],[409.52,412.6,"That is a well-argued answer!"],[413.58,418.98,"Great work today! You learned eight new words and ellipsis and substitution (mastery)."],[419.28,422.67,"Today's value is respect. Thank the people who help us."],[422.97,426.95,"See you in Unit fifty-three. Goodbye!"],[427.25,429.93,"Thank you, Ms. Sarah! Bye, everyone!"]],"OC-Advanced-Unit53-Justice-and-Punishment":[[0.35,5.58,"Hello, everyone! I'm Ms. Sarah. Welcome to Online Advanced."],[5.88,8.57,"Hi! I'm Rithy. Let's learn together!"],[8.87,16.06,"Unit fifty-three: Justice and Punishment. In this unit, you will debate the purposes of punishment."],[17.05,18.6,"restorative justice."],[19.3,24.69,"restorative justice means an approach that repairs harm by bringing offenders and victims together."],[24.99,28.3,"Restorative justice can help victims feel heard."],[29.0,32.51,"Your turn. Say: restorative justice."],[35.21,36.7,"restorative justice."],[37.68,39.09,"rehabilitation."],[39.79,44.39,"rehabilitation means helping offenders change and return to society."],[44.69,47.58,"Education in prison supports rehabilitation."],[48.28,51.69,"Your turn. Say: rehabilitation."],[54.39,55.67,"rehabilitation."],[56.68,57.65,"deterrence."],[58.35,62.17,"deterrence means discouraging crime through fear of punishment."],[62.47,65.85,"Some argue that harsh sentences provide deterrence."],[66.55,69.24,"Your turn. Say: deterrence."],[71.94,73.02,"deterrence."],[74.02,75.44,"incarceration."],[76.14,79.14,"incarceration means keeping someone in prison."],[79.44,83.63,"Long incarceration can make reintegration harder."],[84.33,87.73,"Your turn. Say: incarceration."],[90.44,91.83,"incarceration."],[92.82,93.99,"recidivism."],[94.69,98.34,"recidivism means returning to crime after punishment."],[98.64,100.91,"Job training reduces recidivism."],[101.61,104.7,"Your turn. Say: recidivism."],[107.4,108.41,"recidivism."],[109.42,110.58,"death penalty."],[111.28,114.63,"death penalty means execution as a legal punishment."],[114.93,117.72,"Many countries have abolished the death penalty."],[118.42,121.43,"Your turn. Say: death penalty."],[124.13,125.22,"death penalty."],[126.22,127.12,"parole."],[127.83,131.53,"parole means early release from prison under supervision."],[131.83,134.63,"He was released on parole after five years."],[135.33,138.2,"Your turn. Say: parole."],[140.91,141.75,"parole."],[142.75,144.25,"sentencing guideline."],[144.95,150.24,"sentencing guideline means official rules that help judges decide punishments."],[150.53,153.96,"Sentencing guidelines aim to ensure consistency."],[154.66,157.99,"Your turn. Say: sentencing guideline."],[160.69,162.2,"sentencing guideline."],[163.22,165.29,"Now let's listen to a conversation."],[165.59,168.26,"Rithy, what do you think prisons are for?"],[169.55,173.74,"Punishment, mainly. But rehabilitation, too, should be a priority."],[175.05,176.61,"Why rehabilitation?"],[177.92,184.46,"Because most prisoners eventually return to society. Without support, recidivism stays high."],[185.75,188.27,"Some would argue that deterrence matters most."],[189.58,195.03,"Possibly. Far more effective, though, is the certainty of being caught, according to research."],[196.35,198.05,"And restorative justice?"],[199.35,205.58,"For minor crimes, it seems promising. Victims, especially, often value being heard."],[206.88,209.35,"Grammar focus: Fronting (mastery)."],[209.65,212.88,"Fronting gives your key ideas extra emphasis."],[213.18,218.97,"Rehabilitation, too, should be a priority. Far more effective is the certainty of being caught."],[219.26,222.23,"Victims, especially, value being heard."],[222.53,227.74,"Fronting with inversion ('Far more effective is ...') creates emphasis and contrast in debates."],[228.75,231.91,"Now read and listen. What Is Punishment For?."],[232.21,235.42,"Societies have long debated the purpose of punishment."],[236.72,241.91,"Some emphasise retribution and deterrence; others prioritise rehabilitation."],[243.22,248.84,"Research suggests that the certainty of being caught deters crime more than the severity of sentences."],[250.15,255.03,"Long periods of incarceration can weaken family ties and job prospects."],[256.32,261.88,"Programmes offering education and work training have been shown to reduce recidivism."],[263.18,270.38,"Restorative justice brings victims and offenders together to repair harm, particularly for minor offences."],[271.68,278.68,"The death penalty remains controversial, and many countries have abolished it, while others retain it."],[279.98,286.25,"Most systems now use sentencing guidelines and parole to balance fairness and public safety."],[287.55,290.26,"Quiz time! Choose the correct answer."],[290.56,293.22,"Returning to crime after punishment is blank."],[293.52,298.08,"A, recidivism. B, parole. C, deterrence."],[302.08,304.84,"The answer is A: recidivism."],[306.35,308.27,"Which sentence uses fronting?"],[308.57,315.58,"A, Education is also important.. B, Education, too, is important.. C, Is education important?."],[319.58,323.9,"The answer is B: Education, too, is important.."],[325.42,328.47,"Far more important blank the certainty of punishment."],[328.77,331.6,"A, are. B, is. C, be."],[335.62,337.76,"The answer is B: is."],[339.25,342.5,"Early release from prison under supervision is blank."],[342.8,348.94,"A, parole. B, incarceration. C, restorative justice."],[352.95,354.95,"The answer is A: parole."],[356.45,359.59,"According to the text, what deters crime more?"],[359.89,366.65,"A, severe sentences. B, the certainty of being caught. C, long incarceration."],[370.65,374.41,"The answer is B: the certainty of being caught."],[375.92,382.84,"Now it's your turn. Part one: Should the main goal of prisons be punishment or rehabilitation?"],[388.14,394.17,"Part two: Use fronting: give your position, two reasons and one counter-argument."],[400.47,414.79,"Rehabilitation, above all, should be the goal. Most prisoners return to society, and education reduces reoffending. Some argue that victims deserve retribution; far more meaningful, I believe, is preventing future victims."],[415.09,417.03,"That is a well-argued answer!"],[418.05,422.73,"Great work today! You learned eight new words and fronting (mastery)."],[423.03,427.97,"Today's value is responsibility. Help at home and do your jobs."],[428.27,431.2,"See you in Unit fifty-four. Goodbye!"],[431.5,434.08,"Thank you, Ms. Sarah! Bye, everyone!"]],"OC-Advanced-Unit54-Science-and-Belief":[[0.35,5.42,"Hello, everyone! I'm Ms. Sarah. Welcome to Online Advanced."],[5.72,8.91,"Hi! I'm Rithy. Let's learn together!"],[9.21,16.9,"Unit fifty-four: Science and Belief. In this unit, you will distinguish science from belief and evaluate evidence."],[17.88,19.44,"scientific literacy."],[20.14,27.24,"scientific literacy means the ability to understand and evaluate scientific information."],[27.54,32.14,"Scientific literacy helps citizens judge health claims."],[32.84,36.55,"Your turn. Say: scientific literacy."],[39.25,40.91,"scientific literacy."],[41.92,43.19,"pseudoscience."],[43.88,49.22,"pseudoscience means beliefs presented as science but without scientific evidence."],[49.52,52.83,"Astrology is a classic example of pseudoscience."],[53.53,56.61,"Your turn. Say: pseudoscience."],[59.31,60.62,"pseudoscience."],[61.62,62.72,"scepticism."],[63.42,68.01,"scepticism means an attitude of doubting claims until there is evidence."],[68.31,71.09,"Healthy scepticism protects us from scams."],[71.79,75.1,"Your turn. Say: scepticism."],[77.8,78.94,"scepticism."],[79.95,81.37,"falsifiability."],[82.07,88.41,"falsifiability means the possibility of proving a theory wrong through testing."],[88.71,92.23,"Falsifiability separates science from pseudoscience."],[92.93,96.64,"Your turn. Say: falsifiability."],[99.34,100.75,"falsifiability."],[101.75,103.03,"burden of proof."],[103.73,107.16,"burden of proof means the duty to provide evidence for a claim."],[107.46,110.57,"The burden of proof lies with the person making the claim."],[111.27,114.33,"Your turn. Say: burden of proof."],[117.03,118.18,"burden of proof."],[119.18,120.82,"confirmation bias."],[121.52,127.11,"confirmation bias means noticing only information that supports what we already believe."],[127.41,130.97,"Confirmation bias makes us ignore inconvenient facts."],[131.66,134.98,"Your turn. Say: confirmation bias."],[137.68,139.32,"confirmation bias."],[140.32,141.97,"anecdotal evidence."],[142.67,148.15,"anecdotal evidence means evidence based on personal stories rather than research."],[148.45,151.52,"Anecdotal evidence is not enough to prove a cure."],[152.22,155.49,"Your turn. Say: anecdotal evidence."],[158.19,159.7,"anecdotal evidence."],[160.68,161.89,"superstition."],[162.59,167.09,"superstition means a belief in luck or magic not based on reason."],[167.39,170.51,"Many superstitions are part of cultural tradition."],[171.22,174.26,"Your turn. Say: superstition."],[176.96,178.01,"superstition."],[179.02,181.27,"Now let's listen to a conversation."],[181.57,184.85,"Ms. Sarah, my aunt swears that a herbal drink cured her cold."],[186.15,189.91,"That's anecdotal evidence, on which many health claims rely."],[191.22,193.02,"But she really did get better."],[194.32,199.69,"Most colds disappear within a week anyway, which is something people often forget."],[200.98,203.6,"So how do scientists decide what works?"],[204.88,209.46,"Through tests in which the claim could be proved wrong. That's falsifiability."],[210.75,213.39,"And if someone makes an extraordinary claim?"],[214.68,220.17,"The burden of proof lies with them, regardless of whom they know or how confident they sound."],[221.45,225.13,"Grammar focus: Advanced relative clauses (mastery)."],[225.43,228.33,"Relative clauses can refer to a whole idea."],[228.63,232.11,"Colds disappear anyway, which is something people forget."],[232.41,235.85,"Tests in which the claim could be proved wrong are essential."],[236.15,240.96,"A sentential relative clause (', which ...') comments on a whole previous idea."],[241.95,245.19,"Now read and listen. How Do We Know What Is True?."],[245.49,250.03,"Every day, we hear claims about health, history and the natural world."],[251.32,256.08,"Science offers a method for testing these claims, which is based on evidence and doubt."],[257.38,262.8,"According to philosopher Karl Popper, a scientific theory must be falsifiable."],[264.08,270.36,"Pseudoscience, by contrast, makes claims that cannot be tested or that ignore contrary evidence."],[271.65,276.39,"Confirmation bias leads us to remember successes and forget failures."],[277.68,283.35,"Anecdotal evidence, however convincing it feels, cannot replace controlled studies."],[284.65,289.83,"Healthy scepticism does not mean rejecting everything, but asking for evidence."],[291.12,298.47,"Scientific literacy, in which these skills are combined, may be one of the most important skills of our time."],[299.78,302.42,"Quiz time! Choose the correct answer."],[302.72,306.22,"Beliefs presented as science without evidence are blank."],[306.52,312.92,"A, pseudoscience. B, scepticism. C, falsifiability."],[316.92,319.17,"The answer is A: pseudoscience."],[320.68,322.79,"He missed the bus, blank made him late."],[323.09,326.42,"A, what. B, which. C, that."],[330.42,332.72,"The answer is B: which."],[334.22,336.8,"It's a theory blank many doctors disagree."],[337.1,340.72,"A, with which. B, which. C, whom."],[344.72,347.32,"The answer is A: with which."],[348.82,351.8,"Evidence based on personal stories is blank."],[352.1,358.42,"A, anecdotal evidence. B, burden of proof. C, scientific literacy."],[362.42,365.54,"The answer is A: anecdotal evidence."],[367.05,371.29,"According to Popper, a scientific theory must be blank."],[371.59,375.77,"A, popular. B, falsifiable. C, ancient."],[379.75,382.78,"The answer is B: falsifiable."],[384.28,391.0,"Now it's your turn. Part one: How can people protect themselves from false health claims?"],[396.3,402.59,"Part two: Use a sentential relative clause, give two strategies and one example."],[408.89,422.33,"People should ask for controlled evidence, which most false claims cannot provide. They should also check whether trusted health organisations agree. My uncle almost bought a 'miracle cure', which turned out to be completely untested."],[422.63,424.8,"That is a well-argued answer!"],[425.78,431.76,"Great work today! You learned eight new words and advanced relative clauses (mastery)."],[432.06,436.89,"Today's value is curiosity. Ask questions and find out."],[437.19,440.24,"See you in Unit fifty-five. Goodbye!"],[440.54,443.18,"Thank you, Ms. Sarah! Bye, everyone!"]],"OC-Advanced-Unit55-Global-Cities-and-Culture":[[0.35,5.78,"Hello, everyone! I'm Ms. Sarah. Welcome to Online Advanced."],[6.08,9.03,"Hi! I'm Rithy. Let's learn together!"],[9.32,18.66,"Unit fifty-five: Global Cities and Culture. In this unit, you will discuss how culture shapes cities and their global image."],[19.65,21.05,"cultural capital."],[21.75,28.81,"cultural capital means a city's reputation for arts and culture; also personal cultural knowledge."],[29.11,31.94,"Paris is often called a cultural capital."],[32.64,35.83,"Your turn. Say: cultural capital."],[38.53,39.85,"cultural capital."],[40.85,42.18,"creative economy."],[42.88,50.72,"creative economy means economic activity based on creativity, such as design, music and film."],[51.02,54.4,"The creative economy employs many young people."],[55.1,58.39,"Your turn. Say: creative economy."],[61.09,62.38,"creative economy."],[63.38,64.86,"cosmopolitanism."],[65.56,70.37,"cosmopolitanism means openness to many cultures and nationalities."],[70.67,75.48,"Singapore's cosmopolitanism attracts international talent."],[76.18,79.48,"Your turn. Say: cosmopolitanism."],[82.18,83.67,"cosmopolitanism."],[84.68,85.86,"global city."],[86.56,93.21,"global city means a city with major influence on the world economy and culture."],[93.51,96.17,"Tokyo and New York are global cities."],[96.88,99.83,"Your turn. Say: global city."],[102.53,103.73,"global city."],[104.72,106.11,"nightlife economy."],[106.81,111.81,"nightlife economy means businesses that operate in the evening and at night."],[112.11,115.14,"Riverside cafés boost the nightlife economy."],[115.84,120.19,"Your turn. Say: nightlife economy."],[122.89,124.21,"nightlife economy."],[125.22,126.47,"cultural district."],[127.17,132.92,"cultural district means an area of a city with many galleries, theatres and studios."],[133.22,136.49,"The new cultural district hosts weekly performances."],[137.19,140.44,"Your turn. Say: cultural district."],[143.14,144.45,"cultural district."],[145.45,147.21,"soft infrastructure."],[147.91,154.22,"soft infrastructure means institutions and services such as education, culture and healthcare."],[154.52,158.25,"Soft infrastructure attracts talented residents."],[158.95,162.35,"Your turn. Say: soft infrastructure."],[165.05,166.82,"soft infrastructure."],[167.82,169.21,"cultural export."],[169.91,173.98,"cultural export means cultural products sold or shared abroad."],[174.28,177.87,"K-pop is South Korea's most famous cultural export."],[178.57,182.1,"Your turn. Say: cultural export."],[184.8,186.16,"cultural export."],[187.15,189.22,"Now let's listen to a conversation."],[189.52,193.57,"Rithy, could Phnom Penh become a cultural capital of Southeast Asia?"],[194.88,198.57,"A recent article claimed that it already was becoming one."],[199.85,201.51,"What evidence did it give?"],[202.82,207.52,"It pointed out that new galleries and music venues had opened along the riverside."],[208.82,212.4,"Some critics warned that rising rents would push artists out."],[213.68,218.79,"Yes, and one artist admitted having moved her studio twice in three years."],[220.08,225.11,"So soft infrastructure, such as affordable studios, matters."],[226.42,231.95,"Exactly. The writer concluded that culture could be Cambodia's next great export."],[233.25,236.33,"Grammar focus: Reported speech (mastery)."],[236.63,240.03,"Master reported speech with precise verbs and backshift."],[240.33,245.09,"The article claimed that it was becoming one. It pointed out that venues had opened."],[245.39,248.32,"She admitted having moved her studio twice."],[248.62,256.0,"Backshift is optional when the reported fact is still true now, but it is standard in formal narrative reporting."],[257.02,260.38,"Now read and listen. Culture as a City's Engine."],[260.68,266.03,"Cities increasingly compete not only for factories but also for creative talent."],[267.32,272.19,"Researchers have argued that a strong creative economy attracts investment and tourism."],[273.48,279.7,"Global cities invest heavily in cultural districts, museums and festivals."],[280.98,287.09,"Cosmopolitanism, the openness to many cultures, is often cited as a key attraction."],[288.38,292.88,"However, critics have pointed out that rising rents can drive artists away."],[294.18,300.93,"Soft infrastructure, such as affordable studios and arts education, is therefore essential."],[302.22,308.63,"Countries such as South Korea have shown how cultural exports can transform global image."],[309.92,314.91,"Phnom Penh's growing arts scene suggests that Cambodia may follow a similar path."],[316.22,318.9,"Quiz time! Choose the correct answer."],[319.2,322.39,"Cultural products sold or shared abroad are blank."],[322.69,329.81,"A, cultural exports. B, soft infrastructure. C, nightlife economy."],[333.82,337.16,"The answer is A: cultural exports."],[338.65,341.73,"She said that she blank the exhibition the day before."],[342.03,345.4,"A, has seen. B, had seen. C, sees."],[349.42,352.36,"The answer is B: had seen."],[353.85,356.29,"He pointed out that prices blank rising."],[356.59,360.74,"A, were. B, are being. C, have."],[364.75,366.87,"The answer is A: were."],[368.35,370.48,"Openness to many cultures is blank."],[370.78,376.16,"A, cosmopolitanism. B, creative economy. C, cultural district."],[380.15,383.23,"The answer is A: cosmopolitanism."],[384.72,387.83,"According to the text, what can drive artists away?"],[388.13,392.67,"A, festivals. B, rising rents. C, museums."],[396.65,399.59,"The answer is B: rising rents."],[401.08,407.03,"Now it's your turn. Part one: How could Cambodia increase its cultural influence abroad?"],[412.33,416.94,"Part two: Report one opinion you've heard, then propose two strategies."],[423.25,433.15,"A friend claimed that Khmer music could become as popular as K-pop. I'd propose funding young artists and promoting Cambodian films at international festivals."],[433.45,435.8,"That is a well-argued answer!"],[436.82,441.83,"Great work today! You learned eight new words and reported speech (mastery)."],[442.13,446.36,"Today's value is creativity. Use your imagination when you play."],[446.66,449.91,"See you in Unit fifty-six. Goodbye!"],[450.21,452.76,"Thank you, Ms. Sarah! Bye, everyone!"]],"OC-Advanced-Unit56-Technology-and-Employment":[[0.35,4.86,"Hello, everyone! I'm Ms. Sarah. Welcome to Online Advanced."],[5.16,8.22,"Hi! I'm Rithy. Let's learn together!"],[8.52,16.8,"Unit fifty-six: Technology and Employment. In this unit, you will discuss how automation is changing work."],[17.78,19.9,"technological unemployment."],[20.6,25.43,"technological unemployment means job loss caused by new technology."],[25.73,30.75,"Economists debate whether technological unemployment is permanent."],[31.45,35.61,"Your turn. Say: technological unemployment."],[38.31,40.2,"technological unemployment."],[41.18,42.13,"reskilling."],[42.83,46.32,"reskilling means learning new skills for a different job."],[46.62,50.35,"Reskilling programmes help factory workers move into IT."],[51.05,54.22,"Your turn. Say: reskilling."],[56.92,57.87,"reskilling."],[58.88,60.78,"human-machine collaboration."],[61.48,65.57,"human-machine collaboration means people and machines working together."],[65.87,69.16,"Human-machine collaboration can increase productivity."],[69.86,73.8,"Your turn. Say: human-machine collaboration."],[76.5,78.33,"human-machine collaboration."],[79.35,81.21,"algorithmic management."],[81.91,86.77,"algorithmic management means using software to assign and evaluate work."],[87.07,90.58,"Delivery riders are controlled by algorithmic management."],[91.28,95.46,"Your turn. Say: algorithmic management."],[98.16,99.8,"algorithmic management."],[100.78,101.92,"digital divide."],[102.62,107.63,"digital divide means the gap between people with and without access to technology."],[107.93,110.67,"The digital divide affects rural students."],[111.37,114.5,"Your turn. Say: digital divide."],[117.2,118.43,"digital divide."],[119.45,121.37,"labour market polarisation."],[122.07,128.1,"labour market polarisation means growth of high- and low-skilled jobs while middle jobs disappear."],[128.4,131.88,"Labour market polarisation increases inequality."],[132.58,135.94,"Your turn. Say: labour market polarisation."],[138.64,140.56,"labour market polarisation."],[141.55,142.97,"automation wave."],[143.67,148.35,"automation wave means a period when many tasks become automated."],[148.65,151.72,"The next automation wave may affect office jobs."],[152.42,155.82,"Your turn. Say: automation wave."],[158.53,159.99,"automation wave."],[160.98,162.3,"future skills."],[163.0,168.25,"future skills means abilities that will be valuable in the future job market."],[168.55,172.42,"Creativity and adaptability are key future skills."],[173.12,176.4,"Your turn. Say: future skills."],[179.1,180.46,"future skills."],[181.45,183.71,"Now let's listen to a conversation."],[184.0,191.1,"Ms. Sarah, if robots had been cheaper twenty years ago, would Cambodia's factories still exist today?"],[192.42,197.02,"Perhaps not as many. Low labour costs gave the country an advantage."],[198.32,201.42,"And now the next automation wave is coming."],[202.72,208.19,"Yes. If governments had planned reskilling earlier, workers would feel more secure now."],[209.48,211.7,"Will machines replace teachers too?"],[213.02,218.14,"Unlikely. The future is human-machine collaboration, not replacement."],[219.45,222.6,"But the digital divide could leave rural people behind."],[223.88,230.44,"That's the biggest risk. If I were a policymaker, I'd have invested in rural internet years ago."],[231.75,234.99,"Grammar focus: Mixed conditionals (mastery)."],[235.29,240.29,"Mastering mixed conditionals means moving smoothly between time frames."],[240.59,244.05,"If robots had been cheaper, factories wouldn't exist today."],[244.35,248.06,"If I were a policymaker, I'd have invested years ago."],[248.35,253.62,"Mastery means switching naturally between time frames to analyse cause and effect."],[254.62,257.87,"Now read and listen. Will a Robot Take Your Job?."],[258.17,262.8,"Every major technological change has destroyed some jobs and created others."],[264.08,268.32,"Economists disagree about whether the current automation wave will be different."],[269.62,274.29,"Routine tasks, both manual and clerical, are the most vulnerable."],[275.58,280.78,"This has led to labour market polarisation, with growth in high- and low-paid jobs."],[282.08,286.39,"Algorithmic management is already shaping the working lives of millions."],[287.68,293.27,"If workers had been offered reskilling earlier, many transitions would be smoother today."],[294.58,301.08,"Experts emphasise future skills such as creativity, communication and adaptability."],[302.38,308.69,"Closing the digital divide may determine who benefits from technology and who is left behind."],[309.98,312.6,"Quiz time! Choose the correct answer."],[312.9,316.51,"Job loss caused by new technology is blank."],[316.81,322.85,"A, technological unemployment. B, reskilling. C, digital divide."],[326.85,330.39,"The answer is A: technological unemployment."],[331.88,334.93,"If I had learned coding, I blank a better job now."],[335.23,339.29,"A, would have. B, would have had. C, will have."],[343.28,345.86,"The answer is A: would have."],[347.35,350.63,"If she were more patient, she blank that argument."],[350.93,355.36,"A, wouldn't start. B, wouldn't have started. C, won't start."],[359.35,362.15,"The answer is B: wouldn't have started."],[363.65,367.56,"The gap between people with and without technology is the blank."],[367.87,373.02,"A, digital divide. B, automation wave. C, future skills."],[377.02,379.78,"The answer is A: digital divide."],[381.28,384.95,"According to the text, which tasks are most vulnerable?"],[385.25,391.49,"A, creative tasks. B, routine tasks. C, caring tasks."],[395.48,398.19,"The answer is B: routine tasks."],[399.68,405.09,"Now it's your turn. Part one: How should young Cambodians prepare for automation?"],[410.39,415.85,"Part two: Use a mixed conditional, recommend two future skills and explain why."],[422.15,437.12,"Young people should develop digital literacy and communication skills. If my school had taught coding, I would feel more confident now. These skills matter because machines struggle to replace human creativity and empathy."],[437.42,439.49,"That is a well-argued answer!"],[440.48,445.32,"Great work today! You learned eight new words and mixed conditionals (mastery)."],[445.62,449.77,"Today's value is being prepared. Get ready before you go."],[450.07,453.74,"See you in Unit fifty-seven. Goodbye!"],[454.04,456.83,"Thank you, Ms. Sarah! Bye, everyone!"]],"OC-Advanced-Unit57-Communication-Across-Cultures":[[0.35,5.14,"Hello, everyone! I'm Ms. Sarah. Welcome to Online Advanced."],[5.44,8.56,"Hi! I'm Rithy. Let's learn together!"],[8.86,17.1,"Unit fifty-seven: Communication Across Cultures. In this unit, you will understand cultural differences in communication."],[18.08,19.77,"high-context culture."],[20.47,26.79,"high-context culture means a culture where meaning depends on context, tone and relationships."],[27.09,30.02,"Cambodia is generally a high-context culture."],[30.72,34.69,"Your turn. Say: high-context culture."],[37.39,39.12,"high-context culture."],[40.12,41.77,"low-context culture."],[42.47,48.44,"low-context culture means a culture where meaning is stated directly in words."],[48.74,53.23,"The USA is often described as a low-context culture."],[53.93,57.56,"Your turn. Say: low-context culture."],[60.26,62.28,"low-context culture."],[63.28,65.24,"face-saving."],[65.94,70.33,"face-saving means avoiding embarrassment for yourself or others."],[70.63,74.62,"A face-saving solution allowed both sides to agree."],[75.32,79.05,"Your turn. Say: face-saving."],[81.75,82.83,"face-saving."],[83.82,85.54,"indirect communication."],[86.24,92.3,"indirect communication means expressing meaning through hints rather than direct statements."],[92.6,96.41,"'Maybe later' is often indirect communication for 'no'."],[97.11,100.91,"Your turn. Say: indirect communication."],[103.61,105.3,"indirect communication."],[106.28,107.74,"power distance."],[108.44,113.53,"power distance means how much a culture accepts unequal power between people."],[113.83,117.83,"In high power distance cultures, people rarely question their boss."],[118.53,121.53,"Your turn. Say: power distance."],[124.23,125.51,"power distance."],[126.52,127.76,"individualism."],[128.46,133.65,"individualism means valuing personal goals and independence."],[133.95,137.41,"Individualism is strong in many Western societies."],[138.1,141.28,"Your turn. Say: individualism."],[143.98,145.34,"individualism."],[146.35,147.57,"collectivism."],[148.27,151.65,"collectivism means valuing group goals and harmony."],[151.95,155.37,"Collectivism shapes family decisions in Cambodia."],[156.07,159.39,"Your turn. Say: collectivism."],[162.09,163.21,"collectivism."],[164.22,165.94,"intercultural competence."],[166.64,171.74,"intercultural competence means the ability to communicate effectively across cultures."],[172.04,175.85,"Intercultural competence is essential for global careers."],[176.55,180.19,"Your turn. Say: intercultural competence."],[182.89,184.53,"intercultural competence."],[185.52,187.64,"Now let's listen to a conversation."],[187.94,192.8,"Rithy, when I first came to Cambodia, I made a lot of cultural mistakes."],[194.08,195.87,"Really? Like what?"],[197.15,201.79,"In meetings, I asked very direct questions. Nobody would answer openly."],[203.08,208.12,"That's typical of a high-context culture. People want to avoid losing face."],[209.42,213.1,"I had to pay close attention to tone and body language."],[214.38,219.09,"And power distance plays a big role. Juniors rarely contradict seniors."],[220.38,223.39,"Now I make a point of asking for opinions privately."],[224.68,229.58,"That's real intercultural competence. You've learned to read between the lines."],[230.88,234.17,"Grammar focus: Collocations (mastery)."],[234.47,238.13,"Collocations make your English sound natural and precise."],[238.43,244.0,"Pay close attention to tone, avoid losing face, and read between the lines."],[244.29,247.28,"Power distance plays a big role in communication."],[247.58,253.57,"Collocations about communication are especially useful in international workplaces."],[254.58,258.35,"Now read and listen. Lost in Cultural Translation."],[258.65,262.54,"Speaking the same language does not guarantee mutual understanding."],[263.85,269.01,"Anthropologist Edward Hall distinguished between high-context and low-context cultures."],[270.32,277.03,"In high-context cultures, much of the meaning lies in tone, relationships and what is left unsaid."],[278.32,282.77,"In low-context cultures, people tend to say exactly what they mean."],[284.05,290.54,"Concepts such as face-saving and power distance shape how disagreement is expressed."],[291.85,298.03,"Collectivism encourages harmony, while individualism values direct personal opinions."],[299.32,305.8,"Misunderstandings often arise when people interpret indirect communication as dishonesty."],[307.08,312.02,"Intercultural competence means learning to read between the lines without judging."],[313.32,316.27,"Quiz time! Choose the correct answer."],[316.57,320.1,"A culture where meaning is stated directly is a blank."],[320.4,326.34,"A, high-context culture. B, low-context culture. C, collectivism."],[330.35,333.21,"The answer is B: low-context culture."],[334.72,337.53,"Please pay blank attention to the instructions."],[337.83,341.18,"A, close. B, near. C, tight."],[345.18,347.19,"The answer is A: close."],[348.68,351.37,"He didn't want to lose blank in front of his team."],[351.67,354.99,"A, face. B, head. C, eye."],[358.98,361.25,"The answer is A: face."],[362.75,365.79,"Valuing group goals and harmony is blank."],[366.09,371.08,"A, individualism. B, collectivism. C, power distance."],[375.08,377.58,"The answer is B: collectivism."],[379.08,383.03,"According to the text, what does intercultural competence mean?"],[383.33,390.09,"A, speaking fast. B, reading between the lines without judging. C, avoiding foreigners."],[394.08,397.69,"The answer is B: reading between the lines without judging."],[399.18,404.77,"Now it's your turn. Part one: What advice would you give a foreigner working in Cambodia?"],[410.07,416.31,"Part two: Use three collocations: give two pieces of advice and explain each."],[422.61,434.74,"I'd advise them to pay close attention to tone and to avoid making anyone lose face in public. Disagreement should be expressed privately, because harmony plays a big role in Cambodian workplaces."],[435.04,437.44,"That is a well-argued answer!"],[438.45,443.44,"Great work today! You learned eight new words and collocations (mastery)."],[443.74,448.29,"Today's value is respect for culture. Be proud of our Khmer culture."],[448.59,451.44,"See you in Unit fifty-eight. Goodbye!"],[451.74,454.82,"Thank you, Ms. Sarah! Bye, everyone!"]],"OC-Advanced-Unit58-Environmental-Law":[[0.35,5.42,"Hello, everyone! I'm Ms. Sarah. Welcome to Online Advanced."],[5.72,9.15,"Hi! I'm Rithy. Let's learn together!"],[9.45,16.82,"Unit fifty-eight: Environmental Law. In this unit, you will discuss how laws protect the environment."],[17.82,20.92,"environmental impact assessment."],[21.62,27.97,"environmental impact assessment means a study of how a project will affect the environment."],[28.27,32.73,"Every large dam requires an environmental impact assessment."],[33.43,37.95,"Your turn. Say: environmental impact assessment."],[40.66,43.87,"environmental impact assessment."],[44.88,46.2,"conservation law."],[46.9,51.21,"conservation law means legislation that protects nature and wildlife."],[51.51,55.08,"The new conservation law expanded protected forests."],[55.77,58.95,"Your turn. Say: conservation law."],[61.65,62.93,"conservation law."],[63.92,65.46,"protected species."],[66.16,70.89,"protected species means animals or plants that the law forbids harming."],[71.19,74.12,"The Irrawaddy dolphin is a protected species."],[74.82,78.24,"Your turn. Say: protected species."],[80.94,82.48,"protected species."],[83.48,84.65,"illegal logging."],[85.35,89.3,"illegal logging means cutting down trees without legal permission."],[89.6,92.95,"Illegal logging threatens Cambodia's forests."],[93.66,97.03,"Your turn. Say: illegal logging."],[99.73,100.93,"illegal logging."],[101.92,103.53,"wildlife trafficking."],[104.23,108.79,"wildlife trafficking means illegal trade in wild animals or their parts."],[109.09,112.41,"Wildlife trafficking is a multi-billion-dollar crime."],[113.11,116.8,"Your turn. Say: wildlife trafficking."],[119.5,121.03,"wildlife trafficking."],[122.02,124.14,"environmental court."],[124.84,130.76,"environmental court means a court that specialises in environmental cases."],[131.06,134.99,"Some countries have created environmental courts."],[135.69,139.82,"Your turn. Say: environmental court."],[142.52,144.76,"environmental court."],[145.75,147.1,"pollution permit."],[147.8,152.14,"pollution permit means official permission to release limited pollution."],[152.44,155.22,"The factory exceeded its pollution permit."],[155.92,159.18,"Your turn. Say: pollution permit."],[161.88,163.06,"pollution permit."],[164.05,165.5,"enforcement gap."],[166.2,172.2,"enforcement gap means the difference between laws on paper and how they are applied."],[172.5,175.94,"The enforcement gap allows illegal activity to continue."],[176.64,179.76,"Your turn. Say: enforcement gap."],[182.47,183.93,"enforcement gap."],[184.92,187.0,"Now let's listen to a conversation."],[187.3,192.14,"Ms. Sarah, Cambodia has strong conservation laws on paper, doesn't it?"],[193.45,197.0,"Yes, but the enforcement gap is the real challenge."],[198.32,200.64,"Why do illegal loggers get away with it?"],[201.95,207.83,"Remote areas, limited rangers, and sometimes corruption. Rangers can't keep up."],[209.12,211.0,"What about wildlife trafficking?"],[212.32,217.47,"International networks are behind it. Countries need to crack down together."],[218.75,223.62,"Should every big project go through an environmental impact assessment?"],[224.92,229.68,"Absolutely, and communities should be able to speak out if the assessment is weak."],[230.98,234.75,"Grammar focus: Advanced phrasal verbs (mastery)."],[235.05,238.24,"Advanced phrasal verbs are common in news and debate."],[238.54,244.91,"Loggers get away with it; countries must crack down on trafficking; communities should speak out."],[245.21,247.72,"Know their formal equivalents for writing."],[248.02,255.5,"In formal writing, replace 'crack down on' with 'take strict action against' and 'get away with' with 'avoid punishment for'."],[256.48,259.75,"Now read and listen. Laws That Protect Nature."],[260.05,264.98,"Environmental laws have expanded rapidly over the past fifty years."],[266.28,272.07,"Most countries now require an environmental impact assessment before major construction."],[273.38,278.26,"Conservation laws protect forests, rivers and endangered wildlife."],[279.55,284.39,"In Cambodia, the Irrawaddy dolphin in the Mekong is a protected species."],[285.68,290.24,"However, illegal logging and wildlife trafficking continue in many regions."],[291.55,296.25,"The main problem is often the enforcement gap rather than the absence of laws."],[297.55,302.78,"Some countries have created environmental courts to handle cases more effectively."],[304.08,310.33,"Ultimately, laws work best when local communities are empowered to protect their own environment."],[311.62,314.05,"Quiz time! Choose the correct answer."],[314.35,316.93,"Cutting down trees without permission is blank."],[317.23,322.97,"A, illegal logging. B, wildlife trafficking. C, pollution permit."],[326.98,330.0,"The answer is A: illegal logging."],[331.52,334.65,"The police promised to crack blank on illegal parking."],[334.95,337.93,"A, up. B, down. C, out."],[341.95,344.01,"The answer is B: down."],[345.52,347.55,"He thought he could get blank with cheating."],[347.85,350.56,"A, away. B, off. C, out."],[354.55,356.7,"The answer is A: away."],[358.22,362.4,"The difference between laws on paper and practice is the blank."],[362.7,368.74,"A, enforcement gap. B, environmental court. C, conservation law."],[372.75,374.92,"The answer is A: enforcement gap."],[376.42,379.98,"According to the text, what is often the main problem?"],[380.28,386.15,"A, no laws. B, the enforcement gap. C, too many courts."],[390.15,393.15,"The answer is B: the enforcement gap."],[394.65,401.06,"Now it's your turn. Part one: How can environmental laws be enforced more effectively?"],[406.36,412.26,"Part two: Use two phrasal verbs, propose two measures, and explain one obstacle."],[418.56,432.5,"Governments should crack down on trafficking networks and train more oms make spoken analysis vivid; in formal reports, use 'ignore', 'disappear' and 'conceal' instead."],[238.05,241.7,"Now read and listen. Leading When Everything Goes Wrong."],[242.0,245.52,"Crises test leaders in ways that ordinary times never do."],[246.82,251.09,"Research on crisis leadership highlights a few consistent qualities."],[252.38,256.59,"Effective leaders combine situational awareness with decisive action."],[257.88,262.33,"They establish a clear command structure so that everyone knows their role."],[263.62,268.93,"Clear messaging, repeated consistently, reduces fear and confusion."],[270.22,274.69,"Leaders who sweep problems under the carpet usually lose stakeholder trust."],[275.98,280.44,"By contrast, those who admit mistakes early often recover more quickly."],[281.75,287.62,"As one expert put it, a crisis does not build character; it reveals it."],[288.92,291.47,"Quiz time! Choose the correct answer."],[291.76,295.47,"Actions to limit harm after something goes wrong are blank."],[295.77,301.05,"A, damage control. B, command structure. C, clear messaging."],[305.05,308.4,"The answer is A: damage control."],[309.88,312.89,"To ignore a problem is to bury your head in the blank."],[313.19,316.44,"A, ground. B, sand. C, water."],[320.45,323.12,"The answer is B: sand."],[324.62,327.48,"To hide a problem is to sweep it under the blank."],[327.77,331.31,"A, carpet. B, table. C, bed."],[335.32,337.84,"The answer is A: carpet."],[339.35,342.12,"Understanding what is happening around you is blank."],[342.42,348.55,"A, situational awareness. B, stakeholder trust. C, decisive action."],[352.55,356.0,"The answer is A: situational awareness."],[357.52,361.3,"According to the expert, what does a crisis do to character?"],[361.6,366.14,"A, builds it. B, reveals it. C, destroys it."],[370.15,373.64,"The answer is B: reveals it."],[375.15,380.33,"Now it's your turn. Part one: Describe a leader who handled a crisis well or badly."],[385.63,390.85,"Part two: Use two idioms, describe what they did, and evaluate the result."],[397.15,409.48,"During a flood in my province, the district chief didn't bury his head in the sand. He gave clear messages every day and admitted when supplies were late. Because he never swept problems under the carpet, people trusted him."],[409.77,412.62,"That is a well-argued answer!"],[413.62,418.53,"Great work today! You learned eight new words and idiomatic language (mastery)."],[418.83,422.82,"Today's value is courage. Try new things and be brave."],[423.12,425.81,"See you in Unit sixty. Goodbye!"],[426.11,429.53,"Thank you, Ms. Sarah! Bye, everyone!"]],"OC-Advanced-Unit60-Advanced-Champion":[[0.35,5.07,"Hello, everyone! I'm Ms. Sarah. Welcome to Online Advanced."],[5.37,8.64,"Hi! I'm Rithy. Let's learn together!"],[8.94,16.46,"Unit sixty: Advanced Champion!. In this unit, you will review the C1 course and set goals for C2."],[17.45,19.16,"fluency at C1."],[19.86,27.04,"fluency at C1 means speaking smoothly and spontaneously at advanced level."],[27.34,29.91,"Rithy has reached fluency at C1."],[30.61,34.73,"Your turn. Say: fluency at C1."],[37.43,39.09,"fluency at C1."],[40.08,41.46,"academic register."],[42.16,47.66,"academic register means the formal style used in universities and research."],[47.96,50.49,"Essays require an academic register."],[51.2,54.25,"Your turn. Say: academic register."],[56.95,58.63,"academic register."],[59.62,60.94,"nuanced argument."],[61.64,67.64,"nuanced argument means an argument that considers complexity and different views."],[67.94,70.49,"His essay presented a nuanced argument."],[71.19,74.86,"Your turn. Say: nuanced argument."],[77.56,78.85,"nuanced argument."],[79.85,81.92,"sophisticated vocabulary."],[82.62,86.63,"sophisticated vocabulary means advanced and precise words."],[86.93,90.39,"Sophisticated vocabulary makes writing more precise."],[91.09,94.88,"Your turn. Say: sophisticated vocabulary."],[97.58,99.61,"sophisticated vocabulary."],[100.62,101.91,"critical reasoning."],[102.61,107.34,"critical reasoning means evaluating arguments and evidence carefully."],[107.64,110.51,"Critical reasoning protects us from manipulation."],[111.21,115.02,"Your turn. Say: critical reasoning."],[117.72,118.93,"critical reasoning."],[119.92,121.24,"persuasive essay."],[121.94,125.79,"persuasive essay means a piece of writing that argues for a position."],[126.09,128.51,"Her persuasive essay won the competition."],[129.21,132.69,"Your turn. Say: persuasive essay."],[135.39,136.81,"persuasive essay."],[137.82,139.36,"research presentation."],[140.06,144.48,"research presentation means a formal talk presenting study findings."],[144.78,148.05,"Rithy delivered an excellent research presentation."],[148.75,152.23,"Your turn. Say: research presentation."],[154.93,156.62,"research presentation."],[157.62,158.93,"proficiency goal."],[159.63,163.8,"proficiency goal means a target to reach the highest level of a language."],[164.1,167.88,"His proficiency goal is to pass C2 next year."],[168.58,172.2,"Your turn. Say: proficiency goal."],[174.91,176.35,"proficiency goal."],[177.35,179.56,"Now let's listen to a conversation."],[179.86,184.86,"Rithy, congratulations! You've completed sixty units of Online Advanced."],[186.15,190.74,"I can hardly believe it. What helped me most was the speaking practice."],[192.05,198.96,"Your research presentation was outstanding: a nuanced argument in a perfect academic register."],[200.25,204.15,"Had you not pushed me to use hedging, I'd still sound too absolute!"],[205.45,208.73,"And your persuasive essay showed real critical reasoning."],[210.02,213.88,"Thank you. My proficiency goal now is to reach C2."],[215.18,221.26,"With your dedication, you'll get there. Never have I seen a student improve so consistently."],[222.55,227.03,"I couldn't have done it without you, Ms. Sarah. See you in Online Proficiency!"],[228.32,231.3,"Grammar focus: C1 grammar review."],[231.6,234.07,"Let's review the key C1 structures."],[ ],[384.98,388.19,"According to the text, what is Rithy's next goal?"],[388.49,393.42,"A, B2. B, C1. C, C2 Proficiency."],[397.42,400.03,"The answer is C: C2 Proficiency."],[401.52,406.95,"Now it's your turn. Part one: What has been the most valuable part of your C1 journey?"],[412.25,418.04,"Part two: Use at least two advanced structures and set one goal for C2."],[424.34,437.47,"What has been most valuable is learning to express nuance. Had I not practised hedging and register, my arguments would still sound simplistic. My goal for C2 is to write and speak with the precision of an educated native speaker."],[437.77,440.02,"That is a well-argued answer!"],[441.02,445.86,"Great work today! You learned eight new words and c1 grammar review."],[446.16,450.14,"Today's value is pride in learning. Be proud of what you learned."],[450.44,456.3,"Congratulations! You have finished Online Advanced. See you in Online Proficiency!"],[456.6,459.04,"Thank you, Ms. Sarah! Bye, everyone!"]]};
        // English subtitles: added to the player with code, so no subtitle files are needed online.

        function addSubtitles(el) {
            const cues = SUBTITLES[(el.getAttribute('src') || '').split('/').pop().replace('.mp4', '')]; const btn = document.getElementById('subs-btn');

            const tr = el.addTextTrack('subtitles', 'English', 'en');
            cues.forEach(c => { try { const q = new VTTCue(c[0], c[1], c[2]); q.line = -2; tr.addCue(q); } catch (e) {} });
            const apply = () => { tr.mode = subsOn ? 'showing' : 'hidden'; if (btn) btn.textContent = subsOn ? '💬 Subtitles: ON' : '💬 Subtitles: OFF'; };
            if (btn) btn.onclick = () => { subsOn = !subsOn; apply(); };
            apply();
        }

                destroy: () => { try { el.pause(); el.removeAttribute('src'); el.load(); } catch (e) {} }
            };
            el.addEventListener('play', () => { const m = document.getElementById('video-msg'); if (m) m.textContent = ''; });
            el.addEventListener('timeupdate', () => { if (currentVideo && currentVideo.questions.length) checkVideoCheckpoints(); });
            el.addEventListener('ended', () => {
                const got = award(unitKey('video-' + currentVideo.id), 5);
                const m = document.getElementById('video-msg');
                if (m) m.textContent = '🎉 Great job watching the whole video!' + (got ? ' (+5 ⭐)' : '');
            });
            el.addEventListener('error', () => {
                const m = document.getElementById('video-msg');
                if (m) m.innerHTML = '⚠️ The video could not load. Check the internet, or <a href="' + currentVideo.mp4 + '" target="_blank" rel="noopener" class="text-blue-600 underline font-semibold">open it here ↗</a>';
            });
        }

        function onYtStateChange(event) {
            const msg = document.getElementById('video-msg');
            if (event.data === YT.PlayerState.PLAYING) {
                if (ytPollInterval) clearInterval(ytPollInterval);
                if (currentVideo && currentVideo.questions.length) ytPollInterval = setInterval(checkVideoCheckpoints, 400);
                if (msg) msg.textContent = '';
            } else if (event.data === YT.PlayerState.PAUSED || event.data === YT.PlayerState.ENDED) {
                if (ytPollInterval) { clearInterval(ytPollInterval); ytPollInterval = null; }
                if (event.data === YT.PlayerState.ENDED) {
                    const got = award(unitKey('video-' + currentVideo.id), 5);
                    if (msg) msg.textContent = '🎉 Great job watching the whole video!' + (got ? ' (+5 ⭐)' : '');
                }
            }
        }

        function checkVideoCheckpoints() {
            if (!ytPlayer || typeof ytPlayer.getCurrentTime !== 'function' || !currentVideo) return;
            let t = 0;
            try { t = ytPlayer.getCurrentTime(); } catch (e) { return; }
            currentVideo.questions.forEach((cp, idx) => {
                if (!ytAnsweredCheckpoints.has(idx) && t >= cp.time) {
                    ytAnsweredCheckpoints.add(idx);
                    showVideoCheckpoint(idx);
                }
            });
        }

        function showVideoCheckpoint(idx) {
            const cp = currentVideo.questions[idx];
            ytPlayer.pauseVideo();
            if (ytPollInterval) { clearInterval(ytPollInterval); ytPollInterval = null; }
            const overlay = document.getElementById('checkpoint-overlay');
            overlay.style.display = 'flex';
            overlay.innerHTML = `
                <div class="bg-white rounded-2xl p-6 max-w-md w-full text-center">

                    <p class="font-bold text-lg text-gray-800 mb-4">${cp.question}</p>
                    <div class="flex flex-col gap-2" id="checkpoint-options">
                        ${cp.options.map((opt, i) => `<button onclick="answerVideoCheckpoint(${idx}, ${i})" class="bg-blue-50 hover:bg-blue-100 text-blue-900 font-semibold p-3 rounded-xl cursor-pointer">${opt}</button>`).join('')}
                    </div>
                    <p id="checkpoint-feedback" class="mt-3 font-bold min-h-[1.5rem]"></p>
                </div>`;
        }

        function answerVideoCheckpoint(idx, chosenIndex) {
            const cp = currentVideo.questions[idx];
            const feedback = document.getElementById('checkpoint-feedback');
            const optionsDiv = document.getElementById('checkpoint-options');
            optionsDiv.querySelectorAll('button').forEach(b => b.disabled = true);
            if (chosenIndex === cp.correct) {
                feedback.className = 'mt-3 font-bold min-h-[1.5rem] text-green-600';

            } else {
                feedback.className = 'mt-3 font-bold min-h-[1.5rem] text-red-500';
                feedback.textContent = `❌ Not quite — the answer was "${cp.options[cp.correct]}"`;
            }

            nextBtn.textContent = 'Next ▶️';
            nextBtn.className = 'mt-4 bg-blue-600 hover:bg-blue-700 text-white font-bold px-6 py-2 rounded-full shadow cursor-pointer';
            nextBtn.onclick = resumeVideoAfterCheckpoint;
            feedback.insertAdjacentElement('afterend', nextBtn);
        }

        function resumeVideoAfterCheckpoint() {
            document.getElementById('checkpoint-overlay').style.display = 'none';
            if (ytPlayer) ytPlayer.playVideo();
        }

        // ===== 7. QUIZ (graded quiz per unit, pictures on every answer) =====
        // Stars are given only for improving on your best score for this unit,
        // and answer buttons lock after the first tap so quick double taps can't skip questions.
        let quizState = { qIndex: 0, score: 0, order: [], currentOptions: [], currentAnswer: '', locked: false };
        function renderQuiz(contentDiv, unitData) {
            quizState = { qIndex: 0, score: 0, order: shuffle(unitData.vocab.map((_, i) => i)), currentOptions: [], currentAnswer: '', locked: false };
            showQuizQuestion();
        }
        function showQuizQuestion() {
            const contentDiv = document.getElementById('module-content');
            const unitData = realCurriculum[state.level][state.unit];
            quizState.locked = false;
            if (quizState.qIndex >= quizState.order.length) {
                const total = quizState.order.length;
                const pct = Math.round((quizState.score / total) * 100);
                const bestKey = state.level + '|' + unitKey('quiz');
                const best = progress.bestQuiz[bestKey] || 0;
                const earned = Math.max(0, quizState.score - best) * 2;
                if (quizState.score > best) progress.bestQuiz[bestKey] = quizState.score;
                if (earned > 0) addStars(earned); else saveProgress();
                if (pct === 100) triggerConfetti();
                if (quizState.score >= 6) ocMarkUnitDone();
                contentDiv.innerHTML = `
                    <h2 class="text-xl font-bold text-blue-800 mb-2">🧩 Quiz Complete!</h2>
                    <div class="bg-purple-50 p-8 rounded-2xl border border-purple-200 text-center">
                        <div class="text-5xl mb-3">${pct === 100 ? '🏆' : pct >= 50 ? '🎉' : '💪'}</div>
                        <p class="font-bold text-purple-900 text-2xl mb-2">${quizState.score} / ${total} Correct</p>
                        <p class="text-gray-600 mb-4">${earned > 0 ? `You earned ${earned} ⭐` : (best >= total ? 'Perfect score already! 🌟' : `Your best is ${Math.max(best, quizState.score)} / ${total} — beat it to earn more ⭐`)}</p>
                        <button onclick="renderQuiz(document.getElementById('module-content'), realCurriculum[state.level][state.unit])" class="bg-purple-600 hover:bg-purple-700 text-white font-bold px-5 py-2 rounded-xl shadow cursor-pointer">🔁 Try Again</button>
                    </div>`;
                return;
            }
            const wordIdx = quizState.order[quizState.qIndex];
            const word = unitData.vocab[wordIdx];

            const options = shuffle([word, ...distractors]);

            quizState.currentAnswer = word;
            contentDiv.innerHTML = `
                <h2 class="text-xl font-bold text-blue-800 mb-2">🧩 Quiz & Sticker Rewards</h2>
                <p class="text-sm text-gray-500 mb-3">Question ${quizState.qIndex + 1} of ${quizState.order.length}</p>
                <div class="bg-purple-50 p-6 rounded-2xl border border-purple-200">
                    <p class="font-bold text-purple-900 mb-2">🔊 Listen and choose the picture you heard:</p>
