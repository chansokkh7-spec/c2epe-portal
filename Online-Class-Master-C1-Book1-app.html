    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap');
        body { font-family: 'Poppins', sans-serif; }
        /* Flip-card for Listening: front = word, back = picture. */
        .flip-card { perspective: 1000px; height: 100px; cursor: pointer; }
        .flip-card-inner {
            position: relative; width: 100%; height: 100%;
            transition: transform 0.5s; transform-style: preserve-3d;
        }
        .flip-card.flipped .flip-card-inner { transform: rotateY(180deg); }
        .flip-card-front, .flip-card-back {
            position: absolute; width: 100%; height: 100%;
            backface-visibility: hidden; border-radius: 0.75rem;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 0.25rem;
        }
        .flip-card-back { transform: rotateY(180deg); }
        button:disabled { cursor: default; }
        /* phones: the lesson fills the screen, so jumping to it always shows it from the top,
           and the floating "Modules" button never covers the lesson's own buttons */
        @media (max-width: 767px) { #content-area { min-height: calc(100vh - 24px); padding-bottom: 76px; } }
    </style>

    <script>
        let state = {
            level: 'Master',
            unit: 1,
            tab: 'listening',
            stars: 0,
            badges: 0
        };

        const curriculum = {
            'Master': {
                1: { title: "Academic Writing", vocab: ["Thesis", "Argument", "Citation", "Evidence-based", "Coherence", "Critique", "Scholarly", "Synthesis", "Rhetoric", "Coherent"], story: "A strong thesis needs a clear argument supported by evidence-based citation. Coherence and synthesis distinguish truly scholarly critique.", question: "What makes academic writing persuasive and credible?", grammar: { point: "Nominalization", example: "The synthesis of evidence strengthens the argument." } },
                2: { title: "Argumentation & Debate", vocab: ["Rebuttal", "Counterargument", "Logical fallacy", "Persuade", "Concede", "Evidence", "Moderator", "Verdict", "Premise", "Fallacious"], story: "A strong rebuttal addresses the counterargument without committing a logical fallacy. A good debater can persuade, concede a point, and still win the verdict.", question: "What makes an argument convincing in a debate?", grammar: { point: "Emphatic structures", example: "It is evidence that truly persuades an audience." } },
                3: { title: "Research & Analysis", vocab: ["Methodology", "Data analysis", "Hypothesis testing", "Variable", "Correlation", "Peer review", "Findings", "Objectivity", "Sampling", "Validity"], story: "A sound methodology begins with hypothesis testing and careful data analysis. Peer review ensures the correlation between variables supports objective findings.", question: "Why is peer review important in research?", grammar: { point: "Passive voice for methodology", example: "The data was analyzed. The hypothesis was tested rigorously." } },
                4: { title: "Philosophy of Ethics", vocab: ["Moral relativism", "Utilitarianism", "Virtue", "Autonomy", "Justice", "Duty", "Consequentialism", "Dilemma", "Deontology", "Pragmatism"], story: "Utilitarianism weighs consequences, while virtue ethics focuses on character and duty. Debates about justice and autonomy often reveal a deeper moral dilemma.", question: "Which ethical framework do you find most convincing?", grammar: { point: "Abstract subject + passive", example: "Justice is often defined by consequences and duty." } },
                5: { title: "Political Systems", vocab: ["Democracy", "Governance", "Legislation", "Sovereignty", "Constitution", "Policy-making", "Representation", "Civic duty", "Bureaucracy", "Federalism"], story: "Democracy depends on fair governance and clear legislation. A constitution protects sovereignty, while representation and civic duty shape policy-making.", question: "What makes a political system fair and effective?", grammar: { point: "Modal perfect", example: "The policy should have considered representation more carefully." } },
                6: { title: "Advanced Negotiation", vocab: ["Leverage", "Compromise", "Win-win", "Mediation", "Bargaining power", "Concession", "Strategic", "Impasse", "Arbitration", "Stalemate"], story: "Understanding your leverage and bargaining power helps reach a win-win compromise. Mediation can resolve an impasse through strategic concession.", question: "What negotiation strategy do you find most effective?", grammar: { point: "Cleft sentences", example: "It is leverage that determines negotiating power." } },
                7: { title: "Formal Logic", vocab: ["Premise", "Syllogism", "Validity", "Fallacy", "Deduction", "Induction", "Inference", "Soundness"], story: "Formal logic relies on premises to build a valid syllogism, but a hidden fallacy can undermine the entire argument. Deduction moves from general to specific, while induction builds general conclusions from specific inference. Soundness requires both valid form and true premises.", question: "What is the difference between a valid argument and a sound one?", grammar: { point: "Conditional clauses (if/then)", example: "If the premises are true, then the conclusion must follow." }, value: "Rigor" },
                8: { title: "Academic Publishing", vocab: ["Manuscript", "Peer review", "Journal", "Submission", "Revision", "Rejection", "Impact factor", "Editor"], story: "Submitting a manuscript to a journal begins a long process. An editor sends it out for peer review, and the author often faces revision or even rejection. A journal's impact factor signals its academic prestige.", question: "Why is peer review considered essential to academic publishing?", grammar: { point: "Passive voice for process description", example: "The manuscript is reviewed by anonymous experts." }, value: "Intellectual Rigor" },
                9: { title: "Peer Review Process", vocab: ["Reviewer", "Anonymity", "Bias", "Methodology", "Critique", "Revision cycle", "Blind review", "Integrity"], story: "A reviewer evaluates a submission's methodology under strict anonymity to reduce bias. Constructive critique often leads to several revision cycles. Blind review protects the integrity of the entire academic system.", question: "What are the benefits and drawbacks of anonymous peer review?", grammar: { point: "Reduced relative clauses", example: "The methodology used in the study raised questions." }, value: "Fairness" },
                10: { title: "Citation Ethics", vocab: ["Plagiarism", "Attribution", "Intellectual property", "Paraphrase", "Integrity", "Misconduct", "Source", "Accountability"], story: "Proper attribution of every source protects against plagiarism and respects intellectual property. Learning to paraphrase correctly, rather than copy, is central to academic integrity. Misconduct can have serious consequences for accountability.", question: "Why do universities take citation ethics so seriously?", grammar: { point: "Gerunds as subjects", example: "Citing sources properly demonstrates academic integrity." }, value: "Integrity" },
                11: { title: "Interdisciplinary Studies", vocab: ["Interdisciplinary", "Synthesis", "Cross-pollination", "Framework", "Boundary", "Collaboration", "Holistic", "Convergence"], story: "Interdisciplinary studies thrive on synthesis, blending ideas across traditional academic boundaries. This cross-pollination of frameworks often leads to a more holistic understanding. Real convergence, however, requires genuine collaboration.", question: "What is one advantage of studying a problem from multiple disciplines?", grammar: { point: "Present participle as adjective", example: "A converging field draws on economics, biology, and sociology." }, value: "Open-Mindedness" },
                12: { title: "Critical Thinking Frameworks", vocab: ["Critical thinking", "Assumption", "Evidence", "Perspective", "Evaluation", "Bias", "Reasoning", "Framework"], story: "Critical thinking frameworks help us examine our own assumptions and evaluate evidence from multiple perspectives. Recognizing personal bias is a crucial step in sound reasoning.", question: "What assumption might you need to question in your own thinking?", grammar: { point: "Modal verbs for possibility", example: "An unexamined assumption might weaken your argument." }, value: "Self-Awareness" },
                13: { title: "Thesis Development", vocab: ["Thesis statement", "Argument", "Scope", "Claim", "Counterargument", "Refinement", "Focus", "Originality"], story: "Developing a strong thesis statement requires narrowing your scope to a clear, arguable claim. Anticipating a counterargument and refining your focus leads to more original work.", question: "What makes a thesis statement strong rather than weak?", grammar: { point: "Comparative structures", example: "A narrower thesis is often stronger than a broad one." }, value: "Precision" },
                14: { title: "Literature Review Methods", vocab: ["Literature review", "Synthesis", "Gap", "Chronological", "Thematic", "Scope", "Database", "Relevance"], story: "A literature review synthesizes existing research to identify a gap worth studying. Reviews can be organized chronologically or thematically, depending on scope and relevance to the research question.", question: "Why is identifying a 'gap' important in a literature review?", grammar: { point: "Purpose clauses (in order to)", example: "Researchers review prior work in order to identify a gap." }, value: "Thoroughness" },
                15: { title: "Statistical Reasoning", vocab: ["Correlation", "Causation", "Sample size", "Significance", "Variable", "Outlier", "Distribution", "Bias"], story: "Confusing correlation with causation is a common statistical error. A small sample size can distort significance, and an unexamined outlier can skew the entire distribution.", question: "Can you give an example of correlation being mistaken for causation?", grammar: { point: "Distinguishing correlation vs causation clauses", example: "Just because two variables correlate does not mean one causes the other." }, value: "Analytical Rigor" },
                16: { title: "Qualitative Research Methods", vocab: ["Interview", "Case study", "Coding", "Theme", "Saturation", "Triangulation", "Narrative", "Context"], story: "Qualitative research often relies on interviews and case studies, using coding to identify recurring themes. Reaching saturation and using triangulation strengthens the narrative within its context.", question: "What is one strength of qualitative research compared to quantitative?", grammar: { point: "Compared to / in contrast to", example: "Compared to surveys, interviews reveal richer context." }, value: "Depth of Understanding" },
                17: { title: "Quantitative Research Methods", vocab: ["Hypothesis", "Variable", "Survey", "Data set", "Regression", "Reliability", "Validity", "Generalizability"], story: "Quantitative research tests a hypothesis using measurable variables, often gathered through a survey and analyzed with regression on a large data set. Reliability and validity determine generalizability.", question: "What is the difference between reliability and validity in research?", grammar: { point: "Passive constructions for methodology", example: "The hypothesis was tested using a large data set." }, value: "Precision" },
                18: { title: "Academic Conferences", vocab: ["Conference", "Keynote", "Panel", "Poster session", "Networking", "Proceedings", "Abstract", "Discussant"], story: "Academic conferences often open with a keynote speech, followed by panel discussions and poster sessions. Networking at these events leads to future collaboration, later published in conference proceedings.", question: "What do you think is the value of attending an academic conference in person?", grammar: { point: "Sequencing language (first, then, finally)", example: "First the keynote, then panels, finally a poster session." }, value: "Community" },
                19: { title: "Scholarly Collaboration", vocab: ["Co-authorship", "Collaboration", "Contribution", "Consensus", "Division of labor", "Credit", "Partnership", "Synergy"], story: "Scholarly collaboration often results in co-authorship, where contribution and credit must be fairly divided. Reaching consensus and maintaining synergy is essential to a strong academic partnership.", question: "How should credit be divided fairly among co-authors?", grammar: { point: "Passive with by-agent", example: "Credit should be divided fairly by all contributors." }, value: "Fairness" },
                20: { title: "Academic Integrity", vocab: ["Integrity", "Plagiarism", "Attribution", "Paraphrase", "Honesty", "Misconduct", "Originality", "Accountability"], story: "Academic integrity rests on honesty, originality and accountability. Plagiarism and other forms of misconduct undermine trust, whereas careful attribution and accurate paraphrase demonstrate respect for other scholars.", question: "Why does academic integrity matter beyond avoiding punishment?", grammar: {"point": "Whereas for contrast", "example": "Plagiarism undermines trust, whereas attribution builds it."} },
                21: { title: "Grant Writing", vocab: ["Grant", "Proposal", "Funding", "Objectives", "Budget", "Impact", "Reviewer", "Feasibility"], story: "A successful grant proposal states clear objectives, a realistic budget and a persuasive case for impact. Reviewers look closely at feasibility before recommending funding.", question: "What makes a research proposal convincing to reviewers?", grammar: {"point": "Hedging (likely to, may, could)", "example": "The project is likely to have a significant impact."} },
                22: { title: "Research Ethics", vocab: ["Ethics", "Informed consent", "Confidentiality", "Participant", "Harm", "Anonymity", "Approval", "Vulnerable"], story: "Research ethics protect every participant from harm. Researchers must obtain informed consent, guarantee confidentiality and anonymity, and seek approval before working with vulnerable groups.", question: "Why is informed consent essential in research with people?", grammar: {"point": "Obligation with must / be required to", "example": "Researchers are required to obtain informed consent."} },
                23: { title: "Survey Design", vocab: ["Survey", "Questionnaire", "Sample", "Bias", "Scale", "Response rate", "Pilot", "Reliability"], story: "Good survey design begins with a clear questionnaire and a representative sample. Piloting helps reveal bias in wording, while a well-chosen scale improves reliability and response rate.", question: "How can the wording of a question bias survey results?", grammar: {"point": "Participle clauses", "example": "Having piloted the survey, the team revised the questions."} },
                24: { title: "Presenting Research", vocab: ["Presentation", "Audience", "Slide", "Key finding", "Clarity", "Q&A", "Visual", "Engagement"], story: "An effective research presentation adapts to its audience. Each slide should highlight one key finding with a clear visual, and a confident Q&A session sustains engagement.", question: "What distinguishes a memorable academic presentation?", grammar: {"point": "Cleft sentences (What... is...)", "example": "What matters most is clarity."} },
                25: { title: "Visualising Data", vocab: ["Visualisation", "Chart", "Axis", "Trend", "Outlier", "Misleading", "Scale", "Insight"], story: "Data visualisation turns numbers into insight. A well-labelled chart reveals a trend or outlier, whereas a truncated axis or distorted scale can be deeply misleading.", question: "How can a chart mislead its readers?", grammar: {"point": "Inversion for emphasis (Not only...)", "example": "Not only does a clear chart save time, but it also builds trust."} },
                26: { title: "Writing an Abstract", vocab: ["Abstract", "Summary", "Purpose", "Method", "Results", "Conclusion", "Keywords", "Concise"], story: "An abstract is a concise summary of a study's purpose, method, results and conclusion. Well-chosen keywords help other researchers find the work.", question: "Why is the abstract often the most-read part of a paper?", grammar: {"point": "Present simple for reporting research", "example": "This study examines..., and the results suggest..."} },
                27: { title: "Mixed Methods Research", vocab: ["Mixed methods", "Qualitative", "Quantitative", "Triangulation", "Interview", "Statistics", "Integration", "Depth"], story: "Mixed methods research combines qualitative interviews with quantitative statistics. Through triangulation and careful integration, researchers gain both breadth and depth.", question: "When is a mixed methods approach most useful?", grammar: {"point": "Linking with thereby", "example": "The study combined methods, thereby increasing validity."} },
                28: { title: "Open Science", vocab: ["Open access", "Transparency", "Replication", "Data sharing", "Preprint", "Reproducibility", "Collaboration", "Public"], story: "The open science movement promotes transparency through open access publishing, data sharing and preprints. These practices support replication and reproducibility, and make research available to the public.", question: "What are the benefits and risks of sharing research data openly?", grammar: {"point": "Passive reporting verbs (It is argued that...)", "example": "It is widely argued that open data improves reproducibility."} },
                29: { title: "Review: The Research Journey", vocab: ["Question", "Literature", "Method", "Evidence", "Analysis", "Argument", "Revision", "Contribution"], story: "Research is a journey from a question, through the literature and a sound method, to evidence and analysis. A clear argument, careful revision and a genuine contribution complete it.", question: "Which stage of research do you find most challenging?", grammar: {"point": "Sequencing discourse markers", "example": "Initially..., subsequently..., ultimately..."} },
            }
        };

        const LEVELS_ORDER = ['Master'];
        const LEVEL_NAMES = {"Master": "C1 Book 1"};

        // ===== Progress: stars/badges are earned once per activity and remembered =====
        // Saved in this browser when the page is opened as a normal web page. Inside the Hub's
        // secure "Embed Code" box the browser blocks storage, so progress then lasts until the
        // page is closed — but it still can't be farmed by tapping the same button again.
        const PROGRESS_KEY = () => 'c2epe_onlineclass_master_C1_1_progress_' + state.level;
        let progress = { stars: 0, badges: 0, awarded: {}, best: {}, completed: {} };
        function loadProgress() {
            progress = { stars: 0, badges: 0, awarded: {}, best: {}, completed: {} };
            try {
                const saved = JSON.parse(localStorage.getItem(PROGRESS_KEY()) || 'null');
                if (saved && typeof saved === 'object') progress = Object.assign(progress, saved);
            } catch (e) { /* storage not available (e.g. inside the Hub sandbox) */ }
            state.stars = progress.stars; state.badges = progress.badges;
            document.getElementById('star-count').textContent = state.stars;
            document.getElementById('badge-count').textContent = state.badges;
        }
        function saveProgress() {
            progress.stars = state.stars; progress.badges = state.badges;
            try { localStorage.setItem(PROGRESS_KEY(), JSON.stringify(progress)); } catch (e) {}
        }
        const unitKey = (what) => 'u' + state.unit + '|' + what;
        const wasAwarded = (key) => !!progress.awarded[state.level + '|' + key];
        // Gives stars only the first time an activity is done. Returns true if stars were given.
        function award(key, amount) {
            const k = state.level + '|' + key;
            if (progress.awarded[k]) return false;
            progress.awarded[k] = true;
            addStars(amount);
            return true;
        }
        // Shows "(+3 ⭐)" the first time, and a friendly note afterwards
        const starNote = (given, amount) => given ? ` (+${amount} ⭐)` : ' (stars already earned)';

        function isRecentlyAdded(dateStr) {
            if (!dateStr) return false;
            const added = new Date(dateStr);
            if (isNaN(added.getTime())) return false;
            const daysSince = (Date.now() - added.getTime()) / (1000 * 60 * 60 * 24);
            return daysSince >= 0 && daysSince <= 7;
        }

        function populateUnitSelect() {
            const sel = document.getElementById('unit-select');
            const levelData = curriculum[state.level];
            const prevUnit = state.unit;
            const unitCount = Object.keys(levelData).length;
            const labelEl = document.getElementById('unit-select-label');
            if (labelEl) labelEl.textContent = `Select Unit (1 to ${unitCount})`;
            // 🎬 = this unit has a video · 🆕 = video added in the last 7 days
            sel.innerHTML = Object.keys(levelData).map(u => {
                const v = videoFor(state.level, u);
                const mark = v ? (isRecentlyAdded(v.dateAdded) ? ' 🆕' : ' 🎬') : '';
                return `<option value="${u}">Unit ${u}: ${levelData[u].title}${mark}</option>`;
            }).join('');
            if (levelData[prevUnit]) {
                sel.value = prevUnit;
                state.unit = prevUnit;
            } else {
                state.unit = parseInt(sel.value);
            }
        }

        function splitSentences(text) {

        let enVoice = null;
        function pickVoice() {
            if (!('speechSynthesis' in window)) return;
            enVoice = window.speechSynthesis.getVoices().find(v => v.lang && v.lang.startsWith('en')) || null;
        }
        if ('speechSynthesis' in window) { pickVoice(); window.speechSynthesis.onvoiceschanged = pickVoice; }
        function speak(text, onEnd) {
            if (!('speechSynthesis' in window)) { if (onEnd) onEnd(false); return false; }
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(text);
            u.lang = 'en-US';
            u.rate = 0.9;
            if (!enVoice) pickVoice();
            if (enVoice) u.voice = enVoice;
            if (onEnd) u.onend = () => onEnd(true);
            window.speechSynthesis.speak(u);
            return true;
        }

        function shuffle(arr) {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        function allVocabForLevel(level) {

        // ---------- Pictures ----------
        // When two words in the SAME unit would show the same picture, the second one gets its
        // own picture here (only inside that unit), so children can tell them apart.
        const SAME_UNIT_ALT = {
            "Goodbye": "🚶👋", "Thank you": "💝", "Sorry": "😔", "Respect": "🫡", "Tomorrow": "⏭️",
            "West": "🌇", "East": "🌄", "North": "🧭", "Between": "🥪", "Early": "🐓", "Late": "⏰",
            "Swing": "🎠", "Poster": "🪧"
        };
        function baseEmoji(word) { return WORD_EMOJI[word] || '🖼️'; }
        function emojiFor(word, unitData) {
            const u = unitData || curriculum[state.level][state.unit];
            const e = baseEmoji(word);
            if (u && SAME_UNIT_ALT[word] && u.vocab.some(w => w !== word && baseEmoji(w) === e)) return SAME_UNIT_ALT[word];
            return e;
        }
        // Wrong answers for "look at the picture" questions never share the right answer's
        // picture, so there is always exactly one correct choice.
        function pictureDistractors(correct, pool, unitData, n) {
            const pic = emojiFor(correct, unitData);
            const ok = (w) => w !== correct && emojiFor(w, unitData) !== pic;
            let list = shuffle([...new Set(pool)].filter(ok)).slice(0, n);
            if (list.length < n) {
                const extra = shuffle(allVocabForLevel(state.level).filter(w => ok(w) && !list.includes(w)));
                list = list.concat(extra.slice(0, n - list.length));
            }
            return list;
        }

 "The synthesis of evidence strengthens the argument."], [252.85, 256.99, "The rapid expansion of online learning has transformed higher education."], [257.88, 260.94, "The absence of reliable data undermines the conclusion."], [261.9, 272.95, "Nominalization turns processes into things: expand → expansion, absent → absence. It makes writing more formal and lets you build long, information-rich noun phrases."], [273.68, 277.62, "Be careful! Don't say: The analyse of the data was careful."], [279.57, 282.37, "Say: The analysis of the data was careful."], [282.67, 286.55, "Nominalise correctly: analyse → analysis."], [287.33, 289.96, "Part four: reading. Read and listen."], [290.77, 292.24, "Writing Like a Scholar."], [292.54, 297.99, "Academic prose differs from everyday writing less in its vocabulary than in its structure."], [299.0, 304.98, "Writers tend to nominalise processes, so that 'we analysed the results' becomes 'the analysis of the results'."], [305.97, 311.89, "The synthesis of evidence strengthens the argument, because it shows how individual findings relate to one another."], [312.9, 318.17, "Coherence, however, depends on more than formal style; each paragraph must advance the thesis."], [319.17, 324.89, "Ultimately, rhetoric may impress readers, but only rigorous, well-cited critique will convince them."], [326.0, 330.12, "Part five: quiz. Five questions. Are you ready?"], [330.98, 335.87, "Choose the most academic version: 'Prices rose sharply, which worried consumers.'"], [336.17, 345.18, "A, The sharp rise in prices caused consumer concern.. B, Prices went up a lot and people were worried.. C, Consumers were worried because prices rose.."], [348.73, 353.42, "The answer is A: The sharp rise in prices caused consumer concern.."], [354.55, 357.57, "The blank of reliable data undermines the conclusion."], [357.87, 361.56, "A, absent. B, absently. C, absence."], [365.1, 366.96, "The answer is C: absence."], [368.12, 372.17, "A literature review requires blank, not just a list of summaries."], [372.47, 376.53, "A, rhetoric. B, synthesis. C, citation."], [380.07, 382.44, "The answer is B: synthesis."], [383.58, 385.39, "Which collocation is correct?"], [385.69, 390.87, "A, make a citation. B, provide a citation. C, do a citation."], [394.43, 397.35, "The answer is B: provide a citation."], [398.52, 400.97, "In the reading, what does coherence depend on?"], [401.27, 407.88, "A, each paragraph advancing the thesis. B, using as many nouns as possible. C, impressive rhetoric."], [411.43, 415.36, "The answer is A: each paragraph advancing the thesis."], [416.57, 419.75, "Part six: speaking. It's your turn to talk."], [420.62, 423.43, "What makes academic writing persuasive and credible?"], [440.22, 441.7, "Now listen to Visal."], [442.0, 478.65, "In my view, credibility comes first from evidence: every major claim should be supported by a reliable, properly cited source. Persuasiveness, on the other hand, depends on structure, with a clear thesis and paragraphs that build on one another. For instance, the synthesis of several studies is far more convincing than a single statistic. Some people believe elegant style is enough, but rhetoric without evidence quickly loses the reader's trust. So, ultimately, strong writing combines rigour with clarity."], [478.95, 480.81, "Excellent answer, Visal!"], [481.72, 486.3, "Great work! Now you can use ten new words and nominalization."], [486.6, 491.44, "Today's value is dedication. Practise a little every day, and you will get better."], [491.74, 494.11, "See you in Unit two. Goodbye!"], [494.4, 498.18, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C1B1-Unit02-Argumentation-Debate": [[0.35, 4.87, "Hello, everyone! I'm Ms. Emma. Welcome to Online C one, Book one."], [5.17, 8.6, "Hi! I'm Visal. Let's learn together!"], [8.89, 15.69, "Unit two: Argumentation & Debate. Today you will add force and focus to your arguments with emphatic structures."], [15.99, 18.49, "Here is our lesson map. Let's start!"], [19.43, 22.79, "Part one: words. You will learn ten new words."], [23.65, 24.43, "Rebuttal."], [25.42, 29.36, "Rebuttal means a response that attempts to disprove an opposing claim."], [29.95, 33.25, "Her rebuttal dismantled the opposition's central statistic."], [33.85, 36.65, "Your turn. Say: Rebuttal."], [39.5, 40.4, "Rebuttal."], [41.15, 42.28, "Counterargument."], [43.28, 46.52, "Counterargument means a reason put forward against your position."], [47.12, 50.22, "Anticipating the counterargument strengthens your own case."], [50.82, 53.38, "Your turn. Say: Counterargument."], [56.23, 57.52, "Counterargument."], [58.28, 59.66, "Logical fallacy."], [60.65, 65.06, "Logical fallacy means a flaw in reasoning that makes an argument invalid."], [65.65, 69.36, "Attacking a speaker's character is a classic logical fallacy."], [69.95, 73.12, "Your turn. Say: Logical fallacy."], [75.97, 77.65, "Logical fallacy."], [78.42, 79.37, "Persuade."], [80.38, 83.96, "Persuade means to cause someone to accept a belief through reasoning."], [84.55, 87.55, "The data persuaded even the most sceptical judges."], [88.15, 91.08, "Your turn. Say: Persuade."], [93.93, 94.76, "Persuade."], [95.52, 96.4, "Concede."], [97.42, 101.1, "Concede means to admit, often reluctantly, that a point is valid."], [101.68, 105.04, "I concede that the policy is expensive, but it is essential."], [105.65, 108.49, "Your turn. Say: Concede."], [111.33, 112.31, "Concede."], [113.05, 114.07, "Evidence."], [115.08, 119.18, "Evidence means facts or information indicating whether a claim is true."], [119.78, 122.49, "Anecdotes are not a substitute for evidence."], [123.08, 125.79, "Your turn. Say: Evidence."], [128.63, 129.77, "Evidence."], [130.52, 131.56, "Moderator."], [132.55, 135.7, "Moderator means a neutral person who manages a debate."], [136.28, 139.79, "The moderator intervened when the speakers interrupted each other."], [140.38, 142.69, "Your turn. Say: Moderator."], [145.53, 146.47, "Moderator."], [147.22, 148.01, "Verdict."], [149.02, 151.68, "Verdict means a formal judgement or decision."], [152.28, 154.39, "The panel reached a unanimous verdict."], [154.98, 157.31, "Your turn. Say: Verdict."], [160.17, 160.96, "Verdict."], [161.72, 162.56, "Premise."], [163.55, 166.68, "Premise means a proposition on which an argument is based."], [167.28, 170.62, "If the premise is false, the conclusion collapses."], [171.22, 173.68, "Your turn. Say: Premise."], [176.53, 177.41, "Premise."], [178.15, 179.16, "Fallacious."], [180.15, 183.49, "Fallacious means based on mistaken or misleading reasoning."], [184.08, 186.62, "The claim that everyone agrees is fallacious."], [187.22, 189.95, "Your turn. Say: Fallacious."], [192.8, 193.81, "Fallacious."], [194.6, 198.2, "Part two: dialogue. Let's listen to a conversation."], [199.05, 204.31, "Visal, the judges said your rebuttal was the strongest of the tournament. What was your approach?"], [205.42, 212.78, "I avoided emotional appeals. It is evidence that truly persuades an audience, so I built every point on data."], [213.88, 216.25, "But you also conceded a point, didn't you?"], [217.35, 225.26, "Yes, deliberately. What conceding a minor point does is make you appear fair, which makes your main argument more credible."], [226.35, 230.6, "And how did you deal with their claim that 'everyone knows' uniforms improve discipline?"], [231.72, 240.69, "I pointed out that it was an appeal to popularity, a logical fallacy. It wasn't their conclusion I attacked, but their premise."], [241.83, 243.43, "Part three: grammar."], [244.28, 246.75, "Grammar focus: Emphatic structures."], [247.05, 248.22, "Look at the pattern."], [248.92, 251.68, "It is evidence that truly persuades an audience."], [252.58, 255.35, "What conceding a point does is make you appear fair."], [256.25, 259.34, "It wasn't their conclusion that I attacked, but their premise."], [260.3, 268.62, "Emphatic structures move the key information into focus. 'It is X that …' highlights one element; 'What … is …' delays the key idea for dramatic effect."], [269.38, 273.29, "Be careful! Don't say: It is evidence what persuades people."], [275.23, 277.92, "Say: It is evidence that persuades people."], [278.22, 279.96, "Use 'It is … that', not 'what'."], [280.77, 283.63, "Part four: reading. Read and listen."], [284.43, 285.97, "The Anatomy of a Debate."], [286.27, 290.59, "Skilled debaters know that volume and confidence rarely win an argument on their own."], [291.6, 297.89, "It is evidence that truly persuades an audience, particularly when it is drawn from credible, independent sources."], [298.9, 304.42, "An effective rebuttal targets the premise of the opposing case rather than merely contradicting its conclusion."], [305.43, 311.5, "Paradoxically, conceding a minor point can increase a speaker's credibility, since it signals fairness."], [312.5, 318.38, "What judges ultimately reward is not rhetorical flair, but reasoning free from logical fallacies."], [319.47, 323.93, "Part five: quiz. Five questions. Are you ready?"], [324.78, 327.76, "It is evidence blank truly persuades an audience."], [328.06, 330.9, "A, what. B, that. C, which it."], [334.43, 335.94, "The answer is B: that."], [337.08, 341.68, "Transform: 'Their premise was weak.' → What blank was their premise."], [341.98, 345.45, "A, was weak. B, weak was. C, it was weak."], [349.0, 351.08, "The answer is A: was weak."], [352.22, 356.55, "'Everyone believes it, so it must be true' is an example of a blank."], [356.85, 360.89, "A, rebuttal. B, concession. C, logical fallacy."], [364.43, 367.64, "The answer is C: logical fallacy."], [368.78, 372.2, "Which verb means 'admit a point is valid, often reluctantly'?"], [372.5, 376.02, "A, concede. B, persuade. C, moderate."], [379.57, 381.53, "The answer is A: concede."], [382.68, 386.23, "According to the reading, why can conceding a point help a speaker?"], [386.53, 392.91, "A, It signals fairness.. B, It ends the debate faster.. C, It confuses the judges.."], [396.47, 398.99, "The answer is A: It signals fairness.."], [400.2, 403.5, "Part six: speaking. It's your turn to talk."], [404.35, 406.87, "What makes an argument convincing in a debate?"], [423.68, 425.18, "Now listen to Visal."], [425.48, 454.12, "I would argue that it is the quality of the evidence that makes an argument convincing. Reliable data and expert sources carry far more weight than emotional appeals. For example, a single well-chosen statistic can undermine an opponent's entire case. Of course, delivery matters too, and a nervous speaker may struggle to persuade. Nevertheless, what judges ultimately remember is whether the reasoning held up."], [454.42, 456.16, "Excellent answer, Visal!"], [457.05, 461.49, "Great work! Now you can use ten new words and emphatic structures."], [461.79, 466.47, "Today's value is respectful disagreement. Disagree politely and listen to others."], [466.77, 469.42, "See you in Unit three. Goodbye!"], [469.72, 472.88, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C1B1-Unit03-Research-Analysis": [[0.35, 4.91, "Hello, everyone! I'm Ms. Emma. Welcome to Online C one, Book one."], [5.21, 8.62, "Hi! I'm Visal. Let's learn together!"], [8.92, 16.18, "Unit three: Research & Analysis. Today you will report research procedures objectively using the passive voice."], [16.48, 19.14, "Here is our lesson map. Let's start!"], [20.1, 23.09, "Part one: words. You will learn ten new words."], [23.95, 25.06, "Methodology."], [26.05, 30.16, "Methodology means the system of methods and principles used in a study."], [30.75, 33.82, "The methodology was criticised for its small sample."], [34.42, 37.51, "Your turn. Say: Methodology."], [40.37, 41.59, "Methodology."], [42.35, 43.73, "Data analysis."], [44.75, 48.85, "Data analysis means the process of inspecting and interpreting data."], [49.45, 52.69, "Data analysis revealed an unexpected pattern."], [53.28, 56.35, "Your turn. Say: Data analysis."], s."], [306.63, 313.06, "Once the data was analyzed, the hypothesis was tested rigorously against alternative explanations."], [314.07, 319.34, "A correlation, however strong, is never treated as proof that one variable causes another."], [320.33, 324.47, "Only after peer review are the findings considered robust enough to be published."], [325.57, 329.85, "Part five: quiz. Five questions. Are you ready?"], [330.68, 333.6, "The hypothesis blank rigorously using two models."], [333.9, 337.83, "A, tested. B, was tested. C, has testing."], [341.37, 343.26, "The answer is B: was tested."], [344.42, 347.53, "Which sentence is most appropriate for a methods section?"], [347.83, 355.98, "A, We asked lots of students some questions.. B, Students were asked questions by us, okay?. C, Two hundred students were surveyed.."], [359.53, 362.76, "The answer is C: Two hundred students were surveyed.."], [363.92, 366.21, "blank minimises selection bias."], [366.51, 370.88, "A, Random sampling. B, Peer review. C, Objectivity."], [374.43, 377.01, "The answer is A: Random sampling."], [378.15, 381.98, "If a test does not measure what it claims to measure, it lacks blank."], [382.28, 386.29, "A, correlation. B, validity. C, sampling."], [389.83, 392.34, "The answer is B: validity."], [393.48, 396.42, "According to the reading, a strong correlation blank."], [396.72, 403.49, "A, proves causation. B, is never treated as proof of causation. C, replaces peer review."], [407.03, 410.75, "The answer is B: is never treated as proof of causation."], [411.97, 415.06, "Part six: speaking. It's your turn to talk."], [415.92, 418.58, "Why is peer review important in research?"], [435.38, 436.86, "Now listen to Visal."], [437.16, 468.24, "Peer review is important because it acts as a quality filter before research reaches the public. Methods and data are scrutinised by independent experts, so errors and weak conclusions can be identified. For example, a flawed sample might be spotted and corrected before publication. Admittedly, the process is slow and reviewers are not always objective. Even so, it remains the best safeguard we have for scientific credibility."], [468.54, 470.34, "Excellent answer, Visal!"], [471.25, 476.29, "Great work! Now you can use ten new words and passive voice for methodology."], [476.59, 481.42, "Today's value is critical thinking. Think carefully and give reasons for your opinions."], [481.72, 484.24, "See you in Unit four. Goodbye!"], [484.54, 487.72, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C1B1-Unit04-Philosophy-of-Ethics": [[0.35, 5.08, "Hello, everyone! I'm Ms. Emma. Welcome to Online C one, Book one."], [5.38, 8.78, "Hi! I'm Visal. Let's learn together!"], [9.08, 16.69, "Unit four: Philosophy of Ethics. Today you will discuss abstract ideas using abstract subjects with the passive."], [16.99, 19.54, "Here is our lesson map. Let's start!"], [20.5, 23.87, "Part one: words. You will learn ten new words."], [24.72, 26.09, "Moral relativism."], [27.08, 31.94, "Moral relativism means the view that moral judgements depend on culture or context."], [32.55, 36.36, "Moral relativism struggles to condemn obvious injustice."], [36.95, 40.0, "Your turn. Say: Moral relativism."], [42.83, 44.54, "Moral relativism."], [45.28, 46.74, "Utilitarianism."], [47.75, 53.48, "Utilitarianism means the theory that the right action maximises overall well-being."], [54.08, 57.82, "Utilitarianism may justify sacrificing one to save many."], [58.42, 61.38, "Your turn. Say: Utilitarianism."], [64.23, 65.75, "Utilitarianism."], [66.48, 67.28, "Virtue."], [68.28, 70.84, "Virtue means a stable trait of good character."], [71.45, 74.2, "Aristotle considered courage a central virtue."], [74.82, 77.49, "Your turn. Say: Virtue."], [80.33, 81.19, "Virtue."], [81.95, 83.06, "Autonomy."], [84.05, 87.51, "Autonomy means a person's capacity for self-determination."], [88.12, 91.44, "Medical ethics places great weight on patient autonomy."], [92.05, 94.39, "Your turn. Say: Autonomy."], [97.23, 98.29, "Autonomy."], [99.05, 100.03, "Justice."], [101.02, 104.41, "Justice means fairness in the distribution of rights and burdens."], [105.02, 108.19, "Social justice concerns how resources are shared."], [108.78, 111.49, "Your turn. Say: Justice."], [114.33, 115.38, "Justice."], [116.12, 116.78, "Duty."], [117.78, 121.49, "Duty means a moral obligation that binds regardless of outcome."], [122.08, 124.56, "Kant argued that we have a duty never to lie."], [125.15, 127.67, "Your turn. Say: Duty."], [130.53, 131.35, "Duty."], [132.08, 133.48, "Consequentialism."], [134.48, 138.42, "Consequentialism means judging actions solely by their outcomes."], [139.02, 142.18, "Consequentialism ignores the intentions behind an act."], [142.78, 146.26, "Your turn. Say: Consequentialism."], [149.1, 150.52, "Consequentialism."], [151.28, 152.09, "Dilemma."], [153.08, 157.29, "Dilemma means a situation requiring a choice between conflicting values."], [157.88, 160.05, "Doctors face this dilemma daily."], [160.65, 163.49, "Your turn. Say: Dilemma."], [166.33, 167.07, "Dilemma."], [167.82, 169.04, "Deontology."], [170.05, 174.46, "Deontology means ethics based on rules and duties rather than results."], [175.05, 178.21, "Deontology holds that some acts are wrong in themselves."], [178.82, 182.05, "Your turn. Say: Deontology."], [184.9, 185.83, "Deontology."], [186.58, 187.65, "Pragmatism."], [188.65, 193.24, "Pragmatism means an approach that judges ideas by practical consequences."], [193.85, 196.99, "Pragmatism often guides real-world policy."], [197.58, 200.28, "Your turn. Say: Pragmatism."], [203.13, 204.23, "Pragmatism."], [205.03, 208.7, "Part two: dialogue. Let's listen to a conversation."], [209.55, 214.21, "Visal, in today's seminar, how is justice defined by the main ethical traditions?"], [215.32, 226.87, "Justice is often defined by consequences and duty. Utilitarians focus on outcomes, whereas deontologists focus on obligations."], [227.98, 229.53, "So which one is right?"], [230.62, 240.64, "Neither is accepted universally. Utilitarianism is criticised for permitting harm to minorities, and deontology is accused of rigidity."], [241.75, 243.57, "What about virtue ethics?"], [244.68, 252.02, "It is increasingly seen as a middle path, because character is emphasised over rules or calculations."], [253.17, 255.0, "Part three: grammar."], [255.85, 259.17, "Grammar focus: Abstract subject plus passive."], [259.47, 260.6, "Look at the pattern."], [261.32, 264.44, "Justice is often defined by consequences and duty."], [265.35, 269.74, "Utilitarianism is widely criticised for permitting harm to minorities."], [270.65, 274.18, "Virtue ethics is increasingly seen as a middle path."], [275.13, 286.12, "Academic writing often makes an abstract idea the subject and uses the passive to report general views without naming who holds them. Adverbs like 'often', 'widely' and 'increasingly' add precision."], [286.88, 291.73, "Be careful! Don't say: Utilitarianism is criticised of ignoring rights."], [293.67, 297.63, "Say: Utilitarianism is criticised for ignoring rights."], [297.93, 300.23, "We criticise something FOR doing something."], [301.03, 303.71, "Part four: reading. Read and listen."], [304.5, 306.05, "What Makes an Action Right?."], [306.35, 311.2, "Moral philosophy asks whether right and wrong are universal or culturally determined."], [312.2, 317.6, "Justice is often defined by consequences and duty, reflecting two rival traditions."], [318.6, 324.79, "Utilitarianism is praised for its practicality but criticised for neglecting individual rights."], [325.8, 332.21, "Deontology, by contrast, insists that certain acts, such as lying, are wrong regardless of their outcomes."], [333.2, 339.01, "Virtue ethics is increasingly seen as a bridge, because it locates morality in character rather than rules."], [340.1, 344.16, "Part five: quiz. Five questions. Are you ready?"], [345.02, 349.13, "Utilitarianism is widely blank for neglecting individual rights."], [349.43, 353.95, "A, criticise. B, criticised. C, criticising."], [357.5, 359.8, "The answer is B: criticised."], [360.95, 365.67, "'Lying is wrong even if it produces good results.' This view reflects blank."], [365.97, 370.46, "A, consequentialism. B, deontology. C, pragmatism."], [374.0, 376.44, "The answer is B: deontology."], [377.58, 380.93, "A choice between two conflicting moral values is a blank."], [381.23, 384.48, "A, dilemma. B, virtue. C, verdict."], [388.03, 389.89, "The answer is A: dilemma."], [391.05, 394.7, "Which sentence uses an abstract subject + passive correctly?"], [395.0, 402.7, "A, Autonomy is protected by medical law.. B, Autonomy protects by medical law.. C, Medical law is autonomy protected.."], [406.27, 409.94, "The answer is A: Autonomy is protected by medical law.."], [411.08, 414.96, "According to the reading, virtue ethics locates morality in blank."], [415.26, 418.67, "A, rules. B, outcomes. C, character."], [422.23, 424.22, "The answer is C: character."], [425.43, 428.49, "Part six: speaking. It's your turn to talk."], [429.35, 432.31, "Which ethical framework do you find most convincing?"], [449.12, 450.68, "Now listen to Visal."], [450.98, 485.95, "Personally, I find virtue ethics the most convincing framework. Unlike utilitarianism, it does not reduce morality to a calculation, and unlike deontology, it allows for judgement in difficult situations. For example, a compassionate doctor will weigh honesty and kindness when delivering bad news. Critics argue that it gives vague guidance, and that is a fair point. However, I believe good character is more reliable than any rigid rule."], [486.25, 487.97, "Excellent answer, Visal!"], [488.88, 493.76, "Great work! Now you can use ten new words and abstract subject plus passive."], [494.06, 498.35, "Today's value is ethical awareness. Think about what is right before you act."], [498.65, 501.0, "See you in Unit five. Goodbye!"], [501.31, 504.25, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C1B1-Unit05-Political-Systems": [[0.35, 4.98, "Hello, everyone! I'm Ms. Emma. Welcome to Online C one, Book one."], [5.28, 8.93, "Hi! I'm Visal. Let's learn together!"], [9.23, 14.72, "Unit five: Political Systems. Today you will evaluate past decisions with modal perfects."], [15.02, 17.59, "Here is our lesson map. Let's start!"], [18.53, 21.92, "Part one: words. You will learn ten new words."], [22.78, 23.97, "Democracy."], [24.98, 28.14, "Democracy means government in which power rests with the people."], [28.75, 31.59, "Democracy requires more than holding elections."], [32.18, 35.02, "Your turn. Say: Democracy."], [37.87, 38.97, "Democracy."], [39.72, 40.83, "Governance."], [41.85, 46.12, "Governance means the processes by which institutions are directed and held accountable."], [46.72, 48.99, "Weak governance encourages corruption."], [49.58, 52.17, "Your turn. Say: Governance."], [55.0, 56.01, "Governance."], [56.75, 58.01, "Legislation."], [59.02, 62.06, "Legislation means laws enacted by a parliament."], [62.65, 65.79, "The legislation was passed despite strong opposition."], [66.38, 68.97, "Your turn. Say: Legislation."], [71.8, 73.01, "Legislation."], [73.75, 74.9, "Sovereignty."], [75.92, 80.14, "Sovereignty means supreme authority of a state over its own affairs."], [80.75, 83.39, "Trade agreements can limit national sovereignty."], [83.98, 86.46, "Your turn. Say: Sovereignty."], [89.3, 90.3, "Sovereignty."], [91.05, 92.32, "Constitution."], [93.32, 97.25, "Constitution means the fundamental principles by which a state is governed."], [97.85, 100.66, "The constitution guarantees freedom of expression."], [101.25, 104.0, "Your turn. Say: Constitution."], [106.83, 107.98, "Constitution."], [108.75, 110.12, "Policy-making."], [111.12, 114.67, "Policy-making means the process of designing public decisions."], [115.28, 117.68, "Evidence should inform policy-making."], [118.28, 121.13, "Your turn. Say: Policy-making."], [123.97, 125.48, "Policy-making."], [126.22, 127.59, "Representation."], [128.58, 132.72, "Representation means the extent to which groups have a voice in decision-making."], [133.32, 136.2, "Women remain underrepresented in many parliaments."], [136.78, 139.83, "Your turn. Say: Representation."], [142.67, 144.0, "Representation."], [144.75, 145.97, "Civic duty."], [146.98, 150.98, "Civic duty means the responsibilities of a citizen to society."], [151.58, 154.4, "Jury service is regarded as a civic duty."], [154.98, 157.6, "Your turn. Say: Civic duty."], [160.47, 161.63, "Civic duty."], [162.38, 163.56, "Bureaucracy."], [164.55, 169.0, "Bureaucracy means an administrative system with complex rules and procedures."], [169.58, 172.16, "Excessive bureaucracy delayed the reforms."], [172.75, 175.53, "Your turn. Say: Bureaucracy."], [178.37, 179.56, "Bureaucracy."], [180.32, 181.39, "Federalism."], [182.38, 187.04, "Federalism means a system dividing power between central and regional governments."], [187.65, 191.08, "Federalism allows regions to tailor education policy."], [191.68, 194.22, "Your turn. Say: Federalism."], [197.07, 198.0, "Federalism."], [198.8, 202.44, "Part two: dialogue. Let's listen to a conversation."], [203.28, 208.64, "Visal, the new transport policy has been widely criticised. What went wrong, in your view?"], [209.75, 216.88, "The policy should have considered representation more carefully. Rural communities were barely consulted."], [217.98, 220.44, "Could the government have avoided the protests?"], [221.55, 228.37, "It could have held public hearings before the legislation was drafted. That might have built trust."], [229.48, 232.52, "Some say the protests were exaggerated by the media."], [233.62, 239.89, "That may have played a role, but the government must have known that ignoring rural voters would backfire."], [241.03, 242.54, "Part three: grammar."], [243.38, 245.51, "Grammar focus: Modal perfect."], [245.81, 247.1, "Look at the pattern."], [247.82, 251.35, "The policy should have considered representation more carefully."], [252.25, 254.96, "The government could have held public hearings first."], [255.85, 258.01, "Officials must have known the risks."], [258.97, 267.39, "Modal perfects judge the past: 'should have' criticises, 'could have' shows an unused option, 'might have' speculates, and 'must have' expresses a confident deduction."], [268.15, 272.17, "Be careful! Don't say: They should had consulted the public."], [274.13, 276.84, "Say: They should have consulted the public."], [277.14, 280.82, "Modal perfect: modal + have + past participle."], [281.63, 284.29, "Part four: reading. Read and listen."], [285.1, 286.74, "When Policy Fails."], [287.04, 292.2, "Democracy depends not only on elections but also on transparent governance between them."], [293.2, 299.81, "When a policy provokes widespread protest, analysts ask what decision-makers should have done differently."], [300.8, 307.59, "In many cases, the policy should have considered representation more carefully, especially for marginalised groups."], [308.6, 314.54, "Public consultation could have revealed problems early, while excessive bureaucracy may have slowed the response."], [315.53, 320.35, "Such failures remind citizens that participation is a civic duty, not a privilege."], [321.47, 325.38, "Part five: quiz. Five questions. Are you ready?"], [326.22, 329.44, "The policy should blank representation more carefully."], [329.74, 333.98, "A, have considered. B, had considered. C, considered."], [337.53, 339.48, "The answer is A: have considered."], [340.62, 344.93, "'I'm almost certain they knew the risks.' → They blank the risks."], [345.23, 349.28, "A, should have known. B, must have known. C, could know."], [352.83, 355.24, "The answer is B: must have known."], [356.38, 360.81, "Which modal perfect describes an option that was available but not taken?"], [361.11, 364.8, "A, could have. B, must have. C, will have."], [368.33, 370.03, "The answer is A: could have."], [371.18, 373.64, "The blank guarantees freedom of expression."], [373.94, 378.29, "A, bureaucracy. B, constitution. C, sovereignty."], [381.83, 383.97, "The answer is B: constitution."], [385.12, 388.59, "According to the reading, what could public consultation have done?"], [388.89, 394.67, "A, revealed problems early. B, removed bureaucracy. C, replaced elections."], [398.23, 401.37, "The answer is A: revealed problems early."], [402.57, 405.82, "Part six: speaking. It's your turn to talk."], [406.68, 409.32, "What makes a political system fair and effective?"], [426.12, 427.51, "Now listen to Visal."], [427.81, 459.38, "I believe a political system is fair when every group has genuine representation, not just the majority. It is effective when laws are made transparently and leaders can be held accountable. For instance, many failed policies should have involved local communities from the start. Some argue that strong, centralised leadership is more efficient, and in a crisis that may be true. In the long run, however, fairness and effectiveness depend on each other."], [459.68, 461.87, "Excellent answer, Visal!"], [462.78, 466.77, "Great work! Now you can use ten new words and modal perfect."], [467.07, 472.89, "Today's value is civic responsibility. Take care of your city, because it is everyone's home."], [473.19, 475.71, "See you in Unit six. Goodbye!"], [476.01, 478.5, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C1B1-Unit06-Advanced-Negotiation": [[0.35, 4.98, "Hello, everyone! I'm Ms. Emma. Welcome to Online C one, Book one."], [5.28, 8.73, "Hi! I'm Visal. Let's learn together!"], [9.04, 15.05, "Unit six: Advanced Negotiation. Today you will highlight what matters most with cleft sentences."], [15.35, 17.86, "Here is our lesson map. Let's start!"], [18.8, 21.78, "Part one: words. You will learn ten new words."], [22.62, 23.7, "Leverage."], [24.68, 28.51, "Leverage means an advantage that gives you power to influence an outcome."], [29.12, 32.54, "Exclusive data gave the start-up considerable leverage."], [33.15, 35.49, "Your turn. Say: Leverage."], [38.33, 39.37, "Leverage."], [40.12, 41.22, "Compromise."], [42.22, 45.49, "Compromise means an agreement reached by mutual concession."], [46.08, 49.36, "The final compromise satisfied neither side completely."], [49.95, 52.59, "Your turn. Say: Compromise."], [55.43, 56.46, "Compromise."], [57.22, 58.08, "Win-win."], [59.08, 62.14, "Win-win means beneficial to all parties involved."], [62.75, 65.78, "Skilled negotiators look for win-win outcomes."], [66.38, 68.65, "Your turn. Say: Win-win."], [71.5, 72.76, "Win-win."], [73.52, 74.55, "Mediation."], [75.55, 79.26, "Mediation means intervention by a neutral party to resolve a dispute."], [79.85, 82.72, "Mediation succeeded where direct talks had failed."], [83.32, 85.91, "Your turn. Say: Mediation."], [88.77, 89.88, "Mediation."], [90.65, 91.95, "Bargaining power."], [92.95, 97.63, "Bargaining power means the relative ability of each side to influence terms."], [98.22, 100.51, "Unions increase workers' bargaining power."], [101.12, 103.79, "Your turn. Say: Bargaining power."], [106.63, 108.13, "Bargaining power."], [108.88, 109.86, "Concession."], [110.85, 114.55, "Concession means something granted to the other side to reach agreement."], [115.15, 117.74, "Neither party was willing to make the first concession."], [118.35, 120.92, "Your turn. Say: Concession."], [123.77, 124.85, "Concession."], [125.58, 126.64, "Strategic."], [127.65, 130.94, "Strategic means planned to achieve a long-term objective."], [131.55, 133.9, "Her silence was a strategic choice."], [134.48, 137.52, "Your turn. Say: Strategic."], [140.37, 141.29, "Strategic."], [142.05, 143.03, "Impasse."], [144.02, 147.4, "Impasse means a deadlock in which no progress is possible."], [147.98, 150.67, "Talks reached an impasse over working hours."], [151.28, 153.96, "Your turn. Say: Impasse."], [156.8, 157.95, "Impasse."], [158.72, 159.96, "Arbitration."], [160.95, 166.5, "Arbitration means settlement of a dispute by an impartial third party whose decision is binding."], [167.12, 170.52, "The contract requires arbitration in case of disagreement."], [171.12, 173.9, "Your turn. Say: Arbitration."], [176.73, 177.78, "Arbitration."], [178.52, 179.58, "Stalemate."], [180.58, 184.49, "Stalemate means a situation in which neither side can make progress."], [185.08, 187.75, "The dispute ended in a costly stalemate."], [188.35, 190.67, "Your turn. Say: Stalemate."], [193.5, 194.69, "Stalemate."], [195.5, 199.41, "Part two: dialogue. Let's listen to a conversation."], [200.25, 206.72, "Visal, your team negotiated the school's new partnership with the tech company. How did you secure such good terms?"], [207.82, 217.19, "It is leverage that determines negotiating power. We had something they wanted: access to three hundred enthusiastic student testers."], [218.28, 220.06, "Did the talks go smoothly?"], [221.15, 229.18, "Not at all. We reached an impasse over data privacy. What broke the deadlock was a strategic concession on the timeline."], [230.28, 232.43, "Was mediation ever considered?"], [233.55, 241.78, "Briefly. But it was the principal who suggested a compromise, and both sides accepted it as a genuine win-win."], [242.93, 244.41, "Part three: grammar."], [245.25, 247.82, "Grammar focus: Cleft sentences."], [248.12, 249.35, "Look at the pattern."], [250.05, 253.18, "It is leverage that determines negotiating power."], [254.08, 256.81, "What broke the deadlock was a strategic concession."], [257.72, 260.47, "It was the principal who suggested a compromise."], [261.43, 268.99, "Cleft sentences divide a message into two clauses to spotlight one element. Use 'who' for people and 'that' for things after 'It is / was …'."], [269.75, 273.9, "Be careful! Don't say: It was the principal which suggested it."], [275.87, 278.23, "Say: It was the principal who suggested it."], [278.53, 281.04, "Use 'who' for people in a cleft sentence."], [281.83, 284.31, "Part four: reading. Read and listen."], [285.1, 286.87, "Inside the Negotiating Room."], [287.17, 291.74, "Successful negotiation is rarely about who shouts loudest or concedes least."], [292.73, 298.75, "It is leverage that determines negotiating power, and leverage depends on what the other side needs."], [299.73, 305.31, "When talks reach an impasse, what often breaks the deadlock is a small but strategic concession."], [306.3, 312.99, "If direct talks fail, mediation offers a neutral perspective, while arbitration imposes a binding decision."], [314.0, 318.82, "The most durable agreements are win-win compromises in which neither party feels defeated."], [319.93, 324.02, "Part five: quiz. Five questions. Are you ready?"], [324.85, 327.75, "It was the principal blank suggested a compromise."], [328.06, 331.21, "A, which. B, what. C, who."], [334.77, 336.72, "The answer is C: who."], [337.88, 341.32, "Rewrite with emphasis: 'A concession broke the deadlock.'"], [341.62, 348.92, "A, What broke the deadlock was a concession.. B, What did break the deadlock a concession.. C, It a concession broke the deadlock.."], [352.47, 355.8, "The answer is A: What broke the deadlock was a concession.."], [356.95, 360.4, "Which process results in a binding decision by a third party?"], [360.7, 365.25, "A, mediation. B, arbitration. C, bargaining."], [368.8, 371.03, "The answer is B: arbitration."], [372.18, 374.9, "Talks that are completely blocked have reached an blank."], [375.2, 379.17, "A, impasse. B, leverage. C, concession."], [382.73, 384.76, "The answer is A: impasse."], [385.92, 388.72, "According to the reading, leverage depends on blank."], [389.02, 394.85, "A, how loudly you speak. B, what the other side needs. C, the number of concessions."], [398.4, 401.38, "The answer is B: what the other side needs."], [402.57, 405.39, "Part six: speaking. It's your turn to talk."], [406.25, 409.6, "What negotiation strategy do you find most effective?"], [426.38, 427.8, "Now listen to Visal."], [428.1, 460.5, "It is active listening that I find most effective in negotiation. When you understand what the other side truly needs, you can identify concessions that cost you little but matter greatly to them. For instance, in a group project I once accepted a later deadline in exchange for choosing our topic. Some people prefer an aggressive strategy, and it can work in one-off deals. However, in long-term relationships, a win-win approach builds trust and lasting results."], [460.8, 462.8, "Excellent answer, Visal!"], [463.68, 467.6, "Great work! Now you can use ten new words and cleft sentences."], [467.9, 472.24, "Today's value is fairness. Look for solutions that are fair to everyone."], [472.54, 474.96, "See you in Unit seven. Goodbye!"], [475.26, 477.97, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C1B1-Unit07-Formal-Logic": [[0.35, 5.01, "Hello, everyone! I'm Ms. Emma. Welcome to Online C one, Book one."], [5.31, 8.75, "Hi! I'm Visal. Let's learn together!"], [9.05, 14.67, "Unit seven: Formal Logic. Today you will construct and test arguments with conditional clauses."], [14.97, 17.77, "Here is our lesson map. Let's start!"], [18.73, 21.97, "Part one: words. You will learn eight new words."], [22.82, 23.67, "Premise."], [24.68, 28.73, "Premise means a statement assumed to be true from which a conclusion is drawn."], [29.32, 31.8, "The argument rests on a questionable premise."], [32.42, 35.38, "Your turn. Say: Premise."], [38.23, 39.09, "Premise."], [39.85, 40.93, "Syllogism."], [41.92, 46.32, "Syllogism means a form of reasoning with two premises and a conclusion."], [46.92, 50.67, "Aristotle formalised the syllogism over two thousand years ago."], [51.28, 53.46, "Your turn. Say: Syllogism."], [56.3, 57.19, "Syllogism."], [57.95, 58.93, "Validity."], [59.92, 64.24, "Validity means the property of an argument whose conclusion follows necessarily."], [64.85, 67.22, "Validity concerns form, not truth."], [67.82, 70.56, "Your turn. Say: Validity."], [73.4, 74.36, "Validity."], [75.12, 76.07, "Fallacy."], [77.08, 80.92, "Fallacy means an error in reasoning that renders an argument unsound."], [81.52, 83.97, "Circular reasoning is a common fallacy."], [84.58, 87.31, "Your turn. Say: Fallacy."], [90.17, 91.28, "Fallacy."], [92.05, 93.14, "Deduction."], [94.15, 98.27, "Deduction means reasoning from general principles to a specific conclusion."], [98.88, 101.3, "Mathematical proof relies on deduction."], [101.92, 104.59, "Your turn. Say: Deduction."], [107.43, 108.4, "Deduction."], [109.15, 110.22, "Induction."], [111.22, 115.28, "Induction means reasoning from specific observations to a general rule."], [115.88, 118.3, "Induction can never guarantee certainty."], [118.92, 121.57, "Your turn. Say: Induction."], [124.43, 125.48, "Induction."], [126.22, 127.38, "Inference."], [128.38, 132.4, "Inference means a conclusion reached on the basis of evidence and reasoning."], [133.02, 135.46, "The inference was plausible but untested."], [136.05, 138.45, "Your turn. Say: Inference."], [141.3, 142.39, "Inference."], [143.15, 144.12, "Soundness."], [145.12, 149.19, "Soundness means the quality of a valid argument whose premises are all true."], [149.78, 153.05, "Soundness requires both valid form and true premises."], [153.65, 156.07, "Your turn. Say: Soundness."], [158.93, 160.14, "Soundness."], [160.93, 164.47, "Part two: dialogue. Let's listen to a conversation."], [165.32, 172.78, "Visal, is the following argument valid? All fish can fly. A shark is a fish. Therefore, a shark can fly."], [173.88, 181.14, "Surprisingly, yes. If the premises are true, then the conclusion must follow. The form is perfectly valid."], [182.25, 184.03, "But sharks can't fly!"], [185.12, 191.87, "Exactly. The argument is valid but not sound, because the first premise is false."], [192.98, 195.35, "So how would you test an argument in an essay?"], [196.45, 205.96, "I ask two questions: if every premise were true, would the conclusion be unavoidable? And are the premises actually true?"], [207.1, 208.51, "Part three: grammar."], [209.35, 212.59, "Grammar focus: Conditional clauses (if and then)."], [212.89, 214.22, "Look at the pattern."], [214.92, 218.43, "If the premises are true, then the conclusion must follow."], [219.32, 222.77, "If one premise is false, then the argument cannot be sound."], [223.68, 227.56, "If the conclusion were false, then at least one premise would have to be false."], [228.5, 237.17, "In logic, 'if … then …' expresses necessity. Use 'must' for a certain conclusion, 'cannot' for an impossible one, and 'were … would' for hypothetical testing."], [237.92, 242.98, "Be careful! Don't say: If all premises are true, the conclusion must follows."], [244.93, 248.88, "Say: If all premises are true, the conclusion must follow."], [249.18, 251.17, "After 'must', use the base verb."], [251.97, 254.66, "Part four: reading. Read and listen."], [255.47, 257.36, "Valid Is Not the Same as True."], [257.66, 262.1, "Formal logic studies the structure of arguments rather than the truth of their content."], [263.1, 267.77, "An argument is valid when, if the premises are true, then the conclusion must follow."], [268.77, 274.81, "Consequently, an argument can be perfectly valid and yet reach an absurd conclusion from a false premise."], [275.8, 281.46, "Soundness is therefore stricter: it requires both valid form and premises that are actually true."], [282.47, 287.7, "Whereas deduction can guarantee its conclusions, induction can only make them more or less probable."], [288.8, 293.05, "Part five: quiz. Five questions. Are you ready?"], [293.88, 297.03, "If the premises are true, then the conclusion blank follow."], [297.33, 300.52, "A, must. B, should to. C, has."], [304.07, 305.56, "The answer is A: must."], [306.72, 312.07, "'All fish fly. Sharks are fish. So sharks fly.' This argument is blank."], [312.37, 317.62, "A, sound but invalid. B, valid but unsound. C, valid and sound."], [321.17, 323.97, "The answer is B: valid but unsound."], [325.12, 328.05, "Reasoning from observations to a general rule is blank."], [328.35, 332.1, "A, deduction. B, induction. C, syllogism."], [335.67, 337.63, "The answer is B: induction."], [338.78, 342.62, "If every premise blank true, would the conclusion be unavoidable?"], [342.92, 346.18, "A, were. B, is being. C, be."], [349.73, 351.22, "The answer is A: were."], [352.38, 355.57, "According to the reading, what can induction NOT do?"], [355.87, 361.61, "A, guarantee its conclusions. B, use observations. C, suggest probabilities."], [365.17, 368.35, "The answer is A: guarantee its conclusions."], [369.57, 372.54, "Part six: speaking. It's your turn to talk."], [373.38, 376.5, "What is the difference between a valid argument and a sound one?"], [393.28, 394.83, "Now listen to Visal."], [395.13, 425.1, "A valid argument is one in which, if the premises are true, then the conclusion must follow. A sound argument goes one step further, because its premises really are true. For example, 'all cats can swim, Tom is a cat, so Tom can swim' is valid, but it is not sound. Some students confuse validity with truth, which is understandable. However, in logic, validity only describes the structure of reasoning."], [425.4, 426.97, "Excellent answer, Visal!"], [427.88, 432.58, "Great work! Now you can use eight new words and conditional clauses (if and then)."], [432.88, 437.45, "Today's value is rigor. Check every step carefully before you trust a conclusion."], [437.75, 440.07, "See you in Unit eight. Goodbye!"], [440.37, 443.15, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C1B1-Unit08-Academic-Publishing": [[0.35, 5.03, "Hello, everyone! I'm Ms. Emma. Welcome to Online C one, Book one."], [5.33, 8.78, "Hi! I'm Visal. Let's learn together!"], [9.08, 15.6, "Unit eight: Academic Publishing. Today you will describe complex processes using the present passive."], [15.9, 18.73, "Here is our lesson map. Let's start!"], [19.67, 23.06, "Part one: words. You will learn eight new words."], [23.92, 24.94, "Manuscript."], [25.95, 29.35, "Manuscript means an author's text submitted for publication."], [29.95, 32.62, "The manuscript underwent three rounds of revision."], [33.22, 35.8, "Your turn. Say: Manuscript."], [38.63, 39.73, "Manuscript."], [40.48, 41.51, "Peer review."], [42.52, 46.72, "Peer review means assessment of a manuscript by independent experts."], [47.32, 49.18, "Peer review can take up to a year."], [49.78, 52.33, "Your turn. Say: Peer review."], [55.17, 56.25, "Peer review."], [56.98, 57.72, "Journal."], [58.72, 62.12, "Journal means a periodical publishing scholarly research."], [62.72, 64.91, "She published in a leading medical journal."], [65.52, 67.9, "Your turn. Say: Journal."], [70.77, 71.85, "Journal."], [72.58, 73.63, "Submission."], [74.62, 77.91, "Submission means the formal sending of work for evaluation."], [78.52, 81.42, "Online submission systems have sped up the process."], [82.02, 84.26, "Your turn. Say: Submission."], [87.1, 88.19, "Submission."], [88.95, 89.89, "Revision."], [90.88, 94.28, "Revision means an amended version addressing reviewers' comments."], [94.88, 96.88, "Major revisions were requested."], [97.48, 100.09, "Your turn. Say: Revision."], [102.93, 103.89, "Revision."], [104.65, 105.63, "Rejection."], [106.62, 109.27, "Rejection means a decision not to publish."], [109.85, 112.98, "Leading journals have rejection rates above ninety percent."], [113.58, 115.86, "Your turn. Say: Rejection."], [118.7, 119.79, "Rejection."], [120.55, 121.91, "Impact factor."], [122.92, 127.46, "Impact factor means a measure of how frequently a journal's articles are cited."], [128.05, 131.15, "Impact factor is a controversial measure of quality."], [131.75, 135.11, "Your turn. Say: Impact factor."], [137.97, 139.33, "Impact factor."], [140.08, 141.0, "Editor."], [142.02, 146.37, "Editor means the person who manages review and decides on publication."], [146.98, 149.38, "The editor overruled one reviewer's objection."], [149.98, 152.3, "Your turn. Say: Editor."], [155.13, 156.02, "Editor."], [156.83, 160.26, "Part two: dialogue. Let's listen to a conversation."], [161.12, 165.43, "Visal, you're interning at a journal this summer. What happens when a paper arrives?"], [166.52, 174.5, "First, it is screened by the editor. Many manuscripts are rejected at this stage for being out of scope."], [175.58, 177.64, "And if it passes the first screening?"], [178.75, 185.36, "The manuscript is reviewed by anonymous experts. Their comments are then forwarded to the author."], [186.45, 189.23, "How often are papers accepted without changes?"], [190.32, 199.28, "Almost never. Most are returned for revision, and some are resubmitted several times before a final decision is made."], [200.43, 201.89, "Part three: grammar."], [202.75, 206.19, "Grammar focus: Passive voice for process description."], [206.49, 207.65, "Look at the pattern."], [208.35, 211.32, "The manuscript is reviewed by anonymous experts."], [212.22, 214.36, "Comments are then forwarded to the author."], [215.25, 218.02, "Many papers are rejected at the screening stage."], [218.97, 228.22, "Describe a general process with the present simple passive. Sequencing adverbs such as 'then', 'subsequently' and 'finally' fit between 'is / are' and the participle."], [228.98, 233.53, "Be careful! Don't say: The manuscript is then review by experts."], [235.47, 239.2, "Say: The manuscript is then reviewed by experts."], [239.5, 241.66, "The passive needs the past participle."], [242.47, 244.88, "Part four: reading. Read and listen."], [245.67, 247.56, "The Long Road to Publication."], [247.86, 251.27, "Getting research into print is a slow and selective process."], [252.27, 257.62, "Once a manuscript is submitted, it is first screened by the editor for relevance and quality."], [258.63, 265.29, "If it passes, the manuscript is reviewed by anonymous experts who recommend acceptance, revision or rejection."], [266.3, 271.27, "Revised versions are subsequently re-examined, sometimes over several cycles."], [272.27, 278.58, "Although a journal's impact factor signals prestige, it is increasingly criticised as a crude measure of quality."], [279.7, 283.68, "Part five: quiz. Five questions. Are you ready?"], [284.52, 287.53, "The manuscript is blank by anonymous experts."], [287.83, 291.76, "A, reviewing. B, reviewed. C, review."], [295.3, 297.26, "The answer is B: reviewed."], [298.42, 300.5, "Comments blank forwarded to the author."], [300.8, 304.25, "A, are then. B, then are being. C, is then."], [307.8, 309.65, "The answer is A: are then."], [310.78, 314.57, "A measure of how often a journal's articles are cited is its blank."], [314.87, 319.3, "A, impact factor. B, submission rate. C, revision."], [322.87, 325.77, "The answer is A: impact factor."], [326.92, 328.87, "Which collocation is correct?"], [329.17, 336.18, "A, request major revisions. B, make major revisions requests. C, do major revisions."], [339.73, 342.65, "The answer is A: request major revisions."], [343.82, 347.13, "According to the reading, who screens a manuscript first?"], [347.43, 352.12, "A, anonymous reviewers. B, the editor. C, the author."], [355.67, 357.85, "The answer is B: the editor."], [359.07, 362.14, "Part six: speaking. It's your turn to talk."], [362.98, 366.48, "Why is peer review considered essential to academic publishing?"], [383.28, 385.09, "Now listen to Visal."], [385.39, 416.4, "Peer review is considered essential because research is examined by independent experts before it is made public. Flawed methods, weak statistics or exaggerated claims can be identified and corrected. For example, a reviewer may notice that a sample is too small to support the conclusion. That said, the system is slow, and reviewers sometimes disagree. Nevertheless, without it, readers would have far less reason to trust what they read."], [416.7, 418.38, "Excellent answer, Visal!"], [419.28, 424.21, "Great work! Now you can use eight new words and passive voice for process description."], [424.51, 429.88, "Today's value is intellectual rigor. Hold your ideas to the highest standard of evidence."], [430.18, 432.62, "See you in Unit nine. Goodbye!"], [432.92, 435.91, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C1B1-Unit09-Peer-Review-Process": [[0.35, 4.87, "Hello, everyone! I'm Ms. Emma. Welcome to Online C one, Book one."], [5.17, 8.77, "Hi! I'm Visal. Let's learn together!"], [9.07, 15.26, "Unit nine: Peer Review Process. Today you will write concisely with reduced relative clauses."], [15.56, 18.2, "Here is our lesson map. Let's start!"], [19.17, 22.21, "Part one: words. You will learn eight new words."], [23.05, 23.97, "Reviewer."], [24.98, 29.08, "Reviewer means an expert who evaluates a submission before publication."], [29.68, 33.51, "One reviewer recommended rejection; the other, minor revisions."], [34.12, 37.01, "Your turn. Say: Reviewer."], [39.87, 40.72, "Reviewer."], [41.48, 42.59, "Anonymity."], [43.58, 47.31, "Anonymity means the condition of having one's identity concealed."], [47.92, 51.43, "Anonymity allows junior scholars to criticise senior ones."], [52.02, 54.63, "Your turn. Say: Anonymity."], [57.5, 58.64, "Anonymity."], [59.38, 60.23, "Bias."], [61.25, 64.62, "Bias means a systematic tendency that distorts judgement."], [65.22, 68.84, "Reviewers may display bias towards prestigious institutions."], [69.45, 72.14, "Your turn. Say: Bias."], [75.0, 75.78, "Bias."], [76.52, 77.7, "Methodology."], [78.72, 82.34, "Methodology means the overall design and procedures of a study."], [82.95, 86.38, "The methodology adopted in the paper was unconventional."], [86.98, 89.73, "Your turn. Say: Methodology."], [92.57, 93.66, "Methodology."], [94.42, 95.22, "Critique."], [96.22, 101.11, "Critique means a reasoned evaluation identifying strengths and weaknesses."], [101.72, 105.18, "A constructive critique suggests remedies, not just flaws."], [105.78, 108.42, "Your turn. Say: Critique."], [111.27, 112.14, "Critique."], [112.88, 114.24, "Revision cycle."], [115.25, 119.31, "Revision cycle means one round of reviewer comments and author amendments."], [119.92, 122.6, "The paper went through three revision cycles in a year."], [123.22, 126.57, "Your turn. Say: Revision cycle."], [129.4, 130.81, "Revision cycle."], [131.55, 132.72, "Blind review."], [133.72, 137.07, "Blind review means review in which identities are concealed."], [137.68, 140.83, "In double-blind review, neither side knows the other."], [141.42, 144.2, "Your turn. Say: Blind review."], [147.03, 148.57, "Blind review."], [149.32, 150.48, "Integrity."], [151.48, 155.01, "Integrity means adherence to honest and ethical standards."], [155.62, 158.86, "Undisclosed conflicts of interest threaten integrity."], [159.45, 162.08, "Your turn. Say: Integrity."], [164.93, 166.19, "Integrity."], [167.0, 170.8, "Part two: dialogue. Let's listen to a conversation."], [171.65, 176.61, "Visal, you've just finished your first peer review for the student journal. What stood out?"], [177.72, 187.29, "Frankly, the methodology used in the study raised questions. The sample, drawn from a single class, was far too small."], [188.38, 190.28, "Did you recommend rejection?"], [191.38, 199.02, "No. I suggested major revisions, explaining how a sample taken from several schools would improve validity."], [200.12, 201.97, "Was it difficult to be critical?"], [203.05, 209.23, "A little. But the review being blind helped. I could focus on the arguments presented rather than on who wrote them."], [210.4, 211.83, "Part three: grammar."], [212.68, 215.58, "Grammar focus: Reduced relative clauses."], [215.88, 217.05, "Look at the pattern."], [217.75, 220.98, "The methodology used in the study raised questions."], [221.88, 225.06, "The sample, drawn from a single class, was too small."], [225.95, 228.95, "Reviewers
