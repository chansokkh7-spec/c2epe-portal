working anonymously tend to be more candid."], [229.9, 238.9, "Drop the relative pronoun and 'be': 'which was used' → 'used' (passive), 'who are working' → 'working' (active). This makes academic prose tighter."], [239.65, 244.32, "Be careful! Don't say: The method using in the study was flawed."], [246.27, 249.03, "Say: The method used in the study was flawed."], [249.33, 252.7, "A reduced passive clause uses the past participle."], [253.5, 256.16, "Part four: reading. Read and listen."], [256.97, 258.35, "Judged by Peers."], [258.65, 263.63, "Peer review rests on the assumption that experts can evaluate one another's work impartially."], [264.63, 270.56, "In practice, reviewers working under anonymity are expected to judge arguments rather than reputations."], [271.57, 278.74, "Typically, the methodology used in the study attracts the most scrutiny, since flawed methods invalidate any conclusion."], [279.73, 285.54, "Critics argue, however, that reviewers familiar with a field can often guess an author's identity."], [286.53, 291.12, "Despite such limitations, blind review remains the cornerstone of research integrity."], [292.23, 296.69, "Part five: quiz. Five questions. Are you ready?"], [297.55, 300.4, "The methodology blank in the study raised questions."], [300.7, 304.68, "A, using. B, used. C, was used."], [308.23, 310.28, "The answer is B: used."], [311.42, 315.02, "Reduce: 'Reviewers who work anonymously are more candid.'"], [315.32, 324.38, "A, Reviewers worked anonymously are more candid.. B, Reviewers working anonymously are more candid.. C, Reviewers who working anonymously are more candid.."], [327.93, 332.0, "The answer is B: Reviewers working anonymously are more candid.."], [333.15, 337.45, "When neither author nor reviewer knows the other's identity, it is blank review."], [337.75, 341.29, "A, double-blind. B, open. C, single."], [344.83, 347.22, "The answer is A: double-blind."], [348.35, 352.02, "A blank critique suggests remedies, not just flaws."], [352.32, 356.64, "A, constructive. B, destructive. C, fallacious."], [360.2, 362.94, "The answer is A: constructive."], [364.08, 368.0, "According to the reading, what limitation of blind review do critics mention?"], [368.3, 374.67, "A, Reviewers can often guess the author.. B, It is too fast.. C, It ignores methodology.."], [378.23, 381.65, "The answer is A: Reviewers can often guess the author.."], [382.83, 386.14, "Part six: speaking. It's your turn to talk."], [386.98, 390.23, "What are the benefits and drawbacks of anonymous peer review?"], [407.02, 408.35, "Now listen to Visal."], [408.65, 442.93, "The main benefit of anonymous review is that work is judged on its merits, not on the reputation of the author. It also allows junior researchers to criticise senior colleagues without fear. For example, a weakness identified by a young reviewer might otherwise go unmentioned. On the other hand, anonymity can encourage harsh or careless comments, since reviewers are not accountable. On balance, I think anonymity is worth keeping, provided editors monitor the tone of reviews."], [443.23, 444.81, "Excellent answer, Visal!"], [445.72, 450.45, "Great work! Now you can use eight new words and reduced relative clauses."], [450.75, 455.2, "Today's value is fairness. Look for solutions that are fair to everyone."], [455.5, 457.93, "See you in Unit ten. Goodbye!"], [458.23, 461.02, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C1B1-Unit10-Citation-Ethics": [[0.35, 5.28, "Hello, everyone! I'm Ms. Emma. Welcome to Online C one, Book one."], [5.58, 9.3, "Hi! I'm Visal. Let's learn together!"], [9.6, 14.95, "Unit ten: Citation Ethics. Today you will use gerund phrases as sentence subjects."], [15.25, 17.89, "Here is our lesson map. Let's start!"], [18.83, 22.02, "Part one: words. You will learn eight new words."], [22.88, 23.84, "Plagiarism."], [24.85, 29.04, "Plagiarism means presenting another person's work or ideas as your own."], [29.65, 32.53, "Self-plagiarism is also considered misconduct."], [33.12, 35.95, "Your turn. Say: Plagiarism."], [38.8, 39.94, "Plagiarism."], [40.68, 41.86, "Attribution."], [42.85, 47.2, "Attribution means the act of crediting the originator of an idea or work."], [47.78, 50.82, "Correct attribution is required even for images."], [51.42, 54.01, "Your turn. Say: Attribution."], [56.87, 57.94, "Attribution."], [58.68, 60.3, "Intellectual property."], [61.28, 65.16, "Intellectual property means creations of the mind protected by law."], [65.75, 68.6, "Patents and copyright protect intellectual property."], [69.18, 72.21, "Your turn. Say: Intellectual property."], [75.07, 76.67, "Intellectual property."], [77.42, 78.45, "Paraphrase."], [79.45, 83.49, "Paraphrase means to restate an idea fully in your own words and structure."], [84.08, 87.2, "Merely swapping synonyms does not paraphrase a text."], [87.78, 90.76, "Your turn. Say: Paraphrase."], [93.6, 94.65, "Paraphrase."], [95.38, 96.51, "Integrity."], [97.52, 101.76, "Integrity means the quality of being honest and consistent in principles."], [102.35, 105.45, "Academic integrity underpins the value of a degree."], [106.05, 108.5, "Your turn. Say: Integrity."], [111.37, 112.41, "Integrity."], [113.15, 114.27, "Misconduct."], [115.28, 118.88, "Misconduct means unethical or improper professional behaviour."], [119.48, 122.59, "Fabricating data is the gravest form of misconduct."], [123.18, 125.73, "Your turn. Say: Misconduct."], [128.57, 129.81, "Misconduct."], [130.55, 131.49, "Source."], [132.48, 135.72, "Source means the origin of information used in research."], [136.32, 139.04, "Primary sources are preferred to secondary ones."], [139.65, 142.4, "Your turn. Say: Source."], [145.23, 146.33, "Source."], [147.08, 148.34, "Accountability."], [149.35, 153.96, "Accountability means the obligation to accept responsibility for one's actions."], [154.55, 157.0, "Clear authorship ensures accountability."], [157.62, 159.94, "Your turn. Say: Accountability."], [162.8, 163.99, "Accountability."], [164.8, 168.46, "Part two: dialogue. Let's listen to a conversation."], [169.32, 175.51, "Visal, a classmate told me that changing a few words means you don't need a citation. Is that true?"], [176.62, 185.13, "Not at all. Paraphrasing without attribution is still plagiarism, even if every single word is different."], [186.22, 189.45, "So why do universities treat it so seriously?"], [190.55, 199.09, "Because citing sources properly demonstrates academic integrity. Taking credit for others' ideas undermines the whole system."], [200.18, 203.26, "What practical advice would you give first-year students?"], [204.35, 211.95, "Recording every source while you read. Reconstructing references the night before a deadline is how mistakes happen."], [213.1, 214.75, "Part three: grammar."], [215.62, 218.12, "Grammar focus: Gerunds as subjects."], [218.41, 219.65, "Look at the pattern."], [220.35, 223.85, "Citing sources properly demonstrates academic integrity."], [224.75, 227.62, "Paraphrasing without attribution is still plagiarism."], [228.52, 231.77, "Reconstructing references at the last minute leads to errors."], [232.73, 241.26, "A gerund phrase can act as a noun subject. However long the phrase, the verb is singular: 'Citing sources properly demonstrates …', not 'demonstrate'."], [242.02, 246.54, "Be careful! Don't say: Cite sources properly demonstrate integrity."], [248.5, 252.07, "Say: Citing sources properly demonstrates integrity."], [252.37, 254.77, "A gerund subject takes a singular verb."], [255.57, 258.28, "Part four: reading. Read and listen."], [259.07, 260.47, "Credit Where It Is Due."], [260.77, 265.08, "Scholarship is a conversation in which every contribution must be acknowledged."], [266.1, 271.9, "Citing sources properly demonstrates academic integrity and allows readers to verify claims."], [272.9, 277.52, "Paraphrasing a text, however skilfully, does not remove the obligation of attribution."], [278.53, 283.67, "Treating plagiarism as a minor offence would devalue degrees and erode public trust in research."], [284.67, 290.59, "Ultimately, keeping meticulous records is the most reliable defence against accidental misconduct."], [291.7, 295.48, "Part five: quiz. Five questions. Are you ready?"], [296.32, 299.64, "blank sources properly demonstrates academic integrity."], [299.94, 303.7, "A, Cite. B, Cited. C, Citing."], [307.23, 309.07, "The answer is C: Citing."], [310.22, 313.33, "Paraphrasing without attribution blank still plagiarism."], [313.63, 316.34, "A, are. B, is. C, be."], [319.9, 321.53, "The answer is B: is."], [322.68, 326.44, "Restating an idea fully in your own words and structure is to blank it."], [326.74, 331.27, "A, paraphrase. B, plagiarise. C, attribute."], [334.83, 337.16, "The answer is A: paraphrase."], [338.32, 342.36, "Which is the gravest form of research misconduct, according to the examples?"], [342.66, 348.38, "A, fabricating data. B, using secondary sources. C, citing images."], [351.93, 354.51, "The answer is A: fabricating data."], [355.65, 358.93, "According to the reading, why must sources be cited?"], [359.23, 365.58, "A, so readers can verify claims. B, to make essays longer. C, to avoid paraphrasing."], [369.13, 372.2, "The answer is A: so readers can verify claims."], [373.4, 376.45, "Part six: speaking. It's your turn to talk."], [377.28, 381.12, "Why do universities take citation ethics so seriously?"], [397.92, 399.42, "Now listen to Visal."], [399.72, 434.17, "Universities take citation ethics seriously because academic knowledge depends on trust. Citing sources allows readers to check claims and gives credit to the people who did the original work. For instance, a degree would lose its value if students could simply copy others' ideas. Some students feel the rules are overly strict, especially for minor errors. Nevertheless, upholding integrity protects everyone, including honest students."], [434.46, 436.28, "Excellent answer, Visal!"], [437.18, 441.43, "Great work! Now you can use eight new words and gerunds as subjects."], [441.73, 446.53, "Today's value is integrity. Do the right thing, even when no one is watching."], [446.83, 449.44, "See you in Unit eleven. Goodbye!"], [449.74, 452.3, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C1B1-Unit11-Interdisciplinary-Studies": [[0.35, 5.16, "Hello, everyone! I'm Ms. Emma. Welcome to Online C one, Book one."], [5.46, 8.86, "Hi! I'm Visal. Let's learn together!"], [9.16, 16.59, "Unit eleven: Interdisciplinary Studies. Today you will describe dynamic processes with present participles as adjectives."], [16.89, 19.53, "Here is our lesson map. Let's start!"], [20.47, 23.65, "Part one: words. You will learn eight new words."], [24.52, 25.96, "Interdisciplinary."], [26.95, 31.92, "Interdisciplinary means combining methods and insights from several academic fields."], [32.52, 35.47, "Climate science is inherently interdisciplinary."], [36.08, 38.96, "Your turn. Say: Interdisciplinary."], [41.8, 43.2, "Interdisciplinary."], [43.95, 45.11, "Synthesis."], [46.12, 50.12, "Synthesis means the combination of distinct ideas into a coherent whole."], [50.72, 54.09, "The book offers a synthesis of psychology and economics."], [54.68, 57.31, "Your turn. Say: Synthesis."], [60.17, 61.45, "Synthesis."], [62.18, 63.51, "Cross-pollination."], [64.52, 68.94, "Cross-pollination means the mutual enrichment of fields through exchange of ideas."], [69.55, 73.86, "Cross-pollination between design and medicine produced new devices."], [74.45, 77.3, "Your turn. Say: Cross-pollination."], [80.13, 81.51, "Cross-pollination."], [82.25, 83.1, "Framework."], [84.12, 87.43, "Framework means a conceptual structure used to analyse a problem."], [88.02, 90.99, "Each discipline brings its own analytical framework."], [91.58, 93.82, "Your turn. Say: Framework."], [96.67, 97.75, "Framework."], [98.48, 99.37, "Boundary."], [100.38, 103.64, "Boundary means a dividing line between areas of knowledge."], [104.25, 107.63, "The most exciting research happens at disciplinary boundaries."], [108.22, 110.86, "Your turn. Say: Boundary."], [113.7, 114.69, "Boundary."], [115.45, 116.66, "Collaboration."], [117.65, 121.48, "Collaboration means joint work towards a shared intellectual goal."], [122.08, 125.42, "Effective collaboration requires a shared vocabulary."], [126.02, 128.81, "Your turn. Say: Collaboration."], [131.67, 132.87, "Collaboration."], [133.62, 134.64, "Holistic."], [135.65, 139.81, "Holistic means considering the whole system rather than isolated parts."], [140.42, 142.75, "Public health demands a holistic approach."], [143.35, 146.15, "Your turn. Say: Holistic."], [149.0, 150.0, "Holistic."], [150.75, 151.9, "Convergence."], [152.92, 156.53, "Convergence means the process of separate fields coming together."], [157.12, 161.14, "The convergence of biology and computing created bioinformatics."], [161.75, 164.8, "Your turn. Say: Convergence."], [167.63, 168.7, "Convergence."], [169.5, 173.01, "Part two: dialogue. Let's listen to a conversation."], [173.85, 179.39, "Visal, you've chosen 'urban heat' for your research project. Isn't that just a geography topic?"], [180.48, 190.65, "Not really. A converging field draws on economics, biology, and sociology, as well as geography."], [191.75, 194.03, "Why does it need so many disciplines?"], [195.12, 204.46, "Rising temperatures affect health, energy costs and inequality at once. No single framework captures that complexity."], [205.55, 208.29, "Isn't collaboration across fields difficult?"], [209.38, 217.31, "It can be. Competing definitions are a real obstacle, so the first task is agreeing on a shared vocabulary."], [218.47, 220.16, "Part three: grammar."], [221.02, 224.8, "Grammar focus: Present participle as adjective."], [225.1, 226.26, "Look at the pattern."], [226.95, 231.24, "A converging field draws on economics, biology, and sociology."], [232.15, 235.15, "Rising temperatures affect health and inequality."], [236.05, 239.76, "The emerging discipline of bioinformatics is growing rapidly."], [240.7, 253.0, "Present participles describe nouns in an active, ongoing process: a converging field, rising temperatures. Compare past participles, which describe a completed or passive state: a converged system."], [253.75, 258.55, "Be careful! Don't say: An emerged field links biology and data."], [260.5, 264.5, "Say: An emerging field links biology and data."], [264.8, 267.55, "Use the -ing participle for an ongoing process."], [268.37, 271.06, "Part four: reading. Read and listen."], [271.87, 273.72, "Beyond Disciplinary Walls."], [274.01, 279.15, "Universities have traditionally organised knowledge into separate, clearly bounded departments."], [280.13, 283.96, "Many pressing problems, however, refuse to respect such boundaries."], [284.97, 292.49, "A converging field draws on economics, biology, and sociology to explain phenomena that no single discipline can."], [293.5, 299.11, "This cross-pollination of frameworks tends to produce more holistic, and often more innovative, solutions."], [300.1, 305.52, "Yet genuine convergence demands patient collaboration and a willingness to question one's own assumptions."], [306.63, 310.43, "Part five: quiz. Five questions. Are you ready?"], [311.28, 315.51, "A blank field draws on economics, biology, and sociology."], [315.81, 319.67, "A, converged. B, converging. C, converge."], [323.23, 325.21, "The answer is B: converging."], [326.35, 328.95, "'Temperatures that are rising' can be shortened to blank."], [329.25, 334.24, "A, risen temperatures. B, rising temperatures. C, rise temperatures."], [337.8, 340.39, "The answer is B: rising temperatures."], [341.55, 345.0, "Considering the whole system rather than isolated parts is blank."], [345.3, 348.9, "A, holistic. B, bounded. C, fragmented."], [352.43, 354.51, "The answer is A: holistic."], [355.65, 358.79, "Which phrase describes a completed, passive state?"], [359.09, 364.85, "A, a developing theory. B, an established theory. C, an emerging theory."], [368.4, 371.11, "The answer is B: an established theory."], [372.25, 375.46, "According to the reading, what does genuine convergence demand?"], [375.76, 380.85, "A, patient collaboration. B, separate departments. C, a single framework."], [384.4, 387.21, "The answer is A: patient collaboration."], [388.4, 391.7, "Part six: speaking. It's your turn to talk."], [392.55, 396.45, "What is one advantage of studying a problem from multiple disciplines?"], [413.25, 414.63, "Now listen to Visal."], [414.93, 454.6, "One major advantage is that you see connections a single discipline would miss. Rising sea levels, for example, are not only an environmental issue but also an economic and social one. A team combining engineers, economists and sociologists can therefore design more realistic solutions. Admittedly, interdisciplinary work can be slow, because experts use different methods and terminology. Even so, for complex modern problems, I believe the benefits clearly outweigh the costs."], [454.89, 456.63, "Excellent answer, Visal!"], [457.52, 462.06, "Great work! Now you can use eight new words and present participle as adjective."], [462.36, 467.35, "Today's value is open-mindedness. Listen to new ideas before you judge them."], [467.65, 470.29, "See you in Unit twelve. Goodbye!"], [470.59, 473.29, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C1B1-Unit12-Critical-Thinking-Frameworks": [[0.35, 4.99, "Hello, everyone! I'm Ms. Emma. Welcome to Online C one, Book one."], [5.29, 8.93, "Hi! I'm Visal. Let's learn together!"], [9.23, 15.45, "Unit twelve: Critical Thinking Frameworks. Today you will express degrees of possibility with modal verbs."], [15.75, 18.17, "Here is our lesson map. Let's start!"], [19.13, 22.77, "Part one: words. You will learn eight new words."], [23.62, 24.89, "Critical thinking."], [25.88, 30.32, "Critical thinking means the disciplined analysis and evaluation of information."], [30.92, 33.86, "Critical thinking is a defence against misinformation."], [34.45, 37.36, "Your turn. Say: Critical thinking."], [40.2, 41.52, "Critical thinking."], [42.25, 43.27, "Assumption."], [44.28, 47.72, "Assumption means a belief accepted as true without proof."], [48.32, 52.31, "The model rests on a hidden assumption about human behaviour."], [52.92, 55.21, "Your turn. Say: Assumption."], [58.07, 59.11, "Assumption."], [59.85, 60.86, "Evidence."], [61.85, 65.31, "Evidence means information that supports or refutes a claim."], [65.92, 69.39, "Extraordinary claims require extraordinary evidence."], [69.98, 72.67, "Your turn. Say: Evidence."], [75.53, 76.69, "Evidence."], [77.45, 78.51, "Perspective."], [79.52, 82.56, "Perspective means a particular way of viewing an issue."], [83.15, 86.1, "Including rural perspectives changed the conclusion."], [86.72, 89.59, "Your turn. Say: Perspective."], [92.43, 93.52, "Perspective."], [94.25, 95.53, "Evaluation."], [96.52, 100.72, "Evaluation means a systematic judgement of quality or significance."], [101.32, 104.49, "Rigorous evaluation of sources takes practice."], [105.08, 107.93, "Your turn. Say: Evaluation."], [110.77, 112.06, "Evaluation."], [112.82, 113.69, "Bias."], [114.68, 118.15, "Bias means a tendency to favour certain conclusions unfairly."], [118.75, 122.13, "Confirmation bias leads us to ignore contrary evidence."], [122.72, 125.25, "Your turn. Say: Bias."], [128.1, 129.08, "Bias."], [129.82, 130.72, "Reasoning."], [131.72, 135.26, "Reasoning means the process of drawing conclusions logically."], [135.85, 138.85, "Her reasoning was sound, but her data was outdated."], [139.45, 142.03, "Your turn. Say: Reasoning."], [144.87, 145.78, "Reasoning."], [146.52, 147.4, "Framework."], [148.42, 152.69, "Framework means a structured set of steps or criteria for analysis."], [153.28, 156.28, "The framework asks four questions about every claim."], [156.88, 159.42, "Your turn. Say: Framework."], [162.27, 163.13, "Framework."], [163.93, 167.75, "Part two: dialogue. Let's listen to a conversation."], [168.58, 173.45, "Visal, your essay argues that homework should be banned. What evidence did you use?"], [174.55, 181.36, "Mostly my own experience. But I realise now that an unexamined assumption might weaken your argument."], [182.45, 184.23, "Which assumption, exactly?"], [185.32, 193.66, "That all students experience homework the same way. Students without a quiet place to study may suffer more, while others could benefit."], [194.75, 196.56, "So how will you revise the essay?"], [197.65, 207.23, "I'll apply a framework: identify assumptions, look for counter-evidence, and consider other perspectives. My conclusion may well change."], [208.4, 209.92, "Part three: grammar."], [210.78, 213.63, "Grammar focus: Modal verbs for possibility."], [213.93, 215.11, "Look at the pattern."], [215.82, 218.8, "An unexamined assumption might weaken your argument."], [219.72, 221.98, "Some students could benefit from homework."], [222.88, 224.8, "My conclusion may well change."], [225.77, 235.62, "Might, may and could express possibility, from less to more likely in context. Add 'well' ('may well') to signal a stronger possibility. All are followed by the bare infinitive."], [236.38, 240.85, "Be careful! Don't say: This assumption might to weaken the case."], [242.8, 245.3, "Say: This assumption might weaken the case."], [245.6, 247.92, "After 'might', use the bare infinitive."], [248.73, 251.33, "Part four: reading. Read and listen."], [252.13, 253.77, "Questioning Our Own Thinking."], [254.07, 260.57, "Critical thinking is often described as evaluating other people's arguments, yet its hardest task lies closer to home."], [261.57, 266.57, "An unexamined assumption might weaken your argument long before any opponent notices it."], [267.57, 273.22, "Confirmation bias, for instance, may lead us to accept evidence that flatters our existing beliefs."], [274.23, 280.57, "Structured frameworks counter this tendency by forcing us to search for disconfirming evidence and alternative perspectives."], [281.57, 287.47, "Applied consistently, such habits could transform not only our essays but also our decisions."], [288.57, 292.23, "Part five: quiz. Five questions. Are you ready?"], [293.08, 295.94, "An unexamined assumption might blank your argument."], [296.24, 299.66, "A, weakens. B, to weaken. C, weaken."], [303.2, 305.07, "The answer is C: weaken."], [306.22, 308.74, "Which expresses the strongest possibility?"], [309.04, 314.17, "A, It might change.. B, It may well change.. C, It could possibly change.."], [317.7, 320.37, "The answer is B: It may well change.."], [321.52, 325.57, "The tendency to favour evidence that supports your beliefs is blank bias."], [325.87, 330.22, "A, confirmation. B, sampling. C, selection."], [333.77, 335.8, "The answer is A: confirmation."], [336.95, 340.17, "A belief accepted as true without proof is an blank."], [340.47, 344.37, "A, evaluation. B, assumption. C, inference."], [347.9, 350.42, "The answer is B: assumption."], [351.58, 355.83, "According to the reading, where does critical thinking's hardest task lie?"], [356.13, 362.04, "A, in judging opponents. B, in examining our own thinking. C, in memorising frameworks."], [365.6, 368.47, "The answer is B: in examining our own thinking."], [369.67, 373.13, "Part six: speaking. It's your turn to talk."], [373.98, 376.89, "What assumption might you need to question in your own thinking?"], [393.68, 395.18, "Now listen to Visal."], [395.48, 428.05, "One assumption I might need to question is that hard work always leads to success. It is a motivating belief, but it may ignore factors such as family income or access to good teachers. For example, two equally hardworking students could achieve very different results in different schools. Of course, effort still matters enormously, so I would not abandon the belief entirely. Rather, I should hold it more carefully and recognise its limits."], [428.35, 430.06, "Excellent answer, Visal!"], [430.95, 435.6, "Great work! Now you can use eight new words and modal verbs for possibility."], [435.9, 440.52, "Today's value is self-awareness. Know your strengths and keep growing."], [440.82, 443.7, "See you in Unit thirteen. Goodbye!"], [444.0, 446.3, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C1B1-Unit13-Thesis-Development": [[0.35, 5.35, "Hello, everyone! I'm Ms. Emma. Welcome to Online C one, Book one."], [5.65, 9.12, "Hi! I'm Visal. Let's learn together!"], [9.42, 15.46, "Unit thirteen: Thesis Development. Today you will refine claims using comparative structures."], [15.76, 18.23, "Here is our lesson map. Let's start!"], [19.17, 22.68, "Part one: words. You will learn eight new words."], [23.52, 24.89, "Thesis statement."], [25.88, 31.27, "Thesis statement means a single sentence expressing the central, arguable claim of a text."], [31.88, 34.88, "A thesis statement should be debatable, not a fact."], [35.48, 38.11, "Your turn. Say: Thesis statement."], [40.97, 42.25, "Thesis statement."], [42.98, 43.93, "Argument."], [44.92, 48.51, "Argument means a connected series of claims supported by evidence."], [49.12, 52.22, "Each body paragraph advances the argument one step."], [52.82, 55.2, "Your turn. Say: Argument."], [58.07, 59.01, "Argument."], [59.75, 60.61, "Scope."], [61.62, 64.65, "Scope means the extent of the area a study deals with."], [65.25, 67.99, "Limiting the scope made the project manageable."], [68.58, 71.28, "Your turn. Say: Scope."], [74.13, 75.0, "Scope."], [75.75, 76.41, "Claim."], [77.42, 79.79, "Claim means an assertion that something is true."], [80.38, 83.07, "An unsupported claim weakens the whole essay."], [83.68, 85.8, "Your turn. Say: Claim."], [88.67, 89.45, "Claim."], [90.18, 91.49, "Counterargument."], [92.48, 96.21, "Counterargument means an opposing view that the writer must address."], [96.82, 100.2, "Addressing the counterargument shows intellectual honesty."], [100.78, 103.28, "Your turn. Say: Counterargument."], [106.13, 107.2, "Counterargument."], [107.95, 108.81, "Refinement."], [109.82, 114.28, "Refinement means an improvement achieved through small, precise changes."], [114.88, 117.23, "Several refinements sharpened the thesis."], [117.82, 120.24, "Your turn. Say: Refinement."], [123.1, 124.02, "Refinement."], [124.78, 125.85, "Focus."], [126.85, 129.58, "Focus means the central point of concentration."], [130.18, 132.59, "The essay lost focus in the second half."], [133.18, 136.23, "Your turn. Say: Focus."], [139.07, 140.16, "Focus."], [140.92, 142.1, "Originality."], [143.12, 147.04, "Originality means the quality of offering a new contribution."], [147.65, 151.36, "Originality does not require a revolutionary idea."], [151.95, 154.81, "Your turn. Say: Originality."], [157.67, 158.89, "Originality."], [159.7, 163.27, "Part two: dialogue. Let's listen to a conversation."], [164.12, 169.06, "Visal, your draft thesis is 'Social media affects teenagers.' What do you think of it now?"], [170.15, 177.59, "It's far too broad. A narrower thesis is often stronger than a broad one, and that statement is barely arguable."], [178.68, 180.16, "How have you refined it?"], [181.25, 191.53, "'Image-based platforms harm teenage girls' self-esteem more severely than text-based ones.' It's more specific and considerably more debatable."], [192.62, 195.2, "Isn't a narrower claim less important, though?"], [196.28, 202.28, "Not necessarily. The more precise the claim, the more convincingly I can support it."], [203.43, 205.15, "Part three: grammar."], [206.02, 208.66, "Grammar focus: Comparative structures."], [208.95, 210.05, "Look at the pattern."], [210.75, 213.96, "A narrower thesis is often stronger than a broad one."], [214.85, 219.38, "Image-based platforms harm self-esteem more severely than text-based ones."], [220.28, 223.93, "The more precise the claim, the more convincingly I can support it."], [224.87, 233.88, "Modify comparatives with far, considerably or slightly for precision. Use 'the + comparative …, the + comparative …' to show that two things change together."], [234.62, 238.6, "Be careful! Don't say: A narrower thesis is more stronger."], [240.57, 243.26, "Say: A narrower thesis is stronger."], [243.56, 245.62, "Never combine 'more' with an -er form."], [246.43, 248.95, "Part four: reading. Read and listen."], [249.73, 251.37, "From Topic to Thesis."], [251.67, 256.52, "Many students confuse a topic with a thesis, yet the two are fundamentally different."], [257.53, 263.05, "A topic names an area of interest, whereas a thesis makes a specific, arguable claim about it."], [264.07, 269.49, "A narrower thesis is often stronger than a broad one, because it can be supported in greater depth."], [270.5, 275.97, "The more directly a writer anticipates counterarguments, the more persuasive the final essay becomes."], [276.97, 282.68, "Through successive refinements, a vague idea gradually becomes a focused and original contribution."], [283.77, 287.7, "Part five: quiz. Five questions. Are you ready?"], [288.55, 291.86, "A narrower thesis is often stronger blank a broad one."], [292.16, 294.89, "A, that. B, then. C, than."], [298.43, 300.01, "The answer is C: than."], [301.15, 303.69, "The more precise the claim, blank I can support it."], [304.0, 309.3, "A, the more convincingly. B, more convincing. C, the most convincingly."], [312.83, 315.61, "The answer is A: the more convincingly."], [316.75, 318.83, "Which is the strongest thesis statement?"], [319.13, 328.9, "A, Social media affects teenagers.. B, Image-based apps harm girls' self-esteem most.. C, Social media is a topic many people discuss.."], [332.47, 336.53, "The answer is B: Image-based apps harm girls' self-esteem most.."], [337.68, 340.88, "Which modifier correctly intensifies a comparative?"], [341.18, 346.67, "A, very stronger. B, considerably stronger. C, too much stronger."], [350.2, 353.13, "The answer is B: considerably stronger."], [354.28, 358.72, "According to the reading, what is the difference between a topic and a thesis?"], [359.02, 366.08, "A, A thesis makes an arguable claim.. B, A topic is always longer.. C, There is no difference.."], [369.63, 373.08, "The answer is A: A thesis makes an arguable claim.."], [374.3, 377.3, "Part six: speaking. It's your turn to talk."], [378.15, 381.09, "What makes a thesis statement strong rather than weak?"], [397.88, 399.3, "Now listen to Visal."], [399.6, 435.04, "A strong thesis statement is far more specific than a weak one, and it makes a claim that a reasonable person could dispute. For example, 'online learning is good' is vague, whereas 'online learning benefits self-motivated students more than others' gives the essay a clear direction. A strong thesis also limits its scope realistically. Some writers fear that a narrow claim sounds less important. In fact, the more precise the thesis, the more convincingly it can be defended."], [435.34, 437.08, "Excellent answer, Visal!"], [437.98, 442.42, "Great work! Now you can use eight new words and comparative structures."], [442.72, 446.63, "Today's value is precision. Choose your words and numbers with care."], [446.93, 449.81, "See you in Unit fourteen. Goodbye!"], [450.11, 452.58, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C1B1-Unit14-Literature-Review-Methods": [[0.35, 5.21, "Hello, everyone! I'm Ms. Emma. Welcome to Online C one, Book one."], [5.51, 9.27, "Hi! I'm Visal. Let's learn together!"], [9.57, 16.86, "Unit fourteen: Literature Review Methods. Today you will state the purpose of research activities with 'in order to'."], [17.16, 19.62, "Here is our lesson map. Let's start!"], [20.57, 23.88, "Part one: words. You will learn eight new words."], [24.72, 25.98, "Literature review."], [26.98, 31.13, "Literature review means a critical survey of existing research on a topic."], [31.72, 34.73, "The literature review occupies a third of the dissertation."], [35.32, 38.24, "Your turn. Say: Literature review."], [41.1, 42.46, "Literature review."], [43.22, 44.53, "Synthesis."], [45.52, 49.42, "Synthesis means integrating findings to reveal patterns and debates."], [50.02, 53.38, "Synthesis distinguishes a review from an annotated list."], [53.98, 56.61, "Your turn. Say: Synthesis."], [59.47, 60.46, "Synthesis."], [61.22, 61.92, "Gap."], [62.92, 66.56, "Gap means an area that existing research has not adequately addressed."], [67.15, 70.33, "The study fills a gap in research on rural schools."], [70.95, 73.15, "Your turn. Say: Gap."], [76.0, 76.64, "Gap."], [77.38, 78.65, "Chronological."], [79.65, 83.11, "Chronological means arranged in the order in which events occurred."], [83.72, 86.91, "A chronological review traces how ideas evolved."], [87.52, 90.22, "Your turn. Say: Chronological."], [93.07, 94.4, "Chronological."], [95.15, 96.22, "Thematic."], [97.22, 100.22, "Thematic means organised around key themes or issues."], [100.82, 103.64, "A thematic structure highlights competing positions."], [104.25, 106.63, "Your turn. Say: Thematic."], [109.5, 110.58, "Thematic."], [111.32, 112.18, "Scope."], [113.18, 116.09, "Scope means the boundaries of what a review covers."], [116.68, 120.6, "The scope was restricted to studies published since 2015."], [121.18, 123.5, "Your turn. Say: Scope."], [126.33, 127.18, "Scope."], [127.95, 128.92, "Database."], [129.92, 134.1, "Database means a searchable electronic collection of academic sources."], [134.68, 137.7, "Specialist databases index peer-reviewed journals."], [138.32, 141.01, "Your turn. Say: Database."], [143.87, 144.8, "Database."], [145.55, 146.53, "Relevance."], [147.52, 151.06, "Relevance means the degree to which a source bears on the research question."], [151.65, 154.29, "Sources were screened for relevance and quality."], [154.88, 157.45, "Your turn. Say: Relevance."], [160.3, 161.34, "Relevance."], [162.13, 165.87, "Part two: dialogue. Let's listen to a conversation."], [166.72, 171.98, "Visal, your supervisor says your literature review reads like a shopping list. What does she mean?"], [173.08, 181.78, "I summarised each article separately. Researchers review prior work in order to identify a gap, not just to describe it."], [182.88, 184.42, "How will you restructure it?"], [185.52, 191.88, "Thematically, so as to show where studies agree and disagree. That makes the gap far more visible."], [192.98, 194.88, "And how did you find your sources?"], [195.98, 202.23, "I searched three databases in order to avoid relying on whatever a search engine ranked highest."], [203.37, 204.95, "Part three: grammar."], [205.78, 209.01, "Grammar focus: Purpose clauses (in order to)."], [209.31, 210.48, "Look at the pattern."], [211.18, 214.52, "Researchers review prior work in order to identify a gap."], [215.42, 219.48, "I organised the review thematically so as to show where studies disagree."], [220.38, 224.03, "Sources were screened in order not to include unreliable data."], [224.97, 233.22, "'In order to' and 'so as to' are formal ways of stating purpose. For a negative purpose, say 'in order not to' or 'so as not to', never 'in order to not'."], [233.95, 238.59, "Be careful! Don't say: We reviewed studies in order for identify a gap."], [240.53, 244.08, "Say: We reviewed studies in order to identify a gap."], [244.38, 246.42, "Use 'in order to' + base verb."], [247.23, 250.27, "Part four: reading. Read and listen."], [251.07, 252.45, "Standing on Shoulders."], [252.75, 257.99, "No research project begins from nothing; each builds on what others have already discovered."], [259.0, 264.26, "Researchers review prior work in order to identify a gap that their own study can address."], [265.27, 269.12, "An effective review is therefore a synthesis rather than a series of summaries."], [270.13, 276.08, "Some reviews are organised chronologically so as to trace the evolution of a debate, while others are thematic."], [277.07, 282.96, "Whichever structure is chosen, sources must be selected for relevance in order not to dilute the argument."], [284.07, 288.2, "Part five: quiz. Five questions. Are you ready?"], [289.05, 292.62, "Researchers review prior work in order blank identify a gap."], [292.92, 295.92, "A, for. B, to. C, that."], [299.47, 301.06, "The answer is B: to."], [302.22, 304.52, "Which negative purpose clause is correct?"], [304.82, 310.18, "A, in order to not include. B, in order not to include. C, in order not including."], [313.73, 316.24, "The answer is B: in order not to include."], [317.38, 320.95, "A review that traces how a debate evolved over time is blank."], [321.25, 325.24, "A, thematic. B, chronological. C, relevant."], [328.8, 331.14, "The answer is B: chronological."], [332.28, 336.05, "What distinguishes a literature review from a list of summaries?"], [336.35, 339.94, "A, synthesis. B, scope. C, length."], [343.5, 345.84, "The answer is A: synthesis."], [346.98, 351.06, "According to the reading, why must sources be selected for relevance?"], [351.36, 357.24, "A, so as not to dilute the argument. B, to make the review longer. C, to find a database."], [360.8, 363.75, "The answer is A: so as not to dilute the argument."], [364.97, 368.04, "Part six: speaking. It's your turn to talk."], [368.88, 371.96, "Why is identifying a 'gap' important in a literature review?"], [388.75, 390.18, "Now listen to Visal."], [390.48, 422.07, "Identifying a gap is important because it justifies the research: it shows why the study is needed. Researchers examine previous work in order to avoid simply repeating what is already known. For example, many studies have examined online learning in cities, but very few have looked at rural Cambodia. Some might argue that replicating existing studies is also valuable, and that is true. Nevertheless, a clear gap gives new research its originality and purpose."], [422.37, 423.88, "Excellent answer, Visal!"], [424.78, 429.32, "Great work! Now you can use eight new words and purpose clauses (in order to)."], [429.62, 433.62, "Today's value is thoroughness. Do the whole job, and do it well."], [433.92, 436.38, "See you in Unit fifteen. Goodbye!"], [436.68, 439.22, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C1B1-Unit15-Statistical-Reasoning": [[0.35, 4.97, "Hello, everyone! I'm Ms. Emma. Welcome to Online C one, Book one."], [5.27, 8.65, "Hi! I'm Visal. Let's learn together!"], [8.95, 16.2, "Unit fifteen: Statistical Reasoning. Today you will distinguish correlation from causation using precise clauses."], [16.5, 19.35, "Here is our lesson map. Let's start!"], [20.3, 23.75, "Part one: words. You will learn eight new words."], [24.62, 25.68, "Correlation."], [26.68, 30.57, "Correlation means a statistical association between two variables."], [31.18, 34.58, "A positive correlation means both variables rise together."], [35.18, 38.25, "Your turn. Say: Correlation."], [41.1, 42.23, "Correlation."], [42.98, 44.1, "Causation."], [45.12, 49.55, "Causation means a relationship in which one factor directly produces another."], [50.15, 53.26, "Establishing causation usually requires an experiment."], [53.85, 56.85, "Your turn. Say: Causation."], [59.7, 60.68, "Causation."], [61.42, 62.85, "Sample size."], [63.85, 67.27, "Sample size means the number of observations in a study."], [67.85, 70.93, "A larger sample size increases statistical power."], [71.52, 74.48, "Your turn. Say: Sample size."], [77.33, 78.75, "Sample size."], [79.52, 80.75, "Significance."], [81.75, 85.55, "Significance means the likelihood that a result is not due to chance."], [86.15, 89.79, "Statistical significance is not the same as practical importance."], [90.38, 93.29, "Your turn. Say: Significance."], [96.13, 97.41, "Significance."], [98.15, 99.1, "Variable."], [100.12, 102.91, "Variable means a measurable factor that can vary."], [103.52, 106.06, "Family income was a confounding variable."], [106.65, 109.4, "Your turn. Say: Variable."], [112.23, 113.34, "Variable."], [114.08, 115.06, "Outlier."], [116.05, 119.56, "Outlier means a data point that differs markedly from the rest."], [120.15, 122.57, "One outlier dramatically inflated the average."], [123.18, 125.49, "Your turn. Say: Outlier."], [128.33, 129.43, "Outlier."], [130.18, 131.37, "Distribution."], [132.38, 136.26, "Distribution means the pattern of how values are spread across a range."], [136.85, 139.42, "Income has a highly skewed distribution."], [140.02, 142.87, "Your turn. Say: Distribution."], [145.7, 146.79, "Distribution."], [147.55, 148.47, "Bias."], [149.48, 152.67, "Bias means a systematic error that distorts results."], [153.28, 156.1, "Online polls suffer from self-selection bias."], [156.68, 158.98, "Your turn. Say: Bias."], [161.83, 163.0, "Bias."], [163.8, 167.4, "Part two: dialogue. Let's listen to a conversation."], [168.25, 175.06, "Visal, a news site claims students who eat breakfast score higher, so breakfast boosts grades. Convinced?"], [176.15, 181.97, "Not yet. Just because two variables correlate does not mean one causes the other."], [183.08, 184.9, "What else could explain the pattern?"], [185.98, 195.25, "A confounding variable, such as family income. Wealthier families may provide both regular breakfasts and extra tutoring."], [196.35, 198.76, "How could researchers establish causation?"], [199.85, 207.84, "Through a randomised experiment with a large sample size. Only then can other explanations be ruled out."], [209.0, 210.55, "Part three: grammar."], [211.38, 215.76, "Grammar focus: Distinguishing correlation vs causation clauses."], [216.06, 217.26, "Look at the pattern."], [217.95, 221.87, "Just because two variables correlate does not mean one causes the other."], [222.75, 226.46, "The fact that the result is significant does not prove that it is important."], [227.35, 231.6, "Just because sales rose after the advert does not mean the advert caused the rise."], [232.57, 241.38, "'Just because X does not mean Y' is common in speech; 'The fact that X does not prove that Y' is more formal. Both warn against jumping from association to cause."], [242.15, 246.56, "Be careful! Don't say: Just because they correlate doesn't means causation."], [248.5, 251.56, "Say: Just because they correlate doesn't mean causation."], [251.86, 253.86, "After 'doesn't', use the base verb."], [254.67, 257.3, "Part four: reading. Read and listen."], [258.1, 259.54, "When Numbers Mislead."], [259.84, 263.68, "Statistics are powerful tools, but they are also easily misinterpreted."], [264.67, 268.43, "Just because two variables correlate does not mean one causes the other."], [269.43, 275.35, "A hidden confounding variable may drive both, creating an association that is entirely spurious."], [276.33, 283.24, "Likewise, a small sample size or a single extreme outlier can produce results that appear significant but fail to replicate."], [284.23, 289.3, "Rigorous researchers therefore treat every correlation as a question rather than an answer."], [290.4, 294.01, "Part five: quiz. Five questions. Are you ready?"], [294.85, 298.71, "Just because two variables correlate does not blank one causes the other."], [299.01, 302.12, "A, mean. B, means. C, meaning."], [305.67, 307.54, "The answer is A: mean."], [308.68, 313.51, "Breakfast and grades are both linked to family income. Income is a blank variable."], [313.81, 317.54, "A, confounding. B, dependent. C, significant."], [321.1, 323.27, "The answer is A: confounding."], [324.42, 327.08, "Which method is best for establishing causation?"], [327.38, 332.47, "A, a randomised experiment. B, an online poll. C, a single case."], [336.03, 338.85, "The answer is A: a randomised experiment."], [339.98, 343.85, "The fact that a result is significant does not prove blank it is important."], [344.15, 347.24, "A, what. B, that. C, which."], [350.8, 352.44, "The answer is B: that."], [353.58, 357.66, "According to the reading, how should researchers treat a correlation?"], [357.96, 362.22, "A, as proof. B, as a question. C, as an outlier."], [365.77, 368.14, "The answer is B: as a question."], [369.33, 372.57, "Part six: speaking. It's your turn to talk."], [373.42, 377.08, "Can you give an example of correlation being mistaken for causation?"], [393.88, 395.49, "Now listen to Visal."], [395.79, 426.64, "A well-known example is the correlation between ice cream sales and drowning incidents. Both rise during the summer, but just because they correlate does not mean ice cream causes drowning. The real explanation is a third variable: hot weather, which leads to more swimming and more ice cream. People make this mistake because a clear pattern feels like an explanation. That is why researchers rely on controlled experiments before claiming causation."], [426.94, 428.61, "Excellent answer, Visal!"], [429.52, 435.35, "Great work! Now you can use eight new words and distinguishing correlation vs causation clauses."], [435.65, 440.14, "Today's value is analytical rigor. Test the numbers before you believe the story."], [440.44, 443.24, "See you in Unit sixteen. Goodbye!"], [443.54, 445.81, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C1B1-Unit16-Qualitative-Research-Methods": [[0.35, 5.27, "Hello, everyone! I'm Ms. Emma. Welcome to Online C one, Book one."], [5.57, 9.1, "Hi! I'm Visal. Let's learn together!"], [9.39, 16.59, "Unit sixteen: Qualitative Research Methods. Today you will contrast approaches with 'compared to' and 'in contrast to'."], [16.89, 19.4, "Here is our lesson map. Let's start!"], [20.33, 23.62, "Part one: words. You will learn eight new words."], [24.48, 25.43, "Interview."], [26.42, 30.29, "Interview means a structured or open conversation used to gather data."], [30.88, 34.21, "Semi-structured interviews allow follow-up questions."], [34.82, 37.2, "Your turn. Say: Interview."], [40.07, 40.98, "Interview."], [41.72, 42.86, "Case study."], [43.85, 48.23, "Case study means an in-depth investigation of a single person, group or event."], [48.82, 51.97, "The case study examined one school over five years."], [52.55, 55.03, "Your turn. Say: Case study."], [57.87, 58.91, "Case study."], [59.65, 60.47, "Coding."], [61.45, 65.23, "Coding means labelling segments of qualitative data by concept."], [65.82, 68.61, "Coding revealed patterns invisible on a first reading."], [69.22, 71.85, "Your turn. Say: Coding."], [74.7, 75.6, "Coding."], [76.35, 76.98, "Theme."], [77.98, 80.89, "Theme means a recurring pattern of meaning across data."], [81.48, 83.88, "Isolation emerged as a dominant theme."], [84.48, 87.09, "Your turn. Say: Theme."], [89.93, 90.68, "Theme."], [91.42, 92.41, "Saturation."], [93.42, 97.54, "Saturation means the point at which further data yields no new insights."], [98.15, 101.01, "Interviews continued until saturation was reached."], [101.62, 104.62, "Your turn. Say: Saturation."], [107.47, 108.78, "Saturation."], [109.52, 110.77, "Triangulation."], [111.78, 116.33, "Triangulation means using multiple sources or methods to confirm findings."], [116.92, 120.11, "Triangulation with observation strengthened the conclusions."], [120.72, 123.74, "Your turn. Say: Triangulation."], [126.6, 127.82, "Triangulation."], [128.58, 129.44, "Narrative."], [130.45, 134.27, "Narrative means a participant's account of their experience."], [134.88, 137.35, "Each narrative revealed a different motivation."], [137.95, 140.44, "Your turn. Say: Narrative."], [143.3, 144.43, "Narrative."], [145.18, 146.31, "Context."], [147.32, 150.7, "Context means the circumstances that give meaning to behaviour."], [151.28, 154.5, "Findings must be interpreted in their cultural context."], [155.12, 158.53, "Your turn. Say: Context."], [161.4, 162.55, "Context."], [163.37, 167.12, "Part two: dialogue. Let's listen to a conversation."], [167.98, 172.84, "Visal, why did you choose interviews rather than a questionnaire for your study of migrant workers?"], [173.95, 181.93, "Compared to surveys, interviews reveal richer context. I wanted to understand why people leave, not just how many."], [183.02, 185.35, "How did you make sense of so much text?"], [186.45, 194.13, "Through coding. In contrast to statistical analysis, the themes emerged gradually from the data itself."], [195.22, 197.37, "How did you know when to stop interviewing?"], [198.48, 204.09, "When I reached saturation. By the fifteenth interview, no new themes were appearing."], [205.23, 206.54, "Part three: grammar."], [207.38, 210.86, "Grammar focus: Compared to and in contrast to."], [211.16, 212.29, "Look at the pattern."], [212.98, 216.47, "Compared to surveys, interviews reveal richer context."], [217.38, 221.96, "In contrast to statistical analysis, coding lets themes emerge gradually."], [222.85, 227.49, "Unlike large-scale studies, a case study prioritises depth over breadth."], [228.43, 237.01, "Place the contrast phrase first, followed by a comma. Make sure you compare like with like: 'Compared to surveys, interviews …', not 'Compared to surveys, I …'."], [237.75, 242.31, "Be careful! Don't say: In contrast of surveys, interviews go deeper."], [244.27, 247.38, "Say: In contrast to surveys, interviews go deeper."], [247.68, 249.56, "The phrase is 'in contrast to'."], [250.37, 253.02, "Part four: reading. Read and listen."], [253.83, 255.36, "The Why Behind the What."], [255.66, 260.18, "Qualitative research seeks to understand experiences, meanings and motivations."], [261.17, 267.59, "Compared to surveys, interviews reveal richer context, because participants can explain their reasoning in their own words."], [268.6, 273.49, "Researchers code transcripts so that recurring themes gradually emerge from the data."], [274.5, 280.53, "In contrast to statistical studies, samples are usually small, and generalisation is not the primary goal."], [281.53, 286.8, "Triangulation with observation or documents helps to confirm that interpretations are credible."], [287.9, 291.83, "Part five: quiz. Five questions. Are you ready?"], [292.68, 295.58, "blank to surveys, interviews reveal richer context."], [295.88, 299.26, "A, Compare. B, Compared. C, Comparing."], [302.8, 304.56, "The answer is B: Compared."], [305.72, 307.69, "Which sentence compares like with like?"], [307.99, 316.3, "A, Compared to surveys, I prefer interviews.. B, Compared to surveys, interviews are richer.. C, Compared to surveys, the researcher is richer.."], [319.87, 323.68, "The answer is B: Compared to surveys, interviews are richer.."], [324.82, 328.21, "The point at which new data yields no new insights is blank."], [328.51, 332.65, "A, triangulation. B, saturation. C, coding."], [336.2, 338.55, "The answer is B: saturation."], [339.68, 342.81, "Labelling segments of data by concept is called blank."], [343.11, 346.45, "A, coding. B, sampling. C, regression."], [350.0, 351.7, "The answer is A: coding."], [352.85, 356.83, "According to the reading, what is NOT the primary goal of qualitative research?"], [357.13, 362.27, "A, understanding meanings. B, generalisation. C, exploring motivation."], [365.83, 368.66, "The answer is B: generalisation."], [369.87, 373.15, "Part six: speaking. It's your turn to talk."], [373.98, 377.69, "What is one strength of qualitative research compared to quantitative?"], [394.48, 395.84, "Now listen to Visal."], [396.14, 431.24, "Compared to quantitative research, qualitative research is much better at explaining why people behave as they do. Numbers might show that many students drop out, but only interviews reveal the personal and cultural reasons behind those decisions. For instance, a student might leave school to support family members, which a survey could easily miss. The obvious limitation is that small samples are difficult to generalise. Even so, both approaches are complementary rather than competing."], [431.54, 433.23, "Excellent answer, Visal!"], [434.12, 438.78, "Great work! Now you can use eight new words and compared to and in contrast to."], [439.08, 444.09, "Today's value is depth of understanding. Look beneath the surface to understand people truly."], [444.39, 447.28, "See you in Unit seventeen. Goodbye!"], [447.58, 450.73, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C1B1-Unit17-Quantitative-Research-Methods": [[0.35, 5.15, "Hello, everyone! I'm Ms. Emma. Welcome to Online C one, Book one."], [5.45, 8.84, "Hi! I'm Visal. Let's learn together!"], [9.14, 16.68, "Unit seventeen: Quantitative Research Methods. Today you will report quantitative procedures with passive constructions."], [16.98, 19.56, "Here is our lesson map. Let's start!"], [20.5, 23.58, "Part one: words. You will learn eight new words."], [24.42, 25.81, "Hypothesis."], [26.82, 31.18, "Hypothesis means a testable prediction about the relationship between variables."], [31.78, 34.21, "The hypothesis was partially supported."], [34.82, 37.49, "Your turn. Say: Hypothesis."], [40.33, 41.64, "Hypothesis."], [42.38, 43.31, "Variable."], [44.32, 47.76, "Variable means a characteristic that can be measured numerically."], [48.35, 51.0, "The dependent variable was reading speed."], [51.58, 53.99, "Your turn. Say: Variable."], [56.83, 57.81, "Variable."], [58.55, 59.61, "Survey."], [60.62, 64.32, "Survey means a standardised questionnaire administered to a sample."], [64.92, 66.88, "The survey was administered online."], [67.48, 69.97, "Your turn. Say: Survey."], [72.83, 73.79, "Survey."], [74.55, 75.62, "Data set."], [76.62, 79.61, "Data set means a structured collection of related data."], [80.22, 82.96, "The national data set covers twenty years."], [83.55, 86.19, "Your turn. Say: Data set."], [89.03, 90.07, "Data set."], [90.82, 91.82, "Regression."], [92.82, 97.59, "Regression means a statistical method for modelling relationships between variables."], [98.18, 100.36, "Regression controlled for age and income."], [100.95, 103.44, "Your turn. Say: Regression."], [106.3, 107.44, "Regression."], [108.18, 109.43, "Reliability."], [110.42, 114.61, "Reliability means the consistency of a measure across repeated tests."], [115.22, 117.42, "Test-retest reliability was high."], [118.02, 121.19, "Your turn. Say: Reliability."], [124.03, 125.33, "Reliability."], [126.08, 127.07, "Validity."], [128.08, 132.96, "Validity means the accuracy with which a tool measures its intended concept."], [133.55, 136.2, "Validity was threatened by ambiguous questions."], [136.78, 139.05, "Your turn. Say: Validity."], [141.9, 143.01, "Validity."], [143.75, 145.28, "Generalizability."], [146.28, 150.18, "Generalizability means the extent to which findings apply beyond the sample."], [150.78, 154.03, "Generalizability is limited to urban schools."], [154.62, 157.73, "Your turn. Say: Generalizability."], [160.6, 162.11, "Generalizability."], [162.9, 166.38, "Part two: dialogue. Let's listen to a conversation."], [167.22, 171.05, "Visal, could you summarise the methods section of your quantitative study?"], [172.15, 179.69, "Certainly. The hypothesis was tested using a large data set from the national education survey."], [180.78, 182.93, "How were other factors accounted for?"], [184.05, 190.96, "A regression model was applied, so that age, income and school type were controlled for."], [192.05, 194.47, "And how confident are you in the results?"], [195.58, 205.91, "Reasonably. Reliability was confirmed by a retest, although generalizability is limited because only urban schools were included."], [207.07, 208.8, "Part three: grammar."], [209.65, 213.63, "Grammar focus: Passive constructions for methodology."], [213.94, 215.2, "Look at the pattern."], [215.92, 219.05, "The hypothesis was tested using a large data set."], [219.95, 222.76, "A regression model was applied to control for income."], [223.65, 226.18, "Reliability was confirmed by a retest."], [227.13, 236.33, "Use the past passive to report what was done. Phrasal-prepositional verbs keep their particles in the passive: 'income was controlled for', 'outliers were accounted for'."], [237.08, 241.93, "Be careful! Don't say: The hypothesis was tested use a data set."], [243.87, 247.85, "Say: The hypothesis was tested using a data set."], [248.15, 249.95, "Use 'using' to name the method."], [250.77, 253.38, "Part four: reading. Read and listen."], [254.2, 255.51, "Counting What Counts."], [255.81, 260.96, "Quantitative research aims to measure relationships precisely and test them objectively."], [261.97, 268.89, "In a typical study, the hypothesis was tested using a large data set and a pre-registered analysis plan."], [269.9, 274.2, "Regression models were applied so that confounding variables could be controlled for."], [275.2, 281.19, "Reliability concerns whether results are consistent, whereas validity concerns whether they are accurate."], [282.2, 287.75, "Even a reliable and valid study, however, may have limited generalizability beyond its sample."], [288.87, 293.24, "Part five: quiz. Five questions. Are you ready?"], [294.08, 297.22, "The hypothesis was blank using a large data set."], [297.52, 301.06, "A, tested. B, testing. C, test."], [304.6, 306.69, "The answer is A: tested."], [307.85, 310.06, "Age and income blank controlled for."], [310.36, 313.51, "A, was. B, were. C, been."], [317.07, 318.8, "The answer is B: were."], [319.95, 325.06, "A scale gives the same weight every time but it is wrong. It is reliable but not blank."], [325.36, 329.13, "A, consistent. B, valid. C, large."], [332.67, 334.72, "The answer is B: valid."], [335.88, 338.81, "Which passive sentence keeps the particle correctly?"], [339.11, 345.49, "A, Outliers were accounted.. B, Outliers were accounted for.. C, Outliers were for accounted.."], [349.03, 352.24, "The answer is B: Outliers were accounted for.."], [353.38, 357.51, "According to the reading, what may limit even a reliable and valid study?"], [357.81, 362.59, "A, generalizability. B, regression. C, pre-registration."], [366.13, 368.78, "The answer is A: generalizability."], [369.97, 373.41, "Part six: speaking. It's your turn to talk."], [374.25, 377.89, "What is the difference between reliability and validity in research?"], [394.68, 396.19, "Now listen to Visal."], [396.5, 431.78, "Reliability refers to consistency: if a test is repeated under the same conditions, the same results should be obtained. Validity, by contrast, refers to accuracy, meaning whether the test actually measures what it was designed to measure. For example, a bathroom scale that always shows two kilos too much is reliable but not valid. Some people treat the two terms as synonyms, which causes confusion. In fact, good research requires both."], [432.08, 433.99, "Excellent answer, Visal!"], [434.88, 440.04, "Great work! Now you can use eight new words and passive constructions for methodology."], [440.34, 444.26, "Today's value is precision. Choose your words and numbers with care."], [444.56, 447.33, "See you in Unit eighteen. Goodbye!"], [447.63, 450.49, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C1B1-Unit18-Academic-Conferences": [[0.35, 5.09, "Hello, everyone! I'm Ms. Emma. Welcome to Online C one, Book one."], [5.39, 8.87, "Hi! I'm Visal. Let's learn together!"], [9.17, 15.52, "Unit eighteen: Academic Conferences. Today you will structure accounts with sequencing language."], [15.82, 18.52, "Here is our lesson map. Let's start!"], [19.47, 22.75, "Part one: words. You will learn eight new words."], [23.58, 24.61, "Conference."], [25.62, 29.8, "Conference means a formal gathering where researchers present and discuss work."], [30.38, 33.42, "The conference attracted delegates from forty countries."], [34.02, 36.59, "Your turn. Say: Conference."], [39.43, 40.52, "Conference."], [41.25, 42.15, "Keynote."], [43.15, 46.46, "Keynote means the principal address that sets the theme of an event."], [47.05, 49.87, "The keynote challenged conventional thinking on AI."], [50.48, 52.91, "Your turn. Say: Keynote."], [55.77, 56.67, "Keynote."], [57.42, 58.12, "Panel."], [59.12, 62.93, "Panel means a group of experts discussing a topic before an audience."], [63.52, 66.11, "The panel debated the ethics of data collection."], [66.72, 69.1, "Your turn. Say: Panel."], [71.97, 72.63, "Panel."], [73.38, 74.59, "Poster session."], [75.58, 80.53, "Poster session means an event where research is displayed visually and discussed informally."], [81.12, 84.64, "Early-career researchers often begin at poster sessions."], [85.25, 88.03, "Your turn. Say: Poster session."], [90.87, 92.15, "Poster session."], [92.88, 93.92, "Networking."], [94.92, 98.92, "Networking means building professional relationships for mutual benefit."], [99.52, 102.29, "Networking during breaks led to a joint grant."], [102.88, 105.63, "Your turn. Say: Networking."], [108.47, 109.54, "Networking."], [110.28, 111.4, "Proceedings."], [112.42, 116.46, "Proceedings means the published collection of papers presented at a conference."], [117.05, 119.36, "Selected papers appear in the proceedings."], [119.95, 123.0, "Your turn. Say: Proceedings."], [125.83, 126.89, "Proceedings."], [127.65, 128.67, "Abstract."], [129.68, 134.11, "Abstract means a concise summary of a paper, submitted for selection."], [134.72, 137.6, "Only thirty percent of abstracts were accepted."], [138.18, 140.77, "Your turn. Say: Abstract."], [143.6, 144.72, "Abstract."], [145.48, 146.6, "Discussant."], [147.62, 151.6, "Discussant means a scholar assigned to comment critically on presented papers."], [152.22, 154.92, "The discussant identified a flaw in the sampling."], [155.52, 158.24, "Your turn. Say: Discussant."], [161.1, 162.24, "Discussant."], [163.03, 166.23, "Part two: dialogue. Let's listen to a conversation."], [167.08, 172.1, "Visal, you presented at the regional youth research conference. Talk me through the day."], [173.22, 180.85, "First the keynote, then panels, finally a poster session. The keynote on climate migration set the tone brilliantly."], [181.95, 184.01, "How did your own presentation go?"], [185.12, 195.25, "Initially I was nervous. Then the discussant asked a challenging question about my sample, which actually improved the discussion."], [196.35, 198.23, "What was the most valuable part?"], [199.35, 205.72, "Ultimately, the networking. I met two students who want to replicate my study in their provinces."], [206.87, 208.43, "Part three: grammar."], [209.28, 212.99, "Grammar focus: Sequencing language (first, then, finally)."], [213.29, 214.55, "Look at the pattern."], [215.25, 218.71, "First the keynote, then panels, finally a poster session."], [219.62, 224.03, "Initially I was nervous. Subsequently, the discussion improved."], [224.95, 230.51, "First, abstracts are submitted; then they are reviewed; finally, speakers are selected."], [231.47, 242.17, "'First, then, finally' order steps. More formal alternatives are 'initially, subsequently, ultimately'. Note: 'finally' marks the last item, while 'at last' expresses relief after waiting."], [242.92, 246.96, "Be careful! Don't say: Firstly the keynote, after the panels."], [248.9, 251.27, "Say: First the keynote, then the panels."], [251.57, 253.44, "Use 'then' to show the next step."], [254.23, 256.83, "Part four: reading. Read and listen."], [257.63, 260.0, "Inside an Academic Conference."], [260.3, 266.07, "Academic conferences remain central to scholarly life, despite the growth of online communication."], [267.07, 274.16, "A typical programme follows a familiar rhythm: first the keynote, then panels, finally a poster session."], [275.17, 281.22, "Initially, presenters summarise their work; subsequently, a discussant offers critical commentary."], [282.23, 286.77, "Arguably, the most productive exchanges occur informally, during networking breaks."], [287.77, 292.59, "Ultimately, many conference papers are revised and published in the proceedings."], [293.7, 298.46, "Part five: quiz. Five questions. Are you ready?"], [299.32, 302.95, "First the keynote, blank panels, finally a poster session."], [303.25, 305.88, "A, than. B, then. C, after."], [309.43, 311.1, "The answer is B: then."], [312.25, 314.59, "Which set is the most formal sequence?"], [314.89, 321.57, "A, first, next, last. B, initially, subsequently, ultimately. C, at first, after, at last."], [325.13, 328.79, "The answer is B: initially, subsequently, ultimately."], [329.95, 333.61, "The scholar who comments critically on presented papers is the blank."], [333.91, 337.59, "A, keynote. B, discussant. C, delegate."], [341.13, 343.56, "The answer is B: discussant."], [344.72, 349.25, "'We waited three hours; blank the speaker arrived.' (expressing relief)"], [349.55, 353.39, "A, at last. B, finally. C, ultimately."], [356.93, 358.99, "The answer is A: at last."], [360.15, 364.32, "According to the reading, where do the most productive exchanges often occur?"], [364.62, 369.63, "A, during keynotes. B, during networking breaks. C, in the proceedings."], [373.17, 376.19, "The answer is B: during networking breaks."], [377.4, 380.84, "Part six: speaking. It's your turn to talk."], [381.68, 385.73, "What do you think is the value of attending an academic conference in person?"], [402.52, 403.82, "Now listen to Visal."], [404.12, 440.2, "In my view, attending in person offers something online events cannot replicate. First, you hear the latest research before it is published. Then, you can ask questions and receive immediate feedback on your own work. Finally, and perhaps most importantly, informal conversations often lead to future collaborations. Admittedly, travel is expensive and not environmentally friendly, so hybrid events have real advantages. Nevertheless, the personal connections made in person are hard to replace."], [440.5, 442.31, "Excellent answer, Visal!"], [443.22, 448.23, "Great work! Now you can use eight new words and sequencing language (first, then, finally)."], [448.53, 452.13, "Today's value is community. Help the people in your town."], [452.43, 455.07, "See you in Unit nineteen. Goodbye!"], [455.37, 457.97, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C1B1-Unit19-Scholarly-Collaboration": [[0.35, 5.28, "Hello, everyone! I'm Ms. Emma. Welcome to Online C one, Book one."], [5.58, 9.25, "Hi! I'm Visal. Let's learn together!"], [9.55, 15.97, "Unit nineteen: Scholarly Collaboration. Today you will attribute responsibility with the passive and a by-agent."], [16.27, 18.78, "Here is our lesson map. Let's start!"], [19.73, 23.29, "Part one: words. You will learn eight new words."], [24.15, 25.39, "Co-authorship."], [26.38, 29.68, "Co-authorship means shared authorship of a publication."], [30.28, 33.62, "Co-authorship should reflect a substantial contribution."], [34.22, 37.34, "Your turn. Say: Co-authorship."], [40.2, 42.18, "Co-authorship."], [42.92, 44.17, "Collaboration."], [45.18, 48.87, "Collaboration means cooperative work towards a shared research goal."], [49.45, 52.47, "International collaboration accelerates discovery."], [53.08, 55.69, "Your turn. Say: Collaboration."], [58.53, 59.74, "Collaboration."], [60.48, 61.62, "Contribution."], [62.62, 66.4, "Contribution means the specific input each person makes to a project."], [67.02, 69.96, "Contribution statements list each author's role."], [70.55, 73.42, "Your turn. Say: Contribution."], [76.27, 77.52, "Contribution."], [78.28, 79.48, "Consensus."], [80.48, 83.64, "Consensus means general agreement among all members."], [84.25, 87.05, "Authorship order was decided by consensus."], [87.65, 90.43, "Your turn. Say: Consensus."], [93.27, 94.37, "Consensus."], [95.12, 96.38, "Division of labor."], [97.38, 101.53, "Division of labor means the allocation of tasks according to skills."], [102.12, 104.92, "A clear division of labor prevented duplication."], [105.52, 108.38, "Your turn. Say: Division of labor."], [111.23, 112.83, "Division of labor."], [113.58, 114.33, "Credit."], [115.32, 117.98, "Credit means public acknowledgement of someone's work."], [118.58, 121.69, "Junior researchers often receive too little credit."], [122.28, 124.92, "Your turn. Say: Credit."], [127.77, 128.64, "Credit."], [129.38, 130.41, "Partnership."], [131.42, 136.55, "Partnership means a cooperative relationship between institutions or individuals."], [137.15, 140.57, "The partnership linked universities in Cambodia and Japan."], [141.15, 143.86, "Your turn. Say: Partnership."], [146.7, 147.72, "Partnership."], [148.48, 149.4, "Synergy."], [150.42, 154.22, "Synergy means combined effort producing more than the sum of its parts."], [154.82, 157.52, "The synergy between the two labs was remarkable."], [158.12, 160.5, "Your turn. Say: Synergy."], [163.37, 164.46, "Synergy."], [165.27, 168.89, "Part two: dialogue. Let's listen to a conversation."], [169.75, 174.46, "Visal, your team's report lists five authors. How was the order decided?"], [175.55, 182.65, "Credit should be divided fairly by all contributors, so we agreed on criteria before writing a single word."], [183.75, 185.28, "What were the criteria?"], [186.38, 194.25, "The research design was proposed by Dara, and most of the analysis was carried out by me, so we shared first authorship."], [195.35, 197.04, "Were there any disagreements?"], [198.15, 205.82, "One. It was resolved by our supervisor, who reminded us that collecting data is as valuable as writing."], [206.97, 208.69, "Part three: grammar."], [209.55, 212.45, "Grammar focus: Passive with by-agent."], [212.75, 213.85, "Look at the pattern."], [214.55, 217.57, "Credit should be divided fairly by all contributors."], [218.48, 221.07, "The research design was proposed by Dara."], [221.98, 224.56, "The disagreement was resolved by our supervisor."], [225.5, 234.96, "Include the by-agent only when the agent is important or new information. In collaboration, naming who did what is essential, so the by-agent is often needed."], [235.72, 239.82, "Be careful! Don't say: The data was collected from Dara."], [241.77, 244.65, "Say: The data was collected by Dara."], [244.95, 246.95, "Use 'by' to introduce the agent."], [247.73, 250.36, "Part four: reading. Read and listen."], [251.17, 253.01, "Sharing the Work, Sharing the Credit."], [253.31, 257.6, "Modern research is increasingly conducted by large, international teams."], [258.6, 264.85, "In such projects, credit should be divided fairly by all contributors, ideally before the work begins."], [265.83, 271.4, "Many journals now require contribution statements, in which each author's role is described explicitly."], [272.4, 277.12, "Disputes are frequently caused by unspoken assumptions about who deserves recognition."], [278.1, 284.22, "When tasks are allocated transparently, collaboration produces genuine synergy rather than resentment."], [285.33, 289.66, "Part five: quiz. Five questions. Are you ready?"], [290.52, 293.57, "Credit should be divided fairly blank all contributors."], [293.87, 296.82, "A, from. B, by. C, with."], [300.37, 302.25, "The answer is B: by."], [303.42, 305.16, "The analysis blank by me."], [305.46, 309.86, "A, was carried out. B, carried out. C, was carrying out."], [313.4, 315.68, "The answer is A: was carried out."], [316.82, 319.2, "General agreement among all members is blank."], [319.5, 323.57, "A, synergy. B, consensus. C, credit."], [327.13, 329.73, "The answer is B: consensus."], [330.88, 332.73, "When should the by-agent be included?"], [333.03, 338.57, "A, always. B, when the agent is important. C, never in academic writing."], [342.1, 344.9, "The answer is B: when the agent is important."], [346.05, 349.33, "According to the reading, what often causes authorship disputes?"], [349.63, 356.11, "A, unspoken assumptions. B, contribution statements. C, large teams."], [359.67, 362.51, "The answer is A: unspoken assumptions."], [363.7, 366.93, "Part six: speaking. It's your turn to talk."], [367.78, 370.95, "How should credit be divided fairly among co-authors?"], [387.75, 389.44, "Now listen to Visal."], [389.74, 423.45, "I believe credit should be agreed on by the whole team before the project begins, not after. Each person's contribution should be described explicitly, for example who designed the study, who collected the data and who wrote the paper. This prevents the common situation in which junior researchers are overlooked. Some argue that the senior researcher should always be listed first, since they secured the funding. However, I think authorship should reflect actual work rather than status."], [423.75, 425.38, "Excellent answer, Visal!"], [426.28, 430.54, "Great work! Now you can use eight new words and passive with by-agent."], [430.84, 435.41, "Today's value is fairness. Look for solutions that are fair to everyone."], [435.71, 438.52, "See you in Unit twenty. Goodbye!"], [438.82, 441.95, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C1B1-Unit20-Academic-Integrity": [[0.35, 5.12, "Hello, everyone! I'm Ms. Emma. Welcome to Online C one, Book one."], [5.42, 9.05, "Hi! I'm Visal. Let's learn together!"], [9.35, 15.03, "Unit twenty: Academic Integrity. Today you will draw sharp contrasts with 'whereas'."], [15.33, 17.76, "Here is our lesson map. Let's start!"], [18.7, 21.76, "Part one: words. You will learn eight new words."], [22.62, 23.69, "Integrity."], [24.68, 28.92, "Integrity means consistent adherence to honest and ethical principles."], [29.52, 32.62, "Integrity is tested most when no one is watching."], [33.22, 35.82, "Your turn. Say: Integrity."], [38.67, 39.75, "Integrity."], [40.48, 41.44, "Plagiarism."], [42.45, 45.55, "Plagiarism means passing off another's work as one's own."], [46.15, 49.21, "AI tools have created new forms of plagiarism."], [49.82, 52.52, "Your turn. Say: Plagiarism."], [55.37, 56.38, "Plagiarism."], [57.12, 58.34, "Attribution."], [59.35, 62.94, "Attribution means acknowledging the source of an idea or text."], [63.55, 66.69, "Attribution is required for data as well as words."], [67.28, 69.88, "Your turn. Say: Attribution."], [72.73, 73.9, "Attribution."], [74.65, 75.76, "Paraphrase."], [76.75, 81.12, "Paraphrase means a restatement of a text in entirely new words and structure."], [81.72, 84.6, "An accurate paraphrase still needs a citation."], [85.18, 88.02, "Your turn. Say: Paraphrase."], [90.87, 92.24, "Paraphrase."], [92.98, 93.95, "Honesty."], [94.95, 97.84, "Honesty means truthfulness in word and action."], [98.45, 101.26, "Honesty about limitations strengthens a paper."], [101.85, 104.35, "Your turn. Say: Honesty."], [107.2, 108.13, "Honesty."], [108.88, 110.02, "Misconduct."], [111.02, 115.05, "Misconduct means a serious breach of professional or ethical standards."], [115.65, 118.81, "Data fabrication constitutes research misconduct."], [119.42, 121.74, "Your turn. Say: Misconduct."], [124.6, 125.92, "Misconduct."], [126.65, 127.93, "Originality."], [128.92, 132.99, "Originality means the quality of being newly created by oneself."], [133.58, 136.56, "Software now checks submissions for originality."], [137.15, 140.24, "Your turn. Say: Originality."], [143.1, 144.32, "Originality."], [145.08, 146.33, "Accountability."], [147.32, 151.07, "Accountability means being answerable for one's decisions and work."], [151.68, 154.56, "Accountability requires transparent methods."], [155.15, 158.43, "Your turn. Say: Accountability."], [161.27, 162.58, "Accountability."], [163.37, 166.8, "Part two: dialogue. Let's listen to a conversation."], [167.65, 174.2, "Visal, some students say using AI to write an essay is no different from using a calculator. What's your view?"], [175.32, 183.84, "I disagree. A calculator performs a process you understand, whereas an AI essay replaces the thinking itself."], [184.95, 187.81, "But isn't plagiarism only about copying from people?"], [188.92, 199.84, "Not really. Plagiarism undermines trust, whereas attribution builds it. Submitting unacknowledged AI text is still dishonest."], [200.95, 202.54, "So should AI be banned?"], [203.65, 211.53, "No. Using it transparently for feedback seems acceptable, whereas hiding its use violates integrity."], [212.67, 214.1, "Part three: grammar."], [214.95, 218.01, "Grammar focus: Whereas for contrast."], [218.31, 219.44, "Look at the pattern."], [220.15, 223.73, "Plagiarism undermines trust, whereas attribution builds it."], [224.62, 229.74, "A calculator performs a process you understand, whereas an AI essay replaces the thinking."], [230.65, 235.1, "Whereas transparent use is acceptable, hidden use violates integrity."], [236.03, 246.08, "'Whereas' links two clauses that directly contrast two things. It is more formal than 'but' and can start the sentence. Don't use it for unexpected results; use 'although' for that."], [246.85, 253.33, "Be careful! Don't say: Plagiarism destroys trust, whereas honesty destroys it too."], [255.3, 259.4, "Say: Plagiarism destroys trust, whereas honesty builds it."], [259.7, 262.54, "'Whereas' must introduce a real contrast."], [263.33, 265.9, "Part four: reading. Read and listen."], [266.7, 268.97, "Integrity in the Age of AI."], [269.27, 275.81, "Academic integrity has always rested on a simple principle: work submitted as your own must genuinely be yours."], [276.8, 283.12, "Plagiarism undermines trust, whereas attribution builds it, by allowing readers to trace every idea to its source."], [284.13, 290.7, "Generative AI has complicated this principle, since text can now be produced without any identifiable human author."], [291.7, 299.02, "Many universities now permit transparent use of AI for feedback, whereas undisclosed use is treated as misconduct."], [300.03, 304.9, "Ultimately, honesty and accountability matter more than any rule designed to enforce them."], [306.0, 310.15, "Part five: quiz. Five questions. Are you ready?"], [311.02, 314.54, "Plagiarism undermines trust, blank attribution builds it."], [314.84, 318.85, "A, whereas. B, although. C, despite."], [322.4, 324.35, "The answer is A: whereas."], [325.52, 327.73, "Which sentence uses 'whereas' correctly?"], [328.02, 335.89, "A, Whereas it rained, we stayed home.. B, Cats are independent, whereas dogs are social.. C, He studied, whereas he passed.."], [339.43, 343.6, "The answer is B: Cats are independent, whereas dogs are social.."], [344.75, 347.5, "Fabricating data constitutes research blank."], [347.8, 351.89, "A, attribution. B, misconduct. C, originality."], [355.43, 357.47, "The answer is B: misconduct."], [358.62, 362.5, "For an unexpected contrast ('she was tired but kept working'), use blank."], [362.8, 366.53, "A, whereas. B, although. C, thereby."], [370.07, 371.79, "The answer is B: although."], [372.95, 377.41, "According to the reading, how do many universities treat undisclosed AI use?"], [377.71, 382.52, "A, as misconduct. B, as acceptable feedback. C, as a calculator."], [386.07, 388.27, "The answer is A: as misconduct."], [389.47, 392.64, "Part six: speaking. It's your turn to talk."], [393.48, 396.98, "Why does academic integrity matter beyond avoiding punishment?"], [413.78, 415.26, "Now listen to Visal."], [415.56, 451.37, "Academic integrity matters because the purpose of education is to develop your own abilities, not just to obtain a certificate. A student who copies may pass the course, whereas a student who struggles honestly actually learns. Furthermore, society relies on qualifications: we trust that a doctor or engineer genuinely earned their degree. Some may argue that dishonesty is harmless if no one finds out. However, every shortcut weakens both your skills and public trust."], [451.67, 453.79, "Excellent answer, Visal!"], [454.68, 459.05, "Great work! Now you can use eight new words and whereas for contrast."], [459.35, 462.83, "Today's value is honesty. Always tell the truth."], [463.13, 465.9, "See you in Unit twenty-one. Goodbye!"], [466.2, 469.57, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C1B1-Unit21-Grant-Writing": [[0.35, 4.99, "Hello, everyone! I'm Ms. Emma. Welcome to Online C one, Book one."], [5.29, 8.42, "Hi! I'm Visal. Let's learn together!"], [8.72, 1
