4.68, "Unit twenty-one: Grant Writing. Today you will make careful, credible claims using hedging."], [14.98, 17.55, "Here is our lesson map. Let's start!"], [18.5, 21.73, "Part one: words. You will learn eight new words."], [22.58, 23.38, "Grant."], [24.38, 27.72, "Grant means a sum of money awarded to fund a specific project."], [28.32, 31.04, "The team secured a three-year research grant."], [31.65, 33.9, "Your turn. Say: Grant."], [36.73, 37.44, "Grant."], [38.18, 39.14, "Proposal."], [40.15, 43.86, "Proposal means a formal document requesting funding for planned work."], [44.45, 46.93, "The proposal must not exceed ten pages."], [47.52, 50.08, "Your turn. Say: Proposal."], [52.93, 53.97, "Proposal."], [54.72, 55.4, "Funding."], [56.42, 59.55, "Funding means financial support provided for a purpose."], [60.15, 62.68, "Competition for funding is intense."], [63.28, 65.34, "Your turn. Say: Funding."], [68.2, 68.99, "Funding."], [69.75, 70.94, "Objectives."], [71.95, 76.28, "Objectives means specific, measurable aims a project intends to achieve."], [76.88, 78.7, "Each objective should be measurable."], [79.28, 81.99, "Your turn. Say: Objectives."], [84.83, 85.98, "Objectives."], [86.75, 87.59, "Budget."], [88.58, 91.79, "Budget means a detailed estimate of planned expenditure."], [92.38, 94.66, "Reviewers questioned the travel budget."], [95.25, 97.46, "Your turn. Say: Budget."], [100.3, 101.14, "Budget."], [101.88, 102.8, "Impact."], [103.82, 107.56, "Impact means the measurable effect of research beyond academia."], [108.15, 111.41, "Funders increasingly prioritise social impact."], [112.02, 114.37, "Your turn. Say: Impact."], [117.23, 118.34, "Impact."], [119.08, 119.83, "Reviewer."], [120.82, 124.65, "Reviewer means an expert who assesses proposals for funders."], [125.25, 128.07, "Reviewers score each proposal out of one hundred."], [128.68, 131.43, "Your turn. Say: Reviewer."], [134.27, 135.34, "Reviewer."], [136.08, 137.13, "Feasibility."], [138.12, 142.22, "Feasibility means the likelihood that a plan can be successfully carried out."], [142.82, 145.4, "A pilot study demonstrated feasibility."], [145.98, 148.91, "Your turn. Say: Feasibility."], [151.77, 152.87, "Feasibility."], [153.67, 157.44, "Part two: dialogue. Let's listen to a conversation."], [158.28, 164.88, "Visal, your draft grant proposal says the project 'will eliminate illiteracy in rural schools'. Is that wise?"], [165.98, 174.9, "Probably not. It sounds overconfident. I've rewritten it: the project is likely to have a significant impact on rural literacy."], [175.98, 178.32, "Doesn't hedging make you sound uncertain?"], [179.42, 189.41, "Not if it's done carefully. Reviewers may distrust exaggerated claims, whereas cautious ones suggest the team understands the risks."], [190.52, 192.85, "How else can you persuade reviewers?"], [193.95, 201.41, "By demonstrating feasibility. Our pilot results could indicate that the approach works on a larger scale."], [202.57, 203.92, "Part three: grammar."], [204.75, 208.03, "Grammar focus: Hedging (likely to, may, could)."], [208.33, 209.54, "Look at the pattern."], [210.25, 213.28, "The project is likely to have a significant impact."], [214.18, 216.94, "Reviewers may distrust exaggerated claims."], [217.85, 221.09, "Our pilot results could indicate that the approach works."], [222.03, 233.11, "Hedging softens claims to match the strength of your evidence. Combine devices for precision: 'is likely to', 'appears to', 'may potentially'. Avoid over-hedging, which sounds evasive."], [233.85, 238.08, "Be careful! Don't say: The project is likely having an impact."], [240.03, 243.21, "Say: The project is likely to have an impact."], [243.5, 245.53, "Use 'likely to' + base verb."], [246.33, 248.87, "Part four: reading. Read and listen."], [249.67, 250.85, "Winning the Funding."], [251.15, 256.06, "Grant writing is a persuasive genre in which researchers compete for limited resources."], [257.07, 262.75, "A strong proposal sets out clear objectives, a realistic budget and a convincing case for impact."], [263.73, 270.98, "Experienced writers avoid absolute promises, preferring claims such as 'the project is likely to have a significant impact'."], [271.97, 277.19, "Such hedging may appear modest, yet it signals that the applicants understand the uncertainties involved."], [278.2, 284.53, "Above all, reviewers want evidence of feasibility, since even brilliant ideas are worthless if they cannot be delivered."], [285.63, 289.96, "Part five: quiz. Five questions. Are you ready?"], [290.82, 293.81, "The project is likely blank a significant impact."], [294.12, 297.21, "A, having. B, to have. C, have."], [300.77, 302.59, "The answer is B: to have."], [303.75, 305.69, "Which claim is appropriately hedged?"], [305.99, 313.56, "A, This will solve poverty.. B, This may contribute to reducing poverty.. C, This perhaps possibly might maybe help.."], [317.1, 321.31, "The answer is B: This may contribute to reducing poverty.."], [322.45, 325.85, "The likelihood that a plan can be carried out is its blank."], [326.15, 329.82, "A, impact. B, feasibility. C, budget."], [333.37, 335.97, "The answer is B: feasibility."], [337.12, 339.35, "Over-hedging makes a writer sound blank."], [339.65, 343.43, "A, evasive. B, confident. C, precise."], [346.97, 348.97, "The answer is A: evasive."], [350.12, 353.36, "According to the reading, why do experienced writers hedge?"], [353.66, 360.82, "A, to signal they understand uncertainty. B, to make proposals shorter. C, because reviewers prefer vague claims."], [364.37, 368.01, "The answer is A: to signal they understand uncertainty."], [369.2, 372.48, "Part six: speaking. It's your turn to talk."], [373.32, 376.68, "What makes a research proposal convincing to reviewers?"], [393.48, 394.93, "Now listen to Visal."], [395.23, 431.59, "A convincing proposal is likely to combine a clear problem, realistic objectives and strong evidence of feasibility. Reviewers tend to trust applicants who acknowledge risks rather than promising dramatic results. For example, pilot data showing that a reading programme works in two schools may persuade them that it could work in twenty. Some applicants believe ambitious claims attract attention, and occasionally they do. In most cases, however, careful, honest claims are more persuasive."], [431.89, 433.74, "Excellent answer, Visal!"], [434.65, 439.16, "Great work! Now you can use eight new words and hedging (likely to, may, could)."], [439.46, 444.31, "Today's value is planning ahead. Make a plan and take small steps every day."], [444.61, 447.33, "See you in Unit twenty-two. Goodbye!"], [447.63, 450.99, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C1B1-Unit22-Research-Ethics": [[0.35, 5.28, "Hello, everyone! I'm Ms. Emma. Welcome to Online C one, Book one."], [5.58, 9.46, "Hi! I'm Visal. Let's learn together!"], [9.76, 16.46, "Unit twenty-two: Research Ethics. Today you will express formal obligations with 'must' and 'be required to'."], [16.76, 19.47, "Here is our lesson map. Let's start!"], [20.43, 23.62, "Part one: words. You will learn eight new words."], [24.48, 25.44, "Ethics."], [26.45, 29.38, "Ethics means moral principles governing conduct."], [29.98, 31.97, "The ethics committee meets monthly."], [32.58, 35.29, "Your turn. Say: Ethics."], [38.13, 39.23, "Ethics."], [39.98, 41.33, "Informed consent."], [42.32, 47.01, "Informed consent means voluntary agreement given with full understanding of risks."], [47.62, 50.51, "Informed consent must be documented in writing."], [51.12, 53.91, "Your turn. Say: Informed consent."], [56.77, 58.38, "Informed consent."], [59.12, 60.54, "Confidentiality."], [61.55, 65.73, "Confidentiality means the protection of personal information from disclosure."], [66.32, 69.58, "Confidentiality was guaranteed to all participants."], [70.18, 73.65, "Your turn. Say: Confidentiality."], [76.5, 77.92, "Confidentiality."], [78.68, 79.84, "Participant."], [80.85, 83.94, "Participant means a person who takes part in a study."], [84.55, 87.13, "Participants may withdraw at any time."], [87.72, 90.4, "Your turn. Say: Participant."], [93.27, 94.27, "Participant."], [95.02, 95.8, "Harm."], [96.78, 100.08, "Harm means physical, psychological or social damage."], [100.68, 103.38, "Researchers must minimise any potential harm."], [103.98, 106.43, "Your turn. Say: Harm."], [109.27, 110.17, "Harm."], [110.92, 112.01, "Anonymity."], [113.02, 116.62, "Anonymity means the removal of all identifying information."], [117.22, 119.87, "Anonymity is stronger than confidentiality."], [120.45, 123.19, "Your turn. Say: Anonymity."], [126.03, 126.95, "Anonymity."], [127.72, 128.84, "Approval."], [129.85, 133.08, "Approval means formal permission granted by an ethics board."], [133.68, 136.38, "The study cannot begin without ethical approval."], [136.98, 139.43, "Your turn. Say: Approval."], [142.27, 143.28, "Approval."], [144.02, 145.06, "Vulnerable."], [146.05, 149.47, "Vulnerable means at greater risk of harm or exploitation."], [150.05, 152.44, "Children are considered a vulnerable group."], [153.05, 155.4, "Your turn. Say: Vulnerable."], [158.27, 159.31, "Vulnerable."], [160.1, 163.82, "Part two: dialogue. Let's listen to a conversation."], [164.68, 169.68, "Visal, your project involves interviewing secondary students. What must you do first?"], [170.78, 180.39, "Researchers are required to obtain informed consent. Because the participants are under eighteen, parents must also sign."], [181.48, 184.35, "What if a student changes their mind halfway through?"], [185.45, 192.14, "They must be allowed to withdraw at any time, without giving a reason and without any penalty."], [193.25, 195.59, "And how will you protect their identities?"], [196.68, 204.8, "All names are required to be removed from transcripts, and recordings must be deleted once the analysis is complete."], [205.97, 207.27, "Part three: grammar."], [208.12, 212.07, "Grammar focus: Obligation with must and be required to."], [212.37, 213.53, "Look at the pattern."], [214.22, 217.34, "Researchers are required to obtain informed consent."], [218.25, 221.33, "Participants must be allowed to withdraw at any time."], [222.22, 225.45, "All names are required to be removed from transcripts."], [226.4, 238.18, "'Must' expresses strong obligation, often from the speaker or a rule. 'Be required to' is more formal and emphasises an external regulation. Both can take a passive infinitive: 'must be allowed'."], [238.92, 243.53, "Be careful! Don't say: Researchers are required obtaining consent."], [245.47, 248.47, "Say: Researchers are required to obtain consent."], [248.76, 251.14, "Use 'be required to' + base verb."], [251.93, 254.69, "Part four: reading. Read and listen."], [255.5, 257.34, "Protecting Participants."], [257.64, 264.27, "Research ethics developed largely in response to historical abuses in which participants were harmed without their knowledge."], [265.27, 270.26, "Today, researchers are required to obtain informed consent before any data is collected."], [271.27, 276.78, "Participants must understand the risks involved, and they must be free to withdraw at any stage."], [277.8, 283.65, "Additional safeguards are required when working with vulnerable groups, such as children or refugees."], [284.67, 289.62, "No study involving people may begin until it has received formal ethical approval."], [290.7, 294.55, "Part five: quiz. Five questions. Are you ready?"], [295.42, 298.39, "Researchers are required blank informed consent."], [298.69, 302.23, "A, obtaining. B, to obtain. C, obtain."], [305.77, 307.89, "The answer is B: to obtain."], [309.05, 311.83, "Participants must blank to withdraw at any time."], [312.13, 315.56, "A, allow. B, be allowed. C, allowed."], [319.1, 321.16, "The answer is B: be allowed."], [322.32, 325.34, "Removing all identifying information ensures blank."], [325.64, 329.45, "A, anonymity. B, approval. C, harm."], [333.0, 334.97, "The answer is A: anonymity."], [336.12, 338.53, "Which is the most formal expression of a rule?"], [338.83, 344.94, "A, You've got to ask them.. B, Researchers are required to ask them.. C, You should probably ask them.."], [348.5, 352.04, "The answer is B: Researchers are required to ask them.."], [353.18, 356.37, "According to the reading, why did research ethics develop?"], [356.67, 362.84, "A, in response to historical abuses. B, to speed up research. C, to reduce funding."], [366.4, 370.19, "The answer is A: in response to historical abuses."], [371.4, 374.32, "Part six: speaking. It's your turn to talk."], [375.18, 378.31, "Why is informed consent essential in research with people?"], [395.12, 396.41, "Now listen to Visal."], [396.71, 428.22, "Informed consent is essential because it respects people's right to decide what happens to them. Participants must understand the purpose, the risks and their right to withdraw before they agree. History shows what can happen without it: in some infamous studies, people were seriously harmed without ever being told the truth. Some researchers argue that full disclosure can bias results. Even so, I believe no scientific goal justifies treating people as mere data."], [428.52, 430.19, "Excellent answer, Visal!"], [431.08, 436.0, "Great work! Now you can use eight new words and obligation with must and be required to."], [436.3, 439.67, "Today's value is respect. Thank the people who help us."], [439.97, 443.53, "See you in Unit twenty-three. Goodbye!"], [443.83, 446.47, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C1B1-Unit23-Survey-Design": [[0.35, 5.26, "Hello, everyone! I'm Ms. Emma. Welcome to Online C one, Book one."], [5.56, 8.98, "Hi! I'm Visal. Let's learn together!"], [9.28, 16.48, "Unit twenty-three: Survey Design. Today you will link actions concisely with participle clauses."], [16.78, 19.48, "Here is our lesson map. Let's start!"], [20.43, 23.74, "Part one: words. You will learn eight new words."], [24.58, 25.57, "Survey."], [26.58, 30.14, "Survey means a systematic method of collecting data from a sample."], [30.75, 33.23, "The survey reached over two thousand households."], [33.82, 36.71, "Your turn. Say: Survey."], [39.57, 40.58, "Survey."], [41.32, 42.27, "Questionnaire."], [43.28, 46.62, "Questionnaire means a written set of questions used in a survey."], [47.22, 49.81, "The questionnaire took twelve minutes to complete."], [50.42, 53.26, "Your turn. Say: Questionnaire."], [56.1, 57.24, "Questionnaire."], [57.98, 58.89, "Sample."], [59.88, 63.3, "Sample means a subset of a population selected for study."], [63.88, 66.59, "The sample was stratified by region and age."], [67.18, 69.61, "Your turn. Say: Sample."], [72.47, 73.31, "Sample."], [74.05, 75.05, "Bias."], [76.05, 80.55, "Bias means a systematic distortion in how data is collected or interpreted."], [81.15, 83.92, "Leading questions introduce response bias."], [84.52, 86.73, "Your turn. Say: Bias."], [89.57, 90.63, "Bias."], [91.38, 92.23, "Scale."], [93.25, 95.9, "Scale means a graded set of response options."], [96.48, 98.74, "A five-point scale measured agreement."], [99.35, 101.72, "Your turn. Say: Scale."], [104.57, 105.55, "Scale."], [106.28, 107.52, "Response rate."], [108.52, 111.75, "Response rate means the percentage of people who complete a survey."], [112.35, 115.43, "A low response rate threatens representativeness."], [116.02, 119.06, "Your turn. Say: Response rate."], [121.9, 123.08, "Response rate."], [123.82, 124.71, "Pilot."], [125.72, 129.83, "Pilot means to test a research instrument on a small group first."], [130.42, 133.08, "We piloted the questionnaire with ten students."], [133.68, 136.36, "Your turn. Say: Pilot."], [139.2, 140.0, "Pilot."], [140.75, 142.04, "Reliability."], [143.05, 146.86, "Reliability means the consistency of results produced by an instrument."], [147.45, 149.68, "Clear wording improves reliability."], [150.28, 153.41, "Your turn. Say: Reliability."], [156.27, 157.35, "Reliability."], [158.13, 161.59, "Part two: dialogue. Let's listen to a conversation."], [162.45, 167.32, "Visal, your survey on screen time changed a lot between versions. What happened?"], [168.42, 174.55, "Having piloted the survey, the team revised the questions. Several turned out to be leading."], [175.65, 177.03, "Can you give an example?"], [178.15, 186.41, "We originally asked, 'Don't you agree that phones are harmful?' Realising it pushed respondents towards 'yes', we rewrote it neutrally."], [187.52, 189.72, "And how did you improve the response rate?"], [190.82, 197.13, "Shortening the questionnaire to ten minutes, we saw completion rise from forty to seventy percent."], [198.3, 199.96, "Part three: grammar."], [200.82, 203.51, "Grammar focus: Participle clauses."], [203.81, 205.0, "Look at the pattern."], [205.68, 208.85, "Having piloted the survey, the team revised the questions."], [209.75, 213.39, "Realising the question was leading, we rewrote it neutrally."], [214.28, 217.18, "Shortening the questionnaire, we raised the response rate."], [218.13, 229.0, "Participle clauses replace 'after / because / when + subject + verb'. 'Having + past participle' shows the action was completed first. The main subject must be the one doing both actions."], [229.75, 233.77, "Be careful! Don't say: Having pilot the survey, we revised it."], [235.73, 238.88, "Say: Having piloted the survey, we revised it."], [239.18, 241.46, "Use 'having' + past participle."], [242.27, 244.97, "Part four: reading. Read and listen."], [245.77, 247.62, "Asking the Right Questions."], [247.91, 250.59, "A survey is only as good as the questions it asks."], [251.6, 257.02, "Poorly worded items can introduce bias, steering respondents towards particular answers."], [258.03, 263.17, "Having piloted the survey, the team revised the questions to remove ambiguity and leading phrasing."], [264.17, 269.76, "Recognising that long questionnaires discourage completion, designers increasingly keep surveys brief."], [270.77, 275.92, "A representative sample and a high response rate together determine whether the results can be trusted."], [277.03, 280.99, "Part five: quiz. Five questions. Are you ready?"], [281.85, 284.79, "blank the survey, the team revised the questions."], [285.09, 289.32, "A, Having piloted. B, Have piloted. C, Piloted having."], [292.87, 295.05, "The answer is A: Having piloted."], [296.22, 299.1, "Which participle clause is correct (same subject)?"], [299.4, 308.72, "A, Having finished the survey, the data was analysed.. B, Having finished the survey, we analysed the data.. C, Finished the survey, we analysing data.."], [312.27, 316.26, "The answer is B: Having finished the survey, we analysed the data.."], [317.42, 321.01, "'Don't you agree that phones are harmful?' is a blank question."], [321.31, 325.04, "A, neutral. B, leading. C, closed-scale."], [328.6, 330.38, "The answer is B: leading."], [331.52, 334.39, "The percentage of people who complete a survey is the blank."], [334.69, 339.15, "A, response rate. B, reliability. C, sample."], [342.7, 344.84, "The answer is A: response rate."], [345.98, 349.4, "According to the reading, why do designers keep surveys brief?"], [349.7, 355.74, "A, Long ones discourage completion.. B, Short ones are cheaper to print.. C, Pilots require it.."], [359.3, 362.62, "The answer is A: Long ones discourage completion.."], [363.83, 366.89, "Part six: speaking. It's your turn to talk."], [367.75, 370.61, "How can the wording of a question bias survey results?"], [387.42, 388.85, "Now listen to Visal."], [389.15, 420.41, "The wording of a question can easily push respondents towards a particular answer. For example, asking 'How much do you enjoy our excellent service?' assumes the service is excellent and discourages criticism. Loaded words, double questions and assumptions can all distort the data. Having recognised these problems, careful researchers pilot their questions and rewrite them neutrally. Some bias is perhaps unavoidable, but thoughtful design can reduce it considerably."], [420.71, 422.33, "Excellent answer, Visal!"], [423.25, 427.33, "Great work! Now you can use eight new words and participle clauses."], [427.63, 432.29, "Today's value is consideration. Use a quiet voice when someone is sleeping."], [432.59, 435.53, "See you in Unit twenty-four. Goodbye!"], [435.83, 439.03, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C1B1-Unit24-Presenting-Research": [[0.35, 5.33, "Hello, everyone! I'm Ms. Emma. Welcome to Online C one, Book one."], [5.63, 9.35, "Hi! I'm Visal. Let's learn together!"], [9.65, 15.86, "Unit twenty-four: Presenting Research. Today you will put key information in focus with 'What … is …'."], [16.16, 18.73, "Here is our lesson map. Let's start!"], [19.67, 23.02, "Part one: words. You will learn eight new words."], [23.85, 24.97, "Presentation."], [25.98, 30.22, "Presentation means a structured talk delivering information to an audience."], [30.82, 33.45, "The presentation was limited to twelve minutes."], [34.05, 37.06, "Your turn. Say: Presentation."], [39.9, 40.97, "Presentation."], [41.72, 42.65, "Audience."], [43.65, 46.76, "Audience means the people listening to or watching a talk."], [47.35, 49.85, "Adapt your terminology to your audience."], [50.45, 53.14, "Your turn. Say: Audience."], [56.0, 57.15, "Audience."], [57.92, 58.79, "Slide."], [59.78, 63.21, "Slide means a single page of a visual presentation."], [63.82, 66.29, "Each slide should convey one main idea."], [66.88, 69.31, "Your turn. Say: Slide."], [72.17, 73.26, "Slide."], [74.02, 75.13, "Key finding."], [76.15, 79.01, "Key finding means the most important result of a study."], [79.62, 82.08, "State your key finding within the first minute."], [82.68, 85.34, "Your turn. Say: Key finding."], [88.2, 89.44, "Key finding."], [90.18, 90.96, "Clarity."], [91.95, 95.17, "Clarity means the quality of being easy to understand."], [95.78, 97.92, "Clarity matters more than complexity."], [98.52, 101.62, "Your turn. Say: Clarity."], [104.47, 105.41, "Clarity."], [106.15, 107.16, "Q&A."], [108.15, 111.45, "Q&A means a session where the audience asks questions."], [112.05, 114.57, "The Q&A revealed a weakness in the argument."], [115.18, 117.77, "Your turn. Say: Q&A."], [120.6, 121.66, "Q&A."], [122.42, 123.25, "Visual."], [124.25, 127.85, "Visual means an image, chart or diagram used to communicate."], [128.45, 131.58, "A strong visual can replace a paragraph of text."], [132.18, 134.25, "Your turn. Say: Visual."], [137.1, 138.03, "Visual."], [138.78, 139.9, "Engagement."], [140.92, 144.59, "Engagement means the degree of attention and involvement of an audience."], [145.18, 147.61, "Rhetorical questions increase engagement."], [148.22, 151.12, "Your turn. Say: Engagement."], [153.97, 155.08, "Engagement."], [155.9, 159.6, "Part two: dialogue. Let's listen to a conversation."], [160.45, 165.16, "Visal, your presentation won first prize. What did you do differently?"], [166.25, 173.31, "I removed most of the text from my slides. What matters most is clarity, not the quantity of information."], [174.42, 176.47, "But didn't you have a lot of data to share?"], [177.58, 184.99, "Yes, but what the audience remembers is a single key finding, so I built the whole talk around one visual."], [186.08, 189.2, "And the Q&A? That's what worries most students."], [190.32, 197.18, "What helped me was predicting the hardest questions and preparing short, honest answers in advance."], [198.33, 200.05, "Part three: grammar."], [200.92, 204.03, "Grammar focus: Cleft sentences (What is)."], [204.33, 205.56, "Look at the pattern."], [206.25, 208.17, "What matters most is clarity."], [209.08, 211.95, "What the audience remembers is a single key finding."], [212.85, 215.55, "What helped me was predicting the hardest questions."], [216.5, 225.7, "A 'What' cleft delays the key information to the end, where it receives natural stress. The 'what' clause is singular, so use 'is' or 'was' even if the focus is plural."], [226.45, 230.31, "Be careful! Don't say: What matters most are clarity."], [232.27, 234.58, "Say: What matters most is clarity."], [234.88, 237.15, "A 'what' clause takes a singular verb."], [237.93, 240.55, "Part four: reading. Read and listen."], [241.37, 242.53, "Less Is More."], [242.83, 247.76, "Researchers often assume that the more data they present, the more impressive they will appear."], [248.77, 252.66, "Experienced presenters know better: what matters most is clarity."], [253.67, 260.25, "What audiences typically remember is not a dense table, but a single striking visual and a clearly stated key finding."], [261.27, 266.85, "Effective speakers therefore design each slide around one idea and rehearse until the delivery feels natural."], [267.87, 273.36, "What distinguishes the best presentations, however, is often the confidence shown during the Q&A."], [274.47, 279.14, "Part five: quiz. Five questions. Are you ready?"], [279.98, 282.17, "What matters most blank clarity."], [282.47, 285.25, "A, are. B, is. C, be."], [288.8, 290.33, "The answer is B: is."], [291.48, 295.24, "Rewrite with focus: 'The audience remembers one key finding.'"], [295.54, 303.96, "A, What the audience remembers is one key finding.. B, What remembers the audience is one key finding.. C, One key finding is what remembering.."], [307.5, 311.75, "The answer is A: What the audience remembers is one key finding.."], [312.92, 315.22, "What impressed the judges blank her visuals."], [315.52, 318.43, "A, were. B, was. C, being."], [321.97, 323.65, "The answer is B: was."], [324.82, 328.16, "The degree of attention and involvement of an audience is blank."], [328.46, 331.81, "A, engagement. B, clarity. C, visual."], [335.37, 337.16, "The answer is A: engagement."], [338.32, 342.89, "According to the reading, what often distinguishes the best presentations?"], [343.19, 349.12, "A, confidence during the Q&A. B, the number of slides. C, dense tables."], [352.67, 355.8, "The answer is A: confidence during the Q&A."], [357.0, 360.74, "Part six: speaking. It's your turn to talk."], [361.58, 364.96, "What distinguishes a memorable academic presentation?"], [381.75, 383.16, "Now listen to Visal."], [383.46, 419.04, "What distinguishes a memorable presentation, in my view, is a clear message that the audience can repeat afterwards. Rather than displaying every result, an effective speaker focuses on one key finding supported by a strong visual. For example, a single well-designed chart can be far more persuasive than ten slides of text. Of course, some technical audiences expect detailed data, so presenters must adapt. Ultimately, what audiences value most is clarity combined with genuine enthusiasm."], [419.34, 421.1, "Excellent answer, Visal!"], [421.98, 426.45, "Great work! Now you can use eight new words and cleft sentences (what is)."], [426.75, 430.8, "Today's value is confidence. Speak up and be proud of who you are."], [431.1, 434.28, "See you in Unit twenty-five. Goodbye!"], [434.58, 437.28, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C1B1-Unit25-Visualising-Data": [[0.35, 5.18, "Hello, everyone! I'm Ms. Emma. Welcome to Online C one, Book one."], [5.48, 8.82, "Hi! I'm Visal. Let's learn together!"], [9.12, 15.83, "Unit twenty-five: Visualising Data. Today you will add emphasis with inversion after 'Not only'."], [16.13, 18.91, "Here is our lesson map. Let's start!"], [19.87, 23.23, "Part one: words. You will learn eight new words."], [24.08, 25.32, "Visualisation."], [26.32, 29.52, "Visualisation means the graphical representation of data."], [30.12, 32.82, "Good visualisation reveals patterns instantly."], [33.42, 36.78, "Your turn. Say: Visualisation."], [39.63, 40.92, "Visualisation."], [41.68, 42.43, "Chart."], [43.42, 47.72, "Chart means a diagram displaying data, such as a bar or line chart."], [48.32, 50.85, "A line chart suits data over time."], [51.45, 53.91, "Your turn. Say: Chart."], [56.77, 57.55, "Chart."], [58.28, 59.37, "Axis."], [60.35, 63.62, "Axis means a reference line along which values are measured."], [64.22, 66.47, "Always label both axes clearly."], [67.08, 69.42, "Your turn. Say: Axis."], [72.27, 73.31, "Axis."], [74.05, 74.81, "Trend."], [75.82, 78.86, "Trend means a general direction of change over time."], [79.45, 81.88, "The trend reversed after 2020."], [82.48, 85.17, "Your turn. Say: Trend."], [88.03, 88.81, "Trend."], [89.55, 90.45, "Outlier."], [91.45, 94.6, "Outlier means a value far removed from the general pattern."], [95.18, 97.93, "The outlier was traced to a data entry error."], [98.52, 101.03, "Your turn. Say: Outlier."], [103.87, 104.86, "Outlier."], [105.62, 106.77, "Misleading."], [107.78, 111.37, "Misleading means giving a false impression, often deliberately."], [111.98, 114.65, "A truncated axis can be highly misleading."], [115.25, 118.09, "Your turn. Say: Misleading."], [120.93, 121.98, "Misleading."], [122.72, 123.65, "Scale."], [124.65, 128.52, "Scale means the range and intervals of values on an axis."], [129.12, 132.15, "A logarithmic scale compresses large differences."], [132.75, 135.08, "Your turn. Say: Scale."], [137.93, 138.84, "Scale."], [139.58, 140.55, "Insight."], [141.55, 145.26, "Insight means a deep, accurate understanding gained from analysis."], [145.85, 148.52, "The map provided an unexpected insight."], [149.12, 151.79, "Your turn. Say: Insight."], [154.63, 155.74, "Insight."], [156.53, 160.18, "Part two: dialogue. Let's listen to a conversation."], [161.05, 164.58, "Visal, why did you redesign the chart in your report?"], [165.68, 172.07, "The original had a truncated axis. A tiny increase looked enormous, which was misleading."], [173.18, 175.44, "Does design really matter that much?"], [176.55, 183.94, "Absolutely. Not only does a clear chart save time, but it also builds trust in your conclusions."], [185.05, 186.89, "What else should designers avoid?"], [187.98, 196.88, "Clutter. Not only do 3D effects distort proportions, but they also distract from the actual insight."], [198.03, 200.0, "Part three: grammar."], [200.85, 204.15, "Grammar focus: Inversion for emphasis (Not only)."], [204.45, 205.79, "Look at the pattern."], [206.48, 210.24, "Not only does a clear chart save time, but it also builds trust."], [211.15, 216.31, "Not only do 3D effects distort proportions, but they also distract readers."], [217.22, 221.04, "Not only was the axis truncated, but the labels were also missing."], [222.0, 231.88, "After a negative adverbial like 'Not only' at the start, invert the subject and auxiliary as in a question: 'Not only does it …', 'Not only was it …'. This is formal and emphatic."], [232.62, 237.3, "Be careful! Don't say: Not only a chart saves time, but builds trust."], [239.27, 243.1, "Say: Not only does a chart save time, but it also builds trust."], [243.4, 246.91, "Invert after 'Not only': does + subject + verb."], [247.7, 250.65, "Part four: reading. Read and listen."], [251.47, 252.79, "Seeing Is Believing."], [253.09, 258.32, "Data visualisation transforms rows of numbers into patterns the human eye can grasp instantly."], [259.33, 264.32, "Not only does a clear chart save time, but it also builds trust in the analysis behind it."], [265.3, 271.98, "Yet visualisation can deceive as easily as it informs, particularly when an axis is truncated or a scale distorted."], [272.97, 278.74, "Not only do such techniques exaggerate trends, but they may also conceal important outliers."], [279.73, 285.9, "Responsible designers therefore prioritise accuracy over visual drama, letting the data speak honestly."], [287.0, 291.15, "Part five: quiz. Five questions. Are you ready?"], [292.02, 296.91, "Not only blank a clear chart save time, but it also builds trust."], [297.21, 300.28, "A, do. B, does. C, is."], [303.83, 306.15, "The answer is B: does."], [307.28, 310.9, "Correct the inversion: 'Not only the axis was truncated …'"], [311.2, 318.69, "A, Not only was the axis truncated …. B, Not only the axis truncated was …. C, Not only did the axis was truncated …."], [322.23, 325.46, "The answer is A: Not only was the axis truncated …."], [326.62, 331.01, "A bar chart whose axis starts at 95 instead of 0 may be blank."], [331.31, 335.29, "A, insightful. B, misleading. C, logarithmic."], [338.83, 340.88, "The answer is B: misleading."], [342.02, 344.88, "A general direction of change over time is a blank."], [345.18, 348.27, "A, trend. B, scale. C, axis."], [351.83, 353.52, "The answer is A: trend."], [354.68, 357.97, "According to the reading, what can misleading techniques conceal?"], [358.27, 362.69, "A, important outliers. B, the title. C, the colour scheme."], [366.23, 369.06, "The answer is A: important outliers."], [370.27, 373.19, "Part six: speaking. It's your turn to talk."], [374.05, 376.28, "How can a chart mislead its readers?"], [393.08, 395.05, "Now listen to Visal."], [395.35, 433.93, "A chart can mislead in several subtle ways. Not only can a truncated axis make a small change look dramatic, but a distorted scale can also hide important differences. For example, a bar chart starting at ninety-five rather than zero might suggest that one school vastly outperforms another when the gap is tiny. Some designers argue that zooming in helps readers see detail, which is sometimes fair. However, the context should always be made clear so that readers are not deceived."], [434.23, 435.92, "Excellent answer, Visal!"], [436.82, 441.62, "Great work! Now you can use eight new words and inversion for emphasis (not only)."], [441.92, 446.09, "Today's value is truthfulness. Tell the truth and check the facts."], [446.39, 449.44, "See you in Unit twenty-six. Goodbye!"], [449.74, 453.25, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C1B1-Unit26-Writing-an-Abstract": [[0.35, 5.06, "Hello, everyone! I'm Ms. Emma. Welcome to Online C one, Book one."], [5.36, 8.39, "Hi! I'm Visal. Let's learn together!"], [8.69, 16.23, "Unit twenty-six: Writing an Abstract. Today you will report research concisely using the present simple."], [16.53, 19.16, "Here is our lesson map. Let's start!"], [20.1, 23.37, "Part one: words. You will learn eight new words."], [24.22, 25.25, "Abstract."], [26.25, 29.8, "Abstract means a brief summary at the start of a research paper."], [30.42, 33.63, "The abstract is limited to two hundred and fifty words."], [34.25, 36.81, "Your turn. Say: Abstract."], [39.67, 40.73, "Abstract."], [41.48, 42.48, "Summary."], [43.48, 46.32, "Summary means a short statement of the main points."], [46.92, 49.71, "An abstract is a summary, not an introduction."], [50.32, 52.99, "Your turn. Say: Summary."], [55.83, 56.81, "Summary."], [57.55, 58.49, "Purpose."], [59.48, 62.45, "Purpose means the reason for which research is carried out."], [63.05, 65.39, "State the purpose in the first sentence."], [65.98, 68.54, "Your turn. Say: Purpose."], [71.4, 72.33, "Purpose."], [73.08, 73.9, "Method."], [74.88, 78.22, "Method means the procedure used to collect and analyse data."], [78.82, 81.62, "Describe the method in one or two sentences."], [82.22, 84.35, "Your turn. Say: Method."], [87.2, 87.98, "Method."], [88.72, 89.57, "Results."], [90.58, 93.29, "Results means the outcomes produced by a study."], [93.88, 96.29, "Report the main results with key figures."], [96.88, 99.4, "Your turn. Say: Results."], [102.23, 103.29, "Results."], [104.05, 105.1, "Conclusion."], [106.08, 109.13, "Conclusion means the final judgement reached after reasoning."], [109.72, 112.44, "End with the conclusion and its implications."], [113.05, 115.92, "Your turn. Say: Conclusion."], [118.77, 119.78, "Conclusion."], [120.52, 121.41, "Keywords."], [122.42, 125.7, "Keywords means terms that help databases index a paper."], [126.32, 129.36, "Choose keywords that researchers actually search for."], [129.95, 132.3, "Your turn. Say: Keywords."], [135.17, 136.18, "Keywords."], [136.92, 138.05, "Concise."], [139.05, 142.04, "Concise means expressing much in few words."], [142.65, 145.76, "A concise abstract omits background detail."], [146.35, 149.15, "Your turn. Say: Concise."], [152.0, 152.99, "Concise."], [153.8, 157.8, "Part two: dialogue. Let's listen to a conversation."], [158.65, 164.15, "Visal, your abstract is four hundred words and starts with the history of education. What's the problem?"], [165.25, 172.5, "It isn't concise. An abstract should present the purpose, method, results and conclusion, not background."], [173.58, 175.34, "How have you rewritten the opening?"], [176.45, 186.48, "This study examines how peer tutoring affects reading confidence, and the results suggest a significant improvement after eight weeks."], [187.58, 190.28, "Why the present simple, when the study is finished?"], [191.38, 198.77, "Because the paper itself presents the findings now. The procedure is often in the past, but the claims are in the present."], [199.93, 201.75, "Part three: grammar."], [202.58, 206.13, "Grammar focus: Present simple for reporting research."], [206.43, 207.66, "Look at the pattern."], [208.35, 211.95, "This study examines how peer tutoring affects reading confidence."], [212.85, 216.22, "The results suggest a significant improvement after eight weeks."], [217.12, 220.35, "The paper concludes that peer tutoring is cost-effective."], [221.3, 231.63, "In abstracts, use the present simple for what the paper does and what the findings mean (examines, suggests, concludes). The past simple is used for completed procedures (participants were interviewed)."], [232.38, 237.59, "Be careful! Don't say: This study examined how … and results suggested …"], [239.53, 242.94, "Say: This study examines how …, and the results suggest …"], [243.24, 245.93, "Abstracts report the study in the present simple."], [246.73, 249.27, "Part four: reading. Read and listen."], [250.07, 251.75, "Two Hundred Words That Matter."], [252.05, 256.68, "For most readers, the abstract is the only part of a paper they will ever read."], [257.67, 263.73, "It must therefore convey the purpose, method, results and conclusion in a strictly limited space."], [264.73, 272.04, "Writers typically state what the paper does in the present simple: this study examines a problem, and the results suggest an answer."], [273.03, 278.71, "Background information and citations are usually omitted, since every word must earn its place."], [279.7, 284.86, "Carefully chosen keywords then ensure that the paper can be found by the researchers who need it."], [285.97, 289.97, "Part five: quiz. Five questions. Are you ready?"], [290.82, 294.02, "This study blank how peer tutoring affects confidence."], [294.32, 298.24, "A, examine. B, examines. C, is examine."], [301.8, 304.24, "The answer is B: examines."], [305.38, 308.56, "Which tense suits a completed procedure in an abstract?"], [308.86, 315.11, "A, Participants are interviewing.. B, Participants were interviewed.. C, Participants have been interview.."], [318.67, 321.58, "The answer is B: Participants were interviewed.."], [322.75, 325.54, "Which element is usually omitted from an abstract?"], [325.84, 330.27, "A, the results. B, detailed background. C, the purpose."], [333.83, 336.47, "The answer is B: detailed background."], [337.62, 340.13, "Expressing much in few words means being blank."], [340.43, 345.16, "A, concise. B, verbose. C, abstract."], [348.7, 350.44, "The answer is A: concise."], [351.58, 354.22, "According to the reading, why do keywords matter?"], [354.52, 360.88, "A, They help researchers find the paper.. B, They replace the conclusion.. C, They make the abstract longer.."], [364.43, 367.8, "The answer is A: They help researchers find the paper.."], [369.0, 372.26, "Part six: speaking. It's your turn to talk."], [373.12, 376.33, "Why is the abstract often the most-read part of a paper?"], [393.15, 394.63, "Now listen to Visal."], [394.93, 433.47, "The abstract is often the most-read part because researchers use it to decide whether a paper is worth their time. Thousands of articles are published every day, so busy readers scan abstracts in databases before downloading anything. For example, a student writing a literature review might read fifty abstracts but only ten full papers. Some argue that this encourages superficial reading, and that concern is valid. Nevertheless, it means a clear, concise abstract is essential for any paper to have impact."], [433.77, 435.5, "Excellent answer, Visal!"], [436.38, 441.47, "Great work! Now you can use eight new words and present simple for reporting research."], [441.77, 447.53, "Today's value is self-discipline. Control your habits, so your habits do not control you."], [447.83, 450.81, "See you in Unit twenty-seven. Goodbye!"], [451.12, 454.42, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C1B1-Unit27-Mixed-Methods-Research": [[0.35, 5.43, "Hello, everyone! I'm Ms. Emma. Welcome to Online C one, Book one."], [5.73, 9.1, "Hi! I'm Visal. Let's learn together!"], [9.39, 16.34, "Unit twenty-seven: Mixed Methods Research. Today you will express results and consequences with 'thereby'."], [16.64, 19.3, "Here is our lesson map. Let's start!"], [20.23, 23.32, "Part one: words. You will learn eight new words."], [24.15, 25.42, "Mixed methods."], [26.42, 31.34, "Mixed methods means research combining qualitative and quantitative approaches."], [31.95, 34.82, "Mixed methods suit complex social questions."], [35.42, 38.12, "Your turn. Say: Mixed methods."], [40.97, 42.22, "Mixed methods."], [42.98, 44.03, "Qualitative."], [45.02, 49.14, "Qualitative means concerned with meanings, experiences and descriptions."], [49.75, 52.66, "Qualitative data explained the survey results."], [53.25, 55.91, "Your turn. Say: Qualitative."], [58.77, 59.83, "Qualitative."], [60.58, 61.67, "Quantitative."], [62.65, 65.71, "Quantitative means concerned with numerical measurement."], [66.32, 69.05, "Quantitative data showed the scale of the problem."], [69.65, 72.24, "Your turn. Say: Quantitative."], [75.1, 75.96, "Quantitative."], [76.72, 77.97, "Triangulation."], [78.98, 83.53, "Triangulation means cross-checking findings using different methods or sources."], [84.12, 87.39, "Triangulation increased confidence in the conclusions."], [87.98, 90.39, "Your turn. Say: Triangulation."], [93.23, 94.54, "Triangulation."], [95.28, 96.23, "Interview."], [97.22, 101.14, "Interview means a conversation designed to elicit detailed information."], [101.75, 105.09, "Follow-up interviews explored unexpected findings."], [105.68, 108.01, "Your turn. Say: Interview."], [110.87, 111.89, "Interview."], [112.65, 113.81, "Statistics."], [114.82, 118.4, "Statistics means numerical data and the methods for analysing it."], [118.98, 121.23, "The statistics revealed a gender gap."], [121.82, 124.6, "Your turn. Say: Statistics."], [127.43, 128.68, "Statistics."], [129.42, 130.63, "Integration."], [131.62, 136.11, "Integration means the combining of different data into a unified analysis."], [136.72, 139.75, "Integration is the hardest part of mixed methods."], [140.35, 142.91, "Your turn. Say: Integration."], [145.77, 146.91, "Integration."], [147.65, 148.48, "Depth."], [149.48, 152.61, "Depth means thoroughness of understanding beyond the surface."], [153.22, 155.39, "Interviews added depth to the numbers."], [155.98, 158.32, "Your turn. Say: Depth."], [161.17, 161.94, "Depth."], [162.73, 166.29, "Part two: dialogue. Let's listen to a conversation."], [167.15, 171.65, "Visal, why did you use both a survey and interviews in your study of student stress?"], [172.75, 182.19, "The survey showed how widespread stress was, while the interviews explained why. The study combined methods, thereby increasing validity."], [183.28, 186.15, "Did the two sets of data ever contradict each other?"], [187.25, 198.31, "Once. The survey suggested exams were the main cause, but interviews revealed family expectations, thereby changing our interpretation."], [199.42, 201.23, "So integration was essential?"], [202.32, 208.93, "Exactly. We presented both side by side, thereby showing the full picture rather than half of it."], [210.07, 211.6, "Part three: grammar."], [212.45, 214.81, "Grammar focus: Linking with thereby."], [215.11, 216.27, "Look at the pattern."], [216.98, 220.07, "The study combined methods, thereby increasing validity."], [220.98, 225.34, "The interviews revealed family pressure, thereby changing our interpretation."], [226.25, 230.35, "We presented both data sets together, thereby showing the full picture."], [231.3, 240.0, "'Thereby' means 'by doing this'. It links an action to its direct result and is followed by an -ing form. It is formal and common in academic writing."], [240.75, 245.46, "Be careful! Don't say: We combined methods, thereby increase validity."], [247.4, 251.15, "Say: We combined methods, thereby increasing validity."], [251.45, 253.57, "After 'thereby', use the -ing form."], [254.37, 257.02, "Part four: reading. Read and listen."], [257.83, 259.76, "Numbers and Stories Together."], [260.06, 265.87, "For decades, researchers argued over whether numbers or narratives offered the truer picture of social reality."], [266.87, 273.12, "Mixed methods research rejects this choice, combining statistics with interviews to answer complex questions."], [274.1, 278.9, "A typical study combines methods, thereby increasing validity through triangulation."], [279.9, 286.32, "Quantitative data reveals the scale of a phenomenon, whereas qualitative data uncovers the reasons behind it."], [287.33, 293.7, "The real challenge lies in integration, since the two kinds of evidence must be woven into one coherent argument."], [294.8, 298.73, "Part five: quiz. Five questions. Are you ready?"], [299.58, 302.49, "The study combined methods, thereby blank validity."], [302.79, 306.75, "A, increase. B, increasing. C, increased."], [310.3, 312.73, "The answer is B: increasing."], [313.88, 316.08, "'Thereby' is closest in meaning to blank."], [316.38, 320.85, "A, by doing this. B, despite this. C, before this."], [324.4, 326.55, "The answer is A: by doing this."], [327.72, 330.56, "Which data type reveals the scale of a phenomenon?"], [330.86, 334.94, "A, qualitative. B, quantitative. C, narrative."], [338.5, 340.95, "The answer is B: quantitative."], [342.12, 344.87, "Cross-checking findings with different methods is blank."], [345.17, 349.01, "A, integration. B, triangulation. C, depth."], [352.57, 355.34, "The answer is B: triangulation."], [356.48, 360.56, "According to the reading, where does the real challenge of mixed methods lie?"], [360.86, 365.22, "A, in integration. B, in sampling. C, in statistics alone."], [368.77, 371.28, "The answer is A: in integration."], [372.47, 375.54, "Part six: speaking. It's your turn to talk."], [376.38, 378.89, "When is a mixed methods approach most useful?"], [395.68, 397.09, "Now listen to Visal."], [397.39, 430.33, "A mixed methods approach is most useful when a question has both a 'how much' and a 'why' dimension. For example, a survey might show that forty percent of students skip breakfast, while interviews explain the reasons, thereby giving policymakers a complete picture. It is also valuable when one method's findings are surprising and need further explanation. On the other hand, it demands more time, money and expertise than a single approach. Therefore, I would only use it when the question genuinely requires both."], [430.63, 432.42, "Excellent answer, Visal!"], [433.32, 437.26, "Great work! Now you can use eight new words and linking with thereby."], [437.56, 442.25, "Today's value is balance. Enjoy screens a little, then play and read too."], [442.55, 445.24, "See you in Unit twenty-eight. Goodbye!"], [445.54, 448.02, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C1B1-Unit28-Open-Science": [[0.35, 5.59, "Hello, everyone! I'm Ms. Emma. Welcome to Online C one, Book one."], [5.89, 9.36, "Hi! I'm Visal. Let's learn together!"], [9.66, 16.05, "Unit twenty-eight: Open Science. Today you will report widely held views with passive reporting verbs."], [16.35, 18.86, "Here is our lesson map. Let's start!"], [19.8, 23.02, "Part one: words. You will learn eight new words."], [23.88, 25.21, "Open access."], [26.22, 30.82, "Open access means free, unrestricted online access to research."], [31.42, 34.72, "Open access removes paywalls for readers worldwide."], [35.32, 38.33, "Your turn. Say: Open access."], [41.17, 42.55, "Open access."], [43.32, 44.72, "Transparency."], [45.72, 49.59, "Transparency means openness about methods, data and decisions."], [50.18, 52.75, "Transparency makes errors easier to detect."], [53.35, 56.16, "Your turn. Say: Transparency."], [59.0, 60.31, "Transparency."], [61.05, 62.17, "Replication."], [63.18, 67.13, "Replication means repeating a study to check whether results hold."], [67.75, 70.46, "Many famous findings have failed replication."], [71.05, 73.99, "Your turn. Say: Replication."], [76.83, 77.93, "Replication."], [78.68, 79.75, "Data sharing."], [80.75, 84.19, "Data sharing means making research data available to others."], [84.78, 87.0, "Data sharing accelerates discovery."], [87.62, 90.36, "Your turn. Say: Data sharing."], [93.2, 94.5, "Data sharing."], [95.25, 96.18, "Preprint."], [97.18, 100.51, "Preprint means a version of a paper shared before peer review."], [101.12, 103.82, "Preprints spread rapidly during the pandemic."], [104.42, 107.03, "Your turn. Say: Preprint."], [109.9, 110.74, "Preprint."], [111.48, 112.87, "Reproducibility."], [113.88, 118.02, "Reproducibility means the ability to obtain the same results from the same data."], [118.62, 120.89, "Shared code improves reproducibility."], [121.48, 124.8, "Your turn. Say: Reproducibility."], [127.63, 128.95, "Reproducibility."], [129.68, 130.85, "Collaboration."], [131.85, 135.61, "Collaboration means working together across institutions and borders."], [136.22, 139.03, "Open science encourages global collaboration."], [139.62, 142.51, "Your turn. Say: Collaboration."], [145.37, 146.62, "Collaboration."], [147.38, 148.14, "Public."], [149.15, 151.99, "Public means ordinary people in society as a whole."], [152.58, 155.65, "Publicly funded research should be available to the public."], [156.25, 158.45, "Your turn. Say: Public."], [161.3, 162.2, "Public."], [163.0, 167.02, "Part two: dialogue. Let's listen to a conversation."], [167.88, 171.83, "Visal, why are so many scientists now sharing their data openly?"], [172.95, 181.81, "It is widely argued that open data improves reproducibility. Others can check whether the analysis holds up."], [182.92, 184.21, "Aren't there risks?"], [185.32, 194.2, "Certainly. It has been suggested that sensitive data could be misused, so participants' privacy must be protected."], [195.32, 198.35, "And preprints? Aren't they unreliable?"], [199.45, 208.68, "They are thought to speed up discovery, but it is generally accepted that readers should treat them cautiously until they are peer-reviewed."], [209.83, 211.64, "Part three: grammar."], [212.48, 216.18, "Grammar focus: Passive reporting verbs (It is argued that)."], [216.48, 217.62, "Look at the pattern."], [218.32, 221.83, "It is widely argued that open data improves reproducibility."], [222.72, 225.91, "It has been suggested that sensitive data could be misused."], [226.82, 229.16, "Preprints are thought to speed up discovery."], [230.1, 238.64, "Passive reporting verbs present views without naming who holds them: 'It is argued that …' or 'X is thought to …'. They create an objective, academic distance."], [239.38, 243.96, "Be careful! Don't say: It is widely argue that open data helps."], [245.9, 249.41, "Say: It is widely argued that open data helps."], [249.71, 253.06, "Use the past participle: 'It is argued that …'."], [253.87, 256.69, "Part four: reading. Read and listen."], [257.5, 259.17, "Science Without Walls."], [259.47, 264.98, "Traditionally, research was published in expensive journals, accessible mainly to wealthy universities."], [265.97, 271.12, "The open science movement seeks to change this through open access, data sharing and preprints."], [272.13, 278.82, "It is widely argued that open data improves reproducibility, since independent researchers can verify published results."], [279.83, 286.11, "It has also been suggested that transparency discourages misconduct, as errors become far easier to detect."], [287.1, 293.93, "Critics, however, warn that openness must be balanced against participants' privacy and the risk of misinterpretation."], [295.03, 299.07, "Part five: quiz. Five questions. Are you ready?"], [299.92, 304.26, "It is widely blank that open data improves reproducibility."], [304.56, 308.23, "A, argue. B, argued. C, arguing."], [311.77, 313.72, "The answer is B: argued."], [314.88, 321.36, "Transform: 'People think preprints speed up discovery.' → Preprints blank speed up discovery."], [321.65, 325.91, "A, are thought to. B, are thinking to. C, thought to be."], [329.47, 331.94, "The answer is A: are thought to."], [333.08, 335.71, "A paper shared before peer review is a blank."], [336.01, 339.77, "A, preprint. B, proceedings. C, replication."], [343.33, 345.32, "The answer is A: preprint."], [346.48, 349.47, "Obtaining the same results from the same data shows blank."], [349.77, 354.36, "A, reproducibility. B, open access. C, collaboration."], [357.9, 360.6, "The answer is A: reproducibility."], [361.75, 365.55, "According to the reading, what must openness be balanced against?"], [365.85, 371.0, "A, participants' privacy. B, journal profits. C, faster discovery."], [374.57, 377.73, "The answer is A: participants' privacy."], [378.93, 382.25, "Part six: speaking. It's your turn to talk."], [383.08, 386.52, "What are the benefits and risks of sharing research data openly?"], [403.32, 404.81, "Now listen to Visal."], [405.11, 439.24, "It is widely argued that open data makes research more trustworthy, because others can check and reproduce the results. It also allows scientists in less wealthy countries to build on existing work without expensive subscriptions. For example, shared genetic data helped vaccines to be developed remarkably quickly. However, it has been suggested that personal data could be misused if not properly anonymised. Overall, I believe the benefits outweigh the risks, provided privacy is protected."], [439.54, 441.24, "Excellent answer, Visal!"], [442.15, 447.29, "Great work! Now you can use eight new words and passive reporting verbs (it is argued that)."], [447.59, 451.42, "Today's value is cooperation. Work together with friends."], [451.72, 454.49, "See you in Unit twenty-nine. Goodbye!"], [454.79, 458.75, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C1B1-Unit29-Review-The-Research-Journey": [[0.35, 5.04, "Hello, everyone! I'm Ms. Emma. Welcome to Online C one, Book one."], [5.34, 8.66, "Hi! I'm Visal. Let's learn together!"], [8.96, 16.03, "Unit twenty-nine: Review: The Research Journey. Today you will narrate a complex process with formal discourse markers."], [16.33, 18.81, "Here is our lesson map. Let's start!"], [19.77, 22.87, "Part one: words. You will learn eight new words."], [23.72, 24.53, "Question."], [25.52, 29.06, "Question means the focused problem a study sets out to answer."], [29.65, 32.91, "A good research question is specific and answerable."], [33.52, 35.81, "Your turn. Say: Question."], [38.67, 39.55, "Question."], [40.32, 41.38, "Literature."], [42.38, 45.81, "Literature means the body of published research on a topic."], [46.42, 49.48, "The literature on this issue is surprisingly thin."], [50.08, 52.62, "Your turn. Say: Literature."], [55.47, 56.51, "Literature."], [57.25, 58.02, "Method."], [59.02, 62.44, "Method means the systematic approach used to gather evidence."], [63.05, 65.03, "The method must suit the question."], [65.62, 68.25, "Your turn. Say: Method."], [71.1, 71.93, "Method."], [72.68, 73.67, "Evidence."], [74.68, 78.03, "Evidence means information that supports or challenges a claim."], [78.62, 81.61, "The evidence pointed in an unexpected direction."], [82.22, 84.58, "Your turn. Say: Evidence."], [87.43, 88.42, "Evidence."], [89.18, 90.43, "Analysis."], [91.42, 95.1, "Analysis means detailed examination to uncover meaning."], [95.68, 98.46, "The analysis took longer than the data collection."], [99.05, 101.7, "Your turn. Say: Analysis."], [104.57, 105.82, "Analysis."], [106.58, 107.46, "Argument."], [108.45, 111.63, "Argument means a reasoned case built from evidence."], [112.25, 115.48, "The final argument was more modest than the original idea."], [116.08, 118.76, "Your turn. Say: Argument."], [121.6, 122.36, "Argument."], [123.12, 124.01, "Revision."], [125.02, 128.56, "Revision means the process of reconsidering and improving work."], [129.15, 131.38, "Revision is where good writing is made."], [131.98, 134.36, "Your turn. Say: Revision."], [137.2, 138.22, "Revision."], [138.98, 140.04, "Contribution."], [141.05, 144.36, "Contribution means the new knowledge a study adds to its field."], [144.95, 147.91, "Every thesis must make an original contribution."], [148.52, 151.16, "Your turn. Say: Contribution."], [154.0, 155.13, "Contribution."], [155.93, 159.83, "Part two: dialogue. Let's listen to a conversation."], [160.68, 165.81, "Visal, we've reached the final unit. How would you describe the research journey you've learned about?"], [166.92, 179.0, "Initially, a researcher identifies a question; subsequently, they review the literature and design a method; ultimately, they make a contribution."], [180.12, 183.03, "Which stage do you think students underestimate?"], [184.15, 193.16, "Revision. Having analysed the evidence, many assume they're finished, whereas the argument usually needs reshaping."], [194.25, 196.94, "And what have you gained personally from this course?"], [198.05, 205.68, "It is the habit of questioning my own assumptions that I value me?"], [321.48, 325.96, "A, subsequently. B, initially. C, ultimately."], [329.5, 331.59, "The answer is C: ultimately."], [332.75, 335.12, "Choose the correct order of the research journey."], [335.42, 345.19, "A, question → literature → method. B, method → question → literature. C, literature → contribution → question."], [348.73, 352.62, "The answer is A: question → literature → method."], [353.78, 357.0, "The new knowledge a study adds to its field is its blank."], [357.3, 361.51, "A, revision. B, contribution. C, literature."], [365.07, 367.1, "The answer is B: contribution."], [368.25, 371.97, "According to the reading, what often happens after evidence is analysed?"], [372.27, 378.27, "A, The question may be reconsidered.. B, Research stops.. C, The literature is deleted.."], [381.8, 384.86, "The answer is A: The question may be reconsidered.."], [386.07, 389.11, "Part six: speaking. It's your turn to talk."], [389.95, 392.96, "Which stage of research do you find most challenging?"], [409.75, 411.33, "Now listen to Visal."], [411.63, 446.14, "Personally, I find the analysis stage the most challenging. Initially, collecting data feels productive, but subsequently you have to make sense of results that are often messy and contradictory. For example, in my survey project, the numbers did not support my hypothesis, and I had to rethink my argument entirely. Some people find choosing a question harder, and I understand why. Ultimately, though, analysis is where real thinking happens, so it is also the most rewarding stage."], [446.44, 448.08, "Excellent answer, Visal!"], [448.98, 453.76, "Great work! Now you can use eight new words and sequencing discourse markers."], [454.06, 459.62, "Today's value is growth mindset. Mistakes help you grow. Keep learning, step by step."], [459.92, 465.88, "Congratulations! You have finished Online C one, Book one. See you in Online C one, Book two!"], [466.18, 469.26, "Thank you, Ms. Emma! Bye, everyone!"]]};
