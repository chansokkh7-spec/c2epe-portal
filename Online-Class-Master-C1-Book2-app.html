    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap');
        body { font-family: 'Poppins', sans-serif; }
        /* Flip-card for Listening: front = word, back = picture. */
        .flip-card { perspective: 1000px; height: 100px; cursor: pointer; }
        .flip-card-inner {
            position: relative; width: 100%; height: 100%;
            transition: transform 0.5s; transform-style: preserve-3d;
        }
        .flip-card.flipped .flip-card-inner { transform: rotateY(180deg); }
        .flip-card-front, .flip-card-back {
            position: absolute; width: 100%; height: 100%;
            backface-visibility: hidden; border-radius: 0.75rem;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 0.25rem;
        }
        .flip-card-back { transform: rotateY(180deg); }
        button:disabled { cursor: default; }
        /* phones: the lesson fills the screen, so jumping to it always shows it from the top,
           and the floating "Modules" button never covers the lesson's own buttons */
        @media (max-width: 767px) { #content-area { min-height: calc(100vh - 24px); padding-bottom: 76px; } }
    </style>

    <script>
        let state = {
            level: 'Master',
            unit: 1,
            tab: 'listening',
            stars: 0,
            badges: 0
        };

        const curriculum = {
            'Master': {
                1: { title: "Literary Analysis", vocab: ["Narrative", "Symbolism", "Motif", "Characterization", "Allegory", "Ambiguity", "Tone", "Interpretation", "Foreshadowing", "Irony"], story: "A skilled writer uses symbolism and motif to deepen a narrative. Characterization and tone often create ambiguity that invites deeper interpretation.", question: "How does symbolism enrich a story's meaning?", grammar: { point: "Relative clauses with which", example: "The motif, which repeats throughout, reveals deeper meaning." } },
                2: { title: "Scientific Discourse", vocab: ["Empirical", "Replicate", "Peer-reviewed", "Theory", "Falsifiable", "Rigor", "Consensus", "Innovation", "Anomaly", "Paradigm"], story: "Empirical research must be replicated and peer-reviewed to build scientific consensus. A falsifiable theory, tested with rigor, drives real innovation.", question: "Why must scientific theories be falsifiable?", grammar: { point: "Passive with modals", example: "Theories must be tested. Results should be replicated." } },
                3: { title: "Comparative Politics", vocab: ["Political system", "Federalism", "Parliamentary", "Authoritarian", "Checks and balances", "Electoral system", "Governance model", "Political culture", "Coalition", "Mandate"], story: "Comparing political systems reveals differences between federalism and centralized governance. Checks and balances, electoral systems, and political culture shape whether a state is parliamentary or authoritarian.", question: "What political system do you think works best, and why?", grammar: { point: "Comparative clauses", example: "Federalism distributes power differently than a centralized system does." } },
                4: { title: "Economic Theory", vocab: ["Supply-side", "Demand-side", "Fiscal policy", "Monetary policy", "Market equilibrium", "Externality", "Opportunity cost", "Economic model", "Inflation rate", "Recession"], story: "Supply-side and demand-side theories disagree on the best fiscal and monetary policy. Every economic model must account for market equilibrium, externality, and opportunity cost.", question: "Which economic theory do you find most convincing?", grammar: { point: "Abstract nominalization", example: "The equilibrium of supply and demand determines price." } },
                5: { title: "Advanced Rhetoric", vocab: ["Syllogism", "Anaphora", "Hyperbole", "Rhetorical question", "Persuasive structure", "Tone shift", "Audience appeal", "Discursive strategy", "Diction", "Cadence"], story: "A skilled orator uses a syllogism, anaphora, or even a rhetorical question to persuade. Understanding tone shift and audience appeal reveals a speaker's discursive strategy.", question: "What rhetorical technique do you find most persuasive?", grammar: { point: "Complex subordination", example: "Because the syllogism was logical, the audience was persuaded." } },
                6: { title: "Narrative Theory", vocab: ["Narrator", "Plot structure", "Point of view", "Chronology", "Frame narrative", "Voice", "Arc", "Unreliable narrator"], story: "Narrative theory examines how point of view and narrator voice shape a story's plot structure. A frame narrative can disrupt simple chronology, and an unreliable narrator challenges the reader's trust.", question: "How does an unreliable narrator change the way we read a story?", grammar: { point: "Concessive clauses (although/even though)", example: "Although the narrator seems trustworthy, clues suggest otherwise." }, value: "Interpretive Depth" },
                7: { title: "Postmodern Criticism", vocab: ["Postmodernism", "Fragmentation", "Metafiction", "Pastiche", "Irony", "Deconstruction", "Ambiguity", "Self-reference"], story: "Postmodern criticism embraces fragmentation, metafiction, and pastiche as tools of literary irony. Deconstruction reveals ambiguity, often through playful self-reference.", question: "What is one example of metafiction you have encountered?", grammar: { point: "Nominalization", example: "The fragmentation of the narrative reflects modern uncertainty." }, value: "Critical Awareness" },
                8: { title: "Genre Studies", vocab: ["Genre", "Convention", "Hybridity", "Subversion", "Archetype", "Trope", "Classification", "Expectation"], story: "Genre studies analyze the conventions readers expect, and how hybridity or subversion can challenge them. Recognizing an archetype or trope helps with classification, even as expectations shift.", question: "Can you think of a story that subverts genre expectations?", grammar: { point: "Relative clauses defining categories", example: "A genre that blends horror and comedy subverts expectation." }, value: "Creative Flexibility" },
                9: { title: "Translation Theory", vocab: ["Fidelity", "Equivalence", "Untranslatable", "Domestication", "Foreignization", "Nuance", "Register", "Interpretation"], story: "Translation theory debates fidelity versus equivalence, especially when a phrase seems untranslatable. Domestication adapts a text for local readers, while foreignization preserves its original nuance and register.", question: "What might be lost when a phrase is described as 'untranslatable'?", grammar: { point: "Passive with modal (can be, must be)", example: "Some idioms cannot be translated directly." }, value: "Cultural Sensitivity" },
                10: { title: "Semiotics", vocab: ["Sign", "Signifier", "Signified", "Symbol", "Code", "Denotation", "Connotation", "Interpretant"], story: "Semiotics studies how a sign connects a signifier to what is signified. A symbol carries both denotation and deeper connotation, decoded through a shared cultural code.", question: "What is a symbol in your culture that carries strong connotation?", grammar: { point: "Defining vs non-defining clauses", example: "A sign, which links form to meaning, is central to semiotics." }, value: "Cultural Awareness" },
                11: { title: "Discourse Analysis", vocab: ["Discourse", "Register", "Context", "Power dynamics", "Framing", "Implicature", "Cohesion", "Genre convention"], story: "Discourse analysis examines how register shifts with context, revealing underlying power dynamics. Framing and implicature shape meaning beyond the literal words, held together by cohesion.", question: "How does the way something is 'framed' change its meaning?", grammar: { point: "Passive for emphasis on process", example: "Meaning is shaped as much by framing as by words themselves." }, value: "Critical Awareness" },
                12: { title: "Media Studies", vocab: ["Mass media", "Representation", "Audience", "Gatekeeping", "Agenda-setting", "Consumption", "Bias", "Literacy"], story: "Media studies explores how mass media shapes representation and audience perception through gatekeeping and agenda-setting. Media literacy helps consumers recognize underlying bias.", question: "What is one way media literacy could help you evaluate the news?", grammar: { point: "Cause and effect connectors", example: "Because of agenda-setting, certain stories receive more coverage." }, value: "Media Literacy" },
                13: { title: "Cultural Criticism", vocab: ["Hegemony", "Ideology", "Subculture", "Resistance", "Commodification", "Identity politics", "Appropriation", "Authenticity"], story: "Cultural criticism examines how hegemony and ideology shape a subculture's resistance, even as commodification threatens authenticity. Identity politics and cultural appropriation remain contested topics.", question: "Where do you see the line between cultural appreciation and appropriation?", grammar: { point: "Even as / even though clauses", example: "Even as culture spreads globally, questions of authenticity remain." }, value: "Cultural Respect" },
                14: { title: "Comparative Literature", vocab: ["Comparative literature", "World literature", "Canon", "Translation", "Influence", "Tradition", "Cross-cultural", "Dialogue"], story: "Comparative literature places world literature in dialogue across traditions, questioning who decides the canon. Translation and influence reveal cross-cultural connections often overlooked.", question: "Why might the literary 'canon' be worth questioning or expanding?", grammar: { point: "Questioning rhetorical structures", example: "Who decides which works belong to the canon?" }, value: "Cultural Openness" },
                15: { title: "Feminist Literary Theory", vocab: ["Feminist theory", "Patriarchy", "Voice", "Marginalization", "Agency", "Intersectionality", "Representation", "Empowerment"], story: "Feminist literary theory examines how patriarchy shapes whose voice is heard and whose is marginalized. Intersectionality reveals how agency and representation intersect with empowerment.", question: "How can literature give voice to marginalized perspectives?", grammar: { point: "Passive voice for marginalization", example: "Certain voices have historically been marginalized in literature." }, value: "Equity" },
                16: { title: "Structuralism", vocab: ["Structure", "Binary opposition", "System", "Underlying pattern", "Langue", "Parole", "Universal", "Relation"], story: "Structuralism looks beneath the surface for an underlying pattern, often built from binary opposition. The relation between langue (the system) and parole (individual speech) reveals universal structure.", question: "What binary opposition can you find in a story you know well?", grammar: { point: "Beneath/underlying descriptive language", example: "Beneath the plot lies a deeper structural pattern." }, value: "Analytical Thinking" },
                17: { title: "Reader-Response Theory", vocab: ["Reader-response", "Interpretation", "Subjectivity", "Horizon of expectation", "Meaning-making", "Reception", "Engagement", "Co-creation"], story: "Reader-response theory argues that interpretation is shaped by each reader's subjectivity and horizon of expectation. Meaning-making becomes a co-creation between text and reception.", question: "Do you think a text has one fixed meaning, or many depending on the reader?", grammar: { point: "Hedged claims (may, might, could)", example: "A text's meaning might shift depending on the reader." }, value: "Open-Mindedness" },
                18: { title: "Intertextuality", vocab: ["Intertextuality", "Allusion", "Reference", "Homage", "Parody", "Echo", "Dialogue between texts", "Layered meaning"], story: "Intertextuality reveals the dialogue between texts, whether through direct allusion, subtle reference, homage, or playful parody. These echoes create layered meaning for attentive readers.", question: "Can you find an allusion to another work in something you've read recently?", grammar: { point: "Whether...or clauses", example: "Whether through allusion or parody, texts reference each other." }, value: "Literary Awareness" },
                19: { title: "World Literature", vocab: ["World literature", "Circulation", "Translation", "Global readership", "Local specificity", "Universal theme", "Reception", "Canon formation"], story: "World literature considers how a text's circulation in translation reaches a global readership, while retaining local specificity. Universal themes aid reception, shaping canon formation over time.", question: "What is a universal theme you've found in literature from another culture?", grammar: { point: "While + contrast clause", example: "While the setting is local, the theme feels universal." }, value: "Global Perspective" },
                20: { title: "Stylistics", vocab: ["Style", "Diction", "Syntax", "Tone", "Imagery", "Register", "Foregrounding", "Effect"], story: "Stylistics examines how diction, syntax and imagery create tone and effect. Writers use foregrounding and shifts in register to draw the reader's attention to key ideas.", question: "How does sentence structure affect the tone of a text?", grammar: {"point": "Noun phrases with prepositions", "example": "The use of short sentences creates a sense of urgency."} },
                21: { title: "Analysing Poetry", vocab: ["Poem", "Stanza", "Metaphor", "Rhythm", "Rhyme", "Enjambment", "Voice", "Interpretation"], story: "Analysing a poem involves attention to stanza, rhythm and rhyme. Metaphor and enjambment shape meaning, and the speaker's voice invites more than one interpretation.", question: "Why can one poem support several interpretations?", grammar: {"point": "Modal verbs for interpretation", "example": "The image might suggest loss, or it could imply renewal."} },
                22: { title: "Drama and Performance", vocab: ["Drama", "Script", "Stage", "Dialogue", "Tension", "Audience", "Performance", "Director"], story: "Drama exists fully only in performance. A director turns a script into stage action, and dialogue builds tension that the audience experiences together.", question: "How does watching a play differ from reading its script?", grammar: {"point": "Only when... inversion", "example": "Only in performance does the play come alive."} },
                23: { title: "Digital Storytelling", vocab: ["Digital", "Narrative", "Interactive", "Platform", "Multimedia", "User", "Branching", "Immersion"], story: "Digital storytelling uses multimedia and interactive platforms. A branching narrative lets the user shape events, creating deep immersion.", question: "How do interactive stories change the role of the reader?", grammar: {"point": "Causative structures (let / allow)", "example": "Branching stories let readers choose the ending."} },
                24: { title: "The Rhetoric of Advertising", vocab: ["Advertising", "Persuasion", "Slogan", "Target audience", "Emotional appeal", "Brand", "Implicit", "Consumer"], story: "Advertising relies on persuasion aimed at a target audience. A memorable slogan and an emotional appeal build a brand, often through implicit messages the consumer barely notices.", question: "Which persuasive techniques do advertisers use most?", grammar: {"point": "Relative clauses (whose / which)", "example": "Brands use slogans which appeal to emotion."} },
                25: { title: "Sociolinguistics", vocab: ["Dialect", "Accent", "Code-switching", "Identity", "Prestige", "Variation", "Community", "Register"], story: "Sociolinguistics studies variation in language across each community. Dialect and accent signal identity, prestige varies between groups, and speakers use code-switching to move between registers.", question: "When do you switch between languages or styles of speaking?", grammar: {"point": "Tend to / be inclined to", "example": "Speakers tend to code-switch in informal settings."} },
                26: { title: "Language Change", vocab: ["Language change", "Borrowing", "Loanword", "Evolution", "Standard", "Slang", "Grammar", "Generation"], story: "Language change is constant. Borrowing brings in each new loanword, slang moves into the standard over time, and even grammar evolves from one generation to the next.", question: "Which new English words have you noticed recently?", grammar: {"point": "Present perfect continuous for trends", "example": "English has been borrowing words for centuries."} },
                27: { title: "Adaptation Studies", vocab: ["Adaptation", "Source text", "Film", "Fidelity", "Interpretation", "Medium", "Audience", "Transformation"], story: "Adaptation studies compare a source text with its film version. Critics now value creative interpretation and transformation across media more than strict fidelity.", question: "Should a film adaptation be faithful to the book?", grammar: {"point": "Comparative structures (the more..., the more...)", "example": "The more faithful the film, the less creative it may be."} },
                28: { title: "Children's Literature", vocab: ["Children's literature", "Picture book", "Moral", "Imagination", "Illustration", "Fairy tale", "Young reader", "Values"], story: "Children's literature, from the fairy tale to the picture book, shapes imagination and values. Illustration and a clear moral help each young reader make sense of the world.", question: "How did the stories you read as a child shape you?", grammar: {"point": "Used to / would for past habits", "example": "Parents would read fairy tales at bedtime."} },
                29: { title: "Review: Reading Critically", vocab: ["Critical reading", "Assumption", "Evidence", "Perspective", "Bias", "Context", "Evaluate", "Interpretation"], story: "Critical reading means identifying each assumption, weighing evidence and considering context. By comparing perspectives and noticing bias, readers evaluate a text and form their own interpretation.", question: "What questions do you ask when reading critically?", grammar: {"point": "Question forms in academic inquiry", "example": "To what extent does the author support this claim?"} },
            }
        };

        // ===== Progress: stars/badges are earned once per activity and remembered =====
        // Saved in this browser when the page is opened as a normal web page. Inside the Hub's
        // secure "Embed Code" box the browser blocks storage, so progress then lasts until the
        // page is closed — but it still can't be farmed by tapping the same button again.
        const PROGRESS_KEY = () => 'c2epe_onlineclass_master_C1_2_progress_' + state.level;
        let progress = { stars: 0, badges: 0, awarded: {}, best: {}, completed: {} };
        function loadProgress() {
            progress = { stars: 0, badges: 0, awarded: {}, best: {}, completed: {} };
            try {
                const saved = JSON.parse(localStorage.getItem(PROGRESS_KEY()) || 'null');
                if (saved && typeof saved === 'object') progress = Object.assign(progress, saved);
            } catch (e) { /* storage not available (e.g. inside the Hub sandbox) */ }
            state.stars = progress.stars; state.badges = progress.badges;
            document.getElementById('star-count').textContent = state.stars;
            document.getElementById('badge-count').textContent = state.badges;
        }
        function saveProgress() {
            progress.stars = state.stars; progress.badges = state.badges;
            try { localStorage.setItem(PROGRESS_KEY(), JSON.stringify(progress)); } catch (e) {}
        }
        const unitKey = (what) => 'u' + state.unit + '|' + what;
        const wasAwarded = (key) => !!progress.awarded[state.level + '|' + key];
        // Gives stars only the first time an activity is done. Returns true if stars were given.
        function award(key, amount) {
            const k = state.level + '|' + key;
            if (progress.awarded[k]) return false;
            progress.awarded[k] = true;
            addStars(amount);
            return true;
        }
        // Shows "(+3 ⭐)" the first time, and a friendly note afterwards
        const starNote = (given, amount) => given ? ` (+${amount} ⭐)` : ' (stars already earned)';

        let enVoice = null;
        function pickVoice() {
            if (!('speechSynthesis' in window)) return;
            enVoice = window.speechSynthesis.getVoices().find(v => v.lang && v.lang.startsWith('en')) || null;
        }
        if ('speechSynthesis' in window) { pickVoice(); window.speechSynthesis.onvoiceschanged = pickVoice; }
        function speak(text, onEnd) {
            if (!('speechSynthesis' in window)) { if (onEnd) onEnd(false); return false; }
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(text);
            u.lang = 'en-US';
            u.rate = 0.9;
            if (!enVoice) pickVoice();
            if (enVoice) u.voice = enVoice;
            if (onEnd) u.onend = () => onEnd(true);
            window.speechSynthesis.speak(u);
            return true;
        }

        function shuffle(arr) {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        // ---------- Pictures ----------
        // When two words in the SAME unit would show the same picture, the second one gets its
        // own picture here (only inside that unit), so children can tell them apart.
        const SAME_UNIT_ALT = {
            "Goodbye": "🚶👋", "Thank you": "💝", "Sorry": "😔", "Respect": "🫡", "Tomorrow": "⏭️",
            "West": "🌇", "East": "🌄", "North": "🧭", "Between": "🥪", "Early": "🐓", "Late": "⏰",
            "Swing": "🎠", "Poster": "🪧"
        };
        function baseEmoji(word) { return WORD_EMOJI[word] || '🖼️'; }
        function emojiFor(word, unitData) {
            const u = unitData || curriculum[state.level][state.unit];
            const e = baseEmoji(word);
            if (u && SAME_UNIT_ALT[word] && u.vocab.some(w => w !== word && baseEmoji(w) === e)) return SAME_UNIT_ALT[word];
            return e;
        }
        // Wrong answers for "look at the picture" questions never share the right answer's
        // picture, so there is always exactly one correct choice.
        function pictureDistractors(correct, pool, unitData, n) {
            const pic = emojiFor(correct, unitData);
            const ok = (w) => w !== correct && emojiFor(w, unitData) !== pic;
            let list = shuffle([...new Set(pool)].filter(ok)).slice(0, n);
            if (list.length < n) {
                const extra = shuffle(allVocabForLevel(state.level).filter(w => ok(w) && !list.includes(w)));
                list = list.concat(extra.slice(0, n - list.length));
            }
            return list;
        }

[252.16, 253.32, "Look at the pattern."], [254.02, 257.6, "The motif, which repeats throughout, reveals deeper meaning."], [258.48, 263.48, "The final chapter, in which the clock is repaired, suggests that healing is possible."], [264.38, 267.97, "The ending is ambiguous, which has divided critics for decades."], [268.93, 282.63, "A non-defining clause adds extra information inside commas; never use 'that' here. 'Which' can also refer to a whole clause: '…, which divided critics'. In formal writing, use 'in which / of which' rather than ending with a preposition."], [283.38, 288.44, "Be careful! Don't say: The clock, that stops early, is a motif."], [290.4, 293.41, "Say: The clock, which stops early, is a motif."], [293.71, 296.32, "Never use 'that' in a non-defining clause."], [297.13, 299.94, "Part four: reading. Read and listen."], [300.73, 302.3, "Reading Beneath the Surface."], [302.6, 307.95, "Literary analysis begins where summary ends, with the question of how a text creates meaning."], [308.93, 314.61, "A motif, which may be as small as a colour or a sound, gains significance each time it returns."], [315.6, 322.09, "Characterization is rarely stated directly; instead, it emerges from dialogue, action and the narrator's tone."], [323.1, 328.22, "Ambiguity, which some readers find frustrating, often invites the richest interpretation."], [329.23, 334.61, "Ultimately, a convincing analysis anchors every claim in specific evidence from the text."], [335.7, 340.03, "Part five: quiz. Five questions. Are you ready?"], [340.88, 342.56, "Choose the correct sentence."], [342.86, 352.14, "A, The clock, that stops early, is a motif.. B, The clock, which stops early, is a motif.. C, The clock which, stops early is a motif.."], [355.7, 359.79, "The answer is B: The clock, which stops early, is a motif.."], [360.95, 364.05, "The ending is ambiguous, blank has divided critics."], [364.35, 367.29, "A, which. B, that. C, what."], [370.83, 372.35, "The answer is A: which."], [373.48, 377.14, "Hints in early chapters that anticipate later events are called blank."], [377.44, 381.4, "A, allegory. B, irony. C, foreshadowing."], [384.93, 387.07, "The answer is C: foreshadowing."], [388.22, 390.22, "Which is the most formal version?"], [390.52, 397.86, "A, the chapter in which the clock is repaired. B, the chapter the clock gets fixed in. C, the chapter where they fix the clock up."], [401.4, 405.16, "The answer is A: the chapter in which the clock is repaired."], [406.32, 410.2, "According to the reading, where does characterization usually come from?"], [410.5, 416.56, "A, direct statements by the author. B, dialogue, action and tone. C, the book's title."], [420.1, 422.69, "The answer is B: dialogue, action and tone."], [423.9, 427.02, "Part six: speaking. It's your turn to talk."], [427.88, 430.35, "How does symbolism enrich a story's meaning?"], [447.15, 448.55, "Now listen to Visal."], [448.85, 486.3, "In my view, symbolism enriches a story because it lets a single image carry ideas that would sound heavy if stated directly. A reader who notices a recurring symbol, which may be as simple as a broken clock, begins to read more actively. For example, in many novels water symbolises both danger and renewal, which creates tension. Admittedly, some readers feel symbols are over-interpreted in class. Even so, I believe symbolism rewards close reading and makes a story memorable."], [486.6, 488.12, "Excellent answer, Visal!"], [489.02, 493.41, "Great work! Now you can use ten new words and relative clauses with which."], [493.71, 497.13, "Today's value is love of reading. Read a book every day."], [497.43, 500.02, "See you in Unit two. Goodbye!"], [500.32, 504.1, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C1B2-Unit02-Scientific-Discourse": [[0.35, 5.59, "Hello, everyone! I'm Ms. Emma. Welcome to Online C one, Book two."], [5.89, 9.28, "Hi! I'm Visal. Let's learn together!"], [9.58, 17.91, "Unit two: Scientific Discourse. Today you will describe obligation, possibility and procedure in science with modal passives."], [18.21, 20.94, "Here is our lesson map. Let's start!"], [21.9, 24.99, "Part one: words. You will learn ten new words."], [25.85, 26.99, "Empirical."], [27.98, 32.25, "Empirical means based on observation or experiment rather than theory alone."], [32.85, 34.86, "The claim lacks empirical support."], [35.45, 37.84, "Your turn. Say: Empirical."], [40.7, 41.76, "Empirical."], [42.52, 43.52, "Replicate."], [44.52, 47.88, "Replicate means to repeat a study to see if the results hold."], [48.48, 50.55, "The findings could not be replicated."], [51.15, 53.55, "Your turn. Say: Replicate."], [56.4, 57.53, "Replicate."], [58.28, 59.24, "Peer-reviewed."], [60.25, 63.97, "Peer-reviewed means checked by independent experts before publication."], [64.58, 67.15, "Cite peer-reviewed journals, not blogs."], [67.75, 70.52, "Your turn. Say: Peer-reviewed."], [73.37, 74.29, "Peer-reviewed."], [75.05, 75.9, "Theory."], [76.92, 80.4, "Theory means a well-tested explanation of natural phenomena."], [81.02, 83.88, "In science, a theory is far more than a guess."], [84.48, 86.74, "Your turn. Say: Theory."], [89.6, 90.26, "Theory."], [91.02, 92.35, "Falsifiable."], [93.35, 96.95, "Falsifiable means capable of being proven wrong by evidence."], [97.55, 100.25, "A scientific claim must be falsifiable."], [100.85, 104.01, "Your turn. Say: Falsifiable."], [106.87, 108.13, "Falsifiable."], [108.88, 109.66, "Rigor."], [110.65, 113.53, "Rigor means strict care and precision in method."], [114.12, 116.26, "The study was praised for its rigor."], [116.85, 119.07, "Your turn. Say: Rigor."], [121.93, 122.71, "Rigor."], [123.45, 124.74, "Consensus."], [125.75, 129.34, "Consensus means general agreement among experts."], [129.95, 132.63, "There is a strong consensus on climate change."], [133.25, 136.25, "Your turn. Say: Consensus."], [139.1, 140.28, "Consensus."], [141.02, 142.06, "Innovation."], [143.05, 146.38, "Innovation uxiliary: acts → does."], [305.43, 307.99, "Part four: reading. Read and listen."], [308.8, 310.18, "No Perfect System."], [310.48, 317.0, "Political scientists rarely ask which system is best; they ask what each system does well and at what cost."], [318.0, 325.13, "Parliamentary systems tend to produce governments more quickly than presidential systems do, since the executive depends on a majority."], [326.13, 332.58, "Federal states, by contrast, protect regional diversity far more effectively than unitary states can."], [333.57, 338.81, "However, every design relies on a political culture that values compromise and the rule of law."], [339.8, 344.64, "Without such a culture, even the most elegant checks and balances can be quietly ignored."], [345.73, 349.92, "Part five: quiz. Five questions. Are you ready?"], [350.78, 354.38, "A unitary state can respond faster than a federal one blank."], [354.69, 357.7, "A, does. B, can. C, is."], [361.23, 362.9, "The answer is B: can."], [364.05, 366.17, "Choose the most precise comparison."], [366.47, 374.04, "A, Coalitions are considerably less stable.. B, Coalitions are very more unstable.. C, Coalitions are much unstable.."], [377.6, 381.31, "The answer is A: Coalitions are considerably less stable.."], [382.45, 385.06, "The authority voters give a government is its blank."], [385.37, 389.36, "A, coalition. B, mandate. C, federalism."], [392.9, 395.1, "The answer is B: mandate."], [396.25, 398.14, "Which collocation is correct?"], [398.44, 403.05, "A, make a coalition. B, form a coalition. C, do a coalition."], [406.6, 409.08, "The answer is B: form a coalition."], [410.22, 413.59, "According to the reading, what do all systems depend on?"], [413.89, 419.95, "A, a strong president. B, a large parliament. C, a political culture of compromise."], [423.5, 427.24, "The answer is C: a political culture of compromise."], [428.43, 431.42, "Part six: speaking. It's your turn to talk."], [432.28, 435.4, "What political system do you think works best, and why?"], [452.18, 453.67, "Now listen to Visal."], [453.97, 489.3, "In my view, a parliamentary democracy with strong checks and balances works best for most countries. It allows a government to act more quickly than a divided presidential system usually can, while still being accountable to parliament. Germany, for example, combines federalism with coalition government and remains remarkably stable. On the other hand, no system works without a political culture of compromise. So the institutions matter, but the habits of citizens matter just as much."], [489.6, 491.25, "Excellent answer, Visal!"], [492.15, 496.45, "Great work! Now you can use ten new words and comparative clauses."], [496.75, 502.06, "Today's value is civic responsibility. Take care of your city, because it is everyone's home."], [502.36, 505.01, "See you in Unit four. Goodbye!"], [505.31, 508.81, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C1B2-Unit04-Economic-Theory": [[0.35, 5.54, "Hello, everyone! I'm Ms. Emma. Welcome to Online C one, Book two."], [5.84, 9.42, "Hi! I'm Visal. Let's learn together!"], [9.72, 17.23, "Unit four: Economic Theory. Today you will condense economic processes into compact abstract noun phrases."], [17.52, 20.25, "Here is our lesson map. Let's start!"], [21.2, 24.26, "Part one: words. You will learn ten new words."], [25.12, 26.29, "Supply-side."], [27.28, 32.35, "Supply-side means focused on boosting production through lower taxes and regulation."], [32.95, 36.68, "Supply-side policies aim to encourage investment."], [37.28, 40.23, "Your turn. Say: Supply-side."], [43.07, 44.39, "Supply-side."], [45.15, 46.33, "Demand-side."], [47.32, 51.51, "Demand-side means focused on boosting spending by consumers and government."], [52.12, 55.31, "Demand-side stimulus was used during the recession."], [55.92, 58.33, "Your turn. Say: Demand-side."], [61.17, 62.83, "Demand-side."], [63.58, 64.88, "Fiscal policy."], [65.88, 70.48, "Fiscal policy means government decisions on taxes and public spending."], [71.08, 73.85, "Fiscal policy was tightened to cut the deficit."], [74.45, 77.23, "Your turn. Say: Fiscal policy."], [80.07, 81.53, "Fiscal policy."], [82.28, 83.91, "Monetary policy."], [84.92, 89.7, "Monetary policy means central-bank control of interest rates and money supply."], [90.32, 93.5, "Monetary policy reacts to rising inflation."], [94.12, 97.13, "Your turn. Say: Monetary policy."], [99.97, 101.47, "Monetary policy."], [102.22, 103.82, "Market equilibrium."], [104.82, 108.47, "Market equilibrium means the point where supply equals demand."], [109.05, 112.16, "Prices adjust until the market reaches equilibrium."], [112.75, 115.87, "Your turn. Say: Market equilibrium."], [118.73, 120.52, "Market equilibrium."], [121.28, 122.68, "Externality."], [123.68, 128.61, "Externality means a cost or benefit that affects people outside a transaction."], [129.22, 131.94, "Pollution is a classic negative externality."], [132.55, 135.11, "Your turn. Say: Externality."], [137.97, 139.33, "Externality."], [140.08, 141.78, "Opportunity cost."], [142.78, 147.12, "Opportunity cost means the value of the best alternative you give up."], [147.72, 150.69, "The opportunity cost of university is lost income."], [151.28, 154.86, "Your turn. Say: Opportunity cost."], [157.7, 159.33, "Opportunity cost."], [160.08, 161.49, "Economic model."], [162.48, 166.9, "Economic model means a simplified representation of how an economy works."], [167.48, 170.15, "Every economic model rests on assumptions."], [170.75, 173.76, "Your turn. Say: Economic model."], [176.6, 178.08, "Economic model."], [178.82, 180.1, "Inflation rate."], [181.08, 184.89, "Inflation rate means the percentage increase in prices over a year."], [185.48, 187.95, "The inflation rate rose to six per cent."], [188.55, 191.29, "Your turn. Say: Inflation rate."], [194.13, 195.55, "Inflation rate."], [196.32, 197.31, "Recession."], [198.32, 202.13, "Recession means a significant decline in economic activity."], [202.72, 205.38, "The recession led to widespread job losses."], [205.98, 209.01, "Your turn. Say: Recession."], [211.87, 213.0, "Recession."], [213.8, 217.14, "Part two: dialogue. Let's listen to a conversation."], [217.98, 224.69, "Visal, your essay says 'when supply and demand balance, the price is set'. Could you make that more academic?"], [225.78, 235.43, "Yes: the equilibrium of supply and demand determines price. The process becomes a noun phrase, so the sentence is shorter and more formal."], [236.52, 240.34, "Good. Now explain why the central bank raised interest rates."], [241.45, 250.14, "The persistent rise in the inflation rate prompted a tightening of monetary policy, in order to cool consumer demand."], [251.25, 252.43, "And the critics?"], [253.52, 262.06, "They argue that the reduction in borrowing could trigger a recession, so the opportunity cost of fighting inflation might be very high."], [263.2, 264.55, "Part three: grammar."], [265.38, 268.22, "Grammar focus: Abstract nominalization."], [268.52, 269.72, "Look at the pattern."], [270.42, 273.72, "The equilibrium of supply and demand determines price."], [274.62, 278.56, "The persistent rise in the inflation rate prompted a change in policy."], [279.45, 282.34, "A reduction in borrowing could trigger a recession."], [283.3, 294.23, "Turn clauses into noun phrases: 'prices rose steadily' → 'the steady rise in prices'. Note the prepositions: a rise / fall / reduction IN something; the effect OF something."], [294.98, 299.17, "Be careful! Don't say: The rise of inflation rate worried investors."], [301.13, 305.0, "Say: The rise in the inflation rate worried investors."], [305.3, 307.05, "Use 'a rise in' something."], [307.83, 310.32, "Part four: reading. Read and listen."], [311.13, 312.74, "Models and Reality."], [313.04, 318.23, "Every economic model simplifies reality in order to explain one relationship clearly."], [319.23, 325.05, "The assumption of rational consumers, for example, allows economists to predict the effect of a price change."], [326.07, 331.97, "Yet the persistence of financial crises suggests that such assumptions are, at best, approximations."], [332.97, 339.51, "Externalities further complicate the picture, since the true cost of production is often borne by third parties."], [340.5, 346.94, "Consequently, the value of a model lies less in its accuracy than in the questions it allows us to ask."], [348.03, 351.99, "Part five: quiz. Five questions. Are you ready?"], [352.85, 356.13, "Choose the nominalized version of 'prices rose sharply'."], [356.43, 362.44, "A, prices' sharp rising. B, the sharply rise of prices. C, the sharp rise in prices."], [366.0, 368.89, "The answer is C: the sharp rise in prices."], [370.05, 373.0, "A blank in interest rates usually reduces borrowing."], [373.3, 376.77, "A, rise. B, rising up. C, raise up."], [380.33, 382.36, "The answer is A: rise."], [383.52, 386.44, "The value of the best alternative you give up is the blank."], [386.75, 391.73, "A, externality. B, opportunity cost. C, equilibrium."], [395.3, 398.02, "The answer is B: opportunity cost."], [399.18, 402.92, "Pollution that harms nearby residents is an example of a negative blank."], [403.22, 407.68, "A, externality. B, recession. C, mandate."], [411.23, 413.74, "The answer is A: externality."], [414.88, 418.76, "According to the reading, a model's value lies mainly in…"], [419.06, 425.1, "A, its perfect accuracy. B, the questions it lets us ask. C, its rational consumers."], [428.63, 431.45, "The answer is B: the questions it lets us ask."], [432.63, 435.67, "Part six: speaking. It's your turn to talk."], [436.52, 439.65, "Which economic theory do you find most convincing?"], [456.45, 457.87, "Now listen to Visal."], [458.17, 492.4, "Personally, I find a balanced Keynesian approach the most convincing. During a recession, the collapse in private spending can be offset by government investment, which protects jobs. The response to the 2008 crisis, for instance, showed how fiscal stimulus can shorten a downturn. Supply-side economists argue, however, that high public spending leads to debt and weak growth later. I accept that risk, but I believe stability should come first in a crisis."], [492.7, 494.53, "Excellent answer, Visal!"], [495.45, 500.19, "Great work! Now you can use ten new words and abstract nominalization."], [500.49, 506.5, "Today's value is economic awareness. Understand how money and work affect your life choices."], [506.8, 509.23, "See you in Unit five. Goodbye!"], [509.53, 512.36, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C1B2-Unit05-Advanced-Rhetoric": [[0.35, 5.2, "Hello, everyone! I'm Ms. Emma. Welcome to Online C one, Book two."], [5.5, 9.15, "Hi! I'm Visal. Let's learn together!"], [9.45, 16.31, "Unit five: Advanced Rhetoric. Today you will build sophisticated arguments with layered subordinate clauses."], [16.61, 19.07, "Here is our lesson map. Let's start!"], [20.03, 23.45, "Part one: words. You will learn ten new words."], [24.32, 25.47, "Syllogism."], [26.48, 30.34, "Syllogism means an argument with two premises leading to a conclusion."], [30.95, 36.22, "All humans are mortal; Socrates is human; so he is mortal: a classic syllogism."], [36.82, 39.49, "Your turn. Say: Syllogism."], [42.33, 43.45, "Syllogism."], [44.22, 45.29, "Anaphora."], [46.28, 50.72, "Anaphora means repetition of a word or phrase at the start of successive clauses."], [51.32, 54.34, "'We shall fight…, we shall fight…' is a famous anaphora."], [54.95, 57.82, "Your turn. Say: Anaphora."], [60.67, 61.75, "Anaphora."], [62.48, 63.53, "Hyperbole."], [64.52, 67.68, "Hyperbole means deliberate exaggeration for effect."], [68.28, 70.76, "'I've told you a million times' is hyperbole."], [71.35, 74.18, "Your turn. Say: Hyperbole."], [77.03, 78.16, "Hyperbole."], [78.92, 80.34, "Rhetorical question."], [81.35, 85.54, "Rhetorical question means a question asked for effect, not for an answer."], [86.15, 89.55, "'Who wouldn't want a fairer world?' is a rhetorical question."], [90.15, 93.0, "Your turn. Say: Rhetorical question."], [95.83, 97.3, "Rhetorical question."], [98.05, 99.53, "Persuasive structure."], [100.52, 104.63, "Persuasive structure means the order in which arguments are arranged to convince."], [105.22, 108.69, "Her persuasive structure saved the strongest point for last."], [109.28, 112.84, "Your turn. Say: Persuasive structure."], [115.7, 117.36, "Persuasive structure."], [118.12, 119.07, "Tone shift."], [120.08, 124.11, "Tone shift means a deliberate change in attitude within a text or speech."], [124.72, 127.63, "The tone shift from anger to hope moved the audience."], [128.25, 131.16, "Your turn. Say: Tone shift."], [134.0, 135.13, "Tone shift."], [135.88, 137.1, "Audience appeal."], [138.12, 142.62, "Audience appeal means the way a speaker connects with listeners' values or emotions."], [143.22, 146.06, "His audience appeal relied on shared memories."], [146.65, 149.41, "Your turn. Say: Audience appeal."], [152.27, 153.75, "Audience appeal."], [154.52, 156.07, "Discursive strategy."], [157.08, 161.22, "Discursive strategy means a deliberate way of using language to shape meaning."], [161.82, 164.68, "Repetition is a common discursive strategy."], [165.28, 168.38, "Your turn. Say: Discursive strategy."], [171.23, 172.9, "Discursive strategy."], [173.65, 174.44, "Diction."], [175.45, 178.25, "Diction means the choice of words in speech or writing."], [178.85, 181.15, "Formal diction suited the solemn occasion."], [181.75, 184.21, "Your turn. Say: Diction."], [187.07, 187.94, "Diction."], [188.68, 189.67, "Cadence."], [190.68, 193.71, "Cadence means the rhythm and rise and fall of speech."], [194.32, 197.63, "The speech's cadence built steadily to a climax."], [198.22, 200.72, "Your turn. Say: Cadence."], [203.57, 204.53, "Cadence."], [205.33, 209.11, "Part two: dialogue. Let's listen to a conversation."], [209.95, 214.69, "Visal, you analysed a famous speech for homework. What made it so persuasive?"], [215.78, 223.8, "Because the speaker built his argument as a clear syllogism, the audience accepted the conclusion before he even stated it."], [224.88, 226.96, "Was logic the only thing at work?"], [228.05, 236.83, "Not at all. Although the logic was sound, it was the anaphora and the slow cadence that made people remember every line."], [237.92, 240.21, "Some critics call that manipulation."], [241.32, 252.28, "It can be, if rhetoric replaces evidence. However, when emotion is used to support a well-founded claim, I see it as legitimate persuasion."], [253.43, 255.36, "Part three: grammar."], [256.22, 259.41, "Grammar focus: Complex subordination."], [259.71, 260.9, "Look at the pattern."], [261.58, 265.05, "Because the syllogism was logical, the audience was persuaded."], [265.95, 269.66, "Although the logic was sound, it was the cadence that people remembered."], [270.55, 275.53, "When emotion is used to support a well-founded claim, persuasion becomes legitimate."], [276.47, 286.97, "C1 writers stack clauses to show how ideas depend on each other. Place the subordinate clause first for emphasis and follow it with a comma; avoid 'although … but' in the same sentence."], [287.72, 291.83, "Be careful! Don't say: Although the logic was sound, but it failed."], [293.77, 296.45, "Say: Although the logic was sound, it failed."], [296.75, 298.47, "Do not use 'but' after 'although'."], [299.27, 301.98, "Part four: reading. Read and listen."], [302.77, 304.07, "The Three Appeals."], [304.37, 310.56, "Since Aristotle, rhetoric has been described in terms of three appeals: logos, ethos and pathos."], [311.57, 316.11, "Logos persuades through reasoning, as when a speaker constructs a clear syllogism."], [317.1, 322.62, "Ethos depends on credibility, which is why speakers often begin by establishing their experience."], [323.63, 328.64, "Pathos, although frequently criticised, can make abstract arguments feel urgent and human."], [329.63, 335.84, "The most persuasive speakers combine all three, so that the audience is convinced intellectually and moved emotionally."], [336.93, 340.85, "Part five: quiz. Five questions. Are you ready?"], [341.72, 343.47, "Choose the correct sentence."], [343.77, 352.56, "A, Although the logic was sound, but it failed.. B, Although the logic was sound, it failed to move people.. C, Although sound logic, it failed.."], [356.1, 360.15, "The answer is B: Although the logic was sound, it failed to move people.."], [361.32, 365.09, "'We will build, we will teach, we will heal' is an example of blank."], [365.39, 369.7, "A, hyperbole. B, syllogism. C, anaphora."], [373.23, 375.5, "The answer is C: anaphora."], [376.65, 378.82, "Which phrase means 'the choice of words'?"], [379.12, 382.77, "A, diction. B, cadence. C, tone shift."], [386.3, 387.97, "The answer is A: diction."], [389.12, 392.37, "blank the evidence was weak, the speech still won applause."], [392.67, 396.8, "A, Even though. B, Despite. C, Because of."], [400.33, 402.34, "The answer is A: Even though."], [403.48, 406.13, "According to the reading, ethos depends on…"], [406.43, 410.49, "A, emotion. B, credibility. C, statistics."], [414.03, 416.44, "The answer is B: credibility."], [417.63, 420.6, "Part six: speaking. It's your turn to talk."], [421.45, 424.56, "What rhetorical technique do you find most persuasive?"], [441.35, 442.8, "Now listen to Visal."], [443.1, 477.3, "For me, the most persuasive technique is a well-chosen example that appeals to both logic and emotion. When a speaker supports a statistic with one real person's story, the audience understands the problem and also cares about it. For example, a campaign about road safety is far more powerful if it tells the story of a single family. Some would argue that this is emotional manipulation. However, as long as the example is true and representative, I believe it is honest persuasion."], [477.6, 479.32, "Excellent answer, Visal!"], [480.22, 484.59, "Great work! Now you can use ten new words and complex subordination."], [484.89, 489.04, "Today's value is communication. Speak clearly and listen carefully."], [489.34, 491.98, "See you in Unit six. Goodbye!"], [492.28, 495.12, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C1B2-Unit06-Narrative-Theory": [[0.35, 5.18, "Hello, everyone! I'm Ms. Emma. Welcome to Online C one, Book two."], [5.48, 9.13, "Hi! I'm Visal. Let's learn together!"], [9.43, 16.67, "Unit six: Narrative Theory. Today you will contrast surface appearances with hidden truths using concessive clauses."], [16.97, 19.76, "Here is our lesson map. Let's start!"], [20.7, 24.05, "Part one: words. You will learn eight new words."], [24.88, 25.9, "Narrator."], [26.88, 29.46, "Narrator means the voice that tells the story."], [30.05, 33.28, "The narrator is a child who misunderstands adult events."], [33.88, 36.45, "Your turn. Say: Narrator."], [39.3, 40.23, "Narrator."], [40.98, 42.12, "Plot structure."], [43.12, 46.03, "Plot structure means the arrangement of events in a story."], [46.65, 49.64, "The plot structure follows a classic five-act pattern."], [50.25, 53.11, "Your turn. Say: Plot structure."], [55.97, 57.22, "Plot structure."], [57.98, 58.91, "Point of view."], [59.92, 63.11, "Point of view means the perspective from which a story is told."], [63.72, 66.76, "Switching point of view reveals each character's motives."], [67.35, 70.27, "Your turn. Say: Point of view."], [73.13, 74.26, "Point of view."], [75.02, 76.09, "Chronology."], [77.08, 80.17, "Chronology means the order in which events actually happen."], [80.78, 83.97, "The novel breaks chronology with frequent flashbacks."], [84.58, 86.99, "Your turn. Say: Chronology."], [89.83, 90.94, "Chronology."], [91.68, 93.04, "Frame narrative."], [94.05, 97.54, "Frame narrative means a story placed inside another story."], [98.15, 101.0, "Frankenstein uses letters as a frame narrative."], [101.58, 104.39, "Your turn. Say: Frame narrative."], [107.23, 108.59, "Frame narrative."], [109.35, 110.27, "Voice."], [111.28, 114.95, "Voice means the distinctive style and personality of a narrator."], [115.55, 117.69, "Her narrative voice is witty but sad."], [118.28, 121.1, "Your turn. Say: Voice."], [123.93, 124.8, "Voice."], [125.55, 126.27, "Arc."], [127.28, 130.94, "Arc means the development of a character or plot from start to end."], [131.55, 134.18, "The hero's arc moves from pride to humility."], [134.78, 136.56, "Your turn. Say: Arc."], [139.4, 140.11, "Arc."], [140.85, 142.38, "Unreliable narrator."], [143.38, 147.45, "Unreliable narrator means a narrator whose account cannot be fully trusted."], [148.05, 150.58, "The twist reveals an unreliable narrator."], [151.18, 154.42, "Your turn. Say: Unreliable narrator."], [157.27, 158.92, "Unreliable narrator."], [159.73, 163.21, "Part two: dialogue. Let's listen to a conversation."], [164.05, 166.91, "Visal, did you trust the narrator of the novel we read?"], [168.02, 176.75, "At first I did. Although the narrator seems trustworthy, small contradictions suggest that he is hiding his own guilt."], [177.85, 179.65, "What kind of contradictions?"], [180.75, 187.24, "He claims he was never at the house, even though he describes its kitchen in precise detail in chapter nine."], [188.35, 190.35, "So how does that change your reading?"], [191.45, 200.73, "It turns a simple crime story into a study of self-deception. Much as I sympathised with him, I had to reread every scene with suspicion."], [201.87, 203.99, "Part three: grammar."], [204.85, 208.87, "Grammar focus: Concessive clauses (although and even though)."], [209.17, 210.39, "Look at the pattern."], [211.08, 214.97, "Although the narrator seems trustworthy, clues suggest otherwise."], [215.88, 219.65, "Even though he denies being there, he describes the kitchen in detail."], [220.55, 223.71, "Much as I sympathised with him, I could not trust his account."], [224.67, 235.63, "'Even though' is stronger than 'although' and introduces a known fact. 'Much as' (= although very much) is formal and used with verbs of feeling: 'Much as I admire her…'. Never add 'but' after the concessive clause."], [236.38, 239.99, "Be careful! Don't say: Even he denied it, he was there."], [241.93, 244.68, "Say: Even though he denied it, he was there."], [244.98, 246.97, "Use 'even though', not 'even' alone."], [247.77, 250.48, "Part four: reading. Read and listen."], [251.27, 252.9, "Who Is Telling the Story?."], [253.19, 258.38, "Every story is filtered through a point of view, and that filter shapes what readers believe."], [259.37, 265.06, "A first-person narrator offers intimacy, although this intimacy comes at the cost of objectivity."], [266.07, 270.98, "When chronology is broken by flashbacks, readers must reconstruct events for themselves."], [271.97, 277.44, "The unreliable narrator exploits this process, encouraging trust before gradually undermining it."], [278.43, 285.01, "Even though such narrators deceive us, they often reveal deeper truths about memory and self-justification."], [286.1, 289.97, "Part five: quiz. Five questions. Are you ready?"], [290.82, 292.53, "Choose the correct sentence."], [292.83, 301.01, "A, Even though he denied it, but he was there.. B, Even though he denied it, he was there.. C, Even he denied it, he was there.."], [304.57, 308.38, "The answer is B: Even though he denied it, he was there.."], [309.52, 312.6, "blank I admire the author, I found the ending weak."], [312.9, 316.5, "A, Much as. B, Despite. C, However."], [320.07, 321.8, "The answer is A: Much as."], [322.95, 325.79, "A story told inside another story is a blank."], [326.08, 330.68, "A, frame narrative. B, plot arc. C, chronology."], [334.23, 336.66, "The answer is A: frame narrative."], [337.82, 341.14, "Which word means 'the order in which events really happen'?"], [341.44, 345.05, "A, voice. B, arc. C, chronology."], [348.6, 350.53, "The answer is C: chronology."], [351.68, 355.82, "According to the reading, what does a first-person narrator sacrifice?"], [356.12, 360.0, "A, intimacy. B, objectivity. C, chronology."], [363.57, 366.22, "The answer is B: objectivity."], [367.4, 370.68, "Part six: speaking. It's your turn to talk."], [371.52, 374.91, "How does an unreliable narrator change the way we read a story?"], [391.72, 393.16, "Now listen to Visal."], [393.46, 427.23, "In my opinion, an unreliable narrator turns reading into a kind of investigation. Although we usually trust the person telling the story, we gradually start to question every detail. For example, when a narrator contradicts himself, we reread earlier scenes and notice clues we had missed. Some readers dislike this because it feels like a trick. Even so, I think it makes us more active, critical readers, which is valuable well beyond literature."], [427.53, 429.29, "Excellent answer, Visal!"], [430.18, 435.08, "Great work! Now you can use eight new words and concessive clauses (although and even though)."], [435.38, 440.2, "Today's value is interpretive depth. Read slowly and look for more than one meaning."], [440.5, 443.23, "See you in Unit seven. Goodbye!"], [443.53, 446.19, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C1B2-Unit07-Postmodern-Criticism": [[0.35, 5.36, "Hello, everyone! I'm Ms. Emma. Welcome to Online C one, Book two."], [5.66, 9.26, "Hi! I'm Visal. Let's learn together!"], [9.56, 17.32, "Unit seven: Postmodern Criticism. Today you will discuss abstract literary ideas with dense nominal groups."], [17.62, 20.17, "Here is our lesson map. Let's start!"], [21.1, 24.41, "Part one: words. You will learn eight new words."], [25.25, 26.48, "Postmodernism."], [27.48, 33.16, "Postmodernism means a late-20th-century movement sceptical of grand narratives and fixed meaning."], [33.75, 36.88, "Postmodernism questions the idea of a single truth."], [37.48, 40.15, "Your turn. Say: Postmodernism."], [43.0, 44.26, "Postmodernism."], [45.02, 46.28, "Fragmentation."], [47.28, 51.88, "Fragmentation means the breaking of a text or experience into separate pieces."], [52.48, 55.66, "The fragmentation of the plot mirrors the hero's confusion."], [56.25, 59.47, "Your turn. Say: Fragmentation."], [62.33, 63.57, "Fragmentation."], [64.32, 65.34, "Metafiction."], [66.35, 70.47, "Metafiction means fiction that draws attention to its own status as fiction."], [71.08, 74.65, "The novel becomes metafiction when the author appears as a character."], [75.25, 78.05, "Your turn. Say: Metafiction."], [80.9, 81.97, "Metafiction."], [82.72, 83.71, "Pastiche."], [84.72, 88.41, "Pastiche means a work that imitates or mixes earlier styles."], [89.02, 92.82, "The film is a pastiche of 1950s thrillers."], [93.42, 96.19, "Your turn. Say: Pastiche."], [99.03, 99.9, "Pastiche."], [100.65, 101.51, "Irony."], [102.52, 106.14, "Irony means a gap between surface meaning and intended meaning."], [106.75, 109.48, "Postmodern irony makes sincerity difficult."], [110.08, 112.48, "Your turn. Say: Irony."], [115.33, 116.3, "Irony."], [117.05, 118.25, "Deconstruction."], [119.25, 123.54, "Deconstruction means a method that exposes hidden contradictions in a text."], [124.15, 127.89, "Deconstruction shows how the text undermines its own claims."], [128.48, 131.44, "Your turn. Say: Deconstruction."], [134.3, 135.62, "Deconstruction."], [136.35, 137.46, "Ambiguity."], [138.45, 141.44, "Ambiguity means openness to several meanings."], [142.05, 144.95, "The deliberate ambiguity resists a single reading."], [145.55, 148.32, "Your turn. Say: Ambiguity."], [151.17, 152.26, "Ambiguity."], [153.02, 154.3, "Self-reference."], [155.28, 158.41, "Self-reference means a text referring to itself."], [159.02, 161.56, "The book's self-reference reminds us we are reading."], [162.15, 165.05, "Your turn. Say: Self-reference."], [167.9, 170.0, "Self-reference."], [170.8, 174.53, "Part two: dialogue. Let's listen to a conversation."], [175.38, 180.18, "Visal, the novel you chose keeps interrupting itself. Isn't that just confusing?"], [181.28, 190.47, "It is deliberate. The fragmentation of the narrative reflects the uncertainty of modern life, where no single story explains everything."], [191.58, 194.53, "And the moment when the author addresses the reader directly?"], [195.65, 204.35, "That's metafiction. The constant self-reference forces us to recognise the artificiality of all storytelling."], [205.45, 208.58, "Some critics say postmodernism is just clever games."], [209.68, 220.0, "There is a danger of empty irony, I admit. But at its best, the questioning of grand narratives exposes who has the power to tell stories."], [221.13, 222.66, "Part three: grammar."], [223.52, 225.97, "Grammar focus: Nominalization."], [226.27, 227.4, "Look at the pattern."], [228.08, 231.42, "The fragmentation of the narrative reflects modern uncertainty."], [232.32, 236.77, "The constant self-reference of the text exposes the artificiality of storytelling."], [237.65, 240.95, "The questioning of grand narratives reveals who holds power."], [241.9, 251.91, "In criticism, nominal groups can be long: determiner + adjective + noun + 'of' phrase. Keep the main verb close to the head noun so the reader does not get lost."], [252.65, 257.47, "Be careful! Don't say: The fragmentate of the plot reflects chaos."], [259.43, 263.26, "Say: The fragmentation of the plot reflects chaos."], [263.56, 265.8, "Use the noun form: fragmentation."], [266.6, 269.01, "Part four: reading. Read and listen."], [269.8, 271.69, "After the Grand Narratives."], [272.0, 278.21, "Postmodern criticism emerged from a growing distrust of 'grand narratives' that claim to explain all of history."], [279.2, 286.81, "Its favoured techniques, among them pastiche, metafiction and fragmentation, deliberately disrupt the reader's expectations."], [287.8, 292.95, "The refusal of a fixed meaning is not mere playfulness; it is a challenge to authority."], [293.93, 299.64, "Deconstruction, for example, reveals how texts depend on the very oppositions they claim to reject."], [300.63, 304.94, "Critics argue, however, that relentless irony can leave readers with nothing to believe in."], [306.03, 309.69, "Part five: quiz. Five questions. Are you ready?"], [310.55, 312.48, "Choose the best nominal phrase."], [312.78, 320.19, "A, the narrative's fragmenting of itself. B, the fragmentation of the narrative. C, the narrative fragmentationly."], [323.73, 327.11, "The answer is B: the fragmentation of the narrative."], [328.25, 331.64, "Fiction that reminds readers it is fiction is called blank."], [331.94, 335.7, "A, metafiction. B, pastiche. C, allegory."], [339.27, 341.52, "The answer is A: metafiction."], [342.68, 345.93, "A film that imitates several old styles is a blank."], [346.23, 350.37, "A, paradigm. B, deconstruction. C, pastiche."], [353.9, 355.87, "The answer is C: pastiche."], [357.02, 358.85, "Which collocation is natural?"], [359.15, 364.67, "A, expose a contradiction. B, do a contradiction. C, make up a contradiction."], [368.2, 370.66, "The answer is A: expose a contradiction."], [371.82, 375.37, "According to the reading, what do critics say about relentless irony?"], [375.67, 382.39, "A, It explains all of history.. B, It can leave readers with nothing to believe in.. C, It strengthens authority.."], [385.93, 389.58, "The answer is B: It can leave readers with nothing to believe in.."], [390.77, 393.97, "Part six: speaking. It's your turn to talk."], [394.82, 397.72, "What is one example of metafiction you have encountered?"], [414.52, 416.0, "Now listen to Visal."], [416.31, 447.13, "One clear example of metafiction I have encountered is a film in which a character suddenly looks at the camera and speaks to the audience. The breaking of the illusion made me laugh, but it also made me think about how stories manipulate us. In some novels, too, the narrator admits that he is inventing the events. A few viewers find this distracting. Personally, I think it encourages a more critical awareness of every story we consume."], [447.43, 449.2, "Excellent answer, Visal!"], [450.08, 453.86, "Great work! Now you can use eight new words and nominalization."], [454.16, 460.03, "Today's value is critical awareness. Use technology wisely, and always think for yourself."], [460.33, 462.89, "See you in Unit eight. Goodbye!"], [463.19, 465.55, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C1B2-Unit08-Genre-Studies": [[0.35, 5.41, "Hello, everyone! I'm Ms. Emma. Welcome to Online C one, Book two."], [5.71, 8.87, "Hi! I'm Visal. Let's learn together!"], [9.17, 16.39, "Unit eight: Genre Studies. Today you will define and classify texts precisely with defining relative clauses."], [16.69, 19.36, "Here is our lesson map. Let's start!"], [20.3, 23.53, "Part one: words. You will learn eight new words."], [24.38, 25.34, "Genre."], [26.35, 30.25, "Genre means a category of texts sharing style, form or subject."], [30.85, 34.65, "Science fiction is a genre that imagines possible futures."], [35.25, 37.7, "Your turn. Say: Genre."], [40.57, 41.5, "Genre."], [42.25, 43.33, "Convention."], [44.32, 48.02, "Convention means an established feature readers expect in a genre."], [48.62, 51.71, "A detective who solves the crime is a genre convention."], [52.32, 54.68, "Your turn. Say: Convention."], [57.53, 58.49, "Convention."], [59.25, 60.3, "Hybridity."], [61.28, 64.49, "Hybridity means the mixing of different genres or forms."], [65.08, 68.03, "The novel's hybridity blends memoir and fantasy."], [68.65, 71.39, "Your turn. Say: Hybridity."], [74.23, 75.16, "Hybridity."], [75.92, 76.92, "Subversion."], [77.92, 81.1, "Subversion means the undermining of expected patterns."], [81.72, 85.24, "The film's subversion of the hero myth surprised audiences."], [85.85, 88.21, "Your turn. Say: Subversion."], [91.07, 92.35, "Subversion."], [93.08, 94.1, "Archetype."], [95.08, 99.03, "Archetype means a universal model of a character or situation."], [99.65, 101.88, "The wise mentor is a familiar archetype."], [102.48, 104.97, "Your turn. Say: Archetype."], [107.83, 108.81, "Archetype."], [109.55, 110.1, "Trope."], [111.08, 113.78, "Trope means a commonly used theme or device."], [114.38, 117.21, "The 'chosen one' trope appears in countless fantasies."], [117.82, 120.24, "Your turn. Say: Trope."], [123.1, 123.87, "Trope."], [124.62, 125.79, "Classification."], [126.78, 130.38, "Classification means the act of arranging things into categories."], [130.98, 134.21, "Classification by genre helps libraries and readers."], [134.82, 137.63, "Your turn. Say: Classification."], [140.47, 141.79, "Classification."], [142.55, 143.8, "Expectation."], [144.78, 148.69, "Expectation means what readers anticipate based on experience."], [149.28, 151.7, "The twist defies every expectation."], [152.32, 154.91, "Your turn. Say: Expectation."], [157.77, 158.98, "Expectation."], [159.77, 163.58, "Part two: dialogue. Let's listen to a conversation."], [164.42, 168.28, "Visal, how would you define the film we watched? Horror or comedy?"], [169.38, 178.49, "Neither, strictly. It's a genre that blends horror and comedy, and that hybridity is exactly what subverts our expectations."], [179.58, 181.8, "Give me an example of that subversion."], [182.92, 191.41, "The character who would normally die first, the cheerful best friend, is the one who survives and rescues everyone."], [192.52, 194.91, "Do you think genre labels are still useful?"], [196.02, 203.63, "As starting points, yes. A writer who knows the conventions well is the one who can break them most effectively."], [204.77, 206.43, "Part three: grammar."], [207.28, 211.21, "Grammar focus: Relative clauses defining categories."], [211.51, 212.72, "Look at the pattern."], [213.42, 216.89, "A genre that blends horror and comedy subverts expectation."], [217.78, 220.61, "The character who would normally die first survives."], [221.52, 224.65, "A writer who knows the conventions can break them effectively."], [225.6, 235.84, "Defining clauses identify which item or category we mean, so they take no commas. Use 'that' or 'which' for things, 'who' for people; in defining clauses 'that' is the more neutral choice."], [236.58, 241.28, "Be careful! Don't say: A genre who blends horror and comedy."], [243.23, 246.57, "Say: A genre that blends horror and comedy."], [246.87, 248.79, "Use 'that' or 'which' for things."], [249.6, 252.03, "Part four: reading. Read and listen."], [252.83, 254.21, "Why Genres Matter."], [254.51, 258.42, "Genres function as unwritten contracts between writers and readers."], [259.43, 264.66, "A reader who opens a detective novel expects a crime, a set of clues and, eventually, a solution."], [265.67, 271.54, "Conventions that seem rigid, however, are constantly renegotiated as writers experiment with hybrid forms."], [272.53, 277.62, "The most memorable works are often those that honour a genre's archetypes while quietly subverting them."], [278.63, 283.58, "Classification, therefore, is less a set of fixed boxes than a map that keeps being redrawn."], [284.67, 288.36, "Part five: quiz. Five questions. Are you ready?"], [289.22, 291.25, "Choose the correct defining clause."], [291.55, 299.11, "A, A writer, who knows the rules, can break them.. B, A writer who knows the rules can break them.. C, A writer which knows the rules can break them.."], [302.67, 306.43, "The answer is B: A writer who knows the rules can break them.."], [307.58, 309.9, "The wise old mentor is a classic blank."], [310.2, 313.95, "A, archetype. B, hybridity. C, subversion."], [317.5, 319.37, "The answer is A: archetype."], [320.52, 324.04, "A story blank mixes memoir and fantasy shows hybridity."], [324.34, 327.18, "A, who. B, what. C, that."], [330.73, 332.77, "The answer is C: that."], [333.92, 335.88, "Which collocation is correct?"], [336.18, 342.31, "A, defy expectations. B, deny expectations. C, defeat expectations."], [345.87, 348.63, "The answer is A: defy expectations."], [349.78, 352.51, "According to the reading, genres function as…"], [352.81, 357.78, "A, fixed boxes. B, unwritten contracts. C, strict laws."], [361.33, 364.13, "The answer is B: unwritten contracts."], [365.33, 368.39, "Part six: speaking. It's your turn to talk."], [369.25, 372.61, "Can you think of a story that subverts genre expectations?"], [389.42, 391.03, "Now listen to Visal."], [391.33, 424.5, "One story that subverts genre expectations is a fairy-tale film in which the princess rescues herself instead of waiting for a prince. Viewers who expect a traditional romance are surprised when friendship, not marriage, becomes the happy ending. This subversion works because the film first follows the familiar conventions closely. Some people feel such twists have become a trope themselves. Even so, I think they show how genres can evolve to reflect new values."], [424.8, 426.49, "Excellent answer, Visal!"], [427.38, 432.47, "Great work! Now you can use eight new words and relative clauses defining categories."], [432.77, 438.26, "Today's value is creative flexibility. Know the rules well, then bend them with purpose."], [438.56, 441.05, "See you in Unit nine. Goodbye!"], [441.35, 444.84, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C1B2-Unit09-Translation-Theory": [[0.35, 5.28, "Hello, everyone! I'm Ms. Emma. Welcome to Online C one, Book two."], [5.58, 8.97, "Hi! I'm Visal. Let's learn together!"], [9.27, 17.04, "Unit nine: Translation Theory. Today you will discuss possibility and obligation in translation with modal passives."], [17.34, 20.06, "Here is our lesson map. Let's start!"], [21.0, 24.08, "Part one: words. You will learn eight new words."], [24.92, 25.88, "Fidelity."], [26.88, 29.94, "Fidelity means faithfulness to the original text."], [30.55, 34.09, "Perfect fidelity can make a translation sound unnatural."], [34.68, 37.97, "Your turn. Say: Fidelity."], [40.83, 41.86, "Fidelity."], [42.62, 43.84, "Equivalence."], [44.85, 49.41, "Equivalence means the effect of producing the same meaning or impact in another language."], [50.02, 53.25, "Translators look for equivalence of effect, not of words."], [53.85, 56.94, "Your turn. Say: Equivalence."], [59.8, 61.05, "Equivalence."], [61.78, 63.08, "Untranslatable."], [64.08, 68.13, "Untranslatable means impossible to express fully in another language."], [68.72, 71.64, "The Khmer word is often called untranslatable."], [72.25, 75.22, "Your turn. Say: Untranslatable."], [78.07, 79.56, "Untranslatable."], [80.32, 81.55, "Domestication."], [82.55, 86.8, "Domestication means adapting a text so it feels familiar to target readers."], [87.42, 90.78, "Domestication replaced local dishes with familiar ones."], [91.38, 94.21, "Your turn. Say: Domestication."], [97.07, 98.35, "Domestication."], [99.08, 100.11, "Foreignization."], [101.12, 104.75, "Foreignization means keeping the foreign features of the original visible."], [105.35, 108.44, "Foreignization preserves the original names and customs."], [109.05, 112.35, "Your turn. Say: Foreignization."], [115.2, 116.27, "Foreignization."], [117.02, 117.9, "Nuance."], [118.92, 121.8, "Nuance means a subtle difference in meaning or tone."], [122.38, 125.1, "Much of the poem's nuance was lost in translation."], [125.72, 128.24, "Your turn. Say: Nuance."], [131.1, 132.16, "Nuance."], [132.92, 133.74, "Register."], [134.75, 137.71, "Register means the level of formality of language."], [138.32, 141.27, "The translator kept the formal register of the letter."], [141.88, 144.7, "Your turn. Say: Register."], [147.53, 148.31, "Register."], [149.05, 150.31, "Interpretation."], [151.32, 154.91, "Interpretation means the act of explaining or rendering meaning."], [155.52, 158.38, "Every translation is also an interpretation."], [158.98, 161.52, "Your turn. Say: Interpretation."], [164.37, 165.72, "Interpretation."], [166.5, 170.08, "Part two: dialogue. Let's listen to a conversation."], [170.92, 175.97, "Visal, you translated a Khmer folk tale into English. What was the hardest part?"], [177.08, 185.8, "The idioms. Some of them cannot be translated directly, so they had to be replaced by an English expression with a similar effect."], [186.88, 189.16, "Isn't that a betrayal of the original?"], [190.25, 199.4, "Not necessarily. If fidelity means preserving the impact on the reader, then a word-for-word version could be considered less faithful."], [200.52, 202.84, "And the forms of address for older people?"], [203.95, 214.07, "Those I kept, deliberately. Readers should be reminded that the story comes from another culture, so some foreignness must be preserved."], [215.23, 217.08, "Part three: grammar."], [217.92, 221.76, "Grammar focus: Passive with modal (can be, must be)."], [222.06, 223.2, "Look at the pattern."], [223.92, 226.96, "Some idioms cannot be translated directly."], [227.85, 230.93, "A word-for-word version could be considered less faithful."], [231.82, 234.37, "Some foreignness must be preserved for the reader."], [235.33, 246.47, "Choose the modal for the exact meaning: can/cannot be (possibility), must be (necessity), should be (recommendation), could be (tentative suggestion). The passive keeps the focus on the text, not the translator."], [247.22, 251.27, "Be careful! Don't say: Some idioms cannot translated directly."], [253.23, 256.72, "Say: Some idioms cannot be translated directly."], [257.02, 258.84, "Modal passive needs 'be'."], [259.63, 262.59, "Part four: reading. Read and listen."], [263.4, 264.75, "Faithful to What?."], [265.05, 271.1, "Translation has always involved a tension between fidelity to the source and readability in the target language."], [272.1, 277.87, "A literal rendering may preserve the words, yet the nuance and register of the original can be lost entirely."], [278.87, 284.58, "Domestication makes a text feel natural to its new readers, although it risks erasing cultural difference."], [285.57, 290.65, "Foreignization, by contrast, insists that difference should be noticed rather than smoothed away."], [291.67, 297.58, "Most translators, in practice, must be prepared to move between both strategies within a single page."], [298.67, 302.96, "Part five: quiz. Five questions. Are you ready?"], [303.82, 306.13, "Some jokes simply blank translated."], [306.43, 310.27, "A, cannot be. B, cannot. C, can't been."], [313.83, 315.87, "The answer is A: cannot be."], [317.02, 320.28, "Keeping original names and customs visible is called blank."], [320.58, 324.97, "A, domestication. B, foreignization. C, equivalence."], [328.5, 330.94, "The answer is B: foreignization."], [332.08, 334.38, "A subtle difference in meaning is a blank."], [334.69, 338.42, "A, register. B, nuance. C, fidelity."], [341.97, 343.65, "The answer is B: nuance."], [344.82, 346.83, "Choose the most tentative statement."], [347.13, 354.52, "A, This version must be rejected.. B, This version could be seen as less faithful.. C, This version is wrong.."], [358.07, 361.91, "The answer is B: This version could be seen as less faithful.."], [363.05, 366.81, "According to the reading, what may a literal translation lose?"], [367.11, 372.5, "A, nuance and register. B, the words. C, its readers' interest in grammar."], [376.03, 378.73, "The answer is A: nuance and register."], [379.93, 383.28, "Part six: speaking. It's your turn to talk."], [384.12, 387.68, "What might be lost when a phrase is described as 'untranslatable'?"], [404.48, 406.01, "Now listen to Visal."], [406.31, 439.42, "When a phrase is called untranslatable, what is usually lost is not its basic meaning but its emotional and cultural nuance. A translator can explain the idea in several words, yet the humour or warmth of the original may disappear. For example, Khmer terms of respect for elders cannot be rendered fully by 'sir' or 'madam'. Some argue that a good footnote solves the problem. I would say it helps, but reading a footnote is never the same as feeling the word."], [439.72, 441.28, "Excellent answer, Visal!"], [442.18, 447.26, "Great work! Now you can use eight new words and passive with modal (can be, must be)."], [447.56, 452.92, "Today's value is cultural sensitivity. Handle every culture's words with care and respect."], [453.22, 455.76, "See you in Unit ten. Goodbye!"], [456.06, 458.56, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C1B2-Unit10-Semiotics": [[0.35, 5.35, "Hello, everyone! I'm Ms. Emma. Welcome to Online C one, Book two."], [5.65, 9.11, "Hi! I'm Visal. Let's learn together!"], [9.41, 16.24, "Unit ten: Semiotics. Today you will distinguish defining from non-defining information about signs and meanings."], [16.54, 19.19, "Here is our lesson map. Let's start!"], [20.13, 23.45, "Part one: words. You will learn eight new words."], [24.28, 25.14, "Sign."], [26.15, 28.9, "Sign means anything that stands for something else."], [29.52, 31.69, "A red light is a sign meaning 'stop'."], [32.28, 34.6, "Your turn. Say: Sign."], [37.43, 38.49, "Sign."], [39.25, 40.31, "Signifier."], [41.32, 45.99, "Signifier means the physical form of a sign: a sound, image or word."], [46.58, 48.56, "The word 'tree' is a signifier."], [49.15, 51.52, "Your turn. Say: Signifier."], [54.37, 55.55, "Signifier."], [56.32, 57.38, "Signified."], [58.38, 61.62, "Signified means the concept a signifier refers to."], [62.22, 64.96, "The signified is the idea of a tree in our mind."], [65.55, 68.14, "Your turn. Say: Signified."], [71.0, 72.12, "Signified."], [72.88, 73.71, "Symbol."], [74.72, 77.8, "Symbol means a sign whose meaning rests on convention."], [78.38, 80.31, "The dove is a symbol of peace."], [80.92, 83.47, "Your turn. Say: Symbol."], [86.3, 86.93, "Symbol."], [87.68, 88.51, "Code."], [89.52, 92.75, "Code means a shared system of rules for interpreting signs."], [93.35, 95.28, "Dress codes communicate status."], [95.88, 98.11, "Your turn. Say: Code."], [100.97, 101.74, "Code."], [102.48, 103.54, "Denotation."], [104.55, 107.21, "Denotation means the literal meaning of a sign."], [107.82, 109.96, "The denotation of 'rose' is a flower."], [110.55, 113.44, "Your turn. Say: Denotation."], [116.3, 117.38, "Denotation."], [118.12, 119.33, "Connotation."], [120.32, 124.21, "Connotation means the associated or emotional meaning of a sign."], [124.82, 127.15, "'Rose' carries connotations of love."], [127.75, 130.34, "Your turn. Say: Connotation."], [133.2, 134.29, "Connotation."], [135.05, 136.11, "Interpretant."], [137.12, 140.89, "Interpretant means the understanding a sign produces in its receiver."], [141.48, 144.1, "The interpretant varies from one culture to another."], [144.68, 147.24, "Your turn. Say: Interpretant."], [150.1, 151.25, "Interpretant."], [152.07, 156.23, "Part two: dialogue. Let's listen to a conversation."], [157.08, 161.23, "Visal, you chose the lotus for your semiotics project. Why?"], [162.35, 171.66, "Because the lotus, which grows out of muddy water, has strong connotations of purity in Cambodian culture."], [172.75, 176.35, "So its denotation and connotation are quite different."], [177.45, 188.82, "Exactly. The denotation is simply a water plant; the signs that really interest me are the ones whose meanings depend on culture."], [189.92, 192.59, "Would a European reader understand it the same way?"], [193.68, 202.34, "Probably not. Without the code that our culture shares, the same signifier can produce a completely different interpretant."], [203.5, 204.93, "Part three: grammar."], [205.78, 209.61, "Grammar focus: Defining vs non-defining clauses."], [209.91, 211.13, "Look at the pattern."], [211.82, 215.34, "A sign, which links form to meaning, is central to semiotics."], [216.25, 219.18, "The signs that interest me are the ones shaped by culture."], [220.08, 223.36, "The lotus, which grows out of mud, symbolises purity."], [224.3, 239.62, "Defining clauses (no commas) tell us WHICH one; remove them and the meaning changes. Non-defining clauses (with commas) add extra fact
