 Emma. Welcome to Online C one, Book two."], [5.39, 8.96, "Hi! I'm Visal. Let's learn together!"], [9.26, 15.72, "Unit twenty-two: Drama and Performance. Today you will add emphasis with 'only when / only in' inversion."], [16.02, 18.73, "Here is our lesson map. Let's start!"], [19.67, 22.71, "Part one: words. You will learn eight new words."], [23.55, 24.36, "Drama."], [25.35, 28.46, "Drama means a story written to be performed by actors."], [29.05, 31.55, "Greek drama was performed at festivals."], [32.15, 34.5, "Your turn. Say: Drama."], [37.37, 38.12, "Drama."], [38.88, 39.99, "Script."], [40.98, 43.54, "Script means the written text of a play or film."], [44.15, 46.98, "The script includes detailed stage directions."], [47.58, 50.39, "Your turn. Say: Script."], [53.23, 53.98, "Script."], [54.72, 55.58, "Stage."], [56.58, 59.58, "Stage means the raised area where actors perform."], [60.18, 61.94, "The stage was almost bare."], [62.55, 64.84, "Your turn. Say: Stage."], [67.7, 68.68, "Stage."], [69.42, 70.44, "Dialogue."], [71.45, 74.52, "Dialogue means conversation between characters."], [75.12, 77.02, "The dialogue is sharp and funny."], [77.62, 80.29, "Your turn. Say: Dialogue."], [83.13, 84.23, "Dialogue."], [84.98, 85.84, "Tension."], [86.85, 89.63, "Tension means a feeling of suspense or conflict."], [90.22, 92.23, "The silence increased the tension."], [92.82, 95.14, "Your turn. Say: Tension."], [98.0, 98.91, "Tension."], [99.65, 100.67, "Audience."], [101.68, 104.34, "Audience means the people watching a performance."], [104.95, 107.03, "The audience gasped at the twist."], [107.62, 110.08, "Your turn. Say: Audience."], [112.93, 113.99, "Audience."], [114.75, 115.86, "Performance."], [116.85, 119.57, "Performance means the act of presenting a play."], [120.18, 122.52, "Her performance won several awards."], [123.12, 126.08, "Your turn. Say: Performance."], [128.93, 130.03, "Performance."], [130.78, 131.7, "Director."], [132.72, 136.06, "Director means the person who guides the actors and the production."], [136.65, 139.45, "The director reimagined the play in modern Phnom Penh."], [140.05, 142.48, "Your turn. Say: Director."], [145.33, 146.36, "Director."], [147.17, 151.06, "Part two: dialogue. Let's listen to a conversation."], [151.92, 156.34, "Visal, you read the play first and then saw it performed. Which did you prefer?"], [157.45, 166.86, "Definitely the performance. Only in performance does the play come alive; on the page, the long silences seemed empty."], [167.95, 169.43, "What changed in the theatre?"], [170.52, 179.4, "The tension. Only when the actors held those silences did I realise how much the characters were hiding from each other."], [180.52, 184.33, "So the director plays a creative role, not just a technical one."], [185.42, 192.54, "Absolutely. Not until I saw it did I understand that every script is incomplete without interpretation."], [193.7, 195.47, "Part three: grammar."], [196.32, 198.99, "Grammar focus: Only when inversion."], [199.29, 200.45, "Look at the pattern."], [201.15, 203.81, "Only in performance does the play come alive."], [204.72, 208.47, "Only when the actors held the silences did I realise what was hidden."], [209.38, 212.05, "Not until I saw it did I understand the script."], [213.0, 225.35, "After 'Only when / Only in / Only after / Not until' at the start, invert the MAIN clause: auxiliary + subject + verb. The first clause keeps normal order: 'Only when the actors held… did I realise'."], [226.08, 230.56, "Be careful! Don't say: Only in performance the play comes alive."], [232.5, 236.07, "Say: Only in performance does the play come alive."], [236.37, 239.09, "Invert after 'Only in…': does + subject."], [239.9, 242.56, "Part four: reading. Read and listen."], [243.37, 244.9, "From Page to Stage."], [245.2, 248.77, "A play script is, in many ways, an unfinished work of art."], [249.77, 254.94, "Only when it is performed do its pauses, gestures and rhythms take on their full meaning."], [255.93, 260.75, "Directors make countless decisions that the script leaves open, from casting to lighting and pacing."], [261.77, 266.3, "As a result, the same play can feel comic in one production and tragic in another."], [267.3, 272.92, "Not until we see drama as a collaboration between writer, actors and audience can we fully appreciate it."], [274.03, 278.08, "Part five: quiz. Five questions. Are you ready?"], [278.92, 281.03, "Only in performance blank alive."], [281.33, 286.03, "A, the play comes. B, does the play come. C, comes the play does."], [289.57, 292.13, "The answer is B: does the play come."], [293.28, 295.43, "Not until I saw it blank the ending."], [295.73, 300.33, "A, did I understand. B, I understood. C, I did understand."], [303.87, 306.95, "The answer is A: did I understand."], [308.08, 310.52, "The person who guides the actors is the blank."], [310.82, 314.63, "A, director. B, audience. C, script."], [318.17, 319.93, "The answer is A: director."], [321.08, 322.99, "Which collocation is correct?"], [323.29, 328.24, "A, build tension. B, do tension. C, make up tension."], [331.8, 334.06, "The answer is A: build tension."], [335.22, 337.94, "According to the reading, a play script is…"], [338.24, 343.65, "A, a finished work. B, an unfinished work of art. C, less important than lighting."], [347.2, 350.19, "The answer is B: an unfinished work of art."], [351.4, 354.63, "Part six: speaking. It's your turn to talk."], [355.48, 358.26, "How does watching a play differ from reading its script?"], [375.05, 376.61, "Now listen to Visal."], [376.91, 411.4, "Watching a play differs from reading it because performance adds voice, movement and timing, which the script can only suggest. Only when I hear an actor's tone do I fully understand whether a line is sincere or sarcastic. For example, a silence that looks empty on the page can feel unbearable on stage. Some readers enjoy scripts more because they can imagine the scenes freely. Still, I believe drama is written to be seen and shared with an audience."], [411.7, 413.38, "Excellent answer, Visal!"], [414.28, 418.25, "Great work! Now you can use eight new words and only when inversion."], [418.55, 422.34, "Today's value is teamwork. We can do more when we work together."], [422.64, 425.84, "See you in Unit twenty-three. Goodbye!"], [426.14, 429.09, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C1B2-Unit23-Digital-Storytelling": [[0.35, 5.08, "Hello, everyone! I'm Ms. Emma. Welcome to Online C one, Book two."], [5.38, 8.68, "Hi! I'm Visal. Let's learn together!"], [8.98, 16.91, "Unit twenty-three: Digital Storytelling. Today you will describe how technology enables readers with causative 'let / allow / enable'."], [17.21, 19.74, "Here is our lesson map. Let's start!"], [20.7, 23.67, "Part one: words. You will learn eight new words."], [24.52, 25.4, "Digital."], [26.42, 29.03, "Digital means using computer technology."], [29.62, 32.26, "Digital stories can include sound and video."], [32.85, 35.56, "Your turn. Say: Digital."], [38.4, 39.28, "Digital."], [40.05, 41.05, "Narrative."], [42.05, 44.71, "Narrative means a story or account of events."], [45.32, 48.19, "The narrative unfolds across several apps."], [48.78, 51.71, "Your turn. Say: Narrative."], [54.57, 55.64, "Narrative."], [56.38, 57.53, "Interactive."], [58.55, 62.78, "Interactive means allowing two-way involvement between user and system."], [63.38, 66.49, "Interactive fiction asks readers to make choices."], [67.08, 70.06, "Your turn. Say: Interactive."], [72.9, 74.09, "Interactive."], [74.85, 75.76, "Platform."], [76.75, 79.88, "Platform means a digital service where content is shared."], [80.48, 82.95, "Each platform favours a different story length."], [83.55, 86.19, "Your turn. Say: Platform."], [89.03, 90.03, "Platform."], [90.78, 91.97, "Multimedia."], [92.98, 96.59, "Multimedia means combining text, image, sound and video."], [97.18, 99.87, "The museum created a multimedia exhibition."], [100.48, 103.39, "Your turn. Say: Multimedia."], [106.23, 107.37, "Multimedia."], [108.12, 108.92, "User."], [109.92, 113.29, "User means a person who uses a digital product."], [113.88, 116.15, "The user decides which path to follow."], [116.75, 119.4, "Your turn. Say: User."], [122.27, 123.12, "User."], [123.88, 124.71, "Branching."], [125.72, 128.72, "Branching means splitting into different possible paths."], [129.32, 131.63, "Branching stories have several endings."], [132.22, 134.68, "Your turn. Say: Branching."], [137.53, 138.48, "Branching."], [139.22, 140.19, "Immersion."], [141.18, 145.12, "Immersion means the feeling of being completely absorbed in an experience."], [145.72, 147.89, "Virtual reality deepens immersion."], [148.48, 151.19, "Your turn. Say: Immersion."], [154.03, 154.99, "Immersion."], [155.8, 159.9, "Part two: dialogue. Let's listen to a conversation."], [160.75, 166.14, "Visal, your group created a branching story about life in Phnom Penh. How does it work?"], [167.25, 175.45, "Branching stories let readers choose the ending. At each key moment, the app allows users to decide what the character does next."], [176.55, 178.79, "Did that change how people engaged with it?"], [179.88, 188.44, "Hugely. Making readers responsible for choices encourages them to replay the story and compare outcomes."], [189.55, 191.16, "Are there any drawbacks?"], [192.25, 201.68, "Yes. More choice doesn't always enable deeper meaning; it can make the narrative feel scattered, so we limited it to three paths."], [202.83, 204.43, "Part three: grammar."], [205.28, 208.92, "Grammar focus: Causative structures (let and allow)."], [209.22, 210.5, "Look at the pattern."], [211.18, 213.94, "Branching stories let readers choose the ending."], [214.85, 217.63, "The app allows users to decide what happens next."], [218.52, 221.76, "Multimedia enables writers to combine sound and image."], [222.7, 235.24, "'Let' and 'make' + object + base verb (let readers choose). 'Allow / enable / encourage / force' + object + to-infinitive (allow users to decide). 'Have' + object + base verb is used for arranging services."], [235.98, 240.17, "Be careful! Don't say: Branching stories let readers to choose."], [242.13, 244.79, "Say: Branching stories let readers choose."], [245.09, 247.77, "'Let' + object + base verb (no 'to')."], [248.57, 251.18, "Part four: reading. Read and listen."], [252.0, 253.87, "Stories Without a Final Page."], [254.17, 260.41, "Digital technology has transformed not only how stories are distributed but also how they are told."], [261.4, 266.93, "Interactive narratives allow readers to influence the plot, turning them from audience into co-author."], [267.93, 273.87, "Multimedia platforms enable writers to combine text with sound, video and even location data."], [274.87, 279.54, "However, the freedom that branching structures offer can weaken the emotional shape of a narrative."], [280.53, 286.27, "The most successful digital stories therefore let users explore while still guiding them toward meaningful moments."], [287.37, 291.03, "Part five: quiz. Five questions. Are you ready?"], [291.88, 294.3, "The game lets players blank their own path."], [294.6, 298.21, "A, to choose. B, choose. C, choosing."], [301.77, 304.0, "The answer is B: choose."], [305.15, 307.97, "The platform allows writers blank sound and video."], [308.27, 312.29, "A, to combine. B, combine. C, combining to."], [315.83, 317.98, "The answer is A: to combine."], [319.15, 322.69, "The feeling of being completely absorbed in an experience is blank."], [322.99, 326.72, "A, branching. B, immersion. C, platform."], [330.27, 332.41, "The answer is B: immersion."], [333.55, 335.55, "Which collocation is correct?"], [335.85, 340.33, "A, make a choice. B, do a choice. C, take a choose."], [343.87, 346.35, "The answer is A: make a choice."], [347.52, 350.68, "According to the reading, what can branching structures weaken?"], [350.98, 356.5, "A, the platform. B, the emotional shape of a narrative. C, multimedia."], [360.03, 363.61, "The answer is B: the emotional shape of a narrative."], [364.8, 368.14, "Part six: speaking. It's your turn to talk."], [368.98, 371.94, "How do interactive stories change the role of the reader?"], [388.75, 390.23, "Now listen to Visal."], [390.53, 423.35, "Interactive stories change the reader from a passive receiver into an active participant. When a story lets readers make decisions, they feel responsible for the outcome, which can deepen their emotional involvement. For example, in a game about migration, choosing what to leave behind made me understand refugees' difficult choices. Some critics argue that too much freedom destroys the author's vision. I partly agree, but well-designed stories allow freedom while still guiding the reader."], [423.65, 425.43, "Excellent answer, Visal!"], [426.32, 431.14, "Great work! Now you can use eight new words and causative structures (let and allow)."], [431.44, 435.43, "Today's value is creativity. Use your imagination when you play."], [435.73, 438.62, "See you in Unit twenty-four. Goodbye!"], [438.92, 442.33, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C1B2-Unit24-The-Rhetoric-of-Advertising": [[0.35, 5.14, "Hello, everyone! I'm Ms. Emma. Welcome to Online C one, Book two."], [5.44, 9.04, "Hi! I'm Visal. Let's learn together!"], [9.34, 17.16, "Unit twenty-four: The Rhetoric of Advertising. Today you will describe persuasive techniques with 'whose' and 'which' relative clauses."], [17.45, 20.04, "Here is our lesson map. Let's start!"], [21.0, 24.36, "Part one: words. You will learn eight new words."], [25.22, 26.32, "Advertising."], [27.32, 31.02, "Advertising means the business of promoting products or services."], [31.62, 34.0, "Advertising shapes what we think we need."], [34.58, 37.56, "Your turn. Say: Advertising."], [40.4, 41.6, "Advertising."], [42.35, 43.28, "Persuasion."], [44.28, 47.0, "Persuasion means the act of convincing someone."], [47.62, 50.73, "Subtle persuasion is often the most effective."], [51.32, 53.96, "Your turn. Say: Persuasion."], [56.8, 57.76, "Persuasion."], [58.52, 59.49, "Slogan."], [60.48, 64.1, "Slogan means a short, memorable phrase used in advertising."], [64.68, 67.75, "The slogan was translated into twelve languages."], [68.35, 70.71, "Your turn. Say: Slogan."], [73.57, 74.66, "Slogan."], [75.42, 76.74, "Target audience."], [77.75, 81.36, "Target audience means the specific group an advert is aimed at."], [81.95, 85.42, "The target audience is students aged 15–20."], [86.02, 88.89, "Your turn. Say: Target audience."], [91.73, 93.01, "Target audience."], [93.75, 95.23, "Emotional appeal."], [96.22, 100.03, "Emotional appeal means a technique that persuades through feelings."], [100.62, 103.71, "The advert relies on emotional appeal rather than facts."], [104.32, 106.95, "Your turn. Say: Emotional appeal."], [109.8, 111.24, "Emotional appeal."], [111.98, 112.73, "Brand."], [113.72, 116.99, "Brand means the identity and image of a company or product."], [117.58, 120.07, "The brand is associated with youth and freedom."], [120.68, 123.35, "Your turn. Say: Brand."], [126.2, 127.02, "Brand."], [127.75, 128.95, "Implicit."], [129.95, 133.04, "Implicit means suggested but not stated directly."], [133.65, 136.11, "The implicit message is that you will be happier."], [136.72, 139.37, "Your turn. Say: Implicit."], [142.23, 143.3, "Implicit."], [144.05, 145.18, "Consumer."], [146.18, 149.44, "Consumer means a person who buys goods or services."], [150.05, 153.0, "Consumers are increasingly sceptical of adverts."], [153.62, 156.22, "Your turn. Say: Consumer."], [159.07, 160.32, "Consumer."], [161.13, 165.07, "Part two: dialogue. Let's listen to a conversation."], [165.92, 171.18, "Visal, your presentation compared two phone adverts. What made the first one so effective?"], [172.28, 182.18, "It uses a slogan which appeals to emotion rather than logic: 'Never miss a moment'. It sells memories, not technology."], [183.28, 185.28, "And who is the target audience?"], [186.38, 194.13, "Young parents, whose fear of missing their children's childhood is exactly what the advert exploits."], [195.22, 197.32, "Is the second advert more honest?"], [198.42, 209.36, "In a sense. It lists features, which seems rational, but its implicit message, that serious professionals choose this brand, is still persuasion."], [210.5, 212.14, "Part three: grammar."], [212.98, 216.5, "Grammar focus: Relative clauses (whose and which)."], [216.8, 218.03, "Look at the pattern."], [218.72, 221.19, "Brands use slogans which appeal to emotion."], [222.08, 226.61, "Young parents, whose fear of missing out is easily exploited, are the target."], [227.52, 229.85, "It lists features, which seems rational."], [230.8, 242.46, "'Whose' shows possession for people, brands and things: 'a brand whose logo is famous'. The noun after 'whose' never takes 'the'. 'Which' can refer to a whole previous clause: '…, which seems rational'."], [243.22, 248.28, "Be careful! Don't say: Brands, whose slogan are catchy, sell more."], [250.23, 253.07, "Say: Brands whose slogans are catchy sell more."], [253.37, 255.11, "Make the noun after 'whose' agree."], [255.9, 258.47, "Part four: reading. Read and listen."], [259.27, 260.75, "Selling More Than Products."], [261.06, 264.64, "Modern advertising rarely sells a product on its features alone."], [265.63, 272.56, "Instead, it associates the product with values which consumers already desire, such as freedom, status or belonging."], [273.57, 278.89, "Advertisers carefully define a target audience whose hopes and anxieties can be addressed directly."], [279.9, 284.77, "Much of the persuasion is implicit, which makes it harder for consumers to question."], [285.77, 291.26, "Media-literate viewers learn to ask not only what is being sold, but what lifestyle is being sold with it."], [292.37, 296.26, "Part five: quiz. Five questions. Are you ready?"], [297.12, 300.16, "A brand blank logo is famous can charge more."], [300.46, 304.15, "A, which. B, whose. C, who's."], [307.7, 310.0, "The answer is B: whose."], [311.15, 312.81, "Choose the correct sentence."], [313.11, 320.9, "A, Parents, whose the children are young, buy it.. B, Parents, whose children are young, buy it.. C, Parents, who their children are young, buy it.."], [324.43, 328.02, "The answer is B: Parents, whose children are young, buy it.."], [329.18, 332.44, "A message that is suggested but not stated is blank."], [332.74, 336.48, "A, explicit. B, implicit. C, a slogan."], [340.03, 342.16, "The answer is B: implicit."], [343.32, 346.53, "The specific group an advert is aimed at is the blank."], [346.83, 350.91, "A, target audience. B, brand. C, persuasion."], [354.47, 356.91, "The answer is A: target audience."], [358.05, 362.55, "According to the reading, what do advertisers associate products with?"], [362.85, 368.09, "A, technical data. B, values consumers desire. C, lower prices."], [371.63, 374.68, "The answer is B: values consumers desire."], [375.87, 379.0, "Part six: speaking. It's your turn to talk."], [379.85, 383.12, "Which persuasive techniques do advertisers use most?"], [399.92, 401.39, "Now listen to Visal."], [401.69, 437.71, "In my view, the technique advertisers use most is emotional appeal, which connects a product with feelings like happiness or belonging. Adverts for soft drinks, for example, rarely mention taste; they show friends laughing together. Celebrity endorsement, whose power comes from our wish to be like stars, is also common. Some argue that consumers are smart enough to see through these strategies. Yet emotional messages influence us even when we recognise them."], [438.01, 439.72, "Excellent answer, Visal!"], [440.62, 445.58, "Great work! Now you can use eight new words and relative clauses (whose and which)."], [445.88, 450.56, "Today's value is critical thinking. Think carefully and give reasons for your opinions."], [450.86, 453.68, "See you in Unit twenty-five. Goodbye!"], [453.98, 458.35, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C1B2-Unit25-Sociolinguistics": [[0.35, 4.99, "Hello, everyone! I'm Ms. Emma. Welcome to Online C one, Book two."], [5.29, 8.6, "Hi! I'm Visal. Let's learn together!"], [8.89, 16.35, "Unit twenty-five: Sociolinguistics. Today you will describe typical linguistic behaviour with 'tend to' and 'be inclined to'."], [16.65, 19.19, "Here is our lesson map. Let's start!"], [20.13, 23.15, "Part one: words. You will learn eight new words."], [23.98, 24.84, "Dialect."], [25.85, 29.36, "Dialect means a regional or social variety of a language."], [29.95, 33.05, "Battambang speakers use some distinctive dialect words."], [33.65, 35.83, "Your turn. Say: Dialect."], [38.67, 39.55, "Dialect."], [40.32, 41.27, "Accent."], [42.28, 44.61, "Accent means a way of pronouncing a language."], [45.22, 47.94, "Her accent reveals that she grew up abroad."], [48.55, 50.92, "Your turn. Say: Accent."], [53.77, 54.87, "Accent."], [55.62, 56.74, "Code-switching."], [57.75, 62.13, "Code-switching means moving between two languages or varieties in conversation."], [62.72, 66.17, "Students often code-switch between Khmer and English."], [66.78, 69.73, "Your turn. Say: Code-switching."], [72.57, 74.19, "Code-switching."], [74.95, 75.99, "Identity."], [76.98, 80.28, "Identity means the sense of who a person or group is."], [80.88, 83.45, "Language is closely tied to identity."], [84.05, 86.67, "Your turn. Say: Identity."], [89.53, 90.53, "Identity."], [91.28, 92.26, "Prestige."], [93.25, 96.55, "Prestige means high status or respect given to something."], [97.15, 100.09, "English carries prestige in many job markets."], [100.68, 103.46, "Your turn. Say: Prestige."], [106.3, 107.24, "Prestige."], [107.98, 109.09, "Variation."], [110.08, 113.19, "Variation means differences in the way language is used."], [113.78, 116.56, "Variation exists even within one family."], [117.15, 119.58, "Your turn. Say: Variation."], [122.43, 123.45, "Variation."], [124.18, 125.25, "Community."], [126.25, 129.36, "Community means a group sharing a place or interests."], [129.95, 132.83, "Each online community develops its own slang."], [133.42, 136.43, "Your turn. Say: Community."], [139.27, 140.38, "Community."], [141.15, 142.09, "Register."], [143.08, 146.84, "Register means language variety used for a particular purpose."], [147.45, 150.51, "Students switch to a formal register in essays."], [151.12, 153.33, "Your turn. Say: Register."], [156.17, 157.0, "Register."], [157.8, 161.53, "Part two: dialogue. Let's listen to a conversation."], [162.38, 168.39, "Visal, your survey looked at how students speak in different situations. What was the clearest pattern?"], [169.48, 179.33, "Speakers tend to code-switch in informal settings. With friends, students mix Khmer and English freely, often in the same sentence."], [180.45, 182.36, "And in formal situations?"], [183.45, 193.52, "They are much less inclined to switch. In class presentations or with elders, they generally keep to one language and a formal register."], [194.62, 196.49, "Why do they code-switch at all?"], [197.58, 205.46, "Partly for identity. English words tend to signal modernity and prestige, while Khmer expresses closeness and respect."], [206.6, 208.0, "Part three: grammar."], [208.85, 212.38, "Grammar focus: Tend to and be inclined to."], [212.68, 213.86, "Look at the pattern."], [214.55, 218.25, "Speakers tend to code-switch in informal settings."], [219.15, 222.51, "Students are less inclined to switch in formal situations."], [223.42, 227.02, "English words tend to signal modernity and prestige."], [227.97, 237.8, "'Tend to' and 'be inclined to' describe general patterns without claiming that something is always true. They are useful hedges in social science. Both are followed by the base verb."], [238.55, 242.92, "Be careful! Don't say: Speakers tend code-switching at home."], [244.87, 247.75, "Say: Speakers tend to code-switch at home."], [248.05, 250.15, "Use 'tend to' + base verb."], [250.97, 253.98, "Part four: reading. Read and listen."], [254.77, 256.24, "Language and Society."], [256.54, 262.88, "Sociolinguistics studies how language varies according to region, class, age and social situation."], [263.9, 268.65, "Speakers tend to adjust their accent and vocabulary depending on whom they are addressing."], [269.67, 276.26, "In multilingual communities, people are often inclined to code-switch, which can signal solidarity or identity."], [277.27, 284.18, "Varieties associated with powerful groups usually acquire prestige, whereas others may be unfairly stigmatised."], [285.17, 290.86, "Sociolinguists therefore argue that no dialect is inherently better than another, only different."], [291.97, 296.06, "Part five: quiz. Five questions. Are you ready?"], [296.92, 299.33, "Teenagers blank use more slang than adults."], [299.63, 303.01, "A, tend to. B, tend. C, are tending."], [306.57, 308.28, "The answer is A: tend to."], [309.42, 312.11, "She is inclined blank formal language at work."], [312.41, 315.6, "A, using. B, to use. C, use."], [319.17, 321.21, "The answer is B: to use."], [322.35, 325.44, "Moving between languages in one conversation is blank."], [325.74, 329.83, "A, code-switching. B, prestige. C, dialect."], [333.4, 335.77, "The answer is A: code-switching."], [336.92, 339.92, "High status given to a language variety is blank."], [340.22, 344.01, "A, variation. B, community. C, prestige."], [347.57, 349.94, "The answer is C: prestige."], [351.08, 355.22, "According to the reading, sociolinguists believe that no dialect is…"], [355.52, 361.1, "A, inherently better than another. B, worth studying. C, used in communities."], [364.63, 367.85, "The answer is A: inherently better than another."], [369.07, 372.33, "Part six: speaking. It's your turn to talk."], [373.18, 376.17, "When do you switch between languages or styles of speaking?"], [392.98, 394.91, "Now listen to Visal."], [395.21, 428.85, "I tend to switch between languages most when I am chatting with friends who also study English. We are inclined to use English words for technology or school subjects, while Khmer feels more natural for jokes and emotions. By contrast, when I speak with my grandparents, I keep to polite Khmer and a respectful register. Some people believe code-switching shows poor language skills. I disagree, because choosing the right style for each situation actually requires considerable skill."], [429.15, 431.1, "Excellent answer, Visal!"], [432.02, 436.56, "Great work! Now you can use eight new words and tend to and be inclined to."], [436.86, 442.11, "Today's value is respect for differences. Everyone is different, and everyone is special."], [442.41, 445.53, "See you in Unit twenty-six. Goodbye!"], [445.83, 448.66, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C1B2-Unit26-Language-Change": [[0.35, 5.0, "Hello, everyone! I'm Ms. Emma. Welcome to Online C one, Book two."], [5.3, 8.65, "Hi! I'm Visal. Let's learn together!"], [8.95, 16.75, "Unit twenty-six: Language Change. Today you will describe long-term language trends with the present perfect continuous."], [17.05, 19.78, "Here is our lesson map. Let's start!"], [20.73, 24.2, "Part one: words. You will learn eight new words."], [25.05, 26.49, "Language change."], [27.48, 31.41, "Language change means the gradual development of a language over time."], [32.02, 34.95, "Language change is natural and continuous."], [35.55, 38.67, "Your turn. Say: Language change."], [41.53, 43.07, "Language change."], [43.82, 44.7, "Borrowing."], [45.72, 48.45, "Borrowing means taking words from another language."], [49.05, 52.02, "Borrowing from French enriched English vocabulary."], [52.62, 55.2, "Your turn. Say: Borrowing."], [58.03, 58.99, "Borrowing."], [59.75, 60.62, "Loanword."], [61.62, 64.55, "Loanword means a word adopted from another language."], [65.15, 67.24, "'Café' is a loanword from French."], [67.85, 70.0, "Your turn. Say: Loanword."], [72.87, 73.95, "Loanword."], [74.68, 75.87, "Evolution."], [76.88, 79.32, "Evolution means gradual development."], [79.92, 82.33, "The evolution of spelling took centuries."], [82.95, 85.6, "Your turn. Say: Evolution."], [88.47, 89.65, "Evolution."], [90.42, 91.45, "Standard."], [92.45, 96.4, "Standard means the variety accepted as correct for formal use."], [97.02, 99.59, "Standard English is used in exams."], [100.18, 103.07, "Your turn. Say: Standard."], [105.93, 106.69, "Standard."], [107.45, 108.22, "Slang."], [109.22, 112.88, "Slang means very informal words used by particular groups."], [113.48, 116.67, "Slang changes faster than any other vocabulary."], [117.28, 120.0, "Your turn. Say: Slang."], [122.87, 123.94, "Slang."], [124.68, 125.61, "Grammar."], [126.62, 129.52, "Grammar means the rules of a language's structure."], [130.12, 132.7, "Even grammar changes slowly over time."], [133.28, 135.53, "Your turn. Say: Grammar."], [138.37, 139.37, "Grammar."], [140.12, 141.21, "Generation."], [142.22, 145.64, "Generation means people born and living at about the same time."], [146.25, 148.66, "Each generation brings new expressions."], [149.25, 152.0, "Your turn. Say: Generation."], [154.83, 155.85, "Generation."], [156.63, 160.21, "Part two: dialogue. Let's listen to a conversation."], [161.05, 166.22, "Visal, your project traced English loanwords in Khmer. How long has this been happening?"], [167.32, 177.11, "Khmer has been borrowing from English for decades, especially for technology: words like 'computer' and 'internet' are everywhere."], [178.22, 179.67, "And English itself?"], [180.78, 190.9, "English has been borrowing words for centuries, from French, Latin, Hindi and many other languages. Around a third of its vocabulary is borrowed."], [192.02, 195.64, "Some older people complain that young people are 'destroying' the language."], [196.75, 205.85, "People have been making that complaint for centuries. Languages that stop changing are usually languages that nobody speaks any more."], [207.0, 208.43, "Part three: grammar."], [209.28, 212.63, "Grammar focus: Present perfect continuous for trends."], [212.93, 214.18, "Look at the pattern."], [214.88, 217.43, "English has been borrowing words for centuries."], [218.32, 221.05, "Khmer has been borrowing from English for decades."], [221.95, 225.04, "People have been making that complaint since the Middle Ages."], [226.0, 236.28, "Use the present perfect continuous for a process that began in the past and is still continuing: 'has been borrowing'. Use 'for' with a period of time and 'since' with a starting point."], [237.02, 241.89, "Be careful! Don't say: English is borrowing words for centuries."], [243.83, 246.95, "Say: English has been borrowing words for centuries."], [247.25, 249.93, "Use present perfect continuous with 'for'."], [250.73, 253.58, "Part four: reading. Read and listen."], [254.37, 255.66, "A Living Language."], [255.96, 262.0, "All living languages change, and English has been changing continuously since its earliest recorded forms."], [263.0, 269.98, "Over the centuries, it has been absorbing vocabulary from the languages of invaders, trading partners and colonies."], [270.97, 276.55, "Grammar changes too, although more slowly; the pronoun 'thou', for example, gradually disappeared."], [277.57, 282.36, "Today, the internet has been accelerating the spread of new slang across national borders."], [283.37, 289.47, "Linguists generally describe these changes rather than condemning them, since change is a sign of vitality."], [290.57, 294.45, "Part five: quiz. Five questions. Are you ready?"], [295.32, 298.49, "English blank words from other languages for centuries."], [298.79, 303.39, "A, has borrowed been. B, has been borrowing. C, is borrowing."], [306.93, 309.43, "The answer is B: has been borrowing."], [310.58, 313.62, "They have been studying Khmer blank 2019."], [313.92, 317.18, "A, since. B, for. C, from."], [320.73, 322.51, "The answer is A: since."], [323.65, 326.43, "A word adopted from another language is a blank."], [326.73, 330.4, "A, slang. B, loanword. C, standard."], [333.97, 336.01, "The answer is B: loanword."], [337.15, 339.24, "Which collocation is correct?"], [339.54, 344.5, "A, coin a new word. B, make up a coin. C, do a new word."], [348.03, 350.44, "The answer is A: coin a new word."], [351.58, 354.07, "According to the reading, linguists generally…"], [354.37, 358.57, "A, condemn change. B, describe change. C, prevent change."], [362.13, 364.42, "The answer is B: describe change."], [365.63, 368.97, "Part six: speaking. It's your turn to talk."], [369.82, 372.43, "Which new English words have you noticed recently?"], [389.22, 390.65, "Now listen to Visal."], [390.95, 419.51, "Recently I have noticed words like 'doomscrolling', which means endlessly reading bad news online. People have been using it more and more since the pandemic, and it captures a habit many of us share. I have also been hearing 'rizz' among teenagers, a slang word meaning charm. Some people feel such words damage English. I think, however, that they show how the language has been adapting to new experiences, just as it always has."], [419.81, 421.76, "Excellent answer, Visal!"], [422.65, 427.86, "Great work! Now you can use eight new words and present perfect continuous for trends."], [428.16, 433.07, "Today's value is adaptability. Be ready for rain or sun and change your plans."], [433.37, 436.2, "See you in Unit twenty-seven. Goodbye!"], [436.5, 439.29, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C1B2-Unit27-Adaptation-Studies": [[0.35, 5.35, "Hello, everyone! I'm Ms. Emma. Welcome to Online C one, Book two."], [5.65, 8.96, "Hi! I'm Visal. Let's learn together!"], [9.26, 15.66, "Unit twenty-seven: Adaptation Studies. Today you will show how two changes are linked with 'the more …, the more …'."], [15.96, 18.78, "Here is our lesson map. Let's start!"], [19.73, 23.29, "Part one: words. You will learn eight new words."], [24.15, 25.23, "Adaptation."], [26.22, 30.06, "Adaptation means a new version of a work in a different form."], [30.65, 33.06, "The film adaptation won three awards."], [33.65, 36.06, "Your turn. Say: Adaptation."], [38.9, 40.12, "Adaptation."], [40.88, 42.06, "Source text."], [43.05, 46.62, "Source text means the original work an adaptation is based on."], [47.22, 49.44, "Few viewers had read the source text."], [50.05, 53.18, "Your turn. Say: Source text."], [56.03, 57.28, "Source text."], [58.02, 58.69, "Film."], [59.68, 62.5, "Film means a story told through moving pictures."], [63.08, 65.48, "The film shortens the novel's second half."], [66.08, 68.68, "Your turn. Say: Film."], [71.53, 72.23, "Film."], [72.98, 73.96, "Fidelity."], [74.95, 77.58, "Fidelity means faithfulness to the original."], [78.18, 81.03, "Critics debated the film's fidelity to the book."], [81.62, 84.63, "Your turn. Say: Fidelity."], [87.47, 88.4, "Fidelity."], [89.15, 90.43, "Interpretation."], [91.42, 95.11, "Interpretation means a particular way of understanding a work."], [95.72, 98.19, "The director offers a darker interpretation."], [98.78, 101.46, "Your turn. Say: Interpretation."], [104.3, 105.67, "Interpretation."], [106.42, 107.33, "Medium."], [108.32, 111.92, "Medium means a form of communication such as film, print or theatre."], [112.52, 114.76, "Each medium has its own strengths."], [115.35, 117.91, "Your turn. Say: Medium."], [120.77, 121.77, "Medium."], [122.52, 123.53, "Audience."], [124.52, 126.88, "Audience means the people a work reaches."], [127.48, 130.34, "The adaptation attracted a younger audience."], [130.95, 133.56, "Your turn. Say: Audience."], [136.4, 137.37, "Audience."], [138.12, 139.2, "Transformation."], [140.18, 143.52, "Transformation means a complete change in form or character."], [144.12, 146.89, "The transformation of the ending angered fans."], [147.48, 150.29, "Your turn. Say: Transformation."], [153.13, 154.62, "Transformation."], [155.43, 159.05, "Part two: dialogue. Let's listen to a conversation."], [159.88, 162.96, "Visal, did you prefer the novel or the film version?"], [164.05, 173.03, "The novel, but the film is interesting. The more faithful the film tried to be, the less creative it seemed in the first hour."], [174.12, 175.01, "And later?"], [176.12, 183.49, "The director took more risks. The further the film moved from the source text, the more powerful its images became."], [184.58, 186.39, "So is fidelity overrated?"], [187.48, 197.4, "Partly. A film is a different medium. The more an adaptation thinks visually, the better it can capture the spirit, if not the letter, of the book."], [198.53, 199.96, "Part three: grammar."], [200.82, 204.36, "Grammar focus: Comparative structures (the more, the more)."], [204.66, 205.79, "Look at the pattern."], [206.48, 210.06, "The more faithful the film, the less creative it may be."], [210.95, 214.74, "The further the film moved from the book, the more powerful its images became."], [215.65, 219.76, "The more an adaptation thinks visually, the better it captures the spirit."], [220.7, 233.54, "The double comparative shows that two things change together. Keep the order: the + comparative + subject + verb. The verb 'be' can be omitted in short forms: 'The more faithful the film, the less creative (it is).'"], [234.28, 239.11, "Be careful! Don't say: The more faithful the film, the less it creative."], [241.07, 244.7, "Say: The more faithful the film, the less creative it is."], [245.0, 249.15, "Keep the order: the less + adjective + subject + verb."], [249.97, 252.51, "Part four: reading. Read and listen."], [253.3, 254.66, "Beyond Fidelity."], [254.96, 260.95, "Discussions of adaptation have long been dominated by a single question: is it faithful to the book?"], [261.97, 268.15, "Adaptation scholars argue that this question is limited, since every medium tells stories in different ways."], [269.13, 275.75, "A novel can spend pages inside a character's mind, whereas a film must show thought through image and performance."], [276.77, 282.62, "The more seriously we take these differences, the less sense it makes to judge films only by their fidelity."], [283.63, 289.88, "Instead, critics increasingly evaluate adaptations as interpretations that enter into dialogue with their source."], [290.97, 295.17, "Part five: quiz. Five questions. Are you ready?"], [296.02, 298.02, "The more you practise, blank you become."], [298.32, 302.64, "A, the more confident. B, more confident. C, the most confident."], [306.2, 308.48, "The answer is A: the more confident."], [309.62, 311.36, "Choose the correct sentence."], [311.66, 321.22, "A, The more faithful the film, the less creative it is.. B, More faithful the film, less creative it is.. C, The more faithful is the film, less it creative.."], [324.77, 328.66, "The answer is A: The more faithful the film, the less creative it is.."], [329.82, 333.33, "The original work that an adaptation is based on is the blank."], [333.63, 337.71, "A, medium. B, source text. C, transformation."], [341.27, 343.74, "The answer is B: source text."], [344.88, 346.73, "Which collocation is correct?"], [347.03, 351.89, "A, remain faithful to. B, stay faithfully with. C, keep faithful at."], [355.43, 358.14, "The answer is A: remain faithful to."], [359.28, 363.3, "According to the reading, critics increasingly see adaptations as…"], [363.6, 369.07, "A, copies. B, interpretations in dialogue with the source. C, failures."], [372.63, 376.37, "The answer is B: interpretations in dialogue with the source."], [377.57, 380.88, "Part six: speaking. It's your turn to talk."], [381.72, 384.49, "Should a film adaptation be faithful to the book?"], [401.28, 402.77, "Now listen to Visal."], [403.07, 441.7, "In my opinion, a film adaptation should be faithful to the spirit of a book, but not necessarily to every detail. The more a director tries to include every scene, the slower and less cinematic the film often becomes. For example, many fantasy films cut minor characters, yet they still capture the book's central themes. Fans who love the original sometimes feel betrayed by such changes. Even so, I believe a good adaptation should be judged as a new work in its own medium."], [442.0, 443.64, "Excellent answer, Visal!"], [444.55, 449.5, "Great work! Now you can use eight new words and comparative structures (the more, the more)."], [449.8, 454.83, "Today's value is innovation. Try new ideas boldly, and learn from every attempt."], [455.13, 457.66, "See you in Unit twenty-eight. Goodbye!"], [457.96, 460.69, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C1B2-Unit28-Children-s-Literature": [[0.35, 5.48, "Hello, everyone! I'm Ms. Emma. Welcome to Online C one, Book two."], [5.78, 9.31, "Hi! I'm Visal. Let's learn together!"], [9.62, 15.45, "Unit twenty-eight: Children's Literature. Today you will describe past habits with 'used to' and 'would'."], [15.75, 18.27, "Here is our lesson map. Let's start!"], [19.23, 22.5, "Part one: words. You will learn eight new words."], [23.35, 24.76, "Children's literature."], [25.75, 28.91, "Children's literature means books written for young readers."], [29.52, 32.4, "Children's literature can deal with serious themes."], [32.98, 35.93, "Your turn. Say: Children's literature."], [38.77, 40.29, "Children's literature."], [41.05, 42.13, "Picture book."], [43.12, 47.16, "Picture book means a book in which illustrations are as important as the words."], [47.75, 50.08, "Picture books build early literacy."], [50.68, 53.13, "Your turn. Say: Picture book."], [55.97, 57.04, "Picture book."], [57.78, 58.56, "Moral."], [59.55, 62.07, "Moral means the lesson that a story teaches."], [62.68, 65.94, "The moral of the fable is 'slow and steady wins the race'."], [66.55, 68.82, "Your turn. Say: Moral."], [71.67, 72.46, "Moral."], [73.22, 74.36, "Imagination."], [75.35, 79.2, "Imagination means the ability to form new images and ideas."], [79.78, 82.63, "Fantasy stories stretch a child's imagination."], [83.22, 86.26, "Your turn. Say: Imagination."], [89.1, 90.28, "Imagination."], [91.02, 92.19, "Illustration."], [93.18, 95.79, "Illustration means a picture in a book."], [96.38, 98.64, "The illustrations tell a second story."], [99.25, 101.86, "Your turn. Say: Illustration."], [104.7, 105.93, "Illustration."], [106.68, 107.94, "Fairy tale."], [108.95, 112.54, "Fairy tale means a traditional story with magic and fantasy."], [113.15, 115.77, "Every culture has its own fairy tales."], [116.35, 119.34, "Your turn. Say: Fairy tale."], [122.2, 123.38, "Fairy tale."], [124.12, 125.13, "Young reader."], [126.12, 128.88, "Young reader means a child who reads or is read to."], [129.48, 131.46, "Young readers love repetition."], [132.05, 134.55, "Your turn. Say: Young reader."], [137.4, 138.52, "Young reader."], [139.28, 140.32, "Values."], [141.32, 144.2, "Values means principles about what is important in life."], [144.78, 147.22, "Stories pass on a community's values."], [147.82, 150.76, "Your turn. Say: Values."], [153.6, 154.74, "Values."], [155.53, 159.2, "Part two: dialogue. Let's listen to a conversation."], [160.05, 163.15, "Visal, what kinds of stories did you hear as a child?"], [164.25, 172.23, "My grandmother would tell me Khmer folk tales every night. She used to act out the voices of the rabbit and the crocodile."], [173.32, 175.43, "Did those stories have clear morals?"], [176.52, 186.43, "Very clear. The clever rabbit would always outwit the stronger animals, which taught us that intelligence matters more than strength."], [187.52, 190.4, "Do you think those values still matter for children today?"], [191.48, 202.84, "Absolutely. Children used to learn them by listening; now they often learn them from picture books and cartoons, but the lessons haven't changed."], [204.0, 205.47, "Part three: grammar."], [206.32, 210.21, "Grammar focus: Used to and would for past habits."], [210.51, 211.71, "Look at the pattern."], [212.42, 214.97, "Parents would read fairy tales at bedtime."], [215.88, 218.6, "My grandmother used to act out the animal voices."], [219.52, 222.62, "The clever rabbit would always outwit the stronger animals."], [223.57, 234.15, "Both 'used to' and 'would' describe repeated past actions. Only 'used to' can describe past STATES: 'I used to love fairy tales' (not 'I would love'). 'Would' is common in nostalgic storytelling."], [234.92, 239.16, "Be careful! Don't say: Parents would to read fairy tales at night."], [241.1, 243.77, "Say: Parents would read fairy tales at night."], [244.07, 246.13, "After 'would', use the base verb."], [246.93, 250.06, "Part four: reading. Read and listen."], [250.87, 252.84, "More Than Bedtime Stories."], [253.14, 258.66, "Children's literature is often dismissed as simple, yet it plays a powerful role in shaping values."], [259.67, 265.02, "In many cultures, elders would pass on moral lessons through animal fables and fairy tales."], [266.03, 271.24, "These stories used to be transmitted orally, adapting slightly with each new teller and audience."], [272.23, 277.61, "Today, picture books combine words and illustrations to develop both literacy and imagination."], [278.6, 284.93, "Critics also examine what such books teach implicitly, from gender roles to attitudes toward other cultures."], [286.03, 289.92, "Part five: quiz. Five questions. Are you ready?"], [290.78, 293.46, "I blank love scary stories when I was small."], [293.76, 297.24, "A, would. B, used to. C, was used to."], [300.8, 302.78, "The answer is B: used to."], [303.92, 306.54, "Every evening, my father blank read to us."], [306.84, 309.96, "A, would. B, was. C, uses to."], [313.5, 314.9, "The answer is A: would."], [316.05, 318.48, "The lesson a story teaches is its blank."], [318.78, 323.25, "A, moral. B, illustration. C, fairy tale."], [326.8, 328.47, "The answer is A: moral."], [329.62, 331.31, "Choose the correct sentence."], [331.61, 337.58, "A, She would to tell stories.. B, She used tell stories.. C, She used to tell stories.."], [341.13, 343.6, "The answer is C: She used to tell stories.."], [344.75, 348.47, "According to the reading, how were these stories once transmitted?"], [348.77, 353.02, "A, orally. B, online. C, through films."], [356.57, 358.35, "The answer is A: orally."], [359.53, 362.58, "Part six: speaking. It's your turn to talk."], [363.42, 366.04, "How did the stories you read as a child shape you?"], [382.85, 384.41, "Now listen to Visal."], [384.71, 415.32, "The stories I heard as a child shaped my values more than I realised at the time. My mother would read me Khmer fables in which the small, clever rabbit always defeated stronger animals. These stories taught me that thinking carefully can be more powerful than physical strength. I also used to love stories about loyal friends, which made me value friendship. Some people believe children's stories are too simple to matter. I disagree, because the earliest lessons are often the deepest."], [415.62, 417.24, "Excellent answer, Visal!"], [418.15, 422.93, "Great work! Now you can use eight new words and used to and would for past habits."], [423.23, 426.97, "Today's value is love of reading. Read a book every day."], [427.27, 430.14, "See you in Unit twenty-nine. Goodbye!"], [430.44, 432.84, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C1B2-Unit29-Review-Reading-Critically": [[0.35, 5.11, "Hello, everyone! I'm Ms. Emma. Welcome to Online C one, Book two."], [5.41, 9.12, "Hi! I'm Visal. Let's learn together!"], [9.42, 16.82, "Unit twenty-nine: Review: Reading Critically. Today you will ask precise academic questions to evaluate texts."], [17.12, 19.9, "Here is our lesson map. Let's start!"], [20.83, 24.29, "Part one: words. You will learn eight new words."], [25.15, 26.36, "Critical reading."], [27.35, 31.49, "Critical reading means reading that questions and evaluates a text."], [32.08, 34.71, "Critical reading goes beyond understanding."], [35.32, 37.87, "Your turn. Say: Critical reading."], [40.7, 42.07, "Critical reading."], [42.82, 43.81, "Assumption."], [44.82, 48.14, "Assumption means something accepted as true without proof."], [48.75, 51.12, "The article rests on a hidden assumption."], [51.72, 54.61, "Your turn. Say: Assumption."], [57.47, 58.5, "Assumption."], [59.25, 60.29, "Evidence."], [61.28, 64.13, "Evidence means information that supports a claim."], [64.72, 66.74, "The author provides little evidence."], [67.35, 69.98, "Your turn. Say: Evidence."], [72.83, 73.81, "Evidence."], [74.55, 75.68, "Perspective."], [76.68, 79.22, "Perspective means a particular point of view."], [79.82, 82.28, "The report ignores the farmers' perspective."], [82.88, 85.61, "Your turn. Say: Perspective."], [88.47, 89.61, "Perspective."], [90.35, 91.21, "Bias."], [92.22, 95.04, "Bias means an unfair preference for one side."], [95.65, 97.82, "Check the source for possible bias."], [98.42, 100.93, "Your turn. Say: Bias."], [103.77, 104.84, "Bias."], [105.58, 106.57, "Context."], [107.58, 111.3, "Context means the circumstances in which a text was produced."], [111.92, 114.27, "Historical context changes the meaning."], [114.85, 117.4, "Your turn. Say: Context."], [120.23, 121.41, "Context."], [122.15, 123.0, "Evaluate."], [124.02, 127.41, "Evaluate means to judge the quality or value of something."], [128.02, 130.19, "Evaluate the strength of each argument."], [130.78, 133.3, "Your turn. Say: Evaluate."], [136.13, 137.26, "Evaluate."], [138.02, 139.24, "Interpretation."], [140.25, 143.0, "Interpretation means an explanation of meaning."], [143.62, 146.42, "Offer an interpretation supported by evidence."], [147.02, 149.7, "Your turn. Say: Interpretation."], [152.57, 153.81, "Interpretation."], [154.6, 158.34, "Part two: dialogue. Let's listen to a conversation."], [159.18, 164.8, "Visal, this is our final unit. What is the most important question a critical reader asks?"], [165.88, 174.53, "To what extent does the author support this claim? That single question forces me to check the evidence instead of trusting the tone."], [175.62, 176.77, "And after that?"], [177.88, 186.86, "What assumptions does the writer make, and whose perspective is missing? Those questions reveal bias that isn't obvious at first."], [187.95, 190.17, "How has this course changed your reading?"], [191.28, 201.68, "I no longer ask only what a text says. I ask how it creates meaning, in what context it was written, and whom it is trying to persuade."], [202.83, 204.49, "Part three: grammar."], [205.35, 209.05, "Grammar focus: Question forms in academic inquiry."], [209.34, 210.62, "Look at the pattern."], [211.32, 213.81, "To what extent does the author support this claim?"], [214.72, 216.77, "What assumptions does the writer make?"], [217.68, 219.97, "In what context was the text written?"], [220.93, 233.64, "Academic questions are open and evaluative: 'To what extent…?', 'How far…?', 'In what ways…?'. Remember question order (auxiliary + subject + verb) unless the question word is the subject: 'Whose perspective is missing?'"], [234.38, 239.14, "Be careful! Don't say: To what extent the author supports this claim?"], [241.1, 244.24, "Say: To what extent does the author support this claim?"], [244.54, 247.28, "Use question word order: does + subject."], [248.07, 250.93, "Part four: reading. Read and listen."], [251.73, 253.63, "Becoming a Critical Reader."], [253.93, 259.14, "Throughout this course, we have moved from asking what texts mean to asking how and why they mean it."], [260.13, 267.0, "A critical reader approaches every text, whether a poem, an advert or a news report, with structured questions."], [268.0, 272.86, "To what extent are the claims supported by evidence, and what assumptions lie beneath them?"], [273.87, 279.01, "Whose perspective is represented, and whose has been marginalised or left out entirely?"], [280.0, 286.27, "Such questions do not destroy our enjoyment of reading; rather, they make us more independent and thoughtful citizens."], [287.37, 291.42, "Part five: quiz. Five questions. Are you ready?"], [292.25, 294.92, "To what extent blank the evidence support the claim?"], [295.22, 298.17, "A, do. B, does. C, is."], [301.73, 303.55, "The answer is B: does."], [304.68, 306.31, "Choose the correct question."], [306.61, 313.24, "A, Whose perspective is missing?. B, Whose perspective does is missing?. C, Whose is perspective missing?."], [316.8, 319.25, "The answer is A: Whose perspective is missing?."], [320.42, 323.52, "Something accepted as true without proof is an blank."], [323.82, 327.88, "A, evidence. B, assumption. C, interpretation."], [331.43, 333.34, "The answer is B: assumption."], [334.48, 336.59, "Which collocation is correct?"], [336.89, 341.44, "A, raise a question. B, rise a question. C, do a question."], [345.0, 347.15, "The answer is A: raise a question."], [348.32, 351.84, "According to the reading, critical questions make readers…"], [352.14, 358.04, "A, enjoy reading less. B, more independent and thoughtful. C, trust every text."], [361.6, 365.06, "The answer is B: more independent and thoughtful."], [366.27, 369.57, "Part six: speaking. It's your turn to talk."], [370.42, 372.96, "What questions do you ask when reading critically?"], [389.75, 391.2, "Now listen to Visal."], [391.5, 425.8, "When I read critically, the first question I ask is to what extent the author supports the main claim with reliable evidence. Then I ask what assumptions lie beneath the argument and whose perspective may be missing. For example, an article praising a new shopping mall might ignore the street vendors who lose their income. Some people feel that such questions make reading less enjoyable. In my experience, though, they make every text more interesting, because I see how it works."], [426.1, 427.71, "Excellent answer, Visal!"], [428.62, 433.95, "Great work! Now you can use eight new words and question forms in academic inquiry."], [434.25, 438.84, "Today's value is critical thinking. Think carefully and give reasons for your opinions."], [439.14, 445.54, "Congratulations! You have finished Online C one, Book two. See you in Online C one, Book three!"], [445.83, 448.56, "Thank you, Ms. Emma! Bye, everyone!"]]};
        // English subtitles: added to the player with code, so no subtitle files are needed online.
        let subsOn = true;
        function addSubtitles(el) {
            const cues = SUBTITLES[(el.getAttribute('src') || '').split('/').pop().split('?')[0].replace('.mp4', '')]; const btn = document.getElementById('subs-btn');
            if (!cues || !el.addTextTrack || typeof VTTCue === 'undefined') { if (btn) btn.style.display = 'none'; return; }
            const tr = el.addTextTrack('subtitles', 'English', 'en');
            cues.forEach(c => { try { const q = new VTTCue(c[0], c[1], c[2]); q.line = -2; tr.addCue(q); } catch (e) {} });
            const apply = () => { tr.mode = subsOn ? 'showing' : 'hidden'; if (btn) btn.textContent = subsOn ? '💬 Subtitles: ON' : '💬 Subtitles: OFF'; };
            if (btn) btn.onclick = () => { subsOn = !subsOn; apply(); };
            apply();
        }
        function renderMp4Lesson(contentDiv, unitData) {
            contentDiv.innerHTML = `
                <h2 class="text-xl font-bold text-indigo-900 mb-2">📹 Video Lesson — Unit ${state.unit}: ${unitData.title}</h2>
                <p class="text-gray-600 mb-4">${ytCurrentConfig.checkpoints.length ? 'Watch the video. It will pause at a few points so you can answer a quick question!' : 'Watch Ms. Emma and Visal, then try the other learning modules!'}</p>
                <div class="relative bg-black rounded-2xl overflow-hidden" style="aspect-ratio:16/9;">
                    <video id="mp4-player" src="${ytCurrentConfig.mp4}" controls playsinline preload="metadata" class="w-full h-full" style="object-fit:contain;"></video>
                    <div id="checkpoint-overlay" class="absolute inset-0 bg-indigo-900/95 flex items-center justify-center p-6" style="display:none;"></div>
                </div>
                <p id="video-msg" class="text-sm text-gray-500 mt-3 text-center min-h-[1.25rem]">▶️ Press play to start the lesson!</p>
                <div class="text-center mt-2 flex justify-center gap-3 flex-wrap"><button id="subs-btn" class="bg-white border border-indigo-300 text-indigo-700 font-bold px-4 py-2 rounded-full shadow cursor-pointer">💬 Subtitles: ON</button><button onclick="nextLesson()" class="bg-emerald-700 hover:bg-emerald-800 text-white font-bold px-4 py-2 rounded-full shadow cursor-pointer">Next Lesson ▶️</button></div>`;
            const el = document.getElementById('mp4-player');
            addSubtitles(el);
            { const a = document.getElementById('footer-next-module'), b = document.getElementById('footer-next-lesson'); if (a) a.style.display = ''; if (b) b.style.display = 'none'; }
            ytPlayer = {
                getCurrentTime: () => el.currentTime,
                pauseVideo: () => el.pause(),
                playVideo: () => { const p = el.play(); if (p && p.catch) p.catch(() => {}); },
                destroy: () => { try { el.pause(); el.removeAttribute('src'); el.load(); } catch (e) {} }
            };
            el.addEventListener('play', () => { const m = document.getElementById('video-msg'); if (m) m.textContent = ''; });
            el.addEventListener('timeupdate', () => { if (ytCurrentConfig && ytCurrentConfig.checkpoints.length) checkVideoCheckpoints(); });
            el.addEventListener('ended', () => {
                const got = award(unitKey('video-' + ytCurrentConfig.id), 5);
                const m = document.getElementById('video-msg');
                if (m) m.textContent = '🎉 Great job watching the whole video!' + (got ? ' (+5 ⭐)' : '');

            });
        }

        function onYtStateChange(event) {
            const msg = document.getElementById('video-msg');
            if (event.data === YT.PlayerState.PLAYING) {
                if (ytPollInterval) clearInterval(ytPollInterval);
                if (ytCurrentConfig && ytCurrentConfig.checkpoints.length) ytPollInterval = setInterval(checkVideoCheckpoints, 400);
                if (msg) msg.textContent = '';
            } else if (event.data === YT.PlayerState.PAUSED || event.data === YT.PlayerState.ENDED) {
                if (ytPollInterval) { clearInterval(ytPollInterval); ytPollInterval = null; }
                if (event.data === YT.PlayerState.ENDED) {
                    const got = award(unitKey('video-' + ytCurrentConfig.id), 5);
                    markActivityComplete('video');
                    if (msg) msg.textContent = '🎉 Great job watching the whole video!' + (got ? ' (+5 ⭐)' : '');
                }
            }
        }

        function checkVideoCheckpoints() {
            if (!ytPlayer || typeof ytPlayer.getCurrentTime !== 'function' || !ytCurrentConfig) return;
            let t = 0;
            try { t = ytPlayer.getCurrentTime(); } catch (e) { return; }
            ytCurrentConfig.checkpoints.forEach((cp, idx) => {
                if (!ytAnsweredCheckpoints.has(idx) && t >= cp.time) {
                    ytAnsweredCheckpoints.add(idx);
                    showVideoCheckpoint(idx);
                }
            });
        }

        function showVideoCheckpoint(idx) {
            const cp = ytCurrentConfig.checkpoints[idx];
            ytPlayer.pauseVideo();
            if (ytPollInterval) { clearInterval(ytPollInterval); ytPollInterval = null; }
            const overlay = document.getElementById('checkpoint-overlay');
            overlay.style.display = 'flex';
            overlay.innerHTML = `
                <div class="bg-white rounded-2xl p-6 max-w-md w-full text-center">
                    <p class="text-sm font-bold text-indigo-600 mb-2">🤔 Quick Question!</p>
                    <p class="font-bold text-lg text-gray-800 mb-4">${cp.question}</p>
                    <div class="flex flex-col gap-2" id="checkpoint-options">
                        ${cp.options.map((opt, i) => `<button onclick="answerVideoCheckpoint(${idx}, ${i})" class="bg-indigo-50 hover:bg-indigo-100 text-indigo-900 font-semibold p-3 rounded-xl cursor-pointer">${opt}</button>`).join('')}
                    </div>
                    <p id="checkpoint-feedback" class="mt-3 font-bold min-h-[1.5rem]"></p>
                </div>`;
        }

        function answerVideoCheckpoint(idx, chosenIndex) {
            const cp = ytCurrentConfig.checkpoints[idx];
            const feedback = document.getElementById('checkpoint-feedback');
            const optionsDiv = document.getElementById('checkpoint-options');
            optionsDiv.querySelectorAll('button').forEach(b => b.disabled = true);
            if (chosenIndex === cp.correct) {
                feedback.className = 'mt-3 font-bold min-h-[1.5rem] text-green-600';
                feedback.textContent = award(unitKey('video-' + ytCurrentConfig.id + '-q' + idx), 2) ? '🎉 Correct! (+2 ⭐)' : '🎉 Correct!';
            } else {
                feedback.className = 'mt-3 font-bold min-h-[1.5rem] text-red-500';
                feedback.textContent = `❌ Not quite — the answer was "${cp.options[cp.correct]}"`;
            }
            const nextBtn = document.createElement('button');
            nextBtn.textContent = 'Next ▶️';
            nextBtn.className = 'mt-4 bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-6 py-2 rounded-full shadow cursor-pointer';
            nextBtn.onclick = resumeVideoAfterCheckpoint;
            feedback.insertAdjacentElement('afterend', nextBtn);
        }

        function resumeVideoAfterCheckpoint() {
            document.getElementById('checkpoint-overlay').style.display = 'none';
            if (ytPlayer) ytPlayer.playVideo();

        function renderContent() {
            let contentDiv = document.getElementById('module-content');

            if (state.tab === 'video') { renderVideoLesson(contentDiv); return; }

            if (state.tab === 'listening') renderListening(contentDiv, unitData);
            else if (state.tab === 'speaking') renderSpeaking(contentDiv, unitData);

            else if (state.tab === 'quiz') renderQuiz(contentDiv, unitData);
            else if (state.tab === 'letstalk') renderLetsTalk(contentDiv, unitData);
            else if (state.tab === 'exam') renderExamPractice(contentDiv, unitData);
            else if (state.tab === 'culture') renderCultureCorner(contentDiv, unitData);
            else if (state.tab === 'vocabgame') renderVocabGame(contentDiv, unitData);
            else if (state.tab === 'spelling') renderSpelling(contentDiv, unitData);
            else if (state.tab === 'sentence') renderSentenceBuilding(contentDiv, unitData);
            else if (state.tab === 'roleplay') renderRolePlay(contentDiv, unitData);
            else if (state.tab === 'dictation') renderDictation(contentDiv, unitData);
            else if (state.tab === 'review') renderReview(contentDiv, unitData);
            else if (state.tab === 'pronunciation') renderPronunciationDrill(contentDiv, unitData);
            else if (state.tab === 'summary') renderSummaryWriting(contentDiv, unitData);
            else if (state.tab === 'headline') renderHeadlineWriting(contentDiv, unitData);
            else if (state.tab === 'factopinion') renderFactOpinion(contentDiv, unitData);
            else if (state.tab === 'debate') renderDebateCorner(contentDiv, unitData);
            else if (state.tab === 'discussion') renderDiscussion(contentDiv, unitData);
            else if (state.tab === 'assignment') renderAssignment(contentDiv, unitData);
            else if (state.tab === 'paraphrase') renderParaphrase(contentDiv, unitData);
            else if (state.tab === 'plan') renderGoal(contentDiv, unitData);
        }

        // ===== 1. LISTENING (flip cards: front = word, back = picture) =====
        let listenState = { storyDone: false };
        function renderListening(contentDiv, unitData) {
            listenState = { storyDone: false };
            const supported = 'speechSynthesis' in window;
            contentDiv.innerHTML = `
                <h2 class="text-xl font-bold text-blue-900 mb-2">🔊 Listening: Unit ${state.unit} - ${unitData.title}</h2>
                <p class="text-gray-600 mb-4">Tap each card to hear it and flip to the picture!</p>
                <div class="bg-blue-50 border-2 border-dashed border-blue-300 rounded-2xl p-6">

                        ${unitData.vocab.map((w, i) => `
                            <div class="flip-card" id="lw-${i}" role="button" tabindex="0" onclick="playListenWord('${escapeJsStr(w)}', ${i})">
                                <div class="flip-card-inner">
                                    <div class="flip-card-front bg-white shadow font-bold text-blue-900 ${wasAwarded(unitKey('listen-' + i)) ? 'ring-4 ring-green-400' : ''}">

                                    <div class="flip-card-back bg-blue-600 shadow text-white">

                                </div>

                    <div class="text-center">
                        <button onclick="playListenStory()" class="bg-green-600 hover:bg-green-700 text-white font-bold px-6 py-3 rounded-full shadow-lg transition cursor-pointer">▶ Play the Story</button>
                        <p id="audio-msg" class="text-sm text-green-700 mt-3 font-semibold min-h-[1.25rem]">${supported ? '' : '⚠️ This browser cannot speak audio - try Chrome or Edge.'}</p>
                    </div>
                </div>`;
        }
        function playListenWord(word, i) {
            speak(word);
            const card = document.getElementById('lw-' + i);
            card.classList.toggle('flipped');
            if (award(unitKey('listen-' + i), 1)) card.querySelector('.flip-card-front').classList.add('ring-4', 'ring-green-400');
        }
        function playListenStory() {
            const unitData = curriculum[state.level][state.unit];
            document.getElementById('audio-msg').textContent = "🔊 Playing story...";
            speak(unitData.story, () => {
                if (listenState.storyDone) return;
                listenState.storyDone = true;
                document.getElementById('audio-msg').textContent = "✅ Great listening!" + (award(unitKey('story'), 2) ? ' (+2 ⭐)' : '');
                markActivityComplete('listening');
            });
        }

        // ===== 3. READING =====
        // How many real words an answer needs, by level (a single letter no longer earns stars)
        const MIN_WORDS = { Master: 10, Beginner: 3, Elementary: 4, PreIntermediate: 5, Intermediate: 6, UpperIntermediate: 7, Advanced: 8, Proficiency: 8 };
        const minWords = () => MIN_WORDS[state.level] || 3;
        function textCheck(msg, text, need, okText, key, amount) {
            const n = countWords(text);
            if (n < need) {
                msg.className = "text-sm mt-2 font-semibold text-red-500";
                msg.textContent = n === 0 ? "✏️ Write something first!" : `✏️ Write a little more — at least ${need} words (you have ${n}).`;
                return false;
            }
            msg.className = "text-sm mt-2 font-semibold text-green-600";
            msg.textContent = okText + starNote(award(key, amount), amount);
            return true;
        }
        function renderReading(contentDiv, unitData) {
            const newWord = unitData.vocab[unitData.vocab.length - 1];
            contentDiv.innerHTML = `
                <h2 class="text-xl font-bold text-blue-900 mb-2">📖 Reading Time</h2>
                <div class="bg-indigo-50 p-6 rounded-2xl border border-indigo-200">
                    <p class="text-md text-indigo-900 font-semibold mb-2">Unit ${state.unit}: ${unitData.title}</p>
                    <p class="text-gray-800 leading-relaxed bg-white p-5 rounded-xl shadow-inner text-lg mb-3">"${unitData.story}"</p>
                    <button onclick="readStoryAloud()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-5 py-2 rounded-full shadow cursor-pointer">🔊 Read Aloud</button>
                    <div class="mt-6 bg-white p-4 rounded-xl border border-indigo-100">
                        <p class="font-bold text-indigo-900 mb-2">🤔 Question 1: ${unitData.question}</p>
                        <textarea id="reading-answer" rows="2" placeholder="Type your answer here..." class="w-full p-2 border border-gray-300 rounded-lg text-sm"></textarea>
                        <button onclick="checkReadingAnswer()" class="mt-2 bg-indigo-700 hover:bg-indigo-800 text-white font-bold px-4 py-2 rounded-xl shadow cursor-pointer text-sm">Check My Answer</button>
                        <p id="reading-msg" class="text-sm mt-2 font-semibold min-h-[1.25rem]"></p>
                    </div>
                    <div class="mt-4 bg-white p-4 rounded-xl border border-indigo-100">
                        <p class="font-bold text-indigo-900 mb-2">🤔 Question 2: Pick a word from this unit (e.g. "${newWord}") that is new to you. Write your own sentence using it.</p>
                        <textarea id="reading-answer2" rows="2" placeholder="Type your sentence here..." class="w-full p-2 border border-gray-300 rounded-lg text-sm"></textarea>
                        <button onclick="checkReadingAnswer2()" class="mt-2 bg-indigo-700 hover:bg-indigo-800 text-white font-bold px-4 py-2 rounded-xl shadow cursor-pointer text-sm">Check My Sentence</button>
                        <p id="reading-msg2" class="text-sm mt-2 font-semibold min-h-[1.25rem]"></p>
                    </div>
                </div>`;
        }
        function readStoryAloud() {
            speak(curriculum[state.level][state.unit].story);
        }
        function checkReadingAnswer() {
            textCheck(document.getElementById('reading-msg'), document.getElementById('reading-answer').value, minWords(), "🎉 Great thinking!", unitKey('reading1'), 3);
        }
        function checkReadingAnswer2() {
            const val = document.getElementById('reading-answer2').value;
            const msg = document.getElementById('reading-msg2');
            if (countWords(val) >= minWords() && usedUnitWords(val, curriculum[state.level][state.unit]).length === 0) {
                msg.className = "text-sm mt-2 font-semibold text-amber-600";
                msg.textContent = "✏️ Nice sentence — now include one word from this unit!";
                return;
            }
            if (textCheck(msg, val, minWords(), "🎉 Nice work with a new word!", unitKey('reading2'), 3)) markActivityComplete('reading');
        }

        // ===== 4. GRAMMAR BOX =====
        function renderGrammar(contentDiv, unitData) {
            const g = unitData.grammar;
            const word2 = unitData.vocab[Math.floor(unitData.vocab.length / 2)];
            contentDiv.innerHTML = `
                <h2 class="text-xl font-bold text-blue-900 mb-2">📐 Grammar Box</h2>
                <p class="text-gray-600 mb-4">Unit ${state.unit}: ${unitData.title}</p>
                <div class="bg-sky-50 p-6 rounded-2xl border border-sky-200">
                    <div class="bg-white p-5 rounded-xl shadow-inner mb-4">
                        <p class="text-sm text-sky-600 font-semibold mb-1">Today's pattern:</p>
                        <p class="text-2xl font-bold text-sky-900">${g.point}</p>
                    </div>
                    <div class="bg-white p-4 rounded-xl border border-sky-100 mb-4">
                        <p class="text-sm text-sky-600 font-semibold mb-1">Example:</p>
