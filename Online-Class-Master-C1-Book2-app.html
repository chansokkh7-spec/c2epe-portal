s; remove them and the sentence still works. Compare: 'Signs that are cultural vary' vs 'Signs, which are cultural, vary'."], [240.38, 245.4, "Be careful! Don't say: A sign which links form to meaning is central."], [247.37, 250.4, "Say: A sign, which links form to meaning, is central."], [250.7, 252.83, "Extra information needs commas."], [253.63, 256.19, "Part four: reading. Read and listen."], [257.0, 258.61, "Reading the World as Text."], [258.9, 264.75, "Semiotics treats almost everything, from traffic lights to clothing, as a sign that can be read."], [265.73, 272.45, "Saussure divided the sign into the signifier, which is its form, and the signified, which is the concept it evokes."], [273.43, 278.64, "The connection between the two is usually arbitrary, so meaning depends on shared cultural codes."], [279.63, 285.28, "Signs that seem natural, such as colours for mourning, in fact differ widely between societies."], [286.27, 291.23, "Learning to read connotation, therefore, is a key skill in an image-saturated age."], [292.33, 296.28, "Part five: quiz. Five questions. Are you ready?"], [297.12, 300.02, "Choose the sentence where the clause adds EXTRA information."], [300.32, 308.15, "A, The signs that we share are cultural.. B, Colours that mean danger are bright.. C, The lotus, which grows in mud, means purity.."], [311.7, 315.6, "The answer is C: The lotus, which grows in mud, means purity.."], [316.75, 320.22, "The emotional associations of a word are its blank."], [320.52, 324.46, "A, denotation. B, connotation. C, signifier."], [328.0, 330.38, "The answer is B: connotation."], [331.52, 335.98, "The physical form of a sign, such as a sound or image, is the blank."], [336.28, 340.48, "A, signified. B, interpretant. C, signifier."], [344.03, 346.28, "The answer is C: signifier."], [347.42, 349.23, "Which collocation is correct?"], [349.53, 355.28, "A, carry connotations. B, hold up connotations. C, do connotations."], [358.83, 361.48, "The answer is A: carry connotations."], [362.62, 367.15, "According to the reading, the link between signifier and signified is usually…"], [367.45, 371.56, "A, arbitrary. B, natural. C, universal."], [375.1, 377.68, "The answer is A: arbitrary."], [378.87, 382.4, "Part six: speaking. It's your turn to talk."], [383.25, 386.63, "What is a symbol in your culture that carries strong connotation?"], [403.42, 404.96, "Now listen to Visal."], [405.26, 437.15, "In Cambodian culture, the image of Angkor Wat carries an especially strong connotation. Its denotation is simply a temple, but it signifies national pride, history and resilience after years of conflict. That is why it appears on our flag, on banknotes and even on beer labels. Some people feel that such commercial use weakens its meaning. In my view, though, its constant presence shows how deeply the symbol is woven into our identity."], [437.45, 439.3, "Excellent answer, Visal!"], [440.18, 445.54, "Great work! Now you can use eight new words and defining vs non-defining clauses."], [445.84, 451.11, "Today's value is cultural awareness. Notice the meanings your culture gives to signs and symbols."], [451.4, 453.98, "See you in Unit eleven. Goodbye!"], [454.28, 457.6, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C1B2-Unit11-Discourse-Analysis": [[0.35, 5.22, "Hello, everyone! I'm Ms. Emma. Welcome to Online C one, Book two."], [5.52, 9.05, "Hi! I'm Visal. Let's learn together!"], [9.35, 15.83, "Unit eleven: Discourse Analysis. Today you will emphasise processes rather than agents with the passive."], [16.13, 18.76, "Here is our lesson map. Let's start!"], [19.7, 22.82, "Part one: words. You will learn eight new words."], [23.68, 24.78, "Discourse."], [25.78, 30.37, "Discourse means language in use, especially as it reflects social practices."], [30.98, 34.21, "Political discourse often avoids naming responsibility."], [34.82, 37.43, "Your turn. Say: Discourse."], [40.3, 41.42, "Discourse."], [42.18, 43.05, "Register."], [44.05, 47.64, "Register means the variety of language suited to a situation."], [48.25, 50.8, "The email shifted into an informal register."], [51.38, 54.23, "Your turn. Say: Register."], [57.07, 57.86, "Register."], [58.62, 59.68, "Context."], [60.68, 63.8, "Context means the situation that gives words their meaning."], [64.38, 67.03, "Out of context, the quotation is misleading."], [67.62, 69.89, "Your turn. Say: Context."], [72.73, 73.79, "Context."], [74.55, 75.9, "Power dynamics."], [76.88, 81.23, "Power dynamics means the way power is distributed and exercised between people."], [81.82, 84.7, "Interruptions reveal the power dynamics in a meeting."], [85.28, 88.54, "Your turn. Say: Power dynamics."], [91.4, 92.75, "Power dynamics."], [93.48, 94.21, "Framing."], [95.22, 99.91, "Framing means presenting an issue so that a particular interpretation is encouraged."], [100.52, 103.0, "The framing of the story blamed the victims."], [103.62, 106.14, "Your turn. Say: Framing."], [109.0, 109.86, "Framing."], [110.62, 111.85, "Implicature."], [112.85, 116.57, "Implicature means what is suggested by an utterance without being said."], [117.18, 120.67, "'Some students passed' carries the implicature that not all did."], [121.28, 124.0, "Your turn. Say: Implicature."], [126.87, 128.11, "Implicature."], [128.85, 129.82, "Cohesion."], [130.82, 134.15, "Cohesion means the grammatical links that hold a text together."], [134.75, 137.06, "Pronouns and connectors create cohesion."], [137.65, 139.84, "Your turn. Say: Cohesion."], [142.7, 143.68, "Cohesion."], [144.42, 145.77, "Genre convention."], [146.75, 150.6, "Genre convention means an expected feature of a type of text."], [151.18, 154.05, "Formal greetings are a genre convention of letters."], [154.65, 157.72, "Your turn. Say: Genre convention."], [160.57, 161.86, "Genre convention."], [162.67, 166.64, "Part two: dialogue. Let's listen to a conversation."], [167.48, 171.42, "Visal, what did you notice in the two news reports about the protest?"], [172.52, 180.93, "One said 'police injured protesters'; the other said 'protesters were injured'. In the second, the agent was simply removed."], [182.02, 184.45, "So the passive can hide responsibility."], [185.55, 194.36, "Yes. Meaning is shaped as much by framing as by the words themselves, and responsibility can be quietly erased."], [195.45, 197.58, "Did you find any implicature too?"], [198.68, 207.18, "The second report noted that 'some protesters were peaceful', which implies that most were not, without ever saying so."], [208.33, 209.99, "Part three: grammar."], [210.85, 213.92, "Grammar focus: Passive for emphasis on process."], [214.22, 215.44, "Look at the pattern."], [216.15, 219.73, "Meaning is shaped as much by framing as by words themselves."], [220.62, 222.77, "Protesters were injured during the march."], [223.68, 227.1, "Responsibility can be erased by a simple change of structure."], [228.03, 239.21, "The passive puts the process or the affected person in focus and lets the writer omit the agent. Analysts ask: who has been left out, and why? 'As much by X as by Y' adds balance."], [239.95, 243.76, "Be careful! Don't say: Meaning is shape by framing."], [245.7, 248.27, "Say: Meaning is shaped by framing."], [248.57, 250.94, "Passive: be + past participle."], [251.73, 254.16, "Part four: reading. Read and listen."], [254.97, 256.15, "Words and Power."], [256.45, 261.76, "Discourse analysis studies language not as an abstract system but as a social practice."], [262.77, 269.18, "Analysts examine how choices of vocabulary, grammar and framing position readers to accept particular views."], [270.17, 276.08, "When an agent is omitted through the passive, responsibility for an action can become strangely invisible."], [277.07, 283.06, "Implicature works more subtly, since readers infer meanings that the writer never explicitly states."], [284.07, 289.49, "Recognising these strategies is essential if citizens are to read news and political speeches critically."], [290.6, 294.68, "Part five: quiz. Five questions. Are you ready?"], [295.52, 297.73, "Choose the passive that hides the agent."], [298.02, 303.7, "A, The minister cut the budget.. B, The budget was cut.. C, The minister was cutting the budget.."], [307.23, 309.93, "The answer is B: The budget was cut.."], [311.08, 316.12, "'Some guests enjoyed the food' suggests that others did not. This is an example of blank."], [316.42, 320.95, "A, implicature. B, cohesion. C, register."], [324.5, 326.69, "The answer is A: implicature."], [327.85, 331.01, "Meaning is shaped as much by framing blank by words."], [331.31, 334.05, "A, than. B, as. C, like."], [337.6, 339.39, "The answer is B: as."], [340.55, 343.64, "Pronouns and connectors create blank in a text."], [343.94, 347.98, "A, framing. B, power dynamics. C, cohesion."], [351.53, 353.36, "The answer is C: cohesion."], [354.52, 358.18, "According to the reading, discourse analysis treats language as…"], [358.48, 364.7, "A, an abstract system. B, a social practice. C, a set of grammar rules only."], [368.23, 370.84, "The answer is B: a social practice."], [372.03, 375.16, "Part six: speaking. It's your turn to talk."], [376.02, 378.89, "How does the way something is 'framed' change its meaning?"], [395.68, 397.23, "Now listen to Visal."], [397.53, 428.53, "Framing changes meaning because it tells us which part of a story is important before we have thought about it. For example, describing a tax as 'relief' suggests that taxes are a burden, while 'investment' suggests a benefit. The facts are identical, yet readers react differently. Some argue that every message is framed, so we cannot avoid it. That is true, which is why I think we should always ask who chose the frame and what it leaves out."], [428.83, 430.75, "Excellent answer, Visal!"], [431.65, 436.45, "Great work! Now you can use eight new words and passive for emphasis on process."], [436.75, 442.9, "Today's value is critical awareness. Use technology wisely, and always think for yourself."], [443.2, 445.77, "See you in Unit twelve. Goodbye!"], [446.07, 448.52, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C1B2-Unit12-Media-Studies": [[0.35, 5.08, "Hello, everyone! I'm Ms. Emma. Welcome to Online C one, Book two."], [5.38, 9.31, "Hi! I'm Visal. Let's learn together!"], [9.62, 16.44, "Unit twelve: Media Studies. Today you will explain causes and consequences in the media with formal connectors."], [16.74, 19.21, "Here is our lesson map. Let's start!"], [20.17, 23.98, "Part one: words. You will learn eight new words."], [24.82, 25.92, "Mass media."], [26.92, 32.43, "Mass media means channels such as TV, newspapers and the internet that reach large audiences."], [33.05, 35.13, "Mass media shape public opinion."], [35.72, 38.62, "Your turn. Say: Mass media."], [41.47, 42.66, "Mass media."], [43.42, 44.81, "Representation."], [45.82, 49.33, "Representation means the way a group or issue is portrayed."], [49.92, 53.67, "The representation of rural people is often stereotyped."], [54.28, 57.04, "Your turn. Say: Representation."], [59.9, 61.19, "Representation."], [61.95, 62.95, "Audience."], [63.95, 66.95, "Audience means the people a media text is aimed at."], [67.55, 70.13, "Each channel targets a different audience."], [70.72, 73.28, "Your turn. Say: Audience."], [76.13, 77.16, "Audience."], [77.92, 79.05, "Gatekeeping."], [80.05, 84.19, "Gatekeeping means the process of deciding which information reaches the public."], [84.78, 87.02, "Editors perform a gatekeeping role."], [87.62, 90.36, "Your turn. Say: Gatekeeping."], [93.2, 94.31, "Gatekeeping."], [95.05, 96.22, "Agenda-setting."], [97.22, 101.47, "Agenda-setting means the media's power to decide which issues seem important."], [102.08, 105.22, "Agenda-setting explains why some crises are ignored."], [105.82, 108.27, "Your turn. Say: Agenda-setting."], [111.13, 112.28, "Agenda-setting."], [113.05, 114.09, "Consumption."], [115.08, 118.07, "Consumption means the act of using or watching media."], [118.68, 121.34, "News consumption has moved to mobile phones."], [121.95, 124.64, "Your turn. Say: Consumption."], [127.5, 128.65, "Consumption."], [129.42, 130.36, "Bias."], [131.35, 134.3, "Bias means an unfair preference for one side."], [134.92, 137.65, "The report showed a clear bias toward the government."], [138.25, 140.55, "Your turn. Say: Bias."], [143.4, 144.28, "Bias."], [145.05, 146.12, "Literacy."], [147.12, 150.82, "Literacy means the ability to understand and evaluate texts."], [151.42, 153.65, "Media literacy should be taught at school."], [154.25, 156.94, "Your turn. Say: Literacy."], [159.8, 160.86, "Literacy."], [161.67, 165.47, "Part two: dialogue. Let's listen to a conversation."], [166.32, 170.2, "Visal, why did the floods in the north receive so little coverage last month?"], [171.28, 178.92, "Because of agenda-setting. The election dominated the news, so the floods were pushed off the front pages."], [180.02, 181.65, "Is that a form of bias?"], [182.75, 194.41, "Not deliberate bias, perhaps, but gatekeeping has consequences. Owing to limited airtime, editors must choose, and rural stories often lose."], [195.52, 197.57, "What can ordinary viewers do about it?"], [198.68, 208.06, "Develop media literacy. As a result of comparing several sources, we notice not only how stories are told but which ones are missing."], [209.2, 210.6, "Part three: grammar."], [211.45, 214.78, "Grammar focus: Cause and effect connectors."], [215.09, 216.28, "Look at the pattern."], [216.98, 220.27, "Because of agenda-setting, certain stories receive more coverage."], [221.18, 224.6, "Owing to limited airtime, editors must choose carefully."], [225.48, 228.57, "As a result of comparing sources, we notice what is missing."], [229.53, 239.1, "'Because of / owing to / due to / as a result of' are followed by a noun or -ing, never a full clause. 'Because' + clause; 'consequently / therefore' begin a new sentence with the effect."], [239.85, 244.21, "Be careful! Don't say: Because agenda-setting, some stories get coverage."], [246.17, 249.91, "Say: Because of agenda-setting, some stories get coverage."], [250.21, 251.88, "Use 'because of' + noun."], [252.67, 255.25, "Part four: reading. Read and listen."], [256.03, 257.75, "Who Decides What Is News?."], [258.05, 262.23, "The news we consume each day is the result of countless editorial decisions."], [263.23, 268.89, "Because of limited space and time, gatekeepers select a small fraction of possible stories."], [269.9, 276.46, "Agenda-setting research suggests that the media may not tell us what to think, but it strongly influences what we think about."], [277.47, 282.74, "Owing to the rise of social media, algorithms now perform much of this gatekeeping invisibly."], [283.73, 288.37, "Consequently, media literacy has become a civic skill rather than an academic one."], [289.47, 293.51, "Part five: quiz. Five questions. Are you ready?"], [294.35, 297.19, "blank limited airtime, the story was cut."], [297.49, 301.32, "A, Owing to. B, Because. C, Therefore."], [304.87, 306.92, "The answer is A: Owing to."], [308.08, 309.77, "Choose the correct sentence."], [310.07, 317.06, "A, Because of the rain was heavy, we stayed.. B, Because the rain was heavy, we stayed.. C, Because of heavy, we stayed.."], [320.6, 324.12, "The answer is B: Because the rain was heavy, we stayed.."], [325.28, 329.04, "The media's power to decide which issues seem important is blank."], [329.34, 334.12, "A, gatekeeping. B, consumption. C, agenda-setting."], [337.67, 340.05, "The answer is C: agenda-setting."], [341.18, 343.03, "Which collocation is correct?"], [343.33, 347.81, "A, show a bias. B, do a bias. C, make bias of."], [351.37, 354.07, "The answer is A: show a bias."], [355.22, 358.5, "According to the reading, who now performs much gatekeeping?"], [358.81, 362.84, "A, readers. B, algorithms. C, governments."], [366.4, 368.34, "The answer is B: algorithms."], [369.53, 372.63, "Part six: speaking. It's your turn to talk."], [373.48, 377.4, "What is one way media literacy could help you evaluate the news?"], [394.18, 395.67, "Now listen to Visal."], [395.97, 429.03, "One way media literacy helps me is by encouraging me to check who produced a story and why. Because of this habit, I compare at least two sources before sharing anything important. For example, a viral post about a dangerous medicine turned out to come from a site selling an alternative product. Some people say this takes too much time. However, as a result of a few minutes of checking, we can avoid spreading misinformation to hundreds of people."], [429.33, 431.51, "Excellent answer, Visal!"], [432.42, 437.11, "Great work! Now you can use eight new words and cause and effect connectors."], [437.41, 442.65, "Today's value is media literacy. Ask who made the message, and why, before you believe it."], [442.95, 445.88, "See you in Unit thirteen. Goodbye!"], [446.19, 448.73, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C1B2-Unit13-Cultural-Criticism": [[0.35, 5.14, "Hello, everyone! I'm Ms. Emma. Welcome to Online C one, Book two."], [5.44, 8.62, "Hi! I'm Visal. Let's learn together!"], [8.92, 15.99, "Unit thirteen: Cultural Criticism. Today you will hold contrasting ideas together with 'even as' and 'even though'."], [16.29, 18.86, "Here is our lesson map. Let's start!"], [19.8, 23.27, "Part one: words. You will learn eight new words."], [24.12, 25.02, "Hegemony."], [26.02, 30.18, "Hegemony means dominance of one group, often through cultural influence."], [30.78, 33.64, "Hollywood's hegemony shapes global tastes."], [34.25, 37.05, "Your turn. Say: Hegemony."], [39.9, 40.75, "Hegemony."], [41.52, 42.78, "Ideology."], [43.78, 47.76, "Ideology means a system of ideas and beliefs that shapes behaviour."], [48.35, 51.38, "Advertising carries a consumerist ideology."], [51.98, 54.41, "Your turn. Say: Ideology."], [57.27, 58.52, "Ideology."], [59.28, 60.53, "Subculture."], [61.52, 65.35, "Subculture means a group with values distinct from the mainstream."], [65.95, 68.22, "Skateboarding began as a subculture."], [68.82, 71.45, "Your turn. Say: Subculture."], [74.3, 75.49, "Subculture."], [76.25, 77.44, "Resistance."], [78.45, 82.27, "Resistance means refusal to accept dominant values or power."], [82.88, 85.24, "Street art can be a form of resistance."], [85.85, 88.56, "Your turn. Say: Resistance."], [91.4, 92.54, "Resistance."], [93.28, 94.49, "Commodification."], [95.48, 99.13, "Commodification means turning something into a product to be sold."], [99.72, 102.58, "The commodification of tradition worries elders."], [103.18, 106.1, "Your turn. Say: Commodification."], [108.97, 110.27, "Commodification."], [111.02, 112.77, "Identity politics."], [113.78, 118.16, "Identity politics means political positions based on group identity."], [118.75, 121.91, "Identity politics shapes many modern debates."], [122.52, 126.26, "Your turn. Say: Identity politics."], [129.1, 131.09, "Identity politics."], [131.85, 133.09, "Appropriation."], [134.08, 138.53, "Appropriation means taking elements of another culture without understanding or credit."], [139.12, 141.99, "The brand was accused of cultural appropriation."], [142.58, 145.56, "Your turn. Say: Appropriation."], [148.4, 149.69, "Appropriation."], [150.45, 151.59, "Authenticity."], [152.58, 155.44, "Authenticity means the quality of being genuine."], [156.05, 158.43, "Tourists often seek authenticity."], [159.02, 161.63, "Your turn. Say: Authenticity."], [164.5, 165.75, "Authenticity."], [166.53, 170.18, "Part two: dialogue. Let's listen to a conversation."], [171.05, 177.75, "Visal, your essay discusses traditional Khmer patterns appearing on international fashion brands. Is that a good thing?"], [178.85, 188.24, "It's complicated. Even as our culture gains global attention, questions of authenticity and credit remain unresolved."], [189.35, 190.72, "Where do you draw the line?"], [191.82, 201.88, "Appreciation involves understanding and credit. Appropriation happens when a brand profits from a pattern even though local weavers receive nothing."], [202.98, 206.91, "And what about young Cambodians who mix traditional and modern styles?"], [208.02, 215.37, "I see that as creative resistance. Even though it changes the tradition, it keeps it alive on our own terms."], [216.53, 218.41, "Part three: grammar."], [219.25, 222.83, "Grammar focus: Even as and even though clauses."], [223.13, 224.45, "Look at the pattern."], [225.15, 230.12, "Even as culture spreads globally, questions of authenticity remain."], [231.02, 234.42, "Even though local weavers receive nothing, the brand profits."], [235.32, 238.44, "Even as the tradition changes, it stays alive."], [239.4, 248.65, "'Even as' = at the same time as something develops (two simultaneous processes). 'Even though' = despite a known fact. Both are followed by a full clause."], [249.38, 254.3, "Be careful! Don't say: Even as culture spread globally, questions remains."], [256.23, 260.62, "Say: Even as culture spreads globally, questions remain."], [260.93, 262.95, "Check subject–verb agreement."], [263.73, 266.25, "Part four: reading. Read and listen."], [267.03, 268.37, "Who Owns Culture?."], [268.67, 274.49, "Cultural criticism asks how power operates through everyday objects, images and practices."], [275.5, 281.47, "Even as globalisation makes cultural exchange easier, it often reproduces existing inequalities."], [282.47, 287.36, "When a subculture's style is commodified, it may lose the very meaning that made it attractive."], [288.37, 295.44, "Critics therefore distinguish between appreciation, which involves respect and credit, and appropriation, which does not."], [296.43, 301.46, "Even though the line can be blurred, asking who benefits is usually a reliable starting point."], [302.57, 306.5, "Part five: quiz. Five questions. Are you ready?"], [307.35, 310.81, "blank the city modernises, its old markets are disappearing."], [311.11, 314.69, "A, Even as. B, Even if. C, Even."], [318.23, 320.64, "The answer is A: Even as."], [321.78, 324.77, "Turning a tradition into a product to sell is blank."], [325.07, 329.3, "A, resistance. B, commodification. C, hegemony."], [332.87, 335.48, "The answer is B: commodification."], [336.62, 339.81, "Taking another culture's elements without credit is blank."], [340.11, 344.82, "A, appropriation. B, authenticity. C, ideology."], [348.37, 350.62, "The answer is A: appropriation."], [351.78, 353.42, "Choose the correct sentence."], [353.72, 363.7, "A, Even though the brand profits, but weavers earn nothing.. B, Even the brand profits, weavers earn nothing.. C, Even though the brand profits, weavers earn nothing.."], [367.27, 371.6, "The answer is C: Even though the brand profits, weavers earn nothing.."], [372.75, 376.26, "According to the reading, what is a reliable starting point?"], [376.56, 381.63, "A, asking who benefits. B, banning exchange. C, ignoring style."], [385.17, 387.86, "The answer is A: asking who benefits."], [389.07, 392.31, "Part six: speaking. It's your turn to talk."], [393.15, 397.06, "Where do you see the line between cultural appreciation and appropriation?"], [413.85, 415.34, "Now listen to Visal."], [415.64, 449.6, "For me, the line between appreciation and appropriation depends on respect, understanding and credit. If a foreign designer studies Khmer silk weaving and works with local artisans, that is appreciation. Even though the result is new, the community benefits and is recognised. By contrast, copying a sacred pattern onto cheap products for profit feels like appropriation. Some argue that all culture borrows, which is true. Still, I believe the key question is always who benefits."], [449.9, 451.76, "Excellent answer, Visal!"], [452.65, 457.42, "Great work! Now you can use eight new words and even as and even though clauses."], [457.72, 463.07, "Today's value is cultural respect. Learn from other cultures, and give credit to their people."], [463.37, 465.93, "See you in Unit fourteen. Goodbye!"], [466.23, 469.12, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C1B2-Unit14-Comparative-Literature": [[0.35, 5.22, "Hello, everyone! I'm Ms. Emma. Welcome to Online C one, Book two."], [5.52, 9.31, "Hi! I'm Visal. Let's learn together!"], [9.62, 16.14, "Unit fourteen: Comparative Literature. Today you will question assumptions with rhetorical and embedded questions."], [16.45, 19.0, "Here is our lesson map. Let's start!"], [19.97, 23.2, "Part one: words. You will learn eight new words."], [24.05, 25.53, "Comparative literature."], [26.52, 30.79, "Comparative literature means the study of literature across languages and cultures."], [31.38, 35.21, "Comparative literature reads Khmer and French novels side by side."], [35.82, 38.96, "Your turn. Say: Comparative literature."], [41.8, 43.56, "Comparative literature."], [44.32, 45.64, "World literature."], [46.65, 50.83, "World literature means literature that circulates beyond its culture of origin."], [51.42, 54.14, "The Reamker deserves a place in world literature."], [54.75, 57.31, "Your turn. Say: World literature."], [60.17, 61.67, "World literature."], [62.42, 63.12, "Canon."], [64.12, 67.25, "Canon means the body of works considered most important."], [67.85, 70.62, "The canon has long excluded women writers."], [71.22, 73.72, "Your turn. Say: Canon."], [76.57, 77.32, "Canon."], [78.08, 79.28, "Translation."], [80.28, 83.35, "Translation means rendering a text into another language."], [83.95, 86.11, "Translation allows works to travel."], [86.72, 89.29, "Your turn. Say: Translation."], [92.13, 93.32, "Translation."], [94.08, 95.27, "Influence."], [96.28, 100.06, "Influence means the effect one writer or tradition has on another."], [100.65, 104.01, "Indian epics had a strong influence on Khmer literature."], [104.62, 107.45, "Your turn. Say: Influence."], [110.3, 111.57, "Influence."], [112.32, 113.3, "Tradition."], [114.28, 118.3, "Tradition means a body of practices passed down over generations."], [118.92, 121.88, "Oral tradition preserved many ancient stories."], [122.48, 125.11, "Your turn. Say: Tradition."], [127.97, 128.76, "Tradition."], [129.52, 130.87, "Cross-cultural."], [131.85, 134.84, "Cross-cultural means involving two or more cultures."], [135.45, 137.98, "The course takes a cross-cultural approach."], [138.58, 141.41, "Your turn. Say: Cross-cultural."], [144.27, 145.63, "Cross-cultural."], [146.38, 147.42, "Dialogue."], [148.42, 152.35, "Dialogue means an exchange of ideas between people or texts."], [152.95, 155.43, "The two novels are in dialogue with each other."], [156.02, 158.54, "Your turn. Say: Dialogue."], [161.4, 162.35, "Dialogue."], [163.17, 166.97, "Part two: dialogue. Let's listen to a conversation."], [167.82, 172.34, "Visal, you compared the Reamker with the Indian Ramayana. What did you discover?"], [173.45, 183.73, "That influence is never one-way copying. The Khmer version transforms the story, so I began asking who decides which version is 'original'."], [184.82, 187.69, "And why isn't the Reamker better known internationally?"], [188.78, 196.06, "That raises a bigger question: who decides which works belong to the canon, and whose languages get translated?"], [197.15, 199.31, "So you're questioning the canon itself."], [200.42, 207.83, "Yes. If we only read European classics, how can we claim to understand world literature at all?"], [208.97, 210.36, "Part three: grammar."], [211.22, 214.73, "Grammar focus: Questioning rhetorical structures."], [215.03, 216.29, "Look at the pattern."], [216.98, 219.3, "Who decides which works belong to the canon?"], [220.18, 222.88, "How can we claim to understand world literature?"], [223.78, 226.4, "The question is whose languages get translated."], [227.33, 239.61, "Rhetorical questions challenge assumptions without expecting an answer. When 'who' is the subject, use no auxiliary ('Who decides?'). Embedded questions use statement order: 'the question is whose languages get translated'."], [240.35, 244.82, "Be careful! Don't say: Who decide which works belong to the canon?"], [246.77, 249.87, "Say: Who decides which works belong to the canon?"], [250.17, 252.35, "Subject 'who' takes a singular verb."], [253.17, 255.76, "Part four: reading. Read and listen."], [256.57, 258.24, "Reading Across Borders."], [258.54, 263.76, "Comparative literature resists the idea that national literatures can be understood in isolation."], [264.77, 269.56, "Stories have always travelled, carried by traders, monks and, later, translators."], [270.57, 275.82, "Yet the question of which texts circulate globally is shaped by economic and political power."], [276.83, 282.21, "Why, for instance, are English novels translated into Khmer far more often than the reverse?"], [283.2, 288.58, "By placing traditions in dialogue, comparatists ask whose stories have been left out of the canon."], [289.67, 293.58, "Part five: quiz. Five questions. Are you ready?"], [294.42, 296.1, "Choose the correct question."], [296.4, 302.15, "A, Who does decide the canon?. B, Who decides the canon?. C, Who decide the canon?."], [305.7, 308.45, "The answer is B: Who decides the canon?."], [309.62, 311.67, "Choose the correct embedded question."], [311.97, 318.72, "A, I wonder whose stories get told.. B, I wonder whose stories do get told?. C, I wonder whose do stories get told.."], [322.27, 325.35, "The answer is A: I wonder whose stories get told.."], [326.48, 329.91, "The body of works considered most important is the blank."], [330.21, 333.83, "A, canon. B, tradition. C, dialogue."], [337.37, 339.01, "The answer is A: canon."], [340.15, 342.06, "Which collocation is correct?"], [342.36, 348.51, "A, exert an influence on. B, make an influence to. C, do an influence for."], [352.07, 354.79, "The answer is A: exert an influence on."], [355.95, 359.67, "According to the reading, what shapes which texts circulate globally?"], [359.97, 365.58, "A, the length of texts. B, economic and political power. C, readers' age."], [369.13, 372.39, "The answer is B: economic and political power."], [373.6, 377.2, "Part six: speaking. It's your turn to talk."], [378.05, 381.4, "Why might the literary 'canon' be worth questioning or expanding?"], [398.18, 399.68, "Now listen to Visal."], [399.98, 435.62, "The literary canon is worth questioning because it reflects who held power when it was formed, not only which works are best. For centuries, it mainly included male European writers, so many brilliant voices were ignored. For example, few international courses include Khmer or other Southeast Asian classics. Some argue that a canon must be selective to be useful. I agree, but I believe the selection should be revised regularly so that it represents the whole world."], [435.92, 437.54, "Excellent answer, Visal!"], [438.45, 443.18, "Great work! Now you can use eight new words and questioning rhetorical structures."], [443.48, 448.84, "Today's value is cultural openness. Read beyond your own tradition to see the world more fully."], [449.14, 451.78, "See you in Unit fifteen. Goodbye!"], [452.08, 454.89, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C1B2-Unit15-Feminist-Literary-Theory": [[0.35, 5.07, "Hello, everyone! I'm Ms. Emma. Welcome to Online C one, Book two."], [5.37, 9.15, "Hi! I'm Visal. Let's learn together!"], [9.45, 17.5, "Unit fifteen: Feminist Literary Theory. Today you will describe historical marginalization with the present perfect passive."], [17.8, 20.44, "Here is our lesson map. Let's start!"], [21.4, 24.95, "Part one: words. You will learn eight new words."], [25.78, 27.09, "Feminist theory."], [28.08, 32.7, "Feminist theory means theory examining gender, power and representation."], [33.28, 36.51, "Feminist theory reread classic novels from new angles."], [37.12, 39.99, "Your turn. Say: Feminist theory."], [42.83, 44.16, "Feminist theory."], [44.92, 46.06, "Patriarchy."], [47.05, 51.07, "Patriarchy means a social system in which men hold most power."], [51.68, 54.52, "The novel critiques patriarchy within the family."], [55.12, 58.0, "Your turn. Say: Patriarchy."], [60.87, 61.97, "Patriarchy."], [62.72, 63.47, "Voice."], [64.48, 67.63, "Voice means the ability to express one's own perspective."], [68.22, 70.5, "The heroine finally finds her voice."], [71.08, 73.86, "Your turn. Say: Voice."], [76.7, 77.56, "Voice."], [78.32, 79.54, "Marginalization."], [80.55, 84.49, "Marginalization means pushing a group to the edges of power or attention."], [85.08, 88.13, "The marginalization of rural women is a key theme."], [88.72, 91.23, "Your turn. Say: Marginalization."], [94.07, 95.52, "Marginalization."], [96.28, 97.31, "Agency."], [98.32, 102.62, "Agency means the capacity to act independently and make choices."], [103.22, 106.28, "The character lacks agency until the final act."], [106.88, 109.47, "Your turn. Say: Agency."], [112.3, 113.22, "Agency."], [113.98, 115.41, "Intersectionality."], [116.42, 121.06, "Intersectionality means how overlapping identities such as gender and class combine."], [121.65, 124.5, "Intersectionality explains layered disadvantage."], [125.08, 128.31, "Your turn. Say: Intersectionality."], [131.17, 132.71, "Intersectionality."], [133.45, 134.72, "Representation."], [135.72, 139.33, "Representation means how groups are portrayed in texts."], [139.92, 142.62, "Representation in children's books matters."], [143.22, 146.38, "Your turn. Say: Representation."], [149.23, 150.69, "Representation."], [151.45, 152.45, "Empowerment."], [153.45, 156.87, "Empowerment means the process of gaining power and confidence."], [157.45, 159.84, "Education has been a path to empowerment."], [160.45, 163.01, "Your turn. Say: Empowerment."], [165.87, 166.97, "Empowerment."], [167.77, 171.41, "Part two: dialogue. Let's listen to a conversation."], [172.25, 177.36, "Visal, your essay examines women in classic Khmer literature. What's your central argument?"], [178.45, 188.16, "That certain voices have historically been marginalized. Women have often been portrayed as virtuous or tempting, but rarely given agency."], [189.25, 191.15, "Has that changed in modern writing?"], [192.25, 200.92, "Significantly. In recent decades, women writers have been given more space, and their characters make their own choices."], [202.02, 203.92, "Where does intersectionality fit in?"], [205.02, 214.18, "It reminds us that a poor rural woman has been excluded in different ways from a wealthy urban one, so we can't treat 'women' as one group."], [215.33, 217.26, "Part three: grammar."], [218.12, 221.66, "Grammar focus: Passive voice for marginalization."], [221.96, 223.22, "Look at the pattern."], [223.92, 227.38, "Certain voices have historically been marginalized in literature."], [228.28, 231.06, "Women writers have recently been given more space."], [231.95, 235.11, "Rural women have long been excluded from the canon."], [236.07, 245.55, "Use the present perfect passive for a situation that started in the past and still matters now. Adverbs such as historically, long and often go between 'have' and 'been'."], [246.28, 250.74, "Be careful! Don't say: Certain voices have historically marginalized."], [252.7, 256.46, "Say: Certain voices have historically been marginalized."], [256.76, 260.16, "Present perfect passive: have been + p.p."], [260.97, 263.48, "Part four: reading. Read and listen."], [264.27, 265.8, "Rereading the Classics."], [266.1, 271.08, "Feminist literary theory asks whose experiences have been told and whose have been ignored."], [272.1, 277.06, "For centuries, women have been represented largely through the eyes of male authors."], [278.07, 283.58, "As a result, female characters have often been reduced to symbols of virtue, danger or desire."], [284.6, 290.69, "Feminist critics reread these texts to recover hidden voices and to expose the assumptions of patriarchy."], [291.7, 297.62, "Intersectional approaches go further, showing that gender interacts with class, ethnicity and age."], [298.73, 302.69, "Part five: quiz. Five questions. Are you ready?"], [303.55, 306.19, "Women's stories blank ignored for centuries."], [306.49, 309.54, "A, have been. B, has been. C, have."], [313.1, 314.77, "The answer is A: have been."], [315.92, 318.07, "Choose the correct adverb position."], [318.37, 326.97, "A, Voices historically have been marginalized been.. B, Voices have historically been marginalized.. C, Voices have been marginalized historically been.."], [330.5, 334.68, "The answer is B: Voices have historically been marginalized.."], [335.82, 338.7, "The capacity to make independent choices is blank."], [339.0, 342.59, "A, agency. B, patriarchy. C, voice."], [346.13, 348.0, "The answer is A: agency."], [349.15, 352.85, "How gender, class and ethnicity overlap is called blank."], [353.14, 358.38, "A, empowerment. B, representation. C, intersectionality."], [361.93, 364.55, "The answer is C: intersectionality."], [365.68, 369.61, "According to the reading, how were women mostly represented for centuries?"], [369.91, 375.41, "A, by women themselves. B, through male authors' eyes. C, through statistics."], [378.97, 381.99, "The answer is B: through male authors' eyes."], [383.2, 386.34, "Part six: speaking. It's your turn to talk."], [387.18, 390.3, "How can literature give voice to marginalized perspectives?"], [407.08, 408.57, "Now listen to Visal."], [408.87, 444.33, "Literature can give voice to marginalized perspectives by allowing readers to see the world through eyes they would never otherwise share. When a story is told by a character who has been ignored, such as a domestic worker or a refugee, readers develop empathy. For example, memoirs by survivors of the Khmer Rouge period have helped younger Cambodians understand their history. Some critics worry that outsiders may speak for others. That is why I believe these stories should be told by the communities themselves."], [444.63, 446.34, "Excellent answer, Visal!"], [447.25, 452.0, "Great work! Now you can use eight new words and passive voice for marginalization."], [452.3, 456.86, "Today's value is equity. Make room for the voices that are often left unheard."], [457.16, 459.94, "See you in Unit sixteen. Goodbye!"], [460.24, 463.0, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C1B2-Unit16-Structuralism": [[0.35, 5.15, "Hello, everyone! I'm Ms. Emma. Welcome to Online C one, Book two."], [5.45, 9.14, "Hi! I'm Visal. Let's learn together!"], [9.44, 16.9, "Unit sixteen: Structuralism. Today you will describe hidden structures with inverted 'beneath / underlying' sentences."], [17.2, 19.89, "Here is our lesson map. Let's start!"], [20.83, 24.37, "Part one: words. You will learn eight new words."], [25.22, 26.24, "Structure."], [27.25, 30.11, "Structure means the way parts are arranged to form a whole."], [30.72, 33.44, "The structure of the myth repeats across cultures."], [34.05, 36.67, "Your turn. Say: Structure."], [39.53, 40.51, "Structure."], [41.25, 42.74, "Binary opposition."], [43.75, 47.8, "Binary opposition means a pair of opposite concepts such as light/dark."], [48.42, 51.39, "Good versus evil is a basic binary opposition."], [51.98, 55.45, "Your turn. Say: Binary opposition."], [58.3, 59.77, "Binary opposition."], [60.52, 61.48, "System."], [62.48, 65.59, "System means a set of connected elements working together."], [66.18, 68.26, "Language is a system of differences."], [68.85, 71.42, "Your turn. Say: System."], [74.27, 74.93, "System."], [75.68, 77.13, "Underlying pattern."], [78.12, 82.16, "Underlying pattern means a hidden regularity beneath surface variety."], [82.75, 85.26, "An underlying pattern links the folk tales."], [85.85, 88.49, "Your turn. Say: Underlying pattern."], [91.33, 92.93, "Underlying pattern."], [93.68, 94.37, "Langue."], [95.38, 98.34, "Langue means language as an abstract shared system."], [98.95, 101.67, "Langue includes the grammar every speaker knows."], [102.28, 105.26, "Your turn. Say: Langue."], [108.1, 109.01, "Langue."], [109.75, 110.53, "Parole."], [111.52, 114.4, "Parole means individual acts of speech or writing."], [114.98, 117.63, "Each conversation is an example of parole."], [118.22, 120.29, "Your turn. Say: Parole."], [123.13, 124.09, "Parole."], [124.85, 125.93, "Universal."], [126.92, 130.04, "Universal means applying to all cases or cultures."], [130.65, 133.34, "Structuralists searched for universal patterns."], [133.95, 136.6, "Your turn. Say: Universal."], [139.47, 140.51, "Universal."], [141.25, 142.16, "Relation."], [143.15, 146.1, "Relation means the way two or more things are connected."], [146.72, 149.54, "Meaning arises from relations between signs."], [150.15, 152.55, "Your turn. Say: Relation."], [155.4, 156.53, "Relation."], [157.33, 161.13, "Part two: dialogue. Let's listen to a conversation."], [161.98, 167.91, "Visal, you analysed three Cambodian folk tales. They seem completely different. What did you find?"], [169.02, 178.7, "Beneath the different plots lies a single structural pattern: a weak hero, a test, a helper, and a reversal of fortune."], [179.82, 181.68, "And the binary oppositions?"], [182.78, 192.55, "Underlying every tale is the opposition of village and forest: order and safety on one side, danger and transformation on the other."], [193.65, 196.15, "Isn't that reducing rich stories to a formula?"], [197.25, 205.82, "That's the main criticism. Structuralism reveals the system, but it can ignore the individual voice of each storyteller."], [206.97, 209.05, "Part three: grammar."], [209.88, 213.76, "Grammar focus: Beneath and underlying descriptive language."], [214.06, 215.28, "Look at the pattern."], [215.98, 218.61, "Beneath the plot lies a deeper structural pattern."], [219.52, 223.4, "Underlying every tale is the opposition of village and forest."], [224.28, 227.57, "Behind the variety of stories stands a single system."], [228.53, 238.67, "Fronting a place phrase and inverting the verb ('Beneath the plot lies a pattern') delays the key idea for emphasis. The verb agrees with the subject that follows it: lies a pattern / lie patterns."], [239.42, 243.36, "Be careful! Don't say: Beneath the plot lie a deeper pattern."], [245.3, 248.16, "Say: Beneath the plot lies a deeper pattern."], [248.46, 250.93, "After inversion, the verb agrees with 'pattern'."], [251.73, 254.36, "Part four: reading. Read and listen."], [255.17, 256.53, "The Grammar of Stories."], [256.83, 263.12, "Structuralism proposes that meaning arises not from individual elements but from their relations within a system."], [264.13, 269.56, "Saussure distinguished langue, the shared system of a language, from parole, its individual use."], [270.57, 277.06, "Applying this idea to myths, Lévi-Strauss argued that beneath their surface variety lie recurring binary oppositions."], [278.07, 284.93, "Underlying a vast range of folk tales, Propp identified a limited set of functions, such as the test and the reward."], [285.93, 292.29, "Critics later objected that this search for universal structures overlooked history, context and individual creativity."], [293.4, 297.11, "Part five: quiz. Five questions. Are you ready?"], [297.95, 301.04, "Beneath the surface blank several hidden patterns."], [301.34, 304.67, "A, lies. B, lie. C, lying."], [308.23, 310.26, "The answer is B: lie."], [311.42, 314.01, "Light/dark and good/evil are examples of blank."], [314.31, 318.96, "A, binary oppositions. B, paroles. C, universals."], [322.5, 325.4, "The answer is A: binary oppositions."], [326.55, 328.75, "An individual act of speech is blank."], [329.05, 332.71, "A, langue. B, system. C, parole."], [336.27, 338.41, "The answer is C: parole."], [339.55, 341.77, "Choose the correct inverted sentence."], [342.07, 349.65, "A, Underlying the tale is a conflict.. B, Underlying the tale a conflict is.. C, Underlying is the tale a conflict.."], [353.2, 356.56, "The answer is A: Underlying the tale is a conflict.."], [357.72, 361.65, "According to the reading, what did critics say structuralism overlooked?"], [361.95, 368.09, "A, binary oppositions. B, history, context and creativity. C, the shared system."], [371.63, 375.01, "The answer is B: history, context and creativity."], [376.2, 379.31, "Part six: speaking. It's your turn to talk."], [380.15, 383.52, "What binary opposition can you find in a story you know well?"], [400.32, 401.89, "Now listen to Visal."], [402.19, 439.03, "In the story of Tum Teav, which every Cambodian student knows, the central binary opposition is love versus social duty. Underlying the plot is the conflict between personal desire and the power of family and status. Tum and Teav choose love, while Teav's mother and the governor represent rigid social order. Some readers prefer to see the tale simply as a tragic romance. However, recognising the opposition helps me understand why the story still feels relevant today."], [439.33, 440.98, "Excellent answer, Visal!"], [441.88, 446.95, "Great work! Now you can use eight new words and beneath and underlying descriptive language."], [447.25, 451.75, "Today's value is analytical thinking. Look for the pattern underneath the surface."], [452.05, 454.75, "See you in Unit seventeen. Goodbye!"], [455.05, 457.7, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C1B2-Unit17-Reader-Response-Theory": [[0.35, 5.37, "Hello, everyone! I'm Ms. Emma. Welcome to Online C one, Book two."], [5.67, 8.97, "Hi! I'm Visal. Let's learn together!"], [9.27, 16.8, "Unit seventeen: Reader-Response Theory. Today you will make careful, hedged claims about meaning with may, might and could."], [17.09, 19.69, "Here is our lesson map. Let's start!"], [20.63, 23.84, "Part one: words. You will learn eight new words."], [24.68, 26.01, "Reader-response."], [27.02, 31.52, "Reader-response means a theory focusing on the reader's role in creating meaning."], [32.12, 35.51, "Reader-response criticism values personal reactions."], [36.12, 38.71, "Your turn. Say: Reader-response."], [41.57, 42.79, "Reader-response."], [43.55, 44.82, "Interpretation."], [45.82, 49.47, "Interpretation means the meaning a reader constructs from a text."], [50.05, 52.73, "Two valid interpretations can coexist."], [53.35, 56.48, "Your turn. Say: Interpretation."], [59.33, 60.65, "Interpretation."], [61.38, 62.66, "Subjectivity."], [63.65, 67.84, "Subjectivity means the influence of personal feelings and experience."], [68.45, 71.0, "Subjectivity shapes what we notice in a poem."], [71.58, 74.62, "Your turn. Say: Subjectivity."], [77.47, 78.66, "Subjectivity."], [79.42, 81.34, "Horizon of expectation."], [82.35, 87.01, "Horizon of expectation means the assumptions readers bring from their time and culture."], [87.62, 90.97, "Modern readers have a different horizon of expectation."], [91.58, 95.09, "Your turn. Say: Horizon of expectation."], [97.93, 99.84, "Horizon of expectation."], [100.58, 102.29, "Meaning-making."], [103.28, 106.8, "Meaning-making means the active process of constructing meaning."], [107.42, 109.95, "Reading is a form of meaning-making."], [110.55, 113.35, "Your turn. Say: Meaning-making."], [116.2, 117.99, "Meaning-making."], [118.75, 119.69, "Reception."], [120.68, 124.08, "Reception means how a work is received by readers over time."], [124.68, 127.25, "The novel's reception changed after the war."], [127.85, 130.36, "Your turn. Say: Reception."], [133.2, 134.25, "Reception."], [134.98, 136.0, "Engagement."], [136.98, 139.94, "Engagement means active involvement with a text."], [140.55, 142.82, "Annotation increases engagement."], [143.42, 145.79, "Your turn. Say: Engagement."], [148.63, 149.7, "Engagement."], [150.45, 151.44, "Co-creation."], [152.45, 155.99, "Co-creation means the joint production of meaning by author and reader."], [156.58, 159.28, "Meaning is a co-creation between text and reader."], [159.88, 162.84, "Your turn. Say: Co-creation."], [165.7, 166.75, "Co-creation."], [167.53, 171.51, "Part two: dialogue. Let's listen to a conversation."], [172.35, 179.66, "Visal, two students read the same poem about a river: one found it hopeful, the other deeply sad. Who is right?"], [180.75, 189.01, "Possibly both. A text's meaning might shift depending on the reader, especially when the poem itself is ambiguous."], [190.12, 192.91, "Doesn't that mean any interpretation is acceptable?"], [194.02, 203.25, "Not quite. A reading could be personal, but it should still be supported by evidence in the text, or it may become pure invention."], [204.35, 206.48, "Why might their readings differ so much?"], [207.58, 216.45, "Their horizons of expectation may differ. A student who has lost someone could read the river as loss, rather than renewal."], [217.6, 219.31, "Part three: grammar."], [220.15, 223.37, "Grammar focus: Hedged claims (may, might, could)."], [223.67, 224.91, "Look at the pattern."], [225.62, 228.35, "A text's meaning might shift depending on the reader."], [229.25, 232.51, "Their horizons of expectation may differ significantly."], [233.42, 236.88, "A personal reading could reveal something the author never intended."], [237.83, 248.41, "Academic writers hedge to show caution: may / might / could, often with 'arguably', 'to some extent' or 'it seems that'. Hedging is not weakness; it signals that a claim is open to discussion."], [249.15, 252.72, "Be careful! Don't say: A text's meaning might shifts."], [254.67, 257.28, "Say: A text's meaning might shift."], [257.58, 259.77, "After 'might', use the base verb."], [260.57, 263.29, "Part four: reading. Read and listen."], [264.1, 265.27, "The Reader's Role."], [265.57, 270.66, "For much of the twentieth century, critics treated the meaning of a text as fixed within its words."], [271.67, 277.64, "Reader-response theorists challenged this view, arguing that meaning may only come into being through the act of reading."], [278.63, 285.43, "Each reader brings a horizon of expectation, which might include cultural assumptions, memories and earlier reading."], [286.43, 292.97, "This does not mean that all interpretations are equally valid; a reading could still be judged by its use of evidence."], [293.97, 299.26, "Instead, meaning may best be described as a co-creation between the text and its readers."], [300.37, 304.37, "Part five: quiz. Five questions. Are you ready?"], [305.22, 307.29, "Choose the best hedged claim."], [307.59, 316.29, "A, This poem is definitely about death.. B, This poem may be read as a meditation on loss.. C, This poem is about death, everyone agrees.."], [319.83, 324.33, "The answer is B: This poem may be read as a meditation on loss.."], [325.48, 328.6, "Their readings blank differ because of their experiences."], [328.9, 332.57, "A, might. B, might to. C, might be to."], [336.13, 337.94, "The answer is A: might."], [339.08, 342.25, "The assumptions readers bring from their culture form their blank."], [342.56, 347.68, "A, horizon of expectation. B, reception. C, co-creation."], [351.23, 354.06, "The answer is A: horizon of expectation."], [355.22, 357.26, "Which phrase is a hedging device?"], [357.56, 361.5, "A, clearly. B, it seems that. C, without doubt."], [365.03, 367.43, "The answer is B: it seems that."], [368.58, 372.35, "According to the reading, how can interpretations still be judged?"], [372.65, 377.75, "A, by their length. B, by their use of evidence. C, by the author's approval."], [381.3, 384.09, "The answer is B: by their use of evidence."], [385.3, 388.35, "Part six: speaking. It's your turn to talk."], [389.18, 392.89, "Do you think a text has one fixed meaning, or many depending on the reader?"], [409.68, 411.21, "Now listen to Visal."], [411.51, 441.02, "I think a text may have several valid meanings, although not an unlimited number. Every reader brings different experiences, so the same story might feel comforting to one person and painful to another. For example, a novel about migration could be read as an adventure by some and as a story of loss by others. Critics who defend a single meaning argue that the author's intention matters. I agree it matters, but I believe readers complete the text."], [441.32, 443.01, "Excellent answer, Visal!"], [443.92, 448.39, "Great work! Now you can use eight new words and hedged claims (may, might, could)."], [448.69, 453.64, "Today's value is open-mindedness. Listen to new ideas before you judge them."], [453.94, 457.07, "See you in Unit eighteen. Goodbye!"], [457.37, 460.31, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C1B2-Unit18-Intertextuality": [[0.35, 5.06, "Hello, everyone! I'm Ms. Emma. Welcome to Online C one, Book two."], [5.36, 8.89, "Hi! I'm Visal. Let's learn together!"], [9.19, 15.31, "Unit eighteen: Intertextuality. Today you will show alternatives with 'whether … or' clauses."], [15.61, 18.24, "Here is our lesson map. Let's start!"], [19.2, 22.32, "Part one: words. You will learn eight new words."], [23.18, 24.68, "Intertextuality."], [25.68, 29.52, "Intertextuality means the way texts refer to and shape each other."], [30.12, 33.42, "Intertextuality enriches the film for attentive viewers."], [34.02, 37.04, "Your turn. Say: Intertextuality."], [39.9, 41.4, "Intertextuality."], [42.15, 43.12, "Allusion."], [44.12, 47.79, "Allusion means an indirect reference to another work or event."], [48.38, 50.79, "The title is an allusion to a famous poem."], [51.38, 54.01, "Your turn. Say: Allusion."], [56.87, 57.91, "Allusion."], [58.65, 59.65, "Reference."], [60.65, 63.1, "Reference means a direct mention of something."], [63.72, 66.16, "The song makes a clear reference to the Bible."], [66.75, 69.03, "Your turn. Say: Reference."], [71.87, 72.94, "Reference."], [73.68, 74.57, "Homage."], [75.58, 79.15, "Homage means a respectful tribute to an earlier artist or work."], [79.75, 82.2, "The scene is an homage to Charlie Chaplin."], [82.82, 85.18, "Your turn. Say: Homage."], [88.03, 88.85, "Homage."], [89.58, 90.35, "Parody."], [91.35, 94.78, "Parody means an imitation that mocks or comments on the original."], [95.38, 97.73, "The sketch is a parody of a cooking show."], [98.32, 100.96, "Your turn. Say: Parody."], [103.8, 104.67, "Parody."], [105.42, 106.15, "Echo."], [107.15, 110.8, "Echo means a subtle repetition of an earlier text or idea."], [111.38, 114.05, "Her opening line is an echo of a fairy tale."], [114.65, 116.97, "Your turn. Say: Echo."], [119.8, 120.6, "Echo."], [121.35, 123.02, "Dialogue between texts."], [124.02, 128.71, "Dialogue between texts means the conversation texts create by referring to each other."], [129.32, 132.13, "Adaptations create a dialogue between texts."], [132.72, 135.95, "Your turn. Say: Dialogue between texts."], [138.8, 140.87, "Dialogue between texts."], [141.62, 142.68, "Layered meaning."], [143.68, 147.01, "Layered meaning means several levels of meaning in one text."], [147.62, 149.94, "The cartoon has layered meaning for adults."], [150.55, 153.23, "Your turn. Say: Layered meaning."], [156.07, 157.08, "Layered meaning."], [157.87, 161.67, "Part two: dialogue. Let's listen to a conversation."], [162.52, 167.94, "Visal, you said the animated film you watched is full of intertextuality. What did you notice?"], [169.05, 178.24, "Whether through allusion or parody, nearly every scene refers to an older film, from silent comedies to famous horror movies."], [179.35, 181.36, "Did the children in the cinema notice?"], [182.45, 190.94, "Probably not. But whether they recognised them or not, the scenes still worked, which is why the film has such layered meaning."], [192.05, 194.5, "Is a parody disrespectful to the original?"], [195.62, 204.27, "It depends. Whether a reference is mockery or homage often depends on tone. This film clearly loved the films it borrowed from."], [205.43, 206.99, "Part three: grammar."], [207.85, 210.44, "Grammar focus: Whetheror clauses."], [210.74, 212.05, "Look at the pattern."], [212.75, 216.04, "Whether through allusion or parody, texts reference each other."], [216.95, 220.16, "Whether they recognised them or not, the scenes still worked."], [221.05, 224.6, "Whether a reference is mockery or homage often depends on tone."], [225.57, 237.05, "'Whether X or Y' means 'in either case' and the main clause stays true. 'Whether … or not' covers both possibilities. A 'whether' clause can also be the subject: 'Whether it works depends on tone.'"], [237.78, 242.72, "Be careful! Don't say: Whether through allusion and parody, texts echo."], [244.67, 247.83, "Say: Whether through allusion or parody, texts echo."], [248.13, 249.85, "The pattern is 'whether … or …'."], [250.63, 253.26, "Part four: reading. Read and listen."], [254.07, 255.71, "No Text Is an Island."], [256.01, 262.99, "The term intertextuality, introduced by Julia Kristeva, suggests that every text is built from earlier texts."], [264.0, 268.22, "Whether writers intend it or not, their work absorbs and transforms what they have read."], [269.23, 275.71, "Some references are explicit quotations, whereas others are faint echoes that only experienced readers detect."], [276.7, 281.16, "Parody and homage both depend on recognition, although one mocks while the other honours."], [282.17, 286.7, "Whether we notice them or not, these connections give familiar stories their layered meaning."], [287.8, 292.12, "Part five: quiz. Five questions. Are you ready?"], [292.95, 296.16, "blank you like it or not, the film borrows heavily."], [296.46, 299.36, "A, Whether. B, If. C, Either."], [302.9, 304.63, "The answer is A: Whether."], [305.78, 309.34, "Whether by allusion blank parody, texts echo each other."], [309.64, 313.66, "A, and. B, or. C, nor."], [317.2, 318.86, "The answer is B: or."], [320.02, 322.92, "A respectful tribute to an earlier work is an blank."], [323.22, 326.46, "A, homage. B, parody. C, echo."], [330.0, 332.02, "The answer is A: homage."], [333.18, 335.98, "An imitation that mocks the original is a blank."], [336.28, 340.22, "A, reference. B, allusion. C, parody."], [343.77, 345.72, "The answer is C: parody."], [346.88, 350.86, "According to the reading, what do parody and homage both depend on?"], [351.16, 354.83, "A, recognition. B, quotation. C, humour."], [358.37, 360.77, "The answer is A: recognition."], [361.97, 365.07, "Part six: speaking. It's your turn to talk."], [365.92, 369.27, "Can you find an allusion to another work in something you've read recently?"], [386.08, 387.62, "Now listen to Visal."], [387.92, 418.91, "Recently I read a short story that opens with the line 'Once upon a time, there was a girl who did not want to be rescued', which is a clear allusion to traditional fairy tales. Whether the reader notices it or not, the line challenges the idea of the passive princess. The allusion gives the story layered meaning, because we compare it with stories we knew as children. Some readers might find the reference too obvious. Personally, I think its directness is part of its humour."], [419.21, 421.0, "Excellent answer, Visal!"], [421.88, 425.86, "Great work! Now you can use eight new words and whetheror clauses."], [426.16, 432.16, "Today's value is literary awareness. Every text talks to other texts. Listen for the echoes."], [432.46, 435.19, "See you in Unit nineteen. Goodbye!"], [435.49, 438.56, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C1B2-Unit19-World-Literature": [[0.35, 5.42, "Hello, everyone! I'm Ms. Emma. Welcome to Online C one, Book two."], [5.72, 9.18, "Hi! I'm Visal. Let's learn together!"], [9.48, 16.57, "Unit nineteen: World Literature. Today you will balance local and universal ideas with 'while' contrast clauses."], [16.88, 19.57, "Here is our lesson map. Let's start!"], [20.53, 23.58, "Part one: words. You will learn eight new words."], [24.42, 25.7, "World literature."], [26.68, 30.3, "World literature means literature read beyond its original culture."], [30.88, 34.3, "World literature courses include writers from every continent."], [34.88, 38.26, "Your turn. Say: World literature."], [41.1, 43.08, "World literature."], [43.82, 44.95, "Circulation."], [45.95, 49.88, "Circulation means the movement of texts between readers and places."], [50.48, 53.66, "Online publishing speeds the circulation of stories."], [54.25, 56.67, "Your turn. Say: Circulation."], [59.53, 60.92, "Circulation."], [61.68, 62.75, "Translation."], [63.75, 66.81, "Translation means rendering a work into another language."], [67.42, 69.77, "Translation gave the novel a second life."], [70.35, 73.48, "Your turn. Say: Translation."], [76.33, 77.36, "Translation."], [78.12, 79.54, "Global readership."], [80.55, 83.3, "Global readership means readers around the world."], [83.92, 85.95, "The prize brought a global readership."], [86.55, 89.74, "Your turn. Say: Global readership."], [92.6, 94.05, "Global readership."], [94.82, 96.46, "Local specificity."], [97.45, 101.62, "Local specificity means details belonging to one particular place."], [102.22, 105.31, "Local specificity makes the setting vivid."], [105.92, 109.1, "Your turn. Say: Local specificity."], [111.97, 113.84, "Local specificity."], [114.58, 116.04, "Universal theme."], [117.05, 120.45, "Universal theme means an idea meaningful in every culture."], [121.05, 123.36, "Love and loss are universal themes."], [123.95, 126.69, "Your turn. Say: Universal theme."], [129.53, 130.81, "Universal theme."], [131.55, 132.45, "Reception."], [133.45, 136.87, "Reception means how a work is received by readers."], [137.45, 139.62, "Its reception abroad was very warm."], [140.22, 142.71, "Your turn. Say: Reception."], [145.57, 146.53, "Reception."], [147.28, 148.7, "Canon formation."], [149.72, 153.28, "Canon formation means the process by which works become 'classics'."], [153.88, 156.3, "Prizes play a role in canon formation."], [156.92, 159.85, "Your turn. Say: Canon formation."], [162.7, 164.21, "Canon formation."], [165.0, 169.0, "Part two: dialogue. Let's listen to a conversation."], [169.85, 174.93, "Visal, why do you think the Korean novel we read became popular in so many countries?"], [176.02, 183.6, "While the setting is very local, a small fishing village, the theme of family sacrifice feels universal."], [184.72, 187.24, "Didn't some details get lost in translation?"], [188.35, 197.24, "Certainly. While the translator kept the local foods and customs, some of the humour depends on wordplay that couldn't survive."], [198.35, 202.13, "So is local specificity a strength or a weakness abroad?"], [203.22, 212.22, "A strength, I'd say. While readers might not know the place, precise details make the emotions feel real rather than generic."], [213.37, 214.83, "Part three: grammar."], [215.68, 218.72, "Grammar focus: While plus contrast clause."], [219.02, 220.17, "Look at the pattern."], [220.88, 224.08, "While the setting is local, the theme feels universal."], [224.98, 228.88, "While the translator kept local customs, some humour was lost."], [229.78, 233.68, "While readers might not know the place, they recognise the emotions."], [234.63, 244.63, "'While' (= although / whereas) introduces a contrast and is common in academic writing. Use a comma after the 'while' clause and do not add 'but'. 'Whilst' is a more formal British variant."], [245.38, 250.74, "Be careful! Don't say: While the setting is local, but the theme is universal."], [252.7, 256.25, "Say: While the setting is local, the theme is universal."], [256.56, 258.39, "Do not add 'but' after 'while'."], [259.2, 261.93, "Part four: reading. Read and listen."], [262.73, 264.91, "Local Stories, Global Readers."], [265.21, 270.24, "World literature is often defined not by where a work is written but by how widely it circulates."], [271.23, 277.41, "While some texts travel easily, others remain unknown outside their language because they are never translated."], [278.4, 283.8, "Paradoxically, works rich in local specificity often reach the widest global readership."], [284.8, 292.33, "Readers abroad may miss allusions, while still responding deeply to universal themes such as love, injustice and memory."], [293.33, 299.38, "Prizes, publishers and university syllabi all influence which of these works enter the global canon."], [300.5, 304.56, "Part five: quiz. Five questions. Are you ready?"], [305.42, 307.24, "Choose the correct sentence."], [307.54, 315.74, "A, While the plot is simple, but the style is rich.. B, While the plot is simple, the style is rich.. C, While simple, but the style is rich.."], [319.3, 322.6, "The answer is B: While the plot is simple, the style is rich.."], [323.75, 326.85, "Details belonging to one particular place show blank."], [327.15, 332.14, "A, universal theme. B, circulation. C, local specificity."], [335.7, 338.83, "The answer is C: local specificity."], [339.98, 342.69, "The process by which works become classics is blank."], [342.99, 347.72, "A, canon formation. B, reception. C, translation."], [351.27, 353.92, "The answer is A: canon formation."], [355.05, 356.99, "Which collocation is correct?"], [357.29, 363.53, "A, reach a global readership. B, arrive a global readership. C, get to readership global."], [367.1, 370.07, "The answer is A: reach a global readership."], [371.22, 374.71, "According to the reading, which works often reach the widest readership?"], [375.01, 381.54, "A, those with no local detail. B, those rich in local specificity. C, those written in English."], [385.1, 388.59, "The answer is B: those rich in local specificity."], [389.8, 392.86, "Part six: speaking. It's your turn to talk."], [393.72, 397.46, "What is a universal theme you've found in literature from another culture?"], [414.25, 415.72, "Now listen to Visal."], [416.01, 447.96, "A universal theme I found in a Japanese novel was the tension between duty to one's family and personal dreams. While the setting was a small town in Japan, the main character's struggle reminded me of many young Cambodians who feel the same pressure. For example, she wanted to study art, but her parents expected her to run the family shop. Some readers might focus on the cultural differences. I think, however, that the shared emotion is what makes the story powerful."], [448.26, 449.85, "Excellent answer, Visal!"], [450.75, 455.67, "Great work! Now you can use eight new words and while plus contrast clause."], [455.97, 461.03, "Today's value is global perspective. Local stories can carry universal truths."], [461.33, 464.0, "See you in Unit twenty. Goodbye!"], [464.3, 467.94, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C1B2-Unit20-Stylistics": [[0.35, 5.04, "Hello, everyone! I'm Ms. Emma. Welcome to Online C one, Book two."], [5.34, 8.7, "Hi! I'm Visal. Let's learn together!"], [9.0, 16.08, "Unit twenty: Stylistics. Today you will analyse style precisely with complex noun phrases and prepositions."], [16.38, 19.06, "Here is our lesson map. Let's start!"], [20.0, 23.21, "Part one: words. You will learn eight new words."], [24.05, 24.96, "Style."], [25.95, 28.84, "Style means the distinctive way a writer uses language."], [29.45, 32.1, "Hemingway's style is famously spare."], [32.68, 35.39, "Your turn. Say: Style."], [38.23, 39.38, "Style."], [40.15, 40.99, "Diction."], [41.98, 44.45, "Diction means the writer's choice of words."], [45.05, 47.88, "Archaic diction gives the poem a timeless feel."], [48.48, 50.82, "Your turn. Say: Diction."], [53.67, 54.73, "Diction."], [55.48, 56.47, "Syntax."], [57.48, 60.66, "Syntax means the arrangement of words in sentences."], [61.25, 64.07, "Fragmented syntax mirrors the speaker's panic."], [64.68, 67.22, "Your turn. Say: Syntax."], [70.07, 71.17, "Syntax."], [71.92, 72.67, "Tone."], [73.68, 76.14, "Tone means the attitude conveyed by the writing."], [76.75, 78.82, "The tone is detached and ironic."], [79.42, 81.74, "Your turn. Say: Tone."], [84.6, 85.25, "Tone."], [86.02, 86.92, "Imagery."], [87.92, 90.96, "Imagery means language that appeals to the senses."], [91.55, 94.66, "Vivid imagery recreates the market's noise and smells."], [95.25, 97.96, "Your turn. Say: Imagery."], [100.8, 101.7, "Imagery."], [102.45, 103.32, "Register."], [104.32, 106.58, "Register means the level of formality."], [107.18, 109.96, "A sudden shift in register surprises the reader."], [110.55, 113.0, "Your turn. Say: Register."], [115.87, 116.9, "Register."], [117.65, 118.64, "Foregrounding."], [119.65, 123.01, "Foregrounding means making certain language stand out from the norm."], [123.62, 126.89, "Repetition is a common foregrounding device."], [127.48, 130.46, "Your turn. Say: Foregrounding."], [133.3, 134.38, "Foregrounding."], [135.12, 135.96, "Effect."], [136.95, 139.78, "Effect means the impact a technique has on the reader."], [140.38, 142.28, "The effect of the short line is shock."], [142.88, 145.47, "Your turn. Say: Effect."], [148.3, 149.05, "Effect."], [149.83, 153.61, "Part two: dialogue. Let's listen to a conversation."], [154.45, 158.8, "Visal, you analysed the opening of the war novel. What stood out stylistically?"], [159.88, 166.92, "The use of short sentences creates a sense of urgency. 'He ran. The bridge fell. No one spoke.'"], [168.02, 170.59, "And how does that compare with the second chapter?"], [171.68, 179.63, "There's a dramatic shift in syntax. The long, flowing sentences with their many clauses suggest a return to calm and memory."], [180.72, 182.71, "Did the diction support that change?"], [183.82, 191.57, "Yes. The replacement of harsh, monosyllabic verbs with softer, descriptive adjectives slows the reader down."], [192.7, 194.19, "Part three: grammar."], [195.05, 198.55, "Grammar focus: Noun phrases with prepositions."], [198.85, 200.1, "Look at the pattern."], [200.82, 204.02, "The use of short sentences creates a sense of urgency."], [204.92, 208.65, "A dramatic shift in syntax suggests a return to calm."], [209.55, 213.72, "The replacement of harsh verbs with soft adjectives slows the reader down."], [214.67, 225.83, "In stylistic analysis, the head noun is followed by a fixed preposition: the use OF, a shift IN, the contrast BETWEEN, the replacement OF … WITH. The verb agrees with the head noun, not the last noun."], [226.58, 231.28, "Be careful! Don't say: The use of short sentences create urgency."], [233.23, 236.89, "Say: The use of short sentences creates urgency."], [237.19, 239.06, "The head noun 'use' is singular."], [239.87, 242.37, "Part four: reading. Read and listen."], [243.17, 244.85, "How Style Makes Meaning."], [245.15, 252.86, "Stylistics bridges linguistics and literary criticism by examining how specific language choices produce effects."], [253.87, 259.99, "Rather than asking simply what a text means, the stylistician asks how particular features create that meaning."], [261.0, 267.09, "The repetition of a single word, for instance, may foreground an idea that the reader would otherwise overlook."], [268.1, 274.39, "Similarly, a sudden shift in register can signal irony, while dense imagery may slow the pace of reading."], [275.4, 281.03, "A convincing stylistic analysis therefore links every observation to a demonstrable effect on the reader."], [282.13, 286.12, "Part five: quiz. Five questions. Are you ready?"], [286.98, 289.42, "The use of long sentences blank the pace."], [289.72, 293.16, "A, slows. B, slow. C, are slowing."], [296.7, 298.67, "The answer is A: slows."], [299.82, 304.08, "Choose the correct preposition: a sudden shift blank tone."], [304.38, 307.38, "A, of. B, in. C, at."], [310.93, 312.92, "The answer is B: in."], [314.08, 316.55, "Language that appeals to the senses is blank."], [316.85, 320.25, "A, syntax. B, imagery. C, diction."], [323.8, 325.99, "The answer is B: imagery."], [327.15, 330.21, "Making certain language stand out from the norm is blank."], [330.51, 334.22, "A, register. B, effect. C, foregrounding."], [337.77, 339.74, "The answer is C: foregrounding."], [340.88, 344.86, "According to the reading, a good analysis links observations to…"], [345.16, 350.3, "A, the author's life. B, a demonstrable effect. C, the book's sales."], [353.83, 356.74, "The answer is B: a demonstrable effect."], [357.93, 361.05, "Part six: speaking. It's your turn to talk."], [361.92, 364.83, "How does sentence structure affect the tone of a text?"], [381.65, 383.24, "Now listen to Visal."], [383.54, 419.09, "Sentence structure strongly affects tone because the rhythm of a sentence shapes how the reader feels. The use of short, simple sentences tends to create tension or urgency, as in action scenes. By contrast, long sentences with many clauses can produce a reflective or nostalgic tone. For example, a sudden one-word sentence after a long paragraph often shocks the reader. Some argue that vocabulary matters more than structure. In my view, the two always work together."], [419.39, 421.11, "Excellent answer, Visal!"], [422.02, 426.69, "Great work! Now you can use eight new words and noun phrases with prepositions."], [426.99, 430.89, "Today's value is precision. Choose your words and numbers with care."], [431.19, 434.05, "See you in Unit twenty-one. Goodbye!"], [434.35, 437.66, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C1B2-Unit21-Analysing-Poetry": [[0.35, 4.94, "Hello, everyone! I'm Ms. Emma. Welcome to Online C one, Book two."], [5.24, 8.42, "Hi! I'm Visal. Let's learn together!"], [8.72, 16.25, "Unit twenty-one: Analysing Poetry. Today you will offer alternative interpretations of poems with modal verbs."], [16.55, 19.06, "Here is our lesson map. Let's start!"], [20.0, 23.11, "Part one: words. You will learn eight new words."], [23.95, 24.65, "Poem."], [25.65, 29.93, "Poem means a piece of writing arranged in lines, using rhythm and imagery."], [30.52, 32.73, "The poem is only twelve lines long."], [33.32, 36.03, "Your turn. Say: Poem."], [38.87, 39.55, "Poem."], [40.32, 41.16, "Stanza."], [42.15, 45.45, "Stanza means a group of lines forming a unit in a poem."], [46.05, 48.19, "The final stanza changes the mood."], [48.78, 51.06, "Your turn. Say: Stanza."], [53.9, 54.99, "Stanza."], [55.75, 56.66, "Metaphor."], [57.65, 61.29, "Metaphor means describing one thing as another to suggest likeness."], [61.88, 63.87, "'Time is a thief' is a metaphor."], [64.48, 66.62, "Your turn. Say: Metaphor."], [69.47, 70.42, "Metaphor."], [71.18, 71.91, "Rhythm."], [72.92, 76.55, "Rhythm means the pattern of stressed and unstressed syllables."], [77.15, 79.03, "The rhythm imitates a heartbeat."], [79.65, 81.92, "Your turn. Say: Rhythm."], [84.77, 85.55, "Rhythm."], [86.28, 87.12, "Rhyme."], [88.12, 91.54, "Rhyme means the repetition of similar sounds at line endings."], [92.15, 94.67, "The poem avoids rhyme until the last couplet."], [95.28, 97.61, "Your turn. Say: Rhyme."], [100.47, 101.35, "Rhyme."], [102.12, 103.12, "Enjambment."], [104.12, 107.94, "Enjambment means a sentence running over the end of a line without a pause."], [108.55, 111.11, "Enjambment creates a sense of breathlessness."], [111.72, 114.46, "Your turn. Say: Enjambment."], [117.3, 118.37, "Enjambment."], [119.12, 120.0, "Voice."], [121.02, 123.89, "Voice means the speaker's personality in the poem."], [124.48, 126.68, "The voice is that of an elderly farmer."], [127.28, 129.76, "Your turn. Say: Voice."], [132.6, 133.71, "Voice."], [134.45, 135.73, "Interpretation."], [136.72, 139.68, "Interpretation means an explanation of a poem's meaning."], [140.28, 142.63, "Your interpretation is well supported."], [143.22, 146.02, "Your turn. Say: Interpretation."], [148.87, 150.13, "Interpretation."], [150.93, 154.69, "Part two: dialogue. Let's listen to a conversation."], [155.55, 160.18, "Visal, the poem ends with the image of a tree losing its leaves. What do you make of it?"], [161.28, 171.23, "The image might suggest loss, especially as the speaker has just mentioned her father. Or it could imply renewal, since leaves fall before spring."], [172.32, 173.9, "Which reading do you prefer?"], [174.98, 183.52, "The enjambment in the last stanza might be the key. The line runs on into 'green again', so the poem could be pointing towards hope."], [184.62, 186.53, "Could the poet have intended both?"], [187.65, 196.11, "She may well have. Great poems often hold two meanings in tension rather than forcing the reader to choose."], [197.27, 198.72, "Part three: grammar."], [199.58, 202.96, "Grammar focus: Modal verbs for interpretation."], [203.26, 204.46, "Look at the pattern."], [205.15, 208.14, "The image might suggest loss, or it could imply renewal."], [209.05, 211.14, "The enjambment could be pointing towards hope."], [212.05, 214.94, "The poet may well have intended both meanings."], [215.9, 227.83, "Combine modals with interpretive verbs: suggest, imply, evoke, convey, hint at. 'May well' expresses a strong possibility; 'might have / could have + past participle' speculates about the poet's intentions."], [228.58, 232.56, "Be careful! Don't say: The image might suggests loss."], [234.5, 237.1, "Say: The image might suggest loss."], [237.4, 239.47, "After a modal, use the base verb."], [240.27, 242.73, "Part four: reading. Read and listen."], [243.53, 245.17, "Reading a Poem Closely."], [245.47, 251.06, "Poetry compresses meaning into a small space, which is why every word may carry several possibilities."], [252.07, 257.84, "A single metaphor might evoke contradictory feelings, especially when its context is ambiguous."], [258.83, 265.27, "Form also contributes to meaning: enjambment could suggest urgency, while regular rhyme may convey order."], [266.27, 272.77, "Rather than searching for one correct answer, a skilled reader weighs alternative interpretations against the evidence."], [273.77, 279.13, "In this sense, analysing a poem is less like solving a puzzle than like holding a conversation."], [280.23, 284.26, "Part five: quiz. Five questions. Are you ready?"], [285.12, 287.13, "The falling leaves blank loss."], [287.43, 291.86, "A, might suggest. B, might suggesting. C, might to suggest."], [295.4, 297.61, "The answer is A: might suggest."], [298.75, 301.16, "The poet blank intended both meanings."], [301.46, 305.12, "A, may well. B, may well have. C, may have well."], [308.67, 310.89, "The answer is B: may well have."], [312.05, 314.82, "A sentence running over the end of a line is blank."], [315.12, 318.8, "A, rhyme. B, stanza. C, enjambment."], [322.37, 324.39, "The answer is C: enjambment."], [325.55, 327.89, "'Time is a thief' is an example of blank."], [328.19, 332.15, "A, a metaphor. B, a rhyme. C, a stanza."], [335.7, 337.94, "The answer is A: a metaphor."], [339.08, 341.86, "According to the reading, analysing a poem is like…"], [342.16, 347.18, "A, solving a puzzle. B, holding a conversation. C, counting syllables."], [350.73, 353.29, "The answer is B: holding a conversation."], [354.5, 357.86, "Part six: speaking. It's your turn to talk."], [358.72, 361.67, "Why can one poem support several interpretations?"], [378.48, 379.88, "Now listen to Visal."], [380.18, 418.32, "One poem can support several interpretations because poetry relies on images and metaphors rather than direct statements. A single image, such as a river, might suggest time passing, or it could imply a journey or even freedom. Each reader also brings personal experiences, which may highlight different meanings. For example, a poem about leaving home could feel joyful to a student and painful to a migrant. Some teachers prefer one correct answer, but I believe multiple, well-supported readings make poetry richer."], [418.62, 420.29, "Excellent answer, Visal!"], [421.18, 425.82, "Great work! Now you can use eight new words and modal verbs for interpretation."], [426.12, 430.63, "Today's value is imagination. Imagine new ideas for a better future."], [430.93, 433.64, "See you in Unit twenty-two. Goodbye!"], [433.94, 437.14, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C1B2-Unit22-Drama-and-Performance": [[0.35, 5.09, "Hello, everyone! I'm Ms.
