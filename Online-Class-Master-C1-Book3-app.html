recession. C, open a recession."], [355.17, 357.54, "The answer is A: trigger a recession."], [358.68, 361.76, "According to the reading, industrialization resulted in…"], [362.06, 367.98, "A, a shift from farm to factory labor. B, the end of trade. C, a fall in production."], [371.53, 375.29, "The answer is A: a shift from farm to factory labor."], [376.5, 379.74, "Part six: speaking. It's your turn to talk."], [380.58, 383.51, "How did industrialization change the way people worked?"], [400.32, 401.69, "Now listen to Visal."], [401.99, 437.34, "Industrialization changed work by moving production from homes and farms into large factories. Work was organised around machines and clocks, which led to long, controlled hours. For example, families who had once worked together in the fields now worked separately in mills. Although early factory conditions resulted in great hardship, the increase in productivity eventually raised living standards. Today, Cambodia's garment industry shows similar benefits and challenges, so these lessons remain very relevant."], [437.64, 439.84, "Excellent answer, Visal!"], [440.75, 446.11, "Great work! Now you can use eight new words and cause-effect: led to and resulted in."], [446.41, 451.67, "Today's value is economic literacy. Understand how money and work shape people's lives."], [451.97, 454.4, "See you in Unit nine. Goodbye!"], [454.7, 457.7, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C1B3-Unit09-Social-Movements": [[0.35, 5.29, "Hello, everyone! I'm Ms. Emma. Welcome to Online C one, Book three."], [5.59, 8.9, "Hi! I'm Visal. Let's learn together!"], [9.2, 15.84, "Unit nine: Social Movements. Today you will describe collective action with gerund phrases as subjects."], [16.14, 18.76, "Here is our lesson map. Let's start!"], [19.7, 22.76, "Part one: words. You will learn eight new words."], [23.62, 24.85, "Social movement."], [25.85, 30.44, "Social movement means an organised effort by many people to bring about social change."], [31.05, 34.12, "The civil rights movement transformed American law."], [34.72, 37.27, "Your turn. Say: Social movement."], [40.1, 41.41, "Social movement."], [42.15, 43.26, "Grassroots."], [44.25, 48.08, "Grassroots means organised by ordinary people at a local level."], [48.68, 51.43, "The campaign began as a grassroots initiative."], [52.02, 55.09, "Your turn. Say: Grassroots."], [57.93, 58.97, "Grassroots."], [59.72, 60.83, "Advocacy."], [61.85, 65.14, "Advocacy means public support for a cause or policy."], [65.75, 68.67, "Advocacy groups lobbied for safer factories."], [69.28, 71.98, "Your turn. Say: Advocacy."], [74.83, 75.9, "Advocacy."], [76.65, 77.87, "Solidarity."], [78.88, 82.28, "Solidarity means unity and mutual support within a group."], [82.88, 85.58, "Workers showed solidarity during the strike."], [86.18, 89.09, "Your turn. Say: Solidarity."], [91.93, 93.22, "Solidarity."], [93.98, 95.17, "Collective action."], [96.18, 100.3, "Collective action means action taken together by a group to achieve a shared goal."], [100.88, 103.64, "Collective action forced the company to negotiate."], [104.25, 107.28, "Your turn. Say: Collective action."], [110.13, 111.34, "Collective action."], [112.08, 112.96, "Reform."], [113.95, 116.92, "Reform means change intended to improve a system."], [117.52, 119.85, "The movement won important labour reforms."], [120.45, 122.87, "Your turn. Say: Reform."], [125.73, 126.65, "Reform."], [127.42, 129.07, "Awareness campaign."], [130.08, 133.66, "Awareness campaign means an organised effort to inform the public."], [134.25, 136.92, "An awareness campaign reduced plastic use."], [137.52, 140.52, "Your turn. Say: Awareness campaign."], [143.37, 145.02, "Awareness campaign."], [145.78, 146.78, "Momentum."], [147.78, 151.26, "Momentum means the force that keeps a process moving forward."], [151.85, 154.08, "The protest gained momentum online."], [154.68, 157.16, "Your turn. Say: Momentum."], [160.0, 161.02, "Momentum."], [161.83, 165.41, "Part two: dialogue. Let's listen to a conversation."], [166.25, 172.0, "Visal, you studied the campaign for better conditions in Cambodian garment factories. How did it succeed?"], [173.12, 182.29, "Building solidarity took sustained collective action. Organising workers across different factories was the hardest part."], [183.38, 185.3, "Did international pressure help?"], [186.42, 196.82, "Very much. Publicising conditions abroad put pressure on brands, and linking local unions with global advocacy groups gave the movement momentum."], [197.92, 199.87, "Why do some movements fade away?"], [200.98, 210.03, "Relying only on online posts rarely works. Maintaining a movement requires leadership, clear demands and patience."], [211.17, 212.95, "Part three: grammar."], [213.78, 217.29, "Grammar focus: Gerund phrases as subjects."], [217.59, 218.85, "Look at the pattern."], [219.55, 222.78, "Building solidarity takes sustained collective action."], [223.68, 227.56, "Linking local unions with global groups gave the movement momentum."], [228.45, 231.47, "Relying only on online posts rarely works."], [232.43, 242.5, "A gerund phrase used as a subject is singular, however long it is: 'Organising workers across many factories IS difficult.' This structure sounds more formal than 'It is difficult to…'."], [243.25, 246.96, "Be careful! Don't say: Build solidarity take time."], [248.9, 251.99, "Say: Building solidarity takes time."], [252.29, 254.91, "Gerund subject + singular verb."], [255.7, 257.99, "Part four: reading. Read and listen."], [258.8, 260.02, "How Movements Win."], [260.32, 266.15, "Social movements emerge when people believe that existing institutions will not address their grievances."], [267.17, 271.35, "Mobilizing supporters, however, requires far more than shared anger."], [272.33, 277.93, "Framing the problem clearly and proposing concrete reforms gives a movement direction and credibility."], [278.93, 284.26, "Sustaining momentum over years is often harder than starting a protest in a single day."], [285.27, 291.31, "Studying successful movements shows that solidarity across different groups is usually the decisive factor."], [292.4, 296.38, "Part five: quiz. Five questions. Are you ready?"], [297.22, 299.51, "Organising strikes blank courage."], [299.81, 303.77, "A, require. B, requires. C, requiring."], [307.33, 309.25, "The answer is B: requires."], [310.42, 312.37, "Choose the correct sentence."], [312.67, 318.52, "A, Build trust takes time.. B, Building trust takes time.. C, Building trust take time.."], [322.07, 324.68, "The answer is B: Building trust takes time.."], [325.82, 329.19, "A campaign organised by ordinary local people is blank."], [329.49, 333.51, "A, grassroots. B, advocacy. C, momentum."], [337.07, 338.95, "The answer is A: grassroots."], [340.12, 342.09, "Which collocation is correct?"], [342.39, 346.59, "A, gain momentum. B, win momentum. C, make momentum."], [350.13, 352.18, "The answer is A: gain momentum."], [353.32, 356.52, "According to the reading, what is usually the decisive factor?"], [356.82, 363.08, "A, online posts. B, solidarity across groups. C, a single protest."], [366.63, 369.68, "The answer is B: solidarity across groups."], [370.87, 373.8, "Part six: speaking. It's your turn to talk."], [374.65, 378.25, "What social movement do you find most inspiring, and why?"], [395.05, 396.58, "Now listen to Visal."], [396.88, 434.24, "The social movement I find most inspiring is the global campaign to ban landmines, which had a special impact on Cambodia. Bringing survivors, doctors and activists together created powerful solidarity across many countries. Their advocacy led to the Ottawa Treaty in 1997, and clearing mines has since saved countless lives here. Some critics point out that major powers still have not signed it. Even so, I think it proves that ordinary people working together can change international law."], [434.54, 436.3, "Excellent answer, Visal!"], [437.22, 441.92, "Great work! Now you can use eight new words and gerund phrases as subjects."], [442.22, 446.97, "Today's value is solidarity. Stand together with others who face injustice."], [447.27, 449.83, "See you in Unit ten. Goodbye!"], [450.13, 453.08, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C1B3-Unit10-Urban-Development": [[0.35, 5.09, "Hello, everyone! I'm Ms. Emma. Welcome to Online C one, Book three."], [5.39, 8.48, "Hi! I'm Visal. Let's learn together!"], [8.78, 15.1, "Unit ten: Urban Development. Today you will weigh the benefits and costs of urban change with 'although' clauses."], [15.4, 18.18, "Here is our lesson map. Let's start!"], [19.13, 22.27, "Part one: words. You will learn eight new words."], [23.12, 24.36, "Urbanization."], [25.35, 29.34, "Urbanization means the growth of cities as people move from rural areas."], [29.95, 33.11, "Rapid urbanization has transformed Phnom Penh."], [33.72, 36.68, "Your turn. Say: Urbanization."], [39.53, 40.63, "Urbanization."], [41.38, 42.63, "Infrastructure."], [43.62, 47.3, "Infrastructure means basic systems such as roads, water and power."], [47.88, 50.72, "New infrastructure reduced flooding in the city."], [51.32, 54.1, "Your turn. Say: Infrastructure."], [56.93, 58.24, "Infrastructure."], [58.98, 59.83, "Zoning."], [60.85, 64.53, "Zoning means rules about how land in different areas may be used."], [65.12, 67.75, "Zoning laws separate factories from homes."], [68.35, 70.69, "Your turn. Say: Zoning."], [73.53, 74.49, "Zoning."], [75.25, 76.53, "Gentrification."], [77.52, 82.96, "Gentrification means the renovation of poor areas, often pushing out original residents."], [83.55, 86.36, "Gentrification raised rents along the riverside."], [86.95, 89.78, "Your turn. Say: Gentrification."], [92.63, 93.98, "Gentrification."], [94.72, 96.09, "Public space."], [97.08, 101.08, "Public space means areas open to everyone, such as parks and squares."], [101.68, 104.26, "Public space encourages community life."], [104.85, 107.62, "Your turn. Say: Public space."], [110.47, 111.73, "Public space."], [112.48, 113.4, "Density."], [114.42, 117.54, "Density means the number of people living in an area."], [118.15, 121.03, "High density can make public transport efficient."], [121.62, 124.3, "Your turn. Say: Density."], [127.17, 128.11, "Density."], [128.85, 129.71, "Planning."], [130.72, 133.75, "Planning means deciding how land and cities will develop."], [134.35, 136.77, "Good planning prevents traffic chaos."], [137.38, 139.99, "Your turn. Say: Planning."], [142.83, 143.62, "Planning."], [144.38, 145.56, "Displacement."], [146.55, 150.05, "Displacement means being forced to leave one's home or area."], [150.65, 154.1, "The project caused the displacement of 4,000 families."], [154.72, 157.41, "Your turn. Say: Displacement."], [160.27, 161.3, "Displacement."], [162.1, 165.46, "Part two: dialogue. Let's listen to a conversation."], [166.32, 171.43, "Visal, the lake in the centre of Phnom Penh was filled in for development. Was that progress?"], [172.52, 180.3, "Although the project brought modern buildings and investment, thousands of residents were displaced with little compensation."], [181.38, 183.58, "Couldn't the city have balanced both?"], [184.68, 195.26, "Better planning might have helped. Although gentrification revitalizes an area, it should include affordable housing for the original community."], [196.35, 198.07, "What else did the city lose?"], [199.18, 208.34, "Public space and flood protection. Even though land is valuable, lakes absorb rainwater, so some areas now flood more often."], [209.5, 211.22, "Part three: grammar."], [212.08, 215.03, "Grammar focus: Although plus contrast."], [215.34, 216.58, "Look at the pattern."], [217.28, 222.03, "Although gentrification revitalizes an area, it can displace residents."], [222.95, 226.78, "Although the project brought investment, thousands were displaced."], [227.68, 231.15, "Even though land is valuable, lakes protect cities from floods."], [232.1, 241.89, "Use 'although' + clause to concede a point before presenting your main argument in the main clause. 'Despite / in spite of' need a noun or -ing: 'Despite the investment, …'."], [242.65, 246.63, "Be careful! Don't say: Although it helps, but it displaces people."], [248.57, 251.58, "Say: Although it helps, it displaces people."], [251.88, 253.57, "Don't use 'but' after 'although'."], [254.37, 256.88, "Part four: reading. Read and listen."], [257.67, 258.78, "Cities for Whom?."], [259.08, 266.1, "More than half of the world's population now lives in cities, and the proportion is rising fastest in Asia and Africa."], [267.1, 274.22, "Although urbanization creates jobs and opportunities, it often outpaces the construction of essential infrastructure."], [275.23, 279.87, "In many cities, informal settlements have been cleared to make way for commercial projects."], [280.87, 287.08, "Planners increasingly argue that development should protect public space, natural drainage and affordable housing."], [288.07, 292.56, "The central question is not whether cities should grow, but who benefits when they do."], [293.67, 297.38, "Part five: quiz. Five questions. Are you ready?"], [298.22, 301.83, "blank the city grew richer, many residents became poorer."], [302.13, 305.5, "A, Although. B, Despite. C, However."], [309.07, 310.87, "The answer is A: Although."], [312.02, 314.68, "blank the new roads, traffic remained heavy."], [314.98, 318.74, "A, Although. B, Despite. C, Even though."], [322.3, 324.74, "The answer is B: Despite."], [325.88, 328.08, "Being forced to leave one's home is blank."], [328.38, 332.36, "A, density. B, zoning. C, displacement."], [335.9, 337.97, "The answer is C: displacement."], [339.12, 342.29, "Basic systems like roads, water and power are blank."], [342.59, 346.68, "A, infrastructure. B, public space. C, planning."], [350.23, 352.86, "The answer is A: infrastructure."], [354.02, 357.05, "According to the reading, what is the central question?"], [357.35, 363.85, "A, whether cities should grow. B, who benefits when cities grow. C, how tall buildings can be."], [367.4, 370.43, "The answer is B: who benefits when cities grow."], [371.63, 374.91, "Part six: speaking. It's your turn to talk."], [375.75, 379.13, "What is one tradeoff between urban development and displacement?"], [395.92, 397.4, "Now listen to Visal."], [397.7, 434.24, "One tradeoff is that development brings investment and modern housing while forcing poorer residents to leave the area. Although renovated neighbourhoods often become safer and cleaner, rising rents mean that the original community can no longer afford to live there. In Phnom Penh, for example, several lake communities were relocated far from their jobs. Supporters argue that cities must modernise to compete. I agree, but I believe fair compensation and affordable housing should be part of every project."], [434.54, 436.45, "Excellent answer, Visal!"], [437.35, 441.57, "Great work! Now you can use eight new words and although plus contrast."], [441.87, 448.31, "Today's value is community awareness. Notice how changes affect every neighbour, not only the winners."], [448.61, 451.12, "See you in Unit eleven. Goodbye!"], [451.42, 454.57, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C1B3-Unit11-Migration-Studies": [[0.35, 5.67, "Hello, everyone! I'm Ms. Emma. Welcome to Online C one, Book three."], [5.97, 9.23, "Hi! I'm Visal. Let's learn together!"], [9.53, 15.82, "Unit eleven: Migration Studies. Today you will explain the causes of migration with 'because of' and 'due to'."], [16.12, 18.63, "Here is our lesson map. Let's start!"], [19.57, 22.93, "Part one: words. You will learn eight new words."], [23.78, 24.93, "Migration."], [25.95, 29.33, "Migration means the movement of people from one place to another."], [29.92, 32.2, "Labour migration to Thailand is common."], [32.78, 35.37, "Your turn. Say: Migration."], [38.2, 39.32, "Migration."], [40.08, 41.3, "Diaspora."], [42.32, 45.7, "Diaspora means people living outside their ancestral homeland."], [46.28, 49.13, "The Cambodian diaspora in the USA is large."], [49.72, 52.51, "Your turn. Say: Diaspora."], [55.37, 56.61, "Diaspora."], [57.35, 58.48, "Push factor."], [59.48, 62.97, "Push factor means a condition that drives people away from a place."], [63.58, 65.69, "Drought is a powerful push factor."], [66.28, 69.28, "Your turn. Say: Push factor."], [72.13, 73.2, "Push factor."], [73.95, 75.1, "Pull factor."], [76.12, 79.44, "Pull factor means a condition that attracts people to a place."], [80.05, 82.36, "Higher wages are the main pull factor."], [82.95, 85.53, "Your turn. Say: Pull factor."], [88.37, 89.55, "Pull factor."], [90.32, 91.41, "Assimilation."], [92.42, 95.82, "Assimilation means adopting the culture of the new society."], [96.42, 98.73, "Assimilation can weaken the home language."], [99.32, 102.52, "Your turn. Say: Assimilation."], [105.37, 106.6, "Assimilation."], [107.35, 108.49, "Integration."], [109.48, 114.06, "Integration means taking part fully in a new society while keeping one's identity."], [114.65, 117.06, "Language classes support integration."], [117.65, 120.06, "Your turn. Say: Integration."], [122.9, 124.01, "Integration."], [124.75, 125.76, "Identity."], [126.75, 129.4, "Identity means a person's sense of who they are."], [129.98, 133.03, "Second-generation migrants may have a mixed identity."], [133.62, 135.98, "Your turn. Say: Identity."], [138.83, 139.78, "Identity."], [140.52, 141.3, "Border."], [142.28, 145.05, "Border means the line separating two countries."], [145.65, 147.71, "Thousands cross the border each day."], [148.32, 150.27, "Your turn. Say: Border."], [153.13, 153.87, "Border."], [154.67, 158.1, "Part two: dialogue. Let's listen to a conversation."], [158.95, 163.12, "Visal, why do so many young Cambodians work in Thailand or South Korea?"], [164.22, 175.45, "Mostly due to economic push factors: low farm incomes and debt. Because of higher wages abroad, families send one member to work and send money home."], [176.55, 178.0, "Are there other reasons?"], [179.12, 188.89, "Owing to climate change, droughts and floods have made farming riskier. And social networks matter: people go where relatives already live."], [189.98, 192.23, "What happens to their identity abroad?"], [193.32, 204.86, "It often becomes layered. Because of distance, migrants value Khmer traditions more, yet their children may feel at home in two cultures."], [206.0, 207.97, "Part three: grammar."], [208.82, 211.84, "Grammar focus: Reason clauses (because of, due to)."], [212.14, 213.19, "Look at the pattern."], [213.88, 217.01, "People migrate due to economic push factors."], [217.92, 221.32, "Families send one member abroad because of higher wages."], [222.22, 224.99, "Farming has become riskier owing to climate change."], [225.93, 234.38, "'Because of / due to / owing to' + noun phrase; 'because / since / as' + clause. In formal writing 'due to' is common after 'be': 'The decline was due to drought.'"], [235.12, 238.73, "Be careful! Don't say: They migrated due to they were poor."], [240.67, 242.97, "Say: They migrated because they were poor."], [243.27, 246.14, "'Due to' + noun; 'because' + clause."], [246.93, 249.45, "Part four: reading. Read and listen."], [250.23, 251.53, "Why People Move."], [251.82, 257.48, "Migration has always been part of human history, but its scale has grown dramatically in the modern era."], [258.47, 265.69, "Researchers distinguish between push factors, such as poverty or conflict, and pull factors, such as employment or safety."], [266.7, 273.0, "Due to improved transport and communication, migrants today maintain closer ties with their home communities."], [274.0, 280.35, "Remittances sent by migrant workers now contribute significantly to many developing economies, including Cambodia's."], [281.37, 287.32, "Because of these connections, diasporas increasingly shape the culture and politics of their countries of origin."], [288.43, 292.24, "Part five: quiz. Five questions. Are you ready?"], [293.08, 294.82, "They moved blank the floods."], [295.12, 298.62, "A, because. B, because of. C, due."], [302.17, 304.18, "The answer is B: because of."], [305.32, 306.99, "Choose the correct sentence."], [307.29, 313.99, "A, He left due to he had no job.. B, He left due to unemployment.. C, He left due unemployment.."], [317.53, 320.85, "The answer is B: He left due to unemployment.."], [321.98, 324.95, "A condition that attracts people to a place is a blank."], [325.25, 329.31, "A, push factor. B, pull factor. C, border."], [332.87, 334.95, "The answer is B: pull factor."], [336.08, 339.28, "People living outside their ancestral homeland form a blank."], [339.58, 343.43, "A, diaspora. B, integration. C, identity."], [346.97, 349.27, "The answer is A: diaspora."], [350.42, 354.31, "According to the reading, remittances contribute significantly to…"], [354.61, 359.89, "A, many developing economies. B, border control. C, assimilation only."], [363.43, 366.52, "The answer is A: many developing economies."], [367.73, 370.88, "Part six: speaking. It's your turn to talk."], [371.75, 374.88, "What push or pull factor might cause someone to migrate?"], [391.68, 393.1, "Now listen to Visal."], [393.4, 431.37, "A common push factor in rural Cambodia is the lack of stable income from farming, often made worse by debt and unpredictable weather. Due to these pressures, many young people feel they have no choice but to look for work elsewhere. At the same time, higher wages in Thailand or South Korea act as a strong pull factor. For instance, a month's salary abroad can equal several months' income at home. However, migration also has costs, such as separation from family, so the decision is rarely easy."], [431.67, 433.46, "Excellent answer, Visal!"], [434.35, 439.22, "Great work! Now you can use eight new words and reason clauses (because of, due to)."], [439.52, 442.95, "Today's value is empathy. Think about how others feel."], [443.25, 445.9, "See you in Unit twelve. Goodbye!"], [446.2, 449.05, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C1B3-Unit12-Memory-Studies": [[0.35, 5.03, "Hello, everyone! I'm Ms. Emma. Welcome to Online C one, Book three."], [5.33, 9.11, "Hi! I'm Visal. Let's learn together!"], [9.41, 15.76, "Unit twelve: Memory Studies. Today you will explain why societies remember with 'so that' purpose clauses."], [16.06, 18.7, "Here is our lesson map. Let's start!"], [19.67, 22.81, "Part one: words. You will learn eight new words."], [23.65, 24.93, "Collective memory."], [25.92, 29.48, "Collective memory means the shared way a group remembers its past."], [30.08, 32.76, "The war shaped Cambodia's collective memory."], [33.35, 36.27, "Your turn. Say: Collective memory."], [39.13, 40.65, "Collective memory."], [41.38, 42.44, "Commemoration."], [43.45, 46.15, "Commemoration means a public act of remembering."], [46.75, 49.42, "A commemoration is held every 20 May."], [50.02, 53.01, "Your turn. Say: Commemoration."], [55.87, 57.02, "Commemoration."], [57.78, 58.74, "Monument."], [59.75, 63.45, "Monument means a structure built to remember a person or event."], [64.05, 66.72, "The Independence Monument stands in Phnom Penh."], [67.32, 69.72, "Your turn. Say: Monument."], [72.57, 73.64, "Monument."], [74.38, 75.15, "Trauma."], [76.15, 79.88, "Trauma means deep emotional harm caused by a terrible experience."], [80.48, 82.89, "Trauma can pass between generations."], [83.48, 85.96, "Your turn. Say: Trauma."], [88.8, 89.56, "Trauma."], [90.32, 91.43, "Remembrance."], [92.45, 96.06, "Remembrance means the act of honouring and remembering the dead."], [96.65, 98.46, "A day of remembrance was declared."], [99.05, 101.71, "Your turn. Say: Remembrance."], [104.57, 105.8, "Remembrance."], [106.55, 107.5, "Erasure."], [108.52, 112.09, "Erasure means the removal of something from memory or records."], [112.68, 116.17, "Erasure of minority history is a form of injustice."], [116.78, 118.95, "Your turn. Say: Erasure."], [121.8, 122.84, "Erasure."], [123.58, 124.6, "Narrative."], [125.58, 129.1, "Narrative means the story a society tells about its past."], [129.72, 132.7, "Official narratives may hide uncomfortable facts."], [133.32, 136.03, "Your turn. Say: Narrative."], [138.87, 139.79, "Narrative."], [140.55, 141.52, "Legacy."], [142.52, 145.68, "Legacy means what the past leaves for later generations."], [146.28, 148.79, "The legacy of the genocide is still felt."], [149.38, 152.19, "Your turn. Say: Legacy."], [155.03, 155.85, "Legacy."], [156.63, 160.72, "Part two: dialogue. Let's listen to a conversation."], [161.58, 167.49, "Visal, you visited the Tuol Sleng Genocide Museum. Why do you think it was preserved, rather than demolished?"], [168.58, 177.15, "It was preserved so that the crimes of the Khmer Rouge would never be forgotten, and so that future generations could learn from them."], [178.25, 180.41, "Isn't it painful for survivors?"], [181.52, 190.33, "Very. That's why commemoration must be handled with care, so that victims are honoured rather than turned into a spectacle."], [191.45, 193.36, "What role does education play?"], [194.45, 205.78, "Since 2009, the genocide has been taught in schools so that young people understand their parents' trauma, which helps prevent erasure and denial."], [206.93, 208.6, "Part three: grammar."], [209.45, 212.34, "Grammar focus: Purpose clauses (so that)."], [212.64, 213.85, "Look at the pattern."], [214.55, 217.42, "Monuments are built so that events are not forgotten."], [218.32, 221.74, "The prison was preserved so that future generations could learn."], [222.65, 226.79, "History is taught in schools so that young people understand their parents' trauma."], [227.73, 236.43, "'So that' introduces a full clause of purpose, often with a modal: so that they can / could / will / would. Use it instead of 'to' when the subject of the purpose is different from the main subject."], [237.18, 241.5, "Be careful! Don't say: Monuments are built so that we don't forgetting."], [243.43, 246.75, "Say: Monuments are built so that we don't forget."], [247.04, 248.87, "'So that' + full clause."], [249.67, 252.11, "Part four: reading. Read and listen."], [252.9, 254.5, "Why Societies Remember."], [254.81, 260.72, "Memory studies examines how communities remember, interpret and sometimes forget their past."], [261.73, 266.79, "Monuments and museums are created so that significant events remain visible in public life."], [267.8, 274.19, "However, collective memory is never neutral; governments may highlight some events so that others are quietly forgotten."], [275.2, 282.08, "In post-conflict societies, survivors' testimony is often recorded so that their experiences cannot be denied."], [283.07, 288.65, "Remembering painful histories is therefore both an act of mourning and a commitment to prevent repetition."], [289.77, 293.87, "Part five: quiz. Five questions. Are you ready?"], [294.72, 297.33, "The names were recorded so that they blank forgotten."], [297.63, 301.48, "A, would not be. B, not be. C, would not."], [305.03, 307.3, "The answer is A: would not be."], [308.45, 310.25, "Choose the correct sentence."], [310.55, 317.31, "A, They built it so that people remember.. B, They built it so that to remember.. C, They built it so people to remember.."], [320.87, 324.15, "The answer is A: They built it so that people remember.."], [325.32, 327.69, "A public act of remembering is a blank."], [327.99, 331.91, "A, commemoration. B, trauma. C, erasure."], [335.47, 337.59, "The answer is A: commemoration."], [338.75, 341.73, "Removing something from memory or records is blank."], [342.02, 345.81, "A, narrative. B, erasure. C, legacy."], [349.37, 351.16, "The answer is B: erasure."], [352.32, 355.0, "According to the reading, collective memory is…"], [355.3, 360.51, "A, always neutral. B, never neutral. C, decided by survivors only."], [364.07, 366.3, "The answer is B: never neutral."], [367.5, 370.92, "Part six: speaking. It's your turn to talk."], [371.78, 376.28, "Why might a society choose to build a monument to remember a difficult event?"], [393.08, 394.67, "Now listen to Visal."], [394.97, 427.57, "A society might build a monument to a difficult event so that the victims are honoured and the lessons of the past remain visible. In Cambodia, the memorial at Choeung Ek was created so that the world would not forget the crimes of the Khmer Rouge. Such places also give families somewhere to grieve when many victims have no graves. Some people feel that remembering painful events keeps old wounds open. However, I believe that forgetting is more dangerous, because it allows history to repeat itself."], [427.87, 429.47, "Excellent answer, Visal!"], [430.38, 434.72, "Great work! Now you can use eight new words and purpose clauses (so that)."], [435.02, 440.05, "Today's value is remembrance. Remember the victims, so that history is never repeated."], [440.35, 442.88, "See you in Unit thirteen. Goodbye!"], [443.18, 446.57, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C1B3-Unit13-Oral-History": [[0.35, 5.08, "Hello, everyone! I'm Ms. Emma. Welcome to Online C one, Book three."], [5.38, 8.76, "Hi! I'm Visal. Let's learn together!"], [9.06, 15.6, "Unit thirteen: Oral History. Today you will speculate about what oral sources may reveal with might and may."], [15.9, 18.67, "Here is our lesson map. Let's start!"], [19.63, 22.95, "Part one: words. You will learn eight new words."], [23.78, 24.99, "Oral history."], [25.98, 30.04, "Oral history means history gathered from people's spoken memories."], [30.65, 34.01, "Oral history captures voices missing from archives."], [34.62, 37.98, "Your turn. Say: Oral history."], [40.83, 42.05, "Oral history."], [42.82, 43.77, "Testimony."], [44.78, 47.91, "Testimony means a personal account given as evidence."], [48.52, 51.4, "Her testimony described life in the work camps."], [51.98, 54.61, "Your turn. Say: Testimony."], [57.47, 58.43, "Testimony."], [59.18, 60.16, "Interview."], [61.15, 64.57, "Interview means a formal conversation to gather information."], [65.15, 67.68, "Each interview lasted about two hours."], [68.28, 70.84, "Your turn. Say: Interview."], [73.7, 74.59, "Interview."], [75.35, 76.71, "Firsthand account."], [77.72, 81.67, "Firsthand account means a description from someone who experienced events."], [82.28, 84.99, "A firsthand account adds emotional detail."], [85.58, 88.76, "Your turn. Say: Firsthand account."], [91.6, 92.97, "Firsthand account."], [93.72, 94.66, "Memory."], [95.65, 99.48, "Memory means the ability to remember, or something remembered."], [100.08, 102.13, "Memory can change over decades."], [102.72, 105.03, "Your turn. Say: Memory."], [107.87, 108.72, "Memory."], [109.48, 110.43, "Archive."], [111.42, 114.19, "Archive means a collection where records are kept."], [114.78, 117.28, "The recordings were stored in a digital archive."], [117.88, 119.99, "Your turn. Say: Archive."], [122.83, 123.62, "Archive."], [124.38, 125.22, "Narrator."], [126.22, 128.81, "Narrator means the person telling their story."], [129.42, 132.61, "The narrator paused before describing the evacuation."], [133.22, 135.42, "Your turn. Say: Narrator."], [138.27, 139.15, "Narrator."], [139.92, 141.17, "Authenticity."], [142.18, 145.65, "Authenticity means the quality of being genuine and reliable."], [146.25, 149.51, "Historians assess the authenticity of each account."], [150.12, 153.43, "Your turn. Say: Authenticity."], [156.27, 157.52, "Authenticity."], [158.33, 162.19, "Part two: dialogue. Let's listen to a conversation."], [163.05, 168.4, "Visal, you interviewed your grandmother about life in the 1970s. What did you learn?"], [169.48, 179.61, "Details no book contains: how families hid rice, how songs were secretly remembered. An interview may reveal things missing from written records."], [180.72, 183.19, "But can memory be trusted after fifty years?"], [184.28, 194.79, "Not completely. Some dates might be confused, and painful events may be described differently each time. So I compared her account with other sources."], [195.88, 197.4, "Was it difficult for her?"], [198.48, 206.99, "At times. I learned to listen without interrupting, because a narrator might stay silent if she feels pressured."], [208.13, 209.7, "Part three: grammar."], [210.55, 213.86, "Grammar focus: Might and may for possibility."], [214.16, 215.34, "Look at the pattern."], [216.05, 219.72, "An interview may reveal details missing from written records."], [220.62, 223.6, "Some dates might be confused after fifty years."], [224.52, 227.55, "A narrator might stay silent if she feels pressured."], [228.5, 239.48, "'May' and 'might' express possibility, with 'might' slightly less certain. Use 'may/might + be + p.p.' for passive possibility, and 'may/might have + p.p.' for the past."], [240.22, 244.16, "Be careful! Don't say: An interview may reveals new details."], [246.1, 249.03, "Say: An interview may reveal new details."], [249.33, 251.26, "After 'may', use the base verb."], [252.07, 255.03, "Part four: reading. Read and listen."], [255.83, 257.38, "Voices From the Past."], [257.68, 262.38, "Oral history records the spoken memories of people who lived through historical events."], [263.4, 269.42, "It may preserve the experiences of groups who left few written documents, such as farmers, women and minorities."], [270.4, 276.58, "Memories might be shaped by later events, emotions or retelling, so historians treat them critically."], [277.57, 283.25, "Nevertheless, a firsthand account may capture feelings and everyday details that official records ignore."], [284.23, 291.18, "In Cambodia, projects such as the Documentation Center have collected thousands of testimonies so that survivors' voices endure."], [292.27, 296.42, "Part five: quiz. Five questions. Are you ready?"], [297.28, 300.22, "Her memory blank incomplete after so many years."], [300.52, 304.24, "A, might be. B, might is. C, might being."], [307.8, 309.89, "The answer is A: might be."], [311.05, 313.47, "An interview blank reveal new details."], [313.77, 316.93, "A, may. B, may to. C, mays."], [320.47, 322.43, "The answer is A: may."], [323.58, 326.85, "A description from someone who experienced events is a blank."], [327.15, 330.98, "A, narrator. B, firsthand account. C, archive."], [334.53, 336.83, "The answer is B: firsthand account."], [337.98, 340.75, "The quality of being genuine and reliable is blank."], [341.05, 345.04, "A, memory. B, testimony. C, authenticity."], [348.6, 351.2, "The answer is C: authenticity."], [352.35, 356.23, "According to the reading, oral history may preserve the experiences of…"], [356.53, 362.04, "A, only officials. B, groups who left few written documents. C, historians."], [365.6, 369.4, "The answer is B: groups who left few written documents."], [370.6, 373.89, "Part six: speaking. It's your turn to talk."], [374.75, 378.61, "Why might an oral history interview reveal something a written record cannot?"], [395.42, 396.96, "Now listen to Visal."], [397.26, 435.07, "An oral history interview might reveal emotions and everyday details that written records rarely include. Official documents usually record decisions and statistics, whereas a survivor may explain what those decisions felt like for an ordinary family. My grandmother, for example, described how people secretly shared food. Of course, memories may change over time and should be checked against other sources. Still, I believe oral history gives a voice to people whom official history often ignores."], [435.37, 437.03, "Excellent answer, Visal!"], [437.92, 442.28, "Great work! Now you can use eight new words and might and may for possibility."], [442.58, 447.7, "Today's value is empathetic listening. Listen to understand, not only to reply."], [448.0, 450.69, "See you in Unit fourteen. Goodbye!"], [450.99, 454.65, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C1B3-Unit14-Archival-Research": [[0.35, 5.28, "Hello, everyone! I'm Ms. Emma. Welcome to Online C one, Book three."], [5.58, 9.11, "Hi! I'm Visal. Let's learn together!"], [9.41, 15.62, "Unit fourteen: Archival Research. Today you will describe how sources are checked with the passive."], [15.92, 18.53, "Here is our lesson map. Let's start!"], [19.47, 22.68, "Part one: words. You will learn eight new words."], [23.52, 24.44, "Archive."], [25.45, 28.52, "Archive means a place where historical records are kept."], [29.12, 31.93, "The national archive opened its colonial files."], [32.52, 34.81, "Your turn. Say: Archive."], [37.67, 38.53, "Archive."], [39.28, 40.7, "Primary source."], [41.72, 45.21, "Primary source means original material from the period studied."], [45.82, 48.5, "Letters and photographs are primary sources."], [49.12, 52.26, "Your turn. Say: Primary source."], [55.1, 56.27, "Primary source."], [57.02, 58.01, "Provenance."], [59.02, 63.62, "Provenance means the origin and history of ownership of a document or object."], [64.22, 66.61, "The statue's provenance was investigated."], [67.22, 69.61, "Your turn. Say: Provenance."], [72.47, 73.56, "Provenance."], [74.32, 75.35, "Preservation."], [76.35, 79.77, "Preservation means protecting materials from damage or decay."], [80.35, 83.46, "Humidity makes preservation difficult in Cambodia."], [84.05, 86.5, "Your turn. Say: Preservation."], [89.37, 90.47, "Preservation."], [91.22, 92.33, "Access."], [93.35, 96.74, "Access means the right or opportunity to use something."], [97.35, 99.86, "Researchers need permission for access."], [100.45, 102.95, "Your turn. Say: Access."], [105.8, 106.93, "Access."], [107.68, 108.67, "Catalog."], [109.68, 113.08, "Catalog means a systematic list of items in a collection."], [113.68, 116.26, "The catalog lists 20,000 documents."], [116.85, 119.29, "Your turn. Say: Catalog."], [122.13, 123.1, "Catalog."], [123.85, 125.01, "Digitization."], [126.02, 129.39, "Digitization means converting documents into digital form."], [129.98, 133.53, "Digitization protects fragile palm-leaf manuscripts."], [134.12, 136.88, "Your turn. Say: Digitization."], [139.73, 140.95, "Digitization."], [141.72, 143.39, "Fragmentary evidence."], [144.38, 148.25, "Fragmentary evidence means evidence that survives only in pieces."], [148.85, 152.01, "Historians rebuilt events from fragmentary evidence."], [152.62, 156.19, "Your turn. Say: Fragmentary evidence."], [159.03, 160.6, "Fragmentary evidence."], [161.4, 164.99, "Part two: dialogue. Let's listen to a conversation."], [165.85, 171.41, "Visal, a museum abroad claims its Khmer statue was bought legally. How would a historian check that?"], [172.52, 184.04, "The statue's provenance must be carefully verified. Every sale record should be examined, and photos from the 1960s compared with the temple site."], [185.15, 187.16, "What if the documents are incomplete?"], [188.25, 198.74, "Then fragmentary evidence has to be pieced together. In several cases, statues were proven to have been looted, and they have been returned to Cambodia."], [199.85, 202.7, "And what about old palm-leaf manuscripts here?"], [203.78, 211.3, "They are being digitized, so that the originals can be protected from humidity while scholars are given access online."], [212.43, 214.19, "Part three: grammar."], [215.05, 218.85, "Grammar focus: Passive for verification process."], [219.15, 220.23, "Look at the pattern."], [220.92, 223.82, "A source's provenance must be carefully verified."], [224.72, 227.41, "Several statues have been returned to Cambodia."], [228.32, 230.92, "Palm-leaf manuscripts are being digitized."], [231.87, 242.39, "Research methods are described in the passive because the process matters more than the researcher: must be verified, were compared, are being digitized. Choose the tense carefully for each stage."], [243.15, 246.92, "Be careful! Don't say: The provenance must verified."], [248.87, 251.87, "Say: The provenance must be verified."], [252.16, 253.99, "Modal passive needs 'be'."], [254.8, 257.51, "Part four: reading. Read and listen."], [258.3, 259.78, "Inside the Archive."], [260.08, 266.38, "Archives are not neutral storehouses; what has been kept, and what has been lost, shapes what historians can know."], [267.4, 272.93, "Before a document is used as evidence, its provenance must be established and its authenticity tested."], [273.93, 280.54, "In Cambodia, many records were destroyed during the conflict, so historians often work with fragmentary evidence."], [281.53, 287.98, "Today, collections are being digitized and catalogued, which greatly widens access for students and researchers."], [288.97, 295.01, "Careful archival work has even helped to identify looted artefacts and return them to their rightful communities."], [296.1, 300.12, "Part five: quiz. Five questions. Are you ready?"], [300.98, 303.88, "The documents blank by experts before publication."], [304.18, 308.03, "A, were examined. B, examined. C, were examine."], [311.57, 313.44, "The answer is A: were examined."], [314.58, 316.7, "The manuscripts blank at the moment."], [317.0, 321.87, "A, are digitizing. B, are being digitized. C, being digitized."], [325.43, 328.23, "The answer is B: are being digitized."], [329.38, 332.69, "The origin and ownership history of an object is its blank."], [333.0, 336.79, "A, catalog. B, access. C, provenance."], [340.33, 342.36, "The answer is C: provenance."], [343.52, 346.22, "Evidence that survives only in pieces is blank."], [346.52, 351.56, "A, fragmentary evidence. B, primary source. C, preservation."], [355.1, 358.02, "The answer is A: fragmentary evidence."], [359.18, 361.33, "According to the reading, archives are…"], [361.63, 366.6, "A, neutral storehouses. B, not neutral. C, always complete."], [370.13, 372.37, "The answer is B: not neutral."], [373.57, 376.62, "Part six: speaking. It's your turn to talk."], [377.48, 381.35, "Why is verifying a source's provenance important in historical research?"], [398.15, 399.69, "Now listen to Visal."], [399.99, 436.7, "Verifying a source's provenance is important because a document or object can only be trusted as evidence if its origin is known. If a forged letter is accepted without being checked, an entire interpretation of the past may be built on a lie. Provenance research has also helped Cambodia, since several looted statues were identified and returned from foreign museums. Some people see this work as slow and technical. However, I believe careful verification is what separates history from rumour."], [437.0, 438.78, "Excellent answer, Visal!"], [439.68, 444.76, "Great work! Now you can use eight new words and passive for verification process."], [445.06, 449.98, "Today's value is meticulousness. Check every detail carefully before you trust it."], [450.28, 452.93, "See you in Unit fifteen. Goodbye!"], [453.23, 455.62, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C1B3-Unit15-Historical-Method": [[0.35, 4.98, "Hello, everyone! I'm Ms. Emma. Welcome to Online C one, Book three."], [5.28, 8.63, "Hi! I'm Visal. Let's learn together!"], [8.93, 16.03, "Unit fifteen: Historical Method. Today you will make precise claims about limits with modal + adverb combinations."], [16.33, 19.02, "Here is our lesson map. Let's start!"], [19.97, 22.86, "Part one: words. You will learn eight new words."], [23.72, 25.07, "Historiography."], [26.05, 29.44, "Historiography means the study of how history is written."], [30.05, 33.07, "Historiography shows how views change over time."], [33.68, 36.39, "Your turn. Say: Historiography."], [39.23, 40.61, "Historiography."], [41.35, 42.68, "Source criticism."], [43.68, 47.75, "Source criticism means evaluating the reliability of sources."], [48.35, 51.2, "Source criticism asks who wrote a text and why."], [51.78, 54.65, "Your turn. Say: Source criticism."], [57.5, 59.02, "Source criticism."], [59.78, 60.61, "Bias."], [61.62, 64.13, "Bias means a tendency to favour one view."], [64.72, 66.97, "Every source carries some bias."], [67.58, 69.94, "Your turn. Say: Bias."], [72.8, 73.8, "Bias."], [74.55, 75.93, "Periodization."], [76.95, 80.26, "Periodization means dividing the past into periods."], [80.85, 83.44, "Periodization can hide continuities."], [84.05, 86.48, "Your turn. Say: Periodization."], [89.33, 90.58, "Periodization."], [91.32, 92.28, "Causation."], [93.28, 96.26, "Causation means the study of causes and effects."], [96.85, 99.33, "Causation is rarely simple in history."], [99.92, 102.37, "Your turn. Say: Causation."], [105.23, 106.47, "Causation."], [107.22, 108.64, "Interpretation."], [109.65, 112.39, "Interpretation means an explanation of meaning."], [112.98, 115.78, "Her interpretation challenged the consensus."], [116.38, 119.16, "Your turn. Say: Interpretation."], [122.0, 123.17, "Interpretation."], [123.92, 124.86, "Evidence."], [125.85, 128.59, "Evidence means information that supports a claim."], [129.18, 131.66, "The evidence is limited but consistent."], [132.25, 134.82, "Your turn. Say: Evidence."], [137.67, 138.67, "Evidence."], [139.42, 140.51, "Objectivity."], [141.52, 144.86, "Objectivity means judgement free from personal feelings."], [145.45, 148.69, "Complete objectivity is an ideal, not a reality."], [149.28, 152.19, "Your turn. Say: Objectivity."], [155.03, 156.2, "Objectivity."], [157.0, 160.5, "Part two: dialogue. Let's listen to a conversation."], [161.35, 164.58, "Visal, can a historian ever be completely objective?"], [165.68, 174.93, "I don't think so. A historian can rarely be completely objective, because choosing which sources to study is already an interpretation."], [176.02, 177.75, "Then is history just opinion?"], [178.85, 189.35, "No. Bias can never fully be removed, but it can certainly be reduced through source criticism and by comparing different perspectives."], [190.45, 192.78, "How would you apply that to the Khmer Empire?"], [193.88, 203.56, "Temple inscriptions mostly praise kings, so they can seldom tell us about farmers. We can only partly fill that gap with archaeology."], [204.7, 206.24, "Part three: grammar."], [207.08, 212.37, "Grammar focus: Modal plus adverb (can never fully, can rarely)."], [212.67, 213.9, "Look at the pattern."], [214.62, 217.42, "A historian can rarely be completely objective."], [218.32, 220.4, "Bias can never fully be removed."], [221.28, 224.65, "Inscriptions can seldom tell us about ordinary farmers."], [225.6, 236.9, "Adverbs make modal claims precise: can rarely / seldom (not often), can never fully (not completely), can only partly. Place the adverb after the modal: 'can never fully be', not 'can fully never be'."], [237.65, 242.23, "Be careful! Don't say: A historian can fully never be objective."], [244.17, 247.18, "Say: A historian can never be fully objective."], [247.48, 250.15, "Order: can + never + be + fully."], [250.93, 253.48, "Part four: reading. Read and listen."], [254.27, 255.78, "The Historian's Craft."], [256.08, 261.38, "The historical method is a set of practices for turning fragmentary evidence into reliable knowledge."], [262.37, 268.62, "Historians can rarely observe the past directly; instead, they reconstruct it through sources that are always partial."], [269.6, 275.31, "Source criticism asks who produced a document, for what purpose and under what constraints."], [276.3, 282.03, "Because selection and interpretation are unavoidable, complete objectivity can never fully be achieved."], [283.03, 289.46, "Rigorous method, transparency and debate nevertheless allow historians to reach conclusions that can be trusted."], [290.57, 294.6, "Part five: quiz. Five questions. Are you ready?"], [295.45, 297.33, "Bias can blank be eliminated."], [297.63, 301.76, "A, never fully. B, fully never. C, never fully to."], [305.3, 307.62, "The answer is A: never fully."], [308.78, 311.49, "A historian can blank observe the past directly."], [311.79, 315.06, "A, rarely. B, rare. C, rarely to."], [318.6, 320.36, "The answer is A: rarely."], [321.52, 324.46, "Evaluating the reliability of sources is blank."], [324.76, 329.42, "A, periodization. B, source criticism. C, causation."], [332.97, 335.45, "The answer is B: source criticism."], [336.62, 339.31, "Judgement free from personal feelings is blank."], [339.61, 343.53, "A, evidence. B, bias. C, objectivity."], [347.07, 349.44, "The answer is C: objectivity."], [350.58, 354.99, "According to the reading, what allows historians to reach trusted conclusions?"], [355.29, 361.53, "A, complete objectivity. B, rigorous method, transparency and debate. C, a single source."], [365.07, 369.05, "The answer is B: rigorous method, transparency and debate."], [370.27, 373.42, "Part six: speaking. It's your turn to talk."], [374.28, 378.32, "Can a historian ever be completely objective? Why or why not?"], [395.12, 396.59, "Now listen to Visal."], [396.89, 430.98, "A historian can never be completely objective, because every decision about which sources to use and which questions to ask involves judgement. Historians are also influenced by their own culture and time. For example, colonial historians often described Khmer history through European assumptions. Nevertheless, this does not make history mere opinion, since claims can still be tested against evidence. I believe the best historians admit their limits openly and invite others to challenge their conclusions."], [431.28, 432.98, "Excellent answer, Visal!"], [433.88, 439.73, "Great work! Now you can use eight new words and modal plus adverb (can never fully, can rarely)."], [440.03, 445.31, "Today's value is intellectual humility. Admit what you do not know, and stay ready to learn."], [445.61, 448.42, "See you in Unit sixteen. Goodbye!"], [448.72, 451.92, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C1B3-Unit16-Comparative-History": [[0.35, 5.29, "Hello, everyone! I'm Ms. Emma. Welcome to Online C one, Book three."], [5.59, 9.06, "Hi! I'm Visal. Let's learn together!"], [9.36, 16.03, "Unit sixteen: Comparative History. Today you will identify patterns between countries with 'across' and 'throughout'."], [16.33, 19.0, "Here is our lesson map. Let's start!"], [19.97, 23.11, "Part one: words. You will learn eight new words."], [23.95, 25.32, "Comparative history."], [26.32, 31.32, "Comparative history means the study of similarities and differences between societies' pasts."], [31.92, 35.53, "Comparative history examines several revolutions together."], [36.12, 39.47, "Your turn. Say: Comparative history."], [42.3, 43.81, "Comparative history."], [44.55, 45.8, "Cross-national."], [46.78, 49.9, "Cross-national means involving several countries."], [50.48, 53.41, "The cross-national study included ten states."], [54.02, 57.24, "Your turn. Say: Cross-national."], [60.1, 61.43, "Cross-national."], [62.18, 62.96, "Pattern."], [63.95, 67.01, "Pattern means a regular and repeated way something happens."], [67.62, 70.52, "A pattern of land reform followed independence."], [71.12, 73.59, "Your turn. Say: Pattern."], [76.43, 77.26, "Pattern."], [78.02, 79.14, "Divergence."], [80.15, 82.94, "Divergence means a process of becoming different."], [83.55, 87.96, "The two economies show striking divergence after 1960."], [88.55, 91.02, "Your turn. Say: Divergence."], [93.87, 94.76, "Divergence."], [95.52, 96.78, "Convergence."], [97.78, 100.65, "Convergence means a process of becoming similar."], [101.25, 103.68, "Convergence occurred as trade increased."], [104.28, 106.99, "Your turn. Say: Convergence."], [109.83, 111.0, "Convergence."], [111.75, 112.69, "Case study."], [113.68, 117.1, "Case study means a detailed examination of one example."], [117.68, 119.87, "Cambodia serves as a case study."], [120.48, 123.15, "Your turn. Say: Case study."], [126.0, 127.05, "Case study."], [127.78, 129.06, "Generalization."], [130.05, 133.86, "Generalization means a broad statement based on several examples."], [134.45, 137.33, "Avoid generalizations based on one country."], [137.92, 140.47, "Your turn. Say: Generalization."], [143.3, 144.55, "Generalization."], [145.28, 146.27, "Context."], [147.28, 150.92, "Context means the specific circumstances of a place and time."], [151.52, 154.28, "Every case must be understood in context."], [154.88, 157.56, "Your turn. Say: Context."], [160.4, 161.59, "Context."], [162.4, 165.87, "Part two: dialogue. Let's listen to a conversation."], [166.72, 171.73, "Visal, you compared independence movements in Southeast Asia. What did you find?"], [172.82, 181.83, "Patterns emerge across many different national histories. Throughout the region, nationalist leaders were often educated in colonial schools."], [182.92, 184.25, "And the differences?"], [185.35, 195.58, "There was strong divergence in the methods. Cambodia achieved independence largely through negotiation, while Vietnam and Indonesia fought long wars."], [196.68, 198.49, "Why does comparison matter?"], [199.58, 208.18, "It tests generalizations. Across all these cases, context explains why similar causes produced different outcomes."], [209.33, 210.74, "Part three: grammar."], [211.58, 215.2, "Grammar focus: Across and throughout prepositions."], [215.5, 216.74, "Look at the pattern."], [217.45, 220.55, "Patterns emerge across many different national histories."], [221.45, 225.37, "Nationalist leaders were educated in colonial schools throughout the region."], [226.25, 229.35, "Similar reforms spread throughout the twentieth century."], [230.3, 241.91, "'Across' suggests comparison between separate units (across countries, across cultures). 'Throughout' means in every part of an area or for the whole of a period (throughout the region, throughout the 1950s)."], [242.65, 247.54, "Be careful! Don't say: Patterns emerge across of many histories."], [249.5, 252.88, "Say: Patterns emerge across many histories."], [253.18, 254.58, "'Across' needs no 'of'."], [255.37, 257.8, "Part four: reading. Read and listen."], [258.6, 260.27, "Why Compare Histories?."], [260.57, 266.86, "Comparative history places two or more societies side by side to understand both their similarities and their differences."], [267.87, 275.21, "Across Southeast Asia, for example, colonial rule produced comparable economic structures based on exporting raw materials."], [276.2, 281.46, "Throughout the region, however, independence was achieved in very different ways and at different speeds."], [282.47, 288.82, "Comparison allows historians to test generalizations that might seem convincing when only one case is examined."], [289.83, 295.56, "At the same time, careful attention to context prevents comparison from becoming oversimplification."], [296.67, 301.04, "Part five: quiz. Five questions. Are you ready?"], [301.88, 304.8, "Rice farming is practised blank the whole region."], [305.1, 308.74, "A, throughout. B, across of. C, along."], [312.3, 314.18, "The answer is A: throughout."], [315.35, 318.41, "The study compared attitudes blank ten countries."], [318.71, 322.39, "A, across. B, throughout of. C, over of."], [325.93, 327.79, "The answer is A: across."], [328.95, 331.23, "A process of becoming different is blank."], [331.53, 335.88, "A, convergence. B, divergence. C, pattern."], [339.43, 342.06, "The answer is B: divergence."], [343.22, 346.49, "A detailed examination of one example is a blank."], [346.79, 351.0, "A, case study. B, generalization. C, context."], [354.57, 357.15, "The answer is A: case study."], [358.28, 361.28, "According to the reading, comparison helps historians to…"], [361.58, 367.13, "A, avoid context. B, test generalizations. C, study only one case."], [370.67, 373.97, "The answer is B: test generalizations."], [375.17, 378.21, "Part six: speaking. It's your turn to talk."], [379.05, 382.66, "What pattern have you noticed across the histories of different countries?"], [399.45, 400.95, "Now listen to Visal."], [401.25, 435.44, "One pattern across many countries' histories is that periods of rapid economic change are often followed by political unrest. Throughout the twentieth century, for instance, industrialization and urban growth created new social groups that demanded political rights. In South Korea and Taiwan, economic development was eventually followed by democratic movements. However, some countries remained authoritarian despite growth, so context always matters."], [435.74, 437.37, "Excellent answer, Visal!"], [438.28, 442.86, "Great work! Now you can use eight new words and across and throughout prepositions."], [443.16, 448.42, "Today's value is global perspective. Local stories can carry universal truths."], [448.72, 451.5, "See you in Unit seventeen. Goodbye!"], [451.8, 455.28, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C1B3-Unit17-Global-History": [[0.35, 5.13, "Hello, everyone! I'm Ms. Emma. Welcome to Online C one, Book three."], [5.43, 9.19, "Hi! I'm Visal. Let's learn together!"], [9.49, 16.17, "Unit seventeen: Global History. Today you will widen the historical frame with 'beyond' + noun phrase."], [16.47, 18.91, "Here is our lesson map. Let's start!"], [19.87, 23.03, "Part one: words. You will learn eight new words."], [23.88, 25.12, "Globalization."], [26.12, 30.64, "Globalization means the increasing connection of the world's economies and cultures."], [31.25, 34.38, "Globalization is not only a modern phenomenon."], [34.98, 38.17, "Your turn. Say: Globalization."], [41.03, 42.6, "Globalization."], [43.35, 44.46, "Interconnection."], [45.45, 49.03, "Interconnection means a link between different places or systems."], [49.62, 52.01, "Ancient ports reveal deep interconnection."], [52.62, 55.22, "Your turn. Say: Interconnection."], [58.07, 59.17, "Interconnection."], [59.92, 61.05, "Trade network."], [62.05, 66.03, "Trade network means a system of routes and partners for exchanging goods."], [66.65, 68.88, "Funan was part of a vast trade network."], [69.48, 72.67, "Your turn. Say: Trade network."], [75.53, 77.07, "Trade network."], [77.82, 79.21, "Cultural exchange."], [80.22, 84.86, "Cultural exchange means the sharing of ideas, art and customs between cultures."], [85.45, 88.61, "Cultural exchange brought Sanskrit to Southeast Asia."], [89.22, 92.14, "Your turn. Say: Cultural exchange."], [95.0, 96.49, "Cultural exchange."], [97.25, 98.46, "World system."], [99.45, 103.96, "World system means an economic system linking regions into core and periphery."], [104.55, 107.98, "World-system theory explains unequal trade."], [108.58, 111.13, "Your turn. Say: World system."], [113.97, 115.33, "World system."], [116.08, 117.06, "Empire."], [118.05, 121.69, "Empire means a group of territories ruled by a single power."], [122.28, 125.08, "The Mongol empire connected Asia and Europe."], [125.68, 128.09, "Your turn. Say: Empire."], [130.93, 131.84, "Empire."], [132.58, 133.78, "Transnational."], [134.78, 138.63, "Transnational means extending across national borders."], [139.22, 141.81, "Buddhism is a transnational religion."], [142.42, 145.13, "Your turn. Say: Transnational."], [147.97, 149.26, "Transnational."], [150.02, 151.25, "Interdependence."], [152.25, 155.74, "Interdependence means mutual reliance between countries."], [156.35, 158.91, "Economic interdependence can discourage war."], [159.52, 162.59, "Your turn. Say: Interdependence."], [165.43, 166.69, "Interdependence."], [167.5, 171.46, "Part two: dialogue. Let's listen to a conversation."], [172.32, 177.62, "Visal, why should Cambodian students study global history, not just Khmer history?"], [178.72, 189.33, "Because our own story makes sense only beyond a single nation's borders. Funan, for example, traded with India, China and even the Roman world."], [190.45, 191.78, "How do we know that?"], [192.88, 202.86, "Roman coins were found at Oc Eo. That evidence points beyond local politics, towards a trade network stretching across the Indian Ocean."], [203.95, 206.03, "And what spread along those routes?"], [207.12, 218.14, "Far more than goods: Hinduism, Buddhism and Sanskrit came through cultural exchange. Global history looks beyond borders to those connections."], [219.3, 220.65, "Part three: grammar."], [221.48, 224.33, "Grammar focus: Beyond plus noun phrase."], [224.63, 225.78, "Look at the pattern."], [226.48, 229.82, "Global history looks beyond a single nation's story."], [230.72, 233.38, "The evidence points beyond local politics."], [234.28, 237.86, "Its influence extended far beyond the borders of the empire."], [238.8, 248.05, "'Beyond' + noun phrase means 'further than' a limit: beyond borders, beyond doubt, beyond our control. Intensify it with 'far' or 'well': 'far beyond the region'."], [248.78, 252.96, "Be careful! Don't say: Global history looks beyond of one nation."], [254.9, 258.36, "Say: Global history looks beyond one nation."], [258.66, 260.16, "'Beyond' needs no 'of'."], [260.97, 263.49, "Part four: reading. Read and listen."], [264.3, 265.72, "Connected Pasts."], [266.02, 271.33, "Global history challenges the assumption that the nation-state is the natural unit for studying the past."], [272.33, 277.99, "Instead, it looks beyond borders to the trade networks, migrations and ideas that linked distant societies."], [279.0, 285.67, "Long before modern globalization, the Indian Ocean connected East Africa, Arabia, India and Southeast Asia."], [286.67, 292.73, "The spread of Buddhism, for example, can only be understood by tracing exchanges across many regions."], [293.73, 300.34, "By highlighting interdependence, global history shows that no society has ever developed in complete isolation."], [301.43, 305.57, "Part five: quiz. Five questions. Are you ready?"], [306.42, 309.23, "The temple's influence reached far blank Cambodia."], [309.53, 313.1, "A, beyond. B, beyond of. C, above of."], [316.67, 318.43, "The answer is A: beyond."], [319.58, 321.35, "Choose the correct sentence."], [321.65, 328.9, "A, The problem is beyond of our control.. B, The problem is beyond our control.. C, The problem beyond is our control.."], [332.47, 336.07, "The answer is B: The problem is beyond our control.."], [337.22, 340.59, "The sharing of ideas and customs between cultures is blank."], [340.89, 345.31, "A, world system. B, cultural exchange. C, empire."], [348.87, 351.76, "The answer is B: cultural exchange."], [352.92, 355.5, "Mutual reliance between countries is blank."], [355.8, 360.91, "A, interdependence. B, transnational. C, globalization."], [364.47, 367.28, "The answer is A: interdependence."], [368.42, 372.25, "According to the reading, global history shows that no society…"], [372.55, 377.96, "A, has used trade. B, developed in complete isolation. C, had borders."], [381.5, 384.75, "The answer is B: developed in complete isolation."], [385.97, 388.79, "Part six: speaking. It's your turn to talk."], [389.65, 393.39, "What is one example of cultural exchange that shaped world history?"], [410.18, 412.04, "Now listen to Visal."], [412.34, 452.06, "One example of cultural exchange that shaped world history is the spread of Buddhism from India across Asia. Carried by monks and merchants, it influenced art, philosophy and politics far beyond its place of origin. In Cambodia, it eventually became the dominant religion and shaped our values, festivals and architecture. Some historians stress that such exchanges were often unequal or connected with power. Even so, I think this example shows how ideas can travel and transform entire civilizations."], [452.36, 454.06, "Excellent answer, Visal!"], [454.95, 459.54, "Great work! Now you can use eight new words and beyond plus noun phrase."], [459.84, 465.23, "Today's value is global awareness. Remember that every story is connected to the wider world."], [465.53, 468.24, "See you in Unit eighteen. Goodbye!"], [468.54, 471.71, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C1B3-Unit18-Public-History": [[0.35, 5.36, "Hello, everyone! I'm Ms. Emma. Welcome to Online C one, Book three."], [5.66, 9.31, "Hi! I'm Visal. Let's learn together!"], [9.62, 15.56, "Unit eighteen: Public History. Today you will state general truths about heritage with the present simple."], [15.87, 18.4, "Here is our lesson map. Let's start!"], [19.37, 22.44, "Part one: words. You will learn eight new words."], [23.28, 24.53, "Public history."], [25.52, 29.23, "Public history means history presented to and with the general public."], [29.85, 33.57, "Public history happens in museums, films and festivals."], [34.18, 36.86, "Your turn. Say: Public history."], [39.7, 40.86, "Public history."], [41.62, 42.65, "Museum."], [43.65, 47.83, "Museum means a building where historical or cultural objects are displayed."], [48.42, 51.21, "The National Museum displays Angkor sculpture."], [51.82, 54.13, "Your turn. Say: Museum."], [56.97, 57.91, "Museum."], [58.65, 59.81, "Heritage site."], [60.82, 64.31, "Heritage site means a place of historical or cultural importance."], [64.92, 67.23, "Preah Vihear is a World Heritage site."], [67.82, 70.77, "Your turn. Say: Heritage site."], [73.63, 75.05, "Heritage site."], [75.82, 77.22, "Interpretation."], [78.22, 82.25, "Interpretation means explaining the meaning of exhibits to visitors."], [82.85, 85.81, "Good interpretation tells a story, not just facts."], [86.42, 89.02, "Your turn. Say: Interpretation."], [91.87, 93.2, "Interpretation."], [93.95, 95.39, "Accessibility."], [96.38, 99.61, "Accessibility means ease of access for all people."], [100.22, 103.26, "Ramps improved accessibility for wheelchair users."], [103.85, 106.72, "Your turn. Say: Accessibility."], [109.57, 111.04, "Accessibility."], [111.78, 113.33, "Community engagement."], [114.32, 117.84, "Community engagement means involving local people in a project."], [118.45, 121.04, "Community engagement shaped the exhibition."], [121.65, 125.31, "Your turn. Say: Community engagement."], [128.17, 129.79, "Community engagement."], [130.55, 131.52, "Curation."], [132.52, 136.09, "Curation means selecting and organising items for display."], [136.68, 139.12, "Curation involves difficult choices."], [139.72, 142.03, "Your turn. Say: Curation."], [144.87, 145.9, "Curation."], [146.65, 147.67, "Outreach."], [148.68, 151.77, "Outreach means programmes that take a service to people."], [152.38, 155.18, "The museum's outreach visits rural schools."], [155.78, 158.46, "Your turn. Say: Outreach."], [161.3, 162.09, "Outreach."], [162.9, 166.45, "Part two: dialogue. Let's listen to a conversation."], [167.28, 172.15, "Visal, why does public history matter, if academic historians already write books?"], [173.25, 182.8, "Because most people never read academic books. Museums make history accessible to everyone, and heritage sites connect people to their past."], [183.88, 185.81, "Does every museum tell the truth?"], [186.92, 198.74, "Not always. Curation involves choices: every exhibition highlights some stories and leaves others out, so good museums explain their interpretation."], [199.85, 201.88, "How can communities take part?"], [202.98, 212.37, "Local people know things archives don't. When a museum includes them, visitors learn more and communities feel ownership of their heritage."], [213.53, 215.27, "Part three: grammar."], [216.12, 219.57, "Grammar focus: Present simple for general truths."], [219.87, 221.1, "Look at the pattern."], [221.82, 224.37, "Museums make history accessible to everyone."], [225.28, 228.69, "Every exhibition highlights some stories and leaves others out."], [229.58, 232.42, "Heritage sites connect people to their past."], [233.37, 243.24, "Use the present simple for facts, functions and general truths: 'Museums preserve objects.' Remember the -s with singular subjects: 'Curation involves choices'."], [243.98, 248.27, "Be careful! Don't say: Museums makes history accessible."], [250.23, 252.85, "Say: Museums make history accessible."], [253.15, 254.79, "Plural subject: make."], [255.6, 258.02, "Part four: reading. Read and listen."], [258.83, 260.29, "History for Everyone."], [260.59, 265.22, "Public history refers to the many ways in which the past is presented beyond the university."], [266.23, 272.06, "Museums, heritage sites, documentaries and anniversaries shape how most citizens understand their history."], [273.07, 279.2, "Because displays require selection, curation always involves decisions about which stories deserve attention."], [280.2, 286.46, "Increasingly, institutions invite communities to help interpret their own heritage, rather than speaking for them."], [287.47, 293.86, "Effective public history therefore combines scholarly accuracy with accessibility and genuine participation."], [294.97, 299.2, "Part five: quiz. Five questions. Are you ready?"], [300.05, 302.61, "The museum blank free entry on Sundays."], [302.91, 306.22, "A, offer. B, offers. C, is offer."], [309.77, 311.99, "The answer is B: offers."], [313.15, 315.08, "Choose the correct general truth."], [315.38, 322.68, "A, Heritage sites attracts tourists.. B, Heritage sites attract tourists.. C, Heritage sites are attract tourists.."], [326.23, 330.04, "The answer is B: Heritage sites attract tourists.."], [331.18, 334.18, "Selecting and organising items for display is blank."], [334.48, 338.47, "A, outreach. B, accessibility. C, curation."], [342.03, 343.93, "The answer is C: curation."], [345.08, 347.65, "A place of historical importance is a blank."], [347.95, 352.87, "A, heritage site. B, community engagement. C, public history."], [356.43, 359.2, "The answer is A: heritage site."], [360.35, 364.68, "According to the reading, institutions increasingly invite communities to…"], [364.98, 369.74, "A, pay more. B, help interpret their heritage. C, stay away."], [373.3, 376.41, "The answer is B: help interpret their heritage."], [377.6, 380.61, "Part six: speaking. It's your turn to talk."], [381.45, 385.61, "What museum or heritage site has taught you something meaningful about history?"], [402.42, 403.89, "Now listen to Visal."], [404.19, 439.54, "The National Museum of Cambodia taught me something meaningful about the skill of Khmer artists in the Angkor period. Seeing the sculptures closely made me realise how advanced our ancestors' craftsmanship and religious ideas were. The museum also explains how some statues were looted and later returned, which shows that heritage is still connected to present-day justice. Some visitors feel that museums display objects without enough context. Even so, I believe they help young people take pride in their history."], [439.84, 441.5, "Excellent answer, Visal!"], [442.38, 447.45, "Great work! Now you can use eight new words and present simple for general truths."], [447.75, 452.93, "Today's value is public engagement. Share knowledge so that everyone can learn from it."], [453.23, 455.92, "See you in Unit nineteen. Goodbye!"], [456.22, 459.48, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C1B3-Unit19-Digital-Humanities": [[0.35, 4.97, "Hello, everyone! I'm Ms. Emma. Welcome to Online C one, Book three."], [5.27, 8.55, "Hi! I'm Visal. Let's learn together!"], [8.85, 15.54, "Unit nineteen: Digital Humanities. Today you will discuss future possibilities in research with 'could'."], [15.84, 18.54, "Here is our lesson map. Let's start!"], [19.5, 23.2, "Part one: words. You will learn eight new words."], [24.05, 25.62, "Digital humanities."], [26.62, 31.74, "Digital humanities means the use of digital tools to study history, literature and culture."], [32.35, 35.31, "Digital humanities projects map ancient trade."], [35.92, 39.27, "Your turn. Say: Digital humanities."], [42.1, 43.67, "Digital humanities."], [44.42, 45.99, "Data visualization."], [46.98, 50.95, "Data visualization means presenting data as charts, maps or images."], [51.55, 54.16, "Data visualization revealed hidden patterns."], [54.75, 57.78, "Your turn. Say: Data visualization."], [60.63, 62.17, "Data visualization."], [62.92, 64.05, "Text mining."], [65.05, 69.24, "Text mining means using software to analyse large amounts of text."], [69.85, 73.51, "Text mining traced key words across 10,000 newspapers."], [74.12, 77.08, "Your turn. Say: Text mining."], [79.93, 81.02, "Text mining."], [81.75, 83.23, "Digital archive."], [84.22, 87.44, "Digital archive means a collection of records stored online."], [88.05, 90.92, "A digital archive preserves fragile inscriptions."], [91.52, 94.63, "Your turn. Say: Digital archive."], [97.5, 98.86, "Digital archive."], [99.62, 101.51, "Computational analysis."], [102.52, 107.4, "Computational analysis means analysis performed with computers and algorithms."], [107.98, 110.85, "Computational analysis dated the manuscripts."], [111.45, 115.2, "Your turn. Say: Computational analysis."], [118.07, 119.88, "Computational analysis."], [120.62, 121.53, "Mapping."], [122.52, 126.07, "Mapping means creating maps to display spatial information."], [126.68, 129.12, "Mapping showed the extent of Angkor's suburbs."], [129.72, 132.08, "Your turn. Say: Mapping."], [134.93, 135.88, "Mapping."], [136.62, 137.66, "Metadata."], [138.65, 141.24, "Metadata means data that describes other data."], [141.85, 144.31, "Good metadata makes documents searchable."], [144.92, 147.5, "Your turn. Say: Metadata."], [150.33, 151.42, "Metadata."], [152.15, 153.52, "Accessibility."], [154.52, 158.51, "Accessibility means how easily people can use or reach something."], [159.12, 161.94, "Online archives improve accessibility."], [162.55, 165.35, "Your turn. Say: Accessibility."], [168.2, 169.66, "Accessibility."], [170.47, 174.59, "Part two: dialogue. Let's listen to a conversation."], [175.45, 179.23, "Visal, how has technology changed what we know about Angkor?"], [180.32, 191.92, "Enormously. LiDAR scans revealed a vast urban network hidden under the forest, which shows that digital tools could transform historical research."], [193.02, 195.0, "What else could be done in future?"], [196.12, 204.99, "Text mining could analyse thousands of Khmer inscriptions at once, and mapping could show how temple networks changed over centuries."], [206.08, 207.33, "Are there risks?"], [208.42, 216.99, "Yes. Data could be misread without historical context, and archives could be lost if no one maintains the servers."], [218.13, 219.74, "Part three: grammar."], [220.58, 223.94, "Grammar focus: Future possibility with 'could'."], [224.24, 225.37, "Look at the pattern."], [226.08, 228.95, "Digital tools could transform historical research."], [229.85, 233.29, "Text mining could analyse thousands of inscriptions at once."], [234.18, 237.18, "Archives could be lost if servers are not maintained."], [238.13, 249.22, "'Could' expresses a future or theoretical possibility that is less certain than 'will'. Use 'could be + p.p.' for passive possibilities and add 'potentially' or 'in theory' for extra caution."], [249.98, 254.24, "Be careful! Don't say: Digital tools could transforming research."], [256.2, 259.5, "Say: Digital tools could transform research."], [259.8, 262.17, "After 'could', use the base verb."], [262.97, 265.39, "Part four: reading. Read and listen."], [266.2, 268.05, "History in the Digital Age."], [268.35, 274.92, "Digital humanities applies computational methods to questions traditionally studied by historians and literary scholars."], [275.93, 281.29, "Aerial laser scanning has already transformed our understanding of Angkor's size and population."], [282.3, 288.14, "In the future, machine learning could help to read damaged inscriptions that human experts find illegible."], [289.13, 295.9, "Digital archives could also give students in rural areas access to sources once available only in distant capitals."], [296.9, 302.74, "However, these tools could mislead researchers if numbers are interpreted without careful attention to context."], [303.83, 307.73, "Part five: quiz. Five questions. Are you ready?"], [308.58, 311.49, "AI blank help historians read damaged texts."], [311.79, 315.37, "A, could. B, could to. C, coulds."], [318.93, 320.51, "The answer is A: could."], [321.65, 324.15, "Many records blank lost without backups."], [324.45, 327.65, "A, could be. B, could. C, could being."], [331.2, 333.29, "The answer is A: could be."], [334.45, 337.03, "Data that describes other data is blank."], [337.33, 341.13, "A, text mining. B, metadata. C, mapping."], [344.7, 346.61, "The answer is B: metadata."], [347.75, 350.46, "Presenting data as charts and maps is blank."], [350.76, 355.64, "A, data visualization. B, accessibility. C, digital archive."], [359.2, 362.01, "The answer is A: data visualization."], [363.15, 367.23, "According to the reading, what has transformed understanding of Angkor?"], [367.53, 372.03, "A, aerial laser scanning. B, text mining. C, metadata."], [375.57, 378.34, "The answer is A: aerial laser scanning."], [379.53, 382.45, "Part six: speaking. It's your turn to talk."], [383.32, 386.91, "How might digital tools change the way historians study the past?"], [403.72, 405.11, "Now listen to Visal."], [405.41, 441.49, "Digital tools could let historians examine far more evidence than any person could read alone. Text mining, for example, could reveal patterns across thousands of newspapers or inscriptions in a few hours. In Cambodia, LiDAR scanning has already shown that Angkor was a huge urban network, not just a group of temples. However, some scholars warn that data could be misinterpreted without careful reading. I believe the best results will come when digital methods support, not replace, traditional historical skills."], [441.79, 443.53, "Excellent answer, Visal!"], [444.42, 448.92, "Great work! Now you can use eight new words and future possibility with 'could'."], [449.21, 454.13, "Today's value is innovation. Try new ideas boldly, and learn from every attempt."], [454.43, 456.92, "See you in Unit twenty. Goodbye!"], [457.22, 460.07, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C1B3-Unit20-History-of-Science": [[0.35, 5.38, "Hello, everyone! I'm Ms. Emma. Welcome to Online C one, Book three."], [5.68, 9.34, "Hi! I'm Visal. Let's learn together!"], [9.64, 15.38, "Unit twenty: History of Science. Today you will give background to discoveries with the past perfect."], [15.68, 18.19, "Here is our lesson map. Let's start!"], [19.13, 22.17, "Part one: words. You will learn eight new words."], [23.02, 23.97, "Science."], [24.98, 29.55, "Science means systematic study of the natural world through observation and experiment."], [30.15, 33.38, "Science advanced rapidly in the 17th century."], [33.98, 36.3, "Your turn. Say: Science."], [39.13, 40.26, "Science."], [41.02, 41.98, "Discovery."], [42.98, 45.61, "Discovery means the act of finding something new."], [46.22, 48.83, "The discovery of penicillin saved millions."], [49.42, 51.81, "Your turn. Say: Discovery."], [54.67, 55.76, "Discovery."], [56.52, 57.72, "Revolution."], [58.72, 62.26, "Revolution means a dramatic change in ideas or methods."], [62.85, 65.75, "The Scientific Revolution transformed knowledge."], [66.35, 68.89, "Your turn. Say: Revolution."], [71.73, 72.72, "Revolution."], [73.48, 74.39, "Paradigm."], [75.38, 78.47, "Paradigm means a framework of accepted theories."], [79.08, 81.76, "Copernicus challenged the existing paradigm."], [82.35, 85.07, "Your turn. Say: Paradigm."], [87.93, 88.97, "Paradigm."], [89.72, 90.97, "Experiment."], [91.98, 95.42, "Experiment means a test carried out to check a hypothesis."], [96.02, 98.83, "Galileo's experiments tested falling objects."], [99.42, 102.07, "Your turn. Say: Experiment."], [104.93, 106.03, "Experiment."], [106.78, 107.59, "Theory."], [108.58, 111.28, "Theory means a well-supported explanation."], [111.88, 114.92, "Darwin's theory explained the variety of species."], [115.52, 117.96, "Your turn. Say: Theory."], [120.8, 121.64, "Theory."], [122.38, 123.41, "Instrument."], [124.42, 127.28, "Instrument means a tool for scientific measurement."], [127.8
