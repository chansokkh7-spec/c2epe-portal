8, 130.66, "The telescope was a revolutionary instrument."], [131.25, 133.51, "Your turn. Say: Instrument."], [136.37, 137.26, "Instrument."], [138.02, 139.03, "Knowledge."], [140.02, 143.57, "Knowledge means understanding gained through study or experience."], [144.18, 146.88, "Scientific knowledge is always open to revision."], [147.48, 149.81, "Your turn. Say: Knowledge."], [152.67, 153.68, "Knowledge."], [154.47, 158.51, "Part two: dialogue. Let's listen to a conversation."], [159.35, 163.2, "Visal, did astronomy really begin with Galileo's telescope?"], [164.28, 175.94, "Not at all. Scientists had observed the planets for thousands of years before the telescope was invented, in Babylon, India and China."], [177.05, 179.85, "So what made Galileo's work revolutionary?"], [180.95, 189.99, "Earlier astronomers had assumed that Earth was the centre. Copernicus had already proposed otherwise, and the telescope gave new evidence."], [191.08, 193.34, "Any examples closer to home?"], [194.45, 202.84, "Khmer engineers had designed sophisticated water systems at Angkor long before modern hydrology had developed as a science."], [204.0, 205.87, "Part three: grammar."], [206.72, 209.96, "Grammar focus: Past perfect for background."], [210.26, 211.47, "Look at the pattern."], [212.18, 216.47, "Scientists had observed the planets long before the telescope was invented."], [217.38, 222.43, "Earlier astronomers had assumed Earth was the centre before Galileo published his findings."], [223.32, 228.35, "Khmer engineers had designed complex reservoirs long before hydrology became a science."], [229.3, 239.13, "Use the past perfect (had + p.p.) for an action completed before another past moment. It sets the background for the main past event, which is usually in the past simple."], [239.88, 243.86, "Be careful! Don't say: They had observe the planets before."], [245.8, 248.71, "Say: They had observed the planets before."], [249.0, 251.4, "Past perfect: had + p.p."], [252.2, 254.59, "Part four: reading. Read and listen."], [255.4, 256.81, "Before the Revolution."], [257.11, 263.25, "Histories of science once presented progress as a series of sudden breakthroughs by European geniuses."], [264.27, 270.93, "Yet by the time of the Scientific Revolution, scholars in the Islamic world had already preserved and extended Greek knowledge."], [271.93, 277.53, "Indian mathematicians had developed the decimal system and the concept of zero centuries earlier."], [278.53, 284.34, "When Copernicus proposed a sun-centred system, he had studied the work of many earlier astronomers."], [285.33, 291.9, "Today historians emphasise that scientific knowledge has always been built collectively, across many cultures."], [293.0, 297.06, "Part five: quiz. Five questions. Are you ready?"], [297.92, 302.03, "By 1600, astronomers blank the planets for centuries."], [302.33, 307.15, "A, had observed. B, have observed. C, observed had."], [310.7, 312.73, "The answer is A: had observed."], [313.88, 317.89, "Before Galileo, Copernicus blank a sun-centred model."], [318.19, 322.39, "A, has proposed. B, had proposed. C, proposes."], [325.93, 328.39, "The answer is B: had proposed."], [329.55, 331.96, "A framework of accepted theories is a blank."], [332.26, 336.23, "A, discovery. B, instrument. C, paradigm."], [339.8, 341.92, "The answer is C: paradigm."], [343.05, 345.07, "Which collocation is correct?"], [345.37, 350.52, "A, make up an experiment. B, conduct an experiment. C, take an experiment."], [354.07, 357.04, "The answer is B: conduct an experiment."], [358.18, 361.71, "According to the reading, scientific knowledge has always been…"], [362.01, 367.17, "A, built collectively. B, invented by one genius. C, European only."], [370.7, 373.27, "The answer is A: built collectively."], [374.47, 377.82, "Part six: speaking. It's your turn to talk."], [378.65, 381.89, "Which scientific discovery changed history most?"], [398.68, 400.21, "Now listen to Visal."], [400.51, 435.48, "I think the discovery of germs as the cause of disease changed history more than any other. Before Pasteur and Koch, doctors had believed that illnesses spread through 'bad air', so many treatments were ineffective. Once germ theory was accepted, hygiene, vaccines and antibiotics saved hundreds of millions of lives. Some people would choose electricity or the printing press instead. Those were vital too, but without germ theory, far fewer people would have survived to benefit from them."], [435.78, 437.66, "Excellent answer, Visal!"], [438.55, 443.14, "Great work! Now you can use eight new words and past perfect for background."], [443.44, 447.51, "Today's value is curiosity. Ask questions and find out."], [447.81, 450.32, "See you in Unit twenty-one. Goodbye!"], [450.62, 453.44, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C1B3-Unit21-Environmental-History": [[0.35, 5.23, "Hello, everyone! I'm Ms. Emma. Welcome to Online C one, Book three."], [5.53, 9.57, "Hi! I'm Visal. Let's learn together!"], [9.87, 17.43, "Unit twenty-one: Environmental History. Today you will describe how landscapes have been changed with the present perfect passive."], [17.73, 20.28, "Here is our lesson map. Let's start!"], [21.23, 24.41, "Part one: words. You will learn eight new words."], [25.25, 26.44, "Environment."], [27.45, 31.97, "Environment means the natural world in which people, animals and plants live."], [32.58, 35.16, "Human activity has changed the environment."], [35.75, 38.45, "Your turn. Say: Environment."], [41.3, 42.55, "Environment."], [43.28, 44.24, "Landscape."], [45.25, 48.43, "Landscape means the visible features of an area of land."], [49.05, 51.33, "Rice fields dominate the landscape."], [51.92, 54.56, "Your turn. Say: Landscape."], [57.4, 58.58, "Landscape."], [59.32, 60.67, "Deforestation."], [61.65, 64.35, "Deforestation means the clearing of forests."], [64.95, 68.24, "Deforestation has accelerated since 2000."], [68.85, 71.71, "Your turn. Say: Deforestation." ammar."], [205.35, 208.05, "Grammar focus: Present perfect passive."], [208.35, 209.56, "Look at the pattern."], [210.25, 213.02, "Many forests have been cleared for agriculture."], [213.92, 216.93, "The river's flow has been altered by upstream dams."], [217.82, 220.52, "Landscapes have been shaped by people for millennia."], [221.47, 231.09, "The present perfect passive (has/have been + p.p.) describes changes whose results are visible now, without naming who caused them. Add 'by + agent' when the cause is important."], [231.85, 235.62, "Be careful! Don't say: Many forests have cleared for farms."], [237.57, 240.62, "Say: Many forests have been cleared for farms."], [240.92, 244.09, "Present perfect passive: have been + p.p."], [244.9, 247.69, "Part four: reading. Read and listen."], [248.5, 250.06, "Nature Has a History."], [250.36, 255.84, "Environmental history studies the changing relationship between human societies and the natural world."], [256.83, 261.92, "Landscapes that look natural have often been shaped by centuries of farming, burning and settlement."], [262.93, 269.23, "In the last two centuries, however, the scale of human impact has been multiplied by industrial technology."], [270.23, 276.98, "Across Southeast Asia, large areas of forest have been converted into plantations of rubber, cassava and palm oil."], [277.97, 284.4, "Understanding these long-term changes helps societies design more sustainable ways of using resources."], [285.5, 289.44, "Part five: quiz. Five questions. Are you ready?"], [290.28, 292.99, "Many rivers blank polluted by factories."], [293.29, 296.72, "A, have been. B, have. C, has been."], [300.27, 302.16, "The answer is A: have been."], [303.32, 306.27, "Large areas of forest blank into plantations."], [306.57, 310.67, "A, have been converted. B, have converted. C, has been convert."], [314.23, 316.69, "The answer is A: have been converted."], [317.85, 319.75, "The clearing of forests is blank."], [320.05, 324.37, "A, agriculture. B, deforestation. C, climate."], [327.93, 330.29, "The answer is B: deforestation."], [331.45, 334.46, "Using resources without damaging the future is blank."], [334.76, 339.23, "A, sustainability. B, human impact. C, landscape."], [342.77, 345.32, "The answer is A: sustainability."], [346.48, 350.47, "According to the reading, landscapes that look natural have often been…"], [350.77, 357.01, "A, untouched by humans. B, shaped by centuries of human activity. C, created recently."], [360.57, 364.16, "The answer is B: shaped by centuries of human activity."], [365.37, 368.32, "Part six: speaking. It's your turn to talk."], [369.18, 371.95, "How has your local landscape changed over time?"], [388.75, 390.19, "Now listen to Visal."], [390.49, 425.65, "My local landscape has changed dramatically over the past twenty years. Many rice fields near the edge of the city have been replaced by housing developments, factories and new roads. Several small ponds that used to collect rainwater have been filled in, so some streets now flood more easily. My grandparents say that the area was once surrounded by trees and birds. While development has brought jobs and better transport, I believe more green spaces should have been protected."], [425.95, 427.81, "Excellent answer, Visal!"], [428.72, 433.17, "Great work! Now you can use eight new words and present perfect passive."], [433.47, 437.61, "Today's value is caring for nature. Care for plants, birds and our planet."], [437.91, 440.64, "See you in Unit twenty-two. Goodbye!"], [440.94, 443.81, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C1B3-Unit22-History-of-Medicine": [[0.35, 5.2, "Hello, everyone! I'm Ms. Emma. Welcome to Online C one, Book three."], [5.5, 8.93, "Hi! I'm Visal. Let's learn together!"], [9.23, 15.79, "Unit twenty-two: History of Medicine. Today you will credit medical discoveries with the passive + agent."], [16.09, 18.6, "Here is our lesson map. Let's start!"], [19.53, 22.81, "Part one: words. You will learn eight new words."], [23.65, 24.5, "Medicine."], [25.52, 28.82, "Medicine means the science of treating and preventing disease."], [29.42, 32.51, "Medicine advanced rapidly in the 19th century."], [33.12, 35.48, "Your turn. Say: Medicine."], [38.33, 39.28, "Medicine."], [40.02, 41.08, "Disease."], [42.08, 45.59, "Disease means an illness affecting people, animals or plants."], [46.18, 48.52, "Malaria remains a serious disease."], [49.12, 51.61, "Your turn. Say: Disease."], [54.47, 55.46, "Disease."], [56.22, 57.32, "Epidemic."], [58.32, 61.4, "Epidemic means a rapid spread of disease in a community."], [61.98, 64.48, "A cholera epidemic struck the city."], [65.08, 67.96, "Your turn. Say: Epidemic."], [70.8, 71.8, "Epidemic."], [72.55, 73.47, "Vaccine."], [74.48, 78.17, "Vaccine means a substance that gives immunity against a disease."], [78.75, 81.3, "The vaccine was developed by Edward Jenner."], [81.88, 84.27, "Your turn. Say: Vaccine."], [87.13, 88.32, "Vaccine."], [89.08, 90.0, "Hygiene."], [91.02, 94.56, "Hygiene means practices that keep people clean and healthy."], [95.15, 97.38, "Better hygiene reduced infections."], [97.98, 100.34, "Your turn. Say: Hygiene."], [103.2, 104.06, "Hygiene."], [104.82, 105.88, "Public health."], [106.88, 110.59, "Public health means efforts to protect the health of whole populations."], [111.18, 113.54, "Clean water is a public health priority."], [114.15, 117.19, "Your turn. Say: Public health."], [120.03, 121.09, "Public health."], [121.85, 122.58, "Treatment."], [123.58, 126.2, "Treatment means medical care given to a patient."], [126.78, 129.36, "Artemisinin is the main treatment for malaria."], [129.95, 132.58, "Your turn. Say: Treatment."], [135.43, 136.25, "Treatment."], [136.98, 138.03, "Progress."], [139.02, 141.84, "Progress means development towards a better condition."], [142.45, 145.19, "Progress against polio has been remarkable."], [145.78, 148.57, "Your turn. Say: Progress."], [151.43, 152.48, "Progress."], [153.27, 156.91, "Part two: dialogue. Let's listen to a conversation."], [157.75, 160.86, "Visal, who do we thank for the smallpox vaccine?"], [161.95, 174.83, "The first vaccine was developed by Edward Jenner in 1796, although inoculation had already been practised by healers in Asia and Africa."], [175.92, 178.52, "And how was smallpox finally eliminated?"], [179.62, 189.28, "The disease was eradicated by a global vaccination campaign led by the World Health Organization, completed in 1980."], [190.38, 192.3, "Any Cambodian connection?"], [193.42, 202.99, "Yes. Resistance to malaria drugs was first detected by researchers in western Cambodia, which alerted the world to a dangerous threat."], [204.13, 205.53, "Part three: grammar."], [206.38, 208.92, "Grammar focus: Passive with agent."], [209.22, 210.37, "Look at the pattern."], [211.08, 214.21, "The smallpox vaccine was developed by Edward Jenner."], [215.12, 218.79, "Smallpox was eradicated by a global vaccination campaign."], [219.68, 223.19, "Drug resistance was first detected by researchers in Cambodia."], [224.13, 234.38, "Use 'by + agent' to give credit for a discovery or achievement. Adverbs such as first, later and finally go between 'was' and the past participle: 'was first detected by…'."], [235.12, 239.44, "Be careful! Don't say: The vaccine was developed from Jenner."], [241.4, 244.2, "Say: The vaccine was developed by Jenner."], [244.5, 245.98, "Use 'by' for the agent."], [246.77, 249.3, "Part four: reading. Read and listen."], [250.1, 251.87, "From Miasma to Microbes."], [252.17, 257.89, "For most of history, disease was explained by theories of bad air, imbalance or divine punishment."], [258.9, 264.94, "In the nineteenth century, germ theory was established by scientists such as Louis Pasteur and Robert Koch."], [265.93, 271.5, "Public health was transformed by clean water systems, which dramatically reduced epidemics of cholera."], [272.5, 280.92, "Antibiotics, discovered by Alexander Fleming in 1928, later turned deadly infections into treatable conditions."], [281.93, 288.03, "Yet progress has been uneven, and many diseases are still worsened by poverty and unequal access to care."], [289.13, 293.19, "Part five: quiz. Five questions. Are you ready?"], [294.05, 296.55, "Penicillin blank by Alexander Fleming."], [296.85, 300.99, "A, discovered. B, was discovered. C, has discover."], [304.53, 306.74, "The answer is B: was discovered."], [307.88, 311.15, "The vaccine was developed blank a team of scientists."], [311.45, 314.78, "A, by. B, from. C, with by."], [318.33, 320.24, "The answer is A: by."], [321.38, 324.67, "A rapid spread of disease in a community is an blank."], [324.97, 329.58, "A, epidemic. B, hygiene. C, vaccine."], [333.13, 334.91, "The answer is A: epidemic."], [336.05, 338.06, "Which collocation is correct?"], [338.36, 344.24, "A, eradicate a disease. B, erase up a disease. C, kill out a disease."], [347.8, 350.79, "The answer is A: eradicate a disease."], [351.95, 355.33, "According to the reading, how was public health transformed?"], [355.63, 360.54, "A, by clean water systems. B, by bad air. C, by divine punishment."], [364.1, 366.75, "The answer is A: by clean water systems."], [367.93, 371.06, "Part six: speaking. It's your turn to talk."], [371.92, 374.95, "Which medical advance do you consider most important?"], [391.75, 393.23, "Now listen to Visal."], [393.53, 430.68, "I consider vaccination the most important medical advance in history. The first vaccine was developed by Edward Jenner, and since then diseases such as smallpox and polio have been almost completely defeated. In Cambodia, vaccination programmes have greatly reduced child deaths over the past thirty years. Others might argue that antibiotics are more important, since they cure so many infections. However, prevention is better than cure, and vaccines protect whole communities at a very low cost."], [430.98, 432.7, "Excellent answer, Visal!"], [433.62, 437.48, "Great work! Now you can use eight new words and passive with agent."], [437.78, 442.01, "Today's value is gratitude. Say thank you for your home and family."], [442.31, 446.02, "See you in Unit twenty-three. Goodbye!"], [446.32, 449.38, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C1B3-Unit23-Maritime-Trade-Routes": [[0.35, 5.01, "Hello, everyone! I'm Ms. Emma. Welcome to Online C one, Book three."], [5.31, 8.89, "Hi! I'm Visal. Let's learn together!"], [9.19, 16.8, "Unit twenty-three: Maritime Trade Routes. Today you will emphasise double effects with 'not only … but also'."], [17.09, 19.67, "Here is our lesson map. Let's start!"], [20.6, 23.73, "Part one: words. You will learn eight new words."], [24.58, 25.36, "Trade."], [26.35, 28.64, "Trade means the buying and selling of goods."], [29.25, 31.71, "Trade connected distant civilizations."], [32.32, 34.85, "Your turn. Say: Trade."], [37.7, 38.48, "Trade."], [39.22, 40.44, "Maritime."], [41.45, 43.65, "Maritime means connected with the sea."], [44.25, 46.66, "Maritime routes linked India and China."], [47.25, 50.19, "Your turn. Say: Maritime."], [53.03, 54.08, "Maritime."], [54.82, 55.53, "Port."], [56.52, 59.29, "Port means a town where ships load and unload."], [59.88, 62.35, "Oc Eo was an important ancient port."], [62.95, 65.31, "Your turn. Say: Port."], [68.17, 68.88, "Port."], [69.62, 70.68, "Spices."], [71.68, 75.13, "Spices means dried plant products used to flavour food."], [75.75, 77.76, "Spices were worth more than gold."], [78.35, 81.53, "Your turn. Say: Spices."], [84.37, 85.45, "Spices."], [86.18, 87.06, "Silk."], [88.05, 91.76, "Silk means a fine, smooth fabric made by silkworms."], [92.35, 94.97, "Chinese silk was traded across the ocean."], [95.55, 97.95, "Your turn. Say: Silk."], [100.8, 101.64, "Silk."], [102.38, 103.37, "Merchant."], [104.38, 107.14, "Merchant means a person who buys and sells goods."], [107.75, 110.68, "Arab merchants sailed with the monsoon winds."], [111.28, 113.6, "Your turn. Say: y … but also …'."], [247.63, 250.05, "Part four: reading. Read and listen."], [250.87, 252.08, "Highways of the Sea."], [252.38, 258.79, "For more than two thousand years, maritime routes linked the Mediterranean, the Indian Ocean and the South China Sea."], [259.8, 266.18, "These routes carried not only luxury goods, such as silk and spices, but also religions, languages and technologies."], [267.17, 272.48, "Ports in Southeast Asia became wealthy because ships had to wait there for the monsoon winds to change."], [273.47, 278.53, "Not only did these ports grow rich, but they also became meeting places for diverse communities."], [279.53, 285.17, "Maritime trade therefore helped to create the cultural diversity that still characterises the region today."], [286.27, 290.55, "Part five: quiz. Five questions. Are you ready?"], [291.38, 294.22, "Trade brought not only spices blank new religions."], [294.52, 298.17, "A, and also. B, but also. C, or also."], [301.73, 303.8, "The answer is B: but also."], [304.95, 307.98, "Not only blank wealth, but it also spread ideas."], [308.28, 312.6, "A, trade brought. B, did trade bring. C, trade did bring."], [316.13, 318.16, "The answer is B: did trade bring."], [319.32, 321.9, "A town where ships load and unload is a blank."], [322.2, 325.47, "A, merchant. B, port. C, network."], [329.03, 330.53, "The answer is B: port."], [331.68, 333.6, "Connected with the sea means blank."], [333.9, 337.92, "A, maritime. B, silk. C, exchange."], [341.47, 343.51, "The answer is A: maritime."], [344.65, 348.68, "According to the reading, why did Southeast Asian ports become wealthy?"], [348.98, 354.91, "A, ships waited there for the monsoon. B, they produced silk. C, they had no merchants."], [358.47, 361.87, "The answer is A: ships waited there for the monsoon."], [363.07, 366.43, "Part six: speaking. It's your turn to talk."], [367.28, 369.81, "How did trade spread culture as well as goods?"], [386.62, 388.21, "Now listen to Visal."], [388.51, 424.35, "Trade spread culture because merchants did not only carry products; they also brought their languages, beliefs and customs. When traders stayed in a port for months, waiting for the monsoon, they married local people, built temples and exchanged ideas. In early Cambodia, for example, contact with Indian merchants introduced Sanskrit, Hinduism and new styles of art. Some historians stress that local rulers chose which ideas to adopt. I agree, which shows that cultural exchange was active, not passive."], [424.65, 426.28, "Excellent answer, Visal!"], [427.18, 431.43, "Great work! Now you can use eight new words and not only but also."], [431.73, 437.29, "Today's value is cultural appreciation. Enjoy and respect the music and art of every culture."], [437.59, 440.5, "See you in Unit twenty-four. Goodbye!"], [440.8, 443.55, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C1B3-Unit24-Nationalism": [[0.35, 5.18, "Hello, everyone! I'm Ms. Emma. Welcome to Online C one, Book three."], [5.48, 8.83, "Hi! I'm Visal. Let's learn together!"], [9.13, 15.36, "Unit twenty-four: Nationalism. Today you will define political processes formally with 'whereby'."], [15.66, 18.21, "Here is our lesson map. Let's start!"], [19.17, 22.19, "Part one: words. You will learn eight new words."], [23.05, 24.33, "Nationalism."], [25.32, 29.93, "Nationalism means loyalty to one's nation and the belief that it should govern itself."], [30.52, 33.79, "Nationalism inspired many independence movements."], [34.38, 37.29, "Your turn. Say: Nationalism."], [40.13, 41.34, "Nationalism."], [42.08, 42.86, "Nation."], [43.85, 48.03, "Nation means a large group sharing culture, history and often language."], [48.62, 50.83, "A nation is not the same as a state."], [51.42, 53.59, "Your turn. Say: Nation."], [56.43, 57.28, "Nation."], [58.05, 59.23, "Identity."], [60.22, 63.08, "Identity means a shared sense of who a group is."], [63.68, 66.28, "Language is central to national identity."], [66.88, 69.27, "Your turn. Say: Identity."], [72.13, 73.13, "Identity."], [73.88, 74.97, "Sovereignty."], [75.95, 79.01, "Sovereignty means the right of a state to govern itself."], [79.62, 82.0, "Nationalists demanded full sovereignty."], [82.58, 85.31, "Your turn. Say: Sovereignty."], [88.17, 89.25, "Sovereignty."], [89.98, 90.87, "Symbol."], [91.88, 95.41, "Symbol means an object or image that represents an idea."], [96.02, 98.11, "Angkor Wat is a national symbol."], [98.72, 101.27, "Your turn. Say: Symbol."], [104.1, 105.18, "Symbol."], [105.92, 107.16, "Independence."], [108.15, 110.97, "Independence means freedom from foreign rule."], [111.58, 114.78, "Independence was declared in 1953."], [115.38, 118.36, "Your turn. Say: Independence."], [121.2, 122.48, "Independence."], [123.22, 124.11, "Unity."], [125.12, 127.53, "Unity means the state of being joined together."], [128.15, 130.27, "The leader called for national unity."], [130.85, 133.39, "Your turn. Say: Unity."], [136.23, 137.05, "Unity."], [137.78, 138.63, "Movement."], [139.65, 142.88, "Movement means a group working together for a shared cause."], [143.48, 146.07, "The nationalist movement began among students."], [146.68, 148.85, "Your turn. Say: Movement."], [151.7, 152.54, "Movement."], [153.33, 157.17, "Part two: dialogue. Let's listen to a conversation."], [158.02, 161.07, "Visal, how would you define nationalism in your essay?"], [162.18, 169.66, "As a process whereby people come to identify with a nation and believe it should govern itself."], [170.75, 173.0, "How did that process happen in Cambodia?"], [174.12, 185.93, "Partly through newspapers like Nagaravatta in the 1930s, a channel whereby educated Khmers spread ideas about national identity and independence."], [187.02, 189.29, "Is nationalism always positive?"], [190.38, 201.08, "No. It can unite people against colonial rule, but it can also become a system whereby minorities are excluded or neighbours are treated as enemies."], [202.23, 203.9, "Part three: grammar."], [204.75, 207.44, "Grammar focus: Relative clauses with whereby."], [207.74, 208.86, "Look at the pattern."], [209.55, 213.62, "Nationalism is a process whereby people identify with a nation."], [214.52, 218.25, "Newspapers were a channel whereby ideas of independence spread."], [219.15, 221.99, "It can become a system whereby minorities are excluded."], [222.93, 231.89, "'Whereby' (= by which / through which) is a formal relative word used after nouns such as process, system, arrangement or method. It is followed by a full clause."], [232.65, 237.21, "Be careful! Don't say: a process whereby people identifies"], [239.17, 242.37, "Say: a process whereby people identify"], [242.67, 244.86, "Plural subject: identify."], [245.67, 248.35, "Part four: reading. Read and listen."], [249.17, 250.69, "Imagined Communities."], [250.99, 255.75, "The political scientist Benedict Anderson described nations as 'imagined communities'."], [256.77, 262.46, "He meant that nationalism is a process whereby millions of strangers come to feel a deep bond with one another."], [263.47, 268.68, "Print media, schools and shared symbols provide the means whereby this sense of belonging is created."], [269.67, 275.39, "In colonised societies, nationalism became a powerful force for unity and the struggle for independence."], [276.4, 282.17, "However, the same mechanism whereby a nation is united can also be used to exclude those defined as outsiders."], [283.27, 287.22, "Part five: quiz. Five questions. Are you ready?"], [288.08, 291.02, "It is a system blank citizens elect their leaders."], [291.32, 295.15, "A, whereby. B, whereas. C, wherever."], [298.7, 300.65, "The answer is A: whereby."], [301.82, 303.67, "Choose the correct sentence."], [303.96, 312.23, "A, a process whereby people identifies. B, a process whereby people identify. C, a process whereby identify people."], [315.77, 319.38, "The answer is B: a process whereby people identify."], [320.52, 323.9, "An object or image that represents an idea is a blank."], [324.2, 327.53, "A, movement. B, symbol. C, unity."], [331.07, 333.0, "The answer is B: symbol."], [334.15, 336.66, "The right of a state to govern itself is blank."], [336.96, 340.72, "A, sovereignty. B, identity. C, nation."], [344.27, 346.53, "The answer is A: sovereignty."], [347.68, 351.13, "According to the reading, what provides the means of creating belonging?"], [351.43, 356.68, "A, print media, schools and symbols. B, trade routes. C, armies only."], [360.23, 363.5, "The answer is A: print media, schools and symbols."], [364.7, 368.07, "Part six: speaking. It's your turn to talk."], [368.92, 372.52, "How can national identity unite or divide people?"], [389.32, 390.72, "Now listen to Visal."], [391.02, 428.5, "National identity can unite people through shared symbols, history and goals, especially during independence struggles. In Cambodia, Angkor Wat and the Khmer language became symbols whereby people from different regions felt part of one nation. However, national identity can also divide, if it is defined in a way that excludes minorities or encourages hostility towards neighbours. I believe an inclusive national identity, based on shared values rather than ethnicity, is the healthiest form."], [428.8, 430.39, "Excellent answer, Visal!"], [431.28, 435.96, "Great work! Now you can use eight new words and relative clauses with whereby."], [436.26, 440.36, "Today's value is love of country. Love and take care of Cambodia."], [440.66, 443.46, "See you in Unit twenty-five. Goodbye!"], [443.76, 447.24, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C1B3-Unit25-Decolonisation": [[0.35, 5.48, "Hello, everyone! I'm Ms. Emma. Welcome to Online C one, Book three."], [5.78, 9.83, "Hi! I'm Visal. Let's learn together!"], [10.13, 17.4, "Unit twenty-five: Decolonisation. Today you will sequence historical events with perfect participle clauses."], [17.7, 20.28, "Here is our lesson map. Let's start!"], [21.23, 24.25, "Part one: words. You will learn eight new words."], [25.08, 26.48, "Decolonisation."], [27.48, 31.38, "Decolonisation means the process of colonies becoming independent."], [31.98, 35.6, "Decolonisation accelerated after 1945."], [36.18, 38.69, "Your turn. Say: Decolonisation."], [41.53, 42.85, "Decolonisation."], [43.58, 44.42, "Colony."], [45.42, 48.47, "Colony means a territory controlled by another country."], [49.08, 51.56, "Cambodia was a French colony in practice."], [52.15, 54.27, "Your turn. Say: Colony."], [57.13, 58.06, "Colony."], [58.82, 60.04, "Independence."], [61.05, 64.77, "Independence means self-government free from foreign control."], [65.38, 67.89, "Independence brought new responsibilities."], [68.48, 71.43, "Your turn. Say: Independence."], [74.27, 75.5, "Independence."], [76.25, 77.32, "Empire."], [78.32, 81.58, "Empire means a group of territories ruled by one power."], [82.18, 84.94, "The British empire was the largest in history."], [85.55, 88.33, "Your turn. Say: Empire."], [91.17, 92.24, "Empire."], [92.98, 94.45, "Self-determination."], [95.45, 98.99, "Self-determination means a people's right to choose their own government."], [99.58, 102.17, "The UN Charter recognised self-determination."], [102.78, 105.71, "Your turn. Say: Self-determination."], [108.57, 110.15, "Self-determination."], [110.88, 111.86, "Legacy."], [112.85, 115.73, "Legacy means something left behind from the past."], [116.32, 119.29, "Colonial legacies shaped new constitutions."], [119.88, 122.27, "Your turn. Say: Legacy."], [125.13, 126.28, "Legacy."], [127.05, 128.45, "Nation-building."], [129.45, 133.53, "Nation-building means creating institutions and identity for a new state."], [134.12, 136.85, "Nation-building required schools and roads."], [137.45, 140.03, "Your turn. Say: Nation-building."], [142.87, 144.91, "Nation-building."], [145.65, 146.78, "Sovereignty."], [147.78, 151.28, "Sovereignty means supreme authority over one's own territory."], [151.88, 155.09, "Sovereignty was restored in 1953."], [155.68, 158.21, "Your turn. Say: Sovereignty."], [161.07, 162.25, "Sovereignty."], [163.07, 166.69, "Part two: dialogue. Let's listen to a conversation."], [167.55, 173.23, "Visal, what happened after Cambodia gained independence in 1953?"], [174.32, 185.99, "Having gained independence, the new government began nation-building: building schools, universities and a national identity."], [187.08, 188.8, "Was it an easy transition?"], [189.92, 200.35, "Far from it. Having inherited borders and institutions designed for colonial rule, many new states struggled to govern effectively."], [201.45, 202.86, "And internationally?"], [203.95, 213.65, "Having been drawn into the Cold War, several former colonies faced pressure from both superpowers, which made genuine sovereignty difficult."], [214.8, 216.74, "Part three: grammar."], [217.58, 220.66, "Grammar focus: Participle clauses of time."], [220.96, 222.15, "Look at the pattern."], [222.85, 226.22, "Having gained independence, many nations began nation-building."], [227.12, 231.59, "Having inherited colonial institutions, new states struggled to govern."], [232.48, 236.47, "Having been drawn into the Cold War, former colonies faced pressure."], [237.43, 249.85, "'Having + p.p.' shows that one action was completed before the next; 'Having been + p.p.' is the passive form. The subject of both clauses must be the same: 'Having gained independence, the nation…'."], [250.62, 254.16, "Be careful! Don't say: Having gain independence, …"], [256.1, 258.75, "Say: Having gained independence, …"], [259.05, 260.93, "Having + past participle."], [261.73, 264.2, "Part four: reading. Read and listen."], [265.0, 266.42, "The End of Empires."], [266.72, 274.26, "Between 1945 and 1975, more than eighty former colonies became independent states."], [275.27, 281.62, "Having been weakened by the Second World War, European powers found it increasingly difficult to maintain their empires."], [282.63, 289.09, "Some territories gained independence through negotiation, while others achieved it only after long and violent wars."], [290.1, 296.34, "Having won sovereignty, new governments faced the enormous challenge of building national institutions and economies."], [297.33, 303.43, "Decolonisation thus transformed the map of the world, but its economic and political legacies remain contested."], [304.53, 308.45, "Part five: quiz. Five questions. Are you ready?"], [309.32, 312.47, "blank independence, the country wrote a constitution."], [312.77, 316.52, "A, Having gained. B, Having gain. C, Have gained."], [320.07, 322.16, "The answer is A: Having gained."], [323.32, 325.94, "blank by the war, the empire could not resist."], [326.24, 330.72, "A, Having weakened. B, Having been weakened. C, Been having weakened."], [334.27, 336.82, "The answer is B: Having been weakened."], [337.98, 340.53, "A people's right to choose their government is blank."], [340.83, 344.91, "A, self-determination. B, colony. C, legacy."], [348.47, 350.86, "The answer is A: self-determination."], [352.02, 355.78, "Creating institutions and identity for a new state is blank."], [356.08, 360.44, "A, decolonisation. B, nation-building. C, empire."], [364.0, 366.65, "The answer is B: nation-building."], [367.78, 375.84, "According to the reading, how many colonies became independent between 1945 and 1975?"], [376.14, 380.24, "A, about twenty. B, more than eighty. C, fewer than ten."], [383.8, 385.78, "The answer is B: more than eighty."], [386.97, 390.11, "Part six: speaking. It's your turn to talk."], [390.95, 394.13, "What challenges did newly independent nations face?"], [410.95, 412.52, "Now listen to Visal."], [412.82, 448.78, "Newly independent nations faced enormous challenges. Having inherited borders and institutions designed for colonial rule, many governments struggled to unite diverse populations and manage weak economies. They also lacked trained teachers, doctors and administrators, because colonial powers had invested little in local education. In addition, the Cold War drew many of them into conflicts they had not chosen, as happened in Cambodia. Their experience shows that independence was only the beginning."], [449.08, 450.69, "Excellent answer, Visal!"], [451.58, 455.99, "Great work! Now you can use eight new words and participle clauses of time."], [456.29, 460.92, "Today's value is perseverance. Keep trying, even when it is hard."], [461.22, 465.09, "See you in Unit twenty-six. Goodbye!"], [465.39, 469.11, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C1B3-Unit26-The-Cold-War": [[0.35, 4.84, "Hello, everyone! I'm Ms. Emma. Welcome to Online C one, Book three."], [5.14, 8.54, "Hi! I'm Visal. Let's learn together!"], [8.84, 15.29, "Unit twenty-six: The Cold War. Today you will make concessions in historical argument with 'although' and 'despite'."], [15.59, 18.29, "Here is our lesson map. Let's start!"], [19.23, 22.7, "Part one: words. You will learn eight new words."], [23.55, 24.45, "Cold War."], [25.45, 33.12, "Cold War means the rivalry between the USA and USSR from 1947 to 1991."], [33.72, 36.63, "The Cold War divided the world into two blocs."], [37.25, 39.8, "Your turn. Say: Cold War."], [42.63, 43.66, "Cold War."], [44.42, 45.48, "Superpower."], [46.48, 50.12, "Superpower means an extremely powerful and influential state."], [50.72, 53.76, "Both superpowers built huge nuclear arsenals."], [54.35, 57.03, "Your turn. Say: Superpower."], [59.87, 61.1, "Superpower."], [61.85, 63.02, "Ideology."], [64.02, 67.08, "Ideology means a system of political ideas."], [67.68, 70.83, "Capitalism and communism were rival ideologies."], [71.42, 74.41, "Your turn. Say: Ideology."], [77.27, 78.44, "Ideology."], [79.18, 80.29, "Arms race."], [81.28, 85.15, "Arms race means competition to build more and better weapons."], [85.75, 88.34, "The arms race cost billions of dollars."], [88.95, 92.11, "Your turn. Say: Arms race."], [94.97, 96.37, "Arms race."], [97.12, 98.16, "Alliance."], [99.15, 102.48, "Alliance means an agreement between countries to support each other."], [103.08, 105.37, "NATO is a military alliance."], [105.98, 108.67, "Your turn. Say: Alliance."], [111.53, 112.6, "Alliance."], [113.35, 114.37, "Proxy war."], [115.38, 119.52, "Proxy war means a war in which superpowers support opposing local sides."], [120.12, 121.98, "Vietnam became a proxy war."], [122.58, 125.29, "Your turn. Say: Proxy war."], [128.13, 129.31, "Proxy war."], [130.05, 131.12, "Diplomacy."], [132.12, 135.83, "Diplomacy means managing international relations by negotiation."], [136.45, 140.6, "Diplomacy prevented a nuclear war in 1962."], [141.18, 144.03, "Your turn. Say: Diplomacy."], [146.87, 147.95, "Diplomacy."], [148.68, 149.65, "Détente."], [150.65, 154.05, "Détente means a period of easing tension between rivals."], [154.65, 158.07, "Détente in the 1970s reduced the risk of war."], [158.65, 161.87, "Your turn. Say: Détente."], [164.73, 165.7, "Détente."], [166.5, 169.94, "Part two: dialogue. Let's listen to a conversation."], [170.78, 175.11, "Visal, people say the Cold War was 'cold'. Was it really peaceful?"], [176.22, 186.35, "Only for the superpowers. Despite the arms race, direct war between the USA and USSR was avoided, but millions died in proxy wars."], [187.45, 189.3, "How was Cambodia affected?"], [190.38, 202.89, "Severely. Although Cambodia tried to stay neutral in the 1960s, it was drawn into the Vietnam War, and US bombing devastated the countryside."], [203.98, 205.8, "What lesson do you take from this?"], [206.88, 215.76, "In spite of their size, small nations' fates were often decided by others' rivalry, so neutrality alone could not guarantee safety."], [216.9, 218.39, "Part three: grammar."], [219.25, 222.46, "Grammar focus: Concession (Although and Despite)."], [222.76, 224.07, "Look at the pattern."], [224.78, 227.55, "Despite the arms race, direct war was avoided."], [228.45, 232.5, "Although Cambodia tried to stay neutral, it was drawn into the war."], [233.42, 236.39, "In spite of détente, tensions remained high."], [237.33, 248.59, "'Although' + clause (subject + verb); 'despite / in spite of' + noun or -ing. Never 'despite of'. To use a clause after 'despite', add 'the fact that': 'Despite the fact that it was neutral, …'."], [249.35, 253.14, "Be careful! Don't say: Despite of the arms race, …"], [255.1, 257.58, "Say: Despite the arms race, …"], [257.88, 259.47, "'Despite' takes no 'of'."], [260.27, 262.9, "Part four: reading. Read and listen."], [263.7, 265.2, "A Global Conflict."], [265.5, 271.2, "The Cold War is often described as a standoff between two superpowers that never fought each other directly."], [272.2, 278.09, "Despite this, the conflict was anything but cold for many countries in Asia, Africa and Latin America."], [279.1, 285.49, "Although the USA and USSR avoided direct confrontation, they supported opposing sides in numerous proxy wars."], [286.5, 293.34, "In Southeast Asia, Cold War rivalry contributed to decades of conflict in Vietnam, Laos and Cambodia."], [294.33, 301.93, "Historians increasingly argue that the Cold War must be understood from the perspective of these countries, not only from Washington and Moscow."], [303.03, 306.85, "Part five: quiz. Five questions. Are you ready?"], [307.68, 310.62, "blank the danger, both sides kept building weapons."], [310.92, 314.87, "A, Although. B, Despite. C, Despite of."], [318.43, 320.49, "The answer is B: Despite."], [321.65, 324.39, "blank it was neutral, the country was bombed."], [324.69, 328.35, "A, Although. B, Despite. C, In spite."], [331.9, 333.67, "The answer is A: Although."], [334.82, 338.53, "A war where superpowers support opposing local sides is a blank."], [338.83, 342.86, "A, détente. B, proxy war. C, alliance."], [346.4, 348.67, "The answer is B: proxy war."], [349.82, 352.36, "A period of easing tension is called blank."], [352.66, 356.97, "A, détente. B, arms race. C, ideology."], [360.5, 362.77, "The answer is A: détente."], [363.92, 367.66, "According to the reading, historians increasingly study the Cold War from…"], [367.96, 374.05, "A, only Washington. B, the perspective of affected countries. C, Moscow alone."], [377.6, 380.96, "The answer is B: the perspective of affected countries."], [382.17, 385.17, "Part six: speaking. It's your turn to talk."], [386.02, 389.18, "How did the Cold War affect countries outside Europe?"], [405.98, 407.5, "Now listen to Visal."], [407.8, 442.23, "The Cold War hit countries outside Europe far harder than Europe itself. Although the superpowers never fought each other directly, they supported rival governments and rebel groups in Asia, Africa and Latin America. Cambodia, for example, was drawn into the Vietnam War despite its official neutrality, and heavy bombing helped destabilise the country. Local causes mattered too, but outside interference clearly made these conflicts longer and more destructive."], [442.53, 444.1, "Excellent answer, Visal!"], [444.98, 449.56, "Great work! Now you can use eight new words and concession (although and despite)."], [449.86, 455.65, "Today's value is global citizenship. We all share one world. Help people near and far."], [455.95, 458.66, "See you in Unit twenty-seven. Goodbye!"], [458.96, 461.65, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C1B3-Unit27-Historical-Fiction-and-Truth": [[0.35, 5.37, "Hello, everyone! I'm Ms. Emma. Welcome to Online C one, Book three."], [5.67, 9.0, "Hi! I'm Visal. Let's learn together!"], [9.3, 16.97, "Unit twenty-seven: Historical Fiction and Truth. Today you will speculate about invention and accuracy with modal perfects."], [17.27, 19.91, "Here is our lesson map. Let's start!"], [20.87, 24.61, "Part one: words. You will learn eight new words."], [25.45, 26.9, "Historical fiction."], [27.92, 32.87, "Historical fiction means novels or films set in the past that mix fact and invention."], [33.45, 36.08, "Historical fiction brings the past to life."], [36.68, 39.78, "Your turn. Say: Historical fiction."], [42.63, 44.03, "Historical fiction."], [44.78, 45.89, "Accuracy."], [46.88, 50.71, "Accuracy means the quality of being correct and precise."], [51.32, 53.56, "Critics questioned the film's accuracy."], [54.15, 56.64, "Your turn. Say: Accuracy."], [59.5, 60.47, "Accuracy."], [61.22, 62.41, "Imagination."], [63.42, 67.36, "Imagination means the ability to create new images and ideas."], [67.95, 70.52, "The author used imagination to fill gaps."], [71.12, 73.72, "Your turn. Say: Imagination."], [76.57, 77.74, "Imagination."], [78.48, 79.46, "Source."], [80.45, 83.74, "Source means a document or object providing information."], [84.35, 86.93, "The novel draws on diaries as its source."], [87.52, 90.0, "Your turn. Say: Source."], [92.83, 93.85, "Source."], [94.58, 95.61, "Narrative."], [96.62, 99.27, "Narrative means a story or account of events."], [99.85, 103.45, "The narrative follows a family in 1975."], [104.05, 106.6, "Your turn. Say: Narrative."], [109.43, 110.24, "Narrative."], [110.98, 112.04, "Anachronism."], [113.05, 116.83, "Anachronism means something placed in the wrong historical period."], [117.42, 120.34, "A wristwatch in an ancient scene is an anachronism."], [120.95, 123.51, "Your turn. Say: Anachronism."], [126.37, 127.44, "Anachronism."], [128.18, 129.65, "Representation."], [130.65, 133.62, "Representation means the way something is portrayed."], [134.22, 137.76, "The representation of villagers felt stereotyped."], [138.35, 141.14, "Your turn. Say: Representation."], [144.0, 145.55, "Representation."], [146.28, 147.07, "Truth."], [148.08, 150.41, "Truth means what is real or actually happened."], [151.02, 153.25, "Fiction can express emotional truth."], [153.85, 156.05, "Your turn. Say: Truth."], [158.9, 159.6, "Truth."], [160.4, 164.04, "Part two: dialogue. Let's listen to a conversation."], [164.88, 171.51, "Visal, you read a novel about the evacuation of Phnom Penh in 1975. How accurate is it?"], [172.62, 181.92, "The main events match historical sources. But the author may have invented this dialogue, since no one could have recorded such private conversations."], [183.02, 185.05, "Does that make the novel dishonest?"], [186.15, 196.33, "Not necessarily. The characters might have spoken differently, but their fear and confusion must have been very similar to what survivors describe."], [197.42, 199.16, "Did you notice any errors?"], [200.25, 209.64, "One anachronism: a character uses a mobile phone expression. The editor should have caught it, though it doesn't change the larger truth."], [210.8, 212.18, "Part three: grammar."], [213.05, 216.25, "Grammar focus: Modal perfect for speculation."], [216.55, 217.87, "Look at the pattern."], [218.58, 220.79, "The author may have invented this dialogue."], [221.68, 224.93, "Their fear must have been very similar to survivors' accounts."], [225.82, 229.18, "No one could have recorded such private conversations."], [230.13, 239.64, "Modal perfects show how certain we are about the past: must have (almost certain), may / might / could have (possible), can't / couldn't have (almost impossible). 'Should have' criticises a past mistake."], [240.38, 244.29, "Be careful! Don't say: The author may invented this dialogue."], [246.23, 249.21, "Say: The author may have invented this dialogue."], [249.51, 252.22, "Speculation: may have + p.p."], [253.0, 255.5, "Part four: reading. Read and listen."], [256.3, 257.76, "Facts and Feelings."], [258.06, 262.72, "Historical fiction occupies an uncertain space between scholarship and storytelling."], [263.73, 268.88, "Novelists often invent dialogue and private thoughts that historians could never have documented."], [269.87, 275.14, "Some critics argue that such inventions may have distorted public understanding of real events."], [276.13, 281.6, "Others respond that fiction can convey the emotional truth of an experience in ways that archives cannot."], [282.6, 288.64, "Careful readers therefore enjoy historical fiction while checking its claims against reliable historical sources."], [289.73, 293.84, "Part five: quiz. Five questions. Are you ready?"], [294.68, 297.35, "The writer blank this scene; there is no record of it."], [297.64, 301.67, "A, may have invented. B, may invented. C, may have invent."], [305.23, 307.75, "The answer is A: may have invented."], [308.92, 312.07, "They blank been terrified; the city was emptied in days."], [312.37, 315.82, "A, must have. B, must. C, should."], [319.37, 321.19, "The answer is A: must have."], [322.35, 325.42, "Something placed in the wrong historical period is an blank."], [325.72, 330.42, "A, accuracy. B, anachronism. C, imagination."], [333.97, 336.41, "The answer is B: anachronism."], [337.55, 339.6, "Which collocation is correct?"], [339.9, 346.4, "A, take liberties with the facts. B, make liberties to the facts. C, do liberties of facts."], [349.97, 353.13, "The answer is A: take liberties with the facts."], [354.28, 356.7, "According to the reading, fiction can convey…"], [357.0, 363.65, "A, only documented facts. B, the emotional truth of an experience. C, nothing reliable."], [367.2, 371.1, "The answer is B: the emotional truth of an experience."], [372.3, 375.64, "Part six: speaking. It's your turn to talk."], [376.48, 378.63, "Can a novel teach us real history?"], [395.45, 397.07, "Now listen to Visal."], [397.37, 432.36, "A novel can teach real history, as long as readers know what is fact and what is invention. A well-researched novel may show what people must have felt, which textbooks often fail to do. For example, novels about the Khmer Rouge period have made younger readers understand their families' suffering more deeply. However, an author may have changed dates or invented characters for dramatic effect. So I think fiction is a good starting point, but it should lead readers to historical sources."], [432.66, 434.46, "Excellent answer, Visal!"], [435.35, 439.93, "Great work! Now you can use eight new words and modal perfect for speculation."], [440.23, 444.3, "Today's value is truthfulness. Tell the truth and check the facts."], [444.6, 447.46, "See you in Unit twenty-eight. Goodbye!"], [447.76, 450.35, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C1B3-Unit28-Southeast-Asian-History": [[0.35, 5.37, "Hello, everyone! I'm Ms. Emma. Welcome to Online C one, Book three."], [5.67, 9.33, "Hi! I'm Visal. Let's learn together!"], [9.63, 16.99, "Unit twenty-eight: Southeast Asian History. Today you will link connected historical points with formal additive connectors."], [17.29, 19.88, "Here is our lesson map. Let's start!"], [20.83, 24.18, "Part one: words. You will learn eight new words."], [25.02, 26.37, "Southeast Asia."], [27.35, 31.51, "Southeast Asia means the region between India, China and Australia."], [32.12, 34.92, "Southeast Asia includes eleven countries."], [35.52, 38.23, "Your turn. Say: Southeast Asia."], [41.07, 42.54, "Southeast Asia."], [43.28, 44.16, "Kingdom."], [45.15, 48.03, "Kingdom means a country ruled by a king or queen."], [48.62, 51.73, "The Khmer kingdom dominated the region for centuries."], [52.32, 54.63, "Your turn. Say: Kingdom."], [57.47, 58.3, "Kingdom."], [59.05, 59.76, "Trade."], [60.75, 63.56, "Trade means the exchange of goods and services."], [64.15, 66.03, "Trade linked the region's ports."], [66.65, 69.16, "Your turn. Say: Trade."], [72.0, 72.8, "Trade."], [73.55, 74.46, "Religion."], [75.45, 78.17, "Religion means a system of faith and worship."], [78.78, 82.2, "Theravada Buddhism spread across mainland Southeast Asia."], [82.78, 85.11, "Your turn. Say: Religion."], [87.97, 89.03, "Religion."], [89.78, 90.66, "Temple."], [91.65, 94.15, "Temple means a building for religious worship."], [94.75, 97.39, "Borobudur and Angkor Wat are famous temples."], [97.98, 100.52, "Your turn. Say: Temple."], [103.37, 104.09, "Temple."], [104.85, 105.68, "Culture."], [106.68, 110.13, "Culture means the customs, arts and beliefs of a group."], [110.75, 113.32, "Rice farming shaped the region's culture."], [113.92, 116.3, "Your turn. Say: Culture."], [119.17, 120.02, "Culture."], [120.78, 121.61, "Region."], [122.62, 125.56, "Region means a large area with shared features."], [126.15, 128.25, "The region shares a monsoon climate."], [128.85, 131.31, "Your turn. Say: Region."], [134.17, 135.06, "Region."], [135.82, 136.77, "Heritage."], [137.78, 141.29, "Heritage means traditions and buildings passed down from the past."], [141.88, 144.22, "ASEAN countries share a rich heritage."], [144.82, 147.46, "Your turn. Say: Heritage."], [150.3, 151.22, "Heritage."], [152.03, 155.81, "Part two: dialogue. Let's listen to a conversation."], [156.65, 162.27, "Visal, what connects the histories of Cambodia, Thailand, Laos, Myanmar and Vietnam?"], [163.38, 174.77, "Several things. Indian influence shaped early kingdoms' religion and writing. Moreover, trade linked the region's kingdoms through rivers and ports."], [175.88, 177.19, "Anything else?"], [178.28, 188.29, "Furthermore, Theravada Buddhism became the main religion in most of the mainland, so temples, festivals and monastic life are remarkably similar."], [189.38, 190.92, "And in the modern period?"], [192.02, 203.67, "Most were colonised, except Thailand. In addition, all experienced nationalist movements, and today ASEAN builds on this shared heritage."], [204.83, 206.66, "Part three: grammar."], [207.52, 211.01, "Grammar focus: Formal linking (Moreover and Furthermore)."], [211.31, 212.54, "Look at the pattern."], [213.25, 218.32, "Indian influence shaped early kingdoms. Moreover, trade linked the region's kingdoms."], [219.22, 224.17, "Rivers connected inland states. Furthermore, Buddhism created shared traditions."], [225.08, 229.49, "Most states were colonised. In addition, all faced nationalist movements."], [230.43, 240.31, "'Moreover', 'furthermore' and 'in addition' add a further, often stronger, point. They begin a new sentence (or follow a semicolon) and are followed by a comma. Avoid them in casual speech."], [241.05, 245.16, "Be careful! Don't say: Moreover trade linked the kingdoms."], [247.1, 249.8, "Say: Moreover, trade linked the kingdoms."], [250.1, 251.91, "Put a comma after 'Moreover'."], [252.7, 255.18, "Part four: reading. Read and listen."], [255.97, 257.73, "A Region of Connections."], [258.03, 263.87, "Southeast Asia has often been described as a crossroads between the civilizations of India and China."], [264.87, 272.81, "Early states such as Funan and Champa adopted Indian scripts, religions and political ideas, adapting them to local traditions."], [273.8, 278.99, "Moreover, river systems such as the Mekong encouraged trade and contact between inland kingdoms."], [280.0, 285.38, "Furthermore, the spread of Theravada Buddhism created shared cultural practices across much of the mainland."], [286.37, 292.67, "In addition, the experience of colonialism and independence continues to shape regional cooperation today."], [293.77, 297.73, "Part five: quiz. Five questions. Are you ready?"], [298.58, 302.77, "Rice is central to the economy. blank, it shapes local festivals."], [303.07, 306.58, "A, Moreover. B, However. C, Although."], [310.13, 312.1, "The answer is A: Moreover."], [313.25, 315.26, "Choose the correct punctuation."], [315.56, 322.29, "A, Furthermore trade grew quickly.. B, Furthermore, trade grew quickly.. C, Furthermore; trade, grew quickly.."], [325.83, 328.55, "The answer is B: Furthermore, trade grew quickly.."], [329.72, 333.16, "Traditions and buildings passed down from the past are blank."], [333.46, 336.63, "A, heritage. B, region. C, kingdom."], [340.17, 342.49, "The answer is A: heritage."], [343.65, 346.61, "Which country in Southeast Asia was never colonised?"], [346.91, 350.6, "A, Cambodia. B, Vietnam. C, Thailand."], [354.17, 356.17, "The answer is C: Thailand."], [357.32, 360.91, "According to the reading, what encouraged contact between inland kingdoms?"], [361.21, 367.17, "A, river systems such as the Mekong. B, colonialism. C, the Indian Ocean only."], [370.73, 374.01, "The answer is A: river systems such as the Mekong."], [375.2, 378.36, "Part six: speaking. It's your turn to talk."], [379.22, 382.38, "What connects the histories of Southeast Asian countries?"], [399.18, 400.69, "Now listen to Visal."], [401.0, 442.21, "Several factors connect Southeast Asian histories. First, many early kingdoms were influenced by Indian religions, writing systems and political ideas. Moreover, trade along rivers and coasts linked communities across the region for centuries. Furthermore, most countries experienced colonial rule and later struggled for independence in similar ways. Each country, of course, also has its own unique story. Nevertheless, I believe these shared experiences provide a strong basis for regional cooperation."], [442.51, 444.22, "Excellent answer, Visal!"], [445.12, 450.19, "Great work! Now you can use eight new words and formal linking (moreover and furthermore)."], [450.5, 455.64, "Today's value is global unity. When the world works together, we all go further."], [455.94, 459.9, "See you in Unit twenty-nine. Goodbye!"], [460.2, 463.27, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C1B3-Unit29-Review-Thinking-Like-a-Historian": [[0.35, 5.56, "Hello, everyone! I'm Ms. Emma. Welcome to Online C one, Book three."], [5.86, 9.4, "Hi! I'm Visal. Let's learn together!"], [9.7, 17.54, "Unit twenty-nine: Review: Thinking Like a Historian. Today you will make careful, evidence-based historical claims with hedging."], [17.84, 20.61, "Here is our lesson map. Let's start!"], [21.57, 24.7, "Part one: words. You will learn eight new words."], [25.55, 26.61, "Source."], [27.62, 31.61, "Source means a document or object that provides evidence about the past."], [32.22, 34.69, "Always identify who created a source."], [35.28, 38.04, "Your turn. Say: Source."], [40.9, 41.91, "Source."], [42.65, 43.48, "Evidence."], [44.48, 47.1, "Evidence means information supporting a claim."], [47.68, 50.39, "The evidence suggests that trade was a key cause."], [50.98, 53.41, "Your turn. Say: Evidence."], [56.27, 57.31, "Evidence."], [58.05, 59.14, "Context."], [60.15, 63.89, "Context means the circumstances around an event or source."], [64.48, 66.98, "Context explains why the law was passed."], [67.58, 69.93, "Your turn. Say: Context."], [72.8, 73.95, "Context."], [74.72, 76.1, "Interpretation."], [77.12, 80.43, "Interpretation means an explanation of what evidence means."], [81.02, 83.49, "Her interpretation was widely accepted."], [84.08, 86.72, "Your turn. Say: Interpretation."], [89.57, 90.93, "Interpretation."], [91.68, 92.58, "Bias."], [93.58, 95.86, "Bias means a one-sided perspective."], [96.45, 98.53, "Every source contains some bias."], [99.12, 101.42, "Your turn. Say: Bias."], [104.27, 105.38, "Bias."], [106.15, 107.27, "Chronology."], [108.28, 111.0, "Chronology means the order in which events happened."], [111.62, 114.21, "A clear chronology helps us see causes."], [114.82, 117.52, "Your turn. Say: Chronology."], [120.37, 121.47, "Chronology."], [122.22, 123.25, "Causation."], [124.25, 128.07, "Causation means the relationship between causes and effects."], [128.68, 131.16, "Causation is rarely due to one factor."], [131.75, 134.26, "Your turn. Say: Causation."], [137.1, 138.21, "Causation."], [138.95, 140.11, "Significance."], [141.12, 144.85, "Significance means importance, especially in its effects."], [145.45, 148.12, "Historians debate the significance of the treaty."], [148.72, 151.5, "Your turn. Say: Significance."], [154.33, 155.73, "Significance."], [156.53, 160.11, "Part two: dialogue. Let's listen to a conversation."], [160.95, 165.09, "Visal, this is our final unit. What does it mean to think like a historian?"], [166.18, 175.24, "It means making careful claims. Instead of 'trade caused the kingdom's growth', I'd write 'the evidence suggests that trade was a key cause'."], [176.35, 177.97, "Why hedge if you're confident?"], [179.05, 189.76, "Because sources are incomplete and biased. It appears likely that several factors interacted, so a single cause would be an oversimplification."], [190.85, 193.57, "And how do historians decide what is significant?"], [194.68, 203.74, "By asking how far an event changed people's lives, how long its effects lasted, and whether it still seems to shape the present."], [204.9, 206.52, "Part three: grammar."], [207.35, 210.6, "Grammar focus: Hedging in historical claims."], [210.9, 212.22, "Look at the pattern."], [212.92, 215.78, "The evidence suggests that trade was a key cause."], [216.68, 219.47, "It appears likely that several factors interacted."], [220.38, 223.46, "The sources seem to indicate that the decline was gradual."], [224.4, 235.54, "Historians hedge to match the strength of the claim to the strength of the evidence: suggests, indicates, appears, seems, it is likely that, arguably. 'Evidence' is uncountable, so use 'suggests'."], [236.28, 240.36, "Be careful! Don't say: The evidence suggest that trade mattered."], [242.3, 245.19, "Say: The evidence suggests that trade mattered."], [245.49, 247.81, "'Evidence' is singular: suggests."], [248.6, 251.16, "Part four: reading. Read and listen."], [251.97, 253.61, "The Historian's Habits."], [253.91, 260.64, "Throughout this course, we have seen that history is not a fixed list of facts but a disciplined argument about evidence."], [261.63, 266.62, "Thinking like a historian means asking who created a source, when, why and for whom."], [267.6, 273.43, "It also means placing events in their context and chronology before judging their causes and significance."], [274.43, 281.34, "Because evidence is always incomplete, careful historians hedge their claims, stating that the evidence suggests rather than proves."], [282.33, 288.45, "These habits are valuable far beyond history, helping citizens to evaluate the claims they meet every day."], [289.57, 293.74, "Part five: quiz. Five questions. Are you ready?"], [294.58, 297.52, "The evidence blank that the city was abandoned slowly."], [297.82, 301.64, "A, suggest. B, suggests. C, suggesting."], [305.2, 307.36, "The answer is B: suggests."], [308.52, 311.01, "Choose the most appropriately hedged claim."], [311.31, 319.16, "A, Trade definitely caused everything.. B, It appears likely that trade was a major factor.. C, Trade is the only cause, obviously.."], [322.7, 327.03, "The answer is B: It appears likely that trade was a major factor.."], [328.18, 330.62, "The order in which events happened is the blank."], [330.92, 334.89, "A, chronology. B, significance. C, context."], [338.43, 340.5, "The answer is A: chronology."], [341.65, 343.53, "Which collocation is correct?"], [343.83, 348.26, "A, draw a conclusion. B, pull a conclusion. C, make up a conclusion."], [351.8, 354.26, "The answer is A: draw a conclusion."], [355.42, 359.3, "According to the reading, why do careful historians hedge their claims?"], [359.6, 366.33, "A, because evidence is always incomplete. B, to sound uncertain. C, because sources are never biased."], [369.87, 373.58, "The answer is A: because evidence is always incomplete."], [374.8, 378.16, "Part six: speaking. It's your turn to talk."], [379.02, 381.58, "How do historians decide what is significant?"], [398.38, 399.83, "Now listen to Visal."], [400.13, 438.63, "Historians judge significance by how deeply an event affected people's lives and how long its consequences lasted. An event that changed the lives of many people, such as independence in 1953, is usually considered highly significant. Historians also ask whether an event reveals something important about the past or still shapes the present. However, significance can change over time, since each generation asks new questions. So the evidence suggests that significance is partly a matter of interpretation."], [438.93, 440.54, "Excellent answer, Visal
