        body { font-family: 'Poppins', sans-serif; }
        /* Flip-card for Listening: front = word, back = picture. */
        .flip-card { perspective: 1000px; height: 100px; cursor: pointer; }
        .flip-card-inner {
            position: relative; width: 100%; height: 100%;
            transition: transform 0.5s; transform-style: preserve-3d;
        }
        .flip-card.flipped .flip-card-inner { transform: rotateY(180deg); }
        .flip-card-front, .flip-card-back {
            position: absolute; width: 100%; height: 100%;
            backface-visibility: hidden; border-radius: 0.75rem;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 0.25rem;
        }
        .flip-card-back { transform: rotateY(180deg); }
        button:disabled { cursor: default; }
        /* phones: the lesson fills the screen, so jumping to it always shows it from the top,
           and the floating "Modules" button never covers the lesson's own buttons */
        @media (max-width: 767px) { #content-area { min-height: calc(100vh - 24px); padding-bottom: 76px; } }

        const curriculum = {
            'Master': {
                1: { title: "Historiography", vocab: ["Primary source", "Historical bias", "Revisionism", "Periodization", "Causation", "Interpretation", "Archival research", "Contextualization", "Archive", "Testimony"], story: "Historiography examines how a primary source can reveal historical bias. Revisionism and periodization depend on causation, interpretation, and careful contextualization through archival research.", question: "Why do historians sometimes interpret the same event differently?", grammar: { point: "Passive with by + agent", example: "History is often reinterpreted by later generations." } },
                2: { title: "Social Psychology", vocab: ["Conformity", "Groupthink", "Cognitive dissonance", "Social influence", "In-group bias", "Attribution error", "Persuasion", "Self-perception", "Heuristic bias", "Norm"], story: "Conformity and groupthink can lead to poor decisions within a group. Cognitive dissonance, in-group bias, and attribution error all shape social influence and self-perception.", question: "How does group pressure influence individual behavior?", grammar: { point: "Passive voice for behavior", example: "Behavior is often shaped by unconscious social influence." } },
                3: { title: "Environmental Ethics", vocab: ["Anthropocentrism", "Intrinsic value", "Ecological footprint", "Intergenerational justice", "Stewardship", "Sustainability ethics", "Conservation ethic", "Moral obligation", "Habitat loss", "Mitigation"], story: "Anthropocentrism assumes nature has value only for humans, while others argue for its intrinsic value. Intergenerational justice and stewardship reflect a moral obligation toward sustainability ethics.", question: "Do humans have a moral obligation to protect the environment?", grammar: { point: "Modal perfect for ethical reflection", example: "We should have adopted a stronger conservation ethic sooner." } },
                4: { title: "International Law", vocab: ["Treaty", "Sovereignty", "Jurisdiction", "International tribunal", "Diplomatic immunity", "Human rights law", "Ratification", "Enforcement mechanism", "Precedent", "Statute"], story: "A treaty must be ratified before it binds a sovereign state, though jurisdiction can be complex. An international tribunal often lacks a strong enforcement mechanism despite diplomatic immunity rules.", question: "Why is international law difficult to enforce?", grammar: { point: "Passive with modals", example: "Treaties must be ratified before they can be enforced." } },
                5: { title: "Technological Determinism", vocab: ["Technological determinism", "Social construction", "Innovation diffusion", "Unintended consequence", "Technological adoption", "Digital disruption", "Path dependency", "Sociotechnical system", "Adoption curve", "Feedback loop"], story: "Technological determinism argues that technology shapes society, while social construction theory argues the opposite. Innovation diffusion often produces an unintended consequence within a complex sociotechnical system.", question: "Does technology shape society, or does society shape technology?", grammar: { point: "Abstract conditional reasoning", example: "Were technology truly deterministic, human choice would matter less." } },
                6: { title: "Colonial History", vocab: ["Colonialism", "Empire", "Exploitation", "Resistance", "Independence", "Legacy", "Indigenous", "Sovereignty"], story: "Colonial history examines how empire-building led to exploitation, and how indigenous resistance eventually secured independence. The legacy of colonialism still shapes questions of sovereignty today.", question: "What lasting legacy of colonialism do you see in the world today?", grammar: { point: "Present perfect for lasting effects", example: "Colonialism has shaped many modern borders." }, value: "Historical Awareness" },
                7: { title: "Revolutionary Movements", vocab: ["Revolution", "Uprising", "Ideology", "Mobilization", "Regime", "Overthrow", "Reform", "Radical change"], story: "Revolutionary movements often begin as a local uprising before an ideology mobilizes wider support. The goal may be to overthrow a regime entirely, or achieve reform through radical change.", question: "What conditions do you think lead people to join a revolutionary movement?", grammar: { point: "Purpose infinitives", example: "People mobilize to overthrow an unjust regime." }, value: "Civic Awareness" },
                8: { title: "Economic History", vocab: ["Industrialization", "Trade route", "Currency", "Market economy", "Recession", "Growth", "Labor", "Capital"], story: "Economic history traces industrialization and the rise of trade routes that reshaped currency and the market economy. Cycles of recession and growth reflect shifting relationships between labor and capital.", question: "How did industrialization change the way people worked?", grammar: { point: "Cause-effect: led to / resulted in", example: "Industrialization led to rapid urban growth." }, value: "Economic Literacy" },
                9: { title: "Social Movements", vocab: ["Social movement", "Grassroots", "Advocacy", "Solidarity", "Collective action", "Reform", "Awareness campaign", "Momentum"], story: "A social movement often starts at the grassroots level, building solidarity through advocacy and collective action. A sustained awareness campaign can build momentum toward lasting reform.", question: "What social movement do you find most inspiring, and why?", grammar: { point: "Gerund phrases as subjects", example: "Building solidarity takes sustained collective action." }, value: "Solidarity" },
                10: { title: "Urban Development", vocab: ["Urbanization", "Infrastructure", "Zoning", "Gentrification", "Public space", "Density", "Planning", "Displacement"], story: "Urban development involves careful zoning and infrastructure planning as urbanization increases density. Gentrification can revitalize public space, but may also cause displacement.", question: "What is one tradeoff between urban development and displacement?", grammar: { point: "Although + contrast", example: "Although gentrification revitalizes an area, it can displace residents." }, value: "Community Awareness" },
                11: { title: "Migration Studies", vocab: ["Migration", "Diaspora", "Push factor", "Pull factor", "Assimilation", "Integration", "Identity", "Border"], story: "Migration studies examine the push and pull factors that shape a diaspora's movement across a border. Assimilation and integration both influence how migrants form new identities.", question: "What push or pull factor might cause someone to migrate?", grammar: { point: "Reason clauses (because of, due to)", example: "People migrate due to economic push factors." }, value: "Empathy" },
                12: { title: "Memory Studies", vocab: ["Collective memory", "Commemoration", "Monument", "Trauma", "Remembrance", "Erasure", "Narrative", "Legacy"], story: "Memory studies explore how collective memory is shaped through commemoration and monuments. Historical trauma and remembrance compete with erasure in shaping a society's narrative legacy.", question: "Why might a society choose to build a monument to remember a difficult event?", grammar: { point: "Purpose clauses (so that)", example: "Monuments are built so that events are not forgotten." }, value: "Remembrance" },
                13: { title: "Oral History", vocab: ["Oral history", "Testimony", "Interview", "Firsthand account", "Memory", "Archive", "Narrator", "Authenticity"], story: "Oral history relies on firsthand testimony, often gathered through interview and preserved in an archive. A narrator's memory brings authenticity, though it requires careful interpretation.", question: "Why might an oral history interview reveal something a written record cannot?", grammar: { point: "Might/may for possibility", example: "An interview may reveal details missing from written records." }, value: "Empathetic Listening" },
                14: { title: "Archival Research", vocab: ["Archive", "Primary source", "Provenance", "Preservation", "Access", "Catalog", "Digitization", "Fragmentary evidence"], story: "Archival research involves locating a primary source and verifying its provenance. Preservation and digitization improve access, even when evidence remains fragmentary.", question: "Why is verifying a source's provenance important in historical research?", grammar: { point: "Passive for verification process", example: "A source's provenance must be carefully verified." }, value: "Meticulousness" },
                15: { title: "Historical Method", vocab: ["Historiography", "Source criticism", "Bias", "Periodization", "Causation", "Interpretation", "Evidence", "Objectivity"], story: "Historical method relies on source criticism to identify bias, and careful periodization to understand causation. True objectivity in interpretation of evidence remains an ongoing challenge.", question: "Can a historian ever be completely objective? Why or why not?", grammar: { point: "Modal + adverb (can never fully, can rarely)", example: "A historian can rarely be completely objective." }, value: "Intellectual Humility" },
                16: { title: "Comparative History", vocab: ["Comparative history", "Cross-national", "Pattern", "Divergence", "Convergence", "Case study", "Generalization", "Context"], story: "Comparative history looks across cross-national case studies to identify patterns of divergence or convergence. Generalization must always be balanced against specific historical context.", question: "What pattern have you noticed across the histories of different countries?", grammar: { point: "Across / throughout prepositions", example: "Patterns emerge across many different national histories." }, value: "Global Perspective" },
                17: { title: "Global History", vocab: ["Globalization", "Interconnection", "Trade network", "Cultural exchange", "World system", "Empire", "Transnational", "Interdependence"], story: "Global history studies the interconnection of trade networks and cultural exchange across a shared world system. Transnational forces reveal deep interdependence beyond any single empire.", question: "What is one example of cultural exchange that shaped world history?", grammar: { point: "Beyond + noun phrase", example: "Global history looks beyond a single nation's story." }, value: "Global Awareness" },
                18: { title: "Public History", vocab: ["Public history", "Museum", "Heritage site", "Interpretation", "Accessibility", "Community engagement", "Curation", "Outreach"], story: "Public history brings the past to life through museums and heritage sites, focused on accessibility and community engagement. Curation and outreach make interpretation meaningful to a broad public.", question: "What museum or heritage site has taught you something meaningful about history?", grammar: { point: "Present simple for general truths", example: "Museums make history accessible to everyone." }, value: "Public Engagement" },
                19: { title: "Digital Humanities", vocab: ["Digital humanities", "Data visualization", "Text mining", "Digital archive", "Computational analysis", "Mapping", "Metadata", "Accessibility"], story: "Digital humanities uses data visualization and text mining to analyze a digital archive at scale. Computational analysis and mapping, supported by careful metadata, improve accessibility for researchers.", question: "How might digital tools change the way historians study the past?", grammar: { point: "Future possibility with 'could'", example: "Digital tools could transform historical research." }, value: "Innovation" },
                20: { title: "History of Science", vocab: ["Science", "Discovery", "Revolution", "Paradigm", "Experiment", "Theory", "Instrument", "Knowledge"], story: "The history of science shows that discovery is rarely sudden. New instruments, experiments and theories can trigger a scientific revolution, replacing one paradigm of knowledge with another.", question: "Which scientific discovery changed history most?", grammar: {"point": "Past perfect for background", "example": "Scientists had observed the planets long before the telescope was invented."} },
                21: { title: "Environmental History", vocab: ["Environment", "Landscape", "Deforestation", "Agriculture", "Climate", "Human impact", "Resource", "Sustainability"], story: "Environmental history studies how human impact has shaped each landscape. Agriculture, deforestation and resource use have changed climate and ecosystems, raising lasting questions of sustainability.", question: "How has your local landscape changed over time?", grammar: {"point": "Present perfect passive", "example": "Many forests have been cleared for agriculture."} },
                22: { title: "History of Medicine", vocab: ["Medicine", "Disease", "Epidemic", "Vaccine", "Hygiene", "Public health", "Treatment", "Progress"], story: "The history of medicine records progress against disease. Improved hygiene, the vaccine and public health measures transformed treatment and reduced the impact of each epidemic.", question: "Which medical advance do you consider most important?", grammar: {"point": "Passive with agent", "example": "The smallpox vaccine was developed by Edward Jenner."} },
                23: { title: "Maritime Trade Routes", vocab: ["Trade", "Maritime", "Port", "Spices", "Silk", "Merchant", "Exchange", "Network"], story: "Maritime trade routes linked ports across Asia, Africa and Europe. Merchants carried spices and silk, and this network encouraged the exchange of ideas as well as goods.", question: "How did trade spread culture as well as goods?", grammar: {"point": "Not only... but also", "example": "Trade spread not only goods but also ideas."} },
                24: { title: "Nationalism", vocab: ["Nationalism", "Nation", "Identity", "Sovereignty", "Symbol", "Independence", "Unity", "Movement"], story: "Nationalism links identity to the nation. Symbols such as flags and anthems build unity, and nationalist movements have driven independence and demands for sovereignty.", question: "How can national identity unite or divide people?", grammar: {"point": "Relative clauses with whereby", "example": "Nationalism is a process whereby people identify with a nation."} },
                25: { title: "Decolonisation", vocab: ["Decolonisation", "Colony", "Independence", "Empire", "Self-determination", "Legacy", "Nation-building", "Sovereignty"], story: "After 1945, decolonisation brought independence to many a colony. Former empires lost power, while new states faced nation-building and the long legacy of colonial rule on the road to self-determination.", question: "What challenges did newly independent nations face?", grammar: {"point": "Participle clauses of time", "example": "Having gained independence, many nations began nation-building."} },
                26: { title: "The Cold War", vocab: ["Cold War", "Superpower", "Ideology", "Arms race", "Alliance", "Proxy war", "Diplomacy", "D\u00e9tente"], story: "The Cold War divided the world between two superpowers and their ideology. The arms race and each proxy war raised tensions, while diplomacy and periods of d\u00e9tente reduced the risk of direct conflict.", question: "How did the Cold War affect countries outside Europe?", grammar: {"point": "Concession (Although / Despite)", "example": "Despite the arms race, direct war was avoided."} },
                27: { title: "Historical Fiction and Truth", vocab: ["Historical fiction", "Accuracy", "Imagination", "Source", "Narrative", "Anachronism", "Representation", "Truth"], story: "Historical fiction blends imagination with sources. Writers balance accuracy with narrative, but anachronism and selective representation can blur the line between fiction and truth.", question: "Can a novel teach us real history?", grammar: {"point": "Modal perfect for speculation", "example": "The author may have invented this dialogue."} },
                28: { title: "Southeast Asian History", vocab: ["Southeast Asia", "Kingdom", "Trade", "Religion", "Temple", "Culture", "Region", "Heritage"], story: "Southeast Asian history includes powerful kingdoms, such as the Khmer Empire, linked by trade and religion. Temples and shared culture across the region remain an important heritage today.", question: "What connects the histories of Southeast Asian countries?", grammar: {"point": "Formal linking (Moreover / Furthermore)", "example": "Moreover, trade linked the region's kingdoms."} },
                29: { title: "Review: Thinking Like a Historian", vocab: ["Source", "Evidence", "Context", "Interpretation", "Bias", "Chronology", "Causation", "Significance"], story: "Thinking like a historian means questioning each source, reading evidence in context and noticing bias. Historians build chronology, explain causation and judge significance.", question: "How do historians decide what is significant?", grammar: {"point": "Hedging in historical claims", "example": "The evidence suggests that trade was a key cause."} },
            }
        };

        const LEVELS_ORDER = ['Master'];

        // ===== Progress: stars/badges are earned once per activity and remembered =====
        // Saved in this browser when the page is opened as a normal web page. Inside the Hub's
        // secure "Embed Code" box the browser blocks storage, so progress then lasts until the
        // page is closed — but it still can't be farmed by tapping the same button again.
        const PROGRESS_KEY = () => 'c2epe_onlineclass_master_C1_3_progress_' + state.level;
        let progress = { stars: 0, badges: 0, awarded: {}, best: {}, completed: {} };
        function loadProgress() {
            progress = { stars: 0, badges: 0, awarded: {}, best: {}, completed: {} };
            try {
                const saved = JSON.parse(localStorage.getItem(PROGRESS_KEY()) || 'null');
                if (saved && typeof saved === 'object') progress = Object.assign(progress, saved);
            } catch (e) { /* storage not available (e.g. inside the Hub sandbox) */ }
            state.stars = progress.stars; state.badges = progress.badges;
            document.getElementById('star-count').textContent = state.stars;
            document.getElementById('badge-count').textContent = state.badges;
        }
        function saveProgress() {
            progress.stars = state.stars; progress.badges = state.badges;
            try { localStorage.setItem(PROGRESS_KEY(), JSON.stringify(progress)); } catch (e) {}
        }
        const unitKey = (what) => 'u' + state.unit + '|' + what;
        const wasAwarded = (key) => !!progress.awarded[state.level + '|' + key];
        // Gives stars only the first time an activity is done. Returns true if stars were given.
        function award(key, amount) {
            const k = state.level + '|' + key;
            if (progress.awarded[k]) return false;
            progress.awarded[k] = true;
            addStars(amount);
            return true;
        }
        // Shows "(+3 ⭐)" the first time, and a friendly note afterwards
        const starNote = (given, amount) => given ? ` (+${amount} ⭐)` : ' (stars already earned)';

        function isRecentlyAdded(dateStr) {
            if (!dateStr) return false;
            const added = new Date(dateStr);
            if (isNaN(added.getTime())) return false;
            const daysSince = (Date.now() - added.getTime()) / (1000 * 60 * 60 * 24);
            return daysSince >= 0 && daysSince <= 7;
        }

        function populateUnitSelect() {
            const sel = document.getElementById('unit-select');
            const levelData = curriculum[state.level];

        let enVoice = null;
        function pickVoice() {
            if (!('speechSynthesis' in window)) return;
            enVoice = window.speechSynthesis.getVoices().find(v => v.lang && v.lang.startsWith('en')) || null;
        }
        if ('speechSynthesis' in window) { pickVoice(); window.speechSynthesis.onvoiceschanged = pickVoice; }
        function speak(text, onEnd) {
            if (!('speechSynthesis' in window)) { if (onEnd) onEnd(false); return false; }
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(text);
            u.lang = 'en-US';
            u.rate = 0.9;
            if (!enVoice) pickVoice();
            if (enVoice) u.voice = enVoice;
            if (onEnd) u.onend = () => onEnd(true);
            window.speechSynthesis.speak(u);
            return true;
        }

        function shuffle(arr) {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        // ---------- Pictures ----------
        // When two words in the SAME unit would show the same picture, the second one gets its

        const SAME_UNIT_ALT = {
            "Goodbye": "🚶👋", "Thank you": "💝", "Sorry": "😔", "Respect": "🫡", "Tomorrow": "⏭️",
            "West": "🌇", "East": "🌄", "North": "🧭", "Between": "🥪", "Early": "🐓", "Late": "⏰",
            "Swing": "🎠", "Poster": "🪧"
        };
        function baseEmoji(word) { return WORD_EMOJI[word] || '🖼️'; }
        function emojiFor(word, unitData) {
            const u = unitData || curriculum[state.level][state.unit];
            const e = baseEmoji(word);
            if (u && SAME_UNIT_ALT[word] && u.vocab.some(w => w !== word && baseEmoji(w) === e)) return SAME_UNIT_ALT[word];
            return e;
        }
        // Wrong answers for "look at the picture" questions never share the right answer's
        // picture, so there is always exactly one correct choice.
        function pictureDistractors(correct, pool, unitData, n) {
            const pic = emojiFor(correct, unitData);
            const ok = (w) => w !== correct && emojiFor(w, unitData) !== pic;
            let list = shuffle([...new Set(pool)].filter(ok)).slice(0, n);
            if (list.length < n) {
                const extra = shuffle(allVocabForLevel(state.level).filter(w => ok(w) && !list.includes(w)));
                list = list.concat(extra.slice(0, n - list.length));
            }
            return list;
        }

ation offers a new interpretation."], [127.92, 130.7, "Your turn. Say: Interpretation."], [133.53, 134.79, "Interpretation."], [135.55, 136.91, "Archival research."], [137.92, 142.22, "Archival research means study of original records kept in archives."], [142.82, 145.47, "Archival research revealed forgotten letters."], [146.05, 149.25, "Your turn. Say: Archival research."], [152.1, 153.53, "Archival research."], [154.28, 155.69, "Contextualization."], [156.68, 161.32, "Contextualization means placing a source within its historical circumstances."], [161.92, 165.95, "Contextualization prevents us from judging the past anachronistically."], [166.55, 169.75, "Your turn. Say: Contextualization."], [172.6, 174.03, "Contextualization."], [174.78, 175.49, "Archive."], [176.48, 179.4, "Archive means a collection of historical records."], [180.02, 182.91, "The national archive holds colonial-era maps."], [183.52, 185.82, "Your turn. Say: Archive."], [188.67, 189.54, "Archive."], [190.28, 191.28, "Testimony."], [192.28, 195.21, "Testimony means a formal personal account of events."], [195.82, 198.64, "Survivors' testimony was recorded on film."], [199.25, 201.83, "Your turn. Say: Testimony."], [204.67, 205.6, "Testimony."], [206.4, 210.16, "Part two: dialogue. Let's listen to a conversation."], [211.02, 215.79, "Visal, why do two textbooks describe the fall of Angkor so differently?"], [216.88, 225.89, "Because history is often reinterpreted by later generations. The older book was written by colonial scholars who blamed a 'decadent' court."], [226.98, 228.18, "And the newer one?"], [229.28, 238.9, "It was shaped by archaeologists using satellite data. They argue that the decline was caused largely by climate change and failing water systems."], [240.02, 242.49, "So which interpretation should we trust?"], [243.58, 253.48, "The one best supported by evidence, after contextualization. Every account is written by someone, and their purpose must always be considered."], [254.63, 256.3, "Part three: grammar."], [257.15, 260.43, "Grammar focus: Passive with by plus agent."], [260.73, 261.86, "Look at the pattern."], [262.55, 265.76, "History is often reinterpreted by later generations."], [266.65, 269.86, "The older textbook was written by colonial scholars."], [270.75, 273.49, "The new theory was shaped by satellite evidence."], [274.43, 284.2, "Include 'by + agent' only when the agent is important or new information. In historiography it often matters a great deal, because who wrote an account shapes what it says."], [284.95, 289.41, "Be careful! Don't say: The history was rewritten from later scholars."], [291.37, 294.46, "Say: The history was rewritten by later scholars."], [294.76, 297.0, "Use 'by' for the agent of a passive."], [297.8, 300.34, "Part four: reading. Read and listen."], [301.13, 302.63, "The History of History."], [302.93, 306.98, "Historiography is the study of how history has been written, and by whom."], [307.97, 313.43, "Every account of the past is produced by an author with a particular perspective, purpose and audience."], [314.43, 322.14, "Colonial histories of Cambodia, for instance, were frequently written by European officials who saw Khmer culture through imperial assumptions."], [323.13, 330.02, "Later interpretations have been strengthened by archival research, archaeology and the testimony of local communities."], [331.03, 337.1, "Historiography therefore reminds us that history is not simply the past, but a continuing argument about it."], [338.2, 342.17, "Part five: quiz. Five questions. Are you ready?"], [343.02, 345.86, "The theory was challenged blank new evidence."], [346.16, 349.43, "A, from. B, by. C, with by."], [353.0, 354.67, "The answer is B: by."], [355.82, 358.33, "A diary written during a war is a blank."], [358.63, 362.96, "A, primary source. B, periodization. C, revisionism."], [366.5, 369.2, "The answer is A: primary source."], [370.35, 373.79, "Placing a source within its historical circumstances is blank."], [374.09, 378.69, "A, causation. B, testimony. C, contextualization."], [382.23, 384.77, "The answer is C: contextualization."], [385.92, 387.53, "Choose the correct passive."], [387.83, 395.09, "A, The chronicle wrote by monks.. B, The chronicle was written by monks.. C, The chronicle was wrote by monks.."], [398.63, 401.93, "The answer is B: The chronicle was written by monks.."], [403.08, 407.33, "According to the reading, historiography reminds us that history is…"], [407.63, 414.49, "A, a continuing argument about the past. B, simply a list of dates. C, written only by officials."], [418.03, 421.65, "The answer is A: a continuing argument about the past."], [422.83, 425.87, "Part six: speaking. It's your turn to talk."], [426.72, 430.24, "Why do historians sometimes interpret the same event differently?"], [447.05, 448.49, "Now listen to Visal."], [448.79, 483.18, "Historians interpret the same event differently because every account reflects the available sources and the historian's perspective. The fall of Angkor, for example, was once explained by colonial scholars as moral decline, whereas recent research emphasises climate change and water management. New evidence, such as satellite imaging, can transform our understanding. Some find this frustrating, but I believe debate, tested against evidence, is how historical knowledge improves."], [483.48, 485.11, "Excellent answer, Visal!"], [486.02, 490.29, "Great work! Now you can use ten new words and passive with by plus agent."], [490.59, 495.51, "Today's value is historical awareness. Know the past so you can understand the present."], [495.81, 498.29, "See you in Unit two. Goodbye!"], [498.59, 501.03, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C1B3-Unit02-Social-Psychology": [[0.35, 5.44, "Hello, everyone! I'm Ms. Emma. Welcome to Online C one, Book three."], [5.74, 9.34, "Hi! I'm Visal. Let's learn together!"], [9.64, 16.4, "Unit two: Social Psychology. Today you will describe hidden influences on behaviour with the passive."], [16.7, 19.46, "Here is our lesson map. Let's start!"], [20.4, 23.86, "Part one: words. You will learn ten new words."], [24.72, 25.7, "Conformity."], [26.68, 29.94, "Conformity means adjusting behaviour to match a group."], [30.55, 33.69, "Asch's experiments revealed striking conformity."], [34.28, 36.9, "Your turn. Say: Conformity."], [39.77, 40.85, "Conformity."], [41.58, 42.49, "Groupthink."], [43.48, 47.22, "Groupthink means poor decisions caused by a group's desire for agreement."], [47.82, 50.5, "Groupthink led the committee to ignore the risks."], [51.12, 53.76, "Your turn. Say: Groupthink."], [56.6, 57.4, "Groupthink."], [58.15, 59.84, "Cognitive dissonance."], [60.85, 65.37, "Cognitive dissonance means discomfort from holding conflicting beliefs or actions."], [65.98, 69.12, "Smokers often experience cognitive dissonance."], [69.72, 73.4, "Your turn. Say: Cognitive dissonance."], [76.27, 77.94, "Cognitive dissonance."], [78.68, 80.1, "Social influence."], [81.12, 85.23, "Social influence means the effect others have on our thoughts and actions."], [85.82, 89.13, "Social influence is strongest among close friends."], [89.72, 92.69, "Your turn. Say: Social influence."], [95.53, 97.54, "Social influence."], [98.28, 99.63, "In-group bias."], [100.62, 103.74, "In-group bias means favouring members of one's own group."], [104.35, 107.55, "In-group bias appears even in randomly formed teams."], [108.15, 110.84, "Your turn. Say: In-group bias."], [113.7, 115.02, "In-group bias."], [115.75, 117.13, "Attribution error."], [118.15, 123.04, "Attribution error means blaming character rather than circumstances for others' behaviour."], [123.65, 126.78, "Calling a late driver 'careless' may be an attribution error."], [127.38, 130.84, "Your turn. Say: Attribution error."], [133.7, 135.26, "Attribution error."], [136.02, 137.03, "Persuasion."], [138.02, 141.15, "Persuasion means the process of changing attitudes."], [141.75, 144.57, "Repetition increases the power of persuasion."], [145.18, 147.87, "Your turn. Say: Persuasion."], [150.73, 151.8, "Persuasion."], [152.55, 153.71, "Self-perception."], [154.72, 157.96, "Self-perception means how people understand themselves."], [158.55, 160.85, "Volunteering can change self-perception."], [161.45, 164.21, "Your turn. Say: Self-perception."], [167.07, 168.57, "Self-perception."], [169.32, 170.64, "Heuristic bias."], [171.65, 175.12, "Heuristic bias means errors caused by mental shortcuts."], [175.72, 178.41, "Heuristic bias makes rare dangers seem common."], [179.02, 181.96, "Your turn. Say: Heuristic bias."], [184.8, 186.28, "Heuristic bias."], [187.02, 187.76, "Norm."], [188.75, 191.61, "Norm means an unwritten rule of expected behaviour."], [192.22, 194.27, "Queuing is a strong social norm."], [194.88, 197.23, "Your turn. Say: Norm."], [200.1, 200.97, "Norm."], [201.77, 205.7, "Part two: dialogue. Let's listen to a conversation."], [206.55, 212.67, "Visal, your experiment asked students to judge line lengths after hearing others' answers. What happened?"], [213.78, 222.95, "Many gave the wrong answer when the group did. Their judgement was clearly shaped by social influence rather than by what they saw."], [224.05, 225.3, "Did they realise it?"], [226.38, 235.84, "Most didn't. Behaviour is often shaped by unconscious social influence, so people believe they are thinking independently."], [236.95, 239.62, "How could groupthink be prevented in real committees?"], [240.72, 249.31, "Dissent should be encouraged, and one member can be assigned to argue the opposite view, so the norm of agreement is weakened."], [250.47, 251.91, "Part three: grammar."], [252.75, 255.6, "Grammar focus: Passive voice for behavior."], [255.9, 257.14, "Look at the pattern."], [257.85, 261.5, "Behavior is often shaped by unconscious social influence."], [262.38, 265.3, "Their judgement was influenced by the group's answers."], [266.22, 268.68, "Dissent should be encouraged in every committee."], [269.63, 279.84, "Social scientists use the passive to focus on the person affected and the invisible forces acting on them. Adverbs like often, largely and unconsciously go between 'be' and the participle."], [280.58, 284.95, "Be careful! Don't say: Behaviour is often shape by others."], [286.9, 290.13, "Say: Behaviour is often shaped by others."], [290.43, 292.51, "Passive needs the past participle."], [293.3, 296.05, "Part four: reading. Read and listen."], [296.83, 298.04, "The Power of the Group."], [298.34, 304.88, "Social psychology investigates how individuals are influenced by the real or imagined presence of others."], [305.87, 313.08, "In Solomon Asch's famous experiments, participants were persuaded to give obviously wrong answers simply because the group did."], [314.07, 319.84, "Such conformity is not necessarily weakness; it is often driven by a deep need to belong."], [320.83, 325.85, "However, when dissent is discouraged, groups may fall into groupthink and make disastrous decisions."], [326.87, 331.64, "Understanding these pressures allows us to recognise when our choices are being shaped by others."], [332.73, 336.62, "Part five: quiz. Five questions. Are you ready?"], [337.48, 340.19, "Our choices are often blank by people around us."], [340.49, 344.41, "A, influence. B, influenced. C, influencing."], [347.97, 350.29, "The answer is B: influenced."], [351.45, 353.89, "Favouring members of your own team is blank."], [354.19, 358.53, "A, in-group bias. B, self-perception. C, persuasion."], [362.07, 364.67, "The answer is A: in-group bias."], [365.82, 368.64, "Discomfort from conflicting beliefs is called blank."], [368.94, 373.3, "A, groupthink. B, a norm. C, cognitive dissonance."], [376.87, 379.7, "The answer is C: cognitive dissonance."], [380.85, 382.8, "Which collocation is correct?"], [383.1, 388.6, "A, give in to peer pressure. B, give up to peer pressure. C, give on peer pressure."], [392.17, 395.13, "The answer is A: give in to peer pressure."], [396.28, 399.63, "According to the reading, conformity is often driven by…"], [399.93, 404.13, "A, a need to belong. B, weakness. C, low intelligence."], [407.67, 409.76, "The answer is A: a need to belong."], [410.97, 413.98, "Part six: speaking. It's your turn to talk."], [414.82, 417.77, "How does group pressure influence individual behavior?"], [434.58, 435.99, "Now listen to Visal."], [436.29, 472.34, "Group pressure influences individual behaviour by making people doubt their own judgement and follow the majority. Our decisions are often shaped by a strong need to belong, even when we are not aware of it. For example, students may laugh at a joke they find unkind simply because everyone else does. Some argue that conformity helps societies function smoothly, which is partly true. However, I think we should be taught to recognise group pressure, so that we can resist it when it is wrong."], [472.64, 474.5, "Excellent answer, Visal!"], [475.42, 480.03, "Great work! Now you can use ten new words and passive voice for behavior."], [480.33, 485.05, "Today's value is self-awareness. Know your strengths and keep growing."], [485.35, 487.85, "See you in Unit three. Goodbye!"], [488.15, 492.15, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C1B3-Unit03-Environmental-Ethics": [[0.35, 5.32, "Hello, everyone! I'm Ms. Emma. Welcome to Online C one, Book three."], [5.62, 9.18, "Hi! I'm Visal. Let's learn together!"], [9.48, 16.24, "Unit three: Environmental Ethics. Today you will reflect on past moral choices with modal perfects."], [16.54, 18.99, "Here is our lesson map. Let's start!"], [19.93, 23.25, "Part one: words. You will learn ten new words."], [24.08, 25.39, "Anthropocentrism."], [26.38, 30.48, "Anthropocentrism means the view that humans are the most important beings."], [31.08, 34.6, "Anthropocentrism treats forests merely as resources."], [35.22, 38.16, "Your turn. Say: Anthropocentrism."], [41.0, 42.48, "Anthropocentrism."], [43.22, 44.67, "Intrinsic value."], [45.68, 49.19, "Intrinsic value means worth in itself, not because it is useful."], [49.78, 53.21, "Many ethicists argue that species have intrinsic value."], [53.82, 56.64, "Your turn. Say: Intrinsic value."], [59.5, 61.02, "Intrinsic value."], [61.78, 63.32, "Ecological footprint."], [64.32, 69.18, "Ecological footprint means the amount of nature needed to support a person or society."], [69.78, 73.05, "Rich countries have a far larger ecological footprint."], [73.65, 76.84, "Your turn. Say: Ecological footprint."], [79.7, 81.29, "Ecological footprint."], [82.05, 83.91, "Intergenerational justice."], [84.92, 89.45, "Intergenerational justice means fairness between present and future generations."], [90.05, 93.44, "Climate debt raises questions of intergenerational justice."], [94.05, 97.76, "Your turn. Say: Intergenerational justice."], [100.6, 102.65, "Intergenerational justice."], [103.38, 104.49, "Stewardship."], [105.48, 109.29, "Stewardship means responsible care of something entrusted to us."], [109.88, 112.73, "Buddhist teaching encourages stewardship of nature."], [113.32, 115.82, "Your turn. Say: Stewardship."], [118.67, 119.78, "Stewardship."], [120.55, 122.42, "Sustainability ethics."], [123.42, 128.29, "Sustainability ethics means moral principles for meeting needs without harming the future."], [128.88, 131.94, "Sustainability ethics questions endless growth."], [132.55, 136.15, "Your turn. Say: Sustainability ethics."], [139.0, 140.95, "Sustainability ethics."], [141.72, 143.19, "Conservation ethic."], [144.18, 147.83, "Conservation ethic means a moral commitment to protecting nature."], [148.42, 151.78, "A conservation ethic protected the Cardamom forests."], [152.38, 155.8, "Your turn. Say: Conservation ethic."], [158.67, 160.35, "Conservation ethic."], [161.12, 162.6, "Moral obligation."], [163.62, 166.67, "Moral obligation means a duty based on what is right."], [167.28, 170.43, "We have a moral obligation to future generations."], [171.02, 174.28, "Your turn. Say: Moral obligation."], [177.13, 178.67, "Moral obligation."], [179.42, 180.84, "Habitat loss."], [181.85, 185.67, "Habitat loss means the destruction of places where species live."], [186.28, 189.0, "Habitat loss threatens the Irrawaddy dolphin."], [189.62, 192.5, "Your turn. Say: Habitat loss."], [195.37, 196.75, "Habitat loss."], [197.52, 198.63, "Mitigation."], [199.65, 202.75, "Mitigation means action to reduce the severity of harm."], [203.35, 206.1, "Climate mitigation requires cutting emissions."], [206.72, 209.07, "Your turn. Say: Mitigation."], [211.93, 212.96, "Mitigation."], [213.77, 217.51, "Part two: dialogue. Let's listen to a conversation."], [218.35, 224.6, "Visal, deforestation in Cambodia accelerated over the last twenty years. Who is responsible?"], [225.72, 234.31, "Many actors. But we should have adopted a stronger conservation ethic sooner, before so much habitat loss had happened."], [235.42, 237.02, "Could it really have been avoided?"], [238.12, 246.26, "Much of it could have been. Governments might have protected forests if they had valued their intrinsic worth, not just their timber."], [247.35, 249.28, "What is our moral obligation now?"], [250.38, 260.65, "Mitigation and stewardship. Earlier generations ought to have acted, but blaming them won't help; future generations depend on what we do today."], [261.8, 263.36, "Part three: grammar."], [264.22, 267.77, "Grammar focus: Modal perfect for ethical reflection."], [268.07, 269.27, "Look at the pattern."], [269.98, 273.42, "We should have adopted a stronger conservation ethic sooner."], [274.32, 276.48, "Much of the damage could have been avoided."], [277.38, 280.5, "Earlier generations ought to have acted on the warnings."], [281.43, 291.01, "Modal perfects judge the past: should / ought to have = a duty that was not fulfilled; could have = a possibility that was missed; might have = a possible but uncertain outcome."], [291.75, 295.33, "Be careful! Don't say: We should adopted it sooner."], [297.27, 299.85, "Say: We should have adopted it sooner."], [300.15, 302.83, "Modal perfect: should have + p.p."], [303.63, 306.2, "Part four: reading. Read and listen."], [307.0, 308.58, "Who Speaks for Nature?."], [308.88, 314.19, "Environmental ethics asks whether nature has value only because it serves human needs."], [315.2, 322.17, "Anthropocentric views have dominated modern economics, encouraging the exploitation of forests and rivers as mere resources."], [323.17, 328.87, "Critics argue that we should have recognised the intrinsic value of ecosystems long before the current crisis."], [329.87, 336.09, "Intergenerational justice adds a further dimension: people not yet born cannot defend their own interests."], [337.1, 342.59, "From this perspective, stewardship is not charity but a moral obligation we owe to the future."], [343.7, 347.76, "Part five: quiz. Five questions. Are you ready?"], [348.62, 350.67, "The forest blank protected years ago."], [350.97, 354.7, "A, should have been. B, should have. C, should been."], [358.23, 360.14, "The answer is A: should have been."], [361.28, 364.14, "Worth in itself, not because it is useful, is blank."], [364.44, 369.73, "A, ecological footprint. B, intrinsic value. C, mitigation."], [373.27, 375.88, "The answer is B: intrinsic value."], [377.02, 380.18, "Fairness between present and future generations is blank."], [380.48, 386.15, "A, anthropocentrism. B, stewardship. C, intergenerational justice."], [389.7, 393.01, "The answer is C: intergenerational justice."], [394.15, 396.96, "Choose the sentence that expresses a missed possibility."], [397.26, 401.75, "A, We must protect it.. B, We could have protected it.. C, We protect it.."], [405.3, 408.3, "The answer is B: We could have protected it.."], [409.45, 413.02, "According to the reading, stewardship is described as…"], [413.32, 418.17, "A, a moral obligation. B, charity. C, an economic resource."], [421.7, 424.36, "The answer is A: a moral obligation."], [425.57, 428.68, "Part six: speaking. It's your turn to talk."], [429.55, 432.97, "Do humans have a moral obligation to protect the environment?"], [449.75, 451.21, "Now listen to Visal."], [451.51, 489.46, "In my view, humans clearly have a moral obligation to protect the environment, both for other species and future generations. Having the greatest power over ecosystems, we carry the greatest responsibility. Cambodia's forests, for example, should have been protected more strongly, since their loss now affects rainfall and wildlife. Some argue that poor communities must put economic survival first. That is understandable, so I believe protection must go hand in hand with fair alternatives for local people."], [489.76, 491.5, "Excellent answer, Visal!"], [492.42, 497.45, "Great work! Now you can use ten new words and modal perfect for ethical reflection."], [497.75, 504.12, "Today's value is environmental responsibility. Small green actions at home help the whole planet."], [504.42, 507.16, "See you in Unit four. Goodbye!"], [507.46, 510.35, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C1B3-Unit04-International-Law": [[0.35, 5.11, "Hello, everyone! I'm Ms. Emma. Welcome to Online C one, Book three."], [5.41, 8.69, "Hi! I'm Visal. Let's learn together!"], [8.99, 16.23, "Unit four: International Law. Today you will describe legal procedures and obligations with modal passives."], [16.53, 19.05, "Here is our lesson map. Let's start!"], [20.0, 23.15, "Part one: words. You will learn ten new words."], [24.02, 24.74, "Treaty."], [25.75, 28.83, "Treaty means a formal written agreement between states."], [29.42, 31.61, "The treaty banned the use of landmines."], [32.22, 34.41, "Your turn. Say: Treaty."], [37.27, 38.06, "Treaty."], [38.82, 39.8, "Sovereignty."], [40.78, 44.62, "Sovereignty means a state's supreme authority over its territory."], [45.22, 47.96, "Intervention may violate national sovereignty."], [48.55, 51.08, "Your turn. Say: Sovereignty."], [53.93, 55.16, "Sovereignty."], [55.92, 57.01, "Jurisdiction."], [58.02, 61.51, "Jurisdiction means the official power to make legal decisions."], [62.12, 64.91, "The court has jurisdiction over war crimes."], [65.52, 68.52, "Your turn. Say: Jurisdiction."], [71.37, 72.53, "Jurisdiction."], [73.28, 75.0, "International tribunal."], [76.02, 81.17, "International tribunal means a court set up to judge cases under international law."], [81.78, 84.47, "The tribunal heard testimony from survivors."], [85.08, 88.43, "Your turn. Say: International tribunal."], [91.27, 93.05, "International tribunal."], [93.78, 95.17, "Diplomatic immunity."], [96.18, 100.72, "Diplomatic immunity means legal protection for diplomats from local prosecution."], [101.32, 103.98, "Diplomatic immunity prevented his arrest."], [104.58, 107.83, "Your turn. Say: Diplomatic immunity."], [110.67, 112.33, "Diplomatic immunity."], [113.08, 114.48, "Human rights law."], [115.48, 119.04, "Human rights law means law protecting the basic rights of all people."], [119.65, 121.73, "Human rights law prohibits torture."], [122.32, 125.2, "Your turn. Say: Human rights law."], [128.07, 129.58, "Human rights law."], [130.32, 131.56, "Ratification."], [132.55, 136.2, "Ratification means formal approval that makes an agreement binding."], [136.78, 139.41, "Ratification requires a vote in parliament."], [140.02, 143.2, "Your turn. Say: Ratification."], [146.07, 147.31, "Ratification."], [148.05, 149.7, "Enforcement mechanism."], [150.72, 154.86, "Enforcement mechanism means a means of making sure rules are obeyed."], [155.45, 157.81, "The treaty lacks an enforcement mechanism."], [158.42, 161.93, "Your turn. Say: Enforcement mechanism."], [164.77, 166.67, "Enforcement mechanism."], [167.42, 168.3, "Precedent."], [169.32, 173.15, "Precedent means an earlier decision used as a guide for later cases."], [173.75, 175.85, "The ruling set an important precedent."], [176.45, 178.84, "Your turn. Say: Precedent."], [181.7, 182.66, "Precedent."], [183.42, 184.42, "Statute."], [185.42, 189.22, "Statute means a written law or founding document of a court."], [189.82, 192.28, "The Rome Statute created the ICC."], [192.88, 195.35, "Your turn. Say: Statute."], [198.2, 199.06, "Statute."], [199.87, 203.53, "Part two: dialogue. Let's listen to a conversation."], [204.38, 209.42, "Visal, Cambodia signed the Ottawa Treaty banning landmines. Does signing make it binding?"], [210.52, 217.96, "Not on its own. Treaties must be ratified before they can be enforced, usually by a vote in the national parliament."], [219.05, 221.49, "And what happens if a state breaks a treaty?"], [222.58, 233.66, "That's the weakness. Violations can be condemned, but sanctions can only be imposed if powerful states agree, so enforcement is often limited."], [234.75, 236.95, "Are there any successful examples?"], [238.05, 247.98, "The Khmer Rouge Tribunal. Senior leaders were prosecuted under international and Cambodian law, which showed that impunity could be challenged."], [249.13, 250.66, "Part three: grammar."], [251.52, 253.88, "Grammar focus: Passive with modals."], [254.18, 255.36, "Look at the pattern."], [256.05, 258.94, "Treaties must be ratified before they can be enforced."], [259.85, 263.14, "Sanctions can only be imposed if powerful states agree."], [264.05, 267.38, "Violations should be investigated by an independent body."], [268.33, 280.01, "Legal English relies on modal passives: must be ratified (obligation), may be challenged (permission/possibility), shall be (formal rule in treaties). 'Can only be … if' states a strict condition."], [280.75, 284.94, "Be careful! Don't say: Treaties must ratified first."], [286.9, 289.71, "Say: Treaties must be ratified first."], [290.01, 292.75, "Modal passive: must be + p.p."], [293.57, 296.12, "Part four: reading. Read and listen."], [296.9, 298.71, "Law Without a World Government."], [299.01, 305.2, "International law governs relations between states, yet there is no world police force to enforce it."], [306.2, 311.03, "Treaties can only be applied once they have been signed and ratified by national governments."], [312.03, 318.29, "Because states value their sovereignty, they are often reluctant to accept the jurisdiction of international courts."], [319.3, 325.82, "Nevertheless, tribunals such as the Extraordinary Chambers in the Courts of Cambodia have shown that leaders can be held accountable."], [326.8, 333.9, "International law therefore depends less on force than on reputation, reciprocity and the slow building of precedent."], [335.0, 338.82, "Part five: quiz. Five questions. Are you ready?"], [339.65, 341.77, "The agreement must blank by parliament."], [342.07, 346.44, "A, ratify. B, be ratified. C, been ratified."], [350.0, 352.56, "The answer is B: be ratified."], [353.72, 357.12, "A state's supreme authority over its territory is blank."], [357.42, 361.88, "A, sovereignty. B, precedent. C, jurisdiction."], [365.43, 367.34, "The answer is A: sovereignty."], [368.48, 371.25, "An earlier ruling used as a guide is a blank."], [371.55, 375.23, "A, statute. B, treaty. C, precedent."], [378.77, 380.69, "The answer is C: precedent."], [381.85, 383.76, "Which collocation is correct?"], [384.06, 388.48, "A, impose sanctions. B, make sanctions on. C, do sanctions."], [392.03, 394.61, "The answer is A: impose sanctions."], [395.75, 399.39, "According to the reading, international law depends largely on…"], [399.69, 406.22, "A, a world police force. B, reputation, reciprocity and precedent. C, military power only."], [409.77, 413.47, "The answer is B: reputation, reciprocity and precedent."], [414.67, 418.04, "Part six: speaking. It's your turn to talk."], [418.88, 421.87, "Why is international law difficult to enforce?"], [438.68, 440.22, "Now listen to Visal."], [440.52, 478.39, "International law is difficult to enforce mainly because there is no global authority with the power to compel sovereign states. Treaties can be signed with good intentions, but they may be ignored if a powerful country decides that its interests come first. For example, sanctions can only be imposed if major powers agree in the Security Council. On the other hand, the Khmer Rouge Tribunal showed that justice is possible, even if slow. So I think international law is weak, but far from meaningless."], [478.69, 480.37, "Excellent answer, Visal!"], [481.25, 485.3, "Great work! Now you can use ten new words and passive with modals."], [485.6, 489.79, "Today's value is justice. Stand up for what is fair for everyone."], [490.09, 492.71, "See you in Unit five. Goodbye!"], [493.01, 495.24, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C1B3-Unit05-Technological-Determinism": [[0.35, 5.09, "Hello, everyone! I'm Ms. Emma. Welcome to Online C one, Book three."], [5.39, 8.92, "Hi! I'm Visal. Let's learn together!"], [9.22, 16.05, "Unit five: Technological Determinism. Today you will argue about hypothetical causes with inverted conditionals."], [16.35, 18.95, "Here is our lesson map. Let's start!"], [19.9, 23.32, "Part one: words. You will learn ten new words."], [24.18, 26.15, "Technological determinism."], [27.15, 31.94, "Technological determinism means the view that technology drives social change."], [32.55, 36.49, "Technological determinism claims the printing press caused the Reformation."], [37.08, 40.23, "Your turn. Say: Technological determinism."], [43.1, 45.06, "Technological determinism."], [45.82, 47.33, "Social construction."], [48.32, 52.87, "Social construction means the idea that society shapes how technology develops."], [53.48, 57.52, "Social construction explains why bicycles took different forms."], [58.12, 61.34, "Your turn. Say: Social construction."], [64.2, 65.86, "Social construction."], [66.62, 68.26, "Innovation diffusion."], [69.25, 73.37, "Innovation diffusion means the spread of new technology through a society."], [73.98, 76.94, "Innovation diffusion was rapid for mobile phones."], [77.55, 80.79, "Your turn. Say: Innovation diffusion."], [83.63, 85.1, "Innovation diffusion."], [85.85, 87.69, "Unintended consequence."], [88.68, 92.42, "Unintended consequence means an unplanned result of an action."], [93.02, 96.66, "Social media had unintended consequences for politics."], [97.25, 100.82, "Your turn. Say: Unintended consequence."], [103.67, 105.76, "Unintended consequence."], [106.52, 108.18, "Technological adoption."], [109.18, 113.17, "Technological adoption means the decision to start using a technology."], [113.78, 117.07, "Price drives technological adoption in rural areas."], [117.68, 121.58, "Your turn. Say: Technological adoption."], [124.43, 126.44, "Technological adoption."], [127.18, 128.54, "Digital disruption."], [129.55, 134.38, "Digital disruption means the transformation of industries by digital technology."], [134.98, 137.84, "Digital disruption closed many video shops."], [138.45, 141.24, "Your turn. Say: Digital disruption."], [144.1, 145.38, "Digital disruption."], [146.12, 147.44, "Path dependency."], [148.45, 152.33, "Path dependency means when past choices limit future options."], [152.92, 156.12, "The QWERTY keyboard shows path dependency."], [156.72, 159.58, "Your turn. Say: Path dependency."], [162.43, 164.0, "Path dependency."], [164.75, 166.56, "Sociotechnical system."], [167.55, 172.92, "Sociotechnical system means a system combining people, rules and technology."], [173.52, 176.21, "A hospital is a sociotechnical system."], [176.82, 180.41, "Your turn. Say: Sociotechnical system."], [183.27, 185.0, "Sociotechnical system."], [185.75, 187.16, "Adoption curve."], [188.15, 192.34, "Adoption curve means a graph of how quickly groups adopt innovations."], [192.95, 195.53, "Teenagers sit early on the adoption curve."], [196.12, 199.22, "Your turn. Say: Adoption curve."], [202.07, 203.47, "Adoption curve."], [204.22, 205.21, "Feedback loop."], [206.22, 210.06, "Feedback loop means a process where outputs influence future inputs."], [210.65, 213.46, "Recommendation algorithms create a feedback loop."], [214.05, 216.7, "Your turn. Say: Feedback loop."], [219.57, 220.76, "Feedback loop."], [221.57, 225.38, "Part two: dialogue. Let's listen to a conversation."], [226.22, 232.43, "Visal, did smartphones change Cambodian society, or did Cambodians change how smartphones are used?"], [233.52, 243.52, "Both. Were technology truly deterministic, every country would use phones identically, yet here mobile payments spread faster than in many richer countries."], [244.62, 246.88, "So society shapes technology."], [247.98, 257.46, "Partly. Had banks been widely available earlier, mobile money might never have become so popular. Local conditions guided adoption."], [258.55, 261.61, "But technology still has effects nobody chose."], [262.72, 273.75, "Certainly. Should algorithms keep creating feedback loops, the unintended consequences for politics could be serious, whatever designers intended."], [274.9, 276.46, "Part three: grammar."], [277.32, 280.55, "Grammar focus: Abstract conditional reasoning."], [280.85, 282.02, "Look at the pattern."], [282.72, 286.97, "Were technology truly deterministic, human choice would matter less."], [287.88, 292.33, "Had banks been available earlier, mobile money might not have spread so fast."], [293.22, 297.82, "Should algorithms keep creating feedback loops, the consequences could be serious."], [298.77, 310.08, "Formal inversion replaces 'if': Were X (= if X were), Had X done (= if X had done), Should X (= if X happens to). Do not use 'if' as well, and keep the result clause unchanged."], [310.82, 314.72, "Be careful! Don't say: If were technology deterministic, …"], [316.67, 319.21, "Say: Were technology deterministic, …"], [319.51, 321.02, "Don't use 'if' with inversion."], [321.83, 324.6, "Part four: reading. Read and listen."], [325.4, 326.68, "Who Is in Control?."], [326.98, 332.52, "Technological determinism holds that new technologies drive social change in predictable ways."], [333.53, 339.23, "Were this entirely true, societies adopting the same inventions would develop in the same direction."], [340.23, 346.78, "Historians of technology point out, however, that adoption is shaped by culture, economics and politics."], [347.8, 354.51, "At the same time, technologies create path dependencies and unintended consequences that no one deliberately chose."], [355.5, 361.92, "Most scholars therefore prefer the idea of sociotechnical systems, in which people and machines shape each other."], [363.03, 367.08, "Part five: quiz. Five questions. Are you ready?"], [367.92, 370.44, "blank we known the risks, we would have acted."], [370.74, 373.96, "A, Had. B, If had. C, Were."], [377.5, 378.9, "The answer is A: Had."], [380.05, 382.72, "blank the price fall, adoption would increase."], [383.02, 385.96, "A, Should. B, Would. C, Had."], [389.5, 391.32, "The answer is A: Should."], [392.48, 395.62, "When past choices limit future options, this is blank."], [395.92, 401.42, "A, path dependency. B, digital disruption. C, social construction."], [404.97, 407.34, "The answer is A: path dependency."], [408.48, 410.59, "Choose the correct formal sentence."], [410.89, 418.3, "A, Were it cheaper, more people would buy it.. B, Was it cheaper, more people buy it.. C, If were it cheaper, more people would buy it.."], [421.87, 425.19, "The answer is A: Were it cheaper, more people would buy it.."], [426.35, 430.2, "According to the reading, most scholars prefer the idea of…"], [430.5, 436.74, "A, pure determinism. B, sociotechnical systems. C, unintended consequences."], [440.3, 443.48, "The answer is B: sociotechnical systems."], [444.7, 447.53, "Part six: speaking. It's your turn to talk."], [448.38, 452.7, "Does technology shape society, or does society shape technology?"], [469.52, 470.99, "Now listen to Visal."], [471.29, 508.78, "I believe technology and society shape each other, so neither side fully determines the other. Were technology the only cause, every country would use the internet in the same way, which is clearly not the case. In Cambodia, for example, mobile banking grew quickly because many people had no bank account. Nevertheless, technologies also produce unintended consequences, such as the spread of misinformation. So we should not see ourselves as passive victims of technology, but we must take its effects seriously."], [509.08, 510.78, "Excellent answer, Visal!"], [511.68, 516.22, "Great work! Now you can use ten new words and abstract conditional reasoning."], [516.52, 521.35, "Today's value is critical thinking. Think carefully and give reasons for your opinions."], [521.65, 524.33, "See you in Unit six. Goodbye!"], [524.63, 527.35, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C1B3-Unit06-Colonial-History": [[0.35, 5.36, "Hello, everyone! I'm Ms. Emma. Welcome to Online C one, Book three."], [5.66, 9.29, "Hi! I'm Visal. Let's learn together!"], [9.59, 16.54, "Unit six: Colonial History. Today you will describe long-lasting effects of the past with the present perfect."], [16.84, 19.35, "Here is our lesson map. Let's start!"], [20.3, 23.29, "Part one: words. You will learn eight new words."], [24.15, 25.3, "Colonialism."], [26.32, 31.18, "Colonialism means the control of one country by another, often for economic gain."], [31.78, 34.43, "Colonialism has shaped many modern borders."], [35.02, 38.06, "Your turn. Say: Colonialism."], [40.9, 42.09, "Colonialism."], [42.85, 43.79, "Empire."], [44.78, 47.97, "Empire means a group of territories ruled by one power."], [48.58, 51.13, "The French empire included Indochina."], [51.72, 54.21, "Your turn. Say: Empire."], [57.07, 58.02, "Empire."], [58.78, 60.16, "Exploitation."], [61.15, 65.22, "Exploitation means unfair use of people or resources for profit."], [65.82, 69.34, "Rubber plantations relied on the exploitation of labour."], [69.95, 72.45, "Your turn. Say: Exploitation."], [75.3, 76.67, "Exploitation."], [77.42, 78.49, "Resistance."], [79.48, 83.05, "Resistance means opposition to occupation or control."], [83.65, 87.39, "Local resistance grew throughout the 1940s."], [87.98, 91.25, "Your turn. Say: Resistance."], [94.1, 95.31, "Resistance."], [96.05, 97.25, "Independence."], [98.25, 101.39, "Independence means freedom from control by another country."], [101.98, 106.03, "Cambodia gained independence in 1953."], [106.62, 109.14, "Your turn. Say: Independence."], [112.0, 113.23, "Independence."], [113.98, 115.07, "Legacy."], [116.05, 118.99, "Legacy means something that remains from the past."], [119.58, 122.37, "The legal system is a colonial legacy."], [122.98, 125.58, "Your turn. Say: Legacy."], [128.43, 129.29, "Legacy."], [130.05, 131.29, "Indigenous."], [132.28, 135.94, "Indigenous means originating naturally in a particular place."], [136.55, 139.57, "Indigenous communities lost access to their land."], [140.18, 143.01, "Your turn. Say: Indigenous."], [145.87, 147.01, "Indigenous."], [147.75, 148.81, "Sovereignty."], [149.82, 152.85, "Sovereignty means a nation's right to govern itself."], [153.45, 156.25, "Independence restored Cambodia's sovereignty."], [156.85, 159.22, "Your turn. Say: Sovereignty."], [162.07, 163.24, "Sovereignty."], [164.03, 167.59, "Part two: dialogue. Let's listen to a conversation."], [168.45, 175.62, "Visal, Cambodia became a French protectorate in 1863. Why does that still matter today?"], [176.72, 187.01, "Because colonialism has shaped many modern structures. The borders with Vietnam and Thailand have been influenced by maps drawn under French rule."], [188.12, 190.43, "What other legacies can you identify?"], [191.52, 202.6, "The legal system, some architecture in Phnom Penh, and French loanwords like 'kafe'. These have remained part of daily life for generations."], [203.68, 205.84, "Was the period entirely negative?"], [206.95, 218.29, "The exploitation was real, especially on the rubber plantations. Historians have debated other effects, but independence clearly restored our sovereignty."], [219.43, 220.75, "Part three: grammar."], [221.58, 225.41, "Grammar focus: Present perfect for lasting effects."], [225.71, 226.92, "Look at the pattern."], [227.62, 230.35, "Colonialism has shaped many modern borders."], [231.25, 233.88, "French loanwords have remained part of daily life."], [234.78, 237.63, "Historians have debated its effects for decades."], [238.57, 252.51, "Use the present perfect to connect a past cause with a present result: 'Colonialism has shaped borders' (they still exist). Use the past simple for finished events with a date: 'France colonised Cambodia in 1863.'"], [253.25, 258.53, "Be careful! Don't say: Cambodia has gained independence in 1953."], [260.47, 265.49, "Say: Cambodia gained independence in 1953."], [265.79, 267.8, "Use past simple with a finished date."], [268.6, 271.53, "Part four: reading. Read and listen."], [272.33, 274.07, "The Long Shadow of Empire."], [274.37, 280.23, "Between the sixteenth and twentieth centuries, European empires extended their control across much of the world."], [281.23, 288.1, "In Southeast Asia, France established Indochina, while Britain and the Netherlands ruled neighbouring territories."], [289.1, 298.0, "Although most colonies gained independence after 1945, colonialism has left lasting legacies in borders, languages and economies."], [299.0, 305.18, "Many former colonies have struggled with institutions designed to extract resources rather than to serve citizens."], [306.17, 312.77, "Historians have increasingly focused on the voices of the colonised, including indigenous peoples and resistance movements."], [313.87, 317.72, "Part five: quiz. Five questions. Are you ready?"], [318.58, 322.51, "The colonial legal system blank influenced modern law."], [322.81, 326.16, "A, has. B, have. C, was."], [329.7, 331.72, "The answer is A: has."], [332.88, 336.85, "Cambodia blank independence in 1953."], [337.14, 340.33, "A, has gained. B, gained. C, has been gaining."], [343.9, 345.82, "The answer is B: gained."], [346.98, 350.31, "Unfair use of people or resources for profit is blank."], [350.61, 354.79, "A, exploitation. B, independence. C, sovereignty."], [358.33, 360.8, "The answer is A: exploitation."], [361.95, 363.87, "Which collocation is correct?"], [364.17, 368.91, "A, gain independence. B, win up independence. C, make independence."], [372.47, 375.12, "The answer is A: gain independence."], [376.25, 380.26, "According to the reading, many colonial institutions were designed to…"], [380.56, 385.89, "A, serve citizens. B, extract resources. C, protect indigenous peoples."], [389.43, 392.34, "The answer is B: extract resources."], [393.53, 396.52, "Part six: speaking. It's your turn to talk."], [397.38, 401.24, "What lasting legacy of colonialism do you see in the world today?"], [418.05, 419.42, "Now listen to Visal."], [419.72, 456.89, "One lasting legacy of colonialism I see is the shape of national borders, which were often drawn by colonial powers without regard for local communities. In Southeast Asia, several border disputes have continued for decades because of maps created under French or British rule. Colonialism has also influenced language; French words such as 'kafe' and 'pang' are still used in Khmer. Some people argue that colonial infrastructure brought benefits. Even so, I believe its costs for local people were far greater."], [457.19, 459.06, "Excellent answer, Visal!"], [459.95, 464.73, "Great work! Now you can use eight new words and present perfect for lasting effects."], [465.03, 469.76, "Today's value is historical awareness. Know the past so you can understand the present."], [470.06, 472.5, "See you in Unit seven. Goodbye!"], [472.8, 475.21, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C1B3-Unit07-Revolutionary-Movements": [[0.35, 5.27, "Hello, everyone! I'm Ms. Emma. Welcome to Online C one, Book three."], [5.57, 9.21, "Hi! I'm Visal. Let's learn together!"], [9.51, 16.39, "Unit seven: Revolutionary Movements. Today you will explain motives and aims with purpose infinitives."], [16.69, 19.36, "Here is our lesson map. Let's start!"], [20.3, 23.3, "Part one: words. You will learn eight new words."], [24.15, 25.49, "Revolution."], [26.48, 30.7, "Revolution means a sudden, fundamental change in political power."], [31.32, 34.23, "The French Revolution ended absolute monarchy."], [34.85, 37.61, "Your turn. Say: Revolution."], [40.47, 41.53, "Revolution."], [42.28, 43.28, "Uprising."], [44.28, 47.42, "Uprising means an act of rebellion by many people."], [48.02, 50.07, "The uprising was quickly suppressed."], [50.68, 53.87, "Your turn. Say: Uprising."], [56.73, 57.68, "Uprising."], [58.42, 59.51, "Ideology."], [60.52, 63.24, "Ideology means a set of political beliefs."], [63.85, 67.8, "Revolutionary leaders often promised a utopian ideology."], [68.42, 71.24, "Your turn. Say: Ideology."], [74.1, 75.25, "Ideology."], [76.02, 77.27, "Mobilization."], [78.28, 81.93, "Mobilization means organising people to take collective action."], [82.52, 85.89, "Mass mobilization depended on radio broadcasts."], [86.48, 89.52, "Your turn. Say: Mobilization."], [92.37, 93.83, "Mobilization."], [94.58, 95.46, "Regime."], [96.45, 99.9, "Regime means a government, especially an authoritarian one."], [100.52, 102.92, "The regime controlled all newspapers."], [103.52, 106.3, "Your turn. Say: Regime."], [109.13, 110.18, "Regime."], [110.92, 111.84, "Overthrow."], [112.85, 116.27, "Overthrow means to remove a ruler or government by force."], [116.85, 120.85, "Rebels overthrew the king in 1789."], [121.45, 124.21, "Your turn. Say: Overthrow."], [127.07, 128.26, "Overthrow."], [129.02, 129.98, "Reform."], [130.98, 134.11, "Reform means gradual change to improve a system."], [134.72, 136.96, "Some preferred reform to revolution."], [137.55, 140.12, "Your turn. Say: Reform."], [142.97, 143.76, "Reform."], [144.52, 145.78, "Radical change."], [146.78, 150.56, "Radical change means a complete and fundamental transformation."], [151.15, 153.39, "The movement demanded radical change."], [153.98, 156.81, "Your turn. Say: Radical change."], [159.67, 161.05, "Radical change."], [161.87, 165.68, "Part two: dialogue. Let's listen to a conversation."], [166.52, 171.63, "Visal, why do ordinary people risk their lives to join revolutionary movements?"], [172.72, 183.11, "Usually they mobilize to overthrow a regime they see as unjust, and to win rights that peaceful reform has failed to deliver."], [184.22, 187.12, "But revolutions don't always bring justice."], [188.22, 200.28, "True. Some leaders use revolutionary ideology to seize absolute power. The Khmer Rouge claimed to liberate the people, then destroyed millions of lives."], [201.38, 203.14, "So what should we learn from that?"], [204.25, 213.67, "We should study revolutions in order to understand both their hopes and their dangers, so as not to repeat the worst mistakes."], [214.83, 216.64, "Part three: grammar."], [217.48, 220.27, "Grammar focus: Purpose infinitives."], [220.57, 221.68, "Look at the pattern."], [222.38, 225.37, "People mobilize to overthrow an unjust regime."], [226.28, 229.91, "We study revolutions in order to understand their hopes and dangers."], [230.82, 234.3, "Historians compare cases so as not to repeat simple myths."], [235.27, 244.13, "'To' + base verb expresses purpose. 'In order to' and 'so as to' are more formal; their negatives are 'in order not to' and 'so as not to' (never 'to not' in formal writing)."], [244.88, 248.78, "Be careful! Don't say: They protested for demand change."], [250.73, 253.35, "Say: They protested to demand change."], [253.65, 255.73, "Purpose: to + base verb."], [256.53, 259.3, "Part four: reading. Read and listen."], [260.1, 261.83, "Why Revolutions Happen."], [262.13, 267.0, "Historians have long debated why some societies experience revolution while others do not."], [268.0, 274.97, "Economic hardship alone is rarely sufficient; people usually mobilize to challenge a regime that has lost legitimacy."], [275.97, 282.44, "Revolutionary ideologies spread rapidly when they promise to replace injustice with radical equality."], [283.43, 289.64, "Yet movements that seize power in order to transform society completely have sometimes produced terrible violence."], [290.63, 296.1, "Comparing revolutions helps us to distinguish the conditions that lead to freedom from those that lead to tyranny."], [297.2, 300.96, "Part five: quiz. Five questions. Are you ready?"], [301.82, 304.19, "They protested blank demand fair wages."], [304.49, 307.7, "A, for. B, to. C, for to."], [311.23, 312.83, "The answer is B: to."], [313.98, 316.03, "Choose the correct formal negative."], [316.33, 322.04, "A, in order to not fail. B, in order not to fail. C, in not order to fail."], [325.6, 328.4, "The answer is B: in order not to fail."], [329.55, 332.05, "To remove a government by force is to blank it."], [332.35, 336.35, "A, reform. B, mobilize. C, overthrow."], [339.9, 341.9, "The answer is C: overthrow."], [343.05, 345.82, "Gradual change to improve a system is blank."], [346.12, 349.68, "A, reform. B, uprising. C, regime."], [353.23, 355.36, "The answer is A: reform."], [356.52, 359.56, "According to the reading, economic hardship alone is…"], [359.86, 366.1, "A, always enough to cause revolution. B, rarely sufficient. C, the only cause."], [369.67, 371.92, "The answer is B: rarely sufficient."], [373.13, 376.48, "Part six: speaking. It's your turn to talk."], [377.32, 381.75, "What conditions do you think lead people to join a revolutionary movement?"], [398.55, 400.0, "Now listen to Visal."], [400.3, 441.03, "People usually join revolutionary movements when peaceful ways of changing an unjust system have failed. They usually mobilize to end corruption, poverty or political repression that affects their daily lives. For example, many French peasants joined the revolution in 1789 in order to escape heavy taxes and hunger. However, history shows that revolutions can be captured by extremists, as happened in Cambodia in 1975. That is why I believe gradual reform is usually safer when it is possible."], [441.33, 443.03, "Excellent answer, Visal!"], [443.92, 448.28, "Great work! Now you can use eight new words and purpose infinitives."], [448.58, 454.07, "Today's value is civic awareness. Know your rights, and use them to build a fairer society."], [454.37, 456.85, "See you in Unit eight. Goodbye!"], [457.15, 460.21, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C1B3-Unit08-Economic-History": [[0.35, 5.26, "Hello, everyone! I'm Ms. Emma. Welcome to Online C one, Book three."], [5.56, 9.12, "Hi! I'm Visal. Let's learn together!"], [9.42, 15.99, "Unit eight: Economic History. Today you will explain historical cause and effect with 'led to' and 'resulted in'."], [16.29, 18.99, "Here is our lesson map. Let's start!"], [19.93, 22.92, "Part one: words. You will learn eight new words."], [23.78, 25.2, "Industrialization."], [26.22, 30.47, "Industrialization means the development of industries on a large scale."], [31.08, 33.8, "Industrialization led to rapid urban growth."], [34.42, 37.81, "Your turn. Say: Industrialization."], [40.67, 42.13, "Industrialization."], [42.88, 43.81, "Trade route."], [44.82, 47.63, "Trade route means a path used regularly for trade."], [48.22, 50.66, "The Silk Road was a major trade route."], [51.25, 53.97, "Your turn. Say: Trade route."], [56.83, 57.95, "Trade route."], [58.72, 59.68, "Currency."], [60.68, 63.6, "Currency means the system of money used in a country."], [64.22, 68.61, "The riel was reintroduced as Cambodia's currency in 1980."], [69.22, 71.8, "Your turn. Say: Currency."], [74.63, 75.86, "Currency."], [76.62, 77.94, "Market economy."], [78.95, 83.02, "Market economy means an economy where prices are set by supply and demand."], [83.62, 87.65, "Cambodia moved to a market economy in the 1990s."], [88.25, 91.28, "Your turn. Say: Market economy."], [94.13, 95.49, "Market economy."], [96.25, 97.19, "Recession."], [98.18, 100.73, "Recession means a period of economic decline."], [101.32, 105.02, "The 1930s recession caused mass unemployment."], [105.62, 108.3, "Your turn. Say: Recession."], [111.17, 112.15, "Recession."], [112.88, 113.64, "Growth."], [114.65, 117.27, "Growth means an increase in economic output."], [117.85, 120.58, "Garment exports drove growth for two decades."], [121.18, 123.45, "Your turn. Say: Growth."], [126.3, 127.05, "Growth."], [127.78, 128.72, "Labor."], [129.72, 132.18, "Labor means work, or the people who do it."], [132.78, 135.11, "Cheap labor attracted foreign factories."], [135.72, 137.91, "Your turn. Say: Labor."], [140.77, 141.62, "Labor."], [142.38, 143.34, "Capital."], [144.35, 147.12, "Capital means money or assets used to produce wealth."], [147.72, 150.34, "Factories required large amounts of capital."], [150.95, 153.41, "Your turn. Say: Capital."], [156.27, 157.13, "Capital."], [157.93, 161.91, "Part two: dialogue. Let's listen to a conversation."], [162.75, 167.16, "Visal, how did the Industrial Revolution change ordinary people's lives?"], [168.25, 178.79, "Industrialization led to rapid urban growth. Millions moved from farms to factories, which resulted in crowded cities and new social classes."], [179.88, 181.77, "Was it good or bad for workers?"], [182.88, 194.39, "In the short term, long hours and child labor resulted in great suffering. In the long run, rising productivity led to higher living standards."], [195.48, 198.1, "Do you see similar patterns in Cambodia?"], [199.18, 211.38, "Yes. The growth of garment factories has led to migration from villages to Phnom Penh, and it has given young women new income but hard conditions."], [212.53, 214.34, "Part three: grammar."], [215.18, 219.2, "Grammar focus: Cause-effect: led to and resulted in."], [219.5, 220.68, "Look at the pattern."], [221.38, 224.29, "Industrialization led to rapid urban growth."], [225.18, 228.43, "Long hours and child labor resulted in great suffering."], [229.32, 232.77, "Rising productivity gave rise to higher living standards."], [233.73, 245.39, "'Lead to / result in / give rise to' + noun: cause → effect. Reverse the direction with 'result from' or 'stem from': 'Urban growth resulted from industrialization.' Never say 'resulted to'."], [246.15, 250.09, "Be careful! Don't say: Industrialization resulted to growth."], [252.03, 254.87, "Say: Industrialization resulted in growth."], [255.17, 257.3, "Say 'result in', not 'result to'."], [258.1, 260.53, "Part four: reading. Read and listen."], [261.33, 263.19, "How Economies Transform."], [263.49, 269.52, "Economic history examines how changes in production, trade and money have reshaped human societies."], [270.53, 276.09, "The opening of maritime trade routes led to an unprecedented exchange of goods between continents."], [277.1, 282.62, "Later, industrialization in Britain resulted in a dramatic shift from agricultural to factory labor."], [283.63, 289.09, "Such transformations also gave rise to new conflicts between owners of capital and workers."], [290.1, 296.84, "Studying these patterns helps economists and policymakers anticipate the effects of today's globalised economy."], [297.93, 302.06, "Part five: quiz. Five questions. Are you ready?"], [302.92, 305.61, "The drought blank a sharp rise in food prices."], [305.91, 310.68, "A, resulted in. B, resulted to. C, resulted from."], [314.23, 316.36, "The answer is A: resulted in."], [317.52, 320.05, "The crisis blank poor bank regulation."], [320.35, 324.56, "A, led to. B, resulted from. C, gave rise."], [328.1, 330.45, "The answer is B: resulted from."], [331.58, 334.18, "Money or assets used to produce wealth is blank."], [334.48, 337.93, "A, labor. B, currency. C, capital."], [341.47, 343.18, "The answer is C: capital."], [344.32, 346.24, "Which collocation is correct?"], [346.53, 351.62, "A, trigger a recession. B, do a
