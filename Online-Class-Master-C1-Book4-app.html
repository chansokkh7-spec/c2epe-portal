        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap');
        body { font-family: 'Poppins', sans-serif; }
        /* Flip-card for Listening: front = word, back = picture. */
        .flip-card { perspective: 1000px; height: 100px; cursor: pointer; }
        .flip-card-inner {
            position: relative; width: 100%; height: 100%;
            transition: transform 0.5s; transform-style: preserve-3d;
        }
        .flip-card.flipped .flip-card-inner { transform: rotateY(180deg); }
        .flip-card-front, .flip-card-back {
            position: absolute; width: 100%; height: 100%;
            backface-visibility: hidden; border-radius: 0.75rem;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 0.25rem;
        }
        .flip-card-back { transform: rotateY(180deg); }
        button:disabled { cursor: default; }
        /* phones: the lesson fills the screen, so jumping to it always shows it from the top,
           and the floating "Modules" button never covers the lesson's own buttons */
        @media (max-width: 767px) { #content-area { min-height: calc(100vh - 24px); padding-bottom: 76px; } }
    </style>

    <script>
        let state = {

        const curriculum = {
            'Master': {
                1: { title: "Business Strategy", vocab: ["Strategy", "Competitive advantage", "Market position", "Value proposition", "Differentiation", "Vision", "Execution", "Growth"], story: "Business strategy centers on building a lasting competitive advantage through a clear value proposition. Differentiation strengthens market position, but real growth depends on disciplined execution of the vision.", question: "What gives a company a real competitive advantage in its market?", grammar: { point: "Comparative structures (stronger than, greater than)", example: "A clear value proposition is stronger than a vague one." }, value: "Strategic Vision" },
                2: { title: "Financial Analysis", vocab: ["Balance sheet", "Cash flow", "Revenue", "Profit margin", "Liability", "Asset", "Investment", "Valuation"], story: "Financial analysis begins with the balance sheet, tracking assets against liabilities. Understanding cash flow, revenue, and profit margin is essential for accurate investment valuation.", question: "Why is cash flow sometimes more important than reported profit?", grammar: { point: "Even though / despite contrasts", example: "Even though profits look strong, cash flow may be weak." }, value: "Financial Literacy" },
                3: { title: "Marketing Theory", vocab: ["Target audience", "Positioning", "Brand equity", "Consumer insight", "Market segmentation", "Campaign", "Conversion", "Loyalty"], story: "Marketing theory begins with understanding a target audience through consumer insight and market segmentation. Strong positioning builds brand equity, turning a campaign's conversion into lasting customer loyalty.", question: "What is one way a company can build genuine brand loyalty?", grammar: { point: "Result clauses (turning X into Y)", example: "A great campaign can turn interest into loyalty." }, value: "Customer Focus" },
                4: { title: "Organizational Design", vocab: ["Org structure", "Hierarchy", "Span of control", "Matrix organization", "Decentralization", "Role clarity", "Reporting line", "Agility"], story: "Organizational design balances hierarchy with span of control, sometimes using a matrix organization for flexibility. Decentralization and clear role clarity along reporting lines support greater agility.", question: "What are the tradeoffs between a centralized and decentralized organization?", grammar: { point: "Balance/tradeoff language", example: "Organizations must balance structure with agility." }, value: "Organizational Clarity" },
                5: { title: "Innovation Management", vocab: ["Innovation", "R&D", "Disruptive technology", "Prototype", "Iteration", "Market fit", "Scalability", "Ideation"], story: "Innovation management invests in R&D to develop disruptive technology, testing each prototype through rapid iteration. Achieving market fit is the key step before scalability becomes possible.", question: "What is the value of rapid iteration when developing something new?", grammar: { point: "Before/after sequencing clauses", example: "Market fit must be tested before scaling." }, value: "Innovation" },
                6: { title: "Supply Chain Theory", vocab: ["Supply chain", "Logistics", "Inventory management", "Supplier relationship", "Lead time", "Distribution", "Just-in-time", "Resilience"], story: "Supply chain theory coordinates logistics and inventory management across supplier relationships. Reducing lead time through just-in-time distribution must be balanced with overall supply chain resilience.", question: "Why might a company choose resilience over pure efficiency in its supply chain?", grammar: { point: "Trade-off contrast (efficiency vs resilience)", example: "Efficiency and resilience are often a difficult trade-off." }, value: "Resilience" },
                7: { title: "Corporate Governance", vocab: ["Board of directors", "Shareholder", "Fiduciary duty", "Transparency", "Compliance", "Oversight", "Accountability", "Ethics"], story: "Corporate governance relies on a board of directors upholding fiduciary duty to shareholders. Transparency and compliance support meaningful oversight, grounded in accountability and ethics.", question: "What is a 'fiduciary duty' and why does it matter for corporate leaders?", grammar: { point: "Defining relative clauses (who/that)", example: "A board that upholds fiduciary duty protects shareholders." }, value: "Accountability" },
                8: { title: "Risk Management", vocab: ["Risk assessment", "Mitigation", "Contingency", "Exposure", "Probability", "Impact", "Insurance", "Resilience"], story: "Risk management begins with a thorough risk assessment, weighing probability against potential impact. Mitigation strategies and contingency planning reduce exposure, supported by insurance and resilience.", question: "How would you assess whether a risk is worth taking?", grammar: { point: "Weighing X against Y", example: "Good decisions weigh probability against impact." }, value: "Prudence" },
                9: { title: "Entrepreneurship Theory", vocab: ["Entrepreneur", "Opportunity recognition", "Bootstrapping", "Pivot", "Minimum viable product", "Scalability", "Risk tolerance", "Vision"], story: "Entrepreneurship theory begins with opportunity recognition, often through bootstrapping a minimum viable product. A willingness to pivot, high risk tolerance, and clear vision support long-term scalability.", question: "Why might a founder need to 'pivot' their original business idea?", grammar: { point: "Willingness/ability + infinitive", example: "Successful founders show a willingness to pivot." }, value: "Adaptability" },
                10: { title: "Venture Capital", vocab: ["Venture capital", "Equity", "Term sheet", "Due diligence", "Valuation", "Exit strategy", "Portfolio", "Return on investment"], story: "Venture capital exchanges equity for funding, formalized through a term sheet after careful due diligence. Valuation and exit strategy shape a fund's portfolio and eventual return on investment.", question: "Why might an investor conduct extensive due diligence before investing?", grammar: { point: "Before + gerund clauses", example: "Investors conduct due diligence before committing funds." }, value: "Diligence" },
                11: { title: "Market Analysis", vocab: ["Market research", "Total addressable market", "Competitive landscape", "Demand forecasting", "Market trend", "Customer segment", "Barrier to entry", "Market share"], story: "Market analysis relies on market research to estimate the total addressable market and map the competitive landscape. Demand forecasting and understanding each customer segment reveal barriers to entry and market share.", question: "What is one barrier to entry a new business might face in a market?", grammar: { point: "Estimate/forecast language", example: "Analysts forecast demand based on market trends." }, value: "Analytical Thinking" },
                12: { title: "Competitive Strategy", vocab: ["Competitive strategy", "Cost leadership", "Differentiation strategy", "Niche market", "Barriers to entry", "First-mover advantage", "Benchmarking", "Sustainable advantage"], story: "Competitive strategy often chooses between cost leadership and a differentiation strategy, sometimes targeting a niche market. A first-mover advantage and careful benchmarking can build sustainable advantage.", question: "Would you rather compete on cost or on differentiation? Why?", grammar: { point: "Either/or structures", example: "A company can compete either on cost or differentiation." }, value: "Strategic Thinking" },
                13: { title: "Brand Management", vocab: ["Brand identity", "Brand equity", "Reputation", "Brand loyalty", "Positioning statement", "Visual identity", "Brand voice", "Perception"], story: "Brand management builds a consistent brand identity, protecting reputation while growing brand equity. A clear positioning statement, visual identity, and brand voice shape public perception and loyalty.", question: "What brand do you feel loyal to, and what builds that loyalty?", grammar: { point: "Consistency language (consistently, remains)", example: "A strong brand remains consistent across every channel." }, value: "Consistency" },
                14: { title: "Digital Transformation", vocab: ["Digital transformation", "Legacy system", "Cloud migration", "Automation", "Digital-first", "Change management", "Data-driven", "Agility"], story: "Digital transformation moves organizations from a legacy system toward cloud migration and automation. Becoming digital-first requires deliberate change management and a data-driven approach to build agility.", question: "What challenge might a company face when replacing a legacy system?", grammar: { point: "From X toward Y movement language", example: "Companies move from legacy systems toward cloud infrastructure." }, value: "Adaptability" },
                15: { title: "Data Analytics", vocab: ["Data analytics", "Key performance indicator", "Dashboard", "Predictive model", "Data-driven decision", "Data quality", "Insight", "Visualization"], story: "Data analytics tracks key performance indicators through a live dashboard, sometimes using a predictive model. A data-driven decision depends on data quality, turning raw numbers into real insight through visualization.", question: "Why is 'data quality' as important as the analysis itself?", grammar: { point: "Depends on + noun clause", example: "Good insight depends heavily on data quality." }, value: "Analytical Rigor" },
                16: { title: "Consumer Behavior", vocab: ["Consumer behavior", "Purchase decision", "Brand perception", "Motivation", "Buying journey", "Loyalty program", "Psychology of pricing", "Influence"], story: "Consumer behavior studies what drives a purchase decision, from brand perception to underlying motivation. Mapping the buying journey and using a loyalty program reveal the psychology of pricing and influence.", question: "What influences your own purchase decisions the most?", grammar: { point: "What + influences/drives + noun", example: "What drives a purchase decision varies by person." }, value: "Self-Awareness" },
                17: { title: "International Business", vocab: ["Globalization", "Cross-border trade", "Cultural competence", "Market entry strategy", "Tariff", "Localization", "Foreign direct investment", "Global supply chain"], story: "International business requires cultural competence when planning a market entry strategy across cross-border trade. Tariffs shape decisions, while localization and foreign direct investment strengthen a global supply chain.", question: "Why is cultural competence important when doing business internationally?", grammar: { point: "When + clause for conditions", example: "Cultural competence matters most when entering a new market." }, value: "Cultural Competence" },
                18: { title: "Corporate Ethics", vocab: ["Corporate social responsibility", "Business ethics", "Stakeholder interest", "Sustainability", "Transparency", "Whistleblower", "Compliance", "Integrity"], story: "Corporate ethics balances corporate social responsibility with core business goals, weighing stakeholder interest against profit. Sustainability, transparency, and protecting a whistleblower all support institutional integrity.", question: "Should a company prioritize shareholders or broader stakeholders? Why?", grammar: { point: "Prioritizing X over Y", example: "Some companies prioritize stakeholders over short-term profit." }, value: "Integrity" },
                19: { title: "Strategic Leadership", vocab: ["Strategic leadership", "Vision alignment", "Organizational agility", "Talent development", "Succession planning", "Culture building", "Decision-making", "Long-term thinking"], story: "Strategic leadership aligns vision across the organization while building genuine organizational agility. Talent development, succession planning, and culture building all depend on long-term thinking and sound decision-making.", question: "What quality do you think defines truly strategic leadership?", grammar: { point: "Depends on / requires + noun phrase", example: "Strategic leadership requires long-term thinking." }, value: "Strategic Vision" },
                20: { title: "Sustainable Business", vocab: ["Sustainability", "ESG", "Carbon footprint", "Circular economy", "Stakeholder", "Reporting", "Green", "Long-term value"], story: "Sustainable business considers every stakeholder. Companies measure their carbon footprint, adopt circular economy practices and publish ESG reporting to create long-term value.", question: "Can sustainable business also be profitable?", grammar: {"point": "Conditional with provided that", "example": "Profits can grow, provided that costs are managed."} },
                21: { title: "Pricing Strategy", vocab: ["Pricing", "Premium", "Discount", "Value", "Demand", "Competitor", "Margin", "Psychology"], story: "Pricing strategy balances value, demand and margin. Some firms choose premium prices, others use a discount to beat a competitor, and pricing psychology influences every purchase.", question: "Why do so many prices end in .99?", grammar: {"point": "Comparatives with far / much", "example": "A premium price is far higher than a discount price."} },
                22: { title: "Human Resource Management", vocab: ["Recruitment", "Talent", "Training", "Performance", "Retention", "Culture", "Wellbeing", "Diversity"], story: "Human resource management covers recruitment, training and performance review. Supporting wellbeing, diversity and a positive culture improves talent retention.", question: "What makes employees want to stay with a company?", grammar: {"point": "It is essential that + subjunctive", "example": "It is essential that every employee be treated fairly."} },
                23: { title: "Project Management", vocab: ["Project", "Scope", "Timeline", "Milestone", "Resources", "Risk", "Deliverable", "Agile"], story: "Project management defines scope, timeline and resources. Each milestone and deliverable is tracked, risk is monitored, and agile methods allow teams to adapt quickly.", question: "What causes projects to fail?", grammar: {"point": "Future continuous", "example": "By next month, the team will be delivering the final product."} },
                24: { title: "E-commerce", vocab: ["E-commerce", "Online store", "Payment", "Logistics", "Customer", "Platform", "Review", "Trust"], story: "E-commerce allows any business to open an online store. Secure payment, reliable logistics and positive customer reviews on a platform build trust.", question: "How has online shopping changed traditional markets?", grammar: {"point": "Present perfect for change", "example": "Online shopping has transformed retail."} },
                25: { title: "Startups in Southeast Asia", vocab: ["Startup", "Founder", "Investor", "Scale", "Market", "Innovation", "Mobile", "Ecosystem"], story: "Southeast Asia's startup ecosystem has grown rapidly. Founders build mobile-first products for a young market, and investors support innovation that can scale across the region.", question: "What problems could a Cambodian startup solve?", grammar: {"point": "Reduced relative clauses", "example": "Startups focusing on mobile payments have grown fast."} },
                26: { title: "Business Communication", vocab: ["Email", "Report", "Meeting", "Concise", "Tone", "Audience", "Feedback", "Professional"], story: "Business communication must be concise and professional. Whether in an email, a report or a meeting, tone should suit the audience, and constructive feedback strengthens teamwork.", question: "What makes a business email effective?", grammar: {"point": "Formal requests (I would appreciate it if...)", "example": "I would appreciate it if you could reply by Friday."} },
                27: { title: "Operations Management", vocab: ["Operations", "Efficiency", "Process", "Quality", "Inventory", "Bottleneck", "Productivity", "Lean"], story: "Operations management improves efficiency and quality. Identifying each bottleneck, managing inventory and applying lean process design raise productivity.", question: "How can a small business work more efficiently?", grammar: {"point": "Causative have / get", "example": "The company had its processes reviewed."} },
                28: { title: "Social Entrepreneurship", vocab: ["Social enterprise", "Mission", "Impact", "Profit", "Community", "Sustainability", "Innovation", "Beneficiary"], story: "A social enterprise pursues a social mission as well as profit. Innovation creates impact for every beneficiary while sustainability keeps the business serving its community.", question: "What social problem could a business help solve?", grammar: {"point": "Both... and / either... or", "example": "Social enterprises seek both profit and impact."} },
                29: { title: "Review: Case Study Analysis", vocab: ["Case study", "Problem", "Analysis", "Option", "Recommendation", "Evidence", "Implementation", "Outcome"], story: "In a case study, identify the problem, carry out analysis and compare each option. Support your recommendation with evidence and consider implementation and likely outcome.", question: "What is the most important step in analysing a business case?", grammar: {"point": "Should + perfect for evaluation", "example": "The company should have entered the market earlier."} },
            }
        };

        }
        if ('speechSynthesis' in window) { pickVoice(); window.speechSynthesis.onvoiceschanged = pickVoice; }
        function speak(text, onEnd) {
            if (!('speechSynthesis' in window)) { if (onEnd) onEnd(false); return false; }
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(text);
            u.lang = 'en-US';
            u.rate = 0.9;
            if (!enVoice) pickVoice();
            if (enVoice) u.voice = enVoice;
            if (onEnd) u.onend = () => onEnd(true);
            window.speechSynthesis.speak(u);
            return true;
        }

        function shuffle(arr) {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }

        // When two words in the SAME unit would show the same picture, the second one gets its

        const SAME_UNIT_ALT = {
            "Goodbye": "🚶👋", "Thank you": "💝", "Sorry": "😔", "Respect": "🫡", "Tomorrow": "⏭️",
            "West": "🌇", "East": "🌄", "North": "🧭", "Between": "🥪", "Early": "🐓", "Late": "⏰",
            "Swing": "🎠", "Poster": "🪧"
        };
        function baseEmoji(word) { return WORD_EMOJI[word] || '🖼️'; }
        function emojiFor(word, unitData) {
            const u = unitData || curriculum[state.level][state.unit];
            const e = baseEmoji(word);
            if (u && SAME_UNIT_ALT[word] && u.vocab.some(w => w !== word && baseEmoji(w) === e)) return SAME_UNIT_ALT[word];
            return e;
        }
        // Wrong answers for "look at the picture" questions never share the right answer's
        // picture, so there is always exactly one correct choice.
        function pictureDistractors(correct, pool, unitData, n) {
            const pic = emojiFor(correct, unitData);
            const ok = (w) => w !== correct && emojiFor(w, unitData) !== pic;
            let list = shuffle([...new Set(pool)].filter(ok)).slice(0, n);
            if (list.length < n) {
                const extra = shuffle(allVocabForLevel(state.level).filter(w => ok(w) && !list.includes(w)));
                list = list.concat(extra.slice(0, n - list.length));
            }
            return list;
        }

s a clear picture of what an organisation wants to become."], [126.12, 128.71, "The founder's vision was a cashless Cambodia."], [129.32, 131.89, "Your turn. Say: Vision."], [134.73, 135.61, "Vision."], [136.35, 137.65, "Execution."], [138.65, 142.08, "Execution means the practical implementation of a plan."], [142.68, 146.22, "A brilliant plan is worthless without disciplined execution."], [146.82, 149.34, "Your turn. Say: Execution."], [152.2, 153.51, "Execution."], [154.25, 155.12, "Growth."], [156.12, 159.71, "Growth means an increase in a company's size, sales or profits."], [160.32, 163.38, "Rapid growth can strain a company's cash reserves."], [163.98, 166.41, "Your turn. Say: Growth."], [169.27, 170.05, "Growth."], [170.83, 174.66, "Part two: dialogue. Let's listen to a conversation."], [175.52, 182.08, "Visal, two coffee chains opened on the same street in Phnom Penh. Why is one thriving while the other is struggling?"], [183.18, 194.14, "Because its value proposition is far clearer. It promises fast, consistent coffee for office workers, which is stronger than simply claiming to be 'the best'."], [195.25, 197.71, "But the struggling chain has lower prices."], [198.82, 208.09, "Low prices are easier to copy than a reputation for reliability. A cost advantage is rarely as durable as genuine differentiation."], [209.18, 212.2, "So strategy is mainly about choosing what not to do?"], [213.32, 225.4, "Exactly. The more focused the strategy, the greater the chance of disciplined execution. Trying to please everyone is weaker than serving one segment brilliantly."], [226.53, 228.16, "Part three: grammar."], [229.02, 233.41, "Grammar focus: Comparative structures (stronger than, greater than)."], [233.71, 234.94, "Look at the pattern."], [235.65, 238.68, "A clear value proposition is stronger than a vague one."], [239.58, 243.22, "The risk of copying rivals is far greater than the risk of focusing."], [244.12, 247.63, "Differentiation is often more durable than low prices."], [248.57, 256.2, "Modify comparatives to sound precise: far / considerably / slightly stronger than. Use 'the more…, the greater…' to link two changing qualities."], [256.95, 260.9, "Be careful! Don't say: Quality is more important that price."], [262.87, 265.7, "Say: Quality is more important than price."], [266.0, 267.61, "Comparatives use 'than'."], [268.4, 271.2, "Part four: reading. Read and listen."], [272.0, 273.28, "Choosing Where to Win."], [273.58, 278.48, "Business strategy is less about doing everything well than about deciding where and how to compete."], [279.47, 286.89, "Michael Porter argued that a firm achieves competitive advantage either by lowering costs or by offering something customers value more highly."], [287.9, 296.87, "Cambodian mobile banking illustrates the point: providers that focused on speed and simplicity grew far faster than those offering long lists of features."], [297.87, 305.58, "Nevertheless, a strategy is only as strong as its execution, since even a brilliant plan collapses when staff do not understand it."], [306.57, 311.94, "The most successful firms therefore combine a sharp vision with disciplined, measurable action."], [313.03, 316.98, "Part five: quiz. Five questions. Are you ready?"], [317.82, 321.34, "A focused plan is often blank than an unfocused one."], [321.64, 325.45, "A, strong. B, more strong. C, stronger."], [329.0, 330.96, "The answer is C: stronger."], [332.12, 335.64, "The specific benefit a product promises customers is its blank."], [335.94, 340.0, "A, value proposition. B, execution. C, growth."], [343.53, 346.07, "The answer is A: value proposition."], [347.22, 350.5, "Making a product distinct from rivals' offerings is blank."], [350.81, 355.41, "A, vision. B, differentiation. C, market position."], [358.97, 361.51, "The answer is B: differentiation."], [362.65, 364.27, "Choose the correct sentence."], [364.57, 372.71, "A, Quality is more important that price.. B, Quality is far more important than price.. C, Quality is most important than price.."], [376.27, 380.41, "The answer is B: Quality is far more important than price.."], [381.55, 385.49, "According to the reading, a strategy is only as strong as its…"], [385.79, 391.28, "A, advertising budget. B, execution. C, number of features."], [394.83, 396.96, "The answer is B: execution."], [398.17, 401.52, "Part six: speaking. It's your turn to talk."], [402.35, 405.88, "What gives a company a real competitive advantage in its market?"], [422.68, 424.26, "Now listen to Visal."], [424.56, 461.77, "A real competitive advantage comes from something customers value that rivals find difficult to copy. Low prices can attract buyers quickly, but they are far easier to imitate than a strong reputation, a loyal community or unique know-how. In Cambodia, for example, the most successful payment apps won because they were simpler and more reliable than the alternatives. However, any advantage fades without excellent execution, so I believe disciplined teams are ultimately stronger than clever slogans."], [462.07, 463.76, "Excellent answer, Visal!"], [464.65, 470.0, "Great work! Now you can use eight new words and comparative structures (stronger than, greater than)."], [470.3, 476.51, "Today's value is strategic vision. See the bigger picture, and plan for where you want to be."], [476.81, 479.28, "See you in Unit two. Goodbye!"], [479.58, 482.13, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C1B4-Unit02-Financial-Analysis": [[0.35, 5.25, "Hello, everyone! I'm Ms. Emma. Welcome to Online C one, Book four."], [5.55, 8.73, "Hi! I'm Visal. Let's learn together!"], [9.04, 16.61, "Unit two: Financial Analysis. Today you will interpret financial statements using even though / despite contrasts."], [16.91, 19.66, "Here is our lesson map. Let's start!"], [20.6, 23.75, "Part one: words. You will learn eight new words."], [24.62, 25.79, "Balance sheet."], [26.78, 31.08, "Balance sheet means a statement of what a company , "Valuation."], [163.67, 167.1, "Part two: dialogue. Let's listen to a conversation."], [167.95, 174.28, "Visal, this rice exporter reported record profits, yet it nearly ran out of cash. How is that possible?"], [175.38, 184.91, "Even though profits looked strong, its buyers were paying ninety days late. Profit is an accounting figure; cash is what pays salaries."], [186.02, 188.93, "So the income statement told only half the story?"], [190.05, 198.12, "Precisely. Despite healthy revenue, the balance sheet showed rising liabilities, because the firm had borrowed to cover the gap."], [199.22, 201.4, "What should an analyst check first, then?"], [202.52, 213.13, "Operating cash flow. Although margins matter, a firm can survive low profits for a while, but it cannot survive without cash."], [214.3, 216.03, "Part three: grammar."], [216.88, 220.25, "Grammar focus: Even though and despite contrasts."], [220.55, 221.7, "Look at the pattern."], [222.42, 225.63, "Even though profits look strong, cash flow may be weak."], [226.55, 230.45, "Despite record revenue, the firm struggled to pay suppliers."], [231.35, 234.86, "Even though the margin is thin, the business is highly stable."], [235.8, 245.86, "'Even though' is followed by a full clause (subject + verb). 'Despite' and 'in spite of' are followed by a noun or -ing form: despite rising sales, despite selling more."], [246.62, 250.84, "Be careful! Don't say: Despite the sales rose, cash fell."], [252.8, 255.23, "Say: Although sales rose, cash fell."], [255.53, 258.37, "Despite + noun; although + clause."], [259.17, 261.69, "Part four: reading. Read and listen."], [262.5, 264.32, "Reading Beyond the Bottom Line."], [264.62, 272.55, "Financial analysis involves interpreting three core statements: the income statement, the balance sheet and the cash-flow statement."], [273.53, 280.51, "Even though investors often focus on profit, experienced analysts treat cash flow as the more reliable sign of health."], [281.5, 288.21, "A company may report impressive revenue despite customers paying late, leaving it unable to meet its liabilities."], [289.2, 295.78, "Ratios such as profit margin and debt-to-assets help analysts compare firms of different sizes on equal terms."], [296.8, 302.88, "Ultimately, sound valuation depends on reading these statements together rather than trusting a single headline number."], [303.97, 307.88, "Part five: quiz. Five questions. Are you ready?"], [308.72, 311.18, "blank rising sales, the shop closed."], [311.48, 315.06, "A, Even though. B, Despite. C, Although of."], [318.6, 320.43, "The answer is B: Despite."], [321.58, 324.51, "Something of value that a company owns is an blank."], [324.81, 328.75, "A, liability. B, asset. C, revenue."], [332.3, 334.37, "The answer is B: asset."], [335.52, 338.26, "The movement of money into and out of a business is blank."], [338.56, 343.13, "A, cash flow. B, valuation. C, profit margin."], [346.67, 348.89, "The answer is A: cash flow."], [350.05, 351.69, "Choose the correct sentence."], [351.99, 361.26, "A, Even though the price rose, demand stayed high.. B, Despite the price rose, demand stayed high.. C, Even though of the price, demand stayed high.."], [364.8, 368.75, "The answer is A: Even though the price rose, demand stayed high.."], [369.92, 374.7, "According to the reading, experienced analysts treat blank as the more reliable sign of health."], [375.0, 378.87, "A, revenue. B, profit. C, cash flow."], [382.4, 384.82, "The answer is C: cash flow."], [386.03, 389.44, "Part six: speaking. It's your turn to talk."], [390.28, 393.84, "Why is cash flow sometimes more important than reported profit?"], [410.65, 412.16, "Now listen to Visal."], [412.46, 451.0, "Cash flow is sometimes more important than profit because a business pays its bills with cash, not with accounting figures. Even though a company may record a sale today, the customer might not pay for months. Meanwhile, salaries, rent and suppliers must be paid on time. Many profitable small businesses in Cambodia have failed despite strong sales simply because they ran out of cash. Therefore, I think managers should monitor cash flow weekly, while profit shows whether the business model works in the long run."], [451.3, 453.6, "Excellent answer, Visal!"], [454.48, 459.34, "Great work! Now you can use eight new words and even though and despite contrasts."], [459.64, 465.05, "Today's value is financial literacy. Understand money well enough to make wise decisions."], [465.35, 467.95, "See you in Unit three. Goodbye!"], [468.25, 470.88, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C1B4-Unit03-Marketing-Theory": [[0.35, 5.49, "Hello, everyone! I'm Ms. Emma. Welcome to Online C one, Book four."], [5.79, 9.35, "Hi! I'm Visal. Let's learn together!"], [9.65, 16.11, "Unit three: Marketing Theory. Today you will explain marketing effects with result clauses (turning X into Y)."], [16.41, 19.36, "Here is our lesson map. Let's start!"], [20.3, 23.96, "Part one: words. You will learn eight new words."], [24.82, 26.13, "Target audience."], [27.12, 31.14, "Target audience means the specific group a message is designed to reach."], [31.75, 34.98, "The target audience is first-time smartphone users."], [35.58, 38.85, "Your turn. Say: Target audience."], [41.7, 43.19, "Target audience."], [43.95, 44.96, "Positioning."], [45.95, 49.87, "Positioning means shaping how a brand is perceived relative to rivals."], [50.45, 54.27, "Its positioning as 'affordable luxury' attracted young professionals."], [54.88, 57.34, "Your turn. Say: Positioning."], [60.2, 61.04, "Positioning."], [61.78, 62.98, "Brand equity."], [63.98, 69.14, "Brand equity means the commercial value that comes from customers' perception of a brand."], [69.75, 72.48, "Decades of quality built enormous brand equity."], [73.08, 75.6, "Your turn. Say: Brand equity."], [78.43, 79.72, "Brand equity."], [80.48, 81.95, "Consumer insight."], [82.95, 86.91, "Consumer insight means a deep understanding of what motivates customers."], [87.52, 91.27, "The key consumer insight was that parents feared unsafe food."], [91.88, 95.13, "Your turn. Say: Consumer insight."], [97.97, 99.48, "Consumer insight."], [100.22, 101.83, "Market segmentation."], [102.82, 107.05, "Market segmentation means dividing a market into groups with similar needs."], [107.65, 111.18, "Market segmentation revealed three distinct groups of buyers."], [111.78, 114.75, "Your turn. Say: Market segmentation."], [117.6, 119.27, "Market segmentation."], [120.02, 121.01, "Campaign."], [122.02, 125.1, "Campaign means a planned series of marketing activities."], [125.68, 128.85, "The Khmer New Year campaign went viral on TikTok."], [129.45, 131.73, "Your turn. Say: Campaign."], [134.57, 135.85, "Campaign."], [136.58, 137.58, "Conversion."], [138.58, 142.95, "Conversion means the point at which a prospect takes a desired action, such as buying."], [143.55, 146.72, "Free delivery raised the conversion rate by 20%."], [147.32, 149.83, "Your turn. Say: Conversion."], [152.67, 153.61, "Conversion."], [154.35, 155.32, "Loyalty."], [156.32, 160.07, "Loyalty means customers' tendency to keep choosing the same brand."], [160.68, 163.28, "Loyalty is cheaper to keep than to rebuild."], [163.88, 167.01, "Your turn. Say: Loyalty."], [169.87, 171.09, "Loyalty."], [171.9, 175.42, "Part two: dialogue. Let's listen to a conversation."], [176.28, 183.22, "Visal, a local milk-tea brand spent almost nothing on advertising, yet its queues are endless. What's the secret?"], [184.32, 194.34, "It started with a consumer insight: students wanted somewhere to be seen. The shops are designed for photos, turning every customer into an advertiser."], [195.45, 198.0, "So social media did the marketing for them?"], [199.08, 207.03, "Partly. Clever positioning turned a cheap drink into an affordable status symbol, which made people willing to queue."], [208.12, 210.31, "Can that kind of excitement last?"], [211.42, 220.99, "Only if they keep converting interest into loyalty. Hype fades quickly, so they need a reward programme and consistent quality."], [222.13, 223.77, "Part three: grammar."], [224.62, 228.47, "Grammar focus: Result clauses (turning X into Y)."], [228.77, 230.13, "Look at the pattern."], [230.85, 233.81, "A great campaign can turn interest into loyalty."], [234.72, 238.17, "Clever positioning turned a cheap drink into a status symbol."], [239.08, 243.73, "The shops are designed for photos, turning every customer into an advertiser."], [244.67, 253.95, "A participle clause (', turning X into Y') adds the result of the whole main clause. Keep the subject the same: the design turns customers into advertisers."], [254.68, 258.25, "Be careful! Don't say: The ad turned viewers to buyers."], [260.2, 263.07, "Say: The ad turned viewers into buyers."], [263.37, 264.75, "Turn X into Y."], [265.57, 268.37, "Part four: reading. Read and listen."], [269.17, 270.91, "From Attention to Loyalty."], [271.21, 278.8, "Marketing theory traditionally describes a funnel in which awareness is gradually transformed into interest, desire and finally action."], [279.8, 285.92, "Effective marketers begin with segmentation, since a message aimed at everyone usually persuades no one."], [286.93, 292.83, "A powerful consumer insight can turn an ordinary product into something people feel emotionally connected to."], [293.83, 300.44, "Digital platforms have reshaped the funnel, turning satisfied customers into influential reviewers almost overnight."], [301.43, 308.23, "Nevertheless, the ultimate test of any campaign is whether it builds lasting brand equity rather than a brief spike in sales."], [309.33, 312.95, "Part five: quiz. Five questions. Are you ready?"], [313.82, 317.13, "The app turned casual users blank paying subscribers."], [317.43, 320.42, "A, to. B, into. C, for."], [323.97, 325.9, "The answer is B: into."], [327.05, 330.25, "Dividing a market into groups with similar needs is blank."], [330.55, 335.15, "A, conversion. B, loyalty. C, market segmentation."], [338.7, 341.55, "The answer is C: market segmentation."], [342.68, 346.49, "The commercial value of customers' perception of a brand is blank."], [346.79, 351.65, "A, brand equity. B, a campaign. C, a target audience."], [355.2, 357.38, "The answer is A: brand equity."], [358.55, 360.24, "Choose the correct sentence."], [360.54, 371.17, "A, The video went viral, turning the shop into a landmark.. B, The video went viral, turned the shop into a landmark.. C, The video went viral, turning the shop to landmark.."], [374.73, 379.25, "The answer is A: The video went viral, turning the shop into a landmark.."], [380.42, 383.88, "According to the reading, the ultimate test of a campaign is whether it…"], [384.18, 389.68, "A, wins awards. B, builds lasting brand equity. C, costs very little."], [393.23, 396.28, "The answer is B: builds lasting brand equity."], [397.47, 400.93, "Part six: speaking. It's your turn to talk."], [401.78, 405.15, "What is one way a company can build genuine brand loyalty?"], [421.95, 423.49, "Now listen to Visal."], [423.79, 459.67, "One effective way to build genuine brand loyalty is to deliver a consistent experience that matches the brand's promise every single time. Discounts can turn first-time buyers into repeat customers, but they rarely create emotional attachment. In contrast, a company that listens to feedback and responds quickly makes customers feel respected. A café that remembers regulars' orders can turn visitors into loyal ambassadors. In my view, trust built over time is far more powerful than any promotion."], [459.97, 461.75, "Excellent answer, Visal!"], [462.65, 467.5, "Great work! Now you can use eight new words and result clauses (turning x into y)."], [467.8, 472.39, "Today's value is customer focus. Listen carefully to the people you serve."], [472.69, 475.04, "See you in Unit four. Goodbye!"], [475.34, 478.14, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C1B4-Unit04-Organizational-Design": [[0.35, 5.16, "Hello, everyone! I'm Ms. Emma. Welcome to Online C one, Book four."], [5.46, 8.99, "Hi! I'm Visal. Let's learn together!"], [9.29, 16.12, "Unit four: Organizational Design. Today you will discuss structural choices with balance and trade-off language."], [16.42, 19.13, "Here is our lesson map. Let's start!"], [20.07, 23.23, "Part one: words. You will learn eight new words."], [24.08, 25.26, "Org structure."], [26.25, 30.42, "Org structure means the formal arrangement of roles, teams and authority."], [31.02, 33.98, "The new org structure removed two layers of management."], [34.58, 37.35, "Your turn. Say: Org structure."], [40.2, 41.58, "Org structure."], [42.35, 43.33, "Hierarchy."], [44.32, 47.53, "Hierarchy means a system of ranks from top to bottom."], [48.15, 51.16, "A steep hierarchy can slow decision-making."], [51.75, 54.55, "Your turn. Say: Hierarchy."], [57.4, 58.65, "Hierarchy."], [59.38, 60.79, "Span of control."], [61.78, 66.09, "Span of control means the number of employees a manager directly supervises."], [66.68, 70.3, "A span of control of thirty is too wide for one supervisor."], [70.88, 73.83, "Your turn. Say: Span of control."], [76.67, 78.2, "Span of control."], [78.95, 80.57, "Matrix organization."], [81.55, 85.79, "Matrix organization means a structure in which staff report to two managers."], [86.38, 91.67, "In a matrix organization, engineers report to both product and region heads."], [92.28, 95.38, "Your turn. Say: Matrix organization."], [98.23, 100.1, "Matrix organization."], [100.85, 102.21, "Decentralization."], [103.22, 108.35, "Decentralization means giving decision-making power to lower levels or local units."], [108.95, 112.32, "Decentralization let provincial branches respond faster."], [112.92, 115.74, "Your turn. Say: Decentralization."], [118.6, 120.09, "Decentralization."], [120.85, 122.07, "Role clarity."], [123.08, 126.95, "Role clarity means a clear understanding of one's responsibilities."], [127.55, 130.32, "Lack of role clarity caused duplicated work."], [130.92, 133.77, "Your turn. Say: Role clarity."], [136.6, 137.75, "Role clarity."], [138.52, 139.7, "Reporting line."], [140.72, 144.27, "Reporting line means the formal link showing who reports to whom."], [144.88, 147.5, "Her reporting line goes directly to the CEO."], [148.08, 151.08, "Your turn. Say: Reporting line."], [153.93, 155.18, "Reporting line."], [155.92, 156.92, "Agility."], [157.92, 161.4, "Agility means the ability to adapt quickly to change."], [162.02, 164.55, "Small teams give the company greater agility."], [165.15, 167.88, "Your turn. Say: Agility."], [170.73, 171.84, "Agility."], [172.63, 176.46, "Part two: dialogue. Let's listen to a conversation."], [177.32, 184.25, "Visal, the microfinance firm you studied moved decisions from Phnom Penh to its provincial branches. Was that wise?"], [185.35, 196.49, "Largely, yes. Loans are approved in two days instead of two weeks, but the firm must balance that speed with consistent risk control."], [197.58, 199.99, "Didn't some branches start lending too freely?"], [201.08, 210.57, "A few did. That's the classic trade-off: decentralization increases agility at the cost of central oversight."], [211.68, 213.65, "So how did they strike a balance?"], [214.75, 225.17, "They set clear lending limits and shared data dashboards. Branches have freedom within boundaries, which offsets the loss of control."], [226.33, 227.76, "Part three: grammar."], [228.62, 231.56, "Grammar focus: Balance and tradeoff language."], [231.86, 233.14, "Look at the pattern."], [233.85, 237.01, "Organizations must balance structure with agility."], [237.92, 241.65, "Decentralization increases speed at the cost of central control."], [242.55, 246.62, "Managers need to strike a balance between autonomy and consistency."], [247.57, 258.86, "Useful trade-off phrases: balance X with Y, strike a balance between X and Y, X comes at the cost of Y, X is offset by Y. Avoid 'balance between X with Y'."], [259.62, 264.25, "Be careful! Don't say: We must balance between speed with control."], [266.2, 269.19, "Say: We must balance speed with control."], [269.49, 271.05, "Balance X with Y."], [271.83, 274.44, "Part four: reading. Read and listen."], [275.23, 277.28, "Designing for Speed and Control."], [277.58, 283.15, "Organizational design determines how authority, information and responsibility flow through a company."], [284.17, 290.8, "Traditional hierarchies offer clear reporting lines, but they can slow decisions as information travels up and down many levels."], [291.8, 298.43, "Flatter structures widen each manager's span of control, gaining speed at the cost of closer supervision."], [299.43, 307.98, "Matrix organizations attempt to strike a balance between functional expertise and regional responsiveness, although dual reporting can create confusion."], [308.97, 315.76, "No structure is perfect, so leaders must continually balance stability with the agility that fast-changing markets demand."], [316.87, 321.25, "Part five: quiz. Five questions. Are you ready?"], [322.12, 324.78, "Leaders must balance cost blank quality."], [325.08, 328.12, "A, with. B, from. C, to."], [331.67, 333.38, "The answer is A: with."], [334.52, 337.61, "The number of employees a manager supervises is the blank."], [337.91, 342.61, "A, reporting line. B, span of control. C, hierarchy."], [346.17, 348.72, "The answer is B: span of control."], [349.88, 353.07, "Giving decision-making power to local units is blank."], [353.37, 358.3, "A, decentralization. B, role clarity. C, a matrix organization."], [361.83, 364.6, "The answer is A: decentralization."], [365.75, 367.61, "Choose the correct sentence."], [367.91, 376.07, "A, Speed came at the cost of accuracy.. B, Speed came at the cost for accuracy.. C, Speed came on the cost of accuracy.."], [379.63, 383.33, "The answer is A: Speed came at the cost of accuracy.."], [384.48, 388.28, "According to the reading, a weakness of matrix organizations is that…"], [388.58, 394.43, "A, they are too small. B, dual reporting can create confusion. C, they have no managers."], [397.97, 401.63, "The answer is B: dual reporting can create confusion."], [402.83, 405.88, "Part six: speaking. It's your turn to talk."], [406.72, 410.68, "What are the tradeoffs between a centralized and decentralized organization?"], [427.48, 428.98, "Now listen to Visal."], [429.28, 467.05, "A centralized organization offers consistency and tight control, because important decisions are made by a small group at the top. However, this often comes at the cost of speed, since local managers must wait for approval. A decentralized organization, by contrast, allows branches to respond quickly to customers, but it risks inconsistent standards. A bank with many provincial branches must balance local flexibility with national risk rules. I think the best design depends on how fast the market changes."], [467.35, 469.2, "Excellent answer, Visal!"], [470.12, 474.65, "Great work! Now you can use eight new words and balance and tradeoff language."], [474.95, 481.12, "Today's value is organizational clarity. Make sure everyone knows their role and responsibilities."], [481.42, 483.89, "See you in Unit five. Goodbye!"], [484.19, 486.87, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C1B4-Unit05-Innovation-Management": [[0.35, 5.5, "Hello, everyone! I'm Ms. Emma. Welcome to Online C one, Book four."], [5.8, 9.05, "Hi! I'm Visal. Let's learn together!"], [9.35, 16.91, "Unit five: Innovation Management. Today you will describe innovation processes with before / after sequencing clauses."], [17.21, 19.7, "Here is our lesson map. Let's start!"], [20.67, 23.9, "Part one: words. You will learn eight new words."], [24.75, 25.79, "Innovation."], [26.78, 30.9, "Innovation means a new idea, product or method that creates value."], [31.48, 35.02, "Mobile QR payments were a major innovation for street vendors."], [35.62, 38.2, "Your turn. Say: Innovation."], [41.03, 42.15, "Innovation."], [42.92, 43.96, "R&D."], [44.95, 49.54, "R&D means research and development; work to create new products."], [50.15, 53.55, "The firm invests 8% of revenue in R&D."], [54.15, 57.0, "Your turn. Say: R&D."], [59.83, 61.62, "R&D."], [62.38, 64.17, "Disruptive technology."], [65.18, 69.88, "Disruptive technology means a technology that overturns an established industry."], [70.48, 74.44, "Ride-hailing apps were a disruptive technology for tuk-tuk drivers."], [75.05, 78.75, "Your turn. Say: Disruptive technology."], [81.6, 83.54, "Disruptive technology."], [84.28, 85.32, "Prototype."], [86.32, 89.58, "Prototype means an early model built to test an idea."], [90.18, 93.34, "The team built a cardboard prototype in one afternoon."], [93.95, 96.61, "Your turn. Say: Prototype."], [99.47, 100.42, "Prototype."], [101.18, 102.22, "Iteration."], [103.22, 106.77, "Iteration means one cycle of testing and improving a design."], [107.38, 111.33, "After the fifth iteration, users finally understood the menu."], [111.95, 114.65, "Your turn. Say: Iteration."], [117.5, 118.48, "Iteration."], [119.22, 120.32, "Market fit."], [121.32, 125.34, "Market fit means the degree to which a product satisfies real market demand."], [125.95, 129.57, "Strong market fit shows up as customers recommending the product."], [130.18, 132.97, "Your turn. Say: Market fit."], [135.83, 136.92, "Market fit."], [137.65, 139.05, "Scalability."], [140.05, 144.31, "Scalability means the ability to grow without costs rising at the same rate."], [144.92, 148.56, "Software has far greater scalability than handmade goods."], [149.15, 151.72, "Your turn. Say: Scalability."], [154.57, 155.76, "Scalability."], [156.52, 157.62, "Ideation."], [158.62, 161.82, "Ideation means the process of generating new ideas."], [162.42, 165.58, "Ideation sessions produced over a hundred suggestions."], [166.18, 168.82, "Your turn. Say: Ideation."], [171.67, 172.81, "Ideation."], [173.6, 177.15, "Part two: dialogue. Let's listen to a conversation."], [177.98, 184.48, "Visal, your team wants to launch a farming app across all twenty-five provinces next month. Isn't that rushed?"], [185.58, 194.39, "It might be. Before scaling, we should test market fit with farmers in one province, after the rice harvest when they have time."], [195.48, 197.37, "What will you learn from that pilot?"], [198.48, 205.8, "Whether farmers actually use it. Only after observing real users can we know which features matter and which are noise."], [206.92, 208.71, "And if the first version fails?"], [209.82, 219.38, "Then we iterate. Each prototype should be tested before more money is spent; failing early is far cheaper than failing nationally."], [220.53, 222.02, "Part three: grammar."], [222.88, 226.15, "Grammar focus: Before and after sequencing clauses."], [226.45, 227.69, "Look at the pattern."], [228.38, 230.94, "Market fit must be tested before scaling."], [231.85, 235.44, "Only after observing real users can we choose features."], [236.35, 239.39, "The team refined the design after the first pilot failed."], [240.33, 250.22, "'Before' and 'after' can be followed by a clause (after the pilot failed) or an -ing form (before scaling). 'Only after…' at the start of a sentence requires inversion: Only after testing can we…"], [250.98, 255.1, "Be careful! Don't say: Only after testing we can launch."], [257.03, 259.93, "Say: Only after testing can we launch."], [260.23, 261.86, "'Only after…' needs inversion."], [262.67, 265.27, "Part four: reading. Read and listen."], [266.07, 268.0, "Fail Small, Learn Fast."], [268.3, 274.48, "Innovation management is the discipline of turning creative ideas into products that people actually use."], [275.47, 282.56, "Modern practice favours rapid prototyping, in which rough versions are tested with real users before large sums are invested."], [283.57, 289.46, "Each iteration reveals assumptions that looked sensible on paper but collapse in practice."], [290.47, 296.34, "Only after a product shows clear market fit should a company focus on scalability and mass marketing."], [297.33, 304.19, "Firms that skip these steps often discover, too late, that they have built an impressive solution to a problem nobody has."], [305.3, 309.35, "Part five: quiz. Five questions. Are you ready?"], [310.18, 312.76, "We should test the idea before blank more money."], [313.06, 317.09, "A, invest. B, investing. C, invested."], [320.63, 323.11, "The answer is B: investing."], [324.25, 327.26, "An early model built to test an idea is a blank."], [327.56, 332.26, "A, prototype. B, scalability. C, market fit."], [335.8, 337.93, "The answer is A: prototype."], [339.08, 342.38, "One cycle of testing and improving a design is an blank."], [342.68, 347.18, "A, ideation. B, R&D. C, iteration."], [350.73, 352.84, "The answer is C: iteration."], [353.98, 355.73, "Choose the correct sentence."], [356.03, 363.34, "A, Only after testing we can launch.. B, Only after testing can we launch.. C, Only after test can we launch.."], [366.9, 370.28, "The answer is B: Only after testing can we launch.."], [371.42, 374.67, "According to the reading, firms that skip testing may build…"], [374.97, 381.14, "A, a solution to a problem nobody has. B, cheaper products. C, faster factories."], [384.7, 388.27, "The answer is A: a solution to a problem nobody has."], [389.47, 392.86, "Part six: speaking. It's your turn to talk."], [393.72, 397.81, "What is the value of rapid iteration when developing something new?"], [414.62, 416.16, "Now listen to Visal."], [416.46, 454.2, "Rapid iteration is valuable because it exposes mistakes while they are still cheap to fix. Before investing heavily, a team can build a simple prototype, watch real users and change the design within days. For example, a Cambodian delivery app might discover after a small pilot that customers prefer paying cash, which would completely change its plans. Only after several iterations does a product usually fit the market well. In my view, learning quickly matters far more than being perfect at the first attempt."], [454.5, 456.23, "Excellent answer, Visal!"], [457.12, 462.15, "Great work! Now you can use eight new words and before and after sequencing clauses."], [462.45, 467.45, "Today's value is innovation. Try new ideas boldly, and learn from every attempt."], [467.75, 470.36, "See you in Unit six. Goodbye!"], [470.66, 473.15, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C1B4-Unit06-Supply-Chain-Theory": [[0.35, 5.05, "Hello, everyone! I'm Ms. Emma. Welcome to Online C one, Book four."], [5.35, 8.55, "Hi! I'm Visal. Let's learn together!"], [8.85, 15.75, "Unit six: Supply Chain Theory. Today you will evaluate efficiency versus resilience with trade-off contrast."], [16.05, 18.67, "Here is our lesson map. Let's start!"], [19.63, 22.96, "Part one: words. You will learn eight new words."], [23.82, 25.07, "Supply chain."], [26.08, 30.48, "Supply chain means the network that moves a product from raw materials to customers."], [31.08, 34.51, "A single factory fire disrupted the entire supply chain."], [35.12, 37.78, "Your turn. Say: Supply chain."], [40.63, 41.87, "Supply chain."], [42.62, 43.73, "Logistics."], [44.75, 48.78, "Logistics means the organisation of transport and storage of goods."], [49.38, 52.85, "Better logistics cut delivery time to Siem Reap by a day."], [53.45, 56.44, "Your turn. Say: Logistics."], [59.3, 60.51, "Logistics."], [61.25, 62.75, "Inventory management."], [63.75, 67.17, "Inventory management means controlling the amount of stock held."], [67.75, 71.55, "Poor inventory management left shelves empty before Pchum Ben."], [72.15, 75.16, "Your turn. Say: Inventory management."], [78.0, 79.79, "Inventory management."], [80.55, 82.26, "Supplier relationship."], [83.25, 88.7, "Supplier relationship means the long-term connection between a buyer and its suppliers."], [89.28, 93.34, "Strong supplier relationships helped them secure fabric during shortages."], [93.95, 97.24, "Your turn. Say: Supplier relationship."], [100.1, 101.8, "Supplier relationship."], [102.55, 103.62, "Lead time."], [104.62, 108.1, "Lead time means the time between placing an order and receiving it."], [108.72, 111.6, "The lead time for imported zips is six weeks."], [112.18, 114.87, "Your turn. Say: Lead time."], [117.73, 118.78, "Lead time."], [119.52, 120.56, "Distribution."], [121.55, 125.49, "Distribution means the process of getting products to sellers or customers."], [126.08, 129.13, "Distribution through village shops reached rural buyers."], [129.72, 132.71, "Your turn. Say: Distribution."], [135.57, 136.67, "Distribution."], [137.42, 138.51, "Just-in-time."], [139.52, 143.23, "Just-in-time means producing or delivering goods only when they are needed."], [143.85, 147.02, "Just-in-time production keeps warehouse costs low."], [147.62, 150.48, "Your turn. Say: Just-in-time."], [153.33, 154.44, "Just-in-time."], [155.18, 156.34, "Resilience."], [157.35, 161.06, "Resilience means the ability to recover quickly from disruption."], [161.65, 164.61, "Holding extra stock improved the chain's resilience."], [165.22, 167.8, "Your turn. Say: Resilience."], [170.63, 171.9, "Resilience."], [172.7, 176.37, "Part two: dialogue. Let's listen to a conversation."], [177.22, 184.72, "Visal, during the pandemic many Cambodian garment factories stopped because fabric from abroad didn't arrive. Why were they so exposed?"], [185.82, 196.4, "They relied on just-in-time delivery from a single region. Efficiency and resilience are often a difficult trade-off, and they had chosen pure efficiency."], [197.48, 199.75, "But holding extra stock costs money."], [200.85, 210.04, "True. Whereas lean inventory saves cash in normal times, it leaves no buffer when shipping is delayed for months."], [211.15, 213.14, "So what's the smarter approach?"], [214.25, 223.64, "Diversify suppliers and keep safety stock of critical materials. It's less efficient on paper, but far more resilient in a crisis."], [224.8, 226.45, "Part three: grammar."], [227.32, 231.86, "Grammar focus: Trade-off contrast (efficiency vs resilience)."], [232.16, 233.41, "Look at the pattern."], [234.12, 237.65, "Efficiency and resilience are often a difficult trade-off."], [238.55, 243.28, "Lean inventory saves cash whereas safety stock protects against delays."], [244.18, 247.22, "The firm cut costs at the expense of flexibility."], [248.17, 256.03, "Use 'whereas' to contrast two facts in one sentence (comma before 'whereas' is common). 'At the expense of' means a gain came with a loss."], [256.78, 260.82, "Be careful! Don't say: They grew at the expense from quality."], [262.77, 265.92, "Say: They grew at the expense of quality."], [266.22, 267.45, "At the expense of."], [268.23, 270.98, "Part four: reading. Read and listen."], [271.77, 273.28, "Lean or Robust?."], [273.58, 281.09, "For decades, supply-chain theory celebrated efficiency, encouraging firms to minimise inventory and source from the cheapest supplier."], [282.1, 289.36, "Just-in-time systems, pioneered by Toyota, reduced waste dramatically, whereas they also removed the buffers that absorb shocks."], [290.37, 295.72, "The pandemic exposed this weakness when factories worldwide halted because a single component was missing."], [296.73, 303.54, "Many companies now diversify suppliers and hold strategic stock, accepting higher costs in exchange for resilience."], [304.53, 310.98, "The modern challenge is therefore not choosing efficiency or resilience, but deciding how much of each a business can afford."], [312.07, 315.91, "Part five: quiz. Five questions. Are you ready?"], [316.75, 320.53, "Lean stock saves money, blank extra stock reduces risk."], [320.83, 325.27, "A, whereas. B, despite. C, because of."], [328.83, 331.05, "The answer is A: whereas."], [332.22, 335.19, "The time between ordering and receiving goods is the blank."], [335.49, 339.73, "A, distribution. B, lead time. C, logistics."], [343.27, 345.42, "The answer is B: lead time."], [346.58, 349.23, "Delivering goods only when they are needed is blank."], [349.53, 354.12, "A, resilience. B, inventory. C, just-in-time."], [357.67, 359.85, "The answer is C: just-in-time."], [361.02, 362.81, "Choose the correct sentence."], [363.11, 371.28, "A, They grew fast at the expense of quality.. B, They grew fast at the expense for quality.. C, They grew fast in the expense of quality.."], [374.83, 378.52, "The answer is A: They grew fast at the expense of quality.."], [379.65, 383.02, "According to the reading, the pandemic exposed the weakness of…"], [383.32, 388.95, "A, holding too much stock. B, systems with no buffers. C, local suppliers."], [392.5, 395.36, "The answer is B: systems with no buffers."], [396.57, 399.71, "Part six: speaking. It's your turn to talk."], [400.55, 404.95, "Why might a company choose resilience over pure efficiency in its supply chain?"], [421.75, 423.67, "Now listen to Visal."], [423.97, 462.94, "A company might choose resilience because the cost of a complete shutdown is usually far greater than the cost of holding extra stock. Pure efficiency works well when everything runs smoothly, whereas a single delay can halt production for weeks. Cambodian garment factories learned this during the pandemic, when imported fabric stopped arriving. By diversifying suppliers, a firm sacrifices a little profit but protects its customers and workers. I believe that trade-off is wise in an unpredictable world."], [463.25, 464.92, "Excellent answer, Visal!"], [465.82, 471.88, "Great work! Now you can use eight new words and trade-off contrast (efficiency vs resilience)."], [472.18, 476.77, "Today's value is resilience. Prepare for setbacks, and recover from them with strength."], [477.07, 479.44, "See you in Unit seven. Goodbye!"], [479.74, 482.18, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C1B4-Unit07-Corporate-Governance": [[0.35, 5.21, "Hello, everyone! I'm Ms. Emma. Welcome to Online C one, Book four."], [5.51, 8.83, "Hi! I'm Visal. Let's learn together!"], [9.13, 15.45, "Unit seven: Corporate Governance. Today you will define governance roles with defining relative clauses (who / that)."], [15.75, 18.26, "Here is our lesson map. Let's start!"], [19.2, 22.53, "Part one: words. You will learn eight new words."], [23.38, 24.72, "Board of directors."], [25.72, 29.63, "Board of directors means the group elected to oversee a company's management."], [30.22, 33.87, "The board of directors replaced the CEO after the scandal."], [34.45, 37.25, "Your turn. Say: Board of directors."], [40.1, 41.52, "Board of directors."], [42.28, 43.31, "Shareholder."], [44.32, 48.63, "Shareholder means a person or institution that owns shares in a company."], [49.22, 51.6, "Shareholders voted against the pay increase."], [52.18, 55.34, "Your turn. Say: Shareholder."], [58.2, 59.27, "Shareholder."], [60.02, 61.37, "Fiduciary duty."], [62.35, 67.47, "Fiduciary duty means a legal obligation to act in another party's best interest."], [68.08, 71.65, "Directors have a fiduciary duty to the company, not to themselves."], [72.25, 74.95, "Your turn. Say: Fiduciary duty."], [77.8, 79.09, "Fiduciary duty."], [79.85, 81.03, "Transparency."], [82.02, 85.5, "Transparency means openness about decisions and information."], [86.12, 89.07, "Transparency about fees rebuilt customer trust."], [89.68, 92.47, "Your turn. Say: Transparency."], [95.33, 96.71, "Transparency."], [97.45, 98.58, "Compliance."], [99.58, 103.7, "Compliance means following laws, regulations and internal rules."], [104.28, 107.49, "The compliance team checks every new product."], [108.08, 110.68, "Your turn. Say: Compliance."], [113.53, 114.66, "Compliance."], [115.42, 116.5, "Oversight."], [117.48, 120.66, "Oversight means supervision to ensure proper conduct."], [121.25, 124.22, "Weak oversight allowed the fraud to continue for years."], [124.82, 127.14, "Your turn. Say: Oversight."], [130.0, 130.92, "Oversight."], [131.68, 132.96, "Accountability."], [133.95, 137.77, "Accountability means being answerable for one's decisions and actions."], [138.38, 142.65, "Accountability means accepting consequences, not just praise."], [143.25, 146.75, "Your turn. Say: Accountability."], [149.6, 150.69, "Accountability."], [151.45, 152.47, "Ethics."], [153.48, 156.53, "Ethics means moral principles that guide behaviour."], [157.12, 160.74, "A code of ethics guides employees facing difficult choices."], [161.35, 163.93, "Your turn. Say: Ethics."], [166.77, 167.84, "Ethics."], [168.63, 172.57, "Part two: dialogue. Let's listen to a conversation."], [173.42, 178.42, "Visal, why did the board remove the finance director even though profits were rising?"], [179.52, 187.37, "Because he approved loans to a company that his brother owned. A director who has a conflict of interest must declare it."], [188.48, 191.08, "But the loans were repaid. Where was the harm?"], [192.18, 201.67, "The harm is the breach of fiduciary duty. Directors are trusted to act for shareholders, not for people that they personally favour."], [202.78, 205.1, "How do boards catch problems like that?"], [206.18, 215.45, "Through independent members who have no ties to management, and an audit committee that reviews every related-party transaction."], [216.6, 218.0, "Part three: grammar."], [218.85, 222.63, "Grammar focus: Defining relative clauses (who and that)."], [222.93, 224.21, "Look at the pattern."], [224.92, 228.39, "A board that upholds fiduciary duty protects shareholders."], [229.28, 232.2, "A director who has a conflict of interest must declare it."], [233.12, 236.59, "Companies that publish clear reports attract more investors."], [237.53, 248.15, "Defining relative clauses identify which person or thing we mean, so no commas are used. Use 'who' for people and 'that' or 'which' for things; 'that' is also possible for people informally."], [248.92, 252.9, "Be careful! Don't say: A director which lies must resign."], [254.87, 257.5, "Say: A director who lies must resign."], [257.81, 259.04, "Use 'who' for people."], [259.83, 262.54, "Part four: reading. Read and listen."], [263.33, 265.04, "Who Watches the Managers?."], [265.34, 271.1, "Corporate governance is the system of rules and practices that determines how a company is directed and controlled."], [272.1, 278.22, "Shareholders who own a company rarely run it themselves, so they elect a board that supervises management on their behalf."], [279.23, 284.1, "Directors owe a fiduciary duty, meaning they must place the company's interests above their own."], [285.1, 291.42, "Scandals in which executives hid losses have shown that weak oversight can destroy firms that once seemed unshakeable."], [292.43, 300.25, "As Cambodia's stock exchange grows, companies that embrace transparency and independent boards are likely to win investors' trust."], [301.33, 305.03, "Part five: quiz. Five questions. Are you ready?"], [305.88, 308.75, "A manager blank hides losses breaks the rules."], [309.05, 312.37, "A, which. B, who. C, whose."], [315.93, 317.51, "The answer is B: who."], [318.65, 323.02, "A legal obligation to act in another party's best interest is a blank."], [323.32, 327.68, "A, fiduciary duty. B, compliance. C, shareholder."], [331.23, 333.56, "The answer is A: fiduciary duty."], [334.72, 337.63, "Supervision to ensure proper conduct is blank."], [337.93, 342.27, "A, ethics. B, transparency. C, oversight."], [345.83, 347.9, "The answer is C: oversight."], [349.05, 350.74, "Choose the correct sentence."], [351.04, 357.82, "A, Firms, that cheat, lose trust.. B, Firms that cheat lose trust.. C, Firms who cheats lose trust.."], [361.37, 364.74, "The answer is B: Firms that cheat lose trust.."], [365.88, 369.38, "According to the reading, shareholders elect a board because they…"], [369.68, 375.98, "A, rarely run the company themselves. B, want to avoid taxes. C, manage daily operations."], [379.53, 382.88, "The answer is A: rarely run the company themselves."], [384.07, 387.49, "Part six: speaking. It's your turn to talk."], [388.35, 392.37, "What is a 'fiduciary duty' and why does it matter for corporate leaders?"], [409.18, 410.54, "Now listen to Visal."], [410.84, 445.55, "A fiduciary duty is a legal and moral obligation to act in the best interests of the people who have trusted you with their money or property. For corporate leaders, it means placing the company and its shareholders above personal gain. It matters because directors who misuse their position can destroy value that thousands of investors depend on. A director who secretly awards contracts to a relative betrays that trust, even if they are profitable. Without this duty, investment would rest on blind faith."], [445.85, 447.45, "Excellent answer, Visal!"], [448.35, 453.79, "Great work! Now you can use eight new words and defining relative clauses (who and that)."], [454.09, 459.32, "Today's value is accountability. Take responsibility for your decisions and their results."], [459.62, 462.1, "See you in Unit eight. Goodbye!"], [462.4, 466.07, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C1B4-Unit08-Risk-Management": [[0.35, 5.35, "Hello, everyone! I'm Ms. Emma. Welcome to Online C one, Book four."], [5.65, 9.56, "Hi! I'm Visal. Let's learn together!"], [9.86, 15.63, "Unit eight: Risk Management. Today you will assess decisions by weighing X against Y."], [15.93, 18.29, "Here is our lesson map. Let's start!"], [19.23, 22.73, "Part one: words. You will learn eight new words."], [23.58, 24.99, "Risk assessment."], [25.98, 30.07, "Risk assessment means a systematic evaluation of possible dangers."], [30.68, 34.05, "A risk assessment was completed before the new warehouse opened."], [34.65, 37.58, "Your turn. Say: Risk assessment."], [40.43, 41.98, "Risk assessment."], [42.72, 43.83, "Mitigation."], [44.85, 48.64, "Mitigation means action taken to reduce the severity of a risk."], [49.25, 52.68, "Flood barriers are a mitigation measure for riverside shops."], [53.28, 55.97, "Your turn. Say: Mitigation."], [58.83, 59.79, "Mitigation."], [60.55, 61.75, "Contingency."], [62.75, 66.36, "Contingency means a plan prepared for a possible future event."], [66.95, 70.06, "Our contingency plan covers a two-week power cut."], [70.65, 73.38, "Your turn. Say: Contingency."], [76.23, 77.48, "Contingency."], [78.22, 79.33, "Exposure."], [80.35, 84.14, "Exposure means the degree to which a firm could be affected by a risk."], [84.75, 88.39, "Borrowing in dollars increases exposure to currency changes."], [88.98, 92.19, "Your turn. Say: Exposure."], [95.03, 96.21, "Exposure."], [96.95, 98.16, "Probability."], [99.15, 102.0, "Probability means how likely something is to happen."], [102.58, 105.31, "The probability of a major flood this year is low."], [105.92, 109.0, "Your turn. Say: Probability."], [111.83, 112.98, "Probability."], [113.75, 114.67, "Impact."], [115.68, 118.5, "Impact means the effect or consequence of an event."], [119.08, 122.81, "A cyber-attack would have a severe impact on customer trust."], [123.42, 126.2, "Your turn. Say: Impact."], [129.03, 130.0, "Impact."], [130.75, 131.96, "Insurance."], [132.95, 137.4, "Insurance means an arrangement that pays compensation for specified losses."], [137.98, 140.49, "Insurance covered most of the fire damage."], [141.08, 143.49, "Your turn. Say: Insurance."], [146.33, 147.64, "Insurance."], [148.38, 149.5, "Resilience."], [150.52, 154.37, "Resilience means the capacity to absorb shocks and keep operating."], [154.98, 158.17, "Backup generators strengthened the factory's resilience."], [158.78, 161.87, "Your turn. Say: Resilience."], [164.7, 165.9, "Resilience."], [166.7, 170.58, "Part two: dialogue. Let's listen to a conversation."], [171.42, 177.7, "Visal, the tourism company wants to borrow heavily to build a hotel in Kep. Is that too risky?"], [178.82, 187.96, "We need to weigh the potential profit against the exposure. If tourism falls, as it did in 2020, the debt still has to be repaid."], [189.05, 192.03, "But the probability of another pandemic is low."], [193.12, 201.82, "Perhaps, yet the impact would be catastrophic. Good decisions weigh probability against impact rather than focusing on one alone."], [202.92, 204.68, "So should they abandon the project?"], [205.78, 214.73, "Not necessarily. They could build in phases and buy insurance, which balances the upside against a manageable level of risk."], [215.87, 217.22, "Part three: grammar."], [218.05, 221.09, "Grammar focus: Weighing X against Y."], [221.39, 222.53, "Look at the pattern."], [223.25, 226.21, "Good decisions weigh probability against impact."], [227.12, 230.13, "The board weighed the potential profit against the debt."], [231.02, 234.93, "Investors must set expected returns against possible losses."], [235.87, 244.78, "'Weigh X against Y' means compare two factors to reach a decision. The noun form is also common: 'After weighing the costs against the benefits, we decided…'"], [245.52, 249.25, "Be careful! Don't say: We weighed the risk with the reward."], [251.2, 253.97, "Say: We weighed the risk against the reward."], [254.27, 255.84, "Weigh X against Y."], [256.63, 259.19, "Part four: reading. Read and listen."], [260.0, 261.8, "Thinking in Probabilities."], [262.1, 268.84, "Risk management begins with identifying what could go wrong and estimating both its probability and its potential impact."], [269.83, 275.81, "A rare event with catastrophic consequences may deserve more attention than a frequent but minor inconvenience."], [276.8, 284.47, "Managers then choose whether to avoid, reduce, transfer or accept each risk, weighing the cost of mitigation against the expected loss."], [285.47, 292.32, "Insurance transfers some risk to others, while contingency plans ensure the business can keep operating when disaster strikes."], [293.33, 300.27, "Crucially, risk management is not about eliminating risk, since no profit is possible without taking some chances."], [301.37, 305.18, "Part five: quiz. Five questions. Are you ready?"], [306.02, 308.4, "We must weigh the benefits blank the costs."], [308.7, 312.09, "A, against. B, with. C, between."], [315.63, 317.5, "The answer is A: against."], [318.65, 321.94, "Action taken to reduce the severity of a risk is blank."], [322.24, 326.32, "A, exposure. B, mitigation. C, probability."], [329.87, 331.87, "The answer is B: mitigation."], [333.02, 336.22, "A plan prepared for a possible future event is a blank."], [336.52, 340.75, "A, contingency. B, risk assessment. C, resilience."], [344.3, 346.29, "The answer is A: contingency."], [347.45, 349.29, "Choose the correct sentence."], [349.59, 358.69, "A, After weighing the options, we chose the safer one.. B, After weigh the options, we chose the safer one.. C, After weighing against the options, we chose safer.."], [362.23, 365.8, "The answer is A: After weighing the options, we chose the safer one.."], [366.95, 369.96, "According to the reading, risk management is NOT about…"], [370.26, 376.34, "A, estimating impact. B, eliminating all risk. C, making contingency plans."], [379.9, 382.32, "The answer is B: eliminating all risk."], [383.53, 386.58, "Part six: speaking. It's your turn to talk."], [387.42, 390.07, "How would you assess whether a risk is worth taking?"], [406.85, 408.3, "Now listen to Visal."], [408.6, 445.1, "To assess whether a risk is worth taking, I would first weigh the possible reward against the worst realistic outcome. Next, I would estimate the probability of failure and ask whether the business could survive it. For instance, opening a second shop with savings might be acceptable, whereas borrowing against the family home could be disastrous if sales disappoint. Finally, I would look for ways to reduce the risk, such as starting small or buying insurance. A risk is worth taking when the downside is survivable."], [445.4, 447.32, "Excellent answer, Visal!"], [448.22, 452.63, "Great work! Now you can use eight new words and weighing x against y."], [452.93, 457.43, "Today's value is prudence. Think carefully about risks before you act."], [457.73, 460.38, "See you in Unit nine. Goodbye!"], [460.68, 463.46, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C1B4-Unit09-Entrepreneurship-Theory": [[0.35, 5.22, "Hello, everyone! I'm Ms. Emma. Welcome to Online C one, Book four."], [5.52, 8.75, "Hi! I'm Visal. Let's learn together!"], [9.05, 15.96, "Unit nine: Entrepreneurship Theory. Today you will describe founders' qualities with willingness / ability + infinitive."], [16.26, 18.76, "Here is our lesson map. Let's start!"], [19.7, 23.08, "Part one: words. You will learn eight new words."], [23.95, 25.06, "Entrepreneur."], [26.05, 30.22, "Entrepreneur means a person who starts a business and takes on its risks."], [30.82, 34.15, "The young entrepreneur began by selling phone cases online."], [34.75, 37.2, "Your turn. Say: Entrepreneur."], [40.07, 41.31, "Entrepreneur."], [42.05, 43.72, "Opportunity recognition."], [44.72, 49.36, "Opportunity recognition means the ability to spot an unmet need in the market."], [49.95, 53.7, "Opportunity recognition often starts with personal frustration."], [54.32, 57.84, "Your turn. Say: Opportunity recognition."], [60.7, 63.07, "Opportunity recognition."], [63.82, 65.04, "Bootstrapping."], [66.05, 71.34, "Bootstrapping means building a business with personal savings and revenue, without investors."], [71.95, 74.91, "Bootstrapping kept her in full control of the company."], [75.52, 78.59, "Your turn. Say: Bootstrapping."], [81.43, 82.45, "Bootstrapping."], [83.18, 83.99, "Pivot."], [84.98, 88.41, "Pivot means a fundamental change in a startup's direction."], [89.02, 92.92, "After weak sales, the team pivoted from retail to wholesale."], [93.52, 95.76, "Your turn. Say: Pivot."], [98.6, 99.33, "Pivot."], [100.08, 101.75, "Minimum viable product."], [102.75, 107.94, "Minimum viable product means the simplest version of a product that can be tested with customers."], [108.55, 112.3, "Their minimum viable product was a Facebook page and a phone number."], [112.92, 116.41, "Your turn. Say: Minimum viable product."], [119.27, 121.08, "Minimum viable product."], [121.82, 123.02, "Scalability."], [124.02, 128.4, "Scalability means the potential to grow without proportional cost increases."], [128.98, 133.12, "Investors questioned the scalability of a business that relied on one chef."], [133.72, 136.54, "Your turn. Say: Scalability."], [139.4, 140.83, "Scalability."], [141.58, 143.06, "Risk tolerance."], [144.05, 148.27, "Risk tolerance means how much uncertainty a person is willing to accept."], [148.88, 152.35, "Founders usually have a higher risk tolerance than employees."], [152.95, 155.46, "Your turn. Say: Risk tolerance."], [158.3, 159.87, "Risk tolerance."], [160.62, 161.39, "Vision."], [162.38, 166.53, "Vision means a compelling idea of the future a founder wants to create."], [167.12, 170.22, "Her vision was affordable solar power in every village."], [170.82, 173.1, "Your turn. Say: Vision."], [175.93, 176.91, "Vision."], [177.7, 181.83, "Part two: dialogue. Let's listen to a conversation."], [182.68, 189.39, "Visal, your cousin started an online bookshop, but now she sells school supplies instead. Did she fail?"], [190.48, 197.84, "Not at all. She showed a willingness to pivot when she noticed parents kept asking for notebooks and pens."], [198.95, 201.51, "Wasn't that a betrayal of her original vision?"], [202.62, 211.03, "Her vision was to make learning affordable. Books were just the first idea. What matters is the ability to recognise an opportunity and act on it."], [212.12, 213.65, "How did she fund the change?"], [214.75, 223.38, "By bootstrapping. She reinvested every riel of profit, which forced her to test cheaply before committing to anything large."], [224.53, 226.38, "Part three: grammar."], [227.22, 230
