g-term value means benefits that last over many years."], [159.15, 163.09, "Energy efficiency creates long-term value for shareholders."], [163.68, 166.52, "Your turn. Say: Long-term value."], [169.37, 172.24, "Long-term value."], [173.03, 176.82, "Part two: dialogue. Let's listen to a conversation."], [177.68, 185.25, "Visal, a Siem Reap hotel installed solar panels and stopped using plastic bottles. Isn't that just expensive branding?"], [186.35, 194.92, "Not necessarily. The panels pay for themselves within five years, provided that electricity prices stay roughly where they are."], [196.02, 198.0, "And the guests? Do they care?"], [199.08, 206.75, "Many do. Eco-conscious tourists will pay a premium, provided that the claims are genuine and verifiable."], [207.85, 210.12, "What if the claims are exaggerated?"], [211.22, 221.28, "That's greenwashing, and it backfires badly. Sustainability builds long-term value only provided that reporting is honest."], [222.43, 224.18, "Part three: grammar."], [225.02, 228.04, "Grammar focus: Conditional with provided that."], [228.34, 229.57, "Look at the pattern."], [230.28, 233.68, "Profits can grow, provided that costs are managed."], [234.58, 237.4, "Guests will pay more provided that the claims are genuine."], [238.28, 242.14, "The panels pay for themselves as long as prices stay stable."], [243.1, 252.58, "'Provided that' means 'only if' and stresses that the condition is essential. Like 'if', it takes a present tense for future meaning: provided that costs fall (not 'will fall')."], [253.32, 258.08, "Be careful! Don't say: Provided that costs will fall, we grow."], [260.03, 263.68, "Say: Provided that costs fall, we will grow."], [263.98, 265.99, "Present tense after 'provided that'."], [266.8, 269.31, "Part four: reading. Read and listen."], [270.1, 271.23, "Can Green Pay?."], [271.53, 276.07, "For decades, sustainability was viewed as a cost that reduced profits."], [277.07, 287.23, "Today, many firms argue that environmental responsibility can create long-term value, provided that it is built into the core business rather than added as decoration."], [288.23, 294.94, "Energy efficiency lowers operating costs, while circular-economy models turn waste into new revenue streams."], [295.93, 303.62, "Investors increasingly use ESG criteria, rewarding companies that manage environmental and social risks well."], [304.63, 311.46, "However, the benefits materialise only provided that reporting is transparent, since greenwashing quickly destroys credibility."], [312.57, 316.6, "Part five: quiz. Five questions. Are you ready?"], [317.45, 320.43, "We will invest, provided that the bank blank the loan."], [320.73, 324.27, "A, will approve. B, approves. C, approved."], [327.83, 329.69, "The answer is B: approves."], [330.85, 335.32, "Environmental, social and governance criteria are called blank."], [335.62, 339.47, "A, ESG. B, carbon footprint. C, reporting."], [343.03, 344.58, "The answer is A: ESG."], [345.72, 349.9, "A system that reuses materials instead of discarding them is a blank."], [350.2, 355.04, "A, green economy. B, carbon footprint. C, circular economy."], [358.6, 361.49, "The answer is C: circular economy."], [362.65, 364.41, "Choose the correct sentence."], [364.71, 372.31, "A, Provided that it will rain, we cancel.. B, Provided that it rains, we will cancel.. C, Provided that it rained, we will cancel.."], [375.87, 379.47, "The answer is B: Provided that it rains, we will cancel.."], [380.62, 384.4, "According to the reading, the benefits of sustainability depend on…"], [384.7, 390.01, "A, transparent reporting. B, high prices. C, avoiding investors."], [393.57, 396.18, "The answer is A: transparent reporting."], [397.37, 400.59, "Part six: speaking. It's your turn to talk."], [401.45, 404.31, "Can sustainable business also be profitable?"], [421.12, 422.75, "Now listen to Visal."], [423.05, 460.56, "Yes, sustainable business can be profitable, provided that sustainability is part of the core strategy rather than a marketing slogan. Reducing energy and waste lowers costs, while many customers and investors now prefer responsible companies. A Cambodian hotel using solar power can cut expenses and attract eco-conscious tourists. However, some green investments take years to pay back, so firms need patient capital. In the long run, I think sustainability and profit increasingly point in the same direction."], [460.86, 462.6, "Excellent answer, Visal!"], [463.52, 468.0, "Great work! Now you can use eight new words and conditional with provided that."], [468.3, 473.66, "Today's value is sustainability. Choose ways of living that protect the planet for the future."], [473.96, 476.89, "See you in Unit twenty-one. Goodbye!"], [477.19, 479.89, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C1B4-Unit21-Pricing-Strategy": [[0.35, 5.56, "Hello, everyone! I'm Ms. Emma. Welcome to Online C one, Book four."], [5.86, 9.41, "Hi! I'm Visal. Let's learn together!"], [9.71, 16.08, "Unit twenty-one: Pricing Strategy. Today you will compare prices precisely with far / much + comparatives."], [16.38, 19.07, "Here is our lesson map. Let's start!"], [20.03, 23.3, "Part one: words. You will learn eight new words."], [24.15, 24.96, "Pricing."], [25.95, 29.01, "Pricing means the process of deciding how much to charge."], [29.62, 32.63, "Smart pricing doubled the café's afternoon sales."], [33.22, 35.51, "Your turn. Say: Pricing."], [38.37, 39.2, "Pricing."], [39.95, 40.82, "Premium."], [41.82, 46.0, "Premium means of higher price and quality; an extra amount paid."], [46.58, 49.56, "Buyers pay a premium for organic Kampot pepper."], [50.15, 52.73, "Your turn. Say: Premium."], [55.57, 56.48, "Premium."], [57.22, 58.17, "Discount."], [59.18, 61.82, "Discount means a reduction in the usual price."], [62.42, 66.01, "A 10% discount attracted many first-time customers."], [66.62, 68.92, "Your turn. Say: Discount."], [71.77, 72.76, "Discount."], [73.52, 74.4, "Value."], [75.42, 78.03, "Value means what a product is worth to the customer."], [78.62, 81.58, "Customers judge value, not just price."], [82.18, 84.6, "Your turn. Say: Value."], [87.47, 88.19, "Value."], [88.95, 89.95, "Demand."], [90.95, 94.12, "Demand means how much of a product customers want to buy."], [94.72, 97.0, "Demand for fans soars in April."], [97.58, 99.81, "Your turn. Say: Demand."], [102.67, 103.61, "Demand."], [104.35, 105.47, "Competitor."], [106.48, 109.52, "Competitor means a business selling similar products."], [110.12, 112.57, "Our main competitor lowered its prices again."], [113.18, 115.65, "Your turn. Say: Competitor."], [118.5, 119.58, "Competitor."], [120.32, 121.13, "Margin."], [122.12, 125.6, "Margin means the difference between cost and selling price."], [126.22, 129.42, "Premium products usually carry a much higher margin."], [130.02, 132.63, "Your turn. Say: Margin."], [135.5, 136.29, "Margin."], [137.05, 138.2, "Psychology."], [139.22, 142.81, "Psychology means the study of how the mind influences behaviour."], [143.42, 148.64, "Pricing psychology explains why $4.99 feels cheaper than $5."], [149.25, 152.08, "Your turn. Say: Psychology."], [154.93, 156.06, "Psychology."], [156.87, 160.54, "Part two: dialogue. Let's listen to a conversation."], [161.38, 170.63, "Visal, two bakeries in Battambang sell almost identical cakes. One charges $3, the other $8. Why does the expensive one sell out?"], [171.72, 181.76, "Because its pricing signals quality. The $8 cake is far more expensive, but the shop, packaging and service feel much more special."], [182.85, 185.44, "Isn't the cheaper bakery offering better value?"], [186.55, 196.24, "Value is what customers perceive. For gifts, people often want something that looks considerably more impressive than an everyday cake."], [197.35, 199.64, "So should the cheap bakery raise its price?"], [200.75, 209.05, "Only if it improves the experience. Otherwise, a higher price simply makes it much less competitive."], [210.2, 212.11, "Part three: grammar."], [212.95, 216.31, "Grammar focus: Comparatives with far and much."], [216.61, 217.82, "Look at the pattern."], [218.52, 222.03, "A premium price is far higher than a discount price."], [222.92, 226.36, "The $8 cake feels much more special than the $3 one."], [227.25, 230.63, "Online prices are slightly lower than in-store prices."], [231.57, 242.02, "Use far, much, a lot, considerably for big differences and slightly, a little, marginally for small ones. 'Very' cannot modify comparatives: much cheaper, not 'very cheaper'."], [242.78, 246.09, "Be careful! Don't say: This is very more expensive."], [248.03, 250.65, "Say: This is much more expensive."], [250.95, 253.95, "Use much / far, not very, with comparatives."], [254.73, 257.08, "Part four: reading. Read and listen."], [257.9, 259.41, "The Price Is a Message."], [259.71, 263.91, "Pricing is one of the most powerful yet least understood marketing decisions."], [264.9, 272.16, "Cost-plus pricing simply adds a margin to production costs, whereas value-based pricing asks what customers believe a product is worth."], [273.17, 279.76, "A premium price can make a product seem far more desirable, because many buyers use price as a signal of quality."], [280.77, 288.49, "Psychological pricing exploits the fact that $9.99 feels much cheaper than $10, even though the difference is only one cent."], [289.5, 297.2, "Constant discounting is risky, since customers quickly learn to wait for sales and begin to see the brand as considerably less valuable."], [298.3, 302.23, "Part five: quiz. Five questions. Are you ready?"], [303.08, 305.45, "This phone is blank cheaper than that one."], [305.75, 308.72, "A, very. B, much. C, most."], [312.27, 314.07, "The answer is B: much."], [315.22, 317.61, "A reduction in the usual price is a blank."], [317.91, 321.34, "A, premium. B, margin. C, discount."], [324.9, 327.12, "The answer is C: discount."], [328.28, 331.26, "The difference between cost and selling price is the blank."], [331.56, 334.94, "A, margin. B, demand. C, value."], [338.5, 340.37, "The answer is A: margin."], [341.52, 343.34, "Choose the correct sentence."], [343.64, 349.83, "A, Rice is far more cheaper here.. B, Rice is far cheaper here.. C, Rice is very cheaper here.."], [353.37, 356.25, "The answer is B: Rice is far cheaper here.."], [357.38, 361.25, "According to the reading, constant discounting can make customers…"], [361.55, 366.24, "A, pay more. B, wait for sales. C, trust the brand more."], [369.8, 372.29, "The answer is B: wait for sales."], [373.5, 376.96, "Part six: speaking. It's your turn to talk."], [377.82, 381.01, "Why do so many prices end in .99?"], [397.82, 399.21, "Now listen to Visal."], [399.51, 443.0, "Prices end in .99 because of a psychological effect called left-digit bias. When we see $9.99, our brain focuses on the first digit, so it feels much closer to $9 than to $10, even though the difference is only one cent. This makes the product seem slightly cheaper and more attractive. Shops also use .99 to suggest a bargain, whereas round numbers such as $10 can suggest premium quality. That is why luxury brands often avoid .99 endings altogether."], [443.31, 445.39, "Excellent answer, Visal!"], [446.28, 450.69, "Great work! Now you can use eight new words and comparatives with far and much."], [450.99, 455.32, "Today's value is fairness. Look for solutions that are fair to everyone."], [455.62, 458.43, "See you in Unit twenty-two. Goodbye!"], [458.73, 461.53, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C1B4-Unit22-Human-Resource-Management": [[0.35, 5.33, "Hello, everyone! I'm Ms. Emma. Welcome to Online C one, Book four."], [5.63, 8.94, "Hi! I'm Visal. Let's learn together!"], [9.24, 16.7, "Unit twenty-two: Human Resource Management. Today you will state workplace requirements with it is essential that + subjunctive."], [17.0, 19.63, "Here is our lesson map. Let's start!"], [20.57, 24.24, "Part one: words. You will learn eight new words."], [25.08, 26.08, "Recruitment."], [27.08, 30.3, "Recruitment means the process of finding and hiring employees."], [30.92, 33.95, "Recruitment through universities brought in fresh talent."], [34.55, 37.2, "Your turn. Say: Recruitment."], [40.07, 41.07, "Recruitment."], [41.82, 42.64, "Talent."], [43.65, 46.55, "Talent means skilled people, or a natural ability."], [47.15, 50.37, "Competition for digital talent is fierce in Phnom Penh."], [50.98, 53.38, "Your turn. Say: Talent."], [56.23, 57.13, "Talent."], [57.88, 58.58, "Training."], [59.58, 62.15, "Training means teaching employees new skills."], [62.75, 66.21, "Monthly training improved customer satisfaction scores."], [66.82, 69.17, "Your turn. Say: Training."], [72.03, 72.85, "Training."], [73.58, 74.62, "Performance."], [75.62, 78.42, "Performance means how well someone does their job."], [79.02, 81.43, "Performance reviews take place twice a year."], [82.05, 84.85, "Your turn. Say: Performance."], [87.7, 88.67, "Performance."], [89.42, 90.44, "Retention."], [91.45, 94.01, "Retention means keeping employees from leaving."], [94.62, 97.2, "Flexible hours improved staff retention."], [97.78, 100.81, "Your turn. Say: Retention."], [103.67, 104.73, "Retention."], [105.48, 106.29, "Culture."], [107.28, 110.9, "Culture means the shared values and behaviour in an organisation."], [111.48, 114.05, "A culture of respect keeps good people."], [114.65, 116.95, "Your turn. Say: Culture."], [119.8, 120.65, "Culture."], [121.42, 122.25, "Wellbeing."], [123.25, 127.15, "Wellbeing means a state of being healthy, safe and content."], [127.75, 130.79, "The company introduced wellbeing days after Pchum Ben."], [131.38, 133.72, "Your turn. Say: Wellbeing."], [136.57, 137.65, "Wellbeing."], [138.38, 139.44, "Diversity."], [140.45, 143.73, "Diversity means including people of different backgrounds."], [144.32, 147.25, "Diversity in the team led to more creative ideas."], [147.85, 150.38, "Your turn. Say: Diversity."], [153.23, 154.41, "Diversity."], [155.2, 159.05, "Part two: dialogue. Let's listen to a conversation."], [159.88, 165.57, "Visal, the hotel loses half its staff every year. The manager says young people just aren't loyal."], [166.65, 175.61, "I disagree. Exit interviews show staff leave because of unfair shifts. It is essential that every employee be treated fairly."], [176.72, 178.89, "But the hotel pays above the market rate."], [179.98, 189.1, "Pay matters, but it isn't enough. It is vital that managers recognise good work and that schedules be published in advance."], [190.22, 192.04, "So what would you recommend?"], [193.15, 201.64, "Training for supervisors and a clear career path. It is crucial that staff see a future in the company, not just a job."], [202.8, 204.43, "Part three: grammar."], [205.28, 208.54, "Grammar focus: It is essential that plus subjunctive."], [208.84, 209.99, "Look at the pattern."], [210.68, 213.79, "It is essential that every employee be treated fairly."], [214.68, 218.04, "It is vital that each new worker receive proper training."], [218.95, 221.88, "It is crucial that staff see a future in the company."], [222.83, 236.22, "In formal English, adjectives like essential, vital, crucial and important are followed by 'that + subject + base verb' (the subjunctive): that he be, that she receive (no -s). British English also allows 'should': that he should be."], [236.98, 240.9, "Be careful! Don't say: It is essential that he is on time."], [242.87, 245.46, "Say: It is essential that he be on time."], [245.76, 247.54, "Subjunctive: base verb."], [248.33, 251.12, "Part four: reading. Read and listen."], [251.93, 253.49, "People Are the Strategy."], [253.79, 260.8, "Human resource management covers the entire employee journey, from recruitment and training to performance management and retention."], [261.8, 268.68, "Research consistently shows that people leave managers, not companies, so it is essential that supervisors be trained in leadership."], [269.67, 275.39, "Replacing an employee can cost up to a year's salary once recruitment and lost productivity are included."], [276.4, 281.88, "Modern HR therefore focuses on culture, wellbeing and diversity as well as pay."], [282.87, 290.15, "In Cambodia's competitive labour market, firms that invest in their people increasingly outperform those that treat staff as a cost."], [291.23, 295.43, "Part five: quiz. Five questions. Are you ready?"], [296.28, 298.61, "It is essential that she blank on time."], [298.91, 302.08, "A, is. B, be. C, will be."], [305.63, 307.19, "The answer is B: be."], [308.35, 310.68, "Keeping employees from leaving is blank."], [310.98, 314.69, "A, retention. B, recruitment. C, diversity."], [318.23, 320.06, "The answer is A: retention."], [321.22, 324.13, "A state of being healthy, safe and content is blank."], [324.43, 327.95, "A, performance. B, talent. C, wellbeing."], [331.5, 333.65, "The answer is C: wellbeing."], [334.82, 336.55, "Choose the correct sentence."], [336.85, 344.39, "A, It is vital that he receives training.. B, It is vital that he receive training.. C, It is vital that he to receive training.."], [347.93, 350.9, "The answer is B: It is vital that he receive training.."], [352.05, 354.99, "According to the reading, people often leave because of…"], [355.29, 359.73, "A, their managers. B, the company logo. C, office furniture."], [363.27, 365.86, "The answer is A: their managers."], [367.07, 370.21, "Part six: speaking. It's your turn to talk."], [371.05, 373.57, "What makes employees want to stay with a company?"], [390.38, 391.94, "Now listen to Visal."], [392.24, 428.11, "Employees usually stay when they feel respected, fairly rewarded and able to grow. Salary matters, but research shows that a supportive manager and clear career opportunities are often more important. It is essential that people receive recognition for good work and training for the next step in their careers. For example, a bank that promotes tellers into supervisor roles shows staff they have a future there. In my view, a positive culture is the strongest reason anyone stays."], [428.41, 430.31, "Excellent answer, Visal!"], [431.22, 435.97, "Great work! Now you can use eight new words and it is essential that plus subjunctive."], [436.27, 439.7, "Today's value is respect. Thank the people who help us."], [440.0, 442.98, "See you in Unit twenty-three. Goodbye!"], [443.28, 445.85, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C1B4-Unit23-Project-Management": [[0.35, 5.47, "Hello, everyone! I'm Ms. Emma. Welcome to Online C one, Book four."], [5.77, 8.89, "Hi! I'm Visal. Let's learn together!"], [9.19, 17.74, "Unit twenty-three: Project Management. Today you will describe actions in progress at a future time with the future continuous."], [18.04, 20.64, "Here is our lesson map. Let's start!"], [21.6, 25.16, "Part one: words. You will learn eight new words."], [26.02, 26.84, "Project."], [27.85, 31.8, "Project means a planned piece of work with a specific goal and deadline."], [32.42, 35.21, "The bridge project is three months behind schedule."], [35.82, 38.5, "Your turn. Say: Project."], [41.37, 42.1, "Project."], [42.85, 43.75, "Scope."], [44.75, 48.21, "Scope means the agreed boundaries of what a project will deliver."], [48.82, 52.8, "Adding new features without approval is called scope creep."], [53.42, 55.66, "Your turn. Say: Scope."], [58.5, 59.4, "Scope."], [60.15, 60.98, "Timeline."], [61.98, 65.12, "Timeline means a schedule showing when tasks will happen."], [65.72, 68.27, "The timeline allows two weeks for testing."], [68.88, 72.06, "Your turn. Say: Timeline."], [74.9, 75.77, "Timeline."], [76.52, 77.74, "Milestone."], [78.75, 82.48, "Milestone means a significant point or achievement in a project."], [83.08, 85.81, "Finishing the foundations was a major milestone."], [86.42, 89.02, "Your turn. Say: Milestone."], [91.87, 92.83, "Milestone."], [93.58, 94.88, "Resources."], [95.88, 99.98, "Resources means the people, money and materials available for a project."], [100.58, 103.22, "We lack the resources to finish by June."], [103.82, 106.71, "Your turn. Say: Resources."], [109.57, 110.78, "Resources."], [111.52, 112.27, "Risk."], [113.28, 116.32, "Risk means a possible event that could harm the project."], [116.92, 119.47, "Heavy rain is the biggest risk during construction."], [120.08, 122.72, "Your turn. Say: Risk."], [125.57, 126.57, "Risk."], [127.32, 128.35, "Deliverable."], [129.35, 133.16, "Deliverable means a specific output a project must produce."], [133.75, 136.54, "The first deliverable is a working prototype."], [137.15, 139.9, "Your turn. Say: Deliverable."], [142.73, 143.85, "Deliverable."], [144.62, 145.39, "Agile."], [146.38, 150.23, "Agile means a flexible method that delivers work in short cycles."], [150.82, 153.72, "Agile teams review progress every two weeks."], [154.32, 156.63, "Your turn. Say: Agile."], [159.47, 160.33, "Agile."], [161.13, 164.85, "Part two: dialogue. Let's listen to a conversation."], [165.72, 170.78, "Visal, the school's new learning app is due in December. Where will the team be next month?"], [171.88, 179.78, "By next month, the team will be testing the app with two hundred students, so we'll be collecting feedback every day."], [180.88, 183.52, "And what if testing reveals serious problems?"], [184.62, 192.94, "That's why we built in a buffer. While the developers are fixing bugs, the designers will be preparing the training videos."], [194.05, 196.58, "Isn't the client asking for extra features?"], [197.68, 206.85, "Constantly. But we'll be protecting the scope. New requests go into phase two; otherwise the deadline will slip."], [208.0, 209.49, "Part three: grammar."], [210.35, 213.29, "Grammar focus: Future continuous."], [213.59, 214.8, "Look at the pattern."], [215.52, 219.08, "By next month, the team will be delivering the final product."], [219.98, 223.55, "This time next week, we will be testing the app with students."], [224.45, 228.19, "While the developers fix bugs, the designers will be preparing videos."], [229.13, 240.4, "Use the future continuous for actions in progress at a future moment (this time tomorrow, we'll be travelling) and for planned events (we'll be meeting the client on Friday). Do not use it with state verbs like know or own."], [241.15, 244.88, "Be careful! Don't say: Tomorrow we will delivering it."], [246.83, 249.08, "Say: Tomorrow we will be delivering it."], [249.38, 251.78, "Future continuous: will be + -ing."], [252.57, 255.2, "Part four: reading. Read and listen."], [256.0, 257.4, "Why Projects Fail."], [257.7, 263.47, "Project management aims to deliver a defined scope on time, within budget and to the required quality."], [264.47, 272.38, "Studies suggest that most failures result not from technical difficulties but from unclear goals, poor communication and uncontrolled scope creep."], [273.37, 281.17, "Traditional 'waterfall' planning sets the entire timeline in advance, whereas agile methods deliver small, usable increments every few weeks."], [282.17, 288.25, "A good project manager constantly asks what the team will be doing at each milestone and which risks could derail it."], [289.27, 295.69, "Ultimately, successful projects depend as much on managing people and expectations as on managing tasks."], [296.8, 300.64, "Part five: quiz. Five questions. Are you ready?"], [301.48, 304.28, "This time tomorrow, we blank the client."], [304.58, 308.3, "A, will meet. B, will be meeting. C, are meet."], [311.83, 314.1, "The answer is B: will be meeting."], [315.25, 318.56, "The agreed boundaries of what a project will deliver is its blank."], [318.86, 322.1, "A, scope. B, timeline. C, risk."], [325.63, 327.5, "The answer is A: scope."], [328.65, 332.15, "A significant point or achievement in a project is a blank."], [332.45, 336.66, "A, resource. B, deliverable. C, milestone."], [340.2, 342.28, "The answer is C: milestone."], [343.42, 345.18, "Choose the correct sentence."], [345.48, 352.98, "A, At 10 a.m. we will be presenting the plan.. B, At 10 a.m. we will presenting the plan.. C, At 10 a.m. we be presenting the plan.."], [356.53, 360.19, "The answer is A: At 10 a.m. we will be presenting the plan.."], [361.35, 365.05, "According to the reading, most project failures result from…"], [365.35, 371.19, "A, technical difficulties. B, unclear goals and poor communication. C, too much testing."], [374.73, 378.57, "The answer is B: unclear goals and poor communication."], [379.77, 382.96, "Part six: speaking. It's your turn to talk."], [383.82, 385.82, "What causes projects to fail?"], [402.62, 404.26, "Now listen to Visal."], [404.56, 444.14, "Projects usually fail because of unclear goals, unrealistic deadlines and poor communication rather than purely technical problems. When the scope keeps expanding without extra time or money, the team becomes overloaded and quality falls. For example, a construction project may collapse into delays if the client keeps changing the design. Another cause is ignoring risks such as the rainy season. In my view, a project succeeds when everyone knows exactly what they will be doing, why it matters and when it is due."], [444.44, 446.12, "Excellent answer, Visal!"], [447.02, 451.13, "Great work! Now you can use eight new words and future continuous."], [451.43, 456.06, "Today's value is planning ahead. Make a plan and take small steps every day."], [456.36, 459.12, "See you in Unit twenty-four. Goodbye!"], [459.42, 462.58, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C1B4-Unit24-E-commerce": [[0.35, 5.25, "Hello, everyone! I'm Ms. Emma. Welcome to Online C one, Book four."], [5.55, 9.01, "Hi! I'm Visal. Let's learn together!"], [9.31, 15.41, "Unit twenty-four: E-commerce. Today you will describe market change with the present perfect."], [15.71, 18.2, "Here is our lesson map. Let's start!"], [19.17, 22.89, "Part one: words. You will learn eight new words."], [23.75, 25.02, "E-commerce."], [26.02, 29.57, "E-commerce means buying and selling goods or services online."], [30.18, 34.2, "E-commerce has grown rapidly in Cambodia since 2020."], [34.82, 37.55, "Your turn. Say: E-commerce."], [40.4, 41.27, "E-commerce."], [42.02, 43.11, "Online store."], [44.12, 47.68, "Online store means a website or app where products are sold."], [48.28, 51.47, "Her online store ships handmade bags across Asia."], [52.08, 55.19, "Your turn. Say: Online store."], [58.03, 59.7, "Online store."], [60.45, 61.28, "Payment."], [62.28, 64.54, "Payment means the act or method of paying."], [65.15, 68.09, "QR payment has made online shopping far easier."], [68.68, 71.08, "Your turn. Say: Payment."], [73.93, 74.68, "Payment."], [75.42, 76.49, "Logistics."], [77.48, 80.88, "Logistics means the organisation of storage and delivery."], [81.48, 84.98, "Reliable logistics are the backbone of e-commerce."], [85.58, 88.15, "Your turn. Say: Logistics."], [91.0, 92.12, "Logistics."], [92.88, 93.76, "Customer."], [94.75, 97.98, "Customer means a person who buys goods or services."], [98.58, 101.04, "Every customer receives a tracking number."], [101.65, 104.26, "Your turn. Say: Customer."], [107.1, 108.02, "Customer."], [108.78, 109.66, "Platform."], [110.65, 114.08, "Platform means a digital service that connects buyers and sellers."], [114.68, 118.28, "Small sellers rely on platforms such as Facebook Marketplace."], [118.88, 121.57, "Your turn. Say: Platform."], [124.43, 125.58, "Platform."], [126.35, 127.1, "Review."], [128.08, 131.13, "Review means a customer's published opinion of a product."], [131.72, 134.2, "One honest review persuaded me to buy it."], [134.82, 137.18, "Your turn. Say: Review."], [140.03, 140.92, "Review."], [141.68, 142.56, "Trust."], [143.55, 146.79, "Trust means confidence that a seller is honest and reliable."], [147.38, 150.37, "Cash on delivery helped build trust with new buyers."], [150.98, 153.32, "Your turn. Say: Trust."], [156.17, 157.02, "Trust."], [157.83, 161.87, "Part two: dialogue. Let's listen to a conversation."], [162.72, 168.86, "Visal, your grandmother has sold fabric at Psar Thmei for forty years. Has online shopping affected her?"], [169.95, 177.29, "Enormously. Her sales have fallen since younger customers started buying on Facebook and TikTok Shop."], [178.38, 180.66, "Has she tried selling online herself?"], [181.75, 190.25, "She has, with my help. We've opened a small online store, and she has already received orders from Battambang and even Paris."], [191.35, 193.14, "What has been the biggest challenge?"], [194.25, 203.04, "Trust. Customers can't touch the fabric, so we've added detailed videos, and her reviews have helped convince new buyers."], [204.2, 205.63, "Part three: grammar."], [206.48, 209.21, "Grammar focus: Present perfect for change."], [209.51, 210.7, "Look at the pattern."], [211.42, 213.95, "Online shopping has transformed retail."], [214.85, 217.71, "Her sales have fallen since 2020."], [218.62, 222.03, "Mobile payments have recently made online shopping easier."], [222.97, 235.73, "Use the present perfect for changes that began in the past and continue to affect the present, often with since, for, recently, already or so far. With a finished time (in 2019, last year), use the past simple."], [236.48, 240.47, "Be careful! Don't say: Online shopping has transform retail."], [242.43, 245.41, "Say: Online shopping has transformed retail."], [245.71, 247.72, "Has + past participle."], [248.53, 251.02, "Part four: reading. Read and listen."], [251.83, 253.4, "The Market in Your Pocket."], [253.7, 261.24, "E-commerce has transformed retail across Southeast Asia, where many consumers have skipped computers and gone straight to smartphones."], [262.23, 268.7, "In Cambodia, the spread of QR payments has made it possible for even small vendors to accept money instantly."], [269.7, 275.45, "Social media platforms have become marketplaces, blurring the line between entertainment and shopping."], [276.43, 283.08, "However, trust remains a major barrier, so cash on delivery and customer reviews have played a crucial role."], [284.07, 289.97, "Traditional markets have not disappeared; instead, many sellers have combined physical stalls with online stores."], [291.07, 295.1, "Part five: quiz. Five questions. Are you ready?"], [295.95, 298.17, "Prices blank steadily since last year."], [298.47, 301.88, "A, rose. B, have risen. C, have rose."], [305.43, 307.53, "The answer is B: have risen."], [308.68, 312.09, "A digital service that connects buyers and sellers is a blank."], [312.39, 316.66, "A, platform. B, payment. C, review."], [320.2, 322.51, "The answer is A: platform."], [323.65, 326.8, "Confidence that a seller is honest and reliable is blank."], [327.1, 331.32, "A, logistics. B, e-commerce. C, trust."], [334.87, 336.99, "The answer is C: trust."], [338.15, 339.79, "Choose the correct sentence."], [340.09, 350.27, "A, E-commerce has grown in 2021.. B, E-commerce grew a lot since 2020.. C, E-commerce has grown a lot since 2020.."], [353.83, 358.46, "The answer is C: E-commerce has grown a lot since 2020.."], [359.62, 362.55, "According to the reading, many traditional sellers have…"], [362.85, 369.56, "A, closed their stalls. B, combined stalls with online stores. C, stopped using QR codes."], [373.1, 376.49, "The answer is B: combined stalls with online stores."], [377.7, 380.99, "Part six: speaking. It's your turn to talk."], [381.85, 384.77, "How has online shopping changed traditional markets?"], [401.58, 403.12, "Now listen to Visal."], [403.42, 441.31, "Online shopping has changed traditional markets in several important ways. First, many young customers have moved their spending to social media shops, so some market stalls have lost sales. Second, prices have become more transparent, because buyers can compare sellers instantly. However, traditional markets have also adapted: many vendors now accept QR payments and sell on Facebook or TikTok as well. In my view, online shopping has not destroyed markets but has forced them to become more competitive and digital."], [441.62, 443.38, "Excellent answer, Visal!"], [444.28, 449.29, "Great work! Now you can use eight new words and present perfect for change."], [449.59, 452.78, "Today's value is honesty. Always tell the truth."], [453.08, 456.11, "See you in Unit twenty-five. Goodbye!"], [456.41, 459.24, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C1B4-Unit25-Startups-in-Southeast-Asia": [[0.35, 5.37, "Hello, everyone! I'm Ms. Emma. Welcome to Online C one, Book four."], [5.67, 9.36, "Hi! I'm Visal. Let's learn together!"], [9.66, 16.98, "Unit twenty-five: Startups in Southeast Asia. Today you will describe companies concisely with reduced relative clauses."], [17.28, 20.2, "Here is our lesson map. Let's start!"], [21.17, 24.17, "Part one: words. You will learn eight new words."], [25.02, 26.02, "Startup."], [27.02, 30.91, "Startup means a newly established business aiming for rapid growth."], [31.52, 34.45, "The startup now employs sixty people in Phnom Penh."], [35.05, 37.73, "Your turn. Say: Startup."], [40.57, 41.59, "Startup."], [42.35, 43.14, "Founder."], [44.15, 47.12, "Founder means a person who establishes a company."], [47.72, 50.37, "Both founders studied computer science abroad."], [50.95, 53.16, "Your turn. Say: Founder."], [56.0, 56.8, "Founder."], [57.55, 58.64, "Investor."], [59.65, 63.34, "Investor means a person or firm that puts money into a business."], [63.95, 66.41, "A Malaysian investor led the funding round."], [67.02, 69.72, "Your turn. Say: Investor."], [72.57, 73.55, "Investor."], [74.28, 75.23, "Scale."], [76.22, 78.95, "Scale means to grow a business significantly."], [79.55, 81.99, "They plan to scale into Laos next year."], [82.58, 84.92, "Your turn. Say: Scale."], [87.77, 88.7, "Scale."], [89.45, 90.31, "Market."], [91.32, 94.19, "Market means the potential customers for a product."], [94.78, 97.87, "The Cambodian market is small but fast-growing."], [98.48, 101.03, "Your turn. Say: Market."], [103.87, 104.7, "Market."], [105.45, 106.47, "Innovation."], [107.48, 110.45, "Innovation means a new method, idea or product."], [111.05, 114.47, "Bakong was a regional innovation in central bank payments."], [115.05, 117.35, "Your turn. Say: Innovation."], [120.2, 121.29, "Innovation."], [122.05, 122.88, "Mobile."], [123.88, 126.21, "Mobile means relating to mobile phones."], [126.82, 129.79, "Mobile banking reached villages that never had a branch."], [130.38, 132.88, "Your turn. Say: Mobile."], [135.73, 136.58, "Mobile."], [137.35, 138.37, "Ecosystem."], [139.38, 143.79, "Ecosystem means the network of people and organisations that support startups."], [144.38, 148.46, "The startup ecosystem now includes incubators and angel investors."], [149.05, 151.95, "Your turn. Say: Ecosystem."], [154.8, 156.08, "Ecosystem."], [156.87, 160.11, "Part two: dialogue. Let's listen to a conversation."], [160.95, 166.26, "Visal, people say Cambodia's market is too small for startups. Do you agree?"], [167.35, 176.31, "Not entirely. Startups focusing on mobile payments have grown fast, because phones reached people before banks did."], [177.42, 180.8, "But can they compete with giants from Singapore and Indonesia?"], [181.88, 191.9, "Some can. Companies built for local needs often understand customers better than foreign firms trying to copy their home model."], [192.98, 195.27, "What does the ecosystem still lack?"], [196.38, 207.21, "Experienced investors and mentors. Founders backed by regional funds have scaled much faster than those relying only on savings."], [208.37, 210.26, "Part three: grammar."], [211.12, 214.25, "Grammar focus: Reduced relative clauses."], [214.55, 215.68, "Look at the pattern."], [216.38, 219.78, "Startups focusing on mobile payments have grown fast."], [220.68, 223.77, "Companies built for local needs understand customers better."], [224.68, 227.89, "Founders backed by regional funds have scaled faster."], [228.83, 242.51, "Reduce 'who/that + active verb' to an -ing form (startups that focus → startups focusing) and 'who/that + be + past participle' to the participle alone (firms that are built → firms built). The main verb must still agree with the noun."], [243.25, 247.77, "Be careful! Don't say: Startups focused on payments has grown."], [249.73, 252.95, "Say: Startups focused on payments have grown."], [253.25, 254.75, "Plural subject: have."], [255.57, 258.33, "Part four: reading. Read and listen."], [259.13, 260.66, "Leapfrogging the Region."], [260.96, 268.02, "Southeast Asia has become one of the world's most dynamic startup regions, home to more than ten companies valued above a billion dollars."], [269.03, 278.13, "Much of this growth comes from businesses solving problems created by limited infrastructure, such as unbanked populations and congested cities."], [279.13, 286.45, "In Cambodia, firms offering mobile wallets, food delivery and online education have attracted growing investment."], [287.47, 294.47, "Nevertheless, startups based in small markets often need to expand across borders quickly in order to reach profitable scale."], [295.47, 302.66, "Governments supporting incubators, digital skills and clear regulation are likely to see their ecosystems mature fastest."], [303.77, 307.5, "Part five: quiz. Five questions. Are you ready?"], [308.35, 311.82, "Students blank in Phnom Penh often use ride-hailing apps."], [312.12, 315.19, "A, live. B, living. C, lived."], [318.73, 320.7, "The answer is B: living."], [321.85, 324.55, "The network that supports startups is the blank."], [324.85, 328.59, "A, ecosystem. B, founder. C, market."], [332.13, 334.44, "The answer is A: ecosystem."], [335.58, 338.16, "To grow a business significantly is to blank."], [338.46, 341.81, "A, invest. B, found. C, scale."], [345.37, 347.18, "The answer is C: scale."], [348.32, 350.14, "Choose the correct sentence."], [350.44, 357.86, "A, Apps designed for farmers has spread.. B, Apps designed for farmers have spread.. C, Apps designing for farmers have spread.."], [361.4, 364.77, "The answer is B: Apps designed for farmers have spread.."], [365.92, 369.75, "According to the reading, startups in small markets often need to…"], [370.05, 375.56, "A, expand across borders quickly. B, avoid investors. C, stay very small."], [379.1, 382.41, "The answer is A: expand across borders quickly."], [383.6, 386.73, "Part six: speaking. It's your turn to talk."], [387.58, 390.01, "What problems could a Cambodian startup solve?"], [406.82, 408.32, "Now listen to Visal."], [408.62, 446.94, "A Cambodian startup could solve many everyday problems. For example, an app connecting farmers directly with restaurants could reduce waste and increase farmers' income. Another opportunity is affordable online tutoring for students living in rural provinces, where qualified teachers are scarce. Healthcare is also promising: a service offering simple telemedicine consultations could save patients long journeys. In my view, the best startups begin with a real local frustration rather than copying a foreign idea."], [447.24, 448.95, "Excellent answer, Visal!"], [449.85, 454.51, "Great work! Now you can use eight new words and reduced relative clauses."], [454.81, 460.62, "Today's value is innovation. Try new ideas boldly, and learn from every attempt."], [460.92, 464.0, "See you in Unit twenty-six. Goodbye!"], [464.3, 467.21, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C1B4-Unit26-Business-Communication": [[0.35, 5.26, "Hello, everyone! I'm Ms. Emma. Welcome to Online C one, Book four."], [5.56, 9.2, "Hi! I'm Visal. Let's learn together!"], [9.5, 16.16, "Unit twenty-six: Business Communication. Today you will make polite formal requests (I would appreciate it if…)."], [16.46, 19.09, "Here is our lesson map. Let's start!"], [20.03, 23.46, "Part one: words. You will learn eight new words."], [24.32, 25.18, "Email."], [26.18, 29.05, "Email means a message sent electronically."], [29.65, 31.91, "Keep a business email short and clear."], [32.52, 35.51, "Your turn. Say: Email."], [38.37, 39.4, "Email."], [40.15, 40.99, "Report."], [41.98, 45.82, "Report means a formal document presenting information or findings."], [46.42, 48.61, "The quarterly report is due on Friday."], [49.22, 51.89, "Your turn. Say: Report."], [54.73, 55.72, "Report."], [56.48, 57.29, "Meeting."], [58.28, 61.01, "Meeting means a planned discussion between people."], [61.62, 63.57, "Send the agenda before the meeting."], [64.18, 66.37, "Your turn. Say: Meeting."], [69.23, 69.96, "Meeting."], [70.72, 71.81, "Concise."], [72.82, 75.52, "Concise means expressing much in few words."], [76.12, 78.72, "A concise summary saves the reader's time."], [79.32, 81.86, "Your turn. Say: Concise."], [84.7, 85.84, "Concise."], [86.58, 87.34, "Tone."], [88.35, 91.55, "Tone means the attitude expressed in writing or speech."], [92.15, 94.07, "Her tone was firm but polite."], [94.68, 96.75, "Your turn. Say: Tone."], [99.6, 100.52, "Tone."], [101.28, 102.3, "Audience."], [103.28, 106.44, "Audience means the people who will read or hear a message."], [107.05, 109.29, "Adapt your language to your audience."], [109.88, 112.33, "Your turn. Say: Audience."], [115.17, 116.12, "Audience."], [116.88, 117.79, "Feedback."], [118.78, 121.6, "Feedback means comments on how well something was done."], [122.18, 125.02, "Constructive feedback helped him improve the proposal."], [125.62, 127.97, "Your turn. Say: Feedback."], [130.83, 131.81, "Feedback."], [132.55, 133.63, "Professional."], [134.62, 138.08, "Professional means showing the skills and manners expected at work."], [138.68, 141.96, "A professional signature includes your title and phone number."], [142.55, 145.12, "Your turn. Say: Professional."], [147.97, 148.93, "Professional."], [149.73, 153.15, "Part two: dialogue. Let's listen to a conversation."], [154.02, 159.48, "Visal, a supplier has delivered the wrong fabric twice. Should I write 'Send the right order now'?"], [160.58, 169.32, "That tone is too blunt. Try: 'I would appreciate it if you could replace the order by Friday.' It's firm but professional."], [170.42, 173.38, "Isn't that too soft? We've lost a week."], [174.48, 184.03, "Be clear about consequences, politely: 'We would be grateful if you could confirm a delivery date, as further delays will affect our customers.'"], [185.12, 187.26, "Should I mention that it's the second time?"], [188.35, 195.74, "Yes, factually, without blame. And end constructively: 'I look forward to resolving this quickly.'"], [196.9, 198.28, "Part three: grammar."], [199.15, 202.64, "Grammar focus: Formal requests (I would appreciate it if)."], [202.94, 204.12, "Look at the pattern."], [204.82, 207.51, "I would appreciate it if you could reply by Friday."], [208.42, 211.37, "We would be grateful if you could confirm the delivery date."], [212.28, 215.14, "Would it be possible for you to send the report today?"], [216.1, 224.19, "Don't forget 'it': I would appreciate IT if…. Other formal requests: Could you possibly…? Would you mind + -ing? I was wondering if you could…"], [224.95, 228.52, "Be careful! Don't say: I would appreciate if you reply."], [230.47, 233.85, "Say: I would appreciate it if you could reply."], [234.15, 235.67, "Appreciate it if…"], [236.47, 238.92, "Part four: reading. Read and listen."], [239.73, 241.49, "Clear, Concise, Courteous."], [241.79, 247.14, "Effective business communication delivers the right message to the right audience in the most efficient way."], [248.13, 254.82, "Readers often decide within seconds whether an email deserves attention, so the purpose should appear in the first two lines."], [255.83, 262.37, "Concise writing respects the reader's time, while a polite tone preserves relationships even when the message is unwelcome."], [263.37, 269.13, "Formal request structures, such as 'I would appreciate it if you could…', allow writers to be firm without sounding aggressive."], [270.13, 278.05, "Cultural awareness also matters: directness admired in some countries may seem rude in Cambodia, where indirect politeness is valued."], [279.17, 283.49, "Part five: quiz. Five questions. Are you ready?"], [284.35, 286.72, "I would appreciate blank if you could call me."], [287.02, 289.72, "A, that. B, it. C, this."], [293.27, 294.91, "The answer is B: it."], [296.05, 298.63, "Expressing much in few words is being blank."], [298.93, 302.67, "A, concise. B, professional. C, formal."], [306.2, 308.32, "The answer is A: concise."], [309.45, 311.77, "The people who will read a message are its blank."], [312.07, 315.6, "A, feedback. B, tone. C, audience."], [319.17, 321.41, "The answer is C: audience."], [322.55, 324.56, "Choose the most polite request."], [324.86, 331.57, "A, Send me the file now.. B, I would appreciate it if you could send me the file.. C, You must send the file.."], [335.13, 339.11, "The answer is B: I would appreciate it if you could send me the file.."], [340.25, 343.4, "According to the reading, the purpose of an email should appear…"], [343.7, 348.58, "A, at the end. B, in the first two lines. C, in the subject only."], [352.13, 354.84, "The answer is B: in the first two lines."], [356.03, 359.0, "Part six: speaking. It's your turn to talk."], [359.85, 362.23, "What makes a business email effective?"], [379.02, 380.4, "Now listen to Visal."], [380.7, 414.52, "An effective business email is clear, concise and polite. The subject line should state the purpose, and the first sentence should explain exactly what the writer needs. Long background stories make readers lose patience, so it is better to use short paragraphs or bullet points. The tone matters too: a request such as 'I would appreciate it if you could reply by Friday' is far more persuasive than a demand. Finally, a professional email ends with a clear next step and a polite closing."], [414.82, 416.49, "Excellent answer, Visal!"], [417.38, 422.86, "Great work! Now you can use eight new words and formal requests (i would appreciate it if)."], [423.16, 428.64, "Today's value is professionalism. Be prepared, polite and reliable in everything you do."], [428.94, 431.78, "See you in Unit twenty-seven. Goodbye!"], [432.08, 434.46, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C1B4-Unit27-Operations-Management": [[0.35, 5.3, "Hello, everyone! I'm Ms. Emma. Welcome to Online C one, Book four."], [5.6, 8.91, "Hi! I'm Visal. Let's learn together!"], [9.21, 17.21, "Unit twenty-seven: Operations Management. Today you will describe services arranged for a company with causative have / get."], [17.51, 20.07, "Here is our lesson map. Let's start!"], [21.03, 24.37, "Part one: words. You will learn eight new words."], [25.22, 26.52, "Operations."], [27.52, 31.93, "Operations means the day-to-day activities that produce goods or services."], [32.52, 34.99, "Operations run from 6 a.m. to midnight."], [35.58, 38.1, "Your turn. Say: Operations."], [40.93, 42.12, "Operations."], [42.88, 44.06, "Efficiency."], [45.05, 48.51, "Efficiency means achieving maximum output with minimum waste."], [49.12, 52.48, "New machines improved efficiency by 15%."], [53.08, 55.9, "Your turn. Say: Efficiency."], [58.73, 59.83, "Efficiency."], [60.58, 61.58, "Process."], [62.58, 65.83, "Process means a series of steps taken to achieve a result."], [66.42, 68.89, "The ordering process now takes three clicks."], [69.48, 72.64, "Your turn. Say: Process."], [75.5, 76.66, "Process."], [77.42, 78.19, "Quality."], [79.18, 82.26, "Quality means the standard of something compared with others."], [82.85, 85.13, "Quality checks happen at every stage."], [85.72, 88.01, "Your turn. Say: Quality."], [90.87, 91.79, "Quality."], [92.55, 93.68, "Inventory."], [94.68, 97.79, "Inventory means the stock of goods a business holds."], [98.38, 100.62, "They count inventory every Saturday."], [101.22, 104.36, "Your turn. Say: Inventory."], [107.2, 108.33, "Inventory."], [109.08, 110.04, "Bottleneck."], [111.05, 114.84, "Bottleneck means a point where work slows down and causes delays."], [115.45, 117.86, "The packing station was the main bottleneck."], [118.45, 120.94, "Your turn. Say: Bottleneck."], [123.8, 124.74, "Bottleneck."], [125.48, 126.6, "Productivity."], [127.62, 130.89, "Productivity means the amount produced per worker or per hour."], [131.48, 134.45, "Productivity rose after the layout changed."], [135.05, 137.9, "Your turn. Say: Productivity."], [140.73, 141.83, "Productivity."], [142.58, 143.44, "Lean."], [144.45, 147.24, "Lean means focused on eliminating waste."], [147.85, 150.31, "Lean methods cut waiting time in the clinic."], [150.92, 153.32, "Your turn. Say: Lean."], [156.17, 157.06, "Lean."], [157.87, 161.65, "Part two: dialogue. Let's listen to a conversation."], [162.48, 169.45, "Visal, the noodle factory in Kandal can't meet demand. The owner wants to buy more machines. Is that the answer?"], [170.55, 178.49, "Not yet. First he should have his processes reviewed. An expert found the real bottleneck was packing, not cooking."], [179.58, 181.65, "So the new machines would be wasted?"], [182.75, 191.16, "Probably. He got the packing line redesigned for $3,000, and output rose 20% without a single new machine."], [192.25, 193.58, "What's his next step?"], [194.68, 201.55, "He's having his inventory system digitised, so ingredients never run out on busy days."], [202.7, 204.59, "Part three: grammar."], [205.45, 208.22, "Grammar focus: Causative have and get."], [208.52, 209.75, "Look at the pattern."], [210.45, 212.68, "The company had its processes reviewed."], [213.58, 215.75, "He got the packing line redesigned."], [216.65, 219.38, "We are having our inventory system digitised."], [220.33, 231.67, "Use 'have/get + object + past participle' when someone else does a service for you. Word order matters: We had our accounts reviewed (a service) ≠ We had reviewed our accounts (we did it ourselves)."], [232.42, 236.8, "Be careful! Don't say: We had reviewed our accounts by an expert."], [238.73, 241.5, "Say: We had our accounts reviewed by an expert."], [241.8, 244.38, "Have + object + past participle."], [245.17, 247.94, "Part four: reading. Read and listen."], [248.73, 250.03, "Finding the Bottleneck."], [250.32, 258.55, "Operations management focuses on turning inputs such as labour, materials and energy into goods and services as efficiently as possible."], [259.53, 265.3, "A central insight is that a system can only move as fast as its slowest step, known as the bottleneck."], [266.3, 274.19, "Lean thinking, developed by Toyota, encourages firms to eliminate waste such as waiting, excess inventory and unnecessary movement."], [275.2, 280.66, "Many small businesses improve dramatically simply by having their workflow mapped and analysed by an outsider."], [281.67, 287.36, "Productivity gains therefore often come from smarter processes rather than from larger investments in equipment."], [288.47, 292.58, "Part five: quiz. Five questions. Are you ready?"], [293.45, 295.4, "We had the machine blank yesterday."], [295.7, 300.36, "A, repair. B, repaired. C, repairing."], [303.9, 305.96, "The answer is B: repaired."], [307.12, 309.59, "A point where work slows down is a blank."], [309.89, 313.52, "A, bottleneck. B, process. C, quality."], [317.07, 319.03, "The answer is A: bottleneck."], [320.18, 323.11, "The amount produced per worker or per hour is blank."], [323.41, 327.77, "A, inventory. B, efficiency. C, productivity."], [331.33, 334.04, "The answer is C: productivity."], [335.18, 337.17, "Choose the correct sentence."], [337.47, 344.57, "A, She got her laptop fixed.. B, She got fixed her laptop.. C, She got her laptop fix.."], [348.13, 351.19, "The answer is A: She got her laptop fixed.."], [352.35, 355.67, "According to the reading, a system moves only as fast as…"], [355.97, 360.56, "A, its newest machine. B, its slowest step. C, its manager."], [364.1, 366.76, "The answer is B: its slowest step."], [367.97, 371.18, "Part six: speaking. It's your turn to talk."], [372.02, 374.55, "How can a small business work more efficiently?"], [391.35, 392.77, "Now listen to Visal."], [393.07, 428.2, "A small business can work more efficiently by identifying where time and money are wasted. First, the owner could have the whole process mapped from order to delivery, which often reveals a single bottleneck. Second, simple tools such as digital inventory records or online ordering can remove repetitive manual work. For example, a bakery might discover that bakers spend an hour daily searching for ingredients. Finally, staff should be asked for ideas, because they see problems that managers miss."], [428.5, 430.18, "Excellent answer, Visal!"], [431.08, 435.3, "Great work! Now you can use eight new words and causative have and get."], [435.6, 439.37, "Today's value is thoroughness. Do the whole job, and do it well."], [439.67, 442.39, "See you in Unit twenty-eight. Goodbye!"], [442.69, 445.38, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C1B4-Unit28-Social-Entrepreneurship": [[0.35, 5.27, "Hello, everyone! I'm Ms. Emma. Welcome to Online C one, Book four."], [5.57, 8.87, "Hi! I'm Visal. Let's learn together!"], [9.17, 15.7, "Unit twenty-eight: Social Entrepreneurship. Today you will combine aims with both … and / either … or."], [16.0, 18.69, "Here is our lesson map. Let's start!"], [19.63, 22.65, "Part one: words. You will learn eight new words."], [23.48, 25.26, "Social enterprise."], [26.25, 31.99, "Social enterprise means a business that trades to achieve a social or environmental mission."], [32.58, 36.31, "The social enterprise trains former street children as chefs."], [36.92, 39.91, "Your turn. Say: Social enterprise."], [42.77, 44.58, "Social enterprise."], [45.32, 46.18, "Mission."], [47.18, 49.94, "Mission means an organisation's core purpose."], [50.55, 53.28, "Their mission is to give rural women a steady income."], [53.88, 56.26, "Your turn. Say: Mission."], [59.1, 59.9, "Mission."], [60.65, 61.7, "Impact."], [62.68, 66.24, "Impact means the positive change an organisation creates."], [66.85, 69.85, "They measure impact by the number of graduates employed."], [70.45, 72.88, "Your turn. Say: Impact."], [75.73, 76.75, "Impact."], [77.48, 78.25, "Profit."], [79.25, 81.92, "Profit means money earned after costs are paid."], [82.52, 85.14, "Profit is reinvested in training programmes."], [85.75, 88.62, "Your turn. Say: Profit."], [91.47, 92.31, "Profit."], [93.05, 94.1, "Community."], [95.08, 99.32, "Community means a group of people living in the same place or sharing interests."], [99.92, 103.17, "The whole community benefits from the clean water project."], [103.78, 106.68, "Your turn. Say: Community."], [109.53, 110.51, "Community."], [111.25, 112.58, "Sustainability."], [113.58, 117.5, "Sustainability means the ability to continue over a long period."], [118.08, 121.51, "Selling products gives the project financial sustainability."], [122.12, 125.58, "Your turn. Say: Sustainability."], [128.43, 129.83, "Sustainability."], [130.58, 131.71, "Innovation."], [132.72, 135.2, "Innovation means a creative new solution."], [135.82, 138.57, "Their key innovation was recycled-tyre sandals."], [139.18, 141.94, "Your turn. Say: Innovation."], [144.8, 145.89, "Innovation."], [146.65, 147.79, "Beneficiary."], [148.78, 152.12, "Beneficiary means a person who receives help or benefit."], [152.72, 155.59, "Each beneficiary receives six months of training."], [156.18, 158.64, "Your turn. Say: Beneficiary."], [161.5, 162.64, "Beneficiary."], [163.43, 167.32, "Part two: dialogue. Let's listen to a conversation."], [168.15, 173.81, "Visal, the training restaurant in Siem Reap serves excellent food. Is it a charity or a business?"], [174.92, 184.16, "It's both a business and a social mission. Tourists pay normal prices, and the profit funds training for disadvantaged young people."], [185.25, 187.64, "Why not simply rely on donations?"], [188.75, 195.92, "Donations can stop at any time. Trading gives both independence and long-term sustainability."], [197.02, 199.41, "Do they ever face difficult choices?"], [200.52, 207.67, "Often. They must either raise prices or train fewer students, so measuring impact helps them decide."], [208.83, 210.46, "Part three: grammar."], [211.32, 214.62, "Grammar focus: Both and and either or."], [214.92, 216.23, "Look at the pattern."], [216.92, 219.82, "Social enterprises seek both profit and impact."], [220.72, 224.0, "They must either raise prices or train fewer students."], [224.92, 228.28, "Trading provides both independence and sustainability."], [229.23, 238.8, "'Both … and' adds two things together and takes a plural verb: Both profit and impact matter. 'Either … or' offers a choice. Keep both parts grammatically parallel."], [239.55, 244.14, "Be careful! Don't say: They seek both profit or impact."], [246.1, 248.66, "Say: They seek both profit and impact."], [248.96, 249.96, "Both … and."], [250.77, 253.3, "Part four: reading. Read and listen."], [254.1, 256.01, "Doing Well by Doing Good."], [256.31, 261.95, "Social entrepreneurship combines the problem-solving energy of business with the purpose of a charity."], [262.97, 270.84, "Unlike traditional charities, social enterprises earn revenue by selling goods or services, which reduces dependence on donors."], [271.83, 279.44, "Cambodia has become known for such enterprises, from restaurants training vulnerable youth to workshops employing people with disabilities."], [280.43, 287.25, "These organisations constantly balance commercial pressure with their mission, and either goal can suffer if the other dominates."], [288.27, 294.27, "Success is measured both by financial results and by the lasting change experienced by beneficiaries."], [295.37, 299.76, "Part five: quiz. Five questions. Are you ready?"], [300.62, 303.45, "The project helps blank farmers and their families."], [303.75, 306.71, "A, either. B, both. C, neither."], [310.27, 312.21, "The answer is B: both."], [313.35, 315.95, "A person who receives help or benefit is a blank."], [316.25, 320.24, "A, beneficiary. B, mission. C, community."], [323.8, 325.99, "The answer is A: beneficiary."], [327.15, 329.75, "An organisation's core purpose is its blank."], [330.05, 333.72, "A, profit. B, innovation. C, mission."], [337.27, 338.85, "The answer is C: mission."], [339.98, 341.75, "Choose the correct sentence."], [342.05, 349.11, "A, Both price or quality matter.. B, Both price and quality matter.. C, Both price and quality matters.."], [352.67, 355.67, "The answer is B: Both price and quality matter.."], [356.82, 361.08, "According to the reading, social enterprises reduce dependence on donors by…"], [361.38, 365.73, "A, earning revenue. B, cutting staff. C, avoiding profit."], [369.27, 371.65, "The answer is A: earning revenue."], [372.83, 376.1, "Part six: speaking. It's your turn to talk."], [376.95, 379.66, "What social problem could a business help solve?"], [396.45, 397.82, "Now listen to Visal."], [398.12, 433.22, "A business could help solve youth unemployment, which affects many young Cambodians who lack practical skills. For example, a social enterprise café could both serve customers and train young people from poor families in cooking, service and English. Its profits would pay for each trainee's course, while graduates would gain employment in hotels. In my view, businesses can sometimes solve problems more sustainably than charities, because they generate their own funding."], [433.52, 435.4, "Excellent answer, Visal!"], [436.32, 440.64, "Great work! Now you can use eight new words and both and and either or."], [440.94, 446.68, "Today's value is social impact. Use your skills and ideas to improve other people's lives."], [446.98, 449.82, "See you in Unit twenty-nine. Goodbye!"], [450.12, 452.42, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C1B4-Unit29-Review-Case-Study-Analysis": [[0.35, 5.05, "Hello, everyone! I'm Ms. Emma. Welcome to Online C one, Book four."], [5.35, 8.69, "Hi! I'm Visal. Let's learn together!"], [8.99, 16.38, "Unit twenty-nine: Review: Case Study Analysis. Today you will evaluate past business decisions with should + perfect."], [16.68, 19.34, "Here is our lesson map. Let's start!"], [20.3, 23.6, "Part one: words. You will learn eight new words."], [24.45, 25.43, "Case study."], [26.42, 30.26, "Case study means a detailed analysis of a real situation."], [30.85, 33.59, "The case study examined a failed coffee chain."], [34.18, 37.1, "Your turn. Say: Case study."], [39.97, 40.97, "Case study."], [41.72, 42.54, "Problem."], [43.55, 46.38, "Problem means a difficulty that needs to be solved."], [46.98, 49.69, "Define the problem before suggesting solutions."], [50.28, 52.63, "Your turn. Say: Problem."], [55.5, 56.21, "Problem."], [56.95, 58.14, "Analysis."], [59.15, 62.9, "Analysis means detailed examination of the elements of something."], [63.52, 66.5, "Her analysis identified three root causes."], [67.12, 69.59, "Your turn. Say: Analysis."], [72.43, 73.6, "Analysis."], [74.35, 75.35, "Option."], [76.35, 78.65, "Option means a possible choice."], [79.25, 81.63, "We compared three options for expansion."], [82.22, 85.07, "Your turn. Say: Option."], [87.9, 88.75, "Option."], [89.52, 90.91, "Recommendation."], [91.92, 95.4, "Recommendation means a suggestion about the best course of action."], [96.02, 98.39, "The report ends with a clear recommendation."], [98.98, 101.39, "Your turn. Say: Recommendation."], [104.23, 105.79, "Recommendation."], [106.55, 107.61, "Evidence."], [108.62, 111.71, "Evidence means facts or data that support a conclusion."], [112.32, 114.88, "Every claim must be supported by evidence."], [115.48, 118.2, "Your turn. Say: Evidence."], [121.07, 122.06, "Evidence."], [122.82, 124.13, "Implementation."], [125.12, 128.71, "Implementation means the process of putting a d and listen."], [250.03, 251.6, "Thinking Like a Consultant."], [251.9, 258.18, "A business case study presents a real situation and asks the reader to diagnose problems and recommend solutions."], [259.17, 266.91, "Strong analysis begins by separating symptoms, such as falling sales, from root causes, such as poor positioning or weak cash management."], [267.9, 275.56, "Analysts then generate several options and evaluate each against evidence, cost and risk rather than choosing the first attractive idea."], [276.57, 284.27, "Looking back, it is easy to say what a company should have done, so good analysis also asks what managers could reasonably have known at the time."], [285.27, 292.58, "Finally, every recommendation needs a realistic implementation plan, because even the best strategy fails without execution."], [293.7, 297.92, "Part five: quiz. Five questions. Are you ready?"], [298.78, 300.85, "They blank the contract more carefully."], [301.15, 305.36, "A, should read. B, should have read. C, should had read."], [308.9, 310.88, "The answer is B: should have read."], [312.02, 314.97, "A suggestion about the best course of action is a blank."], [315.27, 319.32, "A, recommendation. B, problem. C, case study."], [322.87, 324.92, "The answer is A: recommendation."], [326.08, 328.99, "The process of putting a plan into action is blank."], [329.29, 333.07, "A, evidence. B, outcome. C, implementation."], [336.63, 339.21, "The answer is C: implementation."], [340.35, 342.12, "Choose the correct sentence."], [342.42, 348.67, "A, They shouldn't have spent so much.. B, They shouldn't had spent so much.. C, They shouldn't have spend so much.."], [352.23, 355.4, "The answer is A: They shouldn't have spent so much.."], [356.55, 360.42, "According to the reading, strong analysis separates symptoms from…"], [360.72, 364.67, "A, root causes. B, customers. C, profits."], [368.23, 370.14, "The answer is A: root causes."], [371.33, 374.43, "Part six: speaking. It's your turn to talk."], [375.28, 378.75, "What is the most important step in analysing a business case?"], [395.55, 397.22, "Now listen to Visal."], [397.52, 432.27, "In my view, the most important step is defining the real problem correctly. Many students jump to solutions, such as cutting prices, when falling sales are only a symptom of a deeper cause like poor positioning or weak management. Once the root cause is clear, the analyst can compare options using evidence. For example, a company that blamed competitors should have examined its own customer service first. A precise diagnosis makes every later recommendation stronger and more realistic."], [432.57, 434.24, "Excellent answer, Visal!"], [435.15, 440.01, "Great work! Now you can use eight new words and should plus perfect for evaluation."], [440.31, 445.07, "Today's value is critical thinking. Think carefully and give reasons for your opinions."], [445.37, 451.25, "Congratulations! You have finished Online C one, Book four. See you in Online C two!"], [451.55, 454.36, "Thank you, Ms. Emma! Bye, everyone!"]]};
        // English subtitles: added to the player with code, so no subtitle files are needed online.
        let subsOn = true;
        function addSubtitles(el) {
            const cues = SUBTITLES[(el.getAttribute('src') || '').split('/').pop().split('?')[0].replace('.mp4', '')]; const btn = document.getElementById('subs-btn');
            if (!cues || !el.addTextTrack || typeof VTTCue === 'undefined') { if (btn) btn.style.display = 'none'; return; }
            const tr = el.addTextTrack('subtitles', 'English', 'en');
            cues.forEach(c => { try { const q = new VTTCue(c[0], c[1], c[2]); q.line = -2; tr.addCue(q); } catch (e) {} });
            const apply = () => { tr.mode = subsOn ? 'showing' : 'hidden'; if (btn) btn.textContent = subsOn ? '💬 Subtitles: ON' : '💬 Subtitles: OFF'; };
            if (btn) btn.onclick = () => { subsOn = !subsOn; apply(); };
            apply();
        }
        function renderMp4Lesson(contentDiv, unitData) {
            contentDiv.innerHTML = `
                <h2 class="text-xl font-bold text-indigo-900 mb-2">📹 Video Lesson — Unit ${state.unit}: ${unitData.title}</h2>

                    <video id="mp4-player" src="${ytCurrentConfig.mp4}" controls playsinline preload="metadata" class="w-full h-full" style="object-fit:contain;"></video>
                    <div id="checkpoint-overlay" class="absolute inset-0 bg-indigo-900/95 flex items-center justify-center p-6" style="display:none;"></div>
                </div>
                <p id="video-msg" class="text-sm text-gray-500 mt-3 text-center min-h-[1.25rem]">▶️ Press play to start the lesson!</p>
                <div class="text-center mt-2 flex justify-center gap-3 flex-wrap"><button id="subs-btn" class="bg-white border border-indigo-300 text-indigo-700 font-bold px-4 py-2 rounded-full shadow cursor-pointer">💬 Subtitles: ON</button><button onclick="nextLesson()" class="bg-emerald-700 hover:bg-emerald-800 text-white font-bold px-4 py-2 rounded-full shadow cursor-pointer">Next Lesson ▶️</button></div>`;
            const el = document.getElementById('mp4-player');

            { const a = document.getElementById('footer-next-module'), b = document.getElementById('footer-next-lesson'); if (a) a.style.display = ''; if (b) b.style.display = 'none'; }
            ytPlayer = {

                pauseVideo: () => el.pause(),
                playVideo: () => { const p = el.play(); if (p && p.catch) p.catch(() => {}); },
                destroy: () => { try { el.pause(); el.removeAttribute('src'); el.load(); } catch (e) {} }
            };
            el.addEventListener('play', () => { const m = document.getElementById('video-msg'); if (m) m.textContent = ''; });
            el.addEventListener('timeupdate', () => { if (ytCurrentConfig && ytCurrentConfig.checkpoints.length) checkVideoCheckpoints(); });

            });
        }

        function onYtStateChange(event) {
            const msg = document.getElementById('video-msg');

                if (ytPollInterval) clearInterval(ytPollInterval);
                if (ytCurrentConfig && ytCurrentConfig.checkpoints.length) ytPollInterval = setInterval(checkVideoCheckpoints, 400);

            } else if (event.data === YT.PlayerState.PAUSED || event.data === YT.PlayerState.ENDED) {
                if (ytPollInterval) { clearInterval(ytPollInterval); ytPollInterval = null; }

        function checkVideoCheckpoints() {

            } else {

        function renderReading(contentDiv, unitData) {
