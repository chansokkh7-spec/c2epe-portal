.99, "Grammar focus: Willingness and ability plus infinitive."], [231.29, 232.47, "Look at the pattern."], [233.18, 236.31, "Successful founders show a willingness to pivot."], [237.22, 240.34, "She has the ability to recognise hidden opportunities."], [241.25, 244.26, "Many start-ups lack the capacity to scale quickly."], [245.2, 254.8, "Nouns such as willingness, ability, capacity, determination and readiness are followed by 'to + base verb', not '-ing': a willingness to learn (not 'a willingness learning')."], [255.55, 259.49, "Be careful! Don't say: She showed a willingness pivoting."], [261.43, 264.35, "Say: She showed a willingness to pivot."], [264.65, 266.66, "Willingness + to-infinitive."], [267.47, 270.06, "Part four: reading. Read and listen."], [270.87, 272.33, "Why Founders Pivot."], [272.63, 279.44, "Entrepreneurship theory once portrayed founders as lone geniuses who executed a perfect idea from the start."], [280.43, 286.07, "Research now suggests that success depends far more on the ability to learn quickly from customers."], [287.07, 294.06, "Most start-ups begin with a minimum viable product, which reveals what buyers genuinely want rather than what the founder imagined."], [295.07, 302.15, "A willingness to pivot, sometimes several times, distinguishes resilient entrepreneurs from those who cling to failing plans."], [303.17, 310.95, "In Cambodia's young digital economy, founders who combine bold vision with humble listening are increasingly attracting regional investors."], [312.03, 315.9, "Part five: quiz. Five questions. Are you ready?"], [316.75, 320.0, "Investors value a founder's willingness blank feedback."], [320.3, 324.22, "A, accepting. B, to accept. C, accept."], [327.77, 330.02, "The answer is B: to accept."], [331.18, 334.23, "Building a business without outside investors is blank."], [334.53, 338.87, "A, bootstrapping. B, a pivot. C, scalability."], [342.4, 345.07, "The answer is A: bootstrapping."], [346.22, 349.55, "The simplest version of a product that can be tested is a blank."], [349.85, 354.11, "A, vision. B, risk tolerance. C, minimum viable product."], [357.67, 360.6, "The answer is C: minimum viable product."], [361.75, 363.4, "Choose the correct sentence."], [363.7, 371.07, "A, She lacks the ability to delegate.. B, She lacks the ability delegating.. C, She lacks the ability of delegate.."], [374.63, 378.11, "The answer is A: She lacks the ability to delegate.."], [379.25, 382.5, "According to the reading, success depends more on the ability to…"], [382.8, 387.81, "A, learn quickly from customers. B, work alone. C, avoid all risk."], [391.37, 394.77, "The answer is A: learn quickly from customers."], [395.97, 398.97, "Part six: speaking. It's your turn to talk."], [399.82, 403.23, "Why might a founder need to 'pivot' their original business idea?"], [420.02, 421.57, "Now listen to Visal."], [421.88, 456.88, "A founder might need to pivot because real customers often behave differently from what the business plan assumed. For example, an app designed for tourists might discover that local families use it far more. Rather than ignoring this evidence, a wise founder shows a willingness to change direction while keeping the deeper mission. Pivoting can feel like admitting failure, but it is often the moment when a start-up finally finds a sustainable market. The real failure is refusing to adapt."], [457.18, 458.77, "Excellent answer, Visal!"], [459.68, 464.83, "Great work! Now you can use eight new words and willingness and ability plus infinitive."], [465.13, 469.99, "Today's value is adaptability. Be ready for rain or sun and change your plans."], [470.29, 472.54, "See you in Unit ten. Goodbye!"], [472.84, 475.48, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C1B4-Unit10-Venture-Capital": [[0.35, 4.89, "Hello, everyone! I'm Ms. Emma. Welcome to Online C one, Book four."], [5.19, 8.29, "Hi! I'm Visal. Let's learn together!"], [8.59, 14.85, "Unit ten: Venture Capital. Today you will describe investment steps with before + gerund clauses."], [15.14, 17.65, "Here is our lesson map. Let's start!"], [18.6, 21.9, "Part one: words. You will learn eight new words."], [22.75, 24.01, "Venture capital."], [25.02, 30.52, "Venture capital means money invested in young, high-growth companies in exchange for ownership."], [31.12, 33.89, "Venture capital funded the expansion to Vietnam."], [34.48, 37.69, "Your turn. Say: Venture capital."], [40.53, 41.74, "Venture capital."], [42.48, 43.43, "Equity."], [44.42, 47.72, "Equity means ownership in a company, usually as shares."], [48.32, 51.6, "The founders gave up 20% equity for the investment."], [52.22, 54.68, "Your turn. Say: Equity."], [57.53, 58.47, "Equity."], [59.22, 60.22, "Term sheet."], [61.22, 65.06, "Term sheet means a document setting out the main conditions of an investment."], [65.65, 68.35, "The term sheet included a seat on the board."], [68.95, 71.5, "Your turn. Say: Term sheet."], [74.33, 75.53, "Term sheet."], [76.28, 77.4, "Due diligence."], [78.42, 82.42, "Due diligence means a detailed investigation before a deal is completed."], [83.02, 86.02, "Due diligence uncovered unpaid taxes."], [86.62, 89.8, "Your turn. Say: Due diligence."], [92.67, 94.04, "Due diligence."], [94.78, 95.85, "Valuation."], [96.85, 100.78, "Valuation means the agreed value of a company at the time of investment."], [101.38, 105.09, "A higher valuation means founders give away less of the company."], [105.68, 108.43, "Your turn. Say: Valuation."], [111.27, 112.49, "Valuation."], [113.25, 115.32, "Exit strategy."], [116.32, 120.73, "Exit strategy means a plan for how investors will eventually sell their stake."], [121.32, 124.56, "Their exit strategy is acquisition by a regional bank."], [125.15, 128.7, "Your turn. Say: Exit strategy."], [131.53, 132.92, "Exit strategy."], [133.68, 134.82, "Portfolio."], [135.82, 139.27, "Portfolio means the collection of companies an investor holds."], [139.88, 143.39, "Only two firms in the portfolio became highly profitable."], [143.98, 146.87, "Your turn. Say: Portfolio."], [149.73, 151.8, "Portfolio."], [152.55, 154.06, "Return on investment."], [155.05, 159.32, "Return on investment means the profit gained relative to the amount invested."], [159.92, 163.55, "One success can deliver a return on investment of fifty times."], [164.15, 167.01, "Your turn. Say: Return on investment."], [169.87, 171.37, "Return on investment."], [172.17, 175.63, "Part two: dialogue. Let's listen to a conversation."], [176.48, 182.89, "Visal, a Singapore fund almost invested in a Phnom Penh logistics start-up, then walked away. Why?"], [183.98, 192.88, "Before signing the term sheet, they conducted due diligence and found the delivery numbers had been exaggerated."], [193.98, 196.75, "Couldn't they have simply negotiated a lower valuation?"], [197.85, 208.44, "The problem was trust. Before committing funds, investors need to believe the founders report honestly, because they'll be partners for years."], [209.55, 211.5, "So what should the founders have done?"], [212.62, 221.18, "Shared realistic figures from the start. Before pitching, every founder should check that the data can survive close inspection."], [222.33, 224.2, "Part three: grammar."], [225.05, 228.16, "Grammar focus: Before plus gerund clauses."], [228.46, 229.7, "Look at the pattern."], [230.38, 233.74, "Investors conduct due diligence before committing funds."], [234.65, 237.91, "Founders should verify their data before pitching to investors."], [238.82, 242.02, "The fund reviewed the contracts before signing the term sheet."], [242.97, 254.06, "When the subject of both actions is the same, use 'before / after + -ing' for a concise, formal style: Before investing, we… (= Before we invest, we…). Never 'before to invest'."], [254.82, 258.83, "Be careful! Don't say: Investors check before to commit."], [260.77, 263.57, "Say: Investors check before committing."], [263.87, 264.95, "Before + -ing."], [265.73, 268.27, "Part four: reading. Read and listen."], [269.07, 271.01, "High Risk, High Reward."], [271.31, 277.32, "Venture capital funds invest in young companies that could grow very quickly, accepting that most will fail."], [278.33, 285.59, "Before investing, a fund conducts due diligence, examining finances, contracts, technology and the founders' integrity."], [286.6, 294.53, "In return for capital, investors receive equity, so the valuation agreed in the term sheet determines how much of the company the founders keep."], [295.53, 302.63, "Because one exceptional success can repay many losses, funds build diversified portfolios rather than betting on a single firm."], [303.63, 310.66, "Before accepting venture money, founders should consider whether rapid growth and an eventual exit truly match their own goals."], [311.77, 315.61, "Part five: quiz. Five questions. Are you ready?"], [316.45, 318.88, "Read the contract carefully before blank it."], [319.18, 322.48, "A, sign. B, to sign. C, signing."], [326.03, 327.86, "The answer is C: signing."], [329.02, 332.76, "A detailed investigation before a deal is completed is blank."], [333.06, 337.14, "A, due diligence. B, equity. C, a portfolio."], [340.7, 343.38, "The answer is A: due diligence."], [344.55, 347.75, "A plan for how investors will sell their stake is an blank."], [348.05, 352.34, "A, term sheet. B, exit strategy. C, valuation."], [355.9, 358.43, "The answer is B: exit strategy."], [359.58, 361.42, "Choose the correct sentence."], [361.72, 369.37, "A, Before to invest, check the team.. B, Before investing, check the team.. C, Before invested, check the team.."], [372.93, 376.21, "The answer is B: Before investing, check the team.."], [377.35, 381.8, "According to the reading, funds build diversified portfolios because…"], [382.1, 388.64, "A, one big success can repay many losses. B, they dislike risk. C, the law requires it."], [392.2, 396.16, "The answer is A: one big success can repay many losses."], [397.37, 400.43, "Part six: speaking. It's your turn to talk."], [401.28, 405.25, "Why might an investor conduct extensive due diligence before investing?"], [422.05, 423.51, "Now listen to Visal."], [423.81, 460.34, "An investor conducts extensive due diligence because, once the money is transferred, it is extremely difficult to get back. Before committing funds, the investor needs to confirm that the revenue is real, the contracts are valid and the founders are honest. For instance, hidden debts or exaggerated user numbers could make a promising start-up worthless. It also builds trust, since founders who share information openly are likely to be reliable partners. In short, careful checking protects everyone involved."], [460.64, 462.33, "Excellent answer, Visal!"], [463.22, 468.31, "Great work! Now you can use eight new words and before plus gerund clauses."], [468.61, 473.05, "Today's value is diligence. Check the details carefully before you commit."], [473.35, 475.61, "See you in Unit eleven. Goodbye!"], [475.9, 479.3, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C1B4-Unit11-Market-Analysis": [[0.35, 5.26, "Hello, everyone! I'm Ms. Emma. Welcome to Online C one, Book four."], [5.56, 9.22, "Hi! I'm Visal. Let's learn together!"], [9.52, 15.73, "Unit eleven: Market Analysis. Today you will make projections with estimate / forecast language."], [16.03, 18.84, "Here is our lesson map. Let's start!"], [19.8, 23.0, "Part one: words. You will learn eight new words."], [23.85, 25.19, "Market research."], [26.18, 31.57, "Market research means the collection and analysis of information about customers and competitors."], [32.18, 35.47, "Market research showed strong demand for halal snacks."], [36.08, 39.06, "Your turn. Say: Market research."], [41.9, 43.89, "Market research."], [44.65, 46.24, "Total addressable market."], [47.25, 52.51, "Total addressable market means the total revenue available if a product captured the whole market."], [53.12, 58.47, "The total addressable market for e-bikes in Cambodia is estimated at $40 million."], [59.08, 62.11, "Your turn. Say: Total addressable market."], [64.97, 66.59, "Total addressable market."], [67.35, 68.91, "Competitive landscape."], [69.92, 73.91, "Competitive landscape means the overall picture of rivals in a market."], [74.52, 77.78, "The competitive landscape changed when a Thai chain arrived."], [78.38, 81.45, "Your turn. Say: Competitive landscape."], [84.3, 85.95, "Competitive landscape."], [86.72, 88.15, "Demand forecasting."], [89.15, 92.68, "Demand forecasting means predicting future customer demand."], [93.28, 96.56, "Demand forecasting prevented overstock after the festival."], [97.15, 100.62, "Your turn. Say: Demand forecasting."], [103.47, 104.98, "Demand forecasting."], [105.72, 106.84, "Market trend."], [107.85, 111.27, "Market trend means a general direction in which a market is moving."], [111.85, 115.17, "A clear market trend is the shift to cashless payments."], [115.78, 118.98, "Your turn. Say: Market trend."], [121.83, 122.94, "Market trend."], [123.68, 125.0, "Customer segment."], [125.98, 130.38, "Customer segment means a group of customers with similar characteristics."], [130.98, 134.9, "University students are the fastest-growing customer segment."], [135.48, 138.25, "Your turn. Say: Customer segment."], [141.1, 142.36, "Customer segment."], [143.12, 144.42, "Barrier to entry."], [145.42, 149.89, "Barrier to entry means an obstacle that makes it hard for new firms to enter a market."], [150.48, 154.11, "High licensing costs are a barrier to entry in banking."], [154.72, 157.67, "Your turn. Say: Barrier to entry."], [160.53, 161.81, "Barrier to entry."], [162.55, 163.66, "Market share."], [164.65, 168.74, "Market share means a company's percentage of total sales in a market."], [169.35, 172.51, "They hold roughly 30% market share in Phnom Penh."], [173.12, 175.94, "Your turn. Say: Market share."], [178.8, 180.02, "Market share."], [180.83, 184.62, "Part two: dialogue. Let's listen to a conversation."], [185.48, 191.0, "Visal, you claim the market for electric motorbikes in Cambodia will triple. Isn't that optimistic?"], [192.12, 204.1, "It's based on data. Analysts forecast demand to grow by around 25% a year as fuel prices rise and charging stations spread."], [205.22, 207.23, "But forecasts are often wrong."], [208.32, 218.17, "They are, which is why we present a range. We estimate the market at between thirty and fifty million dollars, depending on government incentives."], [219.28, 221.07, "And what about competitors?"], [222.18, 231.4, "The main barrier to entry is the charging network. It is projected that whoever builds it first will capture most of the market share."], [232.53, 234.21, "Part three: grammar."], [235.05, 238.25, "Grammar focus: Estimate and forecast language."], [238.55, 239.79, "Look at the pattern."], [240.48, 243.37, "Analysts forecast demand based on market trends."], [244.25, 247.85, "We estimate the market at between $30 and $50 million."], [248.75, 252.09, "It is projected that sales will double by 2030."], [253.03, 262.42, "Hedge forecasts responsibly: 'is expected to', 'is projected to', 'roughly', 'an estimated'. Use 'grow by' for the amount of change and 'grow to' for the final figure."], [263.18, 268.2, "Be careful! Don't say: Analysts forecast demand to grow of 5%."], [270.17, 273.73, "Say: Analysts forecast demand to grow by 5%."], [274.03, 275.42, "Grow by + amount."], [276.23, 278.94, "Part four: reading. Read and listen."], [279.73, 281.13, "Sizing Up a Market."], [281.43, 287.86, "Market analysis helps a business decide whether an opportunity is large and accessible enough to justify investment."], [288.87, 295.62, "Analysts typically estimate the total addressable market first, then narrow it to the segment the company can realistically serve."], [296.6, 304.45, "Demand is forecast using historical data, surveys and observable trends, although every forecast rests on assumptions that may prove wrong."], [305.47, 312.14, "Equally important is the competitive landscape, since high barriers to entry can protect existing firms from newcomers."], [313.13, 318.73, "Responsible analysts therefore present ranges and scenarios rather than a single confident number."], [319.83, 323.93, "Part five: quiz. Five questions. Are you ready?"], [324.78, 327.75, "Sales are projected blank by 10% next year."], [328.05, 331.22, "A, growing. B, to grow. C, grow."], [334.77, 336.49, "The answer is B: to grow."], [337.65, 341.3, "An obstacle that makes it hard for new firms to enter is a blank."], [341.6, 346.67, "A, market trend. B, barrier to entry. C, customer segment."], [350.23, 353.05, "The answer is B: barrier to entry."], [354.18, 357.81, "A company's percentage of total sales in a market is its blank."], [358.11, 363.32, "A, market share. B, market research. C, demand forecasting."], [366.87, 369.47, "The answer is A: market share."], [370.62, 372.49, "Choose the correct sentence."], [372.79, 381.57, "A, The market is estimated at $5 million.. B, The market is estimated in $5 million.. C, The market estimates at $5 million.."], [385.13, 388.67, "The answer is A: The market is estimated at $5 million.."], [389.82, 393.08, "According to the reading, responsible analysts present…"], [393.38, 399.38, "A, one exact number. B, ranges and scenarios. C, only past data."], [402.93, 405.87, "The answer is B: ranges and scenarios."], [407.07, 410.45, "Part six: speaking. It's your turn to talk."], [411.32, 414.84, "What is one barrier to entry a new business might face in a market?"], [431.65, 433.15, "Now listen to Visal."], [433.45, 472.26, "One major barrier to entry is the high cost of building trust and distribution. In Cambodia's banking sector, for example, a new bank must obtain an expensive licence, open branches and convince customers to move their savings. Established banks already enjoy strong brands and large networks, so it is estimated that newcomers need several years to break even. However, technology can lower some barriers, as digital wallets have shown. I think the toughest barrier is usually customer habit rather than money."], [472.56, 474.44, "Excellent answer, Visal!"], [475.35, 479.81, "Great work! Now you can use eight new words and estimate and forecast language."], [480.11, 484.93, "Today's value is analytical thinking. Look for the pattern underneath the surface."], [485.23, 487.89, "See you in Unit twelve. Goodbye!"], [488.19, 490.9, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C1B4-Unit12-Competitive-Strategy": [[0.35, 5.15, "Hello, everyone! I'm Ms. Emma. Welcome to Online C one, Book four."], [5.45, 9.01, "Hi! I'm Visal. Let's learn together!"], [9.31, 15.63, "Unit twelve: Competitive Strategy. Today you will compare strategic options with either / or structures."], [15.93, 18.51, "Here is our lesson map. Let's start!"], [19.47, 22.42, "Part one: words. You will learn eight new words."], [23.28, 24.96, "Competitive strategy."], [25.95, 30.77, "Competitive strategy means a long-term plan to gain advantage over rivals."], [31.38, 34.52, "Their competitive strategy relies on speed of delivery."], [35.12, 38.58, "Your turn. Say: Competitive strategy."], [41.43, 43.05, "Competitive strategy."], [43.78, 45.08, "Cost leadership."], [46.08, 50.39, "Cost leadership means competing by being the lowest-cost producer."], [50.98, 54.67, "Cost leadership requires huge volumes and strict efficiency."], [55.25, 58.52, "Your turn. Say: Cost leadership."], [61.37, 62.89, "Cost leadership."], [63.65, 65.28, "Differentiation strategy."], [66.28, 71.36, "Differentiation strategy means competing by offering unique features customers will pay more for."], [71.95, 75.71, "Their differentiation strategy focuses on organic ingredients."], [76.32, 79.65, "Your turn. Say: Differentiation strategy."], [82.5, 84.28, "Differentiation strategy."], [85.02, 86.12, "Niche market."], [87.12, 90.77, "Niche market means a small, specialised segment of a larger market."], [91.35, 94.0, "Vegan Khmer cuisine is a growing niche market."], [94.58, 97.47, "Your turn. Say: Niche market."], [100.33, 101.37, "Niche market."], [102.12, 103.56, "Barriers to entry."], [104.55, 108.79, "Barriers to entry means obstacles that prevent new competitors from entering."], [109.38, 112.14, "Patents create barriers to entry for rivals."], [112.75, 115.65, "Your turn. Say: Barriers to entry."], [118.5, 119.95, "Barriers to entry."], [120.72, 122.26, "First-mover advantage."], [123.25, 127.39, "First-mover advantage means the benefit of being the first company in a market."], [127.98, 131.61, "Their first-mover advantage faded once larger firms arrived."], [132.22, 135.39, "Your turn. Say: First-mover advantage."], [138.23, 140.18, "First-mover advantage."], [140.92, 141.92, "Benchmarking."], [142.92, 146.36, "Benchmarking means comparing performance with the best in the industry."], [146.95, 150.12, "Benchmarking against Thai hotels improved their service."], [150.72, 153.39, "Your turn. Say: Benchmarking."], [156.23, 157.29, "Benchmarking."], [158.05, 159.69, "Sustainable advantage."], [160.68, 165.7, "Sustainable advantage means an advantage that rivals cannot easily copy over time."], [166.32, 169.79, "Their sustainable advantage is a network of loyal farmers."], [170.38, 173.64, "Your turn. Say: Sustainable advantage."], [176.5, 178.21, "Sustainable advantage."], [179.0, 182.37, "Part two: dialogue. Let's listen to a conversation."], [183.22, 189.29, "Visal, a Kampot pepper producer can't match the prices of mass-market pepper. Should it cut costs?"], [190.38, 201.73, "It can compete either on cost or on differentiation, but rarely on both. With small farms, cost leadership is unrealistic."], [202.82, 204.85, "So it should focus on quality?"], [205.95, 216.32, "Exactly. Kampot pepper has Geographical Indication status, so it can target a premium niche market where buyers pay for origin and taste."], [217.42, 219.89, "What if a large company copies the idea?"], [220.98, 231.18, "The GI label is a barrier to entry. Neither cheaper rivals nor big brands can legally call their pepper 'Kampot', which makes the advantage sustainable."], [232.33, 234.16, "Part three: grammar."], [235.02, 238.03, "Grammar focus: Either and or structures."], [238.33, 239.47, "Look at the pattern."], [240.18, 243.7, "A company can compete either on cost or on differentiation."], [244.62, 248.07, "The firm must either lower its prices or improve its quality."], [248.98, 252.53, "Neither cheaper rivals nor big brands can use the GI label."], [253.47, 262.52, "Keep the structure parallel: either + noun … or + noun; either + verb … or + verb. With 'neither … nor', the verb agrees with the nearer subject."], [263.25, 267.52, "Be careful! Don't say: Either we cut costs or differentiate."], [269.47, 272.02, "Say: We either cut costs or differentiate."], [272.32, 274.32, "Place 'either' before the first option."], [275.13, 277.94, "Part four: reading. Read and listen."], [278.73, 279.86, "Stuck in the Middle."], [280.16, 287.77, "Michael Porter argued that firms achieve superior performance either by becoming the lowest-cost producer or by offering something distinctive."], [288.77, 296.55, "Companies that try to do both often end up 'stuck in the middle', neither cheap enough to win on price nor special enough to justify a premium."], [297.53, 303.98, "Smaller firms frequently choose a focus strategy, serving a niche market more effectively than larger rivals can."], [304.97, 312.85, "Advantages last only when they are protected by barriers to entry, such as patents, brand reputation or exclusive relationships."], [313.87, 320.71, "Kampot pepper shows how a protected geographical name can turn a small producer's origin into a sustainable advantage."], [321.8, 325.73, "Part five: quiz. Five questions. Are you ready?"], [326.58, 329.08, "You can pay blank by cash or by card."], [329.38, 332.47, "A, both. B, neither. C, either."], [336.0, 338.05, "The answer is C: either."], [339.18, 342.33, "Competing by being the lowest-cost producer is blank."], [342.63, 347.13, "A, cost leadership. B, benchmarking. C, a niche market."], [350.67, 353.33, "The answer is A: cost leadership."], [354.48, 357.73, "Comparing performance with the best in the industry is blank."], [358.02, 363.33, "A, first-mover advantage. B, benchmarking. C, differentiation."], [366.87, 369.03, "The answer is B: benchmarking."], [370.18, 372.04, "Choose the correct sentence."], [372.34, 380.57, "A, Neither the price nor the quality were good.. B, Neither the price or the quality was good.. C, Neither the price nor the quality was good.."], [384.13, 387.91, "The answer is C: Neither the price nor the quality was good.."], [389.05, 392.26, "According to the reading, firms 'stuck in the middle' are…"], [392.56, 398.4, "A, neither cheap enough nor special enough. B, the most profitable. C, always small."], [401.97, 405.09, "The answer is A: neither cheap enough nor special enough."], [406.3, 409.25, "Part six: speaking. It's your turn to talk."], [410.12, 413.78, "Would you rather compete on cost or on differentiation? Why?"], [430.58, 432.15, "Now listen to Visal."], [432.45, 466.61, "I would rather compete on differentiation, because cost leadership usually requires enormous scale, which most new businesses cannot achieve. A firm that offers something distinctive, such as excellent design, local ingredients or outstanding service, can charge higher prices and build loyal customers. A small Cambodian silk workshop could never win on price, but it can sell authentic handwoven products to buyers who value craftsmanship. Differentiation is harder to copy, so it lasts longer."], [466.91, 468.65, "Excellent answer, Visal!"], [469.55, 474.07, "Great work! Now you can use eight new words and either and or structures."], [474.37, 479.49, "Today's value is strategic thinking. Think ahead, and choose your path with purpose."], [479.78, 482.54, "See you in Unit thirteen. Goodbye!"], [482.84, 485.36, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C1B4-Unit13-Brand-Management": [[0.35, 5.04, "Hello, everyone! I'm Ms. Emma. Welcome to Online C one, Book four."], [5.34, 8.99, "Hi! I'm Visal. Let's learn together!"], [9.29, 15.41, "Unit thirteen: Brand Management. Today you will describe brand stability with consistency language."], [15.71, 18.49, "Here is our lesson map. Let's start!"], [19.43, 22.6, "Part one: words. You will learn eight new words."], [23.45, 24.6, "Brand identity."], [25.62, 31.08, "Brand identity means the visible elements and values a company uses to present itself."], [31.68, 35.52, "Their brand identity combines Angkor motifs with modern design."], [36.12, 39.14, "Your turn. Say: Brand identity."], [42.0, 43.43, "Brand identity."], [44.18, 45.27, "Brand equity."], [46.25, 50.03, "Brand equity means the extra value a brand name adds to a product."], [50.62, 53.73, "Strong brand equity lets them charge 20% more."], [54.32, 56.73, "Your turn. Say: Brand equity."], [59.57, 60.86, "Brand equity."], [61.62, 62.87, "Reputation."], [63.88, 67.47, "Reputation means the general opinion people hold about a company."], [68.08, 71.19, "One viral complaint damaged the hotel's reputation."], [71.78, 74.88, "Your turn. Say: Reputation."], [77.73, 78.91, "Reputation."], [79.65, 80.95, "Brand loyalty."], [81.95, 85.91, "Brand loyalty means customers' commitment to repeatedly buy one brand."], [86.52, 89.49, "Brand loyalty is high among older beer drinkers."], [90.08, 93.06, "Your turn. Say: Brand loyalty."], [95.9, 97.52, "Brand loyalty."], [98.25, 99.54, "Positioning statement."], [100.55, 105.77, "Positioning statement means a short description of a brand's target, benefit and difference."], [106.35, 109.44, "The positioning statement guided every advertisement."], [110.05, 113.34, "Your turn. Say: Positioning statement."], [116.2, 117.66, "Positioning statement."], [118.42, 119.78, "Visual identity."], [120.78, 125.02, "Visual identity means a brand's logo, colours, fonts and imagery."], [125.62, 129.54, "A consistent visual identity makes the brand instantly recognisable."], [130.15, 133.7, "Your turn. Say: Visual identity."], [136.53, 137.98, "Visual identity."], [138.72, 139.93, "Brand voice."], [140.92, 145.04, "Brand voice means the personality and tone a brand uses in communication."], [145.65, 148.25, "Their brand voice is friendly but never childish."], [148.85, 151.76, "Your turn. Say: Brand voice."], [154.6, 155.95, "Brand voice."], [156.68, 157.71, "Perception."], [158.72, 161.9, "Perception means the way something is understood or regarded."], [162.52, 165.47, "Customer perception improved after the redesign."], [166.08, 168.53, "Your turn. Say: Perception."], [171.37, 172.47, "Perception."], [173.27, 176.72, "Part two: dialogue. Let's listen to a conversation."], [177.58, 184.25, "Visal, the bank changed its logo, colours and slogan three times in five years. Customers seem confused."], [185.35, 195.93, "That's the problem. A strong brand remains consistent across every channel, so people recognise it instantly and know what to expect."], [197.02, 199.38, "But brands need to stay modern, don't they?"], [200.48, 207.51, "They do, gradually. The best brands consistently refresh details while their core promise remains the same."], [208.62, 209.79, "What should the bank do now?"], [210.88, 220.49, "Choose one positioning statement and stick to it. Staff, adverts and the app should all consistently express the same values."], [221.63, 223.19, "Part three: grammar."], [224.05, 227.88, "Grammar focus: Consistency language (consistently, remains)."], [228.18, 229.44, "Look at the pattern."], [230.15, 233.36, "A strong brand remains consistent across every channel."], [234.25, 237.65, "The best brands consistently deliver the same experience."], [238.55, 241.24, "The core promise stays unchanged for decades."], [242.2, 251.95, "'Remain' and 'stay' are linking verbs, so they take an adjective (remains consistent), not an adverb. Use the adverb 'consistently' before an action verb (consistently delivers)."], [252.68, 256.56, "Be careful! Don't say: The brand remains consistently."], [258.5, 260.71, "Say: The brand remains consistent."], [261.01, 262.66, "Remain + adjective."], [263.47, 266.25, "Part four: reading. Read and listen."], [267.03, 268.75, "The Power of Consistency."], [269.05, 274.57, "Brand management is the long-term work of shaping how customers perceive a company and its products."], [275.57, 281.72, "Research consistently shows that people trust brands they recognise, and recognition depends on repetition."], [282.73, 290.01, "A brand whose visual identity and voice remain stable becomes a mental shortcut, saving customers the effort of comparing alternatives."], [291.0, 297.68, "However, consistency does not mean stagnation; successful brands update their style while their core promise remains intact."], [298.67, 305.6, "In the age of social media, every employee and every customer interaction either strengthens or weakens that promise."], [306.7, 310.64, "Part five: quiz. Five questions. Are you ready?"], [311.48, 313.82, "Their service remains blank every year."], [314.12, 318.1, "A, consistently. B, consistent. C, consistency."], [321.63, 323.39, "The answer is B: consistent."], [324.55, 327.76, "A brand's logo, colours and fonts form its blank."], [328.06, 332.31, "A, visual identity. B, brand loyalty. C, reputation."], [335.87, 338.17, "The answer is A: visual identity."], [339.32, 343.21, "The personality and tone a brand uses in communication is its blank."], [343.51, 347.45, "A, perception. B, brand equity. C, brand voice."], [351.0, 353.53, "The answer is C: brand voice."], [354.68, 356.4, "Choose the correct sentence."], [356.7, 366.11, "A, The brand consistently delivers quality.. B, The brand delivers consistent quality always consistently.. C, The brand remains consistently strong quality.."], [369.67, 373.3, "The answer is A: The brand consistently delivers quality.."], [374.45, 378.31, "According to the reading, successful brands update their style while…"], [378.61, 384.62, "A, changing their promise. B, their core promise remains intact. C, ignoring social media."], [388.17, 391.59, "The answer is B: their core promise remains intact."], [392.8, 396.07, "Part six: speaking. It's your turn to talk."], [396.92, 400.11, "What brand do you feel loyal to, and what builds that loyalty?"], [416.92, 418.55, "Now listen to Visal."], [418.85, 457.14, "I feel loyal to a local bookshop chain because its experience remains consistent wherever I visit. The staff are always knowledgeable, the shops are calm and well organised, and the online store delivers exactly what it promises. What builds my loyalty is not advertising but reliability: I have never been disappointed. When prices are slightly higher than elsewhere, I still choose it because I trust it. In my view, loyalty grows from many small promises kept consistently over time."], [457.44, 459.41, "Excellent answer, Visal!"], [460.32, 465.87, "Great work! Now you can use eight new words and consistency language (consistently, remains)."], [466.17, 470.86, "Today's value is consistency. Keep your promises the same way, every day."], [471.16, 473.84, "See you in Unit fourteen. Goodbye!"], [474.14, 476.84, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C1B4-Unit14-Digital-Transformation": [[0.35, 5.11, "Hello, everyone! I'm Ms. Emma. Welcome to Online C one, Book four."], [5.41, 8.97, "Hi! I'm Visal. Let's learn together!"], [9.27, 17.21, "Unit fourteen: Digital Transformation. Today you will describe organisational change with from X toward Y movement language."], [17.51, 20.32, "Here is our lesson map. Let's start!"], [21.27, 24.45, "Part one: words. You will learn eight new words."], [25.32, 26.91, "Digital transformation."], [27.92, 33.64, "Digital transformation means the integration of digital technology into all areas of a business."], [34.25, 37.99, "Digital transformation changed how the ministry serves citizens."], [38.58, 41.54, "Your turn. Say: Digital transformation."], [44.4, 46.23, "Digital transformation."], [46.98, 48.3, "Legacy system."], [49.28, 54.21, "Legacy system means old technology still in use that is hard to replace."], [54.82, 58.08, "The bank's legacy system could not support mobile apps."], [58.68, 61.46, "Your turn. Say: Legacy system."], [64.3, 65.71, "Legacy system."], [66.45, 67.72, "Cloud migration."], [68.72, 72.66, "Cloud migration means moving data and software to online servers."], [73.25, 76.0, "Cloud migration cut their IT costs by a third."], [76.62, 79.67, "Your turn. Say: Cloud migration."], [82.53, 84.13, "Cloud migration."], [84.88, 85.9, "Automation."], [86.88, 91.29, "Automation means the use of technology to perform tasks without human effort."], [91.88, 94.7, "Automation reduced invoice errors dramatically."], [95.28, 97.65, "Your turn. Say: Automation."], [100.5, 101.48, "Automation."], [102.22, 103.43, "Digital-first."], [104.42, 107.82, "Digital-first means designed primarily for digital channels."], [108.42, 111.8, "The insurer adopted a digital-first approach to claims."], [112.38, 115.67, "Your turn. Say: Digital-first."], [118.53, 119.7, "Digital-first."], [120.45, 121.75, "Change management."], [122.75, 126.39, "Change management means guiding people through organisational change."], [126.98, 129.7, "Good change management reduced staff resistance."], [130.32, 133.36, "Your turn. Say: Change management."], [136.2, 137.61, "Change management."], [138.35, 139.39, "Data-driven."], [140.38, 144.37, "Data-driven means based on data analysis rather than intuition."], [144.98, 147.31, "Data-driven decisions replaced guesswork."], [147.92, 150.38, "Your turn. Say: Data-driven."], [153.23, 154.36, "Data-driven."], [155.12, 156.15, "Agility."], [157.15, 160.37, "Agility means the ability to respond quickly to change."], [160.98, 163.17, "Cloud tools gave the team new agility."], [163.78, 166.05, "Your turn. Say: Agility."], [168.9, 170.16, "Agility."], [170.97, 174.65, "Part two: dialogue. Let's listen to a conversation."], [175.52, 181.16, "Visal, the electricity company still records meter readings on paper. How would you modernise it?"], [182.25, 188.99, "I'd move it gradually from paper records toward a digital system, starting with smart meters in Phnom Penh."], [190.08, 192.27, "Why not replace everything at once?"], [193.38, 203.76, "Because the legacy system holds decades of data. Shifting from manual processes toward automation too quickly could cause billing chaos."], [204.85, 206.76, "And the staff who read meters?"], [207.85, 215.34, "Change management is essential. We'd retrain them, moving their roles away from data collection toward customer service."], [216.5, 218.09, "Part three: grammar."], [218.95, 222.57, "Grammar focus: From X toward Y movement language."], [222.88, 224.0, "Look at the pattern."], [224.72, 228.55, "Companies move from legacy systems toward cloud infrastructure."], [229.45, 232.87, "The bank is shifting from branch visits toward mobile services."], [233.75, 237.14, "Staff roles moved away from data entry toward customer care."], [238.1, 247.06, "'Toward(s)' suggests direction and gradual progress; 'to' suggests reaching the end point. Do not combine them: 'toward the cloud', not 'toward to the cloud'."], [247.82, 251.41, "Be careful! Don't say: They moved from paper toward to cloud."], [253.37, 255.89, "Say: They moved from paper toward the cloud."], [256.19, 257.99, "From X toward Y (no 'to')."], [258.8, 261.75, "Part four: reading. Read and listen."], [262.57, 264.28, "More Than New Technology."], [264.58, 272.44, "Digital transformation describes an organisation's shift from manual, paper-based processes toward integrated digital operations."], [273.43, 280.81, "Many projects fail not because the technology is poor, but because employees resist changes to familiar routines."], [281.8, 289.29, "Replacing legacy systems is especially risky, since old databases often contain data that no one fully understands."], [290.3, 297.35, "Successful firms therefore move step by step from pilot projects toward company-wide adoption, investing heavily in training."], [298.33, 305.57, "Cambodia's rapid move from cash toward QR payments shows how quickly behaviour can change once a system is genuinely convenient."], [306.67, 310.67, "Part five: quiz. Five questions. Are you ready?"], [311.52, 314.85, "The school moved blank paper exams toward online tests."], [315.15, 318.13, "A, from. B, of. C, out."], [321.67, 323.39, "The answer is A: from."], [324.55, 327.87, "Old technology that is hard to replace is a blank."], [328.17, 333.02, "A, cloud migration. B, legacy system. C, digital-first."], [336.57, 339.19, "The answer is B: legacy system."], [340.35, 343.29, "Guiding people through organisational change is blank."], [343.59, 347.86, "A, automation. B, agility. C, change management."], [351.4, 353.81, "The answer is C: change management."], [354.95, 356.75, "Choose the correct sentence."], [357.05, 365.36, "A, We are moving toward to cloud storage.. B, We are moving toward cloud storage.. C, We are moving from toward cloud storage.."], [368.9, 371.82, "The answer is B: We are moving toward cloud storage.."], [372.98, 376.24, "According to the reading, many digital projects fail because…"], [376.54, 382.01, "A, employees resist change. B, computers are too slow. C, data is too cheap."], [385.57, 388.48, "The answer is A: employees resist change."], [389.7, 393.05, "Part six: speaking. It's your turn to talk."], [393.88, 397.54, "What challenge might a company face when replacing a legacy system?"], [414.35, 415.72, "Now listen to Visal."], [416.02, 451.35, "One major challenge is migrating data safely. A legacy system may hold years of customer records in outdated formats, and moving them from the old platform toward a new one can introduce errors. Another challenge is people: employees who have used the old system for decades may resist learning new procedures. If a bank's new software miscalculates balances, customers lose trust immediately. Therefore, I believe companies should test carefully, run both systems in parallel for a period and train staff thoroughly."], [451.65, 453.61, "Excellent answer, Visal!"], [454.52, 459.47, "Great work! Now you can use eight new words and from x toward y movement language."], [459.77, 464.67, "Today's value is adaptability. Be ready for rain or sun and change your plans."], [464.97, 467.65, "See you in Unit fifteen. Goodbye!"], [467.95, 471.28, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C1B4-Unit15-Data-Analytics": [[0.35, 4.87, "Hello, everyone! I'm Ms. Emma. Welcome to Online C one, Book four."], [5.17, 8.55, "Hi! I'm Visal. Let's learn together!"], [8.85, 15.4, "Unit fifteen: Data Analytics. Today you will explain dependence with depends on + noun / noun clause."], [15.7, 18.12, "Here is our lesson map. Let's start!"], [19.07, 22.31, "Part one: words. You will learn eight new words."], [23.15, 24.58, "Data analytics."], [25.58, 30.71, "Data analytics means examining data to find patterns and support decisions."], [31.32, 34.91, "Data analytics revealed which branches were losing customers."], [35.52, 38.38, "Your turn. Say: Data analytics."], [41.23, 42.83, "Data analytics."], [43.58, 45.29, "Key performance indicator."], [46.28, 51.08, "Key performance indicator means a measurable value showing progress toward a goal."], [51.68, 54.84, "Delivery time is our main key performance indicator."], [55.45, 59.01, "Your turn. Say: Key performance indicator."], [61.87, 63.48, "Key performance indicator."], [64.22, 65.31, "Dashboard."], [66.32, 69.99, "Dashboard means a visual display of key data in one place."], [70.58, 73.71, "The manager checks the sales dashboard every morning."], [74.32, 76.96, "Your turn. Say: Dashboard."], [79.8, 81.01, "Dashboard."], [81.75, 83.03, "Predictive model."], [84.02, 88.2, "Predictive model means a statistical tool that forecasts future outcomes."], [88.78, 91.89, "The predictive model flags customers likely to leave."], [92.48, 95.45, "Your turn. Say: Predictive model."], [98.3, 99.67, "Predictive model."], [100.42, 101.95, "Data-driven decision."], [102.95, 107.27, "Data-driven decision means a choice based on analysis rather than instinct."], [107.88, 110.37, "Closing the branch was a data-driven decision."], [110.98, 114.12, "Your turn. Say: Data-driven decision."], [116.97, 118.49, "Data-driven decision."], [119.25, 120.47, "Data quality."], [121.48, 125.46, "Data quality means how accurate, complete and reliable data is."], [126.05, 128.78, "Poor data quality produced misleading reports."], [129.38, 132.26, "Your turn. Say: Data quality."], [135.1, 136.23, "Data quality."], [136.98, 138.02, "Insight."], [139.02, 142.85, "Insight means a deep, useful understanding gained from analysis."], [143.45, 146.99, "The key insight was that most sales happen after 9 p.m."], [147.58, 149.91, "Your turn. Say: Insight."], [152.77, 153.78, "Insight."], [154.52, 155.92, "Visualization."], [156.92, 160.48, "Visualization means presenting data as charts or graphics."], [161.08, 164.02, "A clear visualization convinced the board in seconds."], [164.62, 167.33, "Your turn. Say: Visualization."], [170.17, 171.4, "Visualization."], [172.2, 175.8, "Part two: dialogue. Let's listen to a conversation."], [176.65, 184.39, "Visal, the supermarket's new predictive model said sales of ice would fall in April. Instead, they doubled. What went wrong?"], [185.48, 195.3, "The model was fine, but good insight depends heavily on data quality. Half the stores had entered their numbers in the wrong units."], [196.38, 198.89, "So the analysis was based on faulty data?"], [199.98, 207.16, "Exactly. Whether a forecast is useful depends on how carefully the data was collected and cleaned."], [208.25, 210.22, "How can they prevent this next time?"], [211.32, 221.22, "Set clear standards for data entry and check outliers. Success depends less on clever algorithms than on reliable inputs."], [222.37, 224.02, "Part three: grammar."], [224.88, 228.24, "Grammar focus: Depends on plus noun clause."], [228.54, 229.76, "Look at the pattern."], [230.45, 233.41, "Good insight depends heavily on data quality."], [234.32, 237.9, "The forecast's value depends on how carefully the data was cleaned."], [238.78, 242.41, "Success depends less on algorithms than on reliable inputs."], [243.37, 254.56, "After 'depend on', a wh- clause uses statement word order: depends on how the data was collected (not 'how was the data collected'). 'Depending on' can start a phrase: Depending on the data, …"], [255.32, 259.33, "Be careful! Don't say: Insight depends of data quality."], [261.27, 263.76, "Say: Insight depends on data quality."], [264.06, 265.11, "Depend on."], [265.9, 268.87, "Part four: reading. Read and listen."], [269.67, 271.34, "Garbage In, Garbage Out."], [271.64, 276.88, "Data analytics transforms raw numbers into insights that support better business decisions."], [277.87, 284.66, "However, the value of any analysis depends entirely on whether the underlying data is accurate, complete and relevant."], [285.67, 291.83, "Analysts often say 'garbage in, garbage out', meaning sophisticated models cannot rescue flawed inputs."], [292.83, 299.76, "Dashboards and visualizations make patterns visible to managers, but they can also give false confidence when the data behind them is weak."], [300.77, 307.07, "Organisations that invest in data quality before investing in advanced tools usually see far greater returns."], [308.17, 312.08, "Part five: quiz. Five questions. Are you ready?"], [312.92, 315.62, "The result depends blank the quality of the sample."], [315.92, 318.48, "A, of. B, on. C, from."], [322.03, 323.56, "The answer is B: on."], [324.72, 328.09, "A measurable value showing progress toward a goal is a blank."], [328.39, 332.89, "A, key performance indicator. B, visualization. C, dashboard."], [336.43, 339.23, "The answer is A: key performance indicator."], [340.38, 343.28, "How accurate and reliable data is, is its blank."], [343.58, 347.85, "A, insight. B, predictive model. C, data quality."], [351.4, 353.46, "The answer is C: data quality."], [354.62, 356.37, "Choose the correct sentence."], [356.67, 364.11, "A, It depends on how much time do we have.. B, It depends on how much time we have.. C, It depends how much time we have on.."], [367.67, 371.38, "The answer is B: It depends on how much time we have.."], [372.55, 376.31, "According to the reading, 'garbage in, garbage out' means…"], [376.61, 383.04, "A, models cannot rescue flawed inputs. B, data should be deleted. C, dashboards are useless."], [386.6, 390.28, "The answer is A: models cannot rescue flawed inputs."], [391.47, 394.48, "Part six: speaking. It's your turn to talk."], [395.32, 398.73, "Why is 'data quality' as important as the analysis itself?"], [415.52, 416.96, "Now listen to Visal."], [417.26, 453.32, "Data quality is as important as analysis because even the most advanced model will produce wrong answers if its inputs are inaccurate. Every conclusion depends on whether the numbers truly reflect reality. If a hospital records ages incorrectly, a model could set the wrong treatment priorities. Poor data is dangerous because charts look convincing regardless. Therefore, I believe organisations should check, clean and document their data before trusting any analysis built on it."], [453.62, 455.33, "Excellent answer, Visal!"], [456.22, 460.97, "Great work! Now you can use eight new words and depends on plus noun clause."], [461.27, 465.85, "Today's value is analytical rigor. Test the numbers before you believe the story."], [466.15, 468.71, "See you in Unit sixteen. Goodbye!"], [469.01, 472.31, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C1B4-Unit16-Consumer-Behavior": [[0.35, 5.15, "Hello, everyone! I'm Ms. Emma. Welcome to Online C one, Book four."], [5.45, 9.0, "Hi! I'm Visal. Let's learn together!"], [9.3, 16.73, "Unit sixteen: Consumer Behavior. Today you will analyse motivations with what + influences / drives + noun."], [17.03, 19.64, "Here is our lesson map. Let's start!"], [20.6, 23.8, "Part one: words. You will learn eight new words."], [24.65, 26.08, "Consumer behavior."], [27.08, 31.2, "Consumer behavior means the study of how people choose, buy and use products."], [31.78, 35.02, "Consumer behavior changed rapidly during the pandemic."], [35.62, 38.43, "Your turn. Say: Consumer behavior."], [41.27, 42.87, "Consumer behavior."], [43.62, 44.93, "Purchase decision."], [45.92, 49.07, "Purchase decision means the final choice to buy a product."], [49.65, 52.23, "Reviews strongly affect the purchase decision."], [52.82, 55.98, "Your turn. Say: Purchase decision."], [58.83, 60.03, "Purchase decision."], [60.78, 62.1, "Brand perception."], [63.08, 65.98, "Brand perception means how consumers view a brand."], [66.58, 69.83, "Brand perception improved after the charity campaign."], [70.42, 73.2, "Your turn. Say: Brand perception."], [76.03, 77.41, "Brand perception."], [78.15, 79.31, "Motivation."], [80.32, 83.37, "Motivation means the reason behind a person's action."], [83.98, 87.22, "Status is a powerful motivation for buying luxury goods."], [87.82, 90.43, "Your turn. Say: Motivation."], [93.3, 94.42, "Motivation."], [95.18, 96.18, "Buying journey."], [97.18, 100.88, "Buying journey means the stages a customer goes through before buying."], [101.48, 103.98, "For cars, the buying journey can last months."], [104.58, 107.33, "Your turn. Say: Buying journey."], [110.17, 111.44, "Buying journey."], [112.18, 113.51, "Loyalty program."], [114.52, 118.01, "Loyalty program means a scheme that rewards repeat customers."], [118.62, 121.93, "The café's loyalty program offers every tenth drink free."], [122.52, 125.76, "Your turn. Say: Loyalty program."], [128.6, 130.19, "Loyalty program."], [130.95, 132.71, "Psychology of pricing."], [133.72, 138.2, "Psychology of pricing means how price presentation affects buyers' perception."], [138.82, 143.37, "The psychology of pricing explains why $9.99 feels cheaper."], [143.98, 147.22, "Your turn. Say: Psychology of pricing."], [150.07, 151.87, "Psychology of pricing."], [152.62, 153.77, "Influence."], [154.78, 158.07, "Influence means the power to affect someone's choices."], [158.68, 161.05, "Friends have more influence than adverts."], [161.65, 163.93, "Your turn. Say: Influence."], [166.77, 167.91, "Influence."], [168.7, 172.49, "Part two: dialogue. Let's listen to a conversation."], [173.35, 179.19, "Visal, your survey asked students in Phnom Penh how they choose a smartphone. What did you discover?"], [180.28, 188.21, "What drives the purchase decision varies by person. For some it's the camera; for others it's what their friends own."], [189.32, 190.89, "Did price matter most?"], [191.98, 203.7, "Less than expected. What really influences young buyers is social proof: reviews, TikTok videos and recommendations from peers."], [204.82, 207.34, "So advertising is becoming less important?"], [208.45, 215.18, "Traditional advertising is. What persuades people now is authentic content from someone they trust."], [216.33, 217.97, "Part three: grammar."], [218.82, 222.98, "Grammar focus: What plus influences and drives plus noun."], [223.28, 224.53, "Look at the pattern."], [225.22, 228.18, "What drives a purchase decision varies by person."], [229.08, 232.12, "What really influences young buyers is social proof."], [233.02, 235.81, "What persuades people now is authentic content."], [236.77, 246.09, "A 'what' clause acts as a singular subject, so use a singular verb: What drives buyers IS price (not 'are'). It is a useful way to emphasise the key factor."], [246.85, 250.52, "Be careful! Don't say: What drive buyers is price."], [252.47, 254.9, "Say: What drives buyers is price."], [255.2, 257.14, "'What' clause takes singular verb."], [257.93, 261.2, "Part four: reading. Read and listen."], [262.0, 263.59, "Why We Really Buy."], [263.89, 269.13, "Consumer behaviour research shows that purchase decisions are far less rational than people believe."], [270.13, 276.37, "What influences a buyer is often emotion, habit or social pressure rather than a careful comparison of features."], [277.37, 285.64, "The psychology of pricing demonstrates this clearly: a price of $9.99 is perceived as significantly lower than $10."], [286.63, 293.03, "Loyalty programs exploit our desire for rewards, while reviews reduce the uncertainty that makes us hesitate."], [294.03, 300.97, "Understanding what genuinely motivates customers allows companies to design products, and messages, that fit real human behaviour."], [302.07, 305.91, "Part five: quiz. Five questions. Are you ready?"], [306.75, 309.5, "What drives most buyers blank convenience."], [309.8, 312.53, "A, are. B, is. C, be."], [316.07, 317.75, "The answer is B: is."], [318.92, 322.16, "The stages a customer goes through before buying form the blank."], [322.46, 327.48, "A, buying journey. B, loyalty program. C, motivation."], [331.03, 333.11, "The answer is A: buying journey."], [334.25, 337.35, "How price presentation affects perception is the blank."], [337.65, 343.04, "A, brand perception. B, influence. C, psychology of pricing."], [346.6, 349.22, "The answer is C: psychology of pricing."], [350.35, 352.23, "Choose the correct sentence."], [352.53, 359.58, "A, What persuade me is reviews.. B, What persuades me is reviews.. C, What does persuade me are reviews is.."], [363.13, 366.5, "The answer is B: What persuades me is reviews.."], [367.65, 371.98, "According to the reading, $9.99 is perceived as…"], [372.28, 379.34, "A, exactly the same as $10. B, significantly lower than $10. C, more expensive."], [382.9, 386.51, "The answer is B: significantly lower than $10."], [387.7, 391.05, "Part six: speaking. It's your turn to talk."], [391.88, 394.95, "What influences your own purchase decisions the most?"], [411.75, 413.32, "Now listen to Visal."], [413.62, 453.36, "What influences my purchase decisions most is the experience of people I trust. Before buying anything expensive, such as headphones or a laptop, I read reviews and ask friends who already own the product. Advertising rarely persuades me, because I know it presents only the positive side. However, I admit that price psychology affects me too; discounts ending in .99 sometimes make me buy things I don't need. Recognising these influences helps me spend more carefully and avoid impulse purchases."], [453.66, 455.53, "Excellent answer, Visal!"], [456.45, 461.68, "Great work! Now you can use eight new words and what plus influences and drives plus noun."], [461.98, 466.17, "Today's value is self-awareness. Know your strengths and keep growing."], [466.47, 469.14, "See you in Unit seventeen. Goodbye!"], [469.44, 472.2, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C1B4-Unit17-International-Business": [[0.35, 5.27, "Hello, everyone! I'm Ms. Emma. Welcome to Online C one, Book four."], [5.57, 9.01, "Hi! I'm Visal. Let's learn together!"], [9.31, 16.38, "Unit seventeen: International Business. Today you will state conditions for success abroad with when + clause."], [16.68, 19.3, "Here is our lesson map. Let's start!"], [20.23, 23.55, "Part one: words. You will learn eight new words."], [24.38, 25.61, "Globalization."], [26.62, 30.58, "Globalization means the growing connection of economies and cultures worldwide."], [31.18, 34.63, "Globalization brought Cambodian garments to European shops."], [35.25, 38.66, "Your turn. Say: Globalization."], [41.5, 42.8, "Globalization."], [43.55, 45.42, "Cross-border trade."], [46.42, 49.99, "Cross-border trade means buying and selling goods between countries."], [50.58, 54.1, "Cross-border trade with Vietnam rose sharply last year."], [54.72, 58.32, "Your turn. Say: Cross-border trade."], [61.17, 63.07, "Cross-border trade."], [63.82, 65.29, "Cultural competence."], [66.28, 70.89, "Cultural competence means the ability to work effectively with people from other cultures."], [71.48, 74.91, "Cultural competence helped the team close the Japanese deal."], [75.52, 78.49, "Your turn. Say: Cultural competence."], [81.33, 82.95, "Cultural competence."], [83.68, 85.29, "Market entry strategy."], [86.28, 90.87, "Market entry strategy means a plan for how a firm will start selling in a new country."], [91.48, 94.99, "Their market entry strategy was a joint venture with a local partner."], [95.58, 98.91, "Your turn. Say: Market entry strategy."], [101.77, 104.14, "Market entry strategy."], [104.88, 105.75, "Tariff."], [106.75, 109.84, "Tariff means a tax on imported or exported goods."], [110.45, 113.68, "New tariffs made imported cars far more expensive."], [114.28, 116.49, "Your turn. Say: Tariff."], [119.33, 120.31, "Tariff."], [121.05, 122.36, "Localization."], [123.35, 128.02, "Localization means adapting a product to a specific country's language and culture."], [128.62, 132.44, "Localization included Khmer menus and local payment options."], [133.05, 136.04, "Your turn. Say: Localization."], [138.9, 140.52, "Localization."], [141.25, 142.85, "Foreign direct investment."], [143.85, 148.89, "Foreign direct investment means investment by a company in business operations in another country."], [149.48, 152.85, "Foreign direct investment created thousands of factory jobs."], [153.45, 156.94, "Your turn. Say: Foreign direct investment."], [159.8, 161.79, "Foreign direct investment."], [162.55, 164.16, "Global supply chain."], [165.15, 169.53, "Global supply chain means a production network that spans several countries."], [170.12, 173.64, "A phone's global supply chain may involve twenty countries."], [174.25, 177.49, "Your turn. Say: Global supply chain."], [180.33, 182.07, "Global supply chain."], [182.87, 186.33, "Part two: dialogue. Let's listen to a conversation."], [187.18, 193.46, "Visal, a Korean food chain opened five outlets in Phnom Penh and closed three within a year. What went wrong?"], [194.55, 203.19, "They copied their Seoul menu exactly. Cultural competence matters most when entering a new market, and they ignored local tastes."], [204.28, 206.32, "Surely good food sells everywhere?"], [207.42, 217.49, "Not always. When customers expect rice with every meal and shared dishes, individual portions without rice feel strange and expensive."], [218.58, 219.92, "How could they recover?"], [221.02, 230.4, "By localising. When they partnered with a Cambodian chef and adjusted portions, sales in the remaining outlets rose by 40%."], [231.57, 233.21, "Part three: grammar."], [234.05, 237.26, "Grammar focus: When plus clause for conditions."], [237.56, 238.8, "Look at the pattern."], [239.52, 242.77, "Cultural competence matters most when entering a new market."], [243.68, 246.87, "Firms succeed abroad when they adapt to local customs."], [247.78, 251.0, "When tariffs rise, exporters look for new markets."], [251.97, 262.22, "For general truths and future conditions, use the present tense after 'when': When we enter Japan, we will adapt (not 'when we will enter'). 'When + -ing' is a concise formal option."], [262.98, 266.97, "Be careful! Don't say: When we will enter Japan, we'll adapt."], [268.93, 271.48, "Say: When we enter Japan, we'll adapt."], [271.78, 273.65, "Present tense after 'when' (future)."], [274.47, 277.49, "Part four: reading. Read and listen."], [278.3, 280.26, "Thinking Global, Acting Local."], [280.56, 287.74, "International business offers access to larger markets, cheaper inputs and new ideas, but it also multiplies complexity."], [288.73, 295.78, "When a company crosses a border, it faces different laws, currencies, tariffs and, above all, different customer expectations."], [296.77, 305.58, "Firms choose among market entry strategies such as exporting, licensing, joint ventures or foreign direct investment, each carrying different levels of risk and control."], [306.57, 311.83, "Many failures abroad stem not from poor products but from a lack of cultural competence."], [312.83, 317.38, "Companies tend to thrive when they combine global efficiency with genuine localization."], [318.47, 322.57, "Part five: quiz. Five questions. Are you ready?"], [323.42, 327.13, "When the company blank Thailand next year, it will hire locally."], [327.43, 330.72, "A, will enter. B, enters. C, entered."], [334.27, 336.09, "The answer is B: enters."], [337.25, 339.57, "A tax on imported goods is a blank."], [339.88, 344.83, "A, tariff. B, localization. C, globalization."], [348.37, 350.01, "The answer is A: tariff."], [351.15, 354.42, "Adapting a product to a country's language and culture is blank."], [354.72, 359.99, "A, foreign direct investment. B, cross-border trade. C, localization."], [363.53, 366.17, "The answer is C: localization."], [367.32, 368.99, "Choose the correct sentence."], [369.29, 376.29, "A, When we will arrive, we'll call you.. B, When we arrive, we'll call you.. C, When we arrived, we'll call you.."], [379.83, 382.7, "The answer is B: When we arrive, we'll call you.."], [383.85, 387.36, "According to the reading, many failures abroad stem from…"], [387.66, 393.41, "A, poor products. B, a lack of cultural competence. C, low tariffs."], [396.97, 400.14, "The answer is B: a lack of cultural competence."], [401.33, 404.47, "Part six: speaking. It's your turn to talk."], [405.32, 409.07, "Why is cultural competence important when doing business internationally?"], [425.88, 427.28, "Now listen to Visal."], [427.58, 463.08, "Cultural competence is important because business relies on trust, and trust depends on understanding how other people communicate and make decisions. When a negotiator misreads politeness as agreement, or ignores the importance of hierarchy, a promising deal can collapse. For example, Cambodian partners may avoid saying 'no' directly, so a foreign manager must learn to recognise indirect signals. In short, cultural competence turns a foreign company into a respected partner."], [463.38, 465.17, "Excellent answer, Visal!"], [466.08, 470.85, "Great work! Now you can use eight new words and when plus clause for conditions."], [471.15, 476.3, "Today's value is cultural competence. Learn how other cultures work, and treat them with respect."], [476.6, 479.1, "See you in Unit eighteen. Goodbye!"], [479.4, 482.47, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C1B4-Unit18-Corporate-Ethics": [[0.35, 5.19, "Hello, everyone! I'm Ms. Emma. Welcome to Online C one, Book four."], [5.49, 9.14, "Hi! I'm Visal. Let's learn together!"], [9.44, 16.02, "Unit eighteen: Corporate Ethics. Today you will express priorities with prioritizing X over Y."], [16.32, 19.02, "Here is our lesson map. Let's start!"], [19.97, 23.41, "Part one: words. You will learn eight new words."], [24.25, 26.53, "Corporate social responsibility."], [27.52, 32.96, "Corporate social responsibility means a company's commitment to benefit society and the environment."], [33.55, 37.35, "Their corporate social responsibility programme funds rural schools."], [37.95, 41.45, "Your turn. Say: Corporate social responsibility."], [44.3, 46.71, "Corporate social responsibility."], [47.45, 48.72, "Business ethics."], [49.72, 53.61, "Business ethics means moral principles applied to business decisions."], [54.22, 58.11, "Business ethics courses are now compulsory for MBA students."], [58.72, 62.09, "Your turn. Say: Business ethics."], [64.93, 66.43, "Business ethics."], [67.18, 68.67, "Stakeholder interest."], [69.68, 74.57, "Stakeholder interest means the concerns of anyone affected by a company's actions."], [75.18, 78.45, "The plan balanced shareholder and stakeholder interests."], [79.05, 82.06, "Your turn. Say: Stakeholder interest."], [84.9, 86.38, "Stakeholder interest."], [87.12, 88.49, "Sustainability."], [89.48, 94.28, "Sustainability means operating without damaging the future environment or society."], [94.88, 98.5, "Sustainability targets were added to managers' bonuses."], [99.08, 102.1, "Your turn. Say: Sustainability."], [104.93, 106.2, "Sustainability."], [106.95, 108.29, "Transparency."], [109.28, 113.42, "Transparency means openness and honesty about actions and information."], [114.02, 117.08, "Transparency about wages improved workers' trust."], [117.68, 120.56, "Your turn. Say: Transparency."], [123.4, 124.64, "Transparency."], [125.38, 126.4, "Whistleblower."], [127.38, 131.94, "Whistleblower means a person who exposes wrongdoing inside an organisation."], [132.55, 135.42, "A whistleblower revealed the safety violations."], [136.02, 138.5, "Your turn. Say: Whistleblower."], [141.33, 142.36, "Whistleblower."], [143.12, 144.12, "Compliance."], [145.12, 148.3, "Compliance means acting in accordance with laws and rules."], [148.92, 151.82, "Compliance is the minimum; ethics goes further."], [152.42, 154.74, "Your turn. Say: Compliance."], [157.6, 158.73, "Compliance."], [159.48, 160.66, "Integrity."], [161.65, 166.24, "Integrity means the quality of being honest and having strong moral principles."], [166.85, 169.78, "Her integrity earned the respect of the whole industry."], [170.38, 173.01, "Your turn. Say: Integrity."], [175.87, 177.0, "Integrity."], [177.8, 181.42, "Part two: dialogue. Let's listen to a conversation."], [182.25, 190.07, "Visal, a factory could save money by delaying repairs to its fire exits. It's legal for another six months. Should it wait?"], [191.18, 200.34, "Legally, perhaps. Ethically, no. A responsible company prioritizes workers' safety over short-term savings."], [201.45, 203.43, "But shareholders expect profit."], [204.52, 215.2, "They do, yet history shows that firms prioritizing profit over safety often pay far more later, through accidents, lawsuits and lost customers."], [216.32, 219.2, "And if an employee reports the problem publicly?"], [220.28, 228.76, "Then the company should protect that whistleblower. Prioritizing reputation over honesty is exactly how scandals grow."], [229.9, 231.34, "Part three: grammar."], [232.18, 235.53, "Grammar focus: Prioritizing X over Y."], [235.83, 237.14, "Look at the pattern."], [237.85, 241.81, "Some companies prioritize stakeholders over short-term profit."], [242.72, 245.69, "A responsible firm puts safety before savings."], [246.58, 250.12, "Leaders who place integrity above convenience earn trust."], [251.07, 262.85, "Use 'prioritize X over Y' (not 'than Y'). Alternatives: put X before Y, place X above Y, give priority to X. The noun is 'priority': Safety is our top priority."], [263.58, 267.64, "Be careful! Don't say: They prioritize profit than people."], [269.6, 272.68, "Say: They prioritize profit over people."], [272.98, 274.91, "Prioritize X over Y."], [275.7, 278.6, "Part four: reading. Read and listen."], [279.4, 280.87, "Beyond Compliance."], [281.17, 286.24, "Corporate ethics asks not merely what a company may legally do, but what it ought to do."], [287.23, 292.7, "The shareholder view argues that firms should prioritize profit over other goals, provided they obey the law."], [293.7, 300.7, "The stakeholder view, by contrast, holds that companies must also consider workers, communities and the environment."], [301.7, 310.29, "Disasters such as the 2013 Rana Plaza collapse in Bangladesh showed the human cost of prioritizing low prices over safety."], [311.3, 317.57, "Today, investors increasingly reward firms whose integrity and transparency reduce long-term risks."], [318.67, 322.84, "Part five: quiz. Five questions. Are you ready?"], [323.68, 326.1, "We should prioritize safety blank speed."], [326.4, 329.16, "A, than. B, over. C, from."], [332.7, 334.73, "The answer is B: over."], [335.88, 340.01, "A person who exposes wrongdoing inside an organisation is a blank."], [340.31, 345.07, "A, whistleblower. B, stakeholder. C, compliance officer."], [348.63, 350.74, "The answer is A: whistleblower."], [351.88, 355.09, "Honesty and strong moral principles describe blank."], [355.39, 360.26, "A, sustainability. B, transparency. C, integrity."], [363.8, 366.16, "The answer is C: integrity."], [367.32, 369.15, "Choose the correct sentence."], [369.45, 376.23, "A, They put profit before people.. B, They put profit than people.. C, They prioritize profit before than people.."], [379.77, 382.95, "The answer is A: They put profit before people.."], [384.12, 388.37, "According to the reading, the Rana Plaza collapse showed the cost of prioritizing…"], [388.67, 394.41, "A, low prices over safety. B, workers over profit. C, law over ethics."], [397.97, 400.93, "The answer is A: low prices over safety."], [402.13, 405.46, "Part six: speaking. It's your turn to talk."], [406.32, 411.08, "Should a company prioritize shareholders or broader stakeholders? Why?"], [427.88, 429.36, "Now listen to Visal."], [429.66, 469.25, "I believe a company should prioritize broader stakeholders, although shareholders deserve a fair return. A business depends on its workers, customers, suppliers and community; if it harms them, its long-term profits will eventually suffer too. For example, a factory that ignores safety may save money this year, but one accident could destroy its reputation and its contracts with international brands. Prioritizing stakeholders over short-term profit is therefore both ethical and, in the long run, commercially wise."], [469.55, 471.4, "Excellent answer, Visal!"], [472.28, 476.78, "Great work! Now you can use eight new words and prioritizing x over y."], [477.08, 481.72, "Today's value is integrity. Do the right thing, even when no one is watching."], [482.02, 484.61, "See you in Unit nineteen. Goodbye!"], [484.91, 488.11, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C1B4-Unit19-Strategic-Leadership": [[0.35, 4.89, "Hello, everyone! I'm Ms. Emma. Welcome to Online C one, Book four."], [5.19, 8.66, "Hi! I'm Visal. Let's learn together!"], [8.96, 16.53, "Unit nineteen: Strategic Leadership. Today you will describe leadership demands with depends on / requires + noun phrase."], [16.83, 19.3, "Here is our lesson map. Let's start!"], [20.23, 23.57, "Part one: words. You will learn eight new words."], [24.42, 25.89, "Strategic leadership."], [26.88, 31.43, "Strategic leadership means guiding an organisation toward long-term goals."], [32.02, 36.07, "Strategic leadership turned the small cooperative into a national brand."], [36.68, 39.89, "Your turn. Say: Strategic leadership."], [42.73, 44.29, "Strategic leadership."], [45.05, 46.25, "Vision alignment."], [47.25, 52.11, "Vision alignment means ensuring everyone works toward the same long-term goal."], [52.72, 55.69, "Vision alignment workshops united the three departments."], [56.28, 59.12, "Your turn. Say: Vision alignment."], [61.97, 63.13, "Vision alignment."], [63.88, 65.72, "Organizational agility."], [66.72, 71.34, "Organizational agility means an organisation's ability to adapt quickly."], [71.95, 75.3, "Organizational agility helped them survive the pandemic."], [75.88, 79.03, "Your turn. Say: Organizational agility."], [81.9, 83.77, "Organizational agility."], [84.52, 85.84, "Talent development."], [86.85, 90.27, "Talent development means building employees' skills and potential."], [90.85, 94.25, "Talent development reduced their reliance on foreign managers."], [94.85, 97.66, "Your turn. Say: Talent development."], [100.5, 101.87, "Talent development."], [102.62, 104.0, "Succession planning."], [105.02, 109.05, "Succession planning means preparing future leaders to replace current ones."], [109.65, 114.22, "Without succession planning, the family firm struggled after the founder retired."], [114.82, 117.97, "Your turn. Say: Succession planning."], [120.83, 122.44, "Succession planning."], [123.18, 124.32, "Culture building."], [125.32, 129.64, "Culture building means shaping the shared values and behaviours of an organisation."], [130.25, 133.13, "Culture building starts with how leaders behave daily."], [133.72, 136.91, "Your turn. Say: Culture building."], [139.77, 140.98, "Culture building."], [141.72, 143.02, "Decision-making."], [144.02, 147.61, "Decision-making means the process of choosing between options."], [148.22, 151.19, "Clear decision-making rules ended endless meetings."], [151.78, 155.11, "Your turn. Say: Decision-making."], [157.97, 160.05, "Decision-making."], [160.78, 162.27, "Long-term thinking."], [163.28, 167.23, "Long-term thinking means considering consequences many years ahead."], [167.85, 171.25, "Long-term thinking led them to invest in staff training."], [171.85, 175.06, "Your turn. Say: Long-term thinking."], [177.9, 180.4, "Long-term thinking."], [181.2, 185.21, "Part two: dialogue. Let's listen to a conversation."], [186.05, 193.28, "Visal, the founder of a successful Cambodian construction firm is retiring, but nobody is ready to replace her. Why?"], [194.38, 203.56, "Because she made every major decision herself. Strategic leadership requires talent development, not just personal brilliance."], [204.65, 207.14, "But the company grew fast under her control."], [208.25, 215.9, "It did. However, lasting success depends on succession planning and a culture that survives beyond one person."], [216.98, 218.99, "What should she do in her final year?"], [220.08, 230.33, "Delegate real authority now. Building future leaders requires patience, trust and a willingness to watch others make mistakes."], [231.47, 233.09, "Part three: grammar."], [233.95, 238.17, "Grammar focus: Depends on and requires plus noun phrase."], [238.47, 239.61, "Look at the pattern."], [240.32, 243.68, "Strategic leadership requires long-term thinking."], [244.58, 248.07, "Lasting success depends on careful succession planning."], [248.98, 251.87, "Building future leaders demands patience and trust."], [252.8, 264.46, "'Require' is followed by a noun phrase or 'object + to-infinitive' (requires staff to adapt), but not directly by a to-infinitive: 'requires long-term thinking', not 'requires to think long-term'."], [265.22, 269.94, "Be careful! Don't say: Leadership requires to think long-term."], [271.9, 275.21, "Say: Leadership requires long-term thinking."], [275.51, 277.48, "Requires + noun phrase."], [278.27, 280.99, "Part four: reading. Read and listen."], [281.8, 283.31, "Leading Beyond Today."], [283.61, 291.38, "Strategic leadership differs from day-to-day management because it focuses on where an organisation should be in ten years, not ten days."], [292.37, 299.1, "It requires the ability to interpret trends, align people around a shared vision and make difficult trade-offs."], [300.1, 306.81, "Effective strategic leaders also recognise that an organisation's future depends on talent development and succession planning."], [307.8, 314.44, "Many family businesses in Southeast Asia have struggled because authority remained concentrated in a single founder."], [315.43, 322.71, "Ultimately, a leader's success is measured less by what they achieve personally than by what the organisation achieves after they leave."], [323.8, 327.81, "Part five: quiz. Five questions. Are you ready?"], [328.65, 330.56, "Good leadership requires blank."], [330.86, 334.62, "A, to listen. B, careful listening. C, listen."], [338.17, 340.67, "The answer is B: careful listening."], [341.82, 344.92, "Preparing future leaders to replace current ones is blank."], [345.22, 350.06, "A, succession planning. B, culture building. C, decision-making."], [353.6, 355.9, "The answer is A: succession planning."], [357.05, 359.94, "Building employees' skills and potential is blank."], [360.24, 365.53, "A, vision alignment. B, organizational agility. C, talent development."], [369.1, 371.84, "The answer is C: talent development."], [372.98, 374.6, "Choose the correct sentence."], [374.9, 382.31, "A, The role requires to travel often.. B, The role requires frequent travel.. C, The role requires of travel.."], [385.87, 389.19, "The answer is B: The role requires frequent travel.."], [390.35, 393.81, "According to the reading, a leader's success is measured by…"], [394.11, 400.63, "A, personal wealth. B, what the organisation achieves after they leave. C, the number of meetings."], [404.2, 408.12, "The answer is B: what the organisation achieves after they leave."], [409.3, 412.14, "Part six: speaking. It's your turn to talk."], [412.98, 416.49, "What quality do you think defines truly strategic leadership?"], [433.28, 434.75, "Now listen to Visal."], [435.05, 473.98, "I think the defining quality of strategic leadership is long-term thinking combined with the humility to develop others. Many managers can solve today's problems, but strategic leadership requires imagining the future and preparing the organisation for it. For example, a leader who invests in training young staff may see lower profits this year but a much stronger company in ten years. Such leadership also depends on clear communication, because a vision is useless unless everyone understands and shares it."], [474.28, 476.01, "Excellent answer, Visal!"], [476.92, 482.61, "Great work! Now you can use eight new words and depends on and requires plus noun phrase."], [482.91, 488.28, "Today's value is strategic vision. See the bigger picture, and plan for where you want to be."], [488.58, 491.05, "See you in Unit twenty. Goodbye!"], [491.35, 495.06, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C1B4-Unit20-Sustainable-Business": [[0.35, 4.89, "Hello, everyone! I'm Ms. Emma. Welcome to Online C one, Book four."], [5.19, 8.85, "Hi! I'm Visal. Let's learn together!"], [9.15, 15.07, "Unit twenty: Sustainable Business. Today you will set conditions for green growth with provided that."], [15.37, 17.95, "Here is our lesson map. Let's start!"], [18.9, 21.88, "Part one: words. You will learn eight new words."], [22.72, 24.08, "Sustainability."], [25.08, 29.77, "Sustainability means meeting present needs without harming future generations."], [30.35, 33.85, "Sustainability is now part of the company's core strategy."], [34.45, 37.75, "Your turn. Say: Sustainability."], [40.6, 41.94, "Sustainability."], [42.68, 43.48, "ESG."], [44.48, 49.37, "ESG means environmental, social and governance criteria used to judge companies."], [49.98, 53.07, "Investors screen firms using ESG scores."], [53.68, 56.31, "Your turn. Say: ESG."], [59.17, 59.95, "ESG."], [60.68, 61.96, "Carbon footprint."], [62.95, 67.97, "Carbon footprint means the total greenhouse gases caused by an activity or organisation."], [68.58, 72.07, "Switching to solar power halved the factory's carbon footprint."], [72.68, 76.0, "Your turn. Say: Carbon footprint."], [78.83, 80.14, "Carbon footprint."], [80.88, 82.23, "Circular economy."], [83.22, 88.49, "Circular economy means a system that reuses and recycles materials instead of discarding them."], [89.08, 92.55, "In a circular economy, old clothes become new fabric."], [93.15, 96.45, "Your turn. Say: Circular economy."], [99.3, 101.0, "Circular economy."], [101.75, 102.96, "Stakeholder."], [103.95, 108.18, "Stakeholder means anyone affected by or interested in a company's actions."], [108.78, 111.9, "Local fishermen are key stakeholders in the port project."], [112.48, 115.3, "Your turn. Say: Stakeholder."], [118.13, 119.3, "Stakeholder."], [120.05, 120.98, "Reporting."], [121.98, 125.26, "Reporting means publishing information about performance."], [125.85, 129.34, "Sustainability reporting must be honest to be credible."], [129.95, 132.84, "Your turn. Say: Reporting."], [135.7, 136.7, "Reporting."], [137.45, 138.14, "Green."], [139.15, 141.86, "Green means environmentally friendly."], [142.45, 145.73, "Green packaging made from banana leaves attracted tourists."], [146.32, 148.62, "Your turn. Say: Green."], [151.47, 152.12, "Green."], [152.88, 154.22, "Long-term value."], [155.22, 158.56, "Lon
