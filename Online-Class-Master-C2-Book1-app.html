, [448.72, 450.25, "Excellent answer, Visal!"], [451.15, 455.47, "Great work! Now you can use eight new words and rather than plus noun and gerund."], [455.77, 460.56, "Today's value is impartiality. Treat every side fairly, without taking sides."], [460.86, 463.54, "See you in Unit nineteen. Goodbye!"], [463.84, 466.73, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C2B1-Unit19-Legacy-Building": [[0.35, 5.0, "Hello, everyone! I'm Ms. Emma. Welcome to Online C two, Book one."], [5.3, 8.71, "Hi! I'm Visal. Let's learn together!"], [9.01, 15.63, "Unit nineteen: Legacy Building. Today you will describe lasting effects with beyond + noun phrase."], [15.93, 18.69, "Here is our lesson map. Let's start!"], [19.63, 22.9, "Part one: words. You will learn eight new words."], [23.75, 24.7, "Legacy."], [25.72, 29.26, "Legacy means what someone leaves behind that continues to matter."], [29.85, 32.7, "Her legacy is a network of community clinics."], [33.28, 35.34, "Your turn. Say: Legacy."], [38.2, 39.42, "Legacy."], [40.18, 41.61, "Long-term impact."], [42.62, 46.43, "Long-term impact means an effect that continues for many years."], [47.02, 51.31, "The scholarship's long-term impact is visible across the province."], [51.92, 54.71, "Your turn. Say: Long-term impact."], [57.57, 60.84, "Long-term impact."], [61.58, 62.91, "Succession planning."], [63.92, 68.02, "Succession planning means preparing others to take over leadership roles."], [68.62, 71.95, "Succession planning ensured the school survived its founder."], [72.55, 75.33, "Your turn. Say: Succession planning."], [78.17, 79.68, "Succession planning."], [80.42, 82.1, "Institutional memory."], [83.12, 87.8, "Institutional memory means knowledge and experience retained by an organisation."], [88.38, 92.03, "Documentation preserves institutional memory when staff leave."], [92.62, 95.75, "Your turn. Say: Institutional memory."], [98.6, 100.53, "Institutional memory."], [101.28, 102.33, "Mentorship."], [103.32, 107.52, "Mentorship means guidance from an experienced person to a less experienced one."], [108.12, 111.05, "Mentorship is the most personal form of legacy."], [111.65, 114.47, "Your turn. Say: Mentorship."], [117.3, 118.3, "Mentorship."], [119.05, 120.36, "Sustainability."], [121.35, 124.41, "Sustainability means the ability to continue over time."], [125.02, 127.89, "Local funding secured the project's sustainability."], [128.48, 131.56, "Your turn. Say: Sustainability."], [134.4, 135.84, "Sustainability."], [136.58, 137.6, "Values."], [138.58, 141.96, "Values means principles that guide behaviour and decisions."], [142.55, 145.47, "The founder's values still guide hiring decisions."], [146.08, 148.98, "Your turn. Say: Values."], [151.83, 152.88, "Values."], [153.62, 154.71, "Contribution."], [155.72, 159.33, "Contribution means something given to help a cause or community."], [159.92, 162.86, "His contribution to Khmer literature is enormous."], [163.45, 166.51, "Your turn. Say: Contribution."], [169.37, 170.47, "Contribution."], [171.27, 174.72, "Part two: dialogue. Let's listen to a conversation."], [175.58, 180.84, "Visal, the founder of a famous Siem Reap school has just died. Will the school survive?"], [181.95, 191.1, "I believe so. Her influence extends far beyond her own lifetime, because she trained former students to become its leaders."], [192.22, 195.17, "Isn't the school really built around her personality?"], [196.28, 205.63, "It was at first. But she deliberately built systems, values and institutional memory that reach beyond any single person."], [206.75, 208.99, "So legacy is mainly about planning?"], [210.08, 219.2, "Planning and generosity. A true legacy lasts beyond any single career, because others have been empowered to continue and improve the work."], [220.37, 222.32, "Part three: grammar."], [223.18, 226.82, "Grammar focus: Beyond plus noun phrase (lasting effect)."], [227.12, 228.4, "Look at the pattern."], [229.08, 232.42, "A true legacy lasts beyond any single career."], [233.32, 236.27, "Her influence extends far beyond her own lifetime."], [237.18, 239.94, "Good systems reach beyond any single person."], [240.9, 251.41, "'Beyond' is a preposition followed directly by a noun phrase (beyond a career — not 'beyond of'). Intensify with 'far', 'well' or 'long': far beyond, well beyond, long beyond."], [252.15, 256.25, "Be careful! Don't say: A legacy lasts beyond of a career."], [258.2, 261.01, "Say: A legacy lasts beyond a career."], [261.31, 262.94, "Beyond + noun (no 'of')."], [263.73, 266.36, "Part four: reading. Read and listen."], [267.17, 268.92, "Building Beyond Ourselves."], [269.22, 276.11, "Many leaders aspire to leave a legacy, yet relatively few organisations outlive their founders by more than a generation."], [277.1, 284.45, "Research on family businesses and NGOs suggests that the difference lies in succession planning and the transfer of institutional memory."], [285.47, 292.33, "Leaders who centralise every decision may achieve remarkable results, but their influence rarely extends beyond their own tenure."], [293.33, 299.94, "By contrast, leaders who invest in mentorship and clear values create organisations capable of renewing themselves."], [300.93, 306.73, "Legacy, therefore, is less about personal recognition than about building something that continues to grow beyond oneself."], [307.83, 311.81, "Part five: quiz. Five questions. Are you ready?"], [312.65, 315.19, "His fame spread far blank Cambodia."], [315.5, 319.25, "A, beyond. B, beyond of. C, beyond to."], [322.8, 324.88, "The answer is A: beyond."], [326.02, 328.71, "Knowledge retained by an organisation is blank."], [329.01, 333.79, "A, institutional memory. B, values. C, sustainability."], [337.33, 340.45, "The answer is A: institutional memory."], [341.58, 344.66, "Preparing others to take over leadership roles is blank."], [344.96, 349.51, "A, contribution. B, mentorship. C, succession planning."], [353.07, 355.63, "The answer is C: succession planning."], [356.78, 358.67, "Choose the correct sentence."], [358.97, 367.68, "A, Her work lasted well beyond her retirement.. B, Her work lasted well beyond of her retirement.. C, Her work lasted beyond to her retirement.."], [371.23, 375.15, "The answer is A: Her work lasted well beyond her retirement.."], [376.28, 379.7, "According to the reading, leaders who centralise every decision…"], [380.0, 386.67, "A, build lasting organisations. B, rarely extend influence beyond their tenure. C, always succeed."], [390.23, 394.15, "The answer is B: rarely extend influence beyond their tenure."], [395.33, 398.7, "Part six: speaking. It's your turn to talk."], [399.55, 403.38, "What kind of legacy would you like to leave in your community or career?"], [420.18, 421.69, "Now listen to Visal."], [422.0, 457.9, "In my community, I would like to leave a legacy of educational opportunity that extends beyond my own lifetime. Ideally, I would help establish a small learning centre where rural children could access books, technology and mentors. More importantly, I would train young volunteers to manage it, so that the project continues long after I step back. A legacy that depends on one person is fragile, whereas one built on shared values and capable successors can grow for generations."], [458.2, 459.86, "Excellent answer, Visal!"], [460.75, 465.89, "Great work! Now you can use eight new words and beyond plus noun phrase (lasting effect)."], [466.19, 470.99, "Today's value is legacy. Live in a way that leaves the world better for those who follow."], [471.29, 473.97, "See you in Unit twenty. Goodbye!"], [474.27, 476.96, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C2B1-Unit20-Coaching-and-Mentoring": [[0.35, 4.85, "Hello, everyone! I'm Ms. Emma. Welcome to Online C two, Book one."], [5.15, 9.0, "Hi! I'm Visal. Let's learn together!"], [9.3, 15.88, "Unit twenty: Coaching and Mentoring. Today you will advise formally with the subjunctive after suggest / recommend."], [16.18, 18.9, "Here is our lesson map. Let's start!"], [19.87, 23.17, "Part one: words. You will learn eight new words."], [24.02, 24.83, "Coaching."], [25.82, 30.07, "Coaching means structured support to improve specific skills or performance."], [30.68, 33.91, "Executive coaching helped him handle difficult meetings."], [34.52, 37.1, "Your turn. Say: Coaching."], [39.93, 40.68, "Coaching."], [41.42, 42.37, "Mentor."], [43.38, 46.25, "Mentor means an experienced and trusted adviser."], [46.85, 49.63, "My mentor taught me to ask better questions."], [50.22, 52.66, "Your turn. Say: Mentor."], [55.5, 56.49, "Mentor."], [57.25, 58.23, "Mentee."], [59.22, 62.05, "Mentee means a person who is guided by a mentor."], [62.65, 64.87, "Each mentee meets their mentor monthly."], [65.48, 67.87, "Your turn. Say: Mentee."], [70.73, 71.5, "Mentee."], [72.25, 73.03, "Growth."], [74.02, 77.8, "Growth means the process of developing personally or professionally."], [78.42, 80.11, "Feedback is the engine of growth."], [80.72, 82.8, "Your turn. Say: Growth."], [85.67, 86.71, "Growth."], [87.45, 88.29, "Feedback."], [89.28, 92.69, "Feedback means information about performance used for improvement."], [93.28, 96.35, "Specific feedback is more useful than general praise."], [96.95, 99.5, "Your turn. Say: Feedback."], [102.33, 103.39, "Feedback."], [104.15, 105.26, "Potential."], [106.25, 109.82, "Potential means qualities that may develop into future success."], [110.42, 113.36, "A good mentor sees potential before the mentee does."], [113.95, 116.56, "Your turn. Say: Potential."], [119.4, 120.41, "Potential."], [121.15, 122.2, "Reflection."], [123.18, 127.03, "Reflection means careful thought about one's experiences and actions."], [127.62, 129.79, "Weekly reflection deepened her learning."], [130.38, 133.57, "Your turn. Say: Reflection."], [136.43, 137.5, "Reflection."], [138.25, 139.02, "Trust."], [140.02, 143.72, "Trust means confidence that allows honest, open communication."], [144.32, 147.43, "Mentoring works only when trust is established."], [148.02, 150.51, "Your turn. Say: Trust."], [153.37, 154.17, "Trust."], [154.97, 158.47, "Part two: dialogue. Let's listen to a conversation."], [159.32, 165.37, "Visal, a young engineer at our firm is talented but keeps missing deadlines. What would you recommend?"], [166.48, 172.66, "I'd suggest that she seek a mentor rather than just attend another time-management course."], [173.75, 176.02, "Why a mentor rather than a coach?"], [177.12, 189.08, "A coach focuses on specific skills, whereas a mentor shares broader experience. I'd also recommend that the mentor be someone outside her direct reporting line."], [190.18, 191.45, "Why does that matter?"], [192.55, 200.73, "So she can admit difficulties freely. It's essential that the relationship remain confidential, otherwise trust never develops."], [201.87, 203.54, "Part three: grammar."], [204.38, 207.9, "Grammar focus: Subjunctive after suggest and recommend."], [208.2, 209.43, "Look at the pattern."], [210.12, 212.09, "I suggest that she seek a mentor."], [212.98, 216.24, "We recommend that the mentor be outside her reporting line."], [217.15, 220.29, "It is essential that the relationship remain confidential."], [221.23, 232.84, "After suggest, recommend, propose, insist, demand and ask (that), formal English uses the base verb for every subject: that he seek, that she be, that it remain. Negative: that he not be late."], [233.58, 237.34, "Be careful! Don't say: I suggest that she seeks a mentor."], [239.3, 242.41, "Say: I suggest that she seek a mentor."], [242.71, 244.59, "Subjunctive: base verb."], [245.4, 248.1, "Part four: reading. Read and listen."], [248.9, 249.96, "Guiding Growth."], [250.26, 255.88, "Coaching and mentoring are often confused, yet they serve different purposes in professional development."], [256.87, 265.29, "Coaching is typically short-term and performance-focused, whereas mentoring is a longer relationship centred on overall growth and career direction."], [266.3, 273.35, "Experts recommend that mentoring relationships be built on clear expectations, confidentiality and mutual commitment."], [274.33, 280.41, "Effective mentors ask more than they tell, encouraging reflection rather than providing ready-made answers."], [281.4, 290.55, "Research suggests that people with mentors are promoted more often and report greater job satisfaction, benefits that frequently extend to the mentors themselves."], [291.67, 295.82, "Part five: quiz. Five questions. Are you ready?"], [296.68, 299.23, "The doctor recommended that he blank more water."], [299.53, 302.53, "A, drinks. B, drink. C, drank."], [306.07, 308.21, "The answer is B: drink."], [309.35, 312.19, "A person who is guided by a mentor is a blank."], [312.49, 316.05, "A, mentee. B, coach. C, mentor."], [319.6, 321.39, "The answer is A: mentee."], [322.55, 325.29, "Careful thought about one's experiences is blank."], [325.59, 329.29, "A, potential. B, feedback. C, reflection."], [332.83, 335.29, "The answer is C: reflection."], [336.45, 338.45, "Choose the correct sentence."], [338.75, 345.96, "A, She insisted that he is present.. B, She insisted that he be present.. C, She insisted that he to be present.."], [349.5, 352.46, "The answer is B: She insisted that he be present.."], [353.62, 356.49, "According to the reading, effective mentors…"], [356.79, 363.53, "A, give ready-made answers. B, ask more than they tell. C, focus only on short-term tasks."], [367.07, 369.83, "The answer is B: ask more than they tell."], [371.03, 374.45, "Part six: speaking. It's your turn to talk."], [375.32, 377.63, "Who has mentored you, and what did you learn?"], [394.42, 395.93, "Now listen to Visal."], [396.23, 429.0, "My most influential mentor was my secondary-school English teacher, who noticed that I enjoyed reading but lacked confidence in speaking. Rather than simply correcting my mistakes, she suggested that I join the debate club and asked me to reflect on each performance. From her I learned that growth requires discomfort and that good feedback is specific and kind. Today, I recommend that every student find someone who believes in their potential before they believe in it themselves."], [429.3, 431.22, "Excellent answer, Visal!"], [432.12, 436.98, "Great work! Now you can use eight new words and subjunctive after suggest and recommend."], [437.27, 441.17, "Today's value is mentorship. Share what you know to help others grow."], [441.47, 444.03, "See you in Unit twenty-one. Goodbye!"], [444.33, 447.84, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C2B1-Unit21-Emotional-Intelligence-in-Leadership": [[0.35, 5.11, "Hello, everyone! I'm Ms. Emma. Welcome to Online C two, Book one."], [5.41, 9.08, "Hi! I'm Visal. Let's learn together!"], [9.38, 16.74, "Unit twenty-one: Emotional Intelligence in Leadership. Today you will emphasise rarity with negative inversion (Rarely / Seldom)."], [17.04, 19.76, "Here is our lesson map. Let's start!"], [20.7, 23.86, "Part one: words. You will learn eight new words."], [24.72, 26.55, "Emotional intelligence."], [27.55, 33.55, "Emotional intelligence means the ability to recognise and manage emotions in oneself and others."], [34.15, 38.02, "Emotional intelligence predicted leadership success better than IQ."], [38.62, 42.06, "Your turn. Say: Emotional intelligence."], [44.9, 46.82, "Emotional intelligence."], [47.58, 49.07, "Self-awareness."], [50.08, 55.55, "Self-awareness means conscious knowledge of one's own feelings, strengths and weaknesses."], [56.15, 59.91, "Self-awareness helped him notice when stress affected his tone."], [60.52, 63.67, "Your turn. Say: Self-awareness."], [66.53, 68.05, "Self-awareness."], [68.78, 69.77, "Empathy."], [70.78, 75.12, "Empathy means the ability to understand and share another person's feelings."], [75.72, 78.38, "Empathy allowed her to sense the team's exhaustion."], [78.98, 81.09, "Your turn. Say: Empathy."], [83.93, 84.89, "Empathy."], [85.65, 87.05, "Self-regulation."], [88.05, 92.25, "Self-regulation means controlling one's impulses and emotional reactions."], [92.85, 95.86, "Self-regulation stopped him from sending an angry email."], [96.45, 98.89, "Your turn. Say: Self-regulation."], [101.73, 103.19, "Self-regulation."], [103.95, 105.14, "Motivation."], [106.15, 109.75, "Motivation means inner drive to achieve goals for their own sake."], [110.35, 113.69, "Intrinsic motivation sustains leaders through setbacks."], [114.28, 117.02, "Your turn. Say: Motivation."], [119.87, 120.87, "Motivation."], [121.62, 123.13, "Social skills."], [124.12, 128.59, "Social skills means abilities to build relationships and manage interactions."], [129.18, 132.55, "Strong social skills made her an effective negotiator."], [133.15, 136.02, "Your turn. Say: Social skills."], [138.87, 140.41, "Social skills."], [141.15, 142.37, "Resilience."], [143.38, 146.95, "Resilience means the capacity to recover from difficulties."], [147.55, 150.62, "Resilience is strengthened by supportive relationships."], [151.22, 154.12, "Your turn. Say: Resilience."], [156.97, 158.11, "Resilience."], [158.85, 160.0, "Influence."], [161.02, 164.99, "Influence means the ability to affect others' attitudes and actions."], [165.58, 168.88, "Emotional intelligence increases a leader's influence."], [169.48, 171.82, "Your turn. Say: Influence."], [174.67, 175.82, "Influence."], [176.63, 180.21, "Part two: dialogue. Let's listen to a conversation."], [181.05, 187.32, "Visal, our department head is brilliant technically, but people avoid her. Is intelligence not enough to lead?"], [188.42, 197.84, "Rarely does a leader succeed without empathy. Technical brilliance earns respect, but emotional intelligence earns cooperation."], [198.95, 202.88, "Can she change, though? Isn't empathy a personality trait?"], [203.98, 212.94, "Research suggests it can be developed. Seldom do people improve, however, without honest feedback and a genuine wish to change."], [214.05, 215.31, "Where should she start?"], [216.42, 225.16, "With self-awareness. Only when leaders recognise their own emotional triggers can they regulate them in difficult moments."], [226.3, 228.02, "Part three: grammar."], [228.88, 232.16, "Grammar focus: Inversion with Rarely and Seldom."], [232.46, 233.68, "Look at the pattern."], [234.38, 237.09, "Rarely does a leader succeed without empathy."], [237.98, 240.94, "Seldom do people improve without honest feedback."], [241.85, 245.17, "Only when leaders recognise their triggers can they regulate them."], [246.13, 258.33, "After negative or restrictive adverbs at the start of a clause, invert the auxiliary and subject as in a question: Rarely does she…, Seldom have we…, Never had I…, Only then did they…. Use 'do/does/did' when there is no other auxiliary."], [259.08, 262.97, "Be careful! Don't say: Rarely a leader succeeds alone."], [264.9, 267.31, "Say: Rarely does a leader succeed alone."], [267.61, 270.15, "Rarely + auxiliary + subject."], [270.97, 273.49, "Part four: reading. Read and listen."], [274.3, 275.75, "The Other Intelligence."], [276.05, 283.95, "The concept of emotional intelligence was popularised by Daniel Goleman, who argued that it matters as much as cognitive ability in leadership."], [284.97, 291.08, "His model comprises self-awareness, self-regulation, motivation, empathy and social skills."], [292.07, 302.29, "Rarely do technical skills alone distinguish outstanding leaders, since most senior candidates already possess them; emotional competencies, by contrast, vary widely."], [303.3, 309.24, "Critics caution that emotional intelligence is difficult to measure and that some claims about it have been exaggerated."], [310.23, 316.87, "Nevertheless, seldom has anyone disputed that leaders who manage emotions skilfully create more trusting and resilient teams."], [317.97, 321.99, "Part five: quiz. Five questions. Are you ready?"], [322.85, 324.86, "Rarely blank such dedication."], [325.16, 328.94, "A, I have seen. B, have I seen. C, I seen."], [332.5, 334.52, "The answer is B: have I seen."], [335.68, 338.98, "Controlling one's impulses and emotional reactions is blank."], [339.28, 343.16, "A, self-regulation. B, empathy. C, influence."], [346.7, 349.22, "The answer is A: self-regulation."], [350.38, 353.05, "Conscious knowledge of one's own feelings is blank."], [353.35, 358.36, "A, resilience. B, social skills. C, self-awareness."], [361.9, 364.72, "The answer is C: self-awareness."], [365.88, 367.67, "Choose the correct sentence."], [367.97, 373.88, "A, Seldom he complains.. B, Seldom does he complain.. C, Seldom does he complains.."], [377.43, 380.07, "The answer is B: Seldom does he complain.."], [381.22, 384.95, "According to the reading, critics say emotional intelligence is…"], [385.25, 389.64, "A, easy to measure. B, difficult to measure. C, unimportant."], [393.2, 395.71, "The answer is B: difficult to measure."], [396.9, 400.35, "Part six: speaking. It's your turn to talk."], [401.22, 403.4, "Can emotional intelligence be learned?"], [420.22, 421.68, "Now listen to Visal."], [421.98, 459.43, "I believe emotional intelligence can largely be learned, although people begin with different natural tendencies. Self-awareness, for instance, can be developed through reflection, feedback and mindfulness practice. Empathy improves when we deliberately listen to understand rather than to reply. However, rarely does change happen quickly or without effort; it requires honest feedback and consistent practice. A leader who once lost his temper frequently can, with commitment, learn to pause and respond calmly."], [459.73, 461.31, "Excellent answer, Visal!"], [462.22, 466.66, "Great work! Now you can use eight new words and inversion with rarely and seldom."], [466.96, 470.49, "Today's value is empathy. Think about how others feel."], [470.79, 473.69, "See you in Unit twenty-two. Goodbye!"], [473.99, 476.86, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C2B1-Unit22-Ethical-Leadership": [[0.35, 5.35, "Hello, everyone! I'm Ms. Emma. Welcome to Online C two, Book one."], [5.65, 9.21, "Hi! I'm Visal. Let's learn together!"], [9.51, 16.17, "Unit twenty-two: Ethical Leadership. Today you will reason across time with mixed conditionals."], [16.47, 19.06, "Here is our lesson map. Let's start!"], [20.0, 23.29, "Part one: words. You will learn eight new words."], [24.15, 25.2, "Ethics."], [26.18, 29.16, "Ethics means moral principles that govern behaviour."], [29.75, 33.41, "Business ethics should guide decisions, not just public relations."], [34.02, 36.58, "Your turn. Say: Ethics."], [39.43, 40.45, "Ethics."], [41.18, 42.24, "Integrity."], [43.25, 47.22, "Integrity means consistency between one's values and actions."], [47.82, 50.7, "Her integrity was tested when a bribe was offered."], [51.28, 53.75, "Your turn. Say: Integrity."], [56.6, 57.73, "Integrity."], [58.48, 59.95, "Transparency."], [60.95, 64.54, "Transparency means openness about decisions and information."], [65.15, 68.25, "Transparency about donations built public trust."], [68.85, 71.9, "Your turn. Say: Transparency."], [74.73, 75.91, "Transparency."], [76.65, 78.0, "Accountability."], [78.98, 83.5, "Accountability means readiness to accept responsibility for one's actions."], [84.12, 86.81, "Accountability means owning mistakes publicly."], [87.42, 90.17, "Your turn. Say: Accountability."], [93.03, 94.42, "Accountability."], [95.18, 96.3, "Values."], [97.32, 100.66, "Values means core beliefs about what is right and important."], [101.25, 104.33, "The company's values were displayed but rarely practised."], [104.92, 107.96, "Your turn. Say: Values."], [110.8, 111.95, "Values."], [112.72, 113.5, "Dilemma."], [114.48, 118.57, "Dilemma means a situation requiring a choice between difficult options."], [119.18, 122.1, "Reporting a friend's fraud posed a painful dilemma."], [122.72, 125.3, "Your turn. Say: Dilemma."], [128.13, 129.11, "Dilemma."], [129.85, 130.63, "Trust."], [131.62, 135.11, "Trust means confidence in someone's reliability and honesty."], [135.72, 138.18, "Trust, once broken, is slow to rebuild."], [138.78, 141.28, "Your turn. Say: Trust."], [144.13, 145.05, "Trust."], [145.82, 146.75, "Role model."], [147.75, 151.1, "Role model means a person whose behaviour others imitate."], [151.68, 154.59, "Leaders are role models whether they intend to be or not."], [155.18, 157.6, "Your turn. Say: Role model."], [160.47, 161.94, "Role model."], [162.73, 166.28, "Part two: dialogue. Let's listen to a conversation."], [167.12, 173.83, "Visal, an accountant noticed irregular payments two years ago but said nothing. Now the company faces a scandal."], [174.92, 182.46, "It's a painful lesson. Had she spoken up earlier, the problem would not exist on this scale now."], [183.55, 185.54, "But she feared losing her job."], [186.65, 197.01, "Understandably. Yet if the company had a genuine speak-up culture, she would have reported it immediately. The system failed her as much as she failed it."], [198.12, 200.07, "What should leaders learn from this?"], [201.18, 211.47, "That ethics must be protected structurally. If whistleblowers had been protected, the board would be dealing with a minor issue today, not a crisis."], [212.63, 214.37, "Part three: grammar."], [215.22, 217.75, "Grammar focus: Mixed conditionals."], [218.05, 219.18, "Look at the pattern."], [219.88, 223.43, "Had she spoken up earlier, the problem would not exist now."], [224.32, 226.81, "If he had saved money, he would be secure today."], [227.72, 230.67, "Had they acted sooner, we would not be in crisis now."], [231.63, 243.58, "Mixed conditionals link a past cause to a present result: If I had studied, I would be a doctor now. 'Had + subject + p.p.' is the formal inverted form of 'If + subject + had + p.p.'."], [244.32, 248.43, "Be careful! Don't say: Had she spoke up, it wouldn't exist."], [250.37, 252.92, "Say: Had she spoken up, it wouldn't exist."], [253.22, 255.19, "Had + past participle."], [256.0, 258.64, "Part four: reading. Read and listen."], [259.43, 261.11, "When Silence Is Costly."], [261.41, 267.95, "Ethical leadership involves not only personal integrity but also the creation of environments in which others can act ethically."], [268.93, 275.67, "Investigations into corporate scandals frequently reveal that employees had noticed problems long before they became public."], [276.67, 283.79, "Had those concerns been heard, many organisations would not be struggling with damaged reputations and legal consequences today."], [284.8, 291.69, "Leaders shape behaviour powerfully as role models, since employees quickly learn which values are rewarded and which are merely displayed."], [292.7, 299.36, "Ethical leadership is therefore demonstrated less in public statements than in how leaders respond to inconvenient truths."], [300.47, 304.53, "Part five: quiz. Five questions. Are you ready?"], [305.38, 307.77, "If I had saved money, I blank rich now."], [308.07, 311.62, "A, would be. B, would have been. C, will be."], [315.17, 317.22, "The answer is A: would be."], [318.38, 322.48, "A situation requiring a choice between difficult options is a blank."], [322.78, 326.87, "A, role model. B, dilemma. C, value."], [330.43, 332.43, "The answer is B: dilemma."], [333.58, 337.35, "Readiness to accept responsibility for one's actions is blank."], [337.65, 342.47, "A, transparency. B, integrity. C, accountability."], [346.03, 348.74, "The answer is C: accountability."], [349.88, 351.95, "Choose the correct mixed conditional."], [352.25, 361.33, "A, Had she studied law, she would be a lawyer now.. B, Had she studied law, she will be a lawyer now.. C, If she studied law, she would have been now.."], [364.87, 368.64, "The answer is A: Had she studied law, she would be a lawyer now.."], [369.78, 373.75, "According to the reading, ethical leadership is demonstrated mainly in…"], [374.05, 380.03, "A, public statements. B, responses to inconvenient truths. C, annual reports."], [383.57, 387.25, "The answer is B: responses to inconvenient truths."], [388.43, 391.55, "Part six: speaking. It's your turn to talk."], [392.42, 395.53, "What would you do if your manager asked you to act unethically?"], [412.32, 413.72, "Now listen to Visal."], [414.02, 448.18, "If my manager asked me to act unethically, I would first clarify the request, because misunderstandings sometimes occur. If it were genuinely wrong, I would refuse politely but firmly, explaining my concerns and suggesting an ethical alternative. Should the pressure continue, I would raise the issue with HR or a compliance officer. Had I stayed silent, I might avoid conflict now, but I would be complicit if harm occurred later. My integrity is worth more than any single job."], [448.48, 450.07, "Excellent answer, Visal!"], [450.98, 454.83, "Great work! Now you can use eight new words and mixed conditionals."], [455.13, 459.57, "Today's value is integrity. Do the right thing, even when no one is watching."], [459.87, 463.48, "See you in Unit twenty-three. Goodbye!"], [463.78, 466.87, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C2B1-Unit23-Decisions-Under-Pressure": [[0.35, 5.92, "Hello, everyone! I'm Ms. Emma. Welcome to Online C two, Book one."], [6.22, 9.49, "Hi! I'm Visal. Let's learn together!"], [9.79, 17.43, "Unit twenty-three: Decisions Under Pressure. Today you will express reasons concisely with participle clauses of reason."], [17.73, 20.29, "Here is our lesson map. Let's start!"], [21.23, 24.43, "Part one: words. You will learn eight new words."], [25.28, 26.19, "Decision."], [27.18, 30.23, "Decision means a choice made after consideration."], [30.82, 33.59, "The decision to evacuate saved hundreds of lives."], [34.18, 36.93, "Your turn. Say: Decision."], [39.77, 40.72, "Decision."], [41.48, 42.34, "Pressure."], [43.35, 46.34, "Pressure means stress caused by urgent demands."], [46.95, 49.54, "Under pressure, people tend to rely on habit."], [50.15, 52.71, "Your turn. Say: Pressure."], [55.57, 56.44, "Pressure."], [57.18, 58.27, "Uncertainty."], [59.25, 62.8, "Uncertainty means a state in which outcomes cannot be known."], [63.42, 66.19, "Leaders must act despite uncertainty."], [66.78, 69.48, "Your turn. Say: Uncertainty."], [72.33, 73.51, "Uncertainty."], [74.25, 75.16, "Risk."], [76.15, 79.12, "Risk means the possibility of loss or harm."], [79.72, 82.54, "Every option carried a different kind of risk."], [83.15, 85.95, "Your turn. Say: Risk."], [88.8, 89.67, "Risk."], [90.42, 91.42, "Intuition."], [92.42, 95.72, "Intuition means understanding reached without conscious reasoning."], [96.32, 99.45, "The firefighter's intuition told him the floor would collapse."], [100.05, 102.73, "Your turn. Say: Intuition."], [105.57, 106.63, "Intuition."], [107.38, 108.73, "Analysis."], [109.72, 113.43, "Analysis means detailed, systematic examination."], [114.05, 116.49, "Careful analysis revealed a hidden pattern."], [117.08, 120.05, "Your turn. Say: Analysis."], [122.9, 124.13, "Analysis."], [124.88, 126.09, "Trade-off."], [127.08, 130.95, "Trade-off means a compromise between competing benefits."], [131.55, 134.62, "Speed came at the trade-off of accuracy."], [135.22, 138.41, "Your turn. Say: Trade-off."], [141.27, 142.48, "Trade-off."], [143.22, 144.32, "Consequence."], [145.32, 148.86, "Consequence means a result of an action or decision."], [149.45, 151.9, "The consequences of the delay were severe."], [152.52, 155.49, "Your turn. Say: Consequence."], [158.33, 159.73, "Consequence."], [160.53, 164.2, "Part two: dialogue. Let's listen to a conversation."], [165.05, 174.94, "Visal, during the 2011 floods, a provincial governor had to decide whether to evacuate thousands of people with limited information. How do leaders cope?"], [176.05, 184.77, "Facing such uncertainty, the best leaders gather whatever data they can quickly, but they don't wait for perfect information."], [185.88, 187.74, "And if the data is unclear?"], [188.85, 198.96, "Then experience matters. Having seen similar floods before, an experienced official may sense danger that statistics haven't yet confirmed."], [200.05, 202.48, "So intuition beats analysis?"], [203.58, 212.82, "Not exactly. Knowing that intuition can be biased, wise leaders test it quickly against facts and adjust as evidence arrives."], [213.97, 215.26, "Part three: grammar."], [216.12, 219.27, "Grammar focus: Participle clauses of reason."], [219.57, 220.79, "Look at the pattern."], [221.48, 224.55, "Facing uncertainty, the leader gathered more data."], [225.45, 228.62, "Having seen similar floods, the official sensed the danger."], [229.52, 233.37, "Knowing that intuition can be biased, she tested it against facts."], [234.33, 245.38, "A participle clause can replace 'because/as + clause': Facing uncertainty (= Because he faced uncertainty), he… The implied subject must be the subject of the main clause, or the sentence 'dangles'."], [246.12, 250.2, "Be careful! Don't say: Facing uncertainty, data was gathered."], [252.13, 255.09, "Say: Facing uncertainty, she gathered data."], [255.38, 257.94, "Participle subject = main subject."], [258.73, 261.21, "Part four: reading. Read and listen."], [262.0, 263.65, "Thinking Fast and Slow."], [263.95, 270.03, "Psychologist Daniel Kahneman distinguished between fast, intuitive thinking and slow, analytical reasoning."], [271.03, 278.35, "Operating under pressure, people rely heavily on the fast system, which is efficient but vulnerable to biases such as overconfidence."], [279.37, 287.77, "Gary Klein's research on firefighters, however, showed that experienced experts often make excellent rapid decisions by recognising familiar patterns."], [288.77, 297.52, "Having studied both perspectives, many researchers conclude that intuition is trustworthy only in environments that provide regular, reliable feedback."], [298.53, 305.28, "Effective leaders therefore combine quick judgement with deliberate checks, especially when the consequences are irreversible."], [306.37, 310.46, "Part five: quiz. Five questions. Are you ready?"], [311.32, 313.44, "blank tired, she went to bed early."], [313.74, 316.96, "A, Feeling. B, Felt. C, To feel."], [320.5, 322.11, "The answer is A: Feeling."], [323.25, 326.26, "Understanding reached without conscious reasoning is blank."], [326.56, 330.62, "A, intuition. B, analysis. C, uncertainty."], [334.17, 336.14, "The answer is A: intuition."], [337.28, 340.12, "A result of an action or decision is a blank."], [340.42, 344.48, "A, risk. B, trade-off. C, consequence."], [348.03, 350.65, "The answer is C: consequence."], [351.78, 353.63, "Choose the correct sentence."], [353.93, 363.05, "A, Facing the storm, the boat was turned back.. B, Facing the storm, the captain turned the boat back.. C, Faced the storm, the captain turned back.."], [366.6, 371.12, "The answer is B: Facing the storm, the captain turned the boat back.."], [372.28, 376.16, "According to the reading, intuition is trustworthy in environments that…"], [376.46, 382.49, "A, provide regular, reliable feedback. B, are completely new. C, have no experts."], [386.03, 389.73, "The answer is A: provide regular, reliable feedback."], [390.93, 394.08, "Part six: speaking. It's your turn to talk."], [394.95, 397.11, "When should leaders trust their intuition?"], [413.92, 415.23, "Now listen to Visal."], [415.53, 449.76, "Leaders should trust their intuition mainly in situations where they have deep, relevant experience and where the environment provides reliable feedback. Having faced similar problems many times, an expert recognises patterns that cannot easily be explained. However, intuition is dangerous in unfamiliar or complex situations, such as new financial markets, because biases can masquerade as insight. Knowing this, I would trust intuition for urgent decisions but test it against data whenever time allows."], [450.06, 451.7, "Excellent answer, Visal!"], [452.58, 457.15, "Great work! Now you can use eight new words and participle clauses of reason."], [457.45, 462.04, "Today's value is prudence. Think carefully about risks before you act."], [462.34, 465.16, "See you in Unit twenty-four. Goodbye!"], [465.46, 468.3, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C2B1-Unit24-Organisational-Culture": [[0.35, 5.04, "Hello, everyone! I'm Ms. Emma. Welcome to Online C two, Book one."], [5.34, 8.86, "Hi! I'm Visal. Let's learn together!"], [9.16, 15.8, "Unit twenty-four: Organisational Culture. Today you will assert and counter doubts with emphatic do / does."], [16.1, 18.73, "Here is our lesson map. Let's start!"], [19.67, 22.95, "Part one: words. You will learn eight new words."], [23.78, 24.68, "Culture."], [25.68, 28.9, "Culture means the shared assumptions and behaviours of a group."], [29.52, 32.88, "Culture eats strategy for breakfast, as the saying goes."], [33.48, 35.87, "Your turn. Say: Culture."], [38.73, 39.66, "Culture."], [40.42, 41.53, "Values."], [42.55, 46.08, "Values means principles an organisation claims to live by."], [46.68, 49.37, "Their values are visible in how they treat cleaners."], [49.98, 53.02, "Your turn. Say: Values."], [55.87, 56.88, "Values."], [57.62, 58.54, "Norms."], [59.55, 62.71, "Norms means unwritten expectations about behaviour."], [63.32, 66.05, "Working late was an unspoken norm in the office."], [66.65, 69.11, "Your turn. Say: Norms."], [71.97, 72.94, "Norms."], [73.68, 74.6, "Belonging."], [75.62, 78.97, "Belonging means the feeling of being accepted and valued in a group."], [79.58, 82.17, "A sense of belonging reduced staff turnover."], [82.78, 85.68, "Your turn. Say: Belonging."], [88.53, 89.57, "Belonging."], [90.32, 91.25, "Toxic."], [92.25, 96.26, "Toxic means harmful and unpleasant, especially in relationships."], [96.85, 99.7, "A toxic culture drove away the best engineers."], [100.28, 103.02, "Your turn. Say: Toxic."], [105.87, 106.7, "Toxic."], [107.45, 108.51, "Inclusion."], [109.52, 113.59, "Inclusion means ensuring everyone can participate fully and fairly."], [114.18, 117.69, "Inclusion means every voice is heard, not just counted."], [118.28, 120.66, "Your turn. Say: Inclusion."], [123.5, 124.79, "Inclusion."], [125.55, 126.55, "Rituals."], [127.55, 131.51, "Rituals means repeated practices that express a group's identity."], [132.12, 134.7, "Friday team lunches became a cherished ritual."], [135.28, 137.62, "Your turn. Say: Rituals."], [140.47, 141.62, "Rituals."], [142.38, 143.48, "Performance."], [144.48, 148.54, "Performance means how well a person or organisation achieves results."], [149.15, 151.58, "Culture and performance are closely linked."], [152.18, 155.01, "Your turn. Say: Performance."], [157.87, 158.97, "Performance."], [159.77, 163.32, "Part two: dialogue. Let's listen to a conversation."], [164.18, 169.28, "Visal, my manager thinks culture is just a buzzword. He says only targets matter."], [170.38, 179.62, "Culture does affect performance, though. Teams that feel safe to raise problems fix them faster and lose fewer talented people."], [180.72, 183.0, "But he does reach his targets every quarter."], [184.08, 192.27, "He does, but at what cost? Three staff have resigned this year, and recruitment does cost the company money and time."], [193.38, 194.98, "So how would you convince him?"], [196.08, 204.97, "With data. Show him that teams with a sense of belonging do outperform others on retention, quality and customer satisfaction."], [206.13, 207.78, "Part three: grammar."], [208.65, 211.75, "Grammar focus: Emphatic do and does."], [212.05, 213.2, "Look at the pattern."], [213.92, 215.97, "Culture does affect performance."], [216.88, 219.21, "Recruitment does cost the company money."], [220.12, 223.27, "Inclusive teams do outperform others on retention."], [224.2, 235.57, "Use stressed 'do / does / did + base verb' to contradict doubt or add emphasis: 'He does care.' Remove the -s from the main verb: 'does affect' (not 'does affects'). In speech, stress the auxiliary."], [236.32, 240.01, "Be careful! Don't say: Culture does affects performance."], [241.97, 244.99, "Say: Culture does affect performance."], [245.29, 246.95, "Does + base verb."], [247.77, 250.47, "Part four: reading. Read and listen."], [251.27, 253.13, "Culture Eats Strategy."], [253.43, 260.91, "The phrase 'culture eats strategy for breakfast', often attributed to Peter Drucker, captures a widely shared intuition among managers."], [261.9, 269.86, "Edgar Schein described culture in three layers: visible artefacts, espoused values and deep, unspoken assumptions."], [270.87, 278.47, "Problems arise when espoused values conflict with actual norms, for example when a company praises balance but rewards those who work until midnight."], [279.47, 287.79, "Research does suggest that psychological safety, the belief that one can speak up without punishment, is a key feature of high-performing teams."], [288.8, 294.1, "Changing culture is slow, but leaders do shape it every day through what they reward, tolerate and model."], [295.2, 299.03, "Part five: quiz. Five questions. Are you ready?"], [299.88, 302.68, "I know you think he's lazy, but he blank work hard."], [302.98, 305.93, "A, does. B, is. C, do."], [309.47, 311.54, "The answer is A: does."], [312.68, 315.86, "Unwritten expectations about behaviour are blank."], [316.15, 319.9, "A, rituals. B, norms. C, values."], [323.47, 325.41, "The answer is B: norms."], [326.55, 329.07, "The feeling of being accepted in a group is blank."], [329.37, 333.11, "A, inclusion. B, performance. C, belonging."], [336.67, 338.67, "The answer is C: belonging."], [339.82, 341.42, "Choose the correct sentence."], [341.72, 348.48, "A, She does cares about her team.. B, She does care about her team.. C, She do care about her team.."], [352.03, 355.08, "The answer is B: She does care about her team.."], [356.22, 360.12, "According to the reading, Schein's deepest layer of culture consists of…"], [360.42, 366.12, "A, visible artefacts. B, espoused values. C, unspoken assumptions."], [369.67, 372.21, "The answer is C: unspoken assumptions."], [373.4, 376.71, "Part six: speaking. It's your turn to talk."], [377.55, 380.29, "How would you describe a healthy workplace culture?"], [397.08, 398.58, "Now listen to Visal."], [398.88, 434.48, "A healthy workplace culture is one in which people feel safe, respected and trusted to do their best work. Employees can raise problems or disagree with managers without fear, and mistakes are treated as opportunities to learn. Leaders do practise the values they promote, so there is no gap between words and behaviour. For example, a healthy company respects rest days rather than praising constant overtime. In my experience, such a culture does improve both wellbeing and results."], [434.78, 436.63, "Excellent answer, Visal!"], [437.52, 441.71, "Great work! Now you can use eight new words and emphatic do and does."], [442.01, 445.38, "Today's value is respect. Thank the people who help us."], [445.69, 448.57, "See you in Unit twenty-five. Goodbye!"], [448.87, 451.39, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C2B1-Unit25-Leading-Innovation": [[0.35, 5.07, "Hello, everyone! I'm Ms. Emma. Welcome to Online C two, Book one."], [5.37, 8.82, "Hi! I'm Visal. Let's learn together!"], [9.12, 16.14, "Unit twenty-five: Leading Innovation. Today you will express counterfactual dependence with Were it not for…."], [16.45, 19.13, "Here is our lesson map. Let's start!"], [20.07, 23.43, "Part one: words. You will learn eight new words."], [24.28, 25.37, "Innovation."], [26.35, 30.37, "Innovation means the introduction of new ideas, methods or products."], [30.98, 34.55, "Innovation in mobile payments transformed Cambodian retail."], [35.15, 37.77, "Your turn. Say: Innovation."], [40.63, 41.65, "Innovation."], [42.38, 43.81, "Experimentation."], [44.82, 49.09, "Experimentation means the process of testing ideas to learn what works."], [49.68, 52.81, "Constant experimentation kept the company ahead."], [53.42, 56.53, "Your turn. Say: Experimentation."], [59.4, 60.98, "Experimentation."], [61.72, 62.54, "Failure."], [63.55, 66.35, "Failure means lack of success in achieving an aim."], [66.95, 69.64, "Every failure revealed a flawed assumption."], [70.25, 72.8, "Your turn. Say: Failure."], [75.63, 76.61, "Failure."], [77.35, 78.54, "Creativity."], [79.55, 82.77, "Creativity means the ability to produce original ideas."], [83.38, 86.29, "Creativity flourishes when people feel safe to fail."], [86.88, 89.55, "Your turn. Say: Creativity."], [92.4, 93.45, "Creativity."], [94.18, 95.18, "Disruption."], [96.18, 99.99, "Disruption means radical change that transforms an industry."], [100.58, 103.44, "Digital disruption reshaped banking within a decade."], [104.05, 106.69, "Your turn. Say: Disruption."], [109.53, 110.78, "Disruption."], [111.52, 112.54, "Prototype."], [113.55, 116.86, "Prototype means an early model built to test a concept."], [117.45, 119.87, "The first prototype was made of cardboard."], [120.48, 123.2, "Your turn. Say: Prototype."], [126.07, 127.1, "Prototype."], [127.85, 129.01, "Iteration."], [130.02, 132.86, "Iteration means a repeated cycle of improvement."], [133.45, 135.74, "Each iteration made the app simpler."], [136.35, 139.3, "Your turn. Say: Iteration."], [142.17, 143.33, "Iteration."], [144.08, 144.89, "Vision."], [145.88, 149.49, "Vision means a clear, inspiring idea of the future."], [150.08, 152.66, "Vision gives experimentation a direction."], [153.25, 155.44, "Your turn. Say: Vision."], [158.3, 159.16, "Vision."], [159.97, 163.48, "Part two: dialogue. Let's listen to a conversation."], [164.32, 171.0, "Visal, the team's first three prototypes of a solar rice dryer failed completely. Should the company cancel the project?"], [172.08, 181.35, "Not necessarily. Were it not for those failures, the engineers wouldn't have discovered that humidity, not heat, was the real problem."], [182.45, 184.19, "But failure is expensive."], [185.28, 197.24, "Large failures are. That's why innovative leaders encourage small, cheap experiments. Were it not for such tolerance, few people would dare propose bold ideas."], [198.35, 199.83, "How do you know when to stop?"], [200.92, 209.73, "When experiments stop producing learning. Failure is valuable only if it informs the next iteration rather than repeating the last."], [210.9, 212.32, "Part three: grammar."], [213.18, 216.75, "Grammar focus: Were it not for (inverted conditional)."], [217.05, 218.25, "Look at the pattern."], [218.95, 222.22, "Were it not for failure, few innovations would succeed."], [223.12, 227.53, "Were it not for tolerance of risk, few people would propose bold ideas."], [228.42, 232.23, "Had it not been for the third prototype, we would never have found the flaw."], [233.17, 242.61, "'Were it not for + noun' = 'If it were not for + noun' (present/general). For the past, use 'Had it not been for + noun' (= If it hadn't been for). Never omit 'for'."], [243.35, 247.6, "Be careful! Don't say: Were it not failure, few succeed."], [249.57, 252.59, "Say: Were it not for failure, few would succeed."], [252.89, 254.46, "Were it not for + noun."], [255.27, 257.76, "Part four: reading. Read and listen."], [258.57, 260.22, "The Productive Failure."], [260.52, 267.67, "Innovation is commonly celebrated for its successes, yet historians of technology emphasise the countless failures that preceded them."], [268.67, 275.98, "Thomas Edison reportedly tested thousands of materials before finding a workable filament, treating each failure as information."], [277.0, 283.03, "Were it not for organisational tolerance of such experimentation, many breakthroughs would have been abandoned prematurely."], [284.03, 292.08, "Leaders of innovation therefore distinguish between intelligent failures, which generate learning, and careless failures, which result from avoidable mistakes."], [293.07, 300.66, "By encouraging rapid prototyping and honest reflection, they create cultures in which creativity and discipline reinforce each other."], [301.77, 305.84, "Part five: quiz. Five questions. Are you ready?"], [306.68, 309.0, "Were it not blank your help, I would fail."], [309.3, 311.95, "A, for. B, of. C, to."], [315.5, 317.12, "The answer is A: for."], [318.25, 321.39, "An early model built to test a concept is a blank."], [321.69, 325.43, "A, prototype. B, disruption. C, vision."], [329.0, 331.19, "The answer is A: prototype."], [332.35, 335.57, "Radical change that transforms an industry is blank."], [335.87, 339.8, "A, iteration. B, creativity. C, disruption."], [343.37, 345.23, "The answer is C: disruption."], [346.38, 348.15, "Choose the correct sentence."], [348.45, 355.84, "A, Had it not been for the rain, we would have won.. B, Had it not for the rain, we would win.. C, Were it not the rain, we would have won.."], [359.4, 363.01, "The answer is A: Had it not been for the rain, we would have won.."], [364.15, 366.85, "According to the reading, intelligent failures…"], [367.15, 372.12, "A, result from carelessness. B, generate learning. C, should be hidden."], [375.67, 378.1, "The answer is B: generate learning."], [379.3, 382.5, "Part six: speaking. It's your turn to talk."], [383.35, 385.61, "Why is failure important for innovation?"], [402.42, 403.84, "Now listen to Visal."], [404.14, 439.59, "Failure is important because innovation means exploring the unknown, and the unknown cannot be mapped without wrong turns. Each failed experiment eliminates a false assumption and narrows the path towards a workable solution. Were it not for this process, organisations would only repeat what already works, and genuine breakthroughs would be rare. However, failure is valuable only when it is small, fast and analysed honestly. Leaders must therefore make it safe to fail intelligently."], [439.89, 441.66, "Excellent answer, Visal!"], [442.55, 447.19, "Great work! Now you can use eight new words and were it not for (inverted conditional)."], [447.49, 452.72, "Today's value is innovation. Try new ideas boldly, and learn from every attempt."], [453.02, 455.94, "See you in Unit twenty-six. Goodbye!"], [456.24, 459.27, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C2B1-Unit26-Remote-and-Hybrid-Teams": [[0.35, 5.27, "Hello, everyone! I'm Ms. Emma. Welcome to Online C two, Book one."], [5.57, 9.05, "Hi! I'm Visal. Let's learn together!"], [9.35, 16.71, "Unit twenty-six: Remote and Hybrid Teams. Today you will project ongoing duration with the future perfect continuous."], [17.01, 19.6, "Here is our lesson map. Let's start!"], [20.53, 24.08, "Part one: words. You will learn eight new words."], [24.92, 26.03, "Remote work."], [27.05, 30.71, "Remote work means working from a location outside the main office."], [31.32, 34.19, "Remote work became common after 2020."], [34.78, 37.45, "Your turn. Say: Remote work."], [40.3, 41.41, "Remote work."], [42.15, 43.02, "Hybrid."], [44.02, 46.72, "Hybrid means combining office and remote work."], [47.32, 50.3, "Our hybrid model requires two office days a week."], [50.92, 53.58, "Your turn. Say: Hybrid."], [56.43, 57.27, "Hybrid."], [58.02, 59.15, "Collaboration."], [60.15, 63.67, "Collaboration means working together to achieve shared goals."], [64.28, 67.01, "Online whiteboards made collaboration easier."], [67.62, 70.23, "Your turn. Say: Collaboration."], [73.1, 74.43, "Collaboration."], [75.18, 76.15, "Time zone."], [77.15, 80.12, "Time zone means a region with the same standard time."], [80.72, 83.97, "Working across five time zones complicates meetings."], [84.58, 86.96, "Your turn. Say: Time zone."], [89.8, 90.79, "Time zone."], [91.55, 92.83, "Asynchronous."], [93.82, 96.54, "Asynchronous means not happening at the same time."], [97.15, 99.94, "Asynchronous updates replaced many meetings."], [100.55, 103.19, "Your turn. Say: Asynchronous."], [106.03, 107.3, "Asynchronous."], [108.05, 108.77, "Trust."], [109.78, 112.92, "Trust means confidence that others will act reliably."], [113.52, 116.36, "Remote teams run on trust rather than supervision."], [116.95, 119.46, "Your turn. Say: Trust."], [122.3, 123.05, "Trust."], [123.78, 124.63, "Tools."], [125.65, 128.47, "Tools means software and devices used for work."], [129.08, 131.57, "The right tools reduce communication friction."], [132.18, 134.51, "Your turn. Say: Tools."], [137.37, 138.37, "Tools."], [139.12, 139.99, "Wellbeing."], [140.98, 143.84, "Wellbeing means a state of physical and mental health."], [144.45, 147.25, "Isolation can harm remote workers' wellbeing."], [147.85, 150.41, "Your turn. Say: Wellbeing."], [153.27, 154.27, "Wellbeing."], [155.07, 159.2, "Part two: dialogue. Let's listen to a conversation."], [160.05, 165.98, "Visal, your software team has staff in Phnom Penh, Hanoi and Berlin. How long has it been remote?"], [167.08, 174.9, "By next March, we will have been working remotely for five years, so we've learned a lot through trial and error."], [175.98, 177.69, "What's been the biggest challenge?"], [178.78, 188.23, "Time zones. We rely on asynchronous communication: clear written updates, so nobody waits for a meeting to make progress."], [189.32, 191.76, "And how do you maintain team spirit?"], [192.85, 202.84, "Deliberately. By the end of the year, we'll have been running virtual coffee chats every Friday for three years, and they matter more than you'd think."], [204.0, 205.35, "Part three: grammar."], [206.18, 209.63, "Grammar focus: Future perfect continuous."], [209.93, 211.02, "Look at the pattern."], [211.72, 214.91, "By then, we will have been working remotely for five years."], [215.82, 219.8, "By the end of the year, we'll have been running virtual chats for three years."], [220.72, 223.84, "By June, she will have been leading the team for a decade."], [224.8, 236.33, "Use 'will have been + -ing' to emphasise how long an activity will have continued up to a future point, usually with 'for + duration'. Avoid it with state verbs: 'will have known' (not 'will have been knowing')."], [237.08, 240.79, "Be careful! Don't say: We will have been work for years."], [242.73, 245.49, "Say: We will have been working for years."], [245.79, 247.19, "Will have been + -ing."], [248.0, 250.66, "Part four: reading. Read and listen."], [251.47, 253.03, "Leading From a Distance."], [253.32, 260.35, "The global shift to remote work, accelerated by the pandemic, has permanently changed expectations about where and how work is done."], [261.37, 269.35, "Hybrid arrangements offer flexibility and access to wider talent pools, but they also create risks of isolation and unequal visibility."], [270.33, 277.73, "Effective remote leaders favour asynchronous communication, documenting decisions so that colleagues in different time zones can contribute."], [278.73, 286.11, "They also measure results rather than hours online, since constant monitoring undermines the trust on which distributed teams depend."], [287.1, 294.24, "By the end of this decade, many organisations will have been operating in hybrid mode for years, making these leadership skills essential."], [295.33, 299.22, "Part five: quiz. Five questions. Are you ready?"], [300.08, 303.35, "By 2030, I blank English for twenty years."], [303.65, 307.74, "A, will have been learning. B, will be learnt. C, have been learning."], [311.3, 313.3, "The answer is A: will have been learning."], [314.45, 316.81, "Not happening at the same time is blank."], [317.11, 320.84, "A, hybrid. B, asynchronous. C, remote."], [324.4, 326.99, "The answer is B: asynchronous."], [328.15, 330.93, "A state of physical and mental health is blank."], [331.23, 334.8, "A, collaboration. B, trust. C, wellbeing."], [338.33, 340.63, "The answer is C: wellbeing."], [341.78, 343.56, "Choose the correct sentence."], [343.86, 351.4, "A, By May, he will have been knowing her a year.. B, By May, he will have known her for a year.. C, By May, he will been knowing her.."], [354.97, 358.77, "The answer is B: By May, he will have known her for a year.."], [359.92, 362.76, "According to the reading, effective remote leaders measure…"], [363.06, 367.36, "A, hours online. B, results. C, keyboard activity."], [370.9, 373.07, "The answer is B: results."], [374.27, 377.38, "Part six: speaking. It's your turn to talk."], [378.25, 380.61, "What are the challenges of leading a remote team?"], [397.42, 399.0, "Now listen to Visal."], [399.3, 437.1, "Leading a remote team is challenging because many informal signals disappear. A manager cannot easily notice when someone is struggling, isolated or confused, so problems may grow unnoticed. Communication across time zones also requires discipline, especially clear written updates and well-documented decisions. Another challenge is building trust without constant supervision. Once a team has been working remotely for a year, its culture should rely on results, not visibility."], [437.4, 439.34, "Excellent answer, Visal!"], [440.25, 444.93, "Great work! Now you can use eight new words and future perfect continuous."], [445.23, 450.39, "Today's value is collaboration. Work together, and share both the effort and the success."], [450.69, 454.04, "See you in Unit twenty-seven. Goodbye!"], [454.34, 456.75, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C2B1-Unit27-Mastering-Public-Speaking": [[0.35, 4.93, "Hello, everyone! I'm Ms. Emma. Welcome to Online C two, Book one."], [5.23, 8.53, "Hi! I'm Visal. Let's learn together!"], [8.83, 16.19, "Unit twenty-seven: Mastering Public Speaking. Today you will build memorable rhythm with tricolon and parallelism."], [16.49, 19.21, "Here is our lesson map. Let's start!"], [20.17, 23.43, "Part one: words. You will learn eight new words."], [24.28, 25.57, "Public speaking."], [26.58, 29.93, "Public speaking means the act of speaking to a live audience."], [30.52, 33.55, "Public speaking terrifies more people than heights."], [34.15, 36.93, "Your turn. Say: Public speaking."], [39.77, 40.86, "Public speaking."], [41.62, 42.57, "Delivery."], [43.58, 46.71, "Delivery means the manner in which a speech is presented."], [47.32, 50.02, "Her delivery was calm, warm and deliberate."], [50.62, 53.73, "Your turn. Say: Delivery."], [56.6, 57.69, "Delivery."], [58.45, 59.31, "Pause."], [60.32, 63.01, "Pause means a deliberate moment of silence."], [63.62, 66.58, "A well-timed pause gives an idea time to land."], [67.18, 69.66, "Your turn. Say: Pause."], [72.5, 73.33, "Pause."], [74.08, 75.13, "Storytelling."], [76.12, 79.29, "Storytelling means using narrative to convey ideas."], [79.88, 82.61, "Storytelling made the statistics unforgettable."], [83.22, 85.98, "Your turn. Say: Storytelling."], [88.83, 89.88, "Storytelling."], [90.62, 91.53, "Presence."], [92.52, 96.11, "Presence means the quality of commanding attention through composure."], [96.72, 99.97, "Stage presence comes from preparation, not perfection."], [100.58, 103.25, "Your turn. Say: Presence."], [106.1, 107.15, "Presence."], [107.88, 108.87, "Audience."], [109.88, 112.64, "Audience means the people listening to a speech."], [113.25, 115.98, "Know your audience before you write a single word."], [116.58, 119.12, "Your turn. Say: Audience."], [121.97, 123.04, "Audience."], [123.78, 124.72, "Structure."], [125.72, 128.9, "Structure means the organisation of a speech's parts."], [129.52, 133.13, "A clear structure helps listeners follow complex ideas."], [133.72, 136.53, "Your turn. Say: Structure."], [139.37, 140.32, "Structure."], [141.08, 142.19, "Confidence."], [143.18, 145.72, "Confidence means belief in one's ability."], [146.32, 148.59, "Confidence grows with every rehearsal."], [149.18, 151.74, "Your turn. Say: Confidence."], [154.6, 155.71, "Confidence."], [156.5, 160.35, "Part two: dialogue. Let's listen to a conversation."], [161.18, 166.1, "Visal, I have to give a graduation speech next month. How can I make it memorable?"], [167.18, 177.27, "Use rhythm. Great speakers often group ideas in threes: 'We came, we listened, we changed.' The pattern feels complete and is easy to remember."], [178.38, 180.07, "Isn't that a bit theatrical?"], [181.18, 192.11, "Only if overused. One or two well-placed tricolons, supported by a personal story and a deliberate pause, will give your speech shape and energy."], [193.22, 194.62, "And if I get nervous?"], [195.72, 202.85, "Prepare, rehearse, breathe. Nervousness means you care; structure means you won't get lost."], [204.0, 205.42, "Part three: grammar."], [206.28, 209.24, "Grammar focus: Rhetorical devices (tricolon)."], [209.53, 210.84, "Look at the pattern."], [211.55, 213.77, "We came, we listened, we changed."], [214.68, 216.32, "Prepare, rehearse, breathe."], [217.22, 219.76, "Government of the people, by the people, for the people."], [220.7, 231.39, "A tricolon is a series of three parallel words, phrases or clauses. Keep the grammar identical in each part (all verbs, all clauses) and place the strongest idea last for a sense of climax."], [232.15, 235.75, "Be careful! Don't say: We came, we listened, and change."], [237.7, 240.05, "Say: We came, we listened, we changed."], [240.35, 242.0, "Keep a tricolon parallel."], [242.8, 245.6, "Part four: reading. Read and listen."], [246.4, 247.69, "The Power of Three."], [247.99, 254.1, "Since antiquity, orators have recognised that ideas grouped in threes are especially persuasive and memorable."], [255.1, 262.59, "Julius Caesar's 'I came, I saw, I conquered' and Lincoln's 'of the people, by the people, for the people' remain famous partly because of this rhythm."], [263.6, 268.91, "The tricolon works because three items create a pattern while remaining short enough for listeners to retain."], [269.9, 276.42, "Yet rhetorical devices succeed only when supported by authentic content, clear structure and confident delivery."], [277.4, 285.67, "Modern research on public speaking also highlights the power of storytelling and strategic pauses, which give audiences time to absorb and feel each idea."], [286.77, 291.08, "Part five: quiz. Five questions. Are you ready?"], [291.92, 294.01, "Which sentence is a correct tricolon?"], [294.31, 301.13, "A, We learned, we grew, and succeeding.. B, We learned, we grew, we succeeded.. C, We learn, grew, success.."], [304.67, 307.62, "The answer is B: We learned, we grew, we succeeded.."], [308.78, 312.05, "The manner in which a speech is presented is its blank."], [312.35, 316.07, "A, delivery. B, audience. C, structure."], [319.63, 321.55, "The answer is A: delivery."], [322.72, 325.24, "A deliberate moment of silence is a blank."], [325.54, 329.42, "A, presence. B, storytelling. C, pause."], [332.97, 334.85, "The answer is C: pause."], [336.02, 338.11, "Choose the most parallel sentence."], [338.41, 346.61, "A, She is smart, kind, and works hard.. B, She is smart, kind and hard-working.. C, She is smart, kindness and hard work.."], [350.17, 353.77, "The answer is B: She is smart, kind and hard-working.."], [354.92, 358.6, "According to the reading, the tricolon works because three items…"], [358.9, 364.48, "A, are short and form a pattern. B, are always funny. C, confuse the audience."], [368.03, 371.16, "The answer is A: are short and form a pattern."], [372.37, 375.48, "Part six: speaking. It's your turn to talk."], [376.35, 378.57, "What techniques make a speaker memorable?"], [395.38, 396.88, "Now listen to Visal."], [397.18, 431.14, "A memorable speaker combines clear structure, vivid stories and confident delivery. Structure helps listeners follow the argument, while personal stories make abstract ideas concrete and emotional. Rhetorical devices such as the tricolon give key messages rhythm, making them easier to remember. Equally important is delivery: eye contact, varied pace and deliberate pauses show confidence and let ideas land. In short, the best speakers prepare thoroughly, speak sincerely and connect personally."], [431.44, 433.33, "Excellent answer, Visal!"], [434.22, 438.7, "Great work! Now you can use eight new words and rhetorical devices (tricolon)."], [439.0, 444.12, "Today's value is eloquence. Choose your words with care, and speak to persuade honestly."], [444.42, 447.13, "See you in Unit twenty-eight. Goodbye!"], [447.43, 450.0, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C2B1-Unit28-Succession-Planning": [[0.35, 4.84, "Hello, everyone! I'm Ms. Emma. Welcome to Online C two, Book one."], [5.14, 8.65, "Hi! I'm Visal. Let's learn together!"], [8.95, 15.43, "Unit twenty-eight: Succession Planning. Today you will describe required preparation with passive infinitives."], [15.72, 18.34, "Here is our lesson map. Let's start!"], [19.3, 22.78, "Part one: words. You will learn eight new words."], [23.62, 24.62, "Succession."], [25.62, 29.57, "Succession means the process of one person taking over a role from another."], [30.18, 33.11, "Succession at the family firm was carefully planned."], [33.72, 36.12, "Your turn. Say: Succession."], [38.97, 40.01, "Succession."], [40.75, 41.83, "Successor."], [42.82, 45.64, "Successor means a person who takes over a role."], [46.25, 49.24, "Her successor had worked beside her for five years."], [49.85, 52.75, "Your turn. Say: Successor."], [55.6, 56.72, "Successor."], [57.48, 58.59, "Continuity."], [59.58, 62.83, "Continuity means uninterrupted operation over time."], [63.42, 66.37, "Continuity of service is vital in hospitals."], [66.98, 69.82, "Your turn. Say: Continuity."], [72.67, 73.76, "Continuity."], [74.52, 75.5, "Development."], [76.48, 79.61, "Development means growth of skills and capabilities."], [80.22, 83.48, "Leadership development programmes prepare future managers."], [84.08, 86.72, "Your turn. Say: Development."], [89.57, 90.73, "Development."], [91.48, 92.58, "Transition."], [93.58, 97.22, "Transition means the process of changing from one state to another."], [97.82, 99.85, "The transition took six months."], [100.45, 103.23, "Your turn. Say: Transition."], [106.07, 107.02, "Transition."], [107.78, 108.99, "Talent pipeline."], [109.98, 113.98, "Talent pipeline means a steady supply of people ready for future roles."], [114.58, 118.36, "A strong talent pipeline reduces the risk of sudden departures."], [118.95, 121.67, "Your turn. Say: Talent pipeline."], [124.53, 125.96, "Talent pipeline."], [126.72, 128.16, "Knowledge transfer."], [129.15, 133.15, "Knowledge transfer means passing expertise from one person to another."], [133.75, 136.63, "Knowledge transfer began a year before retirement."], [137.22, 140.68, "Your turn. Say: Knowledge transfer."], [143.53, 145.14, "Knowledge transfer."], [145.88, 146.77, "Stability."], [147.78, 150.93, "Stability means the state of being steady and secure."], [151.52, 154.93, "Clear succession plans protect organisational stability."], [155.52, 158.1, "Your turn. Say: Stability."], [160.93, 161.96, "Stability."], [162.77, 166.64, "Part two: dialogue. Let's listen to a conversation."], [167.48, 174.4, "Visal, the head of a large NGO suddenly fell ill, and nobody knew how to run the organisation. How could that happen?"], [175.48, 183.43, "Because succession was never planned. Leaders need to be prepared for transition long before it actually arrives."], [184.52, 186.79, "Surely you can't predict illness?"], [187.88, 198.02, "No, but potential successors can be identified and trained in advance. Critical knowledge ought to be documented, not kept in one person's head."], [199.12, 200.38, "What should the board do now?"], [201.48, 212.08, "Appoint an interim leader, then ensure that at least two people are developed for every key role. Stability shouldn't be left to chance."], [213.23, 214.87, "Part three: grammar."], [215.72, 218.41, "Grammar focus: Passive infinitives."], [218.71, 219.9, "Look at the pattern."], [220.58, 223.06, "Leaders need to be prepared for transition."], [223.95, 226.08, "Critical knowledge ought to be documented."], [226.98, 229.23, "Stability shouldn't be left to chance."], [230.17, 240.6, "A passive infinitive is 'to be + past participle' (need to be prepared) or, after modals, 'be + p.p.' (should be trained). Use it when the action matters more than who performs it."], [241.35, 245.72, "Be careful! Don't say: Leaders need to prepare for transition."], [247.67, 250.98, "Say: Leaders need to be prepared for transition."], [251.28, 254.4, "Passive infinitive: to be + p.p."], [255.2, 257.82, "Part four: reading. Read and listen."], [258.63, 260.24, "Planning for the Inevitable."], [260.54, 265.93, "Every leader eventually leaves, whether through retirement, promotion, illness or unexpected departure."], [266.93, 274.85, "Yet surveys consistently show that many organisations, especially family firms and NGOs, lack formal succession plans."], [275.87, 285.4, "Effective succession planning requires potential successors to be identified early and developed through stretch assignments, mentoring and exposure to strategic decisions."], [286.4, 294.9, "Knowledge transfer is equally important, since tacit expertise accumulated over decades cannot be documented in a single handover meeting."], [295.9, 304.06, "Organisations that treat succession as an ongoing process rather than an emergency are far better placed to maintain continuity and stability."], [305.17, 309.09, "Part five: quiz. Five questions. Are you ready?"], [309.95, 312.17, "The documents need blank before Friday."], [312.47, 316.4, "A, to sign. B, to be signed. C, be signing."], [319.97, 322.28, "The answer is B: to be signed."], [323.42, 325.9, "A person who takes over a role is a blank."], [326.2, 330.5, "A, successor. B, transition. C, continuity."], [334.03, 336.43, "The answer is A: successor."], [337.58, 340.59, "Passing expertise from one person to another is blank."], [340.89, 345.48, "A, development. B, stability. C, knowledge transfer."], [349.03, 351.46, "The answer is C: knowledge transfer."], [352.62, 354.48, "Choose the correct sentence."], [354.78, 362.35, "A, The report must be finished today.. B, The report must be finish today.. C, The report must to be finished today.."], [365.9, 369.71, "The answer is A: The report must be finished today.."], [370.85, 373.43, "According to the reading, successors should be…"], [373.73, 379.28, "A, identified early and developed. B, chosen at the last minute. C, kept secret."], [382.83, 386.37, "The answer is A: identified early and developed."], [387.57, 391.11, "Part six: speaking. It's your turn to talk."], [391.95, 395.19, "Why should organisations plan for leadership change?"], [411.98, 413.34, "Now listen to Visal."], [413.64, 452.35, "Organisations should plan for leadership change because every leader will eventually leave, and sudden departures can threaten stability. If successors have not been identified and prepared, critical decisions may be delayed and staff may lose confidence. Planning also ensures that knowledge is transferred rather than lost. For example, a hospital director's relationships and expertise need to be shared well before retirement. Succession planning is ultimately a responsibility to the people the organisation serves."], [452.65, 454.28, "Excellent answer, Visal!"], [455.18, 459.91, "Great work! Now you can use eight new words and passive infinitives."], [460.21, 465.21, "Today's value is planning ahead. Make a plan and take small steps every day."], [465.51, 468.29, "See you in Unit twenty-nine. Goodbye!"], [468.59, 471.85, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C2B1-Unit29-Review-Leading-with-Purpose": [[0.35, 5.62, "Hello, everyone! I'm Ms. Emma. Welcome to Online C two, Book one."], [5.92, 9.7, "Hi! I'm Visal. Let's learn together!"], [10.0, 17.7, "Unit twenty-nine: Review: Leading with Purpose. Today you will emphasise key ideas with cleft sentences (It is … that)."], [18.0, 20.61, "Here is our lesson map. Let's start!"], [21.57, 24.45, "Part one: words. You will learn eight new words."], [25.32, 26.16, "Purpose."], [27.15, 31.14, "Purpose means the fundamental reason why someone or something exists."], [31.75, 33.96, "Purpose gives meaning to difficult work."], [34.55, 37.35, "Your turn. Say: Purpose."], [40.2, 41.16, "Purpose."], [41.92, 42.73, "Vision."], [43.72, 46.85, "Vision means a compelling picture of a desired future."], [47.45, 50.35, "Her vision united a divided organisation."], [50.95, 53.23, "Your turn. Say: Vision."], [56.07, 56.94, "Vision."], [57.68, 58.63, "Values."], [59.62, 62.55, "Values means the principles that guide decisions."], [63.15, 66.0, "Values are tested when they become inconvenient."], [66.58, 69.07, "Your turn. Say: Values."], [71.93, 73.02, "Values."], [73.75, 74.61, "Impact."], [75.62, 79.36, "Impact means a significant effect on people or situations."], [79.95, 82.88, "The programme's impact reached thousands of families."], [83.48, 86.15, "Your turn. Say: Impact."], [89.0, 89.9, "Impact."], [90.65, 91.89, "Service."], [92.88, 95.32, "Service means work done to help others."], [95.92, 98.61, "Service to the community defined his career."], [99.22, 102.06, "Your turn. Say: Service."], [104.9, 105.91, "Service."], [106.65, 107.65, "Legacy."], [108.65, 112.12, "Legacy means something that continues after one has gone."], [112.72, 115.95, "A purposeful legacy outlives titles and wealth."], [116.55, 119.19, "Your turn. Say: Legacy."], [122.03, 123.17, "Legacy."], [123.92, 125.14, "Authenticity."], [126.15, 129.44, "Authenticity means being genuine and true to one's values."], [130.05, 132.86, "Authenticity builds deeper trust than charisma."], [133.45, 136.08, "Your turn. Say: Authenticity."], [138.93, 140.32, "Authenticity."], [141.08, 142.07, "Reflection."], [143.08, 146.36, "Reflection means serious thought about one's experiences."], [146.95, 149.82, "Reflection helps leaders reconnect with their purpose."], [150.42, 153.08, "Your turn. Say: Reflection."], [155.93, 157.0, "Reflection."], [157.8, 161.6, "Part two: dialogue. Let's listen to a conversation."], [162.45, 167.18, "Visal, after twenty-nine units on leadership, what single idea matters most?"], [168.28, 178.69, "For me, it is purpose that sustains great leaders. Skills and strategies matter, but purpose explains why we keep going when things become difficult."], [179.78, 181.52, "Isn't vision the same thing?"], [182.62, 190.35, "Not quite. Vision describes where we are going; it is purpose that explains why the journey is worth making."], [191.45, 193.73, "And how do leaders stay connected to it?"], [194.82, 202.98, "Through reflection. It is in quiet moments, not in busy meetings, that most leaders rediscover what truly matters to them."], [204.13, 205.67, "Part three: grammar."], [206.52, 209.96, "Grammar focus: Cleft sentences with It is that."], [210.26, 211.43, "Look at the pattern."], [212.12, 214.71, "It is purpose that sustains great leaders."], [215.62, 219.26, "It is in quiet moments that leaders rediscover what matters."], [220.15, 222.58, "It was her mentor who taught her to listen."], [223.53, 234.76, "An it-cleft splits a sentence to focus on one element: 'Purpose sustains leaders' → 'It is purpose that sustains leaders.' Use 'who' or 'that' for people, 'that' for things and phrases — never 'what'."], [235.52, 239.49, "Be careful! Don't say: It is purpose what sustains leaders."], [241.43, 244.38, "Say: It is purpose that sustains leaders."], [244.69, 246.35, "It is … that (not 'what')."], [247.13, 249.74, "Part four: reading. Read and listen."], [250.53, 251.84, "Leading With Why."], [252.14, 258.36, "Throughout this course, we have examined rhetoric, research, diplomacy, ethics and leadership from many perspectives."], [259.37, 265.55, "What connects these themes is the recognition that it is not technique alone that makes communication or leadership powerful."], [266.53, 274.63, "Simon Sinek popularised the idea that inspiring leaders begin with 'why', articulating a purpose before explaining what they do or how they do it."], [275.63, 285.31, "It is this sense of purpose that enables leaders to remain authentic under pressure, to make difficult ethical choices and to inspire others to serve a cause larger than themselves."], [286.3, 291.2, "Ultimately, it is through purpose, reflection and service that knowledge becomes wisdom."], [292.3, 296.07, "Part five: quiz. Five questions. Are you ready?"], [296.92, 299.08, "It was my teacher blank encouraged me."], [299.38, 302.35, "A, what. B, who. C, which."], [305.9, 307.62, "The answer is B: who."], [308.78, 311.78, "Being genuine and true to one's values is blank."], [312.08, 315.84, "A, authenticity. B, impact. C, service."], [319.4, 321.94, "The answer is A: authenticity."], [323.08, 325.79, "Serious thought about one's experiences is blank."], [326.09, 329.56, "A, vision. B, legacy. C, reflection."], [333.1, 335.53, "The answer is C: reflection."], [336.68, 338.94, "Choose the correct cleft sentence."], [339.24, 346.58, "A, It is trust what builds teams.. B, It is trust that builds teams.. C, It is trust builds that teams.."], [350.13, 352.89, "The answer is B: It is trust that builds teams.."], [354.05, 358.07, "According to the reading, Simon Sinek said inspiring leaders begin with…"], [358.37, 361.28, "A, how. B, what. C, why."], [364.83, 366.74, "The answer is C: why."], [367.93, 371.49, "Part six: speaking. It's your turn to talk."], [372.35, 374.58, "What purpose would guide your leadership?"], [391.38, 393.02, "Now listen to Visal."], [393.32, 428.36, "The purpose that would guide my leadership is to create opportunities for others to grow. It is through education that my own life changed, so I want to help people, especially young Cambodians, discover and develop their potential. This purpose would shape my decisions: I would invest in mentoring, listen carefully and prioritise long-term impact over personal recognition. When challenges arise, it is this sense of purpose that would remind me why the effort matters."], [428.66, 430.35, "Excellent answer, Visal!"], [431.25, 436.08, "Great work! Now you can use eight new words and cleft sentences with it is that."], [436.38, 440.91, "Today's value is purpose. Know why you do what you do, and let it guide you."], [441.21, 447.59, "Congratulations! You have finished Online C two, Book one. See you in Online C two, Book two!"], [447.89, 450.92, "Thank you, Ms. Emma! Bye, everyone!"]]};
        // English subtitles: added to the player with code, so no subtitle files are needed online.
        let subsOn = true;
        function addSubtitles(el) {
            const cues = SUBTITLES[(el.getAttribute('src') || '').split('/').pop().split('?')[0].replace('.mp4', '')]; const btn = document.getElementById('subs-btn');
            if (!cues || !el.addTextTrack || typeof VTTCue === 'undefined') { if (btn) btn.style.display = 'none'; return; }
            const tr = el.addTextTrack('subtitles', 'English', 'en');
            cues.forEach(c => { try { const q = new VTTCue(c[0], c[1], c[2]); q.line = -2; tr.addCue(q); } catch (e) {} });
            const apply = () => { tr.mode = subsOn ? 'showing' : 'hidden'; if (btn) btn.textContent = subsOn ? '💬 Subtitles: ON' : '💬 Subtitles: OFF'; };
            if (btn) btn.onclick = () => { subsOn = !subsOn; apply(); };
            apply();
        }
        function renderMp4Lesson(contentDiv, unitData) {
            contentDiv.innerHTML = `
                <h2 class="text-xl font-bold text-indigo-900 mb-2">📹 Video Lesson — Unit ${state.unit}: ${unitData.title}</h2>
                <p class="text-gray-600 mb-4">${ytCurrentConfig.checkpoints.length ? 'Watch the video. It will pause at a few points so you can answer a quick question!' : 'Watch Ms. Emma and Visal, then try the other learning modules!'}</p>
                <div class="relative bg-black rounded-2xl overflow-hidden" style="aspect-ratio:16/9;">
