    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap');
        body { font-family: 'Poppins', sans-serif; }
        /* Flip-card for Listening: front = word, back = picture. */
        .flip-card { perspective: 1000px; height: 100px; cursor: pointer; }
        .flip-card-inner {
            position: relative; width: 100%; height: 100%;
            transition: transform 0.5s; transform-style: preserve-3d;
        }
        .flip-card.flipped .flip-card-inner { transform: rotateY(180deg); }
        .flip-card-front, .flip-card-back {
            position: absolute; width: 100%; height: 100%;
            backface-visibility: hidden; border-radius: 0.75rem;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 0.25rem;
        }
        .flip-card-back { transform: rotateY(180deg); }
        button:disabled { cursor: default; }
        /* phones: the lesson fills the screen, so jumping to it always shows it from the top,
           and the floating "Modules" button never covers the lesson's own buttons */
        @media (max-width: 767px) { #content-area { min-height: calc(100vh - 24px); padding-bottom: 76px; } }
    </style>

    <script>
        let state = {

            tab: 'listening',

        };

        const curriculum = {
            'Master': {
                1: { title: "Rhetoric & Persuasion", vocab: ["Ethos", "Pathos", "Logos", "Eloquence", "Oratory", "Rhetorical device", "Persuasive appeal", "Audience analysis", "Discourse analysis", "Connotation"], story: "Classical rhetoric balances ethos, pathos, and logos to persuade. Eloquent oratory relies on rhetorical devices shaped by careful audience analysis.", question: "Which rhetorical appeal do you find most persuasive, and why?", grammar: { point: "Complex subordination", example: "Because logos appeals to reason, it often persuades skeptics." } },
                2: { title: "Literary Criticism", vocab: ["Deconstruction", "Postmodernism", "Canon", "Intertextuality", "Subtext", "Discourse", "Interpretation", "Critical lens", "Hermeneutics", "Close reading"], story: "Postmodernism often challenges the literary canon through deconstruction. Intertextuality and subtext invite readers to apply a new critical lens to discourse.", question: "How does a critical lens change the meaning of a text?", grammar: { point: "Passive nominal clauses", example: "It is argued that meaning is shaped by interpretation." } },
                3: { title: "Philosophical Inquiry", vocab: ["Epistemology", "Metaphysics", "Existentialism", "Ontology", "Paradox", "Skepticism", "Consciousness", "Inquiry", "Phenomenology", "Dialectic"], story: "Epistemology questions how we know what we know, while metaphysics explores existence itself. Existentialist inquiry often confronts paradox and conscious skepticism.", question: "What philosophical question do you find most compelling?", grammar: { point: "Hypothetical abstraction", example: "Were consciousness fully understood, many paradoxes would dissolve." } },
                4: { title: "Advanced Academic Research", vocab: ["Meta-analysis", "Longitudinal study", "Statistical significance", "Literature review", "Theoretical framework", "Reproducibility", "Epistemic rigor", "Peer critique", "Meta-cognition", "Triangulation"], story: "A meta-analysis synthesizes findings across many longitudinal studies. Statistical significance means little without a solid theoretical framework and epistemic rigor.", question: "What makes academic research trustworthy?", grammar: { point: "Nominalized abstraction", example: "The reproducibility of findings determines their reliability." } },
                5: { title: "Professional Mastery", vocab: ["Expertise", "Thought leadership", "Strategic vision", "Mentorship", "Industry authority", "Innovation pipeline", "Executive presence", "Legacy", "Succession planning", "Governance"], story: "True expertise combines thought leadership with strategic vision. Mentorship and executive presence build industry authority that outlasts any single innovation.", question: "What defines mastery in a profession?", grammar: { point: "Participial phrases", example: "Having built real expertise, she became an industry authority." } },
                6: { title: "Cross-Cultural Diplomacy", vocab: ["Cultural competence", "Diplomatic protocol", "Negotiated settlement", "Geopolitics", "Multilateralism", "Soft power", "Bilateral relations", "Consensus-building", "Realpolitik", "Multilateral"], story: "Cultural competence and diplomatic protocol shape successful bilateral relations. Multilateralism and soft power often achieve a negotiated settlement where geopolitics alone cannot.", question: "Why is cultural competence important in international diplomacy?", grammar: { point: "Formal passive constructions", example: "A settlement was negotiated through careful diplomacy." } },
                7: { title: "Complex Problem Solving", vocab: ["Systems thinking", "Root cause", "Interdisciplinary", "Trade-off", "Iterative process", "Unintended consequence", "Holistic approach", "Adaptive strategy", "Heuristic", "Contingency"], story: "Systems thinking helps identify the root cause of complex problems. An interdisciplinary, iterative process avoids unintended consequences through a holistic, adaptive strategy.", question: "How would you approach a complex, multi-layered problem?", grammar: { point: "Abstract conditional reasoning", example: "Were we to ignore trade-offs, unintended consequences would follow." } },
                8: { title: "Legacy & Impact", vocab: ["Enduring influence", "Transformative", "Contribution", "Posterity", "Visionary", "Societal impact", "Lasting change", "Stewardship", "Zeitgeist", "Heritage"], story: "A visionary leaves an enduring influence through transformative contribution. True stewardship considers societal impact and lasting change for posterity.", question: "What kind of legacy would you like to leave?", grammar: { point: "Future perfect for legacy", example: "By the time she retires, she will have made a lasting change." } },
                9: { title: "Executive Communication", vocab: ["Executive presence", "Concise messaging", "Stakeholder", "Briefing", "Persuasion", "Clarity", "Authority", "Influence"], story: "Executive communication demands concise messaging delivered with authority and executive presence. A clear briefing to stakeholders relies on persuasion balanced with clarity, building real influence.", question: "What makes communication feel authoritative without being arrogant?", grammar: { point: "Balance/contrast structures (balanced with)", example: "Authority is balanced with clarity in strong communication." }, value: "Leadership" },
                10: { title: "Crisis Management", vocab: ["Crisis", "Contingency plan", "Response protocol", "Transparency", "Damage control", "Stakeholder trust", "Escalation", "Recovery"], story: "Crisis management requires a solid contingency plan and a clear response protocol. Transparency during damage control helps preserve stakeholder trust, even after escalation, supporting long-term recovery.", question: "Why is transparency important during a crisis?", grammar: { point: "Even after / despite clauses", example: "Trust can be preserved even after a difficult crisis." }, value: "Resilience" },
                11: { title: "Strategic Planning", vocab: ["Strategic planning", "Vision", "Objective", "SWOT analysis", "Milestone", "Resource allocation", "Long-term goal", "Execution"], story: "Strategic planning begins with a clear vision and measurable objectives, often guided by a SWOT analysis. Setting milestones and thoughtful resource allocation turn a long-term goal into successful execution.", question: "What is one long-term goal you have, and what milestone would show progress?", grammar: { point: "Future planning language (will, going to)", example: "We will allocate resources toward this milestone." }, value: "Strategic Thinking" },
                12: { title: "Leadership Theory", vocab: ["Leadership style", "Transformational", "Transactional", "Servant leadership", "Vision-casting", "Empowerment", "Accountability", "Influence"], story: "Leadership theory distinguishes transformational leadership, which relies on vision-casting and empowerment, from transactional approaches. Servant leadership emphasizes accountability alongside genuine influence.", question: "What leadership style do you think is most effective, and why?", grammar: { point: "Distinguishing between concepts (whereas/while)", example: "Transformational leaders inspire, whereas transactional leaders exchange rewards." }, value: "Leadership" },
                13: { title: "Organizational Behavior", vocab: ["Organizational culture", "Motivation", "Group dynamics", "Hierarchy", "Norms", "Cohesion", "Conflict", "Productivity"], story: "Organizational behavior studies how culture and motivation shape group dynamics within a hierarchy. Shared norms build cohesion, though unresolved conflict can undermine productivity.", question: "How does organizational culture influence employee motivation?", grammar: { point: "Correlation language (influences, shapes, affects)", example: "Culture significantly shapes employee motivation." }, value: "Collaboration" },
                14: { title: "Change Management", vocab: ["Change management", "Resistance to change", "Buy-in", "Transition plan", "Communication strategy", "Adoption", "Sustainability", "Momentum"], story: "Change management anticipates resistance to change and works to build buy-in through a clear transition plan. A strong communication strategy supports adoption and long-term sustainability, maintaining momentum.", question: "What strategy could help reduce resistance to organizational change?", grammar: { point: "Could + suggestion", example: "A clear communication strategy could reduce resistance." }, value: "Adaptability" },
                15: { title: "Stakeholder Engagement", vocab: ["Stakeholder", "Engagement strategy", "Consultation", "Feedback loop", "Transparency", "Trust-building", "Alignment", "Collaboration"], story: "Stakeholder engagement relies on a thoughtful strategy that includes consultation and a working feedback loop. Transparency and trust-building create alignment, strengthening collaboration over time.", question: "Why is a feedback loop important when engaging stakeholders?", grammar: { point: "Over time / gradually adverbials", example: "Trust builds gradually through consistent engagement." }, value: "Trust-Building" },
                16: { title: "Public Diplomacy", vocab: ["Public diplomacy", "Soft power", "Cultural exchange", "Nation branding", "International relations", "Goodwill", "Perception", "Outreach"], story: "Public diplomacy uses soft power and cultural exchange to shape international perception, sometimes called nation branding. Building goodwill through outreach supports broader international relations.", question: "What is an example of soft power a country might use in diplomacy?", grammar: { point: "Sometimes referred to as / known as", example: "This approach is sometimes referred to as soft power." }, value: "Diplomacy" },
                17: { title: "Conflict Resolution", vocab: ["Conflict resolution", "Mediation", "Negotiation", "Compromise", "Win-win outcome", "De-escalation", "Active listening", "Common ground"], story: "Conflict resolution often relies on mediation and negotiation to reach a compromise. Seeking a win-win outcome through de-escalation and active listening helps parties find common ground.", question: "What role does active listening play in resolving a conflict?", grammar: { point: "Result clauses (so that, resulting in)", example: "Active listening can result in genuine common ground." }, value: "Empathy" },
                18: { title: "Mediation Techniques", vocab: ["Mediator", "Neutrality", "Facilitation", "Interest-based approach", "Reframing", "Trust", "Impartiality", "Resolution"], story: "A skilled mediator maintains neutrality while facilitating dialogue, using an interest-based approach rather than positions. Reframing builds trust, and impartiality is essential to genuine resolution.", question: "Why is impartiality so important for a mediator?", grammar: { point: "Rather than + noun/gerund", example: "Mediators focus on interests rather than fixed positions." }, value: "Impartiality" },
                19: { title: "Legacy Building", vocab: ["Legacy", "Long-term impact", "Succession planning", "Institutional memory", "Mentorship", "Sustainability", "Values", "Contribution"], story: "Legacy building focuses on long-term impact through careful succession planning and institutional memory. Mentorship passes on core values, ensuring a sustainable contribution beyond one person's tenure.", question: "What kind of legacy would you like to leave in your community or career?", grammar: { point: "Beyond + noun phrase (lasting effect)", example: "A true legacy lasts beyond any single career." }, value: "Legacy" },
                20: { title: "Coaching and Mentoring", vocab: ["Coaching", "Mentor", "Mentee", "Growth", "Feedback", "Potential", "Reflection", "Trust"], story: "Coaching and mentoring unlock potential. A mentor offers guidance built on trust, while each mentee grows through honest feedback and reflection.", question: "Who has mentored you, and what did you learn?", grammar: {"point": "Subjunctive after suggest / recommend", "example": "I suggest that she seek a mentor."} },
                21: { title: "Emotional Intelligence in Leadership", vocab: ["Emotional intelligence", "Self-awareness", "Empathy", "Self-regulation", "Motivation", "Social skills", "Resilience", "Influence"], story: "Emotional intelligence underpins effective leadership. Self-awareness, self-regulation and empathy build trust, while motivation, resilience and social skills extend a leader's influence.", question: "Can emotional intelligence be learned?", grammar: {"point": "Inversion with Rarely / Seldom", "example": "Rarely does a leader succeed without empathy."} },
                22: { title: "Ethical Leadership", vocab: ["Ethics", "Integrity", "Transparency", "Accountability", "Values", "Dilemma", "Trust", "Role model"], story: "Ethical leadership demands integrity, transparency and accountability. Faced with a dilemma, an ethical leader acts on values and becomes a role model who earns lasting trust.", question: "What would you do if your manager asked you to act unethically?", grammar: {"point": "Mixed conditionals", "example": "Had she spoken up earlier, the problem would not exist now."} },
                23: { title: "Decisions Under Pressure", vocab: ["Decision", "Pressure", "Uncertainty", "Risk", "Intuition", "Analysis", "Trade-off", "Consequence"], story: "Leaders often decide under pressure and uncertainty. Balancing intuition with analysis, they weigh each risk, trade-off and consequence before acting.", question: "When should leaders trust their intuition?", grammar: {"point": "Participle clauses of reason", "example": "Facing uncertainty, the leader gathered more data."} },
                24: { title: "Organisational Culture", vocab: ["Culture", "Values", "Norms", "Belonging", "Toxic", "Inclusion", "Rituals", "Performance"], story: "Organisational culture is shaped by shared values, norms and rituals. An inclusive culture fosters belonging and performance, whereas a toxic culture drives talent away.", question: "How would you describe a healthy workplace culture?", grammar: {"point": "Emphatic do / does", "example": "Culture does affect performance."} },
                25: { title: "Leading Innovation", vocab: ["Innovation", "Experimentation", "Failure", "Creativity", "Disruption", "Prototype", "Iteration", "Vision"], story: "Leading innovation requires vision and a tolerance of failure. Teams encourage creativity through experimentation, build a prototype and improve by iteration, sometimes causing disruption.", question: "Why is failure important for innovation?", grammar: {"point": "Were it not for... (inverted conditional)", "example": "Were it not for failure, few innovations would succeed."} },
                26: { title: "Remote and Hybrid Teams", vocab: ["Remote work", "Hybrid", "Collaboration", "Time zone", "Asynchronous", "Trust", "Tools", "Wellbeing"], story: "Remote and hybrid teams rely on trust and good tools. Asynchronous collaboration across each time zone requires clear communication and attention to wellbeing.", question: "What are the challenges of leading a remote team?", grammar: {"point": "Future perfect continuous", "example": "By then, we will have been working remotely for five years."} },
                27: { title: "Mastering Public Speaking", vocab: ["Public speaking", "Delivery", "Pause", "Storytelling", "Presence", "Audience", "Structure", "Confidence"], story: "Mastering public speaking combines structure, storytelling and delivery. A well-timed pause and strong presence hold the audience and project confidence.", question: "What techniques make a speaker memorable?", grammar: {"point": "Rhetorical devices (tricolon)", "example": "We came, we listened, we changed."} },
                28: { title: "Succession Planning", vocab: ["Succession", "Successor", "Continuity", "Development", "Transition", "Talent pipeline", "Knowledge transfer", "Stability"], story: "Succession planning ensures continuity and stability. Organisations build a talent pipeline, invest in development and manage knowledge transfer so that each successor is ready for transition.", question: "Why should organisations plan for leadership change?", grammar: {"point": "Passive infinitives", "example": "Leaders need to be prepared for transition."} },
                29: { title: "Review: Leading with Purpose", vocab: ["Purpose", "Vision", "Values", "Impact", "Service", "Legacy", "Authenticity", "Reflection"], story: "Leading with purpose means aligning vision and values with impact. Authentic leaders see leadership as service, practise reflection and consider the legacy they leave.", question: "What purpose would guide your leadership?", grammar: {"point": "Cleft sentences with It is... that", "example": "It is purpose that sustains great leaders."} },
            }
        };

        const LEVELS_ORDER = ['Master'];
        const LEVEL_NAMES = {"Master": "C2 Book 1"};

        // ===== Progress: stars/badges are earned once per activity and remembered =====
        // Saved in this browser when the page is opened as a normal web page. Inside the Hub's
        // secure "Embed Code" box the browser blocks storage, so progress then lasts until the
        // page is closed — but it still can't be farmed by tapping the same button again.
        const PROGRESS_KEY = () => 'c2epe_onlineclass_master_C2_1_progress_' + state.level;
        let progress = { stars: 0, badges: 0, awarded: {}, best: {}, completed: {} };
        function loadProgress() {
            progress = { stars: 0, badges: 0, awarded: {}, best: {}, completed: {} };
            try {
                const saved = JSON.parse(localStorage.getItem(PROGRESS_KEY()) || 'null');
                if (saved && typeof saved === 'object') progress = Object.assign(progress, saved);
            } catch (e) { /* storage not available (e.g. inside the Hub sandbox) */ }
            state.stars = progress.stars; state.badges = progress.badges;
            document.getElementById('star-count').textContent = state.stars;
            document.getElementById('badge-count').textContent = state.badges;
        }
        function saveProgress() {
            progress.stars = state.stars; progress.badges = state.badges;
            try { localStorage.setItem(PROGRESS_KEY(), JSON.stringify(progress)); } catch (e) {}
        }
        const unitKey = (what) => 'u' + state.unit + '|' + what;
        const wasAwarded = (key) => !!progress.awarded[state.level + '|' + key];
        // Gives stars only the first time an activity is done. Returns true if stars were given.
        function award(key, amount) {
            const k = state.level + '|' + key;
            if (progress.awarded[k]) return false;
            progress.awarded[k] = true;
            addStars(amount);
            return true;
        }
        // Shows "(+3 ⭐)" the first time, and a friendly note afterwards
        const starNote = (given, amount) => given ? ` (+${amount} ⭐)` : ' (stars already earned)';

        function isRecentlyAdded(dateStr) {
            if (!dateStr) return false;
            const added = new Date(dateStr);
            if (isNaN(added.getTime())) return false;
            const daysSince = (Date.now() - added.getTime()) / (1000 * 60 * 60 * 24);
            return daysSince >= 0 && daysSince <= 7;
        }

        function populateUnitSelect() {
            const sel = document.getElementById('unit-select');
            const levelData = curriculum[state.level];
            const prevUnit = state.unit;
            const unitCount = Object.keys(levelData).length;
            const labelEl = document.getElementById('unit-select-label');
            if (labelEl) labelEl.textContent = `Select Unit (1 to ${unitCount})`;
            // 🎬 = this unit has a video · 🆕 = video added in the last 7 days
            sel.innerHTML = Object.keys(levelData).map(u => {
                const v = videoFor(state.level, u);
                const mark = v ? (isRecentlyAdded(v.dateAdded) ? ' 🆕' : ' 🎬') : '';
                return `<option value="${u}">Unit ${u}: ${levelData[u].title}${mark}</option>`;
            }).join('');
            if (levelData[prevUnit]) {
                sel.value = prevUnit;
                state.unit = prevUnit;
            } else {
                state.unit = parseInt(sel.value);
            }
        }

        function selectLevel(lvl) {
            state.level = lvl;
            document.querySelectorAll('.level-btn').forEach(b => {
                b.classList.remove('bg-slate-700', 'text-white', 'shadow');
                b.classList.add('bg-gray-100');
            });
            const btn = document.getElementById('btn-' + lvl);
            if (btn) { btn.classList.remove('bg-gray-100'); btn.classList.add('bg-slate-700', 'text-white', 'shadow'); }
            document.getElementById('current-level-display').textContent = lvl;

        }
        if ('speechSynthesis' in window) { pickVoice(); window.speechSynthesis.onvoiceschanged = pickVoice; }
        function speak(text, onEnd) {
            if (!('speechSynthesis' in window)) { if (onEnd) onEnd(false); return false; }
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(text);
            u.lang = 'en-US';
            u.rate = 0.9;
            if (!enVoice) pickVoice();
            if (enVoice) u.voice = enVoice;
            if (onEnd) u.onend = () => onEnd(true);
            window.speechSynthesis.speak(u);
            return true;
        }

        function shuffle(arr) {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];

        const SAME_UNIT_ALT = {
            "Goodbye": "🚶👋", "Thank you": "💝", "Sorry": "😔", "Respect": "🫡", "Tomorrow": "⏭️",
            "West": "🌇", "East": "🌄", "North": "🧭", "Between": "🥪", "Early": "🐓", "Late": "⏰",
            "Swing": "🎠", "Poster": "🪧"
        };
        function baseEmoji(word) { return WORD_EMOJI[word] || '🖼️'; }
        function emojiFor(word, unitData) {
            const u = unitData || curriculum[state.level][state.unit];
            const e = baseEmoji(word);
            if (u && SAME_UNIT_ALT[word] && u.vocab.some(w => w !== word && baseEmoji(w) === e)) return SAME_UNIT_ALT[word];
            return e;
        }
        // Wrong answers for "look at the picture" questions never share the right answer's
        // picture, so there is always exactly one correct choice.
        function pictureDistractors(correct, pool, unitData, n) {
            const pic = emojiFor(correct, unitData);
            const ok = (w) => w !== correct && emojiFor(w, unitData) !== pic;
            let list = shuffle([...new Set(pool)].filter(ok)).slice(0, n);
            if (list.length < n) {
                const extra = shuffle(allVocabForLevel(state.level).filter(w => ok(w) && !list.includes(w)));
                list = list.concat(extra.slice(0, n - list.length));
            }
            return list;
        }

istics will persuade them, since credibility precedes every other appeal."], [260.53, 262.52, "Part three: grammar."], [263.38, 266.18, "Grammar focus: Complex subordination."], [266.48, 267.67, "Look at the pattern."], [268.38, 272.33, "Because logos appeals to reason, it often persuades skeptics."], [273.25, 276.44, "Although his evidence was sound, he failed to move the audience."], [277.35, 280.81, "Unless listeners trust the speaker, no argument will persuade them."], [281.77, 297.19, "C2 writers embed several subordinate clauses to show precise logical relations: 'Although the data were persuasive, the speech failed because, unless an audience trusts a speaker, evidence is ignored.' Vary subordinators rather than repeating 'because'."], [297.95, 302.3, "Be careful! Don't say: Despite he was credible, nobody listened."], [304.23, 307.59, "Say: Although he was credible, nobody listened."], [307.89, 310.47, "Despite + noun; although + clause."], [311.27, 313.87, "Part four: reading. Read and listen."], [314.67, 316.36, "The Anatomy of Persuasion."], [316.66, 323.76, "Aristotle identified three persuasive appeals that remain central to rhetoric more than two thousand years after he described them."], [324.77, 333.58, "Ethos establishes the speaker's credibility, pathos engages the audience's emotions, and logos supplies the reasoning on which a conclusion rests."], [334.57, 342.3, "Although modern audiences claim to value evidence above all, research suggests that emotion frequently determines which evidence they are willing to accept."], [343.3, 351.28, "Skilled orators therefore conduct careful audience analysis, adjusting connotation, examples and tone to the values of their listeners."], [352.27, 362.0, "Because persuasion can serve manipulation as easily as truth, discourse analysis teaches citizens to recognise rhetorical devices rather than simply succumb to them."], [363.1, 367.29, "Part five: quiz. Five questions. Are you ready?"], [368.15, 371.01, "blank the argument was logical, it failed to persuade."], [371.31, 374.76, "A, Because. B, Although. C, Unless."], [378.3, 380.11, "The answer is B: Although."], [381.25, 384.24, "Persuasion based on the speaker's credibility is blank."], [384.54, 388.27, "A, ethos. B, pathos. C, logos."], [391.83, 393.94, "The answer is A: ethos."], [395.08, 398.73, "The feelings a word suggests beyond its literal meaning are its blank."], [399.03, 402.93, "A, oratory. B, discourse. C, connotation."], [406.47, 408.84, "The answer is C: connotation."], [409.98, 412.02, "Choose the most precise sentence."], [412.32, 422.35, "A, Unless trust exists, no evidence persuades.. B, Unless trust doesn't exist, evidence persuades.. C, Because unless trust, evidence persuades.."], [425.9, 430.46, "The answer is A: Unless trust exists, no evidence persuades.."], [431.62, 435.39, "According to the reading, discourse analysis teaches citizens to…"], [435.69, 441.61, "A, avoid public speaking. B, recognise rhetorical devices. C, trust every speaker."], [445.17, 448.51, "The answer is B: recognise rhetorical devices."], [449.7, 452.83, "Part six: speaking. It's your turn to talk."], [453.68, 457.24, "Which rhetorical appeal do you find most persuasive, and why?"], [474.05, 475.6, "Now listen to Visal."], [475.9, 508.35, "Personally, I find ethos the most persuasive, because I evaluate the messenger before I evaluate the message. Although a statistic may be accurate, I cannot judge its reliability unless I trust the person presenting it. Pathos certainly captures my attention, yet emotional stories alone can feel manipulative. When a credible doctor explains vaccine data calmly, all three appeals work together. Ultimately, credibility is the foundation on which both reason and emotion depend."], [508.65, 510.39, "Excellent answer, Visal!"], [511.28, 515.5, "Great work! Now you can use ten new words and complex subordination."], [515.8, 521.52, "Today's value is eloquence. Choose your words with care, and speak to persuade honestly."], [521.82, 524.23, "See you in Unit two. Goodbye!"], [524.53, 527.37, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C2B1-Unit02-Literary-Criticism": [[0.35, 5.62, "Hello, everyone! I'm Ms. Emma. Welcome to Online C two, Book one."], [5.92, 9.31, "Hi! I'm Visal. Let's learn together!"], [9.62, 16.54, "Unit two: Literary Criticism. Today you will report scholarly positions using passive nominal clauses."], [16.84, 19.77, "Here is our lesson map. Let's start!"], [20.73, 23.87, "Part one: words. You will learn ten new words."], [24.72, 25.98, "Deconstruction."], [26.98, 32.47, "Deconstruction means a critical method that exposes contradictions and hidden assumptions in texts."], [33.05, 36.81, "Deconstruction reveals how a text undermines its own claims."], [37.42, 40.01, "Your turn. Say: Deconstruction."], [42.87, 44.16, "Deconstruction."], [44.92, 46.1, "Postmodernism."], [47.12, 52.01, "Postmodernism means a movement sceptical of grand narratives and fixed meanings."], [52.62, 56.33, "Postmodernism questions whether any story can be objectively true."], [56.95, 59.74, "Your turn. Say: Postmodernism."], [62.6, 63.81, "Postmodernism."], [64.55, 65.32, "Canon."], [66.32, 70.41, "Canon means the body of works regarded as most important in a literature."], [71.02, 74.26, "Khmer literature's canon includes the Reamker and Tum Teav."], [74.85, 77.04, "Your turn. Say: Canon."], [79.9, 80.72, "Canon."], [81.45, 83.03, "Intertextuality."], [84.02, 88.97, "Intertextuality means the way texts echo, borrow from and respond to other texts."], [89.55, 92.78, "Intertextuality links the novel to the ancient Reamker."], [93.38, 96.6, "Your turn. Say: Intertextuality."], [99.47, 100.94, "Intertextuality."], [101.68, 102.82, "Subtext."], [103.82, 107.94, "Subtext means an underlying meaning that is not stated directly."], [108.55, 111.94, "The subtext of the dialogue is the couple's unspoken grief."], [112.55, 115.24, "Your turn. Say: Subtext."], [118.1, 119.23, "Subtext."], [119.98, 121.15, "Discourse."], [122.15, 126.91, "Discourse means a system of language and ideas through which a subject is discussed."], [127.52, 131.14, "Colonial discourse portrayed Cambodia as a lost civilisation."], [131.75, 134.66, "Your turn. Say: Discourse."], [137.5, 138.59, "Discourse."], [139.35, 140.64, "Interpretation."], [141.65, 145.1, "Interpretation means an explanation of the meaning of a text."], [145.72, 149.34, "Each generation offers a new interpretation of Tum Teav."], [149.95, 152.97, "Your turn. Say: Interpretation."], [155.83, 157.16, "Interpretation."], [157.92, 159.16, "Critical lens."], [160.15, 163.89, "Critical lens means a theoretical perspective used to analyse a text."], [164.48, 169.26, "Through a feminist critical lens, the heroine's silence becomes resistance."], [169.85, 172.57, "Your turn. Say: Critical lens."], [175.43, 176.74, "Critical lens."], [177.48, 178.8, "Hermeneutics."], [179.78, 182.87, "Hermeneutics means the theory and method of interpretation."], [183.48, 187.09, "Hermeneutics asks how readers' histories shape what they understand."], [187.68, 190.71, "Your turn. Say: Hermeneutics."], [193.57, 194.73, "Hermeneutics."], [195.48, 196.47, "Close reading."], [197.48, 201.41, "Close reading means careful, detailed analysis of a short passage."], [202.02, 205.07, "Close reading of one stanza revealed the poem's irony."], [205.68, 208.15, "Your turn. Say: Close reading."], [211.0, 212.04, "Close reading."], [212.83, 216.75, "Part two: dialogue. Let's listen to a conversation."], [217.62, 223.66, "Visal, my teacher says Tum Teav is simply a tragic love story. Is that the only interpretation?"], [224.75, 231.57, "Hardly. It has been argued that the poem is also a critique of arranged marriage and abusive authority."], [232.68, 235.8, "But surely the author's intention decides what it means?"], [236.88, 245.62, "That view is contested. It is widely held that meaning is shaped by readers, not fixed by authors, especially when the author is unknown."], [246.72, 248.88, "So any interpretation is valid?"], [249.98, 259.69, "No. It is generally accepted that a reading must be supported by textual evidence. Different lenses illuminate a text without licensing anything at all."], [260.83, 262.57, "Part three: grammar."], [263.42, 266.68, "Grammar focus: Passive nominal clauses."], [266.98, 268.14, "Look at the pattern."], [268.85, 271.8, "It is argued that meaning is shaped by interpretation."], [272.72, 275.95, "It has been suggested that the poem critiques arranged marriage."], [276.85, 280.32, "It is generally accepted that readings need textual evidence."], [281.27, 292.91, "Impersonal passives distance the writer from a claim: It is argued / believed / widely held that… An alternative is 'subject + passive + to-infinitive': The poem is thought to date from the 17th century."], [293.65, 297.99, "Be careful! Don't say: It is argued the poem that is political."], [299.93, 302.71, "Say: It is argued that the poem is political."], [303.01, 305.08, "It is argued that + clause."], [305.87, 308.35, "Part four: reading. Read and listen."], [309.13, 310.74, "Who Owns a Text's Meaning?."], [311.04, 317.23, "For much of the twentieth century, it was assumed that a literary work possessed a single meaning determined by its author."], [318.23, 326.88, "Structuralist and post-structuralist critics challenged this assumption, and it is now widely argued that meaning emerges from the interaction between text and reader."], [327.9, 333.9, "Deconstruction, for instance, exposes tensions within texts that undermine their apparently stable messages."], [334.9, 342.36, "Critics also question the canon itself, since it has been suggested that the selection of 'great' works reflects the values of those in power."], [343.37, 351.35, "Nevertheless, it is generally accepted that rigorous close reading remains the foundation of persuasive criticism, whatever critical lens is adopted."], [352.43, 356.41, "Part five: quiz. Five questions. Are you ready?"], [357.25, 360.33, "It blank that the novel reflects colonial attitudes."], [360.63, 364.51, "A, is argued. B, argues. C, is arguing."], [368.07, 370.06, "The answer is A: is argued."], [371.22, 374.35, "The way texts echo and respond to other texts is blank."], [374.65, 378.48, "A, subtext. B, intertextuality. C, canon."], [382.03, 384.82, "The answer is B: intertextuality."], [385.98, 388.64, "The theory and method of interpretation is blank."], [388.94, 393.5, "A, deconstruction. B, postmodernism. C, hermeneutics."], [397.07, 399.4, "The answer is C: hermeneutics."], [400.55, 402.31, "Choose the correct sentence."], [402.61, 409.07, "A, It is believed the poem to be ancient.. B, The poem is believed to be ancient.. C, The poem believes to be ancient.."], [412.63, 416.05, "The answer is B: The poem is believed to be ancient.."], [417.18, 420.45, "According to the reading, critics question the canon because…"], [420.75, 426.91, "A, it is too short. B, it may reflect the values of the powerful. C, it ignores close reading."], [430.47, 433.74, "The answer is B: it may reflect the values of the powerful."], [434.93, 438.13, "Part six: speaking. It's your turn to talk."], [438.98, 441.87, "How does a critical lens change the meaning of a text?"], [458.65, 460.14, "Now listen to Visal."], [460.44, 496.29, "A critical lens changes which features of a text become visible and significant. Read as a romance, Tum Teav celebrates passionate love; read through a feminist lens, it exposes how women's choices were controlled by family and power. It has been argued that no reading is entirely neutral, because every reader brings assumptions. However, a lens does not create meaning from nothing; it foregrounds patterns that are already present. In my view, using several lenses produces the richest understanding."], [496.59, 498.39, "Excellent answer, Visal!"], [499.28, 503.65, "Great work! Now you can use ten new words and passive nominal clauses."], [503.95, 510.07, "Today's value is intellectual curiosity. Ask deep questions, and keep exploring ideas."], [510.37, 512.98, "See you in Unit three. Goodbye!"], [513.28, 516.52, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C2B1-Unit03-Philosophical-Inquiry": [[0.35, 5.06, "Hello, everyone! I'm Ms. Emma. Welcome to Online C two, Book one."], [5.36, 9.08, "Hi! I'm Visal. Let's learn together!"], [9.38, 17.32, "Unit three: Philosophical Inquiry. Today you will explore abstract possibilities with inverted hypothetical conditionals."], [17.62, 20.3, "Here is our lesson map. Let's start!"], [21.27, 24.77, "Part one: words. You will learn ten new words."], [25.62, 26.84, "Epistemology."], [27.85, 32.04, "Epistemology means the branch of philosophy concerned with knowledge and belief."], [32.65, 36.24, "Epistemology asks how we can know anything with certainty."], [36.85, 39.93, "Your turn. Say: Epistemology."], [42.77, 44.0, "Epistemology."], [44.75, 45.99, "Metaphysics."], [46.98, 50.66, "Metaphysics means the study of the fundamental nature of reality."], [51.25, 54.59, "Metaphysics questions whether time truly exists."], [55.18, 58.02, "Your turn. Say: Metaphysics."], [60.87, 62.22, "Metaphysics."], [62.95, 64.37, "Existentialism."], [65.38, 70.55, "Existentialism means a philosophy stressing individual freedom and the creation of meaning."], [71.15, 74.72, "Existentialism holds that we define ourselves through our choices."], [75.32, 77.93, "Your turn. Say: Existentialism."], [80.8, 82.16, "Existentialism."], [82.92, 84.13, "Ontology."], [85.12, 88.58, "Ontology means the study of what exists and the nature of being."], [89.18, 93.16, "The ontology of numbers puzzles mathematicians and philosophers alike."], [93.75, 96.4, "Your turn. Say: Ontology."], [99.27, 100.77, "Ontology."], [101.52, 102.59, "Paradox."], [103.58, 107.81, "Paradox means a statement that seems self-contradictory yet may be true."], [108.42, 112.05, "The ship of Theseus is a famous paradox about identity."], [112.65, 115.31, "Your turn. Say: Paradox."], [118.17, 119.27, "Paradox."], [120.02, 121.17, "Skepticism."], [122.18, 127.4, "Skepticism means the philosophical position that certain knowledge is impossible or doubtful."], [127.98, 131.72, "Descartes used radical skepticism to find a certain foundation."], [132.32, 135.42, "Your turn. Say: Skepticism."], [138.27, 139.56, "Skepticism."], [140.32, 141.56, "Consciousness."], [142.55, 146.28, "Consciousness means the state of being aware of oneself and the world."], [146.88, 150.71, "Science still cannot explain how consciousness arises from matter."], [151.32, 154.48, "Your turn. Say: Consciousness."], [157.33, 158.31, "Consciousness."], [159.05, 159.98, "Inquiry."], [160.98, 164.5, "Inquiry means a systematic investigation into a question."], [165.12, 168.83, "Philosophical inquiry begins with a carefully framed question."], [169.45, 172.1, "Your turn. Say: Inquiry."], [174.97, 175.9, "Inquiry."], [176.65, 177.93, "Phenomenology."], [178.92, 183.17, "Phenomenology means the study of experience as it appears to consciousness."], [183.78, 187.3, "Phenomenology describes what it is like to perceive a sunrise."], [187.92, 191.24, "Your turn. Say: Phenomenology."], [194.1, 195.37, "Phenomenology."], [196.12, 197.18, "Dialectic."], [198.18, 202.5, "Dialectic means reasoning that progresses through the clash of opposing ideas."], [203.12, 206.92, "Through dialectic, thesis and antithesis produce a new synthesis."], [207.52, 210.33, "Your turn. Say: Dialectic."], [213.17, 214.27, "Dialectic."], [215.07, 218.8, "Part two: dialogue. Let's listen to a conversation."], [219.65, 225.19, "Visal, if a robot could perfectly imitate human conversation, would it actually be conscious?"], [226.28, 237.42, "That depends on what consciousness is. Were behaviour sufficient, the robot would qualify; but many philosophers insist there must also be inner experience."], [238.52, 241.18, "How could we ever test for inner experience?"], [242.28, 253.09, "That's precisely the problem. Were we able to measure subjective experience directly, the debate would be settled, but we can only observe behaviour."], [254.18, 256.38, "So the question may be unanswerable?"], [257.48, 267.18, "Perhaps for now. Yet were philosophers to stop asking it, science would lose the conceptual clarity it needs to make progress."], [268.33, 270.08, "Part three: grammar."], [270.92, 274.1, "Grammar focus: Hypothetical abstraction."], [274.4, 275.56, "Look at the pattern."], [276.25, 280.11, "Were consciousness fully understood, many paradoxes would dissolve."], [281.02, 284.54, "Were behaviour sufficient, the robot would count as conscious."], [285.45, 288.76, "Were philosophers to stop asking, science would lose clarity."], [289.7, 301.53, "Formal inversion replaces 'if': Were X understood = If X were understood; Were we to stop = If we stopped. Use 'were' for all persons. Negative: Were it not true… (never 'Weren't it')."], [302.28, 306.22, "Be careful! Don't say: Was the theory true, we would know."], [308.17, 310.63, "Say: Were the theory true, we would know."], [310.93, 313.3, "Inversion uses 'were' for all persons."], [314.1, 316.71, "Part four: reading. Read and listen."], [317.5, 318.73, "The Hard Problem."], [319.03, 325.58, "Philosophical inquiry differs from empirical science in that it examines the concepts on which all investigation depends."], [326.6, 333.39, "Epistemology asks what justifies belief, while metaphysics and ontology ask what kinds of things genuinely exist."], [334.4, 343.11, "Consciousness poses perhaps the most stubborn puzzle: were every neuron mapped, we might still be unable to explain why experience feels like anything at all."], [344.1, 350.62, "David Chalmers called this the 'hard problem', distinguishing it from the comparatively 'easy' problems of explaining behaviour."], [351.6, 358.5, "Were it ever solved, the solution would transform not only philosophy but also medicine, ethics and artificial intelligence."], [359.6, 363.46, "Part five: quiz. Five questions. Are you ready?"], [364.32, 367.47, "blank the theory correct, the paradox would disappear."], [367.77, 370.8, "A, Was. B, Were. C, If were."], [374.37, 375.89, "The answer is B: Were."], [377.05, 380.35, "The study of what exists and the nature of being is blank."], [380.65, 385.29, "A, ontology. B, skepticism. C, dialectic."], [388.83, 391.08, "The answer is A: ontology."], [392.22, 395.95, "A statement that seems self-contradictory yet may be true is a blank."], [396.25, 400.69, "A, phenomenology. B, consciousness. C, paradox."], [404.23, 406.56, "The answer is C: paradox."], [407.72, 409.51, "Choose the correct sentence."], [409.81, 417.11, "A, Were we to agree, the debate would end.. B, Were we agree, the debate would end.. C, If were we to agree, the debate would end.."], [420.67, 423.69, "The answer is A: Were we to agree, the debate would end.."], [424.85, 428.06, "According to the reading, the 'hard problem' concerns…"], [428.36, 434.2, "A, explaining behaviour. B, why experience feels like anything. C, mapping neurons."], [437.77, 441.26, "The answer is B: why experience feels like anything."], [442.47, 445.9, "Part six: speaking. It's your turn to talk."], [446.75, 450.12, "What philosophical question do you find most compelling?"], [466.92, 468.32, "Now listen to Visal."], [468.62, 502.78, "The question I find most compelling is whether free will genuinely exists. Were all our choices determined by genes, upbringing and brain chemistry, moral responsibility would seem difficult to justify. Yet we experience ourselves as deciding, and legal systems assume that people could have acted otherwise. This tension fascinates me because it links metaphysics to justice. Were it resolved, our understanding of praise, blame and even education would change profoundly."], [503.08, 504.75, "Excellent answer, Visal!"], [505.65, 510.03, "Great work! Now you can use ten new words and hypothetical abstraction."], [510.33, 515.37, "Today's value is wisdom. Think carefully and listen to good advice before you decide."], [515.66, 518.14, "See you in Unit four. Goodbye!"], [518.44, 521.69, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C2B1-Unit04-Advanced-Academic-Research": [[0.35, 5.05, "Hello, everyone! I'm Ms. Emma. Welcome to Online C two, Book one."], [5.35, 9.21, "Hi! I'm Visal. Let's learn together!"], [9.51, 15.93, "Unit four: Advanced Academic Research. Today you will condense arguments with nominalized abstraction."], [16.23, 18.88, "Here is our lesson map. Let's start!"], [19.83, 23.29, "Part one: words. You will learn ten new words."], [24.15, 25.56, "Meta-analysis."], [26.55, 30.95, "Meta-analysis means a statistical synthesis of results from many studies."], [31.55, 34.93, "A meta-analysis of forty trials confirmed the drug's effect."], [35.52, 38.28, "Your turn. Say: Meta-analysis."], [41.13, 42.58, "Meta-analysis."], [43.32, 44.89, "Longitudinal study."], [45.88, 50.62, "Longitudinal study means research that observes the same subjects over a long period."], [51.22, 54.58, "A longitudinal study followed the children for twenty years."], [55.18, 58.05, "Your turn. Say: Longitudinal study."], [60.9, 62.6, "Longitudinal study."], [63.35, 65.16, "Statistical significance."], [66.15, 70.72, "Statistical significance means the likelihood that a result is not due to chance."], [71.32, 74.04, "The difference lacked statistical significance."], [74.65, 78.43, "Your turn. Say: Statistical significance."], [81.27, 83.27, "Statistical significance."], [84.02, 85.32, "Literature review."], [86.32, 90.35, "Literature review means a critical survey of existing research on a topic."], [90.95, 94.37, "Her literature review exposed a gap in Cambodian data."], [94.95, 97.53, "Your turn. Say: Literature review."], [100.37, 101.85, "Literature review."], [102.62, 104.09, "Theoretical framework."], [105.08, 108.67, "Theoretical framework means the set of theories that structures a study."], [109.28, 112.49, "The theoretical framework drew on human capital theory."], [113.08, 116.19, "Your turn. Say: Theoretical framework."], [119.03, 120.52, "Theoretical framework."], [121.28, 122.62, "Reproducibility."], [123.62, 128.43, "Reproducibility means the ability of other researchers to obtain the same results."], [129.02, 131.96, "The reproducibility crisis shook psychology."], [132.55, 135.53, "Your turn. Say: Reproducibility."], [138.37, 139.85, "Reproducibility."], [140.62, 141.97, "Epistemic rigor."], [142.95, 146.94, "Epistemic rigor means strict standards for justifying knowledge claims."], [147.55, 151.35, "Epistemic rigor demands that every claim be traceable to evidence."], [151.95, 155.28, "Your turn. Say: Epistemic rigor."], [158.13, 159.61, "Epistemic rigor."], [160.35, 161.53, "Peer critique."], [162.52, 166.41, "Peer critique means evaluation of work by other experts in the field."], [167.02, 169.93, "Peer critique exposed a flaw in the sampling method."], [170.55, 173.76, "Your turn. Say: Peer critique."], [176.6, 177.79, "Peer critique."], [178.55, 179.8, "Meta-cognition."], [180.78, 184.44, "Meta-cognition means awareness and regulation of one's own thinking."], [185.05, 188.41, "Meta-cognition helps researchers notice their own biases."], [189.02, 192.04, "Your turn. Say: Meta-cognition."], [194.9, 196.25, "Meta-cognition."], [196.98, 198.18, "Triangulation."], [199.18, 203.61, "Triangulation means using several methods or sources to confirm a finding."], [204.22, 207.5, "Triangulation combined surveys, interviews and test scores."], [208.12, 210.66, "Your turn. Say: Triangulation."], [213.5, 214.85, "Triangulation."], [215.63, 219.54, "Part two: dialogue. Let's listen to a conversation."], [220.38, 226.73, "Visal, a study claims that students who drink coffee get better grades. Should schools serve coffee?"], [227.82, 235.46, "Not yet. The reliability of that claim depends on its design. Correlation alone offers no proof of causation."], [236.55, 238.12, "But the sample was huge."], [239.22, 248.96, "Size isn't everything. The absence of a control group and the reliance on self-reported data weaken the conclusion considerably."], [250.05, 251.43, "What would convince you?"], [252.55, 262.31, "The replication of the result in independent studies, ideally a meta-analysis. The reproducibility of findings is what determines their reliability."], [263.47, 265.13, "Part three: grammar."], [265.98, 269.31, "Grammar focus: Nominalized abstraction."], [269.61, 270.76, "Look at the pattern."], [271.45, 274.84, "The reproducibility of findings determines their reliability."], [275.75, 278.7, "The absence of a control group weakens the conclusion."], [279.62, 282.64, "The replication of results strengthens public confidence."], [283.6, 300.09, "Academic English turns verbs and adjectives into nouns (reproduce → reproducibility; absent → absence) to pack ideas densely. Compare: 'If others can reproduce findings, they are reliable' → 'The reproducibility of findings determines their reliability.'"], [300.85, 304.81, "Be careful! Don't say: The reproduce of findings matters."], [306.77, 309.87, "Say: The reproducibility of findings matters."], [310.17, 311.54, "Use the noun form."], [312.33, 314.78, "Part four: reading. Read and listen."], [315.57, 317.32, "The Replication Crisis."], [317.62, 326.24, "During the 2010s, the failure of many landmark psychology experiments to replicate triggered what became known as the reproducibility crisis."], [327.23, 334.3, "The causes included small samples, selective reporting of significant results and pressure on researchers to publish novel findings."], [335.3, 343.78, "In response, the adoption of pre-registration, which requires the publication of hypotheses before data collection, has spread across disciplines."], [344.77, 353.85, "Meta-analysis and triangulation provide further safeguards, since the convergence of independent evidence is harder to manufacture than a single striking result."], [354.83, 362.77, "Ultimately, the trustworthiness of research depends less on any individual study than on the epistemic rigor of the community that scrutinises it."], [363.87, 367.46, "Part five: quiz. Five questions. Are you ready?"], [368.32, 370.47, "The blank of the data weakened the study."], [370.77, 375.84, "A, unreliable. B, unreliability. C, unreliably."], [379.4, 381.5, "The answer is B: unreliability."], [382.65, 386.31, "A statistical synthesis of results from many studies is a blank."], [386.61, 391.29, "A, meta-analysis. B, literature review. C, peer critique."], [394.83, 397.27, "The answer is A: meta-analysis."], [398.42, 401.7, "Using several methods to confirm a finding is blank."], [402.0, 407.96, "A, meta-cognition. B, statistical significance. C, triangulation."], [411.5, 414.12, "The answer is C: triangulation."], [415.25, 417.42, "Choose the most academic sentence."], [417.72, 425.5, "A, Because they didn't check, it was wrong.. B, The lack of verification undermined the findings.. C, They didn't check so it's bad.."], [429.03, 433.32, "The answer is B: The lack of verification undermined the findings.."], [434.48, 437.63, "According to the reading, pre-registration requires…"], [437.93, 444.04, "A, publishing hypotheses before data collection. B, larger budgets. C, avoiding peer review."], [447.6, 451.39, "The answer is A: publishing hypotheses before data collection."], [452.6, 455.59, "Part six: speaking. It's your turn to talk."], [456.45, 458.88, "What makes academic research trustworthy?"], [475.68, 477.22, "Now listen to Visal."], [477.52, 514.5, "The trustworthiness of research depends primarily on the transparency of its methods and the reproducibility of its results. A single impressive study, however large, can be distorted by chance, bias or flawed design. Confidence grows when independent teams obtain the same findings using different methods, which is the purpose of triangulation and meta-analysis. Peer critique also exposes weaknesses authors overlook. Ultimately, rigor is a property of the scientific community, not of one paper."], [514.8, 516.63, "Excellent answer, Visal!"], [517.55, 521.82, "Great work! Now you can use ten new words and nominalized abstraction."], [522.12, 526.9, "Today's value is rigor. Check every step carefully before you trust a conclusion."], [527.21, 529.91, "See you in Unit five. Goodbye!"], [530.22, 533.27, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C2B1-Unit05-Professional-Mastery": [[0.35, 4.79, "Hello, everyone! I'm Ms. Emma. Welcome to Online C two, Book one."], [5.09, 8.36, "Hi! I'm Visal. Let's learn together!"], [8.66, 15.23, "Unit five: Professional Mastery. Today you will show cause and sequence with perfect participial phrases."], [15.53, 18.42, "Here is our lesson map. Let's start!"], [19.37, 22.53, "Part one: words. You will learn ten new words."], [23.38, 24.61, "Expertise."], [25.62, 29.79, "Expertise means expert skill or knowledge in a particular field."], [30.38, 34.03, "Her expertise in water engineering is recognised across ASEAN."], [34.62, 37.54, "Your turn. Say: Expertise."], [40.4, 41.63, "Expertise."], [42.38, 43.71, "Thought leadership."], [44.72, 49.63, "Thought leadership means influence gained by offering original, respected ideas in a field."], [50.22, 53.52, "His thought leadership on fintech shaped national policy."], [54.12, 56.99, "Your turn. Say: Thought leadership."], [59.83, 61.57, "Thought leadership."], [62.32, 63.6, "Strategic vision."], [64.58, 69.53, "Strategic vision means a clear long-term view of where an organisation should go."], [70.12, 74.41, "Her strategic vision transformed a local clinic into a hospital network."], [75.02, 77.54, "Your turn. Say: Strategic vision."], [80.4, 81.73, "Strategic vision."], [82.48, 83.61, "Mentorship."], [84.62, 89.2, "Mentorship means guidance given by an experienced person to a less experienced one."], [89.82, 92.75, "Mentorship accelerated the young lawyer's development."], [93.35, 95.84, "Your turn. Say: Mentorship."], [98.7, 99.85, "Mentorship."], [100.62, 101.94, "Industry authority."], [102.95, 107.88, "Industry authority means a person widely accepted as an expert in a sector."], [108.48, 112.78, "After thirty years, he became the industry authority on rice exports."], [113.38, 116.5, "Your turn. Say: Industry authority."], [119.37, 120.74, "Industry authority."], [121.48, 123.08, "Innovation pipeline."], [124.08, 128.32, "Innovation pipeline means a structured flow of new ideas being developed."], [128.92, 132.41, "A strong innovation pipeline keeps the firm ahead of rivals."], [133.02, 135.95, "Your turn. Say: Innovation pipeline."], [138.8, 140.35, "Innovation pipeline."], [141.08, 142.64, "Executive presence."], [143.65, 147.94, "Executive presence means the ability to project confidence and authority."], [148.55, 151.87, "Executive presence helped her calm a tense board meeting."], [152.48, 155.87, "Your turn. Say: Executive presence."], [158.73, 160.38, "Executive presence."], [161.15, 162.12, "Legacy."], [163.12, 166.82, "Legacy means what a person leaves behind for future generations."], [167.42, 170.84, "His legacy is a generation of well-trained engineers."], [171.45, 174.24, "Your turn. Say: Legacy."], [177.1, 178.21, "Legacy."], [178.95, 180.4, "Succession planning."], [181.42, 185.52, "Succession planning means preparing future leaders to take over key roles."], [186.12, 189.24, "Succession planning ensured a smooth handover."], [189.85, 193.04, "Your turn. Say: Succession planning."], [195.9, 197.52, "Succession planning."], [198.25, 199.2, "Governance."], [200.22, 204.56, "Governance means the systems by which an organisation is directed and controlled."], [205.15, 208.31, "Strong governance protected the foundation from corruption."], [208.92, 211.69, "Your turn. Say: Governance."], [214.53, 215.55, "Governance."], [216.33, 220.34, "Part two: dialogue. Let's listen to a conversation."], [221.18, 227.68, "Visal, Dr. Sotheara is now the leading authority on tropical diseases in Cambodia. How did she get there?"], [228.78, 236.29, "Having spent fifteen years in rural clinics, she understood problems that laboratory researchers had overlooked."], [237.38, 239.16, "Was experience alone enough?"], [240.25, 250.02, "No. Having combined practice with rigorous research, she published findings that changed national treatment guidelines."], [251.12, 252.03, "And now?"], [253.12, 262.72, "Having achieved recognition, she devotes much of her time to mentorship, because mastery that isn't passed on dies with its owner."], [263.87, 265.47, "Part three: grammar."], [266.32, 269.44, "Grammar focus: Participial phrases."], [269.74, 270.93, "Look at the pattern."], [271.62, 275.49, "Having built real expertise, she became an industry authority."], [276.38, 280.6, "Having spent years in rural clinics, she understood overlooked problems."], [281.52, 285.37, "Having achieved recognition, she now focuses on mentorship."], [286.33, 299.32, "The perfect participle ('Having + p.p.') shows an action completed before the main action, often implying cause. The subject must match: 'Having finished the report, she left' — not 'Having finished the report, the office closed.'"], [300.08, 304.02, "Be careful! Don't say: Having finished, the report was sent."], [305.97, 308.62, "Say: Having finished, she sent the report."], [308.92, 311.43, "Participle subject = main subject."], [312.23, 314.78, "Part four: reading. Read and listen."], [315.57, 317.51, "Beyond Ten Thousand Hours."], [317.81, 325.47, "Popular accounts often reduce mastery to a simple formula, claiming that ten thousand hours of practice will produce expertise in any field."], [326.47, 335.97, "Research by Anders Ericsson, however, emphasised the quality of practice rather than its quantity, highlighting focused effort, expert feedback and continual stretching beyond comfort."], [336.97, 343.9, "Having reached a high level of skill, true masters typically shift their attention from personal performance to shaping their profession."], [344.9, 351.17, "They become thought leaders, mentors and guardians of standards, ensuring that knowledge survives beyond a single career."], [352.17, 358.68, "Mastery, in this sense, is measured not only by what professionals can do, but by what they enable others to do."], [359.77, 363.79, "Part five: quiz. Five questions. Are you ready?"], [364.65, 367.11, "blank the exam, she applied for the job."], [367.41, 371.67, "A, Having passed. B, Having pass. C, Passed having."], [375.23, 377.44, "The answer is A: Having passed."], [378.58, 381.98, "The ability to project confidence and authority is blank."], [382.28, 386.6, "A, governance. B, executive presence. C, legacy."], [390.17, 393.25, "The answer is B: executive presence."], [394.38, 397.74, "A structured flow of new ideas being developed is an blank."], [398.04, 403.09, "A, innovation pipeline. B, mentorship. C, expertise."], [406.63, 409.03, "The answer is A: innovation pipeline."], [410.18, 411.89, "Choose the correct sentence."], [412.19, 421.22, "A, Having finished the report, the office closed.. B, Having finished the report, she left the office.. C, Having finish the report, she left.."], [424.77, 429.43, "The answer is B: Having finished the report, she left the office.."], [430.58, 433.94, "According to Ericsson, mastery depends mainly on…"], [434.24, 439.79, "A, the quantity of practice. B, the quality of practice. C, natural talent."], [443.33, 446.36, "The answer is B: the quality of practice."], [447.57, 450.58, "Part six: speaking. It's your turn to talk."], [451.42, 453.65, "What defines mastery in a profession?"], [470.45, 472.02, "Now listen to Visal."], [472.32, 510.82, "Mastery is defined not merely by technical excellence but by the depth of judgement that experience produces. Having solved hundreds of difficult cases, a master recognises patterns that novices miss and knows when the rules should be broken. Equally important is the capacity to teach: a true master raises the standards of the whole profession through mentorship. For example, a great surgeon trains the next generation, not just patients. In my view, mastery becomes complete only when it is shared."], [511.12, 512.81, "Excellent answer, Visal!"], [513.72, 518.01, "Great work! Now you can use ten new words and participial phrases."], [518.31, 523.54, "Today's value is mastery. Practise with patience until your skill becomes excellence."], [523.84, 526.52, "See you in Unit six. Goodbye!"], [526.82, 530.11, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C2B1-Unit06-Cross-Cultural-Diplomacy": [[0.35, 5.25, "Hello, everyone! I'm Ms. Emma. Welcome to Online C two, Book one."], [5.55, 8.86, "Hi! I'm Visal. Let's learn together!"], [9.16, 16.63, "Unit six: Cross-Cultural Diplomacy. Today you will describe diplomatic processes with formal passive constructions."], [16.93, 19.56, "Here is our lesson map. Let's start!"], [20.5, 23.58, "Part one: words. You will learn ten new words."], [24.42, 25.96, "Cultural competence."], [26.95, 31.76, "Cultural competence means the ability to interact effectively across cultures."], [32.35, 36.11, "Cultural competence prevented a minor gesture from becoming an insult."], [36.72, 39.86, "Your turn. Say: Cultural competence."], [42.7, 44.19, "Cultural competence."], [44.95, 46.5, "Diplomatic protocol."], [47.48, 52.08, "Diplomatic protocol means the formal rules of etiquette in international relations."], [52.68, 56.55, "Diplomatic protocol dictates the seating order at state dinners."], [57.15, 59.72, "Your turn. Say: Diplomatic protocol."], [62.57, 64.37, "Diplomatic protocol."], [65.12, 66.76, "Negotiated settlement."], [67.75, 72.57, "Negotiated settlement means an agreement reached through negotiation rather than force."], [73.18, 76.04, "The border dispute ended in a negotiated settlement."], [76.65, 80.0, "Your turn. Say: Negotiated settlement."], [82.83, 84.54, "Negotiated settlement."], [85.28, 86.47, "Geopolitics."], [87.48, 91.91, "Geopolitics means politics shaped by geography and power between states."], [92.52, 96.86, "Mekong geopolitics involves dams, water and great-power rivalry."], [97.45, 100.74, "Your turn. Say: Geopolitics."], [103.6, 104.87, "Geopolitics."], [105.62, 106.92, "Multilateralism."], [107.92, 112.81, "Multilateralism means cooperation among many countries through shared institutions."], [113.42, 116.06, "ASEAN embodies regional multilateralism."], [116.65, 119.64, "Your turn. Say: Multilateralism."], [122.5, 123.99, "Multilateralism."], [124.75, 126.12, "Soft power."], [127.12, 131.46, "Soft power means influence based on attraction rather than coercion."], [132.05, 135.38, "K-pop has greatly expanded Korea's soft power."], [135.98, 139.03, "Your turn. Say: Soft power."], [141.87, 143.12, "Soft power."], [143.88, 145.5, "Bilateral relations."], [146.48, 149.97, "Bilateral relations means relations between two countries."], [150.58, 153.4, "Bilateral relations improved after the trade agreement."], [153.98, 157.05, "Your turn. Say: Bilateral relations."], [159.9, 161.61, "Bilateral relations."], [162.35, 163.65, "Consensus-building."], [164.65, 168.18, "Consensus-building means the process of reaching general agreement."], [168.78, 172.26, "Consensus-building is slow but produces durable decisions."], [172.85, 175.98, "Your turn. Say: Consensus-building."], [178.83, 180.18, "Consensus-building."], [180.92, 182.0, "Realpolitik."], [182.98, 187.61, "Realpolitik means politics based on practical interests rather than ideals."], [188.22, 192.22, "Realpolitik led both nations to cooperate despite their differences."], [192.82, 195.72, "Your turn. Say: Realpolitik."], [198.57, 199.86, "Realpolitik."], [200.62, 201.91, "Multilateral."], [202.92, 206.12, "Multilateral means involving three or more countries."], [206.72, 209.78, "A multilateral agreement on fishing protected the Mekong."], [210.38, 213.47, "Your turn. Say: Multilateral."], [216.3, 217.46, "Multilateral."], [218.27, 221.72, "Part two: dialogue. Let's listen to a conversation."], [222.58, 230.59, "Visal, the Paris Peace Agreements of 1991 ended Cambodia's long conflict. How was such a complex deal achieved?"], [231.68, 240.0, "It was negotiated over several years, and crucially, it was guaranteed by multiple countries rather than by a single power."], [241.08, 242.34, "Why did that matter?"], [243.45, 252.96, "Because trust was lacking between the factions. A multilateral framework was established so that no party could be dominated by another."], [254.05, 256.15, "Were cultural differences an obstacle?"], [257.25, 265.66, "Constantly. Face had to be preserved on all sides, so agreements were often reached privately before being announced publicly."], [266.8, 268.75, "Part three: grammar."], [269.62, 273.11, "Grammar focus: Formal passive constructions."], [273.41, 274.62, "Look at the pattern."], [275.32, 278.35, "A settlement was negotiated through careful diplomacy."], [279.25, 282.13, "The framework was guaranteed by multiple countries."], [283.02, 286.06, "Agreements were reached privately before being announced."], [287.0, 298.08, "Formal passives foreground outcomes and depersonalise sensitive actions — vital in diplomacy, where blame must be avoided. Note the passive gerund 'before being announced' and the passive perfect 'had been agreed'."], [298.82, 302.76, "Be careful! Don't say: The deal was agreed before announced."], [304.7, 307.51, "Say: The deal was agreed before being announced."], [307.81, 310.06, "Before + being + p.p."], [310.87, 313.52, "Part four: reading. Read and listen."], [314.33, 316.38, "Saving Face, Building Peace."], [316.68, 324.81, "Cross-cultural diplomacy requires an understanding not only of national interests but also of the values through which those interests are expressed."], [325.8, 333.49, "In many Asian contexts, direct refusal is considered damaging to face, so disagreements are frequently conveyed through indirect language."], [334.5, 341.85, "The Paris Peace Agreements on Cambodia were negotiated through years of patient consensus-building and were guaranteed by a multilateral framework."], [342.87, 350.31, "Soft power also shapes diplomacy, since nations admired for their culture find it easier to win cooperation without coercion."], [351.3, 357.17, "Yet idealism is always tempered by realpolitik, as states ultimately pursue security and prosperity."], [358.27, 362.21, "Part five: quiz. Five questions. Are you ready?"], [363.05, 367.04, "The treaty blank by twelve nations in 1991."], [367.33, 372.21, "A, signed. B, was signed. C, has signing."], [375.77, 377.78, "The answer is B: was signed."], [378.92, 382.87, "Influence based on attraction rather than coercion is blank."], [383.17, 388.07, "A, soft power. B, realpolitik. C, geopolitics."], [391.63, 393.84, "The answer is A: soft power."], [394.98, 397.9, "Relations between two countries are blank relations."], [398.2, 402.36, "A, multilateral. B, consensus. C, bilateral."], [405.9, 407.88, "The answer is C: bilateral."], [409.02, 410.69, "Choose the correct sentence."], [410.99, 418.63, "A, The deal was agreed before announced.. B, The deal was agreed before being announced.. C, The deal agreed before being announced.."], [422.17, 425.8, "The answer is B: The deal was agreed before being announced.."], [426.95, 431.17, "According to the reading, the Paris Peace Agreements were guaranteed by…"], [431.47, 436.68, "A, one superpower. B, a multilateral framework. C, Cambodia alone."], [440.23, 443.21, "The answer is B: a multilateral framework."], [444.4, 447.41, "Part six: speaking. It's your turn to talk."], [448.25, 451.84, "Why is cultural competence important in international diplomacy?"], [468.65, 470.2, "Now listen to Visal."], [470.5, 508.18, "Cultural competence is essential because diplomatic messages are interpreted through cultural expectations as much as through words. A proposal that seems efficient in one culture may be perceived as arrogant in another, and negotiations can collapse over issues of respect rather than substance. For example, in many Asian contexts, a public refusal causes loss of face, so skilled diplomats signal disagreement indirectly. Without such awareness, even well-intentioned agreements may never be reached."], [508.48, 510.19, "Excellent answer, Visal!"], [511.08, 515.95, "Great work! Now you can use ten new words and formal passive constructions."], [516.25, 522.0, "Today's value is global citizenship. We all share one world. Help people near and far."], [522.3, 524.71, "See you in Unit seven. Goodbye!"], [525.0, 527.42, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C2B1-Unit07-Complex-Problem-Solving": [[0.35, 5.0, "Hello, everyone! I'm Ms. Emma. Welcome to Online C two, Book one."], [5.3, 8.79, "Hi! I'm Visal. Let's learn together!"], [9.09, 16.55, "Unit seven: Complex Problem Solving. Today you will reason about consequences with abstract inverted conditionals."], [16.85, 19.48, "Here is our lesson map. Let's start!"], [20.43, 23.62, "Part one: words. You will learn ten new words."], [24.48, 25.66, "Systems thinking."], [26.65, 30.75, "Systems thinking means analysing how parts of a system interact as a whole."], [31.35, 34.58, "Systems thinking showed that more roads increased congestion."], [35.18, 38.03, "Your turn. Say: Systems thinking."], [40.87, 42.3, "Systems thinking."], [43.05, 44.3, "Root cause."], [45.28, 48.99, "Root cause means the fundamental reason a problem occurs."], [49.58, 53.26, "Poor drainage, not rainfall, was the root cause of the flooding."], [53.85, 56.8, "Your turn. Say: Root cause."], [59.67, 60.84, "Root cause."], [61.58, 62.91, "Interdisciplinary."], [63.92, 67.46, "Interdisciplinary means combining several academic fields."], [68.05, 72.36, "An interdisciplinary team of engineers and sociologists studied the slum."], [72.95, 76.06, "Your turn. Say: Interdisciplinary."], [78.9, 80.26, "Interdisciplinary."], [81.02, 82.52, "Trade-off."], [83.52, 87.78, "Trade-off means a balance between two desirable but competing things."], [88.38, 92.37, "Every policy involves a trade-off between cost and coverage."], [92.98, 96.46, "Your turn. Say: Trade-off."], [99.3, 101.06, "Trade-off."], [101.82, 103.34, "Iterative process."], [104.35, 107.77, "Iterative process means a cycle of repeated testing and refinement."], [108.35, 111.38, "Design is an iterative process of trial and correction."], [111.98, 115.0, "Your turn. Say: Iterative process."], [117.83, 119.36, "Iterative process."], [120.12, 121.98, "Unintended consequence."], [122.98, 126.88, "Unintended consequence means an unforeseen result of an action."], [127.48, 131.48, "An unintended consequence of the plastic ban was more paper waste."], [132.08, 135.48, "Your turn. Say: Unintended consequence."], [138.33, 140.0, "Unintended consequence."], [140.75, 142.16, "Holistic approach."], [143.15, 148.15, "Holistic approach means considering the whole situation rather than isolated parts."], [148.75, 152.65, "A holistic approach addressed health, income and education together."], [153.25, 156.58, "Your turn. Say: Holistic approach."], [159.43, 160.79, "Holistic approach."], [161.55, 163.13, "Adaptive strategy."], [164.12, 168.12, "Adaptive strategy means a plan designed to change as conditions change."], [168.72, 173.07, "Farmers adopted an adaptive strategy as rainfall became unpredictable."], [173.68, 177.59, "Your turn. Say: Adaptive strategy."], [180.43, 182.03, "Adaptive strategy."], [182.78, 183.76, "Heuristic."], [184.75, 187.63, "Heuristic means a mental shortcut or rule of thumb."], [188.22, 191.27, "'Follow the money' is a useful heuristic for investigators."], [191.88, 194.52, "Your turn. Say: Heuristic."], [197.37, 198.37, "Heuristic."], [199.12, 200.31, "Contingency."], [201.32, 205.28, "Contingency means a possible future event that must be planned for."], [205.88, 209.11, "The plan covered every contingency except a pandemic."], [209.72, 212.45, "Your turn. Say: Contingency."], [215.3, 216.47, "Contingency."], [217.27, 221.01, "Part two: dialogue. Let's listen to a conversation."], [221.85, 227.06, "Visal, Phnom Penh wants to reduce traffic jams. Why not simply build wider roads?"], [228.15, 236.77, "Because systems thinking predicts induced demand. Were roads widened, driving would become easier, attracting even more cars."], [237.88, 239.58, "So what's the root cause?"], [240.68, 251.85, "It's interconnected: limited public transport, cheap fuel and car-centred planning. Were we to tackle only one factor, the others would simply compensate."], [252.95, 254.91, "Then the problem seems impossible."], [256.02, 265.38, "Not impossible, but it demands an iterative, holistic approach. Should a pilot bus lane succeed, it could be expanded step by step."], [266.53, 267.93, "Part three: grammar."], [268.78, 271.71, "Grammar focus: Abstract conditional reasoning."], [272.01, 273.13, "Look at the pattern."], [273.82, 278.27, "Were we to ignore trade-offs, unintended consequences would follow."], [279.15, 282.15, "Were roads widened, more cars would be attracted."], [283.05, 286.63, "Should a pilot succeed, it could be expanded gradually."], [287.57, 298.4, "'Were + subject + to-infinitive' presents a hypothetical action (Were we to ignore…); 'Should + subject + verb' presents a less likely future possibility (Should it fail…). Both are formal alternatives to 'if'."], [299.15, 303.25, "Be careful! Don't say: Should the plan fails, we adapt."], [305.2, 308.29, "Say: Should the plan fail, we will adapt."], [308.59, 310.74, "Should + subject + base verb."], [311.53, 314.28, "Part four: reading. Read and listen."], [315.07, 316.33, "Wicked Problems."], [316.63, 325.53, "Complex problems such as urban congestion, climate adaptation and poverty are sometimes described as 'wicked', because they lack a single definition or solution."], [326.53, 334.57, "Each intervention changes the system, so were policymakers to treat symptoms in isolation, unintended consequences would almost certainly follow."], [335.57, 342.69, "Systems thinking encourages analysts to map feedback loops and identify root causes rather than the most visible effects."], [343.7, 351.88, "Because uncertainty is unavoidable, effective solutions tend to be iterative, combining small experiments with continuous evaluation."], [352.87, 361.58, "Interdisciplinary teams are particularly valuable, since engineers, economists and community members each perceive different parts of the same system."], [362.67, 366.56, "Part five: quiz. Five questions. Are you ready?"], [367.42, 370.0, "blank we to cut taxes, revenue would fall."], [370.3, 373.29, "A, Were. B, Was. C, Should."], [376.83, 378.54, "The answer is A: Were."], [379.68, 382.62, "The fundamental reason a problem occurs is the blank."], [382.92, 386.91, "A, heuristic. B, root cause. C, contingency."], [390.47, 393.01, "The answer is B: root cause."], [394.15, 396.76, "An unforeseen result of an action is an blank."], [397.06, 403.66, "A, adaptive strategy. B, iterative process. C, unintended consequence."], [407.2, 410.38, "The answer is C: unintended consequence."], [411.55, 413.38, "Choose the correct sentence."], [413.68, 421.29, "A, Should the trial fails, we will stop.. B, Should the trial fail, we will stop.. C, If should the trial fail, we stop.."], [424.83, 428.21, "The answer is B: Should the trial fail, we will stop.."], [429.35, 432.69, "According to the reading, wicked problems are difficult because they…"], [432.99, 439.4, "A, lack a single definition or solution. B, are very small. C, affect only engineers."], [442.97, 446.92, "The answer is A: lack a single definition or solution."], [448.13, 451.36, "Part six: speaking. It's your turn to talk."], [452.22, 454.97, "How would you approach a complex, multi-layered problem?"], [471.78, 473.24, "Now listen to Visal."], [473.54, 508.52, "I would begin by resisting the temptation to act immediately on the most visible symptom. First, I would map the system, identifying stakeholders, feedback loops and possible root causes, ideally with an interdisciplinary team. Next, I would test small interventions, because were I to launch a large solution without evidence, unintended consequences could outweigh the benefits. Finally, I would monitor results and adapt continuously. Complex problems are rarely solved once; they are managed iteratively."], [508.82, 510.49, "Excellent answer, Visal!"], [511.38, 516.0, "Great work! Now you can use ten new words and abstract conditional reasoning."], [516.3, 521.09, "Today's value is critical thinking. Think carefully and give reasons for your opinions."], [521.39, 523.66, "See you in Unit eight. Goodbye!"], [523.96, 527.12, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C2B1-Unit08-Legacy-Impact": [[0.35, 5.14, "Hello, everyone! I'm Ms. Emma. Welcome to Online C two, Book one."], [5.44, 8.97, "Hi! I'm Visal. Let's learn together!"], [9.27, 14.93, "Unit eight: Legacy & Impact. Today you will project lasting achievements with the future perfect."], [15.23, 17.84, "Here is our lesson map. Let's start!"], [18.8, 21.88, "Part one: words. You will learn ten new words."], [22.72, 24.2, "Enduring influence."], [25.22, 29.36, "Enduring influence means an effect that continues for a very long time."], [29.95, 33.58, "The teacher's enduring influence is visible in her former students."], [34.18, 36.94, "Your turn. Say: Enduring influence."], [39.8, 41.64, "Enduring influence."], [42.38, 43.53, "Transformative."], [44.55, 48.02, "Transformative means causing a major, fundamental change."], [48.62, 52.43, "Universal schooling had a transformative effect on the village."], [53.02, 55.94, "Your turn. Say: Transformative."], [58.8, 59.93, "Transformative."], [60.68, 61.86, "Contribution."], [62.85, 66.0, "Contrib
