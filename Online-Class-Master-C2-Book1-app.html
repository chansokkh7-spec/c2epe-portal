ution means something given to help achieve a result."], [66.58, 69.56, "His contribution to Khmer linguistics is immense."], [70.15, 72.79, "Your turn. Say: Contribution."], [75.63, 77.01, "Contribution."], [77.75, 78.81, "Posterity."], [79.82, 82.45, "Posterity means all future generations."], [83.05, 85.61, "The temple carvings were made for posterity."], [86.22, 88.81, "Your turn. Say: Posterity."], [91.67, 92.81, "Posterity."], [93.55, 94.59, "Visionary."], [95.58, 98.81, "Visionary means having original ideas about the future."], [99.42, 102.45, "Her visionary plan anticipated the digital economy."], [103.05, 105.68, "Your turn. Say: Visionary."], [108.53, 109.63, "Visionary."], [110.38, 111.91, "Societal impact."], [112.92, 117.04, "Societal impact means the effect of an action on society as a whole."], [117.65, 120.61, "The societal impact of mobile phones has been profound."], [121.22, 124.87, "Your turn. Say: Societal impact."], [127.73, 129.25, "Societal impact."], [129.98, 131.31, "Lasting change."], [132.32, 136.3, "Lasting change means a transformation that persists over time."], [136.92, 141.12, "Real reform creates lasting change, not temporary headlines."], [141.72, 144.74, "Your turn. Say: Lasting change."], [147.6, 149.13, "Lasting change."], [149.88, 150.9, "Stewardship."], [151.88, 156.12, "Stewardship means responsible management of something entrusted to one's care."], [156.72, 160.42, "Good stewardship of the forest benefits future generations."], [161.02, 163.77, "Your turn. Say: Stewardship."], [166.63, 167.72, "Stewardship."], [168.45, 169.57, "Zeitgeist."], [170.58, 174.45, "Zeitgeist means the defining spirit or mood of a particular period."], [175.05, 179.28, "The novel captured the optimistic zeitgeist of the 1960s."], [179.88, 182.87, "Your turn. Say: Zeitgeist."], [185.73, 186.88, "Zeitgeist."], [187.65, 188.67, "Heritage."], [189.68, 193.63, "Heritage means traditions, buildings and culture inherited from the past."], [194.25, 197.25, "Protecting Cambodia's heritage is a national priority."], [197.85, 201.14, "Your turn. Say: Heritage."], [204.0, 205.04, "Heritage."], [205.83, 209.47, "Part two: dialogue. Let's listen to a conversation."], [210.32, 215.67, "Visal, the founder of a rural library network is retiring next year. What will she have achieved?"], [216.78, 224.37, "By the time she retires, she will have opened more than two hundred libraries and trained over a thousand volunteers."], [225.48, 228.44, "Impressive, but will the libraries survive without her?"], [229.55, 238.08, "That's the real test of legacy. If she plans well, local committees will have taken full responsibility long before she leaves."], [239.18, 240.58, "And in twenty years?"], [241.68, 251.36, "By then, a whole generation of readers will have grown up with access to books. That is lasting change, rather than a moment of fame."], [252.5, 254.29, "Part three: grammar."], [255.15, 258.31, "Grammar focus: Future perfect for legacy."], [258.61, 259.83, "Look at the pattern."], [260.52, 264.03, "By the time she retires, she will have made a lasting change."], [264.92, 269.04, "By 2040, a generation will have grown up with books."], [269.95, 273.76, "Before she leaves, local committees will have taken responsibility."], [274.7, 285.46, "Use 'will have + past participle' for actions completed before a future point. After 'by the time' and 'before', use the present simple: By the time she retires (not 'will retire'), she will have…"], [286.22, 290.75, "Be careful! Don't say: By the time she will retire, she'll…"], [292.7, 295.77, "Say: By the time she retires, she will have…"], [296.07, 297.94, "Present tense after 'by the time'."], [298.73, 301.5, "Part four: reading. Read and listen."], [302.3, 303.68, "What Outlives Us."], [303.98, 310.59, "Legacy is often imagined as fame or monuments, yet the most enduring influence frequently takes quieter forms."], [311.6, 317.59, "Teachers, mentors and community builders shape lives in ways that will have multiplied long after their names are forgotten."], [318.6, 327.58, "Cambodia's temple builders created heritage that still defines national identity, while ordinary villagers preserved oral traditions across centuries of upheaval."], [328.57, 335.16, "Thinking about legacy encourages stewardship, since it requires us to consider how our choices will have affected posterity."], [336.17, 343.31, "Ultimately, a meaningful legacy depends less on what a person accumulates than on what continues to grow after they have gone."], [344.4, 348.29, "Part five: quiz. Five questions. Are you ready?"], [349.15, 352.18, "By 2030, we blank the new hospital."], [352.48, 356.6, "A, will finish. B, will have finished. C, have finished."], [360.17, 362.49, "The answer is B: will have finished."], [363.65, 365.88, "All future generations are blank."], [366.18, 370.19, "A, posterity. B, heritage. C, zeitgeist."], [373.73, 375.73, "The answer is A: posterity."], [376.88, 380.4, "Responsible management of something entrusted to you is blank."], [380.7, 384.69, "A, contribution. B, visionary. C, stewardship."], [388.23, 390.21, "The answer is C: stewardship."], [391.35, 393.12, "Choose the correct sentence."], [393.42, 402.18, "A, By the time he will arrive, we will have eaten.. B, By the time he arrives, we will have eaten.. C, By the time he arrives, we will eaten.."], [405.73, 409.25, "The answer is B: By the time he arrives, we will have eaten.."], [410.42, 414.23, "According to the reading, the most enduring influence often takes…"], [414.53, 419.26, "A, quieter forms. B, the form of monuments. C, the form of money."], [422.8, 425.31, "The answer is A: quieter forms."], [426.5, 429.68, "Part six: speaking. It's your turn to talk."], [430.52, 432.91, "What kind of legacy would you like to leave?"], [449.72, 451.31, "Now listen to Visal."], [451.61, 485.19, "I would like to leave a legacy of opportunity rather than possessions. By the end of my career, I hope I will have helped many young Cambodians, especially from rural areas, gain the education and confidence I was fortunate to receive. Monuments and wealth fade, but a student who becomes a teacher or doctor continues the chain of influence. If I succeed, my contribution will have multiplied through people I may never meet. That, to me, is the most meaningful form of legacy."], [485.49, 487.08, "Excellent answer, Visal!"], [487.98, 492.56, "Great work! Now you can use ten new words and future perfect for legacy."], [492.86, 497.69, "Today's value is legacy. Live in a way that leaves the world better for those who follow."], [497.99, 500.24, "See you in Unit nine. Goodbye!"], [500.54, 503.8, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C2B1-Unit09-Executive-Communication": [[0.35, 5.2, "Hello, everyone! I'm Ms. Emma. Welcome to Online C two, Book one."], [5.5, 8.55, "Hi! I'm Visal. Let's learn together!"], [8.85, 15.96, "Unit nine: Executive Communication. Today you will describe communicative balance with 'balanced with' structures."], [16.26, 18.95, "Here is our lesson map. Let's start!"], [19.9, 22.95, "Part one: words. You will learn eight new words."], [23.78, 25.48, "Executive presence."], [26.48, 31.34, "Executive presence means the capacity to inspire confidence through composure and authority."], [31.95, 35.95, "Her executive presence steadied the room during the crisis briefing."], [36.55, 40.03, "Your turn. Say: Executive presence."], [42.87, 44.34, "Executive presence."], [45.08, 46.47, "Concise messaging."], [47.48, 51.84, "Concise messaging means communicating key points in as few words as possible."], [52.45, 55.61, "Concise messaging kept the board's attention for the full hour."], [56.22, 59.37, "Your turn. Say: Concise messaging."], [62.23, 63.76, "Concise messaging."], [64.52, 65.63, "Stakeholder."], [66.65, 71.61, "Stakeholder means a person or group with an interest in an organisation's decisions."], [72.22, 75.37, "Every stakeholder received a tailored summary of the merger."], [75.95, 79.03, "Your turn. Say: Stakeholder."], [81.87, 82.84, "Stakeholder."], [83.58, 84.46, "Briefing."], [85.45, 89.42, "Briefing means a short meeting or document giving essential information."], [90.02, 93.22, "The minister requested a two-page briefing before the summit."], [93.82, 96.07, "Your turn. Say: Briefing."], [98.93, 99.97, "Briefing."], [100.72, 101.66, "Persuasion."], [102.65, 106.43, "Persuasion means the act of convincing others to accept an idea."], [107.02, 110.19, "Persuasion without evidence quickly erodes credibility."], [110.78, 113.3, "Your turn. Say: Persuasion."], [116.13, 117.15, "Persuasion."], [117.88, 118.83, "Clarity."], [119.82, 123.08, "Clarity means the quality of being easy to understand."], [123.68, 126.66, "Clarity matters more than eloquence in a crisis."], [127.25, 129.6, "Your turn. Say: Clarity."], [132.47, 133.4, "Clarity."], [134.15, 135.13, "Authority."], [136.12, 140.04, "Authority means the power to command respect and influence decisions."], [140.65, 143.23, "Authority comes from competence, not volume."], [143.82, 146.05, "Your turn. Say: Authority."], [148.9, 149.82, "Authority."], [150.58, 151.74, "Influence."], [152.75, 156.69, "Influence means the capacity to shape others' thinking or behaviour."], [157.28, 160.4, "Quiet influence often outlasts loud command."], [160.98, 163.57, "Your turn. Say: Influence."], [166.4, 167.48, "Influence."], [168.27, 171.88, "Part two: dialogue. Let's listen to a conversation."], [172.72, 178.14, "Visal, the new CEO speaks with total certainty, yet staff seem to resent her. Why?"], [179.25, 187.79, "Because her confidence isn't balanced with openness. Certainty without curiosity is often perceived as arrogance."], [188.88, 190.78, "But shouldn't leaders project strength?"], [191.88, 202.19, "Yes, but strength is most credible when it's tempered by humility. Admitting what you don't know actually reinforces trust in what you do know."], [203.28, 205.13, "So what would you advise her?"], [206.22, 214.27, "Pair every decisive message with a genuine question. Directness balanced with respect sounds authoritative rather than domineering."], [215.43, 217.06, "Part three: grammar."], [217.92, 221.87, "Grammar focus: Balance and contrast structures (balanced with)."], [222.17, 223.34, "Look at the pattern."], [224.05, 227.49, "Authority is balanced with clarity in strong communication."], [228.38, 231.1, "Her confidence is tempered by genuine humility."], [232.02, 234.92, "Directness balanced with respect sounds authoritative."], [235.87, 246.6, "'Balanced with', 'tempered by' and 'offset by' signal that one quality limits or completes another. They can be reduced to participle phrases: 'Directness balanced with respect sounds authoritative.'"], [247.35, 250.94, "Be careful! Don't say: Authority is balanced to clarity."], [252.9, 255.46, "Say: Authority is balanced with clarity."], [255.76, 257.22, "Balance X with Y."], [258.03, 260.59, "Part four: reading. Read and listen."], [261.4, 262.85, "Speaking With Authority."], [263.15, 270.1, "Executive communication differs from everyday communication in that every word may affect markets, morale and reputations."], [271.1, 278.0, "Research on leadership suggests that audiences grant authority to speakers whose confidence is balanced with visible competence and respect."], [279.0, 285.92, "Concise messaging is essential, since senior stakeholders typically decide within minutes whether a briefing merits further attention."], [286.93, 293.3, "Yet brevity must be tempered by context, because oversimplification can be as damaging as verbosity."], [294.3, 301.09, "The most influential executives combine clarity, candour and calm, projecting authority without resorting to arrogance."], [302.2, 306.21, "Part five: quiz. Five questions. Are you ready?"], [307.05, 309.36, "Her ambition is balanced blank patience."], [309.66, 312.65, "A, to. B, with. C, for."], [316.2, 317.82, "The answer is B: with."], [318.95, 322.25, "A short document giving essential information is a blank."], [322.55, 326.31, "A, briefing. B, stakeholder. C, clarity."], [329.87, 331.76, "The answer is A: briefing."], [332.92, 335.66, "The capacity to shape others' thinking is blank."], [335.96, 340.54, "A, concise messaging. B, persuasion. C, influence."], [344.1, 346.52, "The answer is C: influence."], [347.68, 349.5, "Choose the correct sentence."], [349.8, 356.92, "A, His certainty was tempered with by doubt.. B, His certainty was tempered by doubt.. C, His certainty tempered to doubt.."], [360.47, 363.74, "The answer is B: His certainty was tempered by doubt.."], [364.88, 369.2, "According to the reading, authority is granted to speakers whose confidence is…"], [369.5, 375.12, "A, balanced with competence and respect. B, louder than others'. C, never questioned."], [378.67, 382.06, "The answer is A: balanced with competence and respect."], [383.27, 386.52, "Part six: speaking. It's your turn to talk."], [387.38, 390.88, "What makes communication feel authoritative without being arrogant?"], [407.68, 409.22, "Now listen to Visal."], [409.52, 444.76, "Communication feels authoritative when confidence is balanced with genuine respect for the audience. An authoritative speaker states conclusions clearly, supports them with evidence and accepts responsibility, yet remains open to questions. Arrogance appears when certainty is not tempered by humility, for instance when a leader dismisses concerns instead of addressing them. Paradoxically, admitting the limits of one's knowledge often increases credibility, because listeners trust honesty more than performance."], [445.06, 447.03, "Excellent answer, Visal!"], [447.92, 453.26, "Great work! Now you can use eight new words and balance and contrast structures (balanced with)."], [453.56, 458.47, "Today's value is leadership. Lead fairly, listen to others and set a good example."], [458.77, 461.15, "See you in Unit ten. Goodbye!"], [461.45, 464.49, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C2B1-Unit10-Crisis-Management": [[0.35, 4.76, "Hello, everyone! I'm Ms. Emma. Welcome to Online C two, Book one."], [5.06, 8.73, "Hi! I'm Visal. Let's learn together!"], [9.04, 16.03, "Unit ten: Crisis Management. Today you will contrast setbacks and outcomes with even after / despite clauses."], [16.33, 18.96, "Here is our lesson map. Let's start!"], [19.9, 23.16, "Part one: words. You will learn eight new words."], [24.02, 25.12, "Crisis."], [26.12, 29.48, "Crisis means a time of intense difficulty or danger."], [30.08, 33.86, "The factory fire became a reputational crisis within hours."], [34.45, 37.06, "Your turn. Say: Crisis."], [39.9, 40.88, "Crisis."], [41.62, 43.12, "Contingency plan."], [44.12, 48.05, "Contingency plan means a plan prepared for a possible emergency."], [48.65, 52.58, "The airline's contingency plan rerouted passengers overnight."], [53.18, 56.16, "Your turn. Say: Contingency plan."], [59.0, 60.44, "Contingency plan."], [61.18, 62.66, "Response protocol."], [63.65, 68.08, "Response protocol means a predefined sequence of actions during an emergency."], [68.68, 71.9, "The hospital's response protocol activated within minutes."], [72.52, 75.6, "Your turn. Say: Response protocol."], [78.43, 79.86, "Response protocol."], [80.62, 81.97, "Transparency."], [82.95, 87.22, "Transparency means openness about facts, even unwelcome ones."], [87.82, 91.03, "Transparency about the error prevented rumours from spreading."], [91.65, 94.52, "Your turn. Say: Transparency."], [97.37, 98.77, "Transparency."], [99.52, 100.77, "Damage control."], [101.78, 105.36, "Damage control means actions taken to limit harm after a problem."], [105.95, 108.77, "Damage control began before the press conference."], [109.38, 112.26, "Your turn. Say: Damage control."], [115.1, 116.48, "Damage control."], [117.25, 118.81, "Stakeholder trust."], [119.82, 124.57, "Stakeholder trust means the confidence that interested groups place in an organisation."], [125.18, 127.46, "Stakeholder trust took years to rebuild."], [128.05, 131.03, "Your turn. Say: Stakeholder trust."], [133.87, 135.08, "Stakeholder trust."], [135.82, 136.94, "Escalation."], [137.95, 141.75, "Escalation means a rapid increase in seriousness or intensity."], [142.35, 145.93, "Silence from management led to an escalation of protests."], [146.52, 149.11, "Your turn. Say: Escalation."], [151.97, 153.2, "Escalation."], [153.95, 154.95, "Recovery."], [155.95, 159.56, "Recovery means the process of returning to a normal or better state."], [160.15, 162.95, "The brand's recovery depended on visible reforms."], [163.55, 166.2, "Your turn. Say: Recovery."], [169.07, 170.03, "Recovery."], [170.83, 174.63, "Part two: dialogue. Let's listen to a conversation."], [175.48, 181.85, "Visal, a food company discovered contamination in one batch of fish sauce. Should it stay silent to avoid panic?"], [182.95, 191.76, "Absolutely not. Even after a contamination scare, trust can be preserved if the company acts quickly and openly."], [192.85, 194.69, "But a recall costs millions."], [195.78, 209.01, "So does silence, eventually. Despite the short-term cost, a voluntary recall signals integrity, whereas concealment risks escalation if journalists discover the truth."], [210.12, 212.03, "What should the first statement say?"], [213.15, 223.4, "What happened, what's being done and how customers can protect themselves. Even after mistakes, people forgive honesty far more readily than evasion."], [224.53, 226.07, "Part three: grammar."], [226.92, 230.16, "Grammar focus: Even after and despite clauses."], [230.46, 231.66, "Look at the pattern."], [232.35, 235.58, "Trust can be preserved even after a difficult crisis."], [236.48, 240.4, "Despite the short-term cost, a recall signals integrity."], [241.28, 244.98, "Even after admitting the error, the company kept its customers."], [245.93, 255.37, "'Even after' stresses that a result holds despite a later stage of difficulty; 'despite' (no 'of') takes a noun or -ing form. Do not write 'despite of' or 'despite the company lost'."], [256.12, 260.25, "Be careful! Don't say: Even after the crisis happened it."], [262.2, 265.12, "Say: Even after the crisis, trust remained."], [265.42, 267.44, "Even after + noun / clause."], [268.23, 271.15, "Part four: reading. Read and listen."], [271.97, 273.15, "The Golden Hour."], [273.45, 282.0, "Crisis-management specialists often refer to a 'golden hour', the brief period in which an organisation's first response shapes public perception."], [283.0, 290.71, "Even after serious failures, companies that communicate promptly and transparently tend to recover faster than those that delay or deny."], [291.7, 299.59, "The classic example is Johnson & Johnson's 1982 Tylenol recall, which, despite enormous cost, ultimately strengthened the brand."], [300.6, 307.16, "Effective response protocols assign clear roles in advance, preventing confusion and contradictory statements."], [308.17, 314.72, "Recovery, however, requires more than words: stakeholders must see concrete reforms that make a repeat of the crisis unlikely."], [315.83, 319.6, "Part five: quiz. Five questions. Are you ready?"], [320.45, 323.29, "blank the delay, the shipment arrived intact."], [323.58, 327.33, "A, Despite. B, Despite of. C, Even though."], [330.87, 332.97, "The answer is A: Despite."], [334.12, 337.44, "A plan prepared for a possible emergency is a blank."], [337.74, 342.44, "A, contingency plan. B, recovery. C, escalation."], [346.0, 348.51, "The answer is A: contingency plan."], [349.65, 352.07, "A rapid increase in seriousness is blank."], [352.37, 357.02, "A, damage control. B, transparency. C, escalation."], [360.57, 362.89, "The answer is C: escalation."], [364.05, 365.68, "Choose the correct sentence."], [365.98, 375.04, "A, Despite the company lost money, it recovered.. B, Despite losing money, the company recovered.. C, Despite of losses, the company recovered.."], [378.6, 382.51, "The answer is B: Despite losing money, the company recovered.."], [383.65, 386.75, "According to the reading, the Tylenol recall ultimately…"], [387.05, 392.62, "A, destroyed the brand. B, strengthened the brand. C, was hidden from the public."], [396.17, 398.89, "The answer is B: strengthened the brand."], [400.1, 403.41, "Part six: speaking. It's your turn to talk."], [404.25, 407.36, "Why is transparency important during a crisis?"], [424.15, 425.56, "Now listen to Visal."], [425.86, 462.8, "Transparency is important because, during a crisis, information gaps are quickly filled by rumour and suspicion. When an organisation explains what happened, what it is doing and what people should do, it regains a measure of control over the narrative. Even after serious mistakes, stakeholders tend to forgive candour, whereas concealment, once exposed, transforms an accident into a scandal. For example, a prompt product recall may be costly, but it demonstrates that public safety outweighs profit."], [463.1, 464.9, "Excellent answer, Visal!"], [465.82, 471.2, "Great work! Now you can use eight new words and even after and despite clauses."], [471.5, 476.22, "Today's value is resilience. Prepare for setbacks, and recover from them with strength."], [476.52, 478.93, "See you in Unit eleven. Goodbye!"], [479.23, 482.39, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C2B1-Unit11-Strategic-Planning": [[0.35, 5.33, "Hello, everyone! I'm Ms. Emma. Welcome to Online C two, Book one."], [5.63, 9.01, "Hi! I'm Visal. Let's learn together!"], [9.31, 16.04, "Unit eleven: Strategic Planning. Today you will articulate plans and intentions with future forms (will / going to)."], [16.34, 19.2, "Here is our lesson map. Let's start!"], [20.17, 23.43, "Part one: words. You will learn eight new words."], [24.28, 25.64, "Strategic planning."], [26.65, 31.52, "Strategic planning means defining long-term direction and how resources will achieve it."], [32.12, 35.49, "Strategic planning aligned the ministry's budget with its goals."], [36.08, 38.97, "Your turn. Say: Strategic planning."], [41.83, 43.21, "Strategic planning."], [43.95, 44.75, "Vision."], [45.75, 49.15, "Vision means an inspiring statement of a desired future."], [49.75, 53.21, "The university's vision is to become a regional research leader."], [53.82, 56.52, "Your turn. Say: Vision."], [59.37, 60.15, "Vision."], [60.88, 61.95, "Objective."], [62.95, 65.61, "Objective means a specific, measurable aim."], [66.22, 71.08, "Our first objective is to train 500 teachers by 2028."], [71.68, 74.63, "Your turn. Say: Objective."], [77.47, 78.44, "Objective."], [79.18, 80.66, "SWOT analysis."], [81.65, 86.69, "SWOT analysis means an assessment of strengths, weaknesses, opportunities and threats."], [87.28, 91.02, "The SWOT analysis revealed an overlooked opportunity in tourism."], [91.62, 94.78, "Your turn. Say: SWOT analysis."], [97.63, 99.16, "SWOT analysis."], [99.92, 100.94, "Milestone."], [101.95, 105.77, "Milestone means a significant checkpoint in progress toward a goal."], [106.38, 109.66, "Opening the first clinic was the project's key milestone."], [110.25, 112.52, "Your turn. Say: Milestone."], [115.37, 116.34, "Milestone."], [117.08, 118.54, "Resource allocation."], [119.55, 124.29, "Resource allocation means deciding how money, people and time are distributed."], [124.88, 127.99, "Resource allocation favoured rural schools this year."], [128.58, 131.93, "Your turn. Say: Resource allocation."], [134.77, 136.36, "Resource allocation."], [137.12, 138.51, "Long-term goal."], [139.52, 143.3, "Long-term goal means an aim to be achieved over several years."], [143.92, 147.19, "Our long-term goal is universal access to clean water."], [147.78, 150.66, "Your turn. Say: Long-term goal."], [153.5, 156.41, "Long-term goal."], [157.15, 158.31, "Execution."], [159.32, 162.01, "Execution means the carrying out of a plan."], [162.62, 165.38, "A plan without execution is merely a wish."], [165.98, 168.73, "Your turn. Say: Execution."], [171.57, 172.59, "Execution."], [173.4, 177.33, "Part two: dialogue. Let's listen to a conversation."], [178.18, 184.37, "Visal, the provincial hospital has a beautiful five-year plan, but nothing seems to change. Why?"], [185.45, 195.69, "Because the plan states hopes rather than commitments. 'We hope to improve care' is vague; 'We will open two new wards by 2027' is accountable."], [196.78, 198.68, "So the language itself matters?"], [199.78, 210.8, "Very much. 'Will' signals decisions and promises, while 'going to' signals plans already in motion: 'We're going to recruit ten nurses next quarter.'"], [211.88, 213.66, "And how do they keep on track?"], [214.75, 224.22, "With milestones. Each quarter, they'll measure progress, and if they're behind, they will reallocate resources toward the weakest areas."], [225.37, 226.81, "Part three: grammar."], [227.65, 231.6, "Grammar focus: Future planning language (will, going to)."], [231.9, 233.13, "Look at the pattern."], [233.82, 236.55, "We will allocate resources toward this milestone."], [237.45, 240.51, "The hospital is going to recruit ten nurses next quarter."], [241.42, 244.88, "Each quarter, we will measure progress against our objectives."], [245.83, 257.88, "In strategic documents, 'will' expresses firm commitments and predictions; 'be going to' presents plans already decided or evidence-based predictions. Avoid vague verbs like 'hope to' or 'try to' when you mean a commitment."], [258.62, 262.6, "Be careful! Don't say: We going to allocate more funds."], [264.57, 267.33, "Say: We are going to allocate more funds."], [267.63, 268.98, "Be + going to."], [269.77, 272.35, "Part four: reading. Read and listen."], [273.13, 274.81, "From Vision to Execution."], [275.11, 281.47, "Strategic planning translates an organisation's vision into concrete objectives, priorities and timelines."], [282.47, 290.82, "A typical process begins with a SWOT analysis, which clarifies internal strengths and weaknesses as well as external opportunities and threats."], [291.83, 299.41, "Effective plans then specify who will do what, by when, and with which resources, rather than relying on general aspirations."], [300.4, 307.07, "Milestones allow leaders to monitor progress and adjust resource allocation before small delays become major failures."], [308.07, 316.59, "Studies repeatedly show, however, that most strategies fail in execution rather than in design, so communication and accountability are critical."], [317.7, 322.07, "Part five: quiz. Five questions. Are you ready?"], [322.92, 325.73, "Look at those clouds! It blank rain."], [326.03, 329.82, "A, will. B, is going to. C, going to."], [333.37, 335.51, "The answer is B: is going to."], [336.65, 341.15, "An assessment of strengths, weaknesses, opportunities and threats is a blank."], [341.45, 345.45, "A, SWOT analysis. B, milestone. C, vision."], [349.0, 351.62, "The answer is A: SWOT analysis."], [352.75, 356.15, "Deciding how money, people and time are distributed is blank."], [356.45, 361.1, "A, execution. B, objective. C, resource allocation."], [364.63, 367.54, "The answer is C: resource allocation."], [368.68, 370.79, "Choose the most accountable sentence."], [371.09, 380.35, "A, We hope to maybe improve results.. B, We will raise pass rates by 10% by 2027.. C, We try improving results sometime.."], [383.9, 389.43, "The answer is B: We will raise pass rates by 10% by 2027.."], [390.58, 393.44, "According to the reading, most strategies fail in…"], [393.74, 398.1, "A, design. B, execution. C, SWOT analysis."], [401.67, 404.05, "The answer is B: execution."], [405.23, 408.64, "Part six: speaking. It's your turn to talk."], [409.48, 413.9, "What is one long-term goal you have, and what milestone would show progress?"], [430.68, 432.15, "Now listen to Visal."], [432.45, 467.51, "One of my long-term goals is to become a qualified translator between Khmer and English, specialising in legal documents. I am going to begin by completing an advanced certificate next year, which will be my first milestone. After that, I will gain practical experience by volunteering for an NGO that needs translations. A second milestone would be passing a professional accreditation exam within three years. Measuring progress this way will keep me accountable and motivated."], [467.81, 469.67, "Excellent answer, Visal!"], [470.58, 475.85, "Great work! Now you can use eight new words and future planning language (will, going to)."], [476.15, 481.17, "Today's value is strategic thinking. Think ahead, and choose your path with purpose."], [481.47, 484.17, "See you in Unit twelve. Goodbye!"], [484.47, 487.93, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C2B1-Unit12-Leadership-Theory": [[0.35, 4.82, "Hello, everyone! I'm Ms. Emma. Welcome to Online C two, Book one."], [5.12, 8.96, "Hi! I'm Visal. Let's learn together!"], [9.26, 14.87, "Unit twelve: Leadership Theory. Today you will distinguish concepts precisely with whereas / while."], [15.17, 17.9, "Here is our lesson map. Let's start!"], [18.87, 22.17, "Part one: words. You will learn eight new words."], [23.02, 24.39, "Leadership style."], [25.38, 29.57, "Leadership style means a characteristic way of directing and motivating people."], [30.15, 33.07, "Her leadership style is collaborative yet decisive."], [33.68, 36.89, "Your turn. Say: Leadership style."], [39.73, 41.26, "Leadership style."], [42.02, 43.35, "Transformational."], [44.35, 48.93, "Transformational means inspiring followers to exceed their own expectations."], [49.52, 53.07, "Transformational leaders connect daily work to a larger purpose."], [53.68, 56.34, "Your turn. Say: Transformational."], [59.2, 60.69, "Transformational."], [61.45, 62.57, "Transactional."], [63.58, 67.3, "Transactional means based on exchanging rewards for performance."], [67.92, 71.43, "Transactional leadership relies on targets and bonuses."], [72.02, 74.38, "Your turn. Say: Transactional."], [77.23, 78.36, "Transactional."], [79.12, 80.57, "Servant leadership."], [81.58, 86.32, "Servant leadership means leading by prioritising the growth and wellbeing of others."], [86.92, 90.07, "Servant leadership is common in successful NGOs."], [90.65, 93.86, "Your turn. Say: Servant leadership."], [96.7, 97.98, "Servant leadership."], [98.72, 100.01, "Vision-casting."], [101.02, 104.94, "Vision-casting means communicating a compelling picture of the future."], [105.55, 108.84, "Vision-casting helped staff see why the reform mattered."], [109.45, 112.36, "Your turn. Say: Vision-casting."], [115.2, 116.53, "Vision-casting."], [117.28, 118.35, "Empowerment."], [119.35, 122.99, "Empowerment means giving people the authority and confidence to act."], [123.58, 127.28, "Empowerment of front-line staff improved customer service."], [127.88, 130.87, "Your turn. Say: Empowerment."], [133.73, 134.83, "Empowerment."], [135.58, 136.84, "Accountability."], [137.85, 141.81, "Accountability means responsibility for one's actions and results."], [142.42, 146.1, "Accountability ensures that empowerment does not become chaos."], [146.68, 149.87, "Your turn. Say: Accountability."], [152.73, 153.88, "Accountability."], [154.65, 155.76, "Influence."], [156.75, 160.43, "Influence means the ability to affect others without formal power."], [161.02, 164.43, "Great leaders exert influence without relying on titles."], [165.02, 167.72, "Your turn. Say: Influence."], [170.57, 171.81, "Influence."], [172.6, 176.25, "Part two: dialogue. Let's listen to a conversation."], [177.12, 182.85, "Visal, my manager rewards us with bonuses for meeting targets. Isn't that good leadership?"], [183.95, 195.94, "It's effective transactional leadership. Transactional leaders exchange rewards for results, whereas transformational leaders inspire people to care about the mission itself."], [197.05, 198.13, "Which is better?"], [199.22, 210.36, "It depends on the context. While transactional methods work well for routine tasks, transformational leadership tends to drive innovation and loyalty."], [211.45, 213.0, "And servant leadership?"], [214.08, 223.0, "That's different again. Whereas other models focus on organisational goals, servant leadership begins with the growth of the people themselves."], [224.17, 225.62, "Part three: grammar."], [226.48, 230.84, "Grammar focus: Distinguishing between concepts (whereas and while)."], [231.14, 232.36, "Look at the pattern."], [233.05, 238.49, "Transformational leaders inspire, whereas transactional leaders exchange rewards."], [239.38, 244.59, "While transactional methods suit routine tasks, transformational ones drive innovation."], [245.48, 249.53, "Servant leaders begin with people, whereas others begin with goals."], [250.47, 262.68, "'Whereas' and 'while' contrast two parallel facts; they need two complete clauses. 'While' can also mean 'at the same time', so 'whereas' is clearer in formal contrasts. Use a comma before 'whereas' in mid-sentence."], [263.42, 268.16, "Be careful! Don't say: Whereas X inspire, Y exchanges."], [270.1, 273.49, "Say: Whereas X inspires, Y exchanges."], [273.79, 275.63, "Keep subject–verb agreement."], [276.43, 279.03, "Part four: reading. Read and listen."], [279.83, 281.1, "Beyond the Great Man."], [281.4, 288.38, "Early leadership theory assumed that leaders were born, not made, possessing innate traits that distinguished them from followers."], [289.37, 297.52, "Later research shifted attention to behaviour, whereas contemporary theories emphasise the relationship between leaders, followers and context."], [298.53, 308.89, "James MacGregor Burns contrasted transactional leadership, which exchanges rewards for compliance, with transformational leadership, which elevates followers' motivation and values."], [309.9, 318.78, "Servant leadership, meanwhile, inverts the traditional hierarchy, while situational models argue that no single style suits every circumstance."], [319.8, 325.41, "The most effective leaders therefore adapt their approach, while remaining consistent in their underlying values."], [326.5, 330.56, "Part five: quiz. Five questions. Are you ready?"], [331.42, 333.92, "Cats are independent, blank dogs are loyal."], [334.22, 338.97, "A, whereas. B, despite. C, because."], [342.53, 344.72, "The answer is A: whereas."], [345.88, 349.57, "Leadership based on exchanging rewards for performance is blank."], [349.87, 353.87, "A, transformational. B, transactional. C, servant."], [357.43, 360.13, "The answer is B: transactional."], [361.28, 364.35, "Giving people authority and confidence to act is blank."], [364.65, 368.83, "A, vision-casting. B, accountability. C, empowerment."], [372.37, 374.63, "The answer is C: empowerment."], [375.78, 377.42, "Choose the correct sentence."], [377.72, 387.32, "A, Whereas the first inspires, the second rewards.. B, Whereas the first inspires, but the second rewards.. C, Whereas inspiring, rewards the second.."], [390.87, 394.77, "The answer is A: Whereas the first inspires, the second rewards.."], [395.92, 399.69, "According to the reading, early leadership theory assumed leaders were…"], [399.99, 405.05, "A, made through training. B, born with innate traits. C, chosen by followers."], [408.6, 411.52, "The answer is B: born with innate traits."], [412.73, 415.87, "Part six: speaking. It's your turn to talk."], [416.72, 420.27, "What leadership style do you think is most effective, and why?"], [437.08, 438.55, "Now listen to Visal."], [438.85, 471.53, "I believe transformational leadership is generally the most effective, particularly in organisations that must innovate. Whereas transactional leadership secures compliance through rewards, transformational leadership inspires people to contribute ideas and effort beyond what is required. However, while an emergency room needs directive leadership, a research team benefits from empowerment. Therefore, the best leaders combine a transformational vision with situational flexibility."], [471.83, 473.75, "Excellent answer, Visal!"], [474.65, 479.98, "Great work! Now you can use eight new words and distinguishing between concepts (whereas and while)."], [480.28, 485.19, "Today's value is leadership. Lead fairly, listen to others and set a good example."], [485.49, 488.3, "See you in Unit thirteen. Goodbye!"], [488.6, 491.38, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C2B1-Unit13-Organizational-Behavior": [[0.35, 5.08, "Hello, everyone! I'm Ms. Emma. Welcome to Online C two, Book one."], [5.38, 8.94, "Hi! I'm Visal. Let's learn together!"], [9.24, 16.93, "Unit thirteen: Organizational Behavior. Today you will describe causal influences with influences / shapes / affects."], [17.23, 19.75, "Here is our lesson map. Let's start!"], [20.7, 23.72, "Part one: words. You will learn eight new words."], [24.58, 26.36, "Organizational culture."], [27.35, 33.09, "Organizational culture means the shared values, beliefs and practices of an organisation."], [33.68, 37.56, "A blame-free organizational culture encourages honest reporting."], [38.15, 41.65, "Your turn. Say: Organizational culture."], [44.5, 46.3, "Organizational culture."], [47.05, 48.23, "Motivation."], [49.22, 53.25, "Motivation means the forces that drive people's effort and persistence."], [53.85, 56.69, "Intrinsic motivation outlasts any bonus."], [57.28, 59.72, "Your turn. Say: Motivation."], [62.57, 63.66, "Motivation."], [64.42, 65.77, "Group dynamics."], [66.75, 70.13, "Group dynamics means the patterns of interaction within a team."], [70.72, 73.67, "Group dynamics changed when the new manager arrived."], [74.28, 77.39, "Your turn. Say: Group dynamics."], [80.23, 81.86, "Group dynamics."], [82.62, 83.63, "Hierarchy."], [84.62, 87.84, "Hierarchy means a ranking of authority from top to bottom."], [88.45, 91.98, "A rigid hierarchy discouraged junior staff from speaking up."], [92.58, 95.49, "Your turn. Say: Hierarchy."], [98.33, 99.44, "Hierarchy."], [100.18, 101.08, "Norms."], [102.08, 105.7, "Norms means unwritten rules about acceptable behaviour."], [106.28, 109.37, "Team norms included replying to messages within a day."], [109.98, 112.12, "Your turn. Say: Norms."], [114.97, 116.11, "Norms."], [116.85, 117.84, "Cohesion."], [118.85, 122.08, "Cohesion means the degree to which group members are united."], [122.68, 125.2, "Shared challenges increased the team's cohesion."], [125.82, 128.39, "Your turn. Say: Cohesion."], [131.23, 132.09, "Cohesion."], [132.85, 133.89, "Conflict."], [134.88, 137.79, "Conflict means disagreement or tension between people."], [138.38, 141.37, "Managed well, conflict can generate better ideas."], [141.98, 144.66, "Your turn. Say: Conflict."], [147.5, 148.56, "Conflict."], [149.32, 150.42, "Productivity."], [151.42, 155.41, "Productivity means output relative to the effort or resources used."], [156.02, 159.17, "Recognition significantly influenced productivity."], [159.75, 162.67, "Your turn. Say: Productivity."], [165.53, 166.57, "Productivity."], [167.37, 171.09, "Part two: dialogue. Let's listen to a conversation."], [171.95, 178.05, "Visal, two branches of the same bank have identical salaries and systems, but one performs far better. Why?"], [179.15, 189.75, "Culture significantly shapes performance. In the stronger branch, the manager encourages questions, which affects how staff solve problems."], [190.85, 193.84, "Surely pay influences motivation more than culture?"], [194.95, 205.48, "Pay affects whether people stay, but research suggests that recognition and autonomy influence daily effort far more strongly."], [206.58, 208.94, "Can a manager change a culture quickly?"], [210.05, 220.55, "Not quickly, but consistently. Leaders' behaviour shapes norms, and norms gradually influence what everyone considers normal."], [221.7, 223.41, "Part three: grammar."], [224.25, 228.91, "Grammar focus: Correlation language (influences, shapes, affects)."], [229.21, 230.45, "Look at the pattern."], [231.15, 234.07, "Culture significantly shapes employee motivation."], [234.98, 237.85, "Recognition strongly influences daily effort."], [238.75, 241.76, "Leaders' behaviour gradually affects team norms."], [242.7, 250.17, "These verbs take a direct object (affects motivation, not 'affects on'), but the nouns take 'on': an influence on, an effect on."], [250.92, 254.47, "Be careful! Don't say: Culture shapes on motivation."], [256.43, 258.89, "Say: Culture shapes motivation."], [259.19, 261.36, "Shape / affect take a direct object."], [262.17, 264.66, "Part four: reading. Read and listen."], [265.47, 268.2, "The Hawthorne Effect and Beyond."], [268.5, 279.37, "Organizational behaviour emerged partly from the Hawthorne studies of the 1920s, which found that workers' productivity was influenced by attention rather than lighting."], [280.37, 287.8, "Since then, researchers have shown that culture, norms and group dynamics shape performance as powerfully as formal structures."], [288.8, 296.11, "Self-determination theory argues that autonomy, competence and relatedness affect intrinsic motivation more strongly than external rewards."], [297.1, 306.66, "Hierarchy also matters: in steep hierarchies, junior employees may hesitate to report errors, with serious consequences in fields such as aviation and medicine."], [307.67, 313.44, "Understanding these influences enables leaders to design environments in which people choose to perform well."], [314.53, 318.44, "Part five: quiz. Five questions. Are you ready?"], [319.28, 321.35, "Stress strongly blank concentration."], [321.65, 325.55, "A, affects on. B, affects. C, effects."], [329.1, 331.22, "The answer is B: affects."], [332.35, 335.29, "Unwritten rules about acceptable behaviour are blank."], [335.59, 339.27, "A, norms. B, hierarchy. C, cohesion."], [342.8, 344.75, "The answer is A: norms."], [345.92, 348.73, "The degree to which group members are united is blank."], [349.03, 353.13, "A, conflict. B, productivity. C, cohesion."], [356.7, 358.9, "The answer is C: cohesion."], [360.05, 361.85, "Choose the correct sentence."], [362.15, 370.44, "A, Culture has a strong effect on motivation.. B, Culture has a strong affect on motivation.. C, Culture effects strongly on motivation.."], [374.0, 377.81, "The answer is A: Culture has a strong effect on motivation.."], [378.95, 383.88, "According to the reading, the Hawthorne studies found productivity was influenced by…"], [384.18, 387.68, "A, lighting. B, attention. C, salary."], [391.23, 393.16, "The answer is B: attention."], [394.37, 397.7, "Part six: speaking. It's your turn to talk."], [398.55, 402.28, "How does organizational culture influence employee motivation?"], [419.08, 420.5, "Now listen to Visal."], [420.8, 457.35, "Organizational culture influences motivation by shaping what employees believe is valued, rewarded and safe. In a culture of trust, people take initiative because mistakes are treated as learning opportunities. By contrast, a culture of blame affects motivation negatively, since staff focus on protecting themselves rather than improving results. For example, a hospital where nurses can question doctors without fear tends to have fewer errors and more engaged staff. Culture, therefore, shapes effort every day."], [457.65, 459.43, "Excellent answer, Visal!"], [460.32, 466.51, "Great work! Now you can use eight new words and correlation language (influences, shapes, affects)."], [466.81, 471.96, "Today's value is collaboration. Work together, and share both the effort and the success."], [472.26, 474.83, "See you in Unit fourteen. Goodbye!"], [475.13, 477.68, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C2B1-Unit14-Change-Management": [[0.35, 5.46, "Hello, everyone! I'm Ms. Emma. Welcome to Online C two, Book one."], [5.75, 9.14, "Hi! I'm Visal. Let's learn together!"], [9.44, 15.44, "Unit fourteen: Change Management. Today you will propose tactful solutions with could + suggestion."], [15.74, 18.4, "Here is our lesson map. Let's start!"], [19.37, 22.51, "Part one: words. You will learn eight new words."], [23.35, 24.61, "Change management."], [25.62, 29.94, "Change management means the structured approach to transitioning people through change."], [30.55, 33.63, "Change management was budgeted from the start of the merger."], [34.22, 37.3, "Your turn. Say: Change management."], [40.13, 41.9, "Change management."], [42.65, 44.17, "Resistance to change."], [45.18, 48.58, "Resistance to change means opposition to new ways of working."], [49.18, 52.92, "Resistance to change often stems from fear of losing competence."], [53.52, 56.83, "Your turn. Say: Resistance to change."], [59.67, 61.28, "Resistance to change."], [62.02, 63.01, "Buy-in."], [64.02, 67.38, "Buy-in means genuine agreement and commitment from those affected."], [67.98, 70.55, "Without buy-in from teachers, the reform stalled."], [71.15, 73.48, "Your turn. Say: Buy-in."], [76.33, 77.43, "Buy-in."], [78.18, 79.53, "Transition plan."], [80.52, 84.71, "Transition plan means a schedule for moving from the old system to the new."], [85.32, 88.79, "The transition plan allowed six months of parallel systems."], [89.38, 92.35, "Your turn. Say: Transition plan."], [95.2, 96.61, "Transition plan."], [97.35, 98.95, "Communication strategy."], [99.95, 104.85, "Communication strategy means a planned approach to informing and engaging people."], [105.45, 108.78, "A two-way communication strategy reduced rumours."], [109.38, 112.21, "Your turn. Say: Communication strategy."], [115.07, 116.96, "Communication strategy."], [117.72, 118.79, "Adoption."], [119.78, 123.06, "Adoption means the uptake and regular use of something new."], [123.65, 126.74, "Adoption of the app reached 80% within a year."], [127.35, 130.3, "Your turn. Say: Adoption."], [133.17, 134.18, "Adoption."], [134.92, 136.27, "Sustainability."], [137.25, 141.79, "Sustainability means the capacity of a change to last over time."], [142.38, 145.41, "Sustainability depends on embedding new habits."], [146.02, 148.88, "Your turn. Say: Sustainability."], [151.73, 153.06, "Sustainability."], [153.82, 154.74, "Momentum."], [155.75, 159.33, "Momentum means the driving force gained as progress accumulates."], [159.92, 162.94, "Early successes built momentum for wider reform."], [163.55, 166.0, "Your turn. Say: Momentum."], [168.87, 169.79, "Momentum."], [170.6, 174.47, "Part two: dialogue. Let's listen to a conversation."], [175.32, 182.18, "Visal, the ministry is introducing digital attendance, but many older teachers are refusing to use it. What could help?"], [183.28, 192.0, "A clear communication strategy could reduce resistance. Teachers need to understand why the change matters, not just how to use the app."], [193.08, 194.56, "Wouldn't training be enough?"], [195.65, 206.88, "Training helps, but fear of looking incompetent is often the real barrier. The ministry could pair each older teacher with a younger colleague for support."], [207.98, 209.74, "And if some still refuse?"], [210.85, 220.77, "They could invite respected sceptics to pilot the system first. Once influential colleagues endorse it, momentum usually follows."], [221.93, 223.51, "Part three: grammar."], [224.35, 226.65, "Grammar focus: Could plus suggestion."], [226.95, 228.22, "Look at the pattern."], [228.92, 232.25, "A clear communication strategy could reduce resistance."], [233.15, 236.04, "The ministry could pair each older teacher with a mentor."], [236.95, 239.75, "They could perhaps invite sceptics to pilot the system."], [240.7, 252.47, "'Could + base verb' offers suggestions tactfully, leaving the decision to the listener — far more diplomatic than 'must' or 'should' in consulting. Strengthen with 'could perhaps', 'might also', or 'one option could be to…'."], [253.22, 257.66, "Be careful! Don't say: A strategy could reduces resistance."], [259.6, 262.38, "Say: A strategy could reduce resistance."], [262.68, 264.13, "Could + base verb."], [264.93, 267.69, "Part four: reading. Read and listen."], [268.5, 270.05, "Why Change Fails."], [270.35, 278.74, "Studies frequently claim that around seventy per cent of organisational change initiatives fail to achieve their goals, although the precise figure is debated."], [279.73, 286.84, "Failure rarely results from poor technical design; instead, it usually reflects insufficient attention to people's concerns."], [287.83, 295.65, "John Kotter's model emphasises creating urgency, building a guiding coalition and generating short-term wins that could sustain momentum."], [296.63, 303.56, "Resistance should not be dismissed as stubbornness, since it often contains valuable information about practical obstacles."], [304.57, 311.18, "Leaders could therefore treat resisters as consultants, transforming opposition into ownership and greatly improving adoption."], [312.27, 316.31, "Part five: quiz. Five questions. Are you ready?"], [317.15, 319.53, "A short pilot blank build confidence."], [319.83, 323.31, "A, could. B, could to. C, could be."], [326.87, 328.5, "The answer is A: could."], [329.65, 332.78, "Genuine agreement and commitment from those affected is blank."], [333.08, 336.46, "A, buy-in. B, adoption. C, momentum."], [340.0, 341.89, "The answer is A: buy-in."], [343.05, 346.23, "The driving force gained as progress accumulates is blank."], [346.53, 350.81, "A, resistance. B, transition plan. C, momentum."], [354.37, 356.78, "The answer is C: momentum."], [357.95, 360.25, "Choose the most diplomatic suggestion."], [360.55, 367.57, "A, You must retrain everyone now.. B, You could perhaps start with a small pilot.. C, Retrain everyone or fail.."], [371.13, 374.75, "The answer is B: You could perhaps start with a small pilot.."], [375.88, 378.82, "According to the reading, resistance often contains…"], [379.12, 385.33, "A, valuable information about obstacles. B, nothing useful. C, only stubbornness."], [388.87, 392.54, "The answer is A: valuable information about obstacles."], [393.73, 396.86, "Part six: speaking. It's your turn to talk."], [397.72, 401.6, "What strategy could help reduce resistance to organizational change?"], [418.38, 419.86, "Now listen to Visal."], [420.16, 454.44, "One effective strategy could be to involve employees in designing the change rather than simply announcing it. When people help shape a new system, they understand its purpose and feel a sense of ownership. Leaders could also identify respected colleagues to act as early adopters, since peers are often more persuasive than managers. For example, a school introducing digital grading could let experienced teachers test it first. Their endorsement could build momentum faster than any directive."], [454.74, 456.36, "Excellent answer, Visal!"], [457.25, 461.2, "Great work! Now you can use eight new words and could plus suggestion."], [461.5, 466.47, "Today's value is adaptability. Be ready for rain or sun and change your plans."], [466.76, 469.49, "See you in Unit fifteen. Goodbye!"], [469.79, 472.59, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C2B1-Unit15-Stakeholder-Engagement": [[0.35, 4.98, "Hello, everyone! I'm Ms. Emma. Welcome to Online C two, Book one."], [5.28, 9.16, "Hi! I'm Visal. Let's learn together!"], [9.46, 16.39, "Unit fifteen: Stakeholder Engagement. Today you will describe slow processes with over time / gradually adverbials."], [16.69, 19.26, "Here is our lesson map. Let's start!"], [20.2, 23.32, "Part one: words. You will learn eight new words."], [24.18, 25.16, "Stakeholder."], [26.15, 30.02, "Stakeholder means anyone affected by or able to affect a decision."], [30.62, 33.93, "Fishing communities are key stakeholders in the dam project."], [34.52, 37.19, "Your turn. Say: Stakeholder."], [40.03, 41.28, "Stakeholder."], [42.02, 43.62, "Engagement strategy."], [44.62, 48.88, "Engagement strategy means a plan for involving stakeholders meaningfully."], [49.48, 52.73, "The engagement strategy included village meetings in Khmer."], [53.32, 56.12, "Your turn. Say: Engagement strategy."], [58.97, 60.86, "Engagement strategy."], [61.62, 62.8, "Consultation."], [63.82, 67.58, "Consultation means seeking people's views before making a decision."], [68.18, 71.61, "Genuine consultation happens before decisions are final."], [72.22, 74.65, "Your turn. Say: Consultation."], [77.5, 78.67, "Consultation."], [79.42, 80.43, "Feedback loop."], [81.42, 85.61, "Feedback loop means a cycle in which responses inform further action."], [86.22, 89.81, "A feedback loop showed residents how their input changed the plan."], [90.42, 93.09, "Your turn. Say: Feedback loop."], [95.93, 97.11, "Feedback loop."], [97.85, 99.12, "Transparency."], [100.12, 103.56, "Transparency means openness about decisions and their reasons."], [104.15, 107.22, "Transparency about compensation reduced suspicion."], [107.82, 110.69, "Your turn. Say: Transparency."], [113.53, 114.73, "Transparency."], [115.48, 117.08, "Trust-building."], [118.08, 121.86, "Trust-building means actions that develop mutual confidence over time."], [122.45, 125.51, "Trust-building began with small promises kept."], [126.12, 128.65, "Your turn. Say: Trust-building."], [131.5, 133.23, "Trust-building."], [133.98, 134.87, "Alignment."], [135.88, 139.0, "Alignment means agreement on shared goals and direction."], [139.58, 143.02, "Alignment between the company and villagers took two years."], [143.62, 146.2, "Your turn. Say: Alignment."], [149.03, 149.98, "Alignment."], [150.72, 151.9, "Collaboration."], [152.92, 155.96, "Collaboration means working jointly toward a common aim."], [156.55, 160.28, "Collaboration with local NGOs improved the project's design."], [160.88, 164.22, "Your turn. Say: Collaboration."], [167.07, 168.42, "Collaboration."], [169.2, 172.99, "Part two: dialogue. Let's listen to a conversation."], [173.85, 180.44, "Visal, a mining company held one big meeting with villagers and now claims they 'consulted the community'. Is that enough?"], [181.55, 188.76, "Hardly. Trust builds gradually through consistent engagement, not through a single event that ticks a box."], [189.85, 191.87, "What would genuine engagement look like?"], [192.98, 203.8, "Regular meetings over time, in Khmer, with a feedback loop showing how concerns changed the plan. Otherwise, people stop believing their voices matter."], [204.88, 206.85, "And if the villagers remain opposed?"], [207.95, 218.1, "Then the company must listen seriously. Over time, alignment may emerge, or the company may need to accept that the project is unacceptable."], [219.27, 221.22, "Part three: grammar."], [222.08, 225.28, "Grammar focus: Over time and gradually adverbials."], [225.58, 226.7, "Look at the pattern."], [227.38, 230.07, "Trust builds gradually through consistent engagement."], [230.98, 234.16, "Over time, alignment may emerge through regular dialogue."], [235.05, 238.23, "Credibility grows step by step via promises kept."], [239.2, 250.18, "Adverbials of gradual change can open a sentence for emphasis (Over time, …) or follow the verb (builds gradually). Use the adverb 'gradually', not the adjective 'gradual', to modify a verb."], [250.92, 254.32, "Be careful! Don't say: Trust builds gradual."], [256.27, 258.22, "Say: Trust builds gradually."], [258.52, 260.23, "Use the adverb 'gradually'."], [261.03, 263.88, "Part four: reading. Read and listen."], [264.67, 266.65, "Consultation or Box-Ticking?."], [266.95, 272.88, "Stakeholder engagement has become a standard requirement for major infrastructure and development projects."], [273.87, 279.69, "Yet critics argue that many consultations are performative, held after key decisions have already been made."], [280.7, 288.7, "Genuine engagement involves listening early, explaining trade-offs transparently and demonstrating, over time, how input has shaped outcomes."], [289.7, 296.78, "A well-designed feedback loop is crucial, because people participate only when they believe participation makes a difference."], [297.8, 305.59, "Trust, once damaged, is rebuilt only gradually, so organisations that engage authentically from the outset save both time and reputation."], [306.7, 310.55, "Part five: quiz. Five questions. Are you ready?"], [311.42, 313.82, "The river's level rose blank during the night."], [314.12, 317.72, "A, gradual. B, gradually. C, graduation."], [321.27, 323.7, "The answer is B: gradually."], [324.85, 328.27, "A cycle in which responses inform further action is a blank."], [328.57, 332.92, "A, feedback loop. B, consultation. C, stakeholder."], [336.47, 339.07, "The answer is A: feedback loop."], [340.22, 343.12, "Agreement on shared goals and direction is blank."], [343.42, 348.0, "A, transparency. B, collaboration. C, alignment."], [351.57, 353.53, "The answer is C: alignment."], [354.68, 356.31, "Choose the correct sentence."], [356.61, 365.22, "A, Over time, relationships improved.. B, Over the time, relationships improved gradual.. C, Over time relationships improving.."], [368.77, 372.29, "The answer is A: Over time, relationships improved.."], [373.45, 377.32, "According to the reading, critics say many consultations are…"], [377.62, 381.46, "A, performative. B, too long. C, too early."], [385.0, 387.36, "The answer is A: performative."], [388.57, 391.83, "Part six: speaking. It's your turn to talk."], [392.68, 395.98, "Why is a feedback loop important when engaging stakeholders?"], [412.78, 414.28, "Now listen to Visal."], [414.58, 451.04, "A feedback loop is important because it proves to stakeholders that their participation genuinely influences decisions. Without it, consultation feels like a formality, and people gradually withdraw their trust and cooperation. When an organisation reports back, explaining which suggestions were adopted and why others were not, it demonstrates respect and accountability. For example, a city could show residents how their comments changed a bus route. Over time, such transparency turns sceptics into partners."], [451.34, 453.08, "Excellent answer, Visal!"], [453.98, 458.87, "Great work! Now you can use eight new words and over time and gradually adverbials."], [459.17, 464.67, "Today's value is trust-building. Earn trust slowly, through honest words and kept promises."], [464.97, 467.8, "See you in Unit sixteen. Goodbye!"], [468.1, 470.74, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C2B1-Unit16-Public-Diplomacy": [[0.35, 5.11, "Hello, everyone! I'm Ms. Emma. Welcome to Online C two, Book one."], [5.41, 8.84, "Hi! I'm Visal. Let's learn together!"], [9.14, 16.18, "Unit sixteen: Public Diplomacy. Today you will introduce technical terms with 'sometimes referred to as' / 'known as'."], [16.48, 19.33, "Here is our lesson map. Let's start!"], [20.27, 23.27, "Part one: words. You will learn eight new words."], [24.12, 25.41, "Public diplomacy."], [26.42, 31.31, "Public diplomacy means a government's efforts to communicate directly with foreign publics."], [31.92, 35.99, "Public diplomacy includes scholarships and cultural festivals."], [36.58, 39.76, "Your turn. Say: Public diplomacy."], [42.6, 43.97, "Public diplomacy."], [44.72, 45.81, "Soft power."], [46.82, 51.05, "Soft power means influence based on attraction rather than coercion."], [51.65, 54.42, "Japan's soft power owes much to anime and cuisine."], [55.02, 57.92, "Your turn. Say: Soft power."], [60.77, 61.92, "Soft power."], [62.68, 64.08, "Cultural exchange."], [65.08, 69.52, "Cultural exchange means programmes in which people share cultures across borders."], [70.12, 73.2, "Cultural exchange brought Khmer dancers to Paris."], [73.78, 76.94, "Your turn. Say: Cultural exchange."], [79.8, 81.22, "Cultural exchange."], [81.98, 83.23, "Nation branding."], [84.22, 87.68, "Nation branding means shaping a country's international image."], [88.28, 91.64, "Nation branding promotes Cambodia as 'Kingdom of Wonder'."], [92.25, 95.02, "Your turn. Say: Nation branding."], [97.87, 99.27, "Nation branding."], [100.02, 101.67, "International relations."], [102.68, 106.99, "International relations means relations between states, and the study of them."], [107.58, 110.48, "She studied international relations in Tokyo."], [111.08, 114.39, "Your turn. Say: International relations."], [117.23, 119.3, "International relations."], [120.05, 120.95, "Goodwill."], [121.95, 125.48, "Goodwill means friendly feelings and support between peoples."], [126.08, 128.9, "Disaster aid generated lasting goodwill."], [129.48, 131.6, "Your turn. Say: Goodwill."], [134.47, 135.29, "Goodwill."], [136.05, 137.17, "Perception."], [138.18, 140.98, "Perception means the way a country is seen by others."], [141.58, 144.75, "Perception of the country improved after the festival."], [145.35, 148.2, "Your turn. Say: Perception."], [151.03, 152.16, "Perception."], [152.92, 153.91, "Outreach."], [154.92, 158.62, "Outreach means efforts to connect with and inform a wider public."], [159.22, 162.33, "Embassy outreach included free language classes."], [162.92, 165.69, "Your turn. Say: Outreach."], [168.53, 169.62, "Outreach."], [170.4, 174.2, "Part two: dialogue. Let's listen to a conversation."], [175.05, 181.75, "Visal, why does Korea fund free Korean classes and K-pop events in Phnom Penh? It earns no direct profit."], [182.85, 193.49, "It's a long-term investment in influence. This approach is sometimes referred to as soft power: winning hearts rather than forcing compliance."], [194.58, 196.35, "Does it really change anything?"], [197.45, 209.66, "Considerably. Students who love Korean culture often choose to study or work there, and that goodwill can shape future political and trade relations."], [210.75, 212.57, "Could Cambodia do the same?"], [213.68, 223.69, "It already does, in a way. Programmes known as cultural diplomacy, such as touring Apsara troupes, project an image far richer than headlines alone."], [224.83, 226.46, "Part three: grammar."], [227.32, 230.8, "Grammar focus: Sometimes referred to as and known as."], [231.1, 232.17, "Look at the pattern."], [232.88, 235.97, "This approach is sometimes referred to as soft power."], [236.88, 240.43, "Programmes known as cultural diplomacy project a richer image."], [241.32, 244.01, "This strategy is often termed nation branding."], [244.97, 255.93, "Remember both prepositions: 'referred TO AS' (not 'referred as'). 'Known as' and 'termed' need no extra preposition. These phrases are ideal for introducing terminology in academic writing."], [256.68, 260.8, "Be careful! Don't say: It is sometimes referred soft power."], [262.73, 265.66, "Say: It is sometimes referred to as soft power."], [265.96, 267.47, "Referred to as."], [268.27, 271.36, "Part four: reading. Read and listen."], [272.17, 273.48, "Winning Hearts Abroad."], [273.78, 281.68, "Public diplomacy refers to a government's efforts to engage foreign citizens directly, rather than communicating only with other governments."], [282.67, 289.27, "Joseph Nye argued that attraction can achieve outcomes that coercion cannot, a capacity he famously termed 'soft power'."], [290.27, 297.63, "Scholarships, broadcasting, cultural exchange and sport are all instruments of what is sometimes referred to as 'the battle for hearts and minds'."], [298.63, 304.9, "Cambodia's heritage, particularly Angkor, gives the country considerable potential for nation branding."], [305.9, 312.65, "Nevertheless, public diplomacy cannot compensate indefinitely for policies that foreign audiences perceive as unjust."], [313.73, 317.57, "Part five: quiz. Five questions. Are you ready?"], [318.42, 321.29, "This period is often referred blank the 'golden age'."], [321.59, 324.68, "A, as. B, to as. C, to."], [328.23, 330.07, "The answer is B: to as."], [331.22, 333.99, "Shaping a country's international image is blank."], [334.29, 338.87, "A, nation branding. B, outreach. C, goodwill."], [342.4, 345.11, "The answer is A: nation branding."], [346.25, 349.38, "Friendly feelings and support between peoples are blank."], [349.68, 354.36, "A, perception. B, international relations. C, goodwill."], [357.9, 359.77, "The answer is C: goodwill."], [360.92, 362.83, "Choose the correct sentence."], [363.13, 370.6, "A, The theory is known as constructivism.. B, The theory is known to as constructivism.. C, The theory knows as constructivism.."], [374.13, 377.65, "The answer is A: The theory is known as constructivism.."], [378.82, 382.15, "According to the reading, who coined the term 'soft power'?"], [382.45, 386.66, "A, Joseph Nye. B, Aristotle. C, Kotter."], [390.2, 392.64, "The answer is A: Joseph Nye."], [393.83, 396.81, "Part six: speaking. It's your turn to talk."], [397.65, 401.39, "What is an example of soft power a country might use in diplomacy?"], [418.18, 419.93, "Now listen to Visal."], [420.23, 459.08, "A clear example of soft power is offering university scholarships to foreign students. Japan and Australia, for instance, fund many young Cambodians, who often return home with positive impressions and personal networks. This strategy, sometimes referred to as 'education diplomacy', builds goodwill that can influence trade and political relations for decades. Cultural exports such as films, music and cuisine work similarly. Unlike military or economic pressure, soft power persuades people to want to cooperate."], [459.38, 461.2, "Excellent answer, Visal!"], [462.12, 467.18, "Great work! Now you can use eight new words and sometimes referred to as and known as."], [467.48, 473.48, "Today's value is diplomacy. Disagree respectfully, and look for solutions everyone can accept."], [473.78, 476.5, "See you in Unit seventeen. Goodbye!"], [476.8, 479.13, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C2B1-Unit17-Conflict-Resolution": [[0.35, 4.97, "Hello, everyone! I'm Ms. Emma. Welcome to Online C two, Book one."], [5.27, 8.97, "Hi! I'm Visal. Let's learn together!"], [9.27, 16.8, "Unit seventeen: Conflict Resolution. Today you will express outcomes with result clauses (so that, resulting in)."], [17.09, 19.77, "Here is our lesson map. Let's start!"], [20.73, 23.97, "Part one: words. You will learn eight new words."], [24.82, 26.41, "Conflict resolution."], [27.42, 31.56, "Conflict resolution means the process of ending a disagreement constructively."], [32.15, 35.77, "Conflict resolution training reduced disputes between departments."], [36.38, 39.76, "Your turn. Say: Conflict resolution."], [42.6, 44.05, "Conflict resolution."], [44.82, 45.86, "Mediation."], [46.85, 51.18, "Mediation means intervention by a neutral third party to help settle a dispute."], [51.78, 54.99, "Mediation resolved the land dispute without a court case."], [55.58, 57.83, "Your turn. Say: Mediation."], [60.67, 61.56, "Mediation."], [62.32, 63.56, "Negotiation."], [64.55, 67.77, "Negotiation means discussion aimed at reaching an agreement."], [68.38, 71.82, "Negotiation lasted three days before both sides signed."], [72.42, 75.84, "Your turn. Say: Negotiation."], [78.7, 79.99, "Negotiation."], [80.75, 82.0, "Compromise."], [82.98, 86.69, "Compromise means an agreement in which each side gives up something."], [87.28, 89.94, "The compromise satisfied neither side completely."], [90.55, 93.12, "Your turn. Say: Compromise."], [95.97, 97.07, "Compromise."], [97.82, 99.19, "Win-win outcome."], [100.18, 103.67, "Win-win outcome means a result that benefits all parties."], [104.28, 107.42, "Sharing the water schedule created a win-win outcome."], [108.02, 111.05, "Your turn. Say: Win-win outcome."], [113.9, 115.45, "Win-win outcome."], [116.18, 117.51, "De-escalation."], [118.52, 121.86, "De-escalation means reducing the intensity of a conflict."], [122.45, 125.4, "Calm language is the first step in de-escalation."], [126.02, 129.28, "Your turn. Say: De-escalation."], [132.13, 133.38, "De-escalation."], [134.12, 135.26, "Active listening."], [136.25, 140.95, "Active listening means fully concentrating on, understanding and reflecting what is said."], [141.55, 144.26, "Active listening made both farmers feel heard."], [144.85, 147.54, "Your turn. Say: Active listening."], [150.4, 151.68, "Active listening."], [152.42, 153.57, "Common ground."], [154.58, 158.45, "Common ground means shared interests or beliefs between opposing parties."], [159.05, 161.98, "Both villages found common ground in protecting the river."], [162.58, 165.84, "Your turn. Say: Common ground."], [168.7, 169.93, "Common ground."], [170.73, 174.66, "Part two: dialogue. Let's listen to a conversation."], [175.52, 182.77, "Visal, two neighbouring villages are fighting over irrigation water from the same canal. Shouldn't the authorities simply decide?"], [183.85, 191.35, "An imposed decision might stop the argument temporarily, but it often results in lingering resentment and future conflict."], [192.45, 194.17, "So what's the alternative?"], [195.28, 206.77, "A mediated dialogue in which each side explains its needs. Active listening can result in genuine common ground, such as a shared watering schedule."], [207.88, 209.8, "Will both villages accept it?"], [210.92, 220.7, "They're more likely to, because they designed it. The process should be structured so that each side feels heard, resulting in a more durable agreement."], [221.83, 223.36, "Part three: grammar."], [224.22, 227.71, "Grammar focus: Result clauses (so that, resulting in)."], [228.01, 229.36, "Look at the pattern."], [230.05, 233.05, "Active listening can result in genuine common ground."], [233.95, 237.15, "The process was structured so that each side felt heard."], [238.05, 241.55, "Both sides compromised, resulting in a durable agreement."], [242.5, 255.22, "'Result in' introduces an effect; 'result from' introduces a cause. 'So that' expresses purpose with a clause (so that each side feels heard). ', resulting in + noun' adds the consequence of the whole previous clause."], [255.98, 259.97, "Be careful! Don't say: Listening can result to agreement."], [261.93, 264.42, "Say: Listening can result in agreement."], [264.72, 266.24, "Result in (effect)."], [267.03, 269.81, "Part four: reading. Read and listen."], [270.6, 272.23, "Positions and Interests."], [272.53, 279.44, "Conflict resolution theory distinguishes between the positions parties publicly adopt and the underlying interests that motivate them."], [280.43, 289.92, "In the classic example, two people who both demand an orange may discover that one wants the juice and the other the peel, resulting in a solution that satisfies both."], [290.93, 298.13, "Active listening is central to uncovering such interests, since people rarely reveal their deeper concerns until they feel understood."], [299.13, 307.56, "De-escalation techniques, such as acknowledging emotions and slowing the pace of discussion, create conditions so that rational problem-solving becomes possible."], [308.57, 314.1, "Agreements reached in this way tend to last, because each party recognises its own needs in the outcome."], [315.2, 319.21, "Part five: quiz. Five questions. Are you ready?"], [320.05, 323.09, "Poor communication often results blank conflict."], [323.39, 326.1, "A, in. B, from. C, to."], [329.63, 331.74, "The answer is A: in."], [332.88, 335.72, "Intervention by a neutral third party is blank."], [336.02, 340.29, "A, negotiation. B, mediation. C, compromise."], [343.83, 345.81, "The answer is B: mediation."], [346.95, 349.95, "Shared interests between opposing parties are blank."], [350.25, 355.13, "A, de-escalation. B, win-win outcome. C, common ground."], [358.67, 360.89, "The answer is C: common ground."], [362.05, 363.84, "Choose the correct sentence."], [364.14, 374.07, "A, They spoke slowly so that everyone understood.. B, They spoke slowly so that everyone understanding.. C, They spoke slowly resulting that everyone understood.."], [377.63, 381.8, "The answer is A: They spoke slowly so that everyone understood.."], [382.95, 386.13, "According to the reading, in the orange example the solution…"], [386.43, 392.17, "A, satisfied both people. B, satisfied neither person. C, required a judge."], [395.7, 398.4, "The answer is A: satisfied both people."], [399.6, 402.8, "Part six: speaking. It's your turn to talk."], [403.65, 406.79, "What role does active listening play in resolving a conflict?"], [423.58, 425.42, "Now listen to Visal."], [425.72, 464.37, "Active listening plays a central role because conflicts often persist when people feel unheard rather than when their demands are incompatible. By paraphrasing and acknowledging emotions, a listener lowers defensiveness, resulting in calmer and more honest discussion. It also reveals underlying interests behind rigid positions. For example, a dispute over a factory's noise may really concern children's sleep, which could be solved by changing shift times. Active listening transforms opponents into problem-solvers."], [464.67, 466.35, "Excellent answer, Visal!"], [467.25, 472.14, "Great work! Now you can use eight new words and result clauses (so that, resulting in)."], [472.44, 475.93, "Today's value is empathy. Think about how others feel."], [476.23, 478.83, "See you in Unit eighteen. Goodbye!"], [479.13, 481.89, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C2B1-Unit18-Mediation-Techniques": [[0.35, 5.4, "Hello, everyone! I'm Ms. Emma. Welcome to Online C two, Book one."], [5.7, 9.13, "Hi! I'm Visal. Let's learn together!"], [9.43, 15.82, "Unit eighteen: Mediation Techniques. Today you will contrast approaches with rather than + noun / gerund."], [16.12, 18.66, "Here is our lesson map. Let's start!"], [19.6, 22.88, "Part one: words. You will learn eight new words."], [23.72, 24.67, "Mediator."], [25.68, 29.42, "Mediator means a neutral person who helps parties reach agreement."], [30.02, 32.99, "The mediator met each family separately first."], [33.58, 36.34, "Your turn. Say: Mediator."], [39.2, 40.1, "Mediator."], [40.85, 41.96, "Neutrality."], [42.95, 46.39, "Neutrality means not supporting either side in a dispute."], [46.98, 50.63, "Neutrality requires the mediator to avoid personal opinions."], [51.22, 53.96, "Your turn. Say: Neutrality."], [56.8, 57.99, "Neutrality."], [58.75, 59.97, "Facilitation."], [60.98, 64.89, "Facilitation means making a discussion easier and more productive."], [65.48, 68.44, "Skilled facilitation kept the meeting focused."], [69.05, 71.55, "Your turn. Say: Facilitation."], [74.4, 75.74, "Facilitation."], [76.48, 78.04, "Interest-based approach."], [79.05, 84.18, "Interest-based approach means focusing on underlying needs rather than stated demands."], [84.78, 89.08, "An interest-based approach revealed that both sides wanted security."], [89.68, 93.46, "Your turn. Say: Interest-based approach."], [96.3, 98.93, "Interest-based approach."], [99.68, 100.65, "Reframing."], [101.65, 106.11, "Reframing means restating a hostile comment in neutral, constructive terms."], [106.72, 110.06, "Reframing turned an accusation into a shared problem."], [110.65, 113.26, "Your turn. Say: Reframing."], [116.1, 117.21, "Reframing."], [117.95, 118.74, "Trust."], [119.75, 123.39, "Trust means confidence in someone's honesty and fairness."], [123.98, 127.45, "Without trust in the mediator, the process collapses."], [128.05, 130.54, "Your turn. Say: Trust."], [133.4, 134.16, "Trust."], [134.92, 136.21, "Impartiality."], [137.22, 141.68, "Impartiality means treating all parties equally and without bias."], [142.28, 145.21, "Impartiality must be visible as well as real."], [145.82, 148.96, "Your turn. Say: Impartiality."], [151.8, 153.13, "Impartiality."], [153.88, 155.05, "Resolution."], [156.05, 158.39, "Resolution means the settlement of a dispute."], [158.98, 161.61, "The resolution was signed in the village pagoda."], [162.22, 164.96, "Your turn. Say: Resolution."], [167.8, 168.99, "Resolution."], [169.8, 173.28, "Part two: dialogue. Let's listen to a conversation."], [174.12, 180.48, "Visal, a landlord says, 'The tenant is lazy and never pays on time.' How should a mediator respond?"], [181.58, 189.53, "By reframing rather than repeating the insult: 'It sounds as though reliable payment is very important to you.'"], [190.62, 192.29, "Isn't that avoiding the issue?"], [193.38, 201.7, "Not at all. It moves the discussion towards needs rather than blame. Mediators focus on interests rather than fixed positions."], [202.82, 204.63, "And if the tenant gets angry?"], [205.72, 215.54, "The mediator acknowledges the emotion rather than suppressing it, then asks what would make payment easier, perhaps a different due date."], [216.7, 218.05, "Part three: grammar."], [218.88, 221.89, "Grammar focus: Rather than plus noun and gerund."], [222.19, 223.48, "Look at the pattern."], [224.18, 227.58, "Mediators focus on interests rather than fixed positions."], [228.48, 231.56, "The mediator reframed the insult rather than repeating it."], [232.45, 235.74, "Rather than imposing a solution, she asked questions."], [236.7, 249.19, "'Rather than' links parallel items: nouns (interests rather than positions) or verbs. At the start of a sentence, use -ing: Rather than imposing… After 'would rather', use the base verb: I'd rather listen than argue."], [249.95, 254.17, "Be careful! Don't say: Focus on interests rather than to fight."], [256.13, 258.91, "Say: Focus on interests rather than fighting."], [259.21, 260.69, "Rather than + -ing."], [261.5, 264.2, "Part four: reading. Read and listen."], [265.0, 266.48, "The Mediator's Toolkit."], [266.78, 272.41, "Mediation differs from arbitration in that the mediator facilitates agreement rather than imposing a decision."], [273.4, 281.23, "Impartiality is the mediator's most valuable asset, since parties will reveal their true concerns only to someone they trust to be fair."], [282.23, 289.42, "Reframing transforms accusations into statements of need, allowing discussion to focus on solutions rather than blame."], [290.43, 298.37, "Private sessions, sometimes called caucuses, allow each party to express emotions and test proposals without losing face."], [299.37, 306.66, "In Cambodia, traditional mediation by village elders and monks shares many of these principles with modern professional practice."], [307.77, 311.92, "Part five: quiz. Five questions. Are you ready?"], [312.78, 315.5, "She chose to walk rather than blank the bus."], [315.8, 319.0, "A, taking. B, take. C, took."], [322.57, 324.33, "The answer is B: take."], [325.48, 328.48, "Treating all parties equally and without bias is blank."], [328.78, 333.38, "A, impartiality. B, facilitation. C, reframing."], [336.93, 339.29, "The answer is A: impartiality."], [340.45, 343.75, "Restating a hostile comment in neutral terms is blank."], [344.05, 348.31, "A, resolution. B, neutrality. C, reframing."], [351.87, 353.91, "The answer is C: reframing."], [355.05, 356.75, "Choose the correct sentence."], [357.05, 363.13, "A, Rather than argue, they listened.. B, Rather than arguing, they listened.. C, Rather arguing, they listened.."], [366.67, 369.61, "The answer is B: Rather than arguing, they listened.."], [370.75, 374.95, "According to the reading, mediation differs from arbitration because the mediator…"], [375.25, 380.26, "A, imposes a decision. B, facilitates agreement. C, charges more."], [383.8, 386.7, "The answer is B: facilitates agreement."], [387.9, 390.92, "Part six: speaking. It's your turn to talk."], [391.78, 394.67, "Why is impartiality so important for a mediator?"], [411.45, 412.86, "Now listen to Visal."], [413.16, 448.42, "Impartiality is essential because mediation depends entirely on both parties' willingness to speak openly. If one side suspects the mediator favours the other, it will hide its real concerns, and any agreement will feel imposed rather than chosen. A mediator must therefore manage not only actual bias but also perceptions, for example by giving each side equal time and avoiding personal opinions. In my view, impartiality is what gives a mediator authority without power."]
