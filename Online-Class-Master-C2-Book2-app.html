, 104.83, "Ideology critique."], [105.58, 106.46, "Hegemony."], [107.45, 111.55, "Hegemony means dominance maintained through consent as much as force."], [112.15, 115.88, "Hegemony works when the powerless accept the rules as natural."], [116.48, 119.18, "Your turn. Say: Hegemony."], [122.03, 123.14, "Hegemony."], [123.88, 125.33, "Social justice."], [126.32, 131.72, "Social justice means fairness in the distribution of rights, opportunities and resources."], [132.32, 135.31, "Social justice is the goal of many reform movements."], [135.92, 138.77, "Your turn. Say: Social justice."], [141.6, 143.24, "Social justice."], [143.98, 145.03, "Praxis."], [146.02, 149.21, "Praxis means the unity of theory and practical action."], [149.82, 152.97, "For critical theorists, praxis is the test of an idea."], [153.55, 155.99, "Your turn. Say: Praxis."], [158.83, 159.81, "Praxis."], [160.55, 161.61, "Liberation."], [162.62, 165.86, "Liberation means the act of being set free from constraint."], [166.45, 169.39, "Liberation was both the movement's aim and its method."], [169.98, 172.4, "Your turn. Say: Liberation."], [175.27, 176.42, "Liberation."], [177.23, 181.14, "Part two: dialogue. Let's listen to a conversation."], [181.98, 187.48, "Visal, philosophers write about oppression, yet little seems to change. What is the point?"], [188.58, 197.77, "Critical theory aims to connect ideas with real action. Its goal is not merely to interpret society but to change it."], [198.88, 200.07, "Change how?"], [201.18, 212.29, "By exposing the beliefs that make inequality seem natural. The aim of ideology critique is to reveal who profits from a supposedly neutral rule."], [213.38, 214.33, "And then?"], [215.42, 225.82, "Praxis. The purpose of theory is to inform action, and the purpose of action is to test theory, in a continuing cycle."], [226.97, 228.56, "Part three: grammar."], [229.42, 233.0, "Grammar focus: Aim and goal infinitive clauses."], [233.3, 234.55, "Look at the pattern."], [235.25, 238.33, "Critical theory aims to connect ideas with real action."], [239.22, 242.95, "Ideology critique seeks to reveal who profits from a rule."], [243.85, 246.77, "The goal of praxis is to unite theory and practice."], [247.73, 257.93, "Aim, seek, strive, intend and be designed take 'to' + base verb: aims to connect. 'The aim of X is to…' also needs the infinitive, never '-ing' after 'aims'."], [258.68, 263.19, "Be careful! Don't say: Critical theory aims connecting ideas to action."], [265.13, 268.38, "Say: Critical theory aims to connect ideas to action."], [268.68, 270.28, "aim + to-infinitive."], [271.07, 273.82, "Part four: reading. Read and listen."], [274.63, 276.18, "Theory With a Purpose."], [276.48, 286.06, "The Frankfurt School, founded in the 1920s, developed critical theory to analyse how capitalism, culture and ideology maintain unequal power."], [287.07, 295.78, "Unlike traditional theory, which aims to describe the world neutrally, critical theory seeks to expose domination and to promote emancipation."], [296.77, 304.98, "Antonio Gramsci's notion of hegemony explained how rulers secure consent, so that unequal arrangements appear to be natural common sense."], [305.97, 310.64, "The method of ideology critique is designed to reveal whose interests a belief serves."], [311.63, 318.96, "Praxis, the union of reflection and action, completes the project: ideas are tested by their capacity to bring about liberation."], [320.07, 324.23, "Part five: quiz. Five questions. Are you ready?"], [325.08, 328.39, "Critical theory aims blank connect ideas with action."], [328.69, 331.86, "A, to. B, for. C, at."], [335.4, 337.25, "The answer is A: to."], [338.38, 341.24, "The unity of theory and practical action is blank."], [341.54, 345.67, "A, hegemony. B, praxis. C, emancipation."], [349.23, 351.2, "The answer is B: praxis."], [352.35, 354.69, "Dominance maintained through consent is blank."], [354.99, 359.17, "A, hegemony. B, liberation. C, social justice."], [362.73, 364.69, "The answer is A: hegemony."], [365.85, 367.63, "Choose the correct sentence."], [367.93, 376.14, "A, The theory aims exposing power.. B, The theory aims to expose power.. C, The theory aims for expose power.."], [379.7, 382.99, "The answer is B: The theory aims to expose power.."], [384.15, 388.81, "According to the reading, critical theory differs from traditional theory because it seeks to…"], [389.11, 394.93, "A, describe neutrally. B, expose domination. C, avoid action."], [398.47, 400.85, "The answer is B: expose domination."], [402.03, 405.27, "Part six: speaking. It's your turn to talk."], [406.12, 410.49, "How does critical theory connect abstract ideas to real-world action?"], [427.28, 428.7, "Now listen to Visal."], [429.0, 457.17, "Critical theory connects ideas to action by revealing the hidden assumptions that keep unfair arrangements in place. Once people see that a rule benefits some at the expense of others, change becomes thinkable. The aim is not only to understand society but to transform it. Praxis closes the loop: ideas guide action, and the results of action test the ideas."], [457.47, 459.19, "Excellent answer, Visal!"], [460.08, 465.01, "Great work! Now you can use eight new words and aim and goal infinitive clauses."], [465.31, 470.58, "Today's value is social justice. Work for a world where everyone is treated fairly."], [470.88, 473.56, "See you in Unit twenty. Goodbye!"], [473.86, 477.1, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C2B2-Unit20-Philosophy-of-Language": [[0.35, 5.12, "Hello, everyone! I'm Ms. Emma. Welcome to Online C two, Book two."], [5.42, 8.89, "Hi! I'm Visal. Let's learn together!"], [9.19, 15.72, "Unit twenty: Philosophy of Language. Today you will explain meaning using abstract noun clauses."], [16.02, 18.73, "Here is our lesson map. Let's start!"], [19.67, 23.23, "Part one: words. You will learn eight new words."], [24.08, 24.89, "Meaning."], [25.88, 29.04, "Meaning means what a word, sentence or action conveys."], [29.65, 32.09, "The meaning of 'bank' changes with context."], [32.68, 34.67, "Your turn. Say: Meaning."], [37.53, 38.35, "Meaning."], [39.08, 40.2, "Reference."], [41.22, 44.64, "Reference means the relation between a word and the thing it picks out."], [45.25, 48.42, "Frege distinguished the reference of a name from its sense."], [49.02, 51.91, "Your turn. Say: Reference."], [54.77, 56.02, "Reference."], [56.78, 57.61, "Truth."], [58.62, 62.44, "Truth means the property of a statement that corresponds to how things are."], [63.05, 66.18, "Truth conditions specify when a sentence would be true."], [66.78, 69.34, "Your turn. Say: Truth."], [72.2, 72.9, "Truth."], [73.65, 74.88, "Speech act."], [75.88, 79.81, "Speech act means an utterance that performs an action, such as promising."], [80.42, 82.97, "'I promise' is a speech act, not a description."], [83.58, 86.11, "Your turn. Say: Speech act."], [88.97, 90.09, "Speech act."], [90.85, 91.99, "Context."], [92.98, 96.33, "Context means the circumstances in which something is said."], [96.92, 100.55, "Context determines whether 'It's cold' is a complaint or a request."], [101.15, 103.72, "Your turn. Say: Context."], [106.57, 107.51, "Context."], [108.25, 109.44, "Ambiguity."], [110.45, 114.21, "Ambiguity means the property of having more than one possible meaning."], [114.82, 117.37, "The headline's ambiguity caused confusion."], [117.98, 120.42, "Your turn. Say: Ambiguity."], [123.27, 124.42, "Ambiguity."], [125.18, 126.41, "Pragmatics."], [127.42, 130.65, "Pragmatics means the study of how context shapes meaning."], [131.25, 135.04, "Pragmatics explains why 'Nice weather!' can be sarcastic."], [135.65, 138.57, "Your turn. Say: Pragmatics."], [141.43, 142.71, "Pragmatics."], [143.45, 144.73, "Interpretation."], [145.72, 150.07, "Interpretation means the act of explaining or understanding the meaning of something."], [150.68, 153.93, "Legal interpretation depends on text and context."], [154.52, 157.4, "Your turn. Say: Interpretation."], [160.27, 161.5, "Interpretation."], [162.3, 165.96, "Part two: dialogue. Let's listen to a conversation."], [166.82, 171.88, "Visal, I said 'Can you open the window?' and he just said 'Yes.' Was he being rude?"], [172.98, 181.93, "Literally he was correct. What a word means depends on how it is used, and what a sentence means depends on who says it and why."], [183.02, 185.22, "So the real meaning was a request?"], [186.32, 196.74, "Yes, a speech act. Whether an utterance is a question or a request is determined by context, not by its grammar alone."], [197.85, 199.43, "Then meaning is never fixed?"], [200.52, 208.61, "That is what Wittgenstein suggested. Why a phrase works is explained by the practice around it, not by any dictionary."], [209.77, 211.51, "Part three: grammar."], [212.35, 215.1, "Grammar focus: Abstract noun clauses."], [215.4, 216.6, "Look at the pattern."], [217.32, 219.94, "What a word means depends on how it is used."], [220.85, 224.36, "Whether an utterance is a request is determined by its context."], [225.25, 228.53, "Why a phrase works is explained by the practice around it."], [229.47, 238.34, "A wh- clause keeps statement order: What a word means (not 'What does a word mean'). The clause is singular and takes a singular verb: depends, is."], [239.08, 243.44, "Be careful! Don't say: What means a word depends on use."], [245.4, 248.15, "Say: What a word means depends on use."], [248.45, 251.25, "Noun clauses keep statement word order."], [252.07, 254.96, "Part four: reading. Read and listen."], [255.77, 257.04, "Words and Their Work."], [257.33, 262.88, "The philosophy of language asks how words come to mean anything and how speakers succeed in communicating."], [263.87, 270.62, "Frege separated the reference of an expression, the object it picks out, from its sense, the way in which that object is presented."], [271.6, 277.57, "Wittgenstein later argued that meaning is use: what a word means depends on how it functions within a form of life."], [278.57, 286.74, "J. L. Austin showed that many utterances, such as promises and apologies, perform actions instead of merely describing them."], [287.73, 294.52, "Pragmatics extends the point: how an utterance should be interpreted depends on context, intention and shared background."], [295.6, 299.81, "Part five: quiz. Five questions. Are you ready?"], [300.65, 303.52, "blank a word means depends on how it is used."], [303.82, 307.44, "A, What. B, Which does. C, That."], [311.0, 312.57, "The answer is A: What."], [313.72, 316.54, "An utterance that performs an action is a blank."], [316.84, 320.83, "A, reference. B, speech act. C, truth."], [324.37, 326.61, "The answer is B: speech act."], [327.75, 330.6, "The study of how context shapes meaning is blank."], [330.9, 334.96, "A, pragmatics. B, ambiguity. C, reference."], [338.5, 340.66, "The answer is A: pragmatics."], [341.82, 343.44, "Choose the correct sentence."], [343.75, 352.18, "A, What does a word mean depends on use.. B, What a word means depends on use.. C, What a word does mean depends on use.."], [355.73, 359.09, "The answer is B: What a word means depends on use.."], [360.25, 363.65, "According to the reading, Wittgenstein argued that meaning is…"], [363.95, 368.51, "A, use. B, fixed by dictionaries. C, private."], [372.07, 373.69, "The answer is A: use."], [374.9, 378.0, "Part six: speaking. It's your turn to talk."], [378.85, 381.87, "Can a sentence mean different things in different contexts?"], [398.68, 400.15, "Now listen to Visal."], [400.45, 426.88, "Certainly. 'It's cold in here' may be a simple report, a complaint or a polite request to close the window. What it means depends on who says it, to whom and why. Context fills the gap between the words and the speaker's intention. That is why interpretation is not a mechanical decoding of grammar but a reasoned judgment about purpose."], [427.18, 428.75, "Excellent answer, Visal!"], [429.65, 434.01, "Great work! Now you can use eight new words and abstract noun clauses."], [434.31, 439.54, "Today's value is precision of language. Choose your words carefully so others understand you."], [439.84, 442.79, "See you in Unit twenty-one. Goodbye!"], [443.09, 446.39, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C2B2-Unit21-Philosophy-of-Mind": [[0.35, 5.35, "Hello, everyone! I'm Ms. Emma. Welcome to Online C two, Book two."], [5.65, 9.21, "Hi! I'm Visal. Let's learn together!"], [9.51, 16.56, "Unit twenty-one: Philosophy of Mind. Today you will reflect on mind and brain using as if / as though hypotheticals."], [16.86, 19.54, "Here is our lesson map. Let's start!"], [20.5, 23.86, "Part one: words. You will learn eight new words."], [24.72, 25.62, "Mind."], [26.62, 30.43, "Mind means the faculty of thinking, feeling and awareness."], [31.02, 33.52, "The mind seems more than a heap of neurons."], [34.12, 36.16, "Your turn. Say: Mind."], [39.0, 39.88, "Mind."], [40.65, 41.92, "Consciousness."], [42.92, 47.03, "Consciousness means the state of being aware of oneself and one's surroundings."], [47.62, 50.38, "Consciousness resists simple definition."], [50.98, 54.13, "Your turn. Say: Consciousness."], [57.0, 58.09, "Consciousness."], [58.85, 59.77, "Dualism."], [60.78, 64.88, "Dualism means the view that mind and body are two distinct kinds of thing."], [65.48, 68.24, "Descartes defended dualism of mind and body."], [68.85, 71.02, "Your turn. Say: Dualism."], [73.87, 74.9, "Dualism."], [75.65, 76.94, "Materialism."], [77.95, 82.26, "Materialism means the view that everything, including mind, is physical."], [82.85, 86.29, "Materialism holds that mental states are brain states."], [86.88, 89.49, "Your turn. Say: Materialism."], [92.33, 93.67, "Materialism."], [94.42, 95.12, "Brain."], [96.12, 99.64, "Brain means the organ that controls the body and gives rise to thought."], [100.25, 102.92, "The brain consumes a fifth of the body's energy."], [103.52, 105.89, "Your turn. Say: Brain."], [108.73, 109.51, "Brain."], [110.25, 111.06, "Qualia."], [112.05, 115.18, "Qualia means the felt quality of experiences."], [115.78, 118.92, "Qualia seem hard to fit into a purely physical account."], [119.52, 121.72, "Your turn. Say: Qualia."], [124.57, 125.5, "Qualia."], [126.25, 127.68, "Intentionality."], [128.68, 132.03, "Intentionality means the aboutness of mental states."], [132.62, 135.73, "Beliefs have intentionality because they are about things."], [136.32, 138.9, "Your turn. Say: Intentionality."], [141.73, 143.11, "Intentionality."], [143.85, 145.0, "Identity."], [146.02, 149.5, "Identity means what makes a person or thing the same over time."], [150.12, 153.64, "Personal identity persists despite constant bodily change."], [154.25, 156.38, "Your turn. Say: Identity."], [159.23, 160.26, "Identity."], [161.07, 164.52, "Part two: dialogue. Let's listen to a conversation."], [165.38, 169.58, "Visal, when I imagine my own thoughts, it feels as though they float above my body."], [170.68, 178.59, "That is the dualist intuition. It seems as if consciousness were more than chemistry, even if science says otherwise."], [179.68, 182.33, "So are materialists simply denying that feeling?"], [183.42, 192.0, "Some behave as though qualia were illusions. Others admit that the feeling is real but insist it has a physical basis."], [193.12, 194.37, "And what do you think?"], [195.48, 206.97, "I am agnostic. We talk as if we understood the relation of mind and brain, but we speak as though a final answer were already in hand, and it isn't."], [208.13, 209.62, "Part three: grammar."], [210.48, 214.35, "Grammar focus: Hypothetical subjunctive (as if and as though)."], [214.65, 215.93, "Look at the pattern."], [216.62, 219.65, "It seems as if consciousness were more than chemistry."], [220.55, 223.25, "Some behave as though qualia were illusions."], [224.15, 226.58, "She speaks as if the answer were already known."], [227.53, 237.33, "After 'as if / as though' use the past (and 'were' for all persons) when the comparison is unreal or doubtful: as if he were. If the idea is likely true, the present is possible."], [238.08, 242.94, "Be careful! Don't say: It seems as if consciousness was more than chemistry."], [244.9, 248.87, "Say: It seems as if consciousness were more than chemistry."], [249.17, 251.21, "Use 'were' after as if (unreal)."], [252.0, 254.75, "Part four: reading. Read and listen."], [255.53, 256.72, "Mind and Matter."], [257.02, 263.57, "The mind-body problem asks how mental events, such as pain, belief or intention, relate to the physical brain."], [264.57, 272.09, "Descartes proposed dualism, the claim that mind and matter are distinct substances, though he struggled to explain how they interact."], [273.1, 281.03, "Modern materialists reply that mental states are brain states, even if it seems as though experience were something over and above neural activity."], [282.03, 288.84, "The problem of qualia keeps the debate alive, for it is difficult to see how physical description could capture what a colour is like."], [289.83, 296.2, "Whatever the verdict, philosophers agree that the question of personal identity depends on how mind and brain are related."], [297.3, 301.37, "Part five: quiz. Five questions. Are you ready?"], [302.22, 305.23, "It seems as if consciousness blank more than chemistry."], [305.53, 308.7, "A, is being. B, were. C, will."], [312.27, 313.99, "The answer is B: were."], [315.15, 317.63, "The view that mind and body are distinct is blank."], [317.93, 321.94, "A, materialism. B, dualism. C, identity."], [325.5, 327.48, "The answer is B: dualism."], [328.62, 331.12, "The view that everything is physical is blank."], [331.42, 335.39, "A, materialism. B, qualia. C, dualism."], [338.93, 340.86, "The answer is A: materialism."], [342.02, 343.64, "Choose the correct sentence."], [343.94, 351.75, "A, She talks as if she was an expert.. B, She talks as if she were an expert.. C, She talks as if she be an expert.."], [355.3, 358.62, "The answer is B: She talks as if she were an expert.."], [359.78, 362.75, "According to the reading, the problem of qualia is that…"], [363.05, 369.88, "A, colour is unreal. B, physical description struggles to capture experience. C, brains are simple."], [373.43, 378.25, "The answer is B: physical description struggles to capture experience."], [379.47, 382.77, "Part six: speaking. It's your turn to talk."], [383.62, 385.45, "Is the mind the same as the brain?"], [402.25, 403.73, "Now listen to Visal."], [404.03, 432.06, "I think the mind depends entirely on the brain, yet it may not be fully reducible to it. Damage to the brain changes personality and memory, so the dependence is clear. Still, it seems as if experience were more than a list of neural events, because we cannot easily describe what a feeling is like in physical terms. I therefore see the mind as arising from the brain without being reduced to it."], [432.36, 433.99, "Excellent answer, Visal!"], [434.88, 440.1, "Great work! Now you can use eight new words and hypothetical subjunctive (as if and as though)."], [440.4, 445.64, "Today's value is open-mindedness. Be open to new places, people and ideas."], [445.94, 448.64, "See you in Unit twenty-two. Goodbye!"], [448.94, 451.47, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C2B2-Unit22-Environmental-Philosophy": [[0.35, 5.3, "Hello, everyone! I'm Ms. Emma. Welcome to Online C two, Book two."], [5.6, 8.94, "Hi! I'm Visal. Let's learn together!"], [9.24, 15.72, "Unit twenty-two: Environmental Philosophy. Today you will argue about nature using need not / must not."], [16.02, 18.61, "Here is our lesson map. Let's start!"], [19.57, 23.18, "Part one: words. You will learn eight new words."], [24.02, 24.83, "Nature."], [25.82, 30.78, "Nature means the physical world, including living things apart from human creation."], [31.38, 34.39, "Nature existed long before humanity wrote about it."], [34.98, 37.28, "Your turn. Say: Nature."], [40.13, 40.89, "Nature."], [41.65, 42.92, "Intrinsic value."], [43.92, 48.82, "Intrinsic value means worth that something has in itself, regardless of its usefulness."], [49.42, 52.27, "Many argue that a rainforest has intrinsic value."], [52.88, 55.86, "Your turn. Say: Intrinsic value."], [58.7, 60.13, "Intrinsic value."], [60.88, 61.95, "Stewardship."], [62.95, 66.67, "Stewardship means the responsible care of something entrusted to us."], [67.28, 70.91, "Stewardship treats the land as a trust, not a possession."], [71.52, 74.28, "Your turn. Say: Stewardship."], [77.13, 77.95, "Stewardship."], [78.68, 80.08, "Anthropocentrism."], [81.08, 85.79, "Anthropocentrism means the view that human beings are the centre of moral concern."], [86.38, 89.87, "Anthropocentrism judges nature by its usefulness to people."], [90.48, 93.37, "Your turn. Say: Anthropocentrism."], [96.23, 97.71, "Anthropocentrism."], [98.45, 99.57, "Ecology."], [100.58, 105.09, "Ecology means the study of relationships between living things and their environment."], [105.68, 109.6, "Ecology shows how a single species can shape a whole habitat."], [110.18, 112.95, "Your turn. Say: Ecology."], [115.8, 116.96, "Ecology."], [117.72, 119.14, "Responsibility."], [120.15, 124.27, "Responsibility means the duty to take care of something or answer for it."], [124.88, 127.01, "Responsibility grows with power."], [127.62, 130.55, "Your turn. Say: Responsibility."], [133.4, 134.72, "Responsibility."], [135.45, 137.02, "Future generations."], [138.02, 141.24, "Future generations means people who will live after us."], [141.85, 144.52, "We owe future generations a livable planet."], [145.12, 148.2, "Your turn. Say: Future generations."], [151.03, 152.53, "Future generations."], [153.28, 154.31, "Justice."], [155.32, 157.78, "Justice means fair and morally right treatment."], [158.38, 162.3, "Environmental justice asks who bears pollution's costs."], [162.88, 165.3, "Your turn. Say: Justice."], [168.17, 169.15, "Justice."], [169.93, 173.74, "Part two: dialogue. Let's listen to a conversation."], [174.58, 177.64, "Visal, why protect a swamp if nobody uses it?"], [178.75, 185.8, "Because value need not depend on usefulness. Many philosophers argue that nature has intrinsic worth."], [186.92, 189.39, "But humans must come first, surely."], [190.48, 200.97, "Anthropocentrists say so. Yet a rich life need not exclude concern for other species, and we must not assume that our interests are the only ones that matter."], [202.08, 203.46, "What are our duties, then?"], [204.55, 215.51, "We must not treat the earth as disposable. Stewardship means that we need not stop using nature, but we must use it as trustees for future generations."], [216.67, 218.55, "Part three: grammar."], [219.42, 223.44, "Grammar focus: Modal of necessity (need not and must not)."], [223.74, 224.97, "Look at the pattern."], [225.68, 227.93, "Value need not depend on usefulness."], [228.82, 231.26, "We must not treat the earth as disposable."], [232.15, 235.52, "Stewardship need not forbid all human use of nature."], [236.47, 247.03, "need not = it is not necessary (permitted but optional). must not = forbidden. Both take the bare infinitive: need not depend (never 'need not to depend')."], [247.78, 251.56, "Be careful! Don't say: Value not need depend on usefulness."], [253.5, 256.32, "Say: Value need not depend on usefulness."], [256.62, 258.74, "need not + bare infinitive."], [259.53, 262.45, "Part four: reading. Read and listen."], [263.27, 265.12, "Does Nature Matter in Itself?."], [265.42, 272.62, "Environmental philosophy asks whether the natural world deserves moral concern for its own sake or merely for what it provides."], [273.6, 283.43, "Anthropocentrism, the dominant tradition, assigns value only to human interests, so a forest is valuable if it supplies timber, medicine or recreation."], [284.43, 293.32, "Deep ecologists reply that value need not depend on usefulness: species and ecosystems may possess intrinsic value that humans must not ignore."], [294.33, 303.06, "Stewardship offers a middle path: we need not leave nature untouched, but we must not exhaust it, since we hold it in trust for future generations."], [304.07, 311.07, "Questions of justice follow, because the burdens of environmental damage seldom fall equally on rich and poor."], [312.17, 316.39, "Part five: quiz. Five questions. Are you ready?"], [317.25, 319.5, "Value blank depend on usefulness."], [319.81, 323.98, "A, need not. B, needs not to. C, must to not."], [327.53, 329.68, "The answer is A: need not."], [330.85, 333.62, "Worth that something has in itself is blank value."], [333.92, 338.14, "A, instrumental. B, intrinsic. C, economic."], [341.7, 343.69, "The answer is B: intrinsic."], [344.85, 348.0, "The view that humans are the centre of moral concern is blank."], [348.3, 352.88, "A, ecology. B, anthropocentrism. C, stewardship."], [356.43, 359.31, "The answer is B: anthropocentrism."], [360.45, 362.22, "Which means 'it is forbidden'?"], [362.52, 367.59, "A, You need not touch it.. B, You must not touch it.. C, You do not need to touch it.."], [371.13, 373.89, "The answer is B: You must not touch it.."], [375.05, 379.78, "According to the reading, stewardship says we need not leave nature untouched but must not…"], [380.08, 383.56, "A, use it at all. B, exhaust it. C, study it."], [387.1, 389.29, "The answer is B: exhaust it."], [390.5, 393.34, "Part six: speaking. It's your turn to talk."], [394.18, 397.31, "Does nature have value beyond its usefulness to humans?"], [414.12, 415.81, "Now listen to Visal."], [416.11, 440.11, "I believe it does. The value of a coral reef need not depend on whether it feeds us or attracts tourists. Living systems have a good of their own, and we must not assume that only human interests count. At the same time, we need not stop using nature altogether; we must simply do so responsibly. Our duties extend to future generations as well."], [440.41, 442.05, "Excellent answer, Visal!"], [442.95, 448.11, "Great work! Now you can use eight new words and modal of necessity (need not and must not)."], [448.41, 454.42, "Today's value is environmental stewardship. Care for nature as a trust for future generations."], [454.72, 457.85, "See you in Unit twenty-three. Goodbye!"], [458.15, 460.88, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C2B2-Unit23-Philosophy-of-Education": [[0.35, 5.38, "Hello, everyone! I'm Ms. Emma. Welcome to Online C two, Book two."], [5.68, 9.14, "Hi! I'm Visal. Let's learn together!"], [9.44, 15.48, "Unit twenty-three: Philosophy of Education. Today you will debate aims using whether ... or ... clauses."], [15.78, 18.44, "Here is our lesson map. Let's start!"], [19.4, 22.62, "Part one: words. You will learn eight new words."], [23.48, 24.61, "Education."], [25.62, 29.71, "Education means the process of learning knowledge, skills and values."], [30.32, 33.56, "Education shapes both the individual and society."], [34.15, 37.1, "Your turn. Say: Education."], [39.97, 41.09, "Education."], [41.85, 42.78, "Knowledge."], [43.78, 47.42, "Knowledge means understanding gained through study or experience."], [48.02, 50.45, "Knowledge without judgment can be dangerous."], [51.05, 53.56, "Your turn. Say: Knowledge."], [56.4, 57.26, "Knowledge."], [58.02, 59.05, "Curriculum."], [60.05, 63.41, "Curriculum means the set of subjects and content taught in a school."], [64.02, 66.91, "The curriculum reflects what a society values."], [67.52, 69.97, "Your turn. Say: Curriculum."], [72.83, 73.78, "Curriculum."], [74.52, 75.68, "Critical thinking."], [76.68, 81.81, "Critical thinking means the disciplined analysis and evaluation of arguments and evidence."], [82.42, 85.5, "Critical thinking protects students from manipulation."], [86.08, 88.85, "Your turn. Say: Critical thinking."], [91.7, 92.89, "Critical thinking."], [93.65, 94.7, "Autonomy."], [95.68, 99.23, "Autonomy means the capacity to think and act for oneself."], [99.82, 103.53, "Education should develop autonomy, not obedience."], [104.15, 106.52, "Your turn. Say: Autonomy."], [109.37, 110.47, "Autonomy."], [111.22, 112.25, "Purpose."], [113.25, 117.21, "Purpose means the reason for which something is done or exists."], [117.82, 119.51, "What is the purpose of schooling?"], [120.12, 122.57, "Your turn. Say: Purpose."], [125.43, 126.31, "Purpose."], [127.05, 128.19, "Pedagogy."], [129.18, 132.12, "Pedagogy means the theory and practice of teaching."], [132.72, 136.05, "Progressive pedagogy values discussion over memorisation."], [136.65, 139.56, "Your turn. Say: Pedagogy."], [142.4, 143.35, "Pedagogy."], [144.12, 145.34, "Citizenship."], [146.35, 151.41, "Citizenship means the status and responsibilities of belonging to a political community."], [152.02, 155.21, "Education for citizenship teaches civic duties."], [155.82, 158.93, "Your turn. Say: Citizenship."], [161.8, 162.92, "Citizenship."], [163.73, 167.33, "Part two: dialogue. Let's listen to a conversation."], [168.18, 173.28, "Visal, my parents want me to study whatever gets a good job. Is that what school is for?"], [174.38, 181.49, "Whether education should prepare workers or citizens is debated. Each answer implies a different curriculum."], [182.58, 184.05, "Can't it do both?"], [185.15, 191.88, "Possibly. Whether the two aims conflict or complement each other depends on how one defines success."], [192.98, 194.43, "How would you define it?"], [195.52, 205.68, "As autonomy. Whether a student becomes an employee or an entrepreneur, a mind that can reason is the lasting benefit."], [206.83, 208.43, "Part three: grammar."], [209.28, 211.96, "Grammar focus: Whether or clauses."], [212.26, 213.52, "Look at the pattern."], [214.22, 217.81, "Whether education should prepare workers or citizens is debated."], [218.72, 223.14, "Whether the aims conflict or complement each other depends on how success is defined."], [224.05, 228.44, "Whether students become employees or entrepreneurs, critical thinking will serve them."], [229.4, 239.04, "Whether… or… presents alternatives: Whether A or B is debated (noun clause) / Whether A or B, the result is the same (concessive: no matter which). Do not use 'and'."], [239.78, 244.78, "Be careful! Don't say: Whether education prepares workers and citizens is debated."], [246.73, 251.06, "Say: Whether education prepares workers or citizens is debated."], [251.35, 252.62, "Whether … or … (not 'and')."], [253.43, 256.23, "Part four: reading. Read and listen."], [257.03, 258.36, "What Is School For?."], [258.66, 262.67, "Philosophers of education have long disagreed about the purpose of schooling."], [263.67, 271.77, "Whether education should prepare workers for the economy or citizens for democracy is a question that shapes curricula, funding and teaching methods."], [272.77, 279.78, "John Dewey argued that the two aims need not conflict, for learning by doing develops both practical skill and democratic habits."], [280.77, 288.4, "Others stress autonomy: whether the content is science or literature, the aim should be to cultivate critical thinking rather than obedience."], [289.4, 295.72, "Pedagogy, accordingly, is not a neutral technique but an expression of a view of what human beings should become."], [296.83, 300.97, "Part five: quiz. Five questions. Are you ready?"], [301.82, 305.24, "blank education should prepare workers or citizens is debated."], [305.54, 308.99, "A, Whether. B, Because. C, Although."], [312.53, 314.65, "The answer is A: Whether."], [315.78, 318.22, "The theory and practice of teaching is blank."], [318.52, 322.83, "A, pedagogy. B, curriculum. C, citizenship."], [326.37, 328.64, "The answer is A: pedagogy."], [329.78, 332.55, "The set of subjects taught in a school is the blank."], [332.85, 336.51, "A, curriculum. B, autonomy. C, purpose."], [340.07, 342.21, "The answer is A: curriculum."], [343.35, 344.92, "Choose the correct sentence."], [345.22, 353.49, "A, Whether he stays and leaves is unclear.. B, Whether he stays or leaves is unclear.. C, Whether he stays or leaves are unclear.."], [357.03, 360.55, "The answer is B: Whether he stays or leaves is unclear.."], [361.72, 364.92, "According to the reading, Dewey argued that the two aims…"], [365.22, 369.81, "A, must conflict. B, need not conflict. C, are irrelevant."], [373.37, 376.1, "The answer is B: need not conflict."], [377.3, 380.22, "Part six: speaking. It's your turn to talk."], [381.08, 383.52, "What should be the main purpose of education?"], [400.32, 401.83, "Now listen to Visal."], [402.13, 430.37, "The main purpose of education should be to develop autonomous, thoughtful people. Whether they become engineers or farmers, they will face choices that no syllabus can anticipate, so the ability to reason matters most. Job skills are important, but they change quickly. Education should also prepare citizens who can judge evidence and participate fairly. These aims support rather than oppose each other."], [430.67, 432.31, "Excellent answer, Visal!"], [433.22, 437.24, "Great work! Now you can use eight new words and whether or clauses."], [437.54, 441.82, "Today's value is lifelong learning. Keep learning for as long as you live."], [442.12, 445.23, "See you in Unit twenty-four. Goodbye!"], [445.53, 449.09, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C2B2-Unit24-Buddhist-Philosophy": [[0.35, 5.0, "Hello, everyone! I'm Ms. Emma. Welcome to Online C two, Book two."], [5.3, 8.75, "Hi! I'm Visal. Let's learn together!"], [9.05, 15.91, "Unit twenty-four: Buddhist Philosophy. Today you will describe a tradition using relative clauses with 'in which'."], [16.21, 18.88, "Here is our lesson map. Let's start!"], [19.83, 22.78, "Part one: words. You will learn eight new words."], [23.62, 24.52, "Buddhism."], [25.52, 28.85, "Buddhism means the tradition founded on the teachings of the Buddha."], [29.45, 33.17, "Buddhism shapes festivals, ethics and daily habits in Cambodia."], [33.78, 36.24, "Your turn. Say: Buddhism."], [39.1, 40.01, "Buddhism."], [40.75, 41.97, "Impermanence."], [42.98, 46.61, "Impermanence means the teaching that all things are constantly changing."], [47.22, 50.59, "Impermanence reminds us that no condition lasts forever."], [51.18, 53.91, "Your turn. Say: Impermanence."], [56.77, 58.06, "Impermanence."], [58.82, 59.77, "Suffering."], [60.78, 65.09, "Suffering means the dissatisfaction and pain inherent in unexamined life."], [65.68, 68.76, "The first noble truth acknowledges suffering honestly."], [69.35, 71.65, "Your turn. Say: Suffering."], [74.5, 75.51, "Suffering."], [76.25, 77.32, "Mindfulness."], [78.32, 82.81, "Mindfulness means paying deliberate, non-judgmental attention to the present moment."], [83.42, 86.58, "Mindfulness trains attention through breath and posture."], [87.18, 90.16, "Your turn. Say: Mindfulness."], [93.0, 94.29, "Mindfulness."], [95.05, 96.24, "Compassion."], [97.25, 101.2, "Compassion means sympathy joined with the wish to relieve another's suffering."], [101.82, 105.29, "Compassion is central to Mahayana and Theravada practice."], [105.88, 108.23, "Your turn. Say: Compassion."], [111.1, 112.11, "Compassion."], [112.85, 113.87, "Middle Way."], [114.88, 118.45, "Middle Way means the path between indulgence and harsh self-denial."], [119.05, 122.27, "The Buddha taught the Middle Way after trying extreme asceticism."], [122.88, 125.45, "Your turn. Say: Middle Way."], [128.3, 129.35, "Middle Way."], [130.08, 131.14, "Non-self."], [132.15, 135.64, "Non-self means the teaching that there is no fixed, permanent self."], [136.25, 139.76, "Non-self challenges the idea of a lasting inner essence."], [140.35, 143.14, "Your turn. Say: Non-self."], [146.0, 147.05, "Non-self."], [147.78, 148.7, "Ethics."], [149.72, 153.02, "Ethics means principles governing right and wrong conduct."], [153.62, 156.58, "Buddhist ethics begins with the intention not to harm."], [157.18, 160.05, "Your turn. Say: Ethics."], [162.9, 163.91, "Ethics."], [164.7, 168.33, "Part two: dialogue. Let's listen to a conversation."], [169.18, 174.78, "Visal, my grandmother says Buddhism is not a religion but a way of living. What does she mean?"], [175.88, 182.32, "She describes a tradition in which compassion is central and practice matters more than doctrine."], [183.42, 185.53, "Practice like going to the pagoda?"], [186.62, 195.71, "That, and mindfulness. It is a discipline in which attention is trained to notice impermanence rather than cling to it."], [196.82, 198.94, "And how does that help in daily life?"], [200.05, 209.83, "It offers a path along which one can face suffering with equanimity. This is a view of life in which kindness is the measure of wisdom."], [210.97, 212.91, "Part three: grammar."], [213.75, 216.82, "Grammar focus: Relative clauses with in which."], [217.12, 218.4, "Look at the pattern."], [219.08, 222.02, "It is a tradition in which compassion is central."], [222.92, 226.32, "Mindfulness is a discipline in which attention is trained."], [227.22, 230.59, "It is a view of life in which kindness is the measure of wisdom."], [231.53, 239.75, "Preposition + which/whom = formal relative clause: a tradition in which, the path along which, the person to whom. Never 'in that' or 'in what'."], [240.48, 245.28, "Be careful! Don't say: It is a tradition in that compassion is central."], [247.23, 250.37, "Say: It is a tradition in which compassion is central."], [250.67, 252.79, "Preposition + which (not 'that')."], [253.6, 256.39, "Part four: reading. Read and listen."], [257.2, 258.26, "The Middle Way."], [258.56, 267.12, "Buddhism arose in India some 2,500 years ago and spread across Asia, taking root in Cambodia as a living part of national culture."], [268.13, 275.68, "At its core are four noble truths, which acknowledge suffering, trace it to craving, and describe a path along which it can be overcome."], [276.67, 284.16, "The Buddha rejected both indulgence and extreme asceticism, advocating a Middle Way in which balance, not denial, guides conduct."], [285.17, 292.69, "Central teachings, such as impermanence and non-self, challenge the assumption that we possess a fixed identity to which we must cling."], [293.7, 300.23, "Ethics and compassion follow naturally, since a person who understands interdependence has little reason to harm others."], [301.33, 305.36, "Part five: quiz. Five questions. Are you ready?"], [306.22, 308.81, "It is a tradition blank compassion is central."], [309.11, 312.62, "A, in which. B, in that. C, which in."], [316.17, 318.06, "The answer is A: in which."], [319.22, 321.71, "The teaching that all things change is blank."], [322.01, 326.14, "A, impermanence. B, non-self. C, mindfulness."], [329.7, 332.14, "The answer is A: impermanence."], [333.28, 336.63, "The path between indulgence and self-denial is the blank."], [336.93, 340.72, "A, Middle Way. B, first truth. C, ethics."], [344.27, 346.52, "The answer is A: Middle Way."], [347.68, 349.37, "Choose the correct sentence."], [349.67, 358.08, "A, It is a practice in which attention is trained.. B, It is a practice in that attention is trained.. C, It is a practice which in attention trained.."], [361.63, 365.52, "The answer is A: It is a practice in which attention is trained.."], [366.68, 369.19, "According to the reading, the Buddha rejected…"], [369.49, 374.91, "A, balance. B, indulgence and extreme asceticism. C, ethics."], [378.47, 381.84, "The answer is B: indulgence and extreme asceticism."], [383.03, 386.37, "Part six: speaking. It's your turn to talk."], [387.22, 390.73, "How do Buddhist ideas influence daily life in Cambodia?"], [407.52, 409.17, "Now listen to Visal."], [409.47, 442.19, "Buddhist ideas influence daily life in Cambodia through festivals, family customs and the way people think about merit and kindness. Many people give food to monks each morning, and the pagoda serves as a place in which communities gather and children learn. Teachings on impermanence and compassion encourage patience during hardship and generosity toward others. These ideas shape ethics as much as ritual."], [442.5, 444.36, "Excellent answer, Visal!"], [445.25, 449.73, "Great work! Now you can use eight new words and relative clauses with in which."], [450.02, 454.15, "Today's value is compassion. Care about the suffering of others and help."], [454.45, 457.24, "See you in Unit twenty-five. Goodbye!"], [457.54, 461.62, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C2B2-Unit25-Pragmatism": [[0.35, 5.16, "Hello, everyone! I'm Ms. Emma. Welcome to Online C two, Book two."], [5.46, 8.9, "Hi! I'm Visal. Let's learn together!"], [9.2, 16.1, "Unit twenty-five: Pragmatism. Today you will judge ideas by results using insofar as / to the extent that."], [16.4, 19.12, "Here is our lesson map. Let's start!"], [20.07, 23.55, "Part one: words. You will learn eight new words."], [24.42, 25.52, "Pragmatism."], [26.52, 31.77, "Pragmatism means the philosophy that ideas are to be judged by their practical effects."], [32.38, 36.01, "Pragmatism began in the United States in the late nineteenth century."], [36.62, 39.12, "Your turn. Say: Pragmatism."], [41.97, 42.97, "Pragmatism."], [43.72, 44.59, "Practical."], [45.58, 49.07, "Practical means concerned with action and results rather than theory."], [49.68, 52.59, "A practical solution works in real conditions."], [53.18, 55.67, "Your turn. Say: Practical."], [58.53, 59.44, "Practical."], [60.18, 61.35, "Consequence."], [62.35, 65.17, "Consequence means a result or effect of an action."], [65.78, 69.54, "Peirce urged us to consider the conceivable consequences of an idea."], [70.15, 72.93, "Your turn. Say: Consequence."], [75.77, 76.98, "Consequence."], [77.72, 79.01, "Experience."], [80.02, 83.07, "Experience means knowledge gained through direct involvement."], [83.68, 86.22, "For James, experience is the test of belief."], [86.82, 89.72, "Your turn. Say: Experience."], [92.57, 93.82, "Experience."], [94.58, 95.27, "Truth."], [96.28, 100.21, "Truth means agreement with reality, or what proves reliable in practice."], [100.82, 103.67, "For pragmatists, truth is what survives testing."], [104.28, 106.91, "Your turn. Say: Truth."], [109.77, 110.63, "Truth."], [111.38, 112.28, "Inquiry."], [113.28, 117.04, "Inquiry means the process of investigating a question to settle doubt."], [117.65, 120.19, "Dewey described inquiry as problem-solving."], [120.78, 123.08, "Your turn. Say: Inquiry."], [125.93, 126.91, "Inquiry."], [127.65, 128.86, "Usefulness."], [129.85, 133.22, "Usefulness means the quality of being helpful or effective."], [133.82, 136.88, "Usefulness is the pragmatist's measure of a concept."], [137.48, 140.07, "Your turn. Say: Usefulness."], [142.9, 144.24, "Usefulness."], [144.98, 146.16, "Problem-solving."], [147.15, 150.91, "Problem-solving means finding effective answers to difficulties."], [151.52, 154.21, "Problem-solving is how inquiry advances."], [154.82, 157.97, "Your turn. Say: Problem-solving."], [160.83, 162.22, "Problem-solving."], [163.03, 166.75, "Part two: dialogue. Let's listen to a conversation."], [167.62, 172.52, "Visal, do pragmatists think that anything useful is true? That seems dangerous."], [173.62, 181.18, "Not quite. An idea is true insofar as it works, meaning that it survives testing over time."], [182.28, 184.41, "But a lie can work in the short term."], [185.52, 198.04, "Exactly why pragmatists stress long-run inquiry. To the extent that a belief withstands criticism and experience, it earns the label true."], [199.15, 202.11, "So truth is a process, not a snapshot?"], [203.22, 209.79, "Precisely. Insofar as circumstances change, our best beliefs must be revised."], [210.93, 212.32, "Part three: grammar."], [213.18, 216.63, "Grammar focus: Insofar as and to the extent that."], [216.93, 218.2, "Look at the pattern."], [218.92, 221.61, "An idea is true insofar as it works."], [222.52, 226.48, "A belief earns the label true to the extent that it withstands criticism."], [227.38, 231.33, "Our beliefs must be revised insofar as circumstances change."], [232.3, 242.72, "Insofar as / in so far as / to the extent that = only to the degree that. A full clause follows. They limit a claim: true insofar as it works (not 'insofar it works')."], [243.48, 247.74, "Be careful! Don't say: An idea is true in so far it works."], [249.7, 253.2, "Say: An idea is true insofar as it works."], [253.5, 255.35, "insofar as + clause."], [256.13, 258.75, "Part four: reading. Read and listen."], [259.57, 260.93, "Truth in Practice."], [261.23, 268.68, "Pragmatism, developed by Peirce, James and Dewey, holds that the meaning of an idea lies in its practical consequences."], [269.7, 278.2, "James proposed that an idea is true insofar as it proves reliable in guiding action, which many critics mistook for the claim that whatever is convenient is true."], [279.2, 287.04, "Defenders respond that usefulness is judged over the long run, through inquiry open to correction, and that lies seldom survive such scrutiny."], [288.03, 293.82, "Dewey extended the view to democracy, treating social problems as tasks for experimental problem-solving."], [294.83, 300.42, "To the extent that its tools prove effective, pragmatism has influenced education, law and science."], [301.53, 305.65, "Part five: quiz. Five questions. Are you ready?"], [306.52, 308.78, "An idea is true blank it works."], [309.08, 313.54, "A, insofar as. B, insofar. C, so far of."], [317.1, 319.73, "The answer is A: insofar as."], [320.88, 324.28, "The pragmatist measure of a concept is its practical blank."], [324.58, 328.58, "A, essence. B, consequences. C, paradox."], [332.13, 334.52, "The answer is B: consequences."], [335.65, 337.93, "Dewey described inquiry as blank."], [338.23, 342.46, "A, problem-solving. B, bad faith. C, metaphysics."], [346.0, 348.14, "The answer is A: problem-solving."], [349.28, 351.09, "Choose the correct sentence."], [351.39, 359.95, "A, It is valid to the extent that it helps.. B, It is valid to extent that helps.. C, It is valid to the extent it that helps.."], [363.5, 366.94, "The answer is A: It is valid to the extent that it helps.."], [368.08, 371.35, "According to the reading, pragmatists judge usefulness…"], [371.65, 376.13, "A, in the short run only. B, over the long run. C, never."], [379.67, 381.96, "The answer is B: over the long run."], [383.17, 386.28, "Part six: speaking. It's your turn to talk."], [387.15, 389.53, "Should ideas be judged by their results?"], [406.32, 407.9, "Now listen to Visal."], [408.2, 435.94, "Ideas should be judged by their results, but with care. An idea is worth keeping insofar as it helps us solve problems and survives honest testing. Short-term convenience is not enough, so results must be examined over time and by many people. Some values, such as justice, may not reduce to outcomes. Pragmatism is a valuable corrective to empty theory without being the whole story."], [436.24, 437.97, "Excellent answer, Visal!"], [438.88, 443.87, "Great work! Now you can use eight new words and insofar as and to the extent that."], [444.17, 449.03, "Today's value is practical wisdom. Judge ideas by how well they work in real life."], [449.33, 452.34, "See you in Unit twenty-six. Goodbye!"], [452.64, 456.69, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C2B2-Unit26-Social-Contract-Theory": [[0.35, 5.0, "Hello, everyone! I'm Ms. Emma. Welcome to Online C two, Book two."], [5.3, 8.68, "Hi! I'm Visal. Let's learn together!"], [8.98, 16.92, "Unit twenty-six: Social Contract Theory. Today you will analyse legitimacy using were + to infinitive hypotheticals."], [17.22, 20.05, "Here is our lesson map. Let's start!"], [21.0, 24.36, "Part one: words. You will learn eight new words."], [25.22, 26.57, "Social contract."], [27.55, 33.48, "Social contract means an imagined agreement through which people accept government in exchange for protection."], [34.08, 38.03, "Social contract theory treats society as a mutual agreement."], [38.65, 41.65, "Your turn. Say: Social contract."], [44.5, 46.08, "Social contract."], [46.82, 47.64, "State."], [48.65, 51.93, "State means the organised political authority of a territory."], [52.52, 56.3, "Weber defined the state by its monopoly on legitimate force."], [56.92, 59.71, "Your turn. Say: State."], [62.57, 63.31, "State."], [64.05, 65.06, "Consent."], [66.05, 68.68, "Consent means voluntary agreement to something."], [69.28, 72.23, "Legitimate government rests on the consent of the governed."], [72.85, 75.58, "Your turn. Say: Consent."], [78.43, 79.42, "Consent."], [80.18, 81.1, "Rights."], [82.12, 84.92, "Rights means entitlements that others must respect."], [85.52, 88.92, "Rights protect individuals against arbitrary power."], [89.52, 92.31, "Your turn. Say: Rights."], [95.17, 96.18, "Rights."], [96.92, 98.0, "Authority."], [98.98, 102.76, "Authority means the recognised power to make decisions and enforce them."], [103.35, 107.07, "Authority differs from mere power because it claims justification."], [107.68, 110.38, "Your turn. Say: Authority."], [113.23, 114.25, "Authority."], [114.98, 116.24, "State of nature."], [117.25, 121.13, "State of nature means a hypothetical condition without government or law."], [121.72, 125.36, "Hobbes imagined the state of nature as a war of all against all."], [125.95, 129.09, "Your turn. Say: State of nature."], [131.93, 133.31, "State of nature."], [134.05, 135.13, "Obligation."], [136.12, 140.14, "Obligation means a duty one is morally or legally bound to perform."], [140.75, 144.38, "Citizens may have an obligation to obey just laws."], [144.98, 147.74, "Your turn. Say: Obligation."], [150.6, 151.8, "Obligation."], [152.55, 153.69, "Legitimacy."], [154.68, 157.85, "Legitimacy means the widely accepted right to rule."], [158.45, 161.72, "Legitimacy fades when rulers ignore the people's consent."], [162.32, 165.41, "Your turn. Say: Legitimacy."], [168.27, 169.38, "Legitimacy."], [170.2, 174.07, "Part two: dialogue. Let's listen to a conversation."], [174.92, 179.75, "Visal, I never signed any contract with the government. Why should I obey its laws?"], [180.85, 191.28, "Good objection. Social contract theorists reply that consent can be tacit. Were people to withdraw consent, authority would collapse."], [192.38, 194.46, "But we can't realistically withdraw it."], [195.55, 202.76, "Locke granted that, so he stressed rights. Were a government to violate them, the obligation to obey would weaken."], [203.85, 205.66, "And without government at all?"], [206.75, 216.78, "Hobbes feared the state of nature. Were the state to disappear, he predicted, life would become solitary, poor, nasty, brutish and short."], [217.93, 219.34, "Part three: grammar."], [220.18, 223.65, "Grammar focus: Were plus to infinitive (hypothetical)."], [223.95, 225.1, "Look at the pattern."], [225.78, 228.95, "Were people to withdraw consent, authority would collapse."], [229.85, 233.59, "Were a government to violate rights, the obligation to obey would weaken."], [234.48, 237.39, "Were the state to disappear, disorder would follow."], [238.33, 248.86, "Were + subject + to + verb = a formal, unlikely or imagined condition (= If people were to withdraw…). The result takes would/could. Negative: Were people not to…"], [249.62, 254.56, "Be careful! Don't say: Were people withdraw consent, authority would collapse."], [256.5, 260.35, "Say: Were people to withdraw consent, authority would collapse."], [260.65, 263.04, "Were + subject + to + verb."], [263.83, 266.37, "Part four: reading. Read and listen."], [267.17, 268.39, "Why Obey?."], [268.69, 275.51, "Social contract theory seeks to justify political authority by imagining the agreement that free and equal people might make."], [276.5, 284.73, "For Hobbes, life in the state of nature would be a war of all against all, so individuals surrender some freedom to a sovereign in exchange for security."], [285.73, 292.95, "Locke argued instead that people retain natural rights, and that were a government to violate them, citizens would be entitled to resist."], [293.93, 300.6, "Rousseau placed legitimacy in the general will, claiming that true freedom lies in obeying laws we prescribe to ourselves."], [301.6, 308.52, "Critics object that no one actually signed the contract, but defenders reply that continued participation signals tacit consent."], [309.63, 313.68, "Part five: quiz. Five questions. Are you ready?"], [314.52, 318.14, "blank people to withdraw consent, authority would collapse."], [318.44, 321.72, "A, Were. B, Was. C, If were."], [325.27, 327.16, "The answer is A: Were."], [328.32, 331.52, "A hypothetical condition without government is the blank."], [331.82, 336.16, "A, state of nature. B, general will. C, obligation."], [339.7, 342.05, "The answer is A: state of nature."], [343.18, 345.66, "The widely accepted right to rule is blank."], [345.96, 349.66, "A, rights. B, legitimacy. C, consent."], [353.2, 355.75, "The answer is B: legitimacy."], [356.88, 358.66, "Choose the correct sentence."], [358.96, 366.81, "A, Were the state to fall, chaos would follow.. B, Were the state fall, chaos would follow.. C, Was the state to fall, chaos follow.."], [370.37, 374.55, "The answer is A: Were the state to fall, chaos would follow.."], [375.68, 379.45, "According to the reading, Locke held that governments that violate rights…"], [379.75, 384.9, "A, must always be obeyed. B, may be resisted. C, are impossible."], [388.43, 391.4, "The answer is B: may be resisted."], [392.6, 395.46, "Part six: speaking. It's your turn to talk."], [396.32, 399.13, "Why do people accept the authority of governments?"], [415.92, 417.48, "Now listen to Visal."], [417.77, 442.28, "People accept the authority of governments mainly because they gain security, order and services in return. Were people to withdraw their support in large numbers, even a powerful state would struggle to function. Habit and shared values also matter, but legitimacy ultimately depends on fair treatment. When citizens believe that rules are just, obedience is given willingly rather than forced."], [442.58, 444.18, "Excellent answer, Visal!"], [445.08, 450.21, "Great work! Now you can use eight new words and were plus to infinitive (hypothetical)."], [450.51, 455.94, "Today's value is civic responsibility. Take care of your city, because it is everyone's home."], [456.24, 458.98, "See you in Unit twenty-seven. Goodbye!"], [459.28, 462.71, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C2B2-Unit27-Logic-and-Paradox": [[0.35, 4.98, "Hello, everyone! I'm Ms. Emma. Welcome to Online C two, Book two."], [5.28, 8.63, "Hi! I'm Visal. Let's learn together!"], [8.93, 16.16, "Unit twenty-seven: Logic and Paradox. Today you will concede a point using however + adjective clauses."], [16.46, 19.04, "Here is our lesson map. Let's start!"], [20.0, 23.05, "Part one: words. You will learn eight new words."], [23.88, 24.8, "Logic."], [25.82, 28.18, "Logic means the study of valid reasoning."], [28.78, 32.22, "Logic distinguishes a valid argument from a persuasive one."], [32.82, 35.72, "Your turn. Say: Logic."], [38.57, 39.49, "Logic."], [40.25, 41.3, "Paradox."], [42.28, 46.84, "Paradox means a seemingly sound argument that leads to a contradictory conclusion."], [47.45, 51.26, "The liar paradox arises from the sentence 'This sentence is false.'"], [51.85, 54.59, "Your turn. Say: Paradox."], [57.43, 58.59, "Paradox."], [59.35, 60.34, "Premise."], [61.35, 64.46, "Premise means a statement from which a conclusion is drawn."], [65.05, 67.82, "A false premise can undermine a valid argument."], [68.42, 70.92, "Your turn. Say: Premise."], [73.77, 74.71, "Premise."], [75.45, 76.59, "Contradiction."], [77.58, 81.23, "Contradiction means a statement that cannot be true together with another."], [81.82, 85.34, "A contradiction signals that an assumption must be rejected."], [85.95, 88.59, "Your turn. Say: Contradiction."], [91.43, 92.6, "Contradiction."], [93.35, 94.35, "Validity."], [95.35, 100.0, "Validity means the property of an argument whose conclusion follows from its premises."], [100.58, 103.0, "Validity concerns structure, not truth."], [103.62, 106.23, "Your turn. Say: Validity."], [109.1, 110.28, "Validity."], [111.02, 112.13, "Infinity."], [113.15, 116.24, "Infinity means a quantity without end or limit."], [116.85, 119.92, "Cantor showed that some infinities are larger than others."], [120.52, 123.02, "Your turn. Say: Infinity."], [125.87, 126.88, "Infinity."], [127.62, 129.09, "Self-reference."], [130.08, 133.16, "Self-reference means a statement that refers to itself."], [133.75, 137.12, "Self-reference lies behind many famous paradoxes."], [137.72, 140.88, "Your turn. Say: Self-reference."], [143.73, 145.25, "Self-reference."], [145.98, 146.9, "Reasoning."], [147.92, 151.66, "Reasoning means the process of thinking logically to reach a conclusion."], [152.25, 154.55, "Careful reasoning examines each step."], [155.15, 157.79, "Your turn. Say: Reasoning."], [160.63, 161.53, "Reasoning."], [162.33, 165.84, "Part two: dialogue. Let's listen to a conversation."], [166.68, 172.67, "Visal, every step of this paradox looks correct, but the conclusion is absurd. Is logic broken?"], [173.78, 180.93, "Not broken. However convincing the premise, the conclusion is absurd, so at least one premise must be wrong."], [182.02, 183.08, "Which one?"], [184.18, 191.97, "That is the work. However careful the reasoning appears, hidden assumptions can lurk, particularly in self-reference."], [193.08, 195.16, "So paradoxes are failures?"], [196.25, 204.7, "Quite the opposite. However unsettling they are, they expose the limits of our concepts, and that is how logic progresses."], [205.83, 207.68, "Part three: grammar."], [208.52, 212.5, "Grammar focus: Concessive clauses (However plus adjective)."], [212.8, 213.99, "Look at the pattern."], [214.68, 217.8, "However convincing the premise, the conclusion is absurd."], [218.68, 222.51, "However careful the reasoning appears, hidden assumptions can lurk."], [223.42, 227.62, "However unsettling paradoxes are, they expose the limits of concepts."], [228.57, 238.47, "However + adjective/adverb + subject + verb = no matter how. Keep the adjective right after however: However convincing it is (not 'However it is convincing')."], [239.22, 244.02, "Be careful! Don't say: However the premise is convincing, it is false."], [245.97, 249.15, "Say: However convincing the premise is, it is false."], [249.45, 252.24, "However + adjective + subject + verb."], [253.03, 255.95, "Part four: reading. Read and listen."], [256.77, 258.5, "When Logic Surprises Us."], [258.8, 265.16, "Logic is the study of valid reasoning, yet some of its most instructive moments arise when reasoning appears to fail."], [266.17, 274.25, "A paradox is an argument that proceeds from apparently acceptable premises, by apparently valid steps, to an unacceptable conclusion."], [275.23, 283.46, "The liar paradox, for example, arises from self-reference: if the sentence 'This sentence is false' is true, then it is false, and vice versa."], [284.47, 291.6, "However persuasive the individual steps appear, a contradiction shows that some premise or rule of inference must be revised."], [292.6, 298.64, "Paradoxes have thus driven major advances, from Cantor's theory of infinity to modern computer science."], [299.73, 303.87, "Part five: quiz. Five questions. Are you ready?"], [304.72, 307.69, "blank convincing the premise, the conclusion is absurd."], [307.99, 311.54, "A, However. B, Although. C, Despite."], [315.1, 316.79, "The answer is A: However."], [317.95, 321.89, "A seemingly sound argument with a contradictory conclusion is a blank."], [322.19, 326.3, "A, paradox. B, premise. C, validity."], [329.83, 331.86, "The answer is A: paradox."], [333.02, 335.75, "A statement that refers to itself shows blank."], [336.05, 339.9, "A, infinity. B, self-reference. C, reasoning."], [343.43, 345.51, "The answer is B: self-reference."], [346.65, 348.28, "Choose the correct sentence."], [348.58, 355.64, "A, However it is clever, it is wrong.. B, However clever it is, it is wrong.. C, However clever is it, it is wrong.."], [359.2, 362.36, "The answer is B: However clever it is, it is wrong.."], [363.52, 365.9, "According to the reading, paradoxes have…"], [366.2, 371.1, "A, driven major advances. B, ended logic. C, been ignored."], [374.63, 377.68, "The answer is A: driven major advances."], [378.87, 382.0, "Part six: speaking. It's your turn to talk."], [382.85, 385.28, "Why are paradoxes valuable for thinking?"], [402.08, 403.5, "Now listen to Visal."], [403.8, 433.43, "Paradoxes are valuable because they reveal hidden problems in assumptions that seem obvious. However convincing each step appears, the absurd conclusion tells us that something must change: a premise, a definition or a rule. Resolving a paradox often forces us to sharpen concepts, as happened with infinity and self-reference. They are warnings that intuition is not infallible."], [433.73, 435.38, "Excellent answer, Visal!"], [436.28, 441.58, "Great work! Now you can use eight new words and concessive clauses (however plus adjective)."], [441.88, 447.12, "Today's value is logical rigor. Follow your reasoning wherever it honestly leads."], [447.42, 450.11, "See you in Unit twenty-eight. Goodbye!"], [450.41, 452.96, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C2B2-Unit28-Philosophy-of-Happiness": [[0.35, 5.22, "Hello, everyone! I'm Ms. Emma. Welcome to Online C two, Book two."], [5.52, 8.99, "Hi! I'm Visal. Let's learn together!"], [9.29, 16.2, "Unit twenty-eight: Philosophy of Happiness. Today you will relate work and wellbeing using comparative correlatives."], [16.5, 19.4, "Here is our lesson map. Let's start!"], [20.33, 23.67, "Part one: words. You will learn eight new words."], [24.52, 25.59, "Happiness."], [26.58, 29.48, "Happiness means a state of wellbeing and contentment."], [30.08, 32.6, "Happiness is often confused with pleasure."], [33.22, 35.96, "Your turn. Say: Happiness."], [38.8, 39.88, "Happiness."], [40.62, 41.58, "Wellbeing."], [42.58, 47.06, "Wellbeing means the overall condition of being healthy, comfortable and fulfilled."], [47.65, 50.76, "Wellbeing includes health, relationships and purpose."], [51.35, 53.68, "Your turn. Say: Wellbeing."], [56.53, 57.45, "Wellbeing."], [58.22, 59.07, "Virtue."], [60.08, 63.02, "Virtue means a trait of character that is morally good."], [63.62, 66.73, "Aristotle considered virtue essential to happiness."], [67.32, 69.8, "Your turn. Say: Virtue."], [72.63, 73.41, "Virtue."], [74.15, 75.01, "Pleasure."], [76.02, 78.94, "Pleasure means a feeling of enjoyment or satisfaction."], [79.55, 82.49, "Epicurus valued simple pleasures over luxury."], [83.08, 85.52, "Your turn. Say: Pleasure."], [88.37, 89.28, "Pleasure."], [90.02, 90.75, "Meaning."], [91.75, 95.03, "Meaning means a sense of purpose and significance in life."], [95.62, 98.29, "Research links meaning to lasting satisfaction."], [98.88, 100.92, "Your turn. Say: Meaning."], [103.77, 104.49, "Meaning."], [105.25, 106.23, "Flourishing."], [107.22, 111.82, "Flourishing means living well and realising one's potential, the Greek eudaimonia."], [112.42, 114.93, "Flourishing is more than feeling good for a moment."], [115.52, 118.03, "Your turn. Say: Flourishing."], [120.87, 121.87, "Flourishing."], [122.62, 123.56, "Contentment."], [124.55, 127.92, "Contentment means a peaceful satisfaction with what one has."], [128.52, 131.14, "The Stoics prized contentment over ambition."], [131.75, 134.25, "Your turn. Say: Contentment."], [137.1, 138.12, "Contentment."], [138.88, 139.75, "Good life."], [140.75, 143.84, "Good life means a life that is worthwhile and well lived."], [144.45, 147.05, "Philosophers debate what constitutes the good life."], [147.65, 150.36, "Your turn. Say: Good life."], [153.2, 154.19, "Good life."], [155.0, 158.36, "Part two: dialogue. Let's listen to a conversation."], [159.22, 163.72, "Visal, I earn more every year, but I feel no happier. Why?"], [164.82, 172.37, "Because wellbeing depends on meaning more than on income. The more meaningful our work, the happier we become."], [173.48, 174.91, "So money doesn't matter?"], [176.02, 184.76, "It matters up to a point. The greater our security, the less we worry, yet the more we chase luxury, the less we are satisfied."], [185.85, 187.46, "How do I find meaning, then?"], [188.55, 196.9, "The clearer your values, the easier your choices become, and the more you contribute to others, the richer your life feels."], [198.07, 199.52, "Part three: grammar."], [200.38, 203.3, "Grammar focus: Comparative correlatives."], [203.6, 204.73, "Look at the pattern."], [205.42, 208.15, "The more meaningful our work, the happier we become."], [209.05, 211.53, "The greater our security, the less we worry."], [212.42, 215.54, "The clearer your values, the easier your choices become."], [216.5, 226.55, "The + comparative, the + comparative shows parallel change: The more X, the more Y. Both parts need 'the'; the verb 'be' can be dropped: The sooner, the better."], [227.28, 231.47, "Be careful! Don't say: More meaningful our work, more happy we are."], [233.43, 237.13, "Say: The more meaningful our work, the happier we are."], [237.43, 239.9, "the + comparative, the + comparative."], [240.7, 243.39, "Part four: reading. Read and listen."], [244.2, 245.79, "What Makes a Life Good?."], [246.09, 253.67, "Since antiquity, philosophers have asked what it means to live well, and their answers fall broadly into pleasure, virtue and meaning."], [254.67, 261.19, "Epicurus argued that the simpler our desires, the easier they are to satisfy, and that tranquillity is the highest pleasure."], [262.2, 269.02, "Aristotle replied that happiness is flourishing, an activity of the soul in accordance with virtue over a whole lifetime."], [270.03, 279.59, "Modern research broadly agrees that the stronger our relationships and the more meaningful our work, the higher our reported wellbeing, whereas wealth beyond a certain level adds little."], [280.6, 285.68, "Contentment, then, appears less a prize to be captured than a by-product of living with purpose."], [286.77, 291.3, "Part five: quiz. Five questions. Are you ready?"], [292.15, 295.1, "The more meaningful our work, blank happier we become."], [295.4, 298.17, "A, the. B, more. C, a."], [301.73, 303.15, "The answer is A: the."], [304.32, 307.27, "Living well and realising one's potential is blank."], [307.57, 311.44, "A, pleasure. B, flourishing. C, contentment only."], [315.0, 316.86, "The answer is B: flourishing."], [318.02, 320.33, "Aristotle linked happiness to blank."], [320.63, 323.81, "A, virtue. B, luxury. C, chance."], [327.37, 329.3, "The answer is A: virtue."], [330.45, 332.22, "Choose the correct sentence."], [332.52, 340.91, "A, The more we study, the wiser we become.. B, More we study, wiser we become.. C, The more we study, more wise we become.."], [344.47, 347.67, "The answer is A: The more we study, the wiser we become.."], [348.82, 351.51, "According to the reading, wealth beyond a certain level…"], [351.81, 355.73, "A, adds little. B, guarantees joy. C, ends meaning."], [359.27, 361.2, "The answer is A: adds little."], [362.4, 365.7, "Part six: speaking. It's your turn to talk."], [366.55, 368.41, "What do you think makes a life good?"], [385.22, 386.76, "Now listen to Visal."], [387.06, 413.36, "A good life, I think, combines meaningful work, close relationships and a sense of moral integrity. The more we live by our values, the less we depend on approval, and the more stable our wellbeing becomes. Pleasure and comfort matter, but they are not enough alone. A life is good when, looking back, we can recognise that we have contributed something beyond ourselves."], [413.66, 415.35, "Excellent answer, Visal!"], [416.25, 420.4, "Great work! Now you can use eight new words and comparative correlatives."], [420.7, 424.68, "Today's value is gratitude. Say thank you for your home and family."], [424.98, 427.59, "See you in Unit twenty-nine. Goodbye!"], [427.89, 430.43, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C2B2-Unit29-Review-Thinking-About-Thinking": [[0.35, 5.16, "Hello, everyone! I'm Ms. Emma. Welcome to Online C two, Book two."], [5.46, 8.82, "Hi! I'm Visal. Let's learn together!"], [9.12, 16.27, "Unit twenty-nine: Review: Thinking About Thinking. Today you will reflect on reasoning using emphatic inversion."], [16.57, 19.26, "Here is our lesson map. Let's start!"], [20.2, 23.33, "Part one: words. You will learn eight new words."], [24.18, 25.37, "Metacognition."], [26.38, 30.18, "Metacognition means awareness and regulation of one's own thinking."], [30.78, 34.38, "Metacognition helps students notice when they have misunderstood."], [34.98, 37.84, "Your turn. Say: Metacognition."], [40.7, 41.84, "Metacognition."], [42.58, 43.55, "Reflection."], [44.55, 48.06, "Reflection means careful thought about one's experience and beliefs."], [48.65, 51.48, "Reflection turns experience into understanding."], [52.08, 54.52, "Your turn. Say: Reflection."], [57.37, 58.36, "Reflection."], [59.12, 60.16, "Assumption."], [61.15, 64.26, "Assumption means something taken to be true without proof."], [64.85, 67.31, "Every argument rests on some assumption."], [67.92, 71.07, "Your turn. Say: Assumption."], [73.93, 74.86, "Assumption."], [75.62, 76.43, "Reasoning."], [77.42, 81.12, "Reasoning means the process of thinking logically to reach a conclusion."], [81.72, 84.76, "Good reasoning is transparent and open to correction."], [85.35, 87.7, "Your turn. Say: Reasoning."], [90.57, 91.45, "Reasoning."], [92.22, 93.22, "Bias."], [94.22, 97.98, "Bias means a systematic tendency to favour one view unfairly."], [98.58, 101.95, "Confirmation bias leads us to seek only agreeing evidence."], [102.55, 105.2, "Your turn. Say: Bias."], [108.07, 108.94, "Bias."], [109.68, 110.85, "Perspective."], [111.85, 114.62, "Perspective means a particular way of viewing something."], [115.22, 118.38, "Seeking another perspective exposes blind spots."], [118.98, 122.19, "Your turn. Say: Perspective."], [125.03, 126.21, "Perspective."], [126.95, 127.97, "Clarity."], [128.98, 132.13, "Clarity means the quality of being clear and precise."], [132.72, 135.46, "Clarity of thought precedes clarity of speech."], [136.05, 138.61, "Your turn. Say: Clarity."], [141.47, 142.31, "Clarity."], [143.05, 143.94, "Wisdom."], [144.95, 148.99, "Wisdom means sound judgment based on knowledge, experience and reflection."], [149.58, 152.43, "Wisdom includes knowing the limits of one's knowledge."], [153.02, 155.26, "Your turn. Say: Wisdom."], [158.1, 159.04, "Wisdom."], [159.83, 163.31, "Part two: dialogue. Let's listen to a conversation."], [164.15, 168.56, "Visal, at the end of this course I realise how often my first opinion was wrong."], [169.65, 176.67, "That is progress. Only by reflecting can we recognise our biases, since they operate invisibly."], [177.78, 178.96, "Is there a method?"], [180.05, 188.66, "Several. Only when assumptions are stated can they be tested, and not until we seek another perspective do our blind spots appear."], [189.75, 192.2, "So thinking about thinking is the real skill."], [193.32, 201.2, "Indeed. Rarely do we change our minds without effort, and never has wisdom come to those who refuse to doubt."], [202.37, 203.93, "Part three: grammar."], [204.78, 207.87, "Grammar focus: Emphatic inversion (Only by)."], [208.17, 209.35, "Look at the pattern."], [210.05, 212.88, "Only by reflecting can we recognise our biases."], [213.78, 216.58, "Only when assumptions are stated can they be tested."], [217.48, 220.96, "Not until we seek another perspective do our blind spots appear."], [221.9, 232.76, "A negative or limiting phrase at the start forces inversion: Only by…, Only when…, Not until…, Rarely…, Never… + auxiliary + subject. Do-support if there is no auxiliary."], [233.52, 238.39, "Be careful! Don't say: Only by reflecting we can recognise bias."], [240.33, 244.11, "Say: Only by reflecting can we recognise bias."], [244.41, 247.26, "Only + phrase → invert the auxiliary."], [248.07, 250.53, "Part four: reading. Read and listen."], [251.33, 252.79, "Thinking About Thinking."], [253.09, 258.74, "Metacognition, awareness of one's own thinking, is arguably the most transferable intellectual skill."], [259.73, 266.54, "Psychologists have documented systematic biases, such as confirmation bias, that distort reasoning without our noticing."], [267.53, 272.44, "Only by reflecting on our assumptions can we begin to see how they steer our conclusions."], [273.43, 278.75, "Seeking other perspectives helps, for only when views are challenged do our weaknesses become visible."], [279.77, 286.29, "Never has wisdom been identified with certainty; rather, it consists in the humility to keep questioning what we think we know."], [287.4, 291.51, "Part five: quiz. Five questions. Are you ready?"], [292.35, 295.41, "Only by reflecting blank we recognise our biases."], [295.71, 299.35, "A, can. B, we can. C, could to."], [302.9, 304.57, "The answer is A: can."], [305.72, 308.73, "Awareness and regulation of one's own thinking is blank."], [309.03, 312.62, "A, metacognition. B, bias. C, wisdom."], [316.17, 318.34, "The answer is A: metacognition."], [319.48, 322.38, "Something taken to be true without proof is an blank."], [322.68, 326.5, "A, assumption. B, perspective. C, clarity."], [330.07, 332.07, "The answer is A: assumption."], [333.22, 334.97, "Choose the correct inversion."], [335.27, 341.69, "A, Rarely we change our minds.. B, Rarely do we change our minds.. C, Rarely we do change minds.."], [345.23, 348.65, "The answer is B: Rarely do we change our minds.."], [349.78, 352.7, "According to the reading, wisdom consists in…"], [353.0, 357.97, "A, certainty. B, humility to keep questioning. C, avoiding doubt."], [361.5, 364.38, "The answer is B: humility to keep questioning."], [365.57, 368.87, "Part six: speaking. It's your turn to talk."], [369.72, 371.5, "How do you check your own reasoning?"], [388.28, 389.64, "Now listen to Visal."], [389.94, 415.87, "I check my reasoning by stating my assumptions, looking for evidence that could prove me wrong and asking someone with a different perspective to challenge it. Only by exposing an argument to criticism can I judge whether it is sound. I also wait before deciding when I feel strongly, since emotion can disguise bias. Reflection is slow, but it saves me from costly errors."], [416.17, 417.97, "Excellent answer, Visal!"], [418.88, 423.58, "Great work! Now you can use eight new words and emphatic inversion (only by)."], [423.88, 428.99, "Today's value is metacognitive awareness. Think about your own thinking to grow wiser."], [429.29, 436.05, "Congratulations! You have finished Online C two, Book two. See you in Online C two, Book three!"], [436.35, 439.42, "Thank you, Ms. Emma! Bye, everyone!"]]};
        // English subtitles: added to the player with code, so no subtitle files are needed online.
        let subsOn = true;
        function addSubtitles(el) {
            const cues = SUBTITLES[(el.getAttribute('src') || '').split('/').pop().split('?')[0].replace('.mp4', '')]; const btn = document.getElementById('subs-btn');
            if (!cues || !el.addTextTrack || typeof VTTCue === 'undefined') { if (btn) btn.style.display = 'none'; return; }
            const tr = el.addTextTrack('subtitles', 'English', 'en');
            cues.forEach(c => { try { const q = new VTTCue(c[0], c[1], c[2]); q.line = -2; tr.addCue(q); } catch (e) {} });
            const apply = () => { tr.mode = subsOn ? 'showing' : 'hidden'; if (btn) btn.textContent = subsOn ? '💬 Subtitles: ON' : '💬 Subtitles: OFF'; };
            if (btn) btn.onclick = () => { subsOn = !subsOn; apply(); };
            apply();
        }
        function renderMp4Lesson(contentDiv, unitData) {
            contentDiv.innerHTML = `
                <h2 class="text-xl font-bold text-indigo-900 mb-2">📹 Video Lesson — Unit ${state.unit}: ${unitData.title}</h2>
                <p class="text-gray-600 mb-4">${ytCurrentConfig.checkpoints.length ? 'Watch the video. It will pause at a few points so you can answer a quick question!' : 'Watch Ms. Emma and Visal, then try the other learning modules!'}</p>
                <div class="relative bg-black rounded-2xl overflow-hidden" style="aspect-ratio:16/9;">
                    <video id="mp4-player" src="${ytCurrentConfig.mp4}" controls playsinline preload="metadata" class="w-full h-full" style="object-fit:contain;"></video>
                    <div id="checkpoint-overlay" class="absolute inset-0 bg-indigo-900/95 flex items-center justify-center p-6" style="display:none;"></div>
                </div>
                <p id="video-msg" class="text-sm text-gray-500 mt-3 text-center min-h-[1.25rem]">▶️ Press play to start the lesson!</p>
                <div class="text-center mt-2 flex justify-center gap-3 flex-wrap"><button id="subs-btn" class="bg-white border border-indigo-300 text-indigo-700 font-bold px-4 py-2 rounded-full shadow cursor-pointer">💬 Subtitles: ON</button><button onclick="nextLesson()" class="bg-emerald-700 hover:bg-emerald-800 text-white font-bold px-4 py-2 rounded-full shadow cursor-pointer">Next Lesson ▶️</button></div>`;
            const el = document.getElementById('mp4-player');
            addSubtitles(el);
            { const a = document.getElementById('footer-next-module'), b = document.getElementById('footer-next-lesson'); if (a) a.style.display = ''; if (b) b.style.display = 'none'; }
            ytPlayer = {
                getCurrentTime: () => el.currentTime,
                pauseVideo: () => el.pause(),
                playVideo: () => { const p = el.play(); if (p && p.catch) p.catch(() => {}); },
                destroy: () => { try { el.pause(); el.removeAttribute('src'); el.load(); } catch (e) {} }
            };
            el.addEventListener('play', () => { const m = document.getElementById('video-msg'); if (m) m.textContent = ''; });
            el.addEventListener('timeupdate', () => { if (ytCurrentConfig && ytCurrentConfig.checkpoints.length) checkVideoCheckpoints(); });
            el.addEventListener('ended', () => {
                const got = award(unitKey('video-' + ytCurrentConfig.id), 5);
                const m = document.getElementById('video-msg');
                if (m) m.textContent = '🎉 Great job watching the whole video!' + (got ? ' (+5 ⭐)' : '');
            });
            el.addEventListener('error', () => {
                const m = document.getElementById('video-msg');
                if (m) m.innerHTML = '⚠️ The video could not load. Check the internet, or <a href="' + ytCurrentConfig.mp4 + '" target="_blank" rel="noopener" class="text-indigo-600 underline font-semibold">open it here ↗</a>';
            });
        }

        function onYtStateChange(event) {
            const msg = document.getElementById('video-msg');
            if (event.data === YT.PlayerState.PLAYING) {
                if (ytPollInterval) clearInterval(ytPollInterval);
                if (ytCurrentConfig && ytCurrentConfig.checkpoints.length) ytPollInterval = setInterval(checkVideoCheckpoints, 400);
                if (msg) msg.textContent = '';
            } else if (event.data === YT.PlayerState.PAUSED || event.data === YT.PlayerState.ENDED) {
                if (ytPollInterval) { clearInterval(ytPollInterval); ytPollInterval = null; }
                if (event.data === YT.PlayerState.ENDED) {
                    const got = award(unitKey('video-' + ytCurrentConfig.id), 5);
                    markActivityComplete('video');
                    if (msg) msg.textContent = '🎉 Great job watching the whole video!' + (got ? ' (+5 ⭐)' : '');
                }
