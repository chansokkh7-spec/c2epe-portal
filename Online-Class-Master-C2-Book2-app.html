    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap');
        body { font-family: 'Poppins', sans-serif; }
        /* Flip-card for Listening: front = word, back = picture. */
        .flip-card { perspective: 1000px; height: 100px; cursor: pointer; }
        .flip-card-inner {
            position: relative; width: 100%; height: 100%;
            transition: transform 0.5s; transform-style: preserve-3d;
        }
        .flip-card.flipped .flip-card-inner { transform: rotateY(180deg); }
        .flip-card-front, .flip-card-back {
            position: absolute; width: 100%; height: 100%;
            backface-visibility: hidden; border-radius: 0.75rem;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 0.25rem;
        }
        .flip-card-back { transform: rotateY(180deg); }
        button:disabled { cursor: default; }
        /* phones: the lesson fills the screen, so jumping to it always shows it from the top,
           and the floating "Modules" button never covers the lesson's own buttons */
        @media (max-width: 767px) { #content-area { min-height: calc(100vh - 24px); padding-bottom: 76px; } }
    </style>
</head>

    <script>
        let state = {
            level: 'Master',
            unit: 1,
            tab: 'listening',
            stars: 0,
            badges: 0
        };

        const curriculum = {
            'Master': {
                1: { title: "Epistemological Frameworks", vocab: ["Rationalism", "Empiricism", "A priori", "A posteriori", "Foundationalism", "Coherentism", "Epistemic justification", "Skeptical inquiry", "Ontological", "Inference"], story: "Rationalism trusts a priori reason, while empiricism relies on a posteriori experience. Foundationalism and coherentism offer competing accounts of epistemic justification amid skeptical inquiry.", question: "Do you trust reason or experience more as a source of knowledge?", grammar: { point: "Abstract philosophical subordination", example: "Whether knowledge is justified depends on one's epistemic framework." } },
                2: { title: "Postcolonial Theory", vocab: ["Colonial legacy", "Subaltern", "Hybridity", "Othering", "Decolonization", "Cultural hegemony", "Orientalism", "Diasporic identity", "Agency", "Narrative voice"], story: "Postcolonial theory examines the colonial legacy and the voice of the subaltern. Hybridity and diasporic identity emerge from othering and cultural hegemony, central to decolonization and critiques like Orientalism.", question: "How does colonial history continue to shape identity today?", grammar: { point: "Passive nominal constructions", example: "Identity is often shaped by an unresolved colonial legacy." } },
                3: { title: "Advanced Negotiation Theory", vocab: ["BATNA", "Zone of possible agreement", "Integrative bargaining", "Distributive bargaining", "Anchoring", "Reservation price", "Value creation", "Negotiation leverage", "Counteroffer", "Deadlock"], story: "Knowing your BATNA and the zone of possible agreement strengthens any negotiation. Integrative bargaining creates value, while distributive bargaining and anchoring shift negotiation leverage around a reservation price.", question: "What negotiation strategy do you find most effective in complex deals?", grammar: { point: "Technical nominalization", example: "Value creation depends on understanding each party's BATNA." } },
                4: { title: "Cognitive Linguistics", vocab: ["Conceptual metaphor", "Semantic field", "Pragmatics", "Cognitive frame", "Linguistic relativity", "Prototype theory", "Embodied cognition", "Discourse marker", "Syntax", "Cognition"], story: "Conceptual metaphor and cognitive frames shape how we understand a semantic field. Linguistic relativity and prototype theory connect pragmatics to embodied cognition through subtle discourse markers.", question: "How might language shape the way people think?", grammar: { point: "Hypothetical linguistic reasoning", example: "Were linguistic relativity fully true, language would constrain thought." } },
                5: { title: "Global Governance", vocab: ["Supranational", "Multilateral institution", "Global commons", "Transnational governance", "Sovereignty erosion", "Global regime", "Collective action problem", "Institutional legitimacy", "Accountability gap", "Treaty body"], story: "Supranational bodies and multilateral institutions manage the global commons through transnational governance. Sovereignty erosion and a collective action problem challenge the institutional legitimacy of any global regime.", question: "Can global problems be solved without stronger global governance?", grammar: { point: "Complex passive constructions", example: "The global commons must be managed through shared institutions." } },
                6: { title: "Bioethics", vocab: ["Informed consent", "Genetic engineering", "Bodily autonomy", "Beneficence", "Non-maleficence", "Distributive justice", "Moral status", "Ethical dilemma", "Personhood", "Regulation gap"], story: "Informed consent and bodily autonomy are central to bioethics, alongside beneficence and non-maleficence. Genetic engineering raises questions of distributive justice, moral status, and unresolved ethical dilemma.", question: "What ethical limits, if any, should apply to genetic engineering?", grammar: { point: "Modal necessity in ethics", example: "Informed consent must be obtained before any procedure." } },
                7: { title: "Aesthetic Philosophy", vocab: ["Sublime", "Aesthetic judgment", "Formalism", "Mimesis", "Aesthetic experience", "Taste", "Beauty as subjective", "Artistic autonomy", "Sublimity", "Perception"], story: "Philosophers debate whether the sublime and beauty are objective or beauty as subjective experience. Formalism and mimesis offer different accounts of aesthetic judgment, taste, and artistic autonomy.", question: "Is beauty objective, or is it entirely in the eye of the beholder?", grammar: { point: "Abstract philosophical debate structures", example: "Whether beauty is objective remains a central aesthetic question." } },
                8: { title: "Futures Studies", vocab: ["Scenario planning", "Speculative futures", "Emerging trend", "Foresight", "Systemic risk", "Plausible future", "Strategic anticipation", "Long-term thinking", "Disruption risk", "Resilience planning"], story: "Scenario planning and foresight help organizations prepare for speculative futures. Identifying an emerging trend and systemic risk supports strategic anticipation and genuine long-term thinking about a plausible future.", question: "What plausible future do you think is most likely in the next 50 years?", grammar: { point: "Future perfect for long-range prediction", example: "By 2075, foresight practices will have transformed policy-making." } },
                9: { title: "Consciousness Studies", vocab: ["Consciousness", "Qualia", "Subjective experience", "Hard problem", "Awareness", "Perception", "Sentience", "Introspection"], story: "Consciousness studies grapple with the 'hard problem': explaining subjective experience and qualia through physical processes alone. Awareness, perception, and sentience remain deeply tied to introspection.", question: "Why do some philosophers call consciousness the 'hard problem'?", grammar: { point: "Nominalized abstract concepts", example: "The hard problem concerns the nature of subjective experience." }, value: "Intellectual Humility" },
                10: { title: "Metaphysics", vocab: ["Metaphysics", "Ontology", "Being", "Essence", "Existence", "Causality", "Substance", "Reality"], story: "Metaphysics questions the nature of being and existence, exploring ontology, essence, and causality. Debates about substance and ultimate reality continue across philosophical traditions.", question: "What do you think is the relationship between essence and existence?", grammar: { point: "Abstract noun subjects", example: "Existence precedes essence, according to some philosophers." }, value: "Philosophical Curiosity" },
                11: { title: "Philosophy of Science", vocab: ["Falsifiability", "Paradigm shift", "Empiricism", "Scientific method", "Theory", "Observation", "Objectivity", "Progress"], story: "The philosophy of science examines falsifiability as a criterion for genuine theory, and how a paradigm shift can redefine scientific progress. Empiricism grounds the scientific method in careful observation.", question: "What makes a scientific theory falsifiable, and why does that matter?", grammar: { point: "Criterion/condition clauses", example: "A theory is scientific only if it is falsifiable." }, value: "Scientific Literacy" },
                12: { title: "Complexity Theory", vocab: ["Complex system", "Emergence", "Nonlinearity", "Feedback loop", "Self-organization", "Chaos", "Adaptive system", "Interdependence"], story: "Complexity theory studies how a complex system exhibits emergence through nonlinearity and feedback loops. Self-organization and chaos reveal deep interdependence within an adaptive system.", question: "Can you think of a real-world example of an emergent, complex system?", grammar: { point: "Result of interaction language", example: "Emergence arises from the interaction of many parts." }, value: "Systems Thinking" },
                13: { title: "Systems Thinking", vocab: ["Systems thinking", "Feedback", "Interconnection", "Holistic view", "Leverage point", "Unintended consequence", "Boundary", "Dynamic equilibrium"], story: "Systems thinking takes a holistic view of feedback and interconnection, searching for a leverage point for change. Ignoring system boundaries often leads to unintended consequences and disrupted equilibrium.", question: "What is a 'leverage point' and why is it valuable in systems thinking?", grammar: { point: "Searching for / looking for + noun", example: "Systems thinkers search for the right leverage point." }, value: "Holistic Thinking" },
                14: { title: "Game Theory", vocab: ["Game theory", "Nash equilibrium", "Zero-sum game", "Payoff matrix", "Strategy", "Rational actor", "Cooperation", "Defection"], story: "Game theory models strategic interaction using tools like the Nash equilibrium and payoff matrix. Distinguishing a zero-sum game from cooperative strategy reveals when a rational actor might choose defection.", question: "What is an example of a real-life situation that resembles a game theory scenario?", grammar: { point: "Modeling language (models, represents, simulates)", example: "Game theory models how rational actors make strategic choices." }, value: "Strategic Reasoning" },
                15: { title: "Decision Theory", vocab: ["Decision theory", "Expected utility", "Risk aversion", "Bounded rationality", "Heuristic", "Uncertainty", "Trade-off", "Optimal choice"], story: "Decision theory studies expected utility and risk aversion under uncertainty. Bounded rationality explains why people rely on a heuristic rather than always making the optimal choice amid trade-offs.", question: "Why might someone rely on a heuristic instead of calculating the 'optimal' choice?", grammar: { point: "Rather than + gerund", example: "People often rely on heuristics rather than calculating perfectly." }, value: "Rational Reflection" },
                16: { title: "Ethics of AI", vocab: ["Algorithmic bias", "Accountability", "Transparency", "Autonomy", "AI alignment", "Moral agency", "Regulation", "Societal impact"], story: "The ethics of AI grapple with algorithmic bias and the need for accountability and transparency. Questions of machine autonomy and AI alignment raise deep concerns about moral agency and regulation.", question: "Who should be held accountable when an AI system causes harm?", grammar: { point: "Passive modal (should be held)", example: "Developers should be held accountable for algorithmic bias." }, value: "Ethical Responsibility" },
                17: { title: "Existentialism", vocab: ["Existentialism", "Authenticity", "Absurdism", "Radical freedom", "Bad faith", "Angst", "Self-determination", "Meaning-making"], story: "Existentialism emphasizes radical freedom and authenticity, warning against 'bad faith' self-deception. Absurdism and angst provoke deep meaning-making rooted in self-determination.", question: "How might an existentialist respond to the feeling that life lacks inherent meaning?", grammar: { point: "Subjunctive-style hypotheticals", example: "Were meaning not given, we would need to create it." }, value: "Authentic Living" },
                18: { title: "Phenomenology", vocab: ["Phenomenology", "Lived experience", "Intentionality", "Bracketing", "Perception", "First-person perspective", "Consciousness", "Embodiment"], story: "Phenomenology studies lived experience from a first-person perspective, using 'bracketing' to examine intentionality and perception directly. Embodiment ties consciousness to how we exist in the world.", question: "What does it mean to study experience from a 'first-person perspective'?", grammar: { point: "From a [X] perspective structures", example: "Phenomenology studies experience from a first-person perspective." }, value: "Reflective Awareness" },
                19: { title: "Critical Theory", vocab: ["Critical theory", "Power structure", "Emancipation", "Ideology critique", "Hegemony", "Social justice", "Praxis", "Liberation"], story: "Critical theory examines power structures through ideology critique, aiming toward emancipation and social justice. Praxis connects theory to action in the pursuit of genuine liberation.", question: "How does critical theory connect abstract ideas to real-world action?", grammar: { point: "Aim/goal infinitive clauses", example: "Critical theory aims to connect ideas with real action." }, value: "Social Justice" },
                20: { title: "Philosophy of Language", vocab: ["Meaning", "Reference", "Truth", "Speech act", "Context", "Ambiguity", "Pragmatics", "Interpretation"], story: "Philosophy of language asks how words carry meaning and reference. Speech act theory and pragmatics show that context shapes interpretation, and ambiguity is resolved by use.", question: "Can a sentence mean different things in different contexts?", grammar: {"point": "Abstract noun clauses", "example": "What a word means depends on how it is used."} },
                21: { title: "Philosophy of Mind", vocab: ["Mind", "Consciousness", "Dualism", "Materialism", "Brain", "Qualia", "Intentionality", "Identity"], story: "Philosophy of mind debates the link between mind and brain. Dualism separates them, materialism unites them, and puzzles about consciousness and qualia remain unresolved.", question: "Is the mind the same as the brain?", grammar: {"point": "Hypothetical subjunctive (as if / as though)", "example": "It seems as if consciousness were more than chemistry."} },
                22: { title: "Environmental Philosophy", vocab: ["Nature", "Intrinsic value", "Stewardship", "Anthropocentrism", "Ecology", "Responsibility", "Future generations", "Justice"], story: "Environmental philosophy challenges anthropocentrism by asking whether nature has intrinsic value. Ideas of stewardship and ecological justice stress our responsibility to future generations.", question: "Does nature have value beyond its usefulness to humans?", grammar: {"point": "Modal of necessity (need not / must not)", "example": "Value need not depend on usefulness."} },
                23: { title: "Philosophy of Education", vocab: ["Education", "Knowledge", "Curriculum", "Critical thinking", "Autonomy", "Purpose", "Pedagogy", "Citizenship"], story: "Philosophy of education asks what the purpose of learning is. Debates about curriculum and pedagogy weigh knowledge against critical thinking, autonomy and citizenship.", question: "What should be the main purpose of education?", grammar: {"point": "Whether... or... clauses", "example": "Whether education should prepare workers or citizens is debated."} },
                24: { title: "Buddhist Philosophy", vocab: ["Buddhism", "Impermanence", "Suffering", "Mindfulness", "Compassion", "Middle Way", "Non-self", "Ethics"], story: "Buddhist philosophy, central to Cambodian culture, teaches impermanence and the causes of suffering. The Middle Way, mindfulness, compassion and the idea of non-self guide ethics.", question: "How do Buddhist ideas influence daily life in Cambodia?", grammar: {"point": "Relative clauses with in which", "example": "It is a tradition in which compassion is central."} },
                25: { title: "Pragmatism", vocab: ["Pragmatism", "Practical", "Consequence", "Experience", "Truth", "Inquiry", "Usefulness", "Problem-solving"], story: "Pragmatism judges ideas by their practical consequence. For pragmatists, truth emerges through experience and inquiry, and usefulness in problem-solving is the test of an idea.", question: "Should ideas be judged by their results?", grammar: {"point": "Insofar as / to the extent that", "example": "An idea is true insofar as it works."} },
                26: { title: "Social Contract Theory", vocab: ["Social contract", "State", "Consent", "Rights", "Authority", "State of nature", "Obligation", "Legitimacy"], story: "Social contract theory explains the legitimacy of the state through consent. Thinkers imagined a state of nature and asked what rights, authority and obligation arise when people agree to be governed.", question: "Why do people accept the authority of governments?", grammar: {"point": "Were + to infinitive (hypothetical)", "example": "Were people to withdraw consent, authority would collapse."} },
                27: { title: "Logic and Paradox", vocab: ["Logic", "Paradox", "Premise", "Contradiction", "Validity", "Infinity", "Self-reference", "Reasoning"], story: "A paradox arises when valid reasoning from an accepted premise leads to contradiction. Paradoxes of infinity and self-reference test the limits of logic.", question: "Why are paradoxes valuable for thinking?", grammar: {"point": "Concessive clauses (However + adjective)", "example": "However convincing the premise, the conclusion is absurd."} },
                28: { title: "Philosophy of Happiness", vocab: ["Happiness", "Wellbeing", "Virtue", "Pleasure", "Meaning", "Flourishing", "Contentment", "Good life"], story: "Philosophers have long debated happiness. Some link it to pleasure, others to virtue, meaning and flourishing; many agree that contentment and wellbeing are part of a good life.", question: "What do you think makes a life good?", grammar: {"point": "Comparative correlatives", "example": "The more meaningful our work, the happier we become."} },
                29: { title: "Review: Thinking About Thinking", vocab: ["Metacognition", "Reflection", "Assumption", "Reasoning", "Bias", "Perspective", "Clarity", "Wisdom"], story: "Metacognition means thinking about our own thinking. Through reflection we uncover each assumption and bias, test our reasoning, consider other perspectives and seek clarity and wisdom.", question: "How do you check your own reasoning?", grammar: {"point": "Emphatic inversion (Only by...)", "example": "Only by reflecting can we recognise our biases."} },
            }
        };

        const WORD_EMOJI = {
            "Qualia": "🧠",
            "Hard problem": "🧩",
            "Introspection": "🪞",
            "Being": "🌌",
            "Essence": "💎",

        // ===== Progress: stars/badges are earned once per activity and remembered =====
        // Saved in this browser when the page is opened as a normal web page. Inside the Hub's
        // secure "Embed Code" box the browser blocks storage, so progress then lasts until the
        // page is closed — but it still can't be farmed by tapping the same button again.
        const PROGRESS_KEY = () => 'c2epe_onlineclass_master_C2_2_progress_' + state.level;
        let progress = { stars: 0, badges: 0, awarded: {}, best: {}, completed: {} };
        function loadProgress() {
            progress = { stars: 0, badges: 0, awarded: {}, best: {}, completed: {} };
            try {
                const saved = JSON.parse(localStorage.getItem(PROGRESS_KEY()) || 'null');
                if (saved && typeof saved === 'object') progress = Object.assign(progress, saved);
            } catch (e) { /* storage not available (e.g. inside the Hub sandbox) */ }
            state.stars = progress.stars; state.badges = progress.badges;
            document.getElementById('star-count').textContent = state.stars;
            document.getElementById('badge-count').textContent = state.badges;
        }
        function saveProgress() {
            progress.stars = state.stars; progress.badges = state.badges;
            try { localStorage.setItem(PROGRESS_KEY(), JSON.stringify(progress)); } catch (e) {}
        }
        const unitKey = (what) => 'u' + state.unit + '|' + what;
        const wasAwarded = (key) => !!progress.awarded[state.level + '|' + key];
        // Gives stars only the first time an activity is done. Returns true if stars were given.
        function award(key, amount) {
            const k = state.level + '|' + key;
            if (progress.awarded[k]) return false;
            progress.awarded[k] = true;
            addStars(amount);
            return true;
        }
        // Shows "(+3 ⭐)" the first time, and a friendly note afterwards
        const starNote = (given, amount) => given ? ` (+${amount} ⭐)` : ' (stars already earned)';

        function isRecentlyAdded(dateStr) {
            if (!dateStr) return false;
            const added = new Date(dateStr);
            if (isNaN(added.getTime())) return false;
            const daysSince = (Date.now() - added.getTime()) / (1000 * 60 * 60 * 24);
            return daysSince >= 0 && daysSince <= 7;
        }

        function populateUnitSelect() {

        function splitSentences(text) {

        let enVoice = null;
        function pickVoice() {
            if (!('speechSynthesis' in window)) return;
            enVoice = window.speechSynthesis.getVoices().find(v => v.lang && v.lang.startsWith('en')) || null;
        }
        if ('speechSynthesis' in window) { pickVoice(); window.speechSynthesis.onvoiceschanged = pickVoice; }
        function speak(text, onEnd) {
            if (!('speechSynthesis' in window)) { if (onEnd) onEnd(false); return false; }
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(text);
            u.lang = 'en-US';
            u.rate = 0.9;
            if (!enVoice) pickVoice();
            if (enVoice) u.voice = enVoice;
            if (onEnd) u.onend = () => onEnd(true);
            window.speechSynthesis.speak(u);
            return true;
        }

        function shuffle(arr) {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        // ---------- Pictures ----------
        // When two words in the SAME unit would show the same picture, the second one gets its
        // own picture here (only inside that unit), so children can tell them apart.
        const SAME_UNIT_ALT = {
            "Goodbye": "🚶👋", "Thank you": "💝", "Sorry": "😔", "Respect": "🫡", "Tomorrow": "⏭️",
            "West": "🌇", "East": "🌄", "North": "🧭", "Between": "🥪", "Early": "🐓", "Late": "⏰",
            "Swing": "🎠", "Poster": "🪧"
        };
        function baseEmoji(word) { return WORD_EMOJI[word] || '🖼️'; }
        function emojiFor(word, unitData) {
            const u = unitData || curriculum[state.level][state.unit];
            const e = baseEmoji(word);
            if (u && SAME_UNIT_ALT[word] && u.vocab.some(w => w !== word && baseEmoji(w) === e)) return SAME_UNIT_ALT[word];
            return e;
        }
        // Wrong answers for "look at the picture" questions never share the right answer's
        // picture, so there is always exactly one correct choice.
        function pictureDistractors(correct, pool, unitData, n) {
            const pic = emojiFor(correct, unitData);
            const ok = (w) => w !== correct && emojiFor(w, unitData) !== pic;
            let list = shuffle([...new Set(pool)].filter(ok)).slice(0, n);
            if (list.length < n) {
                const extra = shuffle(allVocabForLevel(state.level).filter(w => ok(w) && !list.includes(w)));
                list = list.concat(extra.slice(0, n - list.length));
            }
            return list;
        }

xperience."], [253.48, 254.96, "So who is right?"], [256.05, 265.13, "That is precisely what skeptical inquiry asks. Whether either camp has secure foundations is the question each must answer for itself."], [266.3, 267.97, "Part three: grammar."], [268.82, 272.75, "Grammar focus: Abstract philosophical subordination."], [273.06, 274.32, "Look at the pattern."], [275.02, 278.77, "Whether knowledge is justified depends on one's epistemic framework."], [279.68, 283.19, "That experience shapes belief is a central empiricist claim."], [284.08, 288.1, "What counts as evidence varies between philosophical traditions."], [289.07, 297.1, "At C2, a whole clause can be the subject: 'Whether…', 'That…', 'What…'. The verb that follows is singular and agrees with the entire clause, not its last noun."], [297.85, 302.11, "Be careful! Don't say: Is knowledge justified depends on the framework."], [304.07, 307.74, "Say: Whether knowledge is justified depends on the framework."], [308.04, 310.08, "Use 'whether' to make a noun clause."], [310.9, 313.68, "Part four: reading. Read and listen."], [314.47, 315.71, "What Can We Know?."], [316.01, 321.62, "Epistemology asks what knowledge is, how it is acquired and what justifies us in claiming it."], [322.63, 331.39, "Rationalists such as Descartes argued that reason alone yields a priori truths, whereas empiricists such as Locke insisted that all knowledge originates in experience."], [332.4, 341.05, "Foundationalism seeks secure basic beliefs on which everything else rests, while coherentism holds that beliefs are justified by how well they fit together."], [342.07, 349.82, "Whether any framework escapes skeptical inquiry remains disputed, yet the questioning itself sharpens our standards of justification."], [350.83, 356.9, "What we call knowledge, then, may be less a possession than a continuing practice of testing our inferences."], [358.0, 361.9, "Part five: quiz. Five questions. Are you ready?"], [362.75, 365.57, "blank knowledge is justified depends on the framework."], [365.87, 369.49, "A, Whether. B, Which. C, Despite."], [373.03, 374.78, "The answer is A: Whether."], [375.92, 378.51, "Knowledge gained through experience is called blank."], [378.81, 383.77, "A, a priori. B, ontological. C, a posteriori."], [387.33, 390.03, "The answer is C: a posteriori."], [391.18, 394.25, "The view that reason is the main source of knowledge is blank."], [394.55, 398.97, "A, rationalism. B, empiricism. C, coherentism."], [402.53, 405.11, "The answer is A: rationalism."], [406.25, 407.99, "Choose the correct sentence."], [408.29, 416.1, "A, That evidence is neutral are contested.. B, That evidence is neutral is contested.. C, That evidence neutral is contested.."], [419.67, 423.54, "The answer is B: That evidence is neutral is contested.."], [424.68, 428.89, "According to the reading, coherentism holds that beliefs are justified by…"], [429.19, 434.54, "A, secure foundations. B, sensory data. C, how well they fit together."], [438.1, 440.89, "The answer is C: how well they fit together."], [442.1, 445.55, "Part six: speaking. It's your turn to talk."], [446.42, 449.55, "Do you trust reason or experience more as a source of knowledge?"], [466.35, 467.81, "Now listen to Visal."], [468.12, 498.3, "I trust experience more, although I recognise that reason organises it. Whether a claim is true seems to me best settled by testing it against observation, because pure reasoning can drift away from reality. Mathematics is a priori, yet even mathematicians check their conjectures with examples. What convinces me most is a belief that survives repeated tests. Still, I accept that reason is needed to interpret what experience gives us."], [498.6, 500.22, "Excellent answer, Visal!"], [501.12, 506.11, "Great work! Now you can use ten new words and abstract philosophical subordination."], [506.41, 511.35, "Today's value is reasoned judgment. Weigh the evidence before you decide what to believe."], [511.65, 513.9, "See you in Unit two. Goodbye!"], [514.2, 517.05, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C2B2-Unit02-Postcolonial-Theory": [[0.35, 4.91, "Hello, everyone! I'm Ms. Emma. Welcome to Online C two, Book two."], [5.21, 8.85, "Hi! I'm Visal. Let's learn together!"], [9.15, 16.2, "Unit two: Postcolonial Theory. Today you will analyse identity using passive nominal constructions."], [16.5, 19.34, "Here is our lesson map. Let's start!"], [20.3, 23.61, "Part one: words. You will learn ten new words."], [24.45, 25.87, "Colonial legacy."], [26.88, 31.5, "Colonial legacy means the lasting social and political effects of colonial rule."], [32.08, 35.86, "The colonial legacy still shapes borders and languages across the region."], [36.45, 39.97, "Your turn. Say: Colonial legacy."], [42.83, 44.37, "Colonial legacy."], [45.12, 46.05, "Subaltern."], [47.05, 51.0, "Subaltern means a group excluded from power whose voice is rarely heard."], [51.62, 54.96, "Scholars ask whether the subaltern can truly speak."], [55.55, 58.13, "Your turn. Say: Subaltern."], [60.97, 61.89, "Subaltern."], [62.65, 63.74, "Hybridity."], [64.75, 68.35, "Hybridity means the mixing of cultures to form new identities."], [68.95, 71.87, "Hybridity is visible in food, language and art."], [72.48, 75.17, "Your turn. Say: Hybridity."], [78.03, 78.99, "Hybridity."], [79.75, 80.59, "Othering."], [81.58, 85.02, "Othering means treating a group as fundamentally different and lesser."], [85.62, 88.93, "Othering turns difference into a justification for domination."], [89.52, 91.89, "Your turn. Say: Othering."], [94.73, 95.63, "Othering."], [96.38, 97.8, "Decolonization."], [98.82, 103.51, "Decolonization means the process of undoing colonial control and its ideas."], [104.12, 108.54, "Decolonization includes reclaiming history, not just territory."], [109.15, 112.35, "Your turn. Say: Decolonization."], [115.2, 116.5, "Decolonization."], [117.25, 118.59, "Cultural hegemony."], [119.58, 124.56, "Cultural hegemony means dominance achieved by making one culture's values seem natural."], [125.15, 128.44, "Cultural hegemony makes dominance look like common sense."], [129.05, 132.38, "Your turn. Say: Cultural hegemony."], [135.23, 136.77, "Cultural hegemony."], [137.52, 138.66, "Orientalism."], [139.65, 145.72, "Orientalism means Western stereotypes that portray Eastern societies as exotic and inferior."], [146.32, 149.65, "Edward Said exposed orientalism in Western literature."], [150.25, 153.1, "Your turn. Say: Orientalism."], [155.93, 157.04, "Orientalism."], [157.78, 159.61, "Diasporic identity."], [160.62, 165.32, "Diasporic identity means a sense of self formed by living away from one's homeland."], [165.92, 169.04, "Diasporic identity blends loyalty to two places."], [169.65, 172.8, "Your turn. Say: Diasporic identity."], [175.67, 177.72, "Diasporic identity."], [178.48, 179.54, "Agency."], [180.55, 185.07, "Agency means the capacity to act independently and make one's own choices."], [185.68, 189.3, "Postcolonial writers restore agency to those once silenced."], [189.88, 192.54, "Your turn. Say: Agency."], [195.4, 196.38, "Agency."], [197.12, 198.62, "Narrative voice."], [199.62, 203.09, "Narrative voice means the perspective from which a story is told."], [203.68, 207.73, "A shift in narrative voice lets colonised people tell their own story."], [208.32, 211.64, "Your turn. Say: Narrative voice."], [214.5, 215.98, "Narrative voice."], [216.77, 220.79, "Part two: dialogue. Let's listen to a conversation."], [221.65, 226.6, "Visal, why do scholars still discuss colonialism when the empires ended decades ago?"], [227.68, 237.96, "Because identity is often shaped by an unresolved colonial legacy. Languages, borders and even school curricula were designed by colonisers."], [239.05, 241.26, "But people have moved on, surely."], [242.35, 252.89, "Politically, perhaps. Culturally, the subaltern is still rarely heard, and entire societies are frequently described through the eyes of outsiders."], [253.98, 255.39, "So what is the remedy?"], [256.48, 267.03, "It is argued that decolonization must be intellectual as well as political, and that local narratives should be given authority over imported ones."], [268.17, 269.82, "Part three: grammar."], [270.68, 274.54, "Grammar focus: Passive nominal constructions."], [274.84, 276.19, "Look at the pattern."], [276.88, 280.61, "Identity is often shaped by an unresolved colonial legacy."], [281.52, 284.88, "Local voices have long been silenced by cultural hegemony."], [285.78, 289.16, "History must be rewritten from the perspective of the colonised."], [290.1, 299.04, "The passive foregrounds what is affected and can omit the agent. Use 'by + agent' only when it matters: Borders were drawn (by whom?) without local consent."], [299.78, 304.69, "Be careful! Don't say: Identity shapes often by colonial legacy."], [306.63, 310.46, "Say: Identity is often shaped by colonial legacy."], [310.76, 313.46, "Passive = be + past participle."], [314.27, 316.84, "Part four: reading. Read and listen."], [317.63, 319.33, "Voices from the Margins."], [319.63, 326.63, "Postcolonial theory examines how colonial rule continues to shape culture, language and identity long after independence."], [327.63, 335.04, "Edward Said argued that Western writers had constructed an imagined 'Orient', which was portrayed as exotic, static and inferior."], [336.03, 342.71, "Such othering was justified by cultural hegemony, through which the coloniser's values were presented as universal and natural."], [343.7, 352.21, "In response, writers have been recovering narrative voice for the subaltern, and hybridity has been celebrated as a creative force rather than a loss of authenticity."], [353.2, 359.27, "Decolonization is therefore understood not as a single event but as a continuing struggle to restore agency."], [360.37, 364.81, "Part five: quiz. Five questions. Are you ready?"], [365.65, 367.92, "Identity blank by colonial history."], [368.22, 372.19, "A, shapes. B, is often shaped. C, has shape."], [375.73, 377.83, "The answer is B: is often shaped."], [378.98, 382.07, "A group excluded from power and rarely heard is blank."], [382.37, 386.31, "A, hybrid. B, diasporic. C, subaltern."], [389.87, 392.06, "The answer is C: subaltern."], [393.22, 396.39, "Treating a group as fundamentally different and lesser is blank."], [396.69, 400.53, "A, othering. B, agency. C, hybridity."], [404.07, 405.75, "The answer is A: othering."], [406.92, 408.57, "Choose the correct passive."], [408.87, 415.31, "A, Borders were drawn without consent.. B, Borders drew without consent.. C, Borders were drawing without consent.."], [418.87, 422.03, "The answer is A: Borders were drawn without consent.."], [423.18, 426.77, "According to the reading, decolonization is understood as…"], [427.07, 432.27, "A, a single event. B, a continuing struggle. C, a finished process."], [435.83, 438.83, "The answer is B: a continuing struggle."], [440.03, 443.29, "Part six: speaking. It's your turn to talk."], [444.15, 447.59, "How does colonial history continue to shape identity today?"], [464.38, 465.71, "Now listen to Visal."], [466.01, 503.33, "Colonial history shapes identity today through language, education and the stories societies tell about themselves. Many curricula were designed by outsiders, so young people sometimes learn their history as spectators rather than participants. Borders drawn without local consent still cause conflict. At the same time, hybridity has produced remarkable creativity in food, music and literature. I believe the healthiest response is neither denial nor resentment, but a confident reclaiming of narrative voice."], [503.63, 505.32, "Excellent answer, Visal!"], [506.22, 510.8, "Great work! Now you can use ten new words and passive nominal constructions."], [511.1, 516.33, "Today's value is historical awareness. Know the past so you can understand the present."], [516.63, 519.23, "See you in Unit three. Goodbye!"], [519.53, 522.21, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C2B2-Unit03-Advanced-Negotiation-Theory": [[0.35, 5.0, "Hello, everyone! I'm Ms. Emma. Welcome to Online C two, Book two."], [5.3, 8.71, "Hi! I'm Visal. Let's learn together!"], [9.01, 15.52, "Unit three: Advanced Negotiation Theory. Today you will analyse deals using technical nominalization."], [15.82, 18.68, "Here is our lesson map. Let's start!"], [19.63, 22.8, "Part one: words. You will learn ten new words."], [23.65, 24.44, "BATNA."], [25.45, 28.87, "BATNA means your best alternative to a negotiated agreement."], [29.45, 32.42, "Her strong BATNA let her walk away from the first offer."], [33.02, 35.24, "Your turn. Say: BATNA."], [38.1, 38.91, "BATNA."], [39.65, 41.43, "Zone of possible agreement."], [42.42, 46.55, "Zone of possible agreement means the range in which both sides can accept a deal."], [47.15, 51.17, "No zone of possible agreement existed, so talks collapsed."], [51.78, 55.07, "Your turn. Say: Zone of possible agreement."], [57.93, 59.89, "Zone of possible agreement."], [60.65, 62.01, "Integrative bargaining."], [63.02, 67.44, "Integrative bargaining means negotiating to create value that benefits both parties."], [68.05, 71.4, "Integrative bargaining turned a dispute into a partnership."], [71.98, 75.09, "Your turn. Say: Integrative bargaining."], [77.93, 79.52, "Integrative bargaining."], [80.25, 81.66, "Distributive bargaining."], [82.65, 88.1, "Distributive bargaining means negotiating over a fixed amount where one side's gain is the other's loss."], [88.68, 91.24, "Haggling over a price is distributive bargaining."], [91.85, 94.64, "Your turn. Say: Distributive bargaining."], [97.5, 99.27, "Distributive bargaining."], [100.02, 100.87, "Anchoring."], [101.88, 106.16, "Anchoring means setting a first number that influences all later offers."], [106.75, 109.7, "Anchoring high shifted the whole negotiation upward."], [110.32, 112.88, "Your turn. Say: Anchoring."], [115.73, 116.55, "Anchoring."], [117.28, 118.83, "Reservation price."], [119.82, 123.96, "Reservation price means the worst deal a party will accept before walking away."], [124.55, 128.05, "The buyer's reservation price was well below the asking price."], [128.65, 131.47, "Your turn. Say: Reservation price."], [134.3, 136.3, "Reservation price."], [137.05, 138.25, "Value creation."], [139.25, 143.06, "Value creation means finding trades that make both sides better off."], [143.65, 147.29, "Value creation required understanding what each side truly needed."], [147.88, 151.12, "Your turn. Say: Value creation."], [153.97, 155.19, "Value creation."], [155.95, 157.74, "Negotiation leverage."], [158.75, 163.18, "Negotiation leverage means the power to influence the outcome of a negotiation."], [163.78, 167.26, "A rival bid gave her considerable negotiation leverage."], [167.85, 171.27, "Your turn. Say: Negotiation leverage."], [174.13, 175.85, "Negotiation leverage."], [176.62, 177.75, "Counteroffer."], [178.75, 182.22, "Counteroffer means a new proposal made in response to an offer."], [182.82, 185.61, "He rejected the terms and submitted a counteroffer."], [186.22, 188.93, "Your turn. Say: Counteroffer."], [191.77, 192.83, "Counteroffer."], [193.58, 194.41, "Deadlock."], [195.42, 199.1, "Deadlock means a situation in which no progress is possible."], [199.68, 202.65, "The talks reached a deadlock over a single clause."], [203.25, 206.01, "Your turn. Say: Deadlock."], [208.87, 209.8, "Deadlock."], [210.6, 214.27, "Part two: dialogue. Let's listen to a conversation."], [215.12, 220.02, "Visal, we lost the contract talks. Their final offer was simply too low."], [221.12, 227.3, "Did you consider your BATNA before the meeting? Without a credible alternative, your leverage was limited."], [228.38, 231.36, "We focused on price and ignored everything else."], [232.45, 243.53, "That was the mistake. Treating the deal as distributive bargaining overlooked opportunities for value creation through delivery terms and payment schedules."], [244.62, 247.25, "So the negotiation could have been expanded?"], [248.35, 255.88, "Precisely. The expansion of the issues often widens the zone of possible agreement and reduces the risk of deadlock."], [257.03, 258.49, "Part three: grammar."], [259.35, 262.37, "Grammar focus: Technical nominalization."], [262.67, 263.89, "Look at the pattern."], [264.58, 267.8, "Value creation depends on understanding each party's BATNA."], [268.72, 271.98, "The expansion of issues reduces the risk of deadlock."], [272.88, 276.04, "Early anchoring strengthens a negotiator's leverage."], [277.0, 289.13, "Turn actions into nouns for a formal, technical register: negotiate → negotiation, expand → expansion, anchor → anchoring. The noun phrase becomes the subject of the sentence."], [289.88, 294.82, "Be careful! Don't say: Value creation depends on understand BATNA."], [296.77, 300.51, "Say: Value creation depends on understanding BATNA."], [300.81, 303.21, "After a preposition use a noun or -ing."], [304.0, 306.81, "Part four: reading. Read and listen."], [307.6, 309.34, "The Architecture of a Deal."], [309.64, 319.61, "Negotiation theory distinguishes between distributive bargaining, in which a fixed resource is divided, and integrative bargaining, in which the available value is expanded."], [320.6, 328.94, "Skilled negotiators therefore begin by assessing their BATNA, because the strength of an alternative determines how much leverage they genuinely possess."], [329.93, 337.01, "Anchoring, the practice of making the first offer, can shape the entire subsequent discussion, even when the figure is arbitrary."], [338.0, 344.93, "The identification of shared interests widens the zone of possible agreement, whereas rigid positions make deadlock more likely."], [345.93, 352.3, "Value creation, not victory over the other side, is consequently regarded as the mark of expert negotiation."], [353.4, 357.33, "Part five: quiz. Five questions. Are you ready?"], [358.18, 360.74, "The blank of issues widens the zone of agreement."], [361.04, 364.75, "A, expand. B, expansion. C, expanded."], [368.3, 370.18, "The answer is B: expansion."], [371.35, 374.96, "Your best alternative to a negotiated agreement is your blank."], [375.26, 379.26, "A, BATNA. B, anchor. C, counteroffer."], [382.8, 384.42, "The answer is A: BATNA."], [385.55, 388.47, "Setting a first number that shapes later offers is blank."], [388.77, 392.05, "A, deadlock. B, anchoring. C, leverage."], [395.6, 397.44, "The answer is B: anchoring."], [398.58, 399.86, "Which is more formal?"], [400.16, 409.18, "A, We negotiate well when we understand needs.. B, Effective negotiation depends on understanding needs.. C, Good negotiating is when you know needs.."], [412.73, 417.07, "The answer is B: Effective negotiation depends on understanding needs.."], [418.22, 421.8, "According to the reading, expert negotiation is marked by…"], [422.1, 427.68, "A, victory over the other side. B, rigid positions. C, value creation."], [431.23, 433.38, "The answer is C: value creation."], [434.6, 437.68, "Part six: speaking. It's your turn to talk."], [438.52, 442.69, "What negotiation strategy do you find most effective in complex deals?"], [459.48, 460.91, "Now listen to Visal."], [461.21, 493.11, "In complex deals I find integrative bargaining the most effective strategy, because it enlarges the pie instead of fighting over its size. Before any meeting, I clarify my BATNA and try to identify the other side's priorities. Often what matters to them costs me little, and vice versa. By trading across several issues, we widen the zone of possible agreement. This approach also preserves the relationship, which is valuable when the parties must work together afterwards."], [493.41, 495.07, "Excellent answer, Visal!"], [495.98, 500.78, "Great work! Now you can use ten new words and technical nominalization."], [501.08, 506.39, "Today's value is principled negotiation. Seek agreements that serve both sides fairly."], [506.69, 509.37, "See you in Unit four. Goodbye!"], [509.67, 512.91, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C2B2-Unit04-Cognitive-Linguistics": [[0.35, 5.0, "Hello, everyone! I'm Ms. Emma. Welcome to Online C two, Book two."], [5.3, 8.61, "Hi! I'm Visal. Let's learn together!"], [8.91, 15.1, "Unit four: Cognitive Linguistics. Today you will reason about language using hypothetical inversion."], [15.4, 18.06, "Here is our lesson map. Let's start!"], [19.0, 22.07, "Part one: words. You will learn ten new words."], [22.92, 24.53, "Conceptual metaphor."], [25.52, 30.35, "Conceptual metaphor means a mapping from one idea onto another, as in 'time is money'."], [30.95, 34.06, "'Argument is war' is a conceptual metaphor in English."], [34.65, 37.79, "Your turn. Say: Conceptual metaphor."], [40.63, 42.3, "Conceptual metaphor."], [43.05, 44.38, "Semantic field."], [45.38, 48.54, "Semantic field means a group of words related in meaning."], [49.15, 52.05, "'Doctor', 'nurse' and 'ward' belong to one semantic field."], [52.65, 55.55, "Your turn. Say: Semantic field."], [58.4, 59.7, "Semantic field."], [60.45, 61.66, "Pragmatics."], [62.65, 67.1, "Pragmatics means the study of how context affects meaning in communication."], [67.68, 71.52, "Pragmatics explains why 'Can you pass the salt?' is a request."], [72.12, 74.5, "Your turn. Say: Pragmatics."], [77.37, 78.55, "Pragmatics."], [79.32, 80.64, "Cognitive frame."], [81.65, 85.94, "Cognitive frame means a mental structure that shapes how we interpret events."], [86.55, 89.8, "The phrase 'tax relief' activates a cognitive frame of burden."], [90.42, 93.28, "Your turn. Say: Cognitive frame."], [96.13, 97.51, "Cognitive frame."], [98.25, 99.99, "Linguistic relativity."], [100.98, 105.15, "Linguistic relativity means the idea that language influences thought."], [105.75, 110.45, "Linguistic relativity is also known as the Sapir-Whorf hypothesis."], [111.05, 114.2, "Your turn. Say: Linguistic relativity."], [117.07, 118.94, "Linguistic relativity."], [119.68, 121.02, "Prototype theory."], [122.02, 127.33, "Prototype theory means the idea that categories are organised around typical examples."], [127.92, 131.9, "By prototype theory, a robin is a better 'bird' than a penguin."], [132.52, 135.46, "Your turn. Say: Prototype theory."], [138.3, 139.73, "Prototype theory."], [140.48, 142.03, "Embodied cognition."], [143.02, 147.26, "Embodied cognition means the theory that thinking is shaped by the body's experience."], [147.85, 151.91, "Embodied cognition explains why 'grasping' an idea feels natural."], [152.52, 156.04, "Your turn. Say: Embodied cognition."], [158.9, 160.42, "Embodied cognition."], [161.18, 162.42, "Discourse marker."], [163.42, 167.85, "Discourse marker means a word that organises talk, such as 'well' or 'anyway'."], [168.45, 171.73, "Overusing the discourse marker 'like' can distract listeners."], [172.32, 175.35, "Your turn. Say: Discourse marker."], [178.2, 179.64, "Discourse marker."], [180.38, 181.44, "Syntax."], [182.45, 186.24, "Syntax means the rules governing how words combine into sentences."], [186.85, 189.51, "Khmer and English differ greatly in syntax."], [190.12, 192.76, "Your turn. Say: Syntax."], [195.6, 196.72, "Syntax."], [197.48, 198.48, "Cognition."], [199.48, 203.39, "Cognition means the mental processes of knowing, thinking and perceiving."], [203.98, 206.62, "Language and cognition influence one another."], [207.22, 209.75, "Your turn. Say: Cognition."], [212.6, 213.69, "Cognition."], [214.5, 218.45, "Part two: dialogue. Let's listen to a conversation."], [219.32, 222.69, "Visal, does the language we speak actually change how we think?"], [223.78, 231.69, "That is the question of linguistic relativity. Were it fully true, language would constrain thought entirely."], [232.78, 234.4, "And is it fully true?"], [235.48, 245.76, "Few believe so. Were speakers truly trapped by their vocabulary, translation would be impossible, yet it plainly happens every day."], [246.85, 248.51, "So the effect is partial?"], [249.62, 261.35, "Exactly. Had researchers claimed total determinism, they would have been refuted long ago. Subtle influence on attention and memory is far more defensible."], [262.5, 264.04, "Part three: grammar."], [264.88, 268.14, "Grammar focus: Hypothetical linguistic reasoning."], [268.44, 269.59, "Look at the pattern."], [270.28, 274.28, "Were linguistic relativity fully true, language would constrain thought."], [275.18, 278.91, "Had researchers claimed total determinism, they would have been refuted."], [279.82, 283.48, "Should the evidence prove robust, theories would need revising."], [284.43, 293.94, "Drop 'if' and invert: Were it true (= If it were true), Had she known (= If she had known), Should you need help (= If you should need help). It sounds formal and precise."], [294.68, 299.07, "Be careful! Don't say: Was language fully free, thought would be free."], [301.0, 304.58, "Say: Were language fully free, thought would be free."], [304.88, 307.25, "Inversion uses 'were' for all persons."], [308.03, 310.92, "Part four: reading. Read and listen."], [311.73, 313.15, "Language and Thought."], [313.45, 320.01, "Cognitive linguistics studies how language reflects, and perhaps shapes, the ways in which humans conceptualise the world."], [321.0, 327.9, "Lakoff and Johnson demonstrated that everyday speech is saturated with conceptual metaphor, such as the treatment of argument as war."], [328.9, 335.51, "Prototype theory suggests that categories are not defined by strict boundaries but organised around typical examples."], [336.5, 344.65, "Were linguistic relativity fully true, speakers of different languages would be unable to understand one another, yet translation succeeds daily."], [345.67, 353.47, "Most researchers therefore defend a weaker claim: that language subtly influences attention and memory without determining thought."], [354.57, 358.7, "Part five: quiz. Five questions. Are you ready?"], [359.55, 362.8, "blank the theory fully true, language would constrain thought."], [363.1, 366.07, "A, Was. B, Were. C, Is."], [369.63, 371.2, "The answer is B: Were."], [372.35, 375.79, "A word that organises talk, such as 'anyway', is a blank."], [376.09, 381.07, "A, discourse marker. B, prototype. C, semantic field."], [384.6, 387.16, "The answer is A: discourse marker."], [388.32, 391.08, "The idea that language influences thought is blank."], [391.38, 396.24, "A, syntax. B, embodied cognition. C, linguistic relativity."], [399.8, 402.8, "The answer is C: linguistic relativity."], [403.95, 405.83, "Choose the correct inversion."], [406.13, 413.7, "A, Had researchers known, they would have acted.. B, Had researchers knew, they would acted.. C, Have researchers known, they would act.."], [417.23, 420.72, "The answer is A: Had researchers known, they would have acted.."], [421.88, 424.57, "According to the reading, most researchers defend…"], [424.87, 429.83, "A, total determinism. B, a weaker claim. C, no effect at all."], [433.37, 435.75, "The answer is B: a weaker claim."], [436.93, 440.17, "Part six: speaking. It's your turn to talk."], [441.02, 443.33, "How might language shape the way people think?"], [460.12, 461.68, "Now listen to Visal."], [461.98, 492.69, "Language probably shapes thought in subtle ways, mainly by directing attention. Were it the whole story, translation would be impossible, so I reject the strongest version. However, conceptual metaphors such as 'time is money' clearly influence how we treat time. Words also create cognitive frames: calling a policy a 'burden' or an 'investment' changes our reaction. Language therefore guides thinking without imprisoning it."], [492.99, 494.75, "Excellent answer, Visal!"], [495.65, 500.51, "Great work! Now you can use ten new words and hypothetical linguistic reasoning."], [500.81, 506.14, "Today's value is linguistic awareness. Notice how the words you choose shape the way you think."], [506.44, 508.97, "See you in Unit five. Goodbye!"], [509.27, 512.79, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C2B2-Unit05-Global-Governance": [[0.35, 5.07, "Hello, everyone! I'm Ms. Emma. Welcome to Online C two, Book two."], [5.37, 9.1, "Hi! I'm Visal. Let's learn together!"], [9.39, 16.6, "Unit five: Global Governance. Today you will discuss institutions using complex passive constructions."], [16.9, 19.64, "Here is our lesson map. Let's start!"], [20.6, 23.94, "Part one: words. You will learn ten new words."], [24.78, 25.95, "Supranational."], [26.95, 31.02, "Supranational means having authority that goes beyond individual nations."], [31.62, 34.88, "The European Union is a supranational organisation."], [35.48, 37.94, "Your turn. Say: Supranational."], [40.8, 42.0, "Supranational."], [42.75, 44.76, "Multilateral institution."], [45.75, 50.99, "Multilateral institution means an organisation in which several states cooperate."], [51.58, 55.15, "The United Nations is the best-known multilateral institution."], [55.75, 59.31, "Your turn. Say: Multilateral institution."], [62.17, 64.26, "Multilateral institution."], [65.02, 66.23, "Global commons."], [67.22, 71.76, "Global commons means resources shared by all, such as the oceans and atmosphere."], [72.35, 75.12, "The global commons belong to no single nation."], [75.72, 78.39, "Your turn. Say: Global commons."], [81.23, 82.71, "Global commons."], [83.45, 85.14, "Transnational governance."], [86.15, 91.28, "Transnational governance means rule-making that crosses borders and involves non-state actors."], [91.88, 95.25, "Transnational governance now regulates shipping and the internet."], [95.85, 98.98, "Your turn. Say: Transnational governance."], [101.83, 103.7, "Transnational governance."], [104.45, 105.86, "Sovereignty erosion."], [106.85, 111.26, "Sovereignty erosion means the gradual loss of a state's independent authority."], [111.85, 116.36, "Critics fear sovereignty erosion when treaties limit national choices."], [116.95, 119.92, "Your turn. Say: Sovereignty erosion."], [122.77, 124.23, "Sovereignty erosion."], [124.98, 126.31, "Global regime."], [127.32, 131.89, "Global regime means a set of rules and norms that guides states in one area."], [132.48, 135.95, "The global regime on trade is overseen by the WTO."], [136.55, 139.6, "Your turn. Say: Global regime."], [142.43, 143.77, "Global regime."], [144.52, 146.1, "Collective action problem."], [147.08, 151.97, "Collective action problem means a situation where individual self-interest harms the group."], [152.58, 155.51, "Climate change is a classic collective action problem."], [156.12, 159.68, "Your turn. Say: Collective action problem."], [162.53, 164.27, "Collective action problem."], [165.02, 166.98, "Institutional legitimacy."], [167.98, 173.19, "Institutional legitimacy means the widely accepted right of an institution to make decisions."], [173.78, 177.84, "Institutional legitimacy depends on fairness and transparency."], [178.45, 181.95, "Your turn. Say: Institutional legitimacy."], [184.8, 186.71, "Institutional legitimacy."], [187.45, 188.91, "Accountability gap."], [189.92, 194.99, "Accountability gap means a lack of effective ways to hold decision-makers responsible."], [195.58, 199.56, "An accountability gap emerged when no body could sanction offenders."], [200.15, 203.36, "Your turn. Say: Accountability gap."], [206.2, 207.62, "Accountability gap."], [208.38, 209.37, "Treaty body."], [210.38, 214.16, "Treaty body means a committee that monitors how states follow a treaty."], [214.75, 217.94, "A treaty body reviews each country's human rights record."], [218.55, 221.41, "Your turn. Say: Treaty body."], [224.27, 225.41, "Treaty body."], [226.2, 229.92, "Part two: dialogue. Let's listen to a conversation."], [230.78, 234.66, "Visal, why can't countries simply solve climate change on their own?"], [235.75, 245.28, "Because it is a collective action problem. The global commons must be managed through shared institutions, or each state free-rides."], [246.38, 249.11, "Then why not give those institutions real power?"], [250.22, 258.85, "Sovereignty is zealously guarded. It is feared that supranational authority would be imposed on nations that have never consented to it."], [259.95, 261.18, "So we are stuck?"], [262.28, 273.56, "Not entirely. Legitimacy can be built if decisions are made transparently, and if accountability gaps are closed by treaty bodies that can actually be heard."], [274.7, 276.49, "Part three: grammar."], [277.35, 280.79, "Grammar focus: Complex passive constructions."], [281.09, 282.39, "Look at the pattern."], [283.08, 286.52, "The global commons must be managed through shared institutions."], [287.42, 290.24, "It has been argued that sovereignty is being eroded."], [291.15, 293.94, "Decisions ought to have been made more transparently."], [294.9, 304.09, "Combine modal + passive: must be managed, should have been resolved, is being eroded. The structure packs time, obligation and responsibility into one verb group."], [304.85, 309.72, "Be careful! Don't say: The commons must manage through institutions."], [311.67, 315.5, "Say: The commons must be managed through institutions."], [315.8, 318.73, "Modal passive: must be + p.p."], [319.53, 322.28, "Part four: reading. Read and listen."], [323.07, 324.45, "Who Governs the World?."], [324.75, 332.93, "No world government exists, yet cross-border problems such as pandemics, pollution and financial crises demand coordinated responses."], [333.93, 341.25, "Multilateral institutions have therefore been created, and global regimes have been negotiated to govern trade, health and the oceans."], [342.27, 349.35, "Because the global commons cannot be protected by any single state, collective action problems must be solved through binding agreements."], [350.37, 356.99, "However, it is often claimed that sovereignty is being eroded, and legitimacy is frequently questioned when accountability gaps appear."], [358.0, 366.23, "Whether global institutions can be reformed without being captured by powerful states remains one of the central questions of international politics."], [367.33, 371.42, "Part five: quiz. Five questions. Are you ready?"], [372.25, 375.08, "The commons blank managed through shared institutions."], [375.38, 379.58, "A, must be. B, must. C, must been."], [383.13, 385.14, "The answer is A: must be."], [386.28, 388.89, "Resources shared by all nations are the blank."], [389.19, 393.36, "A, treaty body. B, global commons. C, regime."], [396.9, 399.76, "The answer is B: global commons."], [400.92, 404.65, "A situation where self-interest harms the group is a blank problem."], [404.95, 409.42, "A, supranational. B, collective action. C, legitimate."], [412.97, 415.33, "The answer is B: collective action."], [416.48, 418.19, "Choose the correct passive."], [418.49, 426.92, "A, It has been argued that rules should reform.. B, It has argued that rules should be reformed.. C, It has been argued that rules should be reformed.."], [430.47, 434.36, "The answer is C: It has been argued that rules should be reformed.."], [435.52, 438.51, "According to the reading, legitimacy is questioned when…"], [438.81, 444.89, "A, institutions are transparent. B, accountability gaps appear. C, treaties are signed."], [448.43, 451.61, "The answer is B: accountability gaps appear."], [452.8, 456.08, "Part six: speaking. It's your turn to talk."], [456.92, 460.69, "Can global problems be solved without stronger global governance?"], [477.48, 478.91, "Now listen to Visal."], [479.21, 514.37, "I doubt that serious global problems can be solved without stronger governance, although it must be built carefully. Climate change shows why: every country benefits if others cut emissions, so voluntary action stalls. Binding agreements and credible institutions are needed to overcome that collective action problem. However, such bodies must be accountable and transparent, or their legitimacy will erode. Stronger governance should therefore be combined with real democratic oversight."], [514.67, 516.33, "Excellent answer, Visal!"], [517.25, 521.85, "Great work! Now you can use ten new words and complex passive constructions."], [522.15, 527.24, "Today's value is global cooperation. Shared problems need shared solutions."], [527.54, 530.15, "See you in Unit six. Goodbye!"], [530.45, 532.85, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C2B2-Unit06-Bioethics": [[0.35, 5.52, "Hello, everyone! I'm Ms. Emma. Welcome to Online C two, Book two."], [5.82, 9.12, "Hi! I'm Visal. Let's learn together!"], [9.42, 14.89, "Unit six: Bioethics. Today you will debate medical ethics using modal necessity."], [15.19, 17.89, "Here is our lesson map. Let's start!"], [18.83, 22.14, "Part one: words. You will learn ten new words."], [22.98, 24.45, "Informed consent."], [25.45, 30.56, "Informed consent means a patient's voluntary agreement to treatment after understanding the risks."], [31.15, 34.4, "Informed consent was obtained before the operation began."], [35.02, 38.34, "Your turn. Say: Informed consent."], [41.2, 42.63, "Informed consent."], [43.38, 44.73, "Genetic engineering."], [45.72, 50.0, "Genetic engineering means deliberately changing the DNA of an organism."], [50.62, 54.81, "Genetic engineering could cure inherited diseases, but it raises fears."], [55.42, 58.39, "Your turn. Say: Genetic engineering."], [61.23, 62.63, "Genetic engineering."], [63.38, 64.67, "Bodily autonomy."], [65.68, 69.82, "Bodily autonomy means a person's right to govern what happens to their own body."], [70.42, 73.61, "Bodily autonomy underpins the right to refuse treatment."], [74.22, 77.34, "Your turn. Say: Bodily autonomy."], [80.2, 82.13, "Bodily autonomy."], [82.88, 84.08, "Beneficence."], [85.08, 88.48, "Beneficence means the duty to act for the benefit of others."], [89.08, 92.6, "Beneficence obliges doctors to promote their patients' wellbeing."], [93.22, 96.28, "Your turn. Say: Beneficence."], [99.13, 100.23, "Beneficence."], [100.98, 102.47, "Non-maleficence."], [103.48, 106.93, "Non-maleficence means the duty to avoid causing harm."], [107.55, 111.63, "Non-maleficence is often summarised as 'first, do no harm'."], [112.22, 115.34, "Your turn. Say: Non-maleficence."], [118.2, 119.83, "Non-maleficence."], [120.58, 122.23, "Distributive justice."], [123.25, 127.66, "Distributive justice means the fair allocation of resources and benefits."], [128.25, 132.18, "Distributive justice asks who should receive scarce organs first."], [132.78, 136.02, "Your turn. Say: Distributive justice."], [138.87, 140.39, "Distributive justice."], [141.15, 142.45, "Moral status."], [143.45, 147.81, "Moral status means the degree to which a being's interests deserve consideration."], [148.42, 151.9, "Debate continues over the moral status of an early embryo."], [152.52, 155.35, "Your turn. Say: Moral status."], [158.2, 159.62, "Moral status."], [160.38, 161.68, "Ethical dilemma."], [162.68, 167.13, "Ethical dilemma means a situation with two conflicting moral obligations."], [167.72, 171.56, "Whether to disclose a risky diagnosis posed an ethical dilemma."], [172.15, 175.2, "Your turn. Say: Ethical dilemma."], [178.03, 179.46, "Ethical dilemma."], [180.22, 181.22, "Personhood."], [182.22, 186.13, "Personhood means the status of being a person with full moral rights."], [186.72, 189.74, "Personhood is central to debates about the beginning of life."], [190.35, 192.76, "Your turn. Say: Personhood."], [195.6, 196.72, "Personhood."], [197.48, 198.87, "Regulation gap."], [199.88, 203.8, "Regulation gap means an area where technology has outpaced the law."], [204.38, 208.59, "A regulation gap left gene-editing clinics largely unsupervised."], [209.18, 212.59, "Your turn. Say: Regulation gap."], [215.43, 216.82, "Regulation gap."], [217.63, 221.02, "Part two: dialogue. Let's listen to a conversation."], [221.88, 227.18, "Visal, a clinic offered to edit my cousin's embryo to prevent a disease. Should that be allowed?"], [228.28, 237.17, "That is a profound ethical dilemma. Informed consent must be obtained before any procedure, but an embryo cannot give it."], [238.28, 239.75, "Then the parents decide?"], [240.85, 251.51, "Perhaps, but they need not have unlimited authority. Procedures that alter future generations must be justified by serious medical need, not preference."], [252.62, 254.41, "And who sets those limits?"], [255.52, 264.93, "Regulators must. Where a regulation gap exists, patients may be exploited, so oversight cannot be left to individual clinics."], [266.07, 267.58, "Part three: grammar."], [268.42, 271.72, "Grammar focus: Modal necessity in ethics."], [272.02, 273.19, "Look at the pattern."], [273.88, 277.16, "Informed consent must be obtained before any procedure."], [278.05, 281.0, "Doctors ought to respect their patients' bodily autonomy."], [281.92, 284.46, "Regulators should close the regulation gap."], [285.4, 294.31, "Moral necessity: must (strongest), ought to / should (strong advice). No 'to' after must and should. Use 'need not' to say something is not required."], [295.05, 299.04, "Be careful! Don't say: Consent must to be obtained first."], [301.0, 304.09, "Say: Consent must be obtained first."], [304.39, 306.19, "No 'to' after a modal verb."], [307.0, 309.84, "Part four: reading. Read and listen."], [310.63, 312.09, "The Limits of Medicine."], [312.39, 319.99, "Modern biotechnology allows interventions that earlier generations could scarcely have imagined, from gene editing to organ transplantation."], [321.0, 329.68, "Bioethics offers principles for evaluating them: respect for autonomy, beneficence, non-maleficence and distributive justice."], [330.67, 339.53, "Informed consent must be obtained, yet it cannot be given by embryos, children or those who lack capacity, which produces enduring ethical dilemmas."], [340.53, 347.04, "Questions of moral status and personhood divide thoughtful people, so that regulators must balance competing convictions."], [348.03, 356.13, "Because technology advances faster than legislation, a regulation gap may leave patients vulnerable unless the law is updated promptly."], [357.23, 361.33, "Part five: quiz. Five questions. Are you ready?"], [362.18, 365.11, "Informed consent blank be obtained before surgery."], [365.41, 368.73, "A, must. B, must to. C, musts."], [372.27, 373.92, "The answer is A: must."], [375.08, 377.65, "The duty to avoid causing harm is blank."], [377.95, 382.6, "A, beneficence. B, non-maleficence. C, personhood."], [386.17, 389.13, "The answer is B: non-maleficence."], [390.28, 393.79, "The fair allocation of scarce resources is blank justice."], [394.09, 397.92, "A, distributive. B, bodily. C, informed."], [401.47, 403.81, "The answer is A: distributive."], [404.95, 406.96, "Which means 'it is not required'?"], [407.26, 411.81, "A, You must not attend.. B, You need not attend.. C, You cannot attend.."], [415.37, 417.98, "The answer is B: You need not attend.."], [419.12, 422.1, "According to the reading, a regulation gap occurs when…"], [422.4, 428.67, "A, laws are too strict. B, technology outpaces legislation. C, patients refuse treatment."], [432.23, 435.79, "The answer is B: technology outpaces legislation."], [437.0, 440.02, "Part six: speaking. It's your turn to talk."], [440.88, 444.32, "What ethical limits, if any, should apply to genetic engineering?"], [461.12, 462.61, "Now listen to Visal."], [462.9, 498.57, "I believe genetic engineering should be permitted to prevent serious disease, but it must be strictly regulated. Informed consent is difficult when future generations are affected, so decisions need independent oversight. Enhancement for appearance or advantage is more troubling, because it threatens distributive justice: only the wealthy could afford it. Regulators ought to act before the technology spreads. Limits are not obstacles to progress; they are what make progress trustworthy."], [498.87, 500.61, "Excellent answer, Visal!"], [501.52, 505.77, "Great work! Now you can use ten new words and modal necessity in ethics."], [506.07, 510.59, "Today's value is moral courage. Do what is right even when it is difficult."], [510.89, 513.29, "See you in Unit seven. Goodbye!"], [513.59, 516.96, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C2B2-Unit07-Aesthetic-Philosophy": [[0.35, 5.26, "Hello, everyone! I'm Ms. Emma. Welcome to Online C two, Book two."], [5.56, 8.93, "Hi! I'm Visal. Let's learn together!"], [9.23, 16.76, "Unit seven: Aesthetic Philosophy. Today you will debate beauty using abstract philosophical debate structures."], [17.06, 19.68, "Here is our lesson map. Let's start!"], [20.63, 23.59, "Part one: words. You will learn ten new words."], [24.45, 25.38, "Sublime."], [26.38, 30.87, "Sublime means an experience of vastness or power that overwhelms and awes."], [31.48, 34.12, "Standing before the glacier, he felt the sublime."], [34.72, 37.36, "Your turn. Say: Sublime."], [40.2, 41.26, "Sublime."], [42.02, 43.32, "Aesthetic judgment."], [44.32, 48.39, "Aesthetic judgment means an evaluation of something as beautiful or ugly."], [48.98, 53.03, "An aesthetic judgment feels personal, yet we expect others to agree."], [53.62, 56.66, "Your turn. Say: Aesthetic judgment."], [59.5, 61.06, "Aesthetic judgment."], [61.82, 62.73, "Formalism."], [63.72, 68.72, "Formalism means the view that an artwork's value lies in its form, not its content."], [69.32, 72.81, "Formalism praised the painting's composition and ignored its subject."], [73.42, 75.95, "Your turn. Say: Formalism."], [78.8, 79.82, "Formalism."], [80.58, 81.72, "Mimesis."], [82.72, 86.93, "Mimesis means the imitation or representation of reality in art."], [87.55, 90.78, "Aristotle regarded mimesis as the basis of poetry."], [91.38, 94.04, "Your turn. Say: Mimesis."], [96.9, 98.08, "Mimesis."], [98.82, 100.44, "Aesthetic experience."], [101.45, 105.98, "Aesthetic experience means the special state of attention aroused by beauty or art."], [106.58, 110.6, "A concert can offer an aesthetic experience that words cannot capture."], [111.22, 114.75, "Your turn. Say: Aesthetic experience."], [117.6, 119.41, "Aesthetic experience."], [120.15, 121.03, "Taste."], [122.05, 125.97, "Taste means the ability to judge what is beautiful or of good quality."], [126.55, 129.63, "Hume argued that true taste is refined by experience."], [130.22, 132.6, "Your turn. Say: Taste."], [135.47, 136.31, "Taste."], [137.05, 138.56, "Beauty as subjective."], [139.55, 143.16, "Beauty as subjective means the view that beauty depends on the perceiver."], [143.75, 147.29, "Beauty as subjective explains why people admire different things."], [147.88, 150.85, "Your turn. Say: Beauty as subjective."], [153.7, 155.15, "Beauty as subjective."], [155.92, 157.5, "Artistic autonomy."], [158.48, 164.12, "Artistic autonomy means the freedom of art from moral, political or commercial purpose."], [164.72, 167.84, "Artistic autonomy was her defence against censorship."], [168.45, 171.68, "Your turn. Say: Artistic autonomy."], [174.53, 176.41, "Artistic autonomy."], [177.15, 178.19, "Sublimity."], [179.18, 182.96, "Sublimity means the quality of being grand and awe-inspiring."], [183.55, 186.44, "The sublimity of the mountains left the poet speechless."], [187.05, 189.54, "Your turn. Say: Sublimity."], [192.4, 193.46, "Sublimity."], [194.22, 195.17, "Perception."], [196.18, 199.43, "Perception means the way something is sensed and interpreted."], [200.02, 203.22, "Perception is shaped by culture as well as by the senses."], [203.82, 206.06, "Your turn. Say: Perception."], [208.9, 209.94, "Perception."], [210.73, 214.67, "Part two: dialogue. Let's listen to a conversation."], [215.52, 220.39, "Visal, my friend says Angkor Wat is objectively beautiful. Isn't beauty just opinion?"], [221.48, 232.83, "Whether beauty is objective remains a central aesthetic question. Kant held that judgments of taste claim universal agreement, despite being felt personally."], [233.92, 236.75, "How can a personal feeling claim universality?"], [237.85, 246.91, "That is precisely the puzzle. What distinguishes a judgment of beauty from a preference for ice cream is that we expect others to share it."], [248.02, 249.18, "And if they don't?"], [250.28, 262.13, "Then, according to Hume, either their taste is undeveloped or ours is. Whether such a standard exists at all is where the debate really begins."], [263.27, 264.69, "Part three: grammar."], [265.55, 269.94, "Grammar focus: Abstract philosophical debate structures."], [270.24, 271.39, "Look at the pattern."], [272.08, 275.36, "Whether beauty is objective remains a central aesthetic question."], [276.25, 279.1, "What makes a judgment aesthetic is still disputed."], [279.98, 283.05, "That taste can be educated raises a further question."], [284.0, 292.96, "Frame a debate with 'Whether…', 'What…', 'That…' as subject, then a verb of status: remains, is disputed, raises, poses. Singular verb after the clause."], [293.72, 297.89, "Be careful! Don't say: Whether beauty is objective remain open."], [299.83, 302.77, "Say: Whether beauty is objective remains open."], [303.07, 305.36, "A noun clause takes a singular verb."], [306.17, 308.78, "Part four: reading. Read and listen."], [309.6, 311.31, "In the Eye of the Beholder?."], [311.61, 316.42, "Aesthetics investigates the nature of beauty, art and the experiences they provoke."], [317.43, 326.77, "Subjectivists claim that beauty exists only in the perceiver, whereas objectivists argue that certain forms, proportions or qualities are beautiful regardless of opinion."], [327.77, 334.53, "Kant attempted to reconcile the two positions by arguing that aesthetic judgment is felt individually yet demands universal assent."], [335.53, 342.44, "Formalism values the arrangement of line and colour, while the theory of mimesis values the faithful representation of reality."], [343.43, 350.11, "Whether any account can fully capture the sublime, the awe aroused by vastness, may itself be a sign of its power."], [351.2, 355.07, "Part five: quiz. Five questions. Are you ready?"], [355.92, 358.42, "blank beauty is objective remains disputed."], [358.72, 362.32, "A, Whether. B, Unless. C, Despite."], [365.87, 367.97, "The answer is A: Whether."], [369.12, 371.95, "The experience of overwhelming vastness is the blank."], [372.25, 376.24, "A, mimesis. B, sublime. C, formalism."], [379.8, 382.03, "The answer is B: sublime."], [383.18, 385.76, "The imitation of reality in art is blank."], [386.06, 389.68, "A, taste. B, perception. C, mimesis."], [393.23, 395.3, "The answer is C: mimesis."], [396.45, 398.16, "Choose the correct sentence."], [398.46, 405.28, "A, What makes art great are debated.. B, What makes art great is debated.. C, What make art great is debated.."], [408.83, 411.88, "The answer is B: What makes art great is debated.."], [413.02, 416.94, "According to the reading, Kant argued that aesthetic judgment is felt…"], [417.24, 424.16, "A, individually yet demands universal assent. B, only by experts. C, never consistently."], [427.7, 431.78, "The answer is A: individually yet demands universal assent."], [432.97, 436.4, "Part six: speaking. It's your turn to talk."], [437.25, 441.28, "Is beauty objective, or is it entirely in the eye of the beholder?"], [458.08, 459.77, "Now listen to Visal."], [460.07, 488.75, "I think beauty is partly subjective and partly shared. Whether a sunset or a temple moves us depends on our history, yet many different cultures are moved by similar things, which suggests some common human response. Taste can also be educated: the more we study music, the more we notice. So beauty is not purely in the eye of the beholder. It arises in the meeting of an object and a trained perception."], [489.05, 490.87, "Excellent answer, Visal!"], [491.78, 497.25, "Great work! Now you can use ten new words and abstract philosophical debate structures."], [497.55, 502.64, "Today's value is appreciation of beauty. Learn to notice and value the beauty around you."], [502.94, 505.2, "See you in Unit eight. Goodbye!"], [505.5, 508.18, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C2B2-Unit08-Futures-Studies": [[0.35, 5.15, "Hello, everyone! I'm Ms. Emma. Welcome to Online C two, Book two."], [5.45, 9.76, "Hi! I'm Visal. Let's learn together!"], [10.06, 16.56, "Unit eight: Futures Studies. Today you will forecast using the future perfect for long-range prediction."], [16.86, 19.46, "Here is our lesson map. Let's start!"], [20.4, 23.71, "Part one: words. You will learn ten new words."], [24.55, 25.98, "Scenario planning."], [26.98, 31.92, "Scenario planning means imagining several possible futures to prepare for uncertainty."], [32.52, 36.92, "Scenario planning helped the port prepare for sea-level rise."], [37.52, 40.3, "Your turn. Say: Scenario planning."], [43.13, 44.52, "Scenario planning."], [45.28, 46.89, "Speculative futures."], [47.88, 52.7, "Speculative futures means imaginative visions of what might happen, used to provoke debate."], [53.32, 56.97, "Speculative futures often take the form of fiction or design."], [57.55, 60.49, "Your turn. Say: Speculative futures."], [63.33, 64.88, "Speculative futures."], [65.62, 66.97, "Emerging trend."], [67.95, 71.69, "Emerging trend means a pattern of change that is beginning to appear."], [72.28, 75.51, "Remote work was an emerging trend long before the pandemic."], [76.12, 79.4, "Your turn. Say: Emerging trend."], [82.23, 83.62, "Emerging trend."], [84.38, 85.37, "Foresight."], [86.38, 91.3, "Foresight means the ability to anticipate and prepare for future developments."], [91.88, 95.22, "Foresight allowed the city to plan for an ageing population."], [95.82, 98.26, "Your turn. Say: Foresight."], [101.1, 101.98, "Foresight."], [102.75, 104.11, "Systemic risk."], [105.12, 109.72, "Systemic risk means a danger that can cascade through a wh
