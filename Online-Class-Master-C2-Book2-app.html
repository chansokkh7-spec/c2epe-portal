ole interconnected system."], [110.32, 113.84, "A single bank failure became a systemic risk to the economy."], [114.45, 117.29, "Your turn. Say: Systemic risk."], [120.13, 121.64, "Systemic risk."], [122.38, 123.83, "Plausible future."], [124.82, 128.59, "Plausible future means a future that could reasonably happen given what we know."], [129.18, 132.06, "Planners explored three plausible futures for energy."], [132.65, 135.78, "Your turn. Say: Plausible future."], [138.63, 140.2, "Plausible future."], [140.95, 142.68, "Strategic anticipation."], [143.68, 148.18, "Strategic anticipation means preparing in advance for likely changes."], [148.78, 153.0, "Strategic anticipation distinguished the firm from its slower rivals."], [153.62, 156.86, "Your turn. Say: Strategic anticipation."], [159.7, 162.16, "Strategic anticipation."], [162.92, 164.64, "Long-term thinking."], [165.65, 170.11, "Long-term thinking means making decisions with consequences decades ahead in mind."], [170.72, 173.88, "Long-term thinking is rare in election cycles."], [174.48, 177.73, "Your turn. Say: Long-term thinking."], [180.57, 183.29, "Long-term thinking."], [184.05, 185.45, "Disruption risk."], [186.45, 190.57, "Disruption risk means the danger that new technology will upend an industry."], [191.18, 194.89, "Taxi companies underestimated the disruption risk of ride-sharing."], [195.48, 198.45, "Your turn. Say: Disruption risk."], [201.3, 202.74, "Disruption risk."], [203.48, 204.98, "Resilience planning."], [205.98, 210.29, "Resilience planning means preparing systems to absorb shocks and recover."], [210.88, 214.21, "Resilience planning included backup power for hospitals."], [214.82, 217.81, "Your turn. Say: Resilience planning."], [220.67, 222.13, "Resilience planning."], [222.93, 226.31, "Part two: dialogue. Let's listen to a conversation."], [227.15, 231.56, "Visal, how can anyone predict what the world will look like in fifty years?"], [232.65, 245.75, "Futurists don't predict; they explore plausible futures. By 2075, foresight practices will have transformed policy-making, or so planners hope."], [246.85, 248.38, "Hope isn't a method."], [249.48, 260.13, "True, which is why scenario planning is used. By the time the next decade ends, several emerging trends will have matured and others will have vanished."], [261.25, 264.02, "So the point is preparation, not prophecy."], [265.12, 274.92, "Exactly. By the end of this century, societies that practised resilience planning will have survived shocks that destroyed those that did not."], [276.07, 277.37, "Part three: grammar."], [278.22, 282.4, "Grammar focus: Future perfect for long-range prediction."], [282.7, 283.87, "Look at the pattern."], [284.58, 289.86, "By 2075, foresight practices will have transformed policy-making."], [290.75, 294.54, "By then, emerging trends will have matured into mainstream norms."], [295.45, 300.32, "By the century's end, resilient societies will have survived shocks that others could not."], [301.27, 311.99, "Future perfect = will have + past participle. It looks back from a future point: By 2075 we will have done X. Pair it with 'by' or 'by the time'."], [312.75, 319.02, "Be careful! Don't say: By 2075, foresight will transformed policy."], [320.97, 325.97, "Say: By 2075, foresight will have transformed policy."], [326.27, 328.73, "Future perfect: will have + p.p."], [329.53, 332.21, "Part four: reading. Read and listen."], [333.0, 334.08, "Thinking Ahead."], [334.38, 343.24, "Futures studies does not claim to predict the future; it aims to map the range of plausible futures so that decisions can be made wisely under uncertainty."], [344.23, 354.0, "Scenario planning, developed by Shell in the 1970s, asks organisations to imagine several divergent worlds and to test their strategies against each of them."], [355.0, 362.33, "By 2050, many analysts believe, automation and climate change will have reshaped labour markets and settlement patterns."], [363.33, 372.06, "Foresight also identifies systemic risks, the dangers that spread through interconnected systems, and encourages resilience planning before crises occur."], [373.07, 378.6, "Long-term thinking, though politically difficult, has repeatedly been shown to prevent costly surprises."], [379.7, 383.7, "Part five: quiz. Five questions. Are you ready?"], [384.55, 388.62, "By 2075, foresight blank policy-making."], [388.92, 393.38, "A, will transform. B, will have transformed. C, transformed."], [396.93, 399.64, "The answer is B: will have transformed."], [400.78, 404.25, "Imagining several possible futures to prepare is blank."], [404.55, 409.0, "A, scenario planning. B, deadlock. C, anchoring."], [412.57, 414.89, "The answer is A: scenario planning."], [416.05, 419.69, "A danger that cascades through a whole system is a blank risk."], [419.99, 423.83, "A, plausible. B, systemic. C, strategic."], [427.37, 429.41, "The answer is B: systemic."], [430.55, 432.63, "Choose the correct future perfect."], [432.93, 442.45, "A, By 2060 we will finish the project.. B, By 2060 we will have finish the project.. C, By 2060 we will have finished the project.."], [446.0, 450.35, "The answer is C: By 2060 we will have finished the project.."], [451.48, 454.28, "According to the reading, futures studies aims to…"], [454.58, 460.22, "A, predict exact events. B, map plausible futures. C, avoid planning."], [463.77, 466.53, "The answer is B: map plausible futures."], [467.73, 470.9, "Part six: speaking. It's your turn to talk."], [471.75, 475.69, "What plausible future do you think is most likely in the next 50 years?"], [492.48, 493.97, "Now listen to Visal."], [494.27, 529.94, "The most plausible future, in my view, is one shaped by climate adaptation and artificial intelligence. By 2075, cities will have redesigned coastlines and energy systems, and many routine jobs will have been automated. I can't be certain, of course, so I would prepare for several scenarios rather than one. Resilience matters more than prediction. Societies that invest in education and flexible institutions will have the best chance of thriving."], [530.24, 532.11, "Excellent answer, Visal!"], [533.02, 538.75, "Great work! Now you can use ten new words and future perfect for long-range prediction."], [539.05, 543.23, "Today's value is foresight. Prepare today for the world of tomorrow."], [543.53, 545.95, "See you in Unit nine. Goodbye!"], [546.25, 548.82, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C2B2-Unit09-Consciousness-Studies": [[0.35, 5.16, "Hello, everyone! I'm Ms. Emma. Welcome to Online C two, Book two."], [5.46, 8.71, "Hi! I'm Visal. Let's learn together!"], [9.01, 15.65, "Unit nine: Consciousness Studies. Today you will explain the mind using nominalized abstract concepts."], [15.95, 18.63, "Here is our lesson map. Let's start!"], [19.57, 22.68, "Part one: words. You will learn eight new words."], [23.55, 24.71, "Consciousness."], [25.72, 29.81, "Consciousness means the state of being aware of oneself and one's surroundings."], [30.42, 33.65, "Consciousness remains the least understood feature of the brain."], [34.25, 37.27, "Your turn. Say: Consciousness."], [40.13, 41.32, "Consciousness."], [42.08, 42.9, "Qualia."], [43.88, 48.54, "Qualia means the private, felt quality of an experience, such as the redness of red."], [49.15, 52.66, "No equation seems to capture the qualia of tasting mango."], [53.25, 55.59, "Your turn. Say: Qualia."], [58.43, 59.23, "Qualia."], [59.98, 61.69, "Subjective experience."], [62.68, 67.09, "Subjective experience means what something feels like from the inside to one person."], [67.68, 71.27, "Subjective experience cannot be directly observed by others."], [71.88, 75.21, "Your turn. Say: Subjective experience."], [78.07, 79.94, "Subjective experience."], [80.68, 81.72, "Hard problem."], [82.72, 87.36, "Hard problem means the puzzle of why physical processes give rise to felt experience."], [87.95, 90.97, "Chalmers named it the hard problem of consciousness."], [91.58, 94.61, "Your turn. Say: Hard problem."], [97.47, 99.37, "Hard problem."], [100.12, 101.4, "Awareness."], [102.38, 106.32, "Awareness means knowledge or perception of a situation or fact."], [106.92, 111.03, "Awareness of one's own thoughts distinguishes reflection from reflex."], [111.62, 113.97, "Your turn. Say: Awareness."], [116.83, 118.02, "Awareness."], [118.78, 119.77, "Perception."], [120.78, 124.56, "Perception means the way something is sensed and interpreted by the mind."], [125.15, 128.89, "Perception is an active construction, not a passive recording."], [129.48, 132.0, "Your turn. Say: Perception."], [134.83, 135.8, "Perception."], [136.55, 137.71, "Sentience."], [138.72, 141.65, "Sentience means the capacity to feel and perceive."], [142.25, 145.84, "Debates about animal sentience shape laws on welfare."], [146.45, 148.95, "Your turn. Say: Sentience."], [151.8, 152.85, "Sentience."], [153.58, 154.86, "Introspection."], [155.85, 159.38, "Introspection means examining one's own thoughts and feelings."], [159.98, 163.66, "Introspection is useful, yet notoriously unreliable."], [164.25, 166.81, "Your turn. Say: Introspection."], [169.67, 170.96, "Introspection."], [171.77, 175.21, "Part two: dialogue. Let's listen to a conversation."], [176.05, 180.84, "Visal, scientists can map the brain in detail. Hasn't consciousness been explained?"], [181.95, 190.16, "Not at all. The hard problem concerns the nature of subjective experience, which no brain scan directly reveals."], [191.25, 194.02, "But activity in the brain correlates with feelings."], [195.12, 203.03, "Correlation is not explanation. The emergence of qualia from neurons remains a mystery, however detailed the measurement."], [204.12, 206.12, "So science has reached a limit?"], [207.22, 216.52, "Perhaps only a pause. The recognition of that gap is itself progress, and it calls for humility on every side."], [217.67, 219.1, "Part three: grammar."], [219.95, 223.76, "Grammar focus: Nominalized abstract concepts."], [224.06, 225.29, "Look at the pattern."], [225.98, 229.63, "The hard problem concerns the nature of subjective experience."], [230.52, 233.77, "The emergence of qualia remains a scientific mystery."], [234.68, 238.0, "The recognition of that gap demands intellectual humility."], [238.93, 250.98, "Turn processes into nouns (recognise → recognition, emerge → emergence) and let them act as subjects. The result is dense and academic: abstract noun + verb + abstract noun."], [251.72, 255.74, "Be careful! Don't say: Consciousness is hardly to explain."], [257.7, 260.99, "Say: The explanation of consciousness is hard."], [261.29, 264.59, "Nominalise: explain → explanation."], [265.4, 267.96, "Part four: reading. Read and listen."], [268.77, 269.99, "The Hard Problem."], [270.29, 275.78, "Neuroscience can now trace which regions of the brain activate when a person sees, remembers or decides."], [276.77, 286.6, "Yet the philosopher David Chalmers argued that an explanation of function leaves untouched a deeper question: why any of this processing should be accompanied by subjective experience."], [287.6, 294.17, "That felt quality, which philosophers call qualia, appears resistant to description in physical terms alone."], [295.17, 302.01, "Some thinkers therefore doubt that introspection can be trusted, while others maintain that sentience may extend well beyond humans."], [303.0, 309.82, "The honest conclusion is that consciousness remains unexplained, and that humility is more productive than premature certainty."], [310.93, 315.18, "Part five: quiz. Five questions. Are you ready?"], [316.02, 319.28, "The hard problem blank the nature of subjective experience."], [319.58, 323.6, "A, concerns. B, concerned to. C, concerning."], [327.13, 329.31, "The answer is A: concerns."], [330.45, 333.54, "The private felt quality of an experience is blank."], [333.84, 337.6, "A, qualia. B, perception. C, introspection."], [341.13, 343.17, "The answer is A: qualia."], [344.32, 346.88, "The capacity to feel and perceive is blank."], [347.19, 351.84, "A, sentience. B, awareness only. C, essence."], [355.4, 357.4, "The answer is A: sentience."], [358.55, 360.43, "Which uses a nominalization?"], [360.73, 369.02, "A, Neurons fire and we feel.. B, The emergence of feeling puzzles scientists.. C, We puzzle about why feelings emerge.."], [372.57, 376.83, "The answer is B: The emergence of feeling puzzles scientists.."], [377.98, 381.65, "According to the reading, the honest conclusion is that consciousness…"], [381.95, 387.89, "A, has been fully explained. B, remains unexplained. C, is an illusion."], [391.43, 393.83, "The answer is B: remains unexplained."], [395.03, 398.38, "Part six: speaking. It's your turn to talk."], [399.22, 402.4, "Why do some philosophers call consciousness the 'hard problem'?"], [419.22, 420.66, "Now listen to Visal."], [420.96, 452.18, "Some philosophers call consciousness the hard problem because explaining brain function does not explain why there is felt experience at all. We can describe how the brain processes light, but not why seeing red feels like something. That private quality, qualia, seems resistant to physical description. The gap is not a failure of effort; it may be a gap in our concepts. I think humility is the right response."], [452.48, 454.31, "Excellent answer, Visal!"], [455.22, 460.03, "Great work! Now you can use eight new words and nominalized abstract concepts."], [460.33, 466.09, "Today's value is intellectual humility. Admit what you do not know, and stay ready to learn."], [466.39, 468.74, "See you in Unit ten. Goodbye!"], [469.04, 473.69, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C2B2-Unit10-Metaphysics": [[0.35, 5.38, "Hello, everyone! I'm Ms. Emma. Welcome to Online C two, Book two."], [5.68, 8.9, "Hi! I'm Visal. Let's learn together!"], [9.2, 14.38, "Unit ten: Metaphysics. Today you will discuss being using abstract noun subjects."], [14.68, 17.39, "Here is our lesson map. Let's start!"], [18.33, 21.59, "Part one: words. You will learn eight new words."], [22.45, 23.66, "Metaphysics."], [24.65, 29.78, "Metaphysics means the branch of philosophy that studies the basic nature of reality."], [30.38, 34.14, "Metaphysics asks what exists and why anything exists at all."], [34.75, 37.76, "Your turn. Say: Metaphysics."], [40.6, 41.73, "Metaphysics."], [42.48, 43.72, "Ontology."], [44.72, 48.5, "Ontology means the study of what exists and the categories of being."], [49.12, 53.31, "Ontology asks whether numbers exist in the same way as tables."], [53.92, 56.55, "Your turn. Say: Ontology."], [59.4, 60.6, "Ontology."], [61.35, 62.0, "Being."], [63.02, 65.67, "Being means existence, or the fact of existing."], [66.25, 68.67, "Heidegger asked what it means for a being to be."], [69.28, 71.41, "Your turn. Say: Being."], [74.27, 75.02, "Being."], [75.78, 76.78, "Essence."], [77.78, 80.86, "Essence means the basic nature that makes something what it is."], [81.45, 84.16, "Is there an essence that makes a human human?"], [84.75, 87.14, "Your turn. Say: Essence."], [90.0, 90.93, "Essence."], [91.68, 92.79, "Existence."], [93.78, 97.57, "Existence means the fact of being real or present in the world."], [98.18, 100.81, "Existence cannot be taken for granted."], [101.42, 103.85, "Your turn. Say: Existence."], [106.7, 107.93, "Existence."], [108.68, 109.72, "Causality."], [110.72, 114.12, "Causality means the relation between a cause and its effect."], [114.72, 117.75, "Hume doubted that we ever observe causality directly."], [118.35, 121.12, "Your turn. Say: Causality."], [123.97, 125.06, "Causality."], [125.82, 127.04, "Substance."], [128.05, 132.0, "Substance means that which underlies and supports a thing's properties."], [132.62, 137.04, "Aristotle believed a substance has properties but is not itself a property."], [137.65, 140.23, "Your turn. Say: Substance."], [143.07, 144.28, "Substance."], [145.02, 145.93, "Reality."], [146.92, 150.51, "Reality means the world as it truly is, apart from appearance."], [151.12, 154.76, "Philosophers disagree about whether reality is mind-independent."], [155.35, 158.03, "Your turn. Say: Reality."], [160.87, 161.94, "Reality."], [162.73, 166.43, "Part two: dialogue. Let's listen to a conversation."], [167.28, 172.7, "Visal, why do philosophers keep asking whether things 'really' exist? A chair is a chair."], [173.78, 183.94, "Metaphysics questions what makes it a chair. Existence precedes essence, according to some philosophers, while others reverse the order."], [185.05, 186.29, "Does the order matter?"], [187.38, 196.62, "Enormously. Causality, identity and even freedom depend on the answer, because essence determines what a thing can become."], [197.72, 199.1, "And who is right?"], [200.22, 210.0, "Ontology offers no consensus. Reality may exceed every category we invent for it, which is precisely why the question endures."], [211.13, 212.66, "Part three: grammar."], [213.52, 216.69, "Grammar focus: Abstract noun subjects."], [216.99, 218.21, "Look at the pattern."], [218.92, 222.63, "Existence precedes essence, according to some philosophers."], [223.55, 225.92, "Essence determines what a thing can become."], [226.82, 229.62, "Reality may exceed every category we invent."], [230.57, 240.52, "Abstract nouns can act. Let ideas be the subject: Causality links events; Essence defines identity. This avoids 'I think' and sounds impersonal and academic."], [241.28, 245.84, "Be careful! Don't say: Existence is preceding essence, some say."], [247.8, 251.17, "Say: Existence precedes essence, some say."], [251.47, 253.71, "Use the simple present for claims."], [254.5, 257.05, "Part four: reading. Read and listen."], [257.83, 258.73, "What Is There?."], [259.03, 264.66, "Metaphysics is the oldest branch of philosophy, concerned with the most general features of reality."], [265.67, 274.35, "Ontology, one of its central parts, asks what kinds of things exist: physical objects, numbers, minds, or perhaps only appearances."], [275.37, 284.95, "Aristotle held that every thing is a substance whose essence makes it what it is, whereas existentialists such as Sartre claimed that, for humans, existence precedes essence."], [285.93, 294.19, "Causality poses a separate puzzle, since Hume argued that we observe sequence but never the necessary connection that makes one event produce another."], [295.2, 299.94, "Such questions may seem remote, yet every scientific theory presupposes answers to them."], [301.03, 305.21, "Part five: quiz. Five questions. Are you ready?"], [306.05, 309.06, "blank precedes essence, according to Sartre."], [309.36, 313.69, "A, Exist. B, Existence. C, Existing of."], [317.23, 319.46, "The answer is B: Existence."], [320.62, 322.7, "The study of what exists is blank."], [323.0, 327.09, "A, ontology. B, causality. C, essence."], [330.63, 332.78, "The answer is A: ontology."], [333.95, 337.17, "The basic nature that makes a thing what it is is its blank."], [337.47, 341.14, "A, essence. B, reality. C, being only."], [344.7, 346.48, "The answer is A: essence."], [347.62, 349.74, "Choose the best academic sentence."], [350.04, 356.74, "A, I think reality is big.. B, Reality may exceed every category.. C, Reality, you know, is big.."], [360.3, 364.04, "The answer is B: Reality may exceed every category.."], [365.18, 367.82, "According to the reading, Hume argued that we observe…"], [368.12, 373.46, "A, necessary connections. B, sequence but not necessity. C, no events at all."], [377.0, 379.87, "The answer is B: sequence but not necessity."], [381.07, 384.24, "Part six: speaking. It's your turn to talk."], [385.08, 388.5, "What do you think is the relationship between essence and existence?"], [405.28, 406.8, "Now listen to Visal."], [407.1, 433.13, "I find the existentialist view persuasive for humans: we exist first and define ourselves through choices. A person has no fixed essence waiting to be discovered. For objects, however, essence seems prior, since a knife is made for cutting before any particular knife exists. The relationship may therefore differ by kind of being. Reality seems richer than any single formula."], [433.43, 435.32, "Excellent answer, Visal!"], [436.22, 440.85, "Great work! Now you can use eight new words and abstract noun subjects."], [441.15, 446.42, "Today's value is philosophical curiosity. Keep asking the big questions about life."], [446.72, 449.29, "See you in Unit eleven. Goodbye!"], [449.59, 452.29, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C2B2-Unit11-Philosophy-of-Science": [[0.35, 5.09, "Hello, everyone! I'm Ms. Emma. Welcome to Online C two, Book two."], [5.39, 8.83, "Hi! I'm Visal. Let's learn together!"], [9.13, 15.26, "Unit eleven: Philosophy of Science. Today you will state criteria using condition clauses."], [15.56, 18.37, "Here is our lesson map. Let's start!"], [19.3, 22.41, "Part one: words. You will learn eight new words."], [23.25, 24.67, "Falsifiability."], [25.68, 30.42, "Falsifiability means the property of a claim that could in principle be proved wrong."], [31.02, 34.49, "Popper treated falsifiability as the mark of real science."], [35.08, 38.0, "Your turn. Say: Falsifiability."], [40.87, 42.29, "Falsifiability."], [43.05, 44.41, "Paradigm shift."], [45.42, 49.6, "Paradigm shift means a fundamental change in the basic assumptions of a science."], [50.18, 54.35, "Einstein's relativity caused a paradigm shift in physics."], [54.95, 58.05, "Your turn. Say: Paradigm shift."], [60.9, 62.44, "Paradigm shift."], [63.18, 64.46, "Empiricism."], [65.45, 69.97, "Empiricism means the view that knowledge comes mainly from observation and experiment."], [70.58, 73.56, "Empiricism grounds science in what can be tested."], [74.15, 76.62, "Your turn. Say: Empiricism."], [79.47, 80.66, "Empiricism."], [81.42, 82.91, "Scientific method."], [83.92, 88.31, "Scientific method means a systematic way of testing ideas through evidence."], [88.92, 92.25, "The scientific method relies on repeated, public testing."], [92.85, 95.98, "Your turn. Say: Scientific method."], [98.83, 100.59, "Scientific method."], [101.35, 102.11, "Theory."], [103.12, 107.34, "Theory means a well-tested explanation that accounts for many observations."], [107.95, 110.45, "In science a theory is not a mere guess."], [111.05, 113.4, "Your turn. Say: Theory."], [116.27, 117.25, "Theory."], [117.98, 119.22, "Observation."], [120.22, 123.58, "Observation means careful watching and recording of facts."], [124.18, 127.63, "Every observation is shaped by prior expectations."], [128.25, 131.05, "Your turn. Say: Observation."], [133.9, 135.16, "Observation."], [135.92, 137.23, "Objectivity."], [138.22, 142.64, "Objectivity means judgment based on facts rather than personal feelings."], [143.25, 147.36, "Objectivity is an ideal that communities of scientists pursue together."], [147.95, 150.69, "Your turn. Say: Objectivity."], [153.53, 154.72, "Objectivity."], [155.48, 156.45, "Progress."], [157.45, 160.67, "Progress means movement toward a better or more accurate state."], [161.28, 164.04, "Kuhn questioned whether science progresses steadily."], [164.65, 167.3, "Your turn. Say: Progress."], [170.17, 171.27, "Progress."], [172.07, 175.47, "Part two: dialogue. Let's listen to a conversation."], [176.32, 180.36, "Visal, my cousin says astrology is a science because it makes predictions."], [181.45, 191.66, "Popper would disagree. A theory is scientific only if it is falsifiable, meaning some observation could in principle refute it."], [192.75, 194.8, "But astrologers can be wrong too."], [195.88, 203.81, "They can, yet their claims are vague enough to survive any outcome. Unless a claim risks failure, it teaches us nothing."], [204.92, 207.02, "So the test is the risk of being wrong?"], [208.12, 218.35, "Precisely. Provided that a theory forbids something observable, it earns scientific status. Otherwise it merely flatters us."], [219.5, 221.29, "Part three: grammar."], [222.15, 225.55, "Grammar focus: Criterion and condition clauses."], [225.85, 227.0, "Look at the pattern."], [227.68, 231.19, "A theory is scientific only if it is falsifiable."], [232.08, 235.85, "A claim earns status provided that it forbids something observable."], [236.75, 240.11, "A claim teaches us nothing unless it risks failure."], [241.07, 251.66, "Use 'only if', 'provided that', 'on condition that' and 'unless' to set criteria. Keep a full clause after them: only if it is falsifiable (never 'only if falsifiable' without a verb here)."], [252.42, 257.11, "Be careful! Don't say: A theory is scientific only if it falsifiable."], [259.07, 262.91, "Say: A theory is scientific only if it is falsifiable."], [263.21, 265.04, "Keep 'is' in the 'only if' clause."], [265.83, 268.86, "Part four: reading. Read and listen."], [269.67, 271.03, "The Mark of Science."], [271.33, 277.45, "Philosophy of science asks what distinguishes genuine science from pseudoscience, and how scientific knowledge grows."], [278.43, 286.18, "Karl Popper proposed that a theory is scientific only if it is falsifiable, that is, if some conceivable observation would show it to be false."], [287.17, 295.94, "Thomas Kuhn complicated this picture by arguing that science advances through paradigm shifts, in which entire frameworks are replaced rather than gradually refined."], [296.93, 303.68, "Critics add that observation is never entirely neutral, since scientists interpret evidence through existing theory."], [304.67, 311.6, "Nevertheless, scientific objectivity survives, provided that claims are exposed to public testing and open criticism."], [312.7, 316.95, "Part five: quiz. Five questions. Are you ready?"], [317.78, 321.35, "A theory is scientific only blank it is falsifiable."], [321.65, 324.49, "A, if. B, that. C, for."], [328.03, 329.39, "The answer is A: if."], [330.55, 333.66, "A fundamental change in a science's assumptions is a blank."], [333.96, 338.33, "A, paradigm shift. B, observation. C, heuristic."], [341.87, 344.78, "The answer is A: paradigm shift."], [345.95, 348.75, "Claims that could in principle be proved wrong are blank."], [349.05, 353.57, "A, objective. B, falsifiable. C, empirical only."], [357.13, 359.45, "The answer is B: falsifiable."], [360.58, 362.3, "Choose the correct sentence."], [362.6, 371.52, "A, Only if it falsifiable, it is science.. B, It is science only if it is falsifiable.. C, It is science only if falsifiable is.."], [375.07, 378.69, "The answer is B: It is science only if it is falsifiable.."], [379.85, 383.81, "According to the reading, objectivity survives provided that claims are…"], [384.11, 389.25, "A, exposed to public testing. B, kept private. C, never revised."], [392.8, 395.62, "The answer is A: exposed to public testing."], [396.83, 399.86, "Part six: speaking. It's your turn to talk."], [400.72, 404.91, "What makes a scientific theory falsifiable, and why does that matter?"], [421.72, 423.09, "Now listen to Visal."], [423.39, 453.19, "A theory is falsifiable if it forbids some possible observation, so that evidence could in principle show it to be wrong. This matters because a claim that can survive any outcome explains nothing. Falsifiability forces scientists to take risks and to accept correction. Not every valuable idea is scientific, but a claim presented as science should meet this standard. Otherwise confidence replaces evidence."], [453.49, 455.1, "Excellent answer, Visal!"], [455.98, 461.23, "Great work! Now you can use eight new words and criterion and condition clauses."], [461.52, 467.72, "Today's value is scientific literacy. Understand how evidence and testing build knowledge."], [468.02, 470.67, "See you in Unit twelve. Goodbye!"], [470.97, 473.62, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C2B2-Unit12-Complexity-Theory": [[0.35, 5.05, "Hello, everyone! I'm Ms. Emma. Welcome to Online C two, Book two."], [5.35, 8.87, "Hi! I'm Visal. Let's learn together!"], [9.17, 15.48, "Unit twelve: Complexity Theory. Today you will explain emergence using result-of-interaction language."], [15.78, 18.21, "Here is our lesson map. Let's start!"], [19.17, 22.4, "Part one: words. You will learn eight new words."], [23.25, 24.5, "Complex system."], [25.48, 31.33, "Complex system means a system of many interacting parts whose behaviour cannot be predicted from the parts alone."], [31.92, 35.88, "An ecosystem is a complex system with countless interactions."], [36.48, 39.6, "Your turn. Say: Complex system."], [42.47, 43.91, "Complex system."], [44.65, 45.8, "Emergence."], [46.82, 51.37, "Emergence means the appearance of new properties from the interaction of simple parts."], [51.98, 55.32, "Consciousness may be an example of emergence."], [55.92, 58.89, "Your turn. Say: Emergence."], [61.73, 62.87, "Emergence."], [63.62, 64.77, "Nonlinearity."], [65.78, 70.95, "Nonlinearity means a relationship where small changes can cause disproportionate effects."], [71.55, 75.34, "Nonlinearity explains why a small rumour can crash a bank."], [75.95, 78.89, "Your turn. Say: Nonlinearity."], [81.73, 83.08, "Nonlinearity."], [83.82, 85.09, "Feedback loop."], [86.08, 90.34, "Feedback loop means a process in which results influence the process itself."], [90.95, 94.59, "A reinforcing feedback loop accelerated the housing bubble."], [95.18, 98.3, "Your turn. Say: Feedback loop."], [101.17, 102.18, "Feedback loop."], [102.92, 104.34, "Self-organization."], [105.35, 110.87, "Self-organization means order arising spontaneously without central control."], [111.48, 113.83, "Flocks of birds show self-organization."], [114.42, 117.41, "Your turn. Say: Self-organization."], [120.27, 121.66, "Self-organization."], [122.42, 123.36, "Chaos."], [124.35, 128.54, "Chaos means apparent randomness that arises from deterministic rules."], [129.15, 131.75, "Weather forecasting is limited by chaos."], [132.35, 135.08, "Your turn. Say: Chaos."], [137.93, 139.16, "Chaos."], [139.92, 141.31, "Adaptive system."], [142.32, 147.22, "Adaptive system means a system that changes its behaviour in response to its environment."], [147.82, 150.2, "The immune system is an adaptive system."], [150.78, 153.75, "Your turn. Say: Adaptive system."], [156.6, 158.05, "Adaptive system."], [158.82, 160.12, "Interdependence."], [161.12, 164.81, "Interdependence means mutual reliance between parts or groups."], [165.42, 168.53, "Global trade has deepened economic interdependence."], [169.12, 171.8, "Your turn. Say: Interdependence."], [174.67, 176.12, "Interdependence."], [176.93, 181.13, "Part two: dialogue. Let's listen to a conversation."], [181.98, 187.03, "Visal, ants are tiny, yet an ant colony behaves intelligently. How is that possible?"], [188.12, 195.28, "No ant directs the colony. Intelligence emerges from the interaction of thousands of simple rules."], [196.38, 198.46, "So the whole is more than its parts?"], [199.55, 208.45, "In a sense. Emergence arises from the interaction of many parts, and the pattern cannot be found in any single ant."], [209.55, 211.78, "Does that apply to cities or economies?"], [212.88, 223.27, "Absolutely. Market behaviour results from countless decisions, and its feedback loops can produce stability or sudden collapse."], [224.43, 226.19, "Part three: grammar."], [227.05, 230.49, "Grammar focus: Result of interaction language."], [230.79, 231.93, "Look at the pattern."], [232.62, 235.96, "Emergence arises from the interaction of many parts."], [236.85, 240.76, "Market behaviour results from countless individual decisions."], [241.65, 244.72, "Order stems from local rules, not central control."], [245.67, 253.71, "Use 'arise from', 'result from', 'stem from' and 'emerge from' to link an outcome to its sources. Note the preposition: from (never 'of' or 'by')."], [254.45, 259.51, "Be careful! Don't say: Emergence arises of the interaction of parts."], [261.47, 265.33, "Say: Emergence arises from the interaction of parts."], [265.63, 267.0, "arise from (not 'of')."], [267.8, 270.09, "Part four: reading. Read and listen."], [270.9, 272.12, "More Than the Sum."], [272.42, 279.29, "A complex system is made of many interacting components whose collective behaviour cannot be deduced from the components alone."], [280.3, 288.0, "An ant colony, a rainforest and a stock market all display emergence, a pattern that arises from the interaction of countless simple parts."], [289.0, 297.18, "Such systems are shaped by feedback loops: reinforcing loops amplify change, whereas balancing loops restore stability."], [298.17, 305.7, "Nonlinearity means that small causes may produce disproportionate effects, which is why long-term prediction is so difficult."], [306.7, 312.06, "Complexity theory therefore encourages modest forecasting and careful attention to interdependence."], [313.17, 317.09, "Part five: quiz. Five questions. Are you ready?"], [317.95, 321.02, "Emergence arises blank the interaction of parts."], [321.32, 324.2, "A, of. B, from. C, by."], [327.77, 329.42, "The answer is B: from."], [330.58, 333.44, "Order that appears without central control is blank."], [333.74, 338.08, "A, self-organization. B, chaos. C, interdependence."], [341.63, 344.46, "The answer is A: self-organization."], [345.62, 348.66, "A process whose results influence the process is a blank."], [348.96, 353.56, "A, feedback loop. B, substance. C, paradigm."], [357.1, 359.2, "The answer is A: feedback loop."], [360.35, 361.62, "Which is correct?"], [361.92, 369.09, "A, Order results of local rules.. B, Order results from local rules.. C, Order results by of local rules.."], [372.63, 376.01, "The answer is B: Order results from local rules.."], [377.15, 379.61, "According to the reading, balancing loops…"], [379.91, 384.83, "A, amplify change. B, restore stability. C, cause chaos."], [388.37, 391.33, "The answer is B: restore stability."], [392.53, 395.7, "Part six: speaking. It's your turn to talk."], [396.55, 400.72, "Can you think of a real-world example of an emergent, complex system?"], [417.52, 418.92, "Now listen to Visal."], [419.22, 446.36, "A traffic jam is a good example. No driver intends it, yet it emerges from the interaction of many small decisions: braking, following distance, merging. A single slowdown can spread backwards as a wave through the whole road. The pattern cannot be understood by studying one car. It arises from the system as a whole, which is the essence of emergence."], [446.66, 448.44, "Excellent answer, Visal!"], [449.35, 453.81, "Great work! Now you can use eight new words and result of interaction language."], [454.11, 458.54, "Today's value is systems thinking. See how the parts connect to make the whole."], [458.84, 461.55, "See you in Unit thirteen. Goodbye!"], [461.85, 464.99, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C2B2-Unit13-Systems-Thinking": [[0.35, 5.12, "Hello, everyone! I'm Ms. Emma. Welcome to Online C two, Book two."], [5.42, 9.01, "Hi! I'm Visal. Let's learn together!"], [9.31, 15.79, "Unit thirteen: Systems Thinking. Today you will describe analysis using searching for / looking for + noun."], [16.09, 18.54, "Here is our lesson map. Let's start!"], [19.5, 22.52, "Part one: words. You will learn eight new words."], [23.38, 24.77, "Systems thinking."], [25.78, 29.56, "Systems thinking means understanding how parts interact within a whole."], [30.15, 33.43, "Systems thinking reveals why quick fixes often backfire."], [34.02, 36.75, "Your turn. Say: Systems thinking."], [39.6, 40.96, "Systems thinking."], [41.72, 42.57, "Feedback."], [43.58, 47.6, "Feedback means information about results that influences later action."], [48.22, 50.91, "Negative feedback keeps a thermostat stable."], [51.52, 54.02, "Your turn. Say: Feedback."], [56.87, 57.72, "Feedback."], [58.48, 59.55, "Interconnection."], [60.55, 64.36, "Interconnection means a link between things so that each affects the other."], [64.95, 68.01, "The interconnection of banks spread the crisis worldwide."], [68.62, 71.22, "Your turn. Say: Interconnection."], [74.07, 75.22, "Interconnection."], [75.98, 77.2, "Holistic view."], [78.22, 82.75, "Holistic view means an approach that considers the whole rather than isolated parts."], [83.35, 86.55, "A holistic view of health includes sleep and community."], [87.15, 90.05, "Your turn. Say: Holistic view."], [92.9, 94.19, "Holistic view."], [94.95, 96.22, "Leverage point."], [97.22, 101.71, "Leverage point means a place in a system where a small change produces large effects."], [102.32, 105.59, "Changing incentives was the leverage point for reform."], [106.18, 109.14, "Your turn. Say: Leverage point."], [112.0, 113.25, "Leverage point."], [113.98, 115.97, "Unintended consequence."], [116.98, 120.88, "Unintended consequence means an unplanned result of an action."], [121.48, 125.78, "The ban had an unintended consequence: a black market."], [126.38, 129.65, "Your turn. Say: Unintended consequence."], [132.5, 134.42, "Unintended consequence."], [135.18, 136.08, "Boundary."], [137.08, 141.02, "Boundary means the limit that defines what is inside or outside a system."], [141.62, 144.37, "Where you draw the boundary changes what you can see."], [144.98, 147.3, "Your turn. Say: Boundary."], [150.13, 151.09, "Boundary."], [151.85, 153.44, "Dynamic equilibrium."], [154.45, 159.24, "Dynamic equilibrium means a balance maintained by continuous opposing processes."], [159.85, 164.16, "A healthy lake sustains dynamic equilibrium through constant exchange."], [164.75, 168.44, "Your turn. Say: Dynamic equilibrium."], [171.3, 173.01, "Dynamic equilibrium."], [173.8, 177.56, "Part two: dialogue. Let's listen to a conversation."], [178.42, 182.6, "Visal, the city widened the highway, yet traffic got worse. Why?"], [183.72, 191.18, "Systems thinkers search for the right leverage point rather than the obvious one. More lanes invited more cars."], [192.28, 194.25, "So the fix created the problem?"], [195.35, 205.21, "In part. An unintended consequence often follows when planners look for a quick solution inside a narrow boundary."], [206.32, 208.13, "What should they have searched for?"], [209.22, 218.31, "They should have been searching for the underlying feedback: why people drive. Better transit, not wider roads, may restore equilibrium."], [219.47, 221.18, "Part three: grammar."], [222.02, 225.18, "Grammar focus: Searching for and looking for plus noun."], [225.48, 226.68, "Look at the pattern."], [227.38, 230.22, "Systems thinkers search for the right leverage point."], [231.12, 233.82, "Planners are looking for sustainable solutions."], [234.72, 237.75, "Analysts should have been searching for the underlying feedback."], [238.7, 248.05, "search for / look for + noun (not 'search the', which means to examine a place). 'Search the house for keys' but 'search for keys'. Both can be progressive or perfect."], [248.82, 252.82, "Be careful! Don't say: Thinkers search the right leverage point."], [254.77, 257.8, "Say: Thinkers search for the right leverage point."], [258.1, 259.52, "search for + noun."], [260.33, 263.06, "Part four: reading. Read and listen."], [263.87, 264.98, "Seeing the Whole."], [265.28, 272.18, "Systems thinking is the discipline of understanding how parts interrelate within a whole, rather than studying them in isolation."], [273.17, 280.93, "Its practitioners search for feedback structures and leverage points, places where a modest intervention can shift the behaviour of an entire system."], [281.93, 291.65, "Ignoring a system's boundaries, by contrast, often leads to unintended consequences: a policy solves a local problem and creates a larger one elsewhere."], [292.67, 299.48, "Donella Meadows argued that the most powerful leverage points lie in the goals and mindsets of a system, not in its numbers."], [300.5, 305.63, "A holistic view does not eliminate surprise, but it makes surprise less frequent and less costly."], [306.73, 310.79, "Part five: quiz. Five questions. Are you ready?"], [311.65, 314.67, "Systems thinkers search blank the right leverage point."], [314.97, 317.52, "A, for. B, of. C, at."], [321.07, 322.89, "The answer is A: for."], [324.05, 326.91, "An unplanned result of an action is an blank."], [327.21, 332.31, "A, unintended consequence. B, interconnection. C, equilibrium."], [335.87, 338.64, "The answer is A: unintended consequence."], [339.78, 342.9, "A place where a small change has large effects is a blank."], [343.2, 347.0, "A, boundary. B, leverage point. C, feedback."], [350.57, 352.88, "The answer is B: leverage point."], [354.02, 355.77, "Choose the correct sentence."], [356.07, 362.36, "A, She searched for the cause.. B, She searched of the cause.. C, She searched at for the cause.."], [365.9, 368.68, "The answer is A: She searched for the cause.."], [369.82, 373.67, "According to the reading, the most powerful leverage points lie in…"], [373.97, 378.56, "A, numbers only. B, goals and mindsets. C, random events."], [382.1, 385.12, "The answer is B: goals and mindsets."], [386.33, 389.51, "Part six: speaking. It's your turn to talk."], [390.35, 394.35, "What is a 'leverage point' and why is it valuable in systems thinking?"], [411.15, 412.65, "Now listen to Visal."], [412.95, 441.55, "A leverage point is a place in a system where a small, well-chosen change produces a large effect. It is valuable because systems resist brute force; pushing hard at the wrong place often fails or backfires. Systems thinkers therefore search for the point where feedback can be redirected. Changing incentives can matter more than adding resources. Finding it takes patience and a holistic view."], [441.85, 443.64, "Excellent answer, Visal!"], [444.55, 449.2, "Great work! Now you can use eight new words and searching for and looking for plus noun."], [449.5, 454.35, "Today's value is holistic thinking. Look at the whole picture, not only one piece."], [454.65, 457.54, "See you in Unit fourteen. Goodbye!"], [457.84, 460.66, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C2B2-Unit14-Game-Theory": [[0.35, 5.4, "Hello, everyone! I'm Ms. Emma. Welcome to Online C two, Book two."], [5.7, 9.13, "Hi! I'm Visal. Let's learn together!"], [9.43, 15.96, "Unit fourteen: Game Theory. Today you will describe strategic reasoning using modeling language."], [16.26, 19.04, "Here is our lesson map. Let's start!"], [20.0, 23.19, "Part one: words. You will learn eight new words."], [24.05, 25.19, "Game theory."], [26.18, 30.83, "Game theory means the study of strategic decisions where each choice depends on others'."], [31.42, 34.94, "Game theory is used in economics, politics and biology."], [35.55, 38.32, "Your turn. Say: Game theory."], [41.17, 42.32, "Game theory."], [43.08, 44.58, "Nash equilibrium."], [45.58, 51.07, "Nash equilibrium means a situation where no player gains by changing strategy alone."], [51.65, 54.78, "At a Nash equilibrium, nobody wants to deviate."], [55.38, 58.17, "Your turn. Say: Nash equilibrium."], [61.03, 62.8, "Nash equilibrium."], [63.55, 64.9, "Zero-sum game."], [65.88, 70.97, "Zero-sum game means a situation in which one side's gain is exactly the other's loss."], [71.58, 74.87, "Chess is a zero-sum game; trade need not be."], [75.48, 78.4, "Your turn. Say: Zero-sum game."], [81.27, 82.79, "Zero-sum game."], [83.55, 84.93, "Payoff matrix."], [85.95, 90.38, "Payoff matrix means a table showing the outcomes of each combination of choices."], [90.98, 94.12, "The payoff matrix revealed why both firms cut prices."], [94.72, 97.95, "Your turn. Say: Payoff matrix."], [100.8, 102.14, "Payoff matrix."], [102.88, 103.87, "Strategy."], [104.88, 108.37, "Strategy means a plan of action designed to achieve a goal."], [108.98, 112.26, "A good strategy anticipates the other side's response."], [112.85, 115.43, "Your turn. Say: Strategy."], [118.27, 119.49, "Strategy."], [120.25, 121.53, "Rational actor."], [122.52, 127.42, "Rational actor means a decision-maker who pursues goals consistently and logically."], [128.02, 131.76, "Models often assume a rational actor, though real people are messier."], [132.35, 135.32, "Your turn. Say: Rational actor."], [138.17, 139.49, "Rational actor."], [140.25, 141.43, "Cooperation."], [142.42, 145.58, "Cooperation means working together toward a shared aim."], [146.18, 150.05, "Cooperation can emerge even among self-interested players."], [150.65, 153.4, "Your turn. Say: Cooperation."], [156.23, 157.5, "Cooperation."], [158.25, 159.23, "Defection."], [160.22, 164.35, "Defection means choosing self-interest and breaking an agreement to cooperate."], [164.95, 167.67, "One player's defection destroyed the cartel."], [168.28, 170.8, "Your turn. Say: Defection."], [173.63, 174.56, "Defection."], [175.37, 179.38, "Part two: dialogue. Let's listen to a conversation."], [180.22, 184.86, "Visal, why do two rival shops often cut prices until both lose money?"], [185.95, 194.8, "Game theory models how rational actors make strategic choices. Each shop fears that the other will defect first."], [195.92, 198.61, "But both would profit if they kept prices high."], [199.72, 208.65, "True, and a payoff matrix represents that tension: cooperation pays best collectively, yet defection tempts each player individually."], [209.75, 211.25, "So is it hopeless?"], [212.35, 221.84, "No. Repeated interaction simulates trust over time. Models show that cooperation can emerge when players expect to meet again."], [223.0, 225.0, "Part three: grammar."], [225.85, 230.32, "Grammar focus: Modeling language (models, represents, simulates)."], [230.62, 231.87, "Look at the pattern."], [232.58, 236.31, "Game theory models how rational actors make strategic choices."], [237.22, 241.53, "A payoff matrix represents the outcomes of every combination of choices."], [242.42, 245.06, "Repeated play simulates the growth of trust."], [246.0, 254.97, "Verbs of modelling (model, represent, simulate, capture, illustrate) are followed by an object or a wh-clause: models how…, illustrates why…. Not 'models that how'."], [255.72, 260.46, "Be careful! Don't say: Game theory models as rational actors choose."], [262.4, 266.0, "Say: Game theory models how rational actors choose."], [266.3, 268.12, "models + how / what clause."], [268.9, 271.52, "Part four: reading. Read and listen."], [272.33, 274.03, "The Logic of Strategy."], [274.33, 280.13, "Game theory models situations in which the outcome for each participant depends on the choices of the others."], [281.13, 289.36, "In a zero-sum game, one player's gain is exactly the other's loss, but many real interactions, such as trade, allow mutual benefit."], [290.37, 298.61, "A Nash equilibrium represents a stable outcome in which no player could improve by changing strategy alone, even if the result is collectively poor."], [299.6, 307.52, "The prisoner's dilemma illustrates this: each player's defection is individually rational, yet mutual defection leaves both worse off."], [308.53, 315.71, "When interactions are repeated, however, cooperation can become the rational choice, since trust offers lasting rewards."], [316.8, 320.79, "Part five: quiz. Five questions. Are you ready?"], [321.65, 325.09, "Game theory blank how actors make strategic choices."], [325.39, 329.11, "A, models. B, model to. C, modelling of."], [332.67, 334.39, "The answer is A: models."], [335.55, 339.04, "A table of outcomes for each combination of choices is a blank."], [339.34, 343.3, "A, strategy. B, payoff matrix. C, defection."], [346.87, 349.52, "The answer is B: payoff matrix."], [350.65, 354.24, "A situation where one side's gain is the other's loss is a blank."], [354.54, 359.8, "A, zero-sum game. B, Nash equilibrium. C, cooperation."], [363.33, 365.8, "The answer is A: zero-sum game."], [366.95, 368.73, "Choose the correct sentence."], [369.03, 377.92, "A, The model illustrates why trust matters.. B, The model illustrates that why trust matters.. C, The model illustrates for trust matter.."], [381.47, 385.14, "The answer is A: The model illustrates why trust matters.."], [386.28, 389.79, "According to the reading, repeated interactions can make…"], [390.09, 396.25, "A, defection always rational. B, cooperation rational. C, strategy irrelevant."], [399.8, 402.55, "The answer is B: cooperation rational."], [403.77, 406.95, "Part six: speaking. It's your turn to talk."], [407.82, 413.58, "What is an example of a real-life situation that resembles a game theory scenario?"], [430.38, 431.91, "Now listen to Visal."], [432.21, 460.68, "Two neighbouring farmers sharing one irrigation canal face a game theory scenario. If both use only their fair share, the canal lasts and both benefit. If one takes extra water, he gains in the short run while harming the other. Each fears the other's defection, so overuse can become an equilibrium. Rules and repeated relationships help sustain cooperation."], [460.98, 462.66, "Excellent answer, Visal!"], [463.55, 469.8, "Great work! Now you can use eight new words and modeling language (models, represents, simulates)."], [470.1, 475.63, "Today's value is strategic reasoning. Think ahead about how others will respond to your choices."], [475.93, 478.61, "See you in Unit fifteen. Goodbye!"], [478.91, 481.77, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C2B2-Unit15-Decision-Theory": [[0.35, 4.92, "Hello, everyone! I'm Ms. Emma. Welcome to Online C two, Book two."], [5.22, 8.56, "Hi! I'm Visal. Let's learn together!"], [8.86, 15.01, "Unit fifteen: Decision Theory. Today you will compare choices using rather than + gerund."], [15.31, 18.12, "Here is our lesson map. Let's start!"], [19.07, 22.37, "Part one: words. You will learn eight new words."], [23.22, 24.52, "Decision theory."], [25.52, 29.52, "Decision theory means the study of how choices are or should be made."], [30.12, 33.87, "Decision theory links mathematics, economics and psychology."], [34.48, 37.15, "Your turn. Say: Decision theory."], [40.0, 41.37, "Decision theory."], [42.12, 43.66, "Expected utility."], [44.65, 49.35, "Expected utility means the average value of an outcome weighted by its probability."], [49.95, 52.94, "She calculated the expected utility of each option."], [53.55, 56.53, "Your turn. Say: Expected utility."], [59.37, 60.95, "Expected utility."], [61.68, 62.89, "Risk aversion."], [63.88, 68.47, "Risk aversion means a preference for a certain outcome over a gamble of equal value."], [69.08, 72.25, "Risk aversion explains why people buy insurance."], [72.85, 76.31, "Your turn. Say: Risk aversion."], [79.17, 80.36, "Risk aversion."], [81.12, 82.54, "Bounded rationality."], [83.55, 89.83, "Bounded rationality means the idea that reasoning is limited by time, information and mental capacity."], [90.45, 94.02, "Herbert Simon introduced bounded rationality to economics."], [94.62, 97.37, "Your turn. Say: Bounded rationality."], [100.23, 101.84, "Bounded rationality."], [102.58, 103.6, "Heuristic."], [104.58, 108.39, "Heuristic means a mental shortcut that gives a quick, workable judgment."], [108.98, 112.2, "A heuristic such as 'choose the familiar brand' saves effort."], [112.82, 115.47, "Your turn. Say: Heuristic."], [118.33, 119.32, "Heuristic."], [120.08, 121.15, "Uncertainty."], [122.15, 126.99, "Uncertainty means a situation in which outcomes or probabilities are unknown."], [127.58, 130.92, "Uncertainty differs from risk, where probabilities are known."], [131.52, 134.05, "Your turn. Say: Uncertainty."], [136.9, 137.95, "Uncertainty."], [138.68, 139.82, "Trade-off."], [140.82, 145.25, "Trade-off means a balance in which gaining one thing means losing another."], [145.85, 149.94, "Every design involves a trade-off between cost and quality."], [150.55, 153.45, "Your turn. Say: Trade-off."], [156.3, 157.85, "Trade-off."], [158.58, 160.04, "Optimal choice."], [161.05, 164.92, "Optimal choice means the best available option given one's goals."], [165.52, 168.78, "The optimal choice is rarely obvious in advance."], [169.38, 172.53, "Your turn. Say: Optimal choice."], [175.4, 176.9, "Optimal choice."], [177.7, 181.19, "Part two: dialogue. Let's listen to a conversation."], [182.05, 187.47, "Visal, I spent two hours comparing laptops and still felt unsure. What went wrong?"], [188.55, 197.15, "Nothing unusual. People often rely on heuristics rather than calculating perfectly, because full optimisation is impossible."], [198.25, 200.45, "Isn't a heuristic just laziness?"], [201.55, 211.55, "Not at all. Bounded rationality means that choosing quickly can be wiser than agonising endlessly over every trade-off."], [212.65, 214.5, "So I should have stopped sooner?"], [215.58, 226.34, "Probably. Setting criteria and picking the first option that meets them, rather than searching for perfection, usually yields better results and less regret."], [227.5, 228.93, "Part three: grammar."], [229.78, 232.7, "Grammar focus: Rather than plus gerund."], [233.0, 234.25, "Look at the pattern."], [234.95, 238.48, "People often rely on heuristics rather than calculating perfectly."], [239.38, 243.22, "She chose to decide quickly rather than agonising over every detail."], [244.12, 247.99, "Rather than maximising utility, many people settle for good enough."], [248.93, 260.21, "After 'rather than' keep the same form as the first action: rely on X rather than calculating; decide rather than agonise. With 'would rather' use the bare infinitive: I would rather wait than rush."], [260.95, 265.24, "Be careful! Don't say: They rely on rules rather than to calculate."], [267.2, 270.18, "Say: They rely on rules rather than calculating."], [270.48, 271.95, "rather than + -ing."], [272.77, 275.66, "Part four: reading. Read and listen."], [276.47, 278.13, "Choosing Under Limits."], [278.43, 286.63, "Classical decision theory describes a perfectly rational agent who calculates the expected utility of every option and selects the best."], [287.63, 294.88, "Real people, however, face uncertainty, limited time and finite attention, which Herbert Simon called bounded rationality."], [295.87, 301.93, "Rather than maximising, most of us satisfice: we search until an option is good enough and then stop."], [302.93, 311.5, "Heuristics, though sometimes producing systematic errors, are often remarkably efficient, and they spare us from the paralysis of endless comparison."], [312.5, 318.6, "Risk aversion adds another twist, since many prefer a sure gain to a gamble with higher expected value."], [319.7, 323.81, "Part five: quiz. Five questions. Are you ready?"], [324.65, 327.85, "People rely on heuristics rather than blank perfectly."], [328.14, 332.07, "A, calculate. B, calculating. C, to calculate."], [335.6, 337.99, "The answer is B: calculating."], [339.15, 342.02, "A mental shortcut for quick judgment is a blank."], [342.32, 346.59, "A, heuristic. B, trade-off. C, payoff."], [350.13, 352.24, "The answer is A: heuristic."], [353.38, 357.39, "Limited time and information restrict our reasoning: this is blank."], [357.69, 362.4, "A, risk aversion. B, bounded rationality. C, optimal choice."], [365.97, 368.81, "The answer is B: bounded rationality."], [369.95, 371.73, "Choose the correct sentence."], [372.03, 378.24, "A, She waited rather than rushed.. B, She waited rather than rushing.. C, She waited rather than to rush.."], [381.8, 384.74, "The answer is B: She waited rather than rushing.."], [385.88, 388.42, "According to the reading, 'satisficing' means…"], [388.72, 395.25, "A, maximising every time. B, stopping at good enough. C, avoiding all choices."], [398.8, 401.08, "The answer is B: stopping at good enough."], [402.27, 405.3, "Part six: speaking. It's your turn to talk."], [406.15, 410.53, "Why might someone rely on a heuristic instead of calculating the 'optimal' choice?"], [427.32, 428.72, "Now listen to Visal."], [429.02, 459.71, "Someone might rely on a heuristic because calculating the optimal choice costs time, effort and information that they may not have. Rather than searching exhaustively, they use a shortcut that is usually good enough. In a fast-changing situation, a quick decision can be better than a perfect one that arrives too late. The danger is systematic bias, so heuristics should be checked when stakes are high."], [460.01, 461.67, "Excellent answer, Visal!"], [462.58, 466.75, "Great work! Now you can use eight new words and rather than plus gerund."], [467.05, 471.62, "Today's value is rational reflection. Pause to think carefully before you decide."], [471.93, 474.75, "See you in Unit sixteen. Goodbye!"], [475.05, 478.97, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C2B2-Unit16-Ethics-of-AI": [[0.35, 5.13, "Hello, everyone! I'm Ms. Emma. Welcome to Online C two, Book two."], [5.43, 8.7, "Hi! I'm Visal. Let's learn together!"], [9.0, 15.43, "Unit sixteen: Ethics of AI. Today you will assign responsibility using passive modals."], [15.72, 18.34, "Here is our lesson map. Let's start!"], [19.3, 22.43, "Part one: words. You will learn eight new words."], [23.28, 24.88, "Algorithmic bias."], [25.88, 31.63, "Algorithmic bias means unfair patterns in an algorithm's results, often reflecting biased data."], [32.22, 35.7, "Algorithmic bias denied qualified applicants interviews."], [36.32, 39.63, "Your turn. Say: Algorithmic bias."], [42.47, 44.15, "Algorithmic bias."], [44.92, 46.3, "Accountability."], [47.32, 52.17, "Accountability means the obligation to explain and answer for one's actions."], [52.78, 56.37, "Accountability requires that someone can be called to answer."], [56.98, 59.88, "Your turn. Say: Accountability."], [62.73, 64.11, "Accountability."], [64.85, 66.29, "Transparency."], [67.28, 71.71, "Transparency means openness about how a system works and makes decisions."], [72.32, 76.07, "Transparency allows outsiders to audit automated decisions."], [76.68, 79.72, "Your turn. Say: Transparency."], [82.57, 83.81, "Transparency."], [84.55, 85.8, "Autonomy."], [86.78, 91.35, "Autonomy means the ability to act independently, without outside control."], [91.95, 95.03, "Greater machine autonomy complicates the question of blame."], [95.62, 98.18, "Your turn. Say: Autonomy."], [101.03, 102.13, "Autonomy."], [102.88, 104.34, "AI alignment."], [105.35, 110.22, "AI alignment means making AI systems pursue goals consistent with human values."], [110.82, 113.71, "AI alignment is a central research challenge."], [114.32, 117.47, "Your turn. Say: AI alignment."], [120.33, 122.39, "AI alignment."], [123.15, 124.52, "Moral agency."], [125.52, 130.48, "Moral agency means the capacity to make moral choices and be held responsible."], [131.08, 134.6, "Most thinkers deny that current software has moral agency."], [135.22, 138.4, "Your turn. Say: Moral agency."], [141.27, 142.87, "Moral agency."], [143.62, 144.71, "Regulation."], [145.72, 149.47, "Regulation means official rules that govern how something may be done."], [150.08, 153.87, "Regulation of high-risk systems is advancing in several regions."], [154.48, 157.24, "Your turn. Say: Regulation."], [160.1, 161.12, "Regulation."], [161.88, 163.42, "Societal impact."], [164.42, 168.47, "Societal impact means the effect of something on society as a whole."], [169.08, 172.14, "A societal impact assessment preceded the rollout."], [172.75, 176.16, "Your turn. Say: Societal impact."], [179.0, 180.65, "Societal impact."], [181.47, 185.09, "Part two: dialogue. Let's listen to a conversation."], [185.95, 191.22, "Visal, a hiring algorithm rejected many qualified women. Who is to blame, the program?"], [192.32, 199.91, "Not the program, since software lacks moral agency. Developers should be held accountable for algorithmic bias."], [201.02, 202.83, "Even if they didn't intend it?"], [203.92, 212.43, "Intent isn't the standard. Systems that affect lives must be tested before deployment, and the results ought to be published."], [213.52, 214.92, "And the company using it?"], [216.02, 224.34, "It should be held responsible too. Regulation could be introduced so that both parties are required to demonstrate fairness."], [225.5, 226.86, "Part three: grammar."], [227.72, 230.83, "Grammar focus: Passive modal (should be held)."], [231.13, 232.32, "Look at the pattern."], [233.02, 236.14, "Developers should be held accountable for algorithmic bias."], [237.05, 239.5, "Systems must be tested before deployment."], [240.42, 243.36, "The results ought to be published for public scrutiny."], [244.3, 253.14, "Passive modals: should be held, must be tested, ought to be published, could have been prevented. After 'should' and 'must' there is no 'to'; after 'ought' there is."], [253.88, 257.75, "Be careful! Don't say: Developers should hold accountable."], [259.7, 262.5, "Say: Developers should be held accountable."], [262.8, 264.8, "should be + past participle."], [265.6, 269.29, "Part four: reading. Read and listen."], [270.1, 271.8, "Who Answers for the Machine?."], [272.1, 279.59, "As algorithms increasingly decide who receives loans, jobs or parole, the question of responsibility has become urgent."], [280.6, 288.83, "Because current systems lack moral agency, most ethicists argue that blame must fall on the humans who design, deploy and profit from them."], [289.83, 297.93, "Algorithmic bias, which often reflects prejudice hidden in training data, should be detected through audits and corrected before systems are released."], [298.93, 303.75, "Transparency is essential, for decisions that cannot be explained cannot be challenged."], [304.77, 312.37, "Looking further ahead, AI alignment asks whether increasingly autonomous systems can be made to pursue goals that humans would endorse."], [313.47, 317.31, "Part five: quiz. Five questions. Are you ready?"], [318.15, 320.8, "Developers should blank accountable for bias."], [321.1, 324.47, "A, hold. B, be held. C, be holding."], [328.03, 329.87, "The answer is B: be held."], [331.02, 334.03, "The obligation to answer for one's actions is blank."], [334.33, 338.2, "A, autonomy. B, accountability. C, alignment."], [341.77, 344.37, "The answer is B: accountability."], [345.52, 348.5, "Unfair patterns in an algorithm's results are blank."], [348.8, 353.56, "A, algorithmic bias. B, transparency. C, regulation."], [357.1, 359.39, "The answer is A: algorithmic bias."], [360.55, 362.31, "Choose the correct sentence."], [362.61, 369.7, "A, Systems must be test first.. B, Systems must tested first.. C, Systems must be tested first.."], [373.23, 376.55, "The answer is C: Systems must be tested first.."], [377.68, 380.15, "According to the reading, blame must fall on…"], [380.45, 385.66, "A, the software itself. B, the humans who design and deploy it. C, no one."], [389.2, 392.6, "The answer is B: the humans who design and deploy it."], [393.8, 396.67, "Part six: speaking. It's your turn to talk."], [397.52, 401.54, "Who should be held accountable when an AI system causes harm?"], [418.35, 419.73, "Now listen to Visal."], [420.03, 448.51, "The humans and organisations behind the system should be held accountable, because software cannot bear moral responsibility. Developers must test for bias, and companies that deploy systems should be required to monitor and correct them. Where harm is serious, regulation should assign liability clearly, so that victims are not left without recourse. Accountability works best when it is shared and enforceable."], [448.81, 450.48, "Excellent answer, Visal!"], [451.38, 456.04, "Great work! Now you can use eight new words and passive modal (should be held)."], [456.34, 461.57, "Today's value is ethical responsibility. Take ownership of the effects of what you create."], [461.87, 464.61, "See you in Unit seventeen. Goodbye!"], [464.91, 467.76, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C2B2-Unit17-Existentialism": [[0.35, 5.3, "Hello, everyone! I'm Ms. Emma. Welcome to Online C two, Book two."], [5.6, 9.3, "Hi! I'm Visal. Let's learn together!"], [9.6, 16.61, "Unit seventeen: Existentialism. Today you will reason about meaning using subjunctive-style hypotheticals."], [16.91, 19.7, "Here is our lesson map. Let's start!"], [20.67, 23.86, "Part one: words. You will learn eight new words."], [24.72, 26.08, "Existentialism."], [27.08, 32.19, "Existentialism means the philosophy that individuals create their own meaning through free choice."], [32.78, 36.55, "Existentialism places responsibility for meaning on the individual."], [37.15, 40.01, "Your turn. Say: Existentialism."], [42.87, 44.32, "Existentialism."], [45.08, 46.27, "Authenticity."], [47.28, 52.02, "Authenticity means living in accordance with one's own values rather than social pressure."], [52.62, 56.37, "Authenticity demands honesty about what one truly values."], [56.98, 59.87, "Your turn. Say: Authenticity."], [62.73, 63.85, "Authenticity."], [64.62, 65.64, "Absurdism."], [66.65, 71.61, "Absurdism means the view that humans seek meaning in a universe that offers none."], [72.22, 76.22, "Camus's absurdism rejects both despair and false comfort."], [76.82, 79.75, "Your turn. Say: Absurdism."], [82.6, 83.74, "Absurdism."], [84.48, 85.81, "Radical freedom."], [86.82, 92.24, "Radical freedom means Sartre's idea that humans are free and wholly responsible for their choices."], [92.85, 95.35, "Radical freedom removes every excuse."], [95.95, 98.66, "Your turn. Say: Radical freedom."], [101.5, 102.85, "Radical freedom."], [103.58, 104.67, "Bad faith."], [105.65, 109.56, "Bad faith means self-deception in which one denies one's own freedom."], [110.15, 113.26, "Blaming circumstances for every choice is bad faith."], [113.85, 116.8, "Your turn. Say: Bad faith."], [119.67, 120.92, "Bad faith."], [121.68, 122.57, "Angst."], [123.58, 128.0, "Angst means deep anxiety arising from the awareness of freedom and mortality."], [128.58, 130.53, "Angst is the dizziness of freedom."], [131.12, 133.43, "Your turn. Say: Angst."], [136.27, 137.21, "Angst."], [137.95, 139.5, "Self-determination."], [140.48, 144.25, "Self-determination means the power to decide one's own course of life."], [144.85, 147.67, "Self-determination is both a gift and a burden."], [148.28, 151.31, "Your turn. Say: Self-determination."], [154.17, 155.72, "Self-determination."], [156.48, 157.68, "Meaning-making."], [158.68, 162.6, "Meaning-making means the active process of creating purpose in one's life."], [163.18, 166.47, "Meaning-making can happen through work, love and commitment."], [167.08, 169.54, "Your turn. Say: Meaning-making."], [172.4, 174.14, "Meaning-making."], [174.93, 178.33, "Part two: dialogue. Let's listen to a conversation."], [179.18, 183.46, "Visal, if life has no built-in purpose, why bother doing anything?"], [184.55, 191.08, "That is the existentialist's starting point. Were meaning not given, we would need to create it ourselves."], [192.18, 193.92, "That sounds exhausting."], [195.02, 202.73, "It can be. Had we been handed a script, we would have been spared the angst, but also the authorship of our own lives."], [203.82, 205.33, "So freedom is the burden?"], [206.42, 215.07, "And the gift. Should we refuse the responsibility, we would be living in bad faith, pretending that circumstances choose for us."], [216.23, 217.64, "Part three: grammar."], [218.48, 221.86, "Grammar focus: Subjunctive-style hypotheticals."], [222.16, 223.36, "Look at the pattern."], [224.05, 227.06, "Were meaning not given, we would need to create it."], [227.95, 231.49, "Had we been handed a script, we would have been spared the angst."], [232.38, 235.83, "Should we refuse responsibility, we would be living in bad faith."], [236.8, 246.66, "Inversion replaces 'if': Were X (= If X were), Had X (= If X had), Should X (= If X should). Negative: Were meaning not given (not 'Weren't meaning given')."], [247.42, 252.04, "Be careful! Don't say: If meaning would not be given, we create it."], [254.0, 257.35, "Say: Were meaning not given, we would create it."], [257.65, 260.14, "Inversion + would for hypotheticals."], [260.93, 263.64, "Part four: reading. Read and listen."], [264.43, 265.85, "Condemned to Be Free."], [266.15, 270.8, "Existentialism begins from the claim that human beings are not born with a fixed purpose."], [271.8, 279.89, "Sartre argued that existence precedes essence: we exist first and then define ourselves through our choices, a condition he called radical freedom."], [280.9, 286.5, "Were meaning handed to us, we would be relieved of responsibility, but we would also lose authorship of our lives."], [287.5, 294.76, "Camus, writing about absurdism, accepted that the universe is silent, yet insisted that one must imagine Sisyphus happy."], [295.77, 303.06, "Authenticity, for existentialists, means choosing deliberately instead of hiding in bad faith behind roles and excuses."], [304.17, 308.12, "Part five: quiz. Five questions. Are you ready?"], [308.98, 311.42, "blank meaning not given, we would need to create it."], [311.72, 314.58, "A, Was. B, Were. C, Is."], [318.13, 319.71, "The answer is B: Were."], [320.85, 323.72, "Self-deception that denies one's freedom is blank."], [324.02, 327.77, "A, absurdism. B, bad faith. C, angst."], [331.3, 333.39, "The answer is B: bad faith."], [334.55, 336.81, "The deep anxiety of freedom is blank."], [337.11, 341.13, "A, angst. B, authenticity. C, meaning-making."], [344.67, 346.51, "The answer is A: angst."], [347.65, 349.36, "Choose the correct inversion."], [349.66, 355.54, "A, Had we known, we would have acted.. B, Had we knew, we would acted.. C, Have we known, we would act.."], [359.1, 362.24, "The answer is A: Had we known, we would have acted.."], [363.38, 366.0, "According to the reading, authenticity means…"], [366.3, 371.96, "A, hiding behind roles. B, choosing deliberately. C, avoiding choices."], [375.5, 378.09, "The answer is B: choosing deliberately."], [379.3, 382.28, "Part six: speaking. It's your turn to talk."], [383.12, 387.16, "How might an existentialist respond to the feeling that life lacks inherent meaning?"], [403.95, 405.44, "Now listen to Visal."], [405.74, 432.07, "An existentialist would say that the absence of given meaning is not a tragedy but a task. Were meaning handed to us, we would lose the freedom to author our lives. We must therefore create it through commitments, relationships and work. This is demanding, since no one can choose on our behalf, but it is also dignifying. Meaning is something we make rather than find."], [432.37, 434.32, "Excellent answer, Visal!"], [435.22, 440.0, "Great work! Now you can use eight new words and subjunctive-style hypotheticals."], [440.31, 444.98, "Today's value is authentic living. Live by choices that are truly your own."], [445.28, 447.96, "See you in Unit eighteen. Goodbye!"], [448.26, 450.81, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C2B2-Unit18-Phenomenology": [[0.35, 5.36, "Hello, everyone! I'm Ms. Emma. Welcome to Online C two, Book two."], [5.66, 9.55, "Hi! I'm Visal. Let's learn together!"], [9.85, 16.39, "Unit eighteen: Phenomenology. Today you will describe experience using 'from a ... perspective' structures."], [16.69, 19.48, "Here is our lesson map. Let's start!"], [20.43, 23.52, "Part one: words. You will learn eight new words."], [24.35, 25.5, "Phenomenology."], [26.52, 31.21, "Phenomenology means the study of conscious experience as it appears to the person having it."], [31.82, 34.7, "Phenomenology begins with description, not theory."], [35.28, 38.27, "Your turn. Say: Phenomenology."], [41.13, 42.38, "Phenomenology."], [43.12, 44.36, "Lived experience."], [45.35, 49.66, "Lived experience means the first-hand way something is actually felt and undergone."], [50.25, 53.86, "Policy often ignores the lived experience of those it affects."], [54.45, 57.75, "Your turn. Say: Lived experience."], [60.6, 62.63, "Lived experience."], [63.38, 64.74, "Intentionality."], [65.75, 69.54, "Intentionality means the directedness of consciousness toward an object."], [70.15, 73.41, "Intentionality means every thought is a thought of something."], [74.02, 77.01, "Your turn. Say: Intentionality."], [79.87, 81.38, "Intentionality."], [82.12, 83.11, "Bracketing."], [84.12, 88.74, "Bracketing means setting aside assumptions in order to describe experience as it is."], [89.35, 92.52, "Bracketing asks us to suspend our theories temporarily."], [93.12, 95.53, "Your turn. Say: Bracketing."], [98.37, 99.24, "Bracketing."], [99.98, 100.9, "Perception."], [101.92, 105.28, "Perception means the way something is sensed and interpreted."], [105.88, 108.73, "Merleau-Ponty argued that perception is embodied."], [109.32, 111.9, "Your turn. Say: Perception."], [114.73, 115.76, "Perception."], [116.52, 118.47, "First-person perspective."], [119.48, 124.19, "First-person perspective means the point of view of the one who undergoes the experience."], [124.78, 129.02, "Pain is known from a first-person perspective in a way no scan captures."], [129.62, 133.03, "Your turn. Say: First-person perspective."], [135.9, 138.2, "First-person perspective."], [138.95, 140.08, "Consciousness."], [141.08, 145.8, "Consciousness means the state of being aware of oneself and one's surroundings."], [146.38, 150.32, "For phenomenologists, consciousness is always consciousness of something."], [150.92, 153.85, "Your turn. Say: Consciousness."], [156.7, 158.08, "Consciousness."], [158.85, 159.94, "Embodiment."], [160.95, 164.91, "Embodiment means the fact that experience is shaped by having a living body."], [165.52, 168.63, "Embodiment shapes how we perceive space and effort."], [169.22, 171.73, "Your turn. Say: Embodiment."], [174.57, 175.72, "Embodiment."], [176.53, 180.08, "Part two: dialogue. Let's listen to a conversation."], [180.92, 186.03, "Visal, how does phenomenology differ from psychology? Both study experience."], [187.12, 198.01, "Phenomenology studies experience from a first-person perspective, describing how things appear, rather than measuring them from outside."], [199.12, 200.84, "But isn't that unscientific?"], [201.95, 211.32, "From a methodological perspective it is rigorous. Bracketing asks us to set aside assumptions so that description comes first."], [212.42, 213.75, "And what does it reveal?"], [214.85, 224.68, "From the perspective of embodiment, perception is not passive. We experience a hill as steep partly because of our own tired legs."], [225.83, 227.55, "Part three: grammar."], [228.42, 232.23, "Grammar focus: From a [X] perspective structures."], [232.53, 233.78, "Look at the pattern."], [234.48, 238.41, "Phenomenology studies experience from a first-person perspective."], [239.32, 242.76, "From a methodological perspective, bracketing is rigorous."], [243.65, 247.23, "From the perspective of embodiment, perception is never passive."], [248.17, 256.95, "'From a … perspective' introduces the viewpoint: from a legal / historical / first-person perspective. 'Perspective' is singular after 'a'; it can start or end the sentence."], [257.68, 262.96, "Be careful! Don't say: In a first-person perspective, experience is studied."], [264.9, 268.39, "Say: From a first-person perspective, experience is studied."], [268.69, 270.34, "Use 'from a … perspective'."], [271.13, 273.62, "Part four: reading. Read and listen."], [274.43, 276.44, "Back to the Things Themselves."], [276.74, 285.47, "Edmund Husserl founded phenomenology with the call to return to the things themselves, that is, to describe experience as it is lived rather than as theories say it should be."], [286.47, 292.33, "Central to the method is bracketing, the temporary suspension of assumptions about whether the world is as it appears."], [293.33, 300.89, "Phenomenologists emphasise intentionality: consciousness is always directed toward something, whether a tree, a memory or a hope."], [301.9, 311.23, "Merleau-Ponty added that perception cannot be understood apart from the body; from the perspective of embodiment, we perceive the world through our ability to act in it."], [312.23, 318.99, "Phenomenology thus complements the sciences by describing what cannot be captured from a third-person perspective alone."], [320.1, 323.9, "Part five: quiz. Five questions. Are you ready?"], [324.75, 329.75, "Phenomenology studies experience blank a first-person perspective."], [330.05, 332.93, "A, in. B, from. C, at."], [336.47, 338.15, "The answer is B: from."], [339.32, 342.84, "Setting aside assumptions to describe experience is blank."], [343.14, 347.34, "A, bracketing. B, embodiment. C, intentionality."], [350.9, 352.66, "The answer is A: bracketing."], [353.82, 357.01, "The directedness of consciousness toward objects is blank."], [357.31, 362.21, "A, perception. B, intentionality. C, lived experience."], [365.77, 368.21, "The answer is B: intentionality."], [369.35, 370.99, "Choose the correct sentence."], [371.29, 379.33, "A, From a legal perspective, the claim is weak.. B, From legal perspective, claim weak.. C, From a legally perspective, the claim is weak.."], [382.87, 386.83, "The answer is A: From a legal perspective, the claim is weak.."], [387.98, 392.43, "According to the reading, phenomenology complements science by describing what…"], [392.73, 399.07, "A, a third-person view cannot capture. B, scientists already know. C, cannot be experienced."], [402.63, 406.32, "The answer is A: a third-person view cannot capture."], [407.5, 410.64, "Part six: speaking. It's your turn to talk."], [411.48, 415.36, "What does it mean to study experience from a 'first-person perspective'?"], [432.15, 433.67, "Now listen to Visal."], [433.97, 460.4, "To study experience from a first-person perspective means describing it as it is lived by the person undergoing it, rather than measuring it from outside. A scan can show which area of the brain is active during pain, but only the first-person view tells us what the pain is like. Phenomenologists try to bracket their assumptions so that they describe rather than explain. The aim is faithful description."], [460.7, 462.23, "Excellent answer, Visal!"], [463.12, 468.06, "Great work! Now you can use eight new words and from a [x] perspective structures."], [468.36, 473.41, "Today's value is reflective awareness. Notice your own experience with care and honesty."], [473.71, 476.31, "See you in Unit nineteen. Goodbye!"], [476.61, 479.18, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C2B2-Unit19-Critical-Theory": [[0.35, 4.91, "Hello, everyone! I'm Ms. Emma. Welcome to Online C two, Book two."], [5.21, 8.9, "Hi! I'm Visal. Let's learn together!"], [9.2, 15.79, "Unit nineteen: Critical Theory. Today you will link ideas to action using aim/goal infinitive clauses."], [16.09, 18.83, "Here is our lesson map. Let's start!"], [19.77, 23.49, "Part one: words. You will learn eight new words."], [24.35, 25.65, "Critical theory."], [26.65, 31.74, "Critical theory means social analysis that aims to expose and change structures of domination."], [32.35, 36.08, "Critical theory examines whom a social arrangement truly serves."], [36.68, 39.74, "Your turn. Say: Critical theory."], [42.6, 43.76, "Critical theory."], [44.52, 45.76, "Power structure."], [46.75, 50.91, "Power structure means the arrangement of who holds influence and who does not."], [51.52, 54.92, "The power structure of the firm favoured senior male managers."], [55.52, 58.59, "Your turn. Say: Power structure."], [61.43, 62.82, "Power structure."], [63.58, 64.89, "Emancipation."], [65.88, 70.02, "Emancipation means liberation from oppression or restrictive constraints."], [70.62, 74.89, "Emancipation requires changing conditions, not only attitudes."], [75.48, 78.56, "Your turn. Say: Emancipation."], [81.4, 82.61, "Emancipation."], [83.35, 85.01, "Ideology critique."], [86.02, 91.36, "Ideology critique means analysis of how beliefs conceal and justify unequal power."], [91.95, 95.82, "Ideology critique asks who benefits from a 'common sense' belief."], [96.42, 99.82, "Your turn. Say: Ideology critique."], [102.67
