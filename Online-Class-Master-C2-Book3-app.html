160.22, 163.76, "Delayed gratification predicts success in many studies."], [164.35, 167.26, "Your turn. Say: Delayed gratification."], [170.1, 171.93, "Delayed gratification."], [172.73, 176.48, "Part two: dialogue. Let's listen to a conversation."], [177.32, 183.17, "Visal, I know I should save my salary, yet I keep spending it on small treats. Why?"], [184.28, 194.12, "The brain sometimes favors immediate reward over delayed gratification, because the reward system responds strongly to what is near."], [195.22, 197.13, "So it's not a lack of willpower?"], [198.25, 209.47, "Partly biology. Value computation discounts future benefits, so people often favor a small prize today over a larger one next year."], [210.58, 211.94, "Can we resist it?"], [213.05, 219.07, "Yes. Automatic saving favors the long term by removing the daily decision."], [220.23, 221.68, "Part three: grammar."], [222.52, 225.55, "Grammar focus: Favoring X over Y."], [225.85, 227.01, "Look at the pattern."], [227.72, 231.55, "The brain sometimes favors immediate reward over delayed gratification."], [232.45, 236.69, "Many people favor a small prize today over a larger one next year."], [237.58, 241.79, "Automatic saving favors the long term over momentary impulse."], [242.73, 252.7, "Use favor / prefer / prioritise X over Y. 'Over' shows the rejected option. Do not use 'than' after favor: favors X over Y (not 'favors X than Y')."], [253.45, 257.66, "Be careful! Don't say: The brain favors reward than delay."], [259.6, 262.68, "Say: The brain favors reward over delay."], [262.98, 264.54, "favor X over Y."], [265.33, 267.97, "Part four: reading. Read and listen."], [268.77, 269.88, "The Pull of Now."], [270.18, 275.05, "Neuroeconomics combines neuroscience with economics to explain how decisions are made."], [276.07, 283.19, "Brain scans show that the reward system, driven by dopamine, responds more strongly to immediate rewards than to future ones."], [284.2, 291.22, "As a result, the brain sometimes favors immediate reward over delayed gratification, even when waiting would pay more."], [292.2, 298.01, "Impulsivity varies between individuals and is influenced by stress, sleep and environment."], [299.0, 305.14, "Policy design can help by making the beneficial option automatic, so that the long term is favored without effort."], [306.23, 310.32, "Part five: quiz. Five questions. Are you ready?"], [311.15, 314.61, "The brain favors immediate reward blank delayed gratification."], [314.91, 317.85, "A, over. B, than. C, to."], [321.4, 323.16, "The answer is A: over."], [324.32, 326.99, "A brain chemical linked to motivation is blank."], [327.29, 330.77, "A, dopamine. B, impulsivity. C, circuit."], [334.33, 336.19, "The answer is A: dopamine."], [337.35, 339.73, "Waiting for a larger reward is blank."], [340.03, 345.86, "A, impulsivity. B, delayed gratification. C, value computation."], [349.4, 352.29, "The answer is B: delayed gratification."], [353.45, 355.18, "Choose the correct sentence."], [355.48, 362.78, "A, She favors safety than speed.. B, She favors safety over speed.. C, She favors safety to over speed.."], [366.33, 369.82, "The answer is B: She favors safety over speed.."], [370.98, 375.03, "According to the reading, policy can help by making the beneficial option…"], [375.33, 379.4, "A, optional. B, automatic. C, expensive."], [382.93, 384.97, "The answer is B: automatic."], [386.17, 389.0, "Part six: speaking. It's your turn to talk."], [389.85, 394.69, "Why do you think people sometimes choose immediate rewards over long-term benefits?"], [411.48, 412.96, "Now listen to Visal."], [413.26, 438.27, "People often choose immediate rewards because the brain weights the present more heavily than the future. A small pleasure today feels certain, whereas a larger benefit next year feels distant and uncertain. Stress and tiredness make this worse. Setting up automatic habits, such as saving on payday, helps the long term win over the moment."], [438.57, 440.18, "Excellent answer, Visal!"], [441.08, 445.33, "Great work! Now you can use eight new words and favoring x over y."], [445.63, 450.58, "Today's value is self-discipline. Control your habits, so your habits do not control you."], [450.88, 453.38, "See you in Unit seven. Goodbye!"], [453.68, 456.8, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C2B3-Unit07-Political-Philosophy": [[0.35, 5.07, "Hello, everyone! I'm Ms. Emma. Welcome to Online C two, Book three."], [5.37, 9.42, "Hi! I'm Visal. Let's learn together!"], [9.72, 15.77, "Unit seven: Political Philosophy. Today you will trace authority using derives from / stems from."], [16.07, 18.85, "Here is our lesson map. Let's start!"], [19.8, 22.98, "Part one: words. You will learn eight new words."], [23.82, 25.22, "Social contract."], [26.22, 30.53, "Social contract means an imagined agreement that grounds government in consent."], [31.12, 34.58, "Social contract theory justifies the state by agreement."], [35.18, 38.18, "Your turn. Say: Social contract."], [41.03, 42.59, "Social contract."], [43.35, 44.46, "Sovereignty."], [45.45, 48.34, "Sovereignty means supreme authority within a territory."], [48.95, 51.87, "Sovereignty belongs to the people in a democracy."], [52.48, 55.16, "Your turn. Say: Sovereignty."], [58.0, 59.33, "Sovereignty."], [60.08, 61.13, "Justice."], [62.12, 64.66, "Justice means fair and morally right treatment."], [65.25, 68.06, "Justice requires that like cases be treated alike."], [68.65, 71.44, "Your turn. Say: Justice."], [74.3, 75.45, "Justice."], [76.22, 77.38, "Legitimacy."], [78.38, 81.41, "Legitimacy means the widely accepted right to rule."], [82.02, 84.9, "Legitimacy fades when elections are rigged."], [85.48, 87.87, "Your turn. Say: Legitimacy."], [90.73, 91.95, "Legitimacy."], [92.72, 94.17, "Natural rights."], [95.18, 98.97, "Natural rights means rights held by all people regardless of law."], [99.58, 102.64, "Locke argued that natural rights include life and liberty."], [103.25, 105.93, "Your turn. Say: Natural rights."], [108.77, 110.12, "Natural rights."], [110.85, 112.07, "State of nature."], [113.08, 117.1, "State of nature means a hypothetical condition before government exists."], [117.72, 119.62, "Hobbes feared the state of nature."], [120.22, 122.78, "Your turn. Say: State of nature."], [125.63, 127.13, "State of nature."], [127.88, 128.77, "Consent."], [129.78, 131.96, "Consent means voluntary agreement."], [132.55, 135.16, "Consent is what separates authority from force."], [135.75, 137.98, "Your turn. Say: Consent."], [140.83, 141.83, "Consent."], [142.58, 144.01, "Political obligation."], [145.02, 148.63, "Political obligation means the duty citizens have to obey the law."], [149.22, 152.67, "Political obligation is debated when laws seem unjust."], [153.28, 156.21, "Your turn. Say: Political obligation."], [159.07, 160.54, "Political obligation."], [161.33, 165.03, "Part two: dialogue. Let's listen to a conversation."], [165.88, 169.5, "Visal, why should I obey a government I never chose?"], [170.58, 178.24, "Theorists say legitimacy derives from the consent of the governed, even when that consent is tacit."], [179.35, 181.59, "And if a government ignores its people?"], [182.68, 190.44, "Its authority stems from consent, so abuse can erode it. Locke thought natural rights limited what any state could demand."], [191.55, 193.82, "So obligation is conditional?"], [194.92, 202.76, "For many philosophers, yes. Political obligation derives from fair treatment, not from power alone."], [203.9, 205.47, "Part three: grammar."], [206.32, 210.09, "Grammar focus: Source-of language (derives from, stems from)."], [210.39, 211.51, "Look at the pattern."], [212.22, 214.9, "Legitimacy derives from the consent of the governed."], [215.82, 218.52, "Authority stems from fair treatment, not power."], [219.42, 222.5, "Political obligation flows from reciprocal duties."], [223.43, 231.41, "Name the source with derive from, stem from, flow from, spring from. All take 'from' (never 'of' or 'by'): legitimacy derives from consent."], [232.15, 235.86, "Be careful! Don't say: Legitimacy derives of consent."], [237.8, 240.72, "Say: Legitimacy derives from consent."], [241.02, 242.24, "derive from (not 'of')."], [243.03, 245.82, "Part four: reading. Read and listen."], [246.63, 247.76, "Why Obey?."], [248.06, 252.48, "Political philosophy asks what justifies the power that governments exercise."], [253.47, 258.59, "Hobbes argued that without a sovereign, life in the state of nature would be a war of all against all."], [259.6, 266.82, "Locke replied that legitimacy derives from the consent of the governed, and that rulers who violate natural rights forfeit their authority."], [267.83, 274.95, "Modern theorists add that political obligation stems from fairness: those who receive the benefits of cooperation owe their share."], [275.97, 280.33, "Whatever the account, authority that rests on force alone is rarely stable."], [281.43, 285.26, "Part five: quiz. Five questions. Are you ready?"], [286.12, 289.08, "Legitimacy derives blank the consent of the governed."], [289.38, 292.25, "A, from. B, of. C, to."], [295.8, 297.49, "The answer is A: from."], [298.65, 301.28, "Supreme authority within a territory is blank."], [301.58, 305.51, "A, justice. B, sovereignty. C, consent."], [309.07, 311.21, "The answer is B: sovereignty."], [312.35, 315.46, "A hypothetical condition before government is the blank."], [315.76, 320.65, "A, state of nature. B, social contract. C, legitimacy."], [324.2, 326.33, "The answer is A: state of nature."], [327.48, 329.2, "Choose the correct sentence."], [329.5, 336.1, "A, Authority stems from consent.. B, Authority stems of consent.. C, Authority stems by consent.."], [339.63, 342.97, "The answer is A: Authority stems from consent.."], [344.12, 347.73, "According to the reading, authority resting on force alone is…"], [348.03, 352.54, "A, stable. B, rarely stable. C, legitimate."], [356.1, 358.67, "The answer is B: rarely stable."], [359.87, 363.25, "Part six: speaking. It's your turn to talk."], [364.12, 367.07, "What makes a government's authority legitimate, in your view?"], [383.88, 385.35, "Now listen to Visal."], [385.65, 413.19, "In my view, a government is legitimate when its authority derives from fair procedures and the real consent of citizens. Elections, independent courts and respect for rights give people a way to hold power to account. A government that rules only by fear may be obeyed, but it is not legitimate. Legitimacy also needs to be earned continuously through fair treatment."], [413.49, 415.61, "Excellent answer, Visal!"], [416.52, 421.76, "Great work! Now you can use eight new words and source-of language (derives from, stems from)."], [422.06, 427.58, "Today's value is civic reasoning. Reason about how power and fairness should work in a society."], [427.88, 430.08, "See you in Unit eight. Goodbye!"], [430.38, 433.23, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C2B3-Unit08-Legal-Theory": [[0.35, 5.33, "Hello, everyone! I'm Ms. Emma. Welcome to Online C two, Book three."], [5.63, 9.3, "Hi! I'm Visal. Let's learn together!"], [9.6, 15.11, "Unit eight: Legal Theory. Today you will debate law using should + modal for debate."], [15.41, 17.97, "Here is our lesson map. Let's start!"], [18.93, 22.26, "Part one: words. You will learn eight new words."], [23.12, 24.47, "Jurisprudence."], [25.45, 28.82, "Jurisprudence means the philosophy and theory of law."], [29.42, 32.91, "Jurisprudence asks what law is and why it binds."], [33.52, 36.32, "Your turn. Say: Jurisprudence."], [39.17, 40.46, "Jurisprudence."], [41.22, 42.44, "Natural law."], [43.45, 48.48, "Natural law means the view that law is grounded in universal moral principles."], [49.08, 53.12, "Natural law holds that an unjust law is no true law."], [53.72, 56.62, "Your turn. Say: Natural law."], [59.47, 60.97, "Natural law."], [61.72, 63.22, "Legal positivism."], [64.22, 69.37, "Legal positivism means the view that law is whatever authority validly enacts."], [69.98, 72.9, "Legal positivism separates law from morality."], [73.52, 76.54, "Your turn. Say: Legal positivism."], [79.4, 81.02, "Legal positivism."], [81.75, 82.64, "Precedent."], [83.65, 87.02, "Precedent means an earlier decision that guides later cases."], [87.62, 91.67, "The court followed precedent from 1954."], [92.28, 95.04, "Your turn. Say: Precedent."], [97.9, 98.82, "Precedent."], [99.58, 100.65, "Rule of law."], [101.65, 106.26, "Rule of law means the principle that everyone, including rulers, is subject to law."], [106.85, 110.28, "The rule of law protects citizens from arbitrary power."], [110.88, 113.97, "Your turn. Say: Rule of law."], [116.8, 118.56, "Rule of law."], [119.32, 121.08, "Judicial interpretation."], [122.08, 126.22, "Judicial interpretation means judges' explanation of what a law means."], [126.82, 130.73, "Judicial interpretation can extend a statute to new cases."], [131.32, 134.63, "Your turn. Say: Judicial interpretation."], [137.47, 139.09, "Judicial interpretation."], [139.85, 140.99, "Legal reasoning."], [141.98, 145.96, "Legal reasoning means the logic by which judges reach decisions."], [146.55, 150.04, "Legal reasoning applies general rules to particular facts."], [150.65, 153.56, "Your turn. Say: Legal reasoning."], [156.4, 157.6, "Legal reasoning."], [158.35, 160.09, "Statutory construction."], [161.08, 164.67, "Statutory construction means the rules for interpreting written laws."], [165.28, 168.26, "Statutory construction resolves unclear wording."], [168.85, 171.91, "Your turn. Say: Statutory construction."], [174.77, 176.56, "Statutory construction."], [177.37, 181.13, "Part two: dialogue. Let's listen to a conversation."], [181.98, 186.33, "Visal, should a judge follow an old decision even if it now seems wrong?"], [187.42, 196.62, "Judges should balance precedent with flexible interpretation. Stability matters, but justice should not be sacrificed to habit."], [197.72, 200.4, "Doesn't flexibility make law unpredictable?"], [201.52, 211.56, "It could. That is why positivists argue that judges ought to apply the law as written, and that legislatures should change it."], [212.65, 214.6, "And natural law theorists?"], [215.72, 221.81, "They would say that a grossly unjust rule should not be enforced, whatever its source."], [222.97, 224.69, "Part three: grammar."], [225.55, 228.51, "Grammar focus: Should plus modal for debate."], [228.81, 229.98, "Look at the pattern."], [230.68, 234.1, "Judges should balance precedent with flexible interpretation."], [234.98, 238.34, "Legislatures ought to amend unjust statutes."], [239.25, 242.19, "A grossly unjust rule should not be enforced."], [243.13, 252.41, "In debate use should / ought to / must + base verb to state a position. 'Should' is the most flexible and the least absolute. Introduce counterpoints with 'yet' or 'however'."], [253.15, 257.1, "Be careful! Don't say: Judges should to follow precedent."], [259.07, 261.6, "Say: Judges should follow precedent."], [261.9, 263.34, "No 'to' after should."], [264.13, 266.82, "Part four: reading. Read and listen."], [267.63, 268.67, "What Is Law?."], [268.97, 273.6, "Jurisprudence debates the nature of law and how judges ought to decide cases."], [274.6, 281.1, "Legal positivists hold that law is whatever authority validly enacts, so judges should apply it as written."], [282.1, 288.29, "Natural law theorists reply that a rule that grossly violates justice should not be treated as binding."], [289.3, 294.77, "Precedent gives stability and predictability, yet rigid adherence may perpetuate old mistakes."], [295.77, 301.63, "Most modern courts therefore balance precedent with careful interpretation, guided by the rule of law."], [302.73, 306.7, "Part five: quiz. Five questions. Are you ready?"], [307.55, 310.44, "Judges blank balance precedent with interpretation."], [310.74, 314.34, "A, should. B, should to. C, shoulds."], [317.9, 319.97, "The answer is A: should."], [321.12, 325.03, "The view that law is grounded in universal moral principles is blank."], [325.33, 329.66, "A, natural law. B, legal positivism. C, precedent."], [333.2, 335.32, "The answer is A: natural law."], [336.45, 339.48, "An earlier decision that guides later cases is a blank."], [339.78, 343.85, "A, statute. B, precedent. C, jurisprudence."], [347.4, 349.5, "The answer is B: precedent."], [350.65, 352.48, "Choose the correct sentence."], [352.77, 359.36, "A, Courts should respects precedent.. B, Courts should respect precedent.. C, Courts should to respect precedent.."], [362.9, 366.28, "The answer is B: Courts should respect precedent.."], [367.42, 370.67, "According to the reading, rigid adherence to precedent may…"], [370.97, 376.41, "A, perpetuate old mistakes. B, ensure justice. C, end the rule of law."], [379.97, 383.01, "The answer is A: perpetuate old mistakes."], [384.2, 387.14, "Part six: speaking. It's your turn to talk."], [387.98, 392.11, "Should judges strictly follow precedent, or interpret the law more flexibly?"], [408.92, 410.31, "Now listen to Visal."], [410.61, 434.07, "Judges should generally follow precedent, because it provides stability and equal treatment. However, they should be willing to depart from it when it is clearly unjust or outdated. Flexibility must be reasoned and transparent, not personal preference. A balanced approach protects both predictability and fairness, which are two pillars of the rule of law."], [434.38, 436.41, "Excellent answer, Visal!"], [437.32, 441.54, "Great work! Now you can use eight new words and should plus modal for debate."], [441.84, 446.65, "Today's value is critical reasoning. Test every argument before you accept it."], [446.95, 449.29, "See you in Unit nine. Goodbye!"], [449.59, 452.22, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C2B3-Unit09-Constitutional-Theory": [[0.35, 4.98, "Hello, everyone! I'm Ms. Emma. Welcome to Online C two, Book three."], [5.28, 8.97, "Hi! I'm Visal. Let's learn together!"], [9.27, 16.39, "Unit nine: Constitutional Theory. Today you will argue about government using prevent / protect against + noun."], [16.69, 19.26, "Here is our lesson map. Let's start!"], [20.2, 23.46, "Part one: words. You will learn eight new words."], [24.32, 25.77, "Constitutionalism."], [26.78, 31.99, "Constitutionalism means the principle that government power is limited by a constitution."], [32.58, 36.32, "Constitutionalism keeps even majorities within legal limits."], [36.92, 40.1, "Your turn. Say: Constitutionalism."], [42.97, 44.45, "Constitutionalism."], [45.22, 47.02, "Separation of powers."], [48.02, 54.16, "Separation of powers means dividing government into legislative, executive and judicial branches."], [54.75, 58.57, "Separation of powers stops any one branch from dominating."], [59.18, 62.58, "Your turn. Say: Separation of powers."], [65.43, 67.18, "Separation of powers."], [67.92, 69.17, "Judicial review."], [70.18, 74.77, "Judicial review means the power of courts to strike down unconstitutional laws."], [75.38, 78.37, "Judicial review enabled the court to cancel the statute."], [78.98, 82.11, "Your turn. Say: Judicial review."], [84.97, 86.26, "Judicial review."], [87.02, 88.54, "Checks and balances."], [89.55, 93.49, "Checks and balances means mechanisms by which branches limit one another."], [94.08, 97.46, "Checks and balances require cooperation between branches."], [98.05, 101.61, "Your turn. Say: Checks and balances."], [104.47, 106.29, "Checks and balances."], [107.05, 108.63, "Amendment process."], [109.62, 113.44, "Amendment process means the formal procedure for changing a constitution."], [114.05, 116.91, "A demanding amendment process protects stability."], [117.52, 120.73, "Your turn. Say: Amendment process."], [123.57, 125.22, "Amendment process."], [125.98, 127.0, "Federalism."], [127.98, 132.87, "Federalism means a system dividing power between central and regional governments."], [133.48, 136.31, "Federalism lets states experiment with policy."], [136.92, 139.47, "Your turn. Say: Federalism."], [142.3, 143.46, "Federalism."], [144.22, 145.45, "Civil liberties."], [146.45, 150.98, "Civil liberties means basic freedoms protected from government interference."], [151.58, 154.3, "Civil liberties include speech and assembly."], [154.92, 157.95, "Your turn. Say: Civil liberties."], [160.8, 162.24, "Civil liberties."], [162.98, 164.95, "Constitutional interpretation."], [165.95, 170.74, "Constitutional interpretation means the process of deciding what a constitution means."], [171.35, 176.07, "Constitutional interpretation divides originalists from living-document theorists."], [176.65, 180.45, "Your turn. Say: Constitutional interpretation."], [183.3, 185.58, "Constitutional interpretation."], [186.37, 190.37, "Part two: dialogue. Let's listen to a conversation."], [191.22, 194.63, "Visal, why can't a government just do what the majority wants?"], [195.72, 202.77, "Because checks and balances prevent the abuse of power. Even a majority can threaten minorities."], [203.88, 206.1, "How do they protect people in practice?"], [207.22, 217.9, "Judicial review protects civil liberties against hasty legislation, and the separation of powers guards against concentration of authority."], [219.02, 220.35, "Isn't that slow?"], [221.45, 230.34, "Deliberately so. Slowness helps prevent rash decisions, and a demanding amendment process protects against casual change."], [231.5, 233.48, "Part three: grammar."], [234.32, 238.06, "Grammar focus: Prevent and protect against plus noun."], [238.36, 239.58, "Look at the pattern."], [240.28, 243.08, "Checks and balances prevent the abuse of power."], [243.98, 248.25, "Judicial review protects civil liberties against hasty legislation."], [249.15, 252.45, "A strict amendment process guards against casual change."], [253.4, 266.13, "Prevent + noun (no preposition): prevent abuse. Protect/guard + noun + against + threat: protect liberties against abuse. 'Prevent from + -ing' needs a person: prevent them from acting."], [266.88, 270.8, "Be careful! Don't say: Checks prevents abuse of power."], [272.77, 275.25, "Say: Checks prevent the abuse of power."], [275.55, 277.56, "Plural subject, plural verb."], [278.37, 281.3, "Part four: reading. Read and listen."], [282.1, 283.43, "Limiting Power."], [283.73, 288.45, "Constitutionalism holds that government must be bound by rules it cannot change at will."], [289.47, 297.63, "The separation of powers divides authority among legislative, executive and judicial branches, so that checks and balances prevent the abuse of power."], [298.63, 305.64, "Judicial review protects civil liberties against majority rule, since courts may strike down laws that violate the constitution."], [306.63, 311.43, "Federalism adds a vertical check by dividing power between central and regional governments."], [312.43, 319.46, "A demanding amendment process guards against casual change, though critics argue that it can also preserve outdated provisions."], [320.57, 324.56, "Part five: quiz. Five questions. Are you ready?"], [325.42, 328.11, "Checks and balances blank the abuse of power."], [328.41, 332.54, "A, prevent. B, prevent from. C, prevent of."], [336.1, 338.04, "The answer is A: prevent."], [339.18, 342.99, "The power of courts to strike down unconstitutional laws is blank."], [343.29, 347.34, "A, federalism. B, judicial review. C, amendment."], [350.9, 353.35, "The answer is B: judicial review."], [354.52, 357.97, "Dividing power between central and regional governments is blank."], [358.27, 362.62, "A, federalism. B, constitutionalism. C, separation."], [366.17, 368.41, "The answer is A: federalism."], [369.55, 371.35, "Choose the correct sentence."], [371.65, 379.53, "A, Courts protect liberties against abuse.. B, Courts protect liberties of abuse.. C, Courts protect liberties abuse.."], [383.07, 386.77, "The answer is A: Courts protect liberties against abuse.."], [387.92, 391.8, "According to the reading, critics argue that amendment processes can…"], [392.1, 397.26, "A, preserve outdated provisions. B, speed reform. C, end review."], [400.8, 403.81, "The answer is A: preserve outdated provisions."], [405.0, 408.08, "Part six: speaking. It's your turn to talk."], [408.92, 412.27, "Why are checks and balances important in a system of government?"], [429.08, 430.58, "Now listen to Visal."], [430.88, 456.51, "Checks and balances are important because power tends to concentrate, and concentrated power is easily abused. When each branch can limit the others, no single group can rule unchecked. Courts protect civil liberties against the majority, and legislatures can restrain executives. The system is slower, but it prevents rash and unfair decisions."], [456.81, 458.56, "Excellent answer, Visal!"], [459.45, 464.02, "Great work! Now you can use eight new words and prevent and protect against plus noun."], [464.32, 469.91, "Today's value is civic responsibility. Take care of your city, because it is everyone's home."], [470.21, 472.74, "See you in Unit ten. Goodbye!"], [473.04, 475.79, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C2B3-Unit10-Comparative-Law": [[0.35, 5.16, "Hello, everyone! I'm Ms. Emma. Welcome to Online C two, Book three."], [5.46, 9.72, "Hi! I'm Visal. Let's learn together!"], [10.02, 15.89, "Unit ten: Comparative Law. Today you will contrast legal systems using differ from / contrast with."], [16.19, 18.88, "Here is our lesson map. Let's start!"], [19.83, 22.97, "Part one: words. You will learn eight new words."], [23.82, 25.07, "Comparative law."], [26.08, 30.74, "Comparative law means the study of differences and similarities between legal systems."], [31.35, 35.01, "Comparative law helps reformers learn from other countries."], [35.62, 38.85, "Your turn. Say: Comparative law."], [41.7, 43.11, "Comparative law."], [43.85, 45.13, "Legal tradition."], [46.12, 50.57, "Legal tradition means a deep-rooted set of attitudes about law and its role."], [51.15, 54.52, "Each legal tradition has its own idea of a judge's role."], [55.12, 57.9, "Your turn. Say: Legal tradition."], [60.73, 61.95, "Legal tradition."], [62.72, 64.34, "Civil law system."], [65.35, 70.47, "Civil law system means a system based mainly on comprehensive written codes."], [71.08, 74.01, "France has a civil law system built on codes."], [74.62, 77.78, "Your turn. Say: Civil law system."], [80.63, 82.77, "Civil law system."], [83.52, 84.9, "Common law system."], [85.92, 90.66, "Common law system means a system in which judicial decisions create binding precedent."], [91.25, 94.14, "A common law system develops case by case."], [94.75, 97.96, "Your turn. Say: Common law system."], [100.8, 102.27, "Common law system."], [103.02, 104.53, "Legal transplant."], [105.52, 109.7, "Legal transplant means a rule borrowed from one legal system into another."], [110.28, 112.99, "The data-protection rule was a legal transplant."], [113.58, 116.79, "Your turn. Say: Legal transplant."], [119.63, 121.19, "Legal transplant."], [121.95, 123.17, "Harmonization."], [124.18, 127.29, "Harmonization means making different rules compatible."], [127.88, 130.72, "Harmonization reduces conflict in trade law."], [131.32, 134.0, "Your turn. Say: Harmonization."], [136.87, 138.31, "Harmonization."], [139.05, 140.27, "Jurisdiction."], [141.28, 144.41, "Jurisdiction means the authority of a court to hear a case."], [145.02, 147.67, "The court lacked jurisdiction over the foreign firm."], [148.25, 150.93, "Your turn. Say: Jurisdiction."], [153.77, 154.95, "Jurisdiction."], [155.72, 157.4, "Cross-border legal issue."], [158.42, 162.7, "Cross-border legal issue means a legal matter involving more than one country."], [163.32, 166.48, "A cross-border legal issue complicated the inheritance."], [167.08, 171.12, "Your turn. Say: Cross-border legal issue."], [173.97, 176.15, "Cross-border legal issue."], [176.97, 180.65, "Part two: dialogue. Let's listen to a conversation."], [181.52, 186.55, "Visal, in my cousin's country the judges don't seem to follow earlier cases. Why?"], [187.65, 194.83, "A civil law system differs from a common law one. Judges apply codes rather than treating precedent as binding."], [195.92, 198.17, "So their reasoning contrasts with ours?"], [199.28, 207.5, "In emphasis, yes. Common law reasoning contrasts with code-based reasoning because it develops through decided cases."], [208.58, 210.75, "How can firms operate across both?"], [211.85, 225.03, "Through harmonization and contracts that specify jurisdiction. Each cross-border legal issue differs from the next, so careful drafting matters."], [226.17, 227.68, "Part three: grammar."], [228.52, 231.7, "Grammar focus: Differ from and contrast with."], [232.0, 233.29, "Look at the pattern."], [233.98, 237.11, "A civil law system differs from a common law one."], [238.02, 241.64, "Code-based reasoning contrasts with case-based reasoning."], [242.55, 245.87, "Each cross-border issue differs from the next in jurisdiction."], [246.83, 256.21, "differ from / contrast with + B. 'Differ' is a verb, so add -s for he/she/it: differs from. Avoid 'differ than' and 'different than' in formal writing; use 'different from'."], [256.95, 260.83, "Be careful! Don't say: Civil law differ to common law."], [262.77, 265.75, "Say: Civil law differs from common law."], [266.05, 268.46, "differ from (3rd person: differs)."], [269.27, 271.91, "Part four: reading. Read and listen."], [272.7, 274.13, "Two Great Traditions."], [274.43, 278.67, "Comparative law examines how different societies organise and apply law."], [279.67, 288.82, "A civil law system, as in France or Cambodia, relies on comprehensive written codes, whereas a common law system, as in England, develops through judicial precedent."], [289.83, 295.45, "Judges in the civil tradition apply the code; common law judges reason from earlier cases."], [296.47, 302.95, "Legal transplants, rules borrowed from abroad, often succeed only when adapted to local culture."], [303.93, 309.59, "Harmonization can reduce friction in trade, though sovereignty and jurisdiction remain sensitive issues."], [310.7, 314.73, "Part five: quiz. Five questions. Are you ready?"], [315.58, 318.65, "A civil law system blank from a common law one."], [318.95, 322.89, "A, differs. B, differ. C, differing."], [326.43, 328.64, "The answer is A: differs."], [329.78, 333.11, "A rule borrowed from another legal system is a legal blank."], [333.41, 337.8, "A, tradition. B, transplant. C, harmonization."], [341.37, 343.56, "The answer is B: transplant."], [344.72, 347.42, "The authority of a court to hear a case is blank."], [347.72, 351.88, "A, jurisdiction. B, precedent. C, harmonization."], [355.43, 357.75, "The answer is A: jurisdiction."], [358.88, 360.63, "Choose the correct sentence."], [360.93, 368.54, "A, Civil law differs than common law.. B, Civil law differs from common law.. C, Civil law different from common law.."], [372.1, 375.23, "The answer is B: Civil law differs from common law.."], [376.38, 380.72, "According to the reading, legal transplants often succeed only when…"], [381.02, 386.1, "A, copied exactly. B, adapted to local culture. C, forced."], [389.63, 392.45, "The answer is B: adapted to local culture."], [393.63, 396.7, "Part six: speaking. It's your turn to talk."], [397.55, 401.4, "What is one difference you know of between legal systems in different countries?"], [418.18, 419.66, "Now listen to Visal."], [419.96, 444.6, "One clear difference concerns precedent. In a common law system, earlier court decisions are binding, so judges create law through cases. In a civil law system, judges apply written codes, and earlier decisions are persuasive but not binding. This difference affects how lawyers argue and how predictable the law feels."], [444.9, 446.65, "Excellent answer, Visal!"], [447.55, 451.94, "Great work! Now you can use eight new words and differ from and contrast with."], [452.24, 458.23, "Today's value is global legal awareness. Respect that other societies organise justice differently."], [458.53, 461.27, "See you in Unit eleven. Goodbye!"], [461.57, 464.92, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C2B3-Unit11-International-Relations-Theory": [[0.35, 5.55, "Hello, everyone! I'm Ms. Emma. Welcome to Online C two, Book three."], [5.85, 9.4, "Hi! I'm Visal. Let's learn together!"], [9.7, 16.25, "Unit eleven: International Relations Theory. Today you will contrast theories using whereas / in contrast."], [16.55, 19.23, "Here is our lesson map. Let's start!"], [20.17, 23.12, "Part one: words. You will learn eight new words."], [23.98, 24.93, "Realism."], [25.92, 30.99, "Realism means the theory that states pursue power and security in an anarchic world."], [31.58, 34.79, "Realism expects rivalry between great powers."], [35.38, 37.73, "Your turn. Say: Realism."], [40.6, 41.45, "Realism."], [42.22, 43.15, "Liberalism."], [44.15, 48.75, "Liberalism means the theory that cooperation and institutions can reduce conflict."], [49.35, 52.48, "Liberalism points to trade and international law."], [53.08, 55.6, "Your turn. Say: Liberalism."], [58.43, 59.61, "Liberalism."], [60.35, 61.64, "Constructivism."], [62.65, 67.45, "Constructivism means the theory that ideas and identities shape world politics."], [68.05, 71.26, "Constructivism explains how norms change behaviour."], [71.85, 74.75, "Your turn. Say: Constructivism."], [77.6, 78.95, "Constructivism."], [79.68, 80.6, "Anarchy."], [81.62, 85.17, "Anarchy means the absence of a central authority above states."], [85.78, 88.35, "Anarchy in this sense does not mean chaos."], [88.95, 91.35, "Your turn. Say: Anarchy."], [94.2, 95.09, "Anarchy."], [95.85, 97.3, "Balance of power."], [98.32, 102.49, "Balance of power means a distribution of strength that discourages dominance."], [103.08, 105.58, "A balance of power can deter aggression."], [106.18, 109.56, "Your turn. Say: Balance of power."], [112.4, 113.98, "Balance of power."], [114.72, 116.12, "National interest."], [117.12, 122.06, "National interest means the goals a state pursues in its own security and welfare."], [122.65, 126.47, "Leaders often justify policy by national interest."], [127.08, 130.06, "Your turn. Say: National interest."], [132.9, 134.42, "National interest."], [135.18, 137.26, "International institution."], [138.25, 142.73, "International institution means an organisation through which states cooperate."], [143.35, 146.48, "The WTO is an international institution."], [147.08, 150.2, "Your turn. Say: International institution."], [153.07, 155.03, "International institution."], [155.78, 156.9, "Sovereignty."], [157.92, 160.93, "Sovereignty means supreme authority within a territory."], [161.52, 164.05, "Sovereignty limits outside interference."], [164.65, 167.37, "Your turn. Say: Sovereignty."], [170.23, 171.37, "Sovereignty."], [172.17, 176.01, "Part two: dialogue. Let's listen to a conversation."], [176.85, 181.37, "Visal, why do powerful countries keep arming even when they trade peacefully?"], [182.48, 193.41, "Realism emphasizes power, whereas liberalism emphasizes cooperation. Realists see anarchy as forcing states to protect themselves."], [194.52, 196.04, "And liberals disagree?"], [197.15, 209.4, "In contrast, liberals argue that institutions and trade make war costly. Constructivists, however, stress that identity shapes what states consider a threat."], [210.52, 211.65, "Which is right?"], [212.75, 227.13, "Each captures part of the picture. Realism explains rivalry, whereas liberalism explains cooperation; in contrast to both, constructivism explains change."], [228.27, 230.13, "Part three: grammar."], [230.98, 234.83, "Grammar focus: Contrast connectors (whereas, in contrast)."], [235.13, 236.36, "Look at the pattern."], [237.05, 242.03, "Realism emphasizes power, whereas liberalism emphasizes cooperation."], [242.92, 248.45, "Realists see anarchy as a threat. In contrast, liberals see institutions as a remedy."], [249.35, 252.88, "By contrast, constructivists stress the role of identity."], [253.83, 263.01, "Whereas joins two clauses (A, whereas B). 'In contrast' and 'by contrast' start a new sentence and are followed by a comma. Both need two parallel ideas."], [263.75, 268.96, "Be careful! Don't say: Realism stresses power, whereas liberalism trade."], [270.9, 275.47, "Say: Realism stresses power, whereas liberalism stresses trade."], [275.76, 277.79, "Keep a full verb after whereas."], [278.6, 281.08, "Part four: reading. Read and listen."], [281.87, 283.43, "Three Lenses on the World."], [283.73, 288.5, "International relations theory offers competing explanations of why states act as they do."], [289.5, 296.92, "Realism emphasizes power and security, whereas liberalism emphasizes cooperation through trade, law and institutions."], [297.93, 304.65, "Realists regard anarchy, the absence of a world government, as forcing states to rely on a balance of power."], [305.63, 312.44, "In contrast, constructivists argue that the national interest is not fixed but shaped by identities and shared ideas."], [313.43, 317.96, "No single theory explains every event, so analysts often combine them."], [319.07, 323.37, "Part five: quiz. Five questions. Are you ready?"], [324.22, 328.99, "Realism emphasizes power, blank liberalism emphasizes cooperation."], [329.29, 333.43, "A, whereas. B, because. C, unless."], [336.97, 338.83, "The answer is A: whereas."], [339.98, 343.24, "The absence of a central authority above states is blank."], [343.54, 347.57, "A, anarchy. B, sovereignty. C, balance."], [351.13, 353.04, "The answer is A: anarchy."], [354.18, 357.54, "The theory that ideas and identities shape politics is blank."], [357.84, 362.44, "A, realism. B, constructivism. C, liberalism."], [366.0, 368.14, "The answer is B: constructivism."], [369.28, 371.04, "Choose the correct sentence."], [371.34, 379.95, "A, In contrast, liberals favour trade.. B, In contrast liberals, favour trade.. C, In contrast, whereas liberals favour trade.."], [383.5, 387.25, "The answer is A: In contrast, liberals favour trade.."], [388.42, 390.9, "According to the reading, analysts often…"], [391.2, 396.41, "A, combine theories. B, ignore theories. C, reject all theories."], [399.97, 402.55, "The answer is A: combine theories."], [403.73, 407.13, "Part six: speaking. It's your turn to talk."], [407.98, 412.2, "Which theory of international relations do you find most convincing, and why?"], [429.02, 430.62, "Now listen to Visal."], [430.92, 456.85, "I find a combination convincing, though realism explains rivalry well. States do worry about security, and power matters. However, liberalism shows how trade and institutions reduce conflict, whereas constructivism explains why alliances change over time. No single theory captures everything, so I treat them as complementary lenses."], [457.14, 459.3, "Excellent answer, Visal!"], [460.18, 465.26, "Great work! Now you can use eight new words and contrast connectors (whereas, in contrast)."], [465.56, 470.55, "Today's value is global perspective. Local stories can carry universal truths."], [470.85, 473.2, "See you in Unit twelve. Goodbye!"], [473.5, 476.66, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C2B3-Unit12-Diplomatic-History": [[0.35, 5.05, "Hello, everyone! I'm Ms. Emma. Welcome to Online C two, Book three."], [5.35, 8.87, "Hi! I'm Visal. Let's learn together!"], [9.17, 15.08, "Unit twelve: Diplomatic History. Today you will recount history using the past passive."], [15.38, 18.16, "Here is our lesson map. Let's start!"], [19.1, 22.33, "Part one: words. You will learn eight new words."], [23.18, 24.27, "Diplomacy."], [25.25, 29.23, "Diplomacy means the management of relations between states by negotiation."], [29.85, 31.86, "Quiet diplomacy ended the standoff."], [32.45, 35.09, "Your turn. Say: Diplomacy."], [37.93, 38.97, "Diplomacy."], [39.72, 40.43, "Treaty."], [41.42, 44.53, "Treaty means a formal written agreement between states."], [45.12, 47.79, "The treaty was ratified by both parliaments."], [48.38, 50.62, "Your turn. Say: Treaty."], [53.47, 54.21, "Treaty."], [54.95, 56.07, "Alliance."], [57.08, 61.45, "Alliance means a formal partnership between states for mutual defence."], [62.05, 64.89, "The alliance committed members to defend one another."], [65.48, 68.28, "Your turn. Say: Alliance."], [71.13, 72.37, "Alliance."], [73.12, 74.52, "Balance of power."], [75.52, 79.93, "Balance of power means a distribution of strength that discourages dominance."], [80.52, 83.57, "Europe pursued a balance of power for centuries."], [84.18, 87.1, "Your turn. Say: Balance of power."], [89.97, 91.43, "Balance of power."], [92.18, 93.39, "Negotiation."], [94.38, 97.47, "Negotiation means discussion aimed at reaching agreement."], [98.08, 100.57, "Months of negotiation produced the accord."], [101.18, 103.67, "Your turn. Say: Negotiation."], [106.53, 107.77, "Negotiation."], [108.52, 110.12, "Sphere of influence."], [111.12, 116.51, "Sphere of influence means a region in which one state holds special power."], [117.12, 120.35, "The empire claimed the region as its sphere of influence."], [120.95, 124.06, "Your turn. Say: Sphere of influence."], [126.9, 128.66, "Sphere of influence."], [129.42, 130.89, "Diplomatic immunity."], [131.88, 136.43, "Diplomatic immunity means protection of diplomats from prosecution in the host country."], [137.02, 140.54, "Diplomatic immunity allows envoys to work without fear."], [141.15, 144.1, "Your turn. Say: Diplomatic immunity."], [146.97, 148.7, "Diplomatic immunity."], [149.45, 150.6, "Statecraft."], [151.62, 155.09, "Statecraft means the skilful management of state affairs."], [155.68, 159.65, "Metternich's statecraft shaped nineteenth-century Europe."], [160.25, 163.11, "Your turn. Say: Statecraft."], [165.97, 166.85, "Statecraft."], [167.67, 171.16, "Part two: dialogue. Let's listen to a conversation."], [172.02, 177.43, "Visal, why did so many European countries sign alliances before 1914?"], [178.52, 186.85, "Many alliances were formed to maintain the balance of power, and secret promises were exchanged among the great powers."], [187.95, 189.15, "Did the system work?"], [190.25, 200.89, "For decades it did. But when the alliances were triggered by a single assassination, a local crisis was transformed into a continental war."], [201.98, 203.22, "What was learned?"], [204.32, 215.88, "After 1945 institutions were established so that disputes could be settled by negotiation, and treaties were designed to be enforceable."], [217.03, 218.71, "Part three: grammar."], [219.55, 223.31, "Grammar focus: Past passive for historical events."], [223.61, 224.79, "Look at the pattern."], [225.48, 228.92, "Many alliances were formed to maintain the balance of power."], [229.82, 233.24, "A local crisis was transformed into a continental war."], [234.15, 238.72, "Institutions were established after 1945."], [239.67, 249.18, "Past passive = was/were + past participle. It foregrounds events and hides actors, which suits historical writing: Treaties were signed, borders were redrawn."], [249.92, 254.25, "Be careful! Don't say: Many alliances formed to keep peace."], [256.2, 259.6, "Say: Many alliances were formed to keep peace."], [259.9, 262.18, "Past passive: was/were + p.p."], [262.97, 265.49, "Part four: reading. Read and listen."], [266.3, 267.56, "The Making of an Order."], [267.86, 273.18, "Diplomatic history studies how states have managed their relations through treaties, alliances and war."], [274.17, 281.3, "After the Napoleonic Wars, the Congress of Vienna produced a balance of power that kept the peace among the great powers for decades."], [282.3, 288.58, "Many alliances were formed in the following century, and spheres of influence were marked out across Africa and Asia."], [289.6, 297.75, "In 1914 a local crisis was transformed into a world war because rigid commitments were triggered one after another."], [298.77, 307.04, "After 1945 new institutions were established, and statecraft was redirected toward negotiation and collective security."], [308.13, 312.26, "Part five: quiz. Five questions. Are you ready?"], [313.12, 316.59, "Many alliances blank formed to maintain the balance of power."], [316.89, 319.74, "A, were. B, was. C, have."], [323.3, 324.68, "The answer is A: were."], [325.85, 329.02, "A formal written agreement between states is a blank."], [329.32, 332.99, "A, treaty. B, sphere. C, statecraft."], [336.53, 338.27, "The answer is A: treaty."], [339.42, 342.51, "Protection of diplomats from prosecution is blank."], [342.81, 347.51, "A, negotiation. B, diplomatic immunity. C, alliance."], [351.07, 353.43, "The answer is B: diplomatic immunity."], [354.58, 356.26, "Choose the correct sentence."], [356.56, 368.23, "A, The treaty signed in 1648.. B, The treaty was signed in 1648.. C, The treaty was sign in 1648.."], [371.8, 376.68, "The answer is B: The treaty was signed in 1648.."], [377.82, 382.48, "According to the reading, after 1945 statecraft was redirected toward…"], [382.77, 388.11, "A, empire. B, negotiation and collective security. C, secret pacts."], [391.67, 395.5, "The answer is B: negotiation and collective security."], [396.7, 399.84, "Part six: speaking. It's your turn to talk."], [400.68, 404.09, "What historical treaty do you think had the greatest lasting impact?"], [420.88, 422.43, "Now listen to Visal."], [422.73, 451.12, "I think the Treaty of Westphalia in 1648 had the greatest lasting impact. It established the principle that each state is sovereign within its territory, an idea that still organises international politics. The conflicts it ended were bloody, and the system it created was imperfect. Yet modern borders and diplomacy are built on its foundations."], [451.42, 453.11, "Excellent answer, Visal!"], [454.02, 458.86, "Great work! Now you can use eight new words and past passive for historical events."], [459.16, 464.15, "Today's value is historical awareness. Know the past so you can understand the present."], [464.45, 467.11, "See you in Unit thirteen. Goodbye!"], [467.41, 470.56, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C2B3-Unit13-Security-Studies": [[0.35, 5.15, "Hello, everyone! I'm Ms. Emma. Welcome to Online C two, Book three."], [5.45, 9.12, "Hi! I'm Visal. Let's learn together!"], [9.42, 16.7, "Unit thirteen: Security Studies. Today you will describe widening concepts using expand to include / broaden to cover."], [17.0, 19.71, "Here is our lesson map. Let's start!"], [20.67, 24.06, "Part one: words. You will learn eight new words."], [24.92, 26.51, "National security."], [27.52, 31.99, "National security means the protection of a state and its citizens from threats."], [32.58, 36.06, "National security once meant only military defence."], [36.65, 39.8, "Your turn. Say: National security."], [42.67, 44.06, "National security."], [44.82, 45.9, "Deterrence."], [46.88, 51.19, "Deterrence means discouraging an attack by threatening unacceptable retaliation."], [51.78, 54.85, "Nuclear deterrence depends on credible response."], [55.45, 58.03, "Your turn. Say: Deterrence."], [60.87, 61.87, "Deterrence."], [62.62, 63.91, "Nonproliferation."], [64.92, 68.43, "Nonproliferation means efforts to stop the spread of weapons."], [69.02, 72.03, "Nonproliferation treaties limit nuclear arsenals."], [72.62, 75.41, "Your turn. Say: Nonproliferation."], [78.27, 79.79, "Nonproliferation."], [80.55, 82.1, "Asymmetric warfare."], [83.08, 87.34, "Asymmetric warfare means conflict between sides of very unequal strength."], [87.95, 90.98, "Asymmetric warfare favours surprise and mobility."], [91.58, 94.36, "Your turn. Say: Asymmetric warfare."], [97.2, 98.82, "Asymmetric warfare."], [99.55, 100.96, "Cybersecurity."], [101.95, 105.88, "Cybersecurity means protection of computer systems from attack."], [106.48, 109.6, "Cybersecurity now protects hospitals and grids."], [110.18, 113.6, "Your turn. Say: Cybersecurity."], [116.47, 117.83, "Cybersecurity."], [118.58, 119.86, "Intelligence."], [120.85, 124.36, "Intelligence means information gathered about threats and rivals."], [124.95, 127.17, "Good intelligence prevented the attack."], [127.78, 130.3, "Your turn. Say: Intelligence."], [133.13, 134.46, "Intelligence."], [135.22, 136.66, "Collective security."], [137.65, 141.94, "Collective security means an arrangement where all states act against an aggressor."], [142.55, 145.26, "Collective security underpinned the UN Charter."], [145.85, 149.13, "Your turn. Say: Collective security."], [151.97, 153.7, "Collective security."], [154.45, 156.12, "Strategic stability."], [157.12, 161.88, "Strategic stability means a condition in which no side gains by striking first."], [162.48, 166.04, "Arms control aims to preserve strategic stability."], [166.65, 169.5, "Your turn. Say: Strategic stability."], [172.33, 174.17, "Strategic stability."], [174.97, 178.54, "Part two: dialogue. Let's listen to a conversation."], [179.38, 184.31, "Visal, my father says security means soldiers and borders. Is that all it means now?"], [185.42, 192.37, "Not any more. Security has expanded to include cyber threats, pandemics and climate shocks."], [193.45, 195.22, "Why did the definition change?"], [196.32, 206.18, "Because threats have broadened to cover non-military risks. A power-grid failure can harm more people than a small raid."], [207.28, 209.17, "Does that make policy harder?"], [210.28, 221.86, "Yes. Collective security must now extend to include shared digital infrastructure, and deterrence must adapt to anonymous attackers."], [223.0, 224.76, "Part three: grammar."], [225.62, 229.37, "Grammar focus: Expand to include and broaden to cover."], [229.67, 230.79, "Look at the pattern."], [231.48, 234.47, "Security has expanded to include cyber threats."], [235.38, 239.0, "The agenda has broadened to cover pandemics and climate shocks."], [239.88, 244.28, "Collective security must extend to include digital infrastructure."], [245.23, 253.59, "expand / broaden / extend + to + include / cover + new items. Use the present perfect for a change that continues to the present: has expanded."], [254.35, 259.44, "Be careful! Don't say: Security expanded include cyber threats."], [261.4, 265.47, "Say: Security has expanded to include cyber threats."], [265.77, 267.35, "expand to include."], [268.13, 270.79, "Part four: reading. Read and listen."], [271.6, 273.4, "A Wider Idea of Safety."], [273.7, 279.12, "Traditional security studies focused on states, armies and the balance of military power."], [280.1, 287.38, "Cold War strategy relied on deterrence and nonproliferation to maintain strategic stability between nuclear rivals."], [288.37, 294.51, "Since then, the concept has expanded to include terrorism, cyberattacks, pandemics and climate change."], [295.5, 302.63, "Asymmetric warfare allows weaker actors to challenge stronger ones, and attribution of cyberattacks is often unclear."], [303.63, 310.32, "Collective security arrangements must therefore adapt, because no single state can defend against every modern threat."], [311.43, 315.47, "Part five: quiz. Five questions. Are you ready?"], [316.32, 319.59, "Security has expanded blank include cyber threats."], [319.89, 322.85, "A, to. B, for. C, of."], [326.4, 328.0, "The answer is A: to."], [329.15, 332.38, "Discouraging attack by threatening retaliation is blank."], [332.68, 337.26, "A, deterrence. B, intelligence. C, nonproliferation."], [340.8, 342.59, "The answer is A: deterrence."], [343.75, 346.19, "Efforts to stop the spread of weapons are blank."], [346.49, 351.48, "A, asymmetric warfare. B, nonproliferation. C, stability."], [355.03, 357.81, "The answer is B: nonproliferation."], [358.95, 360.73, "Choose the correct sentence."], [361.03, 368.97, "A, Threats have broadened to cover pandemics.. B, Threats have broadened cover pandemics.. C, Threats have broaden to cover pandemics.."], [372.5, 376.15, "The answer is A: Threats have broadened to cover pandemics.."], [377.28, 380.2, "According to the reading, no single state can…"], [380.5, 386.6, "A, defend against every modern threat. B, build weapons. C, join treaties."], [390.17, 393.8, "The answer is A: defend against every modern threat."], [395.0, 398.11, "Part six: speaking. It's your turn to talk."], [398.95, 402.49, "How has the definition of 'security' expanded in the modern era?"], [419.28, 420.67, "Now listen to Visal."], [420.97, 446.64, "Security has expanded from protecting borders to protecting people and systems. It now includes cyber defence, public health, food and energy supply, and climate resilience. A pandemic or a cyberattack on a power grid can cause as much harm as a conventional attack. As a result, governments must cooperate across agencies and across borders."], [446.94, 448.79, "Excellent answer, Visal!"], [449.68, 454.59, "Great work! Now you can use eight new words and expand to include and broaden to cover."], [454.89, 460.83, "Today's value is global security awareness. Understand that peace depends on many kinds of safety."], [461.13, 463.89, "See you in Unit fourteen. Goodbye!"], [464.19, 467.07, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C2B3-Unit14-Global-Political-Economy": [[0.35, 5.33, "Hello, everyone! I'm Ms. Emma. Welcome to Online C two, Book three."], [5.63, 9.44, "Hi! I'm Visal. Let's learn together!"], [9.74, 16.71, "Unit fourteen: Global Political Economy. Today you will weigh effects using benefit/drawback contrast structures."], [17.01, 19.57, "Here is our lesson map. Let's start!"], [20.53, 24.06, "Part one: words. You will learn eight new words."], [24.92, 26.36, "Political economy."], [27.35, 31.68, "Political economy means the study of how politics and economics shape each other."], [32.28, 35.25, "Political economy asks who gains from a policy."], [35.85, 38.95, "Your turn. Say: Political economy."], [41.8, 43.15, "Political economy."], [43.88, 45.44, "Global trade regime."], [46.45, 51.35, "Global trade regime means the rules and institutions governing international trade."], [51.95, 55.02, "The global trade regime reduced tariffs worldwide."], [55.62, 59.23, "Your turn. Say: Global trade regime."], [62.07, 64.0, "Global trade regime."], [64.75, 65.9, "Capital flow."], [66.92, 70.76, "Capital flow means the movement of money for investment across borders."], [71.35, 74.35, "Sudden capital flows destabilised the currency."], [74.95, 78.02, "Your turn. Say: Capital flow."], [80.87, 82.1, "Capital flow."], [82.85, 83.85, "Development."], [84.85, 89.12, "Development means improvement in incomes, health and living standards."], [89.72, 91.79, "Development requires more than growth."], [92.38, 95.09, "Your turn. Say: Development."], [97.93, 98.92, "Development."], [99.68, 100.82, "Inequality."], [101.82, 106.6, "Inequality means unequal distribution of income, wealth or opportunity."], [107.22, 109.68, "Inequality widened within many countries."], [110.28, 112.76, "Your turn. Say: Inequality."], [115.6, 116.69, "Inequality."], [117.45, 119.29, "Multinational corporation."], [120.28, 124.85, "Multinational corporation means a company operating in several countries."], [125.45, 128.89, "A multinational corporation moved production overseas."], [129.48, 132.62, "Your turn. Say: Multinational corporation."], [135.47, 137.58, "Multinational corporation."], [138.32, 140.03, "Regulatory framework."], [141.02, 145.23, "Regulatory framework means the set of rules governing an industry."], [145.85, 148.74, "A regulatory framework protects consumers."], [149.35, 152.66, "Your turn. Say: Regulatory framework."], [155.5, 157.32, "Regulatory framework."], [158.08, 159.79, "Economic interdependence."], [160.78, 165.26, "Economic interdependence means mutual reliance of economies on one another."], [165.85, 169.27, "Economic interdependence links producers and consumers."], [169.85, 173.38, "Your turn. Say: Economic interdependence."], [176.23, 178.0, "Economic interdependence."], [178.8, 182.15, "Part two: dialogue. Let's listen to a conversation."], [182.98, 190.37, "Visal, my uncle's factory exports everywhere, but a distant crisis nearly ruined him. Is trade a blessing or a curse?"], [191.48, 196.26, "Both. Interdependence brings growth but also vulnerability."], [197.35, 199.05, "Can you give a clearer picture?"], [200.15, 212.19, "On the benefit side, capital flows fund development; on the drawback side, they can reverse suddenly. Trade raises average incomes, yet it also widens inequality."], [213.28, 215.0, "So what should governments do?"], [216.12, 223.34, "Not retreat, but regulate. A sound regulatory framework keeps the gains while limiting the risks."], [224.5, 226.08, "Part three: grammar."], [226.92, 230.72, "Grammar focus: Benefit and drawback contrast structures."], [231.02, 232.19, "Look at the pattern."], [232.88, 235.93, "Interdependence brings growth but also vulnerability."], [236.82, 239.97, "Trade raises average incomes, yet it can widen inequality."], [240.85, 244.45, "While capital flows fund development, they can reverse suddenly."], [245.4, 254.43, "Balance gains and costs with brings X but also Y, yet, while, although. Keep parallel form: growth but also vulnerability (noun + noun)."], [255.18, 259.07, "Be careful! Don't say: Trade brings growth but also vulnerable."], [261.0, 264.33, "Say: Trade brings growth but also vulnerability."], [264.63, 266.25, "Use a noun after 'also'."], [267.07, 269.81, "Part four: reading. Read and listen."], [270.6, 272.52, "The Price and Prize of Openness."], [272.82, 277.35, "Global political economy examines how trade, finance and power interact."], [278.33, 284.72, "Interdependence brings growth but also vulnerability, since a crisis in one region can spread rapidly to others."], [285.73, 291.02, "While capital flows fund development, they can reverse suddenly and destabilise currencies."], [292.03, 299.22, "Multinational corporations spread technology and jobs, yet they can also exploit weak regulatory frameworks."], [300.23, 307.97, "Trade raises average incomes, though it often widens inequality, so policy must distribute gains and compensate losers."], [309.07, 313.09, "Part five: quiz. Five questions. Are you ready?"], [313.95, 317.34, "Interdependence brings growth blank also vulnerability."], [317.64, 320.74, "A, but. B, so. C, or."], [324.3, 326.03, "The answer is A: but."], [327.18, 330.59, "The movement of money across borders for investment is blank."], [330.89, 334.89, "A, capital flow. B, development. C, inequality."], [338.43, 340.41, "The answer is A: capital flow."], [341.55, 344.7, "Unequal distribution of income or wealth is blank."], [345.0, 349.2, "A, regime. B, inequality. C, framework."], [352.73, 355.01, "The answer is B: inequality."], [356.15, 357.77, "Choose the correct sentence."], [358.07, 365.64, "A, Trade brings jobs but also risky.. B, Trade brings jobs but also risk.. C, Trade brings jobs but risk also.."], [369.2, 373.0, "The answer is B: Trade brings jobs but also risk.."], [374.15, 376.49, "According to the reading, policy must…"], [376.79, 382.83, "A, distribute gains and compensate losers. B, stop trade. C, ignore inequality."], [386.37, 389.91, "The answer is A: distribute gains and compensate losers."], [391.1, 394.09, "Part six: speaking. It's your turn to talk."], [394.95, 399.14, "What is one benefit and one drawback of global economic interdependence?"], [415.95, 417.43, "Now listen to Visal."], [417.73, 442.24, "One benefit is access to larger markets and cheaper goods, which raises living standards. One drawback is vulnerability: a shock in one country, such as a financial crisis or supply disruption, can quickly spread elsewhere. Interdependence brings opportunity but also risk, so countries need diversification and good regulation."], [442.54, 444.45, "Excellent answer, Visal!"], [445.35, 450.72, "Great work! Now you can use eight new words and benefit and drawback contrast structures."], [451.02, 456.57, "Today's value is global economic literacy. Understand how money and trade connect the world."], [456.87, 459.57, "See you in Unit fifteen. Goodbye!"], [459.87, 462.13, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C2B3-Unit15-Development-Economics": [[0.35, 5.33, "Hello, everyone! I'm Ms. Emma. Welcome to Online C two, Book three."], [5.63, 9.28, "Hi! I'm Visal. Let's learn together!"], [9.58, 15.99, "Unit fifteen: Development Economics. Today you will discuss poverty using break / escape + noun."], [16.29, 19.06, "Here is our lesson map. Let's start!"], [20.0, 23.28, "Part one: words. You will learn eight new words."], [24.12, 25.56, "Economic development."], [26.55, 31.13, "Economic development means sustained improvement in incomes and living standards."], [31.72, 34.52, "Economic development reduced poverty in the region."], [35.12, 38.21, "Your turn. Say: Economic development."], [41.07, 42.57, "Economic development."], [43.32, 44.49, "Poverty trap."], [45.48, 49.48, "Poverty trap means a self-reinforcing cycle that keeps people poor."], [50.08, 53.21, "A poverty trap forms when low income prevents investment."], [53.82, 56.7, "Your turn. Say: Poverty trap."], [59.57, 60.71, "Poverty trap."], [61.45, 62.64, "Human capital."], [63.65, 67.98, "Human capital means the skills, knowledge and health of a population."], [68.58, 71.81, "Investing in human capital raises productivity."], [72.42, 75.25, "Your turn. Say: Human capital."], [78.1, 79.41, "Human capital."], [80.15, 81.05, "Foreign aid."], [82.05, 86.12, "Foreign aid means resources given by one country to another for development."], [86.72, 88.28, "Foreign aid built the clinic."], [88.88, 91.72, "Your turn. Say: Foreign aid."], [94.57, 95.6, "Foreign aid."], [96.35, 98.2, "Structural transformation."], [99.18, 104.19, "Structural transformation means the shift of break the poverty trap."], [229.55, 232.24, "Families need help to escape the cycle of debt."], [233.15, 236.36, "Well-designed aid can break the cycle of dependence."], [237.3, 247.36, "break the cycle / break the poverty trap; escape from a cycle or escape the trap. 'Break' takes a direct object. 'Help' can be followed by a bare infinitive: help break."], [248.12, 252.5, "Be careful! Don't say: Schooling can break the poverty trap off."], [254.43, 256.91, "Say: Schooling can break the poverty trap."], [257.21, 259.48, "break + object, no particle."], [260.27, 262.98, "Part four: reading. Read and listen."], [263.77, 265.12, "Escaping the Trap."], [265.42, 269.68, "Development economics asks why some countries remain poor and how they can grow."], [270.67, 277.07, "A poverty trap arises when low income prevents the investment in health, skills and capital that would raise income."], [278.07, 284.59, "Investment in education can help break the trap, since human capital raises productivity across generations."], [285.6, 291.27, "Foreign aid can break the cycle when it builds institutions, though poorly designed aid may foster dependence."], [292.27, 300.88, "Structural transformation, the shift from farming to industry and services, has allowed countries such as South Korea to escape poverty within a generation."], [302.0, 305.97, "Part five: quiz. Five questions. Are you ready?"], [306.82, 310.14, "Investment in education can help blank the poverty trap."], [310.44, 313.78, "A, break. B, to broke. C, breaking of."], [317.33, 319.19, "The answer is A: break."], [320.35, 323.56, "The skills and health of a population are blank capital."], [323.86, 327.43, "A, human. B, foreign. C, structural."], [330.97, 332.93, "The answer is A: human."], [334.08, 337.79, "Rules and organisations that shape economic behaviour are blank."], [338.09, 341.99, "A, institutions. B, aid. C, traps."], [345.53, 347.89, "The answer is A: institutions."], [349.05, 350.79, "Choose the correct sentence."], [351.09, 356.66, "A, Aid can break the cycle.. B, Aid can break off the cycle.. C, Aid can to break the cycle.."], [360.2, 363.07, "The answer is A: Aid can break the cycle.."], [364.22, 367.68, "According to the reading, South Korea escaped poverty through…"], [367.98, 372.99, "A, aid only. B, structural transformation. C, isolation."], [376.53, 379.83, "The answer is B: structural transformation."], [381.03, 384.2, "Part six: speaking. It's your turn to talk."], [385.05, 388.59, "What do you think is the most effective way to reduce global poverty?"], [405.38, 406.83, "Now listen to Visal."], [407.13, 430.21, "I think investing in education and health is the most effective way, because it builds human capital that lasts. Combined with fair institutions and access to credit, it helps families escape the poverty trap by themselves. Aid is useful for emergencies, but long-term reduction comes from jobs, skills and stable institutions."], [430.51, 432.12, "Excellent answer, Visal!"], [433.02, 438.66, "Great work! Now you can use eight new words and break and escape plus noun (a trap, a cycle)."], [438.96, 444.24, "Today's value is global responsibility. Act as someone who belongs to the whole world."], [444.54, 447.43, "See you in Unit sixteen. Goodbye!"], [447.73, 450.38, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C2B3-Unit16-Environmental-Policy": [[0.35, 4.89, "Hello, everyone! I'm Ms. Emma. Welcome to Online C two, Book three."], [5.19, 8.84, "Hi! I'm Visal. Let's learn together!"], [9.14, 16.78, "Unit sixteen: Environmental Policy. Today you will evaluate instruments using effective for / effective at + gerund."], [17.08, 19.77, "Here is our lesson map. Let's start!"], [20.73, 24.13, "Part one: words. You will learn eight new words."], [24.98, 26.9, "Environmental policy."], [27.92, 32.06, "Environmental policy means government action to protect the environment."], [32.65, 36.97, "Environmental policy must balance cost and benefit."], [37.58, 40.91, "Your turn. Say: Environmental policy."], [43.77, 45.99, "Environmental policy."], [46.75, 47.94, "Carbon tax."], [48.95, 52.81, "Carbon tax means a charge on each unit of greenhouse gas emitted."], [53.42, 56.18, "A carbon tax raises the price of pollution."], [56.78, 59.96, "Your turn. Say: Carbon tax."], [62.8, 64.22, "Carbon tax."], [64.98, 66.14, "Regulation."], [67.15, 71.18, "Regulation means an official rule that governs how something may be done."], [71.78, 74.6, "Regulation limited emissions from factories."], [75.18, 78.01, "Your turn. Say: Regulation."], [80.87, 82.08, "Regulation."], [82.82, 84.09, "Externality."], [85.08, 89.67, "Externality means a cost or benefit that falls on people who did not choose it."], [90.28, 92.47, "Pollution is a negative externality."], [93.08, 95.76, "Your turn. Say: Externality."], [98.6, 99.89, "Externality."], [100.65, 101.78, "Conservation."], [102.78, 107.06, "Conservation means the protection of natural resources and habitats."], [107.65, 109.66, "Conservation preserved the wetland."], [110.25, 112.97, "Your turn. Say: Conservation."], [115.83, 116.87, "Conservation."], [117.62, 118.91, "Sustainability."], [119.92, 124.3, "Sustainability means meeting present needs without harming future generations."], [124.88, 127.2, "Sustainability guided the city's plan."], [127.78, 130.48, "Your turn. Say: Sustainability."], [133.33, 134.65, "Sustainability."], [135.38, 136.85, "Policy instrument."], [137.85, 141.89, "Policy instrument means a tool such as a tax, rule or subsidy."], [142.48, 145.28, "A policy instrument should match the problem."], [145.88, 149.25, "Your turn. Say: Policy instrument."], [152.1, 153.55, "Policy instrument."], [154.32, 156.15, "Cost-benefit analysis."], [157.15, 161.87, "Cost-benefit analysis means comparing the total costs and benefits of a policy."], [162.45, 165.2, "Cost-benefit analysis supported the new rule."], [165.82, 169.21, "Your turn. Say: Cost-benefit analysis."], [172.07, 174.55, "Cost-benefit analysis."], [175.37, 179.09, "Part two: dialogue. Let's listen to a conversation."], [179.95, 183.91, "Visal, should the government ban polluting factories or simply tax them?"], [185.02, 194.62, "Each instrument has strengths. A carbon tax can be effective at reducing emissions because it gives firms a financial reason to cut."], [195.72, 197.0, "And regulation?"], [198.08, 207.78, "Regulation is effective for setting firm limits, particularly where harm is severe. A tax is effective at encouraging flexibility."], [208.88, 210.02, "Which is better?"], [211.12, 220.47, "Cost-benefit analysis helps decide. Often a mix is effective at achieving targets while keeping costs manageable."], [221.63, 223.24, "Part three: grammar."], [224.08, 228.12, "Grammar focus: Effective for and effective at plus gerund."], [228.41, 229.61, "Look at the pattern."], [230.32, 233.74, "A carbon tax can be effective at reducing emissions."], [234.65, 237.4, "Regulation is effective for setting firm limits."], [238.32, 241.87, "A policy mix is effective at achieving targets cheaply."], [242.83, 252.27, "effective at / effective in / effective for + gerund or noun: effective at reducing, effective for emissions control. Never use an infinitive after the preposition."], [253.02, 257.42, "Be careful! Don't say: A tax is effective at reduce emissions."], [259.37, 262.25, "Say: A tax is effective at reducing emissions."], [262.55, 263.97, "at + gerund."], [264.77, 267.35, "Part four: reading. Read and listen."], [268.13, 269.52, "Choosing the Right Tool."], [269.82, 274.96, "Environmental policy offers governments several instruments for cutting pollution."], [275.97, 283.09, "A carbon tax can be effective at reducing emissions because it makes polluters pay for the damage, an externality that markets ignore."], [284.1, 290.24, "Regulation is effective for setting firm limits, though it may be less flexible and more costly to administer."], [291.23, 297.73, "Conservation and subsidies for clean technology are effective at protecting ecosystems and speeding innovation."], [298.73, 307.34, "Cost-benefit analysis helps policymakers compare instruments, although some values, such as biodiversity, are hard to price."], [308.43, 312.25, "Part five: quiz. Five questions. Are you ready?"], [313.08, 316.22, "A carbon tax can be effective at blank emissions."], [316.52, 320.91, "A, reducing. B, reduce. C, to reduce."], [324.47, 326.55, "The answer is A: reducing."], [327.68, 331.05, "A cost that falls on people who did not choose it is an blank."], [331.35, 335.38, "A, externality. B, instrument. C, analysis."], [338.93, 340.96, "The answer is A: externality."], [342.12, 344.82, "Comparing total costs and benefits is blank."], [345.12, 350.91, "A, conservation. B, cost-benefit analysis. C, regulation."], [354.47, 357.53, "The answer is B: cost-benefit analysis."], [358.68, 360.42, "Choose the correct sentence."], [360.72, 368.83, "A, Rules are effective for limiting waste.. B, Rules are effective for limit waste.. C, Rules are effective to limiting waste.."], [372.37, 375.68, "The answer is A: Rules are effective for limiting waste.."], [376.82, 379.51, "According to the reading, some values are hard to…"], [379.81, 383.51, "A, tax. B, price. C, protect."], [387.07, 389.08, "The answer is B: price."], [390.27, 393.47, "Part six: speaking. It's your turn to talk."], [394.32, 398.5, "What policy instrument do you think is most effective for protecting the environment?"], [415.28, 417.44, "Now listen to Visal."], [417.75, 439.49, "A carbon tax seems to me the most effective instrument for reducing emissions, because it uses prices to change behaviour across the whole economy. It works best with support for low-income households and with regulation where harm is severe. No single tool is enough, but pricing pollution corrects the externality directly."], [439.79, 441.6, "Excellent answer, Visal!"], [442.52, 447.62, "Great work! Now you can use eight new words and effective for and effective at plus gerund."], [447.92, 454.27, "Today's value is environmental responsibility. Small green actions at home help the whole planet."], [454.57, 457.56, "See you in Unit seventeen. Goodbye!"], [457.86, 460.69, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C2B3-Unit17-Climate-Science-Policy": [[0.35, 5.03, "Hello, everyone! I'm Ms. Emma. Welcome to Online C two, Book three."], [5.33, 8.68, "Hi! I'm Visal. Let's learn together!"], [8.98, 16.44, "Unit seventeen: Climate Science Policy. Today you will distinguish concepts using differs from / distinguishing between."], [16.74, 19.32, "Here is our lesson map. Let's start!"], [20.27, 23.51, "Part one: words. You will learn eight new words."], [24.35, 25.79, "Climate policy."], [26.78, 31.39, "Climate policy means government action to limit and respond to climate change."], [31.98, 35.76, "Climate policy now shapes energy and transport decisions."], [36.35, 39.79, "Your turn. Say: Climate policy."], [42.63, 43.9, "Climate policy."], [44.65, 45.69, "Mitigation."], [46.68, 50.52, "Mitigation means actions that reduce the causes of climate change."], [51.12, 55.1, "Mitigation includes cutting emissions and protecting forests."], [55.72, 58.18, "Your turn. Say: Mitigation."], [61.03, 62.29, "Mitigation."], [63.05, 64.24, "Adaptation."], [65.25, 68.82, "Adaptation means adjusting to the effects of climate change."], [69.42, 72.89, "Adaptation includes sea walls and drought-resistant crops."], [73.48, 76.03, "Your turn. Say: Adaptation."], [78.87, 80.1, "Adaptation."], [80.85, 82.34, "Emissions target."], [83.35, 88.06, "Emissions target means a goal for reducing greenhouse gas output by a set date."], [88.65, 91.79, "The country set an emissions target for 2040."], [92.38, 95.26, "Your turn. Say: Emissions target."], [98.1, 99.46, "Emissions target."], [100.22, 101.24, "Climate model."], [102.25, 105.6, "Climate model means a computer simulation of the climate system."], [106.18, 108.87, "A climate model projected the rise in sea level."], [109.48, 112.83, "Your turn. Say: Climate model."], [115.67, 116.52, "Climate model."], [117.28, 118.32, "Tipping point."], [119.32, 123.51, "Tipping point means a threshold beyond which change becomes self-reinforcing."], [124.12, 126.7, "Melting ice sheets may pass a tipping point."], [127.28, 129.67, "Your turn. Say: Tipping point."], [132.53, 133.65, "Tipping point."], [134.42, 136.02, "International agreement."], [137.02, 140.71, "International agreement means a formal accord between countries."], [141.32, 144.01, "The international agreement set shared goals."], [144.62, 147.8, "Your turn. Say: International agreement."], [150.67, 152.38, "International agreement."], [153.12, 154.42, "Resilience."], [155.42, 158.89, "Resilience means the ability to absorb shocks and recover."], [159.48, 162.49, "Resilience protects communities after floods."], [163.08, 165.83, "Your turn. Say: Resilience."], [168.67, 169.85, "Resilience."], [170.67, 174.39, "Part two: dialogue. Let's listen to a conversation."], [175.25, 180.32, "Visal, my town is building flood walls. Isn't the real goal to stop climate change?"], [181.42, 190.19, "That's the distinction between mitigation and adaptation. Mitigation differs from adaptation in its core goal."], [191.28, 192.64, "How exactly?"], [193.75, 202.61, "Mitigation reduces the causes by cutting emissions, whereas adaptation reduces the harm by adjusting to effects already underway."], [203.72, 205.02, "So we need both?"], [206.12, 215.24, "Yes. Distinguishing between the two helps allocate funds, and a climate model can show how much of each a region needs."], [216.4, 218.25, "Part three: grammar."], [219.08, 222.91, "Grammar focus: Distinguishing between X and Y."], [223.21, 224.35, "Look at the pattern."], [225.05, 228.29, "Mitigation differs from adaptation in its core goal."], [229.18, 232.15, "Analysts distinguish between causes and effects."], [233.05, 236.47, "Distinguishing between the two helps allocate funds wisely."], [237.4, 245.65, "distinguish between X and Y (not 'distinguish X with Y'); X differs from Y in + respect. Gerund subject: Distinguishing between them helps…"], [246.38, 250.81, "Be careful! Don't say: Mitigation differs adaptation in goal."], [252.77, 256.59, "Say: Mitigation differs from adaptation in goal."], [256.89, 257.75, "differ from."], [258.57, 261.28, "Part four: reading. Read and listen."], [262.07, 263.13, "Cut or Cope?."], [263.43, 266.9, "Climate policy rests on two complementary strategies."], [267.9, 277.04, "Mitigation reduces the causes of warming by cutting emissions and protecting carbon sinks, whereas adaptation prepares societies for effects that can no longer be avoided."], [278.03, 286.01, "Mitigation differs from adaptation in its core goal, and in who benefits: cuts help everyone, but sea walls protect only one coast."], [287.0, 291.76, "Climate models suggest that crossing a tipping point could make some changes irreversible."], [292.77, 297.73, "Distinguishing between the two strategies, and funding both, is the foundation of resilience."], [298.83, 302.58, "Part five: quiz. Five questions. Are you ready?"], [303.42, 306.46, "Mitigation differs blank adaptation in its core goal."], [306.76, 309.45, "A, from. B, of. C, with."], [313.0, 314.49, "The answer is A: from."], [315.65, 318.85, "Actions that reduce the causes of climate change are blank."], [319.14, 323.44, "A, mitigation. B, adaptation. C, resilience."], [327.0, 328.79, "The answer is A: mitigation."], [329.95, 333.48, "A threshold beyond which change reinforces itself is a blank."], [333.78, 337.84, "A, climate model. B, tipping point. C, target."], [341.4, 343.92, "The answer is B: tipping point."], [345.08, 346.8, "Choose the correct sentence."], [347.1, 354.31, "A, Distinguish between cause and effect.. B, Distinguish cause with effect.. C, Distinguish between cause with effect.."], [357.87, 361.33, "The answer is A: Distinguish between cause and effect.."], [362.48, 365.16, "According to the reading, sea walls protect…"], [365.46, 369.34, "A, everyone. B, only one coast. C, no one."], [372.9, 375.27, "The answer is B: only one coast."], [376.47, 380.0, "Part six: speaking. It's your turn to talk."], [380.85, 384.85, "What is the difference between climate mitigation and climate adaptation?"], [401.65, 403.24, "Now listen to Visal."], [403.54, 428.58, "Mitigation means reducing the causes of climate change, mainly by cutting greenhouse gas emissions. Adaptation means adjusting to effects that are already happening or unavoidable, such as building flood defences or changing crops. Mitigation protects the whole planet over the long term, while adaptation protects particular places now. We need both."], [428.88, 430.63, "Excellent answer, Visal!"], [431.52, 436.34, "Great work! Now you can use eight new words and distinguishing between x and y."], [436.64, 442.9, "Today's value is environmental stewardship. Care for nature as a trust for future generations."], [443.2, 446.36, "See you in Unit eighteen. Goodbye!"], [446.65, 450.11, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C2B3-Unit18-Technology-Policy": [[0.35, 5.23, "Hello, everyone! I'm Ms. Emma. Welcome to Online C two, Book three."], [5.53, 9.12, "Hi! I'm Visal. Let's learn together!"], [9.42, 15.81, "Unit eighteen: Technology Policy. Today you will propose action using address / tackle + noun phrase."], [16.11, 18.8, "Here is our lesson map. Let's start!"], [19.73, 23.01, "Part one: words. You will learn eight new words."], [23.85, 25.3, "Technology policy."], [26.32, 32.22, "Technology policy means government decisions on how technology is developed and used."], [32.82, 36.24, "Technology policy shapes who benefits from innovation."], [36.85, 40.04, "Your turn. Say: Technology policy."], [42.9, 44.55, "Technology policy."], [45.32, 46.5, "Regulation."], [47.52, 50.48, "Regulation means an official rule governing conduct."], [51.08, 53.66,
