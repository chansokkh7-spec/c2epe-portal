        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap');
        body { font-family: 'Poppins', sans-serif; }
        /* Flip-card for Listening: front = word, back = picture. */
        .flip-card { perspective: 1000px; height: 100px; cursor: pointer; }
        .flip-card-inner {
            position: relative; width: 100%; height: 100%;
            transition: transform 0.5s; transform-style: preserve-3d;
        }
        .flip-card.flipped .flip-card-inner { transform: rotateY(180deg); }
        .flip-card-front, .flip-card-back {
            position: absolute; width: 100%; height: 100%;
            backface-visibility: hidden; border-radius: 0.75rem;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 0.25rem;
        }
        .flip-card-back { transform: rotateY(180deg); }
        button:disabled { cursor: default; }
        /* phones: the lesson fills the screen, so jumping to it always shows it from the top,
           and the floating "Modules" button never covers the lesson's own buttons */
        @media (max-width: 767px) { #content-area { min-height: calc(100vh - 24px); padding-bottom: 76px; } }
    </style>

    <script>
        let state = {
            level: 'Master',
            unit: 1,
            tab: 'listening',
            stars: 0,
            badges: 0
        };

        const curriculum = {
            'Master': {
                1: { title: "Complexity Science", vocab: ["Complex adaptive system", "Emergence", "Self-organization", "Nonlinear dynamics", "Attractor", "Feedback", "Resilience", "Phase transition"], story: "Complexity science studies a complex adaptive system through emergence and self-organization. Nonlinear dynamics and an attractor state reveal how feedback shapes resilience through sudden phase transition.", question: "Can you think of a system in nature that exhibits self-organization?", grammar: { point: "Result-of language (arises from, emerges from)", example: "Order often emerges from apparent chaos." }, value: "Systems Thinking" },
                2: { title: "Network Theory", vocab: ["Node", "Edge", "Network topology", "Hub", "Centrality", "Small-world network", "Scale-free network", "Connectivity"], story: "Network theory represents a system as a set of nodes connected by edges, revealing its topology. A highly connected hub with strong centrality often defines a small-world or scale-free network.", question: "What is an example of a network you interact with every day?", grammar: { point: "Represented as / modeled as clauses", example: "A social system can be represented as a network." }, value: "Analytical Thinking" },
                3: { title: "Behavioral Economics", vocab: ["Cognitive bias", "Loss aversion", "Anchoring", "Nudge", "Irrational choice", "Heuristic", "Prospect theory", "Bounded rationality"], story: "Behavioral economics studies how cognitive bias, like loss aversion and anchoring, produces seemingly irrational choice. A well-designed nudge leverages bounded rationality, informed by prospect theory.", question: "Have you ever noticed loss aversion affecting your own decisions?", grammar: { point: "Leverage/exploit + noun phrase", example: "A nudge leverages predictable cognitive bias." }, value: "Self-Reflection" },
                4: { title: "Cognitive Science", vocab: ["Cognition", "Mental representation", "Neural network", "Perception", "Memory encoding", "Attention", "Cognitive load", "Information processing"], story: "Cognitive science studies mental representation and information processing, often modeled through a neural network. Perception, memory encoding, and attention are all constrained by cognitive load.", question: "What strategies help reduce cognitive load when learning something new?", grammar: { point: "Constrained by / limited by", example: "Learning is often constrained by cognitive load." }, value: "Self-Awareness" },
                5: { title: "Evolutionary Psychology", vocab: ["Adaptation", "Natural selection", "Evolutionary fitness", "Mate selection", "Kin selection", "Instinct", "Behavioral trait", "Ancestral environment"], story: "Evolutionary psychology explains a behavioral trait as an adaptation shaped by natural selection. Mate selection, kin selection, and instinct all trace back to pressures from our ancestral environment.", question: "Can you think of a modern behavior that might have evolutionary roots?", grammar: { point: "Trace back to / originate from", example: "Many instincts trace back to our ancestral environment." }, value: "Scientific Curiosity" },
                6: { title: "Neuroeconomics", vocab: ["Neuroeconomics", "Reward system", "Dopamine", "Risk perception", "Decision-making circuit", "Value computation", "Impulsivity", "Delayed gratification"], story: "Neuroeconomics studies how the brain's reward system and dopamine shape risk perception. Understanding the decision-making circuit reveals why value computation sometimes favors impulsivity over delayed gratification.", question: "Why do you think people sometimes choose immediate rewards over long-term benefits?", grammar: { point: "Favoring X over Y", example: "The brain sometimes favors immediate reward over delayed gratification." }, value: "Self-Discipline" },
                7: { title: "Political Philosophy", vocab: ["Social contract", "Sovereignty", "Justice", "Legitimacy", "Natural rights", "State of nature", "Consent", "Political obligation"], story: "Political philosophy examines the social contract as a source of sovereignty and legitimacy. Natural rights and consent shape our understanding of political obligation beyond any imagined state of nature.", question: "What makes a government's authority legitimate, in your view?", grammar: { point: "Source-of language (derives from, stems from)", example: "Legitimacy derives from the consent of the governed." }, value: "Civic Reasoning" },
                8: { title: "Legal Theory", vocab: ["Jurisprudence", "Natural law", "Legal positivism", "Precedent", "Rule of law", "Judicial interpretation", "Legal reasoning", "Statutory construction"], story: "Legal theory debates natural law against legal positivism, questioning the foundation of the rule of law. Precedent and judicial interpretation rely on careful legal reasoning and statutory construction.", question: "Should judges strictly follow precedent, or interpret the law more flexibly?", grammar: { point: "Should + modal for debate", example: "Judges should balance precedent with flexible interpretation." }, value: "Critical Reasoning" },
                9: { title: "Constitutional Theory", vocab: ["Constitutionalism", "Separation of powers", "Judicial review", "Checks and balances", "Amendment process", "Federalism", "Civil liberties", "Constitutional interpretation"], story: "Constitutional theory studies how constitutionalism enforces separation of powers through checks and balances. Judicial review, the amendment process, and federalism all protect civil liberties through constitutional interpretation.", question: "Why are checks and balances important in a system of government?", grammar: { point: "Prevent/protect against + noun", example: "Checks and balances prevent the abuse of power." }, value: "Civic Responsibility" },
                10: { title: "Comparative Law", vocab: ["Comparative law", "Legal tradition", "Civil law system", "Common law system", "Legal transplant", "Harmonization", "Jurisdiction", "Cross-border legal issue"], story: "Comparative law studies how a civil law system differs from a common law system across legal traditions. A legal transplant and efforts at harmonization address cross-border legal issues between jurisdictions.", question: "What is one difference you know of between legal systems in different countries?", grammar: { point: "Differ from / contrast with", example: "A civil law system differs from a common law one." }, value: "Global Legal Awareness" },
                11: { title: "International Relations Theory", vocab: ["Realism", "Liberalism", "Constructivism", "Anarchy", "Balance of power", "National interest", "International institution", "Sovereignty"], story: "International relations theory contrasts realism, which emphasizes anarchy and balance of power, with liberalism's focus on international institutions. Constructivism argues that national interest itself is socially constructed.", question: "Which theory of international relations do you find most convincing, and why?", grammar: { point: "Contrast connectors (whereas, in contrast)", example: "Realism emphasizes power, whereas liberalism emphasizes cooperation." }, value: "Global Perspective" },
                12: { title: "Diplomatic History", vocab: ["Diplomacy", "Treaty", "Alliance", "Balance of power", "Negotiation", "Sphere of influence", "Diplomatic immunity", "Statecraft"], story: "Diplomatic history traces how treaties and alliances have shaped the balance of power through skilled negotiation. Concepts like sphere of influence and diplomatic immunity remain central to modern statecraft.", question: "What historical treaty do you think had the greatest lasting impact?", grammar: { point: "Past passive for historical events", example: "Many alliances were formed to maintain balance of power." }, value: "Historical Awareness" },
                13: { title: "Security Studies", vocab: ["National security", "Deterrence", "Nonproliferation", "Asymmetric warfare", "Cybersecurity", "Intelligence", "Collective security", "Strategic stability"], story: "Security studies examine national security through the lens of deterrence and nonproliferation. Asymmetric warfare and cybersecurity now challenge traditional intelligence and collective security frameworks.", question: "How has the definition of 'security' expanded in the modern era?", grammar: { point: "Expand to include / broaden to cover", example: "Security has expanded to include cyber threats." }, value: "Global Security Awareness" },
                14: { title: "Global Political Economy", vocab: ["Political economy", "Global trade regime", "Capital flow", "Development", "Inequality", "Multinational corporation", "Regulatory framework", "Economic interdependence"], story: "Global political economy studies how the global trade regime shapes capital flow, development, and inequality. A multinational corporation operates within a regulatory framework shaped by economic interdependence.", question: "What is one benefit and one drawback of global economic interdependence?", grammar: { point: "Benefit/drawback contrast structures", example: "Interdependence brings growth but also vulnerability." }, value: "Global Economic Literacy" },
                15: { title: "Development Economics", vocab: ["Economic development", "Poverty trap", "Human capital", "Foreign aid", "Structural transformation", "Institutions", "Inequality", "Sustainable growth"], story: "Development economics studies how a poverty trap can be broken through investment in human capital. Foreign aid, strong institutions, and structural transformation all shape a path toward sustainable growth.", question: "What do you think is the most effective way to reduce global poverty?", grammar: { point: "Break/escape + noun (a trap, a cycle)", example: "Investment in education can help break the poverty trap." }, value: "Global Responsibility" },
                16: { title: "Environmental Policy", vocab: ["Environmental policy", "Carbon tax", "Regulation", "Externality", "Conservation", "Sustainability", "Policy instrument", "Cost-benefit analysis"], story: "Environmental policy uses tools like a carbon tax and regulation to address a negative externality. Conservation and sustainability goals rely on the right policy instrument, evaluated through cost-benefit analysis.", question: "What policy instrument do you think is most effective for protecting the environment?", grammar: { point: "Effective for / effective at + gerund", example: "A carbon tax can be effective at reducing emissions." }, value: "Environmental Responsibility" },
                17: { title: "Climate Science Policy", vocab: ["Climate policy", "Mitigation", "Adaptation", "Emissions target", "Climate model", "Tipping point", "International agreement", "Resilience"], story: "Climate science policy balances mitigation, which reduces emissions, with adaptation to unavoidable change. Emissions targets rely on climate models, while an international agreement builds resilience against a tipping point.", question: "What is the difference between climate mitigation and climate adaptation?", grammar: { point: "Distinguishing between X and Y", example: "Mitigation differs from adaptation in its core goal." }, value: "Environmental Stewardship" },
                18: { title: "Technology Policy", vocab: ["Technology policy", "Regulation", "Innovation incentive", "Digital divide", "Data privacy", "Antitrust", "Emerging technology", "Governance framework"], story: "Technology policy balances regulation with innovation incentive, while addressing the digital divide and data privacy. Antitrust concerns and emerging technology both require an evolving governance framework.", question: "What is one technology policy challenge you think governments should address?", grammar: { point: "Address/tackle + noun phrase", example: "Policymakers must address the growing digital divide." }, value: "Digital Responsibility" },
                19: { title: "Future of Work", vocab: ["Automation", "Gig economy", "Reskilling", "Remote work", "Labor market", "Universal basic income", "Job displacement", "Workforce transformation"], story: "The future of work is shaped by automation and the rise of the gig economy, driving demand for reskilling. Remote work and proposals like universal basic income respond to job displacement and workforce transformation.", question: "How do you think the workplace will change over the next decade?", grammar: { point: "Future prediction language (will, is likely to)", example: "Automation is likely to reshape many industries." }, value: "Future Readiness" },
                20: { title: "Public Health Policy", vocab: ["Public health", "Prevention", "Policy", "Vaccination", "Tobacco tax", "Equity", "Evidence", "Population"], story: "Public health policy aims to protect the whole population. Prevention through vaccination and measures such as a tobacco tax, guided by evidence and equity, saves lives at scale.", question: "Which public health policy has had the greatest impact?", grammar: {"point": "Passive reporting (is estimated to)", "example": "Vaccination is estimated to save millions of lives."} },
                21: { title: "Urban Resilience", vocab: ["Resilience", "Flooding", "Infrastructure", "Adaptation", "Heatwave", "Planning", "Community", "Recovery"], story: "Urban resilience is a city's ability to withstand shocks such as flooding and a heatwave. Robust infrastructure, adaptation planning and community networks speed recovery.", question: "How could Phnom Penh become more resilient to flooding?", grammar: {"point": "Should + passive for recommendations", "example": "Drainage systems should be upgraded."} },
                22: { title: "The Energy Transition", vocab: ["Energy transition", "Renewables", "Fossil fuels", "Grid", "Storage", "Emissions", "Investment", "Just transition"], story: "The energy transition moves economies from fossil fuels to renewables. Grid upgrades, storage and investment are needed, and a just transition protects workers and communities while cutting emissions.", question: "What are the obstacles to a fast energy transition?", grammar: {"point": "Unless / but for", "example": "Unless storage improves, renewables will face limits."} },
                23: { title: "Food Systems", vocab: ["Food system", "Agriculture", "Supply chain", "Food waste", "Nutrition", "Smallholder", "Climate", "Security"], story: "A food system links agriculture, the supply chain and nutrition. Supporting each smallholder farmer, reducing food waste and adapting to climate strengthen food security.", question: "How can food waste be reduced?", grammar: {"point": "Quantifiers (a great deal of / a significant proportion)", "example": "A significant proportion of food is wasted."} },
                24: { title: "Water Governance", vocab: ["Water governance", "River basin", "Allocation", "Transboundary", "Dam", "Cooperation", "Scarcity", "Stakeholders"], story: "Water governance decides allocation among stakeholders. In a transboundary river basin such as the Mekong, each dam raises questions of scarcity and requires regional cooperation.", question: "Why is transboundary water cooperation difficult?", grammar: {"point": "Complex noun phrases", "example": "The allocation of water between neighbouring countries is contested."} },
                25: { title: "Data Governance", vocab: ["Data governance", "Privacy", "Consent", "Regulation", "Ownership", "Security", "Accountability", "Trust"], story: "Data governance sets rules for privacy, consent, ownership and security. Clear regulation and accountability are essential if citizens are to trust digital systems.", question: "Who should own the data people create online?", grammar: {"point": "If + were to (formal hypothesis)", "example": "If data were to leak, trust would collapse."} },
                26: { title: "Migration Policy", vocab: ["Migration", "Policy", "Labour", "Refugee", "Integration", "Remittances", "Rights", "Border"], story: "Migration policy shapes labour markets and the protection of every refugee. Remittances support families, while integration and respect for rights remain central challenges at each border.", question: "How do remittances affect families and economies?", grammar: {"point": "Balanced argument structures (On the one hand...)", "example": "On the one hand, migration fills labour gaps; on the other, it raises integration challenges."} },
                27: { title: "Education Policy", vocab: ["Education policy", "Access", "Quality", "Teachers", "Curriculum", "Equity", "Assessment", "Outcomes"], story: "Education policy seeks both access and quality. Investment in teachers, a relevant curriculum and fair assessment improve outcomes and equity.", question: "What single change would most improve education where you live?", grammar: {"point": "It is high time + past", "example": "It is high time teachers were paid more."} },
                28: { title: "The Circular Economy", vocab: ["Circular economy", "Reuse", "Recycling", "Waste", "Design", "Resources", "Product lifecycle", "Linear"], story: "The circular economy replaces the linear 'take, make, dispose' model. Better design, reuse and recycling keep resources in use and extend the product lifecycle while reducing waste.", question: "How could your community adopt circular economy ideas?", grammar: {"point": "Replacing X with Y structures", "example": "The model replaces waste with reuse."} },
                29: { title: "Review: Evidence-Based Policy", vocab: ["Evidence", "Policy", "Evaluation", "Data", "Trade-off", "Stakeholders", "Implementation", "Impact"], story: "Evidence-based policy relies on data and rigorous evaluation. Policymakers weigh each trade-off, consult stakeholders and monitor implementation to measure impact.", question: "Why is evidence sometimes ignored in policymaking?", grammar: {"point": "Nominal clauses with the fact that", "example": "The fact that evidence exists does not guarantee its use."} },
            }
        };

        const PROGRESS_KEY = () => 'c2epe_onlineclass_master_C2_3_progress_' + state.level;
        let progress = { stars: 0, badges: 0, awarded: {}, best: {}, completed: {} };
        function loadProgress() {
            progress = { stars: 0, badges: 0, awarded: {}, best: {}, completed: {} };
            try {
                const saved = JSON.parse(localStorage.getItem(PROGRESS_KEY()) || 'null');
                if (saved && typeof saved === 'object') progress = Object.assign(progress, saved);
            } catch (e) { /* storage not available (e.g. inside the Hub sandbox) */ }
            state.stars = progress.stars; state.badges = progress.badges;
            document.getElementById('star-count').textContent = state.stars;
            document.getElementById('badge-count').textContent = state.badges;
        }
        function saveProgress() {
            progress.stars = state.stars; progress.badges = state.badges;
            try { localStorage.setItem(PROGRESS_KEY(), JSON.stringify(progress)); } catch (e) {}
        }
        const unitKey = (what) => 'u' + state.unit + '|' + what;
        const wasAwarded = (key) => !!progress.awarded[state.level + '|' + key];
        // Gives stars only the first time an activity is done. Returns true if stars were given.
        function award(key, amount) {
            const k = state.level + '|' + key;
            if (progress.awarded[k]) return false;
            progress.awarded[k] = true;
            addStars(amount);
            return true;

            if (!dateStr) return false;
            const added = new Date(dateStr);
            if (isNaN(added.getTime())) return false;

        let enVoice = null;
        function pickVoice() {
            if (!('speechSynthesis' in window)) return;

        }
        if ('speechSynthesis' in window) { pickVoice(); window.speechSynthesis.onvoiceschanged = pickVoice; }
        function speak(text, onEnd) {
            if (!('speechSynthesis' in window)) { if (onEnd) onEnd(false); return false; }
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(text);
            u.lang = 'en-US';
            u.rate = 0.9;
            if (!enVoice) pickVoice();
            if (enVoice) u.voice = enVoice;
            if (onEnd) u.onend = () => onEnd(true);
            window.speechSynthesis.speak(u);
            return true;
        }

        function shuffle(arr) {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        function allVocabForLevel(level) {

        // ---------- Pictures ----------
        // When two words in the SAME unit would show the same picture, the second one gets its
        // own picture here (only inside that unit), so children can tell them apart.
        const SAME_UNIT_ALT = {
            "Goodbye": "🚶👋", "Thank you": "💝", "Sorry": "😔", "Respect": "🫡", "Tomorrow": "⏭️",
            "West": "🌇", "East": "🌄", "North": "🧭", "Between": "🥪", "Early": "🐓", "Late": "⏰",
            "Swing": "🎠", "Poster": "🪧"
        };
        function baseEmoji(word) { return WORD_EMOJI[word] || '🖼️'; }
        function emojiFor(word, unitData) {
            const u = unitData || curriculum[state.level][state.unit];
            const e = baseEmoji(word);
            if (u && SAME_UNIT_ALT[word] && u.vocab.some(w => w !== word && baseEmoji(w) === e)) return SAME_UNIT_ALT[word];
            return e;
        }
        // Wrong answers for "look at the picture" questions never share the right answer's
        // picture, so there is always exactly one correct choice.
        function pictureDistractors(correct, pool, unitData, n) {
            const pic = emojiFor(correct, unitData);
            const ok = (w) => w !== correct && emojiFor(w, unitData) !== pic;
            let list = shuffle([...new Set(pool)].filter(ok)).slice(0, n);
            if (list.length < n) {
                const extra = shuffle(allVocabForLevel(state.level).filter(w => ok(w) && !list.includes(w)));
                list = list.concat(extra.slice(0, n - list.length));
            }
            return list;
        }

 changes the next action."], [125.95, 128.84, "Positive feedback accelerated the collapse."], [129.45, 132.0, "Your turn. Say: Feedback."], [134.83, 135.85, "Feedback."], [136.58, 137.75, "Resilience."], [138.75, 142.25, "Resilience means the capacity to absorb shocks and recover."], [142.85, 145.59, "Diverse crops give a farm greater resilience."], [146.18, 149.3, "Your turn. Say: Resilience."], [152.17, 153.45, "Resilience."], [154.18, 155.5, "Phase transition."], [156.48, 160.72, "Phase transition means a sudden change from one state of a system to another."], [161.32, 163.83, "Water freezing is a classic phase transition."], [164.42, 167.5, "Your turn. Say: Phase transition."], [170.33, 171.74, "Phase transition."], [172.53, 176.56, "Part two: dialogue. Let's listen to a conversation."], [177.42, 181.46, "Visal, how can a flock of birds move so perfectly with no leader?"], [182.55, 192.98, "Order often emerges from apparent chaos. Each bird follows simple local rules, and the pattern arises from those interactions."], [194.08, 195.91, "So nobody designs the pattern?"], [197.02, 204.06, "Correct. Self-organization results from feedback between neighbours, not from central command."], [205.15, 207.13, "Can such systems suddenly break?"], [208.22, 215.66, "Yes. A phase transition can stem from a tiny change, which is why resilience matters so much."], [216.8, 218.15, "Part three: grammar."], [218.98, 223.4, "Grammar focus: Result-of language (arises from, emerges from)."], [223.7, 224.8, "Look at the pattern."], [225.52, 228.09, "Order often emerges from apparent chaos."], [228.98, 232.33, "Self-organization results from feedback between neighbours."], [233.22, 236.41, "A phase transition can stem from a tiny change."], [237.37, 245.48, "Link an outcome to its source with arise from, emerge from, result from or stem from. The preposition is always 'from': order emerges from chaos."], [246.22, 250.03, "Be careful! Don't say: Order emerges of chaos."], [251.97, 254.4, "Say: Order emerges from chaos."], [254.7, 256.07, "emerge from (not 'of')."], [256.87, 259.6, "Part four: reading. Read and listen."], [260.4, 261.9, "Order Without a Ruler."], [262.2, 266.87, "Complexity science studies systems whose behaviour cannot be predicted from their parts alone."], [267.87, 274.6, "A flock, an ecosystem and a market are each a complex adaptive system, in which many agents adjust to one another."], [275.6, 282.23, "Order often emerges from apparent chaos, because simple local rules and feedback produce large-scale patterns."], [283.23, 289.08, "Nonlinear dynamics mean that a small cause can trigger a phase transition, so prediction is limited."], [290.07, 293.23, "Resilience, not control, is therefore the realistic goal."], [294.33, 298.59, "Part five: quiz. Five questions. Are you ready?"], [299.45, 301.72, "Order emerges blank apparent chaos."], [302.02, 305.32, "A, from. B, of. C, by."], [308.87, 310.52, "The answer is A: from."], [311.68, 314.63, "Order forming without a central controller is blank."], [314.94, 319.06, "A, attractor. B, self-organization. C, feedback."], [322.6, 325.29, "The answer is B: self-organization."], [326.45, 329.55, "A sudden change from one state to another is a blank."], [329.85, 334.13, "A, phase transition. B, resilience. C, emergence."], [337.67, 339.88, "The answer is A: phase transition."], [341.02, 342.63, "Choose the correct sentence."], [342.93, 349.64, "A, Order results of local rules.. B, Order results from local rules.. C, Order results by local rules.."], [353.2, 356.91, "The answer is B: Order results from local rules.."], [358.05, 361.27, "According to the reading, the realistic goal is…"], [361.57, 365.72, "A, total control. B, resilience. C, prediction."], [369.27, 371.48, "The answer is B: resilience."], [372.67, 375.87, "Part six: speaking. It's your turn to talk."], [376.72, 379.99, "Can you think of a system in nature that exhibits self-organization?"], [396.78, 398.27, "Now listen to Visal."], [398.57, 423.38, "An ant colony is a good example. No ant gives orders, yet trails, nests and food storage emerge from simple local rules, such as following a chemical scent. The colony adapts when food runs out, because feedback strengthens successful trails. Its intelligence arises from interaction, not from any single leader."], [423.68, 425.53, "Excellent answer, Visal!"], [426.42, 432.1, "Great work! Now you can use eight new words and result-of language (arises from, emerges from)."], [432.4, 436.85, "Today's value is systems thinking. See how the parts connect to make the whole."], [437.15, 439.52, "See you in Unit two. Goodbye!"], [439.82, 442.66, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C2B3-Unit02-Network-Theory": [[0.35, 5.13, "Hello, everyone! I'm Ms. Emma. Welcome to Online C two, Book three."], [5.43, 8.65, "Hi! I'm Visal. Let's learn together!"], [8.95, 15.36, "Unit two: Network Theory. Today you will describe structure using represented as / modeled as."], [15.66, 18.33, "Here is our lesson map. Let's start!"], [19.27, 22.27, "Part one: words. You will learn eight new words."], [23.12, 23.9, "Node."], [24.88, 28.64, "Node means a point in a network, such as a person or computer."], [29.25, 31.86, "Each airport is a node in the global network."], [32.45, 35.11, "Your turn. Say: Node."], [37.97, 38.95, "Node."], [39.68, 40.55, "Edge."], [41.55, 44.13, "Edge means a connection between two nodes."], [44.72, 47.45, "An edge may represent friendship or trade."], [48.05, 50.35, "Your turn. Say: Edge."], [53.2, 53.99, "Edge."], [54.75, 56.38, "Network topology."], [57.38, 60.97, "Network topology means the pattern in which nodes are connected."], [61.58, 65.1, "Network topology determines how fast news spreads."], [65.72, 69.11, "Your turn. Say: Network topology."], [71.97, 73.56, "Network topology."], [74.32, 74.97, "Hub."], [75.98, 78.85, "Hub means a node with many more connections than average."], [79.45, 82.03, "Dubai is a hub for international flights."], [82.62, 84.65, "Your turn. Say: Hub."], [87.5, 88.33, "Hub."], [89.08, 90.31, "Centrality."], [91.32, 95.35, "Centrality means a measure of how important a node is within a network."], [95.95, 99.22, "Centrality identifies the most influential person."], [99.82, 102.4, "Your turn. Say: Centrality."], [105.23, 106.49, "Centrality."], [107.25, 108.92, "Small-world network."], [109.92, 114.78, "Small-world network means a network where any two nodes are connected by a few steps."], [115.38, 119.03, "A small-world network explains 'six degrees of separation'."], [119.62, 122.7, "Your turn. Say: Small-world network."], [125.53, 127.86, "Small-world network."], [128.62, 130.09, "Scale-free network."], [131.08, 135.79, "Scale-free network means a network with a few huge hubs and many small nodes."], [136.38, 139.49, "The internet is often described as a scale-free network."], [140.08, 143.4, "Your turn. Say: Scale-free network."], [146.23, 148.24, "Scale-free network."], [148.98, 150.05, "Connectivity."], [151.05, 154.06, "Connectivity means the degree to which nodes are linked."], [154.65, 157.58, "Poor connectivity isolates rural communities."], [158.18, 161.24, "Your turn. Say: Connectivity."], [164.1, 165.37, "Connectivity."], [166.17, 169.54, "Part two: dialogue. Let's listen to a conversation."], [170.38, 175.5, "Visal, my professor says a village can be drawn as dots and lines. Isn't that too simple?"], [176.58, 185.06, "A social system can be represented as a network. Each person is modelled as a node and each relationship as an edge."], [186.15, 187.67, "What do we learn from that?"], [188.78, 200.53, "Centrality shows who matters most, and topology shows how quickly information travels. Hubs are often described as the system's key leverage points."], [201.62, 202.86, "Is it fragile, then?"], [203.95, 211.94, "A scale-free network is robust to random failure, yet it can be modelled as vulnerable to the loss of its hubs."], [213.1, 214.5, "Part three: grammar."], [215.35, 219.02, "Grammar focus: Represented as and modeled as clauses."], [219.32, 220.54, "Look at the pattern."], [221.25, 224.27, "A social system can be represented as a network."], [225.18, 227.21, "Each person is modelled as a node."], [228.12, 231.88, "Hubs are often described as the system's key leverage points."], [232.83, 243.16, "Use passive + as: represented as, modelled as, described as, regarded as. 'As' introduces the category; do not add 'to be': modelled as a node (not 'as to be')."], [243.92, 248.45, "Be careful! Don't say: A system can represent as a network."], [250.4, 253.69, "Say: A system can be represented as a network."], [253.99, 256.64, "Passive: be + past participle."], [257.43, 260.1, "Part four: reading. Read and listen."], [260.9, 262.44, "Seeing the Connections."], [262.74, 266.88, "Network theory studies relationships rather than isolated objects."], [267.87, 274.27, "A social system can be represented as a network, with people modelled as nodes and their relationships as edges."], [275.27, 281.57, "The topology, or pattern of connections, determines how quickly information, disease or money moves."], [282.57, 290.9, "Many real networks are scale-free: a few hubs hold most connections, so they are robust to random failure but vulnerable to targeted attack."], [291.9, 295.93, "Centrality measures therefore help policymakers decide where to intervene."], [297.03, 300.94, "Part five: quiz. Five questions. Are you ready?"], [301.78, 304.83, "A social system can be represented blank a network."], [305.13, 308.28, "A, as. B, to. C, like to."], [311.83, 313.68, "The answer is A: as."], [314.82, 317.36, "A connection between two nodes is an blank."], [317.66, 320.71, "A, edge. B, hub. C, attractor."], [324.27, 325.95, "The answer is A: edge."], [327.12, 330.24, "A node with many more connections than average is a blank."], [330.54, 333.8, "A, hub. B, topology. C, edge."], [337.37, 338.94, "The answer is A: hub."], [340.08, 341.77, "Choose the correct sentence."], [342.07, 347.96, "A, People are modelled as nodes.. B, People are modelled to nodes.. C, People modelled as be nodes.."], [351.5, 354.5, "The answer is A: People are modelled as nodes.."], [355.65, 359.02, "According to the reading, scale-free networks are vulnerable to…"], [359.32, 363.84, "A, random failure. B, targeted attack. C, no failure."], [367.4, 369.85, "The answer is B: targeted attack."], [371.07, 374.51, "Part six: speaking. It's your turn to talk."], [375.35, 378.67, "What is an example of a network you interact with every day?"], [395.48, 397.02, "Now listen to Visal."], [397.32, 418.74, "I interact with a social media network every day. Each user can be modelled as a node and each follow or friendship as an edge. A few accounts act as hubs with millions of followers, so information spreads through them very quickly. That structure explains why a single post can reach a whole country within hours."], [419.04, 420.96, "Excellent answer, Visal!"], [421.85, 426.79, "Great work! Now you can use eight new words and represented as and modeled as clauses."], [427.09, 431.58, "Today's value is analytical thinking. Look for the pattern underneath the surface."], [431.88, 434.24, "See you in Unit three. Goodbye!"], [434.54, 436.99, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C2B3-Unit03-Behavioral-Economics": [[0.35, 4.97, "Hello, everyone! I'm Ms. Emma. Welcome to Online C two, Book three."], [5.27, 8.89, "Hi! I'm Visal. Let's learn together!"], [9.19, 16.19, "Unit three: Behavioral Economics. Today you will explain choices using leverage / exploit + noun phrase."], [16.49, 19.07, "Here is our lesson map. Let's start!"], [20.03, 23.06, "Part one: words. You will learn eight new words."], [23.92, 25.38, "Cognitive bias."], [26.38, 30.87, "Cognitive bias means a systematic error in thinking that affects judgment."], [31.48, 34.27, "Confirmation is a common cognitive bias."], [34.88, 38.51, "Your turn. Say: Cognitive bias."], [41.37, 42.94, "Cognitive bias."], [43.68, 44.82, "Loss aversion."], [45.82, 50.17, "Loss aversion means the tendency to feel losses more strongly than equal gains."], [50.78, 53.94, "Loss aversion makes people keep failing investments."], [54.55, 57.17, "Your turn. Say: Loss aversion."], [60.03, 61.43, "Loss aversion."], [62.18, 63.01, "Anchoring."], [64.02, 67.28, "Anchoring means relying too heavily on the first number seen."], [67.88, 71.06, "Anchoring on the original price made the discount look generous."], [71.65, 74.14, "Your turn. Say: Anchoring."], [77.0, 78.08, "Anchoring."], [78.82, 79.67, "Nudge."], [80.68, 84.7, "Nudge means a gentle change in choice design that steers behaviour."], [85.32, 88.06, "A default enrolment is a powerful nudge."], [88.65, 91.08, "Your turn. Say: Nudge."], [93.93, 94.71, "Nudge."], [95.45, 97.11, "Irrational choice."], [98.12, 102.29, "Irrational choice means a decision that contradicts one's own stated goals."], [102.88, 106.0, "Skipping savings for a sale is an irrational choice."], [106.58, 110.22, "Your turn. Say: Irrational choice."], [113.07, 114.65, "Irrational choice."], [115.38, 116.33, "Heuristic."], [117.32, 120.23, "Heuristic means a mental shortcut for quick judgment."], [120.85, 123.74, "A familiar brand serves as a heuristic for quality."], [124.35, 127.06, "Your turn. Say: Heuristic."], [129.9, 130.82, "Heuristic."], [131.58, 132.98, "Prospect theory."], [133.98, 138.73, "Prospect theory means the theory that people judge outcomes relative to a reference point."], [139.35, 142.43, "Prospect theory won Kahneman a Nobel Prize."], [143.02, 146.15, "Your turn. Say: Prospect theory."], [149.0, 150.36, "Prospect theory."], [151.12, 152.7, "Bounded rationality."], [153.68, 158.74, "Bounded rationality means reasoning limited by time, information and mental capacity."], [159.35, 162.58, "Bounded rationality explains why we settle for good enough."], [163.18, 166.36, "Your turn. Say: Bounded rationality."], [169.2, 170.87, "Bounded rationality."], [171.67, 175.18, "Part two: dialogue. Let's listen to a conversation."], [176.02, 180.21, "Visal, why do people buy extra insurance they will almost never use?"], [181.32, 189.53, "Loss aversion. The pain of a possible loss outweighs the pleasure of an equal gain, and sellers exploit that bias."], [190.62, 192.22, "Is that manipulation?"], [193.32, 203.48, "Not always. A nudge leverages predictable cognitive bias, but it can serve people, for example by making savings the default."], [204.58, 206.63, "So the same tool can help or harm?"], [207.72, 215.52, "Exactly. Marketers exploit anchoring, whereas governments leverage defaults to improve health and savings."], [216.67, 218.39, "Part three: grammar."], [219.25, 223.35, "Grammar focus: Leverage and exploit plus noun phrase."], [223.65, 224.87, "Look at the pattern."], [225.58, 228.57, "A nudge leverages predictable cognitive bias."], [229.48, 232.84, "Marketers exploit anchoring and loss aversion."], [233.75, 236.89, "Governments harness default options to improve savings."], [237.83, 248.95, "Leverage, exploit and harness take a direct object (no preposition): leverages bias, exploits weakness. 'Exploit' can sound negative; 'leverage' and 'harness' are neutral or positive."], [249.68, 253.83, "Be careful! Don't say: A nudge leverages on bias."], [255.8, 258.14, "Say: A nudge leverages bias."], [258.44, 260.25, "leverage takes a direct object."], [261.07, 263.44, "Part four: reading. Read and listen."], [264.23, 265.9, "Predictably Irrational."], [266.2, 270.8, "Behavioural economics tests the assumption that people always choose rationally."], [271.8, 278.36, "Kahneman and Tversky showed that human judgment relies on heuristics, which produce systematic cognitive biases."], [279.37, 285.66, "Under prospect theory, loss aversion makes a loss feel roughly twice as painful as an equal gain feels pleasant."], [286.67, 291.73, "A nudge leverages these regularities, for instance by making retirement saving the default option."], [292.73, 297.91, "Critics warn that the same techniques can be exploited to manipulate, so transparency is essential."], [299.0, 303.12, "Part five: quiz. Five questions. Are you ready?"], [303.98, 306.77, "A nudge blank predictable cognitive bias."], [307.07, 311.31, "A, leverages. B, leverages on. C, leverages of."], [314.87, 317.14, "The answer is A: leverages."], [318.28, 320.85, "Feeling losses more than equal gains is blank."], [321.15, 324.56, "A, anchoring. B, loss aversion. C, nudge."], [328.1, 330.49, "The answer is B: loss aversion."], [331.65, 334.65, "Relying too heavily on the first number seen is blank."], [334.95, 339.22, "A, anchoring. B, heuristic. C, prospect."], [342.77, 344.77, "The answer is A: anchoring."], [345.92, 347.82, "Choose the correct sentence."], [348.12, 354.97, "A, Sellers exploit of bias.. B, Sellers exploit bias.. C, Sellers exploit to bias.."], [358.53, 361.19, "The answer is B: Sellers exploit bias.."], [362.35, 365.44, "According to the reading, critics warn that nudges can be…"], [365.74, 370.16, "A, rational. B, exploited to manipulate. C, useless."], [373.7, 376.69, "The answer is B: exploited to manipulate."], [377.9, 381.28, "Part six: speaking. It's your turn to talk."], [382.15, 385.24, "Have you ever noticed loss aversion affecting your own decisions?"], [402.05, 403.68, "Now listen to Visal."], [403.98, 424.74, "Yes. I once kept a phone plan I no longer needed because cancelling felt like losing something I had already paid for. That is loss aversion: the fear of losing outweighed the logic of saving money. Now I ask what I would choose if I were starting fresh, which reduces the effect."], [425.04, 426.96, "Excellent answer, Visal!"], [427.85, 432.72, "Great work! Now you can use eight new words and leverage and exploit plus noun phrase."], [433.02, 437.29, "Today's value is self-reflection. Look honestly at your own choices."], [437.59, 440.09, "See you in Unit four. Goodbye!"], [440.39, 442.89, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C2B3-Unit04-Cognitive-Science": [[0.35, 5.14, "Hello, everyone! I'm Ms. Emma. Welcome to Online C two, Book three."], [5.44, 9.19, "Hi! I'm Visal. Let's learn together!"], [9.49, 15.9, "Unit four: Cognitive Science. Today you will explain limits using constrained by / limited by."], [16.2, 18.71, "Here is our lesson map. Let's start!"], [19.67, 22.8, "Part one: words. You will learn eight new words."], [23.65, 24.63, "Cognition."], [25.62, 29.39, "Cognition means the mental processes of knowing, thinking and remembering."], [29.98, 32.34, "Sleep strongly affects cognition."], [32.95, 35.43, "Your turn. Say: Cognition."], [38.27, 39.38, "Cognition."], [40.15, 41.71, "Mental representation."], [42.72, 46.59, "Mental representation means an internal model of something in the world."], [47.18, 50.66, "A map in your head is a mental representation."], [51.25, 54.4, "Your turn. Say: Mental representation."], [57.27, 58.92, "Mental representation."], [59.68, 60.79, "Neural network."], [61.78, 66.13, "Neural network means a web of connected neurons, or a computer model of one."], [66.72, 69.72, "A neural network can learn to recognise faces."], [70.32, 73.32, "Your turn. Say: Neural network."], [76.17, 77.75, "Neural network."], [78.48, 79.6, "Perception."], [80.62, 83.92, "Perception means the interpretation of sensory information."], [84.52, 86.89, "Perception is shaped by expectation."], [87.48, 89.93, "Your turn. Say: Perception."], [92.77, 93.73, "Perception."], [94.48, 95.84, "Memory encoding."], [96.85, 101.12, "Memory encoding means the process of turning experience into a storable memory."], [101.72, 105.0, "Memory encoding improves when material is meaningful."], [105.62, 108.65, "Your turn. Say: Memory encoding."], [111.5, 113.26, "Memory encoding."], [114.02, 115.13, "Attention."], [116.15, 119.54, "Attention means the selective focus of mental resources."], [120.15, 122.36, "Divided attention d."], [248.19, 249.63, "Passive needs 'is'."], [250.43, 253.09, "Part four: reading. Read and listen."], [253.9, 255.25, "The Limits of the Mind."], [255.55, 259.69, "Cognitive science treats the mind as an information-processing system."], [260.7, 264.96, "Perception builds a mental representation of the world from noisy sensory data."], [265.97, 272.05, "Learning is often constrained by cognitive load, since working memory can hold only a handful of items at once."], [273.07, 279.29, "Attention is limited by fatigue, and memory encoding is constrained by how meaningful the material appears."], [280.3, 285.39, "Teachers can therefore improve results by chunking content and removing unnecessary detail."], [286.5, 290.9, "Part five: quiz. Five questions. Are you ready?"], [291.75, 294.64, "Learning is often constrained blank cognitive load."], [294.94, 297.44, "A, by. B, from. C, of."], [301.0, 302.59, "The answer is A: by."], [303.75, 306.53, "The mental effort used in working memory is blank."], [306.83, 310.94, "A, cognitive load. B, perception. C, encoding."], [314.5, 316.91, "The answer is A: cognitive load."], [318.05, 321.04, "Turning experience into a storable memory is blank."], [321.34, 325.45, "A, attention. B, memory encoding. C, cognition."], [329.0, 331.34, "The answer is B: memory encoding."], [332.48, 334.22, "Choose the correct sentence."], [334.52, 341.61, "A, Attention limited by fatigue.. B, Attention is limited by fatigue.. C, Attention is limit by fatigue.."], [345.17, 348.83, "The answer is B: Attention is limited by fatigue.."], [349.98, 353.11, "According to the reading, teachers can improve results by…"], [353.41, 358.2, "A, adding detail. B, chunking content. C, lengthening classes."], [361.77, 364.5, "The answer is B: chunking content."], [365.7, 368.77, "Part six: speaking. It's your turn to talk."], [369.62, 373.46, "What strategies help reduce cognitive load when learning something new?"], [390.25, 391.69, "Now listen to Visal."], [391.99, 416.48, "Breaking material into small chunks helps a great deal, because working memory is limited by capacity. I also remove distractions, study in short sessions and use examples before abstract rules. Linking new ideas to what I already know reduces the effort needed to encode them. Testing myself afterwards strengthens memory."], [416.78, 418.82, "Excellent answer, Visal!"], [419.72, 424.77, "Great work! Now you can use eight new words and constrained by and limited by."], [425.07, 429.27, "Today's value is self-awareness. Know your strengths and keep growing."], [429.57, 431.85, "See you in Unit five. Goodbye!"], [432.15, 435.88, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C2B3-Unit05-Evolutionary-Psychology": [[0.35, 5.25, "Hello, everyone! I'm Ms. Emma. Welcome to Online C two, Book three."], [5.55, 9.16, "Hi! I'm Visal. Let's learn together!"], [9.46, 16.41, "Unit five: Evolutionary Psychology. Today you will trace origins using trace back to / originate from."], [16.71, 19.6, "Here is our lesson map. Let's start!"], [20.53, 24.14, "Part one: words. You will learn eight new words."], [24.98, 26.17, "Adaptation."], [27.18, 31.39, "Adaptation means a trait that helps an organism survive and reproduce."], [31.98, 34.23, "Fear of snakes may be an adaptation."], [34.82, 38.05, "Your turn. Say: Adaptation."], [40.9, 42.13, "Adaptation."], [42.88, 44.14, "Natural selection."], [45.15, 49.61, "Natural selection means the process by which helpful traits become more common."], [50.22, 53.24, "Natural selection favours traits that raise survival."], [53.85, 56.77, "Your turn. Say: Natural selection."], [59.63, 61.22, "Natural selection."], [61.95, 63.67, "Evolutionary fitness."], [64.68, 69.25, "Evolutionary fitness means an organism's success in passing on its genes."], [69.85, 73.71, "Evolutionary fitness depends on reproduction, not strength."], [74.32, 77.68, "Your turn. Say: Evolutionary fitness."], [80.53, 82.39, "Evolutionary fitness."], [83.15, 84.45, "Mat onary psychology claims only that some traits can be traced back to adaptation."], [217.87, 219.43, "Part three: grammar."], [220.28, 223.8, "Grammar focus: Trace back to and originate from."], [224.1, 225.23, "Look at the pattern."], [225.92, 229.0, "Many instincts trace back to our ancestral environment."], [229.88, 232.65, "The tendency originates from early survivors."], [233.55, 236.27, "Some traits can be traced back to adaptation."], [237.23, 245.19, "Trace back to, originate from, date back to, go back to + origin. Do not use 'originate in from'. Passive: can be traced back to."], [245.95, 250.05, "Be careful! Don't say: Instincts trace to back the past."], [252.0, 254.74, "Say: Instincts trace back to the past."], [255.04, 256.56, "trace back to + noun."], [257.37, 260.19, "Part four: reading. Read and listen."], [261.0, 262.48, "Echoes of the Past."], [262.78, 267.24, "Evolutionary psychology asks how natural selection shaped the human mind."], [268.23, 274.67, "Many instincts trace back to the ancestral environment, in which fear of snakes or heights raised the odds of survival."], [275.67, 281.89, "Kin selection explains why people often sacrifice for relatives, since helping kin spreads shared genes."], [282.9, 288.89, "Critics caution that explanations of this kind are hard to test and can be confused with stereotypes."], [289.9, 295.59, "Culture, learning and choice remain powerful, so an origin in adaptation is not a destiny."], [296.7, 301.15, "Part five: quiz. Five questions. Are you ready?"], [302.02, 305.51, "Many instincts trace blank to our ancestral environment."], [305.81, 308.64, "A, back. B, up. C, off."], [312.2, 313.93, "The answer is A: back."], [315.08, 318.34, "A trait that helps survival and reproduction is an blank."], [318.64, 323.28, "A, adaptation. B, instinct only. C, environment."], [326.83, 328.93, "The answer is A: adaptation."], [330.08, 332.98, "Favouring relatives who share your genes is blank."], [333.28, 337.15, "A, mate selection. B, kin selection. C, fitness."], [340.7, 343.02, "The answer is B: kin selection."], [344.18, 345.92, "Choose the correct sentence."], [346.22, 353.62, "A, The fear originates from our past.. B, The fear originates of our past.. C, The fear originated by our past.."], [357.17, 360.52, "The answer is A: The fear originates from our past.."], [361.68, 364.88, "According to the reading, an origin in adaptation is…"], [365.18, 370.03, "A, a destiny. B, not a destiny. C, a stereotype."], [373.57, 376.13, "The answer is B: not a destiny."], [377.33, 380.22, "Part six: speaking. It's your turn to talk."], [381.08, 384.75, "Can you think of a modern behavior that might have evolutionary roots?"], [401.55, 403.08, "Now listen to Visal."], [403.38, 425.22, "Our craving for sugary and fatty food may have evolutionary roots. In the ancestral environment, calories were scarce, so a taste for them helped survival. Today food is abundant, so the same instinct contributes to obesity. The behaviour traces back to adaptation, but it is now mismatched with our surroundings."], [425.52, 427.31, "Excellent answer, Visal!"], [428.22, 432.66, "Great work! Now you can use eight new words and trace back to and originate from."], [432.96, 437.87, "Today's value is scientific curiosity. Ask why, and then go and find out."], [438.17, 441.05, "See you in Unit six. Goodbye!"], [441.35, 443.87, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C2B3-Unit06-Neuroeconomics": [[0.35, 5.2, "Hello, everyone! I'm Ms. Emma. Welcome to Online C two, Book three."], [5.5, 9.03, "Hi! I'm Visal. Let's learn together!"], [9.32, 14.71, "Unit six: Neuroeconomics. Today you will weigh choices using favoring X over Y."], [15.01, 17.65, "Here is our lesson map. Let's start!"], [18.6, 21.36, "Part one: words. You will learn eight new words."], [22.22, 23.57, "Neuroeconomics."], [24.55, 28.69, "Neuroeconomics means the study of how the brain makes economic decisions."], [29.28, 32.48, "Neuroeconomics uses brain
