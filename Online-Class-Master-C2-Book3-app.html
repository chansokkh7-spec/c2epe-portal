classes because his village has no reliable internet. Whose problem is that?"], [187.75, 194.77, "It's a policy problem. Policymakers must address the growing digital divide, or inequality will deepen."], [195.88, 197.78, "What else should governments tackle?"], [198.88, 210.75, "Data privacy, for one. Regulators must tackle the collection of personal data without consent, and antitrust authorities should address market concentration."], [211.85, 214.05, "Won't regulation slow innovation?"], [215.15, 222.52, "It can. A good governance framework must address risks while preserving innovation incentives."], [223.67, 225.45, "Part three: grammar."], [226.28, 229.88, "Grammar focus: Address and tackle plus noun phrase."], [230.19, 231.5, "Look at the pattern."], [232.18, 235.32, "Policymakers must address the growing digital divide."], [236.22, 239.16, "Regulators should tackle unauthorised data collection."], [240.05, 243.87, "A governance framework must confront risks without stifling innovation."], [244.83, 252.3, "address / tackle / confront / deal with + problem. No preposition after address or tackle: address the divide (not 'address to the divide')."], [253.05, 257.52, "Be careful! Don't say: Leaders must address to the divide."], [259.47, 261.96, "Say: Leaders must address the divide."], [262.26, 264.14, "address + direct object."], [264.93, 267.41, "Part four: reading. Read and listen."], [268.2, 269.68, "Governing Technology."], [269.98, 274.72, "Technology policy must keep pace with innovation that often moves faster than law."], [275.7, 283.89, "Policymakers must address the growing digital divide, because those without access to the internet are excluded from education, work and public services."], [284.9, 292.23, "Regulators should tackle data privacy and market concentration, since a few firms control vast amounts of personal information."], [293.23, 300.57, "Emerging technologies such as artificial intelligence raise further questions of safety, accountability and fairness."], [301.57, 306.71, "A sound governance framework protects the public while preserving the incentives that drive innovation."], [307.8, 311.62, "Part five: quiz. Five questions. Are you ready?"], [312.45, 315.49, "Policymakers must blank the growing digital divide."], [315.79, 319.75, "A, address. B, address to. C, address at."], [323.3, 325.3, "The answer is A: address."], [326.45, 329.99, "The gap between those with and without access to technology is the blank."], [330.29, 334.32, "A, antitrust. B, digital divide. C, incentive."], [337.87, 340.37, "The answer is B: digital divide."], [341.52, 343.83, "Law that prevents monopolies is blank."], [344.13, 349.15, "A, antitrust. B, privacy. C, regulation only."], [352.7, 354.97, "The answer is A: antitrust."], [356.12, 357.78, "Choose the correct sentence."], [358.08, 365.04, "A, Governments must tackle the problem.. B, Governments must tackle to the problem.. C, Governments must tackle at problem.."], [368.6, 371.89, "The answer is A: Governments must tackle the problem.."], [373.05, 377.23, "According to the reading, a sound framework protects the public while preserving…"], [377.53, 382.26, "A, incentives to innovate. B, monopolies. C, inequality."], [385.8, 388.62, "The answer is A: incentives to innovate."], [389.83, 393.25, "Part six: speaking. It's your turn to talk."], [394.12, 398.31, "What is one technology policy challenge you think governments should address?"], [415.12, 416.57, "Now listen to Visal."], [416.87, 443.44, "Governments should address data privacy, because companies collect huge amounts of personal information, often without people really understanding what they have agreed to. Clear rules, strong enforcement and plain-language consent would give individuals more control. This protects trust in digital services, which innovation ultimately depends on."], [443.74, 445.49, "Excellent answer, Visal!"], [446.38, 451.32, "Great work! Now you can use eight new words and address and tackle plus noun phrase."], [451.62, 457.1, "Today's value is digital responsibility. Use technology in ways that protect others."], [457.4, 460.01, "See you in Unit nineteen. Goodbye!"], [460.31, 463.3, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C2B3-Unit19-Future-of-Work": [[0.35, 5.62, "Hello, everyone! I'm Ms. Emma. Welcome to Online C two, Book three."], [5.92, 9.64, "Hi! I'm Visal. Let's learn together!"], [9.94, 15.79, "Unit nineteen: Future of Work. Today you will predict change using will / is likely to."], [16.09, 18.89, "Here is our lesson map. Let's start!"], [19.83, 23.02, "Part one: words. You will learn eight new words."], [23.88, 24.92, "Automation."], [25.92, 30.12, "Automation means the use of machines to perform tasks once done by people."], [30.72, 33.69, "Automation replaced many routine factory jobs."], [34.28, 36.96, "Your turn. Say: Automation."], [39.8, 40.74, "Automation."], [41.48, 42.7, "Gig economy."], [43.72, 48.06, "Gig economy means work arranged through short-term tasks and platforms."], [48.65, 52.36, "The gig economy offers flexibility but little security."], [52.95, 55.59, "Your turn. Say: Gig economy."], [58.43, 59.43, "Gig economy."], [60.18, 61.17, "Reskilling."], [62.18, 65.47, "Reskilling means training workers for new kinds of jobs."], [66.08, 69.17, "Reskilling helped drivers become logistics planners."], [69.78, 72.62, "Your turn. Say: Reskilling."], [75.47, 76.58, "Reskilling."], [77.35, 78.41, "Remote work."], [79.42, 83.1, "Remote work means doing a job from outside a central workplace."], [83.68, 86.22, "Remote work widened the pool of candidates."], [86.82, 89.67, "Your turn. Say: Remote work."], [92.5, 93.83, "Remote work."], [94.58, 95.78, "Labor market."], [96.78, 100.29, "Labor market means the system in which workers and employers meet."], [100.88, 103.5, "The labor market rewards digital skills."], [104.08, 106.74, "Your turn. Say: Labor market."], [109.6, 110.8, "Labor market."], [111.55, 113.4, "Universal basic income."], [114.38, 118.32, "Universal basic income means a regular payment given to every citizen."], [118.92, 122.58, "Universal basic income is being trialled in several countries."], [123.18, 127.04, "Your turn. Say: Universal basic income."], [129.9, 131.77, "Universal basic income."], [132.52, 133.78, "Job displacement."], [134.78, 139.28, "Job displacement means the loss of jobs when tasks are automated or moved."], [139.88, 142.65, "Job displacement hit textile workers first."], [143.25, 145.89, "Your turn. Say: Job displacement."], [148.73, 150.34, "Job displacement."], [151.08, 152.84, "Workforce transformation."], [153.85, 158.79, "Workforce transformation means a large-scale change in how people work."], [159.38, 162.41, "Workforce transformation will demand lifelong learning."], [163.02, 166.23, "Your turn. Say: Workforce transformation."], [169.07, 170.97, "Workforce transformation."], [171.77, 175.65, "Part two: dialogue. Let's listen to a conversation."], [176.48, 180.13, "Visal, will robots take everyone's job in ten years?"], [181.22, 187.98, "Unlikely. Automation is likely to reshape many industries rather than abolish work altogether."], [189.08, 191.14, "But some jobs will disappear, right?"], [192.25, 200.58, "Certainly. Routine tasks are likely to be automated first, and job displacement will be painful without reskilling."], [201.68, 203.65, "What will new jobs look like?"], [204.75, 216.07, "Many will be hybrid roles combining human judgment with digital tools. Remote work is expected to remain common, and the gig economy will probably keep growing."], [217.23, 218.66, "Part three: grammar."], [219.52, 223.57, "Grammar focus: Future prediction language (will, is likely to)."], [223.87, 225.13, "Look at the pattern."], [225.82, 228.68, "Automation is likely to reshape many industries."], [229.58, 232.72, "Routine tasks will probably be automated first."], [233.62, 236.07, "Remote work is expected to remain common."], [237.03, 246.65, "Predict with will / be likely to / be expected to / be set to + base verb, softened by probably, possibly. 'Likely' is an adjective: is likely to (not 'is probably to')."], [247.42, 251.8, "Be careful! Don't say: Automation is likely reshape industries."], [253.73, 257.42, "Say: Automation is likely to reshape industries."], [257.72, 259.6, "likely + to-infinitive."], [260.4, 263.21, "Part four: reading. Read and listen."], [264.0, 265.52, "Work in the Next Decade."], [265.82, 271.33, "Forecasts about work are uncertain, but several trends are widely expected to continue."], [272.33, 281.15, "Automation is likely to reshape many industries, especially those based on routine tasks, while creating demand for digital and creative skills."], [282.13, 287.71, "Job displacement will fall unevenly, so reskilling is expected to become a lifelong necessity."], [288.7, 296.18, "Remote work and the gig economy will probably expand, offering flexibility while raising questions about security and benefits."], [297.17, 302.52, "Some governments are testing universal basic income as a safeguard during workforce transformation."], [303.63, 307.46, "Part five: quiz. Five questions. Are you ready?"], [308.32, 311.33, "Automation is likely blank reshape many industries."], [311.63, 314.8, "A, to. B, for. C, that."], [318.37, 320.12, "The answer is A: to."], [321.28, 324.1, "Training workers for new kinds of jobs is blank."], [324.4, 328.69, "A, reskilling. B, automation. C, displacement."], [332.23, 334.06, "The answer is A: reskilling."], [335.22, 338.37, "A regular payment given to every citizen is blank."], [338.67, 343.41, "A, a gig. B, universal basic income. C, remote work."], [346.97, 349.98, "The answer is B: universal basic income."], [351.12, 352.88, "Choose the correct sentence."], [353.18, 360.08, "A, Jobs will probably change.. B, Jobs probably will to change.. C, Jobs are probably to will change.."], [363.63, 367.01, "The answer is A: Jobs will probably change.."], [368.15, 371.24, "According to the reading, reskilling is expected to become…"], [371.54, 376.17, "A, unnecessary. B, a lifelong necessity. C, illegal."], [379.73, 382.46, "The answer is B: a lifelong necessity."], [383.67, 386.95, "Part six: speaking. It's your turn to talk."], [387.78, 390.81, "How do you think the workplace will change over the next decade?"], [407.62, 409.08, "Now listen to Visal."], [409.38, 432.6, "I think the workplace will become more flexible and more digital. Routine tasks are likely to be automated, so people will need skills such as critical thinking, communication and adaptability. Remote and hybrid work will probably remain common. Workers will have to keep learning throughout their careers, and employers will need to support them."], [432.9, 434.53, "Excellent answer, Visal!"], [435.42, 440.81, "Great work! Now you can use eight new words and future prediction language (will, is likely to)."], [441.11, 445.87, "Today's value is future readiness. Build the skills that tomorrow will ask of you."], [446.17, 448.73, "See you in Unit twenty. Goodbye!"], [449.03, 451.96, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C2B3-Unit20-Public-Health-Policy": [[0.35, 5.58, "Hello, everyone! I'm Ms. Emma. Welcome to Online C two, Book three."], [5.88, 9.19, "Hi! I'm Visal. Let's learn together!"], [9.49, 16.34, "Unit twenty: Public Health Policy. Today you will report evidence using passive reporting (is estimated to)."], [16.64, 19.2, "Here is our lesson map. Let's start!"], [20.17, 23.62, "Part one: words. You will learn eight new words."], [24.48, 25.55, "Public health."], [26.55, 30.85, "Public health means the science and practice of protecting the health of populations."], [31.45, 34.67, "Public health depends on prevention, not just treatment."], [35.28, 37.92, "Your turn. Say: Public health."], [40.77, 41.88, "Public health."], [42.65, 43.62, "Prevention."], [44.62, 48.0, "Prevention means action taken to stop disease before it occurs."], [48.58, reliable estimate. Smoking is known to cause cancer, and tobacco taxes are reported to have reduced consumption."], [192.02, 193.67, "Why use passive wording?"], [194.78, 204.11, "Because the claim rests on studies, not on one person. Findings are said to be strongest when many populations show the same result."], [205.27, 206.96, "Part three: grammar."], [207.82, 211.4, "Grammar focus: Passive reporting (is estimated to)."], [211.69, 212.94, "Look at the pattern."], [213.65, 216.88, "Vaccination is estimated to save millions of lives."], [217.78, 219.88, "Smoking is known to cause cancer."], [220.78, 223.65, "Tobacco taxes are reported to reduce consumption."], [224.6, 235.47, "Use passive reporting verbs (is estimated / believed / known / said / thought / reported) + to-infinitive for claims based on evidence: Vaccination is estimated to save lives. This avoids naming a source."], [236.22, 240.75, "Be careful! Don't say: Vaccines estimated to save lives."], [242.7, 246.1, "Say: Vaccination is estimated to save lives."], [246.4, 248.14, "is estimated + to."], [248.93, 251.46, "Part four: reading. Read and listen."], [252.27, 253.57, "Evidence for Health."], [253.87, 259.29, "Public health policy aims to protect populations rather than treat individuals one by one."], [260.3, 267.18, "Vaccination is estimated to save millions of lives every year, and clean water is believed to have saved still more."], [268.17, 273.76, "Tobacco taxes are reported to have reduced smoking, particularly among young and low-income people."], [274.77, 281.63, "Equity matters, because the benefits of prevention are known to reach the poorest last unless services are deliberately extended."], [282.63, 288.39, "Policies are said to succeed when they are based on evidence, supported by communities and enforced fairly."], [289.5, 293.43, "Part five: quiz. Five questions. Are you ready?"], [294.28, 297.7, "Vaccination is estimated blank save millions of lives."], [298.0, 301.03, "A, to. B, that. C, for."], [304.57, 306.52, "The answer is A: to."], [307.68, 310.94, "Action taken to stop disease before it occurs is blank."], [311.24, 314.96, "A, prevention. B, equity. C, evidence."], [318.5, 320.85, "The answer is A: prevention."], [321.98, 324.8, "Fairness in access to health services is blank."], [325.1, 328.98, "A, policy. B, equity. C, population."], [332.53, 334.57, "The answer is B: equity."], [335.72, 337.58, "Choose the correct sentence."], [337.88, 344.97, "A, Smoking is known to cause cancer.. B, Smoking knows to cause cancer.. C, Smoking is known cause cancer.."], [348.53, 351.75, "The answer is A: Smoking is known to cause cancer.."], [352.92, 356.25, "According to the reading, policies succeed when they are based on…"], [356.55, 359.64, "A, evidence. B, luck. C, rumour."], [363.2, 365.64, "The answer is A: evidence."], [366.83, 370.0, "Part six: speaking. It's your turn to talk."], [370.85, 373.94, "Which public health policy has had the greatest impact?"], [390.75, 392.2, "Now listen to Visal."], [392.5, 415.64, "I believe vaccination has had the greatest impact. It is estimated to prevent millions of deaths every year, and it eradicated smallpox entirely. Clean water and sanitation have also been hugely important. The strength of vaccination is that it protects not only individuals but whole communities through herd immunity."], [415.94, 417.73, "Excellent answer, Visal!"], [418.62, 423.74, "Great work! Now you can use eight new words and passive reporting (is estimated to)."], [424.04, 429.04, "Today's value is evidence-based judgment. Let good evidence guide what you decide."], [429.34, 432.24, "See you in Unit twenty-one. Goodbye!"], [432.54, 436.06, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C2B3-Unit21-Urban-Resilience": [[0.35, 5.36, "Hello, everyone! I'm Ms. Emma. Welcome to Online C two, Book three."], [5.66, 9.2, "Hi! I'm Visal. Let's learn together!"], [9.5, 15.52, "Unit twenty-one: Urban Resilience. Today you will recommend action using should + passive."], [15.82, 18.47, "Here is our lesson map. Let's start!"], [19.43, 22.77, "Part one: words. You will learn eight new words."], [23.62, 24.77, "Resilience."], [25.78, 29.8, "Resilience means the ability of a city to absorb shocks and recover."], [30.42, 32.74, "Resilience was tested by the monsoon."], [33.35, 36.65, "Your turn. Say: Resilience."], [39.5, 40.64, "Resilience."], [41.38, 42.16, "Flooding."], [43.15, 46.29, "Flooding means the covering of normally dry land with water."], [46.88, 49.25, "Flooding closed the main road for three days."], [49.85, 52.3, "Your turn. Say: Flooding."], [55.17, 55.95, "Flooding."], [56.68, 58.09, "Infrastructure."], [59.08, 63.36, "Infrastructure means basic systems such as roads, drains and power."], [63.95, 66.73, "Ageing infrastructure failed under the storm."], [67.32, 70.2, "Your turn. Say: Infrastructure."], [73.07, 74.36, "Infrastructure."], [75.12, 76.29, "Adaptation."], [77.28, 80.72, "Adaptation means adjusting to expected climate effects."], [81.32, 84.4, "Adaptation includes raising homes above flood level."], [84.98, 88.03, "Your turn. Say: Adaptation."], [90.87, 92.04, "Adaptation."], [92.78, 93.72, "Heatwave."], [94.72, 98.05, "Heatwave means a long period of unusually hot weather."], [98.65, 101.19, "A heatwave strained the electricity grid."], [101.78, 104.27, "Your turn. Say: Heatwave."], [107.13, 108.18, "Heatwave."], [108.92, 109.84, "Planning."], [110.85, 114.74, "Planning means organising the use of land and resources in advance."], [115.35, 117.8, "Careful planning kept the new district dry."], [118.42, 120.69, "Your turn. Say: Planning."], [123.53, 124.43, "Planning."], [125.18, 126.06, "Community."], [127.05, 130.22, "Community means a group of people living in the same area."], [130.82, 133.08, "The community cleared the canals together."], [133.68, 136.38, "Your turn. Say: Community."], [139.23, 140.2, "Community."], [140.95, 141.99, "Recovery."], [142.98, 146.86, "Recovery means the return to normal conditions after a disaster."], [147.45, 149.62, "Recovery took months after the flood."], [150.22, 152.86, "Your turn. Say: Recovery."], [155.7, 156.76, "Recovery."], [157.57, 161.63, "Part two: dialogue. Let's listen to a conversation."], [162.48, 167.05, "Visal, every rainy season parts of Phnom Penh flood. What should the city do?"], [168.15, 175.66, "Drainage systems should be upgraded, and green spaces should be protected so that rainwater can be absorbed."], [176.75, 178.2, "Isn't that expensive?"], [179.32, 189.18, "It is, but the costs of inaction are higher. Vulnerable neighbourhoods should be prioritised, and early warnings should be provided in every district."], [190.28, 191.38, "And residents?"], [192.48, 200.93, "They should be involved in planning. Community knowledge must be used, and local volunteers should be trained for rapid recovery."], [202.07, 203.91, "Part three: grammar."], [204.75, 208.51, "Grammar focus: Should plus passive for recommendations."], [208.81, 209.98, "Look at the pattern."], [210.68, 214.06, "Drainage systems should be upgraded before the next monsoon."], [214.95, 217.94, "Vulnerable neighbourhoods should be prioritised in the budget."], [218.85, 221.08, "Residents should be involved in planning."], [222.03, 232.87, "Recommend with should be + past participle: should be upgraded, should be protected. It is polite and impersonal because the actor is omitted. For strong need use must be + p.p."], [233.62, 236.98, "Be careful! Don't say: Drains should upgrade."], [238.93, 241.32, "Say: Drains should be upgraded."], [241.62, 243.52, "should be + past participle."], [244.33, 246.81, "Part four: reading. Read and listen."], [247.6, 249.31, "A City That Bounces Back."], [249.61, 255.04, "Cities concentrate people and assets, so a single flood or heatwave can cause severe damage."], [256.03, 260.44, "Urban resilience is the capacity to absorb such shocks and recover quickly."], [261.43, 268.84, "Experts recommend that drainage systems should be upgraded, wetlands should be protected, and buildings should be designed for extreme heat."], [269.83, 277.09, "Vulnerable neighbourhoods should be prioritised, and residents should be involved in planning, since local knowledge is invaluable."], [278.1, 282.76, "Recovery plans must be prepared before disaster strikes, not afterwards."], [283.87, 287.98, "Part five: quiz. Five questions. Are you ready?"], [288.85, 291.14, "Drainage systems should blank upgraded."], [291.44, 294.42, "A, be. B, to be. C, been."], [297.97, 299.63, "The answer is A: be."], [300.78, 303.98, "The return to normal conditions after a disaster is blank."], [304.28, 308.27, "A, recovery. B, planning. C, heatwave."], [311.83, 314.32, "The answer is A: recovery."], [315.48, 318.19, "Basic systems such as roads and drains are blank."], [318.49, 323.4, "A, community. B, infrastructure. C, adaptation."], [326.93, 329.35, "The answer is B: infrastructure."], [330.52, 332.3, "Choose the correct sentence."], [332.6, 338.12, "A, Wetlands should be protect.. B, Wetlands should be protected.. C, Wetlands should protected.."], [341.67, 344.61, "The answer is B: Wetlands should be protected.."], [345.75, 349.4, "According to the reading, recovery plans must be prepared…"], [349.7, 354.15, "A, afterwards. B, before disaster strikes. C, never."], [357.7, 360.69, "The answer is B: before disaster strikes."], [361.9, 365.18, "Part six: speaking. It's your turn to talk."], [366.02, 368.76, "How could Phnom Penh become more resilient to flooding?"], [385.55, 387.19, "Now listen to Visal."], [387.49, 411.33, "Phnom Penh could become more resilient if drainage systems were upgraded, lakes and wetlands were protected, and new buildings were designed above flood levels. Early warnings should be provided to every district, and communities should be trained to respond. Planning must also protect vulnerable neighbourhoods, which suffer most."], [411.63, 413.19, "Excellent answer, Visal!"], [414.08, 419.14, "Great work! Now you can use eight new words and should plus passive for recommendations."], [419.44, 424.31, "Today's value is community resilience. Stronger communities recover together."], [424.61, 427.39, "See you in Unit twenty-two. Goodbye!"], [427.69, 430.4, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C2B3-Unit22-The-Energy-Transition": [[0.35, 5.27, "Hello, everyone! I'm Ms. Emma. Welcome to Online C two, Book three."], [5.57, 8.96, "Hi! I'm Visal. Let's learn together!"], [9.26, 15.37, "Unit twenty-two: The Energy Transition. Today you will state conditions using unless / but for."], [15.67, 18.2, "Here is our lesson map. Let's start!"], [19.17, 22.47, "Part one: words. You will learn eight new words."], [23.32, 24.78, "Energy transition."], [25.78, 30.26, "Energy transition means the shift from fossil fuels to low-carbon energy."], [30.85, 33.43, "The energy transition will take decades."], [34.02, 37.18, "Your turn. Say: Energy transition."], [40.03, 41.58, "Energy transition."], [42.32, 43.45, "Renewables."], [44.45, 48.62, "Renewables means energy sources such as solar and wind that do not run out."], [49.22, 52.56, "Renewables are now the cheapest new power in many places."], [53.15, 56.08, "Your turn. Say: Renewables."], [58.93, 60.21, "Renewables."], [60.95, 62.38, "Fossil fuels."], [63.38, 67.92, "Fossil fuels means coal, oil and gas formed from ancient organisms."], [68.52, 71.81, "Fossil fuels still supply most of the world's energy."], [72.42, 75.53, "Your turn. Say: Fossil fuels."], [78.4, 79.74, "Fossil fuels."], [80.48, 81.26, "Grid."], [82.25, 85.12, "Grid means the network that delivers electricity."], [85.72, 89.08, "A strong grid can carry power from distant wind farms."], [89.68, 92.3, "Your turn. Say: Grid."], [95.17, 95.78, "Grid."], [96.55, 97.5, "Storage."], [98.52, 102.23, "Storage means technology that holds energy for later use."], [102.85, 105.12, "Storage lets solar power serve the night."], [105.72, 108.17, "Your turn. Say: Storage."], [111.03, 112.14, "Storage."], [112.88, 113.92, "Emissions."], [114.92, 118.2, "Emissions means greenhouse gases released into the air."], [118.82, 120.94, "Emissions from transport are rising."], [121.55, 124.49, "Your turn. Say: Emissions."], [127.33, 128.38, "Emissions."], [129.12, 130.09, "Investment."], [131.08, 134.29, "Investment means money committed to produce future benefit."], [134.88, 136.99, "Investment in clean power doubled."], [137.58, 140.28, "Your turn. Say: Investment."], [143.13, 144.33, "Investment."], [145.08, 146.34, "Just transition."], [147.35, 151.72, "Just transition means a shift that treats affected workers and regions fairly."], [152.32, 155.01, "A just transition retrains coal miners."], [155.62, 158.36, "Your turn. Say: Just transition."], [161.2, 162.54, "Just transition."], [163.33, 167.12, "Part two: dialogue. Let's listen to a conversation."], [167.98, 173.55, "Visal, solar panels are cheap now. Why isn't everything powered by renewables already?"], [174.65, 181.89, "Unless storage improves, renewables will face limits, because the sun and wind are intermittent."], [182.98, 184.22, "What else is missing?"], [185.32, 194.37, "Grids. Unless networks are expanded, clean power cannot reach cities. But for large investment, the transition would stall."], [195.48, 197.49, "And workers in coal regions?"], [198.58, 205.81, "Unless they are retrained, resistance will grow. But for a just transition, political support would collapse."], [206.97, 208.47, "Part three: grammar."], [209.32, 211.99, "Grammar focus: Unless and but for."], [212.29, 213.41, "Look at the pattern."], [214.12, 217.46, "Unless storage improves, renewables will face limits."], [218.35, 222.5, "Unless networks are expanded, clean power cannot reach cities."], [223.38, 226.52, "But for large investment, the transition would stall."], [227.47, 237.76, "Unless = if … not: Unless storage improves (not 'unless storage doesn't improve'). But for + noun = if it were not for: But for investment, the transition would stall."], [238.52, 243.34, "Be careful! Don't say: Unless storage not improves, limits stay."], [245.3, 248.48, "Say: Unless storage improves, limits will remain."], [248.78, 250.7, "Unless already means 'if not'."], [251.5, 254.0, "Part four: reading. Read and listen."], [254.8, 256.21, "Powering the Transition."], [256.51, 263.79, "The energy transition aims to replace fossil fuels with low-carbon sources while keeping electricity reliable and affordable."], [264.8, 272.0, "Solar and wind are now cheap, but unless storage improves, renewables will face limits because the sun does not always shine."], [273.0, 278.95, "Unless grids are expanded, power generated in remote regions cannot reach the cities that need it."], [279.93, 284.19, "But for large public and private investment, none of this progress would have occurred."], [285.2, 292.27, "A just transition, which retrains workers in fossil fuel industries, is essential unless political support is to collapse."], [293.37, 297.66, "Part five: quiz. Five questions. Are you ready?"], [298.52, 301.62, "blank storage improves, renewables will face limits."], [301.92, 305.85, "A, Unless. B, Despite. C, Because."], [309.4, 311.06, "The answer is A: Unless."], [312.22, 314.96, "The network that delivers electricity is the blank."], [315.26, 318.79, "A, storage. B, grid. C, emissions."], [322.33, 324.02, "The answer is B: grid."], [325.18, 328.56, "A shift that treats workers fairly is a blank transition."], [328.86, 332.1, "A, just. B, quick. C, fossil."], [335.63, 337.42, "The answer is A: just."], [338.58, 340.94, "'But for investment, it would stall' means…"], [341.24, 347.72, "A, Because of investment, it stalls.. B, Without investment, it would stall.. C, Investment will stall it.."], [351.27, 354.56, "The answer is B: Without investment, it would stall.."], [355.72, 358.87, "According to the reading, a just transition retrains…"], [359.17, 364.72, "A, workers in fossil fuel industries. B, investors. C, engineers abroad."], [368.27, 371.98, "The answer is A: workers in fossil fuel industries."], [373.2, 376.54, "Part six: speaking. It's your turn to talk."], [377.38, 380.39, "What are the obstacles to a fast energy transition?"], [397.18, 398.64, "Now listen to Visal."], [398.94, 425.4, "The main obstacles are storage, grids, money and politics. Unless storage improves, renewables cannot supply power when it is dark or still. Grids must be expanded to carry clean power to cities. Large investment is needed, and workers in fossil fuel regions must be treated fairly. Without all four, the transition will be slower than the climate requires."], [425.7, 427.62, "Excellent answer, Visal!"], [428.52, 432.98, "Great work! Now you can use eight new words and unless and but for."], [433.28, 437.62, "Today's value is sustainable thinking. Choose what can last for the long term."], [437.92, 442.05, "See you in Unit twenty-three. Goodbye!"], [442.35, 445.4, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C2B3-Unit23-Food-Systems": [[0.35, 5.28, "Hello, everyone! I'm Ms. Emma. Welcome to Online C two, Book three."], [5.58, 8.89, "Hi! I'm Visal. Let's learn together!"], [9.19, 18.46, "Unit twenty-three: Food Systems. Today you will quantify claims using quantifiers (a great deal of / a significant proportion)."], [18.76, 21.5, "Here is our lesson map. Let's start!"], [22.47, 25.33, "Part one: words. You will learn eight new words."], [26.18, 27.27, "Food system."], [28.25, 32.91, "Food system means everything involved in producing, moving and consuming food."], [33.52, 36.72, "A food system links farmers, traders and consumers."], [37.32, 40.48, "Your turn. Say: Food system."], [43.33, 44.52, "Food system."], [45.28, 46.52, "Agriculture."], [47.52, 51.0, "Agriculture means the practice of farming crops and livestock."], [51.62, 54.36, "Agriculture employs most people in the region."], [54.95, 57.52, "Your turn. Say: Agriculture."], [60.37, 61.47, "Agriculture."], [62.22, 63.45, "Supply chain."], [64.45, 68.67, "Supply chain means the network that moves a product from producer to consumer."], [69.28, 71.74, "A supply chain failure left shelves empty."], [72.35, 75.22, "Your turn. Say: Supply chain."], [78.07, 79.68, "Supply chain."], [80.42, 81.45, "Food waste."], [82.45, 85.39, "Food waste means edible food that is thrown away."], [85.98, 88.3, "Food waste occurs at every stage."], [88.88, 91.31, "Your turn. Say: Food waste."], [94.17, 95.33, "Food waste."], [96.08, 97.11, "Nutrition."], [98.12, 101.03, "Nutrition means the intake of food needed for health."], [101.65, 105.28, "Nutrition in childhood shapes lifelong health."], [105.88, 108.57, "Your turn. Say: Nutrition."], [111.43, 112.5, "Nutrition."], [113.25, 114.51, "Smallholder."], [115.52, 118.97, "Smallholder means a farmer who cultivates a small plot."], [119.58, 122.26, "Smallholders produce much of the world's food."], [122.85, 125.61, "Your turn. Say: Smallholder."], [128.47, 129.7, "Smallholder."], [130.45, 131.16, "Climate."], [132.15, 135.34, "Climate means the long-term pattern of weather in a region."], [135.95, 138.0, "Climate change threatens harvests."], [138.58, 141.04, "Your turn. Say: Climate."], [143.9, 144.76, "Climate."], [145.52, 146.67, "Security."], [147.68, 151.27, "Security means the state of being reliably protected from lack."], [151.88, 155.16, "Food security means reliable access to enough food."], [155.75, 158.45, "Your turn. Say: Security."], [161.3, 162.46, "Security."], [163.27, 166.75, "Part two: dialogue. Let's listen to a conversation."], [167.62, 172.27, "Visal, restaurants throw away so much food. How big is the problem really?"], [173.35, 179.63, "A significant proportion of food is wasted, in some estimates nearly a third."], [180.75, 182.03, "Where does it happen?"], [183.12, 193.42, "A great deal of waste occurs on farms and in storage in poorer countries, whereas a large amount is thrown out by households in richer ones."], [194.52, 195.74, "What can be done?"], [196.85, 209.52, "A considerable number of smallholders lack cold storage. Investing in storage would save a substantial quantity of crops, and a small number of simple habits cut household waste."], [210.67, 212.36, "Part three: grammar."], [213.22, 218.03, "Grammar focus: Quantifiers (a great deal of and a significant proportion)."], [218.33, 219.45, "Look at the pattern."], [220.15, 222.78, "A significant proportion of food is wasted."], [223.68, 226.11, "A great deal of waste occurs on farms."], [227.02, 230.29, "A considerable number of smallholders lack cold storage."], [231.23, 242.06, "A great deal of / a large amount of / a significant proportion of + uncountable (food, waste); a large number of / a considerable number of + plural countable (farmers). The verb agrees with the noun."], [242.82, 246.77, "Be careful! Don't say: A great deal of foods is wasted."], [248.73, 251.55, "Say: A great deal of food is wasted."], [251.85, 253.96, "a great deal of + uncountable."], [254.77, 257.25, "Part four: reading. Read and listen."], [258.03, 259.3, "From Farm to Fork."], [259.6, 265.07, "The global food system feeds billions, yet it wastes a significant proportion of what it produces."], [266.07, 274.27, "A great deal of food is lost on farms and in transport in poorer countries, whereas a large amount is discarded by households and retailers in richer ones."], [275.27, 283.15, "A considerable number of smallholders lack storage or roads, so a substantial quantity of their crops spoils before it reaches markets."], [284.17, 290.37, "Reducing waste would improve nutrition, save money and cut the emissions caused by producing uneaten food."], [291.37, 298.4, "A small number of practical measures, such as better storage, clearer date labels and meal planning, would make a major difference."], [299.5, 303.94, "Part five: quiz. Five questions. Are you ready?"], [304.78, 307.67, "A significant proportion of food blank wasted."], [307.96, 311.04, "A, is. B, are. C, were being."], [314.6, 316.27, "The answer is A: is."], [317.42, 319.85, "A great deal of blank occurs on farms."], [320.15, 323.52, "A, waste. B, wastes. C, wasting."], [327.07, 328.89, "The answer is A: waste."], [330.05, 332.95, "A farmer who cultivates a small plot is a blank."], [333.25, 336.87, "A, smallholder. B, supplier. C, trader."], [340.43, 342.79, "The answer is A: smallholder."], [343.95, 345.67, "Choose the correct sentence."], [345.97, 354.56, "A, A large number of farmer lack storage.. B, A large number of farmers lack storage.. C, A large number of farmers lacks storage.."], [358.1, 361.88, "The answer is B: A large number of farmers lack storage.."], [363.02, 367.29, "According to the reading, reducing waste would improve nutrition, save money and cut…"], [367.59, 371.78, "A, emissions. B, harvests. C, variety."], [375.33, 377.55, "The answer is A: emissions."], [378.77, 382.05, "Part six: speaking. It's your turn to talk."], [382.88, 384.78, "How can food waste be reduced?"], [401.58, 403.1, "Now listen to Visal."], [403.39, 429.84, "A great deal of food waste can be reduced with simple measures. Farmers need better storage and transport so crops do not spoil. Shops can sell imperfect produce instead of discarding it. At home, a significant proportion of waste could be avoided by planning meals, storing food properly and using leftovers. Awareness matters as much as technology."], [430.14, 431.87, "Excellent answer, Visal!"], [432.75, 438.5, "Great work! Now you can use eight new words and quantifiers (a great deal of and a significant proportion)."], [438.8, 443.72, "Today's value is food responsibility. Value food and the people who produce it."], [444.02, 447.0, "See you in Unit twenty-four. Goodbye!"], [447.3, 450.12, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C2B3-Unit24-Water-Governance": [[0.35, 4.86, "Hello, everyone! I'm Ms. Emma. Welcome to Online C two, Book three."], [5.16, 8.61, "Hi! I'm Visal. Let's learn together!"], [8.91, 15.22, "Unit twenty-four: Water Governance. Today you will describe disputes using complex noun phrases."], [15.52, 18.2, "Here is our lesson map. Let's start!"], [19.17, 22.57, "Part one: words. You will learn eight new words."], [23.42, 24.59, "Water governance."], [25.58, 30.38, "Water governance means the rules and institutions that manage who uses water and how."], [30.98, 33.92, "Water governance decides who gets water in a drought."], [34.52, 37.52, "Your turn. Say: Water governance."], [40.37, 41.75, "Water governance."], [42.52, 43.72, "River basin."], [44.72, 49.32, "River basin means the whole area drained by a river and its tributaries."], [49.92, 52.39, "The river basin spans six countries."], [52.98, 56.04, "Your turn. Say: River basin."], [58.9, 60.3, "River basin."], [61.05, 62.19, "Allocation."], [63.18, 67.19, "Allocation means the distribution of a limited resource among users."], [67.78, 70.29, "The allocation of water favoured farmers."], [70.88, 73.73, "Your turn. Say: Allocation."], [76.57, 77.77, "Allocation."], [78.52, 79.77, "Transboundary."], [80.78, 83.97, "Transboundary means crossing the borders between countries."], [84.58, 87.51, "Transboundary rivers require shared agreements."], [88.12, 90.86, "Your turn. Say: Transboundary."], [93.7, 95.07, "Transboundary."], [95.82, 96.5, "Dam."], [97.52, 99.97, "Dam means a barrier built to hold back water."], [100.58, 103.88, "The dam generates power but alters the river's flow."], [104.48, 107.55, "Your turn. Say: Dam."], [110.4, 111.3, "Dam."], [112.05, 113.22, "Cooperation."], [114.22, 117.18, "Cooperation means working together toward a shared aim."], [117.78, 121.54, "Cooperation between upstream and downstream states is essential."], [122.15, 125.12, "Your turn. Say: Cooperation."], [127.97, 129.12, "Cooperation."], [129.88, 130.94, "Scarcity."], [131.95, 134.44, "Scarcity means a shortage of something needed."], [135.05, 137.91, "Seasonal scarcity strained the city's supply."], [138.52, 141.16, "Your turn. Say: Scarcity."], [144.0, 145.4, "Scarcity."], [146.15, 147.36, "Stakeholders."], [148.35, 151.74, "Stakeholders means people or groups with an interest in a decision."], [152.35, 155.43, "Stakeholders included farmers, fishers and cities."], [156.02, 158.89, "Your turn. Say: Stakeholders."], [161.73, 162.86, "Stakeholders."], [163.67, 167.27, "Part two: dialogue. Let's listen to a conversation."], [168.12, 173.06, "Visal, why do countries along the Mekong quarrel over dams? Water is water."], [174.15, 182.51, "The allocation of water between neighbouring countries is contested, because upstream decisions shape downstream livelihoods."], [183.62, 186.19, "Isn't more power from dams good for everyone?"], [187.28, 195.3, "The construction of upstream dams brings energy, but the reduction in seasonal flooding threatens fisheries and farmland downstream."], [196.38, 198.03, "How can this be resolved?"], [199.15, 207.58, "Through the negotiation of binding agreements and the inclusion of all stakeholders. The establishment of shared monitoring would build trust."], [208.73, 210.14, "Part three: grammar."], [210.98, 213.9, "Grammar focus: Complex noun phrases."], [214.2, 215.4, "Look at the pattern."], [216.08, 219.8, "The allocation of water between neighbouring countries is contested."], [220.72, 224.17, "The construction of upstream dams threatens downstream fisheries."], [225.08, 228.13, "The establishment of shared monitoring would build trust."], [229.07, 240.44, "Build dense noun phrases: the + nominalisation + of + noun (+ between / in + noun). The head noun (allocation) decides verb agreement: The allocation … is contested."], [241.18, 245.52, "Be careful! Don't say: The allocation water is contested."], [247.47, 250.09, "Say: The allocation of water is contested."], [250.39, 252.16, "allocation of + noun."], [252.97, 255.79, "Part four: reading. Read and listen."], [256.6, 258.24, "Rivers Without Borders."], [258.54, 264.1, "Water governance concerns the rules by which societies share a resource that cannot be replaced."], [265.1, 271.64, "The allocation of water between neighbouring countries is contested, particularly in river basins that cross several borders."], [272.63, 280.54, "The construction of upstream dams brings electricity and irrigation, but the reduction in seasonal flooding can threaten fisheries and farms downstream."], [281.53, 289.0, "Transboundary cooperation therefore depends on the exchange of data, the inclusion of all stakeholders and the creation of dispute mechanisms."], [290.0, 294.5, "Where scarcity grows, the temptation to act unilaterally also grows."], [295.6, 299.92, "Part five: quiz. Five questions. Are you ready?"], [300.75, 303.91, "The allocation of water between countries blank contested."], [304.21, 307.28, "A, is. B, are. C, being."], [310.83, 312.45, "The answer is A: is."], [313.58, 317.06, "The area drained by a river and its tributaries is a blank."], [317.36, 321.6, "A, river basin. B, dam. C, stakeholder."], [325.17, 327.47, "The answer is A: river basin."], [328.62, 330.99, "Crossing the borders between countries is blank."], [331.29, 335.31, "A, transboundary. B, scarce. C, local."], [338.87, 341.47, "The answer is A: transboundary."], [342.62, 344.5, "Which is a complex noun phrase?"], [344.8, 350.46, "A, Water is shared.. B, The construction of upstream dams. C, They build dams.."], [354.0, 357.22, "The answer is B: The construction of upstream dams."], [358.38, 362.44, "According to the reading, where scarcity grows, so does the temptation to…"], [362.74, 367.41, "A, cooperate. B, act unilaterally. C, build schools."], [370.97, 373.81, "The answer is B: act unilaterally."], [375.0, 378.06, "Part six: speaking. It's your turn to talk."], [378.92, 381.9, "Why is transboundary water cooperation difficult?"], [398.72, 400.24, "Now listen to Visal."], [400.54, 426.78, "Cooperation is difficult because the interests of upstream and downstream countries differ. Upstream states want energy and irrigation, whereas downstream states depend on steady seasonal flows. Trust is limited when data are not shared, and national sovereignty makes enforcement hard. Binding agreements and shared monitoring are therefore essential."], [427.08, 428.85, "Excellent answer, Visal!"], [429.75, 433.96, "Great work! Now you can use eight new words and complex noun phrases."], [434.26, 439.5, "Today's value is peaceful cooperation. Share resources through patience and dialogue."], [439.8, 442.76, "See you in Unit twenty-five. Goodbye!"], [443.06, 445.74, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C2B3-Unit25-Data-Governance": [[0.35, 4.76, "Hello, everyone! I'm Ms. Emma. Welcome to Online C two, Book three."], [5.06, 8.33, "Hi! I'm Visal. Let's learn together!"], [8.63, 15.96, "Unit twenty-five: Data Governance. Today you will reason about risk using if + were to (formal hypothesis)."], [16.26, 18.84, "Here is our lesson map. Let's start!"], [19.8, 23.13, "Part one: words. You will learn eight new words."], [23.98, 25.22, "Data governance."], [26.22, 30.61, "Data governance means the rules for how data is collected, stored and used."], [31.22, 34.46, "Data governance defines who may access patient records."], [35.05, 37.88, "Your turn. Say: Data governance."], [40.73, 42.01, "Data governance."], [42.75, 43.84, "Privacy."], [44.85, 48.34, "Privacy means the right to keep personal information protected."], [48.95, 51.25, "Privacy is a basic condition of freedom."], [51.85, 54.17, "Your turn. Say: Privacy."], [57.0, 57.94, "Privacy."], [58.68, 59.6, "Consent."], [60.62, 63.27, "Consent means voluntary and informed agreement."], [63.85, 67.31, "Consent must be clear, not buried in small print."], [67.92, 70.02, "Your turn. Say: Consent."], [72.87, 73.83, "Consent."], [74.58, 75.75, "Regulation."], [76.75, 79.6, "Regulation means official rules governing conduct."], [80.18, 83.0, "Regulation requires firms to report breaches."], [83.58, 86.09, "Your turn. Say: Regulation."], [88.93, 90.19, "Regulation."], [90.95, 91.95, "Ownership."], [92.95, 95.78, "Ownership means the legal right to control something."], [96.38, 98.84, "The ownership of personal data is disputed."], [99.45, 102.3, "Your turn. Say: Ownership."], [105.13, 106.05, "Ownership."], [106.82, 107.99, "Security."], [108.98, 112.39, "Security means protection against unauthorised access."], [112.98, 115.04, "Weak security allowed the breach."], [115.65, 118.24, "Your turn. Say: Security."], [121.1, 122.26, "Security."], [123.02, 124.39, "Accountability."], [125.38, 129.15, "Accountability means the obligation to answer for one's actions."], [129.75, 132.64, "Accountability means firms must report leaks."], [133.25, 136.05, "Your turn. Say: Accountability."], [138.9, 140.2, "Accountability."], [140.95, 141.72, "Trust."], [142.72, 146.37, "Trust means confidence in the reliability of a person or system."], [146.95, 149.5, "Trust is easy to lose and hard to rebuild."], [150.08, 152.31, "Your turn. Say: Trust."], [155.17, 155.94, "Trust."], [156.73, 160.34, "Part two: dialogue. Let's listen to a conversation."], [161.18, 167.05, "Visal, apps ask for my location, contacts and photos. What is the worst that could happen?"], [168.15, 175.86, "If data were to leak, trust would collapse, and individuals could be exposed to fraud or harassment."], [176.95, 178.62, "Would the company be punished?"], [179.72, 188.05, "Under strong regulation, yes. If a firm were to hide a breach, it would face heavy fines, and executives could be held accountable."], [189.15, 190.5, "And who owns the data?"], [191.58, 202.39, "That is disputed. If individuals were to own their data, they could demand payment or deletion, but firms would argue that processing creates value."], [203.53, 205.2, "Part three: grammar."], [206.05, 209.87, "Grammar focus: If plus were to (formal hypothesis)."], [210.17, 211.41, "Look at the pattern."], [212.12, 214.62, "If data were to leak, trust would collapse."], [215.52, 218.94, "If a firm were to hide a breach, it would face heavy fines."], [219.85, 223.44, "If individuals were to own their data, they could demand deletion."], [224.4, 235.8, "If + subject + were to + base verb imagines an unlikely or formal event: If data were to leak, trust would collapse. Use 'were' for all subjects; the result clause takes would/could."], [236.55, 240.44, "Be careful! Don't say: If data would leak, trust collapses."], [242.4, 245.24, "Say: If data were to leak, trust would collapse."], [245.53, 247.06, "If + were to … would."], [247.87, 250.31, "Part four: reading. Read and listen."], [251.1, 252.38, "Who Owns Your Data?."], [252.68, 257.83, "Digital services run on personal data, from our location to our habits and relationships."], [258.83, 265.88, "Data governance sets rules for collection, storage and use, and it rests on privacy, informed consent and accountability."], [266.87, 272.88, "If data were to leak, trust would collapse, and individuals might suffer fraud, discrimination or harassment."], [273.87, 279.56, "If regulators were to demand transparency and heavy penalties, firms would invest more in security."], [280.57, 286.94, "Whether data should be owned like property, or protected like a right, remains one of the central questions of the digital age."], [288.03, 292.05, "Part five: quiz. Five questions. Are you ready?"], [292.88, 295.55, "If data blank to leak, trust would collapse."], [295.85, 299.2, "A, were. B, was. C, is."], [302.73, 304.61, "The answer is A: were."], [305.75, 308.37, "Voluntary and informed agreement is blank."], [308.67, 312.54, "A, consent. B, ownership. C, security."], [316.1, 317.96, "The answer is A: consent."], [319.12, 322.03, "The obligation to answer for one's actions is blank."], [322.33, 326.1, "A, privacy. B, accountability. C, trust."], [329.67, 331.94, "The answer is B: accountability."], [333.08, 334.7, "Choose the correct sentence."], [335.0, 343.87, "A, If firms were to hide leaks, they would be fined.. B, If firms was to hide leaks, they will be fined.. C, If firms were hide leaks, they would fined.."], [347.4, 351.15, "The answer is A: If firms were to hide leaks, they would be fined.."], [352.32, 356.46, "According to the reading, strong penalties would make firms invest more in…"], [356.76, 361.53, "A, advertising. B, security. C, ownership."], [365.07, 367.0, "The answer is B: security."], [368.2, 371.36, "Part six: speaking. It's your turn to talk."], [372.22, 374.52, "Who should own the data people create online?"], [391.32, 392.78, "Now listen to Visal."], [393.08, 415.72, "I think individuals should have strong control over the data they create, even if companies hold it for specific services. People should know what is collected, be able to correct or delete it, and decide whether it can be shared. If firms were to own it outright, the incentive to protect privacy would weaken. Control and accountability protect trust."], [416.02, 417.69, "Excellent answer, Visal!"], [418.58, 423.75, "Great work! Now you can use eight new words and if plus were to (formal hypothesis)."], [424.06, 428.25, "Today's value is digital trust. Protect the trust that others place in you."], [428.55, 431.62, "See you in Unit twenty-six. Goodbye!"], [431.92, 434.89, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C2B3-Unit26-Migration-Policy": [[0.35, 4.97, "Hello, everyone! I'm Ms. Emma. Welcome to Online C two, Book three."], [5.27, 9.1, "Hi! I'm Visal. Let's learn together!"], [9.39, 16.18, "Unit twenty-six: Migration Policy. Today you will balance a debate using On the one hand... on the other."], [16.48, 19.11, "Here is our lesson map. Let's start!"], [20.07, 23.42, "Part one: words. You will learn eight new words."], [24.25, 25.33, "Migration."], [26.32, 30.27, "Migration means the movement of people from one place to another to live."], [30.88, 33.6, "Migration has shaped the economy of every region."], [34.22, 36.6, "Your turn. Say: Migration."], [39.47, 40.48, "Migration."], [41.22, 42.16, "Policy."], [43.15, 46.22, "Policy means a course of action adopted by a government."], [46.82, 50.49, "Migration policy must balance security and compassion."], [51.08, 53.42, "Your turn. Say: Policy."], [56.27, 57.16, "Policy."], [57.92, 58.73, "Labour."], [59.72, 62.31, "Labour means work, or workers as a group."], [62.92, 65.53, "Labour shortages drove demand for migrants."], [66.12, 68.41, "Your turn. Say: Labour."], [71.27, 72.04, "Labour."], [72.78, 73.83, "Refugee."], [74.82, 78.63, "Refugee means a person forced to flee their country because of danger."], [79.22, 81.88, "A refugee has the right to seek protection."], [82.48, 85.44, "Your turn. Say: Refugee."], [88.3, 89.38, "Refugee."], [90.12, 91.22, "Integration."], [92.22, 96.46, "Integration means the process by which newcomers become part of society."], [97.05, 100.08, "Integration depends on language, work and welcome."], [100.68, 103.39, "Your turn. Say: Integration."], [106.23, 107.2, "Integration."], [107.95, 109.11, "Remittances."], [110.12, 113.09, "Remittances means money sent home by migrant workers."], [113.68, 116.07, "Remittances support millions of families."], [116.65, 119.74, "Your turn. Say: Remittances."], [122.6, 123.86, "Remittances."], [124.62, 125.63, "Rights."], [126.62, 129.65, "Rights means entitlements that others must respect."], [130.25, 133.32, "Migrant workers must be guaranteed basic rights."], [133.92, 136.58, "Your turn. Say: Rights."], [139.43, 140.48, "Rights."], [141.22, 142.02, "Border."], [143.02, 145.72, "Border means the line separating two countries."], [146.32, 148.15, "The border was closed overnight."], [148.75, 151.36, "Your turn. Say: Border."], [154.2, 155.16, "Border."], [155.97, 159.7, "Part two: dialogue. Let's listen to a conversation."], [160.55, 165.81, "Visal, my aunt works abroad and sends money every month. Is migration good or bad?"], [166.92, 175.26, "It depends whom you ask. On the one hand, migration fills labour gaps and remittances support families."], [176.35, 177.59, "And the other side?"], [178.68, 187.01, "On the other hand, it raises integration challenges and can drain skilled workers from poorer countries."], [188.12, 190.02, "So what should policy do?"], [191.12, 202.95, "On the one hand, protect workers' rights; on the other, manage borders fairly. A balanced approach avoids both open-door slogans and blanket bans."], [204.1, 205.53, "Part three: grammar."], [206.38, 210.16, "Grammar focus: Balanced argument structures (On the one hand)."], [210.46, 211.72, "Look at the pattern."], [212.42, 218.14, "On the one hand, migration fills labour gaps; on the other, it raises integration challenges."], [219.05, 224.28, "On the one hand, remittances help families; on the other hand, talent leaves poorer countries."], [225.18, 228.74, "A balanced policy protects rights while managing borders fairly."], [229.7, 240.24, "On the one hand … on the other (hand) presents two sides. Keep both parts parallel. Use 'however' or 'yet' only for a stronger contrast; use 'on the other hand' to complete the pair."], [240.98, 245.82, "Be careful! Don't say: On one hand migration helps, other raises."], [247.77, 252.24, "Say: On the one hand it helps; on the other, it raises costs."], [252.54, 254.2, "On the one hand… on the other."], [255.0, 257.83, "Part four: reading. Read and listen."], [258.63, 260.03, "Two Sides of Movement."], [260.33, 263.69, "Few topics divide public opinion as sharply as migration."], [264.7, 271.4, "On the one hand, migrants fill labour gaps, pay taxes and send remittances that sustain families and national economies."], [272.4, 278.58, "On the other hand, rapid arrivals can strain housing and schools, and poorer countries may lose skilled workers."], [279.57, 286.47, "Refugees raise distinct obligations, since international law requires states to protect those who flee persecution."], [287.47, 295.69, "Effective policy therefore balances the protection of rights with the orderly management of borders, rather than choosing one at the expense of the other."], [296.8, 300.79, "Part five: quiz. Five questions. Are you ready?"], [301.65, 306.57, "On the one hand, migrants fill gaps; blank the other, integration is hard."], [306.88, 309.46, "A, on. B, in. C, at."], [313.0, 315.12, "The answer is A: on."], [316.25, 318.85, "Money sent home by migrant workers is blank."], [319.15, 322.69, "A, remittances. B, rights. C, labour."], [326.23, 328.72, "The answer is A: remittances."], [329.88, 332.31, "A person forced to flee danger is a blank."], [332.61, 336.46, "A, refugee. B, labourer. C, citizen."], [340.0, 342.16, "The answer is A: refugee."], [343.32, 345.17, "Choose the correct sentence."], [345.47, 356.06, "A, On the one hand it helps; on the other it costs.. B, On one hand it helps; on one other it costs.. C, On the one hand it helps; on the other hand costs it.."], [359.6, 363.76, "The answer is A: On the one hand it helps; on the other it costs.."], [364.92, 369.24, "According to the reading, effective policy balances rights protection with…"], [369.54, 375.47, "A, closing all borders. B, orderly border management. C, ignoring refugees."], [379.03, 381.74, "The answer is B: orderly border management."], [382.93, 385.93, "Part six: speaking. It's your turn to talk."], [386.78, 389.49, "How do remittances affect families and economies?"], [406.28, 407.68, "Now listen to Visal."], [407.98, 434.05, "Remittances have large effects. For families, money from relatives abroad pays for food, schooling and health care. For economies, it provides foreign currency and supports local businesses. On the other hand, dependence on remittances can discourage local job creation, and families may be separated for years. The benefit is real, but so is the social cost."], [434.35, 436.09, "Excellent answer, Visal!"], [436.98, 442.27, "Great work! Now you can use eight new words and balanced argument structures (on the one hand)."], [442.57, 448.26, "Today's value is human dignity. Every person deserves respect wherever they are."], [448.56, 451.38, "See you in Unit twenty-seven. Goodbye!"], [451.68, 454.19, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C2B3-Unit27-Education-Policy": [[0.35, 4.98, "Hello, everyone! I'm Ms. Emma. Welcome to Online C two, Book three."], [5.28, 9.0, "Hi! I'm Visal. Let's learn together!"], [9.3, 16.47, "Unit twenty-seven: Education Policy. Today you will urge reform using it is high time + past."], [16.77, 19.45, "Here is our lesson map. Let's start!"], [20.4, 23.6, "Part one: words. You will learn eight new words."], [24.45, 26.05, "Education policy."], [27.05, 32.01, "Education policy means government decisions on how schools and learning are organised."], [32.62, 36.53, "Education policy shapes opportunities for a generation."], [37.12, 40.58, "Your turn. Say: Education policy."], [43.43, 45.28, "Education policy."], [46.02, 47.05, "Access."], [48.05, 51.18, "Access means the ability to reach or use a service."], [51.78, 55.29, "Access to schools remains uneven in rural areas."], [55.88, 58.64, "Your turn. Say: Access."], [61.5, 62.58, "Access."], [63.32, 64.26, "Quality."], [65.25, 68.4, "Quality means the standard of how good something is."], [68.98, 71.95, "Quality, not only enrolment, determines learning."], [72.55, 74.96, "Your turn. Say: Quality."], [77.8, 78.66, "Quality."], [79.42, 80.35, "Teachers."], [81.35, 84.42, "Teachers means professionals who instruct students."], [85.02, 87.61, "Teachers are the most important school resource."], [88.22, 91.12, "Your turn. Say: Teachers."], [93.97, 94.86, "Teachers."], [95.62, 96.71, "Curriculum."], [97.72, 100.48, "Curriculum means the subjects and content taught."], [101.08, 103.73, "The curriculum now includes digital skills."], [104.32, 106.88, "Your turn. Say: Curriculum."], [109.73, 110.73, "Curriculum."], [111.48, 112.46, "Equity."], [113.45, 117.02, "Equity means fairness in the distribution of opportunities."], [117.62, 120.77, "Equity means extra support for those who start behind."], [121.35, 124.11, "Your turn. Say: Equity."], [126.97, 127.88, "Equity."], [128.62, 129.62, "Assessment."], [130.62, 133.81, "Assessment means the evaluation of what students have learned."], [134.42, 137.81, "Assessment should reward understanding, not memorisation."], [138.42, 141.23, "Your turn. Say: Assessment."], [144.07, 145.22, "Assessment."], [145.98, 147.17, "Outcomes."], [148.18, 152.67, "Outcomes means the results of an education, such as skills and employment."], [153.28, 155.76, "Learning outcomes improved after the reform."], [156.35, 158.97, "Your turn. Say: Outcomes."], [161.83, 163.03, "Outcomes."], [163.83, 167.55, "Part two: dialogue. Let's listen to a conversation."], [168.42, 173.46, "Visal, my teacher has a second job because her salary is so low. Is that normal?"], [174.55, 180.99, "Sadly it is common. It is high time teachers were paid more, since quality depends on them."], [182.08, 183.68, "What else needs changing?"], [184.78, 194.94, "It is high time assessment rewarded understanding, not memorisation, and it is high time rural schools were given equal resources."], [196.05, 197.37, "Why hasn't it happened?"], [198.45, 207.31, "Reform is costly and slow. But it is about time we treated education as an investment, not an expense."], [208.47, 210.04, "Part three: grammar."], [210.88, 213.95, "Grammar focus: It is high time plus past."], [214.25, 215.44, "Look at the pattern."], [216.15, 218.51, "It is high time teachers were paid more."], [219.42, 222.39, "It is high time assessment rewarded understanding."], [223.28, 226.66, "It is about time rural schools were given equal resources."], [227.6, 238.23, "It is (high / about) time + subject + PAST simple expresses urgency about the present: It is high time teachers were paid more (not 'are paid'). The past tense signals that the action is overdue."], [238.98, 243.18, "Be careful! Don't say: It is high time teachers are paid more."], [245.13, 247.85, "Say: It is high time teachers were paid more."], [248.15, 250.26, "high time + past tense."], [251.07, 253.6, "Part four: reading. Read and listen."], [254.4, 255.88, "Overdue Reforms."], [256.18, 262.22, "Education systems around the world have expanded access, but quality and equity often lag behind."], [263.23, 270.58, "Research consistently shows that teachers matter more than any other school resource, yet they are frequently underpaid and undertrained."], [271.6, 276.67, "It is high time teachers were paid more and that assessment rewarded understanding, not memorisation."], [277.67, 284.65, "Rural and poorer schools also need equal resources, so that a child's birthplace no longer decides learning outcomes."], [285.63, 291.59, "Education policy must be treated as long-term investment rather than short-term expense."], [292.7, 296.75, "Part five: quiz. Five questions. Are you ready?"], [297.58, 300.06, "It is high time teachers blank paid more."], [300.36, 303.4, "A, were. B, are. C, will be."], [306.93, 308.89, "The answer is A: were."], [310.05, 312.83, "The evaluation of what students have learned is blank."], [313.13, 317.12, "A, assessment. B, curriculum. C, access."], [320.67, 322.85, "The answer is A: assessment."], [324.02, 327.01, "Fairness in the distribution of opportunities is blank."], [327.31, 330.98, "A, quality. B, equity. C, outcomes."], [334.53, 336.53, "The answer is B: equity."], [337.68, 339.51, "Choose the correct sentence."], [339.81, 347.5, "A, It is high time we changed the system.. B, It is high time we change the system.. C, It is high time we will change the system.."], [351.07, 354.39, "The answer is A: It is high time we changed the system.."], [355.55, 359.28, "According to the reading, teachers matter more than any other school…"], [359.58, 363.02, "A, resource. B, rule. C, subject."], [366.57, 368.82, "The answer is A: resource."], [370.03, 373.22, "Part six: speaking. It's your turn to talk."], [374.08, 377.44, "What single change would most improve education where you live?"], [394.25, 395.81, "Now listen to Visal."], [396.11, 419.7, "The single most useful change would be to raise teacher quality and pay. It is high time teachers were treated as professionals, with good training, fair salaries and time to plan lessons. Better teachers improve every other part of the system, from curriculum to assessment. Buildings and technology help, but they cannot replace a skilled teacher."], [420.0, 421.8, "Excellent answer, Visal!"], [422.72, 427.21, "Great work! Now you can use eight new words and it is high time plus past."], [427.51, 432.8, "Today's value is educational equity. Every learner deserves a fair chance to succeed."], [433.1, 435.92, "See you in Unit twenty-eight. Goodbye!"], [436.22, 440.22, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C2B3-Unit28-The-Circular-Economy": [[0.35, 4.86, "Hello, everyone! I'm Ms. Emma. Welcome to Online C two, Book three."], [5.16, 8.71, "Hi! I'm Visal. Let's learn together!"], [9.01, 16.38, "Unit twenty-eight: The Circular Economy. Today you will describe change using replacing X with Y structures."], [16.68, 19.41, "Here is our lesson map. Let's start!"], [20.37, 23.63, "Part one: words. You will learn eight new words."], [24.48, 25.86, "Circular economy."], [26.85, 31.81, "Circular economy means an economic model that keeps materials in use as long as possible."], [32.42, 35.53, "A circular economy designs waste out of the system."], [36.12, 39.3, "Your turn. Say: Circular economy."], [42.17, 43.95, "Circular economy."], [44.68, 45.62, "Reuse."], [46.62, 50.44, "Reuse means using an item again for the same or another purpose."], [51.05, 53.76, "Reuse of containers cut packaging costs."], [54.35, 56.61, "Your turn. Say: Reuse."], [59.47, 60.63, "Reuse."], [61.38, 62.43, "Recycling."], [63.42, 66.42, "Recycling means turning waste into new materials."], [67.02, 70.12, "Recycling saves energy compared with new production."], [70.72, 73.52, "Your turn. Say: Recycling."], [76.37, 77.53, "Recycling."], [78.28, 79.11, "Waste."], [80.12, 83.21, "Waste means material that is discarded as useless."], [83.82, 87.15, "Waste is a design failure, not an inevitability."], [87.75, 90.4, "Your turn. Say: Waste."], [93.27, 94.27, "Waste."], [95.02, 95.85, "Design."], [96.85, 100.28, "Design means the planning of how a product is made and used."], [100.88, 102.81, "Good design makes repair easy."], [103.42, 105.65, "Your turn. Say: Design."], [108.5, 109.29, "Design."], [110.05, 111.07, "Resources."], [112.08, 116.03, "Resources means materials, energy and labour available for use."], [116.65, 119.29, "Finite resources require careful use."], [119.88, 122.59, "Your turn. Say: Resources."], [125.43, 126.71, "Resources."], [127.45, 128.96, "Product lifecycle."], [129.95, 133.83, "Product lifecycle means the stages of a product from design to disposal."], [134.42, 138.65, "A product lifecycle includes manufacture, use and recovery."], [139.25, 142.28, "Your turn. Say: Product lifecycle."], [145.13, 146.72, "Product lifecycle."], [147.45, 148.25, "Linear."], [149.25, 152.04, "Linear means following a take-make-dispose path."], [152.65, 155.4, "A linear economy turns resources into waste."], [156.02, 158.68, "Your turn. Say: Linear."], [161.53, 162.38, "Linear."], [163.2, 166.66, "Part two: dialogue. Let's listen to a conversation."], [167.52, 172.2, "Visal, my phone broke after two years and I just threw it away. Is that normal?"], [173.32, 180.72, "In a linear economy, yes: take, make, dispose. The circular model replaces waste with reuse."], [181.82, 183.07, "How would that look?"], [184.18, 193.97, "Designers replace single-use packaging with refillable containers, and manufacturers replace glued parts with repairable ones."], [195.08, 196.51, "Does it actually work?"], [197.62, 208.93, "It can. Firms that replace disposal with take-back schemes recover valuable materials, and cities that replace landfill with recycling save money."], [210.07, 211.69, "Part three: grammar."], [212.55, 215.71, "Grammar focus: Replacing X with Y structures."], [216.01, 217.3, "Look at the pattern."], [218.02, 220.16, "The model replaces waste with reuse."], [221.05, 225.07, "Designers replace single-use packaging with refillable containers."], [225.98, 228.82, "Cities replace landfill with recycling to save money."], [229.77, 240.66, "replace X with Y (not 'replace X to Y'): X is removed, Y is introduced. Passive: Waste is replaced with reuse. Alternative: substitute Y for X."], [241.42, 245.37, "Be careful! Don't say: The model replaces waste to reuse."], [247.33, 249.91, "Say: The model replaces waste with reuse."], [250.21, 251.96, "replace X with Y."], [252.77, 255.2, "Part four: reading. Read and listen."], [256.0, 257.12, "Closing the Loop."], [257.42, 264.29, "A linear economy takes resources, makes products and disposes of them, which wastes materials and creates pollution."], [265.3, 272.26, "The circular economy aims to keep materials in use by design, so the model replaces waste with reuse, repair and recycling."], [273.27, 281.16, "Designers replace single-use packaging with refillable containers, and manufacturers replace glued components with parts that can be repaired."], [282.17, 287.37, "Across the product lifecycle, firms recover valuable resources instead of buying new ones."], [288.37, 293.42, "Critics note that recycling alone is not enough, so reducing consumption remains essential."], [294.53, 298.57, "Part five: quiz. Five questions. Are you ready?"], [299.42, 301.89, "The model replaces waste blank reuse."], [302.19, 305.49, "A, with. B, to. C, by of."], [309.03, 310.5, "The answer is A: with."], [311.65, 315.15, "An economy that follows take-make-dispose is blank."], [315.45, 319.17, "A, circular. B, linear. C, recycled."], [322.73, 324.83, "The answer is B: linear."], [325.98, 327.88, "Using an item again is blank."], [328.18, 331.93, "A, waste. B, design. C, reuse."], [335.47, 337.43, "The answer is C: reuse."], [338.58, 340.29, "Choose the correct sentence."], [340.59, 347.98, "A, They replace plastic with glass.. B, They replace plastic to glass.. C, They replace with plastic glass.."], [351.53, 354.56, "The answer is A: They replace plastic with glass.."], [355.72, 359.83, "According to the reading, recycling alone is not enough, so reducing…"], [360.13, 365.63, "A, consumption remains essential. B, design is useless. C, reuse is wrong."], [369.17, 372.41, "The answer is A: consumption remains essential."], [373.6, 376.74, "Part six: speaking. It's your turn to talk."], [377.58, 381.06, "How could your community adopt circular economy ideas?"], [397.85, 399.38, "Now listen to Visal."], [399.69, 422.46, "Our community could replace single-use plastic bags with reusable ones, set up repair workshops and organise a collection point for old electronics and clothes. Markets could accept refillable containers, and compost could replace burning of organic waste. Small steps like these keep materials in use and save money."], [422.76, 424.41, "Excellent answer, Visal!"], [425.32, 429.85, "Great work! Now you can use eight new words and replacing x with y structures."], [430.15, 434.71, "Today's value is resourcefulness. Make more from less and waste nothing."], [435.01, 437.77, "See you in Unit twenty-nine. Goodbye!"], [438.07, 441.34, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-C2B3-Unit29-Review-Evidence-Based-Policy": [[0.35, 5.35, "Hello, everyone! I'm Ms. Emma. Welcome to Online C two, Book three."], [5.65, 9.13, "Hi! I'm Visal. Let's learn together!"], [9.43, 18.01, "Unit twenty-nine: Review: Evidence-Based Policy. Today you will argue about evidence using nominal clauses with the fact that."], [18.31, 21.11, "Here is our lesson map. Let's start!"], [22.07, 25.3, "Part one: words. You will learn eight new words."], [26.15, 27.12, "Evidence."], [28.12, 31.41, "Evidence means facts or data that support a conclusion."], [32.02, 34.7, "The evidence supported a change in policy."], [35.32, 37.48, "Your turn. Say: Evidence."], [40.33, 41.44, "Evidence."], [42.18, 43.07, "Policy."], [44.08, 47.36, "Policy means a course of action adopted by a government."], [47.95, 50.23, "Policy should respond to what works."], [50.82, 53.52, "Your turn. Say: Policy."], [56.37, 57.3, "Policy."], [58.05, 59.27, "Evaluation."], [60.28, 64.09, "Evaluation means a systematic assessment of whether something works."], [64.68, 67.61, "Evaluation showed the programme raised attendance."], [68.22, 71.15, "Your turn. Say: Evaluation."], [74.0, 75.16, "Evaluation."], [75.92, 76.67, "Data."], [77.68, 80.29, "Data means recorded facts and figures."], [80.88, 82.93, "The data revealed a clear pattern."], [83.52, 85.97, "Your turn. Say: Data."], [88.83, 89.75, "Data."], [90.52, 91.85, "Trade-off."], [92.85, 97.29, "Trade-off means a balance in which gaining one thing means losing another."], [97.88, 100.49, "Every policy involves a trade-off."], [101.08, 104.32, "Your turn. Say: Trade-off."], [107.17, 108.48, "Trade-off."], [109.22, 110.39, "Stakeholders."], [111.38, 114.88, "Stakeholders means people or groups with an interest in a decision."], [115.48, 117.94, "Stakeholders must be consulted early."], [118.55, 121.23, "Your turn. Say: Stakeholders."], [124.07, 125.14, "Stakeholders."], [125.88, 127.17, "Implementation."], [128.18, 131.75, "Implementation means the process of putting a plan into practice."], [132.35, 135.07, "Weak implementation undermined a good design."], [135.68, 138.47, "Your turn. Say: Implementation."], [141.33, 142.75, "Implementation."], [143.52, 144.46, "Impact."], [145.45, 148.38, "Impact means the effect of an action or policy."], [148.98, 152.21, "The impact of the programme was measured after two years."], [152.82, 155.21, "Your turn. Say: Impact."], [158.07, 158.91, "Impact."], [159.7, 163.41, "Part two: dialogue. Let's listen to a conversation."], [164.25, 169.06, "Visal, the study proved the programme worked, yet the ministry cancelled it. Why?"], [170.15, 178.56, "The fact that evidence exists does not guarantee its use. Politics, cost and opinion all intervene."], [179.65, 181.45, "But isn't evidence decisive?"], [182.55, 192.16, "Not alone. The fact that a policy works does not mean that stakeholders will support it, and the fact that data are imperfect gives critics an excuse."], [193.25, 195.19, "So what should researchers do?"], [196.28, 206.19, "Present findings clearly and acknowledge trade-offs. The fact that implementation matters as much as design should shape every evaluation."], [207.33, 209.03, "Part three: grammar."], [209.88, 213.28, "Grammar focus: Nominal clauses with the fact that."], [213.58, 214.76, "Look at the pattern."], [215.45, 218.77, "The fact that evidence exists does not guarantee its use."], [219.68, 223.2, "The fact that a policy works does not ensure public support."], [224.12, 227.96, "The fact that implementation matters should shape every evaluation."], [228.9, 240.25, "The fact that + full clause acts as a noun phrase: subject or object. It treats the clause as a settled fact. The verb after it agrees with 'fact' (singular): The fact that … does not guarantee."], [241.02, 245.09, "Be careful! Don't say: The fact evidence exists is enough."], [247.03, 250.61, "Say: The fact that evidence exists is not enough."], [250.91, 252.6, "the fact that + clause."], [253.4, 256.05, "Part four: reading. Read and listen."], [256.87, 259.06, "When Evidence Meets Politics."], [259.36, 264.64, "Evidence-based policy asks that decisions be guided by rigorous evaluation of what works."], [265.63, 271.32, "Randomised trials and careful data analysis can reveal the impact of a programme with surprising clarity."], [272.33, 279.72, "Yet the fact that evidence exists does not guarantee its use, because policymakers weigh cost, public opinion and competing interests."], [280.73, 286.09, "The fact that most policies involve trade-offs means that evidence informs choices rather than making them."], [287.1, 293.08, "Good implementation and honest communication with stakeholders are therefore as important as the original analysis."], [294.17, 298.14, "Part five: quiz. Five questions. Are you ready?"], [298.98, 302.67, "The fact blank evidence exists does not guarantee its use."], [302.97, 305.71, "A, that. B, which. C, what."], [309.27, 310.86, "The answer is A: that."], [312.02, 315.35, "A systematic assessment of whether something works is an blank."], [315.65, 320.11, "A, evaluation. B, impact only. C, implementation."], [323.67, 325.85, "The answer is A: evaluation."], [327.02, 330.87, "A balance in which gaining one thing means losing another is a blank."], [331.17, 335.58, "A, data. B, trade-off. C, policy."], [339.13, 342.07, "The answer is B: trade-off."], [343.22, 345.02, "Choose the correct sentence."], [345.32, 352.85, "A, The fact that it works is encouraging.. B, The fact it that works is encouraging.. C, The fact that it work are encouraging.."], [356.4, 359.63, "The answer is A: The fact that it works is encouraging.."], [360.78, 364.19, "According to the reading, evidence informs choices rather than…"], [364.49, 368.08, "A, making them. B, existing. C, improving."], [371.63, 373.61, "The answer is A: making them."], [374.8, 378.21, "Part six: speaking. It's your turn to talk."], [379.05, 382.08, "Why is evidence sometimes ignored in policymaking?"], [398.88, 400.41, "Now listen to Visal."], [400.71, 427.8, "Evidence is sometimes ignored because decisions involve more than facts: cost, public opinion, timing and the interests of powerful groups all matter. The fact that a policy works does not mean that voters will like it. Evidence can also be uncertain or arrive too late. Researchers can help by presenting findings clearly and acknowledging trade-offs."], [428.1, 429.74, "Excellent answer, Visal!"], [430.65, 435.39, "Great work! Now you can use eight new words and nominal clauses with the fact that."], [435.69, 441.21, "Today's value is intellectual honesty. Follow the evidence, even when it is inconvenient."], [441.51, 448.24, "Congratulations! You have finished Online C two, Book three. See you in Online C two, Book four!"], [448.54, 451.55, "Thank you, Ms. Emma! Bye, everyone!"]]};

                <p id="video-msg" class="text-sm text-gray-500 mt-3 text-center min-h-[1.25rem]">▶️ Press play to start the lesson!</p>
                <div class="text-center mt-2 flex justify-center gap-3 flex-wrap"><button id="subs-btn" class="bg-white border border-indigo-300 text-indigo-700 font-bold px-4 py-2 rounded-full shadow cursor-pointer">💬 Subtitles: ON</button><button onclick="nextLesson()" class="bg-emerald-700 hover:bg-emerald-800 text-white font-bold px-4 py-2 rounded-full shadow cursor-pointer">Next Lesson ▶️</button></div>`;
            const el = document.getElementById('mp4-player');
