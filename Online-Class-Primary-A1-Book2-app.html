        // ===== 5. WRITING PRACTICE =====
        // Unit words are now matched as whole words ("art" no longer counts inside "start")
        function usedUnitWords(text, unitData) {
            const t = ' ' + String(text).toLowerCase().replace(/[^a-z0-9'’\- ]+/g, ' ').replace(/\s+/g, ' ') + ' ';
            return unitData.vocab.filter(w => {
                const base = w.toLowerCase().replace(/[^a-z0-9'’\- ]+/g, ' ').trim();
                if (!base) return false;
                // whole word, allowing simple endings: s, es, ed, ing
                const re = new RegExp('[ ]' + base.replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace(/ /g, '[ ]') + '(s|es|ed|d|ing)?[ ]');
                return re.test(t);
            });
        }
        function renderWriting(contentDiv, unitData) {
            contentDiv.innerHTML = `
                <h2 class="text-xl font-bold text-blue-900 mb-2">✍️ Writing Practice</h2>
                <p class="text-gray-600 mb-4">Use at least 3 of this unit's words to write a short paragraph (2-4 sentences).</p>
                <div class="bg-emerald-50 border-2 border-dashed border-emerald-300 rounded-2xl p-6">
                    <div class="flex flex-wrap gap-2 mb-4">
                        ${unitData.vocab.map(w => `<span class="bg-white px-3 py-1 rounded-full text-sm font-semibold text-emerald-800 border border-emerald-200">${w}</span>`).join('')}
                    </div>
                    <textarea id="writing-answer" rows="5" placeholder="Write your paragraph here..." class="w-full p-3 border border-gray-300 rounded-lg text-sm"></textarea>
                    <button onclick="checkWritingAnswer()" class="mt-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-5 py-2 rounded-xl shadow cursor-pointer text-sm">Check My Writing</button>
                    <p id="writing-msg" class="text-sm mt-2 font-semibold min-h-[1.25rem]"></p>
                </div>`;
        }
        function checkWritingAnswer() {
            const unitData = curriculum[state.level][state.unit];
            const val = document.getElementById('writing-answer').value.trim();
            const msg = document.getElementById('writing-msg');
            if (!val) { msg.className = "text-sm mt-2 font-semibold text-red-500"; msg.textContent = "✏️ Write your paragraph first!"; return; }
            const used = usedUnitWords(val, unitData);
            const need = Math.max(minWords() * 2, 10);
            if (used.length < 3) {
                msg.className = "text-sm mt-2 font-semibold text-amber-600";
                msg.textContent = `✏️ Good try! Use a few more unit words (found ${used.length} of 3: ${used.join(', ') || 'none yet'}).`;
                return;
            }
            if (countWords(val) < need) {
                msg.className = "text-sm mt-2 font-semibold text-amber-600";
                msg.textContent = `✏️ Great words! Now write a little more — at least ${need} words.`;
                return;
            }
            msg.className = "text-sm mt-2 font-semibold text-green-600";
            msg.textContent = `🎉 Excellent writing! You used ${used.length} unit words.` + starNote(award(unitKey('writing'), 4), 4);
        }

        // ===== 6. QUIZ (listen and choose) =====
        // Answers lock after the first tap, and stars are given only for beating your best score
        let quizState = { qIndex: 0, score: 0, order: [], currentOptions: [], currentAnswer: '', locked: false };
        function renderQuiz(contentDiv, unitData) {
            quizState = { qIndex: 0, score: 0, order: shuffle([...new Set(unitData.vocab)]), currentOptions: [], currentAnswer: '', locked: false };
            showQuizQuestion();
        }
        function showQuizQuestion() {
            const contentDiv = document.getElementById('module-content');
            const unitData = curriculum[state.level][state.unit];
            quizState.locked = false;
            if (quizState.qIndex >= quizState.order.length) {
                const total = quizState.order.length;
                const pct = Math.round((quizState.score / total) * 100);
                const bestKey = state.level + '|' + unitKey('quiz');
                const best = progress.best[bestKey] || 0;
                const earned = Math.max(0, quizState.score - best) * 2;
                if (quizState.score > best) progress.best[bestKey] = quizState.score;
                if (earned > 0) addStars(earned); else saveProgress();
                if (pct === 100) triggerConfetti();
                contentDiv.innerHTML = `
                    <h2 class="text-xl font-bold text-blue-900 mb-2">🧩 Quiz Complete!</h2>
                    <div class="bg-purple-50 p-8 rounded-2xl border border-purple-200 text-center">
                        <div class="text-5xl mb-3">${pct === 100 ? '🏆' : pct >= 50 ? '🎉' : '💪'}</div>
                        <p class="font-bold text-purple-900 text-2xl mb-2">${quizState.score} / ${total} Correct</p>
                        <p class="text-gray-600 mb-4">${earned > 0 ? `You earned ${earned} ⭐` : (best >= total ? 'Perfect score already! 🌟' : `Your best is ${Math.max(best, quizState.score)} / ${total} — beat it to earn more ⭐`)}</p>
                        <button onclick="renderQuiz(document.getElementById('module-content'), curriculum[state.level][state.unit])" class="bg-purple-700 hover:bg-purple-800 text-white font-bold px-5 py-2 rounded-xl shadow cursor-pointer">🔁 Try Again</button>
                    </div>`;

            const word = quizState.order[quizState.qIndex];

            contentDiv.innerHTML = `

                <p class="text-sm text-gray-500 mb-3">Question ${quizState.qIndex + 1} of ${quizState.order.length}</p>
                <div class="bg-purple-50 p-6 rounded-2xl border border-purple-200">
                    <p class="font-bold text-purple-900 mb-2">🔊 Listen and choose the word you heard:</p>

                    <div class="flex flex-col gap-2" id="quiz-options">
                        ${options.map((o, i) => `<button onclick="answerQuiz('${escapeJsStr(o)}')" class="bg-white p-3 rounded-xl shadow hover:bg-purple-100 text-left font-medium cursor-pointer">${String.fromCharCode(65 + i)}) ${o}</button>`).join('')}
                    </div>
                    <p id="quiz-ans" class="mt-4 font-bold text-lg min-h-[1.5rem]"></p>
                </div>`;
            speak(word);
        }
        function answerQuiz(chosen) {
            if (quizState.locked) return;
            quizState.locked = true;
            document.querySelectorAll('#quiz-options button').forEach(b => b.disabled = true);
            let el = document.getElementById('quiz-ans');
            if (chosen === quizState.currentAnswer) {
                el.innerHTML = "🎉 Correct! Well done!";

        // ===== 7. VOCABULARY GAME (picture -> word) =====
        // Wrong choices never share the picture of the right answer, so exactly one choice fits
        let vocabGameState = { qIndex: 0, score: 0, questions: [], locked: false };
        function buildVocabGameQuestions(unitData) {
            return shuffle([...new Set(unitData.vocab)]).map(correct => ({
                correct, options: shuffle([correct, ...pictureDistractors(correct, unitData.vocab, unitData, 3)])
            }));
        }
        function renderVocabGame(contentDiv, unitData) {
            vocabGameState = { qIndex: 0, score: 0, questions: buildVocabGameQuestions(unitData), locked: false };
            contentDiv.innerHTML = `<h2 class="text-xl font-bold text-blue-800 mb-2">🎮 Vocabulary Game</h2>
                <p class="text-gray-600 mb-4">Look at the picture, then tap the matching word!</p>
                <div id="vocabgame-area"></div>`;
            showVocabGameQuestion();
        }
        function showVocabGameQuestion() {
            const area = document.getElementById('vocabgame-area');
            if (!area) return;
            vocabGameState.locked = false;
            if (vocabGameState.qIndex >= vocabGameState.questions.length) {
                area.innerHTML = `<div class="bg-green-50 border-2 border-green-300 rounded-2xl p-8 text-center">
                    <p class="text-2xl font-bold text-green-700 mb-2">🎉 Great Job!</p>
                    <p class="text-lg text-gray-700">You scored ${vocabGameState.score} / ${vocabGameState.questions.length}</p>
                    <button onclick="renderVocabGame(document.getElementById('module-content'), curriculum[state.level][state.unit])" class="mt-4 bg-blue-600 hover:bg-blue-700 text-white font-bold px-6 py-2 rounded-full shadow cursor-pointer">🔁 Play Again</button>
                </div>`;
                return;
            }
            const q = vocabGameState.questions[vocabGameState.qIndex];
            area.innerHTML = `
                <div class="bg-blue-50 border-2 border-dashed border-blue-300 rounded-2xl p-8 text-center">
                    <p class="text-sm text-gray-500 mb-2">Question ${vocabGameState.qIndex + 1} of ${vocabGameState.questions.length}</p>
                    <div class="text-7xl mb-5">${emojiFor(q.correct)}</div>
                    <div class="grid grid-cols-2 gap-3" id="vocabgame-options">
                        ${q.options.map(o => `<button onclick="answerVocabGame('${escapeJsStr(o)}')" class="bg-white hover:bg-blue-100 p-4 rounded-xl shadow font-bold text-blue-800 cursor-pointer">${o}</button>`).join('')}
                    </div>
                    <p id="vocabgame-fb" class="mt-4 font-bold min-h-[1.5rem]"></p>
                </div>`;
        }
        function answerVocabGame(chosen) {
            if (vocabGameState.locked) return;
            vocabGameState.locked = true;
            document.querySelectorAll('#vocabgame-options button').forEach(b => b.disabled = true);
            const q = vocabGameState.questions[vocabGameState.qIndex];

                vocabGameState.score++;
            } else {
                fb.className = 'mt-4 font-bold min-h-[1.5rem] text-red-500';
                fb.textContent = `❌ It was "${q.correct}"`;

        // ===== 8. SPELLING PRACTICE (tap scrambled letters in order) =====
        let spellState = { word: '', picked: [], letters: [], wIndex: 0, words: [], done: false };
        function renderSpelling(contentDiv, unitData) {
            spellState.words = shuffle([...new Set(unitData.vocab)].filter(w => /^[A-Za-z ]+$/.test(w)));
            spellState.wIndex = 0;
            contentDiv.innerHTML = `<h2 class="text-xl font-bold text-blue-800 mb-2">✏️ Spelling Practice</h2>
                <p class="text-gray-600 mb-4">Look at the picture, then tap the letters in the right order to spell the word!</p>
                <div id="spelling-area"></div>`;
            showSpellingWord();
        }
        function showSpellingWord() {
            const area = document.getElementById('spelling-area');
            if (!area) return;
            if (spellState.wIndex >= spellState.words.length) {
                area.innerHTML = `<div class="bg-green-50 border-2 border-green-300 rounded-2xl p-8 text-center">
                    <p class="text-2xl font-bold text-green-700">🎉 All words spelled! Great work!</p>
                </div>`;
                return;
            }
            const word = spellState.words[spellState.wIndex].toUpperCase();
            spellState.word = word;
            spellState.picked = [];
            spellState.done = false;
            spellState.letters = shuffle(word.replace(/ /g, '').split(''));
            renderSpellingUI();
        }
        function renderSpellingUI() {
            const area = document.getElementById('spelling-area');
            const targetLen = spellState.word.replace(/ /g, '').length;
            spellState.picked = [];
            area.innerHTML = `
                <div class="bg-amber-50 border-2 border-dashed border-amber-300 rounded-2xl p-8 text-center">
                    <p class="text-sm text-gray-500 mb-2">Word ${spellState.wIndex + 1} of ${spellState.words.length}</p>
                    <div class="text-6xl mb-3">${emojiFor(spellState.words[spellState.wIndex])}</div>
                    <button onclick="speak('${escapeJsStr(spellState.words[spellState.wIndex])}')" class="text-sm text-blue-600 underline mb-3 cursor-pointer">🔊 Hear the word</button>
                    <div class="flex justify-center gap-2 mb-5 flex-wrap" id="spell-slots">
                        ${Array.from({length: targetLen}).map(() => `<div class="spell-slot w-10 h-12 border-b-4 border-blue-400 flex items-center justify-center text-xl font-bold text-blue-800"></div>`).join('')}
                    </div>
                    <div class="flex justify-center gap-2 flex-wrap mb-4">
                        ${spellState.letters.map((l,i) => `<button onclick="pickLetter(${i})" id="letter-${i}" class="w-10 h-10 bg-white shadow rounded-lg font-bold text-lg hover:bg-blue-100 cursor-pointer">${l}</button>`).join('')}
                    </div>
                    <button onclick="resetSpelling()" class="text-sm text-gray-500 underline cursor-pointer">🔁 Reset</button>
                    <p id="spelling-fb" class="mt-3 font-bold min-h-[1.5rem]"></p>
                </div>`;
        }
        function pickLetter(i) {
            if (spellState.done) return;
            const btn = document.getElementById('letter-' + i);
            if (!btn || btn.disabled) return;
            btn.disabled = true;
            btn.classList.add('opacity-30');
            spellState.picked.push(spellState.letters[i]);
            const fb = document.getElementById('spelling-fb');
            const target = spellState.word.replace(/ /g, '');
            document.querySelectorAll('#spell-slots .spell-slot').forEach((cell, idx) => {
                cell.textContent = spellState.picked[idx] || '';
            });
            if (spellState.picked.length === target.length) {
                if (spellState.picked.join('') === target) {
                    spellState.done = true;
                    fb.className = 'mt-3 font-bold min-h-[1.5rem] text-green-600';
                    fb.textContent = `🎉 Correct! "${spellState.word}"` + (award(unitKey('spell-' + spellState.word), 3) ? ' (+3 ⭐)' : '');
                    spellState.wIndex++;
                    setTimeout(showSpellingWord, 1200);
                } else {
                    fb.className = 'mt-3 font-bold min-h-[1.5rem] text-red-500';
                    fb.textContent = '❌ Not quite — tap Reset and try again!';
                }
            }
        }
        function resetSpelling() { renderSpellingUI(); }

        // ===== 9. SENTENCE BUILDING (reorder scrambled words from the story) =====
        let sentenceState = { correctOrder: [], current: [], picked: [], target: '', done: false };
        function storySentences(unitData, minWordCount) {
            const all = splitSentences(unitData.story);
            const long = all.filter(s => s.split(/\s+/).length >= (minWordCount || 3));
            return long.length ? long : all;
        }
        function renderSentenceBuilding(contentDiv, unitData) {
            const sentences = storySentences(unitData, 3);
            // pick a different sentence from last time when the story has more than one
            let target = sentences[Math.floor(Math.random() * sentences.length)];
            if (sentences.length > 1) while (target.replace(/[.!?]+$/, '') === sentenceState.target) target = sentences[Math.floor(Math.random() * sentences.length)];
            target = target.replace(/[.!?]+["')]*$/, '').trim();
            sentenceState = { target, correctOrder: target.split(/\s+/), picked: [], current: [], done: false };
            sentenceState.current = shuffle(sentenceState.correctOrder);
            contentDiv.innerHTML = `<h2 class="text-xl font-bold text-blue-800 mb-2">💬 Sentence Building</h2>
                <p class="text-gray-600 mb-4">Tap the words in the correct order to build the sentence from the story.</p>
                <div id="sentence-area"></div>`;
            renderSentenceUI();
        }
        function renderSentenceUI() {
            const area = document.getElementById('sentence-area');
            sentenceState.picked = [];
            area.innerHTML = `
                <div class="bg-purple-50 border-2 border-dashed border-purple-300 rounded-2xl p-8 text-center">
                    <div id="sentence-built" class="min-h-[3rem] mb-5 p-3 bg-white rounded-xl border-2 border-purple-200 flex flex-wrap gap-2 justify-center items-center">
                        <span class="text-gray-400">Tap words below...</span>
                    </div>
                    <div class="flex flex-wrap gap-2 justify-center mb-4">
                        ${sentenceState.current.map((w,i) => `<button onclick="pickSentenceWord(${i})" id="sw-${i}" class="bg-white shadow px-3 py-2 rounded-lg font-semibold hover:bg-purple-100 cursor-pointer">${w}</button>`).join('')}
                    </div>
                    <div class="flex justify-center gap-4">
                        <button onclick="renderSentenceUI()" class="text-sm text-gray-500 underline cursor-pointer">↩️ Try again</button>
                        <button onclick="renderSentenceBuilding(document.getElementById('module-content'), curriculum[state.level][state.unit])" class="text-sm text-gray-500 underline cursor-pointer">🔁 New Sentence</button>
                    </div>
                    <p id="sentence-fb" class="mt-3 font-bold min-h-[1.5rem]"></p>
                </div>`;
        }
        function pickSentenceWord(i) {
            if (sentenceState.done) return;
            const btn = document.getElementById('sw-' + i);
            if (!btn || btn.disabled) return;
            btn.disabled = true;
            btn.classList.add('opacity-30');
            sentenceState.picked.push(sentenceState.current[i]);
            document.getElementById('sentence-built').innerHTML =
                sentenceState.picked.map(w => `<span class="bg-purple-100 px-3 py-1 rounded-lg font-semibold">${w}</span>`).join('');
            const fb = document.getElementById('sentence-fb');
            if (sentenceState.picked.length === sentenceState.correctOrder.length) {
                if (sentenceState.picked.join(' ') === sentenceState.correctOrder.join(' ')) {
                    sentenceState.done = true;
                    fb.className = 'mt-3 font-bold min-h-[1.5rem] text-green-600';
                    fb.textContent = '🎉 Perfect sentence!' + (award(unitKey('sentence-' + sentenceState.target), 3) ? ' (+3 ⭐)' : '');
                    speak(sentenceState.target);
                } else {
                    fb.className = 'mt-3 font-bold min-h-[1.5rem] text-red-500';
                    fb.textContent = '❌ Not quite the right order — tap "Try again"!';
                }
            }
        }

        // ===== 10. ROLE-PLAY / DIALOGUE =====
        // The 🔊 buttons used to be broken (the sentence's quote marks cut the button's code
        // short), so no line could be heard. Lines are now played by their number.
        let rolePlayLines = [];

                fb.className = 'text-center mt-2 font-bold min-h-[1.5rem] text-amber-600';

        // ===== 11. DICTATION (listen and type) =====
        // The Play button used to be broken, so no sentence could be heard. Fixed, plus a
        // slower replay and a "Next sentence" button.
        let dictationTarget = '';
        let dictationDone = false;
        function renderDictation(contentDiv, unitData) {
            const sentences = storySentences(unitData, 3);
            let pick = sentences[Math.floor(Math.random() * sentences.length)];
            if (sentences.length > 1) while (pick === dictationTarget) pick = sentences[Math.floor(Math.random() * sentences.length)];

                    </div>
                    <p id="dictation-fb" class="mt-3 font-bold min-h-[1.5rem]"></p>
                </div>`;
        }
        function playDictation(slow) {
            if (!('speechSynthesis' in window)) return;
            if (!slow) { speak(dictationTarget); return; }
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(dictationTarget);
            u.lang = 'en-US'; u.rate = 0.6;
            if (enVoice) u.voice = enVoice;
            window.speechSynthesis.speak(u);
        }
        const normalizeDictation = (s) => String(s).toLowerCase().replace(/[’‘]/g, "'").replace(/[“”]/g, '"').replace(/[.!?,;:"()—–-]/g, ' ').replace(/\s+/g, ' ').trim();
        function checkDictation() {
            const input = normalizeDictation(document.getElementById('dictation-input').value);
            const target = normalizeDictation(dictationTarget);
            const fb = document.getElementById('dictation-fb');
            if (!input) { fb.className = 'mt-3 font-bold min-h-[1.5rem] text-red-500'; fb.textContent = '✏️ Listen, then type the sentence first!'; return; }
            if (input === target) {
                fb.className = 'mt-3 font-bold min-h-[1.5rem] text-green-600';
                fb.textContent = '🎉 Perfect!' + (dictationDone ? '' : starNote(award(unitKey('dictation-' + target), 3), 3));
                dictationDone = true;
            } else {
                // show which words were right, so the student can learn from it
                const want = target.split(' '), got = input.split(' ');
                const right = want.filter((w, i) => got[i] === w).length;
                fb.className = 'mt-3 font-bold min-h-[1.5rem] text-red-500';
                fb.innerHTML = `❌ ${right} of ${want.length} words in the right place. The sentence was: "${escapeHtml(dictationTarget)}"`;
            }
        }

        // ===== 12. CULTURE CORNER (each unit's "value") =====
        function renderCultureCorner(contentDiv, unitData) {
            const value = unitData.value || 'Learning';
            contentDiv.innerHTML = `<h2 class="text-xl font-bold text-blue-800 mb-2">🌍 Culture Corner</h2>

                    <p id="culture-fb" class="text-sm mt-2 font-semibold min-h-[1.25rem]"></p>
                </div>`;

        function checkCulture() {

        }

        // ===== 13. REVIEW (cumulative picture quiz across all units up to the current one) =====
        let reviewState = { qIndex: 0, score: 0, questions: [], locked: false };
        function renderReview(contentDiv, unitData) {
            const levelData = curriculum[state.level];
            let pool = [];
            Object.keys(levelData).forEach(u => {
                if (parseInt(u) <= state.unit) pool = pool.concat(levelData[u].vocab);
            });
            pool = [...new Set(pool)];
            const questionWords = shuffle(pool).slice(0, Math.min(10, pool.length));
            reviewState = {
                qIndex: 0, score: 0, locked: false,
                questions: questionWords.map(correct => {
                    const home = Object.values(levelData).find(d => d.vocab.includes(correct));
                    return { correct, home, options: shuffle([correct, ...pictureDistractors(correct, pool, home, 3)]) };
                })
            };
            contentDiv.innerHTML = `<h2 class="text-xl font-bold text-blue-800 mb-2">🔄 Review — Units 1 to ${state.unit}</h2>
                <p class="text-gray-600 mb-4">A quick review of everything you've learned so far in ${state.level}!</p>
                <div id="review-area"></div>`;
            showReviewQuestion();
        }
        function showReviewQuestion() {
            const area = document.getElementById('review-area');
            if (!area) return;
            reviewState.locked = false;
            if (reviewState.qIndex >= reviewState.questions.length) {
                area.innerHTML = `<div class="bg-green-50 border-2 border-green-300 rounded-2xl p-8 text-center">
                    <p class="text-2xl font-bold text-green-700 mb-2">🎉 Review Complete!</p>
                    <p class="text-lg text-gray-700 mb-4">You scored ${reviewState.score} / ${reviewState.questions.length}</p>
                    <button onclick="renderReview(document.getElementById('module-content'), curriculum[state.level][state.unit])" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-6 py-2 rounded-full shadow cursor-pointer">🔁 New Review</button>
                </div>`;
                return;
            }
            const q = reviewState.questions[reviewState.qIndex];
            area.innerHTML = `
                <div class="bg-indigo-50 border-2 border-dashed border-indigo-300 rounded-2xl p-8 text-center">
                    <p class="text-sm text-gray-500 mb-2">Question ${reviewState.qIndex + 1} of ${reviewState.questions.length}</p>
                    <div class="text-7xl mb-5">${emojiFor(q.correct, q.home)}</div>
                    <div class="grid grid-cols-2 gap-3" id="review-options">
                        ${q.options.map(o => `<button onclick="answerReview('${escapeJsStr(o)}')" class="bg-white hover:bg-indigo-100 p-4 rounded-xl shadow font-bold text-indigo-800 cursor-pointer">${o}</button>`).join('')}
                    </div>
                    <p id="review-fb" class="mt-4 font-bold min-h-[1.5rem]"></p>
                </div>`;
        }
        function answerReview(chosen) {
            if (reviewState.locked) return;
            reviewState.locked = true;
            document.querySelectorAll('#review-options button').forEach(b => b.disabled = true);
            const q = reviewState.questions[reviewState.qIndex];
            const fb = document.getElementById('review-fb');
            if (chosen === q.correct) {
                fb.className = 'mt-4 font-bold min-h-[1.5rem] text-green-600';
                fb.textContent = '🎉 Correct!' + (award('review-' + q.correct, 1) ? ' (+1 ⭐)' : '');

                fb.className = 'mt-4 font-bold min-h-[1.5rem] text-red-500';
                fb.textContent = `❌ It was "${q.correct}"`;
            }
            reviewState.qIndex++;
            setTimeout(showReviewQuestion, 900);
        }

        // ===== 14. PRONUNCIATION DRILL (through every word) =====

        // ===== 15. ASSIGNMENT (research skills + APA citation) =====

        const CITATION_GUIDE_TABLE = [

        function renderAPALesson(contentDiv, unitData) {
            contentDiv.innerHTML = `
                <h2 class="text-xl font-bold text-blue-800 mb-2">📝 Assignment: APA Citation & Research Skills</h2>
                <div class="bg-blue-50 border-2 border-dashed border-blue-300 rounded-2xl p-6 mb-5">
                    <p class="font-semibold text-gray-800 mb-3">📚 What is APA style?</p>
                    <p class="text-gray-700 mb-3">APA (American Psychological Association) style is a standard way to give credit to the sources you use in an assignment. A book citation has 4 parts, always in this order:</p>
                    <ol class="list-decimal list-inside text-gray-700 space-y-1 mb-2">
                        ${APA_EXAMPLE.labels.map(l => `<li>${l}</li>`).join('')}
                    </ol>
                    <p class="text-sm text-gray-500 italic">Example (made up for practice): Rivera, L. (2021). <i>Healthy habits for young learners.</i> Bright Path Press.</p>
                </div>
                <div class="mb-5">
                    <button onclick="toggleAssignmentPanel('sample-paper-panel')" class="w-full text-left bg-slate-100 hover:bg-slate-200 rounded-xl p-4 font-semibold text-slate-800 cursor-pointer flex justify-between items-center">
                        <span>📄 View a Sample APA Paper (a full example to guide your own writing)</span><span>▼</span>
                    </button>
                    <div id="sample-paper-panel" style="display:none;" class="mt-2">${SAMPLE_APA_PAPER}</div>
                </div>
                <div class="mb-5">
                    <button onclick="toggleAssignmentPanel('citation-guide-panel')" class="w-full text-left bg-slate-100 hover:bg-slate-200 rounded-xl p-4 font-semibold text-slate-800 cursor-pointer flex justify-between items-center">
                        <span>📖 Citation Guide — How to Cite Different Sources</span><span>▼</span>
                    </button>
                    <div id="citation-guide-panel" style="display:none;" class="mt-2 bg-white border border-gray-300 rounded-lg overflow-x-auto">
                        <table class="w-full text-sm">
                            <thead><tr class="bg-slate-100"><th class="p-2 text-left">Source Type</th><th class="p-2 text-left">Format</th><th class="p-2 text-left">Example</th></tr></thead>
                            <tbody>
                                ${CITATION_GUIDE_TABLE.map(row => `<tr class="border-t border-gray-200"><td class="p-2 font-semibold align-top">${row.type}</td><td class="p-2 text-gray-600 align-top">${row.format}</td><td class="p-2 text-gray-700 italic align-top" style="word-break:break-word;">${row.example}</td></tr>`).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
                <div class="bg-purple-50 border-2 border-dashed border-purple-300 rounded-2xl p-6 mb-5">
                    <p class="font-semibold text-gray-800 mb-3">🧩 Practice: Tap the parts in the correct APA order</p>
                    <div id="apa-practice"></div>
                </div>
                <div class="bg-green-50 border-2 border-dashed border-green-300 rounded-2xl p-6">
                    <p class="font-semibold text-gray-800 mb-3">✍️ Now write a short paragraph (3-4 sentences) about "<span class="text-blue-700">${unitData.title}</span>"</p>
                    <p class="text-sm text-gray-500 mb-3">Try to include an idea from a source, and practice writing a source at the end, like: (Your Source, Year).</p>
                    <textarea id="assignment-text" rows="5" placeholder="Write your assignment paragraph here..." class="w-full p-3 rounded-xl border-2 border-green-300 mb-3"></textarea>
                    <button onclick="checkAssignmentWriting()" class="bg-green-600 hover:bg-green-700 text-white font-bold px-6 py-2 rounded-full shadow cursor-pointer">✅ Submit Assignment</button>
                    <p id="assignment-fb" class="mt-3 font-bold min-h-[1.5rem]"></p>
                </div>`;
            renderAPAPractice();
        }
        // The ordering task now has its own "Try again" button (it used to need a page refresh)
        function renderAPAPractice() {
            apaOrderState = { correctOrder: [...APA_EXAMPLE.parts], picked: [], current: shuffle(APA_EXAMPLE.parts), done: false };
            document.getElementById('apa-practice').innerHTML = `
                <div id="apa-built" class="min-h-[3rem] mb-4 p-3 bg-white rounded-xl border-2 border-purple-200 flex flex-wrap gap-2 justify-center items-center">
                    <span class="text-gray-400">Tap the pieces below...</span>
                </div>
                <div id="apa-pieces" class="flex flex-wrap gap-2 justify-center mb-3">
                    ${apaOrderState.current.map((p,i) => `<button onclick="pickAPAPart(${i})" id="apa-${i}" class="bg-white shadow px-3 py-2 rounded-lg font-semibold hover:bg-purple-100 cursor-pointer">${p}</button>`).join('')}
                </div>
                <p class="text-center"><button onclick="renderAPAPractice()" class="text-sm text-gray-500 underline cursor-pointer">↩️ Try again</button></p>
                <p id="apa-fb" class="text-center font-bold min-h-[1.5rem]"></p>`;
        }
        function pickAPAPart(i) {
            if (apaOrderState.done) return;
            const btn = document.getElementById('apa-' + i);
            if (!btn || btn.disabled) return;
            btn.disabled = true;
            btn.classList.add('opacity-30');
            apaOrderState.picked.push(apaOrderState.current[i]);
            document.getElementById('apa-built').innerHTML =
                apaOrderState.picked.map(p => `<span class="bg-purple-100 px-3 py-1 rounded-lg font-semibold">${p}</span>`).join('');
            const fb = document.getElementById('apa-fb');
            if (apaOrderState.picked.length === apaOrderState.correctOrder.length) {
                if (apaOrderState.picked.join(' ') === apaOrderState.correctOrder.join(' ')) {
                    apaOrderState.done = true;
                    fb.className = 'text-center font-bold min-h-[1.5rem] text-green-600';
                    fb.textContent = '🎉 Correct APA order!' + (award('apa-order', 3) ? ' (+3 ⭐)' : '');
                } else {
                    fb.className = 'text-center font-bold min-h-[1.5rem] text-red-500';
                    fb.textContent = '❌ Not quite the right order — tap "Try again".';
                }
            }
        }
        function checkAssignmentWriting() {
            const text = document.getElementById('assignment-text').value;
            const fb = document.getElementById('assignment-fb');
            const wc = countWords(text);
            if (wc >= 15) {
                const cited = /\([^()]*\d{4}[^()]*\)/.test(text);
                fb.className = 'mt-3 font-bold min-h-[1.5rem] text-green-600';
                fb.textContent = `🎉 Great work! Your paragraph has ${wc} words.` + (cited ? ' You included a citation too! ✅' : ' Tip: add a citation like (Rivera, 2021).') + starNote(award(unitKey('assignment'), 5), 5);
            } else {
                fb.className = 'mt-3 font-bold min-h-[1.5rem] text-red-500';
                fb.textContent = `✏️ Try writing a bit more — you have ${wc} words, aim for at least 15.`;
            }
        }

        // ===== 16. DISCUSSION (uses each unit's built-in question) =====
        const DISCUSSION_STARTERS_SIMPLE = ["I think...", "I like...", "My favorite is...", "Because..."];
        const DISCUSSION_STARTERS_ADVANCED = ["In my opinion, ...", "I believe that ... because ...", "One reason is that ...", "On the other hand, ...", "I agree/disagree because ..."];
        function renderDiscussion(contentDiv, unitData) {
            const starters = SIMPLE_SOURCE_LEVELS.includes(state.level) ? DISCUSSION_STARTERS_SIMPLE : DISCUSSION_STARTERS_ADVANCED;
            contentDiv.innerHTML = `
                <h2 class="text-xl font-bold text-blue-800 mb-2">💬 Discussion</h2>
                <p class="text-gray-600 mb-4">Your teacher wants the class to discuss this question. Write what you would say!</p>
                <div class="bg-indigo-50 border-2 border-dashed border-indigo-300 rounded-2xl p-6">
                    <p class="font-bold text-lg text-indigo-900 mb-4">❓ ${unitData.question}</p>
                    <p class="text-sm font-semibold text-gray-600 mb-2">💡 Sentence starters you can use:</p>
                    <div class="flex flex-wrap gap-2 mb-4">
                        ${starters.map(s => `<span class="bg-white px-3 py-1 rounded-lg text-sm text-indigo-700 border border-indigo-200">${s}</span>`).join('')}
                    </div>
                    <textarea id="discussion-text" rows="4" placeholder="Write your answer here..." class="w-full p-3 rounded-xl border-2 border-indigo-300 mb-3"></textarea>
                    <button onclick="checkDiscussion()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-6 py-2 rounded-full shadow cursor-pointer">✅ Share My Answer</button>
                    <p id="discussion-fb" class="mt-3 font-bold min-h-[1.5rem]"></p>
                </div>`;
        }
        function checkDiscussion() {
            textCheck(document.getElementById('discussion-fb'), document.getElementById('discussion-text').value, Math.max(5, minWords()), '🎉 Thank you for sharing your idea!', unitKey('discussion'), 3);
        }


        // Remembers which modules are finished (used by Gap Fill and Family Talk)
        function markActivityComplete(tab) {
            progress.completed = progress.completed || {};
            const key = state.level + '_' + state.unit + '_' + tab;
            if (!progress.completed[key]) { progress.completed[key] = true; saveProgress(); }
        }
        // ===== 17. GAP FILL & WORD CHECK (Cambridge-style) =====
        let examState = { gapAnswered: false, tfAnswered: false, gapCorrect: '', tfWord: '', tfIsReal: false };
        const escRe = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        function renderExamPractice(contentDiv, unitData) {
            // Prefer a unit word that appears in the story as a whole word, so the gap never
            // leaves a give-away ending like "_____s".
            const words = shuffle([...new Set(unitData.vocab)]);
            let targetWord = words.find(w => new RegExp('(^|[^A-Za-z])' + escRe(w) + '(?![A-Za-z])', 'i').test(unitData.story));
            let blankRe = targetWord ? new RegExp('(^|[^A-Za-z])' + escRe(targetWord) + '(?![A-Za-z])', 'i') : null;
            if (!targetWord) {
                targetWord = words.find(w => unitData.story.toLowerCase().includes(w.toLowerCase())) || unitData.vocab[0];
                blankRe = new RegExp('(^|[^A-Za-z])' + escRe(targetWord) + '[A-Za-z]*', 'i');
            }
            const blankedStory = escapeHtml(unitData.story).replace(blankRe, (m, pre) => (pre || '') + '<b>_____</b>');
            const distractors = pictureDistractors(targetWord, unitData.vocab, unitData, 3);
            const gapOptions = shuffle([targetWord, ...distractors]);
            const showReal = Math.random() < 0.5;
            const outsideWord = shuffle(allVocabForLevel(state.level).filter(w => !unitData.vocab.includes(w)))[0] || 'Umbrella';
            examState = { gapAnswered: false, tfAnswered: false, gapCorrect: targetWord,
                tfWord: showReal ? unitData.vocab[Math.floor(Math.random() * unitData.vocab.length)] : outsideWord, tfIsReal: showReal };

            contentDiv.innerHTML = `
                <h2 class="text-xl font-bold text-indigo-900 mb-2">🎓 Exam Practice: Unit ${state.unit}</h2>
                <p class="text-gray-600 mb-4">Cambridge-style tasks based on this unit's text and vocabulary.</p>
                <div class="bg-rose-50 border-2 border-dashed border-rose-300 rounded-2xl p-6 mb-4">
                    <p class="font-bold text-rose-900 mb-2">Part A — Gap Fill: choose the word that fits the gap.</p>
                    <p class="bg-white p-4 rounded-xl shadow-inner text-gray-800 mb-3">"${blankedStory}"</p>
                    <div class="flex flex-wrap gap-2" id="exam-gap-options">
                        ${gapOptions.map(o => `<button onclick="answerExamGap('${escapeJsStr(o)}')" class="bg-white border border-rose-200 hover:bg-rose-100 px-4 py-2 rounded-lg font-semibold text-sm cursor-pointer">${o}</button>`).join('')}
                    </div>
                    <p id="exam-gap-msg" class="text-sm mt-3 font-semibold min-h-[1.25rem]"></p>
                </div>
                <div class="bg-rose-50 border-2 border-dashed border-rose-300 rounded-2xl p-6">
                    <p class="font-bold text-rose-900 mb-2">Part B — Word Recognition: True or False?</p>
                    <p class="bg-white p-4 rounded-xl shadow-inner text-gray-800 mb-3">"${examState.tfWord}" is one of this unit's vocabulary words.</p>
                    <div class="flex gap-2" id="exam-tf-options">
                        <button onclick="answerExamTF(true)" class="bg-white border border-rose-200 hover:bg-rose-100 px-5 py-2 rounded-lg font-semibold text-sm cursor-pointer">✅ True</button>
                        <button onclick="answerExamTF(false)" class="bg-white border border-rose-200 hover:bg-rose-100 px-5 py-2 rounded-lg font-semibold text-sm cursor-pointer">❌ False</button>
                    </div>
                    <p id="exam-tf-msg" class="text-sm mt-3 font-semibold min-h-[1.25rem]"></p>
                </div>
                <p class="text-center mt-4"><button onclick="renderExamPractice(document.getElementById('module-content'), curriculum[state.level][state.unit])" class="text-sm text-gray-500 underline cursor-pointer">🔁 New questions</button></p>`;
        }
        function checkExamComplete() {
            if (examState.gapAnswered && examState.tfAnswered) markActivityComplete('exam');
        }
        function answerExamGap(chosen) {
            if (examState.gapAnswered) return;
            examState.gapAnswered = true;
            document.querySelectorAll('#exam-gap-options button').forEach(b => b.disabled = true);
            const msg = document.getElementById('exam-gap-msg');
            if (chosen.toLowerCase() === examState.gapCorrect.toLowerCase()) {
                msg.className = "text-sm mt-3 font-semibold text-green-600";
                msg.textContent = "🎉 Correct!" + (award(unitKey('exam-gap-' + examState.gapCorrect), 3) ? ' (+3 ⭐)' : '');
            } else {
                msg.className = "text-sm mt-3 font-semibold text-red-500";
                msg.textContent = `❌ Not quite — the answer was "${examState.gapCorrect}".`;
            }
            checkExamComplete();
        }
        function answerExamTF(chosenTrue) {
            if (examState.tfAnswered) return;
            examState.tfAnswered = true;
            document.querySelectorAll('#exam-tf-options button').forEach(b => b.disabled = true);
            const msg = document.getElementById('exam-tf-msg');
            if (chosenTrue === examState.tfIsReal) {
                msg.className = "text-sm mt-3 font-semibold text-green-600";
                msg.textContent = "🎉 Correct!" + (award(unitKey('exam-tf-' + examState.tfWord), 2) ? ' (+2 ⭐)' : '');
            } else {
                msg.className = "text-sm mt-3 font-semibold text-red-500";
                msg.textContent = `❌ Not quite — that statement was ${examState.tfIsReal ? 'True' : 'False'}.`;
            }
            checkExamComplete();
        }

        // ===== 18. FAMILY TALK (share the lesson at home) =====
        function renderFamily(contentDiv, unitData) {
            contentDiv.innerHTML = `
                <h2 class="text-xl font-bold text-indigo-900 mb-2">👨‍👩‍👧 Family Talk: ${unitData.title}</h2>
                <p class="text-gray-600 mb-4">Tell someone at home what you learned in English, then ask them this question.</p>
                <div class="bg-orange-50 border-2 border-dashed border-orange-300 rounded-2xl p-6">
                    <p class="font-bold text-orange-900 text-lg mb-3">❓ ${unitData.question}</p>
                    <label class="block text-sm font-semibold text-gray-700 mb-1" for="family-who">Who did you talk to?</label>
                    <input id="family-who" type="text" placeholder="e.g. my mother, my grandfather" class="w-full p-3 border border-gray-300 rounded-lg text-sm mb-3">
                    <label class="block text-sm font-semibold text-gray-700 mb-1" for="family-answer">What did they say?</label>
                    <textarea id="family-answer" rows="3" placeholder="Write their answer here..." class="w-full p-3 border border-gray-300 rounded-lg text-sm"></textarea>
                    <button onclick="checkFamily()" class="mt-3 bg-orange-500 hover:bg-orange-600 text-white font-bold px-5 py-2 rounded-xl shadow cursor-pointer text-sm">Save Our Talk</button>
                    <p id="family-msg" class="text-sm mt-2 font-semibold min-h-[1.25rem]"></p>
                </div>`;
        }
        function checkFamily() {
            const who = document.getElementById('family-who').value.trim();
            const msg = document.getElementById('family-msg');
            if (countWords(who) < 1) { msg.className = 'text-sm mt-2 font-semibold text-red-500'; msg.textContent = '✏️ Write who you talked to first.'; return; }
            if (textCheck(msg, document.getElementById('family-answer').value, minWords(), '🏡 Great family talk!', unitKey('family'), 3)) markActivityComplete('family');
        }


        // ===== ONLINE CLASS A1 BOOK 2 — HUB EMBED VARIANT: hard-locked to A1 =====
        // One copy of this file exists per level (PreA1/A1/A2/B1/B2); only the level differs.
        function lockLevel(requested) {
            state.level = requested;
            document.getElementById('current-level-display').textContent = requested;
            document.getElementById('level-picker-wrap').classList.add('hidden');
            const banner = document.getElementById('locked-level-banner');
            banner.classList.remove('hidden');
            document.getElementById('locked-level-text').textContent = requested;
        }

        lockLevel('A1');
        loadProgress();
        populateUnitSelect();
        // Open on the video only when this unit has one; otherwise start with Listening
        state.tab = videoFor(state.level, state.unit) ? 'video' : 'listening';
        highlightActiveTab();
        renderContent();
        // Phones: show the "📚 Modules" button once the module list has scrolled out of view
        if ('IntersectionObserver' in window) {
            new IntersectionObserver(entries => {
                const jump = document.getElementById('modules-jump');
                if (jump) jump.style.display = entries[0].isIntersecting ? 'none' : '';
            }).observe(document.querySelector('.tab-btn[data-tab="family"]'));
        }
    </script>
</body>
</html>
