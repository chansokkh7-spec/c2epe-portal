<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C2-EPE Digital Academy - Online Class Primary A1 (Book 2)</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap');
        body { font-family: 'Poppins', sans-serif; }
        /* Flip-card for Listening: front = word, back = picture. */
        .flip-card { perspective: 1000px; height: 100px; cursor: pointer; }
        .flip-card-inner {
            position: relative; width: 100%; height: 100%;
            transition: transform 0.5s; transform-style: preserve-3d;
        }
        .flip-card.flipped .flip-card-inner { transform: rotateY(180deg); }
        .flip-card-front, .flip-card-back {
            position: absolute; width: 100%; height: 100%;
            backface-visibility: hidden; border-radius: 0.75rem;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 0.25rem;
        }
        .flip-card-back { transform: rotateY(180deg); }
        button:disabled { cursor: default; }
        /* phones: the lesson fills the screen, so jumping to it always shows it from the top,
           and the floating "Modules" button never covers the lesson's own buttons */
        @media (max-width: 767px) { #content-area { min-height: calc(100vh - 24px); padding-bottom: 76px; } }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col items-center p-4">

    <header class="w-full max-w-5xl bg-blue-900 text-white rounded-2xl p-6 shadow-lg mb-6 flex justify-between items-center flex-wrap gap-3">
        <div>
            <h1 class="text-2xl md:text-3xl font-extrabold tracking-wide">📘 C2-EPE Primary Companion</h1>
            <p class="text-sm text-blue-200">C2-EPE Primary English (Pre-A1 - B2) - Home Practice</p>
        </div>
        <div class="flex items-center gap-3 flex-wrap justify-end">
            <div class="bg-amber-400 text-blue-900 px-3 py-2 rounded-xl text-sm font-bold shadow flex items-center gap-1">
                ⭐ <span id="star-count">0</span>
            </div>
            <div class="bg-pink-500 text-white px-3 py-2 rounded-xl text-sm font-bold shadow flex items-center gap-1">
                🏆 <span id="badge-count">0</span> Badges
            </div>
            <div class="bg-blue-700 px-3 py-2 rounded-xl text-sm font-bold border border-blue-500">
                <span id="current-level-display">A1</span>
            </div>
        </div>
    </header>

    <main class="w-full max-w-5xl grid grid-cols-1 md:grid-cols-4 gap-6">

        <aside id="module-sidebar" class="bg-white rounded-2xl p-4 shadow-md md:col-span-1 flex flex-col gap-3" style="scroll-margin-top:12px;">
            <div id="level-picker-wrap">
                <h2 class="font-bold text-gray-700 border-b pb-2">CEFR Level</h2>
                <div class="flex flex-col gap-3 mt-3">
                    <button onclick="selectLevel('PreA1')" id="btn-PreA1" class="level-btn text-left p-3 rounded-xl bg-gray-100 hover:bg-amber-100 font-semibold transition cursor-pointer">🌱 Pre-A1</button>
                    <button onclick="selectLevel('A1')" id="btn-A1" class="level-btn text-left p-3 rounded-xl bg-blue-700 text-white font-semibold transition shadow cursor-pointer">🐝 A1</button>
                    <button onclick="selectLevel('A2')" id="btn-A2" class="level-btn text-left p-3 rounded-xl bg-gray-100 hover:bg-amber-100 font-semibold transition cursor-pointer">📘 A2</button>
                    <button onclick="selectLevel('B1')" id="btn-B1" class="level-btn text-left p-3 rounded-xl bg-gray-100 hover:bg-amber-100 font-semibold transition cursor-pointer">🎯 B1</button>
                    <button onclick="selectLevel('B2')" id="btn-B2" class="level-btn text-left p-3 rounded-xl bg-gray-100 hover:bg-amber-100 font-semibold transition cursor-pointer">🚀 B2 (Extra)</button>
                </div>
            </div>
            <div id="locked-level-banner" class="hidden bg-blue-50 border border-blue-200 rounded-xl p-3 text-center">
                <p class="text-xs text-blue-500 font-semibold">LEVEL</p>
                <p id="locked-level-text" class="text-xl font-bold text-blue-800"></p>
            </div>

            <hr class="my-2">
            <h2 class="font-bold text-gray-700" id="unit-select-label">Select Unit (1 to 6)</h2>
            <select id="unit-select" onchange="updateUnit()" class="p-2 rounded-xl border border-gray-300 bg-gray-50 font-semibold text-blue-800">
                <option value="1">Loading...</option>
            </select>

            <hr class="my-2">
            <h2 class="font-bold text-gray-700">Learning Modules</h2>
            <button onclick="switchTab('video')" data-tab="video" class="tab-btn text-left p-2 rounded-lg bg-blue-50 text-blue-700 font-medium text-sm cursor-pointer">📹 0. Video Lesson</button>
            <button onclick="switchTab('listening')" data-tab="listening" class="tab-btn text-left p-2 rounded-lg hover:bg-gray-100 font-medium text-sm cursor-pointer">🔊 1. Listening</button>
            <button onclick="switchTab('speaking')" data-tab="speaking" class="tab-btn text-left p-2 rounded-lg hover:bg-gray-100 font-medium text-sm cursor-pointer">🗣️ 2. Speaking</button>
            <button onclick="switchTab('reading')" data-tab="reading" class="tab-btn text-left p-2 rounded-lg hover:bg-gray-100 font-medium text-sm cursor-pointer">📖 3. Reading</button>
            <button onclick="switchTab('grammar')" data-tab="grammar" class="tab-btn text-left p-2 rounded-lg hover:bg-gray-100 font-medium text-sm cursor-pointer">📐 4. Grammar Box</button>
            <button onclick="switchTab('writing')" data-tab="writing" class="tab-btn text-left p-2 rounded-lg hover:bg-gray-100 font-medium text-sm cursor-pointer">✍️ 5. Writing Practice</button>
            <button onclick="switchTab('quiz')" data-tab="quiz" class="tab-btn text-left p-2 rounded-lg hover:bg-gray-100 font-medium text-sm cursor-pointer">🧩 6. Quiz & Rewards</button>
            <button onclick="switchTab('vocabgame')" data-tab="vocabgame" class="tab-btn text-left p-2 rounded-lg hover:bg-gray-100 font-medium text-sm cursor-pointer">🎮 7. Vocabulary Game</button>
            <button onclick="switchTab('spelling')" data-tab="spelling" class="tab-btn text-left p-2 rounded-lg hover:bg-gray-100 font-medium text-sm cursor-pointer">✏️ 8. Spelling Practice</button>
            <button onclick="switchTab('sentence')" data-tab="sentence" class="tab-btn text-left p-2 rounded-lg hover:bg-gray-100 font-medium text-sm cursor-pointer">💬 9. Sentence Building</button>
            <button onclick="switchTab('roleplay')" data-tab="roleplay" class="tab-btn text-left p-2 rounded-lg hover:bg-gray-100 font-medium text-sm cursor-pointer">🎤 10. Role-Play</button>
            <button onclick="switchTab('dictation')" data-tab="dictation" class="tab-btn text-left p-2 rounded-lg hover:bg-gray-100 font-medium text-sm cursor-pointer">✍️ 11. Dictation</button>
            <button onclick="switchTab('culture')" data-tab="culture" class="tab-btn text-left p-2 rounded-lg hover:bg-gray-100 font-medium text-sm cursor-pointer">🌍 12. Culture Corner</button>
            <button onclick="switchTab('review')" data-tab="review" class="tab-btn text-left p-2 rounded-lg hover:bg-gray-100 font-medium text-sm cursor-pointer">🔄 13. Review</button>
            <button onclick="switchTab('pronunciation')" data-tab="pronunciation" class="tab-btn text-left p-2 rounded-lg hover:bg-gray-100 font-medium text-sm cursor-pointer">🔊 14. Pronunciation Drill</button>
            <button onclick="switchTab('assignment')" data-tab="assignment" class="tab-btn text-left p-2 rounded-lg hover:bg-gray-100 font-medium text-sm cursor-pointer">📝 15. Assignment</button>
            <button onclick="switchTab('discussion')" data-tab="discussion" class="tab-btn text-left p-2 rounded-lg hover:bg-gray-100 font-medium text-sm cursor-pointer">💬 16. Discussion</button>
            <button onclick="switchTab('exam')" data-tab="exam" class="tab-btn text-left p-2 rounded-lg hover:bg-gray-100 font-medium text-sm cursor-pointer">📝 17. Gap Fill & Word Check</button>
            <button onclick="switchTab('family')" data-tab="family" class="tab-btn text-left p-2 rounded-lg hover:bg-gray-100 font-medium text-sm cursor-pointer">👨‍👩‍👧 18. Family Talk</button>
        </aside>

        <section id="content-area" class="bg-white rounded-2xl p-6 shadow-md md:col-span-3 flex flex-col justify-between" style="scroll-margin-top:12px;">
            <div id="module-content"></div>
            <div class="mt-8 pt-4 border-t flex justify-between items-center text-sm text-gray-500 gap-2 flex-wrap">
                <span id="platform-info">C2-EPE Online Class - A1 Book 2 (Unit 1)</span>
                <div class="flex gap-2">
                    <button onclick="completeActivity()" class="bg-amber-500 hover:bg-amber-600 text-white font-bold px-4 py-2 rounded-xl shadow cursor-pointer transition">Finish Activity (+5 ⭐)</button>
                    <button onclick="nextLesson()" class="bg-blue-700 hover:bg-blue-800 text-white font-bold px-4 py-2 rounded-xl shadow cursor-pointer transition">Next Lesson ▶️</button>
                </div>
            </div>
        </section>

    </main>

    <!-- Phones only: jump back up to the list of learning modules -->
    <button id="modules-jump" onclick="jumpToModules()"
        class="md:hidden fixed bottom-4 right-4 z-50 bg-blue-700 text-white font-bold px-4 py-3 rounded-full shadow-lg cursor-pointer"
        style="display:none;" aria-label="Back to learning modules">📚 Modules</button>

    <script>
        let state = {
            level: 'A1',
            unit: 1,
            tab: 'listening',
            stars: 0,
            badges: 0
        };

        const curriculum = {
            'PreA1': {
                1: { title: "Hello & School", vocab: ["Hello", "Goodbye", "Teacher", "Classmate", "Book", "Pencil", "Friend", "Welcome", "Student", "Chair", "Desk", "Question"], story: "Hello! I am Mia. This is my teacher and my classmates. I have a book and a pencil.", question: "What do you say when you meet your teacher?", grammar: { point: "I am / You are", example: "I am Mia. You are my friend." }, value: "Kindness" },
                2: { title: "My Family", vocab: ["Mother", "Father", "Sister", "Brother", "Baby", "Grandparents", "Family", "Love", "Home", "Together", "Hug", "Kiss"], story: "This is my family. I have a mother, a father, a sister and a baby brother. My grandparents visit us every week.", question: "Who is in your family?", grammar: { point: "This is my...", example: "This is my mother. This is my brother." }, value: "Love" },
                3: { title: "Numbers & Colors", vocab: ["One", "Five", "Ten", "Red", "Blue", "Green", "Two", "Three", "Four", "Yellow", "Purple", "Pink"], story: "I can count from one to ten. I like the color red, but my sister likes blue and green.", question: "What is your favorite color?", grammar: { point: "I have... / It is...", example: "I have five apples. It is red." }, value: "Curiosity" },
                4: { title: "Animals I Know", vocab: ["Dog", "Cat", "Bird", "Fish", "Elephant", "Lion", "Tiger", "Monkey", "Rabbit", "Duck", "Cow", "Pig"], story: "At the zoo, we saw a big elephant and a strong lion. At home, I have a dog and a cat.", question: "What animal do you like the most?", grammar: { point: "It can...", example: "A bird can fly. A fish can swim." }, value: "Caring for Animals" },
                5: { title: "My Body", vocab: ["Head", "Hand", "Foot", "Eye", "Ear", "Mouth", "Nose", "Hair", "Knee", "Shoulder", "Finger", "Tummy"], story: "I have two eyes, two ears and one mouth. I use my hands and my feet every day.", question: "How many eyes do you have?", grammar: { point: "I have two...", example: "I have two hands. I have two feet." }, value: "Healthy Habits" },
                6: { title: "Everyday Actions", vocab: ["Run", "Jump", "Eat", "Drink", "Sleep", "Play", "Walk", "Stand", "Sit", "Clap", "Wash", "Brush"], story: "Every day I eat breakfast, run to school, and play with my friends. At night, I sleep well.", question: "What do you do every morning?", grammar: { point: "I usually...", example: "I usually eat breakfast at 7 o'clock." }, value: "Responsibility" },
                7: { title: "My Toys", vocab: ["Ball", "Doll", "Kite", "Blocks", "Robot", "Puzzle", "Car", "Bicycle", "Balloon", "Book", "Drum", "Top"], story: "I like to play with my ball and my blocks. My sister has a doll, and I fly a kite outside.", question: "What toy do you like to play with?", grammar: { point: "I like / I play with", example: "I like my ball. I play with blocks." }, value: "Sharing" },
                8: { title: "Weather", vocab: ["Sun", "Rain", "Wind", "Cloud", "Hot", "Cold", "Weather", "Umbrella", "Rainbow", "Snow", "Storm", "Warm"], story: "Today the sun is hot and bright. Yesterday it was cold and rainy, with a strong wind.", question: "What is the weather like today?", grammar: { point: "It is...", example: "It is hot today. It is cold and windy." }, value: "Being Prepared" },
                9: { title: "Fruits", vocab: ["Apple", "Banana", "Orange", "Mango", "Grape", "Watermelon", "Pineapple", "Strawberry", "Lemon", "Coconut", "Peach", "Sweet"], story: "I eat an apple and a banana every day. On hot days, I like cold watermelon.", question: "What is your favorite fruit?", grammar: { point: "I eat... every day", example: "I eat an apple every day." }, value: "Healthy Eating" },
                10: { title: "My Clothes", vocab: ["Shirt", "Shorts", "Shoes", "Hat", "Socks", "Dress", "Skirt", "Jacket", "Gloves", "Scarf", "Boots", "Uniform"], story: "I wear a shirt and shorts to play. I put on my shoes and socks before going outside.", question: "What are you wearing today?", grammar: { point: "I am wearing...", example: "I am wearing a shirt and shoes." }, value: "Tidiness" },
                11: { title: "In the Classroom", vocab: ["Desk", "Chair", "Board", "Bag", "Ruler", "Crayon", "Window", "Door", "Wall", "Floor", "Clock", "Poster"], story: "In my classroom, I sit on a chair at my desk. I keep my ruler and crayons in my bag.", question: "What do you keep in your school bag?", grammar: { point: "Where is / are...?", example: "Where is my ruler? It is in my bag." }, value: "Respect" },
                12: { title: "Time of Day", vocab: ["Morning", "Afternoon", "Evening", "Night", "Today", "Tomorrow", "Now", "Later", "Early", "Late", "Soon", "Always"], story: "In the morning I go to school. In the evening I eat dinner. At night, I go to sleep.", question: "What do you do in the morning?", grammar: { point: "In the... / At...", example: "In the morning, I wake up. At night, I sleep." }, value: "Punctuality" },
                13: { title: "Shapes", vocab: ["Circle", "Square", "Triangle", "Star", "Heart", "Diamond", "Rectangle", "Oval", "Line", "Curve", "Big", "Small"], story: "I can draw a circle and a square. My favorite shape is a star, because it is pretty.", question: "What shape do you like best?", grammar: { point: "It is a...", example: "It is a circle. It is a star." }, value: "Creativity" },
                14: { title: "My Pets", vocab: ["Puppy", "Kitten", "Rabbit", "Fish", "Hamster", "Turtle", "Bird", "Duckling", "Chick", "Parrot", "Feed", "Care"], story: "I have a puppy and a kitten at home. My friend has a rabbit and a slow turtle.", question: "Do you have a pet? What is it?", grammar: { point: "I have a...", example: "I have a puppy. I have a kitten too." }, value: "Caring for Pets" },
                15: { title: "How I Feel", vocab: ["Happy", "Sad", "Angry", "Tired", "Scared", "Surprised", "Calm", "Excited", "Worried", "Bored", "Shy", "Brave"], story: "I feel happy when I play. I feel tired at night. Sometimes I feel scared in the dark.", question: "How do you feel today?", grammar: { point: "I feel...", example: "I feel happy. I feel tired now." }, value: "Empathy" },
                16: { title: "Good Manners", vocab: ["Please", "Thank you", "Sorry", "Share", "Help", "Kind", "Wait", "Listen", "Smile", "Hello again", "Welcome", "Respect"], story: "I always say please and thank you. I like to share my toys and help my friends.", question: "What do you say when someone helps you?", grammar: { point: "Say please / thank you", example: "Please help me. Thank you for your help." }, value: "Politeness" },
                17: { title: "My Friends", vocab: ["Friend", "Play", "Share", "Kind", "Together", "Smile", "Help", "Fun"], story: "I have many friends at school. We play together and share our toys. My friends are kind, and we always help each other. Playing together is fun!", question: "Who is your best friend, and what do you like to play together?", grammar: { point: "My friend is + adjective", example: "My friend is kind. My friend is fun." }, value: "Friendship" },
                18: { title: "At the Park", vocab: ["Park", "Swing", "Slide", "Run", "Jump", "Grass", "Tree", "Sun"], story: "I love going to the park! I like to swing and slide. I can run and jump on the green grass. There are big trees, and the sun is warm and bright.", question: "What do you like to do at the park?", grammar: { point: "I like to + verb", example: "I like to swing. I like to run." }, value: "Joy" },
                19: { title: "Simple Songs & Rhymes", vocab: ["Song", "Sing", "Clap", "Dance", "Rhyme", "Music", "Happy", "Together"], story: "We sing songs and clap our hands in class. We love to dance to the music! Singing rhymes together makes everyone happy.", question: "What is your favorite song to sing?", grammar: { point: "Let's + verb", example: "Let's sing! Let's dance!" }, value: "Togetherness" },
            },
            'A1': {
                1: { title: "Transport", vocab: ["Bus", "Bicycle", "Car", "Train", "Motorbike", "Boat", "Ship", "Airplane", "Taxi", "Ferry", "Station", "Fare"], story: "I go to school by bus. My father goes to work by motorbike, and my uncle travels by train.", question: "How do you usually go to school?", grammar: { point: "go by...", example: "I go by bus. She goes by bicycle." }, value: "Road Safety" },
                2: { title: "Shopping", vocab: ["Money", "Price", "Buy", "Sell", "Cheap", "Expensive", "Wallet", "Coin", "Bill", "Change", "Store", "Customer"], story: "At the market, I buy fruit with my money. Vegetables are cheap, but meat is more expensive.", question: "What did you buy at the market last time?", grammar: { point: "How much is...?", example: "How much is this? It is cheap." }, value: "Honesty" },
                3: { title: "Family Members", vocab: ["Uncle", "Aunt", "Cousin", "Grandmother", "Grandfather", "Niece", "Nephew", "Stepfather", "Stepmother", "Relative", "Twin", "Elder"], story: "My uncle and aunt visit us with my cousin every weekend. My grandmother tells us stories.", question: "Who is your favorite family member? Why?", grammar: { point: "possessive 's", example: "My uncle's house is big. My cousin's name is Tom." }, value: "Respect for Elders" },
                4: { title: "Daily Timetable", vocab: ["Timetable", "Class", "Break", "Lesson", "Homework", "Schedule", "Assembly", "Recess", "Period", "Late", "On time", "Absent"], story: "My timetable has six lessons every day. We have a short break, then more classes and homework.", question: "How many lessons do you have each day?", grammar: { point: "Frequency adverbs", example: "I always do my homework. I sometimes have a long break." }, value: "Punctuality" },
                5: { title: "Sports I Play", vocab: ["Football", "Basketball", "Volleyball", "Swim", "Run", "Jump rope", "Tennis", "Badminton", "Race", "Champion", "Medal", "Score"], story: "After school, I play football with my friends. My sister prefers to swim or jump rope.", question: "What sport do you play after school?", grammar: { point: "can / can't", example: "I can play football. I can't swim well yet." }, value: "Sportsmanship" },
                6: { title: "Musical Instruments", vocab: ["Guitar", "Piano", "Drum", "Violin", "Flute", "Sing", "Cymbals", "Recorder", "Xylophone", "Choir", "Band", "Rhythm"], story: "My brother plays the guitar, and I am learning the piano. My friend loves to sing and play the drum.", question: "What instrument would you like to learn?", grammar: { point: "play the...", example: "I play the piano. He plays the drum." }, value: "Patience" },
                7: { title: "At the Park", vocab: ["Park", "Swing", "Slide", "Bench", "Kite", "Picnic", "Grass", "Fun"], story: "On Saturday my family goes to the park. My brother plays on the swing and the slide, and I fly a kite. We have a picnic on the grass.", question: "What do you do at the park?", grammar: {"point": "Let's...", "example": "Let's fly a kite! Let's have a picnic!"}, value: "Joy" },
                8: { title: "A Day at the Beach", vocab: ["Beach", "Sea", "Sand", "Shell", "Swim", "Sunscreen", "Wave", "Boat"], story: "We went to the beach in Kep. I played in the sand and found a pretty shell. We put on sunscreen and swam in the sea. The waves were small.", question: "What can you do at the beach?", grammar: {"point": "Past simple (was / were)", "example": "The sea was blue. The waves were small."}, value: "Safety" },
                9: { title: "Camping Fun", vocab: ["Tent", "Camp", "Fire", "Stars", "Torch", "Night", "Sleeping bag", "Forest"], story: "We went camping in the forest. We put up a tent and sat around the fire. At night we looked at the stars with a torch and slept in a sleeping bag.", question: "Would you like to go camping? Why?", grammar: {"point": "Past simple regular verbs", "example": "We camped in the forest. We looked at the stars."}, value: "Adventure" },
                10: { title: "Water Festival", vocab: ["Water Festival", "Boat race", "River", "Rowers", "Crowd", "Lights", "November", "Celebrate"], story: "The Water Festival, Bon Om Touk, happens in November. Teams of rowers race long boats on the river in Phnom Penh. At night, big crowds watch the lights and celebrate.", question: "What do people do at the Water Festival?", grammar: {"point": "People + verb (present simple)", "example": "People watch the boat races. They celebrate at night."}, value: "Cultural Pride" },
                11: { title: "Khmer New Year", vocab: ["Khmer New Year", "April", "Pagoda", "Family", "Games", "Water", "Blessing", "Holiday"], story: "Khmer New Year is in April. Families visit the pagoda and ask for a blessing. Children play traditional games and splash water to keep cool on the holiday.", question: "How does your family celebrate Khmer New Year?", grammar: {"point": "We usually...", "example": "We usually visit the pagoda. We usually play games."}, value: "Family" },
                12: { title: "At the Doctor's", vocab: ["Doctor", "Nurse", "Temperature", "Headache", "Stomachache", "Medicine", "Rest", "Better"], story: "I had a headache and a stomachache, so I went to the doctor. The nurse checked my temperature. The doctor gave me medicine and told me to rest. Now I feel better.", question: "What should you do when you feel sick?", grammar: {"point": "I have a... / You should...", "example": "I have a headache. You should rest."}, value: "Self-Care" },
                13: { title: "My Town Map", vocab: ["Map", "Street", "Hospital", "Pharmacy", "Bank", "Post office", "Next to", "Opposite"], story: "Look at the map of my town. The hospital is next to the pharmacy. The bank is opposite the post office on Main Street.", question: "What is next to your school?", grammar: {"point": "Next to / opposite / between", "example": "The bank is next to the market. The school is opposite the park."}, value: "Community Spirit" },
                14: { title: "Insects and Bugs", vocab: ["Ant", "Bee", "Butterfly", "Spider", "Ladybird", "Mosquito", "Wings", "Legs"], story: "Insects are small animals with six legs. Ants work together, and bees make honey. A butterfly has beautiful wings. A spider has eight legs, so it is not an insect!", question: "How many legs does an insect have?", grammar: {"point": "It has got...", "example": "A butterfly has got wings. A spider has got eight legs."}, value: "Curiosity" },
                15: { title: "Under the Sea", vocab: ["Fish", "Shark", "Dolphin", "Octopus", "Crab", "Coral", "Ocean", "Swim"], story: "Many animals live in the ocean. Fish and dolphins swim near the coral. An octopus has eight arms, and a crab walks sideways on the sand.", question: "Which sea animal is the most interesting?", grammar: {"point": "Can + verb", "example": "A dolphin can jump. A crab can walk sideways."}, value: "Protecting Nature" },
                16: { title: "The Weather Today", vocab: ["Weather", "Sunny", "Cloudy", "Rainy", "Windy", "Hot", "Cold", "Storm"], story: "What's the weather like today? It is sunny and hot in the morning, but it is cloudy in the afternoon. Tonight it will be rainy and windy, maybe with a storm.", question: "What's the weather like today?", grammar: {"point": "What's the weather like? It's...", "example": "What's the weather like? It's sunny."}, value: "Being Prepared" },
                17: { title: "Growing Plants", vocab: ["Seed", "Soil", "Water", "Sun", "Grow", "Leaf", "Flower", "Garden"], story: "I plant a seed in the soil. I give it water every day, and the sun helps it grow. Soon a green leaf appears, and then a pretty flower in my garden.", question: "What do plants need to grow?", grammar: {"point": "First, then, next, finally", "example": "First, plant the seed. Then, give it water."}, value: "Patience" },
                18: { title: "At the Library", vocab: ["Library", "Librarian", "Book", "Borrow", "Return", "Quiet", "Shelf", "Read"], story: "Our school has a library. I borrow a book about animals and return it next week. The librarian helps me find books on the shelf. Everyone is quiet so we can read.", question: "What kind of books do you like to read?", grammar: {"point": "Can I...? / May I...?", "example": "Can I borrow this book? May I read here?"}, value: "Love of Reading" },
                19: { title: "Computers and Phones", vocab: ["Computer", "Phone", "Screen", "Keyboard", "Internet", "Game", "Message", "Safe"], story: "I use a computer at school and my mother's phone at home. I type on the keyboard and look at the screen. I play a learning game on the internet, and I stay safe online.", question: "What do you use a computer for?", grammar: {"point": "I use ... to ...", "example": "I use a computer to play games. I use a phone to send messages."}, value: "Online Safety" },
                20: { title: "Cooking with Family", vocab: ["Cook", "Kitchen", "Rice", "Egg", "Vegetables", "Cut", "Fry", "Taste"], story: "On Sundays I cook with my family in the kitchen. My father cuts vegetables, and I fry an egg. We cook rice together. Then we taste the food \u2014 yum!", question: "What can you cook?", grammar: {"point": "Imperatives", "example": "Cut the vegetables. Fry the egg."}, value: "Teamwork" },
                21: { title: "Special Clothes", vocab: ["Uniform", "Dress", "Suit", "Sampot", "Wedding", "Wear", "Special", "Colourful"], story: "I wear my school uniform every day. At a wedding, my mother wears a colourful sampot, and my father wears a suit. Special days need special clothes!", question: "What do you wear on special days?", grammar: {"point": "Present continuous (wearing)", "example": "She is wearing a dress. He is wearing a suit."}, value: "Tradition" },
                22: { title: "Classroom Rules", vocab: ["Rules", "Listen", "Raise hand", "Quiet", "Share", "Respect", "Late", "Must"], story: "Our class has rules. We must listen to the teacher and raise our hand to speak. We must be quiet in tests, share with friends, and not be late.", question: "What is your favourite classroom rule?", grammar: {"point": "Must / mustn't", "example": "We must listen. We mustn't run in class."}, value: "Respect" },
                23: { title: "Games at Break Time", vocab: ["Break time", "Tag", "Skip", "Rope", "Hide and seek", "Catch", "Team", "Rules"], story: "At break time we play games. Some friends play tag, and some skip with a rope. We play hide and seek and follow the rules so everyone has fun.", question: "What games do you play at break time?", grammar: {"point": "Like + verb-ing", "example": "I like skipping. She likes playing tag."}, value: "Fair Play" },
                24: { title: "Cartoons and Movies", vocab: ["Cartoon", "Movie", "Character", "Funny", "Exciting", "Scary", "Watch", "Favourite"], story: "I like to watch cartoons on Saturday. My favourite character is a funny rabbit. My brother likes exciting movies, but I don't like scary ones.", question: "What is your favourite cartoon? Why?", grammar: {"point": "Adjectives for opinions", "example": "It's funny. It's exciting. It's scary."}, value: "Balance" },
                25: { title: "Review: My Year So Far", vocab: ["Remember", "Learn", "Favourite", "Lesson", "Friend", "Proud", "Improve", "Next"], story: "Let's remember what we learned! My favourite lesson was the Water Festival. I made a new friend and I am proud of my English. Next, I want to improve my writing.", question: "What are you proud of this year?", grammar: {"point": "I learned... / I want to...", "example": "I learned new words. I want to write better."}, value: "Reflection" },
            },
            'A2': {
                1: { title: "Daily Routines", vocab: ["Wake up", "Get dressed", "Brush teeth", "Homework", "Bedtime", "Alarm clock", "Shower", "Uniform", "Bus stop", "On foot", "Late", "Punctual"], story: "My alarm clock rings at 6 o'clock. I wake up, get dressed and brush my teeth. After school, I do my homework before bedtime.", question: "Describe your typical school day.", grammar: { point: "Present simple routines", example: "I wake up at 6. I do my homework after school." }, value: "Discipline" },
                2: { title: "Jobs & Occupations", vocab: ["Engineer", "Farmer", "Nurse", "Pilot", "Shopkeeper", "Scientist", "Electrician", "Mechanic", "Librarian", "Journalist", "Dentist", "Accountant"], story: "My uncle is an engineer, and my aunt is a nurse. I want to be a scientist when I grow up.", question: "What job would you like to have in the future?", grammar: { point: "want to be a...", example: "I want to be a pilot. She wants to be a farmer." }, value: "Hard Work" },
                3: { title: "Sports & Games", vocab: ["Team", "Competition", "Win", "Lose", "Practice", "Referee", "Cheer", "Score", "Tournament", "Coach", "Stadium", "Whistle"], story: "Our school team practices every week. Last week, we won a competition, but we sometimes lose too.", question: "What sport do you enjoy playing?", grammar: { point: "Past simple (regular)", example: "We practiced yesterday. We won the game." }, value: "Teamwork" },
                4: { title: "Nature & Environment", vocab: ["Forest", "River", "Pollution", "Recycle", "Protect", "Wildlife", "Species", "Endangered", "Habitat loss", "Plant a tree", "Clean energy", "Litter"], story: "We must protect the forest and the river from pollution. Our class learned how to recycle to help wildlife.", question: "How can we protect the environment?", grammar: { point: "should / must", example: "We should recycle. We must protect wildlife." }, value: "Caring for Nature" },
                5: { title: "Travel & Transport", vocab: ["Airport", "Passport", "Journey", "Luggage", "Ticket", "Map", "Delay", "Departure", "Arrival", "Customs", "Destination", "Backpack"], story: "At the airport, we showed our passports and tickets. Our journey took five hours with a lot of luggage.", question: "What is the best way to travel long distances?", grammar: { point: "going to (future plans)", example: "We are going to travel next month." }, value: "Open-mindedness" },
                6: { title: "Feelings & Opinions", vocab: ["Excited", "Nervous", "Proud", "Disappointed", "Agree", "Disagree", "Grateful", "Jealous", "Confused", "Relieved", "Hopeful", "Curious"], story: "I felt nervous before the test, but proud after I passed. I agree that studying helps us succeed.", question: "How do you feel before an important test?", grammar: { point: "I think / I agree", example: "I think it is important. I agree with you." }, value: "Respectful Disagreement" },
                7: { title: "School Life", vocab: ["Principal", "Classmate", "Exam", "Grade", "Uniform", "Library", "Classroom", "Canteen", "Corridor", "Notice board", "Sports day", "Field trip"], story: "Our principal visited our class before the exam. My classmates and I studied together in the library.", question: "What do you like most about your school?", grammar: { point: "Comparatives", example: "This exam is harder than the last one." }, value: "Cooperation" },
                8: { title: "Technology Basics", vocab: ["Computer", "Tablet", "App", "Password", "Website", "Video call", "Keyboard", "Monitor", "Charger", "Update", "Upload", "Notification"], story: "I use a tablet to study with apps. I always keep my password secret and visit safe websites.", question: "What app or website helps you learn?", grammar: { point: "should / shouldn't", example: "You should keep your password secret. You shouldn't share it." }, value: "Online Safety" },
                9: { title: "Cooking & Recipes", vocab: ["Recipe", "Ingredient", "Boil", "Fry", "Mix", "Bake", "Chop", "Peel", "Stir", "Season", "Serve", "Leftovers"], story: "My mother follows a recipe to bake a cake. First, we mix the ingredients, then bake it in the oven.", question: "What is your favorite dish to cook or eat?", grammar: { point: "Sequencing words", example: "First, mix the ingredients. Then, bake the cake." }, value: "Patience" },
                10: { title: "Animals & Habitats", vocab: ["Habitat", "Jungle", "Desert", "Ocean", "Nest", "Predator", "Coral reef", "Savanna", "Mammal", "Reptile", "Migrate", "Camouflage"], story: "Lions live on the savanna, while camels live in the desert. Birds build a nest to protect their eggs.", question: "Which animal habitat is the most interesting to you?", grammar: { point: "Present simple (facts)", example: "Lions live on the savanna. Fish live in the ocean." }, value: "Protecting Wildlife" },
                11: { title: "Seasons & Climate", vocab: ["Spring", "Summer", "Autumn", "Winter", "Temperature", "Humid", "Monsoon", "Drought", "Forecast", "Thermometer", "Breeze", "Storm warning"], story: "In summer, the temperature is high and it feels humid. In winter, the weather turns cold.", question: "Which season do you like best and why?", grammar: { point: "Comparative adjectives", example: "Summer is hotter than winter." }, value: "Adaptability" },
                12: { title: "Money & Shopping", vocab: ["Budget", "Save", "Spend", "Discount", "Receipt", "Currency", "Coupon", "Bargain", "Refund", "Cashier", "Warranty", "Invoice"], story: "I try to save some of my pocket money instead of spending it all. I keep every receipt.", question: "How do you manage your pocket money?", grammar: { point: "Quantifiers", example: "I save a little money. I don't spend much." }, value: "Saving Wisely" },
                13: { title: "Health & Fitness", vocab: ["Exercise", "Balanced diet", "Strength", "Stamina", "Stretch", "Warm up", "Endurance", "Flexibility", "Posture", "Hydrate", "Injury", "Recovery"], story: "Before exercise, I always warm up and stretch. A balanced diet gives me strength and stamina.", question: "What do you do to stay fit?", grammar: { point: "Advice with should", example: "You should warm up before exercise." }, value: "Perseverance" },
                14: { title: "Friendship", vocab: ["Trust", "Loyal", "Support", "Forgive", "Share", "Understand", "Reliable", "Honest", "Generous", "Encourage", "Apologize", "Reunite"], story: "A good friend is loyal and supports you. True friends trust each other and forgive mistakes.", question: "What makes a good friend?", grammar: { point: "Relative pronoun who", example: "A friend who is loyal will support you." }, value: "Loyalty" },
                15: { title: "Holidays & Celebrations", vocab: ["Holiday", "Festival", "Custom", "Gather", "Decorate", "Feast", "Lantern", "Firework", "Parade", "Reunion", "Ancestor", "Ritual"], story: "During the festival, our family gathers to decorate the house and enjoy a big feast together.", question: "Describe your favorite holiday tradition.", grammar: { point: "Present continuous for plans", example: "We are decorating the house for the festival." }, value: "Togetherness" },
                16: { title: "My Community", vocab: ["Neighbor", "Cooperate", "Volunteer", "Support", "Clean up", "Together", "Charity", "Donate", "Elderly", "Disability", "Inclusive", "Neighborhood watch"], story: "Our neighbors cooperate to clean up the park every month. We volunteer together to support each other.", question: "How does your community work together?", grammar: { point: "let's / we should", example: "Let's clean up the park. We should support our neighbors." }, value: "Helping Others" },
                17: { title: "Emotions & Expressing Feelings", vocab: ["Feel", "Nervous", "Confident", "Calm", "Frustrated", "Relieved", "Express", "Understand"], story: "Everyone feels different emotions every day. Sometimes I feel nervous before a test, but I try to stay calm. When something is hard, I might feel frustrated, but I feel relieved once it's done. It's important to express your feelings so others can understand you.", question: "How do you usually feel before a big test, and what helps you calm down?", grammar: { point: "I feel + adjective + when...", example: "I feel nervous when I speak in public." }, value: "Self-Awareness" },
                18: { title: "My Dream Job", vocab: ["Dream job", "Skill", "Passion", "Career", "Goal", "Ambition", "Talent", "Future"], story: "Everyone has a dream job they imagine for their future. Mine requires a special skill and a lot of passion. I set goals and work on my talent every day, because ambition helps turn dreams into a real career.", question: "What is your dream job, and what skill do you need to achieve it?", grammar: { point: "I want to become a...", example: "I want to become a doctor. I want to become an engineer." }, value: "Ambition" },
                19: { title: "Local Places & Landmarks", vocab: ["Landmark", "Monument", "Museum", "Historic", "Visit", "Local", "Famous", "Tourist"], story: "Every town has famous landmarks worth a visit. A historic monument or museum can teach visitors about local culture. Tourists often travel far just to see a famous landmark.", question: "What is a famous landmark in your town or country?", grammar: { point: "There is/are + landmark", example: "There is a famous museum in my city." }, value: "Cultural Pride" },
            },
            'B1': {
                1: { title: "Technology & Media", vocab: ["Device", "Internet", "Social media", "Download", "Screen time", "Invention", "Smartphone", "Laptop", "Streaming", "Wifi", "Update app", "Privacy"], story: "Technology has changed how we learn and communicate. Too much screen time on social media can be unhealthy, though.", question: "How does technology help you learn?", grammar: { point: "Present perfect", example: "Technology has changed our lives. I have learned a lot online." }, value: "Balance" },
                2: { title: "Culture & Festivals", vocab: ["Tradition", "Celebration", "Costume", "Ceremony", "Custom", "Heritage", "Parade", "Lantern festival", "Folk dance", "Handicraft", "Local cuisine", "Generation"], story: "Every year, our village holds a celebration to honor our traditions. We wear special costumes during the ceremony.", question: "Describe a festival celebrated in your country.", grammar: { point: "used to", example: "We used to celebrate every spring. People used to wear traditional clothes." }, value: "Respect for Heritage" },
                3: { title: "Health & Safety", vocab: ["Accident", "Emergency", "First aid", "Prevent", "Injury", "Hospitalized", "Ambulance", "Bandage", "Fire extinguisher", "Evacuate", "Warning sign", "CPR"], story: "Learning first aid can help prevent injuries from becoming serious. In an emergency, always stay calm.", question: "What should you do in an emergency?", grammar: { point: "if + present, will + verb", example: "If you get hurt, you will need first aid." }, value: "Care for Others" },
                4: { title: "Future Plans", vocab: ["Goal", "Achieve", "Career", "Ambition", "Opportunity", "Challenge", "Milestone", "Aspiration", "Long-term plan", "Resolution", "Progress report", "Vision"], story: "My goal is to achieve a good career. Every challenge is also an opportunity to grow.", question: "What is one goal you want to achieve this year?", grammar: { point: "will / going to (predictions)", example: "I will achieve my goal. I am going to work hard." }, value: "Determination" },
                5: { title: "Problem Solving", vocab: ["Solution", "Challenge", "Decision", "Consider", "Option", "Result", "Brainstorm", "Compromise", "Root cause", "Trial and error", "Feasible", "Prioritize"], story: "When we face a challenge, we should consider every option before making a decision. The result is often better.", question: "How do you solve a difficult problem?", grammar: { point: "First conditional review", example: "If we consider all options, we will find a good solution." }, value: "Critical Thinking" },
                6: { title: "Global Citizenship", vocab: ["Community", "Volunteer", "Responsibility", "Diversity", "Cooperation", "Respect", "Charity drive", "Cultural exchange", "Human rights", "Equality", "Advocacy", "Solidarity"], story: "Being a good global citizen means respecting diversity and helping our community through volunteering.", question: "How can young people help their community?", grammar: { point: "modal verbs of obligation", example: "We should respect others. We must cooperate with our community." }, value: "Global Responsibility" },
                7: { title: "Environment & Climate Change", vocab: ["Greenhouse gas", "Deforestation", "Carbon footprint", "Renewable", "Temperature rise", "Sustainable", "Wildfire", "Drought", "Emission", "Solar panel", "Wind turbine", "Biodiversity"], story: "Deforestation and greenhouse gases increase temperature rise. Choosing renewable energy reduces our carbon footprint.", question: "What can students do to help fight climate change?", grammar: { point: "Passive voice", example: "Forests are being cut down. Renewable energy is being used more." }, value: "Sustainability" },
                8: { title: "Media Literacy", vocab: ["Source", "Fake news", "Reliable", "Bias", "Fact-check", "Headline", "Journalist", "Editorial", "Credible", "Propaganda", "Broadcast", "Viral"], story: "Before sharing a headline, I always fact-check the source to make sure it is reliable, not fake news.", question: "How can you tell if a news story is reliable?", grammar: { point: "Modal of possibility", example: "This news might be fake. It could be biased." }, value: "Truthfulness" },
                9: { title: "Work & Careers", vocab: ["Application", "Resume", "Skill", "Employer", "Salary", "Internship", "Qualification", "Probation", "Colleague", "Deadline", "Overtime", "Contract"], story: "To get an internship, you need a good resume and useful skills. Employers look for hard-working applicants.", question: "What career are you interested in and why?", grammar: { point: "Present perfect continuous", example: "I have been preparing my resume for a week." }, value: "Professionalism" },
                10: { title: "Travel Experiences", vocab: ["Itinerary", "Accommodation", "Souvenir", "Culture shock", "Explore", "Adventure", "Layover", "Currency exchange", "Local guide", "Landmark", "Excursion", "Jet lag"], story: "Our itinerary included a homestay for accommodation. Exploring a new culture was a real adventure.", question: "Describe a memorable travel experience.", grammar: { point: "Past perfect", example: "We had already booked our accommodation before we left." }, value: "Curiosity" },
                11: { title: "Education & Learning", vocab: ["Curriculum", "Assignment", "Motivation", "Concentration", "Achievement", "Self-study", "Tutor", "Scholarship", "Revision", "Distraction", "Deadline", "Plagiarism"], story: "Staying motivated helps with concentration during self-study. Every small achievement builds confidence.", question: "What helps you stay motivated to study?", grammar: { point: "Gerunds after prepositions", example: "I am good at self-study. She is interested in learning new things." }, value: "Lifelong Learning" },
                12: { title: "Sports & Competition", vocab: ["Championship", "Opponent", "Teamwork", "Strategy", "Determination", "Victory", "Underdog", "Sponsor", "Spectator", "Penalty", "Substitute", "Rivalry"], story: "Our team needed teamwork and a good strategy to beat our opponent. Determination led us to victory.", question: "What does it take to win a championship?", grammar: { point: "Superlatives", example: "This was the most exciting championship ever." }, value: "Fair Play" },
                13: { title: "Food & Nutrition", vocab: ["Nutrient", "Vitamin", "Protein", "Balanced meal", "Portion", "Calorie", "Additive", "Organic", "Allergy", "Digestion", "Hydration", "Supplement"], story: "A balanced meal has protein, vitamins and the right portion size. Counting calories helps some people.", question: "What does a healthy meal look like to you?", grammar: { point: "Countable/uncountable nouns", example: "I eat a portion of rice and some vegetables." }, value: "Healthy Living" },
                14: { title: "Communication Skills", vocab: ["Listen actively", "Body language", "Clarify", "Interrupt", "Feedback", "Confidence", "Empathize", "Negotiate", "Mediate", "Persuasive", "Assertive", "Diplomacy"], story: "Good communication means listening actively and reading body language. Give feedback with confidence, without interrupting.", question: "What makes someone a good communicator?", grammar: { point: "Imperatives for advice", example: "Listen actively. Don't interrupt others." }, value: "Active Listening" },
                15: { title: "History & Heritage", vocab: ["Ancient", "Monument", "Civilization", "Legacy", "Artifact", "Preserve", "Dynasty", "Colonization", "Independence", "Archive", "Excavation", "Chronicle"], story: "This ancient monument is part of our civilization's legacy. We must preserve every artifact for future generations.", question: "Why is it important to preserve historical heritage?", grammar: { point: "Past simple vs present perfect", example: "The monument was built centuries ago. It has survived many storms." }, value: "Respect for the Past" },
                16: { title: "Science in Daily Life", vocab: ["Gravity", "Energy", "Chemical reaction", "Electricity", "Observation", "Measurement", "Hypothesis", "Variable", "Data", "Analyze", "Conclusion", "Peer review"], story: "Gravity, energy and electricity are part of our daily life. Careful observation and measurement help us understand them.", question: "Give an example of science you see every day.", grammar: { point: "Cause and effect (because/so)", example: "The ball fell because of gravity, so it hit the ground." }, value: "Evidence-Based Thinking" },
                17: { title: "Digital Citizenship", vocab: ["Digital footprint", "Online safety", "Responsible", "Privacy", "Cyberbullying", "Respect", "Password", "Verify"], story: "Being a good digital citizen means acting responsibly online. Everything you post becomes part of your digital footprint, so it's important to think before sharing. Protecting your privacy with a strong password, treating others with respect, and standing against cyberbullying are all part of online safety. Always verify information before believing or sharing it.", question: "What is one rule you follow to stay safe online?", grammar: { point: "You should/shouldn't + verb", example: "You should protect your password. You shouldn't share personal information." }, value: "Digital Responsibility" },
                18: { title: "Volunteering & Community Service", vocab: ["Volunteer", "Community service", "Donate", "Charity", "Give back", "Support", "Impact", "Contribute"], story: "Volunteering is a great way to give back to your community. Many students contribute through community service, like helping at a charity or supporting a local shelter. Even a small donation can make a real impact when many people work together.", question: "Have you ever volunteered or helped your community? What did you do?", grammar: { point: "By + gerund, you can...", example: "By volunteering, you can help your community." }, value: "Generosity" },
                19: { title: "Personal Finance Basics", vocab: ["Budget", "Save", "Spend", "Income", "Expense", "Bank account", "Interest", "Financial goal"], story: "Understanding personal finance starts with a simple budget. It helps you track your income and expenses, so you know how much to save and how much to spend. Keeping money in a bank account can even earn interest over time, helping you reach a financial goal.", question: "What is one financial goal you would like to save for?", grammar: { point: "If I save..., I will be able to...", example: "If I save $10 every week, I will be able to buy a bike." }, value: "Financial Literacy" },
            },
            'B2': {
                1: { title: "Science & Discovery", vocab: ["Experiment", "Hypothesis", "Evidence", "Discovery", "Research", "Innovation", "Peer-reviewed", "Empirical", "Theory", "Lab technician", "Control group", "Replicate"], story: "Scientists form a hypothesis, then run experiments to gather evidence. Every discovery leads to new research and innovation.", question: "What scientific discovery do you find most interesting?", grammar: { point: "Passive voice", example: "The experiment was conducted carefully. New evidence was discovered." }, value: "Intellectual Honesty" },
                2: { title: "Social Issues", vocab: ["Inequality", "Poverty", "Awareness", "Advocate", "Reform", "Impact", "Marginalized", "Social justice", "Grassroots", "Policy reform", "Discrimination", "Empowerment"], story: "Raising awareness about poverty and inequality can lead to real reform. Every voice can have an impact.", question: "What social issue do you care about most?", grammar: { point: "Relative clauses", example: "Poverty is an issue that affects many families." }, value: "Compassion" },
                3: { title: "Arts & Creativity", vocab: ["Imagination", "Inspiration", "Masterpiece", "Expression", "Creativity", "Perspective", "Abstract art", "Aesthetic", "Improvisation", "Symbol", "Avant-garde", "Critique"], story: "Art is a form of expression that comes from imagination and inspiration. Every artist has a unique perspective.", question: "How does art help people express themselves?", grammar: { point: "Gerunds as subjects", example: "Creating art helps people express their feelings." }, value: "Self-Expression" },
                4: { title: "Career & Ambition", vocab: ["Ambition", "Qualification", "Interview", "Promotion", "Skillset", "Leadership", "Networking", "Mentor", "Work-life balance", "Entrepreneurship", "Portfolio", "Negotiation"], story: "To achieve your ambition, you need the right qualifications and skillset. Strong leadership can lead to promotion.", question: "What skills are important for your future career?", grammar: { point: "Third conditional", example: "If I had prepared more, I would have passed the interview." }, value: "Ambition with Integrity" },
                5: { title: "Environment & Sustainability", vocab: ["Sustainability", "Renewable", "Ecosystem", "Climate change", "Conservation", "Footprint", "Carbon neutral", "Deforestation rate", "Green technology", "Circular economy", "Biodegradable", "Emission target"], story: "Sustainability means protecting the ecosystem for future generations. Renewable energy helps reduce our carbon footprint.", question: "What can individuals do to fight climate change?", grammar: { point: "Causative have/get", example: "We should get our habits changed to help the environment." }, value: "Stewardship" },
                6: { title: "Critical Thinking & Debate", vocab: ["Argument", "Evidence", "Perspective", "Persuade", "Counterargument", "Conclusion", "Rebuttal", "Logical fallacy", "Moderator", "Panel discussion", "Cross-examine", "Verdict"], story: "A strong argument uses evidence to persuade others. Considering the counterargument leads to a fair conclusion.", question: "Why is it important to consider different perspectives?", grammar: { point: "Reported speech", example: "She said that evidence was important. He argued that we should listen." }, value: "Open-mindedness" },
                7: { title: "Globalization", vocab: ["Interconnected", "Trade", "Multinational", "Cultural exchange", "Global market", "Interdependence", "Outsourcing", "Globalized economy", "Cultural identity", "Migration", "Tariff", "Diplomacy"], story: "Globalization has made the world more interconnected through trade and cultural exchange between nations.", question: "What are the advantages and disadvantages of globalization?", grammar: { point: "Concessive clauses (although)", example: "Although globalization connects economies, it can also increase inequality." }, value: "Global Awareness" },
                8: { title: "Ethics & Values", vocab: ["Integrity", "Moral dilemma", "Honesty", "Fairness", "Empathy", "Accountability", "Responsibility", "Hypocrisy", "Consequence", "Justify", "Principle", "Conscience"], story: "Facing a moral dilemma requires integrity and honesty. Empathy and fairness guide accountable decisions.", question: "Describe a situation where you had to make an ethical decision.", grammar: { point: "Mixed conditionals", example: "If I had more empathy, I would understand the situation better now." }, value: "Integrity" },
                9: { title: "Innovation & Technology", vocab: ["Artificial intelligence", "Automation", "Breakthrough", "Prototype", "Disruption", "Efficiency", "Algorithm", "Startup", "Venture capital", "Scalable", "Prototype testing", "Disruptive"], story: "Artificial intelligence and automation are causing disruption in many industries, but also improving efficiency.", question: "How do you think technology will change in the next ten years?", grammar: { point: "Future continuous/perfect", example: "By 2030, AI will have transformed many industries." }, value: "Responsible Innovation" },
                10: { title: "Literature & Storytelling", vocab: ["Narrative", "Character development", "Theme", "Metaphor", "Plot twist", "Symbolism", "Protagonist", "Antagonist", "Foreshadowing", "Allegory", "Irony", "Climax"], story: "A strong narrative depends on character development, theme, and sometimes a surprising plot twist.", question: "What is your favorite book and what makes its story powerful?", grammar: { point: "Reported speech", example: "The author said that symbolism adds deeper meaning to a story." }, value: "Imagination" },

        const LEVELS_ORDER = ['PreA1', 'A1', 'A2', 'B1', 'B2'];

        // ===== Progress: stars/badges are earned once per activity and remembered =====
        // Saved in this browser when the page is opened as a normal web page. Inside the Hub's
        // secure "Embed Code" box the browser blocks storage, so progress then lasts until the
        // page is closed — but it still can't be farmed by tapping the same button again.
        const PROGRESS_KEY = () => 'c2epe_onlineclass_primary_progress_' + state.level + '_book2';
        let progress = { stars: 0, badges: 0, awarded: {}, best: {} };
        function loadProgress() {
            progress = { stars: 0, badges: 0, awarded: {}, best: {} };
            try {
                const saved = JSON.parse(localStorage.getItem(PROGRESS_KEY()) || 'null');
                if (saved && typeof saved === 'object') progress = Object.assign(progress, saved);
            } catch (e) { /* storage not available (e.g. inside the Hub sandbox) */ }
            state.stars = progress.stars; state.badges = progress.badges;
            document.getElementById('star-count').textContent = state.stars;
            document.getElementById('badge-count').textContent = state.badges;
        }
        function saveProgress() {
            progress.stars = state.stars; progress.badges = state.badges;
            try { localStorage.setItem(PROGRESS_KEY(), JSON.stringify(progress)); } catch (e) {}
        }
        const unitKey = (what) => 'u' + state.unit + '|' + what;
        const wasAwarded = (key) => !!progress.awarded[state.level + '|' + key];
        // Gives stars only the first time an activity is done. Returns true if stars were given.
        function award(key, amount) {
            const k = state.level + '|' + key;
            if (progress.awarded[k]) return false;
            progress.awarded[k] = true;
            addStars(amount);
            return true;
        }
        // Shows "(+3 ⭐)" the first time, and a friendly note afterwards
        const starNote = (given, amount) => given ? ` (+${amount} ⭐)` : ' (stars already earned)';

        function isRecentlyAdded(dateStr) {
            if (!dateStr) return false;
            const added = new Date(dateStr);
            if (isNaN(added.getTime())) return false;
            const daysSince = (Date.now() - added.getTime()) / (1000 * 60 * 60 * 24);
            return daysSince >= 0 && daysSince <= 7;
        }

        function populateUnitSelect() {
            const sel = document.getElementById('unit-select');
            const levelData = curriculum[state.level];
            const prevUnit = state.unit;
            const unitCount = Object.keys(levelData).length;
            const labelEl = document.getElementById('unit-select-label');
            if (labelEl) labelEl.textContent = `Select Unit (1 to ${unitCount})`;
            // 🎬 = this unit has a video · 🆕 = video added in the last 7 days
            sel.innerHTML = Object.keys(levelData).map(u => {
                const v = videoFor(state.level, u);
                const mark = v ? (isRecentlyAdded(v.dateAdded) ? ' 🆕' : ' 🎬') : '';
                return `<option value="${u}">Unit ${u}: ${levelData[u].title}${mark}</option>`;
            }).join('');
            if (levelData[prevUnit]) {
                sel.value = prevUnit;
                state.unit = prevUnit;
            } else {
                state.unit = parseInt(sel.value);
            }
        }

        function selectLevel(lvl) {
            state.level = lvl;
            document.querySelectorAll('.level-btn').forEach(b => {
                b.classList.remove('bg-blue-700', 'text-white', 'shadow');
                b.classList.add('bg-gray-100');
            });
            const btn = document.getElementById('btn-' + lvl);
            if (btn) { btn.classList.remove('bg-gray-100'); btn.classList.add('bg-blue-700', 'text-white', 'shadow'); }
            document.getElementById('current-level-display').textContent = lvl;
            loadProgress();
            populateUnitSelect();
            renderContent();
        }

        // On phones the lesson sits below the module list, so after choosing a module, a unit
        // or the next lesson, the page scrolls to the lesson by itself.
        const isPhone = () => window.matchMedia('(max-width: 767px)').matches;
        function scrollToLesson(always) {
            const area = document.getElementById('content-area');
            if (!area) return;
            if (!(isPhone() || (always && area.getBoundingClientRect().top < 0))) return;
            // Wait for the new lesson to be drawn, then glide to it; some phones stop a smooth
            // scroll that starts during the tap, so if it hasn't arrived, jump there directly.
            setTimeout(() => {
                area.scrollIntoView({ behavior: 'smooth', block: 'start' });
                setTimeout(() => { if (Math.abs(area.getBoundingClientRect().top) > 40) area.scrollIntoView({ block: 'start' }); }, 700);
            }, 60);
        }
        function jumpToModules() {
            const side = document.getElementById('module-sidebar');
            side.scrollIntoView({ behavior: 'smooth', block: 'start' });
            setTimeout(() => { if (Math.abs(side.getBoundingClientRect().top) > 40) side.scrollIntoView({ block: 'start' }); }, 700);
        }

        function updateUnit() {
            state.unit = parseInt(document.getElementById('unit-select').value);
            renderContent();
            scrollToLesson();
        }

        function highlightActiveTab() {
            document.querySelectorAll('.tab-btn').forEach(b => {
                b.classList.remove('bg-blue-50', 'text-blue-700');

        // Safe inside onclick="...('here')": escapes backslashes, single quotes and double quotes

            return String(s).replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '&quot;');
        }
        const escapeHtml = (s) => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

        // Splits a story into sentences. (Written without "look-behind" regex, which older
        // iPhones — before iOS 16.4 — cannot read and which made the whole page stop there.)
        function splitSentences(text) {
            return (String(text).match(/[^.!?]+[.!?]+["')]*|[^.!?]+$/g) || []).map(s => s.trim()).filter(Boolean);
        }

        // ---------- Helper: Text-to-Speech (voices load a moment after the page opens) ----------
        let enVoice = null;
        function pickVoice() {
            if (!('speechSynthesis' in window)) return;
            enVoice = window.speechSynthesis.getVoices().find(v => v.lang && v.lang.startsWith('en')) || null;
        }
        if ('speechSynthesis' in window) { pickVoice(); window.speechSynthesis.onvoiceschanged = pickVoice; }
        function speak(text, onEnd) {
            if (!('speechSynthesis' in window)) { if (onEnd) onEnd(false); return false; }
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(text);
            u.lang = 'en-US';
            u.rate = 0.9;
            if (!enVoice) pickVoice();
            if (enVoice) u.voice = enVoice;
            if (onEnd) u.onend = () => onEnd(true);
            window.speechSynthesis.speak(u);
            return true;
        }

        function shuffle(arr) {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        function allVocabForLevel(level) {
            let words = [];
            Object.keys(curriculum[level]).forEach(u => words.push(...curriculum[level][u].vocab));
            return [...new Set(words)];
        }

        // ---------- Pictures ----------
        // When two words in the SAME unit would show the same picture, the second one gets its
        // own picture here (only inside that unit), so children can tell them apart.
        const SAME_UNIT_ALT = {
            "Goodbye": "🚶👋", "Thank you": "💝", "Sorry": "😔", "Respect": "🫡", "Tomorrow": "⏭️",
            "West": "🌇", "East": "🌄", "North": "🧭", "Between": "🥪", "Early": "🐓", "Late": "⏰",
            "Swing": "🎠", "Poster": "🪧"
        };
        function baseEmoji(word) { return WORD_EMOJI[word] || '🖼️'; }
        function emojiFor(word, unitData) {
            const u = unitData || curriculum[state.level][state.unit];
            const e = baseEmoji(word);
            if (u && SAME_UNIT_ALT[word] && u.vocab.some(w => w !== word && baseEmoji(w) === e)) return SAME_UNIT_ALT[word];
            return e;
        }
        // Wrong answers for "look at the picture" questions never share the right answer's
        // picture, so there is always exactly one correct choice.
        function pictureDistractors(correct, pool, unitData, n) {
            const pic = emojiFor(correct, unitData);
            const ok = (w) => w !== correct && emojiFor(w, unitData) !== pic;
            let list = shuffle([...new Set(pool)].filter(ok)).slice(0, n);
            if (list.length < n) {
                const extra = shuffle(allVocabForLevel(state.level).filter(w => ok(w) && !list.includes(w)));
                list = list.concat(extra.slice(0, n - list.length));
            }
            return list;
        }

        // English subtitles: added to the player with code, so no subtitle files are needed online.
        let subsOn = true;
        function addSubtitles(el) {
            const cues = SUBTITLES[(el.getAttribute('src') || '').split('/').pop().split('?')[0].replace('.mp4', '')]; const btn = document.getElementById('subs-btn');
            if (!cues || !el.addTextTrack || typeof VTTCue === 'undefined') { if (btn) btn.style.display = 'none'; return; }
            const tr = el.addTextTrack('subtitles', 'English', 'en');
            cues.forEach(c => { try { const q = new VTTCue(c[0], c[1], c[2]); q.line = -2; tr.addCue(q); } catch (e) {} });
            const apply = () => { tr.mode = subsOn ? 'showing' : 'hidden'; if (btn) btn.textContent = subsOn ? '💬 Subtitles: ON' : '💬 Subtitles: OFF'; };
            if (btn) btn.onclick = () => { subsOn = !subsOn; apply(); };
            apply();
        }
        function renderMp4Lesson(contentDiv, unitData) {
            contentDiv.innerHTML = `
                <h2 class="text-xl font-bold text-indigo-900 mb-2">📹 Video Lesson — Unit ${state.unit}: ${unitData.title}</h2>
                <p class="text-gray-600 mb-4">${ytCurrentConfig.checkpoints.length ? 'Watch the video. It will pause at a few points so you can answer a quick question!' : 'Watch Ms. Sarah and Rithy, then try the other learning modules!'}</p>
                <div class="relative bg-black rounded-2xl overflow-hidden" style="aspect-ratio:16/9;">
                    <video id="mp4-player" src="${ytCurrentConfig.mp4}" controls playsinline preload="metadata" class="w-full h-full" style="object-fit:contain;"></video>
                    <div id="checkpoint-overlay" class="absolute inset-0 bg-indigo-900/95 flex items-center justify-center p-6" style="display:none;"></div>
                </div>
                <p id="video-msg" class="text-sm text-gray-500 mt-3 text-center min-h-[1.25rem]">▶️ Press play to start the lesson!</p>
                <div class="text-center mt-2 flex justify-center gap-3 flex-wrap"><button id="subs-btn" class="bg-white border border-indigo-300 text-indigo-700 font-bold px-4 py-2 rounded-full shadow cursor-pointer">💬 Subtitles: ON</button><button onclick="nextLesson()" class="bg-emerald-700 hover:bg-emerald-800 text-white font-bold px-4 py-2 rounded-full shadow cursor-pointer">Next Lesson ▶️</button></div>`;
            const el = document.getElementById('mp4-player');
            addSubtitles(el);
            { const a = document.getElementById('footer-next-module'), b = document.getElementById('footer-next-lesson'); if (a) a.style.display = ''; if (b) b.style.display = 'none'; }
            ytPlayer = {
                getCurrentTime: () => el.currentTime,
                pauseVideo: () => el.pause(),
                playVideo: () => { const p = el.play(); if (p && p.catch) p.catch(() => {}); },
                destroy: () => { try { el.pause(); el.removeAttribute('src'); el.load(); } catch (e) {} }
            };
            el.addEventListener('play', () => { const m = document.getElementById('video-msg'); if (m) m.textContent = ''; });
            el.addEventListener('timeupdate', () => { if (ytCurrentConfig && ytCurrentConfig.checkpoints.length) checkVideoCheckpoints(); });
            el.addEventListener('ended', () => {
                const got = award(unitKey('video-' + ytCurrentConfig.id), 5);
                const m = document.getElementById('video-msg');
                if (m) m.textContent = '🎉 Great job watching the whole video!' + (got ? ' (+5 ⭐)' : '');
            });
            el.addEventListener('error', () => {
                const m = document.getElementById('video-msg');
                if (m) m.innerHTML = '⚠️ The video could not load. Check the internet, or <a href="' + ytCurrentConfig.mp4 + '" target="_blank" rel="noopener" class="text-indigo-600 underline font-semibold">open it here ↗</a>';
            });
        }

        function onYtStateChange(event) {
            const msg = document.getElementById('video-msg');
            if (event.data === YT.PlayerState.PLAYING) {
                if (ytPollInterval) clearInterval(ytPollInterval);
                if (ytCurrentConfig && ytCurrentConfig.checkpoints.length) ytPollInterval = setInterval(checkVideoCheckpoints, 400);
                if (msg) msg.textContent = '';
            } else if (event.data === YT.PlayerState.PAUSED || event.data === YT.PlayerState.ENDED) {
                if (ytPollInterval) { clearInterval(ytPollInterval); ytPollInterval = null; }
                if (event.data === YT.PlayerState.ENDED) {
                    const got = award(unitKey('video-' + ytCurrentConfig.id), 5);
                    if (msg) msg.textContent = '🎉 Great job watching the whole video!' + (got ? ' (+5 ⭐)' : '');
                }
            }
        }

        function checkVideoCheckpoints() {
            if (!ytPlayer || typeof ytPlayer.getCurrentTime !== 'function' || !ytCurrentConfig) return;
            let t = 0;
            try { t = ytPlayer.getCurrentTime(); } catch (e) { return; }
            ytCurrentConfig.checkpoints.forEach((cp, idx) => {
                if (!ytAnsweredCheckpoints.has(idx) && t >= cp.time) {
                    ytAnsweredCheckpoints.add(idx);
                    showVideoCheckpoint(idx);
                }
            });
        }

        function showVideoCheckpoint(idx) {
            const cp = ytCurrentConfig.checkpoints[idx];
            ytPlayer.pauseVideo();
            if (ytPollInterval) { clearInterval(ytPollInterval); ytPollInterval = null; }
            const overlay = document.getElementById('checkpoint-overlay');
            overlay.style.display = 'flex';
            overlay.innerHTML = `
                <div class="bg-white rounded-2xl p-6 max-w-md w-full text-center">
                    <p class="text-sm font-bold text-indigo-600 mb-2">🤔 Quick Question!</p>
                    <p class="font-bold text-lg text-gray-800 mb-4">${cp.question}</p>
                    <div class="flex flex-col gap-2" id="checkpoint-options">
                        ${cp.options.map((opt, i) => `<button onclick="answerVideoCheckpoint(${idx}, ${i})" class="bg-indigo-50 hover:bg-indigo-100 text-indigo-900 font-semibold p-3 rounded-xl cursor-pointer">${opt}</button>`).join('')}
                    </div>
                    <p id="checkpoint-feedback" class="mt-3 font-bold min-h-[1.5rem]"></p>
                </div>`;
        }

        function answerVideoCheckpoint(idx, chosenIndex) {
            const cp = ytCurrentConfig.checkpoints[idx];
            const feedback = document.getElementById('checkpoint-feedback');
            const optionsDiv = document.getElementById('checkpoint-options');
            optionsDiv.querySelectorAll('button').forEach(b => b.disabled = true);
            if (chosenIndex === cp.correct) {
                feedback.className = 'mt-3 font-bold min-h-[1.5rem] text-green-600';
                feedback.textContent = award(unitKey('video-' + ytCurrentConfig.id + '-q' + idx), 2) ? '🎉 Correct! (+2 ⭐)' : '🎉 Correct!';
            } else {
                feedback.className = 'mt-3 font-bold min-h-[1.5rem] text-red-500';
                feedback.textContent = `❌ Not quite — the answer was "${cp.options[cp.correct]}"`;
            }
            const nextBtn = document.createElement('button');
            nextBtn.textContent = 'Next ▶️';
            nextBtn.className = 'mt-4 bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-6 py-2 rounded-full shadow cursor-pointer';
            nextBtn.onclick = resumeVideoAfterCheckpoint;
            feedback.insertAdjacentElement('afterend', nextBtn);
        }

        function resumeVideoAfterCheckpoint() {
            document.getElementById('checkpoint-overlay').style.display = 'none';
            if (ytPlayer) ytPlayer.playVideo();
        }

        function renderContent() {
            let contentDiv = document.getElementById('module-content');
            const unitData = curriculum[state.level][state.unit];
            stopVideo();                 // never leave a video playing in the background
            updateVideoTabBadge();
            // Always shows the real level and unit (it used to say "A1" on every level)
            document.getElementById('platform-info').textContent = `C2-EPE Online Class - ${state.level} Book 2 (Unit ${state.unit}: ${unitData.title})`;
            if (state.tab === 'video') { renderVideoLesson(contentDiv); return; }

            if (state.tab === 'listening') renderListening(contentDiv, unitData);
            else if (state.tab === 'speaking') renderSpeaking(contentDiv, unitData);
            else if (state.tab === 'reading') renderReading(contentDiv, unitData);
            else if (state.tab === 'grammar') renderGrammar(contentDiv, unitData);
            else if (state.tab === 'writing') renderWriting(contentDiv, unitData);
            else if (state.tab === 'quiz') renderQuiz(contentDiv, unitData);
            else if (state.tab === 'vocabgame') renderVocabGame(contentDiv, unitData);
            else if (state.tab === 'spelling') renderSpelling(contentDiv, unitData);
            else if (state.tab === 'sentence') renderSentenceBuilding(contentDiv, unitData);
            else if (state.tab === 'roleplay') renderRolePlay(contentDiv, unitData);
            else if (state.tab === 'dictation') renderDictation(contentDiv, unitData);
            else if (state.tab === 'culture') renderCultureCorner(contentDiv, unitData);
            else if (state.tab === 'review') renderReview(contentDiv, unitData);
            else if (state.tab === 'pronunciation') renderPronunciationDrill(contentDiv, unitData);
            else if (state.tab === 'assignment') renderAssignment(contentDiv, unitData);
            else if (state.tab === 'discussion') renderDiscussion(contentDiv, unitData);
            else if (state.tab === 'exam') renderExamPractice(contentDiv, unitData);
            else if (state.tab === 'family') renderFamily(contentDiv, unitData);
        }

        // ===== 1. LISTENING (flip cards: front = word, back = picture) =====
        let listenState = { storyDone: false };
        function renderListening(contentDiv, unitData) {
            listenState = { storyDone: false };
            const supported = 'speechSynthesis' in window;
            contentDiv.innerHTML = `
                <h2 class="text-xl font-bold text-blue-900 mb-2">🔊 Listening: Unit ${state.unit} - ${unitData.title}</h2>
                <p class="text-gray-600 mb-4">Tap each card to hear it and flip to the picture!</p>
                <div class="bg-blue-50 border-2 border-dashed border-blue-300 rounded-2xl p-6">
                    <div class="grid grid-cols-2 sm:grid-cols-3 gap-3 mb-5">
                        ${unitData.vocab.map((w, i) => `
                            <div class="flip-card" id="lw-${i}" role="button" tabindex="0" onclick="playListenWord('${escapeJsStr(w)}', ${i})">
                                <div class="flip-card-inner">
                                    <div class="flip-card-front bg-white shadow font-bold text-blue-900 ${wasAwarded(unitKey('listen-' + i)) ? 'ring-4 ring-green-400' : ''}">

        // ===== 2. SPEAKING (self-practice through every word, no microphone) =====

        // ===== 3. READING =====
        // How many real words an answer needs, by level (a single letter no longer earns stars)
        const MIN_WORDS = { PreA1: 2, A1: 3, A2: 4, B1: 6, B2: 8 };

        function textCheck(msg, text, need, okText, key, amount) {

                return false;
            }
            msg.className = "text-sm mt-2 font-semibold text-green-600";
            msg.textContent = okText + starNote(award(key, amount), amount);
            return true;
        }
        function renderReading(contentDiv, unitData) {

        // ===== 4. GRAMMAR BOX =====
        function renderGrammar(contentDiv, unitData) {

            contentDiv.innerHTML = `
