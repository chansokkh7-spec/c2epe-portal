                { title: "The Garage Start-up", text: "Hewlett-Packard began in a small garage in Palo Alto, California, in 1939. The garage is now called the 'birthplace of Silicon Valley'." },
                { title: "World Mental Health Day", text: "World Mental Health Day is marked every year on 10 October. It was first held in 1992 to raise awareness and reduce the stigma around mental health." },
            ],
            Level6: [
                { title: "Self-Advocacy Traditions", text: "In the UK, Members of Parliament question the Prime Minister every week in 'Prime Minister's Questions', and on the BBC programme 'Question Time', members of the public put their questions directly to politicians. Both reflect a tradition of holding power accountable." },
                { title: "Independent Learning Systems", text: "Universities in the US and UK expect a high degree of independent study and self-direction, very different from the more teacher-directed style common in earlier schooling." },
                { title: "Social Responsibility Models", text: "Scandinavian countries like Denmark and Sweden are known for strong social welfare systems, reflecting a cultural belief that society collectively supports individual wellbeing." },
                { title: "Work Experience Traditions", text: "In Germany's 'dual education' system, students split time between classroom study and real workplace training, a model many other countries are now studying and adapting." },
                { title: "Global Food Culture", text: "UNESCO recognizes certain cuisines, like French gastronomy and Mexican cuisine, as 'Intangible Cultural Heritage,' showing how food carries deep cultural identity and meaning." },
                { title: "Social Justice Movements", text: "Movements like the Civil Rights Movement in the US and anti-apartheid movement in South Africa show how organized, youth-supported activism has changed history." },
                { title: "Tech Ethics Debates", text: "The EU's AI Act, one of the world's first major laws regulating artificial intelligence, reflects growing global debate about balancing innovation with ethical responsibility." },
                { title: "Global Citizenship Education", text: "UNESCO promotes 'Global Citizenship Education' worldwide, encouraging students to see themselves as part of an interconnected global community, not just their home country." },
                { title: "A Leader's Long Walk", text: "Nelson Mandela spent 27 years in prison for opposing apartheid. In 1994, he became South Africa's first president elected in a fully democratic election." },
                { title: "The Right to Be Forgotten", text: "In 2014, the EU's highest court ruled that people can ask search engines to remove certain links about them — often called the 'right to be forgotten'." },
                { title: "The Paris Agreement", text: "In the 2015 Paris Agreement, almost every country agreed to try to keep global warming well below 2°C, and to aim for 1.5°C." },
                { title: "Gross National Happiness", text: "Bhutan measures its progress not only by money (GDP) but also by 'Gross National Happiness', which includes health, education, culture and the environment." },
                { title: "The Global Goals", text: "In 2015, the United Nations adopted 17 Sustainable Development Goals — such as ending poverty and protecting the planet — to be reached by 2030." },
                { title: "Kintsugi", text: "In Japan, 'kintsugi' is the art of repairing broken pottery with gold. The cracks are shown, not hidden — a symbol that we can become stronger after difficult times." },
                { title: "The Pulitzer Prize", text: "The Pulitzer Prizes, first awarded in 1917 in the United States, honour excellent journalism, including reporting that uncovers the truth." },
                { title: "Learning for Life", text: "Since 2016, Singapore's 'SkillsFuture' programme has given adult citizens credit to spend on training courses, encouraging people to keep learning throughout their careers." },
                { title: "Global Rules for AI", text: "In 2021, all 193 member states of UNESCO adopted the first global agreement on the ethics of artificial intelligence." },
                { title: "The Universal Declaration", text: "The Universal Declaration of Human Rights was adopted by the United Nations on 10 December 1948. It has been translated into more languages than almost any other document." },
                { title: "Working Together in Space", text: "The International Space Station is run by five space agencies from the USA, Russia, Europe, Japan and Canada. People have lived on it continuously since November 2000." },
            ],
        };
        function renderCultureCorner(contentDiv, unitData) {
            const bank = CULTURE_BANK[state.level] || CULTURE_BANK.Level1;
            const note = bank[(state.unit - 1) % bank.length];
            contentDiv.innerHTML = `
                <h2 class="text-xl font-bold text-indigo-900 mb-2">🌍 Culture Corner</h2>
                <p class="text-gray-600 mb-4">A real fact connecting English-speaking cultures to the world.</p>
                <div class="bg-teal-50 border-2 border-dashed border-teal-300 rounded-2xl p-6">
                    <p class="font-bold text-teal-900 text-lg mb-2">${note.title}</p>
                    <p class="text-gray-800 leading-relaxed bg-white p-4 rounded-xl shadow-inner">${note.text}</p>
                    <button onclick="speak(CULTURE_BANK[state.level][(state.unit - 1) % CULTURE_BANK[state.level].length].text)" class="mt-3 text-sm text-teal-700 underline cursor-pointer">🔊 Listen</button>
                    <div class="mt-4 bg-white p-4 rounded-xl border border-teal-100">
                        <p class="font-bold text-teal-900 mb-2">💭 Reflect: How is this similar to or different from your own culture?</p>
                        <textarea id="culture-answer" rows="3" placeholder="Type your thoughts here..." class="w-full p-2 border border-gray-300 rounded-lg text-sm"></textarea>
                        <button onclick="checkCultureAnswer()" class="mt-2 bg-teal-600 hover:bg-teal-700 text-white font-bold px-4 py-2 rounded-xl shadow cursor-pointer text-sm">Save My Reflection</button>
                        <p id="culture-msg" class="text-sm mt-2 font-semibold min-h-[1.25rem]"></p>
                    </div>
                </div>`;
        }
        function checkCultureAnswer() {
            if (textCheck(document.getElementById('culture-msg'), document.getElementById('culture-answer').value, minWords(), "🌟 Thanks for reflecting!", unitKey('culture'), 3)) markActivityComplete('culture');
        }

        // ===== 17. SUMMARY WRITING =====
        function renderSummaryWriting(contentDiv, unitData) {
            contentDiv.innerHTML = `<h2 class="text-xl font-bold text-indigo-900 mb-2">📝 Summary Writing</h2>
                <p class="text-gray-600 mb-4">Read the article again, then write a short summary in your own words.</p>
                <div class="bg-slate-50 border-2 border-dashed border-indigo-300 rounded-2xl p-6">
                    <p class="text-gray-800 leading-relaxed mb-4 italic">"${unitData.story}"</p>
                    <textarea id="summary-input" rows="5" placeholder="Write your summary here (2-3 sentences)..." class="w-full p-3 rounded-xl border-2 border-indigo-300 font-medium"></textarea>
                    <button onclick="checkSummary()" class="mt-4 bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-6 py-2 rounded-full shadow cursor-pointer">✅ I wrote my summary</button>
                    <p id="summary-fb" class="mt-3 font-bold min-h-[1.5rem]"></p>
                </div>`;
        }
        // A summary should be in the student's own words, so pasting the article back is not accepted
        function checkSummary() {
            const unitData = curriculum[state.level][state.unit];
            const val = document.getElementById('summary-input').value;
            const fb = document.getElementById('summary-fb');
            const norm = (t) => String(t).toLowerCase().replace(/[^a-z0-9 ]+/g, ' ').replace(/\s+/g, ' ').trim();
            if (norm(val).length > 20 && norm(unitData.story).includes(norm(val))) {
                fb.className = 'mt-3 font-bold min-h-[1.5rem] text-amber-600';
                fb.textContent = '✏️ That is copied from the article — try saying it in your own words!';
                return;
            }
            if (textCheck(fb, val, Math.max(8, minWords() * 2), '🎉 Great summary practice!', unitKey('summary'), 3)) markActivityComplete('summary');
        }

        // ===== 18. DEBATE CORNER =====
        function renderDebateCorner(contentDiv, unitData) {
            contentDiv.innerHTML = `<h2 class="text-xl font-bold text-indigo-900 mb-2">🗣️ Debate Corner</h2>
                <p class="text-gray-600 mb-4">Based on this unit's topic, write one point FOR and one point AGAINST a related position.</p>
                <div class="bg-slate-50 border-2 border-dashed border-indigo-300 rounded-2xl p-6">
                    <p class="font-semibold text-gray-800 mb-4">💭 ${unitData.question}</p>
                    <div class="grid md:grid-cols-2 gap-4">
                        <div>
                            <label class="font-bold text-green-700 block mb-2" for="debate-for">✅ Point FOR:</label>
                            <textarea id="debate-for" rows="3" placeholder="Write a point in favor..." class="w-full p-3 rounded-xl border-2 border-green-300"></textarea>
                        </div>
                        <div>
                            <label class="font-bold text-red-700 block mb-2" for="debate-against">❌ Point AGAINST:</label>
                            <textarea id="debate-against" rows="3" placeholder="Write a point against..." class="w-full p-3 rounded-xl border-2 border-red-300"></textarea>
                        </div>
                    </div>
                    <button onclick="checkDebate()" class="mt-4 bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-6 py-2 rounded-full shadow cursor-pointer">✅ I wrote both sides</button>
                    <p id="debate-fb" class="mt-3 font-bold min-h-[1.5rem]"></p>
                </div>`;
        }
        function checkDebate() {
            const forVal = document.getElementById('debate-for').value;
            const againstVal = document.getElementById('debate-against').value;
            const fb = document.getElementById('debate-fb');
            const need = Math.max(3, minWords());
            if (countWords(forVal) < need || countWords(againstVal) < need) {
                fb.className = 'mt-3 font-bold min-h-[1.5rem] text-amber-600';
                fb.textContent = `✏️ Please write at least ${need} words for each side.`;
                return;
            }
            fb.className = 'mt-3 font-bold min-h-[1.5rem] text-green-600';
            fb.textContent = '🎉 Excellent balanced thinking!' + starNote(award(unitKey('debate'), 3), 3);
            markActivityComplete('debate');
        }


        // ===== HUB EMBED VARIANT: hard-locked to Level 3 =====
        // One copy of this file exists per level (Level1-Level6); only the level differs.
        function lockLevel(requested) {
            state.level = requested;
            document.getElementById('current-level-display').textContent = requested;
            document.getElementById('level-picker-wrap').classList.add('hidden');
            const banner = document.getElementById('locked-level-banner');
            banner.classList.remove('hidden');
            document.getElementById('locked-level-text').textContent = requested;
        }

        lockLevel('Level3');
        loadProgress();
        populateUnitSelect();
        // Open on the video only when this unit has one; otherwise start with Listening
        state.tab = videoFor(state.level, state.unit) ? 'video' : 'listening';
        highlightActiveTab();
        renderContent();
        // Phones: show the "📚 Modules" button once the module list has scrolled out of view
        if ('IntersectionObserver' in window) {
            new IntersectionObserver(entries => {
                const jump = document.getElementById('modules-jump');
                if (jump) jump.style.display = entries[0].isIntersecting ? 'none' : '';
            }).observe(document.querySelector('.tab-btn[data-tab="debate"]'));
        }
    </script>
<script src="c2-report.js"></script>
