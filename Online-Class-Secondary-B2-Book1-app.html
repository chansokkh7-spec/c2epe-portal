<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C2-EPE Digital Academy - Online Class Secondary B2 (Book 1)</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap');
        body { font-family: 'Poppins', sans-serif; }
        /* Flip-card for Listening: front = word, back = picture. */
        .flip-card { perspective: 1000px; height: 100px; cursor: pointer; }
        .flip-card-inner {
            position: relative; width: 100%; height: 100%;
            transition: transform 0.5s; transform-style: preserve-3d;
        }
        .flip-card.flipped .flip-card-inner { transform: rotateY(180deg); }
        .flip-card-front, .flip-card-back {
            position: absolute; width: 100%; height: 100%;
            backface-visibility: hidden; border-radius: 0.75rem;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 0.25rem;
        }
        .flip-card-back { transform: rotateY(180deg); }
        button:disabled { cursor: default; }
        /* phones: the lesson fills the screen, so jumping to it always shows it from the top,
           and the floating "Modules" button never covers the lesson's own buttons */
        @media (max-width: 767px) { #content-area { min-height: calc(100vh - 24px); padding-bottom: 76px; } }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col items-center p-4">

            <h1 class="text-2xl md:text-3xl font-extrabold tracking-wide">🔗 C2-EPE Secondary Companion</h1>
            <p class="text-sm text-indigo-200">C2-EPE Secondary English (Level 1 - 6) - Home Practice</p>
        </div>
        <div class="flex items-center gap-3 flex-wrap justify-end">
            <div class="bg-amber-400 text-indigo-950 px-3 py-2 rounded-xl text-sm font-bold shadow flex items-center gap-1">

            </div>
            <div class="bg-pink-500 text-white px-3 py-2 rounded-xl text-sm font-bold shadow flex items-center gap-1">

            <button onclick="showMyProgress()" class="bg-white/10 hover:bg-white/20 text-white px-3 py-2 rounded-xl text-sm font-bold border border-white/20 cursor-pointer">📊 My Progress</button>

                    <button onclick="selectLevel('Level2')" id="btn-Level2" class="level-btn text-left p-3 rounded-xl bg-gray-100 hover:bg-amber-100 font-semibold transition cursor-pointer">2️⃣ Level 2</button>
                    <button onclick="selectLevel('Level3')" id="btn-Level3" class="level-btn text-left p-3 rounded-xl bg-gray-100 hover:bg-amber-100 font-semibold transition cursor-pointer">3️⃣ Level 3</button>
                    <button onclick="selectLevel('Level4')" id="btn-Level4" class="level-btn text-left p-3 rounded-xl bg-gray-100 hover:bg-amber-100 font-semibold transition cursor-pointer">4️⃣ Level 4</button>
                    <button onclick="selectLevel('Level5')" id="btn-Level5" class="level-btn text-left p-3 rounded-xl bg-gray-100 hover:bg-amber-100 font-semibold transition cursor-pointer">5️⃣ Level 5</button>
                    <button onclick="selectLevel('Level6')" id="btn-Level6" class="level-btn text-left p-3 rounded-xl bg-gray-100 hover:bg-amber-100 font-semibold transition cursor-pointer">6️⃣ Level 6</button>
                </div>
            </div>
            <div id="locked-level-banner" class="hidden bg-indigo-50 border border-indigo-200 rounded-xl p-3 text-center">

            <select id="unit-select" onchange="updateUnit()" class="p-2 rounded-xl border border-gray-300 bg-gray-50 font-semibold text-indigo-800">
                <option value="1">Loading...</option>

            <hr class="my-2">
            <h2 class="font-bold text-gray-700">Learning Modules</h2>
            <button onclick="switchTab('video')" data-tab="video" class="tab-btn text-left p-2 rounded-lg bg-blue-50 text-blue-700 font-medium text-sm cursor-pointer">📹 0. Video Lesson</button>

            <button onclick="switchTab('exam')" data-tab="exam" class="tab-btn text-left p-2 rounded-lg hover:bg-gray-100 font-medium text-sm cursor-pointer">🎓 8. Exam Practice</button>
            <button onclick="switchTab('culture')" data-tab="culture" class="tab-btn text-left p-2 rounded-lg hover:bg-gray-100 font-medium text-sm cursor-pointer">🌍 9. Culture Corner</button>
            <button onclick="switchTab('vocabgame')" data-tab="vocabgame" class="tab-btn text-left p-2 rounded-lg hover:bg-gray-100 font-medium text-sm cursor-pointer">🎮 10. Vocabulary Game</button>
            <button onclick="switchTab('spelling')" data-tab="spelling" class="tab-btn text-left p-2 rounded-lg hover:bg-gray-100 font-medium text-sm cursor-pointer">✏️ 11. Spelling Practice</button>

            <button onclick="switchTab('roleplay')" data-tab="roleplay" class="tab-btn text-left p-2 rounded-lg hover:bg-gray-100 font-medium text-sm cursor-pointer">🎤 13. Role-Play</button>
            <button onclick="switchTab('dictation')" data-tab="dictation" class="tab-btn text-left p-2 rounded-lg hover:bg-gray-100 font-medium text-sm cursor-pointer">✍️ 14. Dictation</button>

            <button onclick="switchTab('summary')" data-tab="summary" class="tab-btn text-left p-2 rounded-lg hover:bg-gray-100 font-medium text-sm cursor-pointer">📝 17. Summary Writing</button>
            <button onclick="switchTab('debate')" data-tab="debate" class="tab-btn text-left p-2 rounded-lg hover:bg-gray-100 font-medium text-sm cursor-pointer">🗣️ 18. Debate Corner</button>
        </aside>

        <section id="content-area" class="bg-white rounded-2xl p-6 shadow-md md:col-span-3 flex flex-col justify-between" style="scroll-margin-top:12px;">

            <div class="mt-8 pt-4 border-t flex justify-between items-center text-sm text-gray-500 gap-2 flex-wrap">
                <span id="platform-info">C2-EPE Online Class - B2 Book 1 (Unit 1)</span>
                <div class="flex gap-2">
                    <button onclick="completeActivity()" class="bg-amber-500 hover:bg-amber-600 text-white font-bold px-4 py-2 rounded-xl shadow cursor-pointer transition">Finish Activity (+5 ⭐)</button>
                    <button onclick="nextLesson()" class="bg-indigo-700 hover:bg-indigo-800 text-white font-bold px-4 py-2 rounded-xl shadow cursor-pointer transition">Next Lesson ▶️</button>
                </div>

        </section>

    </main>

    <!-- Phones only: jump back up to the list of learning modules -->

    <script>
        let state = {
            level: 'Level4',
            unit: 1,
            tab: 'listening',
            stars: 0,
            badges: 0

        const curriculum = {
            'Level1': {

                2: { title: "School Subjects", vocab: ["Timetable", "Mathematics", "Literature", "Chemistry", "Physical education", "Homework", "Exam", "Grade", "Difficult", "Interesting", "Prefer", "Subject"], story: "My timetable is full this term. I prefer literature to chemistry, but physical education is the most interesting subject for me.", question: "Which school subject do you find most interesting? Why?", grammar: { point: "Comparatives with prefer", example: "I prefer art to math. Math is more difficult than art." } },
                3: { title: "My Family Tree", vocab: ["Relative", "Sibling", "Ancestor", "Generation", "Household", "Close-knit", "Extended family", "Only child", "Twin", "Resemble", "Raise", "Bond"], story: "I come from a close-knit extended family. I have one sibling, and we resemble our grandparents a lot.", question: "Describe one relative you are close to.", grammar: { point: "Possessive pronouns", example: "This is mine. That house is theirs." } },
                4: { title: "Free Time Activities", vocab: ["Leisure", "Board game", "Sketch", "Collect", "Podcast", "Skateboard", "Karaoke", "Relax", "Bore", "Entertain", "Pastime", "Spend time"], story: "In my leisure time, I like to sketch or listen to a podcast. Skateboarding is my favorite pastime on weekends.", question: "What do you usually do to relax after school?", grammar: { point: "like/enjoy + verb-ing", example: "I enjoy sketching. I like listening to podcasts." } },
                5: { title: "Food & Meals", vocab: ["Cuisine", "Flavor", "Spicy", "Sour", "Nutritious", "Snack", "Portion", "Appetite", "Diet", "Craving", "Homemade", "Leftovers"], story: "I love spicy and sour flavors in my cuisine. My mother always makes sure our meals are nutritious, not just tasty.", question: "Describe your favorite meal and why you like it.", grammar: { point: "Countable/uncountable + some/any", example: "I have some snacks. I don't have any leftovers." } },
                6: { title: "My Neighborhood", vocab: ["Neighborhood", "Resident", "Landmark", "Convenience store", "Crowded", "Peaceful", "Nearby", "Public transport", "Intersection", "Community center", "Safe", "Modern"], story: "My neighborhood is peaceful, with a convenience store nearby. There is a community center where residents often gather.", question: "What do you like most about your neighborhood?", grammar: { point: "There is / There are + adjectives", example: "There is a peaceful park. There are many residents nearby." } },
                7: { title: "Clothes & Style", vocab: ["Trendy", "Outfit", "Casual", "Formal", "Accessory", "Fabric", "Fit", "Comfortable", "Fashionable", "Sneakers", "Hoodie", "Style"], story: "I like a casual style with comfortable sneakers and a hoodie. My sister prefers trendy, fashionable outfits for school.", question: "Describe your typical outfit for school.", grammar: { point: "Adjective order", example: "a comfortable blue hoodie; a trendy black jacket" } },
                8: { title: "Sports & Hobbies", vocab: ["Teammate", "Coach", "Practice session", "Skill", "Compete", "Championship", "Warm-up", "Injury", "Improve", "Dedicated", "Benchwarmer", "Champion"], story: "Our coach leads a tough practice session every week. My teammates and I are dedicated, and we hope to compete in the championship.", question: "What sport or hobby are you most dedicated to?", grammar: { point: "Adverbs of frequency", example: "We practice every week. She rarely misses practice." } },
                9: { title: "Daily Schedule", vocab: ["Routine", "Punctual", "Schedule", "Deadline", "Commute", "Squeeze in", "Multitask", "Efficient", "Procrastinate", "Prioritize", "Balance", "Organize"], story: "I try to be punctual and follow my daily routine. I prioritize my homework before I squeeze in free time.", question: "Describe your typical daily schedule.", grammar: { point: "Present simple for habits", example: "I wake up at 6. I prioritize homework every day." } },
                10: { title: "Technology Basics", vocab: ["Device", "Application", "Update", "Notification", "Battery", "Wireless", "Storage", "Backup", "Troubleshoot", "Interface", "Shortcut", "Malfunction"], story: "My phone's battery drains fast because of notifications. I always backup my files in case a device malfunctions.", question: "What technology device do you use the most?", grammar: { point: "should/shouldn't for advice", example: "You should backup your files. You shouldn't ignore updates." } },

                13: { title: "Transportation", vocab: ["Commute", "Rush hour", "Fare", "Route", "Punctuality", "Carpool", "Pedestrian", "Traffic jam", "Delay", "Vehicle", "Sustainable", "Eco-friendly"], story: "During rush hour, the traffic jam causes long delays. I try to carpool or use eco-friendly transport when I can.", question: "How do you usually get to school, and why?", grammar: { point: "Reasons with because", example: "I carpool because it is eco-friendly and saves money." } },
                14: { title: "Health & Body", vocab: ["Immune system", "Symptom", "Recover", "Checkup", "Posture", "Stamina", "Hydrated", "Balanced diet", "Fatigue", "Wellness", "Vital", "Prevent"], story: "Staying hydrated and eating a balanced diet builds stamina and boosts the immune system. Regular checkups help prevent illness.", question: "What do you do to stay healthy every day?", grammar: { point: "should for health advice", example: "You should stay hydrated. You should get regular checkups." } },
                15: { title: "Music & Movies", vocab: ["Genre", "Soundtrack", "Plot", "Character", "Blockbuster", "Streaming", "Lyrics", "Melody", "Fanbase", "Trailer", "Sequel", "Recommend"], story: "I love the melody and lyrics of this genre. The movie's soundtrack matched the plot perfectly, and I would recommend the sequel too.", question: "Recommend a movie or song and explain why you like it.", grammar: { point: "Giving opinions", example: "I think the plot is great. In my opinion, the soundtrack is amazing." } },

                4: { title: "Hobbies & Interests", vocab: ["Passion", "Talent", "Craft", "Photography", "Collection", "Skillful", "Dedicated", "Creative outlet", "Master", "Beginner", "Improve", "Showcase"], story: "Photography is my true passion and creative outlet. I started as a beginner, but now I want to showcase my talent.", question: "What hobby would you like to master one day?", grammar: { point: "want to / would like to", example: "I want to master photography. I would like to showcase my work." } },
                5: { title: "Eating Out", vocab: ["Reservation", "Menu", "Waiter", "Appetizer", "Main course", "Dessert", "Tip", "Bill", "Specialty", "Ambiance", "Recommend", "Cuisine"], story: "We made a reservation and the waiter recommended the specialty appetizer. The ambiance was perfect for a family dinner.", question: "Describe your favorite restaurant and what you order there.", grammar: { point: "would like / would prefer", example: "I would like the main course. I would prefer dessert first." } },
                6: { title: "My Town", vocab: ["Municipality", "Infrastructure", "Population", "Landmark", "Tourist attraction", "Local market", "Urbanization", "Historic site", "Development", "Renovation", "Facility", "Growth"], story: "Our town's population has grown due to urbanization. A historic site downtown has become a popular tourist attraction after renovation.", question: "What changes have happened in your town recently?", grammar: { point: "Present perfect + recently", example: "The town has grown recently. They have renovated the market." } },
                7: { title: "Fashion Trends", vocab: ["Trend", "Vintage", "Statement piece", "Designer", "Influencer", "Sustainable fashion", "Thrift", "Runway", "Seasonal", "Iconic", "Minimalist", "Bold"], story: "Vintage and sustainable fashion are becoming popular trends. My favorite influencer promotes thrift shopping over designer runway pieces.", question: "What fashion trend do you follow or avoid?", grammar: { point: "Present passive", example: "Sustainable fashion is being promoted. Vintage clothes are worn again." } },
                8: { title: "Team Sports", vocab: ["Strategy", "Formation", "Substitute", "Captain", "Rivalry", "Sportsmanship", "Momentum", "Underdog", "Defense", "Offense", "Tactic", "Teamwork"], story: "Our captain designed a smart strategy and formation. Despite being the underdog, our teamwork gave us momentum to win.", question: "Why is teamwork important in sports?", grammar: { point: "despite / although", example: "Despite being the underdog, we won. Although we were tired, we kept playing." } },

        // ===== Progress: stars/badges are earned once per activity and remembered =====
        // Saved in this browser when the page is opened as a normal web page. Inside the Hub's
        // secure "Embed Code" box the browser blocks storage, so progress then lasts until the
        // page is closed — but it still can't be farmed by tapping the same button again.
        const PROGRESS_KEY = () => 'c2epe_onlineclass_secondary_progress_' + state.level;
        let progress = { stars: 0, badges: 0, awarded: {}, best: {}, completed: {} };
        function loadProgress() {
            progress = { stars: 0, badges: 0, awarded: {}, best: {}, completed: {} };
            try {
                const saved = JSON.parse(localStorage.getItem(PROGRESS_KEY()) || 'null');
                if (saved && typeof saved === 'object') progress = Object.assign(progress, saved);
            } catch (e) { /* storage not available (e.g. inside the Hub sandbox) */ }
            state.stars = progress.stars; state.badges = progress.badges;
            document.getElementById('star-count').textContent = state.stars;
            document.getElementById('badge-count').textContent = state.badges;
        }
        function saveProgress() {
            progress.stars = state.stars; progress.badges = state.badges;
            try { localStorage.setItem(PROGRESS_KEY(), JSON.stringify(progress)); } catch (e) {}
        }
        const unitKey = (what) => 'u' + state.unit + '|' + what;
        const wasAwarded = (key) => !!progress.awarded[state.level + '|' + key];
        // Gives stars only the first time an activity is done. Returns true if stars were given.
        function award(key, amount) {
            const k = state.level + '|' + key;
            if (progress.awarded[k]) return false;
            progress.awarded[k] = true;
            addStars(amount);
            return true;
        }
        // Shows "(+3 ⭐)" the first time, and a friendly note afterwards
        const starNote = (given, amount) => given ? ` (+${amount} ⭐)` : ' (stars already earned)';

        function isRecentlyAdded(dateStr) {
            if (!dateStr) return false;
            const added = new Date(dateStr);
            if (isNaN(added.getTime())) return false;
            const daysSince = (Date.now() - added.getTime()) / (1000 * 60 * 60 * 24);
            return daysSince >= 0 && daysSince <= 7;
        }

        function populateUnitSelect() {
            const sel = document.getElementById('unit-select');
            const levelData = curriculum[state.level];
            const prevUnit = state.unit;
            const unitCount = Object.keys(levelData).length;
            const labelEl = document.getElementById('unit-select-label');
            if (labelEl) labelEl.textContent = `Select Unit (1 to ${unitCount})`;
            // 🎬 = this unit has a video · 🆕 = video added in the last 7 days
            sel.innerHTML = Object.keys(levelData).map(u => {
                const v = videoFor(state.level, u);
                const mark = v ? (isRecentlyAdded(v.dateAdded) ? ' 🆕' : ' 🎬') : '';
                return `<option value="${u}">Unit ${u}: ${levelData[u].title}${mark}</option>`;
            }).join('');
            if (levelData[prevUnit]) {
                sel.value = prevUnit;
                state.unit = prevUnit;
            } else {
                state.unit = parseInt(sel.value);
            }
        }

            document.querySelectorAll('.level-btn').forEach(b => {

            if (btn) { btn.classList.remove('bg-gray-100'); btn.classList.add('bg-blue-700', 'text-white', 'shadow'); }

        // On phones the lesson sits below the module list, so after choosing a module, a unit
        // or the next lesson, the page scrolls to the lesson by itself.
        const isPhone = () => window.matchMedia('(max-width: 767px)').matches;
        function scrollToLesson(always) {
            const area = document.getElementById('content-area');
            if (!area) return;
            if (!(isPhone() || (always && area.getBoundingClientRect().top < 0))) return;
            // Wait for the new lesson to be drawn, then glide to it; some phones stop a smooth
            // scroll that starts during the tap, so if it hasn't arrived, jump there directly.
            setTimeout(() => {
                area.scrollIntoView({ behavior: 'smooth', block: 'start' });
                setTimeout(() => { if (Math.abs(area.getBoundingClientRect().top) > 40) area.scrollIntoView({ block: 'start' }); }, 700);
            }, 60);
        }
        function jumpToModules() {
            const side = document.getElementById('module-sidebar');
            side.scrollIntoView({ behavior: 'smooth', block: 'start' });
            setTimeout(() => { if (Math.abs(side.getBoundingClientRect().top) > 40) side.scrollIntoView({ block: 'start' }); }, 700);
        }

        function completeActivity() {
            markActivityComplete(state.tab);

            let gotBadge = false;
            const badgeKey = state.level + '|' + unitKey('badge');

            else if (gotStars) alert('🎉 Great work! You finished this activity and earned 5 Stars ⭐!');
            else alert('✅ You already finished this activity. Try another module, or go to the next lesson! ▶️');
        }

        function nextLesson() {
            const levelData = curriculum[state.level];
            const unitNumbers = Object.keys(levelData).map(Number).sort((a, b) => a - b);
            const idx = unitNumbers.indexOf(state.unit);
            const nextIdx = (idx === -1 ? 0 : idx + 1) % unitNumbers.length;
            state.unit = unitNumbers[nextIdx];
            document.getElementById('unit-select').value = state.unit;
            renderContent();
            scrollToLesson(true);

        // Safe inside onclick="...('here')": escapes backslashes, single quotes and double quotes
        function escapeJsStr(s) {
            return String(s).replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '&quot;');
        }
        const escapeHtml = (s) => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

        // Splits a story into sentences. (Written without "look-behind" regex, which older
        // iPhones — before iOS 16.4 — cannot read and which made the whole page stop there.)
        function splitSentences(text) {
            return (String(text).match(/[^.!?]+[.!?]+["')]*|[^.!?]+$/g) || []).map(s => s.trim()).filter(Boolean);
        }
        const countWords = (s) => (String(s).match(/[A-Za-z\u00C0-\u024F\u1780-\u17FF]+(?:['’-][A-Za-z]+)*/g) || []).length;

        // ---------- Helper: Text-to-Speech (voices load a moment after the page opens) ----------
        let enVoice = null;
        function pickVoice() {
            if (!('speechSynthesis' in window)) return;
            enVoice = window.speechSynthesis.getVoices().find(v => v.lang && v.lang.startsWith('en')) || null;
        }
        if ('speechSynthesis' in window) { pickVoice(); window.speechSynthesis.onvoiceschanged = pickVoice; }
        function speak(text, onEnd) {
            if (!('speechSynthesis' in window)) { if (onEnd) onEnd(false); return false; }
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(text);
            u.lang = 'en-US';
            u.rate = 0.9;
            if (!enVoice) pickVoice();
            if (enVoice) u.voice = enVoice;
            if (onEnd) u.onend = () => onEnd(true);
            window.speechSynthesis.speak(u);
            return true;
        }

        function shuffle(arr) {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        function allVocabForLevel(level) {
            let words = [];
            Object.keys(curriculum[level]).forEach(u => words.push(...curriculum[level][u].vocab));
            return [...new Set(words)];
        }

        // ---------- Pictures ----------
        // When two words in the SAME unit would show the same picture, the second one gets its
        // own picture here (only inside that unit), so children can tell them apart.
        const SAME_UNIT_ALT = {
            "Goodbye": "🚶👋", "Thank you": "💝", "Sorry": "😔", "Respect": "🫡", "Tomorrow": "⏭️",
            "West": "🌇", "East": "🌄", "North": "🧭", "Between": "🥪", "Early": "🐓", "Late": "⏰",
            "Swing": "🎠", "Poster": "🪧"
        };
        function baseEmoji(word) { return WORD_EMOJI[word] || '🖼️'; }
        function emojiFor(word, unitData) {
            const u = unitData || curriculum[state.level][state.unit];
            const e = baseEmoji(word);
            if (u && SAME_UNIT_ALT[word] && u.vocab.some(w => w !== word && baseEmoji(w) === e)) return SAME_UNIT_ALT[word];
            return e;
        }
        // Wrong answers for "look at the picture" questions never share the right answer's
        // picture, so there is always exactly one correct choice.
        function pictureDistractors(correct, pool, unitData, n) {
            const pic = emojiFor(correct, unitData);
            const ok = (w) => w !== correct && emojiFor(w, unitData) !== pic;
            let list = shuffle([...new Set(pool)].filter(ok)).slice(0, n);
            if (list.length < n) {
                const extra = shuffle(allVocabForLevel(state.level).filter(w => ok(w) && !list.includes(w)));
                list = list.concat(extra.slice(0, n - list.length));
            }
            return list;
        }

        function youtubeIdOf(link) {
            const s = String(link || '').trim();
            if (/^[A-Za-z0-9_-]{11}$/.test(s)) return s;
            const m = s.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/))([A-Za-z0-9_-]{11})/);
            return m ? m[1] : '';
        }
        function videoFor(level, unit) {
            const v = (VIDEO_LESSONS[level] || {})[unit];
            if (!v) return null;
            if (v.mp4 && /^https:\/\//.test(v.mp4)) return { mp4: v.mp4, id: v.mp4, dateAdded: v.dateAdded || '', checkpoints: Array.isArray(v.checkpoints) ? v.checkpoints : [] };
            const id = youtubeIdOf(v.videoId);
            return id ? { id, dateAdded: v.dateAdded || '', checkpoints: Array.isArray(v.checkpoints) ? v.checkpoints : [] } : null;
        }

        // Stops the video and its timers whenever the student leaves the Video tab or changes unit
        function stopVideo() {
            if (ytPollInterval) { clearInterval(ytPollInterval); ytPollInterval = null; }
            if (ytFallbackTimer) { clearTimeout(ytFallbackTimer); ytFallbackTimer = null; }
            if (ytPlayer && typeof ytPlayer.destroy === 'function') { try { ytPlayer.destroy(); } catch (e) {} }
            ytPlayer = null;
        }

        function loadYouTubeApi() {
            if (window.YT && window.YT.Player) return Promise.resolve();
            if (ytApiLoadPromise) return ytApiLoadPromise;
            ytApiLoadPromise = new Promise((resolve, reject) => {
                window.onYouTubeIframeAPIReady = resolve;
                const tag = document.createElement('script');
                tag.src = 'https://www.youtube.com/iframe_api';
                tag.onerror = () => { ytApiLoadPromise = null; reject(new Error('YouTube could not load')); };
                document.head.appendChild(tag);
            });
            return ytApiLoadPromise;
        }

        // English subtitles: added to the player with code, so no subtitle files are needed online.
        let subsOn = true;
        function addSubtitles(el) {
            const cues = SUBTITLES[(el.getAttribute('src') || '').split('/').pop().split('?')[0].replace('.mp4', '')]; const btn = document.getElementById('subs-btn');
            if (!cues || !el.addTextTrack || typeof VTTCue === 'undefined') { if (btn) btn.style.display = 'none'; return; }
            const tr = el.addTextTrack('subtitles', 'English', 'en');
            cues.forEach(c => { try { const q = new VTTCue(c[0], c[1], c[2]); q.line = -2; tr.addCue(q); } catch (e) {} });
            const apply = () => { tr.mode = subsOn ? 'showing' : 'hidden'; if (btn) btn.textContent = subsOn ? '💬 Subtitles: ON' : '💬 Subtitles: OFF'; };
            if (btn) btn.onclick = () => { subsOn = !subsOn; apply(); };
            apply();
        }
        function renderMp4Lesson(contentDiv, unitData) {
            contentDiv.innerHTML = `
                <h2 class="text-xl font-bold text-indigo-900 mb-2">📹 Video Lesson — Unit ${state.unit}: ${unitData.title}</h2>
                <p class="text-gray-600 mb-4">${ytCurrentConfig.checkpoints.length ? 'Watch the video. It will pause at a few points so you can answer a quick question!' : 'Watch Ms. Emma and Visal, then try the other learning modules!'}</p>
                <div class="relative bg-black rounded-2xl overflow-hidden" style="aspect-ratio:16/9;">
                    <video id="mp4-player" src="${ytCurrentConfig.mp4}" controls playsinline preload="metadata" class="w-full h-full" style="object-fit:contain;"></video>
                    <div id="checkpoint-overlay" class="absolute inset-0 bg-indigo-900/95 flex items-center justify-center p-6" style="display:none;"></div>
                </div>
                <p id="video-msg" class="text-sm text-gray-500 mt-3 text-center min-h-[1.25rem]">▶️ Press play to start the lesson!</p>
                <div class="text-center mt-2 flex justify-center gap-3 flex-wrap"><button id="subs-btn" class="bg-white border border-indigo-300 text-indigo-700 font-bold px-4 py-2 rounded-full shadow cursor-pointer">💬 Subtitles: ON</button><button onclick="nextLesson()" class="bg-emerald-700 hover:bg-emerald-800 text-white font-bold px-4 py-2 rounded-full shadow cursor-pointer">Next Lesson ▶️</button></div>`;
            const el = document.getElementById('mp4-player');
            addSubtitles(el);
            { const a = document.getElementById('footer-next-module'), b = document.getElementById('footer-next-lesson'); if (a) a.style.display = ''; if (b) b.style.display = 'none'; }
            ytPlayer = {
                getCurrentTime: () => el.currentTime,
                pauseVideo: () => el.pause(),
                playVideo: () => { const p = el.play(); if (p && p.catch) p.catch(() => {}); },
                destroy: () => { try { el.pause(); el.removeAttribute('src'); el.load(); } catch (e) {} }
            };
            el.addEventListener('play', () => { const m = document.getElementById('video-msg'); if (m) m.textContent = ''; });
            el.addEventListener('timeupdate', () => { if (ytCurrentConfig && ytCurrentConfig.checkpoints.length) checkVideoCheckpoints(); });
            el.addEventListener('ended', () => {
                const got = award(unitKey('video-' + ytCurrentConfig.id), 5);
                const m = document.getElementById('video-msg');
                if (m) m.textContent = '🎉 Great job watching the whole video!' + (got ? ' (+5 ⭐)' : '');
            });
            el.addEventListener('error', () => {
                const m = document.getElementById('video-msg');
                if (m) m.innerHTML = '⚠️ The video could not load. Check the internet, or <a href="' + ytCurrentConfig.mp4 + '" target="_blank" rel="noopener" class="text-indigo-600 underline font-semibold">open it here ↗</a>';
            });
        }

        function onYtStateChange(event) {
            const msg = document.getElementById('video-msg');
            if (event.data === YT.PlayerState.PLAYING) {
                if (ytPollInterval) clearInterval(ytPollInterval);
                if (ytCurrentConfig && ytCurrentConfig.checkpoints.length) ytPollInterval = setInterval(checkVideoCheckpoints, 400);
                if (msg) msg.textContent = '';
            } else if (event.data === YT.PlayerState.PAUSED || event.data === YT.PlayerState.ENDED) {
                if (ytPollInterval) { clearInterval(ytPollInterval); ytPollInterval = null; }
                if (event.data === YT.PlayerState.ENDED) {
                    const got = award(unitKey('video-' + ytCurrentConfig.id), 5);
                    markActivityComplete('video');
                    if (msg) msg.textContent = '🎉 Great job watching the whole video!' + (got ? ' (+5 ⭐)' : '');
                }
            }
        }

        function checkVideoCheckpoints() {
            if (!ytPlayer || typeof ytPlayer.getCurrentTime !== 'function' || !ytCurrentConfig) return;
            let t = 0;
            try { t = ytPlayer.getCurrentTime(); } catch (e) { return; }
            ytCurrentConfig.checkpoints.forEach((cp, idx) => {
                if (!ytAnsweredCheckpoints.has(idx) && t >= cp.time) {
                    ytAnsweredCheckpoints.add(idx);
                    showVideoCheckpoint(idx);
                }
            });
        }

        function showVideoCheckpoint(idx) {
            const cp = ytCurrentConfig.checkpoints[idx];
            ytPlayer.pauseVideo();
            if (ytPollInterval) { clearInterval(ytPollInterval); ytPollInterval = null; }
            const overlay = document.getElementById('checkpoint-overlay');
            overlay.style.display = 'flex';
            overlay.innerHTML = `
                <div class="bg-white rounded-2xl p-6 max-w-md w-full text-center">
                    <p class="text-sm font-bold text-indigo-600 mb-2">🤔 Quick Question!</p>
                    <p class="font-bold text-lg text-gray-800 mb-4">${cp.question}</p>
                    <div class="flex flex-col gap-2" id="checkpoint-options">
                        ${cp.options.map((opt, i) => `<button onclick="answerVideoCheckpoint(${idx}, ${i})" class="bg-indigo-50 hover:bg-indigo-100 text-indigo-900 font-semibold p-3 rounded-xl cursor-pointer">${opt}</button>`).join('')}
                    </div>
                    <p id="checkpoint-feedback" class="mt-3 font-bold min-h-[1.5rem]"></p>
                </div>`;
        }

        function answerVideoCheckpoint(idx, chosenIndex) {
            const cp = ytCurrentConfig.checkpoints[idx];
            const feedback = document.getElementById('checkpoint-feedback');
            const optionsDiv = document.getElementById('checkpoint-options');
            optionsDiv.querySelectorAll('button').forEach(b => b.disabled = true);
            if (chosenIndex === cp.correct) {
                feedback.className = 'mt-3 font-bold min-h-[1.5rem] text-green-600';
                feedback.textContent = award(unitKey('video-' + ytCurrentConfig.id + '-q' + idx), 2) ? '🎉 Correct! (+2 ⭐)' : '🎉 Correct!';
            } else {
                feedback.className = 'mt-3 font-bold min-h-[1.5rem] text-red-500';
                feedback.textContent = `❌ Not quite — the answer was "${cp.options[cp.correct]}"`;
            }
            const nextBtn = document.createElement('button');
            nextBtn.textContent = 'Next ▶️';
            nextBtn.className = 'mt-4 bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-6 py-2 rounded-full shadow cursor-pointer';
            nextBtn.onclick = resumeVideoAfterCheckpoint;
            feedback.insertAdjacentElement('afterend', nextBtn);
        }

        function resumeVideoAfterCheckpoint() {
            document.getElementById('checkpoint-overlay').style.display = 'none';
            if (ytPlayer) ytPlayer.playVideo();
        }

        function renderContent() {
            let contentDiv = document.getElementById('module-content');
            const unitData = curriculum[state.level][state.unit];
            stopVideo();                 // never leave a video playing in the background
            stopTalkTimer();             // ...or a Let's Talk timer running
            updateVideoTabBadge();
            // Always shows the real level and unit (it used to say "A1" on every level)
            document.getElementById('platform-info').textContent = `C2-EPE Online Class - ${BOOK_NAMES[state.level]} (Unit ${state.unit}: ${unitData.title})`;
            if (state.tab === 'video') { renderVideoLesson(contentDiv); return; }

            if (state.tab === 'listening') renderListening(contentDiv, unitData);
            else if (state.tab === 'speaking') renderSpeaking(contentDiv, unitData);
            else if (state.tab === 'reading') renderReading(contentDiv, unitData);
            else if (state.tab === 'grammar') renderGrammar(contentDiv, unitData);
            else if (state.tab === 'writing') renderWriting(contentDiv, unitData);
            else if (state.tab === 'quiz') renderQuiz(contentDiv, unitData);
            else if (state.tab === 'letstalk') renderLetsTalk(contentDiv, unitData);
            else if (state.tab === 'exam') renderExamPractice(contentDiv, unitData);
            else if (state.tab === 'culture') renderCultureCorner(contentDiv, unitData);
            else if (state.tab === 'vocabgame') renderVocabGame(contentDiv, unitData);
            else if (state.tab === 'spelling') renderSpelling(contentDiv, unitData);
            else if (state.tab === 'sentence') renderSentenceBuilding(contentDiv, unitData);
            else if (state.tab === 'roleplay') renderRolePlay(contentDiv, unitData);
            else if (state.tab === 'dictation') renderDictation(contentDiv, unitData);
            else if (state.tab === 'review') renderReview(contentDiv, unitData);
            else if (state.tab === 'pronunciation') renderPronunciationDrill(contentDiv, unitData);
            else if (state.tab === 'summary') renderSummaryWriting(contentDiv, unitData);
            else if (state.tab === 'debate') renderDebateCorner(contentDiv, unitData);
        }

        function playListenWord(word, i) {

        function playListenStory() {

        // ===== 3. READING =====
        // How many real words an answer needs, by level (a single letter no longer earns stars)
        const MIN_WORDS = { Level1: 4, Level2: 5, Level3: 6, Level4: 7, Level5: 8, Level6: 8 };
        const minWords = () => MIN_WORDS[state.level] || 3;
        function textCheck(msg, text, need, okText, key, amount) {
            const n = countWords(text);
            if (n < need) {
                msg.className = "text-sm mt-2 font-semibold text-red-500";
                msg.textContent = n === 0 ? "✏️ Write something first!" : `✏️ Write a little more — at least ${need} words (you have ${n}).`;
                return false;
            }
            msg.className = "text-sm mt-2 font-semibold text-green-600";
            msg.textContent = okText + starNote(award(key, amount), amount);
            return true;
        }
        function renderReading(contentDiv, unitData) {
            const newWord = unitData.vocab[unitData.vocab.length - 1];
            contentDiv.innerHTML = `
                <h2 class="text-xl font-bold text-blue-900 mb-2">📖 Reading Time</h2>

        // ===== 4. GRAMMAR BOX =====
        function renderGrammar(contentDiv, unitData) {
            const g = unitData.grammar;

            contentDiv.innerHTML = `

        }
        function checkGrammarAnswer() {
            textCheck(document.getElementById('grammar-msg'), document.getElementById('grammar-answer').value, minWords(), "🌟 Nice sentence!", unitKey('grammar1'), 3);
        }
        function checkGrammarAnswer2() {
            const a1 = document.getElementById('grammar-answer').value.trim().toLowerCase();
            const a2 = document.getElementById('grammar-answer2').value.trim().toLowerCase();
            const msg = document.getElementById('grammar-msg2');

            if (textCheck(msg, a2, minWords(), "🌟 Great - two patterns practiced!", unitKey('grammar2'), 3)) markActivityComplete('grammar');
        }

        function usedUnitWords(text, unitData) {
            const t = ' ' + String(text).toLowerCase().replace(/[^a-z0-9'’\- ]+/g, ' ').replace(/\s+/g, ' ') + ' ';
            return unitData.vocab.filter(w => {
                const base = w.toLowerCase().replace(/[^a-z0-9'’\- ]+/g, ' ').trim();
                if (!base) return false;
                // whole word, allowing simple endings: s, es, ed, ing
                const re = new RegExp('[ ]' + base.replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace(/ /g, '[ ]') + '(s|es|ed|d|ing)?[ ]');
                return re.test(t);
            });
        }
        // ===== 6. QUIZ (listen and choose) =====
        // Answers lock after the first tap, and stars are given only for beating your best score
        let quizState = { qIndex: 0, score: 0, order: [], currentOptions: [], currentAnswer: '', locked: false };
        function renderQuiz(contentDiv, unitData) {
            quizState = { qIndex: 0, score: 0, order: shuffle([...new Set(unitData.vocab)]), currentOptions: [], currentAnswer: '', locked: false };
            showQuizQuestion();
        }
        function showQuizQuestion() {
            const contentDiv = document.getElementById('module-content');
            const unitData = curriculum[state.level][state.unit];
            quizState.locked = false;
            if (quizState.qIndex >= quizState.order.length) {
                const total = quizState.order.length;
                const pct = Math.round((quizState.score / total) * 100);
                const bestKey = state.level + '|' + unitKey('quiz');
                const best = progress.best[bestKey] || 0;
                const earned = Math.max(0, quizState.score - best) * 2;
                if (quizState.score > best) progress.best[bestKey] = quizState.score;
                markActivityComplete('quiz');
                if (earned > 0) addStars(earned); else saveProgress();
                if (pct === 100) triggerConfetti();
                contentDiv.innerHTML = `
                    <h2 class="text-xl font-bold text-blue-900 mb-2">🧩 Quiz Complete!</h2>
                    <div class="bg-purple-50 p-8 rounded-2xl border border-purple-200 text-center">
                        <div class="text-5xl mb-3">${pct === 100 ? '🏆' : pct >= 50 ? '🎉' : '💪'}</div>
                        <p class="font-bold text-purple-900 text-2xl mb-2">${quizState.score} / ${total} Correct</p>
                        <p class="text-gray-600 mb-4">${earned > 0 ? `You earned ${earned} ⭐` : (best >= total ? 'Perfect score already! 🌟' : `Your best is ${Math.max(best, quizState.score)} / ${total} — beat it to earn more ⭐`)}</p>
                        <button onclick="renderQuiz(document.getElementById('module-content'), curriculum[state.level][state.unit])" class="bg-purple-700 hover:bg-purple-800 text-white font-bold px-5 py-2 rounded-xl shadow cursor-pointer">🔁 Try Again</button>
                    </div>`;
                return;
            }
            const word = quizState.order[quizState.qIndex];
            const distractors = shuffle(allVocabForLevel(state.level).filter(w => w !== word)).slice(0, 3);
            const options = shuffle([word, ...distractors]);
            quizState.currentOptions = options;
            quizState.currentAnswer = word;
            contentDiv.innerHTML = `
                <h2 class="text-xl font-bold text-blue-900 mb-2">🧩 Quiz & Rewards</h2>
                <p class="text-sm text-gray-500 mb-3">Question ${quizState.qIndex + 1} of ${quizState.order.length}</p>
                <div class="bg-purple-50 p-6 rounded-2xl border border-purple-200">
                    <p class="font-bold text-purple-900 mb-2">🔊 Listen and choose the word you heard:</p>
                    <button onclick="speak(quizState.currentAnswer)" class="bg-purple-600 hover:bg-purple-700 text-white font-bold px-5 py-2 rounded-full shadow mb-4 cursor-pointer">🔊 Play Word</button>
                    <div class="flex flex-col gap-2" id="quiz-options">
                        ${options.map((o, i) => `<button onclick="answerQuiz('${escapeJsStr(o)}')" class="bg-white p-3 rounded-xl shadow hover:bg-purple-100 text-left font-medium cursor-pointer">${String.fromCharCode(65 + i)}) ${o}</button>`).join('')}
                    </div>
                    <p id="quiz-ans" class="mt-4 font-bold text-lg min-h-[1.5rem]"></p>
                </div>`;
            speak(word);
        }
        function answerQuiz(chosen) {
            if (quizState.locked) return;
            quizState.locked = true;
            document.querySelectorAll('#quiz-options button').forEach(b => b.disabled = true);
            let el = document.getElementById('quiz-ans');
            if (chosen === quizState.currentAnswer) {
                el.innerHTML = "🎉 Correct! Well done!";
                el.className = "mt-4 font-bold text-lg text-green-600";
                quizState.score++;
            } else {
                el.innerHTML = `❌ Not quite - it was "${escapeHtml(quizState.currentAnswer)}"`;
                el.className = "mt-4 font-bold text-lg text-red-500";
            }
            quizState.qIndex++;
            setTimeout(showQuizQuestion, 1100);
        }

        // ===== 7. VOCABULARY GAME (picture -> word) =====
        // Wrong choices never share the picture of the right answer, so exactly one choice fits
        let vocabGameState = { qIndex: 0, score: 0, questions: [], locked: false };
        function buildVocabGameQuestions(unitData) {
            return shuffle([...new Set(unitData.vocab)]).map(correct => ({
                correct, options: shuffle([correct, ...pictureDistractors(correct, unitData.vocab, unitData, 3)])
            }));
        }
        function renderVocabGame(contentDiv, unitData) {
            vocabGameState = { qIndex: 0, score: 0, questions: buildVocabGameQuestions(unitData), locked: false };
            contentDiv.innerHTML = `<h2 class="text-xl font-bold text-blue-800 mb-2">🎮 Vocabulary Game</h2>
                <p class="text-gray-600 mb-4">Look at the picture, then tap the matching word!</p>
                <div id="vocabgame-area"></div>`;
            showVocabGameQuestion();
        }
        function showVocabGameQuestion() {
            const area = document.getElementById('vocabgame-area');
            if (!area) return;
            vocabGameState.locked = false;
            if (vocabGameState.qIndex >= vocabGameState.questions.length) {
                markActivityComplete('vocabgame');
                area.innerHTML = `<div class="bg-green-50 border-2 border-green-300 rounded-2xl p-8 text-center">
                    <p class="text-2xl font-bold text-green-700 mb-2">🎉 Great Job!</p>
                    <p class="text-lg text-gray-700">You scored ${vocabGameState.score} / ${vocabGameState.questions.length}</p>
                    <button onclick="renderVocabGame(document.getElementById('module-content'), curriculum[state.level][state.unit])" class="mt-4 bg-blue-600 hover:bg-blue-700 text-white font-bold px-6 py-2 rounded-full shadow cursor-pointer">🔁 Play Again</button>
                </div>`;
                return;
            }
            const q = vocabGameState.questions[vocabGameState.qIndex];
            area.innerHTML = `
                <div class="bg-blue-50 border-2 border-dashed border-blue-300 rounded-2xl p-8 text-center">
                    <p class="text-sm text-gray-500 mb-2">Question ${vocabGameState.qIndex + 1} of ${vocabGameState.questions.length}</p>
                    <div class="text-7xl mb-5">${emojiFor(q.correct)}</div>
                    <div class="grid grid-cols-2 gap-3" id="vocabgame-options">
                        ${q.options.map(o => `<button onclick="answerVocabGame('${escapeJsStr(o)}')" class="bg-white hover:bg-blue-100 p-4 rounded-xl shadow font-bold text-blue-800 cursor-pointer">${o}</button>`).join('')}
                    </div>
                    <p id="vocabgame-fb" class="mt-4 font-bold min-h-[1.5rem]"></p>
                </div>`;
        }
        function answerVocabGame(chosen) {
            if (vocabGameState.locked) return;
            vocabGameState.locked = true;
            document.querySelectorAll('#vocabgame-options button').forEach(b => b.disabled = true);
            const q = vocabGameState.questions[vocabGameState.qIndex];
            const fb = document.getElementById('vocabgame-fb');
            if (chosen === q.correct) {
                fb.className = 'mt-4 font-bold min-h-[1.5rem] text-green-600';
                fb.textContent = '🎉 Correct!' + (award(unitKey('vocab-' + q.correct), 2) ? ' (+2 ⭐)' : '');
                vocabGameState.score++;
            } else {
                fb.className = 'mt-4 font-bold min-h-[1.5rem] text-red-500';
                fb.textContent = `❌ It was "${q.correct}"`;
            }
            vocabGameState.qIndex++;
            setTimeout(showVocabGameQuestion, 900);
        }

        // ===== 8. SPELLING PRACTICE (tap scrambled letters in order) =====
        let spellState = { word: '', picked: [], letters: [], wIndex: 0, words: [], done: false };
        function renderSpelling(contentDiv, unitData) {
            spellState.words = shuffle([...new Set(unitData.vocab)].filter(w => /^[A-Za-z ]+$/.test(w)));
            spellState.wIndex = 0;
            contentDiv.innerHTML = `<h2 class="text-xl font-bold text-blue-800 mb-2">✏️ Spelling Practice</h2>
                <p class="text-gray-600 mb-4">Look at the picture, then tap the letters in the right order to spell the word!</p>
                <div id="spelling-area"></div>`;
            showSpellingWord();
        }
        function showSpellingWord() {
            const area = document.getElementById('spelling-area');
            if (!area) return;
            if (spellState.wIndex >= spellState.words.length) {
                markActivityComplete('spelling');
                area.innerHTML = `<div class="bg-green-50 border-2 border-green-300 rounded-2xl p-8 text-center">
                    <p class="text-2xl font-bold text-green-700">🎉 All words spelled! Great work!</p>
                </div>`;
                return;
            }
            const word = spellState.words[spellState.wIndex].toUpperCase();

        function renderSpellingUI() {
            const area = document.getElementById('spelling-area');
            const targetLen = spellState.word.replace(/ /g, '').length;
            spellState.picked = [];
            area.innerHTML = `
                <div class="bg-amber-50 border-2 border-dashed border-amber-300 rounded-2xl p-8 text-center">
                    <p class="text-sm text-gray-500 mb-2">Word ${spellState.wIndex + 1} of ${spellState.words.length}</p>
                    <div class="text-6xl mb-3">${emojiFor(spellState.words[spellState.wIndex])}</div>
                    <button onclick="speak('${escapeJsStr(spellState.words[spellState.wIndex])}')" class="text-sm text-blue-600 underline mb-3 cursor-pointer">🔊 Hear the word</button>
                    <div class="flex justify-center gap-2 mb-5 flex-wrap" id="spell-slots">
                        ${Array.from({length: targetLen}).map(() => `<div class="spell-slot w-10 h-12 border-b-4 border-blue-400 flex items-center justify-center text-xl font-bold text-blue-800"></div>`).join('')}

                    <div class="flex justify-center gap-2 flex-wrap mb-4">

                </div>`;
        }
        function pickLetter(i) {

            btn.disabled = true;
            btn.classList.add('opacity-30');
            spellState.picked.push(spellState.letters[i]);

            const target = spellState.word.replace(/ /g, '');
            document.querySelectorAll('#spell-slots .spell-slot').forEach((cell, idx) => {
                cell.textContent = spellState.picked[idx] || '';
            });
            if (spellState.picked.length === target.length) {

                    spellState.done = true;
                    fb.className = 'mt-3 font-bold min-h-[1.5rem] text-green-600';
                    fb.textContent = `🎉 Correct! "${spellState.word}"` + (award(unitKey('spell-' + spellState.word), 3) ? ' (+3 ⭐)' : '');
