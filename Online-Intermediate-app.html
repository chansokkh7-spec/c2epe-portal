        // ===== Progress: stars/badges are earned once per activity and remembered =====
        // Saved in this browser when the page is opened as a normal web page. When it runs
        // inside the Hub's secure "Embed Code" box the browser blocks storage, so progress
        // then lasts until the page is closed (it still can't be farmed by repeated taps).
        const PROGRESS_KEY = () => 'c2epe_onlineclass_progress_' + state.level;
        let progress = { stars: 0, badges: 0, awarded: {}, bestQuiz: {} };
        function loadProgress() {
            try {
                const saved = JSON.parse(localStorage.getItem(PROGRESS_KEY()) || 'null');
                if (saved && typeof saved === 'object') progress = Object.assign({ stars: 0, badges: 0, awarded: {}, bestQuiz: {} }, saved);
            } catch (e) { /* storage not available (e.g. inside the Hub sandbox) */ }
            state.stars = progress.stars; state.badges = progress.badges;
            document.getElementById('star-count').innerText = state.stars;
            document.getElementById('badge-count').innerText = state.badges;
        }
        function saveProgress() {
            progress.stars = state.stars; progress.badges = state.badges;
            try { localStorage.setItem(PROGRESS_KEY(), JSON.stringify(progress)); } catch (e) {}
        }
        // Gives stars only the first time a given activity is done. Returns true if stars were given.
        function award(key, amount) {
            const k = state.level + '|' + key;
            if (progress.awarded[k]) return false;
            progress.awarded[k] = true;
            addStars(amount);
            return true;
        }
        const unitKey = (what) => 'u' + state.unit + '|' + what;

        function populateUnitSelect() {
            const sel = document.getElementById('unit-select');
            const levelData = realCurriculum[state.level];
            const prevUnit = state.unit;
            const unitCount = Object.keys(levelData).length;
            const labelEl = document.getElementById('unit-select-label');
            if (labelEl) labelEl.textContent = `Select Unit (1 to ${unitCount})`;
            // 🎬 marks units that have a video (🆕 = added in the last 7 days)
            sel.innerHTML = Object.keys(levelData).map(u => {
                const v = videoFor(state.level, u);
                const mark = v ? (isRecentlyAdded(v.added) ? ' 🆕' : ' 🎬') : '';
                return `<option value="${u}">Unit ${u}: ${levelData[u].title}${mark}</option>`;
            }).join('');
            if (typeof OC_TRIAL !== 'undefined' && OC_TRIAL) { [...sel.options].forEach(o => { if (Number(o.value) > 3) { o.disabled = true; o.textContent = '🔒 ' + o.textContent + ' (after the trial)'; } }); }
            // keep the same unit number selected if it still exists for this level
            if (levelData[prevUnit]) {
                sel.value = prevUnit;
                state.unit = prevUnit;
            } else {
                state.unit = parseInt(sel.value);
            }
        }

        // Phonics only fits early readers (K0/K1) — levels where it's not
        // shown are also guarded against being left "stuck" on the phonics
        // tab if the student switches level while it's open.
        const PHONICS_LEVELS = ['K0', 'K1'];

        function selectLevel(lvl) {
            state.level = lvl;
            document.querySelectorAll('.level-btn').forEach(b => {
                b.classList.remove('bg-blue-600', 'text-white', 'shadow');
                b.classList.add('bg-gray-100');
            });
            document.getElementById('btn-' + lvl).classList.remove('bg-gray-100');
            document.getElementById('btn-' + lvl).classList.add('bg-blue-600', 'text-white', 'shadow');
            document.getElementById('current-level-display').innerText = lvl;

            const phonicsBtn = document.getElementById('phonics-tab-btn');
            const phonicsAllowed = PHONICS_LEVELS.includes(lvl);
            phonicsBtn.style.display = phonicsAllowed ? '' : 'none';
            if (!phonicsAllowed && state.tab === 'phonics') { state.tab = 'listening'; highlightActiveTab(); }

            loadProgress();
            populateUnitSelect();
            renderContent();
        }

        function updateUnit() {
            state.unit = parseInt(document.getElementById('unit-select').value);
            renderContent();
            scrollToLesson();
        }

        // Moves to the next unit within the current level (wrapping back to
        // unit 1 after the last one), keeping the same module tab open so
        // a student can go straight through Unit 1 -> Unit 2 -> ... without
        // re-opening the dropdown each time.
        function nextLesson() {
            const levelData = realCurriculum[state.level];
            const unitNumbers = Object.keys(levelData).map(Number).sort((a, b) => a - b);
            const idx = unitNumbers.indexOf(state.unit);
            const nextIdx = (idx === -1 ? 0 : idx + 1) % ((typeof OC_TRIAL !== 'undefined' && OC_TRIAL) ? 3 : unitNumbers.length);
            state.unit = unitNumbers[nextIdx];
            document.getElementById('unit-select').value = state.unit;
            renderContent();
            scrollToLesson(true);
        }

        function highlightActiveTab() {
            document.querySelectorAll('.tab-btn').forEach(b => {
                b.classList.remove('bg-blue-50', 'text-blue-700');
                b.classList.add('hover:bg-gray-100');
            });
            const activeBtn = document.querySelector(`.tab-btn[data-tab="${state.tab}"]`);
            if (activeBtn) {
                activeBtn.classList.remove('hover:bg-gray-100');
                activeBtn.classList.add('bg-blue-50', 'text-blue-700');
            }
        }

        // On phones the lesson sits below the module list, so after choosing a module,
        // a unit or the next lesson, the page now scrolls down to the lesson by itself.
        const isPhone = () => window.matchMedia('(max-width: 767px)').matches;
        function scrollToLesson(always) {
            const area = document.getElementById('content-area');
            if (!area) return;
            if (!(isPhone() || (always && area.getBoundingClientRect().top < 0))) return;
            // Wait for the new lesson to be drawn, then glide to it. Some phones stop a smooth
            // scroll that starts during the tap itself, so if it hasn't arrived shortly after,
            // jump there directly.
            setTimeout(() => {
                area.scrollIntoView({ behavior: 'smooth', block: 'start' });
                setTimeout(() => {
                    if (Math.abs(area.getBoundingClientRect().top) > 40) area.scrollIntoView({ block: 'start' });
                }, 700);
            }, 60);
        }
        function jumpToModules() {
            const side = document.getElementById('module-sidebar');
            side.scrollIntoView({ behavior: 'smooth', block: 'start' });
            setTimeout(() => { if (Math.abs(side.getBoundingClientRect().top) > 40) side.scrollIntoView({ block: 'start' }); }, 700);
        }
        function switchTab(tab) {
            state.tab = tab;
            highlightActiveTab();
            renderContent();
            scrollToLesson();
        }

        function triggerConfetti() {
            if (typeof confetti === 'function') {
                confetti({
                    particleCount: 100,
                    spread: 70,
                    origin: { y: 0.6 }

        }

        function addStars(amt) {
            state.stars += amt;
            document.getElementById('star-count').innerText = state.stars;
            saveProgress();
            triggerConfetti();
        }

        // "Finish Activity" now rewards each activity of each unit once (and one badge per unit),
        // instead of giving stars and badges every time it is tapped.
        function completeActivity() {
            const gotStars = award(unitKey('finish-' + state.tab), 5);
            let gotBadge = false;
            const badgeKey = state.level + '|' + unitKey('badge');
            if (gotStars && !progress.awarded[badgeKey]) {
                progress.awarded[badgeKey] = true;
                state.badges += 1;
                document.getElementById('badge-count').innerText = state.badges;
                saveProgress();

            else if (gotStars) alert(`🎉 Awesome! You finished this activity and earned 5 Stars ⭐!`);

        // ---------- Helper: Text-to-Speech ----------
        // Voices load a moment after the page opens, so they are cached when ready.
        let enVoice = null;
        function pickVoice() {
            if (!('speechSynthesis' in window)) return;
            const voices = window.speechSynthesis.getVoices();
            enVoice = voices.find(v => v.lang && v.lang.startsWith('en')) || null;
        }
        if ('speechSynthesis' in window) { pickVoice(); window.speechSynthesis.onvoiceschanged = pickVoice; }
        function speak(text, onEnd) {
            if (!('speechSynthesis' in window)) { if (onEnd) onEnd(false); return false; }
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(text);
            u.lang = 'en-US';
            u.rate = 0.85;
            if (!enVoice) pickVoice();
            if (enVoice) u.voice = enVoice;
            if (onEnd) u.onend = () => onEnd(true);
            window.speechSynthesis.speak(u);
            return true;
        }

        function shuffle(arr) {

        // ===== 4. WRITING (canvas tracing pad — now every word of the unit) =====

        // Tracks the currently-attached window "mouseup" handler so a
        // previous one gets removed before adding a new one.
        let traceMouseUpHandler = null;
        function setupTraceCanvas() {
            traceDrawn = false;
            const canvas = document.getElementById('trace-canvas');
            const ctx = canvas.getContext('2d');
            ctx.lineWidth = 6;
            ctx.lineCap = 'round';
            ctx.strokeStyle = '#2563eb';
            let drawing = false;
            function pos(e) {
                const rect = canvas.getBoundingClientRect();
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;
                const cx = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
                const cy = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
                return { x: cx * scaleX, y: cy * scaleY };
            }
            function start(e) { drawing = true; traceDrawn = true; const p = pos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); e.preventDefault(); }
            function move(e) { if (!drawing) return; const p = pos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); e.preventDefault(); }
            function end() { drawing = false; }
            canvas.addEventListener('mousedown', start);
            canvas.addEventListener('mousemove', move);
            if (traceMouseUpHandler) window.removeEventListener('mouseup', traceMouseUpHandler);
            traceMouseUpHandler = end;
            window.addEventListener('mouseup', traceMouseUpHandler);
            canvas.addEventListener('touchstart', start, { passive: false });
            canvas.addEventListener('touchmove', move, { passive: false });
            canvas.addEventListener('touchend', end);

        // Four picture words per letter (the first one is the "A is for ..." word).

        const PHONICS_WORDS = {

        // Colours the letter being learned inside each word (first letter, or the x at the end)

            const i = L === 'X' ? word.toLowerCase().lastIndexOf('x') : 0;

        // Mini game: "Which one starts with B?" — 4 rounds, answers lock after the first tap
        function startPhonicsGame() {
            const letters = lettersFor(state.unit);
            const others = ALPHABET.filter(L => !letters.includes(L));
            const rounds = [];
            for (let r = 0; r < 4; r++) {
                const L = letters[r % letters.length];
                const right = PHONICS_WORDS[L][r % 4];
                const fits = ([w]) => L === 'X' ? /x/i.test(w) : w[0].toUpperCase() === L;
                const pool = others.flatMap(o => PHONICS_WORDS[o]).filter(p => !fits(p) && p[1] !== right[1]);
                const wrong = shuffle(pool).slice(0, 2);
                rounds.push({ L, right, options: shuffle([right, ...wrong]) });

            phonicsGame = { rounds, index: 0, score: 0, locked: false };
            showPhonicsRound();

        function showPhonicsRound() {

d."],[83.97,86.2,"Your turn. Say: hydrated."],[88.9,89.72,"hydrated."],[90.72,92.02,"screen fatigue."],[92.72,96.6,"screen fatigue means tiredness caused by looking at screens for too long."],[96.9,99.85,"Take breaks from your phone to avoid screen fatigue."],[100.55,103.05,"Your turn. Say: screen fatigue."],[105.75,106.95,"screen fatigue."],[107.95,109.16,"healthy routine."],[109.86,112.79,"healthy routine means good habits that you do every day."],[113.09,116.06,"A healthy routine includes enough sleep and exercise."],[116.76,119.57,"Your turn. Say: healthy routine."],[122.27,123.5,"healthy routine."],[124.48,125.57,"fresh produce."],[126.27,129.04,"fresh produce means fresh fruit and vegetables."],[129.34,132.14,"The market sells cheap fresh produce every morning."],[132.84,135.28,"Your turn. Say: fresh produce."],[137.97,139.01,"fresh produce."],[140.02,142.16,"Now let's listen to a conversation."],[142.46,144.91,"I've been feeling tired and stressed lately."],[146.22,149.29,"You should take care of your mental health. Are you sleeping enough?"],[150.58,153.27,"Not really. I'm on my phone until midnight."],[154.58,157.87,"You'd better stop that. Screen fatigue can affect your sleep."],[159.18,160.38,"What else should I do?"],[161.68,166.46,"You ought to start a healthy routine: a short workout, fresh produce and lots of water."],[167.75,170.17,"Grammar focus: should · ought to · had better."],[170.47,172.41,"Use should or ought to for advice."],[172.71,175.66,"Use had better for strong advice or a warning."],[175.96,180.19,"For example: You should drink more water. You'd better stop, or you'll get ill."],[180.49,185.53,"Had better is stronger than should and often suggests a bad result if you don't follow the advice."],[186.52,189.55,"Now read and listen. Small Habits, Big Changes."],[189.85,193.18,"Doctors say that small daily habits can improve our wellbeing."],[194.48,197.67,"A ten-minute workout is better than no exercise at all."],[198.98,201.99,"Staying hydrated helps us concentrate and reduces headaches."],[203.28,207.56,"Turning off screens an hour before bed can reduce anxiety and improve sleep."],[208.85,212.08,"Experts say we should eat fresh produce with every meal."],[213.38,215.86,"Quiz time! Choose the correct answer."],[216.16,218.74,"A feeling of worry or nervousness is blank."],[219.04,222.29,"A, wellbeing. B, anxiety. C, workout."],[226.28,228.22,"The answer is B: anxiety."],[229.72,232.06,"You look ill. You blank see a doctor."],[232.36,235.12,"A, should. B, shouldn't. C, had."],[239.12,241.12,"The answer is A: should."],[242.62,244.87,"You blank leave now, or you'll miss the bus."],[245.17,248.05,"A, had better. B, ought. C, should to."],[252.05,253.57,"The answer is A: had better."],[255.08,257.36,"Tiredness from looking at screens is blank."],[257.66,261.92,"A, screen fatigue. B, mental health. C, fresh produce."],[265.92,268.1,"The answer is A: screen fatigue."],[269.62,273.11,"According to the text, turning off screens before bed can blank."],[273.41,278.13,"A, cause headaches. B, reduce anxiety. C, replace exercise."],[282.15,284.58,"The answer is B: reduce anxiety."],[286.08,289.65,"Now it's your turn to speak. What advice would you give to a stressed friend?"],[294.95,299.36,"You should take short breaks, go for a walk and talk to someone you trust."],[299.66,300.98,"Excellent answer, Nita!"],[301.98,305.54,"Great work today! You learned eight new words and should · ought to · had better."],[305.84,309.14,"Today's value is healthy body. Move your body every day."],[309.44,312.06,"See you in Unit six. Goodbye!"],[312.36,315.01,"Thank you, Mr. Daniel! Bye, everyone!"]],"OC-Intermediate-Unit06-Living-with-Technology":[[0.35,4.76,"Hello, everyone! I'm Mr. Daniel. Welcome to Online Intermediate."],[5.06,8.27,"Hi! I'm Nita. Let's learn together!"],[8.57,14.5,"Unit six: Living with Technology. In this unit, you will talk about technology habits and digital life."],[15.48,17.02,"notification overload."],[17.72,22.23,"notification overload means receiving too many alerts on your phone or computer."],[22.53,25.7,"Notification overload makes it hard to concentrate."],[26.4,29.82,"Your turn. Say: notification overload."],[32.52,34.3,"notification overload."],[35.28,36.67,"digital detox."],[37.37,41.49,"digital detox means a period of time without using phones or computers."],[41.79,44.42,"I did a weekend digital detox in the countryside."],[45.12,47.71,"Your turn. Say: digital detox."],[50.41,51.83,"digital detox."],[52.82,53.95,"cloud storage."],[54.65,58.69,"cloud storage means saving files on the internet instead of on your device."],[58.99,61.26,"All my photos are backed up in cloud storage."],[61.95,64.46,"Your turn. Say: cloud storage."],[67.16,68.38,"cloud storage."],[69.38,70.59,"smart speaker."],[71.29,74.45,"smart speaker means a speaker you can control with your voice."],[74.75,77.46,"Our smart speaker plays music when I ask it to."],[78.16,80.61,"Your turn. Say: smart speaker."],[83.31,84.53,"smart speaker."],[85.52,86.81,"cyber security."],[87.51,91.23,"cyber security means protecting computers and data from attacks."],[91.53,94.2,"Banks spend a lot of money on cyber security."],[94.9,97.56,"Your turn. Say: cyber security."],[100.26,101.72,"cyber security."],[102.72,103.93,"password manager."],[104.63,108.59,"password manager means an app that stores all your passwords safely."],[108.89,112.64,"A password manager helps you use different passwords."],[113.34,115.94,"Your turn. Say: password manager."],[118.63,120.12,"password manager."],[121.12,122.11,"tech support."],[122.81,126.98,"tech support means help from experts when a device or program has a problem."],[127.28,130.24,"I called tech support because my laptop wouldn't start."],[130.94,133.05,"Your turn. Say: tech support."],[135.75,136.82,"tech support."],[137.82,139.09,"screen time report."],[139.78,142.81,"screen time report means a summary of how long you used your phone."],[143.11,146.44,"My screen time report says I used my phone for six hours!"],[147.14,150.16,"Your turn. Say: screen time report."],[152.87,154.3,"screen time report."],[155.28,157.41,"Now let's listen to a conversation."],[157.71,160.0,"Nita, you look worried. What's wrong?"],[161.32,165.38,"My laptop has been crashing all morning, and I've lost some files."],[166.68,168.8,"Have you been saving them in cloud storage?"],[170.08,173.25,"No, I haven't. I've been meaning to set it up for weeks."],[174.55,177.64,"Call tech support, and then try a digital detox this weekend."],[178.95,182.69,"Good idea. My screen time report has been terrible lately!"],[183.98,187.49,"Grammar focus: Present perfect continuous."],[187.79,192.93,"Use the present perfect continuous for an activity that started in the past and continues now."],[193.23,195.26,"We often use it with for and since."],[195.56,198.79,"For example: I have been using this phone for three years."],[199.09,203.87,"Use it to focus on the activity and how long it has continued, often with for and since."],[204.85,207.47,"Now read and listen. Are We Too Connected?."],[207.77,210.85,"The average person checks their phone more than ninety times a day."],[212.15,216.32,"Many people have been suffering from notification overload without realising it."],[217.62,221.61,"Some workers have started a weekly digital detox to protect their focus."],[222.92,226.82,"Experts also recommend checking your screen time report every week."],[228.12,232.17,"Technology is useful, but we need to control it, not let it control us."],[233.48,235.97,"Quiz time! Choose the correct answer."],[236.27,239.12,"A period without phones or computers is a blank."],[239.42,243.92,"A, digital detox. B, smart speaker. C, cloud storage."],[247.92,250.36,"The answer is A: digital detox."],[251.85,254.1,"I blank English since 2020."],[254.41,257.62,"A, have been learning. B, am learning. C, learned."],[261.62,263.71,"The answer is A: have been learning."],[265.22,266.53,"How long blank waiting?"],[266.83,269.78,"A, are you. B, have you been. C, did you."],[273.78,275.83,"The answer is B: have you been."],[277.32,280.25,"An app that stores passwords safely is a blank."],[280.55,285.69,"A, tech support. B, password manager. C, screen time report."],[289.68,292.09,"The answer is B: password manager."],[293.58,296.37,"According to the text, people check their phones blank."],[296.67,301.57,"A, about nine times a day. B, more than ninety times a day. C, once an hour."],[305.58,308.51,"The answer is B: more than ninety times a day."],[310.02,314.11,"Now it's your turn to speak. How has technology changed your daily life?"],[319.41,323.58,"I've been using online banking for two years, so I rarely carry cash now."],[323.88,325.41,"Excellent answer, Nita!"],[326.42,330.75,"Great work today! You learned eight new words and present perfect continuous."],[331.05,334.55,"Today's value is good habits. Do good things every day."],[334.85,337.03,"See you in Unit seven. Goodbye!"],[337.33,339.95,"Thank you, Mr. Daniel! Bye, everyone!"]],"OC-Intermediate-Unit07-Career-Paths":[[0.35,4.51,"Hello, everyone! I'm Mr. Daniel. Welcome to Online Intermediate."],[4.81,7.98,"Hi! I'm Nita. Let's learn together!"],[8.28,15.23,"Unit seven: Career Paths. In this unit, you will talk about jobs, ambitions and imaginary situations."],[16.22,17.25,"career path."],[17.95,21.6,"career path means the series of jobs you have during your working life."],[21.9,24.27,"Nita is still choosing her career path."],[24.97,27.67,"Your turn. Say: career path."],[30.37,31.6,"career path."],[32.62,33.99,"job satisfaction."],[34.69,37.92,"job satisfaction means the feeling of enjoying your job."],[38.22,40.41,"Doctors often have high job satisfaction."],[41.1,43.51,"Your turn. Say: job satisfaction."],[46.21,47.76,"job satisfaction."],[48.75,49.8,"career change."],[50.5,53.76,"career change means moving to a completely different type of work."],[54.06,57.22,"At forty, my uncle made a career change itional for imaginary or unlikely situations."],[183.59,186.16,"If plus past simple, then would plus verb."],[186.46,190.21,"For example: If I had more time, I would learn Japanese."],[190.51,192.9,"We often say 'If I were you' to give advice."],[193.92,196.89,"Now read and listen. Choosing a Career in Cambodia."],[197.19,200.85,"Cambodia's job market is changing quickly as the economy grows."],[202.15,205.89,"Today, there is high demand for workers with digital and language skills."],[207.18,211.24,"Many graduates would choose a different career path if they could start again."],[212.55,217.12,"Experts say that work experience is often as valuable as a high qualification level."],[218.42,222.62,"Internships are a great way to find out what really gives you job satisfaction."],[223.92,226.4,"Quiz time! Choose the correct answer."],[226.69,229.6,"Moving to a completely different type of work is a blank."],[229.9,234.92,"A, salary increase. B, career change. C, job market."],[238.92,241.39,"The answer is B: career change."],[242.88,246.09,"If I blank rich, I would buy a house for my parents."],[246.39,249.73,"A, am. B, were. C, will be."],[253.72,255.17,"The answer is B: were."],[256.68,259.62,"If she studied harder, she blank the exam."],[259.92,263.66,"A, would pass. B, will pass. C, passes."],[267.65,269.58,"The answer is A: would pass."],[271.08,274.21,"The reputation of a company as a workplace is its blank."],[274.51,278.57,"A, employer brand. B, career path. C, work experience."],[282.58,284.85,"The answer is A: employer brand."],[286.35,289.48,"According to the text, which skills are in high demand?"],[289.78,294.89,"A, digital and language skills. B, farming skills. C, driving skills."],[298.88,301.7,"The answer is A: digital and language skills."],[303.18,307.29,"Now it's your turn to speak. If you could have any job in the world, what would it be?"],[312.59,318.99,"If I could have any job, I would be a travel journalist, because I love writing and exploring urrent affairs programme every evening."],[87.9,90.98,"Your turn. Say: current affairs."],[93.68,94.89,"current affairs."],[95.88,96.93,"viral video."],[97.63,100.78,"viral video means a video that spreads very quickly online."],[101.08,104.32,"The viral video of the dancing elephant got ten million views."],[105.02,107.62,"Your turn. Say: viral video."],[110.32,111.38,"viral video."],[112.38,113.45,"influencer."],[114.15,118.22,"influencer means a person who affects what their online followers think or buy."],[118.52,121.5,"The influencer recommended a new phone to her fans."],[122.19,125.09,"Your turn. Say: influencer."],[127.79,128.92,"influencer."],[129.92,130.71,"clickbait."],[131.41,134.96,"clickbait means a misleading headline that makes you click on a link."],[135.26,138.08,"'You won't believe this!' is typical clickbait."],[138.78,141.12,"Your turn. Say: clickbait."],[143.82,144.8,"clickbait."],[145.78,147.76,"Now let's listen to a conversation."],[148.06,149.97,"Did you see the headline news this morning?"],[151.25,154.99,"Yes. The reporter said that the new bridge would open next month."],[156.28,157.26,"Where did you read it?"],[158.55,162.79,"On social media. An influencer said it was the biggest bridge in the country."],[164.08,168.45,"Be careful. Social media isn't always a reliable source of news."],[169.75,173.55,"You're right. My teacher told us that a lot of posts were clickbait."],[174.85,177.44,"Grammar focus: Reported speech (statements)."],[177.74,181.96,"In reported speech, the tense usually moves one step back into the past."],[182.26,184.5,"Is becomes was, and will becomes would."],[184.8,188.42,"For example: The bridge is open. She said the bridge was open."],[188.72,192.87,"Use say without a person (He said that ...) and tell with a person (He told me that ...)."],[193.85,196.42,"Now read and listen. Spotting Fake News."],[196.72,200.88,"Fake news spreads six times faster than true stories on social media."],[202.18,204.91,"A study said t minded."],[114.45,115.35,"respond."],[116.05,118.21,"respond means to answer or react."],[118.51,121.04,"He didn't respond to my message for two days."],[121.74,123.76,"Your turn. Say: respond."],[126.46,127.47,"respond."],[128.48,129.87,"express an opinion."],[130.57,133.32,"express an opinion means to say what you think."],[133.62,136.5,"Don't be afraid to express an opinion in class."],[137.2,140.13,"Your turn. Say: express an opinion."],[142.84,144.38,"express an opinion."],[145.38,147.35,"Now let's listen to a conversation."],[147.65,150.52,"I had a small disagreement with my group yesterday."],[151.82,152.67,"What happened?"],[153.98,157.49,"I wanted to express an opinion, but nobody stopped talking."],[158.78,162.28,"Try asking them to listen. And avoid raising your tone of voice."],[163.58,166.09,"I promise to stay calm and open-minded."],[167.38,171.29,"Good. Active listening means letting others finish before you respond."],[172.58,175.99,"Grammar focus: Gerund vs infinitive."],[176.29,179.92,"Some verbs are followed by the -ing form, like enjoy, avoid and keep."],[180.22,183.99,"Others are followed by to plus verb, like want, decide and promise."],[184.29,188.45,"For example: I enjoy talking to people. He decided to apologise."],[188.75,192.44,"After prepositions, always use the -ing form: I'm good at listening."],[193.45,196.18,"Now read and listen. Listen More, Talk Less."],[196.48,199.64,"Most people think good communication means speaking well."],[200.95,205.03,"In fact, researchers say that active listening is even more important."],[206.32,209.66,"Good listeners avoid interrupting and keep asking questions."],[210.95,214.37,"Body posture and tone of voice also send strong messages."],[215.65,219.09,"If you decide to listen first, you will have fewer misunderstandings."],[220.38,222.69,"Quiz time! Choose the correct answer."],[222.99,225.29,"Willing to listen to new ideas is blank."],[225.59,229.36,"A, open-minded. B, misunderstanding. C, respond."], ns a card that lets you buy now and pay later."],[49.46,52.34,"Be careful: a credit card can make you overspend."],[53.04,55.15,"Your turn. Say: credit card."],[57.85,58.93,"credit card."],[59.92,60.93,"interest rate."],[61.63,64.87,"interest rate means the percentage you pay extra when you borrow money."],[65.17,67.59,"The bank's interest rate is seven percent a year."],[68.29,70.99,"Your turn. Say: interest rate."],[73.69,74.83,"interest rate."],[75.82,77.06,"emergency fund."],[77.76,81.32,"emergency fund means money saved for unexpected problems."],[81.62,85.67,"Experts say an emergency fund should cover three months of costs."],[86.37,89.16,"Your turn. Say: emergency fund."],[91.86,93.22,"emergency fund."],[94.22,95.21,"monthly bill."],[95.91,98.75,"monthly bill means a payment you must make every month."],[99.05,101.18,"Our biggest monthly bill is the rent."],[101.88,103.98,"Your turn. Say: monthly bill."],[106.68,107.66,"monthly bill."],[108.65,110.02,"financial advice."],[110.72,113.63,"financial advice means help from an expert about money."],[113.93,116.24,"She asked her bank for financial advice."],[116.94,119.63,"Your turn. Say: financial advice."],[122.33,123.85,"financial advice."],[124.85,125.85,"invest."],[126.55,129.49,"invest means to put money into something to make more money."],[129.79,132.49,"Many young people invest in small businesses."],[133.19,135.41,"Your turn. Say: invest."],[138.11,139.18,"invest."],[140.18,142.23,"Now let's listen to a conversation."],[142.53,145.93,"I got my first salary, but it's almost gone!"],[147.25,150.6,"Do you have a budget plan? You have to know where your money goes."],[151.88,155.42,"Not yet. I must pay my monthly bills first, right?"],[156.72,159.62,"Yes. And you should start an emergency fund."],[160.92,162.64,"Do I have to get a credit card?"],[163.95,168.27,"No, you don't have to. Be careful: the interest rate can be very high."],[169.58,172.27,"Grammar focus: must · have to · don't have to."],[172.57,175.21,"Use must or have to when something is necessary."],[175.51,179.63,"Mustn't means it is not allowed. Don't have to means it is not necessary."],[179.93,184.01,"For example: You mustn't share your PIN, but you don't have to pay in cash."],[184.31,188.49,"Mustn't and don't have to have very different meanings: one is forbidden, the other is optional."],[189.48,193.23,"Now read and listen. The 50-30-20 Rule."],[193.53,199.22,"Many financial experts recommend a simple budget plan called the 50-30-20 rule."],[200.52,204.36,"Fifty percent of your income goes to needs, like rent and monthly bills."],[205.65,208.83,"Thirty percent is for wants, such as eating out and hobbies."],[210.15,215.07,"The last twenty percent must go to savings, an emergency fund or paying off debt."],[216.38,220.24,"You don't have to follow it exactly, but it is a great place to start."],[221.55,224.12,"Quiz time! Choose the correct answer."],[224.42,226.45,"Money that you owe someone is blank."],[226.75,230.05,"A, debt. B, invest. C, budget plan."],[234.05,235.86,"The answer is A: debt."],[237.35,240.4,"You blank wear a seatbelt in a car. It's the law."],[240.7,243.56,"A, don't have to. B, must. C, mustn't."],[247.55,249.24,"The answer is B: must."],[250.75,253.34,"It's a holiday tomorrow, so we blank go to work."],[253.64,257.09,"A, mustn't. B, don't have to. C, must."],[261.08,263.0,"The answer is B: don't have to."],[264.52,267.28,"Money saved for unexpected problems is an blank."],[267.58,271.75,"A, interest rate. B, emergency fund. C, credit card."],[275.75,278.32,"The answer is B: emergency fund."],[279.82,282.7,"According to the text, what percentage goes to savings?"],[283.0,286.87,"A, fifty percent. B, thirty percent. C, twenty percent."],[290.88,293.12,"The answer is C: twenty percent."],[294.62,297.94,"Now it's your turn to speak. What are your tips for saving money?"],[303.24,308.53,"I have to pay my bills first, then I save twenty percent, and I don't buy things I don't need."],[308.83,310.49,"Excellent answer, Nita!"],[311.48,315.36,"Great work today! You learned eight new words and must · have to · don't have to."],[315.65,319.39,"Today's value is responsibility. Help at home and do your jobs."],[319.69,322.25,"See you in Unit fifteen. Goodbye!"],[322.55,325.37,"Thank you, Mr. Daniel! Bye, everyone!"]],"OC-Intermediate-Unit15-Traditions-and-Festivals":[[0.35,4.93,"Hello, everyone! I'm Mr. Daniel. Welcome to Online Intermediate."],[5.23,8.47,"Hi! I'm Nita. Let's learn together!"],[8.77,15.16,"Unit fifteen: Traditions and Festivals. In this unit, you will describe Cambodian traditions and ceremonies."],[16.15,17.06,"offering."],[17.76,22.2,"offering means food, flowers or money given at a temple or to spirits."],[22.5,24.87,"Families bring offerings of fruit to the pagoda."],[25.57,28.01,"Your turn. Say: offering."],[30.71,31.72,"offering."],[32.72,33.51,"procession."],[34.21,38.04,"procession means a line of people walking slowly as part of a ceremony."],[38.34,41.36,"The wedding procession carried gifts to the bride's house."],[42.06,44.24,"Your turn. Say: procession."],[46.94,47.87,"procession."],[48.88,50.15,"blessing ceremony."],[50.85,54.29,"blessing ceremony means a ceremony where monks give good wishes."],[54.59,57.08,"We held a blessing ceremony for our new house."],[57.78,60.31,"Your turn. Say: blessing ceremony."],[63.01,64.35,"blessing ceremony."],[65.35,66.06,"fortune."],[66.76,69.5,"fortune means luck, or what will happen to you in the future."],[69.8,72.79,"Some people visit a fortune teller before a big decision."],[73.49,75.43,"Your turn. Say: fortune."],[78.13,78.89,"fortune."],[79.88,81.08,"pagoda festival."],[81.78,85.31,"pagoda festival means a celebration held at a Buddhist temple."],[85.61,88.67,"The pagoda festival had music, food and games."],[89.37,91.78,"Your turn. Say: pagoda festival."],[94.48,95.93,"pagoda festival."],[96.92,98.15,"spirit house."],[98.85,102.97,"spirit house means a small shrine where people give offerings to local spirits."],[103.27,106.37,"Every morning, Grandma puts flowers in the spirit house."],[107.06,110.04,"Your turn. Say: spirit house."],[112.74,113.88,"spirit house."],[114.88,115.85,"incense."],[116.55,119.59,"incense means sticks that make a sweet smell when burned."],[119.89,122.07,"The air in the temple smelled of incense."],[122.77,125.0,"Your turn. Say: incense."],[127.7,128.84,"incense."],[129.85,130.89,"merit-making."],[131.59,134.39,"merit-making means doing good deeds to gain good karma."],[134.69,137.19,"Merit-making is an important part of Pchum Ben."],[137.88,140.17,"Your turn. Say: merit-making."],[142.87,144.08,"merit-making."],[145.08,147.09,"Now let's listen to a conversation."],[147.39,150.35,"Nita, what's the festival that you enjoy most?"],[151.65,155.8,"Pchum Ben. It's the festival when we remember our ancestors."],[157.12,158.31,"What do people do?"],[159.62,163.28,"They visit the pagoda which is closest to their home and bring offerings."],[164.58,166.07,"Is merit-making important?"],[167.38,171.56,"Very. The food that we give to monks is for our ancestors' spirits."],[172.85,175.6,"Grammar focus: Defining relative clauses."],[175.9,179.43,"Defining relative clauses give essential information about a noun."],[179.72,184.37,"Use who for people, which or that for things, where for places and when for times."],[184.67,187.99,"For example: A monk is a person who lives in a pagoda."],[188.29,192.48,"In defining relative clauses, we don't use commas, and that can replace who or which."],[193.48,197.34,"Now read and listen. Pchum Ben: The Festival of the Ancestors."],[197.64,202.28,"Pchum Ben is a fifteen-day festival which takes place in September or October."],[203.58,207.27,"It is the time when Cambodians remember the spirits of their ancestors."],[208.55,212.19,"Families who live in the city travel home to visit their local pagoda."],[213.48,217.81,"They bring offerings of rice and food, and monks lead blessing ceremonies."],[219.12,222.96,"Merit-making during Pchum Ben is believed to help ancestors find peace."],[224.25,226.67,"Quiz time! Choose the correct answer."],[226.97,229.51,"Sticks that smell sweet when burned are blank."],[229.81,233.21,"A, incense. B, offerings. C, fortune."],[237.22,239.16,"The answer is A: incense."],[240.65,243.6,"A tour guide is a person blank shows tourists around."],[243.9,246.54,"A, which. B, who. C, where."],[250.55,252.14,"The answer is B: who."],[253.65,255.57,"This is the village blank I grew up."],[255.87,258.5,"A, where. B, which. C, who."],[262.52,264.18,"The answer is A: where."],[265.68,268.01,"Doing good deeds to gain good karma is blank."],[268.31,272.2,"A, procession. B, merit-making. C, spirit house."],[276.22,279.06,"The answer is B: merit-making."],[280.55,283.06,"According to the text, Pchum Ben lasts blank."],[283.36,287.1,"A, three days. B, fifteen days. C, one month."],[291.08,293.56,"The answer is B: fifteen days."],[295.05,299.34,"Now it's your turn to speak. Describe a festival that is important in your family."],[304.64,311.04,"Khmer New Year is the festival when my whole family meets, plays traditional games and visits the pagoda."],[311.34,312.82,"Excellent answer, Nita!"],[313.82,317.98,"Great work today! You learned eight new words and defining relative clauses."],[318.28,322.57,"Today's value is love of country. Love and take care of Cambodia."],[322.87,325.35,"See you in Unit sixteen. Goodbye!"],[325.65,328.24,"Thank you, Mr. Daniel! Bye, everyone!"]],"OC-Intermediate-Unit16-Sport-and-Competition":[[0.35,4.42,"Hello, everyone! I'm Mr. Daniel. Welcome to Online Intermediate."],[4.72,7.85,"Hi! I'm Nita. Let's learn together!"],[8.15,14.88,"Unit sixteen: Sport and Competition. In this unit, you will talk about sport, competitions and past events."],[15.88,16.76,"athlete."],[17.46,19.94,"athlete means a person who is very good at sport."],[20.24,23.1,"Cambodian athletes won medals at the SEA Games."],[23.8,25.68,"Your turn. Say: athlete."],[28.38,29.24,"athlete."],[30.25,31.2,"qualify."],[31.91,35.15,"qualify means to win a place in the next stage of a competition."],[35.45,37.34,"Our team qualified for the final."],[38.04,40.02,"Your turn. Say: qualify."],[42.72,43.73,"qualify."],[44.72,45.53,"defeat."],[46.23,49.5,"defeat means a loss in a competition; to beat someone."],[49.8,51.81,"It was their first defeat of the season."],[52.51,54.57,"Your turn. Say: defeat."],[57.27,58.11,"defeat."],[59.12,60.2,"opponent team."],[60.9,63.26,"opponent team means the team you play against."],[63.56,66.17,"The opponent team was faster but less organised."],[66.87,69.72,"Your turn. Say: opponent team."],[72.42,73.56,"opponent team."],[74.55,75.74,"personal best."],[76.44,79.77,"personal best means the best result a person has ever achieved."],[80.07,83.41,"She ran her personal best in the 100 metres."],[84.11,86.52,"Your turn. Say: personal best."],[89.22,90.42,"personal best."],[91.42,92.58,"record holder."],[93.28,96.79,"record holder means the person with the best result ever in an event."],[97.09,99.32,"He is the national record holder in swimming."],[100.02,102.7,"Your turn. Say: record holder."],[105.4,106.58,"record holder."],[107.58,108.7,"sportsmanship."],[109.4,112.61,"sportsmanship means fair and polite behaviour in sport."],[112.91,115.94,"Shaking hands after a match shows good sportsmanship."],[116.64,119.36,"Your turn. Say: sportsmanship."],[122.06,123.24,"sportsmanship."],[124.25,125.11,"training camp."],[125.81,129.81,"training camp means a place where athletes train together for a period."],[130.11,132.65,"The team spent a month at a training camp in Thailand."],[133.35,136.28,"Your turn. Say: training camp."],[138.98,140.0,"training camp."],[140.98,142.93,"Now let's listen to a conversation."],[143.22,145.62,"Did you watch the football final last night?"],[146.92,151.06,"Yes! I couldn't believe they had qualified after losing the first match."],[152.35,155.02,"They had trained at a training camp for two months."],[156.32,160.47,"That explains it. Before the game, they had never beaten that opponent team."],[161.78,164.99,"And the captain showed great sportsmanship after the whistle."],[166.28,169.26,"He had scored his personal best: three goals!"],[170.55,172.58,"Grammar focus: Past perfect."],[172.88,176.75,"Use the past perfect for an action that happened before another past action."],[177.05,178.96,"Had plus past participle."],[179.26,181.78,"For example: She won because she had trained hard."],[182.08,185.88,"We often use already, never, just and by the time with the past perfect."],[186.88,189.52,"Now read and listen. A Champion's Comeback."],[189.82,194.8,"Before the 2023 SEA Games, the young runner had suffered a serious injury."],[196.08,198.68,"Many people believed that she had finished her career."],[199.98,203.21,"However, she had spent six months at a training camp to recover."],[204.52,208.59,"In the final, she defeated the record holder and ran her personal best."],[209.88,213.14,"She later said that she had learned more from defeat than from victory."],[214.45,216.84,"Quiz time! Choose the correct answer."],[217.13,219.82,"A person who is very good at sport is an blank."],[220.12,223.9,"A, athlete. B, opponent team. C, training camp."],[227.92,229.58,"The answer is A: athlete."],[231.08,232.78,"When we arrived, the game blank."],[233.08,237.49,"A, already started. B, had already started. C, has already started."],[241.48,243.66,"The answer is B: had already started."],[245.15,247.18,"He was tired because he blank all day."],[247.48,250.72,"A, had worked. B, works. C, has worked."],[254.72,256.39,"The answer is A: had worked."],[257.88,260.21,"Fair and polite behaviour in sport is blank."],[260.51,264.32,"A, defeat. B, sportsmanship. C, personal best."],[268.32,270.34,"The answer is B: sportsmanship."],[271.85,274.67,"According to the text, before the games the runner blank."],[274.97,278.98,"A, had won a medal. B, had suffered an injury. C, had retired."],[282.98,285.55,"The answer is B: had suffered an injury."],[287.05,291.39,"Now it's your turn to speak. Tell me about a time you or your team won or lost something."],[296.69,301.22,"Our team lost the final because we had not practised enough, but we learned a lot."],[301.52,303.05,"Excellent answer, Nita!"],[304.05,307.41,"Great work today! You learned eight new words and past perfect."],[307.71,311.55,"Today's value is fair play. Play fairly and follow the rules."],[311.85,314.58,"See you in Unit seventeen. Goodbye!"],[314.88,317.75,"Thank you, Mr. Daniel! Bye, everyone!"]],"OC-Intermediate-Unit17-Crime-and-Safety":[[0.35,4.6,"Hello, everyone! I'm Mr. Daniel. Welcome to Online Intermediate."],[4.9,8.12,"Hi! I'm Nita. Let's learn together!"],[8.42,13.89,"Unit seventeen: Crime and Safety. In this unit, you will talk about crime, safety and prevention."],[14.88,15.71,"crime rate."],[16.41,19.0,"crime rate means the number of crimes in a place."],[19.3,21.5,"The crime rate in the city has fallen this year."],[22.2,24.32,"Your turn. Say: crime rate."],[27.02,28.07,"crime rate."],[29.05,29.71,"theft."],[30.41,32.32,"theft means the crime of stealing."],[32.62,35.02,"Phone theft is common in crowded markets."],[35.72,37.65,"Your turn. Say: theft."],[40.35,40.97,"theft."],[41.95,42.81,"scam."],[43.51,46.44,"scam means a dishonest plan to get money from people."],[46.74,50.01,"Don't answer messages that promise free money: it's a scam."],[50.7,53.08,"Your turn. Say: scam."],[55.78,56.64,"scam."],[57.65,58.55,"CCTV."],[59.25,63.2,"CCTV means video cameras that record public places for security."],[63.5,65.16,"The thief was caught on CCTV."],[65.86,68.29,"Your turn. Say: CCTV."],[70.99,71.88,"CCTV."],[72.88,73.81,"burglary."],[74.52,77.49,"burglary means the crime of entering a building to steal."],[77.79,79.97,"There was a burglary at the shop last night."],[80.67,83.27,"Your turn. Say: burglary."],[85.97,86.9,"burglary."],[87.92,88.7,"victim."],[89.4,92.38,"victim means a person who is hurt or harmed by a crime."],[92.68,95.06,"The victim reported the crime to the police."],[95.75,97.98,"Your turn. Say: victim."],[100.68,101.55,"victim."],[102.55,103.78,"report a crime."],[104.48,107.21,"report a crime means to tell the police about a crime."],[107.51,110.13,"You can report a crime online or at a police station."],[110.83,113.45,"Your turn. Say: report a crime."],[116.15,117.48,"report a crime."],[118.48,119.59,"online fraud."],[120.29,124.12,"online fraud means a crime where someone tricks you on the internet to get money."],[124.42,126.99,"Online fraud is increasing around the world."],[127.69,130.43,"Your turn. Say: online fraud."],[133.12,134.45,"online fraud."],[135.45,137.51,"Now let's listen to a conversation."],[137.81,140.97,"My neighbour was a victim of online fraud last week."],[142.28,144.68,"That's terrible. Did she report the crime?"],[145.98,150.24,"Yes. The police said the money might be returned, but they weren't sure."],[151.55,155.33,"These scams must be stopped. People should be taught how to recognise them."],[156.62,160.97,"Our building has CCTV now, so burglary should be prevented too."],[162.28,165.46,"Good. Crime can be reduced if everyone is careful."],[166.75,169.59,"Grammar focus: Passive with modals."],[169.88,173.86,"Use a modal plus be plus past participle to make the passive with modals."],[174.16,178.24,"For example: crime can be reduced, and scams must be reported."],[178.54,181.28,"It is common in rules, notices and advice."],[181.58,187.38,"Use this structure for rules, possibilities and advice when the action is more important than the person."],[188.38,190.95,"Now read and listen. Staying Safe Online."],[191.25,194.87,"Online fraud has become one of the fastest-growing crimes in Asia."],[196.18,200.03,"Many scams are sent as text messages that look like they come from a bank."],[201.32,204.87,"Victims are often asked to click a link and enter their password."],[206.18,209.9,"Experts say that suspicious messages should be deleted immediately."],[211.22,215.19,"Every scam should be reported, because it can help protect other people."],[216.48,218.91,"Quiz time! Choose the correct answer."],[219.22,220.96,"The crime of stealing is blank."],[221.26,224.19,"A, theft. B, victim. C, CCTV."],[228.18,230.0,"The answer is A: theft."],[231.48,233.88,"Your password should blank every few months."],[234.18,237.22,"A, change. B, be changed. C, changed."],[241.22,243.08,"The answer is B: be changed."],[244.58,246.69,"These rules must blank by all students."],[246.99,250.16,"A, be followed. B, follow. C, following."],[254.15,255.85,"The answer is A: be followed."],[257.35,259.7,"A dishonest plan to get money is a blank."],[260.0,263.64,"A, scam. B, crime rate. C, burglary."],[267.65,269.25,"The answer is A: scam."],[270.75,273.84,"According to the text, suspicious messages should be blank."],[274.14,277.2,"A, answered. B, deleted. C, shared."],[281.22,282.75,"The answer is B: deleted."],[284.25,288.41,"Now it's your turn to speak. What can people do to stay safe in a big city?"],[293.71,298.53,"Bags should be kept close to your body, and phones shouldn't be left on café tables."],[298.83,300.39,"Excellent answer, Nita!"],[301.38,305.35,"Great work today! You learned eight new words and passive with modals."],[305.65,309.33,"Today's value is safety. Be careful near cars and roads."],[309.63,312.04,"See you in Unit eighteen. Goodbye!"],[312.34,315.1,"Thank you, Mr. Daniel! Bye, everyone!"]],"OC-Intermediate-Unit18-Science-and-Innovation":[[0.35,5.01,"Hello, everyone! I'm Mr. Daniel. Welcome to Online Intermediate."],[5.31,8.38,"Hi! I'm Nita. Let's learn together!"],[8.68,15.16,"Unit eighteen: Science and Innovation. In this unit, you will talk about inventions, science and future plans."],[16.15,17.05,"researcher."],[17.75,22.18,"researcher means a person who studies something carefully to discover new facts."],[22.48,25.08,"The researcher is testing
