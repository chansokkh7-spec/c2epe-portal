,155.8,"I'm visiting a robotics exhibition on Saturday."],[157.12,161.15,"Sounds great! I'm going to learn about 3D printing next month."],[162.45,166.15,"Excellent. Do you think electric vehicles will replace motorbikes?"],[167.45,169.86,"I think they will, but it will take time."],[171.15,174.62,"The exhibition starts at nine, so I'll pick you up at eight thirty."],[175.92,178.22,"Grammar focus: Future forms."],[178.52,180.96,"Use will for predictions and quick decisions."],[181.26,185.42,"Use going to for plans, and the present continuous for fixed arrangements."],[185.72,190.17,"For example: I'm going to study engineering, and we're meeting the researcher at ten."],[190.47,193.99,"Use the present simple for timetables: The exhibition starts at nine."],[194.98,198.04,"Now read and listen. Drones on the Farm."],[198.34,202.55,"In Cambodia, a new generation of farmers is starting to use drones."],[203.85,207.7,"The drones fly over rice fields and spray fertiliser in a few minutes."],[208.98,211.6,"Researchers say this will save water, time and money."],[212.88,216.9,"Next year, a local company is going to open a training centre for drone pilots."],[218.22,222.0,"Experts predict that smart farming will become normal within ten years."],[223.32,225.97,"Quiz time! Choose the correct answer."],[226.27,228.84,"A small aircraft without a pilot is a blank."],[229.14,232.09,"A, gene. B, drone. C, robotics."],[236.08,237.72,"The answer is B: drone."],[239.22,240.62,"I think it blank rain later."],[240.92,243.76,"A, will. B, is raining. C, rains."],[247.75,249.49,"The answer is A: will."],[250.98,254.5,"We blank our grandparents tomorrow. We've already bought the tickets."],[254.79,258.38,"A, will visit. B, are visiting. C, visit."],[262.38,264.55,"The answer is B: are visiting."],[266.05,268.42,"Making objects layer by layer is blank."],[268.72,273.02,"A, 3D printing. B, vaccine development. C, invention patent."],[277.02,279.03,"The answer is A: 3D printing."],[280.52,283.9,"According to the text, what is a local company going to open?"],[284.2,290.28,"A, a factory. B, a training centre for drone pilots. C, a robotics club."],[294.28,297.6,"The answer is B: a training centre for drone pilots."],[299.08,304.02,"Now it's your turn to speak. Which invention will change our lives most in the next ten years?"],[309.32,313.95,"I think electric vehicles will change our cities, because the air will be much cleaner."],[314.25,315.79,"Excellent answer, Nita!"],[316.78,320.72,"Great work today! You learned eight new words and future forms."],[321.02,324.65,"Today's value is curiosity. Ask questions and find out."],[324.95,327.13,"See you in Unit nineteen. Goodbye!"],[327.43,330.59,"Thank you, Mr. Daniel! Bye, everyone!"]],"OC-Intermediate-Unit19-Finding-a-Home":[[0.35,4.7,"Hello, everyone! I'm Mr. Daniel. Welcome to Online Intermediate."],[5.0,8.18,"Hi! I'm Nita. Let's learn together!"],[8.48,13.7,"Unit nineteen: Finding a Home. In this unit, you will describe homes and talk about renting."],[14.68,15.39,"tenant."],[16.09,18.82,"tenant means a person who rents a home from a landlord."],[19.12,21.55,"The tenant pays the rent on the first day of the month."],[22.25,24.09,"Your turn. Say: tenant."],[26.79,27.55,"tenant."],[28.55,29.42,"deposit."],[30.12,33.64,"deposit means money you pay at the start of a rental, returned at the end."],[33.94,36.13,"We paid a deposit of two months' rent."],[36.83,39.19,"Your turn. Say: deposit."],[41.89,42.82,"deposit."],[43.82,44.66,"lease."],[45.35,48.08,"lease means a legal contract for renting a home."],[48.38,49.92,"I signed a one-year lease."],[50.62,52.65,"Your turn. Say: lease."],[55.35,56.28,"lease."],[57.28,58.3,"furnished flat."],[59.0,61.84,"furnished flat means a flat that comes with furniture."],[62.14,64.44,"A furnished flat is easier for students."],[65.14,67.41,"Your turn. Say: furnished flat."],[70.11,71.36,"furnished flat."],[72.35,73.62,"utility bill."],[74.32,77.61,"utility bill means a bill for electricity, water or gas."],[77.91,80.28,"Our utility bill is higher in the hot season."],[80.98,83.7,"Your turn. Say: utility bill."],[86.4,87.8,"utility bill."],[88.78,89.92,"spacious."],[90.62,93.13,"spacious means having a lot of space."],[93.43,95.69,"The living room is bright and spacious."],[96.39,99.0,"Your turn. Say: spacious."],[101.69,102.72,"spacious."],[103.72,104.45,"cramped."],[105.15,107.77,"cramped means too small for the people or things in it."],[108.07,110.17,"The student room was cramped and noisy."],[110.87,113.23,"Your turn. Say: cramped."],[115.93,116.7,"cramped."],[117.72,118.72,"location."],[119.42,122.06,"location means the place where something is."],[122.36,126.08,"The location is perfect: close to work and the market."],[126.78,129.16,"Your turn. Say: location."],[131.86,132.94,"location."],[133.95,136.1,"Now let's listen to a conversation."],[136.4,139.67,"I'm looking for a new flat. My room is so cramped."],[140.98,142.54,"What about the one near the market?"],[143.85,147.21,"The location is great, but it's too expensive for me."],[148.52,151.71,"Is the furnished flat near the university spacious enough?"],[153.02,155.94,"It's such a lovely flat, but the deposit is so high!"],[157.25,159.83,"Ask the landlord if you can pay it in two parts."],[161.12,163.48,"Grammar focus: too / enough · so / such."],[163.78,166.74,"Use too before an adjective when something is more than you want."],[167.04,173.66,"Use enough after an adjective when it is sufficient. So goes before adjectives, and such a goes before adjective plus noun."],[173.96,178.44,"For example: The flat is too expensive, but it's such a nice location."],[178.74,182.57,"Enough comes after adjectives but before nouns: big enough · enough rooms."],[183.58,186.46,"Now read and listen. Renting for the First Time."],[186.76,189.82,"Renting your first home is exciting, but it can be stressful."],[191.12,193.65,"Always read the lease carefully before you sign it."],[194.95,198.74,"Check the utility bills, because some old buildings use too much electricity."],[200.05,203.62,"Take photos of the flat when you move in, so you can get your deposit back."],[204.92,208.76,"A cheaper flat isn't always better if the location is too far from work."],[210.05,212.41,"Quiz time! Choose the correct answer."],[212.71,214.75,"A person who rents a home is a blank."],[215.05,218.17,"A, landlord. B, tenant. C, lease."],[222.15,223.87,"The answer is B: tenant."],[225.38,227.36,"The bag is blank heavy to carry."],[227.66,230.25,"A, too. B, enough. C, such."],[234.25,235.76,"The answer is A: too."],[237.25,238.92,"He isn't old blank to drive."],[239.22,241.89,"A, too. B, so. C, enough."],[245.88,247.62,"The answer is C: enough."],[249.12,251.1,"Having a lot of space means blank."],[251.41,255.08,"A, cramped. B, spacious. C, furnished."],[259.08,261.22,"The answer is B: spacious."],[262.72,266.25,"According to the text, why should you take photos when you move in?"],[266.55,271.57,"A, to post online. B, to get your deposit back. C, to show friends."],[275.58,278.02,"The answer is B: to get your deposit back."],[279.52,282.39,"Now it's your turn to speak. Describe your ideal home."],[287.69,293.25,"My ideal home is a spacious flat in a quiet location, close enough to the city centre."],[293.55,295.27,"Excellent answer, Nita!"],[296.28,300.29,"Great work today! You learned eight new words and too / enough · so / such."],[300.59,304.38,"Today's value is responsibility. Help at home and do your jobs."],[304.68,307.05,"See you in Unit twenty. Goodbye!"],[307.35,310.05,"Thank you, Mr. Daniel! Bye, everyone!"]],"OC-Intermediate-Unit20-Making-a-Difference":[[0.35,4.38,"Hello, everyone! I'm Mr. Daniel. Welcome to Online Intermediate."],[4.67,7.61,"Hi! I'm Nita. Let's learn together!"],[7.91,13.19,"Unit twenty: Making a Difference. In this unit, you will talk about volunteering and helping the community."],[14.18,15.03,"fundraiser."],[15.73,19.05,"fundraiser means an event to collect money for a good cause."],[19.34,22.3,"The school held a fundraiser for the flood victims."],[23.0,25.21,"Your turn. Say: fundraiser."],[27.91,28.93,"fundraiser."],[29.92,31.23,"community project."],[31.93,35.93,"community project means work done by local people to improve their area."],[36.23,39.26,"Our community project built a new library."],[39.96,42.57,"Your turn. Say: community project."],[45.27,46.57,"community project."],[47.58,48.69,"non-profit."],[49.39,54.53,"non-profit means an organisation that uses its money to help people, not to make profit."],[54.84,57.75,"She works for a non-profit that teaches girls to code."],[58.45,60.62,"Your turn. Say: non-profit."],[63.32,64.75,"non-profit."],[65.75,66.95,"social cause."],[67.65,71.54,"social cause means a problem in society that people try to solve."],[71.84,74.76,"Education for all is a social cause close to my heart."],[75.46,78.03,"Your turn. Say: social cause."],[80.73,81.95,"social cause."],[82.95,83.79,"campaign."],[84.49,87.91,"campaign means a planned series of activities to achieve a goal."],[88.2,90.62,"The campaign encouraged people to give blood."],[91.32,93.49,"Your turn. Say: campaign."],[96.19,97.28,"campaign."],[98.28,99.46,"donation box."],[100.16,104.42,"donation box means a box where people put money or items to give."],[104.72,107.02,"Please put coins in the donation box."],[107.72,110.24,"Your turn. Say: donation box."],[112.94,114.36,"donation box."],[115.35,116.18,"good deed."],[116.88,119.68,"good deed means a kind action that helps someone."],[119.98,123.36,"Helping an old man cross the road was her good deed for the day."],[124.06,126.36,"Your turn. Say: good deed."],[129.06,129.96,"good deed."],[130.95,131.85,"helping hand."],[132.55,134.69,"helping hand means help or support."],[134.99,137.26,"Thank you for giving me a helping hand with the move."],[137.96,140.21,"Your turn. Say: helping hand."],[142.91,144.07,"helping hand."],[145.08,147.12,"Now let's listen to a conversation."],[147.42,149.59,"Nita, I heard you joined a non-profit."],[150.88,156.09,"Yes! Bright Futures, which teaches English in villages, needed volunteers."],[157.38,159.58,"That's wonderful. What do you do there?"],[160.88,164.21,"I help with a community project, which started last year."],[165.52,167.28,"Are you organising any events?"],[168.58,172.32,"We're having a fundraiser in May, which my friends are helping with."],[173.62,176.95,"Grammar focus: Non-defining relative clauses."],[177.25,180.98,"Non-defining relative clauses add extra information about a noun."],[181.28,183.77,"We put commas around them, and we never use that."],[184.07,188.48,"For example: The fundraiser, which was in May, raised two thousand dollars."],[188.78,193.38,"Non-defining clauses add extra information, so they use commas and never use that."],[194.38,197.29,"Now read and listen. Small Acts, Big Impact."],[197.59,201.02,"Sophea, who is twenty-two, started a reading campaign in her village."],[202.32,206.88,"She placed a donation box at the market, where people could leave old books."],[208.18,211.43,"Within a month, she had collected over five hundred books."],[212.72,216.63,"The project, which began with one good deed, now has thirty volunteers."],[217.92,221.19,"Sophea says that everyone can lend a helping hand in some way."],[222.48,224.91,"Quiz time! Choose the correct answer."],[225.22,227.95,"An event to collect money for a good cause is a blank."],[228.25,231.83,"A, fundraiser. B, good deed. C, donation box."],[235.82,237.7,"The answer is A: fundraiser."],[239.22,241.97,"My brother, blank lives in Tokyo, is an engineer."],[242.27,244.95,"A, which. B, who. C, where."],[248.95,250.56,"The answer is B: who."],[252.05,254.96,"The library, blank opened last year, is very popular."],[255.25,258.08,"A, who. B, that. C, which."],[262.08,263.6,"The answer is C: which."],[265.08,267.57,"A kind action that helps someone is a blank."],[267.87,271.68,"A, campaign. B, good deed. C, non-profit."],[275.68,277.85,"The answer is B: good deed."],[279.35,283.25,"According to the text, how many books did Sophea collect in a month?"],[283.55,287.02,"A, fifty. B, over five hundred. C, thirty."],[291.02,293.23,"The answer is B: over five hundred."],[294.72,298.63,"Now it's your turn to speak. Which social cause is important to you, and why?"],[303.93,310.17,"Education, which changes lives, is the cause I care about most, so I help children read."],[310.47,312.11,"Excellent answer, Nita!"],[313.12,317.69,"Great work today! You learned eight new words and non-defining relative clauses."],[317.99,321.22,"Today's value is community. Help the people in your town."],[321.52,323.95,"See you in Unit twenty-one. Goodbye!"],[324.25,326.96,"Thank you, Mr. Daniel! Bye, everyone!"]],"OC-Intermediate-Unit21-Excellent-Service":[[0.35,4.51,"Hello, everyone! I'm Mr. Daniel. Welcome to Online Intermediate."],[4.81,8.1,"Hi! I'm Nita. Let's learn together!"],[8.4,14.28,"Unit twenty-one: Excellent Service. In this unit, you will make polite requests and ask indirect questions."],[15.28,16.53,"refund policy."],[17.23,21.18,"refund policy means the shop's rules about giving money back."],[21.48,24.71,"The refund policy allows returns within thirty days."],[25.41,28.0,"Your turn. Say: refund policy."],[30.7,31.97,"refund policy."],[32.98,34.09,"polite request."],[34.79,38.32,"polite request means asking for something in a kind, formal way."],[38.62,41.59,"'Could you help me, please?' is a polite request."],[42.29,44.74,"Your turn. Say: polite request."],[47.44,48.73,"polite request."],[49.72,50.66,"helpdesk."],[51.36,55.24,"helpdesk means a place or service that helps customers with problems."],[55.54,58.12,"Call the helpdesk if your internet stops working."],[58.82,60.97,"Your turn. Say: helpdesk."],[63.67,64.67,"helpdesk."],[65.68,66.83,"feedback form."],[67.53,70.86,"feedback form means a form where customers give their opinions."],[71.16,73.63,"Please complete the feedback form after your stay."],[74.33,76.61,"Your turn. Say: feedback form."],[79.31,80.44,"feedback form."],[81.45,82.65,"service quality."],[83.35,86.36,"service quality means how good the service of a company is."],[86.66,89.06,"The hotel is famous for its service quality."],[89.76,92.67,"Your turn. Say: service quality."],[95.37,96.7,"service quality."],[97.68,98.72,"waiting time."],[99.42,101.58,"waiting time means how long you have to wait."],[101.88,104.44,"The waiting time at the bank was forty minutes."],[105.14,107.48,"Your turn. Say: waiting time."],[110.18,111.31,"waiting time."],[112.32,113.47,"solve a problem."],[114.17,116.98,"solve a problem means to find an answer to a problem."],[117.28,119.73,"The manager solved the problem in five minutes."],[120.43,123.2,"Your turn. Say: solve a problem."],[125.9,126.97,"solve a problem."],[127.98,129.18,"manager on duty."],[129.88,133.9,"manager on duty means the manager who is working at that moment."],[134.2,136.46,"I'd like to speak to the manager on duty."],[137.16,139.91,"Your turn. Say: manager on duty."],[142.61,144.04,"manager on duty."],[145.05,147.07,"Now let's listen to a conversation."],[147.37,151.17,"Excuse me. Could you tell me what the refund policy is?"],[152.48,156.0,"Of course. You can return items within fourteen days."],[157.28,160.15,"Do you know whether I can get cash or only store credit?"],[161.45,164.38,"I'm not sure. Let me ask the manager on duty."],[165.68,169.01,"Thank you. Can you tell me how long the waiting time is?"],[170.32,173.98,"About five minutes. We'll solve the problem as quickly as we can."],[175.28,178.0,"Grammar focus: Indirect questions."],[178.3,181.2,"Indirect questions are more polite than direct questions."],[181.5,184.89,"Start with could you tell me or do you know, then use normal word order."],[185.19,188.22,"For example: Could you tell me where the helpdesk is?"],[188.52,192.65,"In indirect questions, use normal word order (subject + verb) and no do / does / did."],[193.65,196.57,"Now read and listen. What Makes Great Service?."],[196.87,200.22,"A recent survey asked customers what makes great service."],[201.52,204.9,"Most people said that a short waiting time was the most important thing."],[206.18,210.07,"Many also wanted staff who could solve a problem without calling a manager."],[211.38,215.01,"Polite requests and a friendly smile made customers feel respected."],[216.32,220.38,"Companies that read every feedback form usually improve their service quality."],[221.68,224.1,"Quiz time! Choose the correct answer."],[224.4,227.46,"A service that helps customers with problems is a blank."],[227.76,231.78,"A, helpdesk. B, feedback form. C, refund policy."],[235.78,237.44,"The answer is A: helpdesk."],[238.95,240.83,"Could you tell me where the station blank?"],[241.13,243.97,"A, is. B, is it. C, does."],[247.98,249.32,"The answer is A: is."],[250.82,253.23,"Do you know blank the shop opens on Sunday?"],[253.53,256.07,"A, does. B, if. C, what."],[260.08,261.55,"The answer is B: if."],[263.05,264.92,"How long you have to wait is the blank."],[265.22,269.06,"A, service quality. B, waiting time. C, polite request."],[273.05,275.12,"The answer is B: waiting time."],[276.62,278.87,"According to the survey, what was most important?"],[279.17,283.85,"A, a short waiting time. B, low prices. C, free gifts."],[287.85,290.2,"The answer is A: a short waiting time."],[291.68,296.36,"Now it's your turn to speak. Describe a time when you received excellent or poor service."],[301.66,307.23,"At a phone shop, the staff solved my problem quickly and politely, so I wrote a great review."],[307.53,309.01,"Excellent answer, Nita!"],[310.02,314.07,"Great work today! You learned eight new words and indirect questions."],[314.37,317.55,"Today's value is politeness. Say please and thank you."],[317.85,320.47,"See you in Unit twenty-two. Goodbye!"],[320.77,323.59,"Thank you, Mr. Daniel! Bye, everyone!"]],"OC-Intermediate-Unit22-Arts-and-Entertainment":[[0.35,4.68,"Hello, everyone! I'm Mr. Daniel. Welcome to Online Intermediate."],[4.98,8.26,"Hi! I'm Nita. Let's learn together!"],[8.56,14.68,"Unit twenty-two: Arts and Entertainment. In this unit, you will describe shows, art and how they make you feel."],[15.68,16.64,"fascinating."],[17.34,19.52,"fascinating means extremely interesting."],[19.82,22.61,"The documentary about the Mekong was fascinating."],[23.31,25.94,"Your turn. Say: fascinating."],[28.64,29.73,"fascinating."],[30.75,31.81,"performance."],[32.51,36.56,"performance means a show in which people act, sing, dance or play music."],[36.86,39.09,"The dancers gave a beautiful performance."],[39.8,42.34,"Your turn. Say: performance."],[45.04,46.09,"performance."],[47.08,47.7,"critic."],[48.4,52.8,"critic means a person who writes their opinion about films, books or art."],[53.1,55.3,"The critic gave the film five stars."],[56.0,58.4,"Your turn. Say: critic."],[61.1,61.96,"critic."],[62.95,63.91,"stage play."],[64.61,68.0,"stage play means a story performed by actors in a theatre."],[68.3,70.81,"We saw a stage play about the Khmer Empire."],[71.51,74.07,"Your turn. Say: stage play."],[76.77,77.75,"stage play."],[78.75,79.94,"box office hit."],[80.64,83.36,"box office hit means a film that makes a lot of money."],[83.66,86.17,"The new Khmer horror film was a box office hit."],[86.87,89.73,"Your turn. Say: box office hit."],[92.43,93.77,"box office hit."],[94.75,95.54,"talented."],[96.24,99.46,"talented means having a natural ability to do something well."],[99.76,101.34,"She is a talented young singer."],[102.04,105.03,"Your turn. Say: talented."],[107.73,108.69,"talented."],[109.68,110.45,"moving."],[111.15,114.72,"moving means making you feel strong emotions, often sadness."],[115.02,117.04,"The ending of the film was very moving."],[117.74,119.92,"Your turn. Say: moving."],[122.62,123.44,"moving."],[124.45,125.16,"premiere."],[125.86,128.75,"premiere means the first public showing of a film or play."],[129.05,131.47,"The actors attended the premiere in Phnom Penh."],[132.17,134.28,"Your turn. Say: premiere."],[136.98,137.83,"premiere."],[138.82,140.92,"Now let's listen to a conversation."],[141.22,144.0,"Did you see the new stage play at the national theatre?"],[145.28,148.94,"Yes! The performance was amazing. I was really moved."],[150.25,152.31,"I heard the ending was very moving."],[153.62,157.5,"It was. But the first hour was a bit boring, to be honest."],[158.78,161.64,"The critic said the actors were extremely talented."],[162.95,166.01,"I agree. I was fascinated by the costumes too."],[167.32,170.66,"Grammar focus: -ed and -ing adjectives."],[170.96,174.05,"Use -ing adjectives to describe the thing or situation."],[174.35,177.46,"Use -ed adjectives to describe how a person feels."],[177.76,181.2,"For example: The film was boring, so I was bored."],[181.5,185.2,"Be careful: 'I am boring' means other people find you boring!"],[186.22,189.09,"Now read and listen. A Golden Age for Khmer Film."],[189.39,193.84,"In the 1960s, Cambodia had a very exciting film industry."],[195.15,198.1,"Talented directors made hundreds of films every year."],[199.42,202.18,"Sadly, most of these films were lost during the war."],[203.48,207.56,"Today, a new generation of filmmakers is creating moving stories again."],[208.85,212.12,"Several Khmer films have been shown at international premieres."],[213.42,215.88,"Quiz time! Choose the correct answer."],[216.18,218.12,"Extremely interesting means blank."],[218.43,221.94,"A, fascinating. B, talented. C, moving."],[225.95,228.05,"The answer is A: fascinating."],[229.55,232.66,"The lesson was very blank. I almost fell asleep."],[232.95,235.66,"A, bored. B, boring. C, bore."],[239.65,241.2,"The answer is B: boring."],[242.68,244.74,"I was blank by the beautiful music."],[245.04,248.06,"A, moving. B, moved. C, move."],[252.05,253.5,"The answer is B: moved."],[255.02,257.35,"A film that makes a lot of money is a blank."],[257.65,262.01,"A, stage play. B, box office hit. C, performance."],[266.02,268.16,"The answer is B: box office hit."],[269.65,273.52,"According to the text, when did Cambodia have an exciting film industry?"],[273.82,279.73,"A, in the 1960s. B, in the 1990s. C, in the 2010s."],[283.72,286.51,"The answer is A: in the 1960s."],[288.02,292.48,"Now it's your turn to speak. Describe a film, show or concert that you found exciting."],[297.78,302.93,"The concert last year was amazing. I was so excited when my favourite band came on stage."],[303.23,305.0,"Excellent answer, Nita!"],[305.98,309.73,"Great work today! You learned eight new words and -ed and -ing adjectives."],[310.03,313.9,"Today's value is creativity. Use your imagination when you play."],[314.2,317.12,"See you in Unit twenty-three. Goodbye!"],[317.42,320.05,"Thank you, Mr. Daniel! Bye, everyone!"]],"OC-Intermediate-Unit23-Health-Care":[[0.35,4.49,"Hello, everyone! I'm Mr. Daniel. Welcome to Online Intermediate."],[4.79,7.85,"Hi! I'm Nita. Let's learn together!"],[8.15,14.8,"Unit twenty-three: Health Care. In this unit, you will talk about medical visits and report questions."],[15.78,16.74,"appointment."],[17.44,20.77,"appointment means an arranged time to see a doctor or other person."],[21.07,23.3,"I have a doctor's appointment at ten o'clock."],[24.0,26.46,"Your turn. Say: appointment."],[29.16,30.18,"appointment."],[31.18,32.29,"diagnosis."],[32.99,37.03,"diagnosis means the doctor's decision about what illness someone has."],[37.33,39.6,"The diagnosis was a mild infection."],[40.3,42.77,"Your turn. Say: diagnosis."],[45.47,46.79,"diagnosis."],[47.78,48.82,"specialist."],[49.52,53.39,"specialist means a doctor with expert knowledge of one area of medicine."],[53.69,55.87,"My doctor sent me to a heart specialist."],[56.57,59.05,"Your turn. Say: specialist."],[61.75,62.88,"specialist."],[63.88,64.56,"treatment."],[65.26,67.77,"treatment means medical care to cure an illness."],[68.07,69.83,"The treatment lasted two weeks."],[70.53,72.93,"Your turn. Say: treatment."],[75.63,76.38,"treatment."],[77.38,78.28,"side effect."],[78.98,81.76,"side effect means an unwanted effect of a medicine."],[82.06,85.11,"A common side effect of this medicine is tiredness."],[85.81,88.36,"Your turn. Say: side effect."],[91.06,92.1,"side effect."],[93.08,93.92,"symptom."],[94.62,97.89,"symptom means a sign of an illness, like a fever or a cough."],[98.19,100.72,"A high temperature is a common symptom of flu."],[101.42,103.61,"Your turn. Say: symptom."],[106.31,107.25,"symptom."],[108.25,109.39,"medical record."],[110.09,113.5,"medical record means official notes about a person's health history."],[113.8,115.74,"The nurse checked my medical record."],[116.44,119.16,"Your turn. Say: medical record."],[121.86,123.08,"medical record."],[124.08,125.06,"prescription."],[125.76,128.67,"prescription means a doctor's written order for medicine."],[128.97,130.95,"Take this prescription to the pharmacy."],[131.65,134.33,"Your turn. Say: prescription."],[137.03,138.02,"prescription."],[139.02,141.12,"Now let's listen to a conversation."],[141.42,143.05,"How was your appointment at the clinic?"],[144.35,147.63,"Fine. The doctor asked me how long I'd had the headaches."],[148.92,150.25,"What else did she ask?"],[151.55,154.11,"She asked whether I was taking any medicine."],[155.42,157.36,"Did she give you a diagnosis?"],[158.65,162.89,"Not yet. She asked about my symptoms and gave me a prescription."],[164.18,166.9,"Grammar focus: Reported questions."],[167.2,171.12,"To report a question, use asked, then a question word or if."],[171.42,174.06,"Use normal word order and move the tense back."],[174.36,177.37,"For example: Do you smoke? He asked if I smoked."],[177.67,182.06,"Reported questions are not real questions: no question mark and no do / does / did."],[183.05,185.63,"Now read and listen. Health Care Close to Home."],[185.93,189.8,"In many rural areas, the nearest hospital can be hours away."],[191.12,194.29,"Local clinics now offer basic treatment and health checks."],[195.58,198.82,"Doctors keep a medical record for every patient on a tablet."],[200.12,203.51,"Patients who need a specialist can talk to one by video call."],[204.82,208.01,"This helps with early diagnosis and a faster recovery."],[209.32,211.76,"Quiz time! Choose the correct answer."],[212.06,214.54,"An unwanted effect of a medicine is a blank."],[214.84,219.45,"A, side effect. B, diagnosis. C, recovery."],[223.45,225.37,"The answer is A: side effect."],[226.88,230.13,"\"Are you tired?\" → She asked if I blank tired."],[230.43,233.25,"A, am. B, was. C, were being."],[237.25,239.33,"The answer is B: was."],[240.82,242.28,"He asked me where I blank."],[242.58,245.35,"A, work. B, worked. C, did work."],[249.35,250.81,"The answer is B: worked."],[252.32,255.38,"A doctor with expert knowledge of one area is a blank."],[255.68,258.99,"A, specialist. B, clinic. C, waiting room."],[262.98,265.25,"The answer is A: specialist."],[266.75,270.12,"According to the text, patients can talk to specialists by blank."],[270.42,273.93,"A, letter. B, video call. C, radio."],[277.95,279.72,"The answer is B: video call."],[281.22,285.17,"Now it's your turn to speak. What questions does a doctor usually ask you?"],[290.47,296.93,"The doctor usually asks what my symptoms are, how long I have had them and whether I have any allergies."],[297.23,298.97,"Excellent answer, Nita!"],[299.98,303.99,"Great work today! You learned eight new words and reported questions."],[304.29,307.86,"Today's value is healthy body. Move your body every day."],[308.16,310.89,"See you in Unit twenty-four. Goodbye!"],[311.19,314.04,"Thank you, Mr. Daniel! Bye, everyone!"]],"OC-Intermediate-Unit24-Starting-a-Business":[[0.35,4.42,"Hello, everyone! I'm Mr. Daniel. Welcome to Online Intermediate."],[4.72,7.81,"Hi! I'm Nita. Let's learn together!"],[8.11,14.5,"Unit twenty-four: Starting a Business. In this unit, you will talk about business ideas and possible results."],[15.48,16.52,"entrepreneur."],[17.22,20.27,"entrepreneur means a person who starts their own business."],[20.57,23.17,"Many young entrepreneurs start online shops."],[23.87,26.45,"Your turn. Say: entrepreneur."],[29.15,30.29,"entrepreneur."],[31.28,32.15,"start-up."],[32.84,34.94,"start-up means a new small company."],[35.24,37.38,"Her start-up sells healthy snacks."],[38.08,40.36,"Your turn. Say: start-up."],[43.06,44.12,"start-up."],[45.12,46.19,"business plan."],[46.89,50.97,"business plan means a document describing how a business will work and make money."],[51.27,54.0,"Investors always ask to see your business plan."],[54.7,57.22,"Your turn. Say: business plan."],[59.92,61.06,"business plan."],[62.05,63.02,"investor."],[63.72,67.47,"investor means a person who gives money to a business to get a profit."],[67.77,70.23,"An investor gave them ten thousand dollars."],[70.93,73.18,"Your turn. Say: investor."],[75.88,76.91,"investor."],[77.92,78.95,"profit margin."],[79.65,83.5,"profit margin means the percentage of money you keep after costs."],[83.8,86.12,"Coffee shops can have a high profit margin."],[86.82,89.25,"Your turn. Say: profit margin."],[91.95,93.25,"profit margin."],[94.25,95.42,"customer base."],[96.12,100.26,"customer base means the group of people who regularly buy from a business."],[100.56,102.89,"Their customer base is mainly students."],[103.59,106.19,"Your turn. Say: customer base."],[108.89,110.22,"customer base."],[111.22,112.03,"marketing."],[112.73,116.61,"marketing means activities that help sell a product, like advertising."],[116.91,119.89,"They spend most of their budget on social media marketing."],[120.59,122.88,"Your turn. Say: marketing."],[125.58,126.58,"marketing."],[127.58,128.51,"competitor."],[129.22,132.19,"competitor means a business that sells similar things."],[132.49,135.1,"Our main competitor is opening a shop next door."],[135.8,138.04,"Your turn. Say: competitor."],[140.74,141.69,"competitor."],[142.68,144.73,"Now let's listen to a conversation."],[145.03,147.44,"I'm thinking of starting a coffee start-up."],[148.75,153.5,"Interesting! If you open near the university, you'll have a big customer base."],[154.82,156.61,"But there are many competitors there."],[157.92,161.45,"If I were you, I would focus on something different, like healthy drinks."],[162.75,165.84,"If I found an investor, I would open a bigger shop."],[167.15,171.26,"First, write a business plan. If it's clear, investors will listen."],[172.55,175.78,"Grammar focus: First vs second conditional."],[176.08,179.6,"Use the first conditional for real or likely situations."],[179.9,183.63,"Use the second conditional for imaginary or unlikely situations."],[183.93,190.69,"For example: If I save enough, I will open a shop. If I won the lottery, I would start a big company."],[190.99,194.3,"Choose the conditional according to how likely the situation is."],[195.32,198.17,"Now read and listen. From Market Stall to Brand."],[198.47,202.89,"Ten years ago, Sreymom sold homemade chilli sauce at a small market stall."],[204.18,207.56,"Her customer base grew quickly because her sauce tasted unique."],[208.85,212.53,"She wrote a business plan and found an investor who believed in her."],[213.82,217.37,"Today, her products are sold in supermarkets across the country."],[218.68,222.98,"She says that if young entrepreneurs work hard, they will find their own success."],[224.28,226.61,"Quiz time! Choose the correct answer."],[226.91,229.78,"A person who starts their own business is an blank."],[230.08,233.57,"A, investor. B, entrepreneur. C, competitor."],[237.58,239.55,"The answer is B: entrepreneur."],[241.05,243.12,"If it blank tomorrow, we'll stay at home."],[243.42,246.47,"A, rains. B, rained. C, will rain."],[250.48,252.33,"The answer is A: rains."],[253.82,256.49,"If I blank a millionaire, I would travel the world."],[256.79,259.74,"A, am. B, were. C, will be."],[263.75,265.31,"The answer is B: were."],[266.82,269.42,"A business that sells similar things is a blank."],[269.72,273.65,"A, competitor. B, customer base. C, start-up."],[277.65,279.45,"The answer is A: competitor."],[280.95,284.3,"According to the text, Sreymom started by selling blank."],[284.6,288.48,"A, coffee. B, chilli sauce. C, clothes."],[292.48,294.92,"The answer is B: chilli sauce."],[296.42,300.18,"Now it's your turn to speak. If you started a business, what would it be?"],[305.48,310.45,"If I started a business, I would open a small café with healthy drinks near a university."],[310.75,312.27,"Excellent answer, Nita!"],[313.28,317.47,"Great work today! You learned eight new words and first vs second conditional."],[317.77,321.2,"Today's value is hard work. Work hard and never give up."],[321.5,324.72,"See you in Unit twenty-five. Goodbye!"],[325.02,327.81,"Thank you, Mr. Daniel! Bye, everyone!"]],"OC-Intermediate-Unit25-Getting-Around":[[0.35,5.0,"Hello, everyone! I'm Mr. Daniel. Welcome to Online Intermediate."],[5.3,8.58,"Hi! I'm Nita. Let's learn together!"],[8.88,16.05,"Unit twenty-five: Getting Around. In this unit, you will talk about transport and make guesses about situations."],[17.05,18.61,"ride-hailing."],[19.31,22.79,"ride-hailing means booking a car or tuk-tuk ride with a phone app."],[23.09,25.66,"Ride-hailing apps are very popular in Phnom Penh."],[26.36,29.33,"Your turn. Say: ride-hailing."],[32.03,33.17,"ride-hailing."],[34.18,35.08,"toll road."],[35.78,37.99,"toll road means a road that you pay to use."],[38.29,40.9,"The new toll road to Sihanoukville saves hours."],[41.6,43.76,"Your turn. Say: toll road."],[46.46,47.45,"toll road."],[48.45,49.49,"speed camera."],[50.19,54.19,"speed camera means a camera that photographs vehicles going too fast."],[54.49,56.4,"There's a speed camera on this bridge."],[57.1,59.77,"Your turn. Say: speed camera."],[62.47,63.62,"speed camera."],[64.62,65.7,"parking fine."],[66.4,70.06,"parking fine means money you must pay for parking in the wrong place."],[70.36,72.52,"I got a parking fine outside the bank."],[73.22,75.76,"Your turn. Say: parking fine."],[78.46,79.6,"parking fine."],[80.58,81.67,"road sign."],[82.37,86.14,"road sign means a sign that gives information to drivers."],[86.44,88.37,"Always follow the road signs."],[89.07,91.54,"Your turn. Say: road sign."],[94.24,95.39,"road sign."],[96.38,97.25,"detour."],[97.94,102.16,"detour means a different, longer route because the normal road is closed."],[102.46,104.76,"There's a detour because of the road works."],[105.46,107.45,"Your turn. Say: detour."],[110.15,111.07,"detour."],[112.08,113.13,"breakdown."],[113.83,116.47,"breakdown means when a vehicle stops working."],[116.77,118.87,"We had a breakdown on the way to Kampot."],[119.57,121.75,"Your turn. Say: breakdown."],[124.45,125.44,"breakdown."],[126.45,127.41,"flat tyre."],[128.1,130.58,"flat tyre means a tyre with no air in it."],[130.88,132.97,"I had to change a flat tyre in the rain."],[133.67,135.9,"Your turn. Say: flat tyre."],[138.59,139.76,"flat tyre."],[140.75,142.78,"Now let's listen to a conversation."],[143.08,146.32,"The bus is very late. There must be a traffic jam."],[147.62,149.72,"Or it might have had a breakdown."],[151.02,153.5,"It can't be the weather. It's sunny!"],[154.78,157.99,"Look, there's a sign for a detour. That must be the reason."],[159.28,163.14,"Maybe I should use a ride-hailing app instead."],[164.45,167.56,"Good idea. It might be faster than waiting here."],[168.85,171.09,"Grammar focus: Modals of deduction."],[171.39,173.53,"Use must when you are sure something is true."],[173.83,177.51,"Use might, may or could when it's possible, and can't when you're sure it's not true."],[177.81,181.49,"For example: He must be stuck in traffic. It can't be the weather."],[181.79,186.3,"Use mustn't for rules, not for deduction. For deduction, the negative is can't."],[187.28,190.11,"Now read and listen. Traffic in a Growing City."],[190.41,193.52,"Phnom Penh has more than two million motorbikes and cars."],[194.82,197.28,"In the morning rush, a short trip can take an hour."],[198.58,202.06,"Many people now use ride-hailing apps to avoid parking problems."],[203.35,206.69,"New speed cameras and road signs aim to make the roads safer."],[207.98,212.28,"Experts say better public transport must be the long-term solution."],[213.58,215.98,"Quiz time! Choose the correct answer."],[216.28,218.26,"A road that you pay to use is a blank."],[218.56,222.07,"A, detour. B, toll road. C, road sign."],[226.08,228.04,"The answer is B: toll road."],[229.55,232.07,"She's not answering. She blank be asleep."],[232.38,235.4,"A, must. B, can't. C, mustn't."],[239.42,241.62,"The answer is A: must."],[243.12,245.61,"That blank be Dara. He's in Japan this week."],[245.91,248.42,"A, must. B, might. C, can't."],[252.42,253.95,"The answer is C: can't."],[255.45,257.86,"When a vehicle stops working, it is a blank."],[258.16,262.08,"A, breakdown. B, parking fine. C, flat tyre."],[266.08,267.83,"The answer is A: breakdown."],[269.32,272.61,"According to the text, Phnom Penh has more than blank vehicles."],[272.9,276.94,"A, two hundred thousand. B, two million. C, twenty million."],[280.95,282.83,"The answer is B: two million."],[284.35,288.49,"Now it's your turn to speak. Your friend is an hour late. What might have happened?"],[293.79,299.08,"He must be stuck in traffic, or he might have had a flat tyre. It can't be the rain, because it's sunny."],[299.38,300.88,"Excellent answer, Nita!"],[301.88,305.8,"Great work today! You learned eight new words and modals of deduction."],[306.1,309.69,"Today's value is patience. Wait calmly and take your time."],[309.99,312.67,"See you in Unit twenty-six. Goodbye!"],[312.97,315.68,"Thank you, Mr. Daniel! Bye, everyone!"]],"OC-Intermediate-Unit26-Tourism-in-Cambodia":[[0.35,4.71,"Hello, everyone! I'm Mr. Daniel. Welcome to Online Intermediate."],[5.01,8.48,"Hi! I'm Nita. Let's learn together!"],[8.78,15.81,"Unit twenty-six: Tourism in Cambodia. In this unit, you will talk about tourism and places that have been developed."],[16.82,18.09,"tourist attraction."],[18.79,21.71,"tourist attraction means a place that many tourists visit."],[22.01,24.99,"The Royal Palace is a popular tourist attraction."],[25.69,27.96,"Your turn. Say: tourist attraction."],[30.66,31.93,"tourist attraction."],[32.92,34.01,"heritage site."],[34.71,38.51,"heritage site means a place of great historical or cultural importance."],[38.81,41.74,"Angkor Wat is a UNESCO World Heritage Site."],[42.44,44.77,"Your turn. Say: heritage site."],[47.47,48.73,"heritage site."],[49.75,50.9,"eco-tourism."],[51.6,55.42,"eco-tourism means tourism that protects nature and helps local people."],[55.72,58.87,"Eco-tourism in Mondulkiri helps protect elephants."],[59.57,62.11,"Your turn. Say: eco-tourism."],[64.81,65.96,"eco-tourism."],[66.95,67.8,"homestay."],[68.5,71.6,"homestay means staying in a local family's home as a tourist."],[71.9,74.32,"We stayed in a homestay on Koh Trong island."],[75.02,77.05,"Your turn. Say: homestay."],[79.75,80.72,"homestay."],[81.72,82.73,"tour package."],[83.43,87.77,"tour package means a holiday where transport, hotel and trips are booked together."],[88.07,91.01,"The tour package included three temples and a boat trip."],[91.71,94.13,"Your turn. Say: tour package."],[96.83,97.96,"tour package."],[98.95,100.24,"temple complex."],[100.94,104.86,"temple complex means a large area with many temples and buildings."],[105.16,108.79,"The Angkor temple complex covers four hundred square kilometres."],[109.49,112.23,"Your turn. Say: temple complex."],[114.93,116.25,"temple complex."],[117.25,118.16,"boat tour."],[118.86,121.38,"boat tour means a trip on a boat to see places."],[121.68,123.92,"We took a boat tour on the Tonle Sap lake."],[124.62,126.94,"Your turn. Say: boat tour."],[129.64,130.64,"boat tour."],[131.65,132.71,"sunrise view."],[133.41,136.44,"sunrise view means what you can see as the sun comes up."],[136.74,140.0,"Thousands of visitors wait for the sunrise view at Angkor Wat."],[140.69,143.2,"Your turn. Say: sunrise view."],[145.9,147.27,"sunrise view."],[148.28,150.32,"Now let's listen to a conversation."],[150.62,153.43,"Have you visited many heritage sites in Cambodia?"],[154.72,158.09,"Yes. I've seen the sunrise view at Angkor Wat twice!"],[159.38,162.8,"Many new roads have been built to the temples recently."],[164.08,166.7,"And a lot of homestays have been opened in the villages."],[167.98,171.14,"Eco-tourism has been promoted in Mondulkiri too."],[172.45,176.66,"That's great for local people. Have you ever tried a boat tour on the Tonle Sap?"],[177.95,180.74,"Grammar focus: Present perfect passive."],[181.04,186.73,"Use the present perfect passive for recent changes when the action is more important than the person."],[187.03,189.35,"Has or have been, plus past participle."],[189.66,192.63,"For example: A new airport has been built in Siem Reap."],[192.93,196.76,"Use it to talk about recent changes when the action matters more than who did it."],[197.75,200.77,"Now read and listen. Tourism That Helps Everyone."],[201.07,204.55,"Cambodia has welcomed millions of tourists in recent years."],[205.85,209.35,"A new international airport has been built near Siem Reap."],[210.65,213.87,"Many villages have been turned into homestay destinations."],[215.18,219.16,"Eco-tourism projects have been created to protect forests and wildlife."],[220.45,224.77,"These changes have brought jobs to local people, not only to big hotels."],[226.08,228.28,"Quiz time! Choose the correct answer."],[228.58,231.27,"A place of great historical importance is a blank."],[231.57,235.05,"A, heritage site. B, homestay. C, tour package."],[239.05,241.65,"The answer is A: heritage site."],[243.15,244.91,"A new road blank to the temple."],[245.21,248.71,"A, has built. B, has been built. C, is building."],[252.72,254.41,"The answer is B: has been built."],[255.92,258.82,"The temples blank by experts from many countries."],[259.12,262.72,"A, have been restored. B, have restored. C, are restore."],[266.72,269.26,"The answer is A: have been restored."],[270.75,273.21,"Staying in a local family's home is a blank."],[273.51,277.14,"A, boat tour. B, homestay. C, temple complex."],[281.15,283.1,"The answer is B: homestay."],[284.62,287.23,"According to the text, what has been built near Siem Reap?"],[287.53,291.99,"A, a new airport. B, a new temple. C, a new lake."],[295.98,298.41,"The answer is A: a new airport."],[299.92,304.73,"Now it's your turn to speak. Which place in Cambodia would you recommend to a tourist, and why?"],[310.03,316.2,"I'd recommend Kampot. Many guesthouses have been opened there, and the river boat tours are beautiful."],[316.5,318.01,"Excellent answer, Nita!"],[319.02,323.28,"Great work today! You learned eight new words and present perfect passive."],[323.58,327.52,"Today's value is love of country. Love and take care of Cambodia."],[327.82,330.96,"See you in Unit twenty-seven. Goodbye!"],[331.26,334.0,"Thank you, Mr. Daniel! Bye, everyone!"]],"OC-Intermediate-Unit27-Online-Life-and-Privacy":[[0.35,4.32,"Hello, everyone! I'm Mr. Daniel. Welcome to Online Intermediate."],[4.62,7.57,"Hi! I'm Nita. Let's learn together!"],[7.87,15.17,"Unit twenty-seven: Online Life and Privacy. In this unit, you will talk about online safety and imagine different past results."],[16.18,17.32,"personal data."],[18.02,22.59,"personal data means information about you, like your name, address and phone number."],[22.89,25.76,"Never share your personal data with strangers online."],[26.46,28.61,"Your turn. Say: personal data."],[31.31,32.48,"personal data."],[33.48,34.09,"hacker."],[34.79,38.08,"hacker means a person who gets into computers without permission."],[38.38,40.73,"A hacker stole thousands of passwords."],[41.43,43.62,"Your turn. Say: hacker."],[46.33,47.16,"hacker."],[48.15,48.81,"phishing."],[49.51,53.33,"phishing means fake emails or messages that try to steal y ssages."],[179.88,182.31,"Grammar focus: Third conditional."],[182.61,186.46,"Use the third conditional for imaginary situations in the past."],[186.76,190.7,"If plus had plus past participle, then would have plus past participle."],[191.0,195.13,"For example: If I had used a strong password, they wouldn't have hacked me."],[195.43,200.97,"Use the third conditional to talk about past situations that didn't happen, often to express regret."],[201.98,204.41,"Now read and listen. One Click Too Many."],[204.72,208.78,"Last year, a university student received a message about a free phone."],[210.08,212.51,"She clicked the link and typed in her personal data."],[213.82,217.06,"Within minutes, a hacker had taken control of her accounts."],[218.35,222.02,"If she had used two-step verification, the hacker wouldn't have got in."],[223.32,226.76,"Now she teaches her classmates how to recognise phishing messages."],[228.05,230.63,"Quiz time! Choose the correct answer."],[230.93,233.97,"Fake messages that try to steal your information are blank."],[234.27,238.37,"A, phishing. B, profile settings. C, a report button."],[242.38,243.95,"The answer is A: phishing."],[245.45,248.27,"If I blank earlier, I wouldn't have missed the bus."],[248.57,251.44,"A, left. B, had left. C, would leave."],[255.45,257.59,"The answer is B: had left."],[259.08,261.26,"If she had studied, she blank the exam."],[261.56,265.3,"A, would pass. B, would have passed. C, passed."],[269.32,271.26,"The answer is B: would have passed."],[272.75,276.22,"A long password with letters, numbers and symbols is a blank."],[276.52,280.22,"A, strong password. B, fake account. C, hacker."],[284.22,286.44,"The answer is A: strong password."],[287.95,290.97,"According to the text, what would have stopped the hacker?"],[291.27,295.85,"A, a new phone. B, two-step verification. C, a fake account."],[299.85,302.42,"The answer is B: two-step verification."],[303.92,308.22,"Now it's your turn to speak. What do you do to protect your personal data online?"],[313.52,319.59,"I use strong passwords, turn on two-step verification and never click links from strangers."],[319.89,321.37,"Excellent answer, Nita!"],[322.38,326.12,"Great work today! You learned eight new words and third conditional."],[326.42,331.03,"Today's value is online safety. Keep your password secret and be kind online."],[331.33,333.99,"See you in Unit twenty-eight. Goodbye!"],[334.29,337.48,"Thank you, Mr. Daniel! Bye, everyone!"]],"OC-Intermediate-Unit28-Emotions-and-Regrets":[[0.35,4.89,"Hello, everyone! I'm Mr. Daniel. Welcome to Online Intermediate."],[5.19,8.44,"Hi! I'm Nita. Let's learn together!"],[8.74,14.59,"Unit twenty-eight: Emotions and Regrets. In this unit, you will describe feelings and talk about wishes."],[15.58,16.4,"regret."],[17.1,20.54,"regret means a feeling of sadness about something you did or didn't do."],[20.84,23.24,"My only regret is that I didn't learn to swim."],[23.94,26.04,"Your turn. Say: regret."],[28.74,29.62,"regret."],[30.62,31.5,"overwhelmed."],[32.2,35.7,"overwhelmed means having too many feelings or tasks to deal with."],[36.0,38.49,"She felt overwhelmed by all her exams."],[39.19,41.66,"Your turn. Say: overwhelmed."],[44.36,45.4,"overwhelmed."],[46.42,47.34,"calm down."],[48.04,51.44,"calm down means to become less angry, upset or excited."],[51.74,53.5,"Take a deep breath and calm down."],[54.2,56.5,"Your turn. Say: calm down."],[59.2,60.21,"calm down."],[61.22,61.99,"mood."],[62.69,65.32,"mood means the way you feel at a particular time."],[65.62,67.05,"He's in a good mood today."],[67.75,69.77,"Your turn. Say: mood."],[72.47,73.25,"mood."],[74.25,75.14,"emotional."],[75.84,78.39,"emotional means showing strong feelings."],[78.69,80.68,"The wedding speech was very emotional."],[81.38,83.42,"Your turn. Say: emotional."],[86.12,87.23,"emotional."],[88.25,89.18,"resentful."],[89.88,93.06,"resentful means feeling angry because of unfair treatment."],[93.37,95.84,"He felt resentful when his colleague got the promotion."],[96.54,98.86,"Your turn. Say: resentful."],[101.56,102.57,"resentful."],[103.58,104.41,"delighted."],[105.11,107.3,"delighted means very pleased and happy."],[107.6,109.36,"We were delighted with the result."],[110.06,112.27,"Your turn. Say: delighted."],[114.97,115.78,"delighted."],[116.78,117.69,"heartbroken."],[118.39,121.6,"heartbroken means extremely sad, usually because of a loss."],[121.9,123.97,"She was heartbroken when her dog died."],[124.67,127.02,"Your turn. Say: heartbroken."],[129.72,130.88,"heartbroken."],[131.88,133.99,"Now let's listen to a conversation."],[134.29,137.59,"I feel overwhelmed. I wish I had more time to study."],[138.88,141.52,"Calm down. What's making you feel this way?"],[142.82,146.65,"I have three exams next week. I wish I didn't have so many."],[147.95,149.98,"Do you have any regrets about this term?"],[151.28,155.4,"I wish I were more organised. My mood changes so quickly."],[156.68,159.46,"Make a plan. You'll be delighted with the results."],[160.75,163.74,"Grammar focus: wish + past simple."],[164.04,168.57,"Use wish plus past simple to talk about present situations we want to be different."],[168.87,171.69,"For example: I wish I had more free time."],[171.99,175.41,"In formal English, use were: I wish I were more organised."],[175.71,180.72,"Use were for all persons in formal English: I wish I were, he wishes he were."],[181.72,184.61,"Now read and listen. Managing Big Emotions."],[184.91,187.92,"Everyone feels overwhelmed or resentful sometimes."],[189.22,192.57,"Psychologists say that naming your emotions helps you calm down."],[193.88,197.03,"Writing in a journal can improve your mood in just ten minutes."],[198.32,201.26,"Many people wish they talked about their feelings more often."],[202.55,206.01,"Sharing a regret with a friend can turn a heavy feeling into a lighter one."],[207.32,209.85,"Quiz time! Choose the correct answer."],[210.15,213.16,"Feeling angry because of unfair treatment llage by boat."],[41.23,43.45,"Your turn. Say: rescue team."],[46.15,47.29,"rescue team."],[48.28,49.48,"warning system."],[50.18,53.9,"warning system means a system that tells people a disaster is coming."],[54.2,57.65,"A new warning system sends text messages before floods."],[58.35,60.85,"Your turn. Say: warning system."],[63.55,64.77,"warning system."],[65.78,66.73,"damage."],[67.43,69.67,"damage means harm done to something."],[69.97,72.56,"The storm caused serious damage to the roofs."],[73.26,75.65,"Your turn. Say: damage."],[78.35,79.27,"damage."],[80.25,81.2,"survivor."],[81.91,85.41,"survivor means a person who continues to live after a disaster."],[85.71,88.19,"The survivors were taken to a safe shelter."],[88.89,91.17,"Your turn. Say: survivor."],[93.87,94.84,"survivor."],[95.85,96.78,"aftermath."],[97.48,100.09,"aftermath means the period after a disaster."],[100.38,103.12,"In the aftermath of the flood, neighbours helped each other."],[103.82,106.24,"Your turn. Say: aftermath."],[108.94,109.97,"aftermath."],[110.98,111.97,"relief aid."],[112.67,116.95,"relief aid means food, water and help sent to people after a disaster."],[117.25,119.4,"Relief aid arrived from many countries."],[120.1,122.79,"Your turn. Say: relief aid."],[125.49,126.6,"relief aid."],[127.62,128.91,"tropical storm."],[129.61,133.78,"tropical storm means a strong storm with heavy rain and wind from warm seas."],[134.08,136.52,"A tropical storm hit the coast last night."],[137.22,140.06,"Your turn. Say: tropical storm."],[142.76,144.05,"tropical storm."],[145.05,146.98,"Now let's listen to a conversation."],[147.28,149.34,"Where were you when the tropical storm hit?"],[150.65,155.52,"I was staying with my grandparents. We were having dinner when the warning system sounded."],[156.82,158.24,"Was your village damaged?"],[159.55,163.64,"Yes. Many houses were damaged, and the bridge was destroyed."],[164.95,166.68,"Were people rescued quickly?"],[167.98,172.5,"Yes. A rescue team arrived, and relief aid was sent the next day."],[173.82,177.75,"Grammar focus: Past continuous + past passive."],[178.06,181.4,"Use the past continuous for background actions in the past."],[181.7,184.99,"Use the past passive to say what happened to people or things."],[185.29,189.19,"For example: We were sleeping when the storm hit, and many roads were flooded."],[189.49,194.4,"News reports often use the past passive because the event is more important than who did the action."],[195.38,198.13,"Now read and listen. When the River Rose."],[198.43,202.56,"In October, heavy rain was falling for six days in western Cambodia."],[203.85,206.88,"Rivers were rising quickly, and many villages were flooded."],[208.18,211.03,"Thousands of people were moved to schools and pagodas."],[212.32,216.78,"Rescue teams were sent with boats, and relief aid was delivered by truck."],[218.08,221.58,"In the aftermath, families worked together to repair the damage."],[222.88,225.22,"Quiz time! Choose the correct answer."],[225.52,228.83,"A bag of food, water and medicine for emergencies is an blank."],[229.13,232.95,"A, emergency kit. B, aftermath. C, survivor."],[236.95,239.33,"The answer is A: emergency kit."],[240.82,242.91,"We blank TV when the lights went out."],[243.21,246.68,"A, watched. B, were watching. C, are watching."],[250.68,252.53,"The answer is B: were watching."],[254.02,255.65,"The bridge blank in the storm."],[255.94,259.98,"A, was destroyed. B, destroyed. C, was destroying."],[263.98,266.02,"The answer is A: was destroyed."],[267.52,269.98,"The period after a disaster is the blank."],[270.28,274.62,"A, relief aid. B, warning system. C, aftermath."],[278.62,280.84,"The answer is C: aftermath."],[282.35,284.61,"According to the text, where were people moved?"],[284.9,289.5,"A, to hotels. B, to schools and pagodas. C, to the capital."],[293.48,295.84,"The answer is B: to schools and pagodas."],[297.35,301.26,"Now it's your turn to speak. What should be in a family emergency kit?"], nemployment means when people who want to work cannot find jobs."],[101.62,104.45,"Youth unemployment is a problem in many countries."],[105.15,107.34,"Your turn. Say: unemployment."],[110.04,111.17,"unemployment."],[112.18,112.95,"peace."],[113.65,116.44,"peace means a situation with no war or fighting."],[116.74,119.11,"Cambodia has enjoyed peace for many years."],[119.81,121.8,"Your turn. Say: peace."],[124.5,125.39,"peace."],[126.38,127.33,"development."],[128.03,131.81,"development means growth and improvement of a country's economy and society."],[132.11,134.24,"Education is the key to development."],[134.94,137.04,"Your turn. Say: development."],[139.74,140.84,"development."],[141.85,143.71,"Now let's listen to a conversation."],[144.01,146.81,"Which global issue do you think is the most serious?"],[148.12,152.28,"Clean water. Although the world is richer, many people still lack it."],[153.58,157.68,"I agree. However, access to education is also important."],[158.98,162.7,"True. Education helps development and reduces unemployment."],[164.02,166.88,"Although there are many problems, peace gives us hope."],[168.18,170.99,"Exactly. However, we all need to play our part."],[172.28,175.35,"Grammar focus: Linking words: although · however."],[175.65,179.07,"Use although to join two contrasting ideas in one sentence."],[179.37,182.69,"Use however at the start of a new sentence, followed by a comma."],[182.99,186.71,"For example: The city is rich. However, many people are poor."],[187.01,189.78,"Put a comma after However at the start of a sentence."],[190.78,193.65,"Now read and listen. Progress and Problems."],[193.94,197.08,"The world has made great progress in the last fifty years."],[198.38,203.55,"Although more children go to school than ever before, millions still have no access to education."],[204.85,209.31,"Public health has improved; however, clean water is still a luxury in some areas."],[210.62,214.84,"Population growth creates jobs, but it can also increase unemployment."],[216.15,220.52,"Although these problems are big, peace and cooperation make solutions possible."],[221.82,224.3,"Quiz time! Choose the correct answer."],[224.59,228.29,"A person forced to leave their country because of war is a blank."],[228.59,231.84,"A, refugee. B, development. C, peace."],[235.85,237.72,"The answer is A: refugee."],[239.22,241.29,"blank it was raining, we went for a walk."],[241.59,244.6,"A, However. B, Although. C, Because."],[248.62,250.4,"The answer is B: Although."],[251.88,254.34,"The test was hard. blank, everyone passed."],[254.64,257.57,"A, Although. B, However. C, So that."],[261.58,263.35,"The answer is B: However."],[264.85,267.44,"When people cannot find jobs, there is blank."],[267.74,271.45,"A, unemployment. B, public health. C, clean water."],[275.45,277.3,"The answer is A: unemployment."],[278.78,282.35,"According to the text, what is still a luxury in some areas?"],[282.65,286.42,"A, clean water. B, mobile phones. C, cars."],[290.42,292.5,"The answer is A: clean water."],[293.98,298.37,"Now it's your turn to speak. Which global issue would you most like to solve, and why?"],[303.67,309.62,"I would solve the lack of clean water, because although it seems simple, it affects health, education and work."],[309.92,311.32,"Excellent answer, Nita!"],[312.32,316.71,"Great work today! You learned eight new words and linking words: although · however."],[317.01,320.07,"Today's value is kindness. Be kind to everyone."],[320.37,322.9,"See you in Unit thirty-one. Goodbye!"],[323.2,326.09,"Thank you, Mr. Daniel! Bye, everyone!"]],"OC-Intermediate-Unit31-Style-and-Identity":[[0.35,4.46,"Hello, everyone! I'm Mr. Daniel. Welcome to Online Intermediate."],[4.76,7.72,"Hi! I'm Nita. Let's learn together!"],[8.03,13.97,"Unit thirty-one: Style and Identity. In this unit, you will talk about fashion, appearance and services."],[14.98,16.12,"fashion trend."],[16.82,20.57,"fashion trend means a style that is popular at a particular time."],[20.86,23.61,"Oversized shirts are a big fashion trend this year."],[24.31,26.4,"Your turn. Say: fashion trend."],[29.1,30.31,"fashion trend."],[31.32,32.26,"outfit."],[32.96,35.27,"outfit means a set of clothes worn together."],[35.57,37.68,"She wore a beautiful outfit to the wedding."],[38.38,40.68,"Your turn. Say: outfit."],[43.38,44.19,"outfit."],[45.18,45.98,"hairstyle."],[46.67,49.13,"hairstyle means the way your hair is cut and arranged."],[49.43,51.82,"He changed his hairstyle for his new job."],[52.52,55.07,"Your turn. Say: hairstyle."],[57.77,58.84,"hairstyle."],[59.85,60.8,"dress code."],[61.51,64.41,"dress code means rules about what clothes you must wear."],[64.71,66.71,"The office has a smart dress code."],[67.41,69.5,"Your turn. Say: dress code."],[72.2,73.32,"dress code."],[74.32,75.53,"second-hand clothes."],[76.23,80.37,"second-hand clothes means clothes that someone else owned before."],[80.67,83.3,"Second-hand clothes are cheaper and better for the planet."],[84.0,86.69,"Your turn. Say: second-hand clothes."],[89.39,90.94,"second-hand clothes."],[91.95,92.63,"brand."],[93.33,95.63,"brand means the name of a company's products."],[95.93,98.18,"Which brand of sneakers do you prefer?"],[98.88,100.77,"Your turn. Say: brand."],[103.47,104.19,"brand."],[105.18,106.32,"accessories."],[107.02,110.88,"accessories means extra items like bags, belts and jewellery."],[111.18,113.92,"She always matches her accessories with her shoes."],[114.62,117.01,"Your turn. Say: accessories."],[119.71,121.07,"accessories."],[122.08,122.9,"makeover."],[123.6,126.67,"makeover means a big change in someone's appearance."],[126.97,129.82,"Before the graduation, Nita had a complete makeover."],[130.53,132.53,"Your turn. Say: makeover."],[135.23,136.3,"makeover."],[137.28,139.18,"Now let's listen to a conversation."],[139.48,140.71,"You look different, Nita!"],[142.02,146.34,"Thanks! I had my hair cut yesterday. It's a new hairstyle."],[147.65,150.09,"It suits you. Is that a new outfit too?"],[151.38,155.39,"Yes, but it's second-hand. I'm getting the trousers shortened next week."],[156.68,159.91,"Smart choice. Is there a dress code at your internship?"],[161.22,165.45,"Yes, smart casual. I'm having my shoes repaired so I can wear them there."],[166.75,169.59,"Grammar focus: have / get something done."],[169.88,175.0,"Use have or get, plus object, plus past participle when someone does a service for you."],[175.3,178.09,"For example: I had my hair cut yesterday."],[178.39,180.29,"Get is a little more informal than have."],[180.59,184.22,"Use this structure when you pay or ask someone else to do a job for you."],[185.22,188.32,"Now read and listen. The Rise of Second-Hand Fashion."],[188.62,192.43,"Fashion trends change faster than ever, but this creates a lot of waste."],[193.72,197.7,"Many young Cambodians are now buying second-hand clothes at markets and online."],[199.02,202.59,"Instead of buying new, some people get old clothes repaired or redesigned."],[203.88,208.44,"A small change, like new accessories, can give an outfit a complete makeover."],[209.75,213.87,"Experts say that personal style matters more than any famous brand."],[215.18,217.81,"Quiz time! Choose the correct answer."],[218.11,220.63,"Rules about what clothes you must wear are a blank."],[220.93,224.47,"A, dress code. B, brand. C, fashion trend."],[228.48,230.44,"The answer is A: dress code."],[231.95,234.28,"I blank my phone screen repaired last week."],[234.57,237.35,"A, had. B, have done. C, did."],[241.35,242.75,"The answer is A: had."],[244.25,246.11,"She is getting her hair blank tomorrow."],[246.41,249.29,"A, cut. B, cutting. C, to cut."],[253.28,254.89,"The answer is A: cut."],[256.38,258.98,"Extra items like bags and belts are blank."],[259.27,262.98,"A, outfits. B, accessories. C, makeovers."],[266.98,269.09,"The answer is B: accessories."],[270.58,274.06,"According to the text, what matters more than a famous brand?"],[274.36,277.71,"A, price. B, personal style. C, colour."],[281.72,284.05,"The answer is B: personal style."],[285.55,289.2,"Now it's your turn to speak. What services do you pay for regularly?"],[294.5,298.75,"I have my hair cut every month, and I get my motorbike checked twice a year."],[299.05,300.51,"Excellent answer, Nita!"],[301.52,305.4,"Great work today! You learned eight new words and have / get something done."],[305.7,308.97,"Today's value is self-confidence. Believe in yourself."],[309.27,311.7,"See you in Unit thirty-two. Goodbye!"],[312.0,315.29,"Thank you, Mr. Daniel! Bye, everyone!"]],"OC-Intermediate-Unit32-Learning-Languages":[[0.35,4.63,"Hello, everyone! I'm Mr. Daniel. Welcome to Online Intermediate."],[4.93,8.18,"Hi! I'm Nita. Let's learn together!"],[8.48,15.11,"Unit thirty-two: Learning Languages. In this unit, you will talk about language learning and check information politely."],[16.12,16.92,"fluent."],[17.62,20.75,"fluent means able to speak a language easily and well."],[21.05,25.11,"After two years in Japan, he became fluent in Japanese."],[25.81,27.83,"Your turn. Say: fluent."],[30.53,31.32,"fluent."],[32.32,33.21,"accent."],[33.91,37.04,"accent means the way people from a place pronounce words."],[37.34,39.91,"She speaks English with a lovely Khmer accent."],[40.61,42.59,"Your turn. Say: accent."],[45.29,46.22,"accent."],[47.22,48.26,"vocabulary."],[48.96,52.69,"vocabulary means all the words in a language that a person knows."],[52.99,55.31,"Reading helps you build your vocabulary."],[56.01,58.32,"Your turn. Say: vocabulary."],[61.02,62.2,"vocabulary."],[63.18,64.25,"grammar rule."],[64.95,68.41,"grammar rule means a rule about how words are used in sentences."],[68.7,70.98,"This grammar rule has many exceptions."],[71.68,73.89,"Your turn. Say: grammar rule."],[76.59,77.61,"grammar rule."],[78.62,79.69,"pronunciation."],[80.39,83.25,"pronunciation means the way a word is said."],[83.55,86.67,"The pronunciation of 'th' is difficult for many learners."],[87.37,89.77,         // English subtitles: added to the player with code, so no subtitle files are needed online.
        let subsOn = true;
        function addSubtitles(el) {
            const cues = SUBTITLES[(el.getAttribute('src') || '').split('/').pop().replace('.mp4', '')]; const btn = document.getElementById('subs-btn');
            if (!cues || !el.addTextTrack || typeof VTTCue === 'undefined') { if (btn) btn.style.display = 'none'; return; }
            const tr = el.addTextTrack('subtitles', 'English', 'en');
            cues.forEach(c => { try { const q = new VTTCue(c[0], c[1], c[2]); q.line = -2; tr.addCue(q); } catch (e) {} });
            const apply = () => { tr.mode = subsOn ? 'showing' : 'hidden'; if (btn) btn.textContent = subsOn ? '💬 Subtitles: ON' : '💬 Subtitles: OFF'; };
            if (btn) btn.onclick = () => { subsOn = !subsOn; apply(); };
            apply();
        }
        function renderMp4Lesson(contentDiv, unitData) {
            contentDiv.innerHTML = `
                <h2 class="text-xl font-bold text-blue-800 mb-2">📹 Video Lesson — Unit ${state.unit}: ${unitData.title}</h2>
                <p class="text-gray-600 mb-4">${currentVideo.questions.length ? 'Watch the video. It will pause a few times so you can answer a quick question!' : 'Watch the video with Mr. Daniel and Nita, then try the other learning modules!'}</p>
                <div class="relative bg-black rounded-2xl overflow-hidden" style="aspect-ratio:16/9;">
                    <video id="mp4-player" src="${currentVideo.mp4}" controls playsinline preload="metadata" class="w-full h-full" style="object-fit:contain;"></video>
                    <div id="checkpoint-overlay" class="absolute inset-0 bg-blue-900/95 flex items-center justify-center p-6" style="display:none;"></div>
                </div>
                <p id="video-msg" class="text-sm text-gray-500 mt-3 text-center min-h-[1.25rem]">▶️ Press play to start the lesson!</p>
                <div class="text-center mt-2 flex justify-center gap-3 flex-wrap"><button id="subs-btn" class="bg-white border border-indigo-300 text-indigo-700 font-bold px-4 py-2 rounded-full shadow cursor-pointer">💬 Subtitles: ON</button><button onclick="nextLesson()" class="bg-emerald-700 hover:bg-emerald-800 text-white font-bold px-4 py-2 rounded-full shadow cursor-pointer">Next Lesson ▶️</button></div>`;
            const el = document.getElementById('mp4-player');
            addSubtitles(el);
            { const a = document.getElementById('footer-next-module'), b = document.getElementById('footer-next-lesson'); if (a) a.style.display = ''; if (b) b.style.display = 'none'; }
            ytPlayer = {
                getCurrentTime: () => el.currentTime,
                pauseVideo: () => el.pause(),
                playVideo: () => { const p = el.play(); if (p && p.catch) p.catch(() => {}); },
                destroy: () => { try { el.pause(); el.removeAttribute('src'); el.load(); } catch (e) {} }
            };
            el.addEventListener('play', () => { const m = document.getElementById('video-msg'); if (m) m.textContent = ''; });
            el.addEventListener('timeupdate', () => { if (currentVideo && currentVideo.questions.length) checkVideoCheckpoints(); });
            el.addEventListener('ended', () => {
                const got = award(unitKey('video-' + currentVideo.id), 5);
                const m = document.getElementById('video-msg');

            el.addEventListener('error', () => {
                const m = document.getElementById('video-msg');
                if (m) m.innerHTML = '⚠️ The video could not load. Check the internet, or <a href="' + currentVideo.mp4 + '" target="_blank" rel="noopener" class="text-blue-600 underline font-semibold">open it here ↗</a>';
            });
        }

        function onYtStateChange(event) {
            const msg = document.getElementById('video-msg');
            if (event.data === YT.PlayerState.PLAYING) {
                if (ytPollInterval) clearInterval(ytPollInterval);
                if (currentVideo && currentVideo.questions.length) ytPollInterval = setInterval(checkVideoCheckpoints, 400);
                if (msg) msg.textContent = '';
            } else if (event.data === YT.PlayerState.PAUSED || event.data === YT.PlayerState.ENDED) {
                if (ytPollInterval) { clearInterval(ytPollInterval); ytPollInterval = null; }
                if (event.data === YT.PlayerState.ENDED) {
                    const got = award(unitKey('video-' + currentVideo.id), 5);
                    if (msg) msg.textContent = '🎉 Great job watching the whole video!' + (got ? ' (+5 ⭐)' : '');
                }
            }
        }

        function checkVideoCheckpoints() {
            if (!ytPlayer || typeof ytPlayer.getCurrentTime !== 'function' || !currentVideo) return;
            let t = 0;
            try { t = ytPlayer.getCurrentTime(); } catch (e) { return; }
            currentVideo.questions.forEach((cp, idx) => {
                if (!ytAnsweredCheckpoints.has(idx) && t >= cp.time) {
                    ytAnsweredCheckpoints.add(idx);
                    showVideoCheckpoint(idx);
                }
            });
        }

        function showVideoCheckpoint(idx) {
            const cp = currentVideo.questions[idx];
            ytPlayer.pauseVideo();
            if (ytPollInterval) { clearInterval(ytPollInterval); ytPollInterval = null; }
            const overlay = document.getElementById('checkpoint-overlay');
            overlay.style.display = 'flex';
            overlay.innerHTML = `
                <div class="bg-white rounded-2xl p-6 max-w-md w-full text-center">

                    <div class="flex flex-col gap-2" id="checkpoint-options">
                        ${cp.options.map((opt, i) => `<button onclick="answerVideoCheckpoint(${idx}, ${i})" class="bg-blue-50 hover:bg-blue-100 text-blue-900 font-semibold p-3 rounded-xl cursor-pointer">${opt}</button>`).join('')}
                    </div>
                    <p id="checkpoint-feedback" class="mt-3 font-bold min-h-[1.5rem]"></p>
                </div>`;
        }

        function answerVideoCheckpoint(idx, chosenIndex) {
            const cp = currentVideo.questions[idx];
            const feedback = document.getElementById('checkpoint-feedback');
            const optionsDiv = document.getElementById('checkpoint-options');
            optionsDiv.querySelectorAll('button').forEach(b => b.disabled = true);
            if (chosenIndex === cp.correct) {
                feedback.className = 'mt-3 font-bold min-h-[1.5rem] text-green-600';
                feedback.textContent = award(unitKey('video-' + currentVideo.id + '-q' + idx), 2) ? '🎉 Correct! (+2 ⭐)' : '🎉 Correct!';
            } else {
                feedback.className = 'mt-3 font-bold min-h-[1.5rem] text-red-500';
                feedback.textContent = `❌ Not quite — the answer was "${cp.options[cp.correct]}"`;
            }
            const nextBtn = document.createElement('button');
            nextBtn.textContent = 'Next ▶️';
            nextBtn.className = 'mt-4 bg-blue-600 hover:bg-blue-700 text-white font-bold px-6 py-2 rounded-full shadow cursor-pointer';
            nextBtn.onclick = resumeVideoAfterCheckpoint;
            feedback.insertAdjacentElement('afterend', nextBtn);
        }

        function resumeVideoAfterCheckpoint() {
            document.getElementById('checkpoint-overlay').style.display = 'none';
            if (ytPlayer) ytPlayer.playVideo();
        }

        // ===== 7. QUIZ (graded quiz per unit, pictures on every answer) =====
        // Stars are given only for improving on your best score for this unit,
        // and answer buttons lock after the first tap so quick double taps can't skip questions.
        let quizState = { qIndex: 0, score: 0, order: [], currentOptions: [], currentAnswer: '', locked: false };
        function renderQuiz(contentDiv, unitData) {
            quizState = { qIndex: 0, score: 0, order: shuffle(unitData.vocab.map((_, i) => i)), currentOptions: [], currentAnswer: '', locked: false };
            showQuizQuestion();
        }
        function showQuizQuestion() {
            const contentDiv = document.getElementById('module-content');
            const unitData = realCurriculum[state.level][state.unit];
            quizState.locked = false;
            if (quizState.qIndex >= quizState.order.length) {
                const total = quizState.order.length;
                const pct = Math.round((quizState.score / total) * 100);
                const bestKey = state.level + '|' + unitKey('quiz');
                const best = progress.bestQuiz[bestKey] || 0;
                const earned = Math.max(0, quizState.score - best) * 2;
                if (quizState.score > best) progress.bestQuiz[bestKey] = quizState.score;
                if (earned > 0) addStars(earned); else saveProgress();
                if (pct === 100) triggerConfetti();
                if (quizState.score >= 6) ocMarkUnitDone();
                contentDiv.innerHTML = `
                    <h2 class="text-xl font-bold text-blue-800 mb-2">🧩 Quiz Complete!</h2>
                    <div class="bg-purple-50 p-8 rounded-2xl border border-purple-200 text-center">
                        <div class="text-5xl mb-3">${pct === 100 ? '🏆' : pct >= 50 ? '🎉' : '💪'}</div>
                        <p class="font-bold text-purple-900 text-2xl mb-2">${quizState.score} / ${total} Correct</p>
                        <p class="text-gray-600 mb-4">${earned > 0 ? `You earned ${earned} ⭐` : (best >= total ? 'Perfect score already! 🌟' : `Your best is ${Math.max(best, quizState.score)} / ${total} — beat it to earn more ⭐`)}</p>
                        <button onclick="renderQuiz(document.getElementById('module-content'), realCurriculum[state.level][state.unit])" class="bg-purple-600 hover:bg-purple-700 text-white font-bold px-5 py-2 rounded-xl shadow cursor-pointer">🔁 Try Again</button>
                    </div>`;
                return;
            }
            const wordIdx = quizState.order[quizState.qIndex];
            const word = unitData.vocab[wordIdx];
            const distractors = pickDistractors(word, unitData);
            const options = shuffle([word, ...distractors]);
            quizState.currentOptions = options;
            quizState.currentAnswer = word;
            contentDiv.innerHTML = `
                <h2 class="text-xl font-bold text-blue-800 mb-2">🧩 Quiz & Sticker Rewards</h2>
                <p class="text-sm text-gray-500 mb-3">Question ${quizState.qIndex + 1} of ${quizState.order.length}</p>

        // ===================== ONLINE CLASS · 9 extra modules =====================
        const ocBox = (inner, color) => `<div class="bg-${color}-50 border-2 border-dashed border-${color}-300 rounded-2xl p-6 text-center">${inner}</div>`;

        const ocSay = (w) => `<button onclick="speak('${jsArg(w)}')" class="text-blue-600 underline text-sm cursor-pointer">🔊 Hear it</button>`;
        const ocUnit = () => realCurriculum[state.level][state.unit];

        // 10 · Spelling Tiles: tap the letters in the right order
        let ocSp = { i: 0, words: [], built: '' };
        function oc_spelling(c, u) { ocSp = { i: 0, words: shuffle(u.vocab.filter(w => /^[A-Za-z]{2,9}$/.test(w))).slice(0, 5), built: '' }; ocSpShow(); }
        function ocSpShow() {
            const c = document.getElementById('module-content'), u = ocUnit();

            const w = ocSp.words[ocSp.i]; ocSp.built = '';

            c.innerHTML = ocHead('🔤 Spelling Tiles', `Look and listen, then tap the letters in order. (${ocSp.i + 1}/${ocSp.words.length})`) + ocBox(
                `<div class="text-7xl mb-2">${emojiFor(w, u)}</div>${ocSay(w)}
                 <div id="sp-built" class="text-4xl font-bold tracking-widest text-blue-800 my-4">${'_ '.repeat(w.length).trim()}</div>
                 <div class="flex flex-wrap justify-center gap-2">${tiles.map((L, i) => `<button onclick="ocSpTap('${L}', this)" class="w-14 h-14 bg-white rounded-xl shadow text-2xl font-bold text-blue-800 hover:bg-yellow-100 cursor-pointer">${L}</button>`).join('')}</div>
                 <button onclick="ocSpShow()" class="mt-4 text-sm text-gray-500 underline cursor-pointer">↺ Start this word again</button>
                 <p id="sp-msg" class="mt-3 font-bold min-h-[1.5rem]"></p>`, 'yellow');
            speak(w);
        }
        function ocSpTap(L, btn) {
            const w = ocSp.words[ocSp.i].toUpperCase(), msg = document.getElementById('sp-msg');

            ocSp.built += L; btn.disabled = true; btn.classList.add('opacity-30');
            document.getElementById('sp-built').textContent = (ocSp.built + '_'.repeat(w.length - ocSp.built.length)).split('').join(' ');
            msg.textContent = '';

                msg.className = 'mt-3 font-bold text-green-600';

                speak(ocSp.words[ocSp.i]); ocSp.i++; setTimeout(ocSpShow, 1300);
            }

        // 11 · Sentence Building: put the words of the pattern sentence in order
        let ocSe = { i: 0, list: [], built: [] };
        function oc_sentence(c, u) {
            const list = (u.grammar.example.match(/[^.!?]+[.!?]/g) || [u.grammar.example]).map(x => x.trim()).filter(x => x.split(' ').length >= 2);
            ocSe = { i: 0, list, built: [] }; ocSeShow();
        }
        function ocSeShow() {
            const c = document.getElementById('module-content');

            const sen = ocSe.list[ocSe.i]; ocSe.built = [];
            const words = sen.split(' '); let mix = shuffle(words); for (let t = 0; t < 5 && mix.join(' ') === sen; t++) mix = shuffle(words);
            c.innerHTML = ocHead('💬 Sentence Building', `Listen, then tap the words in order. (${ocSe.i + 1}/${ocSe.list.length})`) + ocBox(
                `<p class="text-sm text-sky-700 font-semibold mb-2">Pattern: ${ocUnit().grammar.point}</p>${ocSay(sen)}
                 <div id="se-built" class="min-h-[3.5rem] bg-white rounded-xl shadow-inner my-4 p-3 text-2xl font-bold text-blue-800"></div>
                 <div class="flex flex-wrap justify-center gap-2">${mix.map(w => `<button onclick="ocSeTap('${jsArg(w)}', this)" class="px-4 py-2 bg-white rounded-xl shadow text-xl font-semibold text-blue-800 hover:bg-sky-100 cursor-pointer">${w}</button>`).join('')}</div>
                 <button onclick="ocSeShow()" class="mt-4 text-sm text-gray-500 underline cursor-pointer">↺ Start again</button>
                 <p id="se-msg" class="mt-3 font-bold min-h-[1.5rem]"></p>`, 'sky');
            speak(sen);
        }
        function ocSeTap(w, btn) {
            const want = ocSe.list[ocSe.i].split(' '), msg = document.getElementById('se-msg');
            if (w !== want[ocSe.built.length]) { msg.className = 'mt-3 font-bold text-red-500'; msg.textContent = '❌ Listen again and try another word.'; return; }
            ocSe.built.push(w); btn.disabled = true; btn.classList.add('opacity-30');
            document.getElementById('se-built').textContent = ocSe.built.join(' '); msg.textContent = '';
            if (ocSe.built.length === want.length) {
                msg.className = 'mt-3 font-bold text-green-600';
