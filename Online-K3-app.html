<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C2-EPE Online Class · K3</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Confetti Library for Celebrations -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Comic+Neue:wght@700&family=Poppins:wght@400;600;700&display=swap');
        body { font-family: 'Poppins', sans-serif; }
        .fun-font { font-family: 'Comic Neue', cursive; }
        button:disabled { opacity: .6; cursor: default; }
        /* phones: the lesson fills the screen, so jumping to it always shows it from the top */
        @media (max-width: 767px) { #content-area { min-height: calc(100vh - 24px); padding-bottom: 76px; } }
            video::cue { font-size: 1.15em; font-weight: 600; background: rgba(0,0,0,0.72); color: #fff; }
    </style>
</head>
<body class="bg-amber-50 min-h-screen flex flex-col items-center p-4">

    <!-- Header Section -->
    <header class="w-full max-w-5xl bg-blue-600 text-white rounded-2xl p-6 shadow-lg mb-6 flex justify-between items-center flex-wrap gap-3">
        <div>
            <h1 class="text-2xl md:text-3xl fun-font tracking-wider">🌟 C2-EPE Digital Academy</h1>
            <p class="text-sm text-blue-100">💻 Online Class · K3 · 29 units · 19 learning modules</p>
        </div>
        <div class="flex items-center gap-3 flex-wrap justify-end">
            <div class="bg-amber-400 text-blue-900 px-3 py-2 rounded-xl text-sm font-bold shadow flex items-center gap-1">
                ⭐ <span id="star-count">0</span>
            </div>
            <div class="bg-pink-500 text-white px-3 py-2 rounded-xl text-sm font-bold shadow flex items-center gap-1">
                🏆 <span id="badge-count">0</span> Badges
            </div>
            <div class="bg-blue-500 px-3 py-2 rounded-xl text-sm font-bold border border-blue-400">
                <span id="current-level-display">K3</span>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="w-full max-w-5xl grid grid-cols-1 md:grid-cols-4 gap-6">
        
        <!-- Sidebar Navigation -->
        <aside id="module-sidebar" class="bg-white rounded-2xl p-4 shadow-md md:col-span-1 flex flex-col gap-3" style="scroll-margin-top:12px;">
            <!-- Hidden entirely when opened with a ?level= URL param (see
                 the Hub-integration script at the bottom) so each Hub card
                 for K0/K1/K2/K3 feels like its own dedicated page instead
                 of a shared app a student could switch away from. -->
            <div id="level-picker-wrap">
                <h2 class="font-bold text-gray-700 border-b pb-2">Kindergarten Levels</h2>
                <div class="flex flex-col gap-3 mt-3">
                    <button onclick="selectLevel('K0')" id="btn-K0" class="level-btn text-left p-3 rounded-xl bg-gray-100 hover:bg-amber-100 font-semibold transition cursor-pointer">🧸 K0 (Starter)</button>
                    <button onclick="selectLevel('K1')" id="btn-K1" class="level-btn text-left p-3 rounded-xl bg-blue-600 text-white font-semibold transition shadow cursor-pointer">🚀 K1 (Level 1)</button>
                    <button onclick="selectLevel('K2')" id="btn-K2" class="level-btn text-left p-3 rounded-xl bg-gray-100 hover:bg-amber-100 font-semibold transition cursor-pointer">🎨 K2 (Level 2)</button>
                    <button onclick="selectLevel('K3')" id="btn-K3" class="level-btn text-left p-3 rounded-xl bg-gray-100 hover:bg-amber-100 font-semibold transition cursor-pointer">🏆 K3 (Level 3)</button>
                </div>
            </div>
            <div id="locked-level-banner" class="hidden bg-blue-50 border border-blue-200 rounded-xl p-3 text-center">
                <p class="text-xs text-blue-500 font-semibold">LEVEL</p>
                <p id="locked-level-text" class="text-xl font-bold text-blue-800"></p>
            </div>


            <hr class="my-2">
            <h2 class="font-bold text-gray-700" id="unit-select-label">Select Unit (1 to 16)</h2>
            <select id="unit-select" onchange="updateUnit()" class="p-2 rounded-xl border border-gray-300 bg-gray-50 font-semibold text-blue-800">
                <option value="1">Unit 1: Hello!</option>
            </select>

            <hr class="my-2">
            <h2 class="font-bold text-gray-700">Learning Modules</h2>
            <button onclick="switchTab('video')" data-tab="video" id="video-tab-btn" class="tab-btn text-left p-2 rounded-lg hover:bg-gray-100 font-medium text-sm cursor-pointer">📹 0. Video Lesson</button>
            <button onclick="switchTab('listening')" data-tab="listening" class="tab-btn text-left p-2 rounded-lg hover:bg-gray-100 font-medium text-sm cursor-pointer">🔊 1. Listening</button>
            <button onclick="switchTab('speaking')" data-tab="speaking" class="tab-btn text-left p-2 rounded-lg hover:bg-gray-100 font-medium text-sm cursor-pointer">🗣️ 2. Speaking</button>
            <button onclick="switchTab('reading')" data-tab="reading" class="tab-btn text-left p-2 rounded-lg hover:bg-gray-100 font-medium text-sm cursor-pointer">📖 3. Reading</button>
            <button onclick="switchTab('writing')" data-tab="writing" class="tab-btn text-left p-2 rounded-lg hover:bg-gray-100 font-medium text-sm cursor-pointer">✍️ 4. Writing (Trace)</button>
            <button onclick="switchTab('matching')" data-tab="matching" class="tab-btn text-left p-2 rounded-lg hover:bg-gray-100 font-medium text-sm cursor-pointer">🎮 5. Vocab Game</button>
            <button onclick="switchTab('coloring')" data-tab="coloring" class="tab-btn text-left p-2 rounded-lg hover:bg-gray-100 font-medium text-sm cursor-pointer">🎨 6. Fun Coloring</button>
            <button onclick="switchTab('quiz')" data-tab="quiz" class="tab-btn text-left p-2 rounded-lg hover:bg-gray-100 font-medium text-sm cursor-pointer">🧩 7. Quiz & Rewards</button>
            <button onclick="switchTab('grammar')" data-tab="grammar" class="tab-btn text-left p-2 rounded-lg hover:bg-gray-100 font-medium text-sm cursor-pointer">📐 8. Grammar Box</button>
            <!-- Phonics only makes sense for very early readers, so it's
                 shown/hidden per level by selectLevel() rather than being a
                 fixed tab like the others. -->
            <button onclick="switchTab('phonics')" id="phonics-tab-btn" data-tab="phonics" class="tab-btn text-left p-2 rounded-lg hover:bg-gray-100 font-medium text-sm cursor-pointer" style="display:none;">🔤 9. ABC Phonics</button>
            <button onclick="switchTab('spelling')" data-tab="spelling" class="tab-btn text-left p-2 rounded-lg hover:bg-gray-100 font-medium text-sm cursor-pointer">🔤 10. Spelling Tiles</button>
            <button onclick="switchTab('sentence')" data-tab="sentence" class="tab-btn text-left p-2 rounded-lg hover:bg-gray-100 font-medium text-sm cursor-pointer">💬 11. Sentence Building</button>
            <button onclick="switchTab('chant')" data-tab="chant" class="tab-btn text-left p-2 rounded-lg hover:bg-gray-100 font-medium text-sm cursor-pointer">🎵 12. Song & Chant</button>
            <button onclick="switchTab('memory')" data-tab="memory" class="tab-btn text-left p-2 rounded-lg hover:bg-gray-100 font-medium text-sm cursor-pointer">🃏 13. Memory Match</button>
            <button onclick="switchTab('oddone')" data-tab="oddone" class="tab-btn text-left p-2 rounded-lg hover:bg-gray-100 font-medium text-sm cursor-pointer">🔍 14. Odd One Out</button>
            <button onclick="switchTab('count')" data-tab="count" class="tab-btn text-left p-2 rounded-lg hover:bg-gray-100 font-medium text-sm cursor-pointer">🔢 15. Find & Count</button>
            <button onclick="switchTab('roleplay')" data-tab="roleplay" class="tab-btn text-left p-2 rounded-lg hover:bg-gray-100 font-medium text-sm cursor-pointer">🎭 16. Role-Play</button>
            <button onclick="switchTab('values')" data-tab="values" class="tab-btn text-left p-2 rounded-lg hover:bg-gray-100 font-medium text-sm cursor-pointer">💛 17. Values Corner</button>
            <button onclick="switchTab('review')" data-tab="review" class="tab-btn text-left p-2 rounded-lg hover:bg-gray-100 font-medium text-sm cursor-pointer">🔄 18. Review</button>
        </aside>

        <!-- Content Area -->
        <section id="content-area" class="bg-white rounded-2xl p-6 shadow-md md:col-span-3 flex flex-col justify-between" style="scroll-margin-top:12px;">
            
            <div id="module-content">
                <!-- Dynamic Content Loaded via JS -->
            </div>

            <!-- Footer Navigation -->
            <div class="mt-8 pt-4 border-t flex justify-between items-center text-sm text-gray-500 gap-2 flex-wrap">
                <span id="platform-info">C2-EPE Digital Platform - K0 (Unit 1)</span>
                <div class="flex gap-2">
                    <button onclick="completeActivity()" id="finish-btn" class="bg-amber-500 hover:bg-amber-600 text-white font-bold px-4 py-2 rounded-xl shadow cursor-pointer transition">Finish Activity (+5 ⭐)</button>
                    <button id="footer-next-module" onclick="switchTab('listening')" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-4 py-2 rounded-xl shadow cursor-pointer transition" style="display:none;">🔊 Next: Listening ▶️</button>
                    <button id="footer-next-lesson" onclick="nextLesson()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-4 py-2 rounded-xl shadow cursor-pointer transition">Next Lesson ▶️</button>
                </div>
            </div>
        </section>

    </main>

    <!-- Phones only: jump back up to the list of learning modules -->
    <button id="modules-jump" onclick="jumpToModules()"
        class="md:hidden fixed bottom-4 right-4 z-50 bg-blue-600 text-white font-bold px-4 py-3 rounded-full shadow-lg cursor-pointer"
        style="display:none;" aria-label="Back to learning modules">📚 Modules</button>
    <!-- JavaScript Comprehensive Engine -->

        // ===== Progress: stars/badges are earned once per activity and remembered =====
        // Saved in this browser when the page is opened as a normal web page. When it runs
        // inside the Hub's secure "Embed Code" box the browser blocks storage, so progress
        // then lasts until the page is closed (it still can't be farmed by repeated taps).
        const PROGRESS_KEY = () => 'c2epe_onlineclass_progress_' + state.level;
        let progress = { stars: 0, badges: 0, awarded: {}, bestQuiz: {} };
        function loadProgress() {
            try {
                const saved = JSON.parse(localStorage.getItem(PROGRESS_KEY()) || 'null');
                if (saved && typeof saved === 'object') progress = Object.assign({ stars: 0, badges: 0, awarded: {}, bestQuiz: {} }, saved);
            } catch (e) { /* storage not available (e.g. inside the Hub sandbox) */ }
            state.stars = progress.stars; state.badges = progress.badges;
            document.getElementById('star-count').innerText = state.stars;
            document.getElementById('badge-count').innerText = state.badges;
        }
        function saveProgress() {
            progress.stars = state.stars; progress.badges = state.badges;
            try { localStorage.setItem(PROGRESS_KEY(), JSON.stringify(progress)); } catch (e) {}
        }
        // Gives stars only the first time a given activity is done. Returns true if stars were given.
        function award(key, amount) {
            const k = state.level + '|' + key;
            if (progress.awarded[k]) return false;
            progress.awarded[k] = true;
            addStars(amount);
            return true;
        }
        const unitKey = (what) => 'u' + state.unit + '|' + what;

        function populateUnitSelect() {
            const sel = document.getElementById('unit-select');
            const levelData = realCurriculum[state.level];
            const prevUnit = state.unit;
            const unitCount = Object.keys(levelData).length;
            const labelEl = document.getElementById('unit-select-label');
            if (labelEl) labelEl.textContent = `Select Unit (1 to ${unitCount})`;
            // 🎬 marks units that have a video (🆕 = added in the last 7 days)
            sel.innerHTML = Object.keys(levelData).map(u => {
                const v = videoFor(state.level, u);
                const mark = v ? (isRecentlyAdded(v.added) ? ' 🆕' : ' 🎬') : '';
                return `<option value="${u}">Unit ${u}: ${levelData[u].title}${mark}</option>`;
            }).join('');
            if (typeof OC_TRIAL !== 'undefined' && OC_TRIAL) { [...sel.options].forEach(o => { if (Number(o.value) > 3) { o.disabled = true; o.textContent = '🔒 ' + o.textContent + ' (after the trial)'; } }); }
            // keep the same unit number selected if it still exists for this level
            if (levelData[prevUnit]) {
                sel.value = prevUnit;
                state.unit = prevUnit;
            } else {
                state.unit = parseInt(sel.value);
            }
        }

        // Phonics only fits early readers (K0/K1) — levels where it's not
        // shown are also guarded against being left "stuck" on the phonics
        // tab if the student switches level while it's open.
        const PHONICS_LEVELS = ['K0', 'K1'];

        function selectLevel(lvl) {
            state.level = lvl;
            document.querySelectorAll('.level-btn').forEach(b => {
                b.classList.remove('bg-blue-600', 'text-white', 'shadow');
                b.classList.add('bg-gray-100');
            });
            document.getElementById('btn-' + lvl).classList.remove('bg-gray-100');
            document.getElementById('btn-' + lvl).classList.add('bg-blue-600', 'text-white', 'shadow');
            document.getElementById('current-level-display').innerText = lvl;

            const phonicsBtn = document.getElementById('phonics-tab-btn');
            const phonicsAllowed = PHONICS_LEVELS.includes(lvl);
            phonicsBtn.style.display = phonicsAllowed ? '' : 'none';
            if (!phonicsAllowed && state.tab === 'phonics') { state.tab = 'listening'; highlightActiveTab(); }

            loadProgress();
            populateUnitSelect();
            renderContent();
        }

        function updateUnit() {
            state.unit = parseInt(document.getElementById('unit-select').value);
            renderContent();
            scrollToLesson();
        }

        // Moves to the next unit within the current level (wrapping back to
        // unit 1 after the last one), keeping the same module tab open so
        // a student can go straight through Unit 1 -> Unit 2 -> ... without
        // re-opening the dropdown each time.
        function nextLesson() {
            const levelData = realCurriculum[state.level];
            const unitNumbers = Object.keys(levelData).map(Number).sort((a, b) => a - b);
            const idx = unitNumbers.indexOf(state.unit);
            const nextIdx = (idx === -1 ? 0 : idx + 1) % ((typeof OC_TRIAL !== 'undefined' && OC_TRIAL) ? 3 : unitNumbers.length);
            state.unit = unitNumbers[nextIdx];
            document.getElementById('unit-select').value = state.unit;
            renderContent();
            scrollToLesson(true);
        }

        function highlightActiveTab() {
            document.querySelectorAll('.tab-btn').forEach(b => {
                b.classList.remove('bg-blue-50', 'text-blue-700');
                b.classList.add('hover:bg-gray-100');
            });
            const activeBtn = document.querySelector(`.tab-btn[data-tab="${state.tab}"]`);
            if (activeBtn) {
                activeBtn.classList.remove('hover:bg-gray-100');
                activeBtn.classList.add('bg-blue-50', 'text-blue-700');
            }
        }

        // On phones the lesson sits below the module list, so after choosing a module,
        // a unit or the next lesson, the page now scrolls down to the lesson by itself.
        const isPhone = () => window.matchMedia('(max-width: 767px)').matches;
        function scrollToLesson(always) {
            const area = document.getElementById('content-area');
            if (!area) return;
            if (!(isPhone() || (always && area.getBoundingClientRect().top < 0))) return;
            // Wait for the new lesson to be drawn, then glide to it. Some phones stop a smooth
            // scroll that starts during the tap itself, so if it hasn't arrived shortly after,
            // jump there directly.
            setTimeout(() => {
                area.scrollIntoView({ behavior: 'smooth', block: 'start' });
                setTimeout(() => {
                    if (Math.abs(area.getBoundingClientRect().top) > 40) area.scrollIntoView({ block: 'start' });
                }, 700);
            }, 60);
        }
        function jumpToModules() {
            const side = document.getElementById('module-sidebar');
            side.scrollIntoView({ behavior: 'smooth', block: 'start' });
            setTimeout(() => { if (Math.abs(side.getBoundingClientRect().top) > 40) side.scrollIntoView({ block: 'start' }); }, 700);
        }
        function switchTab(tab) {
            state.tab = tab;
            highlightActiveTab();
            renderContent();
            scrollToLesson();
        }

        function triggerConfetti() {
            if (typeof confetti === 'function') {
                confetti({
                    particleCount: 100,
                    spread: 70,
                    origin: { y: 0.6 }
                });
            }
        }

        function addStars(amt) {
            state.stars += amt;
            document.getElementById('star-count').innerText = state.stars;
            saveProgress();
            triggerConfetti();
        }

        // "Finish Activity" now rewards each activity of each unit once (and one badge per unit),
        // instead of giving stars and badges every time it is tapped.
        function completeActivity() {
            const gotStars = award(unitKey('finish-' + state.tab), 5);
            let gotBadge = false;
            const badgeKey = state.level + '|' + unitKey('badge');
            if (gotStars && !progress.awarded[badgeKey]) {
                progress.awarded[badgeKey] = true;
                state.badges += 1;
                document.getElementById('badge-count').innerText = state.badges;
                saveProgress();
                gotBadge = true;
            }
            if (gotBadge) alert(`🎉 Awesome! You finished this activity, earned 5 Stars ⭐ and unlocked a new Sticker Badge for Unit ${state.unit}! 🏆`);
            else if (gotStars) alert(`🎉 Awesome! You finished this activity and earned 5 Stars ⭐!`);
            else alert(`✅ You already finished this activity. Try another one, or go to the next lesson! ▶️`);
        }

        // ---------- Helper: Text-to-Speech ----------
        // Voices load a moment after the page opens, so they are cached when ready.
        let enVoice = null;
        function pickVoice() {
            if (!('speechSynthesis' in window)) return;
            const voices = window.speechSynthesis.getVoices();
            enVoice = voices.find(v => v.lang && v.lang.startsWith('en')) || null;
        }
        if ('speechSynthesis' in window) { pickVoice(); window.speechSynthesis.onvoiceschanged = pickVoice; }
        function speak(text, onEnd) {
            if (!('speechSynthesis' in window)) { if (onEnd) onEnd(false); return false; }
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(text);
            u.lang = 'en-US';
            u.rate = 0.85;
            if (!enVoice) pickVoice();
            if (enVoice) u.voice = enVoice;
            if (onEnd) u.onend = () => onEnd(true);
            window.speechSynthesis.speak(u);
            return true;
        }

        function shuffle(arr) {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

            let words = [];
            Object.keys(realCurriculum[level]).forEach(u => words.push(...realCurriculum[level][u].vocab));

        }

            traceDrawn = false;
            const canvas = document.getElementById('trace-canvas');
            const ctx = canvas.getContext('2d');
            ctx.lineWidth = 6;
            ctx.lineCap = 'round';
            ctx.strokeStyle = '#2563eb';
            let drawing = false;
            function pos(e) {
                const rect = canvas.getBoundingClientRect();
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;
                const cx = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
                const cy = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
                return { x: cx * scaleX, y: cy * scaleY };
            }
            function start(e) { drawing = true; traceDrawn = true; const p = pos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); e.preventDefault(); }
            function move(e) { if (!drawing) return; const p = pos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); e.preventDefault(); }
            function end() { drawing = false; }
            canvas.addEventListener('mousedown', start);
            canvas.addEventListener('mousemove', move);
            if (traceMouseUpHandler) window.removeEventListener('mouseup', traceMouseUpHandler);
            traceMouseUpHandler = end;
            window.addEventListener('mouseup', traceMouseUpHandler);
            canvas.addEventListener('touchstart', start, { passive: false });
            canvas.addEventListener('touchmove', move, { passive: false });
            canvas.addEventListener('touchend', end);
        }

        // ===== 8. GRAMMAR BOX (pattern + example + free-practice sentence) =====

        // ===== 9. ABC PHONICS — "Letters of the Week" (K0/K1 only) =====

        // "See all letters A–Z" still shows the full alphabet for review.
        const LETTER_PLAN = {"1": ["A"], "2": ["B"], "3": ["C"], "4": ["D"], "5": ["E"], "6": ["F"], "7": ["G"], "8": ["H"], "9": ["I"], "10": ["J"], "11": ["K"], "12": ["L"], "13": ["M"], "14": ["N"], "15": ["O"], "16": ["P"], "17": ["Q"], "18": ["R"], "19": ["S"], "20": ["T"], "21": ["U"], "22": ["V"], "23": ["W"], "24": ["X"], "25": ["Y"], "26": ["Z"], "27": ["A", "E", "I", "O", "U"], "28": ["B", "D", "P", "T"], "29": ["M", "N", "S", "Z"]};
        // Four picture words per letter (the first one is the "A is for ..." word).
        // X is taught as the sound at the END of a word (fox, box, six), as in most phonics courses.
        const PHONICS_WORDS = {
            A: [['Apple','🍎'],['Ant','🐜'],['Alligator','🐊'],['Airplane','✈️']],
            B: [['Ball','⚽'],['Bear','🐻'],['Banana','🍌'],['Bird','🐦']],
            C: [['Cat','🐱'],['Car','🚗'],['Cake','🎂'],['Cow','🐄']],
            D: [['Dog','🐶'],['Duck','🦆'],['Drum','🥁'],['Door','🚪']],
            E: [['Egg','🥚'],['Elephant','🐘'],['Envelope','✉️'],['Elbow','💪']],
            F: [['Fish','🐟'],['Frog','🐸'],['Flower','🌷'],['Fire','🔥']],
            G: [['Grape','🍇'],['Goat','🐐'],['Gift','🎁'],['Guitar','🎸']],
            H: [['Hat','👒'],['House','🏠'],['Horse','🐴'],['Hand','✋']],
            I: [['Insect','🐛'],['Iguana','🦎'],['Ink','🖋️'],['Ice cream','🍦']],
            J: [['Juice','🧃'],['Jellyfish','🪼'],['Jacket','🧥'],['Jeep','🚙']],
            K: [['Kite','🪁'],['Key','🔑'],['King','🤴'],['Kangaroo','🦘']],
            L: [['Lion','🦁'],['Leaf','🍃'],['Lemon','🍋'],['Lamp','💡']],
            M: [['Moon','🌙'],['Monkey','🐒'],['Milk','🥛'],['Mouse','🐭']],
            N: [['Nose','👃'],['Nest','🪺'],['Nut','🥜'],['Net','🥅']],
            O: [['Octopus','🐙'],['Orange','🍊'],['Ox','🐂'],['Olive','🫒']],
            P: [['Pig','🐷'],['Pen','🖊️'],['Pizza','🍕'],['Panda','🐼']],
            Q: [['Queen','👸'],['Question','❓'],['Quiet','🤫'],['Quack','🦆']],
            R: [['Rabbit','🐰'],['Rain','🌧️'],['Robot','🤖'],['Rainbow','🌈']],
            S: [['Sun','☀️'],['Snake','🐍'],['Star','⭐'],['Sock','🧦']],

            X: [['Fox','🦊'],['Box','📦'],['Six','6️⃣'],['X-ray','🩻']],
            Y: [['Yo-yo','🪀'],['Yellow','🟨'],['Yarn','🧶'],['Yogurt','🍶']],
            Z: [['Zebra','🦓'],['Zero','0️⃣'],['Zigzag','〰️'],['Zip','🤐']]
        };
        const ALPHABET = Object.keys(PHONICS_WORDS);
        // K0 follows the videos: one letter per lesson (Lesson 1 = A … Lesson 16 = P)
        const lettersFor = (unit) => LETTER_PLAN[unit] || LETTER_PLAN[1];
        const letterIntro = (L) => L === 'X'
            ? 'X. Listen for X at the end: fox, box, six.'
            : `${L}. ${L} is for ${PHONICS_WORDS[L][0][0]}.`;
        let phonicsGame = { rounds: [], index: 0, score: 0, locked: false };

        function renderPhonics(contentDiv) {
            const letters = lettersFor(state.unit);
            const firstNo = ALPHABET.indexOf(letters[0]) + 1, lastNo = ALPHABET.indexOf(letters[letters.length - 1]) + 1;
            contentDiv.innerHTML = `
                <h2 class="text-xl font-bold text-blue-800 mb-1">🔤 ABC Phonics — Letters of the Week</h2>
                <p class="text-gray-600 mb-4">Unit ${state.unit}: letter${letters.length > 1 ? 's' : ''} <b>${letters.join(' and ')}</b>
                   <span class="text-sm text-gray-400">(letters ${firstNo === lastNo ? firstNo : firstNo + '–' + lastNo} of 26)</span></p>
                <div class="flex flex-col gap-5">
                    ${letters.map(L => `
                    <div class="bg-yellow-50 border-2 border-dashed border-yellow-300 rounded-2xl p-5">
                        <div class="flex items-center gap-4 flex-wrap mb-4">
                            <button onclick="sayLetter('${L}')" id="ph-big-${L}" class="bg-white rounded-2xl shadow px-6 py-3 cursor-pointer hover:bg-yellow-100 ${progress.awarded[state.level + '|phonics-letter-' + L] ? 'ring-4 ring-green-400' : ''}" aria-label="Hear the letter ${L}">

                        <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
                            ${PHONICS_WORDS[L].map(([w, e], i) => `

        // Colours the letter being learned inside each word (first letter, or the x at the end)
        function highlightLetter(word, L) {
            const i = L === 'X' ? word.toLowerCase().lastIndexOf('x') : 0;
            if (i < 0) return word;
            return word.slice(0, i) + `<span class="text-pink-500 text-base">${word[i]}</span>` + word.slice(i + 1);
        }
        function sayLetter(L) {
            speak(letterIntro(L));
            if (award('phonics-letter-' + L, 1)) document.getElementById('ph-big-' + L).classList.add('ring-4', 'ring-green-400');
        }
        function sayPhonicsWord(L, i) {
            speak(PHONICS_WORDS[L][i][0]);
            if (award('phonics-word-' + L + i, 1)) document.getElementById(`ph-${L}-${i}`).classList.add('ring-4', 'ring-green-400');
        }

        // Mini game: "Which one starts with B?" — 4 rounds, answers lock after the first tap
        function startPhonicsGame() {
            const letters = lettersFor(state.unit);
            const others = ALPHABET.filter(L => !letters.includes(L));
            const rounds = [];
            for (let r = 0; r < 4; r++) {
                const L = letters[r % letters.length];
                const right = PHONICS_WORDS[L][r % 4];
                const fits = ([w]) => L === 'X' ? /x/i.test(w) : w[0].toUpperCase() === L;
                const pool = others.flatMap(o => PHONICS_WORDS[o]).filter(p => !fits(p) && p[1] !== right[1]);
                const wrong = shuffle(pool).slice(0, 2);
                rounds.push({ L, right, options: shuffle([right, ...wrong]) });
            }
            phonicsGame = { rounds, index: 0, score: 0, locked: false };
            showPhonicsRound();
        }
        function showPhonicsRound() {
            const box = document.getElementById('phonics-game');
            if (!box) return;
            phonicsGame.locked = false;
            const g = phonicsGame;
            if (g.index >= g.rounds.length) {
                const perfect = g.score === g.rounds.length;
                const got = perfect && award(unitKey('phonics-game'), 3);
                if (perfect) triggerConfetti();
                box.innerHTML = `
                    <p class="font-bold text-purple-900 text-lg text-center mb-2">${perfect ? '🏆' : '💪'} ${g.score} / ${g.rounds.length} correct${got ? ' (+3 ⭐)' : ''}</p>

                    <div class="text-center"><button onclick="startPhonicsGame()" class="bg-purple-600 hover:bg-purple-700 text-white font-bold px-5 py-2 rounded-xl shadow cursor-pointer">🔁 Play again</button></div>`;
                return;
            }
            const round = g.rounds[g.index];
            const ask = round.L === 'X' ? 'Which one ends with X?' : `Which one starts with ${round.L}?`;
            box.innerHTML = `
                <p class="font-bold text-purple-900 mb-1">🎮 Letter game (${g.index + 1}/${g.rounds.length})</p>
                <p class="text-lg font-bold text-gray-800 mb-3">${ask} <button onclick="speak('${ask}')" class="text-sm text-blue-600 underline cursor-pointer">🔊</button></p>
                <div class="grid grid-cols-3 gap-3" id="phonics-options">
                    ${round.options.map(([w, e]) => `<button onclick="answerPhonics('${jsArg(w)}')" class="bg-white p-3 rounded-xl shadow hover:bg-purple-100 cursor-pointer flex flex-col items-center gap-1"><span class="text-4xl">${e}</span><span class="text-sm font-semibold">${w}</span></button>`).join('')}
                </div>
                <p id="phonics-ans" class="mt-3 font-bold min-h-[1.5rem]"></p>`;
            speak(ask);
        }
        function answerPhonics(word) {
            if (phonicsGame.locked) return;
            phonicsGame.locked = true;
            document.querySelectorAll('#phonics-options button').forEach(b => b.disabled = true);
            const round = phonicsGame.rounds[phonicsGame.index];
            const el = document.getElementById('phonics-ans');
            if (word === round.right[0]) {
                phonicsGame.score++;
                el.className = 'mt-3 font-bold min-h-[1.5rem] text-green-600';
                el.textContent = `🎉 Yes! ${round.right[0]} ${round.L === 'X' ? 'ends' : 'starts'} with ${round.L}.`;
            } else {
                el.className = 'mt-3 font-bold min-h-[1.5rem] text-red-500';
                el.textContent = `❌ It was ${round.right[0]} ${round.right[1]}`;
            }
            speak(round.right[0]);
            phonicsGame.index++;
            setTimeout(showPhonicsRound, 1300);
        }

        // ===== 0. VIDEO LESSON — one video for each unit =====
        //

        function youtubeIdOf(link) {
            const s = String(link || '').trim();
            if (/^[A-Za-z0-9_-]{11}$/.test(s)) return s;
            const m = s.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/))([A-Za-z0-9_-]{11})/);
            return m ? m[1] : '';
        }
        function videoFor(level, unit) {
            const v = VIDEO_LESSONS[level + '-' + unit];
            if (!v) return null;
            if (v.mp4 && /^https:\/\//.test(v.mp4)) return { mp4: v.mp4, id: v.mp4, added: v.added || '', questions: Array.isArray(v.questions) ? v.questions : [] };
            const id = youtubeIdOf(v.youtube);
            return id ? { id, added: v.added || '', questions: Array.isArray(v.questions) ? v.questions : [] } : null;
        }
        function isRecentlyAdded(dateStr) {
            if (!dateStr) return false;
            const added = new Date(dateStr);
            if (isNaN(added.getTime())) return false;
            const daysSince = (Date.now() - added.getTime()) / (1000 * 60 * 60 * 24);
            return daysSince >= 0 && daysSince <= 7;
        }
        // The Video tab shows 🆕 when THIS unit has a new video; the unit list shows 🎬 / 🆕 per unit
        function updateVideoTabBadge() {
            const btn = document.getElementById('video-tab-btn');
            if (!btn) return;
            const v = videoFor(state.level, state.unit);
            btn.textContent = (v && isRecentlyAdded(v.added) ? '🆕 ' : '') + '📹 0. Video Lesson' + (v ? '' : ' (soon)');
        }

        let ytPlayer = null;
        let ytPollInterval = null;
        let ytAnsweredCheckpoints = new Set();
        let ytApiLoadPromise = null;
        let ytFallbackTimer = null;
        let currentVideo = null;

        // Stops the player and its timers whenever the student leaves the Video tab or changes unit
        function stopVideo() {
            if (ytPollInterval) { clearInterval(ytPollInterval); ytPollInterval = null; }
            if (ytFallbackTimer) { clearTimeout(ytFallbackTimer); ytFallbackTimer = null; }
            if (ytPlayer && typeof ytPlayer.destroy === 'function') { try { ytPlayer.destroy(); } catch (e) {} }
            ytPlayer = null;
        }

        function loadYouTubeApi() {
            if (window.YT && window.YT.Player) return Promise.resolve();
            if (ytApiLoadPromise) return ytApiLoadPromise;
            ytApiLoadPromise = new Promise((resolve, reject) => {
                window.onYouTubeIframeAPIReady = resolve;
                const tag = document.createElement('script');
                tag.src = 'https://www.youtube.com/iframe_api';
                tag.onerror = () => { ytApiLoadPromise = null; reject(new Error('YouTube could not load')); };
                document.head.appendChild(tag);
            });
            return ytApiLoadPromise;
        }

        function renderVideoLesson(contentDiv) {
            stopVideo();
            ytAnsweredCheckpoints = new Set();
            const unitData = realCurriculum[state.level][state.unit];
            currentVideo = videoFor(state.level, state.unit);

            if (!currentVideo) {
                contentDiv.innerHTML = `
                    <h2 class="text-xl font-bold text-blue-800 mb-2">📹 Video Lesson — Unit ${state.unit}: ${unitData.title}</h2>
                    <div class="bg-blue-50 border-2 border-dashed border-blue-200 rounded-2xl p-10 text-center">
                        <div class="text-5xl mb-4">🎬</div>
                        <p class="text-xl font-bold text-blue-900 mb-2">Video Coming Soon!</p>
                        <p class="text-gray-600 mb-4">Your teacher is preparing the video for this unit. For now, try the other learning modules!</p>
                        <button onclick="switchTab('listening')" class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-5 py-2 rounded-full shadow cursor-pointer">🔊 Start with Listening</button>
                    </div>`;
                return;
            }

            if (currentVideo.mp4) { renderMp4Lesson(contentDiv, unitData); return; }
            const watchUrl = 'https://www.youtube.com/watch?v=' + currentVideo.id;
            contentDiv.innerHTML = `
                <h2 class="text-xl font-bold text-blue-800 mb-2">📹 Video Lesson — Unit ${state.unit}: ${unitData.title}</h2>
                <p class="text-gray-600 mb-4">${currentVideo.questions.length ? 'Watch the video. It will pause a few times so you can answer a quick question!' : 'Watch the video, then try the other learning modules!'}</p>
                <div class="relative bg-black rounded-2xl overflow-hidden" style="aspect-ratio:16/9;">
                    <div id="yt-player-el" class="w-full h-full"></div>
                    <div id="checkpoint-overlay" class="absolute inset-0 bg-blue-900/95 flex items-center justify-center p-6" style="display:none;"></div>
                </div>
                <p id="video-msg" class="text-sm text-gray-500 mt-3 text-center min-h-[1.25rem]">Loading video player…</p>
                <p class="text-center mt-1"><a href="${watchUrl}" target="_blank" rel="noopener" class="text-sm text-blue-600 underline">If the video does not play here, tap to open it in YouTube ↗</a></p>`;

            const showFallback = (why) => {
                const msg = document.getElementById('video-msg');
                if (msg) msg.innerHTML = `⚠️ ${why} <a href="${watchUrl}" target="_blank" rel="noopener" class="text-blue-600 underline font-semibold">Open the video in YouTube ↗</a>`;
            };
            // If the player hasn't started after 10 seconds, offer YouTube directly
            ytFallbackTimer = setTimeout(() => { if (!ytPlayer || typeof ytPlayer.getPlayerState !== 'function') showFallback('The video is taking long to load.'); }, 10000);

            const wanted = currentVideo.id;
            loadYouTubeApi().then(() => {
                if (!currentVideo || currentVideo.id !== wanted || !document.getElementById('yt-player-el')) return;   // student moved on
                ytPlayer = new YT.Player('yt-player-el', {
                    videoId: wanted,
                    playerVars: { rel: 0, modestbranding: 1, playsinline: 1 },
                    events: {
                        onReady: () => { if (ytFallbackTimer) clearTimeout(ytFallbackTimer); const m = document.getElementById('video-msg'); if (m) m.textContent = '▶️ Press play to start the lesson!'; },
                        onStateChange: onYtStateChange,
                        onError: () => showFallback('This video cannot play inside the lesson.')
                    }
                });
            }).catch(() => showFallback('The video player could not load.'));
        }

97.38,"Predator. Your turn!"],[100.28,101.32,"Predator!"],[101.62,102.61,"Excellent!"],[103.62,113.26,"Mammal, Mammal, Mammal! Reptile, Reptile, Reptile! Amphibian, Amphibian, Amphibian! Herbivore, Herbivore, Herbivore!"],[113.56,124.37,"Carnivore, Carnivore, Carnivore! Omnivore, Omnivore, Omnivore! Habitat, Habitat, Habitat! Predator, Predator, Predator!"],[124.67,126.94,"Clap, clap! Great chanting!"],[127.95,147.05,"Scientists put animals into groups. A dog is a mammal and a snake is a reptile. A frog is an amphibian: it lives in water and on land. A cow is a herbivore because it eats plants. A lion is a carnivore and a predator. Bears are omnivores."],[147.35,149.5,"I love this story, Ms. Lily!"],[150.52,153.27,"What is it? Can you say it?"],[156.17,158.4,"Herbivore! Well done!"],[159.38,161.76,"What is it? Can you say it?"],[164.66,166.83,"Omnivore! Well done!"],[167.85,170.13,"What is it? Can you say it?"],[173.03,175.16,"Mammal! Well done!"],[176.15,177.56,"Let's say it together!"],[177.86,181.25,"A cow is a herbivore because it eats plants."],[182.05,183.33,"Your turn!"],[186.83,190.21,"A cow is a herbivore because it eats plants."],[191.22,193.75,"Is a cow a herbivore or a carnivore?"],[197.05,200.14,"A cow is a herbivore because it eats plants."],[200.44,201.53,"Great answer!"],[202.55,206.78,"Today's value is curiosity. Ask questions and find out."],[207.08,209.02,"I will try, Ms. Lily!"],[210.02,214.72,"Great job today, everyone! See you in Unit seven. Bye-bye!"],[215.01,216.42,"Bye-bye!"]],"OC-K3-Unit07-Life-Cycles":[[0.35,5.22,"Hello, everyone! I'm Ms. Lily. Welcome to Online Class!"],[5.52,8.16,"Hi! I'm Malis!"],[8.46,11.02,"Unit seven. Life Cycles"],[12.02,16.74,"Let's learn eight new words. Listen, then it's your turn to say it!"],[17.75,19.01,"Frogspawn!"],[19.91,22.16,"Frogspawn. Your turn!"],[25.06,26.36,"Frogspawn!"],[26.66,27.54,"Great!"],[28.55,29.55,"Cocoon!"],[30.45,32.88,"Cocoon. Your turn!"],[35.78,36.87,"Cocoon!"],[37.16,38.04,"Super!"],[3 rton! Shopping list, Shopping list!"],[114.17,116.63,"Clap, clap! Great chanting!"],[117.62,132.15,"Malis writes a shopping list with her mum. They need one kilogram of rice, a litre of milk and a carton of juice. They buy a dozen eggs, a bunch of bananas and a packet of noodles. At home, Malis eats a slice of bread."],[132.45,134.54,"I love this story, Ms. Lily!"],[135.55,137.9,"What is it? Can you say it?"],[140.8,142.88,"Bunch! Well done!"],[143.88,146.25,"What is it? Can you say it?"],[149.15,151.82,"Shopping list! Well done!"],[152.82,155.27,"What is it? Can you say it?"],[158.17,160.23,"Litre! Well done!"],[161.22,162.9,"Let's say it together!"],[163.2,167.0,"We need a kilogram of rice. We need a bunch of bananas."],[167.8,169.01,"Your turn!"],[172.51,176.66,"We need a kilogram of rice. We need a bunch of bananas."],[177.65,179.93,"What is on your family's shopping list?"],[183.23,185.4,"We need a kilogram of rice."],[185.7,186.8,"Great answer!"],[187.78,192.19,"Today's value is responsibility. Help at home and do your jobs."],[192.49,194.44,"I will try, Ms. Lily!"],[195.45,201.16,"Great job today, everyone! See you in Unit ten. Bye-bye!"],[201.46,202.98,"Bye-bye!"]],"OC-K3-Unit10-Measuring":[[0.35,5.2,"Hello, everyone! I'm Ms. Lily. Welcome to Online Class!"],[5.5,7.55,"Hi! I'm Malis!"],[7.85,10.02,"Unit ten. Measuring"],[11.02,15.43,"Let's learn eight new words. Listen, then it's your turn to say it!"],[16.45,17.88,"Centimetre!"],[18.78,21.18,"Centimetre. Your turn!"],[24.08,25.33,"Centimetre!"],[25.63,26.55,"Great!"],[27.55,28.36,"Metre!"],[29.27,31.23,"Metre. Your turn!"],[34.13,35.27,"Metre!"],[35.57,36.55,"Super!"],[37.55,38.55,"Tape measure!"],[39.45,41.6,"Tape measure. Your turn!"],[44.5,45.67,"Tape measure!"],[45.97,47.03,"Well done!"],[48.02,48.82,"Length!"],[49.72,51.55,"Length. Your turn!"],[54.45,55.52,"Length!"],[55.82,56.6,"Yes!"],[57.58,58.26,"Width!"],[59.16,60.92,"Width. Your turn!"],[63.82,64.61,"Width!"],[64.91,66.07,"Good job!"],[67.08,67.         // English subtitles: added to the player with code, so no subtitle files are needed online.
        let subsOn = true;
        function addSubtitles(el) {
            const cues = SUBTITLES[(el.getAttribute('src') || '').split('/').pop().replace('.mp4', '')]; const btn = document.getElementById('subs-btn');
            if (!cues || !el.addTextTrack || typeof VTTCue === 'undefined') { if (btn) btn.style.display = 'none'; return; }
            const tr = el.addTextTrack('subtitles', 'English', 'en');
            cues.forEach(c => { try { const q = new VTTCue(c[0], c[1], c[2]); q.line = -2; tr.addCue(q); } catch (e) {} });
            const apply = () => { tr.mode = subsOn ? 'showing' : 'hidden'; if (btn) btn.textContent = subsOn ? '💬 Subtitles: ON' : '💬 Subtitles: OFF'; };
            if (btn) btn.onclick = () => { subsOn = !subsOn; apply(); };
            apply();
        }
        function renderMp4Lesson(contentDiv, unitData) {
            contentDiv.innerHTML = `
                <h2 class="text-xl font-bold text-blue-800 mb-2">📹 Video Lesson — Unit ${state.unit}: ${unitData.title}</h2>

                    <div id="checkpoint-overlay" class="absolute inset-0 bg-blue-900/95 flex items-center justify-center p-6" style="display:none;"></div>
                </div>
                <p id="video-msg" class="text-sm text-gray-500 mt-3 text-center min-h-[1.25rem]">▶️ Press play to start the lesson!</p>
                <div class="text-center mt-2 flex justify-center gap-3 flex-wrap"><button id="subs-btn" class="bg-white border border-indigo-300 text-indigo-700 font-bold px-4 py-2 rounded-full shadow cursor-pointer">💬 Subtitles: ON</button><button onclick="nextLesson()" class="bg-emerald-700 hover:bg-emerald-800 text-white font-bold px-4 py-2 rounded-full shadow cursor-pointer">Next Lesson ▶️</button></div>`;
            const el = document.getElementById('mp4-player');
            addSubtitles(el);
            { const a = document.getElementById('footer-next-module'), b = document.getElementById('footer-next-lesson'); if (a) a.style.display = ''; if (b) b.style.display = 'none'; }
            ytPlayer = {
                getCurrentTime: () => el.currentTime,
                pauseVideo: () => el.pause(),
                playVideo: () => { const p = el.play(); if (p && p.catch) p.catch(() => {}); },
                destroy: () => { try { el.pause(); el.removeAttribute('src'); el.load(); } catch (e) {} }
            };
            el.addEventListener('play', () => { const m = document.getElementById('video-msg'); if (m) m.textContent = ''; });
            el.addEventListener('timeupdate', () => { if (currentVideo && currentVideo.questions.length) checkVideoCheckpoints(); });
            el.addEventListener('ended', () => {
                const got = award(unitKey('video-' + currentVideo.id), 5);
                const m = document.getElementById('video-msg');
                if (m) m.textContent = '🎉 Great job watching the whole video!' + (got ? ' (+5 ⭐)' : '');
            });
            el.addEventListener('error', () => {
                const m = document.getElementById('video-msg');
                if (m) m.innerHTML = '⚠️ The video could not load. Check the internet, or <a href="' + currentVideo.mp4 + '" target="_blank" rel="noopener" class="text-blue-600 underline font-semibold">open it here ↗</a>';
            });
        }

        function onYtStateChange(event) {
            const msg = document.getElementById('video-msg');
            if (event.data === YT.PlayerState.PLAYING) {
                if (ytPollInterval) clearInterval(ytPollInterval);
                if (currentVideo && currentVideo.questions.length) ytPollInterval = setInterval(checkVideoCheckpoints, 400);
                if (msg) msg.textContent = '';
            } else if (event.data === YT.PlayerState.PAUSED || event.data === YT.PlayerState.ENDED) {
                if (ytPollInterval) { clearInterval(ytPollInterval); ytPollInterval = null; }
                if (event.data === YT.PlayerState.ENDED) {
                    const got = award(unitKey('video-' + currentVideo.id), 5);
                    if (msg) msg.textContent = '🎉 Great job watching the whole video!' + (got ? ' (+5 ⭐)' : '');
                }
            }
        }

        function checkVideoCheckpoints() {
            if (!ytPlayer || typeof ytPlayer.getCurrentTime !== 'function' || !currentVideo) return;
            let t = 0;
            try { t = ytPlayer.getCurrentTime(); } catch (e) { return; }
            currentVideo.questions.forEach((cp, idx) => {
                if (!ytAnsweredCheckpoints.has(idx) && t >= cp.time) {
                    ytAnsweredCheckpoints.add(idx);
                    showVideoCheckpoint(idx);
                }
            });
        }

        function showVideoCheckpoint(idx) {
            const cp = currentVideo.questions[idx];
            ytPlayer.pauseVideo();
            if (ytPollInterval) { clearInterval(ytPollInterval); ytPollInterval = null; }
            const overlay = document.getElementById('checkpoint-overlay');
            overlay.style.display = 'flex';
            overlay.innerHTML = `
                <div class="bg-white rounded-2xl p-6 max-w-md w-full text-center">

                    <p class="font-bold text-lg text-gray-800 mb-4">${cp.question}</p>
                    <div class="flex flex-col gap-2" id="checkpoint-options">
                        ${cp.options.map((opt, i) => `<button onclick="answerVideoCheckpoint(${idx}, ${i})" class="bg-blue-50 hover:bg-blue-100 text-blue-900 font-semibold p-3 rounded-xl cursor-pointer">${opt}</button>`).join('')}
                    </div>
                    <p id="checkpoint-feedback" class="mt-3 font-bold min-h-[1.5rem]"></p>
                </div>`;
        }

        function answerVideoCheckpoint(idx, chosenIndex) {
            const cp = currentVideo.questions[idx];
            const feedback = document.getElementById('checkpoint-feedback');
            const optionsDiv = document.getElementById('checkpoint-options');
            optionsDiv.querySelectorAll('button').forEach(b => b.disabled = true);
            if (chosenIndex === cp.correct) {
                feedback.className = 'mt-3 font-bold min-h-[1.5rem] text-green-600';
                feedback.textContent = award(unitKey('video-' + currentVideo.id + '-q' + idx), 2) ? '🎉 Correct! (+2 ⭐)' : '🎉 Correct!';
            } else {
                feedback.className = 'mt-3 font-bold min-h-[1.5rem] text-red-500';
                feedback.textContent = `❌ Not quite — the answer was "${cp.options[cp.correct]}"`;
            }
            const nextBtn = document.createElement('button');
            nextBtn.textContent = 'Next ▶️';
            nextBtn.className = 'mt-4 bg-blue-600 hover:bg-blue-700 text-white font-bold px-6 py-2 rounded-full shadow cursor-pointer';
            nextBtn.onclick = resumeVideoAfterCheckpoint;
            feedback.insertAdjacentElement('afterend', nextBtn);
        }

        function resumeVideoAfterCheckpoint() {
            document.getElementById('checkpoint-overlay').style.display = 'none';
            if (ytPlayer) ytPlayer.playVideo();
        }

        // ===== 7. QUIZ (graded quiz per unit, pictures on every answer) =====
        // Stars are given only for improving on your best score for this unit,
        // and answer buttons lock after the first tap so quick double taps can't skip questions.
        let quizState = { qIndex: 0, score: 0, order: [], currentOptions: [], currentAnswer: '', locked: false };
        function renderQuiz(contentDiv, unitData) {
            quizState = { qIndex: 0, score: 0, order: shuffle(unitData.vocab.map((_, i) => i)), currentOptions: [], currentAnswer: '', locked: false };
            showQuizQuestion();
        }
        function showQuizQuestion() {
            const contentDiv = document.getElementById('module-content');
            const unitData = realCurriculum[state.level][state.unit];
            quizState.locked = false;
            if (quizState.qIndex >= quizState.order.length) {
                const total = quizState.order.length;
                const pct = Math.round((quizState.score / total) * 100);
                const bestKey = state.level + '|' + unitKey('quiz');
                const best = progress.bestQuiz[bestKey] || 0;
                const earned = Math.max(0, quizState.score - best) * 2;
                if (quizState.score > best) progress.bestQuiz[bestKey] = quizState.score;
                if (earned > 0) addStars(earned); else saveProgress();
                if (pct === 100) triggerConfetti();
                if (quizState.score >= 6) ocMarkUnitDone();
                contentDiv.innerHTML = `
                    <h2 class="text-xl font-bold text-blue-800 mb-2">🧩 Quiz Complete!</h2>
                    <div class="bg-purple-50 p-8 rounded-2xl border border-purple-200 text-center">
                        <div class="text-5xl mb-3">${pct === 100 ? '🏆' : pct >= 50 ? '🎉' : '💪'}</div>
                        <p class="font-bold text-purple-900 text-2xl mb-2">${quizState.score} / ${total} Correct</p>
                        <p class="text-gray-600 mb-4">${earned > 0 ? `You earned ${earned} ⭐` : (best >= total ? 'Perfect score already! 🌟' : `Your best is ${Math.max(best, quizState.score)} / ${total} — beat it to earn more ⭐`)}</p>
                        <button onclick="renderQuiz(document.getElementById('module-content'), realCurriculum[state.level][state.unit])" class="bg-purple-600 hover:bg-purple-700 text-white font-bold px-5 py-2 rounded-xl shadow cursor-pointer">🔁 Try Again</button>
                    </div>`;
                return;
            }
            const wordIdx = quizState.order[quizState.qIndex];
            const word = unitData.vocab[wordIdx];
            const distractors = pickDistractors(word, unitData);
            const options = shuffle([word, ...distractors]);
            quizState.currentOptions = options;
            quizState.currentAnswer = word;
            contentDiv.innerHTML = `
                <h2 class="text-xl font-bold text-blue-800 mb-2">🧩 Quiz & Sticker Rewards</h2>
                <p class="text-sm text-gray-500 mb-3">Question ${quizState.qIndex + 1} of ${quizState.order.length}</p>
                <div class="bg-purple-50 p-6 rounded-2xl border border-purple-200">
                    <p class="font-bold text-purple-900 mb-2">🔊 Listen and choose the picture you heard:</p>
                    <button onclick="speak(quizState.currentAnswer)" class="bg-purple-500 hover:bg-purple-600 text-white font-bold px-5 py-2 rounded-full shadow mb-4 cursor-pointer">🔊 Play Word</button>
                    <div class="grid grid-cols-2 gap-3" id="quiz-options">
                        ${options.map(o => `<button onclick="answerQuiz('${jsArg(o)}')" class="bg-white p-3 rounded-xl shadow hover:bg-purple-100 font-medium cursor-pointer flex flex-col items-center gap-1"><span class="text-4xl">${emojiFor(o, unitData)}</span><span>${o}</span></button>`).join('')}
                    </div>
                    <p id="quiz-ans" class="mt-4 font-bold text-lg min-h-[1.5rem]"></p>
                </div>`;
            speak(word);
        }
        function answerQuiz(chosen) {
            if (quizState.locked) return;
            quizState.locked = true;
            document.querySelectorAll('#quiz-options button').forEach(b => b.disabled = true);
            let el = document.getElementById('quiz-ans');

                el.innerHTML = "🎉 Correct! Amazing job!";
                el.className = "mt-4 font-bold text-lg text-green-600";
                quizState.score++;
            } else {
                el.innerHTML = `❌ Not quite — it was "${quizState.currentAnswer}" ${emojiFor(quizState.currentAnswer)}`;
                el.className = "mt-4 font-bold text-lg text-red-500";
            }
            quizState.qIndex++;
            (function (t) { setTimeout(function () { if (state.tab === t) showQuizQuestion(); }, 1100); })(state.tab);  // only if the student is still on this module
        }


        // ===================== ONLINE CLASS · 9 extra modules =====================
        const ocBox = (inner, color) => `<div class="bg-${color}-50 border-2 border-dashed border-${color}-300 rounded-2xl p-6 text-center">${inner}</div>`;
        const ocHead = (t, sub) => `<h2 class="text-xl font-bold text-blue-800 mb-1">${t}</h2><p class="text-gray-600 mb-4">${sub}</p>`;
        const ocDone = (t, msg) => `${ocHead(t, '')}<div class="bg-green-50 border-2 border-green-300 rounded-2xl p-8 text-center"><div class="text-5xl mb-3">🎉</div><p class="text-xl font-bold text-green-700">${msg}</p></div>`;
        const ocSay = (w) => `<button onclick="speak('${jsArg(w)}')" class="text-blue-600 underline text-sm cursor-pointer">🔊 Hear it</button>`;
        const ocUnit = () => realCurriculum[state.level][state.unit];

        // 10 · Spelling Tiles: tap the letters in the right order
        let ocSp = { i: 0, words: [], built: '' };
        function oc_spelling(c, u) { ocSp = { i: 0, words: shuffle(u.vocab.filter(w => /^[A-Za-z]{2,9}$/.test(w))).slice(0, 5), built: '' }; ocSpShow(); }
        function ocSpShow() {
            const c = document.getElementById('module-content'), u = ocUnit();
            if (!ocSp.words.length || ocSp.i >= ocSp.words.length) { c.innerHTML = ocDone('🔤 Spelling Tiles', 'You spelled every word!'); triggerConfetti(); return; }
            const w = ocSp.words[ocSp.i]; ocSp.built = '';
            const tiles = shuffle(w.toUpperCase().split(''));
            c.innerHTML = ocHead('🔤 Spelling Tiles', `Look and listen, then tap the letters in order. (${ocSp.i + 1}/${ocSp.words.length})`) + ocBox(
                `<div class="text-7xl mb-2">${emojiFor(w, u)}</div>${ocSay(w)}
                 <div id="sp-built" class="text-4xl font-bold tracking-widest text-blue-800 my-4">${'_ '.repeat(w.length).trim()}</div>
                 <div class="flex flex-wrap justify-center gap-2">${tiles.map((L, i) => `<button onclick="ocSpTap('${L}', this)" class="w-14 h-14 bg-white rounded-xl shadow text-2xl font-bold text-blue-800 hover:bg-yellow-100 cursor-pointer">${L}</button>`).join('')}</div>
                 <button onclick="ocSpShow()" class="mt-4 text-sm text-gray-500 underline cursor-pointer">↺ Start this word again</button>
                 <p id="sp-msg" class="mt-3 font-bold min-h-[1.5rem]"></p>`, 'yellow');
            speak(w);
        }
        function ocSpTap(L, btn) {
            const w = ocSp.words[ocSp.i].toUpperCase(), msg = document.getElementById('sp-msg');
            if (L !== w[ocSp.built.length]) { msg.className = 'mt-3 font-bold text-red-500'; msg.textContent = '❌ Try another letter!'; return; }
            ocSp.built += L; btn.disabled = true; btn.classList.add('opacity-30');
            document.getElementById('sp-built').textContent = (ocSp.built + '_'.repeat(w.length - ocSp.built.length)).split('').join(' ');
            msg.textContent = '';
            if (ocSp.built === w) {
                msg.className = 'mt-3 font-bold text-green-600';
                msg.textContent = award(unitKey('spell-' + w), 2) ? '🎉 Great spelling! (+2 ⭐)' : '🎉 Great spelling!';
                speak(ocSp.words[ocSp.i]); ocSp.i++; setTimeout(ocSpShow, 1300);
            }
        }

        // 11 · Sentence Building: put the words of the pattern sentence in order
        let ocSe = { i: 0, list: [], built: [] };
        function oc_sentence(c, u) {
            const list = (u.grammar.example.match(/[^.!?]+[.!?]/g) || [u.grammar.example]).map(x => x.trim()).filter(x => x.split(' ').length >= 2);
            ocSe = { i: 0, list, built: [] }; ocSeShow();
        }
        function ocSeShow() {
            const c = document.getElementById('module-content');
            if (ocSe.i >= ocSe.list.length) { c.innerHTML = ocDone('💬 Sentence Building', 'You built every sentence!'); triggerConfetti(); return; }
            const sen = ocSe.list[ocSe.i]; ocSe.built = [];
            const words = sen.split(' '); let mix = shuffle(words); for (let t = 0; t < 5 && mix.join(' ') === sen; t++) mix = shuffle(words);
            c.innerHTML = ocHead('💬 Sentence Building', `Listen, then tap the words in order. (${ocSe.i + 1}/${ocSe.list.length})`) + ocBox(
                `<p class="text-sm text-sky-700 font-semibold mb-2">Pattern: ${ocUnit().grammar.point}</p>${ocSay(sen)}
                 <div id="se-built" class="min-h-[3.5rem] bg-white rounded-xl shadow-inner my-4 p-3 text-2xl font-bold text-blue-800"></div>
                 <div class="flex flex-wrap justify-center gap-2">${mix.map(w => `<button onclick="ocSeTap('${jsArg(w)}', this)" class="px-4 py-2 bg-white rounded-xl shadow text-xl font-semibold text-blue-800 hover:bg-sky-100 cursor-pointer">${w}</button>`).join('')}</div>
                 <button onclick="ocSeShow()" class="mt-4 text-sm text-gray-500 underline cursor-pointer">↺ Start again</button>
                 <p id="se-msg" class="mt-3 font-bold min-h-[1.5rem]"></p>`, 'sky');
            speak(sen);
        }
        function ocSeTap(w, btn) {
            const want = ocSe.list[ocSe.i].split(' '), msg = document.getElementById('se-msg');
            if (w !== want[ocSe.built.length]) { msg.className = 'mt-3 font-bold text-red-500'; msg.textContent = '❌ Listen again and try another word.'; return; }
            ocSe.built.push(w); btn.disabled = true; btn.classList.add('opacity-30');
            document.getElementById('se-built').textContent = ocSe.built.join(' '); msg.textContent = '';
            if (ocSe.built.length === want.length) {
                msg.className = 'mt-3 font-bold text-green-600';
                msg.textContent = award(unitKey('sentence-' + ocSe.i), 3) ? '🌟 Perfect sentence! (+3 ⭐)' : '🌟 Perfect sentence!';
                speak(ocSe.list[ocSe.i]); ocSe.i++; setTimeout(ocSeShow, 1600);
            }
        }

        // 12 · Song & Chant: chant every word three times, the picture lights up
        function oc_chant(c, u) {
            c.innerHTML = ocHead('🎵 Song & Chant', 'Press play and chant along! Clap your hands to the beat.') + ocBox(
                `<div class="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-5">${u.vocab.map((w, i) => `<div id="ch-${i}" class="bg-white p-3 rounded-xl shadow flex flex-col items-center transition"><span class="text-4xl">${emojiFor(w, u)}</span><span class="text-sm font-bold text-blue-800">${w}</span></div>`).join('')}</div>
                 <button id="ch-play" onclick="ocChantPlay()" class="bg-pink-500 hover:bg-pink-600 text-white font-bold px-6 py-3 rounded-full shadow-lg cursor-pointer">▶ Chant along</button>
                 <p id="ch-msg" class="mt-3 font-bold min-h-[1.5rem] text-pink-700"></p>`, 'pink');

        function ocChantPlay() {
            const u = ocUnit(); let i = 0; document.getElementById('ch-play').disabled = true;
            const step = () => {
                document.querySelectorAll('[id^="ch-"]').forEach(el => { if (el.id !== 'ch-play' && el.id !== 'ch-msg') el.classList.remove('ring-4', 'ring-pink-400', 'scale-110'); });

                }

                const line = w.includes(' ') ? `${w}, ${w}!` : `${w}, ${w}, ${w}!`;
                i++; if (!speak(line, () => setTimeout(step, 250))) setTimeout(step, 1500);
            };
            step();
        }

        // 13 · Memory Match: find the picture and its word
        let ocMm = { open: [], done: 0, lock: false, n: 0 };
        function oc_memory(c, u) {
            const words = shuffle(u.vocab).slice(0, 4); ocMm = { open: [], done: 0, lock: false, n: words.length };
            const cards = shuffle(words.flatMap(w => [{ w, face: emojiFor(w, u), big: true }, { w, face: w, big: false }]));
            c.innerHTML = ocHead('🃏 Memory Match', 'Turn two cards. Find each picture and its word!') +
                `<div class="grid grid-cols-4 gap-3 max-w-xl mx-auto">${cards.map((k, i) => `<button onclick="ocMmFlip(this)" data-w="${k.w}" data-face="${k.face.replace(/"/g, '&quot;')}" data-big="${k.big}" class="mm-card h-24 bg-indigo-500 text-white rounded-xl shadow text-3xl font-bold cursor-pointer flex items-center justify-center">❓</button>`).join('')}</div>
                 <p id="mm-msg" class="mt-4 text-center font-bold min-h-[1.5rem]"></p>`;

        function ocMmFlip(b) {

            }
        }

        // 14 · Odd One Out: which picture is not from this lesson?
        let ocOd = { r: 0, score: 0, rounds: [], lock: false };
        function oc_oddone(c, u) {
            const others = Object.keys(realCurriculum[state.level]).filter(n => Number(n) !== state.unit);

                `<div class="grid grid-cols-2 gap-3 max-w-md mx-auto">${rd.opts.map(o => `<button onclick="ocOdPick('${jsArg(o.w)}')" class="bg-white p-4 rounded-xl shadow hover:bg-orange-100 cursor-pointer flex flex-col items-center"><span class="text-5xl">${o.p}</span><span class="font-bold text-blue-800">${o.w}</span></button>`).join('')}</div>
                 <p id="od-msg" class="mt-4 font-bold text-lg min-h-[1.5rem]"></p>`, 'orange');
        }
        function ocOdPick(w) {

        // 15 · Find & Count: how many pictures?
        let ocCt = { r: 0, score: 0, rounds: [], lock: false };
        function oc_count(c, u) {

                 <p id="ct-msg" class="mt-4 font-bold text-lg min-h-[1.5rem]"></p>`, 'teal');

        // 16 · Role-Play: talk with Ms. Lily and Malis
        function oc_roleplay(c, u) {
            const ex = (u.grammar.example.match(/[^.!?]+[.!?]/g) || [u.grammar.example]).map(x => x.trim());
            const lines = [['Ms. Lily', '👩‍🏫', u.question], ['You', '🙂', ex[0]], ['Malis', '👧', ex[1] || u.story.split(/(?<=[.!?])\s/)[0]], ['You', '🙂', 'Thank you, Ms. Lily!']];
            c.innerHTML = ocHead('🎭 Role-Play', 'Read and listen. When it says "You", say the line out loud!') +
                `<div class="flex flex-col gap-3 max-w-xl mx-auto">${lines.map((l, i) => {
                    const you = l[0] === 'You';
                    return `<div class="flex ${you ? 'justify-end' : 'justify-start'}"><div class="${you ? 'bg-amber-100 border-amber-300' : 'bg-indigo-50 border-indigo-200'} border-2 rounded-2xl p-3 max-w-[85%]">
                        <p class="text-xs font-bold ${you ? 'text-amber-800' : 'text-indigo-700'}">${l[1]} ${l[0]}</p><p class="text-lg text-gray-800">${l[2]}</p>
                        <div class="flex gap-2 mt-1"><button onclick="speak('${jsArg(l[2])}')" class="text-sm text-blue-600 underline cursor-pointer">🔊 Listen</button>
                        ${you ? `<button onclick="ocRpSaid(${i}, this)" class="text-sm bg-green-500 text-white rounded-full px-3 cursor-pointer">✅ I said it!</button>` : ''}</div></div></div>`;
                }).join('')}</div><p id="rp-msg" class="mt-4 text-center font-bold text-green-600 min-h-[1.5rem]"></p>`;
        }
        function ocRpSaid(i, b) {
            b.disabled = true; b.textContent = '⭐ Great!';
            const left = document.querySelectorAll('#module-content button.bg-green-500:not(:disabled)').length;
            if (!left) { document.getElementById('rp-msg').textContent = award(unitKey('roleplay'), 3) ? '🎭 Super role-play! (+3 ⭐)' : '🎭 Super role-play!'; triggerConfetti(); }
        }

        // 17 · Values Corner
        function oc_values(c, u) {
            const tasks = ['I can do this at home.', 'I can do this at school.', 'I can help a friend do it.'];
            c.innerHTML = ocHead('💛 Values Corner', 'Learn today’s value and make a promise.') + ocBox(
                `<p class="text-4xl mb-2">💛</p><p class="text-2xl font-bold text-amber-800 mb-2">${u.value}</p>
                 <p class="text-lg text-gray-800 mb-1">${VALUE_BLURBS[u.value] || ''}</p>${ocSay(u.value + '. ' + (VALUE_BLURBS[u.value] || ''))}
                 <div class="flex flex-col gap-2 max-w-sm mx-auto mt-5 text-left">${tasks.map((t, i) => `<label class="flex items-center gap-3 bg-white rounded-xl shadow p-3 cursor-pointer"><input type="checkbox" onchange="ocValCheck()" class="val-box w-6 h-6"> <span class="font-semibold text-gray-800">${t}</span></label>`).join('')}</div>
                 <p id="val-msg" class="mt-4 font-bold text-green-600 min-h-[1.5rem]"></p>`, 'amber');
        }
        function ocValCheck() {
            if ([...document.querySelectorAll('.val-box')].every(x => x.checked)) {
                document.getElementById('val-msg').textContent = award(unitKey('values'), 2) ? '🌟 Great promise! (+2 ⭐)' : '🌟 Great promise!'; triggerConfetti();
            }
        }

        // 18 · Review: words from this unit and the units before it
        let ocRv = { i: 0, score: 0, qs: [], lock: false };
        function oc_review(c, u) {
            const pool = [];
            Object.keys(realCurriculum[state.level]).map(Number).filter(n => n <= state.unit).forEach(n => realCurriculum[state.level][n].vocab.forEach(w => pool.push({ w, n })));
            ocRv = { i: 0, score: 0, lock: false, qs: shuffle(pool).slice(0, 8) }; ocRvShow();
        }
        function ocRvShow() {
            const c = document.getElementById('module-content'), g = ocRv;
            if (g.i >= g.qs.length) {
                const perfect = g.score === g.qs.length;
                c.innerHTML = ocDone('🔄 Review', `${g.score} / ${g.qs.length} correct` + (g.score >= 6 && award(unitKey('review'), 4) ? ' (+4 ⭐)' : '')); if (perfect) triggerConfetti(); return;
            }
            const q = g.qs[g.i], qu = realCurriculum[state.level][q.n]; g.lock = false;
            const wrong = shuffle(g.qs.concat(qu.vocab.map(w => ({ w, n: q.n }))).filter(x => x.w !== q.w && emojiFor(x.w, realCurriculum[state.level][x.n]) !== emojiFor(q.w, qu))).filter((x, i, a) => a.findIndex(y => y.w === x.w) === i).slice(0, 3);
            const opts = shuffle([q, ...wrong]);
            c.innerHTML = ocHead('🔄 Review', `Listen and tap the picture. Words from Units 1–${state.unit}. (${g.i + 1}/${g.qs.length})`) + ocBox(
                `<button onclick="speak('${jsArg(q.w)}')" class="bg-purple-500 hover:bg-purple-600 text-white font-bold px-5 py-2 rounded-full shadow mb-4 cursor-pointer">🔊 Play Word</button>
                 <div class="grid grid-cols-2 gap-3 max-w-md mx-auto">${opts.map(o => `<button onclick="ocRvPick('${jsArg(o.w)}')" class="bg-white p-3 rounded-xl shadow hover:bg-purple-100 cursor-pointer flex flex-col items-center"><span class="text-5xl">${emojiFor(o.w, realCurriculum[state.level][o.n])}</span><span class="font-semibold text-blue-800">${o.w}</span></button>`).join('')}</div>
                 <p id="rv-msg" class="mt-4 font-bold text-lg min-h-[1.5rem]"></p>`, 'purple');
            speak(q.w);
        }
        function ocRvPick(w) {
            if (ocRv.lock) return; ocRv.lock = true;
            const q = ocRv.qs[ocRv.i], msg = document.getElementById('rv-msg');
            if (w === q.w) { ocRv.score++; msg.className = 'mt-4 font-bold text-lg text-green-600'; msg.textContent = '🎉 Correct!'; }
            else { msg.className = 'mt-4 font-bold text-lg text-red-500'; msg.textContent = `❌ It was ${q.w}.`; }
            ocRv.i++; setTimeout(ocRvShow, 1200);
        }

        // ===== HUB EMBED VARIANT: hard-locked to K0 =====
        // One copy of this file exists per level (K0/K1/K2/K3); only the lockLevel('K0') line differs.
        function lockLevel(requested) {
            state.level = requested;
            document.getElementById('current-level-display').textContent = requested;
            document.getElementById('level-picker-wrap').classList.add('hidden');
            const banner = document.getElementById('locked-level-banner');
            banner.classList.remove('hidden');
            document.getElementById('locked-level-text').textContent = requested;

            const phonicsBtn = document.getElementById('phonics-tab-btn');
            phonicsBtn.style.display = PHONICS_LEVELS.includes(requested) ? '' : 'none';
        }

        const OC_Q = new URLSearchParams(location.search);
        if (Number(OC_Q.get('unit')) >= 1 && Number(OC_Q.get('unit')) <= 29) state.unit = Number(OC_Q.get('unit'));
        const OC_SID = (OC_Q.get('sid') || '').replace(/[^A-Za-z0-9-]/g, '');
        function ocMarkUnitDone() { if (!OC_SID) return; try { const k = 'c2_online_done_' + OC_SID; const d = JSON.parse(localStorage.getItem(k) || '[]'); if (!d.includes(state.unit)) { d.push(state.unit); localStorage.setItem(k, JSON.stringify(d)); } } catch (e) {} }
        const OC_TRIAL = OC_Q.get('trial') === '1';
        if (OC_TRIAL && state.unit > 3) state.unit = 1;
        lockLevel('K3');
        loadProgress();
        populateUnitSelect();
        updateVideoTabBadge();
        // Open on the video only when there is one; otherwise start with Listening
        state.tab = videoFor(state.level, state.unit) ? 'video' : 'listening';
        highlightActiveTab();
        renderContent();
        // Show the "📚 Modules" button on phones once the module list has scrolled out of view
        if ('IntersectionObserver' in window) {
            new IntersectionObserver(entries => {
                const jump = document.getElementById('modules-jump');
                if (jump) jump.style.display = entries[0].isIntersecting ? 'none' : '';
            }).observe(document.querySelector('.tab-btn[data-tab="grammar"]'));
        }
    </script>
</body>
</html>
