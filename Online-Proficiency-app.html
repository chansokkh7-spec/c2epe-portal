n. Goodbye!"],[456.63,459.93,"Thank you, Ms. Sarah! Bye, everyone!"]],"OC-Proficiency-Unit47-Wealth-Work-and-Leisure":[[0.35,5.47,"Hello, everyone! I'm Ms. Sarah. Welcome to Online Proficiency."],[5.77,8.98,"Hi! I'm Rithy. Let's learn together!"],[9.28,17.13,"Unit forty-seven: Wealth, Work and Leisure. In this unit, you will speculate about the future of work and leisure."],[18.12,19.65,"leisure society."],[20.35,27.08,"leisure society means a predicted society where machines do most work and people have more free time."],[27.38,33.74,"Economists in the 1930s predicted a leisure society by 2030."],[34.44,38.09,"Your turn. Say: leisure society."],[40.79,42.23,"leisure society."],[43.25,44.37,"work ethic."],[45.07,49.23,"work ethic means a belief in the moral value of hard work."],[49.53,52.52,"Her strong work ethic impressed every employer."],[53.22,56.09,"Your turn. Say: work ethic."],[58.79,59.9,"work ethic."],[60.92,62.05,"idleness."],[62.74,65.87,"idleness means doing nothing; not working."],[66.17,70.47,"Some philosophers defended idleness as the root of creativity."],[71.17,74.14,"Your turn. Say: idleness."],[76.84,77.85,"idleness."],[78.85,80.23,"overwork culture."],[80.93,85.19,"overwork culture means a workplace culture that expects very long hours."],[85.49,88.3,"Overwork culture leads to burnout and poor health."],[89.0,92.17,"Your turn. Say: overwork culture."],[94.87,96.22,"overwork culture."],[97.22,98.6,"time affluence."],[99.3,103.13,"time affluence means the feeling of having enough free time."],[103.44,107.85,"Research links time affluence to greater happiness than extra money."],[108.55,111.57,"Your turn. Say: time affluence."],[114.27,115.65,"time affluence."],[116.65,118.15,"conspicuous leisure."],[118.85,124.59,"conspicuous leisure means showing off free time as a sign of wealth or status."],[124.89,128.62,"Long holidays posted online can be conspicuous leisure."],[129.32,132.66,"Your turn. Say: conspicuous leisure."],[135.35,136.8,"conspicuous leisure."],[137.78,139.25,"meaningful leisure."],[139.95,145.09,"meaningful leisure means free time used for activities that bring purpose and growth."],[145.4,148.78,"Volunteering and learning music are meaningful leisure."],[149.48,152.86,"Your turn. Say: meaningful leisure."],[155.56,156.94,"meaningful leisure."],[157.95,159.39,"right to disconnect."],[160.09,165.42,"right to disconnect means a legal right not to answer work messages outside working hours."],[165.72,170.28,"France introduced a right to disconnect in 2017."],[170.98,174.14,"Your turn. Say: right to disconnect."],[176.84,178.24,"right to disconnect."],[179.25,181.64,"Now let's listen to a conversation."],[181.94,186.24,"Rithy, Keynes predicted we would work fifteen hours a week by now."],[187.55,190.72,"Had he seen today's overwork culture, he'd have been shocked."],[192.02,196.1,"Indeed. Why do you think the leisure society never arrived?"],[197.38,201.39,"Were productivity gains shared fairly, we might already have it."],[202.68,205.76,"Interesting. And if you had more time affluence?"],[207.05,211.55,"I'd learn the tro, assuming my boss respected my right to disconnect!"],[212.85,215.92,"Should automation spread, attitudes may change."],[217.22,221.76,"Otherwise, we'll keep working long hours long after machines could free us."],[223.05,226.41,"Grammar focus: Conditionals beyond the rules (extended)."],[226.71,229.83,"Advanced conditionals add variety and formality."],[230.13,234.2,"Had Keynes seen today's overwork culture, he'd have been shocked."],[234.5,239.82,"Were productivity gains shared fairly, we might already have a leisure society."],[240.12,247.35,"Inversion (Had, Were, Should) and words like 'assuming', 'provided' and 'otherwise' make conditionals more formal and varied."],[248.35,252.19,"Now read and listen. Whatever Happened to the Leisure Society?."],[252.49,259.99,"In 1930, John Maynard Keynes predicted that his grandchildren would work only about fifteen hours a week."],[261.28,266.36,"Productivity has indeed multiplied, yet the leisure society has not arrived."],[267.65,273.88,"Instead, many professionals live within an overwork culture, where long hours signal commitment."],[275.18,281.47,"Part of the explanation lies in a powerful work ethic that treats idleness as a moral failure."],[282.78,288.36,"Another lies in consumption: had we accepted simpler lifestyles, we could have worked less."],[289.65,296.48,"Psychologists report that time affluence contributes more to wellbeing than modest increases in income."],[297.78,303.44,"Some countries now protect a right to disconnect, while others experiment with four-day weeks."],[304.75,312.83,"Should these experiments succeed, meaningful leisure might finally replace conspicuous leisure as a symbol of the good life."],[314.12,316.95,"Quiz time! Choose the correct answer."],[317.25,319.94,"The feeling of having enough free time is blank."],[320.24,325.18,"A, time affluence. B, idleness. C, work ethic."],[329.18,332.1,"The answer is A: time affluence."],[333.62,335.98,"blank he known, he would have helped."],[336.28,339.55,"A, Had. B, Were. C, Should."],[343.55,345.26,"The answer is A: Had."],[346.75,349.67,"'Should you need help, call me' means blank."],[349.97,355.13,"A, if you need help. B, you must need help. C, you needed help."],[359.12,361.23,"The answer is A: if you need help."],[362.72,366.54,"A legal right not to answer work messages after hours is the blank."],[366.84,372.84,"A, right to disconnect. B, leisure society. C, overwork culture."],[376.85,379.65,"The answer is A: right to disconnect."],[381.15,386.28,"According to the text, how many hours a week did Keynes predict people would work?"],[386.58,391.04,"A, about fifteen. B, about thirty. C, about forty."],[395.05,397.97,"The answer is A: about fifteen."],[399.48,404.93,"Now it's your turn. Part one: Would you choose a four-day working week with lower pay?"],[410.23,416.6,"Part two: Use one inverted conditional and one alternative such as 'assuming' or 'otherwise'."],[422.9,434.55,"Were I offered a four-day week, I would probably accept, assuming the pay cut were small. Time affluence matters. Otherwise, I would have little time for family and meaningful leisure."],[434.85,436.83,"That is a well-argued answer!"],[437.82,443.12,"Great work today! You learned eight new words and conditionals beyond the rules (extended)."],[443.42,448.45,"Today's value is healthy body. Move your body every day."],[448.75,451.7,"See you in Unit forty-eight. Goodbye!"],[452.0,455.11,"Thank you, Ms. Sarah! Bye, everyone!"]],"OC-Proficiency-Unit48-Biodiversity-and-Extinction":[[0.35,5.05,"Hello, everyone! I'm Ms. Sarah. Welcome to Online Proficiency."],[5.35,8.3,"Hi! I'm Rithy. Let's learn together!"],[8.61,19.73,"Unit forty-eight: Biodiversity and Extinction. In this unit, you will describe biodiversity loss in formal and literary register."],[20.72,23.67,"biodiversity hotspot."],[24.37,30.98,"biodiversity hotspot means a region rich in species that is also seriously threatened."],[31.28,35.78,"The Cardamom Mountains lie within a biodiversity hotspot."],[36.48,40.97,"Your turn. Say: biodiversity hotspot."],[43.67,45.94,"biodiversity hotspot."],[46.95,48.45,"keystone species."],[49.15,54.51,"keystone species means a species on which many others in an ecosystem depend."],[54.8,58.26,"Elephants are a keystone species that shape the forest."],[58.96,62.38,"Your turn. Say: keystone species."],[65.08,66.55,"keystone species."],[67.55,68.84,"extinction debt."],[69.54,75.71,"extinction debt means future extinctions that are inevitable because of past habitat loss."],[76.01,79.51,"Forest loss today creates an extinction debt for tomorrow."],[80.21,83.42,"Your turn. Say: extinction debt."],[86.12,87.41,"extinction debt."],[88.42,90.07,"habitat fragmentation."],[90.77,97.3,"habitat fragmentation means the breaking of large habitats into small, isolated pieces."],[97.59,102.24,"Roads cause habitat fragmentation and trap animal populations."],[102.94,106.51,"Your turn. Say: habitat fragmentation."],[109.21,110.97,"habitat fragmentation."],[111.98,113.5,"wildlife corridor."],[114.19,120.59,"wildlife corridor means a strip of habitat connecting separated areas so animals can move."],[120.89,124.68,"A wildlife corridor lets tigers travel between reserves."],[125.38,128.79,"Your turn. Say: wildlife corridor."],[131.49,133.03,"wildlife corridor."],[134.02,135.24,"de-extinction."],[135.94,141.24,"de-extinction means attempting to bring extinct species back to life using genetics."],[141.53,144.91,"De-extinction of the mammoth remains highly controversial."],[145.6,149.13,"Your turn. Say: de-extinction."],[151.83,152.89,"de-extinction."],[153.88,154.86,"seed vault."],[155.56,159.57,"seed vault means a secure store protecting seeds for the future."],[159.87,163.09,"The Svalbard seed vault holds over a million samples."],[163.79,166.63,"Your turn. Say: seed vault."],[169.33,170.21,"seed vault."],[171.22,172.82,"invasive species."],[173.52,179.91,"invasive species means a non-native species that spreads and harms local ecosystems."],[180.21,183.99,"Water hyacinth is an invasive species in many rivers."],[184.69,188.51,"Your turn. Say: invasive species."],[191.21,192.86,"invasive species."],[193.85,196.09,"Now let's listen to a conversation."],[196.39,200.9,"Ms. Sarah, how would a scientist describe what is happening to nature?"],[202.22,207.85,"Formally: 'Habitat fragmentation constitutes the principal driver of species decline.'"],[209.15,210.16,"And a poet?"],[211.45,216.89,"Perhaps: 'The forest falls silent, and the last song fades from the hills.'"],[218.18,221.37,"Both describe the extinction debt, in different ways."],[222.68,227.24,"Indeed. The former informs; the latter moves the heart."],[228.55,229.76,"Which works better?"],[231.05,236.41,"Ere we lose more keystone species, we shall need both science and poetry."],[237.72,242.17,"Grammar focus: Formal and literary register (extended)."],[242.47,245.13,"Register changes with purpose and audience."],[245.43,254.4,"Formally: habitat fragmentation constitutes the principal driver of species decline. Poetically: the forest falls silent."],[254.69,259.48,"Ere we lose more keystone species, we shall need both science and poetry."],[259.78,270.91,"Formal register uses precise Latinate verbs; literary register uses imagery and rhythm. Archaic words like 'ere' belong only in poetic or rhetorical style."],[271.92,275.1,"Now read and listen. The Silence of the Forest."],[275.4,281.1,"Scientists warn that the planet is experiencing a profound loss of biodiversity."],[282.38,290.33,"Habitat fragmentation, pollution, climate change and invasive species constitute the principal drivers of this decline."],[291.62,298.92,"Many biodiversity hotspots, including parts of Southeast Asia, are particularly vulnerable."],[300.22,307.86,"Because of past destruction, ecosystems may already carry an extinction debt that will be paid in future losses."],[309.15,314.09,"The disappearance of a keystone species can unravel entire food webs."],[315.38,320.8,"Conservationists therefore create wildlife corridors and protect seeds in secure seed vaults."],[322.08,328.84,"Some scientists even propose de-extinction, though critics fear it distracts from protecting living species."],[330.15,337.83,"As one writer put it, when the forest falls silent, it is not only animals that are lost, but part of our own humanity."],[339.12,341.7,"Quiz time! Choose the correct answer."],[342.0,345.04,"A species on which many others depend is a blank."],[345.34,351.71,"A, keystone species. B, invasive species. C, biodiversity hotspot."],[355.72,358.23,"The answer is A: keystone species."],[359.72,362.67,"Which sentence is in formal academic register?"],[362.97,371.48,"A, Habitat loss constitutes a major threat.. B, Habitat loss is a big deal.. C, The trees weep for their friends.."],[375.48,379.83,"The answer is A: Habitat loss constitutes a major threat.."],[381.32,382.74,"'Ere' means blank."],[383.04,386.46,"A, before. B, after. C, because."],[390.45,392.8,"The answer is A: before."],[394.28,398.26,"A strip of habitat connecting separated areas is a blank."],[398.56,404.51,"A, wildlife corridor. B, seed vault. C, extinction debt."],[408.52,411.28,"The answer is A: wildlife corridor."],[412.78,417.43,"According to the text, what can the disappearance of a keystone species do?"],[417.73,424.9,"A, unravel entire food webs. B, create new species. C, stop climate change."],[428.92,432.7,"The answer is A: unravel entire food webs."],[434.22,440.68,"Now it's your turn. Part one: Why should ordinary people care about biodiversity loss?"],[445.98,452.68,"Part two: Give one sentence in formal register and one in literary register."],[458.98,472.33,"Formally: biodiversity provides essential services such as clean water, pollination and food security. Literarily: when the last elephant leaves the Cardamoms, the mountains will lose their heartbeat."],[472.63,475.26,"That is a well-argued answer!"],[476.25,482.91,"Great work today! You learned eight new words and formal and literary register (extended)."],[483.21,488.38,"Today's value is caring for nature. Care for plants, birds and our planet."],[488.68,492.12,"See you in Unit forty-nine. Goodbye!"],[492.42,495.51,"Thank you, Ms. Sarah! Bye, everyone!"]],"OC-Proficiency-Unit49-Leadership-and-Ethics":[[0.35,5.51,"Hello, everyone! I'm Ms. Sarah. Welcome to Online Proficiency."],[5.81,9.03,"Hi! I'm Rithy. Let's learn together!"],[9.32,18.07,"Unit forty-nine: Leadership and Ethics. In this unit, you will evaluate what makes leadership ethical."],[19.08,20.43,"ethical leadership."],[21.13,27.13,"ethical leadership means leading by doing what is right, not only what is profitable or popular."],[27.43,30.48,"Ethical leadership means admitting mistakes publicly."],[31.18,34.58,"Your turn. Say: ethical leadership."],[37.28,38.51,"ethical leadership."],[39.52,41.04,"authentic leadership."],[41.74,46.87,"authentic leadership means leadership based on honesty about one's own values and limits."],[47.17,50.98,"Authentic leadership builds trust because people see the real person."],[51.69,55.43,"Your turn. Say: authentic leadership."],[58.13,59.51,"authentic leadership."],[60.52,61.85,"toxic leadership."],[62.55,68.05,"toxic leadership means leadership that harms people through fear, bullying or selfishness."],[68.35,71.18,"Toxic leadership drove half the team to resign."],[71.88,75.08,"Your turn. Say: toxic leadership."],[77.78,79.11,"toxic leadership."],[80.12,81.61,"stewardship leadership."],[82.31,88.82,"stewardship leadership means leading as a caretaker of resources for future generations."],[89.12,93.41,"Stewardship leadership protects the forest the company depends on."],[94.11,97.77,"Your turn. Say: stewardship leadership."],[100.47,101.89,"stewardship leadership."],[102.88,104.75,"transformational leadership."],[105.45,111.76,"transformational leadership means leadership that inspires people to change and exceed expectations."],[112.06,115.95,"Transformational leadership turned a failing school into a model."],[116.65,119.94,"Your turn. Say: transformational leadership."],[122.64,124.53,"transformational leadership."],[125.52,126.94,"leadership legacy."],[127.64,131.39,"leadership legacy means what a leader leaves behind for others."],[131.69,135.85,"Her leadership legacy is a generation of confident young women."],[136.55,139.73,"Your turn. Say: leadership legacy."],[142.43,144.0,"leadership legacy."],[145.02,146.73,"integrity in office."],[147.43,153.35,"integrity in office means honest and principled behaviour while holding power."],[153.65,158.56,"Integrity in office means refusing gifts that create obligations."],[159.26,163.09,"Your turn. Say: integrity in office."],[165.79,167.46,"integrity in office."],[168.45,169.75,"moral compass."],[170.45,175.32,"moral compass means a person's inner sense of right and wrong that guides decisions."],[175.62,178.57,"A leader without a moral compass will follow the money."],[179.27,182.77,"Your turn. Say: moral compass."],[185.47,186.72,"moral compass."],[187.72,189.95,"Now let's listen to a conversation."],[190.25,194.56,"Ms. Sarah, can a leader be successful and ethical at the same time?"],[195.85,199.15,"Of course. But power can go to anyone's head."],[200.45,203.01,"So leaders need a strong moral compass."],[204.32,209.01,"Exactly. Otherwise they sail wherever the wind of profit blows."],[210.32,213.84,"Toxic leaders seem to rule with an iron fist."],[215.15,217.74,"They do, and they leave scorched earth behind them."],[219.05,221.19,"What about transformational leaders?"],[222.48,227.42,"They plant trees whose shade they will never sit in. That is a true leadership legacy."],[228.72,233.26,"Grammar focus: Idioms and figurative language (advanced)."],[233.56,236.91,"Figurative language makes leadership ideas memorable."],[237.2,241.77,"Power can go to anyone's head. Toxic leaders rule with an iron fist."],[242.07,245.47,"Great leaders plant trees whose shade they will never sit in."],[245.77,252.63,"Extend a metaphor carefully: a moral compass can guide a ship, but don't mix it with a train in the same sentence."],[253.62,256.94,"Now read and listen. The Leader's Inner Compass."],[257.24,262.39,"Leadership has been studied for centuries, yet its ethical dimension is often overlooked."],[263.68,269.53,"Ethical leadership requires more than achieving results; it asks how those results are achieved."],[270.82,278.81,"Authentic leadership emphasises self-awareness and honesty, allowing followers to trust the person behind the title."],[280.12,285.81,"Transformational leadership inspires people to pursue shared goals beyond their own interests."],[287.12,295.21,"Toxic leadership, by contrast, relies on fear and leaves organisations damaged long after the leader departs."],[296.52,301.64,"Stewardship leadership sees power as something held in trust for future generations."],[302.95,307.51,"Integrity in office is tested most severely when no one is watching."],[308.82,315.18,"Ultimately, a leader's legacy depends less on titles than on the moral compass that guided every decision."],[316.48,318.99,"Quiz time! Choose the correct answer."],[319.29,322.96,"A person's inner sense of right and wrong is a blank."],[323.26,328.37,"A, moral compass. B, leadership legacy. C, toxic leadership."],[332.38,335.18,"The answer is A: moral compass."],[336.68,339.36,"'Power went to his head' means he became blank."],[339.66,343.16,"A, arrogant. B, intelligent. C, tired."],[347.15,349.54,"The answer is A: arrogant."],[351.05,353.72,"'Rule with an iron fist' means rule blank."],[354.02,357.69,"A, harshly. B, fairly. C, weakly."],[361.68,363.43,"The answer is A: harshly."],[364.92,369.52,"Leadership that inspires people to exceed expectations is blank."],[369.82,375.5,"A, transformational leadership. B, toxic leadership. C, stewardship leadership."],[379.52,382.65,"The answer is A: transformational leadership."],[384.15,389.04,"According to the text, when is integrity in office tested most severely?"],[389.34,394.93,"A, when no one is watching. B, during elections. C, in public speeches."],[398.92,401.73,"The answer is A: when no one is watching."],[403.22,408.61,"Now it's your turn. Part one: Describe a leader you admire and explain what makes them ethical."],[413.91,418.32,"Part two: Use one idiom and one extended metaphor."],[424.62,437.69,"My grandfather led our village association. Power never went to his head. He planted trees whose shade he would never sit in: a school, a well and a savings group that still helps families today."],[437.99,440.1,"That is a well-argued answer!"],[441.08,446.58,"Great work today! You learned eight new words and idioms and figurative language (advanced)."],[446.88,451.31,"Today's value is responsibility. Help at home and do your jobs."],[451.61,454.44,"See you in Unit fifty. Goodbye!"],[454.74,457.31,"Thank you, Ms. Sarah! Bye, everyone!"]],"OC-Proficiency-Unit50-Music-Emotion-and-Society":[[0.35,5.16,"Hello, everyone! I'm Ms. Sarah. Welcome to Online Proficiency."],[5.46,8.42,"Hi! I'm Rithy. Let's learn together!"],[8.72,17.2,"Unit fifty: Music, Emotion and Society. In this unit, you will discuss music's social and emotional power with nuance."],[18.22,19.39,"musicology."],[20.09,25.92,"musicology means the academic study of music, its history and its role in society."],[26.22,31.14,"She studied musicology at the Royal University of Fine Arts."],[31.84,35.28,"Your turn. Say: musicology."],[37.98,39.13,"musicology."],[40.12,41.41,"protest song."],[42.11,47.61,"protest song means a song that criticises injustice or calls for change."],[47.91,51.31,"'Blowin' in the Wind' became a famous protest song."],[52.01,55.47,"Your turn. Say: protest song."],[58.17,59.56,"protest song."],[60.55,61.7,"national anthem."],[62.4,66.57,"national anthem means a country's official patriotic song."],[66.87,70.07,"Students stand still when the national anthem plays."],[70.77,74.2,"Your turn. Say: national anthem."],[76.9,78.11,"national anthem."],[79.12,80.63,"musical heritage."],[81.33,86.24,"musical heritage means the traditional music passed down through generations."],[86.54,92.14,"Cambodia's musical heritage nearly vanished in the 1970s."],[92.84,95.89,"Your turn. Say: musical heritage."],[98.59,99.88,"musical heritage."],[100.88,102.31,"emotional resonance."],[103.01,107.94,"emotional resonance means the power to produce deep feelings in listeners."],[108.24,112.43,"Sinn Sisamouth's songs still have great emotional resonance."],[113.13,116.52,"Your turn. Say: emotional resonance."],[119.22,120.79,"emotional resonance."],[121.78,123.21,"cultural soundscape."],[123.91,129.06,"cultural soundscape means all the sounds that characterise a place and its culture."],[129.36,134.12,"Temple bells and market calls form Phnom Penh's cultural soundscape."],[134.82,138.32,"Your turn. Say: cultural soundscape."],[141.02,142.51,"cultural soundscape."],[143.52,144.99,"pinpeat ensemble."],[145.69,151.21,"pinpeat ensemble means a traditional Khmer orchestra that accompanies court dance and ceremonies."],[151.51,154.62,"The pinpeat ensemble played for the Royal Ballet."],[155.32,158.74,"Your turn. Say: pinpeat ensemble."],[161.44,162.98,"pinpeat ensemble."],[163.98,165.4,"traditional instrument."],[166.1,171.61,"traditional instrument means a musical instrument with deep roots in a culture."],[171.91,175.07,"The tro is a traditional instrument played with a bow."],[175.77,179.41,"Your turn. Say: traditional instrument."],[182.11,183.55,"traditional instrument."],[184.55,186.65,"Now let's listen to a conversation."],[186.95,191.24,"Rithy, why do old Khmer songs still move people so deeply?"],[192.55,196.07,"It might be nostalgia, but I suspect it's more than that."],[197.38,198.18,"Go on."],[199.48,206.67,"Many musicians were lost in the 1970s, so those recordings must feel incredibly precious."],[207.98,210.77,"That would certainly explain their emotional resonance."],[212.08,216.53,"And young artists may well be reviving the pinpeat ensemble in new ways."],[217.82,219.78,"Could music also be political?"],[221.08,226.1,"It can hardly be otherwise. A protest song can achieve what a speech cannot."],[227.42,231.32,"Grammar focus: Modality and nuance (advanced)."],[231.62,234.84,"Modality expresses fine shades of certainty."],[235.14,241.88,"It might be nostalgia, but I suspect it's more than that. Those recordings must feel incredibly precious."],[242.18,245.19,"Music can hardly be separated from politics."],[245.49,252.22,"Combine modal verbs with phrases like 'I suspect', 'presumably' and 'can hardly' to show fine shades of certainty."],[253.22,256.39,"Now read and listen. The Sound of a Nation."],[256.69,260.2,"Music may be the most universal form of human expression."],[261.52,267.89,"Musicology studies not only melodies but also the social meanings music carries."],[269.18,274.72,"A national anthem unites citizens, while a protest song can challenge those in power."],[276.02,285.56,"Cambodia's musical heritage, from the pinpeat ensemble to the golden age of 1960s pop, suffered terribly under the Khmer Rouge."],[286.85,290.51,"Many musicians were killed, and countless recordings were lost."],[291.82,296.87,"Surviving songs presumably owe part of their emotional resonance to this tragic history."],[298.18,304.37,"Today, young musicians are reviving traditional instruments and mixing them with modern styles."],[305.68,310.93,"In doing so, they are reshaping the cultural soundscape while keeping memory alive."],[312.25,314.94,"Quiz time! Choose the correct answer."],[315.24,317.99,"The academic study of music is blank."],[318.29,323.47,"A, musicology. B, cultural soundscape. C, pinpeat ensemble."],[327.45,330.74,"The answer is A: musicology."],[332.25,335.56,"'Those recordings must feel precious' expresses blank."],[335.86,342.25,"A, a logical deduction. B, an obligation. C, a past habit."],[346.25,349.46,"The answer is A: a logical deduction."],[350.95,354.25,"'It can hardly be otherwise' means it is blank."],[354.55,359.26,"A, almost certainly so. B, unlikely. C, impossible to know."],[363.25,366.36,"The answer is A: almost certainly so."],[367.85,370.69,"A song that criticises injustice is a blank."],[370.99,377.09,"A, protest song. B, national anthem. C, traditional instrument."],[381.08,383.98,"The answer is A: protest song."],[385.48,388.88,"According to the text, what are young musicians reviving?"],[389.18,395.75,"A, traditional instruments. B, only Western pop. C, national anthems."],[399.75,402.82,"The answer is A: traditional instruments."],[404.32,409.5,"Now it's your turn. Part one: Why should young Cambodians learn traditional music?"],[414.8,419.99,"Part two: Use at least three different modal expressions to show degrees of certainty."],[426.29,439.37,"Traditional music might seem old-fashioned, but I suspect it gives young people a strong identity. Our ancestors must have valued it deeply. Without it, our cultural soundscape could hardly feel Khmer."],[439.67,441.53,"That is a well-argued answer!"],[442.52,448.69,"Great work today! You learned eight new words and modality and nuance (advanced)."],[448.99,453.31,"Today's value is respect for culture. Be proud of our Khmer culture."],[453.61,456.44,"See you in Unit fifty-one. Goodbye!"],[456.74,459.48,"Thank you, Ms. Sarah! Bye, everyone!"]],"OC-Proficiency-Unit51-Ageing-Death-and-Meaning":[[0.35,4.99,"Hello, everyone! I'm Ms. Sarah. Welcome to Online Proficiency."],[5.29,8.54,"Hi! I'm Rithy. Let's learn together!"],[8.84,17.02,"Unit fifty-one: Ageing, Death and Meaning. In this unit, you will reflect respectfully on mortality, memory and meaning."],[18.02,19.32,"mortality."],[20.02,24.41,"mortality means the fact that every living being must die."],[24.71,28.16,"Facing mortality can make life feel more precious."],[28.86,32.34,"Your turn. Say: mortality."],[35.04,36.13,"mortality."],[37.12,38.12,"end of life."],[38.82,42.09,"end of life means the final period of a person's life."],[42.39,45.58,"Good end of life care respects the patient's wishes."],[46.28,48.98,"Your turn. Say: end of life."],[51.68,52.56,"end of life."],[53.55,54.62,"bereavement."],[55.32,59.52,"bereavement means the experience of losing someone close through death."],[59.81,62.66,"Bereavement affects the body as well as the mind."],[63.36,66.19,"Your turn. Say: bereavement."],[68.89,69.85,"bereavement."],[70.85,72.07,"mourning ritual."],[72.77,76.51,"mourning ritual means traditional practices that help people grieve."],[76.81,79.8,"White clothing is part of the Khmer mourning ritual."],[80.5,83.03,"Your turn. Say: mourning ritual."],[85.73,86.86,"mourning ritual."],[87.85,88.96,"good death."],[89.66,94.47,"good death means dying peacefully, without pain, surrounded by loved ones."],[94.77,96.87,"Many hope for a good death at home."],[97.57,100.19,"Your turn. Say: good death."],[102.89,103.82,"good death."],[104.82,106.25,"ancestral memory."],[106.95,112.14,"ancestral memory means the remembrance of ancestors kept alive by families and rituals."],[112.44,115.47,"Pchum Ben keeps ancestral memory alive."],[116.17,119.38,"Your turn. Say: ancestral memory."],[122.08,123.62,"ancestral memory."],[124.62,125.77,"life review."],[126.47,130.63,"life review means looking back over one's life to find meaning and peace."],[130.93,134.47,"In life review, elders tell their stories to the young."],[135.17,138.38,"Your turn. Say: life review."],[141.08,142.22,"life review."],[143.22,144.57,"existential meaning."],[145.27,149.35,"existential meaning means a sense of purpose that makes life feel worthwhile."],[149.66,153.5,"Existential meaning often comes from love and service."],[154.2,157.5,"Your turn. Say: existential meaning."],[160.2,161.65,"existential meaning."],[162.65,164.81,"Now let's listen to a conversation."],[165.11,169.6,"Ms. Sarah, why do so many cultures avoid talking about death?"],[170.88,176.45,"Why indeed? Perhaps because to speak of death is to admit our own mortality."],[177.75,180.02,"But Pchum Ben is all about the dead."],[181.32,186.79,"Exactly. It honours the dead, comforts the living and connects the generations."],[188.08,191.79,"In the West, death often happens in hospitals."],[193.08,197.95,"Yes. We have added years to life, but have we added life to years?"],[199.25,202.34,"So a good death matters as much as a long life."],[203.65,207.32,"Not the length of a life, but its depth, is what we remember."],[208.62,213.09,"Grammar focus: Rhetorical devices in argument (advanced)."],[213.39,217.06,"Rhetorical devices give arguments emotional force."],[217.36,222.23,"Pchum Ben honours the dead, comforts the living and connects the generations."],[222.53,226.18,"We have added years to life, but have we added life to years?"],[226.48,233.63,"Chiasmus (A-B, B-A) creates memorable contrasts; use it once at a climax, not repeatedly."],[234.62,237.77,"Now read and listen. Learning to Speak of Death."],[238.07,242.04,"Every human culture must find a way to face mortality."],[243.35,250.54,"In many modern societies, however, death has moved from the home to the hospital and out of everyday conversation."],[251.85,258.09,"Medical progress has extended life, but it has also raised difficult questions about end of life care."],[259.38,267.52,"Hospice movements argue for a good death: free from pain, surrounded by loved ones and in accordance with one's wishes."],[268.82,276.1,"Mourning rituals, such as Cambodian funerals and the festival of Pchum Ben, help families through bereavement."],[277.38,282.24,"These rituals also preserve ancestral memory, linking the living with the dead."],[283.55,290.2,"Psychologists note that life review allows older people to find existential meaning in their experiences."],[291.52,297.21,"To speak honestly of death, paradoxically, may be one of the best ways to live fully."],[298.52,301.24,"Quiz time! Choose the correct answer."],[301.54,304.42,"The experience of losing someone close is blank."],[304.72,309.19,"A, bereavement. B, mortality. C, life review."],[313.18,316.19,"The answer is A: bereavement."],[317.68,321.32,"'Added years to life, but life to years' is an example of blank."],[321.62,326.21,"A, chiasmus. B, ellipsis. C, passive voice."],[330.22,332.96,"The answer is A: chiasmus."],[334.45,335.81,"Which is a tricolon?"],[336.11,343.71,"A, honours the dead, comforts the living and connects the generations. B, honours the dead. C, the living."],[347.72,353.19,"The answer is A: honours the dead, comforts the living and connects the generations."],[354.68,357.96,"Looking back over one's life to find meaning is blank."],[358.26,363.45,"A, life review. B, mourning ritual. C, good death."],[367.45,370.24,"The answer is A: life review."],[371.75,375.71,"According to the text, what do rituals such as Pchum Ben preserve?"],[376.01,381.78,"A, ancestral memory. B, medical records. C, family wealth."],[385.78,388.5,"The answer is A: ancestral memory."],[390.02,395.66,"Now it's your turn. Part one: How can families support elderly relatives at the end of life?"],[400.96,407.48,"Part two: Use a rhetorical question and a tricolon; speak with sensitivity."],[413.78,424.37,"What do our elders need most? Not expensive treatment alone, but presence. We should listen to their stories, respect their wishes and keep them close. That is how we honour a life."],[424.67,426.84,"That is a well-argued answer!"],[427.85,433.33,"Great work today! You learned eight new words and rhetorical devices in argument (advanced)."],[433.63,438.04,"Today's value is togetherness. Spend happy time with your family."],[438.34,441.05,"See you in Unit fifty-two. Goodbye!"],[441.35,444.29,"Thank you, Ms. Sarah! Bye, everyone!"]],"OC-Proficiency-Unit52-Technology-Power-and-Control":[[0.35,5.21,"Hello, everyone! I'm Ms. Sarah. Welcome to Online Proficiency."],[5.51,8.39,"Hi! I'm Rithy. Let's learn together!"],[8.69,18.46,"Unit fifty-two: Technology, Power and Control. In this unit, you will report and evaluate arguments about tech power."],[19.45,20.98,"digital sovereignty."],[21.68,28.11,"digital sovereignty means a country's control over its own data, networks and digital rules."],[28.41,31.7,"Europe talks increasingly about digital sovereignty."],[32.4,35.95,"Your turn. Say: digital sovereignty."],[38.65,40.06,"digital sovereignty."],[41.05,42.28,"platform power."],[42.98,50.58,"platform power means the influence that big online platforms have over users, markets and information."],[50.88,54.4,"Platform power lets a few companies shape what billions see."],[55.1,58.52,"Your turn. Say: platform power."],[61.22,62.49,"platform power."],[63.48,64.78,"tech regulation."],[65.47,70.75,"tech regulation means laws controlling how technology companies operate."],[71.05,74.24,"Tech regulation struggles to keep up with innovation."],[74.94,78.35,"Your turn. Say: tech regulation."],[81.05,82.24,"tech regulation."],[83.25,84.75,"data colonialism."],[85.45,93.19,"data colonialism means the idea that powerful firms extract data from people as colonisers once extracted resources."],[93.48,98.02,"Critics describe free apps in poor countries as data colonialism."],[98.72,102.04,"Your turn. Say: data colonialism."],[104.74,106.39,"data colonialism."],[107.38,108.93,"algorithmic governance."],[109.63,114.54,"algorithmic governance means using algorithms to make or guide public decisions."],[114.84,119.12,"Algorithmic governance decides who receives some welfare payments."],[119.82,123.35,"Your turn. Say: algorithmic governance."],[126.05,127.87,"algorithmic governance."],[128.88,130.59,"digital rights movement."],[131.29,137.97,"digital rights movement means activists campaigning for privacy, free expression and fair access online."],[138.27,141.77,"The digital rights movement opposed mass surveillance."],[142.47,146.22,"Your turn. Say: digital rights movement."],[148.92,150.47,"digital rights movement."],[151.48,153.05,"open-source movement."],[153.75,160.51,"open-source movement means the movement to share software code freely so anyone can use and improve it."],[160.81,163.44,"Linux grew out of the open-source movement."],[164.14,167.41,"Your turn. Say: open-source movement."],[170.11,171.56,"open-source movement."],[172.55,173.71,"tech monopoly."],[174.41,180.72,"tech monopoly means a technology company that dominates its market without real competition."],[181.02,184.13,"Regulators accused the firm of being a tech monopoly."],[184.84,187.86,"Your turn. Say: tech monopoly."],[190.56,191.69,"tech monopoly."],[192.68,195.0,"Now let's listen to a conversation."],[195.3,198.17,"Rithy, who really controls the internet?"],[199.45,205.03,"Critics argue that a handful of firms do. Some even describe it as data colonialism."],[206.32,209.46,"That's a strong term. Do the companies accept it?"],[210.75,215.46,"Not at all. They maintain that their services are free and empower users."],[216.75,218.1,"And governments?"],[219.38,223.78,"The EU has asserted its digital sovereignty through tough tech regulation."],[225.08,226.7,"What do activists say?"],[227.98,233.31,"The digital rights movement warns that algorithmic governance can quietly deny people their rights."],[234.62,239.04,"Grammar focus: Precise reporting and attribution (advanced)."],[239.34,242.11,"Precise attribution keeps reporting fair."],[242.41,248.76,"Critics argue that a few firms control the internet. The companies maintain that their services empower users."],[249.06,253.53,"Activists warn that algorithmic governance can deny people their rights."],[253.82,262.26,"In balanced reporting, attribute each view to its source and choose verbs that reflect the source's strength of claim."],[263.25,266.63,"Now read and listen. Who Governs the Digital World?."],[266.93,273.61,"A small number of technology firms now shape how billions of people communicate, shop and learn."],[274.92,279.2,"Critics argue that this platform power rivals that of many governments."],[280.52,285.79,"Some scholars even describe the extraction of personal data as data colonialism."],[287.08,292.35,"The companies, for their part, maintain that their services are free, innovative and empowering."],[293.65,301.57,"Governments have responded with tech regulation, and the European Union in particular has asserted its digital sovereignty."],[302.88,309.78,"Meanwhile, the digital rights movement warns that algorithmic governance may make important decisions without transparency."],[311.08,316.79,"The open-source movement offers an alternative model, in which software is shared rather than owned."],[318.08,324.73,"Whether regulation can restrain a tech monopoly without stifling innovation remains fiercely debated."],[326.02,328.8,"Quiz time! Choose the correct answer."],[329.1,332.94,"A country's control over its own data and networks is blank."],[333.24,338.1,"A, digital sovereignty. B, platform power. C, tech monopoly."],[342.12,344.96,"The answer is A: digital sovereignty."],[346.45,350.09,"Which reporting verb shows someone keeps defending a position?"],[350.39,353.82,"A, maintain. B, admit. C, wonder."],[357.82,360.37,"The answer is A: maintain."],[361.88,365.69,"'Activists warn that...' presents the activists' view as blank."],[365.99,371.69,"A, a caution about danger. B, a joke. C, a proven fact."],[375.68,378.82,"The answer is A: a caution about danger."],[380.32,384.21,"Sharing software code freely is the idea behind the blank."],[384.51,390.47,"A, open-source movement. B, data colonialism. C, algorithmic governance."],[394.48,397.07,"The answer is A: open-source movement."],[398.58,402.74,"According to the text, which body has asserted its digital sovereignty?"],[403.04,407.69,"A, the European Union. B, ASEAN. C, the United Nations."],[411.68,414.66,"The answer is A: the European Union."],[416.15,422.62,"Now it's your turn. Part one: Should Cambodia regulate big technology companies more strictly?"],[427.92,434.55,"Part two: Report at least two opposing views with precise reporting verbs before giving yours."],[440.85,453.28,"Critics argue that foreign platforms collect too much data. The companies maintain that they bring free services. Experts warn that weak regulation leaves users unprotected, so I believe sensible rules are needed."],[453.58,456.51,"That is a well-argued answer!"],[457.52,464.27,"Great work today! You learned eight new words and precise reporting and attribution (advanced)."],[464.57,469.9,"Today's value is online safety. Keep your password secret and be kind online."],[470.2,473.9,"See you in Unit fifty-three. Goodbye!"],[474.2,476.93,"Thank you, Ms. Sarah! Bye, everyone!"]],"OC-Proficiency-Unit53-Diplomacy-and-Small-States":[[0.35,5.01,"Hello, everyone! I'm Ms. Sarah. Welcome to Online Proficiency."],[5.31,8.14,"Hi! I'm Rithy. Let's learn together!"],[8.44,17.47,"Unit fifty-three: Diplomacy and Small States. In this unit, you will analyse how small states protect their interests."],[18.48,20.29,"small-state diplomacy."],[20.99,27.3,"small-state diplomacy means the strategies smaller countries use to influence larger powers."],[27.6,31.27,"Singapore is famous for skilful small-state diplomacy."],[31.98,35.97,"Your turn. Say: small-state diplomacy."],[38.67,40.38,"small-state diplomacy."],[41.38,42.79,"hedging strategy."],[43.49,49.15,"hedging strategy means keeping good relations with several rival powers to avoid depending on one."],[49.45,54.11,"Many ASEAN members follow a hedging strategy between China and the US."],[54.81,58.04,"Your turn. Say: hedging strategy."],[60.74,62.06,"hedging strategy."],[63.05,64.27,"non-alignment."],[64.97,69.8,"non-alignment means refusing to join either side in a great-power rivalry."],[70.1,75.84,"Cambodia was a founding member of the Non-Aligned Movement in 1961."],[76.54,79.72,"Your turn. Say: non-alignment."],[82.42,83.48,"non-alignment."],[84.48,86.27,"neutrality policy."],[86.97,92.24,"neutrality policy means an official position of not taking sides in conflicts."],[92.54,96.02,"Switzerland's neutrality policy dates back centuries."],[96.72,100.35,"Your turn. Say: neutrality policy."],[103.05,104.6,"neutrality policy."],[105.58,107.41,"regional integration."],[108.11,115.39,"regional integration means countries in a region cooperating closely on trade and policy."],[115.69,119.26,"Regional integration gives small economies a bigger market."],[119.96,123.4,"Your turn. Say: regional integration."],[126.1,127.73,"regional integration."],[128.72,129.94,"ASEAN way."],[130.64,137.14,"ASEAN way means ASEAN's style of quiet consultation, consensus and non-interference."],[137.44,140.7,"The ASEAN way avoids public criticism of members."],[141.4,144.51,"Your turn. Say: ASEAN way."],[147.21,148.3,"ASEAN way."],[149.28,150.96,"consensus diplomacy."],[151.66,156.25,"consensus diplomacy means making decisions only when all parties agree."],[156.55,160.34,"Consensus diplomacy is slow but keeps everyone at the table."],[161.05,164.65,"Your turn. Say: consensus diplomacy."],[167.35,169.12,"consensus diplomacy."],[170.12,172.13,"strategic autonomy."],[172.83,178.54,"strategic autonomy means a country's ability to make independent foreign-policy choices."],[178.84,182.91,"Strategic autonomy is the goal of every small state."],[183.61,187.17,"Your turn. Say: strategic autonomy."],[189.87,191.87,"strategic autonomy."],[192.85,194.98,"Now let's listen to a conversation."],[195.28,199.49,"Ms. Sarah, how can a small country deal with superpowers?"],[200.78,202.98,"Carefully. Very carefully."],[204.28,205.94,"Should it choose a side?"],[207.25,211.24,"Some do; most try not to. Hedging, they call it."],[212.55,216.75,"Cambodia chose non-alignment in the 1960s."],[218.05,221.76,"It did. That balance, Prince Sihanouk tried hard to keep."],[223.05,224.63,"And ASEAN helps?"],[225.92,232.06,"Together, small states are heard; alone, rarely. Hence the value of consensus diplomacy."],[233.35,238.58,"Grammar focus: Ellipsis, substitution and fronting (advanced)."],[238.88,242.88,"Ellipsis and fronting create natural, emphatic speech."],[243.19,247.86,"Should small states choose a side? Some do; most try not to."],[248.16,251.27,"That balance, Prince Sihanouk tried hard to keep."],[251.57,258.41,"Ellipsis and substitution make dialogue natural; fronting highlights the topic you want listeners to remember."],[259.42,262.63,"Now read and listen. The Art of Being Small."],[262.93,268.15,"Small states face a permanent dilemma: how to remain independent among giants."],[269.45,276.85,"Small-state diplomacy relies on skill, reputation and partnerships rather than military power."],[278.15,284.57,"During the Cold War, many newly independent countries, Cambodia among them, chose non-alignment."],[285.88,290.77,"Others, such as Switzerland, adopted a formal neutrality policy."],[292.08,299.18,"Today, many Southeast Asian states pursue a hedging strategy, cooperating with several powers at once."],[300.48,304.76,"Regional integration through ASEAN amplifies their collective voice."],[306.05,316.13,"The ASEAN way, based on consensus diplomacy and non-interference, is often criticised as slow; supporters reply that it has kept the peace."],[317.42,323.87,"For small states, strategic autonomy is not a luxury but a condition of survival."],[325.18,327.75,"Quiz time! Choose the correct answer."],[328.05,331.45,"Keeping good relations with several rival powers is a blank."],[331.75,338.3,"A, hedging strategy. B, neutrality policy. C, regional integration."],[342.32,345.28,"The answer is A: hedging strategy."],[346.78,351.83,"'Did Cambodia join? It did.' The words 'It did' are an example of blank."],[352.13,356.86,"A, substitution. B, inversion. C, passive voice."],[360.85,363.18,"The answer is A: substitution."],[364.68,367.81,"'That balance, he tried to keep' fronts the blank."],[368.11,372.48,"A, object. B, subject. C, verb."],[376.48,378.74,"The answer is A: object."],[380.25,384.24,"ASEAN's style of quiet consultation and consensus is the blank."],[384.54,390.37,"A, ASEAN way. B, non-alignment. C, strategic autonomy."],[394.38,397.36,"The answer is A: ASEAN way."],[398.85,403.25,"According to the text, what do supporters say the ASEAN way has done?"],[403.55,409.85,"A, kept the peace. B, ended all disputes. C, created a single currency."],[413.85,416.27,"The answer is A: kept the peace."],[417.78,424.25,"Now it's your turn. Part one: How should Cambodia balance relations with major world powers?"],[429.56,436.08,"Part two: Use one elliptical answer, one substitution and one fronted phrase."],[442.38,454.53,"Should Cambodia depend on one partner? I'd say not. Strategic autonomy, that is what we need. Friendly relations with many powers, strong ASEAN ties and careful hedging will keep us independent."],[454.83,457.09,"That is a well-argued answer!"],[458.08,464.3,"Great work today! You learned eight new words and ellipsis, substitution and fronting (advanced)."],[464.6,469.28,"Today's value is love of country. Love and take care of Cambodia."],[469.58,472.64,"See you in Unit fifty-four. Goodbye!"],[472.94,476.16,"Thank you, Ms. Sarah! Bye, everyone!"]],"OC-Proficiency-Unit54-Fiction-Truth-and-Empathy":[[0.35,5.29,"Hello, everyone! I'm Ms. Sarah. Welcome to Online Proficiency."],[5.59,8.55,"Hi! I'm Rithy. Let's learn together!"],[8.85,17.09,"Unit fifty-four: Fiction, Truth and Empathy. In this unit, you will argue whether fiction can make us better people."],[18.08,19.53,"narrative empathy."],[20.23,25.17,"narrative empathy means feeling with characters as we read or watch their stories."],[25.47,28.73,"Narrative empathy lets us share a stranger's grief."],[29.43,32.43,"Your turn. Say: narrative empathy."],[35.13,36.43,"narrative empathy."],[37.42,38.64,"fictional truth."],[39.34,44.58,"fictional truth means a deep truth about life expressed through invented stories."],[44.88,48.03,"Fictional truth can be more honest than a news report."],[48.73,52.05,"Your turn. Say: fictional truth."],[54.75,56.24,"fictional truth."],[57.25,58.75,"moral imagination."],[59.45,64.31,"moral imagination means the ability to imagine how our actions affect others."],[64.61,67.39,"Literature develops our moral imagination."],[68.09,71.15,"Your turn. Say: moral imagination."],[73.85,75.28,"moral imagination."],[76.28,77.77,"literary realism."],[78.47,84.56,"literary realism means writing that represents ordinary life truthfully and in detail."],[84.86,88.53,"Literary realism shows poverty without romance."],[89.23,92.65,"Your turn. Say: literary realism."],[95.35,96.76,"literary realism."],[97.75,99.03,"perspective-taking."],[99.73,105.33,"perspective-taking means imagining a situation from another person's point of view."],[105.63,108.77,"Debate practice improves perspective-taking."],[109.47,112.9,"Your turn. Say: perspective-taking."],[115.6,116.81,"perspective-taking."],[117.82,119.55,"suspension of disbelief."],[120.25,125.77,"suspension of disbelief means temporarily accepting impossible things in a story."],[126.07,129.27,"Fantasy requires a willing suspension of disbelief."],[129.97,133.73,"Your turn. Say: suspension of disbelief."],[136.43,138.14,"suspension of disbelief."],[139.15,140.35,"character arc."],[141.05,145.28,"character arc means the way a character changes during a story."],[145.58,149.59,"The hero's character arc moves from selfishness to sacrifice."],[150.28,153.4,"Your turn. Say: character arc."],[156.1,157.25,"character arc."],[158.25,159.67,"narrative ethics."],[160.37,165.67,"narrative ethics means the study of the moral questions raised by telling stories."],[165.97,170.38,"Narrative ethics asks whose story is being told, and by whom."],[171.08,174.62,"Your turn. Say: narrative ethics."],[177.31,178.91,"narrative ethics."],[179.92,182.15,"Now let's listen to a conversation."],[182.45,185.09,"Rithy, does reading novels make us kinder?"],[186.38,190.14,"Some studies suggest so, although the evidence is mixed."],[191.45,192.74,"Mixed in what way?"],[194.05,199.94,"While readers show more perspective-taking, it's unclear whether they act more kindly."],[201.25,203.91,"So narrative empathy may stay on the page."],[205.22,210.93,"Possibly. Even so, a novel can open our moral imagination to lives we'd never meet."],[212.25,214.74,"Yet fiction is, after all, invented."],[216.05,222.5,"Invented, yes; untrue, no. Fictional truth can reveal what facts alone cannot."],[223.78,227.41,"Grammar focus: Concession and contrast (advanced)."],[227.71,229.95,"Concession makes arguments nuanced."],[230.25,235.32,"Some studies suggest reading builds empathy, although the evidence is mixed."],[235.62,238.34,"Fiction is invented, yes; untrue, no."],[238.64,243.99,"'Yes ... no' structures and 'even so' allow elegant concessions in speech and essays alike."],[244.98,248.08,"Now read and listen. Can Stories Make Us Better?."],[248.38,252.21,"For centuries, writers have claimed that literature educates the heart."],[253.52,259.86,"Psychologists have tested this claim, finding that readers of fiction often score higher in perspective-taking."],[261.15,268.0,"Narrative empathy, the experience of feeling with a character, may train us to understand real people."],[269.32,275.56,"Literary realism, by portraying ordinary suffering in detail, can widen our moral imagination."],[276.85,284.03,"Even fantasy, which demands suspension of disbelief, can explore real moral dilemmas through a character arc."],[285.32,291.47,"Nevertheless, some researchers caution that feeling empathy for characters does not always lead to kinder action."],[292.78,299.89,"Narrative ethics also asks difficult questions: who has the right to tell another community's story?"],[301.18,305.96,"Fiction may not change the world directly; even so, it can change the people who will."],[307.25,309.79,"Quiz time! Choose the correct answer."],[310.09,314.41,"Imagining a situation from another person's viewpoint is blank."],[314.71,320.43,"A, perspective-taking. B, character arc. C, literary realism."],[324.42,327.08,"The answer is A: perspective-taking."],[328.58,330.58,"Which word introduces a concession?"],[330.88,335.13,"A, although. B, because. C, therefore."],[339.12,341.37,"The answer is A: although."],[342.88,346.59,"'Invented, yes; untrue, no' means fiction is blank."],[346.89,352.16,"A, made up but still truthful. B, false. C, true facts."],[356.15,359.5,"The answer is A: made up but still truthful."],[360.98,364.78,"Temporarily accepting impossible things in a story is blank."],[365.08,371.29,"A, suspension of disbelief. B, narrative ethics. C, fictional truth."],[375.28,377.65,"The answer is A: suspension of disbelief."],[379.15,382.79,"According to the text, what does narrative ethics ask?"],[383.09,390.44,"A, who has the right to tell a story. B, how long a novel should be. C, which genre sells best."],[394.45,397.6,"The answer is A: who has the right to tell a story."],[399.08,404.46,"Now it's your turn. Part one: Can reading fiction make young people more compassionate?"],[409.76,414.67,"Part two: Concede one limitation, then counter it with an example."],[420.97,433.07,"Although reading alone cannot make anyone kind, it helps. While I was reading a novel about refugees, I understood their fear for the first time. Even so, we must turn empathy into action."],[433.37,435.32,"That is a well-argued answer!"],[436.32,441.75,"Great work today! You learned eight new words and concession and contrast (advanced)."],[442.06,445.62,"Today's value is empathy. Think about how others feel."],[445.93,448.75,"See you in Unit fifty-five. Goodbye!"],[449.05,452.24,"Thank you, Ms. Sarah! Bye, everyone!"]],"OC-Proficiency-Unit55-Cities-of-the-Future-Speculative":[[0.35,5.75,"Hello, everyone! I'm Ms. Sarah. Welcome to Online Proficiency."],[6.04,9.14,"Hi! I'm Rithy. Let's learn together!"],[9.44,20.64,"Unit fifty-five: Cities of the Future (Speculative). In this unit, you will imagine future cities using precise collocation and connotation."],[21.65,22.78,"floating city."],[23.48,27.46,"floating city means a city built on platforms on the sea or a lake."],[27.76,30.59,"A floating city could rise with the sea level."],[31.29,34.28,"Your turn. Say: floating city."],[36.98,37.99,"floating city."],[38.98,40.08,"arcology."],[40.78,46.48,"arcology means a huge single building designed to contain a whole ecological city."],[46.78,51.3,"An arcology would house a hundred thousand people under one roof."],[52.0,55.09,"Your turn. Say: arcology."],[57.79,58.91,"arcology."],[59.92,61.14,"megastructure."],[61.84,65.22,"megastructure means an extremely large built structure."],[65.52,69.77,"Saudi Arabia's The Line was planned as a vast megastructure."],[70.47,73.61,"Your turn. Say: megastructure."],[76.31,77.45,"megastructure."],[78.45,79.79,"post-car city."],[80.49,87.02,"post-car city means a city designed for walking, cycling and transit instead of private cars."],[87.31,90.94,"In a post-car city, streets become gardens."],[91.64,95.55,"Your turn. Say: post-car city."],[98.25,100.14,"post-car city."],[101.15,102.62,"autonomous city."],[103.31,107.64,"autonomous city means a city largely run by automated systems."],[107.94,111.88,"In an autonomous city, buses and lights respond to sensors."],[112.58,115.85,"Your turn. Say: autonomous city."],[118.56,119.83,"autonomous city."],[120.85,122.34,"urban automation."],[123.04,128.3,"urban automation means using machines and software to run city services."],[128.6,132.42,"Urban automation could make rubbish collection silent and efficient."],[133.12,136.53,"Your turn. Say: urban automation."],[139.23,140.66,"urban automation."],[141.65,143.08,"climate-proof city."],[143.78,147.59,"climate-proof city means a city designed to withstand extreme weather."],[147.89,152.0,"A climate-proof city stores floodwater and stays cool."],[152.7,157.34,"Your turn. Say: climate-proof city."],[160.04,161.38,"climate-proof city."],[162.38,163.74,"circular city."],[164.44,170.4,"circular city means a city where waste becomes a resource and nothing is thrown away."],[170.7,174.99,"Amsterdam aims to become a circular city by 2050."],[175.69,179.26,"Your turn. Say: circular city."],[181.96,183.22,"circular city."],[184.22,186.48,"Now let's listen to a conversation."],[186.78,190.03,"Ms. Sarah, what will cities look like in a hundred years?"],[191.32,196.99,"Some visionaries dream of gleaming floating cities and towering arcologies."],[198.28,199.83,"That sounds exciting."],[201.12,207.23,"Or alarming. 'Megastructure' can sound visionary or monstrous, depending on your view."],[208.52,212.81,"I prefer the idea of a post-car city: quiet, green and walkable."],[214.12,217.46,"A far cry from today's traffic-choked streets!"],[218.75,221.46,"But would an autonomous city be too controlled?"],[222.75,225.35,"There's a fine line between smart and surveilled."],[226.65,230.9,"Grammar focus: Collocation and connotation (advanced)."],[231.2,235.06,"Collocation and connotation shape a listener's attitude."],[235.36,240.59,"Visionaries dream of gleaming floating cities and towering arcologies."],[240.89,243.78,"There's a fine line between smart and surveilled."],[244.08,251.56,"Choose adjectives for connotation: 'ambitious' praises, 'grandiose' mocks, though both describe big plans."],[252.55,255.67,"Now read and listen. Blueprints for Tomorrow."],[255.97,260.42,"Architects and futurists have long imagined radically different cities."],[261.72,268.16,"Paolo Soleri's arcology proposed enormous single structures that would combine housing, work and nature."],[269.45,275.29,"Today, rising seas inspire designs for floating cities that could adapt to changing water levels."],[276.58,284.54,"Some governments have announced vast megastructures, which critics call grandiose and supporters call visionary."],[285.85,294.43,"Less dramatic ideas may prove more influential: the post-car city, the climate-proof city and the circular city."],[295.72,303.79,"Urban automation could make services more efficient, and an autonomous city might respond instantly to traffic and pollution."],[305.08,311.41,"Yet there is a fine line between convenience and control, especially when every movement is recorded."],[312.72,317.92,"The cities of the future will reflect not only our technology but also our values."],[319.22,322.03,"Quiz time! Choose the correct answer."],[322.33,325.39,"A city where waste becomes a resource is a blank."],[325.69,330.41,"A, circular city. B, floating city. C, megastructure."],[334.42,337.38,"The answer is A: circular city."],[338.88,342.25,"Which adjective has a negative connotation for big plans?"],[342.55,346.93,"A, grandiose. B, ambitious. C, visionary."],[350.92,353.38,"The answer is A: grandiose."],[354.88,356.73,"'A far cry from' means blank."],[357.03,361.42,"A, very different from. B, close to. C, because of."],[365.42,368.15,"The answer is A: very different from."],[369.65,373.7,"A huge building containing a whole ecological city is an blank."],[374.0,379.75,"A, arcology. B, autonomous city. C, post-car city."],[383.75,386.16,"The answer is A: arcology."],[387.65,390.92,"According to the text, who proposed the arcology?"],[391.21,396.04,"A, Paolo Soleri. B, Le Corbusier. C, Thomas More."],[400.05,402.8,"The answer is A: Paolo Soleri."],[404.32,410.72,"Now it's your turn. Part one: Describe your ideal city in 2100."],[416.02,423.41,"Part two: Use two strong collocations and contrast a positive and a negative connotation."],[429.71,441.53,"My ideal city would be a far cry from today's crowded streets. It would be a green, walkable, circular city. Smart technology would help, but there is a fine line between helpful and intrusive."],[441.83,444.37,"That is a well-argued answer!"],[445.35,450.88,"Great work today! You learned eight new words and collocation and connotation (advanced)."],[451.18,454.94,"Today's value is wonder. Look up and wonder at the world."],[455.24,458.32,"See you in Unit fifty-six. Goodbye!"],[458.62,461.81,"Thank you, Ms. Sarah! Bye, everyone!"]],"OC-Proficiency-Unit56-Global-Health-Ethics":[[0.35,5.21,"Hello, everyone! I'm Ms. Sarah. Welcome to Online Proficiency."],[5.51,8.69,"Hi! I'm Rithy. Let's learn together!"],[8.99,17.36,"Unit fifty-six: Global Health Ethics. In this unit, you will argue formally about fairness in global health."],[18.35,19.78,"triage ethics."],[20.48,25.22,"triage ethics means the moral rules for deciding which patients are treated first."],[25.52,29.69,"Triage ethics became urgent when hospitals filled during COVID-19."],[30.39,34.04,"Your turn. Say: triage ethics."],[36.74,38.15,"triage ethics."],[39.15,40.71,"resource allocation."],[41.41,46.8,"resource allocation means deciding how limited money, staff or medicine is shared."],[47.1,50.19,"Fair resource allocation saves the most lives."],[50.89,54.66,"Your turn. Say: resource allocation."],[57.36,58.82,"resource allocation."],[59.82,61.57,"global health justice."],[62.27,69.0,"global health justice means the principle that everyone deserves fair access to health, wherever they live."],[69.3,73.17,"Global health justice demands vaccines for poor countries too."],[73.87,77.81,"Your turn. Say: global health justice."],[80.51,82.18,"global health justice."],[83.18,84.36,"patent waiver."],[85.06,91.02,"patent waiver means temporary suspension of patent rights so medicines can be produced more widely."],[91.32,95.5,"Many countries called for a patent waiver on COVID-19 vaccines."],[96.2,99.88,"Your turn. Say: patent waiver."],[102.59,103.71,"patent waiver."],[104.72,106.3,"access to medicines."],[107.0,112.45,"access to medicines means people's ability to obtain affordable, safe medicines."],[112.75,116.16,"Access to medicines is part of the right to health."],[116.86,120.36,"Your turn. Say: access to medicines."],[123.06,124.72,"access to medicines."],[125.72,127.23,"health sovereignty."],[127.93,133.41,"health sovereignty means a country's ability to produce and control its own health supplies."],[133.71,137.13,"The pandemic made health sovereignty a priority."],[137.83,141.55,"Your turn. Say: health sovereignty."],[144.25,145.62,"health sovereignty."],[146.62,148.05,"pandemic treaty."],[148.75,154.08,"pandemic treaty means an international agreement on preventing and responding to pandemics."],[154.38,160.48,"The World Health Assembly adopted a pandemic agreement in 2025."],[161.18,164.8,"Your turn. Say: pandemic treaty."],[167.5,168.8,"pandemic treaty."],[169.78,171.68,"medical humanitarianism."],[172.38,178.07,"medical humanitarianism means providing health care to people in crisis regardless of politics."],[178.37,182.13,"Medical humanitarianism brings surgeons to war zones."],[182.83,186.5,"Your turn. Say: medical humanitarianism."],[189.2,191.02,"medical humanitarianism."],[192.02,194.17,"Now let's listen to a conversation."],[194.47,199.28,"Rithy, during COVID-19, rich countries bought most of the vaccines first."],[200.58,205.54,"Global health justice demands that every country receive a fair share."],[206.85,208.79,"Some proposed a patent waiver."],[210.08,213.77,"Were it granted, poorer nations could produce their own vaccines."],[215.05,217.71,"Pharmaceutical firms objected strongly."],[219.02,222.34,"Be that as it may, lives must come before profits."],[223.65,226.52,"What about triage in overwhelmed hospitals?"],[227.82,232.15,"It is vital that each decision be guided by clear and fair principles."],[233.45,238.64,"Grammar focus: Subjunctive and archaic forms (advanced)."],[238.94,242.37,"The subjunctive adds formality and moral force."],[242.67,246.75,"Global health justice demands that every country receive a fair share."],[247.05,250.47,"Be that as it may, lives must come before profits."],[250.78,257.46,"'Be that as it may' concedes a point formally; the mandative subjunctive drops the -s even with he, she or it."],[258.45,261.92,"Now read and listen. Who Gets Treated First?."],[262.21,268.25,"Health is often described as a human right, yet access to medicines remains deeply unequal."],[269.55,276.79,"The COVID-19 pandemic exposed this inequality starkly, as wealthy nations secured vaccines first."],[278.08,284.46,"Advocates of global health justice demanded that vaccines be shared according to need."],[285.75,292.07,"Some countries proposed a patent waiver, while manufacturers argued that patents fund innovation."],[293.38,299.81,"The crisis also renewed interest in health sovereignty, as nations sought to produce their own supplies."],[301.12,311.05,"In 2025, member states of the World Health Organization adopted a pandemic agreement intended to improve future cooperation."],[312.35,318.73,"Inside hospitals, triage ethics and resource allocation forced doctors to make painful choices."],[320.02,326.58,"Medical humanitarianism reminds us that, be that as it may, the duty to heal knows no borders."],[327.88,330.5,"Quiz time! Choose the correct answer."],[330.8,334.38,"Temporarily suspending patent rights on medicines is a blank."],[334.68,339.95,"A, patent waiver. B, pandemic treaty. C, triage ethics."],[343.95,346.66,"The answer is A: patent waiver."],[348.15,351.23,"It is essential that every child blank vaccinated."],[351.53,354.47,"A, be. B, is. C, was."],[358.48,360.02,"The answer is A: be."],[361.52,363.42,"'Be that as it may' means blank."],[363.72,369.33,"A, even if that is true. B, because of that. C, as it should be."],[373.32,375.88,"The answer is A: even if that is true."],[377.38,381.27,"A country's ability to produce its own health supplies is blank."],[381.57,389.29,"A, health sovereignty. B, resource allocation. C, medical humanitarianism."],[393.28,396.7,"The answer is A: health sovereignty."],[398.18,402.67,"According to the text, what was adopted in 2025?"],[402.97,409.29,"A, a pandemic agreement. B, a vaccine patent. C, a new health tax."],[413.28,416.2,"The answer is A: a pandemic agreement."],[417.72,425.84,"Now it's your turn. Part one: Should rich countries share vaccines with poor countries before vaccinating everyone at home?"],[431.14,435.4,"Part two: Use the mandative subjunctive and 'be that as it may'."],[441.7,454.38,"Global justice demands that the most vulnerable be protected first, wherever they live. Some say governments must serve their own citizens. Be that as it may, a virus anywhere is a threat everywhere."],[454.68,457.19,"That is a well-argued answer!"],[458.18,463.69,"Great work today! You learned eight new words and subjunctive and archaic forms (advanced)."],[463.99,467.41,"Today's value is kindness. Be kind to everyone."],[467.71,471.42,"See you in Unit fifty-seven. Goodbye!"],[471.72,474.12,"Thank you, Ms. Sarah! Bye, everyone!"]],"OC-Proficiency-Unit57-Wisdom-Traditions":[[0.35,5.69,"Hello, everyone! I'm Ms. Sarah. Welcome to Online Proficiency."],[5.99,9.06,"Hi! I'm Rithy. Let's learn together!"],[9.36,19.12,"Unit fifty-seven: Wisdom Traditions. In this unit, you will compare ancient wisdom traditions in a well-organised essay."],[20.12,21.2,"Stoicism."],[21.9,28.26,"Stoicism means an ancient Greek and Roman philosophy teaching calm acceptance of what we cannot control."],[28.56,32.29,"Stoicism teaches us to focus only on what is within our power."],[32.99,36.02,"Your turn. Say: Stoicism."],[38.72,39.72,"Stoicism."],[40.72,42.38,"Confucian ethics."],[43.08,49.7,"Confucian ethics means Confucius's teachings on duty, family, respect and good government."],[50.0,53.94,"Confucian ethics place great value on respect for elders."],[54.64,58.25,"Your turn. Say: Confucian ethics."],[60.95,62.52,"Confucian ethics."],[63.52,65.03,"Buddhist ethics."],[65.73,72.42,"Buddhist ethics means moral teachings of the Buddha, such as avoiding harm and practising compassion."],[72.72,76.32,"Buddhist ethics guide daily life for most Cambodians."],[77.02,80.09,"Your turn. Say: Buddhist ethics."],[82.79,84.11,"Buddhist ethics."],[85.12,86.31,"Middle Way."],[87.02,91.86,"Middle Way means the Buddha's path between extreme pleasure and extreme self-denial."],[92.16,96.59,"The Middle Way warns against both greed and harsh self-punishment."],[97.28,100.19,"Your turn. Say: Middle Way."],[102.89,103.78,"Middle Way."],[104.78,106.18,"virtue ethics."],[106.88,113.17,"virtue ethics means Aristotle's approach to morality based on developing good character."],[113.47,117.53,"Virtue ethics asks, 'What kind of person should I be?'"],[118.23,121.96,"Your turn. Say: virtue ethics."],[124.66,125.98,"virtue ethics."],[126.98,128.16,"practical wisdom."],[128.86,133.41,"practical wisdom means knowing how to act well in real situations."],[133.71,136.77,"Practical wisdom matters more than memorising rules."],[137.47,140.5,"Your turn. Say: practical wisdom."],[143.2,144.38,"practical wisdom."],[145.38,146.47,"equanimity."],[147.17,152.11,"equanimity means calmness and balance, especially in difficult situations."],[152.41,155.67,"She received the bad news with remarkable equanimity."],[156.37,159.45,"Your turn. Say: equanimity."],[162.15,163.24,"equanimity."],[164.25,165.26,"detachment."],[165.96,170.68,"detachment means freedom from excessive attachment to desires or outcomes."],[170.98,175.09,"Detachment does not mean not caring; it means not clinging."],[175.79,178.91,"Your turn. Say: detachment."],[181.61,182.61,"detachment."],[183.62,185.78,"Now let's listen to a conversation."],[186.08,192.11,"Ms. Sarah, if I wrote an essay comparing Stoicism and Buddhism, how should I structure it?"],[193.42,199.32,"Begin by stating your thesis: both seek peace of mind, but by different routes."],[200.62,203.28,"Then I'd examine each tradition in turn?"],[204.58,209.93,"Better still, compare them point by point: control, suffering, emotion."],[211.22,213.39,"Where would Confucian ethics fit?"],[214.68,221.01,"As a contrasting voice: it focuses less on inner calm and more on social harmony."],[222.32,223.54,"And the conclusion?"],[224.85,229.95,"Draw the threads together: all three offer practical wisdom for an anxious age."],[231.25,235.56,"Grammar focus: Discourse organisation in essays (advanced)."],[235.86,238.23,"Strong essays have a clear architecture."],[238.53,243.06,"Begin by stating your thesis. Then compare the traditions point by point."],[243.36,246.87,"Finally, draw the threads together in your conclusion."],[247.17,254.18,"For comparison essays, a point-by-point structure shows deeper analysis than describing each item separately."],[255.18,258.92,"Now read and listen. Ancient Answers to Modern Anxiety."],[259.21,265.41,"In an age of stress and distraction, ancient wisdom traditions are enjoying a revival."],[266.72,271.98,"This essay compares three of them: Stoicism, Buddhist ethics and Confucian ethics."],[273.28,281.01,"First, Stoicism teaches that we should distinguish between what we can and cannot control, cultivating equanimity."],[282.32,288.77,"Similarly, Buddhist ethics recommends the Middle Way and a form of detachment that frees the mind from craving."],[290.08,297.04,"Confucian ethics, by contrast, emphasises social roles, family duty and harmonious relationships."],[298.35,305.49,"Aristotle's virtue ethics offers a further perspective, focusing on the gradual formation of good character."],[306.78,312.83,"Despite their differences, all of these traditions value practical wisdom over abstract theory."],[314.15,321.13,"In conclusion, they remind us that the good life is built through daily practice, not sudden revelation."],[322.42,325.32,"Quiz time! Choose the correct answer."],[325.62,328.37,"The Buddha's path between extremes is the blank."],[328.67,333.84,"A, Middle Way. B, Stoicism. C, virtue ethics."],[337.85,339.93,"The answer is A: Middle Way."],[341.42,344.48,"Which phrase best introduces a contrasting tradition?"],[344.78,348.7,"A, By contrast. B, Similarly. C, First."],[352.72,355.78,"The answer is A: By contrast."],[357.28,359.91,"A point-by-point structure blank."],[360.21,368.17,"A, compares items under shared headings. B, describes one item only. C, lists random facts."],[372.18,375.97,"The answer is A: compares items under shared headings."],[377.48,381.22,"Calmness and balance in difficult situations is blank."],[381.52,386.48,"A, equanimity. B, detachment. C, practical wisdom."],[390.48,393.2,"The answer is A: equanimity."],[394.72,398.39,"According to the text, what do all these traditions value?"],[398.69,403.36,"A, practical wisdom. B, wealth. C, abstract theory."],[407.35,410.0,"The answer is A: practical wisdom."],[411.48,418.63,"Now it's your turn. Part one: Which ancient wisdom tradition is most useful for students today?"],[423.93,430.39,"Part two: Organise your answer: thesis, two comparison points, conclusion."],[436.69,452.29,"My thesis is that Buddhist ethics is most useful for Cambodian students. First, the Middle Way helps us balance study and rest. By contrast, Stoicism feels more individual. In conclusion, both teach equanimity before exams."],[452.59,454.45,"That is a well-argued answer!"],[455.45,461.46,"Great work today! You learned eight new words and discourse organisation in essays (advanced)."],[461.76,465.86,"Today's value is patience. Wait calmly and take your time."],[466.16,468.94,"See you in Unit fifty-eight. Goodbye!"],[469.24,472.03,"Thank you, Ms. Sarah! Bye, everyone!"]],"OC-Proficiency-Unit58-The-Future-of-Language-Learning":[[0.35,5.42,"Hello, everyone! I'm Ms. Sarah. Welcome to Online Proficiency."],[5.72,8.97,"Hi! I'm Rithy. Let's learn together!"],[9.27,18.7,"Unit fifty-eight: The Future of Language Learning. In this unit, you will paraphrase and summarise views on how languages will be learned."],[19.68,21.22,"language acquisition."],[21.92,27.4,"language acquisition means the natural process of learning a language, especially through exposure."],[27.7,32.24,"Children's language acquisition happens through play and conversation."],[32.94,36.43,"Your turn. Say: language acquisition."],[39.13,40.73,"language acquisition."],[41.72,42.94,"immersion learning."],[43.64,47.77,"immersion learning means learning by being surrounded by the target language."],[48.07,51.57,"Immersion learning in an English camp boosted their confidence."],[52.27,55.6,"Your turn. Say: immersion learning."],[58.3,59.74,"immersion learning."],[60.75,62.54,"AI language partner."],[63.24,69.55,"AI language partner means an artificial intelligence tool that practises conversation with learners."],[69.85,73.75,"An AI language partner is available at midnight before an exam."],[74.45,78.61,"Your turn. Say: AI language partner."],[81.31,83.73,"AI language partner."],[84.72,86.07,"translanguaging."],[86.77,93.64,"translanguaging means using all of one's languages together to learn and communicate."],[93.94,98.69,"Translanguaging lets students explain ideas in Khmer and English."],[99.39,103.01,"Your turn. Say: translanguaging."],[105.71,107.06,"translanguaging."],[108.05,109.34,"plurilingualism."],[110.04,114.92,"plurilingualism means an individual's ability to use several languages flexibly."],[115.22,119.66,"Plurilingualism is normal in much of Asia and Africa."],[120.36,123.68,"Your turn. Say: plurilingualism."],[126.38,127.71,"plurilingualism."],[128.72,130.44,"communicative competence."],[131.14,137.42,"communicative competence means the ability to use language appropriately in real situations."],[137.72,141.95,"Grammar knowledge alone does not guarantee communicative competence."],[142.65,146.17,"Your turn. Say: communicative competence."],[148.87,150.58,"communicative competence."],[151.58,152.99,"learner autonomy."],[153.69,158.25,"learner autonomy means learners taking responsibility for their own learning."],[158.55,162.52,"Learner autonomy grows when students set their own goals."],[163.22,166.62,"Your turn. Say: learner autonomy."],[169.32,170.73,"learner autonomy."],[171.72,173.63,"critical language awareness."],[174.34,179.92,"critical language awareness means understanding how language reflects power and shapes opinions."],[180.22,183.82,"Critical language awareness helps readers spot manipulation."],[184.52,188.52,"Your turn. Say: critical language awareness."],[191.22,193.13,"critical language awareness."],[194.12,196.32,"Now let's listen to a conversation."],[196.62,201.35,"Rithy, will AI make language teachers unnecessary?"],[202.65,207.32,"To put it another way: will machines replace human connection? I doubt it."],[208.62,211.63,"Yet an AI language partner never gets tired."],[212.92,218.31,"True. In short, AI is a tireless practice tool, not a teacher."],[219.62,221.06,"What else will change?"],[222.35,227.62,"Roughly speaking, schools will value plurilingualism rather than a single 'correct' language."],[228.92,231.23,"Summarise your view in one sentence."],[232.52,238.6,"Essentially, technology will support learner autonomy, but people will still inspire learning."],[239.92,244.44,"Grammar focus: Paraphrase and summary (advanced)."],[244.74,247.72,"Paraphrase and summary show mastery."],[248.02,256.57,"To put it another way: will machines replace human connection? In short, AI is a practice tool, not a teacher."],[256.87,259.86,"Essentially, people will still inspire learning."],[260.16,266.95,"When summarising, cut examples and repetition, keep the main claim and reason, and use your own words."],[267.95,271.81,"Now read and listen. Learning Languages in the Age of AI."],[272.11,276.33,"Language learning is changing faster than at any time in history."],[277.62,283.38,"Research on language acquisition shows that meaningful exposure and interaction are essential."],[284.68,292.51,"Traditionally, immersion learning required travel abroad; now, an AI language partner can simulate conversation at home."],[293.82,301.98,"At the same time, teachers increasingly recognise translanguaging, allowing learners to use their first language as a resource."],[303.28,310.79,"The goal is no longer native-speaker perfection but plurilingualism and communicative competence."],[312.08,318.15,"Learner autonomy has become crucial, as students must choose and manage countless digital tools."],[319.45,326.24,"Critical language awareness also matters, since AI-generated text can be persuasive yet inaccurate."],[327.55,336.11,"In short, technology will transform how we learn languages, but human motivation and connection will remain at the heart of learning."],[337.42,340.3,"Quiz time! Choose the correct answer."],[340.6,344.14,"Using all of one's languages together to learn is blank."],[344.44,350.21,"A, translanguaging. B, immersion learning. C, language acquisition."],[354.22,357.13,"The answer is A: translanguaging."],[358.65,361.61,"Which phrase introduces a reformulation?"],[361.91,366.65,"A, To put it another way. B, In addition. C, However."],[370.65,373.45,"The answer is A: To put it another way."],[374.95,376.64,"A good summary should blank."],[376.94,384.61,"A, keep the main claim in your own words. B, copy every sentence. C, add new examples."],[388.62,392.56,"The answer is A: keep the main claim in your own words."],[394.05,397.61,"Learners taking responsibility for their own learning is blank."],[397.9,404.02,"A, learner autonomy. B, plurilingualism. C, communicative competence."],[408.02,410.91,"The answer is A: learner autonomy."],[412.42,415.98,"According to the text, what is the goal no longer?"],[416.28,423.23,"A, native-speaker perfection. B, communicative competence. C, plurilingualism."],[427.25,430.58,"The answer is A: native-speaker perfection."],[432.08,437.52,"Now it's your turn. Part one: How will people learn English in twenty years?"],[442.82,449.4,"Part two: Paraphrase one idea from the reading, then summarise your own view in one sentence."],[455.7,469.81,"To put the reading's idea another way, machines will give us endless practice. However, motivation comes from people. Essentially, the best learners will combine AI tools, real conversation and their own goals."],[470.11,472.53,"That is a well-argued answer!"],[473.52,479.22,"Great work today! You learned eight new words and paraphrase and summary (advanced)."],[479.52,484.12,"Today's value is pride in learning. Be proud of what you learned."],[484.43,487.33,"See you in Unit fifty-nine. Goodbye!"],[487.63,489.9,"Thank you, Ms. Sarah! Bye, everyone!"]],"OC-Proficiency-Unit59-Peace-and-Nonviolence":[[0.35,5.41,"Hello, everyone! I'm Ms. Sarah. Welcome to Online Proficiency."],[5.71,8.77,"Hi! I'm Rithy. Let's learn together!"],[9.07,17.21,"Unit fifty-nine: Peace and Nonviolence. In this unit, you will critically evaluate nonviolent approaches to conflict."],[18.22,19.47,"nonviolence."],[20.17,25.99,"nonviolence means the principle of refusing to use physical force, even against injustice."],[26.29,30.1,"Nonviolence guided Gandhi's struggle for Indian independence."],[30.8,33.92,"Your turn. Say: nonviolence."],[36.62,37.83,"nonviolence."],[38.82,39.8,"pacif
