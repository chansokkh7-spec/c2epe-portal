it ten: Colonialism and Its Legacies. In this unit, you will analyse the lasting effects of colonial history."],[17.68,19.09,"colonial legacy."],[19.79,25.02,"colonial legacy means effects of colonial rule that continue after independence."],[25.32,29.45,"Borders drawn by colonial powers are part of the colonial legacy."],[30.15,33.62,"Your turn. Say: colonial legacy."],[36.32,37.81,"colonial legacy."],[38.82,40.24,"decolonisation."],[40.94,47.65,"decolonisation means the process of colonies gaining independence; also undoing colonial thinking."],[47.95,51.55,"Decolonisation transformed the map of Asia and Africa."],[52.25,55.4,"Your turn. Say: decolonisation."],[58.1,59.38,"decolonisation."],[60.38,61.48,"protectorate."],[62.18,66.99,"protectorate means a territory controlled and 'protected' by a stronger state."],[67.29,72.43,"Cambodia became a French protectorate in 1863."],[73.13,76.36,"Your turn. Say: protectorate."],[79.06,80.04,"protectorate."],[81.05,82.46,"indentured labour."],[83.16,89.95,"indentured labour means work under a contract that bound workers for years, often in harsh conditions."],[90.25,94.5,"Indentured labour moved millions across the British Empire."],[95.2,98.34,"Your turn. Say: indentured labour."],[101.04,102.31,"indentured labour."],[103.32,105.04,"cultural imperialism."],[105.74,110.8,"cultural imperialism means imposing one culture's values on another."],[111.1,115.17,"Critics see cultural imperialism in global media."],[115.87,119.06,"Your turn. Say: cultural imperialism."],[121.75,123.34,"cultural imperialism."],[124.35,125.65,"reparations."],[126.35,129.47,"reparations means compensation for past wrongs."],[129.77,133.6,"Debates about reparations continue in many countries."],[134.3,137.5,"Your turn. Say: reparations."],[140.2,141.33,"reparations."],[142.32,144.07,"neo-colonialism."],[144.77,150.64,"neo-colonialism means indirect control of poorer countries through economic power."],[150.94,154.94,"Some describe unfair trade deals as neo-colonialism."],[155.63,159.11,"Your turn. Say: neo-colonialism."],[161.81,163.17,"neo-colonialism."],[164.18,166.12,"post-colonial identity."],[166.82,173.22,"post-colonial identity means how formerly colonised people define themselves after independence."],[173.53,176.81,"Language choices shape post-colonial identity."],[177.51,181.63,"Your turn. Say: post-colonial identity."],[184.33,186.03,"post-colonial identity."],[187.02,189.11,"Now let's listen to a conversation."],[189.41,195.03,"Ms. Sarah, Cambodia was a French protectorate for ninety years. Does that still matter?"],[196.35,201.87,"It would be hard to argue that it doesn't. Colonial legacies tend to persist in subtle ways."],[203.18,207.32,"Like the French words in Khmer, or the old administrative buildings?"],[208.62,214.0,"Those, certainly. Some historians would also point to borders and legal systems."],[215.28,217.9,"And what about neo-colonialism today?"],[219.18,225.75,"That's more contested. Economic dependence may resemble it, though the analogy shouldn't be pushed too far."],[227.05,230.14,"Should former colonial powers pay reparations?"],[231.45,236.49,"There's a strong moral case, I'd suggest, though the practicalities are formidable."],[237.78,241.33,"Grammar focus: Modality and nuance."],[241.63,244.89,"Modality allows nuanced, careful opinions."],[245.19,253.82,"It would be hard to argue that it doesn't matter. Dependence may resemble neo-colonialism, though the analogy shouldn't be pushed too far."],[254.12,256.29,"There's a strong case, I'd suggest."],[256.59,263.39,"On sensitive historical topics, careful modality allows strong opinions without overstatement."],[264.38,268.05,"Now read and listen. The Long Shadow of Empire."],[268.35,273.91,"Between the sixteenth and twentieth centuries, European powers colonised much of the world."],[275.22,286.12,"In Southeast Asia, Cambodia became a French protectorate in 1863 and gained independence in 1953."],[287.42,294.04,"Decolonisation transformed global politics, creating dozens of new nations within a few decades."],[295.35,301.83,"Yet colonial legacies may persist long after independence, from borders to languages and institutions."],[303.12,308.98,"Systems of indentured labour moved millions of workers across empires, reshaping societies."],[310.28,317.51,"Some scholars argue that economic dependence today resembles neo-colonialism, though others dispute the comparison."],[318.82,324.87,"Debates about reparations and the return of cultural artefacts continue across the world."],[326.18,333.0,"Post-colonial identity, it would seem, involves both reclaiming the past and redefining the future."],[334.32,337.21,"Quiz time! Choose the correct answer."],[337.51,340.05,"Compensation for past wrongs is blank."],[340.35,345.13,"A, reparations. B, protectorate. C, decolonisation."],[349.12,352.0,"The answer is A: reparations."],[353.48,356.04,"Which sentence expresses the most nuance?"],[356.34,362.91,"A, It matters.. B, It would be hard to argue that it doesn't matter.. C, It doesn't matter.."],[366.92,371.3,"The answer is B: It would be hard to argue that it doesn't matter.."],[372.78,375.27,"The comparison blank be pushed too far."],[375.57,379.53,"A, shouldn't. B, mustn't to. C, won't to."],[383.52,385.55,"The answer is A: shouldn't."],[387.05,390.05,"Indirect control through economic power is blank."],[390.35,396.81,"A, neo-colonialism. B, indentured labour. C, colonial legacy."],[400.82,404.34,"The answer is A: neo-colonialism."],[405.85,409.76,"According to the text, when did Cambodia gain independence?"],[410.06,419.35,"A, 1863. B, 1953. C, 1979."],[423.35,426.67,"The answer is B: 1953."],[428.18,435.24,"Now it's your turn. Part one: How does the colonial past still shape the present in Cambodia or elsewhere?"],[440.54,447.48,"Part two: Use careful modality: give two examples and qualify one claim."],[453.78,465.62,"It would be hard to deny some lasting influence. French loanwords and certain legal structures are obvious examples. One might also point to economic patterns, though that link shouldn't be overstated."],[465.92,468.02,"That is a well-argued answer!"],[469.02,474.3,"Great work today! You learned eight new words and modality and nuance."],[474.6,479.73,"Today's value is love of country. Love and take care of Cambodia."],[480.03,482.66,"See you in Unit eleven. Goodbye!"],[482.96,485.89,"Thank you, Ms. Sarah! Bye, everyone!"]],"OC-Proficiency-Unit11-Medicine-and-the-Future":[[0.35,5.09,"Hello, everyone! I'm Ms. Sarah. Welcome to Online Proficiency."],[5.39,8.6,"Hi! I'm Rithy. Let's learn together!"],[8.89,18.11,"Unit eleven: Medicine and the Future. In this unit, you will discuss emerging medical technologies and their implications."],[19.12,20.57,"precision medicine."],[21.27,26.92,"precision medicine means treatment tailored to a patient's genes, environment and lifestyle."],[27.22,30.32,"Precision medicine targets cancer more effectively."],[31.02,34.09,"Your turn. Say: precision medicine."],[36.79,38.3,"precision medicine."],[39.32,40.35,"telemedicine."],[41.05,45.4,"telemedicine means medical care provided remotely by video or phone."],[45.7,48.85,"Telemedicine reaches patients in remote provinces."],[49.55,52.55,"Your turn. Say: telemedicine."],[55.25,56.36,"telemedicine."],[57.35,59.01,"regenerative medicine."],[59.71,64.41,"regenerative medicine means repairing or replacing damaged tissues and organs."],[64.71,68.84,"Regenerative medicine may one day grow new organs."],[69.54,73.33,"Your turn. Say: regenerative medicine."],[76.03,77.59,"regenerative medicine."],[78.58,80.2,"longevity science."],[80.9,85.86,"longevity science means research into extending healthy human life."],[86.16,89.73,"Longevity science attracts billions in investment."],[90.43,94.48,"Your turn. Say: longevity science."],[97.18,98.79,"longevity science."],[99.78,100.89,"biohacking."],[101.59,106.0,"biohacking means self-experimentation to improve the body or mind."],[106.3,109.23,"Biohacking ranges from diets to risky implants."],[109.93,112.31,"Your turn. Say: biohacking."],[115.0,116.06,"biohacking."],[117.05,118.79,"clinical AI."],[119.49,125.34,"clinical AI means artificial intelligence used to support medical diagnosis."],[125.64,129.35,"Clinical AI can detect eye disease in seconds."],[130.05,133.6,"Your turn. Say: clinical AI."],[136.3,137.38,"clinical AI."],[138.38,140.17,"wearable diagnostics."],[140.87,145.79,"wearable diagnostics means devices worn on the body that monitor health."],[146.09,149.28,"Wearable diagnostics can warn of heart problems."],[149.98,153.54,"Your turn. Say: wearable diagnostics."],[156.24,157.96,"wearable diagnostics."],[158.95,160.43,"pharmacogenomics."],[161.13,165.88,"pharmacogenomics means the study of how genes affect responses to medicines."],[166.18,171.05,"Pharmacogenomics explains why drugs work differently for different people."],[171.75,175.99,"Your turn. Say: pharmacogenomics."],[178.69,180.11,"pharmacogenomics."],[181.12,183.26,"Now let's listen to a conversation."],[183.56,187.9,"Rithy, imagine medicine in 2050. What do you see?"],[189.22,193.94,"Treatment designed for you, by you, around you: precision medicine."],[195.25,198.88,"A neat tricolon! Will clinical AI replace doctors?"],[200.18,204.35,"Replace them? No. Assist them? Absolutely."],[205.65,210.19,"And longevity science? Some promise we'll live to a hundred and fifty."],[211.48,215.76,"Live longer, perhaps. But live better? That's the real question."],[217.05,218.55,"What about biohacking?"],[219.85,225.46,"It's not medicine; it's marketing. Not every experiment is progress."],[226.75,230.31,"Grammar focus: Rhetorical devices in argument."],[230.6,233.56,"Rhetorical devices make arguments memorable."],[233.86,241.73,"A tricolon: designed for you, by you, around you. Hypophora: Replace them? No. Assist them? Absolutely."],[242.03,246.11,"Antithesis: It's not medicine; it's marketing."],[246.41,253.59,"Rhetorical devices make arguments memorable; use them to highlight key claims, not to replace evidence."],[254.58,258.0,"Now read and listen. The Medicine of Tomorrow."],[258.3,263.23,"Medicine is entering an era of extraordinary technological change."],[264.52,269.44,"Precision medicine promises treatments tailored to each patient's genetic profile."],[270.75,276.6,"Pharmacogenomics already helps doctors predict how patients will respond to certain drugs."],[277.92,282.71,"Telemedicine and wearable diagnostics are bringing care into homes and villages."],[284.02,290.3,"Clinical AI can analyse scans faster than any human, though it still requires human oversight."],[291.62,297.92,"Regenerative medicine and longevity science raise the prospect of repairing ageing bodies."],[299.22,305.5,"Biohacking, by contrast, often blurs the line between innovation and risky self-experimentation."],[306.82,312.41,"Will these advances serve everyone, or only those who can afford them? That is the defining question."],[313.72,316.49,"Quiz time! Choose the correct answer."],[316.79,319.44,"Medical care provided remotely is blank."],[319.74,325.05,"A, telemedicine. B, biohacking. C, regenerative medicine."],[329.05,331.95,"The answer is A: telemedicine."],[333.45,337.48,"'Veni, vidi, vici' is an example of a blank."],[337.78,342.13,"A, tricolon. B, antithesis. C, euphemism."],[346.12,348.13,"The answer is A: tricolon."],[349.62,353.06,"'It's not a cost; it's an investment' uses blank."],[353.36,357.83,"A, antithesis. B, hypophora. C, tricolon."],[361.85,364.49,"The answer is A: antithesis."],[365.98,369.82,"The study of how genes affect responses to medicines is blank."],[370.12,376.24,"A, pharmacogenomics. B, longevity science. C, clinical AI."],[380.25,383.27,"The answer is A: pharmacogenomics."],[384.78,388.79,"According to the text, what does clinical AI still require?"],[389.09,394.65,"A, human oversight. B, no doctors. C, more patients."],[398.65,401.36,"The answer is A: human oversight."],[402.85,410.08,"Now it's your turn. Part one: Will new medical technologies make healthcare fairer or more unequal?"],[415.38,419.94,"Part two: Use at least two rhetorical devices in a short argument."],[426.24,439.57,"Fairer or more unequal? That depends on policy, not technology. Telemedicine can reach the village, the farm and the floating community. But innovation without access is not progress; it is privilege."],[439.87,442.43,"That is a well-argued answer!"],[443.42,448.81,"Great work today! You learned eight new words and rhetorical devices in argument."],[449.11,453.79,"Today's value is healthy body. Move your body every day."],[454.09,456.79,"See you in Unit twelve. Goodbye!"],[457.09,459.63,"Thank you, Ms. Sarah! Bye, everyone!"]],"OC-Proficiency-Unit12-Art-Value-and-Meaning":[[0.35,5.67,"Hello, everyone! I'm Ms. Sarah. Welcome to Online Proficiency."],[5.97,9.0,"Hi! I'm Rithy. Let's learn together!"],[9.3,16.37,"Unit twelve: Art, Value and Meaning. In this unit, you will debate what gives art its value."],[17.35,18.72,"aesthetic judgement."],[19.42,23.86,"aesthetic judgement means an evaluation of beauty or artistic quality."],[24.16,27.0,"Kant wrote extensively about aesthetic judgement."],[27.7,31.2,"Your turn. Say: aesthetic judgement."],[33.9,35.21,"aesthetic judgement."],[36.22,37.53,"artistic merit."],[38.23,42.58,"artistic merit means the quality that makes a work valuable as art."],[42.88,46.01,"Critics disagreed about the film's artistic merit."],[46.71,50.27,"Your turn. Say: artistic merit."],[52.97,54.22,"artistic merit."],[55.22,56.54,"conceptual art."],[57.24,62.38,"conceptual art means art in which the idea matters more than the object."],[62.68,66.45,"A banana taped to a wall became famous conceptual art."],[67.15,70.62,"Your turn. Say: conceptual art."],[73.32,74.63,"conceptual art."],[75.62,76.59,"provenance."],[77.3,81.47,"provenance means the documented history of an artwork's ownership."],[81.77,84.55,"The museum researched the statue's provenance."],[85.25,88.03,"Your turn. Say: provenance."],[90.73,91.73,"provenance."],[92.75,93.52,"forgery."],[94.22,97.44,"forgery means a fake copy presented as genuine."],[97.74,100.32,"The 'masterpiece' turned out to be a forgery."],[101.02,103.91,"Your turn. Say: forgery."],[106.61,107.57,"forgery."],[108.58,109.82,"art historian."],[110.52,114.91,"art historian means an expert who studies the history of art."],[115.21,118.68,"An art historian dated the carving to the 12th century."],[119.38,122.38,"Your turn. Say: art historian."],[125.08,126.4,"art historian."],[127.38,128.56,"iconography."],[129.26,132.93,"iconography means the symbols used in art and their meanings."],[133.23,136.81,"Angkor's iconography reflects Hindu and Buddhist beliefs."],[137.51,140.73,"Your turn. Say: iconography."],[143.43,144.62,"iconography."],[145.62,146.65,"masterwork."],[147.35,150.03,"masterwork means an artist's finest work."],[150.33,153.6,"The Bayon's faces are a masterwork of Khmer sculpture."],[154.3,157.35,"Your turn. Say: masterwork."],[160.05,161.01,"masterwork."],[162.02,164.25,"Now let's listen to a conversation."],[164.55,167.41,"Ms. Sarah, what makes a painting worth millions?"],[168.72,173.46,"Economists would say rarity; critics would point to artistic merit."],[174.75,179.21,"And conceptual art? A banana taped to a wall sold for thousands."],[180.52,184.75,"Its defenders claim that the idea, not the object, is the art."],[186.05,190.56,"According to one critic I read, it was 'a joke the market took seriously'."],[191.85,197.64,"A memorable line. Provenance matters too: a forgery can fool experts for decades."],[198.95,202.8,"Art historians studying Angkor focus on iconography."],[204.08,209.91,"As they should. The Bayon remains, in the view of many scholars, a true masterwork."],[211.22,214.83,"Grammar focus: Precise reporting and attribution."],[215.13,218.58,"Precise attribution shows whose opinion you are presenting."],[218.88,223.84,"According to one critic, it was a joke. Its defenders claim that the idea is the art."],[224.14,227.84,"In the view of many scholars, the Bayon is a masterwork."],[228.14,234.5,"At C2, always make clear whose opinion you are presenting, especially when you disagree with it."],[235.52,239.14,"Now read and listen. Who Decides What Art Is Worth?."],[239.44,242.64,"The value of art has always been contested."],[243.95,252.82,"In the eighteenth century, Kant argued that aesthetic judgement claims universal validity, even though it is based on feeling."],[254.12,260.3,"Today, the art market assigns prices that sometimes seem to bear little relation to artistic merit."],[261.58,269.13,"Conceptual art has intensified this debate, as its defenders claim that ideas, not objects, carry value."],[270.42,276.35,"Provenance can multiply or destroy a work's price, as cases of forgery have repeatedly shown."],[277.65,284.03,"Art historians, meanwhile, interpret iconography to reveal the beliefs behind ancient works."],[285.32,293.07,"In the view of many scholars, Khmer sculpture at Angkor ranks among humanity's great achievements."],[294.38,300.48,"Perhaps art's deepest value lies not in its price but in its power to change how we see."],[301.78,304.33,"Quiz time! Choose the correct answer."],[304.63,308.31,"The documented history of an artwork's ownership is its blank."],[308.61,313.87,"A, provenance. B, iconography. C, forgery."],[317.88,320.49,"The answer is A: provenance."],[321.98,324.32,"Which phrase attributes an opinion?"],[324.62,330.47,"A, In the view of many critics. B, It is obvious that. C, Everybody knows."],[334.48,337.95,"The answer is A: In the view of many critics."],[339.45,342.55,"blank to the museum, the statue is genuine."],[342.85,346.73,"A, Following. B, According. C, Regarding."],[350.72,352.94,"The answer is B: According."],[354.45,357.96,"A fake copy presented as genuine is a blank."],[358.26,363.18,"A, forgery. B, masterwork. C, conceptual art."],[367.18,369.29,"The answer is A: forgery."],[370.78,375.23,"According to the text, what did Kant argue about aesthetic judgement?"],[375.53,381.81,"A, it is purely economic. B, it claims universal validity. C, it is meaningless."],[385.82,389.65,"The answer is B: it claims universal validity."],[391.15,395.97,"Now it's your turn. Part one: What gives a work of art its value?"],[401.27,406.51,"Part two: Attribute two opinions to others, then give your own view."],[412.81,427.88,"Economists argue that rarity and demand set the price, while critics contend that artistic merit is what matters. In my view, value lies in a work's capacity to change how we see the world, which is why Angkor's carvings still move visitors today."],[428.18,430.65,"That is a well-argued answer!"],[431.65,436.72,"Great work today! You learned eight new words and precise reporting and attribution."],[437.02,441.24,"Today's value is creativity. Use your imagination when you play."],[441.54,444.94,"See you in Unit thirteen. Goodbye!"],[445.24,448.18,"Thank you, Ms. Sarah! Bye, everyone!"]],"OC-Proficiency-Unit13-Economics-of-the-Future":[[0.35,5.09,"Hello, everyone! I'm Ms. Sarah. Welcome to Online Proficiency."],[5.39,8.57,"Hi! I'm Rithy. Let's learn together!"],[8.87,16.68,"Unit thirteen: Economics of the Future. In this unit, you will debate alternative visions of economic progress."],[17.68,18.81,"post-growth."],[19.51,26.32,"post-growth means describing an economy focused on wellbeing rather than constant expansion."],[26.62,30.95,"Post-growth thinkers question GDP as the measure of success."],[31.65,34.69,"Your turn. Say: post-growth."],[37.39,38.53,"post-growth."],[39.52,40.33,"degrowth."],[41.03,45.98,"degrowth means a planned reduction of production and consumption in rich countries."],[46.28,49.36,"Degrowth remains controversial among economists."],[50.06,53.65,"Your turn. Say: degrowth."],[56.35,57.21,"degrowth."],[58.22,60.01,"circular economy model."],[60.71,66.67,"circular economy model means a system that reuses and recycles materials instead of wasting them."],[66.97,70.28,"The circular economy model designs out waste."],[70.98,74.34,"Your turn. Say: circular economy model."],[77.04,78.84,"circular economy model."],[79.85,82.05,"universal basic services."],[82.75,89.42,"universal basic services means free public provision of essentials such as health, education and transport."],[89.72,92.87,"Universal basic services could reduce inequality."],[93.57,97.72,"Your turn. Say: universal basic services."],[100.42,102.49,"universal basic services."],[103.48,105.09,"automation dividend."],[105.79,112.01,"automation dividend means the extra wealth produced by automation, potentially shared with society."],[112.31,114.74,"Who should receive the automation dividend?"],[115.44,118.65,"Your turn. Say: automation dividend."],[121.35,123.03,"automation dividend."],[124.02,125.42,"digital currency."],[126.12,130.13,"digital currency means money that exists only in electronic form."],[130.43,133.64,"Several central banks are testing a digital currency."],[134.34,137.46,"Your turn. Say: digital currency."],[140.16,141.42,"digital currency."],[142.42,143.51,"central bank."],[144.21,150.35,"central bank means the national institution that controls money supply and interest rates."],[150.66,153.11,"The central bank raised interest rates."],[153.81,156.87,"Your turn. Say: central bank."],[159.57,160.78,"central bank."],[161.78,163.41,"quantitative easing."],[164.11,169.86,"quantitative easing means a central bank buying assets to inject money into the economy."],[170.16,174.78,"Quantitative easing was used after the 2008 crisis."],[175.48,179.15,"Your turn. Say: quantitative easing."],[181.85,183.43,"quantitative easing."],[184.42,186.6,"Now let's listen to a conversation."],[186.9,189.18,"Rithy, must economies always grow?"],[190.48,194.15,"Most economists would say so. Degrowth advocates wouldn't."],[195.45,196.43,"Why not?"],[197.72,205.03,"Because, they argue, endless growth on a finite planet is impossible. Wellbeing, not output, should be the goal."],[206.32,208.28,"And the circular economy model?"],[209.58,214.65,"More widely accepted. Waste it designs out; value it keeps in use."],[215.95,220.08,"What about money itself? Central banks are testing digital currencies."],[221.38,225.85,"Some already have. Others will, I suspect, sooner rather than later."],[227.15,231.29,"Grammar focus: Ellipsis, substitution and fronting."],[231.59,236.34,"Combine ellipsis, substitution and fronting for elegant contrast."],[236.64,240.38,"Most economists would say so. Degrowth advocates wouldn't."],[240.68,244.35,"Waste it designs out; value it keeps in use."],[244.65,250.66,"Combining fronting with ellipsis creates elegant, balanced contrasts typical of skilled writers."],[251.65,254.43,"Now read and listen. Beyond Growth?."],[254.73,260.01,"For decades, economic success has been measured mainly by growth in GDP."],[261.32,267.37,"Growth has lifted billions out of poverty; whether it can continue indefinitely, many now doubt."],[268.68,273.79,"Post-growth economists argue that rich countries should prioritise wellbeing over output."],[275.08,279.66,"Degrowth advocates go further, calling for planned reductions in consumption."],[280.95,287.53,"Critics reply that poorer countries need growth, and that technology can decouple it from emissions."],[288.85,295.54,"The circular economy model offers a middle path, keeping materials in use rather than discarding them."],[296.85,305.51,"Meanwhile, central banks, having used quantitative easing after 2008, are now experimenting with digital currencies."],[306.82,312.31,"The economy of the future, whatever its shape, will need to serve both people and planet."],[313.62,316.51,"Quiz time! Choose the correct answer."],[316.81,320.12,"A central bank buying assets to inject money is blank."],[320.42,325.89,"A, quantitative easing. B, degrowth. C, digital currency."],[329.88,332.87,"The answer is A: quantitative easing."],[334.38,337.51,"'Will prices rise?' 'I expect blank.'"],[337.81,340.68,"A, it. B, so. C, that."],[344.68,346.51,"The answer is B: so."],[348.02,351.4,"Some countries have adopted it; others haven't blank."],[351.7,354.38,"A, yet. B, it. C, done."],[358.38,360.48,"The answer is A: yet."],[361.98,366.57,"A system that reuses materials instead of wasting them is the blank."],[366.87,371.96,"A, circular economy model. B, post-growth. C, central bank."],[375.95,379.06,"The answer is A: circular economy model."],[380.55,384.33,"According to the text, what do critics say poorer countries need?"],[384.63,390.15,"A, degrowth. B, growth. C, less technology."],[394.15,396.37,"The answer is B: growth."],[397.88,403.45,"Now it's your turn. Part one: Should rich countries stop pursuing economic growth?"],[408.75,414.32,"Part two: Use ellipsis or fronting to contrast two views, then conclude."],[420.62,432.9,"Degrowth advocates say they should; most economists say they shouldn't. Growth poor countries need; wealthy ones may not, at least not in its current form. I'd favour greener growth over no growth at all."],[433.2,435.66,"That is a well-argued answer!"],[436.65,442.15,"Great work today! You learned eight new words and ellipsis, substitution and fronting."],[442.45,447.8,"Today's value is responsibility. Help at home and do your jobs."],[448.1,450.84,"See you in Unit fourteen. Goodbye!"],[451.14,453.89,"Thank you, Ms. Sarah! Bye, everyone!"]],"OC-Proficiency-Unit14-Freedom-and-Its-Limits":[[0.35,4.91,"Hello, everyone! I'm Ms. Sarah. Welcome to Online Proficiency."],[5.21,8.43,"Hi! I'm Rithy. Let's learn together!"],[8.73,17.04,"Unit fourteen: Freedom and Its Limits. In this unit, you will examine the philosophical limits of individual freedom."],[18.05,19.41,"negative liberty."],[20.11,23.67,"negative liberty means freedom from interference by others."],[23.97,27.03,"Negative liberty protects us from state control."],[27.73,30.76,"Your turn. Say: negative liberty."],[33.46,34.81,"negative liberty."],[35.82,37.19,"positive liberty."],[37.89,42.44,"positive liberty means the freedom and ability to achieve one's goals."],[42.74,45.34,"Education expands positive liberty."],[46.03,49.69,"Your turn. Say: positive liberty."],[52.38,53.68,"positive liberty."],[54.68,55.95,"harm principle."],[56.65,62.83,"harm principle means Mill's idea that freedom may be limited only to prevent harm to others."],[63.13,66.73,"The harm principle justifies seatbelt laws only partly."],[67.43,70.48,"Your turn. Say: harm principle."],[73.18,74.33,"harm principle."],[75.32,76.35,"paternalism."],[77.05,81.36,"paternalism means limiting people's freedom supposedly for their own good."],[81.66,85.31,"Banning sugary drinks is accused of paternalism."],[86.01,89.19,"Your turn. Say: paternalism."],[91.89,92.91,"paternalism."],[93.92,95.38,"civil disobedience."],[96.08,102.08,"civil disobedience means peacefully breaking unjust laws as a protest."],[102.38,106.13,"Gandhi's salt march was an act of civil disobedience."],[106.83,110.37,"Your turn. Say: civil disobedience."],[113.07,114.67,"civil disobedience."],[115.68,117.27,"conscientious objection."],[117.97,122.67,"conscientious objection means refusing to take part in something for moral reasons."],[122.97,127.94,"Conscientious objection to military service is recognised in some countries."],[128.64,132.46,"Your turn. Say: conscientious objection."],[135.16,136.81,"conscientious objection."],[137.82,139.21,"libertarianism."],[139.91,146.1,"libertarianism means a philosophy prioritising individual freedom and minimal government."],[146.4,149.42,"Libertarianism opposes most taxation."],[150.12,153.71,"Your turn. Say: libertarianism."],[156.41,157.63,"libertarianism."],[158.62,160.12,"social liberalism."],[160.82,167.85,"social liberalism means a view combining individual freedom with social support."],[168.16,171.22,"Social liberalism supports public healthcare."],[171.92,175.3,"Your turn. Say: social liberalism."],[178.0,179.5,"social liberalism."],[180.48,182.67,"Now let's listen to a conversation."],[182.97,186.73,"Ms. Sarah, should people be free to do anything that doesn't hurt others?"],[188.02,193.4,"That's Mill's harm principle. Attractive though it is, it raises hard questions."],[194.68,195.53,"Such as?"],[196.85,203.88,"Whether seatbelt laws are justified. They protect the driver, admittedly, yet they limit freedom."],[205.18,206.71,"Isn't that paternalism?"],[208.02,213.35,"It is. Even so, most people accept it. Libertarians don't, of course."],[214.65,216.59,"And breaking unjust laws?"],[217.88,223.62,"Civil disobedience can be justified, albeit at a personal cost to those who practise it."],[224.92,228.03,"Grammar focus: Concession and contrast."],[228.33,231.44,"Sophisticated concession shows balanced thinking."],[231.75,240.45,"Attractive though it is, the principle raises hard questions. It can be justified, albeit at a personal cost."],[240.75,244.75,"Admittedly, yet and even so also signal concession."],[245.05,250.46,"Fronted concessive clauses ('Attractive though it is') are a hallmark of polished C2 argument."],[251.45,254.22,"Now read and listen. How Free Should We Be?."],[254.52,259.26,"Philosopher Isaiah Berlin distinguished two concepts of liberty."],[260.55,267.62,"Negative liberty means freedom from interference; positive liberty means the capacity to pursue one's goals."],[268.92,276.08,"John Stuart Mill's harm principle holds that society may restrict freedom only to prevent harm to others."],[277.38,281.91,"Simple though it sounds, the principle is difficult to apply in practice."],[283.22,290.96,"Laws on seatbelts or smoking are often criticised as paternalism, albeit popular paternalism."],[292.25,301.0,"Libertarianism emphasises negative liberty, while social liberalism seeks to expand positive liberty through public services."],[302.28,308.49,"Civil disobedience and conscientious objection test the limits of a citizen's duty to obey."],[309.78,316.73,"Freedom, admittedly, is cherished everywhere; yet its boundaries remain endlessly contested."],[318.02,320.5,"Quiz time! Choose the correct answer."],[320.8,322.79,"Freedom from interference is blank."],[323.09,328.18,"A, negative liberty. B, positive liberty. C, paternalism."],[332.18,334.59,"The answer is A: negative liberty."],[336.08,338.81,"blank it may seem, the idea is complex."],[339.11,345.02,"A, Simple as. B, As simple. C, Simple so."],[349.02,351.64,"The answer is A: Simple as."],[353.15,354.82,"The plan worked, blank slowly."],[355.12,359.89,"A, albeit. B, although it. C, despite."],[363.88,366.05,"The answer is A: albeit."],[367.55,370.92,"Peacefully breaking unjust laws as protest is blank."],[371.22,376.97,"A, civil disobedience. B, libertarianism. C, harm principle."],[380.98,384.25,"The answer is A: civil disobedience."],[385.75,389.93,"According to the text, who distinguished two concepts of liberty?"],[390.23,393.9,"A, Mill. B, Isaiah Berlin. C, Gandhi."],[397.88,400.5,"The answer is B: Isaiah Berlin."],[401.98,407.93,"Now it's your turn. Part one: Should governments limit freedom to protect people from themselves?"],[413.23,418.02,"Part two: Use two concessive structures to present a balanced view."],[424.32,440.05,"Paternalistic though it may be, some regulation is justified, for example on seatbelts. Admittedly, it restricts choice; even so, the social cost of injuries affects everyone. Such laws should remain limited, albeit not abolished."],[440.35,442.32,"That is a well-argued answer!"],[443.32,448.12,"Great work today! You learned eight new words and concession and contrast."],[448.42,452.09,"Today's value is respect. Thank the people who help us."],[452.39,455.53,"See you in Unit fifteen. Goodbye!"],[455.83,459.77,"Thank you, Ms. Sarah! Bye, everyone!"]],"OC-Proficiency-Unit15-Science-and-Society":[[0.35,5.26,"Hello, everyone! I'm Ms. Sarah. Welcome to Online Proficiency."],[5.56,8.77,"Hi! I'm Rithy. Let's learn together!"],[9.07,17.17,"Unit fifteen: Science and Society. In this unit, you will discuss how science progresses and serves society."],[18.18,19.93,"scientific revolution."],[20.63,25.89,"scientific revolution means a period of fundamental change in scientific thinking."],[26.19,30.09,"The scientific revolution transformed our view of the universe."],[30.79,34.44,"Your turn. Say: scientific revolution."],[37.14,38.87,"scientific revolution."],[39.85,41.13,"paradigm shift."],[41.83,46.64,"paradigm shift means a fundamental change in the basic assumptions of a field."],[46.94,51.21,"Einstein's relativity caused a paradigm shift in physics."],[51.91,55.1,"Your turn. Say: paradigm shift."],[57.8,59.15,"paradigm shift."],[60.15,61.69,"research ethics."],[62.38,67.23,"research ethics means moral principles guiding scientific research."],[67.53,71.36,"Research ethics require informed consent from participants."],[72.06,75.75,"Your turn. Say: research ethics."],[78.45,79.68,"research ethics."],[80.68,81.87,"open science."],[82.57,87.95,"open science means making research data and results freely available."],[88.25,90.58,"Open science speeds up discovery."],[91.28,94.17,"Your turn. Say: open science."],[96.87,98.16,"open science."],[99.15,100.7,"citizen science."],[101.4,105.38,"citizen science means research involving members of the public."],[105.68,109.04,"Birdwatchers contribute to citizen science projects."],[109.74,113.1,"Your turn. Say: citizen science."],[115.8,117.25,"citizen science."],[118.25,120.02,"scientific integrity."],[120.72,125.92,"scientific integrity means honesty and rigour in conducting research."],[126.22,129.64,"Falsifying data violates scientific integrity."],[130.34,134.08,"Your turn. Say: scientific integrity."],[136.78,138.56,"scientific integrity."],[139.55,141.05,"conflict of interest."],[141.75,147.65,"conflict of interest means a situation where personal gain may influence judgement."],[147.95,151.16,"Researchers must declare any conflict of interest."],[151.86,155.44,"Your turn. Say: conflict of interest."],[158.14,159.72,"conflict of interest."],[160.72,162.17,"peer review process."],[162.87,168.93,"peer review process means evaluation of research by independent experts before publication."],[169.23,171.73,"The peer review process took six months."],[172.43,176.2,"Your turn. Say: peer review process."],[178.9,180.34,"peer review process."],[181.35,183.53,"Now let's listen to a conversation."],[183.84,189.74,"Rithy, Thomas Kuhn argued that science advances through paradigm shifts. Do you agree?"],[191.05,196.95,"Largely. The word 'revolution' carries real weight there; it isn't just steady progress."],[198.25,203.92,"Interesting choice of word. 'Revolution' has a much stronger connotation than 'development'."],[205.22,210.33,"Exactly. Copernicus didn't merely refine astronomy; he overturned it."],[211.62,214.29,"What threatens scientific integrity today?"],[215.58,221.43,"Conflicts of interest, for one. When industry funds research, doubts naturally arise."],[222.72,224.1,"And open science?"],[225.42,229.4,"It sheds light on hidden methods. Transparency breeds trust."],[230.72,233.99,"Grammar focus: Collocation and connotation."],[234.29,238.96,"At C2, collocation and connotation make your language precise."],[239.26,244.38,"The word carries real weight. Open science sheds light on hidden methods."],[244.68,248.28,"Revolution has a stronger connotation than development."],[248.58,257.64,"At C2, choose words for their connotations as well as their meanings: 'stubborn' and 'determined' describe similar behaviour very differently."],[258.65,261.86,"Now read and listen. How Science Changes."],[262.16,267.04,"Philosopher Thomas Kuhn argued that science does not progress in a straight line."],[268.35,274.08,"Instead, long periods of normal science are interrupted by scientific revolutions."],[275.38,280.45,"During a paradigm shift, the basic assumptions of a field are overturned."],[281.75,286.55,"The move from an Earth-centred to a Sun-centred universe is a classic example."],[287.85,295.23,"Today, science faces new challenges to its credibility, from conflicts of interest to failures of replication."],[296.52,302.7,"The peer review process, though imperfect, remains a cornerstone of scientific integrity."],[303.98,310.32,"Open science and citizen science are helping to make research more transparent and inclusive."],[311.62,316.35,"Trust in science, it seems, must be earned through openness rather than authority."],[317.65,320.35,"Quiz time! Choose the correct answer."],[320.65,324.49,"A fundamental change in a field's assumptions is a blank."],[324.79,330.68,"A, paradigm shift. B, conflict of interest. C, citizen science."],[334.68,337.31,"The answer is A: paradigm shift."],[338.82,341.06,"The evidence blank light on the problem."],[341.36,344.5,"A, sheds. B, gives. C, makes."],[348.52,350.99,"The answer is A: sheds."],[352.48,355.61,"Which word has the most positive connotation?"],[355.91,360.18,"A, stubborn. B, determined. C, obstinate."],[364.18,366.53,"The answer is B: determined."],[368.02,372.4,"Evaluation of research by independent experts is the blank."],[372.7,377.81,"A, peer review process. B, research ethics. C, open science."],[381.82,384.68,"The answer is A: peer review process."],[386.18,389.24,"According to Kuhn, how does science progress?"],[389.54,396.19,"A, in a straight line. B, through scientific revolutions. C, randomly."],[400.18,403.66,"The answer is B: through scientific revolutions."],[405.15,410.35,"Now it's your turn. Part one: How can the public's trust in science be strengthened?"],[415.64,421.3,"Part two: Use three collocations and comment on the connotation of one key word."],[427.6,441.65,"Open science sheds light on methods, and declaring conflicts of interest breeds trust. Scientists should also avoid the word 'proof' in public; it carries a connotation of finality that science rarely claims."],[441.95,444.44,"That is a well-argued answer!"],[445.45,450.36,"Great work today! You learned eight new words and collocation and connotation."],[450.65,454.15,"Today's value is honesty. Always tell the truth."],[454.45,457.32,"See you in Unit sixteen. Goodbye!"],[457.62,460.06,"Thank you, Ms. Sarah! Bye, everyone!"]],"OC-Proficiency-Unit16-Religion-and-Modernity":[[0.35,5.0,"Hello, everyone! I'm Ms. Sarah. Welcome to Online Proficiency."],[5.3,8.53,"Hi! I'm Rithy. Let's learn together!"],[8.83,19.52,"Unit sixteen: Religion and Modernity. In this unit, you will discuss religion, tradition and modern society respectfully."],[20.52,21.66,"secularism."],[22.36,27.25,"secularism means the separation of religion from state institutions."],[27.55,30.82,"Secularism takes different forms in different countries."],[31.52,34.37,"Your turn. Say: secularism."],[37.07,38.28,"secularism."],[39.28,40.83,"religious pluralism."],[41.53,47.65,"religious pluralism means the peaceful coexistence of many religions in one society."],[47.95,51.11,"Religious pluralism requires mutual respect."],[51.81,55.39,"Your turn. Say: religious pluralism."],[58.09,59.84,"religious pluralism."],[60.85,62.28,"interfaith dialogue."],[62.98,68.86,"interfaith dialogue means conversation and cooperation between different religions."],[69.16,71.73,"Interfaith dialogue builds understanding."],[72.43,76.05,"Your turn. Say: interfaith dialogue."],[78.75,80.49,"interfaith dialogue."],[81.48,82.78,"Theravada Buddhism."],[83.47,89.47,"Theravada Buddhism means the school of Buddhism followed in Cambodia, Thailand and Sri Lanka."],[89.77,92.93,"Theravada Buddhism is Cambodia's state religion."],[93.63,96.58,"Your turn. Say: Theravada Buddhism."],[99.28,100.6,"Theravada Buddhism."],[101.58,103.06,"monastic tradition."],[103.76,109.03,"monastic tradition means the way of life of monks and religious communities."],[109.33,112.62,"The monastic tradition preserves ancient texts."],[113.32,116.9,"Your turn. Say: monastic tradition."],[119.6,121.02,"monastic tradition."],[122.02,123.33,"ritual practice."],[124.03,128.21,"ritual practice means formal religious or cultural ceremonies."],[128.51,131.73,"Ritual practice marks births, weddings and funerals."],[132.43,135.9,"Your turn. Say: ritual practice."],[138.6,140.04,"ritual practice."],[141.05,142.47,"sacred space."],[143.17,146.14,"sacred space means a place considered holy."],[146.44,149.57,"A pagoda is a sacred space for the community."],[150.27,153.5,"Your turn. Say: sacred space."],[156.2,157.57,"sacred space."],[158.58,160.75,"spiritual but not religious."],[161.44,167.51,"spiritual but not religious means having spiritual beliefs without belonging to an organised religion."],[167.81,172.38,"Many young people describe themselves as spiritual but not religious."],[173.09,177.32,"Your turn. Say: spiritual but not religious."],[180.02,182.39,"spiritual but not religious."],[183.38,185.67,"Now let's listen to a conversation."],[185.97,188.93,"Ms. Sarah, is religion declining in the modern world?"],[190.22,196.38,"In some countries, yes. Be that as it may, globally the picture is far more complex."],[197.68,201.6,"In Cambodia, Theravada Buddhism remains central to daily life."],[202.88,209.69,"Indeed. The pagoda is a sacred space, and the monastic tradition shapes education and ethics."],[210.98,215.31,"Many of my friends say they're spiritual but not religious."],[216.62,222.03,"A growing trend. Suffice it to say that belief is changing rather than disappearing."],[223.32,226.68,"How can societies with many faiths live peacefully?"],[227.98,233.54,"Through interfaith dialogue and respect. Come what may, pluralism depends on listening."],[234.85,239.0,"Grammar focus: Subjunctive and fixed formal expressions."],[239.3,242.39,"Some fixed expressions preserve the old subjunctive."],[242.69,248.2,"Be that as it may, the picture is complex. Suffice it to say that belief is changing."],[248.5,251.5,"Come what may, pluralism depends on listening."],[251.79,258.01,"These fixed subjunctive expressions are formal and slightly literary; use them sparingly for effect."],[259.02,262.27,"Now read and listen. Faith in a Changing World."],[262.57,268.07,"Sociologists once predicted that modernisation would lead to the steady decline of religion."],[269.38,274.46,"Be that as it may, religion remains a powerful force across much of the world."],[275.75,281.39,"In Cambodia, Theravada Buddhism shapes festivals, ethics and community life."],[282.68,288.33,"The monastic tradition has historically provided education as well as spiritual guidance."],[289.62,295.38,"Elsewhere, secularism separates religious institutions from the state in varying degrees."],[296.68,301.64,"A growing number of people describe themselves as spiritual but not religious."],[302.95,309.99,"Religious pluralism, supported by interfaith dialogue, allows diverse communities to coexist."],[311.28,318.39,"Suffice it to say that the relationship between faith and modernity is one of transformation rather than simple decline."],[319.68,322.42,"Quiz time! Choose the correct answer."],[322.72,325.67,"The separation of religion from the state is blank."],[325.97,331.7,"A, secularism. B, ritual practice. C, sacred space."],[335.72,338.22,"The answer is A: secularism."],[339.72,342.82,"'blank that as it may, we must continue.'"],[343.12,346.31,"A, Be. B, Being. C, Is."],[350.32,352.52,"The answer is A: Be."],[354.02,357.32,"'blank it to say, the results were disappointing.'"],[357.62,362.35,"A, Suffice. B, Sufficient. C, Suffices."],[366.35,368.52,"The answer is A: Suffice."],[370.02,372.77,"Conversation between different religions is blank."],[373.07,379.71,"A, interfaith dialogue. B, monastic tradition. C, religious pluralism."],[383.72,386.77,"The answer is A: interfaith dialogue."],[388.28,392.51,"According to the text, what did sociologists once predict?"],[392.81,399.19,"A, religion would decline. B, religion would grow. C, nothing would change."],[403.18,405.95,"The answer is A: religion would decline."],[407.45,414.86,"Now it's your turn. Part one: What role does religion or spirituality play in modern Cambodian society?"],[420.16,426.14,"Part two: Use one fixed subjunctive expression; describe two roles respectfully."],[432.44,448.23,"Be that as it may, modern life has changed, yet the pagoda remains central. It offers ethical guidance and community, especially during festivals. Suffice it to say that Buddhism continues to shape how many Cambodians understand kindness and merit."],[448.53,451.17,"That is a well-argued answer!"],[452.18,457.49,"Great work today! You learned eight new words and subjunctive and fixed formal expressions."],[457.79,462.15,"Today's value is respect for culture. Be proud of our Khmer culture."],[462.45,465.58,"See you in Unit seventeen. Goodbye!"],[465.88,469.12,"Thank you, Ms. Sarah! Bye, everyone!"]],"OC-Proficiency-Unit17-Urban-Inequality":[[0.35,5.15,"Hello, everyone! I'm Ms. Sarah. Welcome to Online Proficiency."],[5.45,8.41,"Hi! I'm Rithy. Let's learn together!"],[8.71,17.63,"Unit seventeen: Urban Inequality. In this unit, you will analyse inequality within cities and how to address it."],[18.62,20.27,"spatial inequality."],[20.97,26.61,"spatial inequality means unequal access to resources based on where people live."],[26.91,30.52,"Spatial inequality separates rich and poor neighbourhoods."],[31.21,34.82,"Your turn. Say: spatial inequality."],[37.52,39.17,"spatial inequality."],[40.18,41.74,"gated community."],[42.44,48.41,"gated community means a residential area with controlled entrances, usually for the wealthy."],[48.71,52.24,"New gated communities are appearing on the city's edge."],[52.94,56.27,"Your turn. Say: gated community."],[58.97,60.32,"gated community."],[61.32,62.6,"urban poverty."],[63.3,68.34,"urban poverty means poverty experienced by people living in cities."],[68.64,72.26,"Urban poverty is often hidden behind modern skylines."],[72.96,76.0,"Your turn. Say: urban poverty."],[78.7,79.94,"urban poverty."],[80.95,81.92,"eviction."],[82.62,85.67,"eviction means forcing people to leave their homes."],[85.97,89.21,"Families faced eviction when the land was sold."],[89.91,92.88,"Your turn. Say: eviction."],[95.58,96.45,"eviction."],[97.45,98.86,"slum upgrading."],[99.56,103.9,"slum upgrading means improving informal settlements instead of demolishing them."],[104.2,108.06,"Slum upgrading brings water and sanitation to residents."],[108.76,112.32,"Your turn. Say: slum upgrading."],[115.02,116.68,"slum upgrading."],[117.68,118.93,"right to the city."],[119.63,124.83,"right to the city means the idea that all residents should shape and benefit from urban life."],[125.13,127.84,"Activists campaign for the right to the city."],[128.54,132.18,"Your turn. Say: right to the city."],[134.88,136.18,"right to the city."],[137.18,139.25,"housing affordability crisis."],[139.95,145.95,"housing affordability crisis means a situation where homes are too expensive for most residents."],[146.25,150.08,"The housing affordability crisis affects young workers most."],[150.78,154.93,"Your turn. Say: housing affordability crisis."],[157.63,160.05,"housing affordability crisis."],[161.05,162.51,"urban displacement."],[163.22,166.83,"urban displacement means people being pushed out of their neighbourhoods."],[167.13,170.64,"Urban displacement often follows rising land prices."],[171.34,175.05,"Your turn. Say: urban displacement."],[177.75,179.2,"urban displacement."],[180.22,182.36,"Now let's listen to a conversation."],[182.66,187.51,"Rithy, let's structure this like an essay. First, what is the core problem?"],[188.82,195.38,"To begin with, spatial inequality: services and opportunities are concentrated in a few areas."],[196.68,198.86,"Good. And the second dimension?"],[200.15,205.15,"Turning to housing, the affordability crisis pushes low-income families to the edges."],[206.45,207.83,"Which leads to?"],[209.15,213.8,"Urban displacement, and in some cases eviction without adequate compensation."],[215.08,216.86,"What solutions would you weigh?"],[218.15,226.96,"On balance, slum upgrading seems more humane than demolition. In conclusion, the right to the city must include everyone."],[228.25,231.6,"Grammar focus: Discourse organisation in essays."],[231.9,233.94,"Essays need clear signposting."],[234.24,243.2,"To begin with introduces the first point; turning to moves to a new topic; on balance evaluates; in conclusion closes."],[243.5,246.11,"Vary your markers to keep writing fluent."],[246.41,253.46,"Clear signposting helps readers follow long academic arguments; vary your markers to avoid repetition."],[254.45,257.26,"Now read and listen. Two Cities in One."],[257.56,262.56,"Many rapidly growing cities contain striking contrasts of wealth and poverty."],[263.85,270.26,"To begin with, spatial inequality concentrates schools, hospitals and jobs in central districts."],[271.55,278.15,"Turning to housing, rising land values have created an affordability crisis for ordinary workers."],[279.45,284.53,"As a result, urban displacement pushes low-income families towards the periphery."],[285.82,292.68,"Gated communities, meanwhile, allow wealthier residents to separate themselves from public problems."],[293.98,301.22,"Slum upgrading, which improves informal settlements in place, has often proved more effective than eviction."],[302.52,308.17,"The concept of the right to the city argues that all residents deserve a voice in urban development."],[309.48,316.27,"On balance, inclusive planning appears essential if cities are to remain both prosperous and just."],[317.55,320.3,"Quiz time! Choose the correct answer."],[320.6,323.19,"Forcing people to leave their homes is blank."],[323.49,328.52,"A, eviction. B, slum upgrading. C, gated community."],[332.52,334.57,"The answer is A: eviction."],[336.08,338.78,"Which marker introduces a new topic?"],[339.08,343.29,"A, Turning to. B, In conclusion. C, As a result."],[347.28,349.74,"The answer is A: Turning to."],[351.25,353.71,"Which marker shows final evaluation?"],[354.01,357.97,"A, To begin with. B, On balance. C, Turning to."],[361.98,364.37,"The answer is B: On balance."],[365.85,369.76,"Improving informal settlements instead of demolishing them is blank."],[370.06,376.61,"A, slum upgrading. B, urban displacement. C, spatial inequality."],[380.62,383.79,"The answer is A: slum upgrading."],[385.28,389.38,"According to the text, what has often proved more effective than eviction?"],[389.68,395.78,"A, gated communities. B, slum upgrading. C, higher rents."],[399.78,402.62,"The answer is B: slum upgrading."],[404.12,409.01,"Now it's your turn. Part one: How can cities become fairer places to live?"],[414.31,420.07,"Part two: Organise your answer like a short essay with at least three discourse markers."],[426.37,443.1,"To begin with, cities must improve services in poorer districts. Turning to housing, public rental homes could ease the affordability crisis. On balance, upgrading existing communities is fairer than moving them, so in conclusion, inclusion should guide planning."],[443.4,445.64,"That is a well-argued answer!"],[446.65,452.32,"Great work today! You learned eight new words and discourse organisation in essays."],[452.62,456.79,"Today's value is community. Help the people in your town."],[457.09,459.99,"See you in Unit eighteen. Goodbye!"],[460.29,463.52,"Thank you, Ms. Sarah! Bye, everyone!"]],"OC-Proficiency-Unit18-Communication-in-the-Digital-Age":[[0.35,5.46,"Hello, everyone! I'm Ms. Sarah. Welcome to Online Proficiency."],[5.75,8.8,"Hi! I'm Rithy. Let's learn together!"],[9.1,18.41,"Unit eighteen: Communication in the Digital Age. In this unit, you will analyse how digital media change communication."],[19.42,20.37,"filter bubble."],[21.07,26.55,"filter bubble means an online space where you only see views similar to your own."],[26.85,29.59,"Filter bubbles can reinforce prejudices."],[30.29,33.37,"Your turn. Say: filter bubble."],[36.07,37.07,"filter bubble."],[38.08,39.62,"algorithmic curation."],[40.32,44.51,"algorithmic curation means computer selection of the content you see."],[44.81,47.54,"Algorithmic curation decides your news feed."],[48.24,51.7,"Your turn. Say: algorithmic curation."],[54.4,56.44,"algorithmic curation."],[57.45,58.56,"virality."],[59.26,63.09,"virality means the tendency of content to spread rapidly online."],[63.39,66.43,"Virality rewards emotion over accuracy."],[67.13,70.0,"Your turn. Say: virality."],[72.69,73.73,"virality."],[74.72,76.02,"digital etiquette."],[76.72,81.17,"digital etiquette means polite behaviour in online communication."],[81.47,85.02,"Good digital etiquette includes not shouting in capitals."],[85.72,88.62,"Your turn. Say: digital etiquette."],[91.32,92.61,"digital etiquette."],[93.62,94.88,"online discourse."],[95.59,99.77,"online discourse means public discussion taking place on the internet."],[100.07,103.32,"Online discourse has become increasingly polarised."],[104.02,107.52,"Your turn. Say: online discourse."],[110.22,111.71,"online discourse."],[112.72,113.96,"cancel culture."],[114.66,120.1,"cancel culture means the practice of publicly rejecting someone after offensive behaviour."],[120.4,122.97,"Debates about cancel culture divide opinion."],[123.67,126.55,"Your turn. Say: cancel culture."],[129.25,130.41,"cancel culture."],[131.42,133.2,"parasocial relationship."],[133.9,139.72,"parasocial relationship means a one-sided emotional bond with a media personality."],[140.01,143.97,"Fans may form parasocial relationships with influencers."],[144.66,148.72,"Your turn. Say: parasocial relationship."],[151.42,153.26,"parasocial relationship."],[154.25,155.68,"attention span."],[156.38,160.11,"attention span means the length of time you can concentrate."],[160.41,163.28,"Short videos may reduce our attention span."],[163.98,167.29,"Your turn. Say: attention span."],[169.99,171.29,"attention span."],[172.28,174.47,"Now let's listen to a conversation."],[174.77,179.91,"Ms. Sarah, I read a long article about filter bubbles. Can I summarise it?"],[181.22,183.23,"Please do, in your own words."],[184.52,190.82,"In essence, it argues that algorithmic curation narrows what we see, so we rarely meet opposing views."],[192.12,195.07,"Good paraphrase. What evidence did it give?"],[196.38,201.45,"Put simply, studies show that emotional posts achieve greater virality than balanced ones."],[202.75,204.01,"And the conclusion?"],[205.32,210.99,"To sum up, online discourse is becoming more polarised, and our attention span is shrinking."],[212.28,216.9,"Excellent. You captured the main ideas without copying the author's words."],[218.18,221.25,"Grammar focus: Paraphrase and summary."],[221.55,225.04,"Paraphrasing means restating ideas in your own words."],[225.34,231.28,"In essence, algorithms narrow what we see. The article argues that emotion drives virality."],[231.57,234.2,"To sum up, online discourse is polarising."],[234.5,242.34,"Good paraphrase changes structure and vocabulary while keeping meaning; always attribute ideas to their source."],[243.35,246.28,"Now read and listen. Talking Past Each Other."],[246.58,250.96,"Digital platforms have transformed how billions of people communicate."],[252.25,256.99,"Algorithmic curation selects content based on what keeps users engaged."],[258.28,264.01,"As a result, users may find themselves inside filter bubbles that confirm existing beliefs."],[265.32,270.26,"Virality tends to reward emotional, provocative content over careful argument."],[271.55,276.51,"Online discourse has consequently become faster, louder and more polarised."],[277.82,284.04,"Phenomena such as cancel culture and parasocial relationships reveal new social dynamics."],[285.35,290.96,"Researchers also question whether constant scrolling is shortening our attention span."],[292.25,298.35,"In short, digital communication connects us more than ever, yet may help us understand each other less."],[299.65,302.33,"Quiz time! Choose the correct answer."],[302.63,306.51,"An online space where you only see similar views is a blank."],[306.81,312.54,"A, filter bubble. B, virality. C, attention span."],[316.55,318.93,"The answer is A: filter bubble."],[320.42,322.76,"Which phrase introduces a paraphrase?"],[323.06,326.71,"A, In essence. B, However. C, Because."],[330.72,333.05,"The answer is A: In essence."],[334.55,336.68,"Which phrase concludes a summary?"],[336.98,341.2,"A, To begin with. B, To sum up. C, Turning to."],[345.18,346.96,"The answer is B: To sum up."],[348.45,352.52,"A one-sided emotional bond with a media personality is a blank."],[352.82,358.49,"A, parasocial relationship. B, digital etiquette. C, cancel culture."],[362.48,366.13,"The answer is A: parasocial relationship."],[367.62,371.68,"According to the text, what does virality tend to reward?"],[371.98,377.87,"A, careful argument. B, emotional, provocative content. C, long articles."],[381.85,385.59,"The answer is B: emotional, provocative content."],[387.08,393.79,"Now it's your turn. Part one: Summarise the main problem with filter bubbles, then give your opinion."],[399.09,403.97,"Part two: Paraphrase first, then state and justify your view."],[410.27,424.72,"In essence, filter bubbles show us only what we already believe, so we rarely meet challenging ideas. Put simply, they make us more certain and less informed. In my view, users should deliberately follow sources they disagree with."],[425.02,426.85,"That is a well-argued answer!"],[427.85,432.49,"Great work today! You learned eight new words and paraphrase and summary."],[432.79,438.42,"Today's value is online safety. Keep your password secret and be kind online."],[438.72,441.41,"See you in Unit nineteen. Goodbye!"],[441.71,444.42,"Thank you, Ms. Sarah! Bye, everyone!"]],"OC-Proficiency-Unit19-War-Peace-and-Memory":[[0.35,5.75,"Hello, everyone! I'm Ms. Sarah. Welcome to Online Proficiency."],[6.04,9.19,"Hi! I'm Rithy. Let's learn together!"],[9.49,17.33,"Unit nineteen: War, Peace and Memory. In this unit, you will evaluate how societies rebuild after conflict."],[18.32,19.42,"peacebuilding."],[20.12,24.99,"peacebuilding means long-term work to create lasting peace after conflict."],[25.29,29.05,"Peacebuilding involves justice, development and trust."],[29.75,32.35,"Your turn. Say: peacebuilding."],[35.05,35.96,"peacebuilding."],[36.95,38.27,"demobilisation."],[38.97,42.55,"demobilisation means disbanding armed forces after war."],[42.85,47.61,"Demobilisation helped former soldiers return to civilian life."],[48.31,51.61,"Your turn. Say: demobilisation."],[54.31,55.55,"demobilisation."],[56.55,58.06,"landmine clearance."],[58.76,63.16,"landmine clearance means removing explosive mines left in the ground."],[63.47,66.56,"Landmine clearance has made farmland safe again."],[67.26,71.01,"Your turn. Say: landmine clearance."],[73.71,75.43,"landmine clearance."],[76.42,78.56,"post-conflict reconstruction."],[79.26,85.03,"post-conflict reconstruction means rebuilding infrastructure and institutions after war."],[85.33,88.27,"Post-conflict reconstruction took decades."],[88.97,92.7,"Your turn. Say: post-conflict reconstruction."],[95.4,97.62,"post-conflict reconstruction."],[98.62,100.8,"truth and reconciliation."],[101.5,107.54,"truth and reconciliation means processes that reveal past abuses to help societies heal."],[107.84,112.56,"South Africa held truth and reconciliation hearings."],[113.26,117.3,"Your turn. Say: truth and reconciliation."],[120.0,121.83,"truth and reconciliation."],[122.82,124.32,"war crimes tribunal."],[125.02,129.95,"war crimes tribunal means a court that tries people for crimes committed in war."],[130.25,133.09,"The war crimes tribunal delivered its verdict."],[133.79,136.75,"Your turn. Say: war crimes tribunal."],[139.45,141.09,"war crimes tribunal."],[142.08,143.29,"collective trauma."],[143.99,148.28,"collective trauma means psychological harm shared by a whole community."],[148.58,151.56,"Collective trauma can affect several generations."],[152.25,155.37,"Your turn. Say: collective trauma."],[158.07,159.28,"collective trauma."],[160.28,161.27,"peace accord."],[161.97,165.13,"peace accord means a formal agreement ending a conflict."],[165.43,170.22,"The 1991 peace accord was signed in Paris."],[170.92,174.16,"Your turn. Say: peace accord."],[176.86,177.88,"peace accord."],[178.88,181.01,"Now let's listen to a conversation."],[181.31,188.08,"Rithy, how successful was the 1991 peace accord, in your assessment?"],[189.38,195.16,"Remarkably so, though not without limitations. It ended decades of conflict."],[196.45,197.94,"What were its strengths?"],[199.25,204.41,"The UN-supervised elections and demobilisation were significant achievements."],[205.72,207.09,"And its weaknesses?"],[208.38,214.49,"One could argue that post-conflict reconstruction was uneven, particularly in rural areas."],[215.78,218.85,"Landmine clearance has been a long process too."],[220.15,227.1,"Yes. Cambodian deminers deserve enormous credit; their work is, to my mind, among the country's great successes."],[228.38,231.58,"Grammar focus: Critical evaluation language."],[231.88,235.36,"Critical evaluation balances strengths and weaknesses."],[235.66,243.0,"The accord was remarkably successful, though not without limitations. Demobilisation was a significant achievement."],[243.29,246.63,"One could argue that reconstruction was uneven."],[246.93,253.07,"Critical evaluation weighs strengths and weaknesses explicitly before reaching a judgement."],[254.08,256.77,"Now read and listen. From War to Peace."],[257.07,264.39,"In October 1991, the Paris Peace Agreements were signed to end Cambodia's long conflict."],[265.68,273.8,"The United Nations then supervised elections in 1993, a significant achievement in peacebuilding."],[275.12,280.12,"Demobilisation and the return of refugees were complex but largely successful."],[281.42,286.86,"Post-conflict reconstruction, however, proceeded unevenly across the country."],[288.15,296.04,"Landmine clearance became one of the most important humanitarian tasks, carried out largely by Cambodian experts."],[297.35,304.28,"Later, a special tribunal tried senior leaders for crimes committed in the 1970s."],[305.58,311.12,"Collective trauma, scholars suggest, cannot be healed by legal processes alone."],[312.42,319.69,"On balance, Cambodia's transition offers both lessons in success and reminders of what remains unfinished."],[320.98,323.58,"Quiz time! Choose the correct answer."],[323.88,327.03,"Removing explosive mines from the ground is blank."],[327.33,332.9,"A, landmine clearance. B, demobilisation. C, peace accord."],[336.88,340.09,"The answer is A: landmine clearance."],[341.58,343.78,"Which phrase gives a balanced judgement?"],[344.08,351.37,"A, It was perfect.. B, Successful, though not without limitations.. C, It failed completely.."],[355.38,359.77,"The answer is B: Successful, though not without limitations.."],[361.28,364.02,"'One could blank that progress was uneven.'"],[364.32,368.04,"A, argue. B, say us. C, telling."],[372.05,374.19,"The answer is A: argue."],[375.68,378.69,"A formal agreement ending a conflict is a blank."],[378.99,384.1,"A, peace accord. B, war crimes tribunal. C, collective trauma."],[388.08,390.65,"The answer is A: peace accord."],[392.15,396.0,"According to the text, when were the Paris Peace Agreements signed?"],[396.3,404.38,"A, 1979. B, 1991. C, 1993."],[408.38,411.42,"The answer is B: 1991."],[412.92,419.45,"Now it's your turn. Part one: What lessons can other countries learn from Cambodia's peace process?"],[424.75,430.18,"Part two: Evaluate one strength and one limitation, then reach a judgement."],[436.48,452.91,"The peace process was remarkably successful in ending armed conflict, which is a significant achievement. One could argue, however, that rural reconstruction lagged behind. On balance, it shows that international support works best when local people lead the rebuilding."],[453.21,455.28,"That is a well-argued answer!"],[456.28,461.83,"Great work today! You learned eight new words and critical evaluation language."],[462.13,466.39,"Today's value is love of country. Love and take care of Cambodia."],[466.69,469.35,"See you in Unit twenty. Goodbye!"],[469.64,472.52,"Thank you, Ms. Sarah! Bye, everyone!"]],"OC-Proficiency-Unit20-The-Future-of-Education":[[0.35,5.11,"Hello, everyone! I'm Ms. Sarah. Welcome to Online Proficiency."],[5.41,8.39,"Hi! I'm Rithy. Let's learn together!"],[8.69,17.02,"Unit twenty: The Future of Education. In this unit, you will discuss how education will change and adapt style to different audiences."],[18.02,20.0,"lifelong learning society."],[20.7,26.92,"lifelong learning society means a society where people keep learning throughout their lives."],[27.22,31.57,"A lifelong learning society needs flexible courses."],[32.27,36.41,"Your turn. Say: lifelong learning society."],[39.11,40.89,"lifelong learning society."],[41.88,43.59,"credential inflation."],[44.29,49.69,"credential inflation means needing ever higher qualifications for the same jobs."],[49.99,52.86,"Credential inflation makes degrees less valuable."],[53.56,56.99,"Your turn. Say: credential inflation."],[59.69,61.25,"credential inflation."],[62.25,63.62,"micro-credential."],[64.32,69.05,"micro-credential means a short certificate proving a specific skill."],[69.35,73.27,"She earned a micro-credential in data analysis."],[73.97,77.65,"Your turn. Say: micro-credential."],[80.35,81.78,"micro-credential."],[82.78,84.23,"personalised learning."],[84.93,89.97,"personalised learning means teaching adapted to each learner's needs and pace."],[90.27,93.37,"Personalised learning helps weaker students catch up."],[94.07,97.44,"Your turn. Say: personalised learning."],[100.14,101.61,"personalised learning."],[102.62,104.73,"AI tutor."],[105.43,110.45,"AI tutor means an artificial intelligence that helps students learn."],[110.75,114.43,"An AI tutor can explain maths at any hour."],[115.13,118.75,"Your turn. Say: AI tutor."],[121.45,123.17,"AI tutor."],[124.18,126.1,"educational technology."],[126.8,131.77,"educational technology means digital tools used for teaching and learning."],[132.07,136.21,"Educational technology expanded during the pandemic."],[136.91,140.86,"Your turn. Say: educational technology."],[143.56,145.44,"educational technology."],[146.45,148.19,"learning analytics."],[148.89,153.83,"learning analytics means using data to understand and improve learning."],[154.13,158.19,"Learning analytics show which lessons students find hard."],[158.89,162.25,"Your turn. Say: learning analytics."],[164.95,166.33,"learning analytics."],[167.32,168.83,"knowledge society."],[169.53,174.5,"knowledge society means a society in which knowledge is the main source of value."],[174.8,177.74,"A knowledge society depends on education."],[178.44,181.66,"Your turn. Say: knowledge society."],[184.36,185.8,"knowledge society."],[186.82,189.11,"Now let's listen to a conversation."],[189.41,194.84,"Ms. Sarah, how would you explain AI tutors to a parent in my village?"],[196.15,201.7,"Simply: 'It's like a patient helper on the phone that explains homework any time.'"],[203.02,205.42,"And to university administrators?"],[206.72,214.0,"'AI tutors enable scalable personalised learning, supported by learning analytics.'"],[215.32,217.8,"Same idea, very different style!"],[219.12,223.66,"Exactly. Style shifting means choosing words for your audience."],[224.95,227.05,"What about credential inflation?"],[228.35,238.38,"For students I'd say: 'Degrees alone aren't enough any more.' For policymakers: 'Qualification requirements are escalating disproportionately.'"],[239.68,243.81,"Grammar focus: Style shifting and audience."],[244.11,247.67,"C2 mastery means adapting your style to each audience."],[247.97,257.22,"To a parent: it's like a patient helper that explains homework. To administrators: AI tutors enable scalable personalised learning."],[257.52,260.87,"The message stays the same; the style changes."],[261.17,267.66,"True C2 mastery is not always sounding formal; it is choosing the right style for each audience."],[268.65,272.83,"Now read and listen. Learning in the Twenty-First Century."],[273.13,277.96,"In a knowledge society, education no longer ends with a single degree."],[279.25,284.12,"A lifelong learning society requires opportunities to study at every age."],[285.42,290.4,"Micro-credentials allow workers to prove specific skills without years of study."],[291.68,297.89,"Meanwhile, credential inflation means employers often demand higher qualifications for the same jobs."],[299.18,305.55,"Educational technology, including AI tutors, promises personalised learning at scale."],[306.85,311.69,"Learning analytics can help teachers identify which students need support."],[312.98,319.21,"Critics warn, however, that technology cannot replace human relationships in education."],[320.52,326.63,"The future of learning may depend on combining digital tools with the irreplaceable role of good teachers."],[327.92,330.65,"Quiz time! Choose the correct answer."],[330.95,334.53,"Needing higher qualifications for the same jobs is blank."],[334.83,340.43,"A, credential inflation. B, micro-credential. C, learning analytics."],[344.42,347.59,"The answer is A: credential inflation."],[349.08,351.35,"Which version suits a young child?"],[351.65,362.83,"A, The device facilitates individualised instruction.. B, The app helps you learn at your own speed.. C, Pedagogical optimisation is achieved.."],[366.82,371.17,"The answer is B: The app helps you learn at your own speed.."],[372.68,375.24,"Which version suits an academic report?"],[375.54,382.35,"A, It's really useful.. B, It enables scalable personalised learning.. C, It's cool.."],[386.35,390.29,"The answer is B: It enables scalable personalised learning.."],[391.78,395.7,"A short certificate proving a specific skill is a blank."],[396.0,401.32,"A, micro-credential. B, AI tutor. C, knowledge society."],[405.32,408.22,"The answer is A: micro-credential."],[409.72,413.53,"According to the text, what cannot technology replace?"],[413.83,419.77,"A, data. B, human relationships in education. C, exams."],[423.78,428.6,"The answer is B: human relationships in education."],[430.12,437.44,"Now it's your turn. Part one: Explain the idea of lifelong learning to two different audiences."],[442.74,447.37,"Part two: Give one version for a teenager and one for a government official."],[453.67,467.02,"For a teenager: 'You'll keep learning new skills your whole life, not just at school.' For an official: 'A lifelong learning system enables continuous upskilling, which strengthens productivity and social mobility.'"],[467.32,469.33,"That is a well-argued answer!"],[470.32,475.29,"Great work today! You learned eight new words and style shifting and audience."],[475.59,479.53,"Today's value is pride in learning. Be proud of what you learned."],[479.83,483.4,"See you in Unit twenty-one. Goodbye!"],[483.7,486.6,"Thank you, Ms. Sarah! Bye, everyone!"]],"OC-Proficiency-Unit21-Identity-and-Belonging":[[0.35,5.27,"Hello, everyone! I'm Ms. Sarah. Welcome to Online Proficiency."],[5.57,8.75,"Hi! I'm Rithy. Let's learn together!"],[9.05,17.33,"Unit twenty-one: Identity and Belonging. In this unit, you will explore how identity is shaped by many overlapping factors."],[18.32,19.83,"intersectionality."],[20.53,27.89,"intersectionality means the way different identities, such as gender and class, combine to shape experience."],[28.19,32.48,"Intersectionality explains why some groups face multiple disadvantages."],[33.18,36.4,"Your turn. Say: intersectionality."],[39.1,40.61,"intersectionality."],[41.62,42.98,"hybrid identity."],[43.68,49.39,"hybrid identity means an identity combining elements of more than one culture."],[49.69,53.6,"Children of migrants often develop a hybrid identity."],[54.3,57.61,"Your turn. Say: hybrid identity."],[60.31,61.68,"hybrid identity."],[62.68,64.39,"identity politics."],[65.09,69.7,"identity politics means politics based on shared group identities."],[70.0,74.37,"Identity politics is praised by some and criticised by others."],[75.07,78.97,"Your turn. Say: identity politics."],[81.67,83.33,"identity politics."],[84.32,85.6,"sense of place."],[86.3,90.15,"sense of place means a strong emotional connection to a location."],[90.45,93.51,"Villages give older people a deep sense of place."],[94.21,97.01,"Your turn. Say: sense of place."],[99.71,101.07,"sense of place."],[102.08,103.07,"otherness."],[103.77,107.92,"otherness means the quality of being seen as different or foreign."],[108.22,110.99,"Migrants often describe a feeling of otherness."],[111.69,114.56,"Your turn. Say: otherness."],[117.26,118.24,"otherness."],[119.25,120.62,"marginalisation."],[121.32,124.88,"marginalisation means pushing a group to the edge of society."],[125.18,128.84,"Marginalisation limits access to education and jobs."],[129.54,132.63,"Your turn. Say: marginalisation."],[135.33,136.61,"marginalisation."],[137.62,139.16,"self-determination."],[139.86,144.53,"self-determination means the right of a people to decide their own future."],[144.83,148.44,"Self-determination was central to decolonisation."],[149.13,152.51,"Your turn. Say: self-determination."],[155.21,156.58,"self-determination."],[157.58,158.63,"nationhood."],[159.33,163.36,"nationhood means the state of being a nation with a shared identity."],[163.66,166.53,"Language and history shape a sense of nationhood."],[167.23,170.5,"Your turn. Say: nationhood."],[173.2,174.24,"nationhood."],[175.25,177.46,"Now let's listen to a conversation."],[177.76,180.99,"Rithy, what does it mean to be Cambodian today?"],[182.28,188.05,"Rarely is it a single thing. Language, religion, place and history all overlap."],[189.35,193.16,"That's intersectionality in action. And for the diaspora?"],[194.45,200.74,"Many develop a hybrid identity. Not only do they speak two languages, but they think in two cultures."],[202.05,203.86,"Do they feel a sense of otherness?"],[205.15,209.94,"Often, in both places. Seldom do they feel fully at home anywhere."],[211.25,215.01,"Yet nationhood can unite people across differences."],[216.32,222.15,"So long as it doesn't lead to the marginalisation of minorities. Only then is it truly inclusive."],[223.45,228.35,"Grammar focus: Inversion and emphasis (extended)."],[228.65,231.07,"Vary inversion forms for emphasis."],[231.37,238.49,"Rarely is it a single thing. Not only do they speak two languages, but they think in two cultures."],[238.79,241.1,"Only then is it truly inclusive."],[241.41,246.23,"Varying inversion forms adds rhetorical weight without sounding repetitive."],[247.22,249.66,"Now read and listen. Who Am I?."],[249.96,256.12,"Identity was once thought to be simple: a person belonged to one nation, one religion, one people."],[257.42,263.22,"Today, scholars emphasise that identities are multiple, fluid and overlapping."],[264.52,271.22,"The concept of intersectionality shows how gender, class and ethnicity combine to shape experience."],[272.52,278.42,"Migrants and their children often develop hybrid identities, belonging partly to several cultures."],[279.72,284.85,"Not only can this bring creativity, but it can also bring a painful sense of otherness."],[286.15,291.92,"Nationhood can provide unity, yet it may also lead to the marginalisation of minorities."],[293.22,299.49,"Self-determination remains a powerful principle for peoples seeking control over their future."],[300.78,305.58,"Seldom has the question 'Who am I?' been asked so widely, or answered so diversely."],[306.88,309.65,"Quiz time! Choose the correct answer."],[309.95,313.07,"Pushing a group to the edge of society is blank."],[313.37,318.7,"A, marginalisation. B, nationhood. C, sense of place."],[322.72,325.75,"The answer is A: marginalisation."],[327.25,330.33,"Seldom blank such diversity in one city."],[330.63,335.97,"A, we see. B, do we see. C, we do see."],[339.95,342.33,"The answer is B: do we see."],[343.82,347.34,"Not only blank talented, but she is also kind."],[347.64,351.51,"A, she is. B, is she. C, she."],[355.52,357.87,"The answer is B: is she."],[359.35,362.64,"An identity combining several cultures is a blank."],[362.94,368.82,"A, hybrid identity. B, identity politics. C, otherness."],[372.82,375.95,"The answer is A: hybrid identity."],[377.45,381.71,"According to the text, how do scholars now describe identities?"],[382.01,388.54,"A, simple and fixed. B, multiple, fluid and overlapping. C, purely national."],[392.55,396.29,"The answer is B: multiple, fluid and overlapping."],[397.78,403.64,"Now it's your turn. Part one: Which aspects of your identity matter most to you?"],[408.94,414.81,"Part two: Use one inversion structure and explain how two aspects interact."],[421.11,431.04,"Rarely do I think of myself in only one way. I'm Khmer, a student and a Buddhist, and not only do these shape my values, but they also influence how others see me."],[431.34,433.15,"That is a well-argued answer!"],[434.15,439.77,"Great work today! You learned eight new words and inversion and emphasis (extended)."],[440.07,444.08,"Today's value is self-confidence. Believe in yourself."],[444.38,447.2,"See you in Unit twenty-two. Goodbye!"],[447.5,450.15,"Thank you, Ms. Sarah! Bye, everyone!"]],"OC-Proficiency-Unit22-Justice-Across-Generations":[[0.35,5.07,"Hello, everyone! I'm Ms. Sarah. Welcome to Online Proficiency."],[5.37,8.57,"Hi! I'm Rithy. Let's learn together!"],[8.87,16.75,"Unit twenty-two: Justice Across Generations. In this unit, you will debate our obligations to future generations."],[17.75,19.95,"intergenerational justice."],[20.65,25.59,"intergenerational justice means fairness between present and future generations."],[25.89,29.86,"Climate change raises questions of intergenerational justice."],[30.56,34.09,"Your turn. Say: intergenerational justice."],[36.79,38.94,"intergenerational justice."],[39.95,41.54,"future generations."],[42.24,46.0,"future generations means people who will live after us."],[46.3,49.68,"Our choices today will affect future generations."],[50.38,53.94,"Your turn. Say: future generations."],[56.63,58.27,"future generations."],[59.28,60.63,"long-termism."],[61.33,68.99,"long-termism means the view that positively influencing the long-term future is a key priority."],[69.29,72.5,"Long-termism shapes some philanthropic decisions."],[73.2,76.44,"Your turn. Say: long-termism."],[79.14,80.34,"long-termism."],[81.35,83.78,"sustainability ethic."],[84.48,90.51,"sustainability ethic means a moral commitment to meeting present needs without harming the future."],[90.81,94.23,"A sustainability ethic guides the company's choices."],[94.94,98.52,"Your turn. Say: sustainability ethic."],[101.22,103.0,"sustainability ethic."],[103.98,105.59,"generational fairness."],[106.29,110.76,"generational fairness means equal treatment of different age groups."],[111.06,115.09,"Pension reforms raise issues of generational fairness."],[115.79,119.04,"Your turn. Say: generational fairness."],[121.74,123.46,"generational fairness."],[124.45,125.87,"inheritance of debt."],[126.57,131.82,"inheritance of debt means passing public or private debts to the next generation."],[132.12,134.84,"Young people worry about the inheritance of debt."],[135.54,139.1,"Your turn. Say: inheritance of debt."],[141.8,143.26,"inheritance of debt."],[144.25,145.72,"climate legacy."],[146.41,151.47,"climate legacy means the climate impacts we leave to future generations."],[151.77,154.95,"Our climate legacy will last for centuries."],[155.65,158.95,"Your turn. Say: climate legacy."],[161.66,162.91,"climate legacy."],[163.92,165.25,"temporal justice."],[165.95,170.53,"temporal justice means fairness across different periods of time."],[170.83,175.63,"Temporal justice asks whether the future counts as much as the present."],[176.33,179.28,"Your turn. Say: temporal justice."],[181.98,183.33,"temporal
