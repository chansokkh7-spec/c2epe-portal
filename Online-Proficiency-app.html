        // ===== Progress: stars/badges are earned once per activity and remembered =====
        // Saved in this browser when the page is opened as a normal web page. When it runs
        // inside the Hub's secure "Embed Code" box the browser blocks storage, so progress
        // then lasts until the page is closed (it still can't be farmed by repeated taps).
        const PROGRESS_KEY = () => 'c2epe_onlineclass_progress_' + state.level;
        let progress = { stars: 0, badges: 0, awarded: {}, bestQuiz: {} };
        function loadProgress() {
            try {
                const saved = JSON.parse(localStorage.getItem(PROGRESS_KEY()) || 'null');
                if (saved && typeof saved === 'object') progress = Object.assign({ stars: 0, badges: 0, awarded: {}, bestQuiz: {} }, saved);
            } catch (e) { /* storage not available (e.g. inside the Hub sandbox) */ }
            state.stars = progress.stars; state.badges = progress.badges;
            document.getElementById('star-count').innerText = state.stars;
            document.getElementById('badge-count').innerText = state.badges;
        }
        function saveProgress() {
            progress.stars = state.stars; progress.badges = state.badges;
            try { localStorage.setItem(PROGRESS_KEY(), JSON.stringify(progress)); } catch (e) {}
        }
        // Gives stars only the first time a given activity is done. Returns true if stars were given.
        function award(key, amount) {
            const k = state.level + '|' + key;
            if (progress.awarded[k]) return false;
            progress.awarded[k] = true;
            addStars(amount);
            return true;
        }
        const unitKey = (what) => 'u' + state.unit + '|' + what;

        function populateUnitSelect() {
            const sel = document.getElementById('unit-select');
            const levelData = realCurriculum[state.level];
            const prevUnit = state.unit;
            const unitCount = Object.keys(levelData).length;
            const labelEl = document.getElementById('unit-select-label');
            if (labelEl) labelEl.textContent = `Select Unit (1 to ${unitCount})`;
            // 🎬 marks units that have a video (🆕 = added in the last 7 days)
            sel.innerHTML = Object.keys(levelData).map(u => {
                const v = videoFor(state.level, u);
                const mark = v ? (isRecentlyAdded(v.added) ? ' 🆕' : ' 🎬') : '';
                return `<option value="${u}">Unit ${u}: ${levelData[u].title}${mark}</option>`;
            }).join('');
            if (typeof OC_TRIAL !== 'undefined' && OC_TRIAL) { [...sel.options].forEach(o => { if (Number(o.value) > 3) { o.disabled = true; o.textContent = '🔒 ' + o.textContent + ' (after the trial)'; } }); }
            // keep the same unit number selected if it still exists for this level
            if (levelData[prevUnit]) {
                sel.value = prevUnit;
                state.unit = prevUnit;
            } else {
                state.unit = parseInt(sel.value);
            }
        }

        // Phonics only fits early readers (K0/K1) — levels where it's not
        // shown are also guarded against being left "stuck" on the phonics
        // tab if the student switches level while it's open.
        const PHONICS_LEVELS = ['K0', 'K1'];

        function selectLevel(lvl) {
            state.level = lvl;
            document.querySelectorAll('.level-btn').forEach(b => {
                b.classList.remove('bg-blue-600', 'text-white', 'shadow');
                b.classList.add('bg-gray-100');
            });
            document.getElementById('btn-' + lvl).classList.remove('bg-gray-100');
            document.getElementById('btn-' + lvl).classList.add('bg-blue-600', 'text-white', 'shadow');
            document.getElementById('current-level-display').innerText = lvl;

            const phonicsBtn = document.getElementById('phonics-tab-btn');
            const phonicsAllowed = PHONICS_LEVELS.includes(lvl);
            phonicsBtn.style.display = phonicsAllowed ? '' : 'none';
            if (!phonicsAllowed && state.tab === 'phonics') { state.tab = 'listening'; highlightActiveTab(); }

            loadProgress();
            populateUnitSelect();
            renderContent();
        }

        function updateUnit() {
            state.unit = parseInt(document.getElementById('unit-select').value);
            renderContent();
            scrollToLesson();
        }

        // Moves to the next unit within the current level (wrapping back to
        // unit 1 after the last one), keeping the same module tab open so
        // a student can go straight through Unit 1 -> Unit 2 -> ... without
        // re-opening the dropdown each time.
        function nextLesson() {
            const levelData = realCurriculum[state.level];
            const unitNumbers = Object.keys(levelData).map(Number).sort((a, b) => a - b);
            const idx = unitNumbers.indexOf(state.unit);
            const nextIdx = (idx === -1 ? 0 : idx + 1) % ((typeof OC_TRIAL !== 'undefined' && OC_TRIAL) ? 3 : unitNumbers.length);
            state.unit = unitNumbers[nextIdx];
            document.getElementById('unit-select').value = state.unit;
            renderContent();
            scrollToLesson(true);
        }

        function highlightActiveTab() {
            document.querySelectorAll('.tab-btn').forEach(b => {
                b.classList.remove('bg-blue-50', 'text-blue-700');
                b.classList.add('hover:bg-gray-100');
            });
            const activeBtn = document.querySelector(`.tab-btn[data-tab="${state.tab}"]`);
            if (activeBtn) {
                activeBtn.classList.remove('hover:bg-gray-100');
                activeBtn.classList.add('bg-blue-50', 'text-blue-700');
            }
        }

        // On phones the lesson sits below the module list, so after choosing a module,
        // a unit or the next lesson, the page now scrolls down to the lesson by itself.
        const isPhone = () => window.matchMedia('(max-width: 767px)').matches;
        function scrollToLesson(always) {
            const area = document.getElementById('content-area');
            if (!area) return;
            if (!(isPhone() || (always && area.getBoundingClientRect().top < 0))) return;
            // Wait for the new lesson to be drawn, then glide to it. Some phones stop a smooth
            // scroll that starts during the tap itself, so if it hasn't arrived shortly after,
            // jump there directly.
            setTimeout(() => {
                area.scrollIntoView({ behavior: 'smooth', block: 'start' });
                setTimeout(() => {
                    if (Math.abs(area.getBoundingClientRect().top) > 40) area.scrollIntoView({ block: 'start' });
                }, 700);
            }, 60);
        }
        function jumpToModules() {
            const side = document.getElementById('module-sidebar');
            side.scrollIntoView({ behavior: 'smooth', block: 'start' });
            setTimeout(() => { if (Math.abs(side.getBoundingClientRect().top) > 40) side.scrollIntoView({ block: 'start' }); }, 700);
        }
        function switchTab(tab) {
            state.tab = tab;
            highlightActiveTab();
            renderContent();
            scrollToLesson();
        }

        function triggerConfetti() {
            if (typeof confetti === 'function') {
                confetti({
                    particleCount: 100,
                    spread: 70,
                    origin: { y: 0.6 }
                });
            }
        }

        function addStars(amt) {
            state.stars += amt;
            document.getElementById('star-count').innerText = state.stars;
            saveProgress();
            triggerConfetti();
        }

        // "Finish Activity" now rewards each activity of each unit once (and one badge per unit),
        // instead of giving stars and badges every time it is tapped.
        function completeActivity() {
            const gotStars = award(unitKey('finish-' + state.tab), 5);
            let gotBadge = false;
            const badgeKey = state.level + '|' + unitKey('badge');
            if (gotStars && !progress.awarded[badgeKey]) {
                progress.awarded[badgeKey] = true;
                state.badges += 1;
                document.getElementById('badge-count').innerText = state.badges;
                saveProgress();
                gotBadge = true;
            }
            if (gotBadge) alert(`🎉 Awesome! You finished this activity, earned 5 Stars ⭐ and unlocked a new Sticker Badge for Unit ${state.unit}! 🏆`);
            else if (gotStars) alert(`🎉 Awesome! You finished this activity and earned 5 Stars ⭐!`);
            else alert(`✅ You already finished this activity. Try another one, or go to the next lesson! ▶️`);
        }

        // ---------- Helper: Text-to-Speech ----------
        // Voices load a moment after the page opens, so they are cached when ready.
        let enVoice = null;
        function pickVoice() {
            if (!('speechSynthesis' in window)) return;
            const voices = window.speechSynthesis.getVoices();
            enVoice = voices.find(v => v.lang && v.lang.startsWith('en')) || null;
        }
        if ('speechSynthesis' in window) { pickVoice(); window.speechSynthesis.onvoiceschanged = pickVoice; }
        function speak(text, onEnd) {
            if (!('speechSynthesis' in window)) { if (onEnd) onEnd(false); return false; }
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(text);
            u.lang = 'en-US';
            u.rate = 0.85;
            if (!enVoice) pickVoice();
            if (enVoice) u.voice = enVoice;
            if (onEnd) u.onend = () => onEnd(true);
            window.speechSynthesis.speak(u);
            return true;
        }

        function shuffle(arr) {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        function allVocabForLevel(level) {
            let words = [];
            Object.keys(realCurriculum[level]).forEach(u => words.push(...realCurriculum[level][u].vocab));
            return [...new Set(words)];
        }

            const samePic = unitData.vocab.filter(w => w !== word && emojiFor(w, unitData) === e);
            if (samePic.length >= 2) return shuffle(samePic).slice(0, 3);
            return shuffle(allVocabForLevel(state.level).filter(w => w !== word && emojiFor(w, unitData) !== e)).slice(0, 3);
        }

        let speakState = { wIndex: 0, words: [] };

        const normalizeSpeech = (s) => String(s).toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').replace(/\s+/g, ' ').trim();
        function recordWord(btn) {
            const word = speakState.words[speakState.wIndex];
            const msg = document.getElementById('rec-msg');
            const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SR) return;
            // stop the "Hear it" voice first, or the speaker can bleed into the microphone
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();
            btn.disabled = true;

        function renderReading(contentDiv, unitData) {

        // Tracks the currently-attached window "mouseup" handler so a
        // previous one gets removed before adding a new one.
        let traceMouseUpHandler = null;
        function setupTraceCanvas() {
            traceDrawn = false;
            const canvas = document.getElementById('trace-canvas');
            const ctx = canvas.getContext('2d');
            ctx.lineWidth = 6;
            ctx.lineCap = 'round';
            ctx.strokeStyle = '#2563eb';
            let drawing = false;
            function pos(e) {
                const rect = canvas.getBoundingClientRect();
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;
                const cx = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
                const cy = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
                return { x: cx * scaleX, y: cy * scaleY };
            }
            function start(e) { drawing = true; traceDrawn = true; const p = pos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); e.preventDefault(); }
            function move(e) { if (!drawing) return; const p = pos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); e.preventDefault(); }
            function end() { drawing = false; }
            canvas.addEventListener('mousedown', start);
            canvas.addEventListener('mousemove', move);
            if (traceMouseUpHandler) window.removeEventListener('mouseup', traceMouseUpHandler);
            traceMouseUpHandler = end;
            window.addEventListener('mouseup', traceMouseUpHandler);
            canvas.addEventListener('touchstart', start, { passive: false });
            canvas.addEventListener('touchmove', move, { passive: false });
            canvas.addEventListener('touchend', end);
        }

        // ===== 8. GRAMMAR BOX (pattern + example + free-practice sentence) =====
        function renderGrammar(contentDiv, unitData) {

        // ===== 9. ABC PHONICS — "Letters of the Week" (K0/K1 only) =====
        // The 26 letters are spread over the 16 units, so every unit has its own letters:
        //   Units 1–10: two letters each (A B, C D ... S T)   Units 11–16: one letter each (U ... Z)
        // "See all letters A–Z" still shows the full alphabet for review.
        const LETTER_PLAN = {"1": ["A"], "2": ["B"], "3": ["C"], "4": ["D"], "5": ["E"], "6": ["F"], "7": ["G"], "8": ["H"], "9": ["I"], "10": ["J"], "11": ["K"], "12": ["L"], "13": ["M"], "14": ["N"], "15": ["O"], "16": ["P"], "17": ["Q"], "18": ["R"], "19": ["S"], "20": ["T"], "21": ["U"], "22": ["V"], "23": ["W"], "24": ["X"], "25": ["Y"], "26": ["Z"], "27": ["A", "E", "I", "O", "U"], "28": ["B", "D", "P", "T"], "29": ["M", "N", "S", "Z"]};
        // Four picture words per letter (the first one is the "A is for ..." word).
        // X is taught as the sound at the END of a word (fox, box, six), as in most phonics courses.
        const PHONICS_WORDS = {
            A: [['Apple','🍎'],['Ant','🐜'],['Alligator','🐊'],['Airplane','✈️']],
            B: [['Ball','⚽'],['Bear','🐻'],['Banana','🍌'],['Bird','🐦']],
            C: [['Cat','🐱'],['Car','🚗'],['Cake','🎂'],['Cow','🐄']],
            D: [['Dog','🐶'],['Duck','🦆'],['Drum','🥁'],['Door','🚪']],
            E: [['Egg','🥚'],['Elephant','🐘'],['Envelope','✉️'],['Elbow','💪']],
            F: [['Fish','🐟'],['Frog','🐸'],['Flower','🌷'],['Fire','🔥']],
            G: [['Grape','🍇'],['Goat','🐐'],['Gift','🎁'],['Guitar','🎸']],
            H: [['Hat','👒'],['House','🏠'],['Horse','🐴'],['Hand','✋']],
            I: [['Insect','🐛'],['Iguana','🦎'],['Ink','🖋️'],['Ice cream','🍦']],
            J: [['Juice','🧃'],['Jellyfish','🪼'],['Jacket','🧥'],['Jeep','🚙']],
            K: [['Kite','🪁'],['Key','🔑'],['King','🤴'],['Kangaroo','🦘']],
            L: [['Lion','🦁'],['Leaf','🍃'],['Lemon','🍋'],['Lamp','💡']],
            M: [['Moon','🌙'],['Monkey','🐒'],['Milk','🥛'],['Mouse','🐭']],
            N: [['Nose','👃'],['Nest','🪺'],['Nut','🥜'],['Net','🥅']],
            O: [['Octopus','🐙'],['Orange','🍊'],['Ox','🐂'],['Olive','🫒']],
            P: [['Pig','🐷'],['Pen','🖊️'],['Pizza','🍕'],['Panda','🐼']],
            Q: [['Queen','👸'],['Question','❓'],['Quiet','🤫'],['Quack','🦆']],
            R: [['Rabbit','🐰'],['Rain','🌧️'],['Robot','🤖'],['Rainbow','🌈']],
            S: [['Sun','☀️'],['Snake','🐍'],['Star','⭐'],['Sock','🧦']],
            T: [['Tree','🌳'],['Tiger','🐯'],['Train','🚆'],['Turtle','🐢']],
            U: [['Umbrella','☂️'],['Up','⬆️'],['Unicorn','🦄'],['Under','⬇️']],
            V: [['Van','🚐'],['Violin','🎻'],['Volcano','🌋'],['Vase','🏺']],
            W: [['Watermelon','🍉'],['Whale','🐳'],['Window','🪟'],['Worm','🪱']],
            X: [['Fox','🦊'],['Box','📦'],['Six','6️⃣'],['X-ray','🩻']],
            Y: [['Yo-yo','🪀'],['Yellow','🟨'],['Yarn','🧶'],['Yogurt','🍶']],
            Z: [['Zebra','🦓'],['Zero','0️⃣'],['Zigzag','〰️'],['Zip','🤐']]
        };
        const ALPHABET = Object.keys(PHONICS_WORDS);
        // K0 follows the videos: one letter per lesson (Lesson 1 = A … Lesson 16 = P)
        const lettersFor = (unit) => LETTER_PLAN[unit] || LETTER_PLAN[1];
        const letterIntro = (L) => L === 'X'
            ? 'X. Listen for X at the end: fox, box, six.'
            : `${L}. ${L} is for ${PHONICS_WORDS[L][0][0]}.`;
        let phonicsGame = { rounds: [], index: 0, score: 0, locked: false };

        function renderPhonics(contentDiv) {
            const letters = lettersFor(state.unit);
            const firstNo = ALPHABET.indexOf(letters[0]) + 1, lastNo = ALPHABET.indexOf(letters[letters.length - 1]) + 1;
            contentDiv.innerHTML = `
                <h2 class="text-xl font-bold text-blue-800 mb-1">🔤 ABC Phonics — Letters of the Week</h2>
                <p class="text-gray-600 mb-4">Unit ${state.unit}: letter${letters.length > 1 ? 's' : ''} <b>${letters.join(' and ')}</b>
                   <span class="text-sm text-gray-400">(letters ${firstNo === lastNo ? firstNo : firstNo + '–' + lastNo} of 26)</span></p>
                <div class="flex flex-col gap-5">
                    ${letters.map(L => `
                    <div class="bg-yellow-50 border-2 border-dashed border-yellow-300 rounded-2xl p-5">
                        <div class="flex items-center gap-4 flex-wrap mb-4">
                            <button onclick="sayLetter('${L}')" id="ph-big-${L}" class="bg-white rounded-2xl shadow px-6 py-3 cursor-pointer hover:bg-yellow-100 ${progress.awarded[state.level + '|phonics-letter-' + L] ? 'ring-4 ring-green-400' : ''}" aria-label="Hear the letter ${L}">
                                <span class="text-6xl font-bold text-blue-800 fun-font">${L} <span class="text-5xl text-pink-500">${L.toLowerCase()}</span></span>
                            </button>
                            <div>
                                <p class="font-bold text-amber-800">🔊 Tap the letter to hear it.</p>
                                <p class="text-sm text-gray-600">${L === 'X' ? 'X is usually at the <b>end</b> of a word.' : `Words that start with <b>${L}</b>:`}</p>
                            </div>
                        </div>
                        <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
                            ${PHONICS_WORDS[L].map(([w, e], i) => `
                                <button onclick="sayPhonicsWord('${L}', ${i})" id="ph-${L}-${i}" class="bg-white p-3 rounded-xl shadow font-bold text-blue-800 hover:bg-yellow-100 cursor-pointer flex flex-col items-center gap-1 ${progress.awarded[state.level + '|phonics-word-' + L + i] ? 'ring-4 ring-green-400' : ''}">
                                    <span class="text-4xl">${e}</span>
                                    <span class="text-sm">${highlightLetter(w, L)}</span>
                                </button>`).join('')}
                        </div>
                    </div>`).join('')}
                    <div class="bg-purple-50 border border-purple-200 rounded-2xl p-5" id="phonics-game"></div>
                    <div class="text-center">
                        <button onclick="renderAlphabet()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-5 py-2 rounded-full shadow cursor-pointer">🔤 See all letters A–Z</button>
                    </div>
                </div>`;
            startPhonicsGame();
        }
        // Colours the letter being learned inside each word (first letter, or the x at the end)
        function highlightLetter(word, L) {
            const i = L === 'X' ? word.toLowerCase().lastIndexOf('x') : 0;
            if (i < 0) return word;
            return word.slice(0, i) + `<span class="text-pink-500 text-base">${word[i]}</span>` + word.slice(i + 1);
        }
        function sayLetter(L) {
            speak(letterIntro(L));
            if (award('phonics-letter-' + L, 1)) document.getElementById('ph-big-' + L).classList.add('ring-4', 'ring-green-400');
        }
        function sayPhonicsWord(L, i) {
            speak(PHONICS_WORDS[L][i][0]);
            if (award('phonics-word-' + L + i, 1)) document.getElementById(`ph-${L}-${i}`).classList.add('ring-4', 'ring-green-400');
        }

        // Mini game: "Which one starts with B?" — 4 rounds, answers lock after the first tap
        function startPhonicsGame() {
            const letters = lettersFor(state.unit);
            const others = ALPHABET.filter(L => !letters.includes(L));
            const rounds = [];
            for (let r = 0; r < 4; r++) {
                const L = letters[r % letters.length];
                const right = PHONICS_WORDS[L][r % 4];
                const fits = ([w]) => L === 'X' ? /x/i.test(w) : w[0].toUpperCase() === L;
                const pool = others.flatMap(o => PHONICS_WORDS[o]).filter(p => !fits(p) && p[1] !== right[1]);
                const wrong = shuffle(pool).slice(0, 2);
                rounds.push({ L, right, options: shuffle([right, ...wrong]) });
            }
            phonicsGame = { rounds, index: 0, score: 0, locked: false };
            showPhonicsRound();
        }
        function showPhonicsRound() {
            const box = document.getElementById('phonics-game');
            if (!box) return;
            phonicsGame.locked = false;
            const g = phonicsGame;
            if (g.index >= g.rounds.length) {
                const perfect = g.score === g.rounds.length;
                const got = perfect && award(unitKey('phonics-game'), 3);
                if (perfect) triggerConfetti();
                box.innerHTML = `
                    <p class="font-bold text-purple-900 text-lg text-center mb-2">${perfect ? '🏆' : '💪'} ${g.score} / ${g.rounds.length} correct${got ? ' (+3 ⭐)' : ''}</p>
                    <p class="text-center text-sm text-gray-600 mb-3">${perfect ? 'Super listening!' : 'Get all 4 right to earn 3 ⭐!'}</p>
                    <div class="text-center"><button onclick="startPhonicsGame()" class="bg-purple-600 hover:bg-purple-700 text-white font-bold px-5 py-2 rounded-xl shadow cursor-pointer">🔁 Play again</button></div>`;
                return;
            }
            const round = g.rounds[g.index];
            const ask = round.L === 'X' ? 'Which one ends with X?' : `Which one starts with ${round.L}?`;
            box.innerHTML = `
                <p class="font-bold text-purple-900 mb-1">🎮 Letter game (${g.index + 1}/${g.rounds.length})</p>
                <p class="text-lg font-bold text-gray-800 mb-3">${ask} <button onclick="speak('${ask}')" class="text-sm text-blue-600 underline cursor-pointer">🔊</button></p>
                <div class="grid grid-cols-3 gap-3" id="phonics-options">
                    ${round.options.map(([w, e]) => `<button onclick="answerPhonics('${jsArg(w)}')" class="bg-white p-3 rounded-xl shadow hover:bg-purple-100 cursor-pointer flex flex-col items-center gap-1"><span class="text-4xl">${e}</span><span class="text-sm font-semibold">${w}</span></button>`).join('')}
                </div>
                <p id="phonics-ans" class="mt-3 font-bold min-h-[1.5rem]"></p>`;
            speak(ask);
        }
        function answerPhonics(word) {
            if (phonicsGame.locked) return;
            phonicsGame.locked = true;
            document.querySelectorAll('#phonics-options button').forEach(b => b.disabled = true);
            const round = phonicsGame.rounds[phonicsGame.index];
            const el = document.getElementById('phonics-ans');
            if (word === round.right[0]) {
                phonicsGame.score++;
                el.className = 'mt-3 font-bold min-h-[1.5rem] text-green-600';
                el.textContent = `🎉 Yes! ${round.right[0]} ${round.L === 'X' ? 'ends' : 'starts'} with ${round.L}.`;
            } else {
                el.className = 'mt-3 font-bold min-h-[1.5rem] text-red-500';
                el.textContent = `❌ It was ${round.right[0]} ${round.right[1]}`;
            }
            speak(round.right[0]);
            phonicsGame.index++;
            setTimeout(showPhonicsRound, 1300);
        }

        // Full alphabet for review (letters from finished units show a green ring)
        function renderAlphabet() {
            const contentDiv = document.getElementById('module-content');
            contentDiv.innerHTML = `
                <h2 class="text-xl font-bold text-blue-800 mb-2">🔤 All letters A–Z</h2>
                <p class="text-gray-600 mb-4">Tap a letter to hear it. Green letters are ones you have practised.</p>
                <div class="bg-yellow-50 border-2 border-dashed border-yellow-300 rounded-2xl p-6">
                    <div class="grid grid-cols-4 sm:grid-cols-6 gap-3 mb-4">
                        ${ALPHABET.map(L => `
                            <button onclick="speak(letterIntro('${L}'))" class="bg-white p-3 rounded-xl shadow font-bold text-blue-800 hover:bg-yellow-100 cursor-pointer flex flex-col items-center ${progress.awarded[state.level + '|phonics-letter-' + L] ? 'ring-4 ring-green-400' : ''}">
                                <span class="text-2xl">${L}${L.toLowerCase()}</span>
                                <span class="text-xl">${PHONICS_WORDS[L][0][1]}</span>

        function youtubeIdOf(link) {
            const s = String(link || '').trim();
            if (/^[A-Za-z0-9_-]{11}$/.test(s)) return s;
            const m = s.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/))([A-Za-z0-9_-]{11})/);
            return m ? m[1] : '';

ion."],[275.52,281.42,"Relativism challenges this by suggesting that truth depends on cultural perspective."],[282.72,288.57,"In what some call a post-truth era, emotional appeal often outweighs evidence in public debate."],[289.88,296.5,"Only by valuing verifiability and intellectual humility can societies resist dogma."],[297.82,304.84,"Perhaps the mark of an educated mind is not certitude, but the capacity for well-founded doubt."],[306.15,308.93,"Quiz time! Choose the correct answer."],[309.23,311.81,"The study of knowledge and belief is blank."],[312.11,316.31,"A, epistemology. B, empiricism. C, dogma."],[320.32,323.09,"The answer is A: epistemology."],[324.58,327.61,"Only in mathematics blank complete certainty."],[327.9,332.68,"A, we find. B, do we find. C, we do find."],[336.68,339.2,"The answer is B: do we find."],[340.72,343.39,"Not until he apologised blank the problem."],[343.69,350.63,"A, she understood. B, did she understand. C, she did understand."],[354.62,357.6,"The answer is B: did she understand."],[359.12,362.37,"A belief presented as unquestionable is blank."],[362.67,367.22,"A, dogma. B, verifiability. C, certitude."],[371.22,373.13,"The answer is A: dogma."],[374.65,378.27,"According to the text, what may be the mark of an educated mind?"],[378.57,385.64,"A, certitude. B, the capacity for well-founded doubt. C, rationalism alone."],[389.65,393.82,"The answer is B: the capacity for well-founded doubt."],[395.32,401.95,"Now it's your turn. Part one: Is truth universal, or does it depend on culture?"],[407.25,413.55,"Part two: Use one inverted structure, defend a position and address one counter-argument."],[419.85,436.84,"I'd argue that factual truth is universal, while moral judgements are more culturally shaped. Only through evidence can disputes about facts be settled. A relativist might object that evidence itself is interpreted culturally, but that does not make all interpretations equally valid."],[437.14,440.18,"That is a well-argued answer!"],[441.18,447.16,"Great work today! You learned eight new words and advanced inversion and emphasis."],[447.46,450.88,"Today's value is honesty. Always tell the truth."],[451.18,453.64,"See you in Unit two. Goodbye!"],[453.94,456.37,"Thank you, Ms. Sarah! Bye, everyone!"]],"OC-Proficiency-Unit02-Power-and-Legitimacy":[[0.35,5.0,"Hello, everyone! I'm Ms. Sarah. Welcome to Online Proficiency."],[5.3,8.68,"Hi! I'm Rithy. Let's learn together!"],[8.98,18.33,"Unit two: Power and Legitimacy. In this unit, you will analyse forms of power and what makes authority legitimate."],[19.32,20.36,"hegemony."],[21.06,26.34,"hegemony means dominance of one group or state over others, often through consent."],[26.64,29.94,"Cultural hegemony shapes what people see as normal."],[30.64,33.09,"Your turn. Say: hegemony."],[35.79,36.76,"hegemony."],[37.75,39.17,"authoritarianism."],[39.87,45.63,"authoritarianism means a system demanding obedience and limiting personal freedom."],[45.93,50.26,"Political scientists study why authoritarianism persists."],[50.96,54.29,"Your turn. Say: authoritarianism."],[56.99,58.3,"authoritarianism."],[59.32,60.34,"technocracy."],[61.04,64.13,"technocracy means government by technical experts."],[64.43,69.01,"Supporters of technocracy value expertise over popularity."],[69.71,72.13,"Your turn. Say: technocracy."],[74.83,76.05,"technocracy."],[77.05,78.28,"oligarchy."],[78.98,82.22,"oligarchy means rule by a small group of powerful people."],[82.53,85.86,"Aristotle warned that oligarchy serves only the few."],[86.56,89.55,"Your turn. Say: oligarchy."],[92.25,93.27,"oligarchy."],[94.28,95.45,"plutocracy."],[96.15,98.66,"plutocracy means rule by the wealthy."],[98.96,102.57,"Critics fear that money in politics leads to plutocracy."],[103.27,106.36,"Your turn. Say: plutocracy."],[109.06,110.19,"plutocracy."],[111.18,112.99,"meritocratic ideal."],[113.69,118.48,"meritocratic ideal means the belief that positions should go to the most capable."],[118.78,122.79,"The meritocratic ideal assumes equal opportunity."],[123.49,127.33,"Your turn. Say: meritocratic ideal."],[130.03,131.56,"meritocratic ideal."],[132.55,133.57,"mandate."],[134.27,137.95,"mandate means the authority given by voters or a higher body."],[138.25,141.52,"A government needs a clear mandate for major reforms."],[142.22,144.6,"Your turn. Say: mandate."],[147.3,148.31,"mandate."],[149.32,150.67,"patronage network."],[151.37,156.44,"patronage network means a system of favours exchanged for loyalty."],[156.74,160.09,"Patronage networks can undermine fair competition."],[160.79,164.16,"Your turn. Say: patronage network."],[166.86,168.31,"patronage network."],[169.32,171.68,"Now let's listen to a conversation."],[171.98,176.27,"Ms. Sarah, what makes power legitimate rather than simply strong?"],[177.58,183.39,"Broadly speaking, consent. Power tends to be seen as legitimate when people accept it as fair."],[184.68,186.75,"Even if it isn't democratic?"],[188.05,194.02,"Arguably. Some technocracies claim legitimacy through results rather than elections."],[195.32,198.41,"But surely that risks sliding into oligarchy?"],[199.72,205.03,"It may well do, particularly where patronage networks replace fair competition."],[206.32,208.26,"And the meritocratic ideal?"],[209.55,215.87,"It is, to my mind, attractive in theory, though it presupposes genuinely equal opportunity."],[217.18,221.77,"Grammar focus: Hedging and stance in academic writing."],[222.07,227.04,"At C2, stance markers show exactly how strongly you commit to a claim."],[227.34,233.36,"Broadly speaking, legitimacy depends on consent. It may well slide into oligarchy."],[233.66,236.63,"The ideal presupposes equal opportunity."],[236.93,243.35,"C2 writers signal their stance precisely: how certain they are and how far they commit to a claim."],[244.35,247.33,"Now read and listen. Why Do People Obey?."],[247.63,253.48,"The sociologist Max Weber distinguished three sources of legitimate authority."],[254.78,262.99,"Traditional authority rests on custom, charismatic authority on personal appeal, and legal authority on rules."],[264.28,270.18,"Broadly speaking, modern states claim legitimacy through law and a democratic mandate."],[271.48,277.06,"Yet legitimacy can erode when patronage networks override fair procedures."],[278.35,285.6,"Some theorists argue that hegemony operates most effectively when power feels natural rather than imposed."],[286.88,292.68,"Technocracy offers an alternative claim to legitimacy, based on expertise and performance."],[293.98,299.68,"Critics contend, however, that expertise without accountability may drift towards oligarchy."],[300.98,306.28,"Legitimacy, it would appear, must be continually earned rather than simply possessed."],[307.58,310.41,"Quiz time! Choose the correct answer."],[310.71,312.78,"Rule by the wealthy is blank."],[313.08,317.03,"A, plutocracy. B, technocracy. C, mandate."],[321.05,323.51,"The answer is A: plutocracy."],[325.02,327.25,"Which phrase marks the writer's stance?"],[327.55,331.69,"A, To my mind. B, Next. C, Because."],[335.68,338.27,"The answer is A: To my mind."],[339.78,342.49,"The plan blank well fail without funding."],[342.79,346.22,"A, may. B, must. C, should."],[350.22,352.13,"The answer is A: may."],[353.65,357.35,"A system of favours exchanged for loyalty is a blank."],[357.64,363.19,"A, patronage network. B, meritocratic ideal. C, hegemony."],[367.18,370.22,"The answer is A: patronage network."],[371.72,376.5,"According to the text, how many sources of authority did Weber identify?"],[376.8,379.99,"A, two. B, three. C, four."],[383.98,386.42,"The answer is B: three."],[387.92,394.32,"Now it's your turn. Part one: What makes a government legitimate in the eyes of its citizens?"],[399.62,405.49,"Part two: Use stance markers and hedges; present two criteria and evaluate one."],[411.78,424.85,"Broadly speaking, I would point to fair procedures and tangible results. Of the two, fairness arguably matters more in the long term, since results without accountability may well erode public trust."],[425.15,428.21,"That is a well-argued answer!"],[429.22,434.53,"Great work today! You learned eight new words and hedging and stance in academic writing."],[434.83,439.31,"Today's value is responsibility. Help at home and do your jobs."],[439.61,441.98,"See you in Unit three. Goodbye!"],[442.28,445.24,"Thank you, Ms. Sarah! Bye, everyone!"]],"OC-Proficiency-Unit03-Language-as-Power":[[0.35,5.61,"Hello, everyone! I'm Ms. Sarah. Welcome to Online Proficiency."],[5.91,8.89,"Hi! I'm Rithy. Let's learn together!"],[9.19,16.6,"Unit three: Language as Power. In this unit, you will analyse how language shapes power and perception."],[17.58,19.42,"linguistic imperialism."],[20.12,26.11,"linguistic imperialism means the dominance of one language over others, often linked to power."],[26.41,31.21,"Some scholars describe the global spread of English as linguistic imperialism."],[31.91,36.14,"Your turn. Say: linguistic imperialism."],[38.84,40.59,"linguistic imperialism."],[41.58,42.71,"loaded term."],[43.41,48.85,"loaded term means a word carrying strong emotional or political implications."],[49.15,52.16,"'Regime' is a loaded term compared with 'government'."],[52.86,56.09,"Your turn. Say: loaded term."],[58.79,59.97,"loaded term."],[60.95,62.35,"prestige dialect."],[63.05,69.06,"prestige dialect means the variety of a language associated with education and status."],[69.36,73.0,"The Phnom Penh accent is often treated as a prestige dialect."],[73.7,77.5,"Your turn. Say: prestige dialect."],[80.2,81.6,"prestige dialect."],[82.58,83.73,"code of power."],[84.44,89.22,"code of power means the language and behaviour rules expected by those in power."],[89.52,93.66,"Students from rural areas must learn the code of power."],[94.36,97.19,"Your turn. Say: code of power."],[99.9,101.01,"code of power."],[102.02,103.01,"euphemism."],[103.71,107.84,"euphemism means a mild word used instead of a harsh or direct one."],[108.14,110.37,"'Let go' is a euphemism for 'fired'."],[111.07,113.95,"Your turn. Say: euphemism."],[116.65,117.69,"euphemism."],[118.68,119.68,"doublespeak."],[120.38,124.01,"doublespeak means language deliberately designed to hide meaning."],[124.31,127.88,"'Collateral damage' is often criticised as doublespeak."],[128.58,131.41,"Your turn. Say: doublespeak."],[134.11,135.09,"doublespeak."],[136.08,137.75,"political correctness."],[138.45,142.4,"political correctness means avoiding language that might offend groups."],[142.7,145.66,"Debates about political correctness are often heated."],[146.36,149.69,"Your turn. Say: political correctness."],[152.38,153.92,"political correctness."],[154.92,156.3,"framing language."],[157.0,162.0,"framing language means words chosen to present an issue in a particular light."],[162.3,166.19,"'Tax relief' is framing language that presents tax as a burden."],[166.89,170.21,"Your turn. Say: framing language."],[172.91,174.2,"framing language."],[175.22,177.44,"Now let's listen to a conversation."],[177.74,181.7,"Rithy, have you noticed how word choice shapes our view of events?"],[182.98,189.24,"Constantly. The description of a protest as a 'riot' implies violence and disorder."],[190.55,195.79,"Exactly. That's a loaded term. And corporate euphemism is everywhere."],[197.08,200.16,"'Workforce optimisation' instead of mass dismissal."],[201.45,205.72,"The concealment of harsh realities through doublespeak has a long history."],[207.02,211.69,"And accent can matter too. Mastery of a prestige dialect opens doors."],[212.98,218.2,"Some call that the code of power. Its acquisition is rarely taught explicitly."],[219.52,223.27,"Which makes awareness of framing language a form of empowerment."],[224.58,228.75,"Grammar focus: Nominal style and lexical density."],[229.05,233.4,"C2 academic style is lexically dense, built on noun phrases."],[233.7,240.98,"The description of a protest as a riot implies violence. Mastery of a prestige dialect opens doors."],[241.28,243.45,"Balance density with clarity."],[243.75,250.34,"High lexical density packs ideas into noun phrases; balance it with clarity so that readers can follow."],[251.35,254.11,"Now read and listen. Words That Rule."],[254.41,260.09,"Language is not merely a tool for describing reality; it actively shapes our perception of it."],[261.38,266.12,"The selection of a single loaded term can alter public sympathy for an entire group."],[267.42,273.84,"Governments and corporations alike rely on euphemism to soften unwelcome news."],[275.15,280.39,"George Orwell warned that political language is designed to make lies sound truthful."],[281.68,288.56,"At a global level, the dominance of English has been described by some scholars as linguistic imperialism."],[289.85,295.76,"Within societies, the privileging of a prestige dialect can reinforce social hierarchies."],[297.05,303.02,"Critical awareness of framing language therefore becomes a form of intellectual self-defence."],[304.32,310.08,"To understand power, one must first understand the words through which it is exercised."],[311.38,313.9,"Quiz time! Choose the correct answer."],[314.2,317.4,"A mild word used instead of a harsh one is a blank."],[317.7,322.98,"A, euphemism. B, loaded term. C, code of power."],[326.98,329.14,"The answer is A: euphemism."],[330.65,335.79,"'They described the event as a riot.' → 'The blank of the event as a riot...'"],[336.09,340.89,"A, describe. B, description. C, describing."],[344.88,347.32,"The answer is B: description."],[348.82,351.25,"Which phrase is most lexically dense?"],[351.55,357.96,"A, because they hid the truth. B, the concealment of the truth. C, they were hiding it."],[361.95,365.29,"The answer is B: the concealment of the truth."],[366.78,370.28,"Language deliberately designed to hide meaning is blank."],[370.58,375.93,"A, doublespeak. B, prestige dialect. C, framing language."],[379.92,382.93,"The answer is A: doublespeak."],[384.42,388.04,"According to the text, who warned about political language?"],[388.34,392.27,"A, Weber. B, Orwell. C, Descartes."],[396.28,398.51,"The answer is B: Orwell."],[400.02,406.01,"Now it's your turn. Part one: How does language reinforce or challenge power in society?"],[411.31,417.54,"Part two: Use nominal style: analyse two examples and propose one response."],[423.84,436.21,"The use of euphemism by institutions and the privileging of urban accents both reinforce existing power. A meaningful response would be the explicit teaching of critical language awareness in schools."],[436.51,438.9,"That is a well-argued answer!"],[439.92,445.65,"Great work today! You learned eight new words and nominal style and lexical density."],[445.95,449.53,"Today's value is respect. Thank the people who help us."],[449.83,452.14,"See you in Unit four. Goodbye!"],[452.44,455.78,"Thank you, Ms. Sarah! Bye, everyone!"]],"OC-Proficiency-Unit04-The-Ethics-of-Wealth":[[0.35,5.48,"Hello, everyone! I'm Ms. Sarah. Welcome to Online Proficiency."],[5.78,8.83,"Hi! I'm Rithy. Let's learn together!"],[9.13,16.54,"Unit four: The Ethics of Wealth. In this unit, you will debate the moral responsibilities that come with wealth."],[17.55,19.18,"effective altruism."],[19.88,24.9,"effective altruism means a movement using evidence to do the most good with resources."],[25.2,29.36,"Effective altruism asks which charities save the most lives."],[30.05,33.84,"Your turn. Say: effective altruism."],[36.55,38.3,"effective altruism."],[39.32,41.05,"philanthropic foundation."],[41.75,47.07,"philanthropic foundation means an organisation set up to give money to good causes."],[47.37,50.73,"The philanthropic foundation funds malaria research."],[51.43,55.0,"Your turn. Say: philanthropic foundation."],[57.7,59.45,"philanthropic foundation."],[60.45,61.72,"inherited wealth."],[62.42,67.25,"inherited wealth means money and property received from family."],[67.55,70.14,"Inherited wealth can entrench inequality."],[70.84,74.38,"Your turn. Say: inherited wealth."],[77.08,78.14,"inherited wealth."],[79.15,80.95,"conspicuous consumption."],[81.65,85.92,"conspicuous consumption means spending to display wealth and status."],[86.22,89.9,"Luxury cars are a classic form of conspicuous consumption."],[90.6,94.23,"Your turn. Say: conspicuous consumption."],[96.93,98.64,"conspicuous consumption."],[99.65,101.16,"moral obligation."],[101.86,106.37,"moral obligation means a duty based on ethics rather than law."],[106.67,109.37,"Do the rich have a moral obligation to give?"],[110.06,113.22,"Your turn. Say: moral obligation."],[115.92,117.41,"moral obligation."],[118.42,120.31,"utilitarian calculus."],[121.01,126.1,"utilitarian calculus means weighing actions by the total happiness they produce."],[126.4,130.4,"A utilitarian calculus might favour cheap, life-saving aid."],[131.1,135.19,"Your turn. Say: utilitarian calculus."],[137.89,139.89,"utilitarian calculus."],[140.88,142.14,"tax haven."],[142.84,147.96,"tax haven means a country with very low taxes used to avoid tax elsewhere."],[148.26,150.65,"Billions are hidden in tax havens."],[151.34,154.49,"Your turn. Say: tax haven."],[157.19,158.21,"tax haven."],[159.22,160.41,"wealth tax."],[161.12,165.7,"wealth tax means a tax on the total value of a person's assets."],[166.0,168.53,"Several countries have debated a wealth tax."],[169.23,172.1,"Your turn. Say: wealth tax."],[174.8,175.94,"wealth tax."],[176.95,179.16,"Now let's listen to a conversation."],[179.46,182.92,"Ms. Sarah, does great wealth bring great moral obligation?"],[184.22,190.29,"Many philosophers think so. Peter Singer, for one, argues that we must give far more than we do."],[191.58,196.1,"That's effective altruism, isn't it? Using evidence to maximise good."],[197.42,202.43,"Yes. This approach relies on a kind of utilitarian calculus."],[203.72,208.48,"Critics say it ignores justice. Such charity can't replace fair taxation."],[209.78,214.25,"That point is well made. Some propose a wealth tax for that very reason."],[215.55,218.04,"Meanwhile, money flows to tax havens."],[219.35,224.33,"Which suggests that the former problem, giving, may matter less than the latter, avoidance."],[225.62,228.71,"Grammar focus: Cohesion and reference."],[229.01,232.46,"Cohesive reference connects ideas across sentences."],[232.76,238.79,"This approach relies on a utilitarian calculus. Such charity can't replace fair taxation."],[239.09,241.68,"The former problem may matter less than the latter."],[241.98,248.98,"Summarising nouns (this approach, such a view) link ideas smoothly and avoid repetition in long arguments."],[249.98,253.08,"Now read and listen. How Much Should the Rich Give?."],[253.38,258.6,"Wealth is distributed with remarkable inequality across the globe."],[259.92,265.75,"Philosopher Peter Singer argues that, if we can prevent suffering at little cost, we ought to do so."],[267.05,274.59,"This argument underpins effective altruism, a movement that evaluates charities by measurable impact."],[275.88,281.5,"Such an approach has directed millions towards cheap, life-saving interventions."],[282.82,290.19,"Critics, however, contend that philanthropy allows the wealthy to choose causes without democratic accountability."],[291.48,299.23,"They argue that fair taxation, including measures against tax havens, matters more than voluntary generosity."],[300.52,306.68,"Conspicuous consumption, meanwhile, raises questions about the moral meaning of luxury."],[307.98,312.78,"The former debate concerns how to give; the latter, whether giving is enough."],[314.08,316.92,"Quiz time! Choose the correct answer."],[317.22,320.01,"Spending to display wealth and status is blank."],[320.31,326.54,"A, conspicuous consumption. B, effective altruism. C, wealth tax."],[330.55,333.91,"The answer is A: conspicuous consumption."],[335.42,339.78,"He studied law and medicine; blank led him to research."],[340.08,344.31,"A, the latter. B, the after. C, the second one."],[348.32,351.26,"The answer is A: the latter."],[352.75,355.65,"blank an approach has saved many lives."],[355.95,359.48,"A, Such. B, So. C, This such."],[363.48,365.69,"The answer is A: Such."],[367.18,371.17,"A country with very low taxes used for avoidance is a blank."],[371.47,378.01,"A, tax haven. B, philanthropic foundation. C, mandate."],[382.02,384.49,"The answer is A: tax haven."],[385.98,390.29,"According to the text, what do critics say philanthropy lacks?"],[390.59,395.25,"A, money. B, democratic accountability. C, evidence."],[399.25,402.74,"The answer is B: democratic accountability."],[404.25,410.86,"Now it's your turn. Part one: Do wealthy people have a moral duty to give away much of their wealth?"],[416.16,421.55,"Part two: Use cohesive reference to compare two positions and conclude."],[427.85,442.24,"Singer's view is that we must give whenever we can prevent suffering cheaply. The opposing view prioritises fair taxation over charity. Of the two, the latter seems more just, though the former still has moral force for individuals."],[442.54,445.39,"That is a well-argued answer!"],[446.38,451.0,"Great work today! You learned eight new words and cohesion and reference."],[451.3,454.55,"Today's value is kindness. Be kind to everyone."],[454.85,457.46,"See you in Unit five. Goodbye!"],[457.76,460.27,"Thank you, Ms. Sarah! Bye, everyone!"]],"OC-Proficiency-Unit05-Consciousness-and-AI":[[0.35,5.2,"Hello, everyone! I'm Ms. Sarah. Welcome to Online Proficiency."],[5.5,8.47,"Hi! I'm Rithy. Let's learn together!"],[8.77,15.88,"Unit five: Consciousness and AI. In this unit, you will debate whether machines could ever be conscious."],[16.88,19.14,"artificial general intelligence."],[19.84,27.13,"artificial general intelligence means a hypothetical AI able to perform any intellectual task a human can."],[27.43,32.64,"Experts disagree about when, or whether, artificial general intelligence will arrive."],[33.34,37.46,"Your turn. Say: artificial general intelligence."],[40.16,42.33,"artificial general intelligence."],[43.32,45.08,"machine consciousness."],[45.78,51.2,"machine consciousness means the idea that a machine could have subjective experience."],[51.5,55.31,"Machine consciousness remains a philosophical puzzle."],[56.01,59.88,"Your turn. Say: machine consciousness."],[62.58,64.58,"machine consciousness."],[65.58,66.75,"Turing test."],[67.45,74.03,"Turing test means a test of whether a machine's conversation is indistinguishable from a human's."],[74.33,78.34,"Some chatbots now pass simple versions of the Turing test."],[79.04,82.0,"Your turn. Say: Turing test."],[84.69,85.88,"Turing test."],[86.88,87.98,"Chinese room."],[88.68,94.5,"Chinese room means Searle's thought experiment arguing that symbol manipulation is not understanding."],[94.8,98.87,"The Chinese room challenges claims that computers understand language."],[99.57,102.58,"Your turn. Say: Chinese room."],[105.28,106.22,"Chinese room."],[107.22,108.29,"sentience."],[108.99,113.03,"sentience means the capacity to feel sensations and emotions."],[113.33,116.31,"Animal welfare laws are based on sentience."],[117.0,119.36,"Your turn. Say: sentience."],[122.06,123.06,"sentience."],[124.05,125.41,"alignment problem."],[126.11,131.27,"alignment problem means the challenge of making AI goals match human values."],[131.57,135.61,"The alignment problem worries many AI researchers."],[136.31,139.37,"Your turn. Say: alignment problem."],[142.07,143.34,"alignment problem."],[144.35,145.85,"emergent behaviour."],[146.55,150.81,"emergent behaviour means complex behaviour arising from simple parts."],[151.11,154.53,"Large models show emergent behaviour nobody programmed."],[155.23,158.69,"Your turn. Say: emergent behaviour."],[161.4,162.97,"emergent behaviour."],[163.95,165.51,"large language model."],[166.21,170.6,"large language model means an AI trained on vast text to generate language."],[170.9,174.15,"A large language model can write essays in seconds."],[174.85,178.46,"Your turn. Say: large language model."],[181.16,182.61,"large language model."],[183.62,185.8,"Now let's listen to a conversation."],[186.1,191.21,"Rithy, do you think a large language model actually understands what it says?"],[192.52,195.26,"Well, it's not exactly bad at pretending."],[196.55,201.19,"That's a lovely bit of understatement. Searle would say it's just a Chinese room."],[202.48,207.98,"Manipulating symbols without meaning. Rather like some students before exams!"],[209.28,213.16,"Ha! But emergent behaviour does surprise researchers."],[214.45,218.33,"True. Passing the Turing test isn't the same as sentience, though."],[219.62,222.62,"And if we ever built artificial general intelligence?"],[223.92,227.91,"Then the alignment problem would be, shall we say, slightly important."],[229.22,233.64,"Grammar focus: Irony, understatement and tone."],[233.94,238.57,"At C2, you can use irony and understatement to add subtle humour."],[238.87,244.24,"It's not exactly bad at pretending. The problem would be, shall we say, slightly important."],[244.53,247.17,"The real meaning comes from tone and context."],[247.47,254.82,"Understatement and irony are typical of educated English humour; context and tone make the real meaning clear."],[255.82,258.72,"Now read and listen. Can a Machine Think?."],[259.02,266.99,"In 1950, Alan Turing proposed that if a machine could converse like a human, we might call it intelligent."],[268.28,274.09,"Decades later, large language models produce fluent text that often passes such informal tests."],[275.38,281.25,"Yet philosopher John Searle's Chinese room argument suggests that fluency is not understanding."],[282.55,289.04,"A person following rules to manipulate Chinese symbols, he argued, need not understand Chinese."],[290.35,296.64,"Machine consciousness raises an even harder question: could a system ever have subjective experience?"],[297.95,303.94,"Some researchers point to emergent behaviour as evidence that we do not fully understand these systems."],[305.25,310.76,"If artificial general intelligence were achieved, the alignment problem would become urgent."],[312.05,318.24,"It is, to put it mildly, a question worth answering before the technology answers it for us."],[319.55,322.04,"Quiz time! Choose the correct answer."],[322.34,325.4,"The capacity to feel sensations is blank."],[325.7,331.04,"A, sentience. B, alignment problem. C, Turing test."],[335.05,337.13,"The answer is A: sentience."],[338.62,341.74,"'It was not exactly cheap' most likely means blank."],[342.04,347.12,"A, it was cheap. B, it was expensive. C, it was free."],[351.12,354.03,"The answer is B: it was expensive."],[355.55,357.81,"Which is an example of understatement?"],[358.11,365.15,"A, It's a disaster!. B, It's slightly inconvenient (about a flood).. C, It's terrible.."],[369.15,373.62,"The answer is B: It's slightly inconvenient (about a flood).."],[375.12,378.83,"Searle's argument against computer understanding is the blank."],[379.13,384.43,"A, Chinese room. B, Turing test. C, large language model."],[388.42,390.97,"The answer is A: Chinese room."],[392.48,397.08,"According to the text, what would become urgent if AGI were achieved?"],[397.38,402.94,"A, the Turing test. B, the alignment problem. C, translation."],[406.95,409.89,"The answer is B: the alignment problem."],[411.38,416.83,"Now it's your turn. Part one: Could a machine ever truly understand language?"],[422.13,428.5,"Part two: Take a position, refer to one thought experiment, and add a touch of understatement."],[434.8,447.01,"I'm sceptical. The Chinese room suggests that producing correct answers is not the same as understanding them. Current models are, to put it mildly, impressive mimics, but mimicry is not meaning."],[447.31,450.17,"That is a well-argued answer!"],[451.18,456.75,"Great work today! You learned eight new words and irony, understatement and tone."],[457.05,461.83,"Today's value is curiosity. Ask questions and find out."],[462.13,464.74,"See you in Unit six. Goodbye!"],[465.04,468.0,"Thank you, Ms. Sarah! Bye, everyone!"]],"OC-Proficiency-Unit06-Literature-and-Society":[[0.35,5.2,"Hello, everyone! I'm Ms. Sarah. Welcome to Online Proficiency."],[5.5,8.6,"Hi! I'm Rithy. Let's learn together!"],[8.89,16.69,"Unit six: Literature and Society. In this unit, you will discuss how literature reflects and shapes society."],[17.68,19.07,"literary canon."],[19.77,24.52,"literary canon means the works considered most important in a literary tradition."],[24.82,28.25,"The literary canon has long excluded many voices."],[28.95,32.16,"Your turn. Say: literary canon."],[34.86,36.05,"literary canon."],[37.05,38.77,"postcolonial literature."],[39.47,45.1,"postcolonial literature means writing that responds to the experience of colonialism."],[45.4,49.09,"Postcolonial literature questions European narratives."],[49.79,53.61,"Your turn. Say: postcolonial literature."],[56.31,58.1,"postcolonial literature."],[59.12,60.67,"magical realism."],[61.38,66.66,"magical realism means a style mixing realistic settings with magical events."],[66.96,69.81,"García Márquez is famous for magical realism."],[70.51,74.42,"Your turn. Say: magical realism."],[77.12,78.58,"magical realism."],[79.58,81.27,"unreliable narrator."],[81.97,86.75,"unreliable narrator means a storyteller whose account cannot be fully trusted."],[87.06,91.12,"The unreliable narrator hides the truth until the final chapter."],[91.82,95.9,"Your turn. Say: unreliable narrator."],[98.6,100.23,"unreliable narrator."],[101.22,102.75,"stream of consciousness."],[103.45,108.91,"stream of consciousness means writing that follows a character's continuous flow of thoughts."],[109.21,111.8,"Virginia Woolf used stream of consciousness."],[112.5,116.28,"Your turn. Say: stream of consciousness."],[118.98,120.6,"stream of consciousness."],[121.58,122.68,"satire."],[123.38,128.26,"satire means using humour or exaggeration to criticise society."],[128.56,131.53,"Animal Farm is a political satire."],[132.23,135.58,"Your turn. Say: satire."],[138.28,139.27,"satire."],[140.28,141.52,"bildungsroman."],[142.22,147.15,"bildungsroman means a novel about a character's growth from youth to maturity."],[147.45,150.01,"Many first novels are a bildungsroman."],[150.71,154.27,"Your turn. Say: bildungsroman."],[156.97,158.07,"bildungsroman."],[159.08,160.59,"dystopian fiction."],[161.3,165.94,"dystopian fiction means stories set in nightmarish future societies."],[166.24,169.5,"Dystopian fiction often reflects present fears."],[170.19,173.97,"Your turn. Say: dystopian fiction."],[176.67,178.12,"dystopian fiction."],[179.12,181.28,"Now let's listen to a conversation."],[181.58,185.11,"Ms. Sarah, why should we read novels written in other centuries?"],[186.42,192.29,"Because the stories through which societies imagine themselves reveal what they value and fear."],[193.58,197.16,"Like dystopian fiction reflecting fears about surveillance?"],[198.45,206.22,"Exactly. And postcolonial literature challenges the narrow, largely European literary canon of the past."],[207.52,211.99,"My favourite is magical realism. It makes the impossible feel ordinary."],[213.28,218.48,"A style that has inspired a whole generation of Southeast Asian writers, in fact."],[219.78,223.86,"And I love an unreliable narrator. You never know whom to trust."],[225.15,229.54,"Which is, arguably, the best preparation for reading the news."],[230.85,233.67,"Grammar focus: Complex noun phrases."],[233.97,237.63,"C2 writing uses complex noun phrases to pack meaning."],[237.93,242.32,"The stories through which societies imagine themselves reveal their values."],[242.62,246.94,"The narrow, largely European literary canon of the past was challenged."],[247.24,253.7,"Complex noun phrases let you express sophisticated ideas compactly; keep the head noun clear."],[254.72,257.9,"Now read and listen. Why Literature Matters."],[258.2,263.36,"Literature has always been a mirror in which societies examine their hopes and anxieties."],[264.65,271.31,"For centuries, the literary canon was dominated by a narrow group of mostly European male writers."],[272.62,279.56,"Postcolonial literature, emerging from formerly colonised nations, offered powerful alternative perspectives."],[280.85,287.42,"Techniques such as stream of consciousness allowed writers to represent the complexity of inner life."],[288.72,293.64,"Satire, from Swift to Orwell, has used exaggeration to expose injustice."],[294.95,299.77,"Dystopian fiction imagines futures that warn us about tendencies in the present."],[301.08,306.64,"The bildungsroman, meanwhile, traces the painful and rewarding process of growing up."],[307.95,315.43,"In an age of short attention spans, the sustained imaginative effort of reading may be more valuable than ever."],[316.72,319.53,"Quiz time! Choose the correct answer."],[319.83,323.69,"A storyteller whose account cannot be trusted is an blank."],[323.99,329.07,"A, unreliable narrator. B, literary canon. C, satire."],[333.08,335.75,"The answer is A: unreliable narrator."],[337.25,339.48,"Which is a complex noun phrase?"],[339.78,344.38,"A, the book. B, the books that shaped modern thought. C, books."],[348.38,351.97,"The answer is B: the books that shaped modern thought."],[353.48,356.88,"'The world blank which the novel is set' is grim."],[357.18,360.0,"A, in. B, on. C, at."],[364.02,366.28,"The answer is A: in."],[367.78,369.92,"A novel about growing up is a blank."],[370.22,376.56,"A, bildungsroman. B, dystopian fiction. C, magical realism."],[380.55,383.14,"The answer is A: bildungsroman."],[384.65,387.93,"According to the text, what does dystopian fiction do?"],[388.23,394.54,"A, imagines warning futures. B, describes the past. C, avoids politics."],[398.55,401.56,"The answer is A: imagines warning futures."],[403.05,409.3,"Now it's your turn. Part one: Which book or story has most influenced your view of the world?"],[414.6,421.04,"Part two: Describe it using a complex noun phrase and explain its social message."],[427.34,438.31,"The novel that most shaped my thinking was Orwell's Animal Farm, a short but devastating political satire. It shows how revolutions intended to free people can produce new tyrannies."],[438.61,440.49,"That is a well-argued answer!"],[441.48,446.28,"Great work today! You learned eight new words and complex noun phrases."],[446.58,450.9,"Today's value is creativity. Use your imagination when you play."],[451.2,453.84,"See you in Unit seven. Goodbye!"],[454.14,456.8,"Thank you, Ms. Sarah! Bye, everyone!"]],"OC-Proficiency-Unit07-The-Anthropocene":[[0.35,5.14,"Hello, everyone! I'm Ms. Sarah. Welcome to Online Proficiency."],[5.44,8.43,"Hi! I'm Rithy. Let's learn together!"],[8.73,16.64,"Unit seven: The Anthropocene. In this unit, you will discuss humanity's impact on the planet's systems."],[17.65,18.74,"Anthropocene."],[19.44,25.91,"Anthropocene means the proposed era in which human activity shapes the Earth's systems."],[26.21,29.0,"Scientists debate when the Anthropocene began."],[29.7,33.14,"Your turn. Say: Anthropocene."],[35.84,37.23,"Anthropocene."],[38.22,39.84,"planetary boundaries."],[40.55,46.35,"planetary boundaries means limits within which humanity can safely operate on Earth."],[46.65,50.0,"We have already crossed several planetary boundaries."],[50.7,54.2,"Your turn. Say: planetary boundaries."],[56.9,58.42,"planetary boundaries."],[59.42,60.55,"tipping point."],[61.24,66.1,"tipping point means a threshold after which change becomes rapid and irreversible."],[66.4,70.12,"Melting ice sheets may pass a tipping point."],[70.82,74.0,"Your turn. Say: tipping point."],[76.7,77.76,"tipping point."],[78.75,79.98,"mass extinction."],[80.68,85.09,"mass extinction means the loss of a large share of species in a short time."],[85.39,88.71,"Some biologists warn of a sixth mass extinction."],[89.41,93.03,"Your turn. Say: mass extinction."],[95.72,96.97,"mass extinction."],[97.98,99.34,"geoengineering."],[100.04,104.96,"geoengineering means large-scale intervention to alter the climate."],[105.26,108.5,"Geoengineering raises serious ethical concerns."],[109.2,112.62,"Your turn. Say: geoengineering."],[115.32,116.46,"geoengineering."],[117.45,118.35,"rewilding."],[119.05,123.73,"rewilding means restoring natural processes and wildlife to an area."],[124.03,126.9,"Rewilding has brought wolves back to parts of Europe."],[127.6,130.87,"Your turn. Say: rewilding."],[133.57,134.64,"rewilding."],[135.65,136.69,"carbon sink."],[137.39,142.14,"carbon sink means a natural system that absorbs more carbon than it releases."],[142.44,145.59,"Forests and peatlands are vital carbon sinks."],[146.29,149.34,"Your turn. Say: carbon sink."],[152.05,152.95,"carbon sink."],[153.95,155.61,"ecological overshoot."],[156.31,161.68,"ecological overshoot means using resources faster than nature can regenerate them."],[161.98,164.58,"Humanity is in ecological overshoot."],[165.28,169.12,"Your turn. Say: ecological overshoot."],[171.82,173.32,"ecological overshoot."],[174.32,176.76,"Now let's listen to a conversation."],[177.06,183.74,"Rithy, had humanity acted in the 1990s, would we be facing tipping points now?"],[185.05,188.62,"Probably not so many. We'd be in a much safer position."],[189.92,193.54,"Some scientists argue we've already entered the Anthropocene."],[194.85,200.15,"Should we cross more planetary boundaries, a mass extinction may become unavoidable."],[201.45,205.57,"Some propose geoengineering as an emergency solution."],[206.88,211.04,"If it were to go wrong, the consequences could be catastrophic."],[212.35,215.5,"What about rewilding and protecting carbon sinks?"],[216.78,223.0,"Far safer. Supposing every country protected its forests, overshoot would ease considerably."],[224.28,227.27,"Grammar focus: Conditionals beyond the rules."],[227.57,230.73,"At C2, conditionals go beyond the basic rules."],[231.03,238.04,"Should we cross more boundaries, extinction may follow. If it were to go wrong, the results could be catastrophic."],[238.34,242.66,"Supposing every country protected its forests, overshoot would ease."],[242.96,249.57,"C2 users vary conditional forms for nuance: 'were to' signals an unlikely or hypothetical future."],[250.55,253.75,"Now read and listen. The Age of Humans."],[254.05,259.79,"Many scientists believe that human activity now rivals natural forces in shaping the planet."],[261.08,264.35,"They propose naming this new era the Anthropocene."],[265.65,273.13,"Research on planetary boundaries suggests that we have exceeded safe limits for climate, biodiversity and nitrogen."],[274.42,279.74,"Should key systems pass tipping points, change could become rapid and irreversible."],[281.05,286.29,"Biologists warn that current species loss may constitute a sixth mass extinction."],[287.58,292.92,"Some propose geoengineering, but were it to fail, the consequences might be global."],[294.22,298.98,"Others advocate rewilding and protecting carbon sinks such as forests and wetlands."],[300.28,305.44,"Provided that action is swift, the Anthropocene need not be a story of decline."],[306.75,309.43,"Quiz time! Choose the correct answer."],[309.73,313.97,"A threshold after which change becomes irreversible is a blank."],[314.27,319.35,"A, tipping point. B, carbon sink. C, rewilding."],[323.35,325.57,"The answer is A: tipping point."],[327.08,329.14,"blank you need help, call me."],[329.44,332.43,"A, Should. B, Were. C, Had."],[336.42,338.82,"The answer is A: Should."],[340.32,343.21,"If the plan blank to fail, we would need a backup."],[343.51,346.62,"A, was. B, were. C, is."],[350.62,352.64,"The answer is B: were."],[354.15,357.58,"Restoring wildlife and natural processes is blank."],[357.88,363.9,"A, rewilding. B, geoengineering. C, ecological overshoot."],[367.88,370.03,"The answer is A: rewilding."],[371.55,375.43,"According to the text, what may current species loss constitute?"],[375.73,382.34,"A, a sixth mass extinction. B, a new ice age. C, a carbon sink."],[386.35,389.17,"The answer is A: a sixth mass extinction."],[390.68,396.76,"Now it's your turn. Part one: Is geoengineering a responsible response to climate change?"],[402.06,408.31,"Part two: Use at least two advanced conditional forms to weigh risks and alternatives."],[414.61,426.32,"Only as a last resort. Were it to fail, entire regions could suffer droughts. Supposing instead that we protected carbon sinks and cut emissions quickly, we might avoid that gamble entirely."],[426.62,429.17,"That is a well-argued answer!"],[430.15,434.83,"Great work today! You learned eight new words and conditionals beyond the rules."],[435.13,439.67,"Today's value is caring for nature. Care for plants, birds and our planet."],[439.97,442.34,"See you in Unit eight. Goodbye!"],[442.64,445.17,"Thank you, Ms. Sarah! Bye, everyone!"]],"OC-Proficiency-Unit08-Global-Governance":[[0.35,4.87,"Hello, everyone! I'm Ms. Sarah. Welcome to Online Proficiency."],[5.17,8.4,"Hi! I'm Rithy. Let's learn together!"],[8.7,15.93,"Unit eight: Global Governance. In this unit, you will analyse how the world governs shared problems."],[16.92,18.3,"global governance."],[19.0,24.69,"global governance means the systems and institutions managing world issues."],[24.99,28.69,"Climate change exposes the weaknesses of global governance."],[29.39,32.75,"Your turn. Say: global governance."],[35.45,36.77,"global governance."],[37.78,39.27,"international order."],[39.97,46.28,"international order means the framework of rules and power shaping relations between states."],[46.58,50.85,"The post-war international order is under strain."],[51.55,54.8,"Your turn. Say: international order."],[57.5,58.96,"international order."],[59.95,61.52,"supranational body."],[62.22,67.76,"supranational body means an organisation with authority above individual states."],[68.06,70.91,"The European Union is a supranational body."],[71.61,74.85,"Your turn. Say: supranational body."],[77.55,79.09,"supranational body."],[80.08,81.1,"veto power."],[81.8,84.48,"veto power means the right to block a decision."],[84.78,88.44,"Five countries hold veto power in the UN Security Council."],[89.14,92.35,"Your turn. Say: veto power."],[95.05,96.12,"veto power."],[97.12,99.15,"multilateral institution."],[99.85,105.69,"multilateral institution means an organisation in which many countries cooperate."],[105.99,108.46,"The WHO is a multilateral institution."],[109.16,113.53,"Your turn. Say: multilateral institution."],[116.23,118.19,"multilateral institution."],[119.18,120.22,"Bretton Woods."],[120.92,128.33,"Bretton Woods means the 1944 conference that created the IMF and World Bank."],[128.63,132.3,"The Bretton Woods institutions still shape global finance."],[133.0,135.98,"Your turn. Say: Bretton Woods."],[138.68,139.85,"Bretton Woods."],[140.85,142.47,"collective security."],[143.17,147.96,"collective security means an arrangement in which states protect one another."],[148.26,151.46,"Collective security was the founding idea of the UN."],[152.16,155.86,"Your turn. Say: collective security."],[158.56,160.01,"collective security."],[161.02,162.97,"humanitarian intervention."],[163.67,169.12,"humanitarian intervention means the use of force to protect people from mass atrocities."],[169.42,173.4,"Humanitarian intervention remains highly controversial."],[174.1,178.33,"Your turn. Say: humanitarian intervention."],[181.03,182.87,"humanitarian intervention."],[183.88,186.1,"Now let's listen to a conversation."],[186.4,190.02,"Ms. Sarah, is global governance actually effective?"],[191.32,197.87,"It is, one might say, a work in progress. The institutions were designed for a bygone era."],[199.18,201.15,"You mean Bretton Woods and the UN?"],[202.45,209.63,"Indeed. The architecture of the post-war international order reflected the powers of 1945."],[210.92,213.75,"Hence the veto power held by five states."],[215.05,221.12,"Precisely. Collective security, though noble in aspiration, is frequently paralysed by it."],[222.42,224.56,"And humanitarian intervention?"],[225.85,230.18,"A doctrine fraught with tension between sovereignty and the protection of human life."],[231.48,235.22,"Grammar focus: Formal and literary register."],[235.52,238.86,"Formal register uses elevated, precise language."],[239.16,247.04,"It is, one might say, a work in progress. Collective security, though noble in aspiration, is often paralysed."],[247.34,249.29,"A doctrine fraught with tension."],[249.59,257.25,"Formal register suits lectures, diplomacy and academic writing; overusing it in conversation can sound pompous."],[258.25,261.51,"Now read and listen. Governing a Connected World."],[261.81,267.4,"The current architecture of global governance was largely constructed after the Second World War."],[268.72,274.01,"The Bretton Woods conference established institutions to stabilise the world economy."],[275.32,279.84,"The United Nations was founded on the principle of collective security."],[281.15,287.43,"Yet the veto power of five permanent members has frequently paralysed the Security Council."],[288.75,294.66,"Supranational bodies such as the European Union demonstrate deeper forms of cooperation."],[295.95,302.57,"Humanitarian intervention remains a doctrine fraught with tension between sovereignty and human rights."],[303.88,309.8,"Emerging powers argue that multilateral institutions must be reformed to reflect today's world."],[311.08,316.28,"Whether the international order adapts or fragments may define the century ahead."],[317.58,320.29,"Quiz time! Choose the correct answer."],[320.59,322.79,"The right to block a decision is blank."],[323.09,328.5,"A, veto power. B, global governance. C, Bretton Woods."],[332.48,335.07,"The answer is A: veto power."],[336.58,338.44,"Which phrase is most formal?"],[338.74,343.38,"A, kind of a mess. B, fraught with difficulty. C, really tough."],[347.38,350.56,"The answer is B: fraught with difficulty."],[352.05,355.72,"It is, one blank say, an imperfect system."],[356.02,359.36,"A, might. B, may to. C, can to."],[363.35,365.44,"The answer is A: might."],[366.95,370.52,"An organisation with authority above states is a blank."],[370.82,377.51,"A, supranational body. B, multilateral institution. C, international order."],[381.52,384.61,"The answer is A: supranational body."],[386.12,390.32,"According to the text, what has often paralysed the Security Council?"],[390.62,395.17,"A, the veto power. B, Bretton Woods. C, the EU."],[399.18,401.97,"The answer is A: the veto power."],[403.48,408.26,"Now it's your turn. Part one: Should international institutions be reformed?"],[413.56,420.52,"Part two: Use a formal register: present two reforms and their justification."],[426.82,443.52,"It would seem that reform is overdue. Firstly, permanent veto power, a relic of 1945, should be limited. Secondly, emerging economies merit greater representation in financial institutions, given their growing global weight."],[443.82,445.65,"That is a well-argued answer!"],[446.65,452.07,"Great work today! You learned eight new words and formal and literary register."],[452.37,455.95,"Today's value is respect. Thank the people who help us."],[456.25,458.86,"See you in Unit nine. Goodbye!"],[459.16,462.23,"Thank you, Ms. Sarah! Bye, everyone!"]],"OC-Proficiency-Unit09-The-Psychology-of-Decision-Making":[[0.35,5.26,"Hello, everyone! I'm Ms. Sarah. Welcome to Online Proficiency."],[5.56,8.61,"Hi! I'm Rithy. Let's learn together!"],[8.91,16.98,"Unit nine: The Psychology of Decision-Making. In this unit, you will understand the hidden processes behind our choices."],[17.98,19.05,"heuristic."],[19.75,23.45,"heuristic means a mental shortcut used to make quick judgements."],[23.75,26.55,"Heuristics save time but can lead to errors."],[27.25,30.29,"Your turn. Say: heuristic."],[32.98,33.94,"heuristic."],[34.95,36.48,"bounded rationality."],[37.19,44.48,"bounded rationality means the idea that our rational choices are limited by time and information."],[44.78,48.75,"Bounded rationality explains why we choose 'good enough' options."],[49.45,52.6,"Your turn. Say: bounded rationality."],[55.3,56.9,"bounded rationality."],[57.88,59.21,"prospect theory."],[59.91,65.94,"prospect theory means a theory showing that people value losses and gains differently."],[66.24,69.4,"Prospect theory won Kahneman a Nobel Prize."],[70.1,73.41,"Your turn. Say: prospect theory."],[76.11,77.25,"prospect theory."],[78.25,79.54,"choice overload."],[80.24,85.09,"choice overload means difficulty deciding when there are too many options."],[85.39,88.57,"Choice overload can make shoppers leave without buying."],[89.27,92.5,"Your turn. Say: choice overload."],[95.2,96.54,"choice overload."],[97.55,99.07,"status quo bias."],[99.77,103.87,"status quo bias means a preference for keeping things as they are."],[104.17,108.53,"Status quo bias keeps people on the same phone plan for years."],[109.23,112.3,"Your turn. Say: status quo bias."],[115.0,116.51,"status quo bias."],[117.52,119.44,"availability heuristic."],[120.14,125.65,"availability heuristic means judging likelihood by how easily examples come to mind."],[125.95,131.77,"After seeing news of a crash, the availability heuristic makes flying seem dangerous."],[132.47,136.0,"Your turn. Say: availability heuristic."],[138.69,140.67,"availability heuristic."],[141.68,143.23,"dual-process theory."],[143.93,150.35,"dual-process theory means the idea that we think with a fast intuitive system and a slow deliberate one."],[150.65,154.17,"Dual-process theory distinguishes System 1 and System 2."],[154.87,157.89,"Your turn. Say: dual-process theory."],[160.59,162.19,"dual-process theory."],[163.18,164.22,"intuition."],[164.92,169.7,"intuition means understanding something instantly without conscious reasoning."],[170.0,173.05,"Experienced doctors often rely on intuition."],[173.75,176.56,"Your turn. Say: intuition."],[179.26,180.13,"intuition."],[181.12,183.36,"Now let's listen to a conversation."],[183.66,187.46,"Rithy, do you trust your gut when you make big decisions?"],[188.75,193.47,"Sometimes. But I've learned not to take my intuition at face value."],[194.78,200.13,"Wise. Kahneman's dual-process theory says our fast system often jumps the gun."],[201.42,206.14,"Like the availability heuristic? One scary headline and we're afraid of flying."],[207.45,212.87,"Exactly. And when there are fifty options, choice overload leaves us stuck in a rut."],[214.15,218.02,"So we stick with the status quo, even when it's a raw deal."],[219.32,222.85,"Prospect theory adds that losses loom larger than gains."],[224.15,228.35,"Then the trick is to slow down and weigh things up before taking the plunge."],[229.65,232.81,"Grammar focus: Idioms and figurative language."],[233.11,236.39,"Idioms and figurative language add colour at C2."],[236.69,242.88,"Don't take your intuition at face value. We get stuck in a rut. Losses loom larger than gains."],[243.18,245.93,"Use them naturally and sparingly."],[246.23,253.55,"C2 speakers use idioms naturally but sparingly; one well-chosen idiom is more effective than five."],[254.55,257.53,"Now read and listen. Thinking, Fast and Slow."],[257.83,263.11,"Psychologist Daniel Kahneman described the mind as operating through two systems."],[264.42,270.85,"System 1 is fast, intuitive and effortless; System 2 is slow, deliberate and demanding."],[272.15,278.33,"Most of the time, System 1 serves us well, relying on heuristics to make quick judgements."],[279.62,286.26,"Yet these shortcuts can mislead us, as the availability heuristic and status quo bias demonstrate."],[287.55,293.87,"Herbert Simon's concept of bounded rationality reminds us that we rarely have full information."],[295.18,300.67,"Prospect theory shows that the pain of a loss looms larger than the pleasure of an equal gain."],[301.95,308.01,"Choice overload, meanwhile, can paralyse decision-making altogether."],[309.32,316.31,"Recognising these patterns does not eliminate them, but it allows us to pause before taking the plunge."],[317.62,320.3,"Quiz time! Choose the correct answer."],[320.6,322.6,"A mental shortcut is a blank."],[322.9,328.5,"A, heuristic. B, prospect theory. C, intuition."],[332.48,335.06,"The answer is A: heuristic."],[336.55,338.48,"To act too early is to blank."],[338.78,343.83,"A, jump the gun. B, take the plunge. C, loom larger."],[347.82,350.19,"The answer is A: jump the gun."],[351.68,355.97,"If you accept something without question, you take it at blank value."],[356.27,359.44,"A, face. B, full. C, true."],[363.45,366.11,"The answer is A: face."],[367.62,369.98,"Preferring to keep things as they are is blank."],[370.28,376.58,"A, status quo bias. B, choice overload. C, bounded rationality."],[380.58,383.52,"The answer is A: status quo bias."],[385.02,388.88,"According to the text, which system is slow and deliberate?"],[389.19,393.22,"A, System 1. B, System 2. C, both."],[397.22,399.81,"The answer is B: System 2."],[401.32,408.78,"Now it's your turn. Part one: Should we trust intuition or careful analysis when making important decisions?"],[414.08,420.15,"Part two: Use two idioms; refer to one cognitive bias in your answer."],[426.45,440.41,"Both have their place. Intuition is valuable for experts, but taking it at face value is risky. The availability heuristic, for instance, can make rare dangers loom larger than they are, so big decisions deserve slow analysis."],[440.71,443.22,"That is a well-argued answer!"],[444.22,449.71,"Great work today! You learned eight new words and idioms and figurative language."],[450.01,453.63,"Today's value is good habits. Do good things every day."],[453.93,456.35,"See you in Unit ten. Goodbye!"],[456.65,459.39,"Thank you, Ms. Sarah! Bye, everyone!"]],"OC-Proficiency-Unit10-Colonialism-and-Its-Legacies":[[0.35,5.27,"Hello, everyone! I'm Ms. Sarah. Welcome to Online Proficiency."],[5.57,8.69,"Hi! I'm Rithy. Let's learn together!"],[8.99,16.67,"Un
