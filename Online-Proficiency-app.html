 justice."],[184.32,186.56,"Now let's listen to a conversation."],[186.86,190.73,"Ms. Sarah, do we owe anything to people who don't exist yet?"],[192.02,195.86,"Most philosophers would argue that we do, at least to some extent."],[197.15,199.27,"Even if we can't know their preferences?"],[200.55,205.59,"Arguably, certain needs, such as clean air and water, are fairly predictable."],[206.88,209.8,"Long-termism goes further, doesn't it?"],[211.12,216.34,"It does. Its critics contend that it may neglect urgent present suffering."],[217.65,219.42,"And our climate legacy?"],[220.72,227.72,"It would seem difficult to defend leaving future generations both a damaged climate and an inheritance of debt."],[229.02,233.21,"Grammar focus: Stance in academic writing (extended)."],[233.51,236.45,"Academic stance can be firm yet polite."],[236.75,243.47,"We owe them something, at least to some extent. Its critics contend that it may neglect present suffering."],[243.77,246.45,"It would seem difficult to defend such a legacy."],[246.75,253.59,"Strong academic writers can make a firm point politely: 'It would seem difficult to defend ...' is firmer than it looks."],[254.58,257.57,"Now read and listen. Our Debt to the Future."],[257.87,262.52,"Every generation inherits a world shaped by those who came before."],[263.82,268.99,"The question of intergenerational justice asks what we owe to those who will come after us."],[270.28,276.4,"Some philosophers argue that future generations have the same moral status as people alive today."],[277.72,284.47,"Long-termism takes this further, prioritising actions that could benefit billions of future lives."],[285.75,291.22,"Its critics contend that such reasoning may justify neglecting urgent present needs."],[292.52,299.31,"Practical issues, such as the inheritance of public debt and our climate legacy, make the debate concrete."],[300.62,306.98,"A sustainability ethic attempts to balance present welfare with long-term responsibility."],[308.28,313.5,"It would seem difficult, at any rate, to justify leaving the future poorer than we found it."],[314.78,317.42,"Quiz time! Choose the correct answer."],[317.72,321.82,"Fairness between present and future generations is blank."],[322.12,328.4,"A, intergenerational justice. B, long-termism. C, inheritance of debt."],[332.42,336.03,"The answer is A: intergenerational justice."],[337.52,339.19,"Which phrase limits a claim?"],[339.49,344.07,"A, to some extent. B, definitely. C, always."],[348.08,350.92,"The answer is A: to some extent."],[352.42,355.57,"'Its critics blank that the policy is unfair.'"],[355.87,360.03,"A, contend. B, tell. C, speak."],[364.02,366.35,"The answer is A: contend."],[367.85,371.6,"The climate impacts we leave to the future are our blank."],[371.9,377.62,"A, climate legacy. B, temporal justice. C, generational fairness."],[381.62,384.25,"The answer is A: climate legacy."],[385.75,389.32,"According to the critics, what might long-termism neglect?"],[389.62,395.19,"A, future lives. B, urgent present needs. C, the climate."],[399.18,402.52,"The answer is B: urgent present needs."],[404.02,408.65,"Now it's your turn. Part one: What do we owe to future generations?"],[413.95,419.73,"Part two: Use stance markers; identify two obligations and one limit."],[426.03,440.79,"We owe them, at least, a livable climate and manageable public debt. It would seem difficult to defend anything less. That said, our obligations to future people should not, I think, override urgent duties to those suffering today."],[441.09,443.82,"That is a well-argued answer!"],[444.82,450.59,"Great work today! You learned eight new words and stance in academic writing (extended)."],[450.89,455.15,"Today's value is responsibility. Help at home and do your jobs."],[455.45,458.99,"See you in Unit twenty-three. Goodbye!"],[459.29,461.61,"Thank you, Ms. Sarah! Bye, everyone!"]],"OC-Proficiency-Unit23-Translation-and-Meaning":[[0.35,4.92,"Hello, everyone! I'm Ms. Sarah. Welcome to Online Proficiency."],[5.22,8.49,"Hi! I'm Rithy. Let's learn together!"],[8.79,17.72,"Unit twenty-three: Translation and Meaning. In this unit, you will explore the challenges and art of translation."],[18.72,20.07,"untranslatable."],[20.77,25.67,"untranslatable means impossible to express exactly in another language."],[25.97,29.42,"Some emotional words seem almost untranslatable."],[30.12,33.46,"Your turn. Say: untranslatable."],[36.16,37.52,"untranslatable."],[38.52,39.77,"equivalence."],[40.47,45.65,"equivalence means the degree to which a translation has the same meaning as the original."],[45.95,48.96,"Perfect equivalence between languages is rare."],[49.66,53.47,"Your turn. Say: equivalence."],[56.16,57.22,"equivalence."],[58.22,59.32,"fidelity."],[60.02,63.93,"fidelity means faithfulness to the original text."],[64.23,67.68,"Translators balance fidelity and readability."],[68.38,71.25,"Your turn. Say: fidelity."],[73.95,74.96,"fidelity."],[75.95,77.17,"domestication."],[77.87,82.75,"domestication means adapting a translation to feel natural in the target culture."],[83.05,86.75,"Domestication replaces foreign references with familiar ones."],[87.44,90.56,"Your turn. Say: domestication."],[93.26,94.34,"domestication."],[95.35,96.41,"foreignisation."],[97.11,100.76,"foreignisation means keeping the foreign feel of the original text."],[101.06,104.24,"Foreignisation preserves cultural strangeness."],[104.94,107.71,"Your turn. Say: foreignisation."],[110.41,111.55,"foreignisation."],[112.55,113.78,"localisation."],[114.48,119.14,"localisation means adapting products or content for a particular market."],[119.44,123.19,"Game localisation includes changing jokes and names."],[123.89,127.01,"Your turn. Say: localisation."],[129.71,130.99,"localisation."],[131.98,133.54,"machine translation."],[134.24,139.83,"machine translation means translation produced automatically by computers."],[140.13,143.01,"Machine translation has improved dramatically."],[143.71,147.6,"Your turn. Say: machine translation."],[150.31,151.91,"machine translation."],[152.92,154.84,"literary translation."],[155.53,161.13,"literary translation means translating novels, poems and other literature."],[161.43,164.73,"Literary translation is a creative art."],[165.43,168.92,"Your turn. Say: literary translation."],[171.62,173.19,"literary translation."],[174.18,176.43,"Now let's listen to a conversation."],[176.73,179.69,"Rithy, can every word be translated?"],[180.98,188.71,"Not perfectly. The translation of Khmer kinship terms into English involves a considerable loss of nuance."],[190.02,192.09,"So equivalence is never complete?"],[193.38,200.01,"Rarely. The translator's choice between fidelity and fluency determines the reader's experience."],[201.32,205.42,"Venuti called that the tension between domestication and foreignisation."],[206.72,213.16,"My preference is for foreignisation in literary translation; the preservation of strangeness matters."],[214.45,216.22,"And machine translation?"],[217.52,223.27,"Its accuracy in everyday texts is impressive; its handling of humour and poetry, less so."],[224.55,227.93,"Grammar focus: Lexical density (extended)."],[228.23,232.22,"Lexically dense writing uses nominal groups as subjects."],[232.52,238.75,"The translation of kinship terms into English involves a loss of nuance."],[239.05,240.96,"Its handling of humour is weaker."],[241.26,248.28,"Dense nominal groups are efficient in academic prose; vary them with verbs to maintain readability."],[249.28,252.96,"Now read and listen. Lost and Found in Translation."],[253.26,257.23,"Translation is often described as the art of the impossible."],[258.52,262.54,"No two languages divide the world in exactly the same way."],[263.85,269.89,"Khmer, for example, encodes age and status in forms of address that English simply lacks."],[271.18,277.88,"Translators must therefore balance fidelity to the original with fluency for new readers."],[279.18,287.73,"Lawrence Venuti distinguished domestication, which makes texts feel familiar, from foreignisation, which preserves difference."],[289.02,293.76,"Localisation extends these choices to games, software and advertising."],[295.05,303.99,"Machine translation now handles routine texts remarkably well, though literary translation remains a profoundly human art."],[305.28,311.24,"What is untranslatable, perhaps, is precisely what makes each language precious."],[312.55,315.24,"Quiz time! Choose the correct answer."],[315.54,318.43,"Faithfulness to the original text is blank."],[318.73,323.92,"A, fidelity. B, localisation. C, equivalence."],[327.92,330.81,"The answer is A: fidelity."],[332.32,334.57,"Which is the most lexically dense?"],[334.87,343.02,"A, they translated it carefully. B, the careful translation of the text. C, it was translated."],[347.02,351.15,"The answer is B: the careful translation of the text."],[352.65,355.79,"'blank of jokes is the hardest part.'"],[356.09,361.47,"A, Translate. B, The translation. C, Translating of."],[365.48,368.49,"The answer is B: The translation."],[369.98,372.75,"Keeping the foreign feel of the original is blank."],[373.05,378.37,"A, foreignisation. B, domestication. C, machine translation."],[382.38,384.8,"The answer is A: foreignisation."],[386.32,390.37,"According to the text, what does Khmer encode that English lacks?"],[390.67,396.46,"A, tense. B, age and status in forms of address. C, plural forms."],[400.45,404.4,"The answer is B: age and status in forms of address."],[405.92,411.84,"Now it's your turn. Part one: Will machine translation replace human translators?"],[417.14,422.68,"Part two: Use nominal style to compare two types of translation and conclude."],[428.98,443.67,"The automation of routine translation is already well advanced. The translation of literature and humour, however, requires cultural judgement that machines lack. The replacement of human translators therefore seems unlikely in creative fields."],[443.97,446.33,"That is a well-argued answer!"],[447.32,452.37,"Great work today! You learned eight new words and lexical density (extended)."],[452.67,457.17,"Today's value is respect for culture. Be proud of our Khmer culture."],[457.47,460.75,"See you in Unit twenty-four. Goodbye!"],[461.05,463.59,"Thank you, Ms. Sarah! Bye, everyone!"]],"OC-Proficiency-Unit24-The-Body-and-Technology":[[0.35,5.23,"Hello, everyone! I'm Ms. Sarah. Welcome to Online Proficiency."],[5.53,8.5,"Hi! I'm Rithy. Let's learn together!"],[8.8,17.96,"Unit twenty-four: The Body and Technology. In this unit, you will debate the merging of human bodies and technology."],[18.95,20.17,"transhumanism."],[20.87,27.38,"transhumanism means the movement to enhance humans beyond natural limits through technology."],[27.68,30.6,"Transhumanism imagines a future without ageing."],[31.3,34.66,"Your turn. Say: transhumanism."],[37.37,38.45,"transhumanism."],[39.45,40.43,"cyborg."],[41.13,44.93,"cyborg means a being that is partly human and partly machine."],[45.23,48.36,"With his implant, he jokes that he is a cyborg."],[49.06,51.51,"Your turn. Say: cyborg."],[54.21,55.21,"cyborg."],[56.22,57.2,"prosthetic."],[57.9,60.31,"prosthetic means an artificial body part."],[60.61,63.78,"Modern prosthetics can be controlled by muscle signals."],[64.48,67.57,"Your turn. Say: prosthetic."],[70.27,71.28,"prosthetic."],[72.28,73.67,"neural implant."],[74.37,77.88,"neural implant means a device placed in the brain or nerves."],[78.18,81.43,"A neural implant helped a paralysed man walk again."],[82.13,85.71,"Your turn. Say: neural implant."],[88.41,89.67,"neural implant."],[90.68,92.45,"brain-computer interface."],[93.15,97.77,"brain-computer interface means a system connecting the brain directly to a computer."],[98.07,101.65,"Brain-computer interfaces let patients type with their thoughts."],[102.35,106.46,"Your turn. Say: brain-computer interface."],[109.16,110.96,"brain-computer interface."],[111.95,113.31,"human enhancement."],[114.01,118.39,"human enhancement means improving human abilities beyond normal levels."],[118.69,121.76,"Human enhancement raises questions of fairness."],[122.46,125.99,"Your turn. Say: human enhancement."],[128.69,130.03,"human enhancement."],[131.02,132.45,"bodily autonomy."],[133.15,136.92,"bodily autonomy means the right to control one's own body."],[137.22,140.72,"Bodily autonomy is a core principle of medical ethics."],[141.42,144.55,"Your turn. Say: bodily autonomy."],[147.25,148.6,"bodily autonomy."],[149.58,150.76,"augmentation."],[151.46,155.61,"augmentation means adding to or strengthening human capacities."],[155.91,159.95,"Memory augmentation may one day be possible."],[160.65,164.17,"Your turn. Say: augmentation."],[166.87,168.0,"augmentation."],[169.02,171.24,"Now let's listen to a conversation."],[171.54,176.33,"Ms. Sarah, a man in my town has a prosthetic leg controlled by his muscles."],[177.65,182.28,"Remarkable. Such technology was science fiction thirty years ago."],[183.58,186.13,"And now there are brain-computer interfaces."],[187.42,194.85,"Indeed. These devices restore abilities. The latter question, enhancement, is far more controversial."],[196.15,197.8,"You mean transhumanism?"],[199.12,206.09,"Precisely. Its supporters see augmentation as progress; its critics, as a threat to equality."],[207.38,208.58,"Who decides?"],[209.88,218.33,"Ultimately, bodily autonomy suggests the individual should. That principle, however, has limits in a competitive society."],[219.62,223.96,"Grammar focus: Cohesion and reference (extended)."],[224.26,227.93,"Elegant cohesion combines reference and parallel structure."],[228.23,233.29,"Such technology was science fiction. The latter question is more controversial."],[233.59,237.31,"Its supporters see progress; its critics, a threat."],[237.61,242.65,"Elegant cohesion combines reference words with parallel structure and ellipsis."],[243.65,246.35,"Now read and listen. Beyond the Human?."],[246.65,251.61,"Technology has always extended the human body, from spectacles to hearing aids."],[252.92,259.39,"Today, prosthetics controlled by nerve signals and brain-computer interfaces are transforming lives."],[260.68,265.11,"Such devices restore lost abilities, and few would question their value."],[266.42,270.67,"Human enhancement, however, raises a different set of questions."],[271.98,278.37,"Transhumanists argue that augmenting memory, strength or lifespan is a natural next step."],[279.68,283.99,"Their critics fear a world divided between the enhanced and the unenhanced."],[285.28,294.82,"Bodily autonomy supports individual choice, yet that principle becomes complicated when enhancement confers competitive advantage."],[296.12,302.34,"The boundary between healing and enhancing may prove to be the defining ethical frontier of this century."],[303.65,306.44,"Quiz time! Choose the correct answer."],[306.74,310.59,"A being that is partly human and partly machine is a blank."],[310.89,316.05,"A, cyborg. B, prosthetic. C, transhumanism."],[320.05,322.06,"The answer is A: cyborg."],[323.55,328.06,"Coffee and tea are popular; blank is more common in Cambodia."],[328.36,332.75,"A, the latter. B, the after. C, the second."],[336.75,339.13,"The answer is A: the latter."],[340.62,344.04,"Some see opportunity; blank, danger."],[344.34,348.14,"A, others. B, other. C, the others one."],[352.15,354.46,"The answer is A: others."],[355.95,358.54,"The right to control one's own body is blank."],[358.84,364.3,"A, bodily autonomy. B, augmentation. C, human enhancement."],[368.28,371.33,"The answer is A: bodily autonomy."],[372.82,377.9,"According to the text, what may be the defining ethical frontier of this century?"],[378.2,384.34,"A, the boundary between healing and enhancing. B, space travel. C, prosthetics."],[388.35,392.02,"The answer is A: the boundary between healing and enhancing."],[393.52,399.85,"Now it's your turn. Part one: Should people be allowed to enhance their bodies with technology?"],[405.15,411.19,"Part two: Use cohesive reference to compare restoration and enhancement, then conclude."],[417.49,432.33,"Restoration is widely accepted; enhancement, less so. The former helps people regain lost abilities, while the latter could create new inequalities. Such risks suggest that enhancement should be regulated, though not necessarily banned."],[432.63,435.1,"That is a well-argued answer!"],[436.08,441.12,"Great work today! You learned eight new words and cohesion and reference (extended)."],[441.42,445.91,"Today's value is curiosity. Ask questions and find out."],[446.21,449.57,"See you in Unit twenty-five. Goodbye!"],[449.88,452.67,"Thank you, Ms. Sarah! Bye, everyone!"]],"OC-Proficiency-Unit25-Cities-Ruins-and-Time":[[0.35,5.47,"Hello, everyone! I'm Ms. Sarah. Welcome to Online Proficiency."],[5.77,8.85,"Hi! I'm Rithy. Let's learn together!"],[9.15,17.32,"Unit twenty-five: Cities, Ruins and Time. In this unit, you will reflect on how cities remember and forget their past."],[18.32,19.95,"urban archaeology."],[20.64,25.72,"urban archaeology means the study of past human activity beneath modern cities."],[26.02,30.54,"Urban archaeology revealed an ancient canal under the market."],[31.24,34.31,"Your turn. Say: urban archaeology."],[37.01,38.59,"urban archaeology."],[39.58,40.63,"palimpsest."],[41.33,46.2,"palimpsest means something with layers of history visible beneath the surface."],[46.5,50.98,"Phnom Penh is a palimpsest of royal, colonial and modern eras."],[51.68,54.36,"Your turn. Say: palimpsest."],[57.06,58.05,"palimpsest."],[59.05,60.46,"ruin aesthetics."],[61.16,64.86,"ruin aesthetics means the appreciation of ruins as beautiful."],[65.16,68.5,"Ruin aesthetics attracted Romantic painters to Angkor."],[69.2,72.5,"Your turn. Say: ruin aesthetics."],[75.2,76.59,"ruin aesthetics."],[77.58,78.91,"heritage erasure."],[79.61,84.42,"heritage erasure means the destruction or loss of historic places and memories."],[84.72,87.32,"Rapid development risks heritage erasure."],[88.02,91.28,"Your turn. Say: heritage erasure."],[93.98,95.32,"heritage erasure."],[96.32,97.63,"collective forgetting."],[98.33,102.91,"collective forgetting means a society gradually losing memory of its past."],[103.21,106.73,"Demolishing old buildings can encourage collective forgetting."],[107.43,111.02,"Your turn. Say: collective forgetting."],[113.72,115.16,"collective forgetting."],[116.15,117.88,"architectural memory."],[118.58,122.78,"architectural memory means the way buildings preserve traces of the past."],[123.08,126.55,"Old shophouses carry the city's architectural memory."],[127.25,130.83,"Your turn. Say: architectural memory."],[133.53,135.12,"architectural memory."],[136.12,137.72,"adaptive heritage."],[138.42,143.94,"adaptive heritage means historic places given new uses while keeping their character."],[144.24,148.43,"A colonial villa reborn as a café is adaptive heritage."],[149.13,152.78,"Your turn. Say: adaptive heritage."],[155.48,156.86,"adaptive heritage."],[157.85,158.98,"urban layers."],[159.68,164.37,"urban layers means different periods of history built on top of each other in a city."],[164.67,167.25,"Every street reveals urban layers."],[167.95,170.95,"Your turn. Say: urban layers."],[173.65,174.83,"urban layers."],[175.82,178.09,"Now let's listen to a conversation."],[178.4,183.82,"Rithy, Phnom Penh changes so fast. Does the city remember its past?"],[185.12,188.87,"Well, it's not exactly sentimental about old buildings."],[190.18,193.32,"A rather gentle way of describing the demolitions!"],[194.62,198.59,"True. Developers have been, shall we say, enthusiastic."],[199.88,205.2,"Yet the city is still a palimpsest: royal, colonial, modernist and modern."],[206.52,210.69,"For now. Heritage erasure is happening one shophouse at a time."],[211.98,215.98,"Some old villas have become cafés: adaptive heritage."],[217.28,222.72,"Which is wonderful, if a little ironic: we preserve the past to sell expensive coffee."],[224.02,228.28,"Grammar focus: Irony and understatement (extended)."],[228.58,232.33,"Irony and understatement allow polite criticism."],[232.63,240.51,"The city is not exactly sentimental about old buildings. Developers have been, shall we say, enthusiastic."],[240.81,242.93,"It's wonderful, if a little ironic."],[243.22,248.85,"Understatement often signals criticism politely; listeners infer the stronger meaning."],[249.85,253.78,"Now read and listen. The City as Palimpsest."],[254.08,258.78,"Cities are rarely built on empty ground; they are layered over their own past."],[260.08,265.98,"Scholars sometimes describe them as palimpsests, where earlier histories remain partly visible."],[267.28,273.19,"Urban archaeology uncovers these layers, from ancient canals to forgotten foundations."],[274.48,280.91,"Phnom Penh's urban layers include royal, colonial, modernist and contemporary architecture."],[282.22,286.5,"Rapid development, however, has led to significant heritage erasure."],[287.82,293.44,"When buildings disappear, collective forgetting may follow, as architectural memory is lost."],[294.75,299.31,"Adaptive heritage offers a compromise, giving old structures new life."],[300.62,306.06,"The challenge is to let a city grow without making it, so to speak, forget its own name."],[307.35,310.12,"Quiz time! Choose the correct answer."],[310.42,314.12,"Something with layers of history visible beneath the surface is a blank."],[314.43,320.14,"A, palimpsest. B, ruin aesthetics. C, heritage erasure."],[324.15,327.0,"The answer is A: palimpsest."],[328.48,331.48,"'The film was not exactly short' means it was blank."],[331.78,335.14,"A, short. B, long. C, good."],[339.15,342.14,"The answer is B: long."],[343.65,347.53,"'The meeting was, shall we say, lively' probably means it was blank."],[347.83,351.15,"A, calm. B, heated. C, boring."],[355.15,357.44,"The answer is B: heated."],[358.95,361.67,"Historic places given new uses are blank."],[361.97,368.19,"A, adaptive heritage. B, collective forgetting. C, urban archaeology."],[372.18,374.98,"The answer is A: adaptive heritage."],[376.48,380.36,"According to the text, what may follow when buildings disappear?"],[380.66,386.22,"A, collective forgetting. B, more tourism. C, urban archaeology."],[390.22,393.03,"The answer is A: collective forgetting."],[394.52,400.97,"Now it's your turn. Part one: Should old buildings be preserved in fast-growing cities?"],[406.26,413.14,"Part two: Use understatement or irony once, give two arguments and a compromise."],[419.44,431.8,"Developers are not exactly famous for their love of history. Yet old buildings carry identity and attract visitors. A sensible compromise is adaptive heritage: keep the façade, change the use."],[432.1,434.15,"That is a well-argued answer!"],[435.15,440.93,"Great work today! You learned eight new words and irony and understatement (extended)."],[441.23,445.99,"Today's value is love of country. Love and take care of Cambodia."],[446.29,449.94,"See you in Unit twenty-six. Goodbye!"],[450.24,452.66,"Thank you, Ms. Sarah! Bye, everyone!"]],"OC-Proficiency-Unit26-Markets-and-Morality":[[0.35,5.14,"Hello, everyone! I'm Ms. Sarah. Welcome to Online Proficiency."],[5.44,8.46,"Hi! I'm Rithy. Let's learn together!"],[8.76,16.46,"Unit twenty-six: Markets and Morality. In this unit, you will debate the moral limits of markets."],[17.45,18.96,"moral economy."],[19.66,24.41,"moral economy means an economy guided by shared ideas of fairness."],[24.71,29.49,"In a moral economy, prices reflect community norms."],[30.19,32.72,"Your turn. Say: moral economy."],[35.42,36.66,"moral economy."],[37.65,39.34,"commodification of life."],[40.04,46.6,"commodification of life means treating aspects of life, such as health or relationships, as products."],[46.9,49.95,"Paid queuing illustrates the commodification of life."],[50.65,54.65,"Your turn. Say: commodification of life."],[57.35,59.32,"commodification of life."],[60.32,61.99,"market fundamentalism."],[62.69,68.1,"market fundamentalism means the belief that free markets solve almost every problem."],[68.4,73.2,"Critics blame market fundamentalism for the 2008 crisis."],[73.9,77.44,"Your turn. Say: market fundamentalism."],[80.14,81.86,"market fundamentalism."],[82.85,84.18,"externality."],[84.88,91.04,"externality means a cost or benefit affecting others who did not choose it."],[91.34,95.13,"Pollution is a classic negative externality."],[95.83,99.08,"Your turn. Say: externality."],[101.78,102.97,"externality."],[103.98,105.04,"public good."],[105.74,110.97,"public good means something that benefits everyone and cannot easily be sold."],[111.27,113.22,"Clean air is a public good."],[113.92,116.89,"Your turn. Say: public good."],[119.59,120.67,"public good."],[121.68,123.33,"tragedy of the commons."],[124.03,131.07,"tragedy of the commons means overuse of shared resources because individuals act in self-interest."],[131.37,133.95,"Overfishing is a tragedy of the commons."],[134.65,138.04,"Your turn. Say: tragedy of the commons."],[140.74,142.66,"tragedy of the commons."],[143.65,144.98,"market failure."],[145.68,151.46,"market failure means a situation where markets do not produce efficient or fair results."],[151.76,155.14,"Climate change is the greatest market failure in history."],[155.84,158.97,"Your turn. Say: market failure."],[161.67,162.99,"market failure."],[163.98,165.3,"rent-seeking."],[166.0,171.79,"rent-seeking means gaining wealth by manipulating rules rather than creating value."],[172.09,175.44,"Lobbying for special privileges is rent-seeking."],[176.14,179.37,"Your turn. Say: rent-seeking."],[182.07,183.29,"rent-seeking."],[184.28,186.64,"Now let's listen to a conversation."],[186.94,189.98,"Ms. Sarah, are there things money shouldn't buy?"],[191.28,195.27,"Michael Sandel's book on the moral limits of markets argues that there are."],[196.58,199.35,"Like paying people to stand in queues for you?"],[200.65,207.25,"Exactly. The steady commodification of everyday life, Sandel says, corrupts certain values."],[208.55,210.18,"But markets are efficient."],[211.48,217.63,"Often, yes, but pollution, an externality nobody pays for, shows their limits."],[218.92,220.71,"And shared fishing grounds?"],[222.02,227.72,"A classic tragedy of the commons, the kind of market failure that requires collective rules."],[229.02,233.63,"Grammar focus: Complex noun phrases (extended)."],[233.93,236.37,"Complex noun phrases add precision."],[236.67,242.33,"Sandel's book on the moral limits of markets. The steady commodification of everyday life."],[242.63,248.96,"Pollution, an externality nobody pays for, shows the limits of markets."],[249.26,254.96,"Long noun phrases are powerful in writing; in speech, break them up for clarity."],[255.95,259.02,"Now read and listen. What Money Can't Buy."],[259.32,263.98,"Markets are among humanity's most powerful tools for creating wealth."],[265.28,271.3,"Yet philosopher Michael Sandel warns of a shift from having a market economy to being a market society."],[272.58,279.04,"In such a society, the commodification of life extends to education, health and even friendship."],[280.35,287.98,"Economists recognise that markets can fail, particularly where externalities such as pollution are involved."],[289.28,295.51,"Public goods, like clean air, are under-provided because no one can easily profit from them."],[296.82,302.89,"The tragedy of the commons describes how shared resources are depleted when everyone acts alone."],[304.18,309.83,"Rent-seeking, meanwhile, rewards manipulation of rules rather than genuine productivity."],[311.12,316.23,"The question, then, is not whether to have markets, but where their moral limits should lie."],[317.52,320.03,"Quiz time! Choose the correct answer."],[320.33,323.86,"A cost affecting others who did not choose it is an blank."],[324.16,329.57,"A, externality. B, public good. C, rent-seeking."],[333.58,336.43,"The answer is A: externality."],[337.92,339.99,"Which is a complex noun phrase?"],[340.29,345.61,"A, the book. B, the controversial book on market ethics. C, books."],[349.62,353.71,"The answer is B: the controversial book on market ethics."],[355.22,359.78,"Clean air, a public good blank everyone, is under threat."],[360.08,364.65,"A, benefits. B, benefiting. C, benefited."],[368.65,370.99,"The answer is B: benefiting."],[372.48,376.7,"Overuse of shared resources through self-interest is the blank."],[377.0,383.52,"A, tragedy of the commons. B, moral economy. C, market fundamentalism."],[387.52,390.86,"The answer is A: tragedy of the commons."],[392.35,395.67,"According to Sandel, what are we shifting towards?"],[395.97,401.16,"A, a market society. B, a moral economy. C, degrowth."],[405.15,408.17,"The answer is A: a market society."],[409.68,414.95,"Now it's your turn. Part one: Are there things that money should not be able to buy?"],[420.25,426.95,"Part two: Use a complex noun phrase; give two examples and explain the principle."],[433.25,445.7,"Yes. The sale of school places to the highest bidder and the buying of votes both corrupt values that depend on fairness. The principle is that some goods lose their meaning when they become commodities."],[446.0,447.97,"That is a well-argued answer!"],[448.98,454.34,"Great work today! You learned eight new words and complex noun phrases (extended)."],[454.64,458.06,"Today's value is honesty. Always tell the truth."],[458.36,462.32,"See you in Unit twenty-seven. Goodbye!"],[462.62,466.88,"Thank you, Ms. Sarah! Bye, everyone!"]],"OC-Proficiency-Unit27-Silence-and-Communication":[[0.35,5.7,"Hello, everyone! I'm Ms. Sarah. Welcome to Online Proficiency."],[6.0,9.08,"Hi! I'm Rithy. Let's learn together!"],[9.38,17.19,"Unit twenty-seven: Silence and Communication. In this unit, you will explore meaning beyond words."],[18.18,19.52,"eloquent silence."],[20.22,24.6,"eloquent silence means a silence that communicates a clear message."],[24.9,27.86,"His eloquent silence said more than any speech."],[28.56,31.96,"Your turn. Say: eloquent silence."],[34.66,36.04,"eloquent silence."],[37.05,38.32,"unspoken rule."],[39.02,43.0,"unspoken rule means a rule everyone follows without stating it."],[43.3,46.42,"It's an unspoken rule not to sit in the elder's seat."],[47.12,50.07,"Your turn. Say: unspoken rule."],[52.77,53.97,"unspoken rule."],[54.98,56.3,"tacit knowledge."],[57.0,61.52,"tacit knowledge means knowledge gained from experience that is hard to explain."],[61.82,64.75,"Riding a bicycle relies on tacit knowledge."],[65.44,68.05,"Your turn. Say: tacit knowledge."],[70.75,72.05,"tacit knowledge."],[73.05,74.2,"implicature."],[74.9,78.81,"implicature means what a speaker suggests without saying it directly."],[79.11,82.87,"'Some students passed' carries the implicature that not all did."],[83.57,87.12,"Your turn. Say: implicature."],[89.82,91.0,"implicature."],[92.02,93.18,"pragmatics."],[93.88,97.58,"pragmatics means the study of meaning in context."],[97.88,102.2,"Pragmatics explains why 'Can you pass the salt?' is a request."],[102.9,105.67,"Your turn. Say: pragmatics."],[108.37,109.45,"pragmatics."],[110.45,111.98,"phatic communication."],[112.69,119.86,"phatic communication means small talk that builds social connection rather than sharing information."],[120.16,124.29,"'Have you eaten yet?' is phatic communication in Khmer culture."],[124.99,128.13,"Your turn. Say: phatic communication."],[130.83,132.16,"phatic communication."],[133.15,134.57,"politeness theory."],[135.27,140.16,"politeness theory means a theory of how people protect each other's 'face' in conversation."],[140.46,143.56,"Politeness theory explains indirect refusals."],[144.26,147.84,"Your turn. Say: politeness theory."],[150.54,151.78,"politeness theory."],[152.78,153.97,"speech act."],[154.67,160.4,"speech act means an utterance that performs an action, like promising or apologising."],[160.7,162.92,"Saying 'I promise' is a speech act."],[163.62,166.69,"Your turn. Say: speech act."],[169.39,170.47,"speech act."],[171.48,173.8,"Now let's listen to a conversation."],[174.1,180.34,"Rithy, when someone in Cambodia asks, 'Have you eaten yet?', do they want information?"],[181.65,187.9,"Not really. Were I to describe my whole lunch, they'd be surprised! It's phatic communication."],[189.22,192.76,"A friendly ritual, then. What about silence in meetings?"],[194.05,199.85,"Silence can be eloquent. Should a junior stay silent, it may signal disagreement, not agreement."],[201.15,205.32,"That's where pragmatics helps: meaning depends on context."],[206.62,212.83,"And on unspoken rules. Had I spoken directly to my professor, he might have lost face."],[214.12,216.15,"Politeness theory in action."],[217.45,223.7,"Exactly. Much of our communication relies on tacit knowledge rather than words."],[225.02,228.66,"Grammar focus: Conditionals beyond the rules (extended)."],[228.97,231.2,"Inverted conditionals add polish."],[231.5,238.57,"Were I to describe my lunch, they'd be surprised. Should a junior stay silent, it may signal disagreement."],[238.87,242.24,"Had I spoken directly, he might have lost face."],[242.54,249.07,"Inverted conditionals make spoken English sound polished; use them in presentations and formal discussion."],[250.08,252.82,"Now read and listen. What We Don't Say."],[253.12,257.39,"Linguists have long recognised that meaning is not contained in words alone."],[258.68,263.64,"Pragmatics studies how context shapes what speakers intend and what listeners infer."],[264.95,270.88,"Philosopher Paul Grice described implicature: meanings suggested rather than stated."],[272.18,279.88,"Phatic communication, such as greetings and small talk, builds relationships rather than exchanging information."],[281.18,286.84,"Speech act theory shows that words can perform actions, from promises to apologies."],[288.15,293.75,"Politeness theory explains why people soften refusals to protect each other's face."],[295.05,302.1,"In many cultures, including Cambodia's, an eloquent silence can be more meaningful than a direct reply."],[303.38,308.17,"Were we to listen only to words, we would miss much of what people truly communicate."],[309.48,312.18,"Quiz time! Choose the correct answer."],[312.48,316.61,"Small talk that builds connection rather than sharing information is blank."],[316.91,322.86,"A, phatic communication. B, implicature. C, speech act."],[326.85,329.51,"The answer is A: phatic communication."],[331.02,334.24,"blank I to win the lottery, I'd travel the world."],[334.53,337.63,"A, If. B, Were. C, Should."],[341.62,343.43,"The answer is B: Were."],[344.92,347.06,"blank you have questions, please ask."],[347.36,350.38,"A, Should. B, Had. C, Were."],[354.38,356.46,"The answer is A: Should."],[357.95,361.83,"Knowledge from experience that is hard to explain is blank."],[362.13,366.91,"A, tacit knowledge. B, pragmatics. C, politeness theory."],[370.92,373.86,"The answer is A: tacit knowledge."],[375.35,378.71,"According to the text, who described implicature?"],[379.01,384.07,"A, Paul Grice. B, Edward Hall. C, Sandel."],[388.05,390.68,"The answer is A: Paul Grice."],[392.18,397.48,"Now it's your turn. Part one: How is meaning communicated without words in your culture?"],[402.78,407.84,"Part two: Use an inverted conditional; give two examples and explain each."],[414.14,428.2,"Much is communicated through silence and tone. Were someone to refuse a request directly, it might seem rude, so people often say 'Let me think about it'. Silence in a meeting, similarly, may express polite disagreement."],[428.5,430.91,"That is a well-argued answer!"],[431.92,437.06,"Great work today! You learned eight new words and conditionals beyond the rules (extended)."],[437.37,441.11,"Today's value is respect. Thank the people who help us."],[441.41,444.9,"See you in Unit twenty-eight. Goodbye!"],[445.2,448.16,"Thank you, Ms. Sarah! Bye, everyone!"]],"OC-Proficiency-Unit28-Risk-Society":[[0.35,5.34,"Hello, everyone! I'm Ms. Sarah. Welcome to Online Proficiency."],[5.64,8.4,"Hi! I'm Rithy. Let's learn together!"],[8.7,16.9,"Unit twenty-eight: Risk Society. In this unit, you will analyse how modern societies create and manage risk."],[17.88,19.35,"risk society."],[20.05,27.47,"risk society means Ulrich Beck's idea that modern societies are organised around managing self-created risks."],[27.77,31.71,"Beck's risk society describes dangers we produce ourselves."],[32.41,35.66,"Your turn. Say: risk society."],[38.37,39.64,"risk society."],[40.65,42.34,"manufactured risk."],[43.04,48.61,"manufactured risk means danger created by human activity rather than nature."],[48.91,51.63,"Climate change is a manufactured risk."],[52.33,55.49,"Your turn. Say: manufactured risk."],[58.19,59.65,"manufactured risk."],[60.65,61.95,"systemic risk."],[62.65,67.32,"systemic risk means the danger that one failure spreads through a whole system."],[67.62,70.9,"The banking crisis exposed systemic risk."],[71.6,75.6,"Your turn. Say: systemic risk."],[78.3,79.68,"systemic risk."],[80.68,82.21,"catastrophic risk."],[82.91,87.03,"catastrophic risk means a danger that could cause enormous loss of life."],[87.33,89.64,"Pandemics are a catastrophic risk."],[90.34,94.02,"Your turn. Say: catastrophic risk."],[96.72,98.32,"catastrophic risk."],[99.32,100.84,"resilience thinking."],[101.54,105.8,"resilience thinking means planning systems to absorb shocks and recover."],[106.1,109.3,"Resilience thinking shapes modern flood defences."],[110.0,113.31,"Your turn. Say: resilience thinking."],[116.01,117.53,"resilience thinking."],[118.52,119.99,"cascade failure."],[120.69,124.44,"cascade failure means a chain reaction of failures."],[124.73,128.35,"A power cut triggered a cascade failure across the network."],[129.05,132.21,"Your turn. Say: cascade failure."],[134.91,136.33,"cascade failure."],[137.32,139.14,"precautionary politics."],[139.84,145.74,"precautionary politics means policy that acts early to prevent uncertain harm."],[146.04,149.92,"Precautionary politics guided the ban on certain pesticides."],[150.62,153.97,"Your turn. Say: precautionary politics."],[156.67,158.56,"precautionary politics."],[159.55,160.77,"risk perception."],[161.47,166.34,"risk perception means how people judge the seriousness of a danger."],[166.64,169.24,"Media coverage shapes risk perception."],[169.94,172.94,"Your turn. Say: risk perception."],[175.64,176.98,"risk perception."],[177.98,180.2,"Now let's listen to a conversation."],[180.5,184.81,"Ms. Sarah, why do modern societies seem so anxious about risk?"],[186.12,193.09,"Ulrich Beck argued that we now live in a risk society, wherein the gravest dangers are of our own making."],[194.38,197.17,"Manufactured risks, like climate change?"],[198.48,203.49,"Indeed. And interconnected systems render us vulnerable to cascade failure."],[204.78,208.18,"A single bank collapse spreading worldwide, for instance."],[209.48,212.45,"Precisely, which is what is meant by systemic risk."],[213.75,216.9,"Yet our risk perception is often distorted."],[218.18,225.34,"Quite so. Hence the case, notwithstanding its costs, for resilience thinking and prudent precaution."],[226.65,231.52,"Grammar focus: Formal and literary register (extended)."],[231.82,235.36,"Formal register uses elevated connectors and verbs."],[235.66,242.38,"A society wherein the gravest dangers are self-made. Interconnected systems render us vulnerable."],[242.68,246.44,"Notwithstanding its costs, resilience is essential."],[246.74,254.03,"Words like 'wherein' and 'notwithstanding' suit legal and academic writing, but sound stiff in casual speech."],[255.05,258.88,"Now read and listen. Living With Self-Made Dangers."],[259.18,264.75,"Sociologist Ulrich Beck argued that modernity has created a new kind of society."],[266.05,271.46,"In this risk society, the greatest threats are no longer natural but manufactured."],[272.75,278.62,"Nuclear accidents, financial crises and climate change are products of human systems."],[279.92,286.37,"Globalisation has increased systemic risk, rendering distant economies vulnerable to local failures."],[287.68,294.91,"A single disruption may trigger a cascade failure across energy, transport and communication networks."],[296.22,302.73,"Risk perception, meanwhile, is shaped as much by media and emotion as by probability."],[304.02,310.08,"Precautionary politics and resilience thinking seek to prepare societies for uncertain shocks."],[311.38,317.92,"Notwithstanding their costs, such approaches may prove essential to survival in an interconnected age."],[319.22,322.01,"Quiz time! Choose the correct answer."],[322.31,325.13,"Danger created by human activity is blank."],[325.43,332.19,"A, manufactured risk. B, risk perception. C, resilience thinking."],[336.18,339.59,"The answer is A: manufactured risk."],[341.08,343.85,"The heavy rain blank the roads impassable."],[344.15,347.34,"A, rendered. B, made to. C, gave."],[351.35,353.59,"The answer is A: rendered."],[355.08,357.99,"blank the cost, the project went ahead."],[358.29,362.09,"A, Notwithstanding. B, Wherein. C, Hence."],[366.08,368.4,"The answer is A: Notwithstanding."],[369.88,372.37,"A chain reaction of failures is a blank."],[372.67,379.07,"A, cascade failure. B, catastrophic risk. C, systemic risk."],[383.08,385.65,"The answer is A: cascade failure."],[387.15,390.76,"According to the text, what shapes risk perception?"],[391.06,397.89,"A, only probability. B, media and emotion as well as probability. C, nothing."],[401.88,407.03,"The answer is B: media and emotion as well as probability."],[408.52,415.94,"Now it's your turn. Part one: Which manufactured risk concerns you most, and how should society respond?"],[421.24,425.57,"Part two: Use at least two formal expressions in your answer."],[431.87,444.67,"Climate change concerns me most, since it renders entire regions vulnerable. Notwithstanding the costs of adaptation, governments should invest in resilience, thereby protecting the most exposed communities."],[444.97,448.16,"That is a well-argued answer!"],[449.15,455.82,"Great work today! You learned eight new words and formal and literary register (extended)."],[456.12,460.26,"Today's value is being prepared. Get ready before you go."],[460.56,463.89,"See you in Unit twenty-nine. Goodbye!"],[464.19,466.71,"Thank you, Ms. Sarah! Bye, everyone!"]],"OC-Proficiency-Unit29-Philosophy-of-Education":[[0.35,5.27,"Hello, everyone! I'm Ms. Sarah. Welcome to Online Proficiency."],[5.57,8.63,"Hi! I'm Rithy. Let's learn together!"],[8.93,16.13,"Unit twenty-nine: Philosophy of Education. In this unit, you will debate what education is truly for."],[17.15,18.58,"Socratic method."],[19.28,25.47,"Socratic method means teaching through questions that make learners examine their own ideas."],[25.77,29.08,"The Socratic method turns a lecture into a conversation."],[29.78,32.69,"Your turn. Say: Socratic method."],[35.39,36.62,"Socratic method."],[37.62,39.2,"liberal education."],[39.9,45.93,"liberal education means a broad education in arts and sciences that develops the whole mind."],[46.23,50.36,"A liberal education teaches you how to think, not what to think."],[51.06,54.34,"Your turn. Say: liberal education."],[57.04,58.49,"liberal education."],[59.48,61.4,"emancipatory education."],[62.1,68.15,"emancipatory education means education that aims to free people from oppression and dependence."],[68.45,73.99,"Emancipatory education helped farmers read their own land contracts."],[74.69,78.39,"Your turn. Say: emancipatory education."],[81.09,83.08,"emancipatory education."],[84.08,85.87,"pedagogy of the oppressed."],[86.57,93.91,"pedagogy of the oppressed means Paulo Freire's theory that education should empower the poor to change society."],[94.21,98.04,"Pedagogy of the oppressed begins with the learners' own lives."],[98.74,102.47,"Your turn. Say: pedagogy of the oppressed."],[105.17,106.85,"pedagogy of the oppressed."],[107.85,109.87,"banking model of education."],[110.57,116.68,"banking model of education means Freire's term for teachers 'depositing' facts into passive students."],[116.98,121.2,"Copying from the board all day is the banking model of education."],[121.9,125.85,"Your turn. Say: banking model of education."],[128.55,130.39,"banking model of education."],[131.38,132.18,"Bildung."],[132.88,137.97,"Bildung means the German ideal of education as lifelong self-cultivation."],[138.28,141.5,"For Humboldt, Bildung meant shaping one's whole character."],[142.2,144.8,"Your turn. Say: Bildung."],[147.5,148.35,"Bildung."],[149.35,150.87,"character education."],[151.57,157.87,"character education means teaching values such as honesty, respect and responsibility."],[158.17,161.99,"Character education is part of every C2-EPE lesson."],[162.69,166.05,"Your turn. Say: character education."],[168.75,170.14,"character education."],[171.15,172.78,"critical consciousness."],[173.48,179.41,"critical consciousness means the ability to recognise and question social and political injustice."],[179.71,183.56,"Literacy classes awakened critical consciousness among workers."],[184.26,187.72,"Your turn. Say: critical consciousness."],[190.42,191.92,"critical consciousness."],[192.92,194.96,"Now let's listen to a conversation."],[195.26,199.01,"Ms. Sarah, is school just about passing exams?"],[200.32,206.22,"If it is, we are barking up the wrong tree. Education should light a fire, not fill a bucket."],[207.52,213.27,"But my old school was pure banking model of education: we copied, memorised, repeated."],[214.55,219.09,"Freire would say the teacher held all the cards and the students were empty vaults."],[220.38,222.41,"So what is the alternative?"],[223.72,228.03,"The Socratic method, for one: questions that make you think on your feet."],[229.32,233.23,"And character education? Isn't that just icing on the cake?"],[234.55,238.39,"Far from it. Knowledge without character is a ship without a rudder."],[239.68,244.24,"Grammar focus: Idioms and figurative language (extended)."],[244.54,247.08,"Idioms and metaphors make arguments vivid."],[247.38,254.81,"If school is only about exams, we are barking up the wrong tree. Education should light a fire, not fill a bucket."],[255.11,258.36,"Knowledge without character is a ship without a rudder."],[258.66,267.24,"At C2, use figurative language sparingly and precisely: one vivid image persuades more than five clichés."],[268.25,271.39,"Now read and listen. What Is Education For?."],[271.69,277.31,"Philosophers have argued about the purpose of education for more than two thousand years."],[278.62,283.65,"Socrates taught by questioning, a practice now known as the Socratic method."],[284.95,292.23,"In nineteenth-century Germany, the ideal of Bildung described education as lifelong self-cultivation."],[293.52,300.54,"A liberal education, in a similar spirit, aims to develop the whole mind rather than train a single skill."],[301.85,308.34,"In 1968, the Brazilian educator Paulo Freire wrote Pedagogy of the Oppressed."],[309.65,316.62,"He criticised the banking model of education, in which teachers simply deposit facts into passive students."],[317.92,323.35,"Instead, he called for emancipatory education that builds critical consciousness."],[324.65,331.98,"Today, many schools combine these ideas with character education, hoping to produce people who are both wise and good."],[333.28,336.06,"Quiz time! Choose the correct answer."],[336.36,340.38,"Teachers 'depositing' facts into passive students is the blank."],[340.68,346.46,"A, banking model of education. B, Socratic method. C, Bildung."],[350.45,354.13,"The answer is A: banking model of education."],[355.62,358.15,"'You're barking up the wrong tree' means you are blank."],[358.45,364.07,"A, looking in the wrong place. B, shouting too loudly. C, climbing too high."],[368.05,371.06,"The answer is A: looking in the wrong place."],[372.55,374.81,"Teaching through questions is the blank."],[375.11,381.63,"A, Socratic method. B, liberal education. C, character education."],[385.62,388.31,"The answer is A: Socratic method."],[389.82,392.56,"'Icing on the cake' describes something that is blank."],[392.86,398.59,"A, essential. B, a pleasant extra. C, a mistake."],[402.58,405.34,"The answer is B: a pleasant extra."],[406.85,410.61,"According to the text, who wrote Pedagogy of the Oppressed?"],[410.91,415.16,"A, Paulo Freire. B, Socrates. C, Humboldt."],[419.15,421.82,"The answer is A: Paulo Freire."],[423.32,430.01,"Now it's your turn. Part one: What should be the main purpose of education in Cambodia today?"],[435.31,441.46,"Part two: Use one idiom and one metaphor; compare two models of education."],[447.76,460.44,"If we only train students for exams, we are barking up the wrong tree. Education should light a fire: it should build critical consciousness and good character, not just fill a bucket with facts."],[460.74,463.26,"That is a well-argued answer!"],[464.25,470.05,"Great work today! You learned eight new words and idioms and figurative language (extended)."],[470.35,473.87,"Today's value is pride in learning. Be proud of what you learned."],[474.17,476.82,"See you in Unit thirty. Goodbye!"],[477.12,479.82,"Thank you, Ms. Sarah! Bye, everyone!"]],"OC-Proficiency-Unit30-Heritage-of-the-Khmer-World":[[0.35,5.29,"Hello, everyone! I'm Ms. Sarah. Welcome to Online Proficiency."],[5.59,8.65,"Hi! I'm Rithy. Let's learn together!"],[8.95,18.15,"Unit thirty: Heritage of the Khmer World. In this unit, you will discuss Angkorian civilisation with careful, nuanced claims."],[19.15,20.81,"Khmer Empire legacy."],[21.51,27.8,"Khmer Empire legacy means the lasting influence of the Khmer Empire on culture and identity."],[28.1,31.65,"The Khmer Empire legacy can be seen from Thailand to Laos."],[32.35,35.93,"Your turn. Say: Khmer Empire legacy."],[38.63,40.41,"Khmer Empire legacy."],[41.42,43.17,"Angkorian civilisation."],[43.87,50.49,"Angkorian civilisation means the ."],[189.55,191.86,"Now let's listen to a conversation."],[192.16,195.49,"Rithy, how do historians know so much about Angkor?"],[196.78,203.3,"Mostly from stone. Sanskrit inscriptions praised the kings, and Khmer script recorded daily life."],[204.62,209.61,"Some say Angkor collapsed because its water system failed. Is that right?"],[210.92,215.13,"It may well have been one factor, but it can't have been the only one."],[216.45,221.65,"Interesting. So the hydraulic city theory is only part of the story?"],[222.95,227.63,"Arguably. Droughts, floods and shifting trade must have played a role too."],[228.95,233.17,"And Jayavarman VII? Was he really so exceptional?"],[234.48,240.0,"He might be the most ambitious builder in our history: the Bayon alone is extraordinary."],[241.32,245.45,"Grammar focus: Modality and nuance (extended)."],[245.75,248.34,"Past modals show degrees of certainty."],[248.64,252.93,"It may well have been one factor, but it can't have been the only one."],[253.23,256.21,"Droughts and shifting trade must have played a role too."],[256.51,262.19,"Historians rarely say 'it was'; past modals let you show exactly how certain the evidence is."],[263.18,266.38,"Now read and listen. Reading the Stones of Angkor."],[266.68,272.92,"Between the ninth and fifteenth centuries, Angkorian civilisation dominated much of mainland Southeast Asia."],[274.22,280.16,"Its kings were linked with the divine through the devaraja cult, said to have begun in 802."],[281.45,291.95,"Our knowledge comes largely from inscriptions: Sanskrit inscriptions in courtly verse, and texts in Khmer script recording land and temple duties."],[293.25,301.1,"Archaeologists have also revealed that Angkor was a vast hydraulic city, with reservoirs, canals and embankments."],[302.42,309.11,"Jayavarman VII, a Buddhist king, built Angkor Thom and the Bayon with its serene stone faces."],[310.42,316.53,"Why Angkor declined remains debated; failures in the water system may well have contributed."],[317.82,323.47,"However, war, climate extremes and a shift towards maritime trade must also have mattered."],[324.78,330.4,"Whatever the cause, the Khmer Empire legacy remains central to Cambodian identity today."],[331.72,334.4,"Quiz time! Choose the correct answer."],[334.7,337.48,"The 'god-king' cult of the Khmer kings is the blank."],[337.78,341.97,"A, devaraja. B, Bayon. C, Khmer script."],[345.98,348.73,"The answer is A: devaraja."],[350.22,355.18,"'It blank been the only cause' means it is impossible that it was the only cause."],[355.48,359.06,"A, can't have. B, must have. C, may have."],[363.05,365.92,"The answer is A: can't have."],[367.42,370.07,"'Trade must have played a role' expresses blank."],[370.37,376.7,"A, a confident deduction. B, an impossibility. C, a weak guess."],[380.72,383.49,"The answer is A: a confident deduction."],[384.98,388.85,"A city organised around large water systems is a blank."],[389.15,396.05,"A, hydraulic city. B, Sanskrit inscription. C, devaraja."],[400.05,403.11,"The answer is A: hydraulic city."],[404.62,408.35,"According to the text, who built Angkor Thom and the Bayon?"],[408.65,416.61,"A, Jayavarman VII. B, Jayavarman II. C, a French archaeologist."],[420.62,423.85,"The answer is A: Jayavarman VII."],[425.35,430.95,"Now it's your turn. Part one: Why do you think the Angkorian civilisation declined?"],[436.25,441.17,"Part two: Use three different past modals to show different degrees of certainty."],[447.46,457.94,"The water system may well have failed after long droughts and floods. However, it can't have been the only reason. Shifting trade routes and wars must have weakened Angkor too."],[458.25,461.19,"That is a well-argued answer!"],[462.18,468.68,"Great work today! You learned eight new words and modality and nuance (extended)."],[468.98,473.36,"Today's value is respect for culture. Be proud of our Khmer culture."],[473.66,476.45,"See you in Unit thirty-one. Goodbye!"],[476.75,479.28,"Thank you, Ms. Sarah! Bye, everyone!"]],"OC-Proficiency-Unit31-Information-Knowledge-and-Wisdom":[[0.35,5.57,"Hello, everyone! I'm Ms. Sarah. Welcome to Online Proficiency."],[5.87,9.04,"Hi! I'm Rithy. Let's learn together!"],[9.34,17.55,"Unit thirty-one: Information, Knowledge and Wisdom. In this unit, you will argue persuasively about information in the digital age."],[18.55,19.98,"data deluge."],[20.68,25.23,"data deluge means an overwhelming flood of digital information."],[25.53,29.62,"In the data deluge, attention becomes the scarcest resource."],[30.32,33.13,"Your turn. Say: data deluge."],[35.83,37.15,"data deluge."],[38.15,39.65,"knowledge management."],[40.35,46.51,"knowledge management means the organised way an institution collects, shares and uses what it knows."],[46.81,51.16,"Good knowledge management stops a school losing experience when teachers leave."],[51.86,55.09,"Your turn. Say: knowledge management."],[57.8,59.46,"knowledge management."],[60.45,62.08,"wisdom of crowds."],[62.78,69.39,"wisdom of crowds means the idea that a large group's combined judgement is often better than an individual's."],[69.69,73.39,"The wisdom of crowds works only when people judge independently."],[74.09,77.08,"Your turn. Say: wisdom of crowds."],[79.78,81.21,"wisdom of crowds."],[82.22,83.54,"expert knowledge."],[84.24,89.82,"expert knowledge means deep, specialised understanding gained through study and experience."],[90.12,94.12,"Expert knowledge is not the same as a confident online video."],[94.81,98.23,"Your turn. Say: expert knowledge."],[100.93,102.25,"expert knowledge."],[103.25,104.91,"information asymmetry."],[105.61,111.25,"information asymmetry means a situation where one side knows much more than the other."],[111.55,115.98,"Information asymmetry lets dishonest sellers cheat buyers."],[116.68,119.89,"Your turn. Say: information asymmetry."],[122.59,124.26,"information asymmetry."],[125.25,126.77,"tacit expertise."],[127.47,132.99,"tacit expertise means skill that experts have but find hard to put into words."],[133.29,137.23,"A master weaver's tacit expertise cannot be learned from a manual."],[137.93,141.65,"Your turn. Say: tacit expertise."],[144.35,145.99,"tacit expertise."],[146.98,148.1,"knowledge gap."],[148.8,154.6,"knowledge gap means a difference in knowledge between groups, often widened by unequal access."],[154.9,157.96,"Rural internet access could narrow the knowledge gap."],[158.66,161.98,"Your turn. Say: knowledge gap."],[164.68,165.77,"knowledge gap."],[166.78,168.84,"signal and noise."],[169.54,175.32,"signal and noise means useful information versus irrelevant or misleading information."],[175.62,178.76,"Good analysts separate signal and noise."],[179.46,182.81,"Your turn. Say: signal and noise."],[185.51,186.97,"signal and noise."],[187.95,190.13,"Now let's listen to a conversation."],[190.44,194.63,"Ms. Sarah, we have more information than ever. Are we wiser?"],[195.92,199.96,"Are we? We are drowning in data and starving for wisdom."],[201.25,204.84,"But the wisdom of crowds says many people together are smart."],[206.15,212.29,"Sometimes. Crowds can be wise, and crowds can be mad. Which crowd are you trusting?"],[213.58,215.99,"So expert knowledge still matters?"],[217.28,223.0,"Matters? It is essential. Information is not knowledge, and knowledge is not wisdom."],[224.32,227.91,"Then the real skill is separating signal and noise."],[229.22,236.19,"Exactly. Filter, verify, reflect: that is the discipline of a thinking mind."],[237.48,242.06,"Grammar focus: Rhetorical devices in argument (extended)."],[242.36,245.14,"Rhetorical devices make arguments memorable."],[245.44,252.15,"We are drowning in data and starving for wisdom. Information is not knowledge, and knowledge is not wisdom."],[252.45,255.1,"Filter, verify, reflect."],[255.4,263.74,"Rhetorical questions, antithesis and the rule of three make arguments memorable; combine them with evidence, not instead of it."],[264.75,267.98,"Now read and listen. From Data to Wisdom."],[268.28,274.01,"Every day, humanity produces an almost unimaginable quantity of data."],[275.32,279.39,"Yet the data deluge has not obviously made us wiser."],[280.68,290.79,"Thinkers often describe a hierarchy: data becomes information, information becomes knowledge, and knowledge, with judgement, becomes wisdom."],[292.08,298.97,"Organisations use knowledge management to capture what they know, though tacit expertise is notoriously hard to record."],[300.28,306.56,"The wisdom of crowds can outperform individuals, but only when opinions are diverse and independent."],[307.85,316.62,"Meanwhile, information asymmetry gives power to those who know more, and the knowledge gap between connected and unconnected communities widens."],[317.92,322.83,"In such a world, expert knowledge and careful reasoning remain indispensable."],[324.12,329.75,"The essential skill of our age is not finding information but separating signal and noise."],[331.05,334.03,"Quiz time! Choose the correct answer."],[334.33,338.37,"A situation where one side knows much more than the other is blank."],[338.67,345.63,"A, information asymmetry. B, knowledge management. C, wisdom of crowds."],[349.62,352.93,"The answer is A: information asymmetry."],[354.42,359.37,"'We are drowning in data and starving for wisdom' is an example of blank."],[359.67,365.43,"A, antithesis. B, understatement. C, ellipsis."],[369.42,372.12,"The answer is A: antithesis."],[373.62,376.49,"'Filter, verify, reflect' uses blank."],[376.79,381.89,"A, a tricolon. B, a passive. C, a conditional."],[385.88,388.35,"The answer is A: a tricolon."],[389.85,392.75,"Skill that is hard to put into words is blank."],[393.06,399.29,"A, tacit expertise. B, signal and noise. C, data deluge."],[403.28,406.55,"The answer is A: tacit expertise."],[408.05,411.68,"According to the text, when does the wisdom of crowds work?"],[411.98,418.27,"A, when opinions are diverse and independent. B, when experts lead. C, always."],[422.28,426.62,"The answer is A: when opinions are diverse and independent."],[428.12,433.96,"Now it's your turn. Part one: Does the internet make young people wiser or only better informed?"],[439.26,445.9,"Part two: Use a rhetorical question, an antithesis and a tricolon in your answer."],[452.2,461.96,"Are we wiser because we can search anything? Not necessarily. We have more information but less attention. To become wise, we must read, question and reflect."],[462.26,464.19,"That is a well-argued answer!"],[465.18,471.25,"Great work today! You learned eight new words and rhetorical devices in argument (extended)."],[471.55,476.18,"Today's value is curiosity. Ask questions and find out."],[476.48,479.38,"See you in Unit thirty-two. Goodbye!"],[479.68,482.17,"Thank you, Ms. Sarah! Bye, everyone!"]],"OC-Proficiency-Unit32-Nature-and-the-Sacred":[[0.35,5.52,"Hello, everyone! I'm Ms. Sarah. Welcome to Online Proficiency."],[5.82,8.96,"Hi! I'm Rithy. Let's learn together!"],[9.26,17.69,"Unit thirty-two: Nature and the Sacred. In this unit, you will report and attribute views on sacred nature accurately."],[18.68,19.91,"sacred grove."],[20.61,26.32,"sacred grove means a group of trees protected for religious or spiritual reasons."],[26.62,29.4,"The village sacred grove has never been cut."],[30.1,33.16,"Your turn. Say: sacred grove."],[35.86,37.19,"sacred grove."],[38.18,39.48,"spirit forest."],[40.17,45.46,"spirit forest means a forest believed to be home to ancestral or guardian spirits."],[45.76,49.12,"The Bunong protect their spirit forest in Mondulkiri."],[49.82,53.28,"Your turn. Say: spirit forest."],[55.98,57.38,"spirit forest."],[58.38,59.34,"animism."],[60.04,66.03,"animism means the belief that natural things such as rivers, trees and mountains have spirits."],[66.33,69.98,"Animism shaped Khmer beliefs long before Buddhism arrived."],[70.68,73.58,"Your turn. Say: animism."],[76.28,77.29,"animism."],[78.28,80.29,"ecological spirituality."],[80.99,86.63,"ecological spirituality means a spiritual sense of connection with the natural world."],[86.93,91.01,"Ecological spirituality inspires monks who ordain trees."],[91.71,95.59,"Your turn. Say: ecological spirituality."],[98.29,100.38,"ecological spirituality."],[101.38,102.81,"reverence for nature."],[103.51,108.13,"reverence for nature means deep respect and awe towards the natural world."],[108.43,111.97,"Reverence for nature can be a powerful conservation tool."],[112.67,115.74,"Your turn. Say: reverence for nature."],[118.44,119.88,"reverence for nature."],[120.88,122.22,"sacred mountain."],[122.92,127.01,"sacred mountain means a mountain considered holy by a community."],[127.31,131.1,"Phnom Kulen is a sacred mountain for many Cambodians."],[131.8,134.8,"Your turn. Say: sacred mountain."],[137.5,138.77,"sacred mountain."],[139.78,141.53,"indigenous cosmology."],[142.23,149.49,"indigenous cosmology means an indigenous people's understanding of the universe and humanity's place in it."],[149.79,154.74,"In their indigenous cosmology, the forest and the village are one community."],[155.44,158.78,"Your turn. Say: indigenous cosmology."],[161.48,163.24,"indigenous cosmology."],[164.25,165.95,"biocultural diversity."],[166.65,173.8,"biocultural diversity means the link between the variety of life and the variety of cultures and languages."],[174.1,178.26,"Losing a language can also mean losing biocultural diversity."],[178.96,182.53,"Your turn. Say: biocultural diversity."],[185.23,186.97,"biocultural diversity."],[187.98,190.13,"Now let's listen to a conversation."],[190.43,195.24,"Rithy, I read that some forests in Cambodia survive because they are sacred."],[196.55,202.49,"Yes. Researchers have found that spirit forests are often better preserved than ordinary ones."],[203.78,205.19,"Who reported that?"],[206.48,212.31,"Several conservation studies; according to one, sacred groves protect rare species."],[213.62,216.15,"And what do the communities themselves say?"],[217.45,222.49,"Bunong elders insist that cutting a spirit forest would anger the ancestors."],[223.78,226.64,"Some scientists dismiss that as superstition."],[227.95,232.48,"Others acknowledge that reverence for nature may achieve what laws alone cannot."],[233.78,238.58,"Grammar focus: Precise reporting and attribution (extended)."],[238.88,241.91,"Reporting verbs show your attitude to a source."],[242.21,249.24,"Researchers have found that spirit forests are better preserved. Bunong elders insist that cutting them would anger the ancestors."],[249.54,253.71,"Some scientists dismiss this; others acknowledge its value."],[254.01,261.39,"Choose reporting verbs carefully: 'claim' and 'dismiss' signal doubt, while 'show' and 'acknowledge' signal acceptance."],[262.38,265.59,"Now read and listen. Where Forests Are Holy."],[265.89,272.29,"Across Asia and Africa, communities protect sacred groves where cutting trees is forbidden."],[273.58,280.53,"In Cambodia, indigenous peoples such as the Bunong maintain spirit forests in their ancestral lands."],[281.82,290.69,"These traditions grow out of animism and an indigenous cosmology in which humans, ancestors and nature are connected."],[291.98,297.97,"Phnom Kulen, a sacred mountain, has been revered by Khmer people for more than a thousand years."],[299.25,306.56,"Conservation researchers have reported that sacred sites frequently contain more biodiversity than surrounding land."],[307.85,317.15,"Some scientists, however, caution against romanticising tradition, noting that sacred status alone cannot stop large-scale logging."],[318.45,326.09,"Nevertheless, many experts now acknowledge the value of ecological spirituality and reverence for nature."],[327.38,334.69,"Protecting biocultural diversity, they argue, means protecting languages and beliefs as well as species."],[335.98,338.87,"Quiz time! Choose the correct answer."],[339.17,342.71,"A forest believed to be home to guardian spirits is a blank."],[343.01,349.56,"A, spirit forest. B, biocultural diversity. C, sacred mountain."],[353.55,356.49,"The answer is A: spirit forest."],[357.98,360.74,"Which reporting verb signals doubt about a claim?"],[361.04,364.88,"A, claim. B, show. C, demonstrate."],[368.88,370.93,"The answer is A: claim."],[372.42,374.97,"'Elders insist that...' suggests they blank."],[375.27,380.67,"A, feel very strongly. B, are unsure. C, have changed their mind."],[384.68,388.12,"The answer is A: feel very strongly."],[389.62,392.87,"The belief that rivers and trees have spirits is blank."],[393.17,399.3,"A, animism. B, ecological spirituality. C, indigenous cosmology."],[403.28,405.88,"The answer is A: animism."],[407.38,411.22,"According to the text, what do sacred sites frequently contain?"],[411.52,418.0,"A, more biodiversity. B, more tourists. C, fewer trees."],[422.02,425.97,"The answer is A: more biodiversity."],[427.48,433.05,"Now it's your turn. Part one: Can spiritual beliefs help protect the environment?"],[438.35,445.04,"Part two: Report at least two different views using precise reporting verbs, then give your own."],[451.34,464.76,"Researchers have found that spirit forests are often better preserved. Elders insist that the forest belongs to the ancestors. Some scientists dismiss this, but I would argue that reverence for nature works alongside the law."],[465.06,468.1,"That is a well-argued answer!"],[469.12,475.19,"Great work today! You learned eight new words and precise reporting and attribution (extended)."],[475.49,480.31,"Today's value is caring for nature. Care for plants, birds and our planet."],[480.61,484.28,"See you in Unit thirty-three. Goodbye!"],[484.58,486.89,"Thank you, Ms. Sarah! Bye, everyone!"]],"OC-Proficiency-Unit33-Humour-Irony-and-Satire":[[0.35,5.41,"Hello, everyone! I'm Ms. Sarah. Welcome to Online Proficiency."],[5.71,8.89,"Hi! I'm Rithy. Let's learn together!"],[9.19,17.89,"Unit thirty-three: Humour, Irony and Satire. In this unit, you will analyse how humour criticises and connects."],[18.88,20.12,"sarcasm."],[20.82,26.48,"sarcasm means saying the opposite of what you mean in order to mock or criticise."],[26.79,30.73,"'Great job,' he said with heavy sarcasm after I dropped the plates."],[31.43,34.17,"Your turn. Say: sarcasm."],[36.87,37.97,"sarcasm."],[38.98,40.11,"satirical."],[40.81,45.59,"satirical means using humour and exaggeration to criticise people or society."],[45.89,50.77,"The satirical cartoon showed the minister asleep on a pile of promises."],[51.47,53.88,"Your turn. Say: satirical."],[56.59,57.53,"satirical."],[58.52,59.4,"parody."],[60.1,65.49,"parody means a humorous imitation of a well-known work or style."],[65.79,69.17,"Students performed a parody of a TV news programme."],[69.87,72.87,"Your turn. Say: parody."],[75.57,76.4,"parody."],[77.42,78.19,"wit."],[78.89,83.5,"wit means the ability to say clever and amusing things quickly."],[83.8,86.6,"Her wit made even the dullest meeting enjoyable."],[87.3,90.11,"Your turn. Say: wit."],[92.81,93.45,"wit."],[94.45,95.44,"dark humour."],[96.14,100.73,"dark humour means jokes about serious, painful or frightening subjects."],[101.03,104.25,"Doctors sometimes use dark humour to cope with stress."],[104.95,107.98,"Your turn. Say: dark humour."],[110.68,111.67,"dark humour."],[112.68,114.13,"self-deprecation."],[114.83,118.36,"self-deprecation means making modest jokes about yourself."],[118.66,122.02,"A little self-deprecation makes a speaker more likeable."],[122.72,125.73,"Your turn. Say: self-deprecation."],[128.43,129.87,"self-deprecation."],[130.88,131.8,"deadpan."],[132.5,137.55,"deadpan means delivered with a completely serious face, though meant to be funny."],[137.84,140.69,"His deadpan delivery made the joke even funnier."],[141.39,144.04,"Your turn. Say: deadpan."],[146.74,147.68,"deadpan."],[148.68,149.97,"incongruity."],[150.68,156.59,"incongruity means something that does not fit with what is expected, often a source of humour."],[156.89,161.55,"Much comedy comes from incongruity: a king slipping on a banana."],[162.25,165.49,"Your turn. Say: incongruity."],[168.19,169.69,"incongruity."],[170.68,173.02,"Now let's listen to a conversation."],[173.32,177.62,"Ms. Sarah, why do some jokes work in English but not in Khmer?"],[178.92,185.55,"Humour depends on shared expectations. Break them, and people laugh; translate them, and often they don't."],[186.85,189.94,"Like sarcasm? Some of my friends never use it."],[191.25,197.15,"Some don't, and some do all the time. Sarcasm, in particular, travels badly."],[198.45,201.31,"What about satire? Is it just mockery?"],[202.62,209.04,"Not just mockery. Satirical writers criticise power; mockery merely laughs at people."],[210.35,214.14,"And deadpan comedy? That, I find hard to read."],[215.45,219.77,"Hard to read it may be, but master it and you'll understand British humour."],[221.08,226.72,"Grammar focus: Ellipsis, substitution and fronting (extended)."],[227.02,230.92,"Ellipsis and fronting make speech efficient and emphatic."],[231.22,238.48,"Some don't use sarcasm, and some do all the time. Deadpan comedy, that I find hard to read."],[238.78,242.56,"Hard to read it may be, but master it and you'll understand."],[242.86,250.81,"Ellipsis avoids repetition; fronting moves the key idea to the start for emphasis or contrast."],[251.82,254.29,"Now read and listen. Why We Laugh."],[254.59,257.87,"Philosophers have long tried to explain why we laugh."],[259.18,266.86,"One influential theory holds that humour arises from incongruity, the gap between what we expect and what happens."],[268.15,274.48,"Wit plays with this gap through clever language, while parody exaggerates the style of something familiar."],[275.78,283.37,"Satirical writing, from Jonathan Swift to modern cartoonists, uses humour to expose the abuse of power."],[284.68,290.5,"Sarcasm can be playful, but it can also wound, and it often fails across cultures."],[291.82,296.07,"Dark humour helps people cope with tragedy, though it can easily offend."],[297.38,303.48,"Self-deprecation, by contrast, invites listeners to laugh with the speaker rather than at others."],[304.78,313.1,"Humour, in short, is never merely funny: it reveals what a society values, fears and refuses to say aloud."],[314.38,317.28,"Quiz time! Choose the correct answer."],[317.58,321.03,"A humorous imitation of a well-known work is a blank."],[321.33,325.71,"A, parody. B, sarcasm. C, deadpan."],[329.72,332.08,"The answer is A: parody."],[333.58,338.74,"In 'Some students like satire; others don't', what is left out after 'don't'?"],[339.04,343.77,"A, like satire. B, students. C, others."],[347.78,350.49,"The answer is A: like satire."],[351.98,355.18,"'That, I find hard to read' is an example of blank."],[355.48,360.61,"A, fronting. B, passive voice. C, a conditional."],[364.62,366.99,"The answer is A: fronting."],[368.48,371.34,"Making modest jokes about yourself is blank."],[371.64,376.68,"A, self-deprecation. B, dark humour. C, incongruity."],[380.68,383.45,"The answer is A: self-deprecation."],[384.95,388.9,"According to the text, what does satirical writing expose?"],[389.2,395.13,"A, the abuse of power. B, grammar mistakes. C, personal secrets."],[399.12,401.75,"The answer is A: the abuse of power."],[403.25,408.4,"Now it's your turn. Part one: Should satire about political leaders be protected?"],[413.7,419.88,"Part two: Use one example of ellipsis and one of fronting; give two reasons."],[426.18,438.3,"Satire, I strongly believe, deserves protection. Powerful people can defend themselves; ordinary citizens often can't. Uncomfortable it may be, but satire keeps leaders humble."],[438.6,441.22,"That is a well-argued answer!"],[442.22,448.85,"Great work today! You learned eight new words and ellipsis, substitution and fronting (extended)."],[449.15,453.01,"Today's value is laughter. Laughing together makes us happy."],[453.31,456.09,"See you in Unit thirty-four. Goodbye!"],[456.39,459.07,"Thank you, Ms. Sarah! Bye, everyone!"]],"OC-Proficiency-Unit34-Ethics-of-Care":[[0.35,5.28,"Hello, everyone! I'm Ms. Sarah. Welcome to Online Proficiency."],[5.58,8.53,"Hi! I'm Rithy. Let's learn together!"],[8.83,16.64,"Unit thirty-four: Ethics of Care. In this unit, you will evaluate the value of care in families and economies."],[17.65,19.06,"ethics of care."],[19.76,26.82,"ethics of care means a moral theory that puts relationships and responsibility for others at the centre."],[27.12,31.21,"The ethics of care asks not 'What is fair?' but 'Who needs me?'"],[31.91,35.26,"Your turn. Say: ethics of care."],[37.96,39.2,"ethics of care."],[40.18,41.22,"caregiving."],[41.92,47.02,"caregiving means looking after someone who is young, ill, elderly or disabled."],[47.32,50.53,"Caregiving for her grandmother changed her career plans."],[51.23,53.69,"Your turn. Say: caregiving."],[56.39,57.42,"caregiving."],[58.42,59.77,"emotional labour."],[60.47,65.75,"emotional labour means the effort of managing feelings as part of a job or role."],[66.05,70.2,"Nurses perform enormous emotional labour every shift."],[70.9,73.6,"Your turn. Say: emotional labour."],[76.3,77.51,"emotional labour."],[78.52,79.8,"care economy."],[80.5,84.88,"care economy means all paid and unpaid work that looks after people."],[85.18,89.67,"Investing in the care economy creates jobs and supports families."],[90.37,93.55,"Your turn. Say: care economy."],[96.25,97.27,"care economy."],[98.28,99.84,"unpaid care work."],[100.54,105.53,"unpaid care work means cooking, cleaning and caring for family without payment."],[105.83,109.07,"Women still do most of the world's unpaid care work."],[109.77,113.24,"Your turn. Say: unpaid care work."],[115.94,117.4,"unpaid care work."],[118.38,119.83,"compassion fatigue."],[120.53,125.33,"compassion fatigue means emotional exhaustion from caring for people who are suffering."],[125.64,129.32,"Aid workers can suffer compassion fatigue after long missions."],[130.02,133.84,"Your turn. Say: compassion fatigue."],[136.54,138.11,"compassion fatigue."],[139.12,140.71,"relational ethics."],[141.41,146.52,"relational ethics means an approach to morality based on our connections with others."],[146.82,151.24,"Relational ethics sees a person as part of a web of relationships."],[151.94,155.41,"Your turn. Say: relational ethics."],[158.11,159.65,"relational ethics."],[160.65,161.77,"dependency."],[162.47,165.87,"dependency means the state of relying on others for support."],[166.17,170.12,"Every human life begins and often ends in dependency."],[170.82,173.9,"Your turn. Say: dependency."],[176.6,177.67,"dependency."],[178.68,181.03,"Now let's listen to a conversation."],[181.33,186.87,"Ms. Sarah, my mother cooks, cleans and cares for my grandmother, yet she says she 'doesn't work'."],[188.18,192.79,"Unpaid though it is, that is real work, and economies depend on it."],[194.08,196.04,"Economists don't count it, do they?"],[197.35,204.37,"Mostly not. Whereas a paid nurse adds to GDP, a daughter doing the same job adds nothing."],[205.68,207.21,"That seems unfair."],[208.52,214.85,"Granted, measuring care is difficult. Nevertheless, ignoring it makes millions of carers invisible."],[216.15,218.22,"And carers get exhausted too."],[219.52,225.64,"Exactly. Much as we admire them, we rarely support them; compassion fatigue is the result."],[226.95,231.18,"Grammar focus: Concession and contrast (extended)."],[231.48,234.33,"Concession makes an argument fair and convincing."],[234.63,242.54,"Unpaid though it is, care is real work. Whereas a paid nurse adds to GDP, a daughter adds nothing."],[242.84,247.67,"Granted, measuring care is difficult. Nevertheless, ignoring it is unjust."],[247.97,254.95,"Strong arguments admit the other side first: 'granted', 'admittedly' and 'much as' prepare your counter-argument."],[255.95,258.94,"Now read and listen. The Invisible Economy."],[259.24,264.15,"Every society depends on care: for children, for the sick and for the elderly."],[265.45,274.17,"Philosophers such as Carol Gilligan and Nel Noddings developed the ethics of care as an alternative to theories based on abstract rules."],[275.48,283.65,"Relational ethics reminds us that human beings are not isolated individuals; dependency is part of every life."],[284.95,292.59,"Yet the care economy is often undervalued, and unpaid care work is largely excluded from GDP."],[293.88,298.16,"Globally, women perform around three quarters of this unpaid work."],[299.45,305.69,"Paid caregiving jobs, meanwhile, involve heavy emotional labour but frequently offer low wages."],[306.98,314.14,"Granted, care cannot be measured as easily as factory output; nevertheless, its value is immense."],[315.45,321.52,"Supporting carers, through fair pay, rest and recognition, also helps prevent compassion fatigue."],[322.82,325.49,"Quiz time! Choose the correct answer."],[325.79,329.7,"Emotional exhaustion from caring for suffering people is blank."],[330.0,334.61,"A, compassion fatigue. B, dependency. C, care economy."],[338.62,341.48,"The answer is A: compassion fatigue."],[342.98,346.05,"'blank though it is, care is real work.'"],[346.35,350.4,"A, Unpaid. B, Whereas. C, Granted."],[354.42,356.83,"The answer is A: Unpaid."],[358.35,362.35,"Which word introduces a direct contrast between two clauses?"],[362.65,367.18,"A, whereas. B, therefore. C, moreover."],[371.18,373.3,"The answer is A: whereas."],[374.78,377.76,"Cooking and caring for family without payment is blank."],[378.06,383.43,"A, unpaid care work. B, emotional labour. C, relational ethics."],[387.42,390.3,"The answer is A: unpaid care work."],[391.78,397.3,"According to the text, roughly how much unpaid care work do women perform globally?"],[397.6,402.25,"A, about three quarters. B, about a quarter. C, about half."],[406.25,409.31,"The answer is A: about three quarters."],[410.82,417.46,"Now it's your turn. Part one: Should governments pay family members who care for elderly relatives?"],[422.76,427.49,"Part two: Concede one point against yo
