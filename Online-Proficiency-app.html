ur view, then counter it."],[433.79,446.56,"Admittedly, paying family carers would be expensive. Nevertheless, care is real work. Whereas nursing homes cost even more, supporting families keeps the elderly at home and prevents compassion fatigue."],[446.86,449.24,"That is a well-argued answer!"],[450.25,455.9,"Great work today! You learned eight new words and concession and contrast (extended)."],[456.2,460.5,"Today's value is caring. Be gentle and kind to baby animals."],[460.8,464.47,"See you in Unit thirty-five. Goodbye!"],[464.77,467.5,"Thank you, Ms. Sarah! Bye, everyone!"]],"OC-Proficiency-Unit35-Utopias-and-Dystopias":[[0.35,5.22,"Hello, everyone! I'm Ms. Sarah. Welcome to Online Proficiency."],[5.52,8.56,"Hi! I'm Rithy. Let's learn together!"],[8.86,18.07,"Unit thirty-five: Utopias and Dystopias. In this unit, you will explore imagined societies and what they warn us about."],[19.08,20.25,"utopia."],[20.95,24.11,"utopia means an imagined perfect society."],[24.41,29.74,"Thomas More coined the word 'utopia' in 1516."],[30.44,33.2,"Your turn. Say: utopia."],[35.9,36.85,"utopia."],[37.85,39.06,"dystopia."],[39.76,44.52,"dystopia means an imagined society where life is frightening and oppressive."],[44.82,49.74,"Orwell's 1984 is the classic dystopia."],[50.44,52.87,"Your turn. Say: dystopia."],[55.57,56.5,"dystopia."],[57.48,59.03,"social engineering."],[59.73,65.77,"social engineering means attempts to reshape society through planned, often forced, change."],[66.07,69.46,"Radical social engineering has caused immense suffering."],[70.16,73.42,"Your turn. Say: social engineering."],[76.12,77.76,"social engineering."],[78.75,80.22,"perfect society."],[80.91,87.18,"perfect society means a society without poverty, conflict or injustice."],[87.48,90.71,"Every revolution has promised a perfect society."],[91.41,94.99,"Your turn. Say: perfect society."],[97.69,98.99,"perfect society."],[99.98,101.16,"totalitarian."],[101.86,105.8,"totalitarian means controlling every part of people's lives."],[106.1,109.5,"A totalitarian state tolerates no opposition."],[110.2,113.55,"Your turn. Say: totalitarian."],[116.25,117.4,"totalitarian."],[118.42,120.0,"speculative fiction."],[120.7,125.88,"speculative fiction means stories that imagine alternative or future worlds."],[126.18,129.66,"Speculative fiction lets us test ideas before we live them."],[130.37,133.61,"Your turn. Say: speculative fiction."],[136.31,137.96,"speculative fiction."],[138.95,140.23,"collective dream."],[140.93,145.98,"collective dream means a vision of the future shared by a whole community."],[146.28,148.93,"Independence was once a collective dream."],[149.63,152.2,"Your turn. Say: collective dream."],[154.9,156.21,"collective dream."],[157.22,158.6,"cautionary tale."],[159.3,162.29,"cautionary tale means a story that warns of danger."],[162.59,167.07,"Brave New World is a cautionary tale about comfort without freedom."],[167.77,170.97,"Your turn. Say: cautionary tale."],[173.67,174.91,"cautionary tale."],[175.92,178.11,"Now let's listen to a conversation."],[178.41,181.45,"Rithy, would you like to live in a perfect society?"],[182.75,186.91,"It sounds tempting, but every utopia seems to hide a dark side."],[188.22,192.04,"Indeed. The word 'utopia' itself means 'no place'."],[193.35,197.18,"And the history of social engineering is far from reassuring."],[198.48,203.41,"Cambodia knows that painfully well. The dream of Year Zero became a nightmare."],[204.72,208.1,"A collective dream imposed by force turned totalitarian."],[209.38,213.89,"That's why dystopian novels matter: they are cautionary tales."],[215.18,219.7,"So speculative fiction is less about the future than about the present."],[221.02,225.58,"Grammar focus: Collocation and connotation (extended)."],[225.88,229.43,"Collocation and connotation shape how listeners feel."],[229.73,234.55,"The dream of Year Zero became a nightmare. Cambodia knows that painfully well."],[234.85,238.6,"A collective dream imposed by force turned totalitarian."],[238.9,244.77,"Words carry emotional colour: 'regime' sounds harsher than 'government', 'plan' gentler than 'scheme'."],[245.78,249.64,"Now read and listen. The Dangerous Dream of Perfection."],[249.94,260.85,"In 1516, Thomas More imagined an island society he called Utopia, a pun meaning both 'good place' and 'no place'."],[262.15,267.82,"Ever since, writers have imagined perfect societies free from poverty and conflict."],[269.12,276.42,"In the twentieth century, however, attempts at radical social engineering produced some of history's greatest tragedies."],[277.72,291.15,"Cambodia's own experience between 1975 and 1979 showed how a utopian collective dream, imposed by force, could become a totalitarian nightmare."],[292.45,297.81,"Partly in response to such events, dystopia became a major literary genre."],[299.12,308.62,"Novels like Orwell's 1984 and Huxley's Brave New World serve as cautionary tales about surveillance, propaganda and conformity."],[309.92,316.37,"Speculative fiction allows readers to test political ideas safely in imagination."],[317.68,323.31,"Perhaps the lesson is that the pursuit of perfection must never be allowed to justify cruelty."],[324.62,327.33,"Quiz time! Choose the correct answer."],[327.63,330.82,"An imagined society where life is oppressive is a blank."],[331.12,335.95,"A, dystopia. B, utopia. C, collective dream."],[339.95,341.95,"The answer is A: dystopia."],[343.45,345.98,"Which word has a more negative connotation?"],[346.28,350.24,"A, regime. B, government. C, administration."],[354.25,356.19,"The answer is A: regime."],[357.68,360.15,"Which is the most natural collocation?"],[360.45,365.21,"A, painfully well. B, painfully good. C, painfully nicely."],[369.22,372.04,"The answer is A: painfully well."],[373.55,376.18,"A story that warns of danger is a blank."],[376.48,382.63,"A, cautionary tale. B, speculative fiction. C, perfect society."],[386.62,389.44,"The answer is A: cautionary tale."],[390.95,394.47,"According to the text, what does 'utopia' mean as a pun?"],[394.77,400.47,"A, good place and no place. B, perfect island. C, future world."],[404.48,407.84,"The answer is A: good place and no place."],[409.35,417.02,"Now it's your turn. Part one: Why do people keep dreaming of perfect societies, even though utopias often fail?"],[422.32,428.74,"Part two: Use two strong collocations and contrast words with positive and negative connotations."],[435.04,446.43,"Humans are deeply hopeful, so we dream of justice. Yet a dream can become a nightmare when leaders impose it by force. Utopian ideals should guide us gently, never rule us absolutely."],[446.73,448.94,"That is a well-argued answer!"],[449.95,455.77,"Great work today! You learned eight new words and collocation and connotation (extended)."],[456.07,460.61,"Today's value is responsibility. Help at home and do your jobs."],[460.9,464.86,"See you in Unit thirty-six. Goodbye!"],[465.16,467.82,"Thank you, Ms. Sarah! Bye, everyone!"]],"OC-Proficiency-Unit36-Persuasion-in-Politics":[[0.35,5.0,"Hello, everyone! I'm Ms. Sarah. Welcome to Online Proficiency."],[5.3,8.38,"Hi! I'm Rithy. Let's learn together!"],[8.68,18.3,"Unit thirty-six: Persuasion in Politics. In this unit, you will recognise and analyse persuasive techniques in political language."],[19.32,20.61,"political rhetoric."],[21.31,26.25,"political rhetoric means language used by politicians to persuade and inspire."],[26.55,29.81,"Political rhetoric can unite a nation or divide it."],[30.51,33.78,"Your turn. Say: political rhetoric."],[36.48,37.77,"political rhetoric."],[38.78,40.18,"campaign messaging."],[40.88,45.75,"campaign messaging means the planned words and themes a campaign repeats to voters."],[46.05,49.15,"Their campaign messaging focused on jobs and safety."],[49.85,53.14,"Your turn. Say: campaign messaging."],[55.84,57.19,"campaign messaging."],[58.18,59.14,"spin doctor."],[59.84,65.99,"spin doctor means an adviser who presents news in the most favourable way for a politician."],[66.29,70.27,"The spin doctor called the defeat 'a learning opportunity'."],[70.97,74.15,"Your turn. Say: spin doctor."],[76.85,77.81,"spin doctor."],[78.82,80.03,"talking point."],[80.73,84.65,"talking point means a short prepared argument that speakers repeat."],[84.95,88.76,"Every minister repeated the same talking point on television."],[89.46,92.59,"Your turn. Say: talking point."],[95.29,96.36,"talking point."],[97.35,98.41,"soundbite."],[99.11,103.19,"soundbite means a short, memorable phrase designed for the media."],[103.49,105.9,"'Yes we can' was a powerful soundbite."],[106.6,109.52,"Your turn. Say: soundbite."],[112.22,113.36,"soundbite."],[114.35,116.04,"dog-whistle politics."],[116.74,122.43,"dog-whistle politics means coded messages that only certain groups are meant to understand."],[122.73,126.89,"Dog-whistle politics lets candidates deny what they really mean."],[127.59,130.99,"Your turn. Say: dog-whistle politics."],[133.69,135.51,"dog-whistle politics."],[136.52,138.05,"populist rhetoric."],[138.75,143.83,"populist rhetoric means language that sets 'the ordinary people' against a corrupt elite."],[144.13,148.12,"Populist rhetoric grows when trust in institutions falls."],[148.82,152.45,"Your turn. Say: populist rhetoric."],[155.15,156.66,"populist rhetoric."],[157.65,159.09,"electoral strategy."],[159.79,164.01,"electoral strategy means a plan for winning votes in an election."],[164.31,167.7,"Their electoral strategy targeted young urban voters."],[168.4,171.74,"Your turn. Say: electoral strategy."],[174.44,175.99,"electoral strategy."],[176.98,179.18,"Now let's listen to a conversation."],[179.48,183.09,"Ms. Sarah, why do politicians repeat the same phrases?"],[184.38,188.16,"Because a talking point repeated often enough begins to feel true."],[189.45,192.19,"So campaign messaging is mostly repetition?"],[193.48,199.33,"Repetition and emotion. A great soundbite matters more, alas, than a careful policy."],[200.62,202.31,"What should voters do?"],[203.62,207.42,"It is essential that every voter question what lies beneath the slogan."],[208.72,211.46,"Even if it be the candidate they support?"],[212.75,217.72,"Especially then. Come what may, critical listening is a citizen's first duty."],[219.02,223.43,"Grammar focus: Subjunctive and archaic forms (extended)."],[223.73,226.69,"The subjunctive gives formal and rhetorical weight."],[226.99,232.2,"It is essential that every voter question the slogan, even if it be their own candidate's."],[232.5,236.24,"Come what may, critical listening is a citizen's first duty."],[236.54,244.61,"The mandative subjunctive (that + base verb) is standard in formal English; 'if it be' is archaic and rhetorical."],[245.62,249.33,"Now read and listen. The Art of Political Persuasion."],[249.63,254.53,"Since ancient Athens, political rhetoric has been central to democratic life."],[255.82,261.75,"Modern campaigns, however, rely on professional campaign messaging tested on focus groups."],[263.05,269.37,"Spin doctors present every event in the most favourable light, while ministers repeat agreed talking points."],[270.68,276.93,"In the media age, a memorable soundbite can matter more than a detailed policy."],[278.22,283.97,"Some politicians use dog-whistle politics, sending coded messages to particular groups."],[285.25,290.76,"Populist rhetoric, meanwhile, divides society into 'the people' and 'the elite'."],[292.05,298.18,"Every electoral strategy involves persuasion, and persuasion is not in itself dishonest."],[299.48,305.5,"It is vital, nevertheless, that citizens learn to distinguish argument from manipulation."],[306.78,309.55,"Quiz time! Choose the correct answer."],[309.85,314.07,"An adviser who presents news favourably for a politician is a blank."],[314.37,320.54,"A, spin doctor. B, talking point. C, soundbite."],[324.55,327.36,"The answer is A: spin doctor."],[328.85,332.05,"It is essential that every citizen blank the facts."],[332.35,335.62,"A, check. B, checks. C, checked."],[339.62,341.36,"The answer is A: check."],[342.85,344.73,"'Come what may' means blank."],[345.03,349.39,"A, whatever happens. B, perhaps. C, until now."],[353.38,355.99,"The answer is A: whatever happens."],[357.48,359.97,"Coded messages for certain groups are blank."],[360.27,366.55,"A, dog-whistle politics. B, electoral strategy. C, campaign messaging."],[370.55,373.71,"The answer is A: dog-whistle politics."],[375.22,379.98,"According to the text, what must citizens learn to distinguish?"],[380.28,386.37,"A, argument from manipulation. B, left from right. C, fact from fiction novels."],[390.38,393.81,"The answer is A: argument from manipulation."],[395.32,401.35,"Now it's your turn. Part one: How can young voters protect themselves from political manipulation?"],[406.65,412.26,"Part two: Use the mandative subjunctive and one fixed subjunctive expression."],[418.56,429.0,"It is essential that young voters check facts and compare sources. I would recommend that every student follow more than one news outlet. Come what may, we must think for ourselves."],[429.3,432.02,"That is a well-argued answer!"],[433.02,438.85,"Great work today! You learned eight new words and subjunctive and archaic forms (extended)."],[439.15,443.05,"Today's value is honesty. Always tell the truth."],[443.35,447.8,"See you in Unit thirty-seven. Goodbye!"],[448.1,451.17,"Thank you, Ms. Sarah! Bye, everyone!"]],"OC-Proficiency-Unit37-Ecology-of-the-Mekong":[[0.35,5.55,"Hello, everyone! I'm Ms. Sarah. Welcome to Online Proficiency."],[5.85,9.11,"Hi! I'm Rithy. Let's learn together!"],[9.41,18.29,"Unit thirty-seven: Ecology of the Mekong. In this unit, you will structure an argument about the future of the Mekong."],[19.28,20.63,"Mekong basin."],[21.33,26.29,"Mekong basin means all the land drained by the Mekong River and its tributaries."],[26.59,30.05,"More than sixty million people live in the Mekong basin."],[30.75,33.87,"Your turn. Say: Mekong basin."],[36.57,37.7,"Mekong basin."],[38.72,39.79,"flood pulse."],[40.49,46.77,"flood pulse means the yearly rise and fall of river water that drives the whole ecosystem."],[47.07,52.14,"The flood pulse makes the Tonle Sap swell to several times its dry-season size."],[52.84,55.86,"Your turn. Say: flood pulse."],[58.56,59.92,"flood pulse."],[60.92,62.16,"fish migration."],[62.86,68.59,"fish migration means the seasonal movement of fish between feeding and spawning areas."],[68.89,71.82,"Dams can block fish migration along the river."],[72.52,75.62,"Your turn. Say: fish migration."],[78.32,79.53,"fish migration."],[80.52,82.06,"sediment transport."],[82.76,87.78,"sediment transport means the movement of sand, silt and nutrients by a river."],[88.08,90.71,"Sediment transport keeps the delta fertile."],[91.41,94.87,"Your turn. Say: sediment transport."],[97.57,99.05,"sediment transport."],[100.05,101.48,"delta subsidence."],[102.18,106.18,"delta subsidence means the gradual sinking of a river delta."],[106.48,109.67,"Groundwater pumping accelerates delta subsidence."],[110.37,114.2,"Your turn. Say: delta subsidence."],[116.9,118.22,"delta subsidence."],[119.22,120.79,"saltwater intrusion."],[121.49,126.13,"saltwater intrusion means sea water moving inland into rivers and farmland."],[126.43,130.65,"Saltwater intrusion has ruined rice harvests in the delta."],[131.35,134.62,"Your turn. Say: saltwater intrusion."],[137.32,138.93,"saltwater intrusion."],[139.95,141.51,"floodplain forest."],[142.21,146.95,"floodplain forest means forest that is flooded for part of every year."],[147.25,150.04,"Fish shelter and feed in the floodplain forest."],[150.74,154.16,"Your turn. Say: floodplain forest."],[156.85,158.31,"floodplain forest."],[159.32,160.84,"Irrawaddy dolphin."],[161.54,165.95,"Irrawaddy dolphin means a rare river dolphin found in the Mekong near Kratie."],[166.25,169.88,"Only around a hundred Irrawaddy dolphins remain in the Mekong."],[170.58,173.73,"Your turn. Say: Irrawaddy dolphin."],[176.43,177.81,"Irrawaddy dolphin."],[178.82,181.0,"Now let's listen to a conversation."],[181.3,185.45,"Rithy, if you wrote an essay on the Mekong, how would you begin?"],[186.75,192.1,"First, I would establish why the river matters: food, farming and culture for millions."],[193.42,195.04,"Good. And then?"],[196.35,201.18,"Next, I'd explain the flood pulse, which reverses the Tonle Sap every year."],[202.48,203.58,"And the threats?"],[204.88,209.07,"Turning to the threats, dams trap sediment and block fish migration."],[210.35,211.64,"How would you conclude?"],[212.95,217.53,"In conclusion, I'd argue that the river must be managed as one shared system."],[218.82,223.49,"Grammar focus: Discourse organisation in essays (extended)."],[223.79,226.78,"Signposting guides the reader through an essay."],[227.09,232.82,"First, I would establish why the river matters. Turning to the threats, dams trap sediment."],[233.12,237.47,"In conclusion, the river must be managed as one shared system."],[237.77,244.37,"Signpost every stage of an essay: thesis, development, counter-argument and conclusion."],[245.38,248.69,"Now read and listen. A River That Breathes."],[248.99,252.77,"The Mekong is one of the most productive river systems on Earth."],[254.08,262.94,"Its ecology depends on the flood pulse: each monsoon, rising water reverses the flow of the Tonle Sap River and floods the great lake."],[264.25,268.95,"Floodplain forests then become nurseries where fish feed and breed."],[270.25,277.36,"Fish migration supports one of the largest inland fisheries in the world, a vital source of protein for Cambodians."],[278.65,284.38,"Sediment transport carries nutrients downstream, nourishing farmland and building the delta."],[285.68,293.03,"Turning to the threats, upstream dams trap sediment, while groundwater pumping contributes to delta subsidence."],[294.35,299.91,"As the delta sinks and sea levels rise, saltwater intrusion damages rice fields."],[301.22,308.29,"Even the Irrawaddy dolphin near Kratie is a reminder that the Mekong basin must be managed as a single living system."],[309.58,312.38,"Quiz time! Choose the correct answer."],[312.68,316.19,"The yearly rise and fall of river water is the blank."],[316.5,322.19,"A, flood pulse. B, delta subsidence. C, sediment transport."],[326.18,328.74,"The answer is A: flood pulse."],[330.25,333.11,"Which phrase signals a new section of an essay?"],[333.41,337.61,"A, Turning to .... B, For example .... C, As a result ...."],[341.62,344.17,"The answer is A: Turning to ...."],[345.68,349.08,"Which phrase best introduces a final synthesis?"],[349.38,353.63,"A, In conclusion. B, Firstly. C, By contrast."],[357.62,360.31,"The answer is A: In conclusion."],[361.82,365.11,"Sea water moving inland into farmland is blank."],[365.4,371.19,"A, saltwater intrusion. B, fish migration. C, flood pulse."],[375.18,378.43,"The answer is A: saltwater intrusion."],[379.92,383.89,"According to the text, where is the Irrawaddy dolphin found?"],[384.19,390.01,"A, near Kratie. B, in the Tonle Sap lake. C, in the South China Sea."],[394.02,396.25,"The answer is A: near Kratie."],[397.75,403.91,"Now it's your turn. Part one: How should Mekong countries balance hydropower and the health of the river?"],[409.21,416.38,"Part two: Organise your answer with clear signposts: introduction, two points, conclusion."],[422.68,436.36,"First, hydropower brings electricity and income. Turning to the costs, dams block fish migration and trap sediment. In conclusion, countries should share data and plan dams together, protecting the river for everyone."],[436.66,439.17,"That is a well-argued answer!"],[440.18,446.92,"Great work today! You learned eight new words and discourse organisation in essays (extended)."],[447.22,452.29,"Today's value is caring for nature. Care for plants, birds and our planet."],[452.59,455.85,"See you in Unit thirty-eight. Goodbye!"],[456.15,458.61,"Thank you, Ms. Sarah! Bye, everyone!"]],"OC-Proficiency-Unit38-The-Self-in-Philosophy":[[0.35,5.15,"Hello, everyone! I'm Ms. Sarah. Welcome to Online Proficiency."],[5.45,8.58,"Hi! I'm Rithy. Let's learn together!"],[8.88,16.74,"Unit thirty-eight: The Self in Philosophy. In this unit, you will paraphrase and summarise competing ideas of the self."],[17.75,18.73,"selfhood."],[19.43,25.44,"selfhood means the quality of being an individual person with a unique identity."],[25.74,28.55,"Adolescence is a time when selfhood takes shape."],[29.25,32.0,"Your turn. Say: selfhood."],[34.7,35.7,"selfhood."],[36.72,38.14,"existentialism."],[38.84,45.54,"existentialism means a philosophy stressing freedom, choice and responsibility for creating meaning."],[45.84,49.2,"Existentialism says we are defined by our choices."],[49.9,53.34,"Your turn. Say: existentialism."],[56.04,57.4,"existentialism."],[58.38,59.4,"bad faith."],[60.1,65.46,"bad faith means Sartre's term for denying our own freedom by pretending we have no choice."],[65.76,68.28,"Saying 'I had no choice' can be bad faith."],[68.98,71.86,"Your turn. Say: bad faith."],[74.56,75.65,"bad faith."],[76.65,77.99,"self-knowledge."],[78.69,83.58,"self-knowledge means understanding of one's own character, feelings and motives."],[83.88,87.77,"'Know thyself': self-knowledge is the beginning of wisdom."],[88.47,91.63,"Your turn. Say: self-knowledge."],[94.33,96.0,"self-knowledge."],[96.98,98.29,"narrative self."],[98.99,105.27,"narrative self means the idea that we build our identity by telling stories about our lives."],[105.57,109.15,"Your narrative self links your childhood to your future plans."],[109.85,112.62,"Your turn. Say: narrative self."],[115.32,116.64,"narrative self."],[117.65,119.14,"embodied cognition."],[119.84,125.5,"embodied cognition means the theory that thinking depends on the body, not just the brain."],[125.8,129.19,"Embodied cognition explains why walking can help us think."],[129.89,133.82,"Your turn. Say: embodied cognition."],[136.52,137.94,"embodied cognition."],[138.95,140.59,"mindfulness tradition."],[141.29,147.33,"mindfulness tradition means Buddhist practices of calm, non-judgemental awareness of the present."],[147.63,152.35,"The mindfulness tradition has spread from Asian monasteries to Western hospitals."],[153.05,156.28,"Your turn. Say: mindfulness tradition."],[158.98,160.48,"mindfulness tradition."],[161.48,162.76,"impermanence."],[163.46,168.49,"impermanence means the Buddhist teaching that everything changes and nothing lasts forever."],[168.79,171.86,"Impermanence reminds us not to cling to possessions."],[172.56,175.67,"Your turn. Say: impermanence."],[178.37,179.59,"impermanence."],[180.58,182.76,"Now let's listen to a conversation."],[183.06,187.44,"Ms. Sarah, Sartre and the Buddha both talk about the self. Do they agree?"],[188.75,195.46,"Let me put it simply: Sartre says you create your self; the Buddha says there is no fixed self at all."],[196.75,199.97,"So, in other words, for Sartre we are totally free?"],[201.28,206.14,"Free and responsible. Denying that freedom is what he calls bad faith."],[207.45,210.8,"And Buddhism? I learned about impermanence at the pagoda."],[212.08,216.87,"In essence, everything changes, including the 'me' we cling to."],[218.18,223.22,"To sum up, then: Sartre stresses choice; Buddhism stresses letting go."],[224.52,229.59,"A neat summary, though both, in their way, demand honest self-knowledge."],[230.88,235.01,"Grammar focus: Paraphrase and summary (extended)."],[235.31,238.51,"Paraphrase and summary show deep understanding."],[238.81,245.38,"Let me put it simply: Sartre says you create your self. In essence, Buddhism says everything changes."],[245.68,250.2,"To sum up, then: one stresses choice, the other letting go."],[250.5,257.48,"A good paraphrase changes words and structure but keeps the meaning; a summary keeps only the main ideas."],[258.48,260.97,"Now read and listen. Who Am I?."],[261.27,264.82,"The question 'Who am I?' is among the oldest in philosophy."],[266.12,274.41,"Socrates urged self-knowledge, while existentialism, in the twentieth century, placed freedom at the heart of selfhood."],[275.72,282.62,"Jean-Paul Sartre argued that we are 'condemned to be free', and that pretending otherwise is bad faith."],[283.92,291.09,"Buddhist thought, by contrast, teaches impermanence: no fixed, unchanging self can be found."],[292.38,298.07,"The mindfulness tradition trains attention to observe thoughts and feelings as they arise and pass."],[299.38,305.52,"Modern psychology adds the idea of a narrative self, an identity we construct through the stories we tell."],[306.82,313.43,"Research on embodied cognition suggests that the self is shaped by the body as well as the mind."],[314.72,319.58,"In essence, the self may be less a fixed object than an ongoing process."],[320.88,323.58,"Quiz time! Choose the correct answer."],[323.88,328.15,"Denying our own freedom by pretending we have no choice is blank."],[328.45,333.39,"A, bad faith. B, selfhood. C, impermanence."],[337.38,339.78,"The answer is A: bad faith."],[341.28,343.74,"Which phrase introduces a paraphrase?"],[344.04,348.64,"A, In other words. B, Moreover. C, Despite this."],[352.65,355.3,"The answer is A: In other words."],[356.78,358.56,"A summary should keep blank."],[358.86,364.28,"A, only the main ideas. B, every detail. C, only examples."],[368.28,371.2,"The answer is A: only the main ideas."],[372.72,376.1,"The Buddhist teaching that nothing lasts forever is blank."],[376.4,382.64,"A, impermanence. B, existentialism. C, embodied cognition."],[386.65,388.82,"The answer is A: impermanence."],[390.32,395.36,"According to the text, what does research on embodied cognition suggest?"],[395.66,401.59,"A, the body shapes the self. B, the self is fixed. C, the mind is separate from the body."],[405.58,408.63,"The answer is A: the body shapes the self."],[410.12,416.18,"Now it's your turn. Part one: Is your 'self' something you discover or something you create?"],[421.48,426.36,"Part two: Paraphrase one philosopher's view, then summarise your own position."],[432.66,445.6,"Let me put Sartre's view simply: we create ourselves through choices. Buddhism, in essence, says the self keeps changing. To sum up, I think we discover our values and then create our self by acting on them."],[445.9,448.48,"That is a well-argued answer!"],[449.48,454.84,"Great work today! You learned eight new words and paraphrase and summary (extended)."],[455.14,459.44,"Today's value is self-acceptance. Big or little, you are special."],[459.74,463.79,"See you in Unit thirty-nine. Goodbye!"],[464.09,466.53,"Thank you, Ms. Sarah! Bye, everyone!"]],"OC-Proficiency-Unit39-Global-Economy-and-Development":[[0.35,4.98,"Hello, everyone! I'm Ms. Sarah. Welcome to Online Proficiency."],[5.28,8.32,"Hi! I'm Rithy. Let's learn together!"],[8.62,18.4,"Unit thirty-nine: Global Economy and Development. In this unit, you will critically evaluate development strategies."],[19.38,21.82,"development economics."],[22.52,27.95,"development economics means the study of how poorer countries can grow and reduce poverty."],[28.25,32.73,"Development economics asks why some nations grow faster than others."],[33.43,36.99,"Your turn. Say: development economics."],[39.69,41.38,"development economics."],[42.38,43.94,"structural adjustment."],[44.64,52.12,"structural adjustment means conditions requiring loan-receiving countries to cut spending and open markets."],[52.42,57.51,"Structural adjustment programmes were widely criticised in the 1990s."],[58.21,61.71,"Your turn. Say: structural adjustment."],[64.41,65.81,"structural adjustment."],[66.82,68.61,"Washington Consensus."],[69.31,77.95,"Washington Consensus means a 1989 set of free-market policy recommendations for developing countries."],[78.25,82.92,"The Washington Consensus promoted privatisation and trade liberalisation."],[83.62,87.27,"Your turn. Say: Washington Consensus."],[89.97,91.62,"Washington Consensus."],[92.62,94.05,"middle-income trap."],[94.75,99.12,"middle-income trap means when a country's growth stalls before it becomes rich."],[99.41,104.29,"Avoiding the middle-income trap requires better skills and innovation."],[104.99,108.26,"Your turn. Say: middle-income trap."],[110.96,112.28,"middle-income trap."],[113.28,115.04,"industrial policy."],[115.74,121.02,"industrial policy means government strategy to support particular industries."],[121.32,126.19,"South Korea's industrial policy built world-class shipyards."],[126.89,130.48,"Your turn. Say: industrial policy."],[133.18,134.92,"industrial policy."],[135.92,137.73,"foreign direct investment."],[138.43,144.33,"foreign direct investment means money invested by foreign firms in factories and businesses."],[144.63,148.66,"Foreign direct investment has expanded Cambodia's garment sector."],[149.36,152.82,"Your turn. Say: foreign direct investment."],[155.52,157.27,"foreign direct investment."],[158.28,159.75,"aid dependency."],[160.45,165.19,"aid dependency means reliance on foreign aid to fund basic government services."],[165.49,170.05,"Critics argue that aid dependency weakens local accountability."],[170.75,174.1,"Your turn. Say: aid dependency."],[176.8,178.15,"aid dependency."],[179.15,181.06,"South-South cooperation."],[181.76,186.51,"South-South cooperation means partnership between developing countries."],[186.81,191.07,"South-South cooperation lets countries share solutions that suit them."],[191.77,195.72,"Your turn. Say: South-South cooperation."],[198.42,200.38,"South-South cooperation."],[201.38,203.93,"Now let's listen to a conversation."],[204.23,208.2,"Ms. Sarah, why did the Washington Consensus fall out of favour?"],[209.52,215.09,"Its record is, at best, mixed. Structural adjustment cut health budgets in many poor countries."],[216.38,218.96,"But didn't free markets help Asia grow?"],[220.25,227.58,"Arguably, East Asia succeeded by ignoring much of that advice. Its industrial policy was highly active."],[228.88,231.71,"So is foreign direct investment good or bad?"],[233.02,239.86,"It is a double-edged sword: jobs, yes, but sometimes low wages and little technology transfer."],[241.15,244.23,"And what about Cambodia avoiding the middle-income trap?"],[245.52,249.71,"The evidence strongly suggests that skills and innovation matter most."],[251.02,254.88,"Grammar focus: Critical evaluation language (extended)."],[255.19,258.17,"Critical evaluation weighs evidence carefully."],[258.47,265.41,"The record of structural adjustment is, at best, mixed. Foreign investment is a double-edged sword."],[265.71,269.72,"The evidence strongly suggests that skills and innovation matter most."],[270.02,276.73,"Evaluate, don't just describe: weigh strengths and weaknesses, then state how strong the evidence is."],[277.72,280.77,"Now read and listen. Paths to Prosperity."],[281.07,287.0,"Development economics seeks to explain why some countries escape poverty while others remain trapped."],[288.28,298.65,"In 1989, economist John Williamson summarised a set of free-market policies that became known as the Washington Consensus."],[299.95,305.62,"Many indebted countries were required to adopt structural adjustment programmes in return for loans."],[306.92,313.94,"The results were, at best, mixed: some economies stabilised, but public services often suffered."],[315.25,321.58,"Meanwhile, East Asian economies combined export growth with an active industrial policy."],[322.88,333.15,"Today, foreign direct investment remains important, but critics warn that aid dependency and low-wage manufacturing cannot guarantee long-term growth."],[334.45,342.44,"To avoid the middle-income trap, the evidence suggests, countries must invest in education, infrastructure and innovation."],[343.75,351.53,"South-South cooperation increasingly allows developing nations to learn from one another rather than only from the West."],[352.82,355.39,"Quiz time! Choose the correct answer."],[355.69,361.2,"A 1989 set of free-market policy recommendations is the blank."],[361.5,367.97,"A, Washington Consensus. B, industrial policy. C, South-South cooperation."],[371.98,375.03,"The answer is A: Washington Consensus."],[376.52,379.61,"'The results were, at best, mixed' expresses blank."],[379.91,385.7,"A, a guarded, critical judgement. B, strong praise. C, no opinion."],[389.68,393.34,"The answer is A: a guarded, critical judgement."],[394.85,397.52,"'A double-edged sword' means something has blank."],[397.82,404.06,"A, both advantages and disadvantages. B, only risks. C, only benefits."],[408.05,411.52,"The answer is A: both advantages and disadvantages."],[413.02,417.22,"When growth stalls before a country becomes rich, it is in the blank."],[417.52,423.17,"A, middle-income trap. B, aid dependency. C, structural adjustment."],[427.18,430.5,"The answer is A: middle-income trap."],[431.98,437.8,"According to the text, what did East Asian economies combine with export growth?"],[438.1,445.37,"A, an active industrial policy. B, structural adjustment. C, aid dependency."],[449.38,453.72,"The answer is A: an active industrial policy."],[455.22,462.02,"Now it's your turn. Part one: What is the best strategy for Cambodia to become a high-income country?"],[467.32,474.04,"Part two: Evaluate two strategies critically, using guarded and evidence-based language."],[480.34,495.13,"Relying only on garment factories is, at best, a short-term solution. Foreign investment is a double-edged sword. The evidence strongly suggests that investing in education and technology offers the most sustainable path."],[495.43,497.26,"That is a well-argued answer!"],[498.25,504.62,"Great work today! You learned eight new words and critical evaluation language (extended)."],[504.92,508.86,"Today's value is hard work. Work hard and never give up."],[509.16,511.52,"See you in Unit forty. Goodbye!"],[511.82,514.83,"Thank you, Ms. Sarah! Bye, everyone!"]],"OC-Proficiency-Unit40-Migration-and-Belonging-Advanced":[[0.35,5.77,"Hello, everyone! I'm Ms. Sarah. Welcome to Online Proficiency."],[6.07,9.31,"Hi! I'm Rithy. Let's learn together!"],[9.62,19.57,"Unit forty: Migration and Belonging (Advanced). In this unit, you will adapt your style to different audiences when discussing migration."],[20.58,21.96,"transnationalism."],[22.66,28.01,"transnationalism means living with strong connections across two or more countries."],[28.31,33.32,"Video calls and remittances make transnationalism part of daily life."],[34.02,37.34,"Your turn. Say: transnationalism."],[40.04,41.44,"transnationalism."],[42.45,44.05,"circular mobility."],[44.76,50.06,"circular mobility means repeatedly moving between home and abroad for work."],[50.36,55.21,"Seasonal farm work creates circular mobility between Cambodia and Thailand."],[55.91,59.5,"Your turn. Say: circular mobility."],[62.2,63.71,"circular mobility."],[64.72,66.36,"citizenship regime."],[67.06,72.27,"citizenship regime means the laws and rules deciding who can become a citizen."],[72.57,77.18,"Each country's citizenship regime reflects its idea of the nation."],[77.88,81.51,"Your turn. Say: citizenship regime."],[84.21,85.87,"citizenship regime."],[86.88,88.27,"stateless person."],[88.97,94.24,"stateless person means someone who is not recognised as a citizen by any country."],[94.54,98.11,"A stateless person may be unable to attend school or travel."],[98.81,102.37,"Your turn. Say: stateless person."],[105.07,106.35,"stateless person."],[107.35,108.87,"naturalisation."],[109.57,114.89,"naturalisation means the legal process by which a foreigner becomes a citizen."],[115.19,118.55,"After ten years, she applied for naturalisation."],[119.25,122.18,"Your turn. Say: naturalisation."],[124.88,126.15,"naturalisation."],[127.15,128.51,"host society."],[129.21,133.9,"host society means the country or community that receives migrants."],[134.2,138.18,"Migrants contribute to the host society in many ways."],[138.88,142.1,"Your turn. Say: host society."],[144.8,146.24,"host society."],[147.25,148.76,"remittance economy."],[149.46,155.06,"remittance economy means an economy that relies heavily on money sent home by migrants."],[155.36,158.47,"Many villages depend on the remittance economy."],[159.18,162.91,"Your turn. Say: remittance economy."],[165.61,167.13,"remittance economy."],[168.12,169.52,"return migration."],[170.22,174.53,"return migration means migrants coming back to live in their home country."],[174.83,178.08,"Return migration brings new skills and ideas home."],[178.78,181.95,"Your turn. Say: return migration."],[184.65,185.99,"return migration."],[186.98,189.26,"Now let's listen to a conversation."],[189.56,193.91,"Rithy, imagine telling a minister about migrant workers. How would you sound?"],[195.22,201.48,"I'd say: 'Circular mobility constitutes a significant component of the national economy.'"],[202.78,204.83,"And to your cousin who works in Korea?"],[206.12,210.21,"'Hey, the money you send home really keeps the family going!'"],[211.52,215.56,"Same idea, very different style. What about a newspaper reader?"],[216.85,221.08,"'Remittances from workers abroad support millions of rural households.'"],[222.38,225.23,"Excellent. And would you mention statelessness?"],[226.52,230.94,"To the minister, certainly: no person should be left without a citizenship."],[232.25,236.91,"Grammar focus: Style shifting and audience (extended)."],[237.21,240.32,"Skilled speakers shift style for each audience."],[240.62,250.22,"To a minister: circular mobility constitutes a significant component of the economy. To a cousin: the money you send really keeps the family going."],[250.52,254.65,"To the public: remittances support millions of rural households."],[254.95,264.09,"C2 speakers choose vocabulary, grammar and tone to fit the listener: formal for officials, warm for family, clear for the public."],[265.08,268.36,"Now read and listen. Living Between Two Worlds."],[268.66,273.75,"Migration today is rarely a single journey from one country to another."],[275.05,281.93,"Many migrants practise transnationalism, maintaining homes, families and friendships across borders."],[283.22,290.88,"Circular mobility is common in Southeast Asia, where workers move back and forth for seasonal or contract jobs."],[292.18,299.41,"Cambodia's remittance economy supports many rural households, paying for school fees, health care and new houses."],[300.72,307.46,"Belonging, however, depends partly on each country's citizenship regime and the rules of naturalisation."],[308.75,316.97,"A stateless person, recognised by no country, may struggle to access education, healthcare or legal protection."],[318.28,324.58,"A welcoming host society benefits from migrants' skills, while return migration brings new ideas home."],[325.88,333.05,"To discuss these realities well, we must adapt our language to ministers, journalists and families alike."],[334.35,336.94,"Quiz time! Choose the correct answer."],[337.24,342.45,"The legal process of becoming a citizen of a new country is blank."],[342.75,348.49,"A, naturalisation. B, return migration. C, transnationalism."],[352.48,355.1,"The answer is A: naturalisation."],[356.58,358.65,"Which sentence is most formal?"],[358.95,368.19,"A, Remittances constitute a significant share of household income.. B, The money helps a lot.. C, Cash from abroad is awesome.."],[372.18,377.33,"The answer is A: Remittances constitute a significant share of household income.."],[378.82,382.24,"Which style suits a message to a close relative?"],[382.54,389.22,"A, informal and warm. B, official and technical. C, academic and impersonal."],[393.22,396.18,"The answer is A: informal and warm."],[397.68,401.98,"Someone not recognised as a citizen by any country is a blank."],[402.28,408.36,"A, stateless person. B, host society. C, citizenship regime."],[412.35,414.86,"The answer is A: stateless person."],[416.35,419.75,"According to the text, what do remittances pay for?"],[420.05,427.92,"A, school fees, health care and new houses. B, only luxury goods. C, government salaries."],[431.92,436.42,"The answer is A: school fees, health care and new houses."],[437.92,443.98,"Now it's your turn. Part one: How does migration change Cambodian families and villages?"],[449.28,454.99,"Part two: Answer twice: first formally for a report, then informally for a friend."],[461.28,475.48,"Formally: remittances constitute a vital source of income and have improved rural living standards. Informally: honestly, without the money from relatives abroad, lots of families in my village would really struggle."],[475.78,478.01,"That is a well-argued answer!"],[479.02,484.58,"Great work today! You learned eight new words and style shifting and audience (extended)."],[484.88,489.15,"Today's value is togetherness. Spend happy time with your family."],[489.45,492.1,"See you in Unit forty-one. Goodbye!"],[492.4,494.86,"Thank you, Ms. Sarah! Bye, everyone!"]],"OC-Proficiency-Unit41-Food-Culture-and-Identity":[[0.35,5.49,"Hello, everyone! I'm Ms. Sarah. Welcome to Online Proficiency."],[5.79,8.98,"Hi! I'm Rithy. Let's learn together!"],[9.28,18.07,"Unit forty-one: Food, Culture and Identity. In this unit, you will discuss food as a mirror of culture and identity."],[19.08,20.49,"culinary heritage."],[21.19,27.16,"culinary heritage means the traditional dishes and cooking knowledge passed down in a culture."],[27.46,32.03,"Amok and samlor kako are part of Cambodia's culinary heritage."],[32.73,36.31,"Your turn. Say: culinary heritage."],[39.01,40.38,"culinary heritage."],[41.38,42.59,"gastronomy."],[43.29,46.9,"gastronomy means the art and study of good food and cooking."],[47.2,50.67,"Siem Reap is becoming a centre of Khmer gastronomy."],[51.37,54.49,"Your turn. Say: gastronomy."],[57.19,58.2,"gastronomy."],[59.18,60.46,"food culture."],[61.16,66.72,"food culture means the beliefs, habits and customs connected with food in a society."],[67.02,71.87,"Sharing dishes from the centre of the table is part of Khmer food culture."],[72.57,75.64,"Your turn. Say: food culture."],[78.34,79.4,"food culture."],[80.42,81.31,"terroir."],[82.01,87.45,"terroir means the way local soil, climate and tradition give food a unique taste."],[87.75,90.45,"Kampot pepper owes its flavour to its terroir."],[91.15,93.37,"Your turn. Say: terroir."],[96.07,96.88,"terroir."],[97.88,98.99,"comfort food."],[99.69,105.22,"comfort food means simple food that makes people feel safe, warm and at home."],[105.52,108.45,"Rice porridge is my comfort food when I am ill."],[109.15,111.83,"Your turn. Say: comfort food."],[114.53,115.62,"comfort food."],[116.62,117.64,"foodways."],[118.34,123.89,"foodways means the cultural practices around producing, cooking and eating food."],[124.19,128.25,"Studying foodways reveals how families and festivals work."],[128.95,132.15,"Your turn. Say: foodways."],[134.85,135.75,"foodways."],[136.75,138.3,"culinary diplomacy."],[139.0,144.03,"culinary diplomacy means using food to build understanding between nations."],[144.33,148.64,"Thailand's culinary diplomacy helped spread Thai restaurants worldwide."],[149.34,152.92,"Your turn. Say: culinary diplomacy."],[155.62,157.3,"culinary diplomacy."],[158.32,159.55,"fusion cuisine."],[160.25,164.41,"fusion cuisine means cooking that combines traditions from different cultures."],[164.71,167.74,"A prahok pizza would be daring fusion cuisine."],[168.44,171.9,"Your turn. Say: fusion cuisine."],[174.59,175.91,"fusion cuisine."],[176.92,179.09,"Now let's listen to a conversation."],[179.39,184.59,"Ms. Sarah, why is Cambodian food less famous than Thai or Vietnamese food?"],[185.88,190.05,"Not until recently did Cambodia invest in culinary diplomacy."],[191.35,193.78,"But our culinary heritage is ancient!"],[195.08,200.16,"Indeed. Rarely does a cuisine have such deep roots, from Angkor to the Mekong."],[201.45,204.37,"And Kampot pepper has its own protected terroir."],[205.68,211.09,"What makes Khmer food special is its balance: sour, salty, sweet and bitter."],[212.38,215.18,"Should young chefs experiment with fusion cuisine?"],[216.48,221.58,"It is creativity rooted in tradition that we need, not novelty for its own sake."],[222.88,228.26,"Grammar focus: Advanced inversion and emphasis (extended)."],[228.56,231.77,"Inversion and clefts add emphasis."],[232.07,238.9,"Not until recently did Cambodia invest in culinary diplomacy. Rarely does a cuisine have such deep roots."],[239.2,242.38,"What makes Khmer food special is its balance."],[242.68,250.59,"Inversion and cleft sentences highlight new or important information; use them for emphasis, not in every sentence."],[251.58,254.33,"Now read and listen. You Are What You Eat."],[254.63,259.43,"Food is never only fuel; it is a language through which cultures speak."],[260.72,267.71,"Cambodia's culinary heritage reflects centuries of exchange with India, China and its neighbours."],[269.02,274.71,"Its food culture values balance, freshness and sharing, with many dishes served together."],[276.02,283.03,"Products such as Kampot pepper, protected by a geographical indication, show the importance of terroir."],[284.32,290.58,"Historians study foodways to understand family life, religious festivals and economic change."],[291.88,296.54,"For migrants, comfort food becomes a powerful link to home and identity."],[297.85,304.09,"Rarely has food travelled as quickly as today, and fusion cuisine is now found in every capital."],[305.38,311.49,"Some governments even practise culinary diplomacy, promoting national dishes to win friends abroad."],[312.78,315.4,"Quiz time! Choose the correct answer."],[315.7,320.13,"The way local soil and climate give food a unique taste is blank."],[320.43,325.42,"A, terroir. B, gastronomy. C, foodways."],[329.42,331.68,"The answer is A: terroir."],[333.18,335.97,"Rarely blank a cuisine have such deep roots."],[336.27,339.04,"A, does. B, do. C, is."],[343.05,345.24,"The answer is A: does."],[346.75,350.98,"'What makes Khmer food special is its balance' is a blank."],[351.28,356.98,"A, wh-cleft sentence. B, passive sentence. C, conditional."],[360.98,364.71,"The answer is A: wh-cleft sentence."],[366.22,369.71,"Using food to build understanding between nations is blank."],[370.01,376.13,"A, culinary diplomacy. B, fusion cuisine. C, comfort food."],[380.12,383.02,"The answer is A: culinary diplomacy."],[384.52,387.94,"According to the text, what protects Kampot pepper?"],[388.24,395.1,"A, a geographical indication. B, a royal decree. C, a trade embargo."],[399.12,402.57,"The answer is A: a geographical indication."],[404.08,409.65,"Now it's your turn. Part one: How can Cambodia make its cuisine better known in the world?"],[414.95,419.32,"Part two: Use one negative inversion and one cleft sentence."],[425.62,436.85,"Not until we train more chefs will Khmer food become famous. What we need is a national strategy: festivals abroad, cooking schools and protected products like Kampot pepper."],[437.15,439.46,"That is a well-argued answer!"],[440.45,447.41,"Great work today! You learned eight new words and advanced inversion and emphasis (extended)."],[447.71,452.35,"Today's value is respect for culture. Be proud of our Khmer culture."],[452.65,455.47,"See you in Unit forty-two. Goodbye!"],[455.77,458.29,"Thank you, Ms. Sarah! Bye, everyone!"]],"OC-Proficiency-Unit42-The-Ethics-of-Journalism":[[0.35,5.13,"Hello, everyone! I'm Ms. Sarah. Welcome to Online Proficiency."],[5.43,8.77,"Hi! I'm Rithy. Let's learn together!"],[9.07,19.0,"Unit forty-two: The Ethics of Journalism. In this unit, you will evaluate ethical dilemmas in journalism with careful stance."],[20.02,21.67,"journalistic ethics."],[22.37,26.88,"journalistic ethics means the moral principles that guide reporters and editors."],[27.18,31.68,"Journalistic ethics require reporters to verify before publishing."],[32.38,35.88,"Your turn. Say: journalistic ethics."],[38.58,40.13,"journalistic ethics."],[41.12,42.31,"public interest."],[43.02,48.59,"public interest means what benefits society as a whole, rather than mere curiosity."],[48.89,52.33,"Exposing corruption is clearly in the public interest."],[53.03,56.42,"Your turn. Say: public interest."],[59.12,60.41,"public interest."],[61.42,62.94,"privacy intrusion."],[63.64,68.83,"privacy intrusion means unjustified entry into someone's private life."],[69.13,73.33,"Photographing grieving families can be a serious privacy intrusion."],[74.03,78.08,"Your turn. Say: privacy intrusion."],[80.78,82.45,"privacy intrusion."],[83.45,84.77,"source protection."],[85.47,91.0,"source protection means keeping the identity of confidential informants secret."],[91.31,94.63,"Without source protection, whistleblowers would stay silent."],[95.33,98.56,"Your turn. Say: source protection."],[101.26,102.51,"source protection."],[103.52,105.09,"balance and fairness."],[105.79,110.94,"balance and fairness means presenting different sides of a story accurately."],[111.24,115.63,"Balance and fairness do not mean treating lies and facts equally."],[116.34,120.3,"Your turn. Say: balance and fairness."],[123.0,124.56,"balance and fairness."],[125.55,127.19,"sensational coverage."],[127.89,133.2,"sensational coverage means reporting that exaggerates to shock or excite audiences."],[133.5,137.0,"Sensational coverage of crime increases public fear."],[137.69,141.21,"Your turn. Say: sensational coverage."],[143.91,145.57,"sensational coverage."],[146.58,148.12,"embedded journalism."],[148.82,154.01,"embedded journalism means reporters travelling with military units during a conflict."],[154.31,158.09,"Embedded journalism gives access but may limit independence."],[158.79,162.01,"Your turn. Say: embedded journalism."],[164.71,166.13,"embedded journalism."],[167.12,168.68,"press accountability."],[169.38,176.23,"press accountability means the responsibility of media to correct errors and answer for their reporting."],[176.53,180.63,"Press accountability includes publishing corrections promptly."],[181.33,185.18,"Your turn. Say: press accountability."],[187.88,189.32,"press accountability."],[190.32,192.58,"Now let's listen to a conversation."],[192.88,197.44,"Rithy, should a newspaper publish a politician's private messages?"],[198.75,201.55,"It would seem that it depends on the public interest."],[202.85,203.66,"Go on."],[204.95,209.91,"If the messages reveal corruption, publication is arguably justified."],[211.22,213.95,"And if they only reveal his love life?"],[215.25,218.96,"Then it is, to my mind, a clear privacy intrusion."],[220.25,222.99,"Some editors claim that any scandal sells."],[224.28,230.26,"Admittedly it does, but that tends to suggest profit, not ethics, is driving the decision."],[231.55,235.01,"Grammar focus: Hedging and stance (extended)."],[235.31,237.76,"Hedging and stance show how certain you are."],[238.06,243.1,"It would seem that it depends on the public interest. Publication is arguably justified."],[243.4,248.26,"Revealing a love life is, to my mind, a clear privacy intrusion."],[248.56,256.01,"Mix hedging and firm stance deliberately: hedge where evidence is uncertain, commit where your principle is clear."],[257.02,260.78,"Now read and listen. Truth, Harm and the Headline."],[261.08,266.28,"Journalism is sometimes called the first draft of history, and its ethics matter accordingly."],[267.58,273.79,"Journalistic ethics typically ask reporters to seek truth, minimise harm and act independently."],[275.08,280.74,"The public interest can justify revealing secrets, but mere curiosity arguably cannot."],[282.05,287.68,"Privacy intrusion is particularly troubling when victims of tragedy are involved."],[288.98,294.15,"Source protection, meanwhile, allows whistleblowers to expose wrongdoing safely."],[295.45,301.65,"Balance and fairness are essential, although giving equal time to falsehoods would seem to mislead audiences."],[302.95,307.84,"Sensational coverage attracts clicks but tends to distort public understanding."],[309.15,316.6,"Press accountability, through corrections and independent councils, helps preserve trust in a free media."],[317.88,320.56,"Quiz time! Choose the correct answer."],[320.86,324.35,"What benefits society as a whole is the blank."],[324.64,330.64,"A, public interest. B, privacy intrusion. C, sensational coverage."],[334.65,337.37,"The answer is A: public interest."],[338.88,341.32,"Which phrase is a tentative hedge?"],[341.62,347.13,"A, It would seem that. B, It is certain that. C, Obviously."],[351.15,353.61,"The answer is A: It would seem that."],[355.12,358.33,"Which phrase expresses explicit personal stance?"],[358.63,363.24,"A, to my mind. B, it is said that. C, apparently."],[367.25,369.4,"The answer is A: to my mind."],[370.92,374.24,"Keeping informants' identities secret is blank."],[374.54,380.7,"A, source protection. B, embedded journalism. C, press accountability."],[384.72,387.67,"The answer is A: source protection."],[389.18,393.01,"According to the text, what does sensational coverage tend to do?"],[393.31,400.22,"A, distort public understanding. B, increase accuracy. C, protect sources."],[404.22,407.71,"The answer is A: distort public understanding."],[409.22,416.11,"Now it's your turn. Part one: When, if ever, is it right for journalists to publish private information?"],[421.41,425.93,"Part two: Hedge where you are unsure and take a firm stance where you are certain."],[432.23,443.39,"It would seem that the key test is the public interest. Revealing corruption is arguably justified. Publishing someone's private family life, however, is to my mind simply wrong."],[443.69,446.19,"That is a well-argued answer!"],[447.18,452.17,"Great work today! You learned eight new words and hedging and stance (extended)."],[452.47,456.44,"Today's value is honesty. Always tell the truth."],[456.75,460.31,"See you in Unit forty-three. Goodbye!"],[460.62,463.19,"Thank you, Ms. Sarah! Bye, everyone!"]],"OC-Proficiency-Unit43-Cities-and-Climate-Adaptation":[[0.35,5.14,"Hello, everyone! I'm Ms. Sarah. Welcome to Online Proficiency."],[5.44,8.62,"Hi! I'm Rithy. Let's learn together!"],[8.92,18.36,"Unit forty-three: Cities and Climate Adaptation. In this unit, you will write and speak densely about urban climate adaptation."],[19.35,20.97,"climate adaptation."],[21.67,26.8,"climate adaptation means adjusting cities and lives to cope with climate change."],[27.1,31.16,"Climate adaptation is as urgent as cutting emissions."],[31.86,35.96,"Your turn. Say: climate adaptation."],[38.66,40.11,"climate adaptation."],[41.12,42.33,"sponge city."],[43.03,47.76,"sponge city means a city designed to absorb and store rainwater like a sponge."],[48.05,52.69,"China's sponge city programme uses parks and wetlands to soak up floods."],[53.39,56.18,"Your turn. Say: sponge city."],[58.88,60.12,"sponge city."],[61.12,62.43,"heat resilience."],[63.13,67.69,"heat resilience means a city's ability to protect people from extreme heat."],[67.98,71.49,"Shade trees improve the heat resilience of poor neighbourhoods."],[72.19,75.36,"Your turn. Say: heat resilience."],[78.06,79.35,"heat resilience."],[80.35,81.86,"coastal defence."],[82.56,87.6,"coastal defence means structures and natural barriers protecting the coast from the sea."],[87.9,91.02,"Mangroves are a cheap and living coastal defence."],[91.72,95.57,"Your turn. Say: coastal defence."],[98.27,99.69,"coastal defence."],[100.68,101.95,"managed retreat."],[102.65,107.83,"managed retreat means planned relocation of people away from high-risk areas."],[108.13,111.9,"Some islands are considering managed retreat as seas rise."],[112.6,115.77,"Your turn. Say: managed retreat."],[118.47,119.76,"managed retreat."],[120.75,122.39,"flood-resilient design."],[123.09,128.21,"flood-resilient design means buildings and infrastructure designed to survive flooding."],[128.51,132.09,"Traditional Khmer stilt houses are flood-resilient design."],[132.79,135.94,"Your turn. Say: flood-resilient design."],[138.64,140.28,"flood-resilient design."],[141.28,142.48,"urban greening."],[143.18,147.19,"urban greening means adding trees, parks and gardens to cities."],[147.49,150.52,"Urban greening cools streets and cleans the air."],[151.22,154.31,"Your turn. Say: urban greening."],[157.0,158.22,"urban greening."],[159.22,160.89,"adaptive capacity."],[161.59,166.6,"adaptive capacity means the ability of a community to adjust to change."],[166.9,170.38,"Wealthier districts usually have greater adaptive capacity."],[171.08,175.64,"Your turn. Say: adaptive capacity."],[178.34,179.97,"adaptive capacity."],[180.98,183.16,"Now let's listen to a conversation."],[183.46,187.89,"Ms. Sarah, Phnom Penh floods every rainy season. What can be done?"],[189.18,195.16,"The rapid filling of lakes for development has reduced the city's capacity to absorb water."],[196.45,198.76,"So the solution is more drainage?"],[200.05,204.88,"Partly. But the adoption of sponge city principles would be more sustainable."],[206.18,207.23,"What about the heat?"],[208.52,213.87,"The expansion of urban greening is the most cost-effective means of heat resilience."],[215.18,218.39,"And for very high-risk areas?"],[219.68,224.05,"There, the consideration of managed retreat may become unavoidable."],[225.35,230.29,"Grammar focus: Nominal style and lexical density (extended)."],[230.59,234.12,"Nominal style packs information into noun phrases."],[234.42,238.83,"The rapid filling of lakes has reduced the city's capacity to absorb water."],[239.13,242.65,"The adoption of sponge city principles would be more sustainable."],[242.95,250.17,"Nominal style suits reports and policy papers; in conversation, turn nouns back into verbs to sound natural."],[251.15,255.85,"Now read and listen. Designing Cities for a Hotter, Wetter World."],[256.15,261.76,"The intensification of storms and heatwaves presents cities with unprecedented challenges."],[263.05,269.94,"Climate adaptation, alongside emission reduction, has therefore become a central priority of urban policy."],[271.25,277.49,"The sponge city concept involves the creation of wetlands, permeable pavements and green roofs."],[278.78,283.93,"Urban greening contributes to heat resilience through shade and evaporative cooling."],[285.22,290.05,"Coastal defence increasingly combines sea walls with the restoration of mangroves."],[291.35,298.09,"Flood-resilient design, including traditional raised houses, reduces damage during floods."],[299.38,305.12,"In the most vulnerable locations, managed retreat may represent the only realistic option."],[306.42,313.36,"Ultimately, the adaptive capacity of a city depends on the fairness of its planning as much as on engineering."],[314.65,317.38,"Quiz time! Choose the correct answer."],[317.68,320.69,"A city designed to absorb rainwater is a blank."],[320.99,326.69,"A, sponge city. B, managed retreat. C, coastal defence."],[330.68,333.38,"The answer is A: sponge city."],[334.88,338.98,"Which is the nominalised form of 'the city adopted new principles'?"],[339.28,346.28,"A, the city's adoption of new principles. B, the city adopting. C, adopt principles."],[350.28,354.02,"The answer is A: the city's adoption of new principles."],[355.52,358.17,"Nominal style is most typical of blank."],[358.47,364.19,"A, reports and policy papers. B, casual chat. C, text messages."],[368.18,371.82,"The answer is A: reports and policy papers."],[373.32,377.45,"Planned relocation away from high-risk areas is blank."],[377.75,384.2,"A, managed retreat. B, urban greening. C, heat resilience."],[388.22,391.07,"The answer is A: managed retreat."],[392.58,396.57,"According to the text, what does adaptive capacity depend on?"],[396.87,403.73,"A, fairness of planning as well as engineering. B, only engineering. C, only money."],[407.72,413.64,"The answer is A: fairness of planning as well as engineering."],[415.15,420.46,"Now it's your turn. Part one: What should Phnom Penh do to adapt to climate change?"],[425.76,431.74,"Part two: Use at least three nominalisations, as if presenting to city planners."],[438.04,450.97,"My first recommendation is the protection of the remaining lakes. Second, the expansion of urban greening would improve heat resilience. Finally, the introduction of flood-resilient design should be required for new buildings."],[451.27,454.12,"That is a well-argued answer!"],[455.12,461.65,"Great work today! You learned eight new words and nominal style and lexical density (extended)."],[461.95,465.73,"Today's value is being prepared. Get ready before you go."],[466.02,469.05,"See you in Unit forty-four. Goodbye!"],[469.35,472.77,"Thank you, Ms. Sarah! Bye, everyone!"]],"OC-Proficiency-Unit44-Genius-and-Creativity":[[0.35,5.32,"Hello, everyone! I'm Ms. Sarah. Welcome to Online Proficiency."],[5.62,8.76,"Hi! I'm Rithy. Let's learn together!"],[9.06,18.64,"Unit forty-four: Genius and Creativity. In this unit, you will discuss the nature of genius using cohesive, well-referenced speech."],[19.65,20.51,"genius."],[21.21,26.64,"genius means exceptional intellectual or creative power, or a person who has it."],[26.94,30.5,"Mozart is often called a musical genius."],[31.2,33.67,"Your turn. Say: genius."],[36.37,37.17,"genius."],[38.18,39.23,"prodigy."],[39.93,43.09,"prodigy means a young person with extraordinary talent."],[43.39,46.47,"The chess prodigy beat adults at the age of eight."],[47.17,50.07,"Your turn. Say: prodigy."],[52.77,53.57,"prodigy."],[54.58,56.04,"creative breakthrough."],[56.74,61.84,"creative breakthrough means a sudden important advance in creative or scientific work."],[62.14,65.15,"Her creative breakthrough came after years of failure."],[65.85,69.06,"Your turn. Say: creative breakthrough."],[71.76,73.15,"creative breakthrough."],[74.15,75.88,"eureka moment."],[76.58,81.66,"eureka moment means a sudden moment of discovery or insight."],[81.96,84.81,"Archimedes had his eureka moment in the bath."],[85.51,89.27,"Your turn. Say: eureka moment."],[91.97,93.82,"eureka moment."],[94.82,96.12,"divergent mind."],[96.82,101.34,"divergent mind means a way of thinking that produces many different ideas."],[101.64,104.78,"A divergent mind sees ten uses for a paperclip."],[105.48,108.33,"Your turn. Say: divergent mind."],[111.03,112.34,"divergent mind."],[113.35,114.62,"creative tension."],[115.32,119.79,"creative tension means productive conflict that pushes people to new ideas."],[120.09,123.99,"The creative tension between the two designers produced brilliant work."],[124.69,128.01,"Your turn. Say: creative tension."],[130.71,131.97,"creative tension."],[132.95,133.84,"muse."],[134.53,138.06,"muse means a person or force that inspires an artist."],[138.35,140.91,"The Mekong was the poet's lifelong muse."],[141.61,145.16,"Your turn. Say: muse."],[147.86,148.75,"muse."],[149.75,151.15,"inspiration myth."],[151.85,157.56,"inspiration myth means the false belief that great work comes from sudden inspiration rather than effort."],[157.86,162.6,"The inspiration myth hides the hard work behind every masterpiece."],[163.3,166.49,"Your turn. Say: inspiration myth."],[169.19,170.49,"inspiration myth."],[171.48,173.75,"Now let's listen to a conversation."],[174.05,177.23,"Ms. Sarah, are geniuses born or made?"],[178.55,181.56,"Both, though the latter is too often forgotten."],[182.85,184.97,"What about prodigies like Mozart?"],[186.25,193.08,"He was talented, certainly. Yet he also practised for thousands of hours as a child; this is rarely mentioned."],[194.38,197.9,"And eureka moments? Archimedes had one."],[199.18,204.65,"He did, but only after years of thinking about the problem. Such moments reward preparation."],[205.95,208.15,"So the inspiration myth is misleading?"],[209.45,216.31,"Precisely. That is why I tell students: talent opens the door; effort walks through it."],[217.62,221.17,"Grammar focus: Cohesion and reference (extended)."],[221.47,223.4,"Reference words create cohesion."],[223.7,228.29,"Geniuses are both born and made, though the latter is too often forgotten."],[228.59,232.58,"Such moments reward preparation. That is why effort matters."],[232.88,239.45,"Use 'the former/the latter', 'this', 'such' and substitution to connect ideas without repeating nouns."],[240.45,244.16,"Now read and listen. The Myth of the Lonely Genius."],[244.46,249.63,"Popular culture loves the image of the lonely genius struck by sudden inspiration."],[250.92,254.76,"This picture, however, is largely an inspiration myth."],[256.05,263.38,"Research suggests that even a prodigy needs years of deliberate practice before producing original work."],[264.68,272.38,"The famous eureka moment usually follows long periods of preparation; such insights rarely come from nowhere."],[273.68,280.66,"Many creative breakthroughs also emerge from creative tension within teams rather than from isolated individuals."],[281.95,288.29,"Psychologists link creativity to a divergent mind, the ability to generate many possible ideas."],[289.58,295.27,"An artist's muse may provide inspiration, but the latter is useless without discipline."],[296.58,302.3,"Genius, then, may be best understood as rare talent multiplied by extraordinary effort."],[303.58,306.31,"Quiz time! Choose the correct answer."],[306.61,309.74,"A young person with extraordinary talent is a blank."],[310.04,315.58,"A, prodigy. B, muse. C, eureka moment."],[319.58,321.69,"The answer is A: prodigy."],[323.18,327.69,"In 'tea or coffee? I prefer the latter', the speaker prefers blank."],[327.99,331.84,"A, coffee. B, tea. C, neither."],[335.85,337.84,"The answer is A: coffee."],[339.35,342.92,"'Such moments reward preparation.' What does 'such' do?"],[343.22,351.74,"A, refers back to moments already mentioned. B, introduces a new idea. C, shows contrast."],[355.75,359.87,"The answer is A: refers back to moments already mentioned."],[361.38,366.44,"The false belief that great work comes only from sudden inspiration is the blank."],[366.74,372.72,"A, inspiration myth. B, creative tension. C, divergent mind."],[376.72,379.1,"The answer is A: inspiration myth."],[380.58,384.78,"According to the text, where do many creative breakthroughs emerge from?"],[385.08,391.76,"A, creative tension within teams. B, isolated individuals only. C, luck."],[395.75,399.29,"The answer is A: creative tension within teams."],[400.78,407.58,"Now it's your turn. Part one: Is genius mainly a gift or the result of hard work?"],[412.88,417.91,"Part two: Use 'the former/the latter' and one summarising 'this' or 'such'."],[424.21,436.18,"Talent and effort both matter, but the latter is more important. Mozart practised for thousands of hours, and this is often forgotten. Such stories show that genius is built, not just given."],[436.48,439.25,"That is a well-argued answer!"],[440.25,445.32,"Great work today! You learned eight new words and cohesion and reference (extended)."],[445.62,449.82,"Today's value is creativity. Use your imagination when you play."],[450.12,453.54,"See you in Unit forty-five. Goodbye!"],[453.84,456.17,"Thank you, Ms. Sarah! Bye, everyone!"]],"OC-Proficiency-Unit45-Law-Morality-and-Conscience":[[0.35,5.52,"Hello, everyone! I'm Ms. Sarah. Welcome to Online Proficiency."],[5.82,8.91,"Hi! I'm Rithy. Let's learn together!"],[9.21,19.18,"Unit forty-five: Law, Morality and Conscience. In this unit, you will debate the relationship between law and morality."],[20.18,21.39,"natural law."],[22.09,28.3,"natural law means the theory that some moral rules are universal and above human-made law."],[28.6,32.84,"Natural law says some acts are wrong whatever the statute book says."],[33.54,36.98,"Your turn. Say: natural law."],[39.68,40.87,"natural law."],[41.85,43.36,"legal positivism."],[44.06,51.54,"legal positivism means the theory that law is simply the rules made by legitimate authorities, whether moral or not."],[51.84,56.92,"Legal positivism separates what the law is from what it ought to be."],[57.62,61.36,"Your turn. Say: legal positivism."],[64.06,65.81,"legal positivism."],[66.82,68.26,"moral conscience."],[68.96,73.49,"moral conscience means a person's inner sense of right and wrong."],[73.79,77.14,"Her moral conscience would not let her sign the false report."],[77.84,81.28,"Your turn. Say: moral conscience."],[83.98,85.33,"moral conscience."],[86.32,87.46,"unjust law."],[88.16,92.97,"unjust law means a law that violates basic fairness or human rights."],[93.27,98.08,"Martin Luther King wrote that an unjust law is no law at all."],[98.78,102.06,"Your turn. Say: unjust law."],[104.75,106.07,"unjust law."],[107.08,109.27,"rule of law ideal."],[109.97,117.24,"rule of law ideal means the principle that everyone, including rulers, is equally subject to the law."],[117.54,121.47,"The rule of law ideal means no one is above the law."],[122.17,125.19,"Your turn. Say: rule of law ideal."],[127.89,130.31,"rule of law ideal."],[131.32,132.56,"legal ethics."],[133.26,137.19,"legal ethics means the moral duties of lawyers and judges."],[137.49,140.79,"Legal ethics forbid a lawyer from lying to the court."],[141.49,144.69,"Your turn. Say: legal ethics."],[147.39,148.67,"legal ethics."],[149.65,151.24,"conscientious judgement."],[151.94,156.4,"conscientious judgement means a careful decision guided by moral principle."],[156.7,161.19,"Judges must apply conscientious judgement, not personal preference."],[161.89,165.9,"Your turn. Say: conscientious judgement."],[168.6,170.11,"conscientious judgement."],[171.12,172.55,"jurisprudence."],[173.25,176.56,"jurisprudence means the theory and philosophy of law."],[176.86,182.07,"In jurisprudence, the debate between natural law and positivism continues."],[182.77,185.94,"Your turn. Say: jurisprudence."],[188.64,189.89,"jurisprudence."],[190.88,193.15,"Now let's listen to a conversation."],[193.45,196.75,"Ms. Sarah, must we obey every law?"],[198.05,202.72,"Well, the law and morality are not always on the best of terms."],[204.02,206.03,"That sounds like an understatement."],[207.32,212.31,"It is, slightly. History offers a few unjust laws, shall we say."],[213.62,216.75,"Like apartheid or the segregation laws in America?"],[218.05,223.61,"Exactly. Legal, yes. Moral? Not entirely, one might gently suggest."],[224.92,227.52,"So natural law beats legal positivism?"],[228.82,235.24,"A positivist would raise an eyebrow at that. They'd say: identify the law first, judge it second."],[236.55,241.75,"Grammar focus: Irony, understatement and tone (extended)."],[242.05,244.72,"Understatement can carry strong criticism."],[245.01,252.97,"The law and morality are not always on the best of terms. History offers a few unjust laws, shall we say."],[253.27,256.68,"Moral? Not entirely, one might gently suggest."],[256.98,263.68,"Ironic understatement lets you make a strong criticism sound calm; your tone of voice must signal the irony."],[264.68,268.32,"Now read and listen. When Law and Conscience Collide."],[268.62,272.27,"What is the relationship between law and morality?"],[273.58,276.5,"This question lies at the heart of jurisprudence."],[277.82,287.41,"Supporters of natural law argue that genuine law must respect universal moral principles; an unjust law therefore lacks true authority."],[288.72,299.68,"Legal positivism, associated with thinkers such as H. L. A. Hart, replies that law and morality are conceptually separate."],[300.98,307.91,"Both camps, however, accept the rule of law ideal: rulers, too, must obey the law."],[309.22,315.31,"History records, to put it mildly, several occasions when following the law meant committing injustice."],[316.62,322.13,"In such moments, individuals must rely on moral conscience and conscientious judgement."],[323.45,330.7,"Legal ethics, meanwhile, remind lawyers and judges that their duty is to justice, not merely to procedure."],[331.98,334.62,"Quiz time! Choose the correct answer."],[334.92,339.73,"The theory that some moral rules are above human-made law is blank."],[340.03,346.1,"A, natural law. B, legal positivism. C, jurisprudence."],[350.12,352.27,"The answer is A: natural law."],[353.78,358.31,"'The meeting was not exactly a success' most likely means it was blank."],[358.61,363.64,"A, a failure. B, a great success. C, on time."],[367.65,370.04,"The answer is A: a failure."],[371.55,375.64,"'History offers a few unjust laws, shall we say' uses blank."],[375.94,381.64,"A, ironic understatement. B, exaggeration. C, a question."],[385.65,389.03,"The answer is A: ironic understatement."],[390.52,392.97,"The philosophy of law is blank."],[393.27,399.14,"A, jurisprudence. B, legal ethics. C, moral conscience."],[403.15,405.94,"The answer is A: jurisprudence."],[407.45,412.41,"According to the text, which thinker is associated with legal positivism?"],[412.71,419.59,"A, H. L. A. Hart. B, Martin Luther King. C, Socrates."],[423.58,427.38,"The answer is A: H. L. A. Hart."],[428.88,433.33,"Now it's your turn. Part one: Is it ever right to break the law?"],[438.63,445.01,"Part two: Use one ironic understatement and refer to natural law or legal positivism."],[451.31,466.03,"Segregation laws were, shall we say, not entirely fair. Natural law theorists would say an unjust law is no law at all. So yes, peaceful civil disobedience can be justified, but only as a last resort."],[466.33,468.15,"That is a well-argued answer!"],[469.15,475.3,"Great work today! You learned eight new words and irony, understatement and tone (extended)."],[475.6,479.64,"Today's value is fair play. Play fairly and follow the rules."],[479.94,483.56,"See you in Unit forty-six. Goodbye!"],[483.86,486.85,"Thank you, Ms. Sarah! Bye, everyone!"]],"OC-Proficiency-Unit46-Language-Change":[[0.35,5.69,"Hello, everyone! I'm Ms. Sarah. Welcome to Online Proficiency."],[5.99,9.16,"Hi! I'm Rithy. Let's learn together!"],[9.46,18.21,"Unit forty-six: Language Change. In this unit, you will describe how and why languages change using complex noun phrases."],[19.22,20.5,"language change."],[21.2,25.27,"language change means the gradual development of a language over time."],[25.57,29.71,"Language change is natural; no living language stands still."],[30.41,33.88,"Your turn. Say: language change."],[36.58,37.89,"language change."],[38.88,40.01,"neologism."],[40.71,45.56,"neologism means a newly invented word or expression."],[45.86,49.62,"'Selfie' was a neologism in 2013."],[50.32,53.76,"Your turn. Say: neologism."],[56.46,57.53,"neologism."],[58.52,59.89,"linguistic drift."],[60.59,65.73,"linguistic drift means slow, gradual change in a language's sounds and structure."],[66.03,71.05,"Linguistic drift explains why Old English is unreadable today."],[71.75,75.25,"Your turn. Say: linguistic drift."],[77.95,79.33,"linguistic drift."],[80.32,81.26,"borrowing."],[81.96,84.89,"borrowing means taking words from another language."],[85.19,87.67,"Khmer 'kafe' is a borrowing from French."],[88.38,91.39,"Your turn. Say: borrowing."],[94.09,95.01,"borrowing."],[96.02,97.44,"grammaticalisation."],[98.14,103.28,"grammaticalisation means the process by which ordinary words become grammar words."],[103.58,106.88,"'Going to' for the future is an example of grammaticalisation."],[107.58,110.8,"Your turn. Say: grammaticalisation."],[113.5,114.88,"grammaticalisation."],[115.88,117.27,"semantic change."],[117.97,121.22,"semantic change means a change in what a word means."],[121.52,125.24,"'Nice' once meant 'foolish': a dramatic semantic change."],[125.94,129.82,"Your turn. Say: semantic change."],[132.52,134.03,"semantic change."],[135.05,136.42,"slang evolution."],[137.12,143.42,"slang evolution means the fast change of informal words among groups such as teenagers."],[143.72,148.02,"Slang evolution makes yesterday's 'cool' word sound old-fashioned."],[148.72,152.03,"Your turn. Say: slang evolution."],[154.73,156.09,"slang evolution."],[157.08,158.75,"language contact."],[159.45,164.8,"language contact means the meeting of languages through trade, migration or conquest."],[165.1,169.54,"Language contact with Sanskrit and Pali enriched Khmer vocabulary."],[170.24,173.13,"Your turn. Say: language contact."],[175.84,177.21,"language contact."],[178.22,180.52,"Now let's listen to a conversation."],[180.82,183.53,"Rithy, did you know 'nice' once meant 'foolish'?"],[184.82,188.4,"Really? That's a remarkable example of semantic change."],[189.68,192.79,"And Khmer has its own long history of borrowing."],[194.08,199.98,"Yes, the many Sanskrit and Pali words in formal Khmer came through Indian religion and court culture."],[201.28,204.34,"Plus French: 'kafe', 'ompoul'..."],[205.65,210.47,"And now the flood of English neologisms used by teenagers on social media!"],[211.78,213.85,"Some people see that as decline."],[215.15,220.93,"But the constant, unstoppable evolution of every living language is completely natural."],[222.25,226.86,"Grammar focus: Complex noun phrases (advanced)."],[227.16,230.31,"Complex noun phrases make descriptions precise."],[230.61,237.71,"That's a remarkable example of semantic change. The many Sanskrit and Pali words in formal Khmer came through religion."],[238.01,241.74,"The constant evolution of every living language is natural."],[242.04,250.48,"Build long noun phrases in order: determiner, opinion, other adjectives, noun, then prepositional phrase or clause."],[251.48,255.73,"Now read and listen. Why Languages Never Stand Still."],[256.03,259.38,"Every living language is in a constant state of change."],[260.68,268.26,"Over centuries, linguistic drift alters pronunciation and grammar so gradually that speakers rarely notice."],[269.55,275.94,"Semantic change transforms meanings: 'nice' once meant 'foolish', and 'silly' once meant 'blessed'."],[277.25,283.35,"Grammaticalisation turns ordinary words into grammatical tools, as with the English future 'going to'."],[284.65,290.47,"Language contact, through trade, religion and conquest, leads to extensive borrowing."],[291.78,299.7,"Khmer, for instance, absorbed thousands of words from Sanskrit, Pali, Thai, French and, increasingly, English."],[301.02,309.81,"Meanwhile, neologisms and rapid slang evolution, accelerated by social media, constantly refresh everyday speech."],[311.12,316.09,"Language change is therefore not corruption but a sign that a language is alive."],[317.38,319.99,"Quiz time! Choose the correct answer."],[320.29,322.59,"A newly invented word is a blank."],[322.89,327.62,"A, neologism. B, borrowing. C, grammaticalisation."],[331.62,334.73,"The answer is A: neologism."],[336.22,338.74,"Which is the most complex noun phrase?"],[339.04,345.41,"A, the fascinating history of Khmer loanwords. B, history. C, the history."],[349.42,353.87,"The answer is A: the fascinating history of Khmer loanwords."],[355.35,359.45,"In 'the many French words in modern Khmer', the head noun is blank."],[359.75,363.13,"A, words. B, French. C, Khmer."],[367.12,369.04,"The answer is A: words."],[370.55,373.05,"A change in what a word means is blank."],[373.35,379.43,"A, semantic change. B, linguistic drift. C, language contact."],[383.42,386.19,"The answer is A: semantic change."],[387.68,390.97,"According to the text, what did 'silly' once mean?"],[391.27,395.8,"A, blessed. B, foolish. C, small."],[399.78,401.78,"The answer is A: blessed."],[403.28,408.55,"Now it's your turn. Part one: Is English slang damaging the Khmer language?"],[413.85,419.1,"Part two: Use at least two complex noun phrases and one term from the unit."],[425.4,438.67,"The rapid spread of English slang among Cambodian teenagers is real. However, the long history of borrowing from Sanskrit, Pali and French shows that Khmer adapts. Language change is a sign of life, not decline."],[438.96,441.67,"That is a well-argued answer!"],[442.68,447.89,"Great work today! You learned eight new words and complex noun phrases (advanced)."],[448.19,452.71,"Today's value is respect for culture. Be proud of our Khmer culture."],[453.01,456.33,"See you in Unit forty-seve
