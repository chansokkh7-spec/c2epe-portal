<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C2-EPE Online Class · Upper-Intermediate</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Confetti Library for Celebrations -->

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Comic+Neue:wght@700&family=Poppins:wght@400;600;700&display=swap');
        body { font-family: 'Poppins', sans-serif; }
        .fun-font { font-family: 'Comic Neue', cursive; }
        button:disabled { opacity: .6; cursor: default; }
        /* phones: the lesson fills the screen, so jumping to it always shows it from the top */
        @media (max-width: 767px) { #content-area { min-height: calc(100vh - 24px); padding-bottom: 76px; } }

</head>
<body class="bg-amber-50 min-h-screen flex flex-col items-center p-4">

    <!-- Header Section -->

        <div>
            <h1 class="text-2xl md:text-3xl fun-font tracking-wider">🌟 C2-EPE Digital Academy</h1>
            <p class="text-sm text-blue-100">💻 Online Class · Upper-Intermediate · 35 units · 19 learning modules</p>

        <div class="flex items-center gap-3 flex-wrap justify-end">

            </div>
            <div class="bg-pink-500 text-white px-3 py-2 rounded-xl text-sm font-bold shadow flex items-center gap-1">

            <div class="bg-blue-500 px-3 py-2 rounded-xl text-sm font-bold border border-blue-400">

    <!-- Main Container -->

            <div id="level-picker-wrap">
                <h2 class="font-bold text-gray-700 border-b pb-2">Kindergarten Levels</h2>
                <div class="flex flex-col gap-3 mt-3">

                    <button onclick="selectLevel('K2')" id="btn-K2" class="level-btn text-left p-3 rounded-xl bg-gray-100 hover:bg-amber-100 font-semibold transition cursor-pointer">🎨 K2 (Level 2)</button>
                    <button onclick="selectLevel('K3')" id="btn-K3" class="level-btn text-left p-3 rounded-xl bg-gray-100 hover:bg-amber-100 font-semibold transition cursor-pointer">🏆 K3 (Level 3)</button>

            </div>
            <div id="locked-level-banner" class="hidden bg-blue-50 border border-blue-200 rounded-xl p-3 text-center">

                <p id="locked-level-text" class="text-xl font-bold text-blue-800"></p>
            </div>


            <hr class="my-2">
            <h2 class="font-bold text-gray-700" id="unit-select-label">Select Unit (1 to 16)</h2>

            </select>

            <hr class="my-2">
            <h2 class="font-bold text-gray-700">Learning Modules</h2>
            <button onclick="switchTab('video')" data-tab="video" id="video-tab-btn" class="tab-btn text-left p-2 rounded-lg hover:bg-gray-100 font-medium text-sm cursor-pointer">📹 0. Video Lesson</button>
            <button onclick="switchTab('listening')" data-tab="listening" class="tab-btn text-left p-2 rounded-lg hover:bg-gray-100 font-medium text-sm cursor-pointer">🔊 1. Listening</button>
            <button onclick="switchTab('speaking')" data-tab="speaking" class="tab-btn text-left p-2 rounded-lg hover:bg-gray-100 font-medium text-sm cursor-pointer">🗣️ 2. Speaking</button>

                 shown/hidden per level by selectLevel() rather than being a
                 fixed tab like the others. -->
            <button onclick="switchTab('phonics')" id="phonics-tab-btn" data-tab="phonics" class="tab-btn text-left p-2 rounded-lg hover:bg-gray-100 font-medium text-sm cursor-pointer" style="display:none;">🔤 9. ABC Phonics</button>
            <button onclick="switchTab('spelling')" data-tab="spelling" class="tab-btn text-left p-2 rounded-lg hover:bg-gray-100 font-medium text-sm cursor-pointer">🔤 10. Spelling Tiles</button>
            <button onclick="switchTab('sentence')" data-tab="sentence" class="tab-btn text-left p-2 rounded-lg hover:bg-gray-100 font-medium text-sm cursor-pointer">💬 11. Sentence Building</button>
            <button onclick="switchTab('chant')" data-tab="chant" class="tab-btn text-left p-2 rounded-lg hover:bg-gray-100 font-medium text-sm cursor-pointer">🎵 12. Song & Chant</button>
            <button onclick="switchTab('memory')" data-tab="memory" class="tab-btn text-left p-2 rounded-lg hover:bg-gray-100 font-medium text-sm cursor-pointer">🃏 13. Memory Match</button>
            <button onclick="switchTab('oddone')" data-tab="oddone" class="tab-btn text-left p-2 rounded-lg hover:bg-gray-100 font-medium text-sm cursor-pointer">🔍 14. Odd One Out</button>

            <button onclick="switchTab('review')" data-tab="review" class="tab-btn text-left p-2 rounded-lg hover:bg-gray-100 font-medium text-sm cursor-pointer">🔄 18. Review</button>
        </aside>

        <!-- Content Area -->
        <section id="content-area" class="bg-white rounded-2xl p-6 shadow-md md:col-span-3 flex flex-col justify-between" style="scroll-margin-top:12px;">
            
            <div id="module-content">

            </div>

            <!-- Footer Navigation -->

        </section>

    </main>

        // ===== Progress: stars/badges are earned once per activity and remembered =====
        // Saved in this browser when the page is opened as a normal web page. When it runs
        // inside the Hub's secure "Embed Code" box the browser blocks storage, so progress
        // then lasts until the page is closed (it still can't be farmed by repeated taps).
        const PROGRESS_KEY = () => 'c2epe_onlineclass_progress_' + state.level;
        let progress = { stars: 0, badges: 0, awarded: {}, bestQuiz: {} };
        function loadProgress() {
            try {
                const saved = JSON.parse(localStorage.getItem(PROGRESS_KEY()) || 'null');
                if (saved && typeof saved === 'object') progress = Object.assign({ stars: 0, badges: 0, awarded: {}, bestQuiz: {} }, saved);
            } catch (e) { /* storage not available (e.g. inside the Hub sandbox) */ }
            state.stars = progress.stars; state.badges = progress.badges;
            document.getElementById('star-count').innerText = state.stars;
            document.getElementById('badge-count').innerText = state.badges;
        }
        function saveProgress() {
            progress.stars = state.stars; progress.badges = state.badges;
            try { localStorage.setItem(PROGRESS_KEY(), JSON.stringify(progress)); } catch (e) {}
        }
        // Gives stars only the first time a given activity is done. Returns true if stars were given.
        function award(key, amount) {
            const k = state.level + '|' + key;
            if (progress.awarded[k]) return false;
            progress.awarded[k] = true;
            addStars(amount);
            return true;
        }
        const unitKey = (what) => 'u' + state.unit + '|' + what;

        function populateUnitSelect() {
            const sel = document.getElementById('unit-select');
            const levelData = realCurriculum[state.level];
            const prevUnit = state.unit;
            const unitCount = Object.keys(levelData).length;
            const labelEl = document.getElementById('unit-select-label');
            if (labelEl) labelEl.textContent = `Select Unit (1 to ${unitCount})`;
            // 🎬 marks units that have a video (🆕 = added in the last 7 days)
            sel.innerHTML = Object.keys(levelData).map(u => {
                const v = videoFor(state.level, u);
                const mark = v ? (isRecentlyAdded(v.added) ? ' 🆕' : ' 🎬') : '';
                return `<option value="${u}">Unit ${u}: ${levelData[u].title}${mark}</option>`;
            }).join('');
            if (typeof OC_TRIAL !== 'undefined' && OC_TRIAL) { [...sel.options].forEach(o => { if (Number(o.value) > 3) { o.disabled = true; o.textContent = '🔒 ' + o.textContent + ' (after the trial)'; } }); }
            // keep the same unit number selected if it still exists for this level
            if (levelData[prevUnit]) {
                sel.value = prevUnit;
                state.unit = prevUnit;
            } else {
                state.unit = parseInt(sel.value);
            }
        }

        // Phonics only fits early readers (K0/K1) — levels where it's not
        // shown are also guarded against being left "stuck" on the phonics
        // tab if the student switches level while it's open.
        const PHONICS_LEVELS = ['K0', 'K1'];

        function selectLevel(lvl) {
            state.level = lvl;
            document.querySelectorAll('.level-btn').forEach(b => {
                b.classList.remove('bg-blue-600', 'text-white', 'shadow');
                b.classList.add('bg-gray-100');
            });
            document.getElementById('btn-' + lvl).classList.remove('bg-gray-100');
            document.getElementById('btn-' + lvl).classList.add('bg-blue-600', 'text-white', 'shadow');
            document.getElementById('current-level-display').innerText = lvl;

            const phonicsBtn = document.getElementById('phonics-tab-btn');
            const phonicsAllowed = PHONICS_LEVELS.includes(lvl);
            phonicsBtn.style.display = phonicsAllowed ? '' : 'none';
            if (!phonicsAllowed && state.tab === 'phonics') { state.tab = 'listening'; highlightActiveTab(); }

            loadProgress();
            populateUnitSelect();
            renderContent();
        }

        function updateUnit() {
            state.unit = parseInt(document.getElementById('unit-select').value);
            renderContent();
            scrollToLesson();
        }

        // Moves to the next unit within the current level (wrapping back to
        // unit 1 after the last one), keeping the same module tab open so
        // a student can go straight through Unit 1 -> Unit 2 -> ... without
        // re-opening the dropdown each time.
        function nextLesson() {
            const levelData = realCurriculum[state.level];
            const unitNumbers = Object.keys(levelData).map(Number).sort((a, b) => a - b);
            const idx = unitNumbers.indexOf(state.unit);
            const nextIdx = (idx === -1 ? 0 : idx + 1) % ((typeof OC_TRIAL !== 'undefined' && OC_TRIAL) ? 3 : unitNumbers.length);
            state.unit = unitNumbers[nextIdx];
            document.getElementById('unit-select').value = state.unit;
            renderContent();
            scrollToLesson(true);
        }

        function highlightActiveTab() {
            document.querySelectorAll('.tab-btn').forEach(b => {
                b.classList.remove('bg-blue-50', 'text-blue-700');
                b.classList.add('hover:bg-gray-100');
            });

        const isPhone = () => window.matchMedia('(max-width: 767px)').matches;
        function scrollToLesson(always) {
            const area = document.getElementById('content-area');
            if (!area) return;
            if (!(isPhone() || (always && area.getBoundingClientRect().top < 0))) return;
            // Wait for the new lesson to be drawn, then glide to it. Some phones stop a smooth
            // scroll that starts during the tap itself, so if it hasn't arrived shortly after,

            setTimeout(() => {
                area.scrollIntoView({ behavior: 'smooth', block: 'start' });
                setTimeout(() => {
                    if (Math.abs(area.getBoundingClientRect().top) > 40) area.scrollIntoView({ block: 'start' });

        // ===== 4. WRITING (canvas tracing pad — now every word of the unit) =====

            traceDrawn = false;
            const canvas = document.getElementById('trace-canvas');
            const ctx = canvas.getContext('2d');
            ctx.lineWidth = 6;
            ctx.lineCap = 'round';
            ctx.strokeStyle = '#2563eb';
            let drawing = false;
            function pos(e) {
                const rect = canvas.getBoundingClientRect();
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;
                const cx = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
                const cy = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
                return { x: cx * scaleX, y: cy * scaleY };
            }
            function start(e) { drawing = true; traceDrawn = true; const p = pos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); e.preventDefault(); }
            function move(e) { if (!drawing) return; const p = pos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); e.preventDefault(); }
            function end() { drawing = false; }
            canvas.addEventListener('mousedown', start);
            canvas.addEventListener('mousemove', move);
            if (traceMouseUpHandler) window.removeEventListener('mouseup', traceMouseUpHandler);
            traceMouseUpHandler = end;
            window.addEventListener('mouseup', traceMouseUpHandler);
            canvas.addEventListener('touchstart', start, { passive: false });
            canvas.addEventListener('touchmove', move, { passive: false });
            canvas.addEventListener('touchend', end);

        const LETTER_PLAN = {"1": ["A"], "2": ["B"], "3": ["C"], "4": ["D"], "5": ["E"], "6": ["F"], "7": ["G"], "8": ["H"], "9": ["I"], "10": ["J"], "11": ["K"], "12": ["L"], "13": ["M"], "14": ["N"], "15": ["O"], "16": ["P"], "17": ["Q"], "18": ["R"], "19": ["S"], "20": ["T"], "21": ["U"], "22": ["V"], "23": ["W"], "24": ["X"], "25": ["Y"], "26": ["Z"], "27": ["A", "E", "I", "O", "U"], "28": ["B", "D", "P", "T"], "29": ["M", "N", "S", "Z"]};
        // Four picture words per letter (the first one is the "A is for ..." word).

        const PHONICS_WORDS = {

        // Mini game: "Which one starts with B?" — 4 rounds, answers lock after the first tap
        function startPhonicsGame() {
            const letters = lettersFor(state.unit);
            const others = ALPHABET.filter(L => !letters.includes(L));
            const rounds = [];
            for (let r = 0; r < 4; r++) {
                const L = letters[r % letters.length];
                const right = PHONICS_WORDS[L][r % 4];
                const fits = ([w]) => L === 'X' ? /x/i.test(w) : w[0].toUpperCase() === L;
                const pool = others.flatMap(o => PHONICS_WORDS[o]).filter(p => !fits(p) && p[1] !== right[1]);
                const wrong = shuffle(pool).slice(0, 2);

        const SUBTITLES = {"OC-Upper-Intermediate-Unit01-Making-Connections":[[0.35,4.51,"Hello, everyone! I'm Mr. Daniel. Welcome to Online Upper-Intermediate."],[4.81,7.74,"Hi! I'm Nita. Let's learn together!"],[8.04,14.45,"Unit one: Making Connections. In this unit, you will talk about meeting people and building relationships."],[15.45,16.38,"rapport."],[17.08,20.83,"rapport means a friendly relationship in which people understand each other."],[21.13,23.82,"She quickly built a good rapport with her new clients."],[24.52,26.7,"Your turn. Say: rapport."],[29.39,30.22,"rapport."],[31.22,32.31,"common ground."],[33.01,36.51,"common ground means interests or opinions that two people share."],[36.81,39.06,"We found common ground in our love of football."],[39.76,42.51,"Your turn. Say: common ground."],[45.21,46.31,"common ground."],[47.32,48.45,"break the ice."],[49.15,53.09,"break the ice means to say or do something to make people feel relaxed."],[53.4,55.7,"He told a funny story to break the ice."],[56.4,58.85,"Your turn. Say: break the ice."],[61.55,62.67,"break the ice."],[63.68,64.56,"follow up."],[65.26,68.58,"follow up means to contact someone again after a first meeting."],[68.88,71.36,"I'll follow up with an email after the conference."],[72.06,74.08,"Your turn. Say: follow up."],[76.78,77.68,"follow up."],[78.68,79.77,"mutual friend."],[80.47,83.7,"mutual friend means a person who is a friend of both of you."],[84.0,86.05,"We met through a mutual friend at a wedding."],[86.75,89.07,"Your turn. Say: mutual friend."],[91.77,93.04,"mutual friend."],[94.05,95.02,"icebreaker."],[95.72,99.46,"icebreaker means a game or activity that helps people get to know each other."],[99.76,101.81,"The trainer started with a fun icebreaker."],[102.52,105.03,"Your turn. Say: icebreaker."],[107.73,108.83,"icebreaker."],[109.85,110.57,"introvert."],[111.27,114.86,"introvert means a quiet person who prefers small groups and time alone."],[115.16,118.24,"As an introvert, networking events tire me out."],[118.94,121.21,"Your turn. Say: introvert."],[123.91,124.9,"introvert."],[125.92,126.91,"extrovert."],[127.61,131.66,"extrovert means an outgoing person who enjoys being with lots of people."],[131.96,135.37,"Dara is a real extrovert: he talks to everyone."],[136.06,138.23,"Your turn. Say: extrovert."],[140.93,142.08,"extrovert."],[143.08,145.16,"Now let's listen to a conversation."],[145.46,148.87,"How's the new job going, Nita? Have you been making connections?"],[150.18,154.76,"Yes! I've been meeting so many people, although I'm more of an introvert."],[156.05,158.83,"That's natural. How did you break the ice with your team?"],[160.12,164.01,"We found some common ground: half the office loves badminton!"],[165.32,169.12,"Excellent. And have you followed up with the manager you met last week?"],[170.42,175.93,"Not yet, but I'm writing to her tomorrow. We have a mutual friend, so it's easier."],[177.22,179.8,"Grammar focus: Present tenses review."],[180.1,181.94,"Let's review the present tenses."],[182.25,190.81,"Present simple for facts and routines, present continuous for now and temporary situations, and present perfect for actions connecting the past to now."],[191.1,195.45,"For example: I've been working here since March, and I've made three friends."],[195.75,200.65,"At B2, choose the tense to show your meaning: permanent, temporary, or connected to now."],[201.65,204.49,"Now read and listen. The Science of Small Talk."],[204.79,209.84,"Many people dislike small talk, but research suggests it is more valuable than we think."],[211.15,214.87,"Brief conversations with strangers have been shown to improve our mood."],[216.18,220.96,"Introverts often find these moments tiring, while extroverts tend to enjoy them."],[222.25,226.36,"The key is finding common ground quickly, whether it's the weather, sport or food."],[227.65,231.46,"A simple question can break the ice and build rapport surprisingly fast."],[232.75,235.2,"Quiz time! Choose the correct answer."],[235.5,239.09,"A friendly relationship where people understand each other is blank."],[239.4,243.47,"A, rapport. B, an icebreaker. C, a mutual friend."],[247.45,249.09,"The answer is A: rapport."],[250.58,253.23,"I blank here for three years, and I still love it."],[253.53,256.86,"A, work. B, have been working. C, am working."],[260.85,263.08,"The answer is B: have been working."],[264.58,266.75,"These days, more people blank from home."],[267.05,270.08,"A, work. B, are working. C, have worked."],[274.08,276.14,"The answer is B: are working."],[277.65,280.06,"To make people feel relaxed is to blank."],[280.36,284.45,"A, follow up. B, break the ice. C, find common ground."],[288.45,290.58,"The answer is B: break the ice."],[292.08,295.55,"According to the text, brief conversations with strangers can blank."],[295.85,299.78,"A, improve our mood. B, waste time. C, make us tired."],[303.78,305.57,"The answer is A: improve our mood."],[307.08,311.07,"Now it's your turn to speak. How do you usually break the ice when you meet someone new?"],[316.37,321.71,"I usually ask about something we have in common, like the event we're at, and I try to listen more than I talk."],[322.01,323.39,"Excellent answer, Nita!"],[324.38,328.34,"Great work today! You learned eight new words and present tenses review."],[328.64,331.39,"Today's value is kindness. Be kind to everyone."],[331.69,333.81,"See you in Unit two. Goodbye!"],[334.11,336.81,"Thank you, Mr. Daniel! Bye, everyone!"]],"OC-Upper-Intermediate-Unit02-Personality-and-Character":[[0.35,5.21,"Hello, everyone! I'm Mr. Daniel. Welcome to Online Upper-Intermediate."],[5.51,8.5,"Hi! I'm Nita. Let's learn together!"],[8.8,15.28,"Unit two: Personality and Character. In this unit, you will describe personality in detail."],[16.28,17.47,"self-confident."],[18.17,21.06,"self-confident means sure of your own abilities."],[21.36,23.71,"She's self-confident without being arrogant."],[24.41,27.28,"Your turn. Say: self-confident."],[29.98,31.16,"self-confident."],[32.15,33.2,"short-tempered."],[33.9,36.44,"short-tempered means getting angry very quickly."],[36.74,38.96,"My old boss was very short-tempered."],[39.66,41.97,"Your turn. Say: short-tempered."],[44.67,45.8,"short-tempered."],[46.78,47.69,"level-headed."],[48.39,52.86,"level-headed means calm and sensible, especially in difficult situations."],[53.16,55.57,"We need someone level-headed to lead the project."],[56.27,58.75,"Your turn. Say: level-headed."],[61.45,62.73,"level-headed."],[63.72,64.71,"narrow-minded."],[65.41,69.34,"narrow-minded means not willing to accept new ideas or other opinions."],[69.64,72.32,"It's narrow-minded to judge people by where they come from."],[73.02,75.62,"Your turn. Say: narrow-minded."],[78.32,79.5,"narrow-minded."],[80.48,81.34,"big-hearted."],[82.05,84.47,"big-hearted means very kind and generous."],[84.77,87.74,"Our big-hearted neighbour cooks for elderly people."],[88.44,91.04,"Your turn. Say: big-hearted."],[93.74,94.76,"big-hearted."],[95.75,96.65,"quick-witted."],[97.35,100.5,"quick-witted means able to think and answer quickly and cleverly."],[100.8,103.38,"The quick-witted student always had a funny reply."],[104.08,106.15,"Your turn. Say: quick-witted."],[108.85,109.8,"quick-witted."],[110.82,111.83,"thick-skinned."],[112.53,115.7,"thick-skinned means not easily upset by criticism."],[116.0,118.08,"Journalists need to be thick-skinned."],[118.78,121.02,"Your turn. Say: thick-skinned."],[123.72,124.75,"thick-skinned."],[125.75,126.76,"laid-back."],[127.46,130.23,"laid-back means relaxed and not worried about things."],[130.53,134.37,"My brother is so laid-back that nothing stresses him."],[135.07,137.85,"Your turn. Say: laid-back."],[140.55,141.53,"laid-back."],[142.52,144.54,"Now let's listen to a conversation."],[144.84,146.8,"How would you describe a good team leader?"],[148.12,151.61,"Someone level-headed and self-confident, but never short-tempered."],[152.92,156.23,"My manager :[[0.35,4.84,"Hello, everyone! I'm Mr. Daniel. Welcome to Online Upper-Intermediate."],[5.14,8.03,"Hi! I'm Nita. Let's learn together!"],[8.33,14.37,"Unit four: Food for Thought. In this unit, you will discuss food habits, health and waste."],[15.38,16.49,"processed food."],[17.19,22.47,"processed food means food changed by industrial methods, often with added salt or sugar."],[22.77,25.2,"Too much processed food is bad for your heart."],[25.9,28.98,"Your turn. Say: processed food."],[31.68,32.84,"processed food."],[33.85,34.6,"vegan."],[35.3,38.56,"vegan means a person who eats no animal products at all."],[38.86,40.99,"My cousin became a vegan last year."],[41.69,43.5,"Your turn. Say: vegan."],[46.2,47.07,"vegan."],[48.05,48.91,"food waste."],[49.61,52.61,"food waste means food that is thrown away instead of eaten."],[52.91,55.16,"Restaurants produce a lot of food waste."],[55.87,58.3,"Your turn. Say: food waste."],[61.0,62.09,"food waste."],[63.08,64.31,"portion control."],[65.0,67.77,"portion control means eating suitable amounts of food."],[68.07,70.78,"Portion control is easier with smaller plates."],[71.48,74.36,"Your turn. Say: portion control."],[77.06,78.28,"portion control."],[79.28,80.25,"superfood."],[80.95,84.75,"superfood means a food believed to be especially good for your health."],[85.05,87.19,"Some people call moringa a superfood."],[87.89,90.47,"Your turn. Say: superfood."],[93.17,94.24,"superfood."],[95.25,95.89,"craving."],[96.59,99.74,"craving means a very strong desire for a particular food."],[100.04,102.33,"I had a craving for chocolate all afternoon."],[103.03,105.31,"Your turn. Say: craving."],[108.01,108.87,"craving."],[109.88,110.81,"appetite."],[111.52,113.98,"appetite means the feeling of wanting to eat."],[114.28,116.62,"Exercise always gives me a big appetite."],[117.31,119.63,"Your turn. Say: appetite."],[122.33,123.3,"appetite."],[124.28,125.47,"locally sourced."],[126.17,129.32,"locally sourced means produced or grown near where  answer is B: a piece of."],[253.32,255.25,"blank students have joined the club."],[255.55,258.86,"A, A great deal of. B, A number of. C, Much."],[262.85,265.29,"The answer is B: A number of."],[266.78,269.08,"Food grown near where it is sold is blank."],[269.38,273.32,"A, processed. B, locally sourced. C, food waste."],[277.32,279.68,"The answer is B: locally sourced."],[281.18,284.05,"According to the text, how much food is never eaten?"],[284.35,287.97,"A, one tenth. B, one third. C, one half."],[291.98,294.05,"The answer is B: one third."],[295.55,299.51,"Now it's your turn to speak. What changes could people make to eat more healthily?"],[304.81,310.87,"People could eat less processed food, practise portion control and buy more locally sourced vegetables."],[311.17,312.83,"Excellent answer, Nita!"],[313.82,318.4,"Great work today! You learned eight new words and countable and uncountable nouns (advanced)."],[318.7,323.02,"Today's value is healthy eating. Eat fruit and vegetables to grow strong."],[323.32,325.58,"See you in Unit five. Goodbye!"],[325.88,328.73,"Thank you, Mr. Daniel! Bye, everyone!"]],"OC-Upper-Intermediate-Unit05-Mind-and-Body":[[0.35,5.07,"Hello, everyone! I'm Mr. Daniel. Welcome to Online Upper-Intermediate."],[5.37,8.29,"Hi! I'm Nita. Let's learn together!"],[8.59,14.24,"Unit five: Mind and Body. In this unit, you will talk about health habits and past advice."],[15.25,16.18,"sedentary."],[16.88,20.23,"sedentary means involving a lot of sitting and little exercise."],[20.53,23.46,"Office workers often have a sedentary lifestyle."],[24.16,26.48,"Your turn. Say: sedentary."],[29.18,30.23,"sedentary."],[31.22,32.31,"stress relief."],[33.01,36.25,"stress relief means something that reduces worry and pressure."],[36.55,38.51,"Swimming is my favourite stress relief."],[39.21,41.65,"Your turn. Say: stress relief."],[44.35,45.71,"stress relief."],[46.72,48.11,"sleep deprivation."],[48.81,51.6,"sleep deprivation means not getting enough sleep."],[51.9,54.06,"Sleep deprivation affects your memory."],[54.76,57.6,"Your turn. Say: sleep deprivation."],[60.3,61.77,"sleep deprivation."],[62.78,63.72,"therapist."],[64.42,68.24,"therapist means a person trained to help with mental or physical problems."],[68.54,71.01,"Talking to a therapist helped her through a hard year."],[71.71,73.85,"Your turn. Say: therapist."],[76.55,77.58,"therapist."],[78.58,79.47,"wellness."],[80.17,82.52,"wellness means being healthy in body and mind."],[82.82,85.87,"The company offers wellness classes on Fridays."],[86.57,88.93,"Your turn. Say: wellness."],[91.63,92.67,"wellness."],[93.68,94.95,"posture problems."],[95.65,99.89,"posture problems means pain or difficulty caused by sitting or standing badly."],[100.19,103.32,"Many students have posture problems from using phones."],[104.02,106.62,"Your turn. Say: posture problems."],[109.32,110.73,"posture problems."],[111.72,112.93,"meditation app."],[113.63,117.38,"meditation app means a phone application that guides you through meditation."],[117.68,119.87,"I use a meditation app before bed."],[120.56,123.02,"Your turn. Say: meditation app."],[125.72,127.06,"meditation app."],[128.05,129.2,"physiotherapy."],[129.9,133.81,"physiotherapy means treatment for injuries using exercise and massage."],[134.11,137.16,"After the accident, he needed physiotherapy for months."],[137.86,140.75,"Your turn. Say: physiotherapy."],[143.45,144.67,"physiotherapy."],[145.68,147.57,"Now let's listen to a conversation."],[147.87,150.04,"My back has been hurting for weeks."],[151.35,154.73,"You should have seen a doctor earlier. Do you have posture problems?"],[156.05,159.07,"Probably. My job is completely sedentary."],[160.38,163.94,"You ought to have taken more breaks. Have you tried physiotherapy?"],[165.25,169.22,"Not yet, but my therapist suggested a meditation app for stress relief."],[170.52,173.35,"Good. Wellness is about both mind and body."],[174.65,178.72,"Grammar focus: Modals of advice and obligation (past)."],[179.02,182.36,"Use should have or ought to have to criticise or regret past actions."],[182.66,187.81,"Use had to for past obligation, and needn't have for something unnecessary that you did."],[188.11,191.84,"For example: You should have rested more, and you needn't have bought medicine."],[192.14,197.07,"Needn't have done means you did it, but it wasn't necessary. Didn't need to usually means you didn't do it."],[198.05,200.85,"Now read and listen. The Hidden Cost of Sitting."],[201.15,204.72,"Many office workers spend more than nine hours a day sitting down."],[206.02,209.72,"Doctors warn that a sedentary lifestyle can be as harmful as smoking."],[211.02,214.68,"Posture problems and back pain are now common even among young people."],[215.98,219.59,"Experts say we should have been taking short walking breaks every hour."],[220.88,225.77,"Combined with good sleep and stress relief, small movements improve overall wellness."],[227.08,229.53,"Quiz time! Choose the correct answer."],[229.83,231.66,"Not getting enough sleep is blank."],[231.96,235.77,"A, sleep deprivation. B, wellness. C, stress relief."],[239.78,242.6,"The answer is A: sleep deprivation."],[244.08,247.01,"You look tired. You blank gone to bed earlier."],[247.31,250.82,"A, should have. B, must. C, had to."],[254.82,256.81,"The answer is A: should have."],[258.32,260.87,"I blank work late yesterday because of a deadline."],[261.17,264.8,"A, should have. B, had to. C, needn't have."],[268.82,270.56,"The answer is B: had to."],[272.05,275.16,"Treatment for injuries using exercise and massage is blank."],[275.46,279.8,"A, physiotherapy. B, meditation app. C, therapist."],[283.82,286.47,"The answer is A: physiotherapy."],[287.95,292.27,"According to the text, a sedentary lifestyle can be as harmful as blank."],[292.57,295.75,"A, coffee. B, smoking. C, sport."],[299.75,301.91,"The answer is B: smoking."],[303.42,307.6,"Now it's your turn to speak. What health advice do you wish you had followed earlier?"],[312.9,319.01,"I should have exercised more at university. I sat at my desk all day and developed posture problems."],[319.31,320.88,"Excellent answer, Nita!"],[321.88,326.88,"Great work today! You learned eight new words and modals of advice and obligation (past)."],[327.18,330.63,"Today's value is healthy body. Move your body every day."],[330.93,333.28,"See you in Unit six. Goodbye!"],[333.58,336.24,"Thank you, Mr. Daniel! Bye, everyone!"]],"OC-Upper-Intermediate-Unit06-The-Digital-Revolution":[[0.35,4.78,"Hello, everyone! I'm Mr. Daniel. Welcome to Online Upper-Intermediate."],[5.08,8.29,"Hi! I'm Nita. Let's learn together!"],[8.59,15.52,"Unit six: The Digital Revolution. In this unit, you will talk about technology and what will have happened."],[16.52,17.4,"big data."],[18.1,22.49,"big data means extremely large amounts of information analysed by computers."],[22.79,25.74,"Supermarkets use big data to predict what we'll buy."],[26.44,28.71,"Your turn. Say: big data."],[31.41,32.46,"big data."],[33.45,34.61,"machine learning."],[35.31,39.86,"machine learning means computers learning from data without being programmed step by step."],[40.16,42.82,"Machine learning helps doctors read X-rays."],[43.52,45.75,"Your turn. Say: machine learning."],[48.45,49.67,"machine learning."],[50.68,51.99,"virtual reality."],[52.69,56.59,"virtual reality means a computer world you experience through a headset."],[56.89,59.6,"Students explored Angkor in virtual reality."],[60.3,63.36,"Your turn. Say: virtual reality."],[66.06,67.39,"virtual reality."],[68.38,69.7,"augmented reality."],[70.4,74.6,"augmented reality means digital images added to the real world through a screen."],[74.9,77.38,"The museum app uses augmented reality."],[78.08,80.78,"Your turn. Say: augmented reality."],[83.48,84.91,"augmented reality."],[85.92,86.95,"blockchain."],[87.65,92.0,"blockchain means a secure digital record shared across many computers."],[92.3,94.81,"Some banks are testing blockchain for payments."],[95.51,97.88,"Your turn. Say: blockchain."],[100.58,101.58,"blockchain."],[102.58,103.61,"cryptocurrency."],[104.31,107.7,"cryptocurrency means digital money that is not controlled by a bank."],[108.0,110.59,"The price of cryptocurrency can change very quickly."],[111.29,113.92,"Your turn. Say: cryptocurrency."],[116.62,117.78,"cryptocurrency."],[118.78,120.06,"smart device."],[120.76,124.7,"smart device means a device connected to the internet, like a smart watch."],[125.0,127.23,"Our home has several smart devices."],[127.93,130.64,"Your turn. Say: smart device."],[133.34,134.6,"smart device."],[135.62,136.57,"cybercrime."],[137.27,140.86,"cybercrime means crime committed using computers or the internet."],[141.16,144.5,"Cybercrime costs businesses billions every year."],[145.2,147.7,"Your turn. Say: cybercrime."],[150.4,151.6,"cybercrime."],[152.58,154.39,"Now let's listen to a conversation."],[154.69,158.11,"How do you think technology will have changed by 2035?"],[159.42,162.69,"I think machine learning will have replaced many office tasks."],[163.98,165.4,"Will cash have disappeared?"],[166.72,170.6,"Maybe. Cryptocurrency and mobile payments will have become normal."],[171.88,172.9,"And schools?"],[174.18,178.39,"By then, most students will have studied history in virtual reality!"],[179.68,182.15,"Grammar focus: Future perfect."],[182.45,186.53,"Use the future perfect for an action that will be completed before a time in the future."],[186.82,189.59,"Will have plus past participle, often with by."],[189.89,194.15,"For example: By 2030, AI will have changed most jobs."],[194.45,200.19,"We often use by + time (by 2030, by next week, by the time ...) with the future perfect."],[201.18,203.84,"Now read and listen. Living in a Data World."],[204.14,207.81,"Every day, the world creates an enormous amount of digital information."],[209.12,212.47,"Companies use big data and machine learning to understand our habits."],[213.78,218.73,"By 2030, experts predict, there will have been billions of new smart devices."],[220.02,224.09,"This creates opportunities, but also risks such as cybercrime."],[225.38,229.86,"Understanding technology will have become a basic life skill for everyone."],[231.15,233.57,"Quiz time! Choose the correct answer."],[233.87,236.69,"Digital images added to the real world is blank."],[236.99,241.36,"A, virtual reality. B, augmented reality. C, blockchain."],[245.35,248.22,"The answer is B: augmented reality."],[249.72,251.58,"By next year, I blank my degree."],[251.88,255.36,"A, will finish. B, will have finished. C, finish."],[259.35,261.65,"The answer is B: will have finished."],[263.15,265.18,"By the time you arrive, we blank dinner."],[265.48,268.63,"A, will have eaten. B, eat. C, have eaten."],[272.62,274.2,"The answer is A: will have eaten."],[275.68,277.86,"Crime committed using computers is blank."],[278.16,281.85,"A, cybercrime. B, cryptocurrency. C, big data."],[285.85,287.72,"The answer is A: cybercrime."],[289.22,292.4,"According to the text, what is a risk of technology?"],[292.7,297.14,"A, cybercrime. B, smart devices. C, opportunities."],[301.15,303.22,"The answer is A: cybercrime."],[304.72,310.18,"Now it's your turn to speak. How will technology have changed your job or studies in ten years?"],[315.48,321.93,"In ten years, AI will have taken over many routine tasks, so I will have learned new digital skills."],[322.23,323.65,"Excellent answer, Nita!"],[324.65,328.24,"Great work today! You learned eight new words and future perfect."],[328.54,332.27,"Today's value is curiosity. Ask questions and find out."],[332.57,334.96,"See you in Unit seven. Goodbye!"],[335.26,338.16,"Thank you, Mr. Daniel! Bye, everyone!"]],"OC-Upper-Intermediate-Unit07-Career-Moves":[[0.35,4.97,"Hello, everyone! I'm Mr. Daniel. Welcome to Online Upper-Intermediate."],[5.27,8.34,"Hi! I'm Nita. Let's learn together!"],[8.64,14.45,"Unit seven: Career Moves. In this unit, you will discuss career decisions and their consequences."],[15.45,16.24,"headhunt."],[16.94,20.82,"headhunt means to find and offer a job to someone who works for another company."],[21.12,23.31,"She was headhunted by a big bank."],[24.01,26.08,"Your turn. Say: headhunt."],[28.78,29.58,"headhunt."],[30.58,31.45,"resign."],[32.15,34.46,"resign means to officially leave your job."],[34.76,36.9,"He resigned to start his own business."],[37.6,39.91,"Your turn. Say: resign."],[42.61,43.57,"resign."],[44.58,45.49,"job offer."],[46.19,49.03,"job offer means an offer of employment from a company."],[49.33,51.41,"I received two job offers in one week!"],[52.11,54.3,"Your turn. Say: job offer."],[57.0,58.03,"job offer."],[59.02,59.83,"perks."],[60.53,63.16,"perks means extra benefits you get from your job."],[63.46,66.16,"Free lunch and gym membership are nice perks."],[66.86,69.01,"Your turn. Say: perks."],[71.71,72.59,"perks."],[73.58,74.65,"career ladder."],[75.35,79.26,"career ladder means the series of higher positions you can reach in your career."],[79.56,81.48,"She climbed the career ladder quickly."],[82.18,84.41,"Your turn. Say: career ladder."],[87.11,88.32,"career ladder."],[89.32,90.82,"promotion prospects."],[91.52,95.13,"promotion prospects means the chances of getting a higher position."],[95.43,98.12,"This company has excellent promotion prospects."],[98.81,101.61,"Your turn. Say: promotion prospects."],[104.31,105.95,"promotion prospects."],[106.95,107.81,"job hunting."],[108.51,110.75,"job hunting means looking for a new job."],[111.06,112.98,"Job hunting can take several months."],[113.69,116.43,"Your turn. Say: job hunting."],[119.13,120.21,"job hunting."],[121.22,122.08,"recruiter."],[122.78,125.98,"recruiter means a person who finds new staff for companies."],[126.28,128.42,"A recruiter contacted me on LinkedIn."],[129.12,131.8,"Your turn. Say: recruiter."],[134.5,135.45,"recruiter."],[136.45,138.36,"Now let's listen to a conversation."],[138.66,143.48,"A recruiter called me yesterday. A tech company wants to headhunt me!"],[144.78,147.96,"Congratulations! Will you resign from your current job?"],[149.25,154.56,"I'm not sure. If I hadn't joined this company, I wouldn't have so much experience now."],[155.85,158.53,"True. What are the perks of the new job offer?"],[159.82,162.77,"A higher salary and better promotion prospects."],[164.08,168.24,"If I were you, I'd think carefully about the career ladder in both places."],[169.55,172.08,"Grammar focus: Mixed conditionals."],[172.38,174.74,"Mixed conditionals connect different times."],[175.04,180.69,"If plus had plus past participle, then would plus verb, for a past action with a present result."],[180.99,184.79,"For example: If I had studied IT, I would be a programmer now."],[185.09,191.64,"Mixed conditionals connect different times: a past action with a present result, or a present fact with a past result."],[192.65,195.33,"Now read and listen. Should You Stay or Should You Go?."],[195.63,199.62,"The average worker today changes jobs every three to four years."],[200.92,205.17,"Many people start job hunting when they feel their promotion prospects are limited."],[206.48,209.88,"Recruiters often headhunt talented employees with attractive perks."],[211.18,215.33,"However, experts warn that resigning too quickly can damage your reputation."],[216.62,219.68,"If you had stayed longer in each job, you might be more senior now."],[220.98,223.43,"Quiz time! Choose the correct answer."],[223.73,225.91,"To officially leave your job is to blank."],[226.21,229.44,"A, headhunt. B, resign. C, recruit."],[233.45,235.76,"The answer is B: resign."],[237.25,239.46,"If I had saved more, I blank a house now."],[239.76,242.85,"A, would own. B, would have owned. C, will own."],[246.85,248.73,"The answer is A: would own."],[250.25,252.35,"If he were braver, he blank the job."],[252.65,256.44,"A, would accept. B, would have accepted. C, accepts."],[260.45,262.57,"The answer is B: would have accepted."],[264.05,266.43,"Extra benefits from your job are blank."],[266.73,270.52,"A, perks. B, job offers. C, career ladders."],[274.52,276.31,"The answer is A: perks."],[277.82,281.59,"According to the text, the average worker changes jobs every blank."],[281.89,285.34,"A, one year. B, three to four years. C, ten years."],[289.35,291.84,"The answer is B: three to four years."],[293.35,298.15,"Now it's your turn to speak. If you had chosen a different career, how would your life be different now?"],[303.45,309.52,"If I had studied medicine, I would be working in a hospital now, and I'd probably have less free time."],[309.82,311.52,"Excellent answer, Nita!"],[312.52,316.26,"Great work today! You learned eight new words and mixed conditionals."],[316.56,319.87,"Today's value is hard work. Work hard and never give up."],[320.17,322.32,"See you in Unit eight. Goodbye!"],[322.62,325.09,"Thank you, Mr. Daniel! Bye, everyone!"]],"OC-Upper-Intermediate-Unit08-Urban-Challenges":[[0.35,4.9,"Hello, everyone! I'm Mr. Daniel. Welcome to Online Upper-Intermediate."],[5.2,8.38,"Hi! I'm Nita. Let's learn together!"],[8.68,15.43,"Unit eight: Urban Challenges. In this unit, you will discuss city problems using formal reporting structures."],[16.42,17.53,"urbanisation."],[18.23,22.11,"urbanisation means the movement of people from the countryside to cities."],[22.41,25.1,"Rapid urbanisation is changing Cambodia."],[25.8,27.89,"Your turn. Say: urbanisation."],[30.59,31.89,"urbanisation."],[32.88,34.07,"infrastructure."],[34.77,38.78,"infrastructure means basic systems like roads, water and electricity."],[39.08,41.0,"The city needs better infrastructure."],[41.7,44.44,"Your turn. Say: infrastructure."],[47.14,48.51,"infrastructure."],[49.52,50.75,"gentrification."],[51.45,55.9,"gentrification means when richer people move into a poor area and prices rise."],[56.2,59.15,"Gentrification has pushed many families out of the centre."],[59.85,62.28,"Your turn. Say: gentrification."],[64.98,66.3,"gentrification."],[67.28,68.59,"traffic congestion."],[69.29,72.56,"traffic congestion means too many vehicles on the roads."],[72.86,76.11,"Traffic congestion costs the city millions of hours."],[76.81,79.42,"Your turn. Say: traffic congestion."],[82.12,83.65,"traffic congestion."],[84.65,85.88,"urban sprawl."],[86.58,90.27,"urban sprawl means the uncontrolled spread of a city into the countryside."],[90.57,92.88,"Urban sprawl is destroying farmland."],[93.58,96.63,"Your turn. Say: urban sprawl."],[99.33,100.63,"urban sprawl."],[101.62,102.88,"affordable housing."],[103.59,107.58,"affordable housing means homes that people on average incomes can pay for."],[107.88,109.8,"There is a shortage of affordable housing."],[110.5,113.16,"Your turn. Say: affordable housing."],[115.86,117.33,"affordable housing."],[118.32,119.02,"slum."],[119.72,122.88,"slum means a very poor and crowded area of a city."],[123.18,125.15,"Many slums have no clean water."],[125.85,128.19,"Your turn. Say: slum."],[130.89,131.78,"slum."],[132.78,133.78,"commuter belt."],[134.48,137.9,"commuter belt means the area around a city where commuters live."],[138.2,140.49,"Prices are rising in the commuter belt too."],[141.19,143.69,"Your turn. Say: commuter belt."],[146.39,147.51,"commuter belt."],[148.52,150.47,"Now let's listen to a conversation."],[150.77,154.58,"It is said that Phnom Penh's population will double by 2040."],[155.88,158.86,"That's huge! Is the infrastructure ready?"],[160.15,164.61,"Not yet. Traffic congestion is thought to cost millions of dollars a year."],[165.92,169.36,"And affordable housing is said to be very difficult to find."],[170.65,174.54,"Gentrification is believed to be pushing families into the commuter belt."],[175.85,178.3,"So urban planning must improve quickly."],[179.62,182.64,"Grammar focus: Passive reporting structures."],[182.94,186.27,"Use passive reporting structures in formal writing and news."],[186.57,189.59,"It is said that, or subject plus is said to plus verb."],[189.89,195.17,"For example: It is said that the city is growing fast. The city is said to be growing fast."],[195.47,200.06,"These structures are common in news reports when the speaker is unknown or not important."],[201.05,204.2,"Now read and listen. Growing Cities, Growing Problems."],[204.5,207.66,"Asia's cities are said to be the fastest-growing in the world."],[208.95,213.63,"Urbanisation brings jobs and opportunities, but also serious challenges."],[214.92,218.51,"Traffic congestion and urban sprawl are believed to be getting worse."],[219.82,223.96,"It is estimated that millions of people live in slums without proper infrastructure."],[225.25,228.96,"Many experts think affordable housing is the key to fairer cities."],[230.25,232.55,"Quiz time! Choose the correct answer."],[232.85,235.67,"Basic systems like roads and water are blank."],[235.97,240.28,"A, infrastructure. B, urban sprawl. C, slums."],[244.28,246.61,"The answer is A: infrastructure."],[248.12,250.37,"It blank that the bridge will open next year."],[250.67,253.69,"A, says. B, is said. C, said."],[257.68,259.29,"The answer is B: is said."],[260.78,263.03,"He is thought blank the richest man in town."],[263.33,266.04,"A, to be. B, being. C, be."],[270.05,271.45,"The answer is A: to be."],[272.95,276.01,"When richer people move into a poor area, it is blank."],[276.31,280.59,"A, gentrification. B, urbanisation. C, commuter belt."],[284.58,286.63,"The answer is A: gentrification."],[288.12,292.28,"According to the text, which cities are said to be the fastest-growing?"],[292.58,295.78,"A, European. B, Asian. C, American."],[299.78,301.47,"The answer is B: Asian."],[302.98,306.94,"Now it's your turn to speak. What is the biggest challenge facing your city?"],[312.24,318.75,"It is often said that traffic congestion is our biggest problem, and I think affordable housing is a close second."],[319.05,320.63,"Excellent answer, Nita!"],[321.65,325.73,"Great work today! You learned eight new words and passive reporting structures."],[326.03,329.19,"Today's value is community. Help the people in your town."],[329.49,331.67,"See you in Unit nine. Goodbye!"],[331.97,334.76,"Thank you, Mr. Daniel! Bye, everyone!"]],"OC-Upper-Intermediate-Unit09-Consumer-Society":[[0.35,4.65,"Hello, everyone! I'm Mr. Daniel. Welcome to Online Upper-Intermediate."],[4.95,8.04,"Hi! I'm Nita. Let's learn together!"],[8.34,15.02,"Unit nine: Consumer Society. In this unit, you will discuss shopping habits, advertising and services."],[16.02,17.01,"consumerism."],[17.71,21.4,"consumerism means a culture focused on buying lots of things."],[21.7,24.52,"Consumerism encourages us to buy more than we need."],[25.23,27.49,"Your turn. Say: consumerism."],[30.19,31.25,"consumerism."],[32.25,33.4,"materialistic."],[34.1,37.52,"materialistic means caring too much about money and possessions."],[37.82,40.58,"He's become very materialistic since getting rich."],[41.28,43.84,"Your turn. Say: materialistic."],[46.54,47.89,"materialistic."],[48.88,49.95,"brand loyalty."],[50.65,53.58,"brand loyalty means always buying from the same company."],[53.88,55.8,"Apple has strong brand loyalty."],[56.5,59.28,"Your turn. Say: brand loyalty."],[61.98,63.17,"brand loyalty."],[64.18,65.71,"advertising campaign."],[66.41,70.16,"advertising campaign means a series of advertisements with one goal."],[70.46,72.95,"The advertising campaign doubled sales."],[73.65,76.29,"Your turn. Say: advertising campaign."],[78.99,80.53,"advertising campaign."],[81.55,82.71,"target audience."],[83.41,86.67,"target audience means the group of people a product is aimed at."],[86.97,89.49,"Teenagers are the target audience for this game."],[90.19,92.82,"Your turn. Say: target audience."],[95.52,96.88,"target audience."],[97.88,98.9,"fast fashion."],[99.6,103.34,"fast fashion means cheap clothes made quickly to follow trends."],[103.64,105.88,"Fast fashion creates a lot of waste."],[106.58,109.1,"Your turn. Say: fast fashion."],[111.81,113.06,"fast fashion."],[114.05,115.53,"planned obsolescence."],[116.23,120.68,"planned obsolescence means designing products to stop working after a short time."],[120.98,123.43,"Some phones are accused of planned obsolescence."],[124.13,127.07,"Your turn. Say: planned obsolescence."],[129.77,131.28,"planned obsolescence."],[132.28,133.35,"bargain hunting."],[134.05,137.25,"bargain hunting means looking for things at very low prices."],[137.55,139.72,"My mum loves bargain hunting at the market."],[140.42,143.25,"Your turn. Say: bargain hunting."],[145.95,147.21,"bargain hunting."],[148.22,150.25,"Now let's listen to a conversation."],[150.55,153.29,"I had my phone repaired instead of buying a new one."],[154.58,158.29,"Smart. Some companies are accused of planned obsolescence."],[159.58,164.01,"Exactly. Advertising campaigns make us feel we need the latest model."],[165.32,169.79,"Consumerism is everywhere. Even fast fashion is designed to be replaced."],[171.08,175.07,"I'm trying to be less materialistic. I'm getting my old jacket altered."],[176.38,180.07,"Good for you! And bargain hunting for second-hand items helps too."],[181.38,183.67,"Grammar focus: Causative (advanced)."],[183.97,188.5,"Use have or get, plus object, plus past participle when a service is done for you."],[188.8,195.37,"Use have plus person plus verb, or get plus person plus to plus verb, when you arrange or persuade someone."],[195.67,199.98,"For example: I had my phone repaired. I got my brother to fix my bike."],[200.28,205.8,"Have someone do = arrange for them to do it; get someone to do = persuade them to do it."],[206.78,209.74,"Now read and listen. Buy Less, Choose Better."],[210.04,213.72,"Modern consumerism encourages us to buy new things constantly."],[215.02,218.57,"Advertising campaigns are carefully designed for each target audience."],[219.88,224.04,"Fast fashion and planned obsolescence mean products don't last long."],[225.35,229.44,"A growing number of people now have old items repaired instead of replacing them."],[230.75,234.51,"Choosing quality over quantity saves money and protects the environment."],[235.82,238.27,"Quiz time! Choose the correct answer."],[238.57,241.06,"Always buying from the same company is blank."],[241.36,245.45,"A, brand loyalty. B, consumerism. C, fast fashion."],[249.45,251.71,"The answer is A: brand loyalty."],[253.22,254.9,"I need to get my car blank."],[255.2,258.53,"A, service. B, serviced. C, to service."],[262.52,264.61,"The answer is B: serviced."],[266.12,267.94,"She had the mechanic blank the brakes."],[268.24,271.29,"A, check. B, to check. C, checked."],[275.28,276.94,"The answer is A: check."],[278.45,280.97,"Caring too much about money and possessions is blank."],[281.27,285.23,"A, materialistic. B, bargain hunting. C, target audience."],[289.22,291.88,"The answer is A: materialistic."],[293.38,297.55,"According to the text, what are more people doing instead of replacing items?"],[297.85,301.8,"A, throwing them away. B, having them repaired. C, selling them."],[305.78,308.19,"The answer is B: having them repaired."],[309.68,313.73,"Now it's your turn to speak. Do you think advertising influences what you buy?"],[319.03,324.91,"Definitely. I often have to stop myself from buying things I see in online advertising campaigns."],[325.21,326.81,"Excellent answer, Nita!"],[327.82,331.49,"Great work today! You learned eight new words and causative (advanced)."],[331.79,335.55,"Today's value is responsibility. Help at home and do your jobs."],[335.85,338.07,"See you in Unit ten. Goodbye!"],[338.37,341.0,"Thank you, Mr. Daniel! Bye, everyone!"]],"OC-Upper-Intermediate-Unit10-Media-and-Truth":[[0.35,5.05,"Hello, everyone! I'm Mr. Daniel. Welcome to Online Upper-Intermediate."],[5.35,8.34,"Hi! I'm Nita. Let's learn together!"],[8.64,15.58,"Unit ten: Media and Truth. In this unit, you will discuss journalism, truth and report what people claimed."],[16.58,17.57,"press freedom."],[18.27,22.51,"press freedom means the right of journalists to report without government control."],[22.81,25.03,"Press freedom is essential in a democracy."],[25.73,28.27,"Your turn. Say: press freedom."],[30.97,32.24,"press freedom."],[33.25,34.92,"investigative journalism."],[35.62,40.23,"investigative journalism means reporting that carefully researches hidden problems."],[40.52,43.35,"Investigative journalism exposed the scandal."],[44.05,47.33,"Your turn. Say: investigative journalism."],[50.03,51.85,"investigative journalism."],[52.85,53.93,"whistleblower."],[54.63,59.09,"whistleblower means a person who reveals wrongdoing inside an organisation."],[59.39,61.82,"The whistleblower revealed the company's lies."],[62.52,64.87,"Your turn. Say: whistleblower."],[67.57,68.81,"whistleblower."],[69.82,70.64,"tabloid."],[71.34,76.11,"tabloid means a newspaper with short, sensational stories about celebrities."],[76.41,78.99,"Tabloids love stories about famous couples."],[79.69,81.75,"Your turn. Say: tabloid."],[84.45,85.28,"tabloid."],[86.28,87.45,"sensationalism."],[88.15,92.33,"sensationalism means presenting news in a shocking way to attract attention."],[92.63,96.18,"Sensationalism makes small problems look like disasters."],[96.88,99.26,"Your turn. Say: sensationalism."],[101.96,103.4,"sensationalism."],[104.42,105.52,"objectivity."],[106.22,109.75,"objectivity means reporting facts without personal opinions."],[110.05,112.08,"Good journalists aim for objectivity."],[112.78,115.08,"Your turn. Say: objectivity."],[117.78,118.9,"objectivity."],[119.88,120.76,"fact-checker."],[121.46,125.21,"fact-checker means a person who checks whether information is true."],[125.51,127.94,"The fact-checker found three errors in the article."],[128.64,130.8,"Your turn. Say: fact-checker."],[133.5,134.68,"fact-checker."],[135.68,136.45,"deepfake."],[137.15,140.64,"deepfake means a fake video made with AI that looks real."],[140.94,143.72,"The deepfake showed the president saying things he never said."],[144.41,146.64,"Your turn. Say: deepfake."],[149.34,150.35,"deepfake."],[151.35,153.41,"Now let's listen to a conversation."],[153.71,157.2,"Did you see the video of the minister? Everyone's sharing it."],[158.48,161.02,"A fact-checker warned that it might be a deepfake."],[162.32,165.14,"Really? The tabloid claimed it was real."],[166.45,171.28,"Tabloids often rely on sensationalism. Did any serious newspaper confirm it?"],[172.58,176.3,"No. One journalist admitted that she hadn't checked the source."],[177.62,181.31,"That's why investigative journalism and press freedom matter so much."],[182.62,185.29,"Grammar focus: Reporting verbs."],[185.59,188.01,"Reporting verbs summarise what people said."],[188.31,194.75,"Claim and refuse take to plus verb. Admit and deny take the -ing form. Warn and advise take an object plus to."],[195.05,199.6,"For example: She denied sharing the video, and they warned us not to trust the post."],[199.9,204.6,"Reporting verbs summarise what someone said, so you don't need to report every word."],[205.62,208.76,"Now read and listen. Can We Still Trust What We See?."],[209.06,213.04,"Deepfake technology can now create videos that look completely real."],[214.35,218.02,"Experts have warned that fake videos could influence elections."],[219.32,223.67,"Some politicians have denied making statements that appeared in viral clips."],[224.98,229.47,"Fact-checkers suggest checking at least two reliable sources before sharing."],[230.78,235.02,"In this new world, objectivity and press freedom are more important than ever."],[236.32,238.67,"Quiz time! Choose the correct answer."],[238.97,242.43,"A person who reveals wrongdoing in an organisation is a blank."],[242.73,246.19,"A, whistleblower. B, tabloid. C, fact-checker."],[250.18,252.21,"The answer is A: whistleblower."],[253.72,255.04,"He denied blank the money."],[255.34,258.49,"A, to take. B, taking. C, take."],[262.48,264.11,"The answer is B: taking."],[265.62,267.73,"She promised blank the report by Friday."],[268.03,271.41,"A, finishing. B, to finish. C, finish."],[275.42,277.2,"The answer is B: to finish."],[278.68,281.14,"A fake video made with AI is a blank."],[281.44,285.27,"A, deepfake. B, sensationalism. C, objectivity."],[289.28,291.2,"The answer is A: deepfake."],[292.72,296.38,"According to the text, what do fact-checkers suggest?"],[296.68,302.5,"A, sharing quickly. B, checking two reliable sources. C, trusting viral clips."],[306.52,309.88,"The answer is B: checking two reliable sources."],[311.38,315.12,"Now it's your turn to speak. How do you decide if a news story is true?"],[320.42,326.87,"I check who published it, look for the same story in reliable sources, and I'm careful with sensational headlines."],[327.17,328.58,"Excellent answer, Nita!"],[329.58,333.47,"Great work today! You learned eight new words and reporting verbs."],[333.77,336.7,"Today's value is honesty. Always tell the truth."],[337.0,339.48,"See you in Unit eleven. Goodbye!"],[339.77,342.89,"Thank you, Mr. Daniel! Bye, everyone!"]],"OC-Upper-Intermediate-Unit11-Climate-Action":[[0.35,4.94,"Hello, everyone! I'm Mr. Daniel. Welcome to Online Upper-Intermediate."],[5.24,8.33,"Hi! I'm Nita. Let's learn together!"],[8.63,14.14,"Unit eleven: Climate Action. In this unit, you will discuss climate change and future targets."],[15.15,16.57,"renewable source."],[17.27,22.36,"renewable source means a source of energy that is naturally replaced, like wind or sun."],[22.66,25.61,"Hydropower is Cambodia's main renewable source."],[26.31,28.91,"Your turn. Say: renewable source."],[31.61,33.01,"renewable source."],[34.02,35.2,"fossil fuel."],[35.9,40.66,"fossil fuel means fuel from ancient plants and animals, like coal, oil and gas."],[40.95,43.44,"Burning fossil fuels causes air pollution."],[44.14,46.93,"Your turn. Say: fossil fuel."],[49.63,50.87,"fossil fuel."],[51.88,53.29,"sea level rise."],[53.99,56.83,"sea level rise means the increase in the height of the ocean."],[57.13,60.14,"Sea level rise threatens coastal towns like Kep."],[60.84,63.8,"Your turn. Say: sea level rise."],[66.5,68.07,"sea level rise."],[69.08,70.27,"climate refugee."],[70.97,74.56,"climate refugee means a person forced to move because of climate change."],[74.86,78.11,"Millions could become climate refugees by 2050."],[78.81,81.77,"Your turn. Say: climate refugee."],[84.47,85.82,"climate refugee."],[86.82,87.85,"solar farm."],[88.55,92.86,"solar farm means a large area of solar panels producing electricity."],[93.16,95.74,"A new solar farm opened near Kampong Speu."],[96.44,99.16,"Your turn. Say: solar farm."],[101.87,102.96,"solar farm."],[103.95,105.23,"emissions target."],[105.93,109.36,"emissions target means a goal for reducing greenhouse gases."],[109.66,112.28,"The country set an ambitious emissions target."],[112.98,115.56,"Your turn. Say: emissions target."],[118.25,119.58,"emissions target."],[120.58,121.53,"net zero."],[122.23,125.18,"net zero means removing as much carbon as you produce."],[125.48,128.92,"Many companies aim to reach net zero by 2050."],[129.62,131.81,"Your turn. Say: net zero."],[134.5,135.58,"net zero."],[136.58,137.7,"climate summit."],[138.4,142.0,"climate summit means an international meeting about climate change."],[142.3,144.52,"World leaders met at the climate summit."],[145.22,147.6,"Your turn. Say: climate summit."],[150.3,151.48,"climate summit."],[152.48,154.48,"Now let's listen to a conversation."],[154.78,157.17,"Where do you think we'll be in 2050?"],[158.45,161.18,"I hope most countries will have reached net zero."],[162.48,164.69,"Will we still be burning fossil fuels?"],[165.98,169.68,"Some, but by then we'll have built many more solar farms."],[170.98,172.62,"What about sea level rise?"],[173.92,179.21,"Coastal cities will be adapting, and leaders will still be meeting at climate summits."],[180.52,184.06,"Grammar focus: Future continuous and future perfect."],[184.36,187.82,"Use the future continuous for actions in progress at a future time."],[188.12,191.82,"Use the future perfect for actions completed before a future time."],[192.12,198.49,"For example: In 2050, we will be using renewable energy, and we will have reached net zero."],[198.79,204.27,"Compare: at 8 p.m. I'll be eating (in progress) vs by 8 p.m. I'll have eaten (finished)."],[205.28,208.0,"Now read and listen. Racing to Net Zero."],[208.31,214.03,"At recent climate summits, many countries promised to reach net zero by 2050."],[215.32,218.81,"To succeed, the world will have to stop relying on fossil fuels."],[220.12,224.62,"By 2030, many nations will have doubled their solar farms and wind power."],[225.92,229.73,"Meanwhile, coastal communities will be preparing for sea level rise."],[231.02,234.88,"If targets are missed, millions of people may become climate refugees."],[236.18,238.55,"Quiz time! Choose the correct answer."],[238.84,241.41,"Removing as much carbon as you produce is blank."],[241.71,246.11,"A, net zero. B, fossil fuel. C, sea level rise."],[250.12,252.14,"The answer is A: net zero."],[253.65,257.29,"By 2040, scientists blank a cure for many diseases."],[257.59,261.15,"A, will be finding. B, will have found. C, find."],[265.15,267.3,"The answer is B: will have found."],[268.82,271.59,"At this time tomorrow, I blank to Siem Reap."],[271.89,275.36,"A, will be driving. B, will have driven. C, drive."],[279.35,281.3,"The answer is A: will be driving."],[282.82,284.69,"Coal, oil and gas are blank."],[284.99,289.62,"A, renewable sources. B, fossil fuels. C, solar farms."],[293.62,295.73,"The answer is B: fossil fuels."],[297.22,300.35,"According to the text, what may happen if targets are missed?"],[300.65,306.65,"A, more solar farms. B, people may become climate refugees. C, sea levels will fall."],[310.65,314.4,"The answer is B: people may become climate refugees."],[315.92,321.08,"Now it's your turn to speak. What will your country have done to fight climate change by 2040?"],[326.38,332.44,"By 2040, Cambodia will have built many solar farms, and people will be using more electric vehicles."],[332.74,334.36,"Excellent answer, Nita!"],[335.35,340.07,"Great work today! You learned eight new words and future continuous and future perfect."],[340.37,344.66,"Today's value is caring for nature. Care for plants, birds and our planet."],[344.96,347.27,"See you in Unit twelve. Goodbye!"],[347.57,350.13,"Thank you, Mr. Daniel! Bye, everyone!"]],"OC-Upper-Intermediate-Unit12-Learning-for-Life":[[0.35,4.79,"Hello, everyone! I'm Mr. Daniel. Welcome to Online Upper-Intermediate."],[5.09,8.4,"Hi! I'm Nita. Let's learn together!"],[8.7,14.24,"Unit twelve: Learning for Life. In this unit, you will talk about education and lifelong learning."],[15.25,16.39,"lifelong learner."],[17.09,20.33,"lifelong learner means a person who keeps learning throughout life."],[20.63,24.84,"My grandfather is a lifelong learner: he started English at seventy."],[25.54,27.91,"Your turn. Say: lifelong learner."],[30.61,31.98,"lifelong learner."],[32.98,34.0,"curiosity."],[34.7,37.91,"curiosity means a strong wish to know or learn something."],[38.22,40.63,"Curiosity is the starting point of all learning."],[41.33,43.8,"Your turn. Say: curiosity."],[46.5,47.63,"curiosity."],[48.62,49.59,"self-taught."],[50.3,53.34,"self-taught means having learned something without a teacher."],[53.64,55.46,"He's a self-taught guitarist."],[56.16,58.61,"Your turn. Say: self-taught."],[61.31,62.48,"self-taught."],[63.48,64.69,"online degree."],[65.39,69.08,"online degree means a university qualification studied on the internet."],[69.38,71.94,"She earned an online degree while working full-time."],[72.64,75.29,"Your turn. Say: online degree."],[77.99,79.24,"online degree."],[80.25,81.04,"tuition."],[81.74,84.28,"tuition means teaching, or the money paid for it."],[84.58,87.26,"University tuition is getting more expensive."],[87.96,90.35,"Your turn. Say: tuition."],[93.05,93.9,"tuition."],[94.88,95.85,"academic."],[96.55,100.08,"academic means related to schools, universities and study."],[100.38,102.42,"Her academic results were excellent."],[103.12,105.41,"Your turn. Say: academic."],[108.11,109.17,"academic."],[110.18,111.5,"vocational training."],[112.2,117.03,"vocational training means education for a specific job, like mechanics or cooking."],[117.33,120.7,"Vocational training helps young people find jobs quickly."],[121.4,124.46,"Your turn. Say: vocational training."],[127.16,128.74,"vocational training."],[129.75,130.83,"apprenticeship."],[131.53,134.9,"apprenticeship means learning a trade by working with an expert."],[135.2,137.89,"He did a three-year apprenticeship as an electrician."],[138.59,141.22,"Your turn. Say: apprenticeship."],[143.92,145.14,"apprenticeship."],[146.15,148.23,"Now let's listen to a conversation."],[148.53,152.13,"My cousin, whose grades weren't great, chose vocational training."],[153.42,156.45,"That's a smart choice. Which trade is he learning?"],[157.75,162.19,"He's doing an apprenticeship with a chef, whose restaurant is in Siem Reap."],[163.48,166.6,"Excellent. Not everyone needs an academic path."],[167.92,172.13,"And my aunt, who is fifty, is doing an online degree!"],[173.45,176.74,"A true lifelong learner. Curiosity has no age limit."],[178.05,181.27,"Grammar focus: Relative clauses (advanced)."],[181.57,186.27,"Use whose for possession, and preposition plus which or whom in formal English."],[186.57,188.77,"Which can also refer to a whole idea."],[189.07,195.4,"For example: The student whose project won is from Battambang. She passed every exam, which surprised everyone."],[195.7,201.2,"In formal English, put the preposition before which or whom: the person to whom I spoke."],[202.18,205.15,"Now read and listen. Never Too Late to Learn."],[205.45,209.11,"In the past, education was something that ended when you left school."],[210.42,215.28,"Today, lifelong learners take online degrees and short courses throughout their lives."],[216.58,222.17,"Vocational training and apprenticeships, which were once seen as second choices, are now highly valued."],[223.48,226.41,"Employers want workers whose skills are up to date."],[227.72,231.3,"Curiosity, not age, is the most important requirement for learning."],[232.58,234.85,"Quiz time! Choose the correct answer."],[235.15,237.55,"Having learned something without a teacher is blank."],[237.85,241.71,"A, self-taught. B, academic. C, apprenticeship."],[245.72,247.83,"The answer is A: self-taught."],[249.32,251.85,"The man blank car was stolen called the police."],[252.15,255.26,"A, who. B, whose. C, which."],[259.25,261.19,"The answer is B: whose."],[262.68,264.86,"The school blank I studied has closed."],[265.16,268.18,"A, at which. B, which. C, whose."],[272.18,274.0,"The answer is A: at which."],[275.48,278.4,"Learning a trade by working with an expert is an blank."],[278.7,282.11,"A, online degree. B, apprenticeship. C, tuition."],[286.12,288.44,"The answer is B: apprenticeship."],[289.95,293.49,"According to the text, what is the most important requirement for learning?"],[293.79,296.69,"A, money. B, age. C, curiosity."],[300.68,302.61,"The answer is C: curiosity."],[304.12,307.65,"Now it's your turn to speak. What would you like to learn next, and why?"],[312.95,318.9,"I'd like to learn graphic design, which would help me in my job, and I'll probably take an online course."],[319.2,320.72,"Excellent answer, Nita!"],[321.72,325.81,"Great work today! You learned eight new words and relative clauses (advanced)."],[326.11,329.32,"Today's value is pride in learning. Be proud of what you learned."],[329.62,332.31,"See you in Unit thirteen. Goodbye!"],[332.61,335.3,"Thank you, Mr. Daniel! Bye, everyone!"]],"OC-Upper-Intermediate-Unit13-The-Art-of-Persuasion":[[0.35,4.68,"Hello, everyone! I'm Mr. Daniel. Welcome to Online Upper-Intermediate."],[4.98,8.11,"Hi! I'm Nita. Let's learn together!"],[8.41,14.11,"Unit thirteen: The Art of Persuasion. In this unit, you will argue, persuade and emphasise your point."],[15.12,15.89,"debate."],[16.59,20.4,"debate means a formal discussion where people argue different views."],[20.7,23.42,"Our class held a debate on school uniforms."],[24.12,26.21,"Your turn. Say: debate."],[28.91,29.76,"debate."],[30.75,31.73,"convince."],[32.43,34.69,"convince means to make someone believe something."],[34.99,36.87,"She convinced me to join the club."],[37.57,39.66,"Your turn. Say: convince."],[42.36,43.36,"convince."],[44.35,45.25,"rhetoric."],[45.95,49.43,"rhetoric means persuasive language, sometimes without real meaning."],[49.73,52.25,"The politician's speech was full of rhetoric."],[52.95,55.36,"Your turn. Say: rhetoric."],[58.06,58.92,"rhetoric."],[59.92,61.23,"evidence-based."],[61.93,65.17,"evidence-based means supported by facts and research."],[65.47,67.48,"We need evidence-based policies."],[68.18,70.55,"Your turn. Say: evidence-based."],[73.25,74.58,"evidence-based."],[75.58,76.44,"point of view."],[77.14,79.14,"point of view means a personal opinion."],[79.44,81.7,"I understand your point of view, but I disagree."],[82.4,84.59,"Your turn. Say: point of view."],[87.29,88.27,"point of view."],[89.25,90.02,"logical."],[90.72,93.83,"logical means reasonable and based on clear thinking."],[94.13,96.11,"Her argument was clear and logical."],[96.81,99.25,"Your turn. Say: logical."],[101.95,102.95,"logical."],[103.95,105.21,"emotional appeal."],[105.91,109.76,"emotional appeal means trying to persuade by making people feel something."],[110.06,112.53,"Charity adverts often use emotional appeal."],[113.23,115.73,"Your turn. Say: emotional appeal."],[118.43,119.87,"emotional appeal."],[120.88,122.12,"compromise solution."],[122.82,126.37,"compromise solution means an answer where both sides give up something."],[126.67,128.66,"They agreed on a compromise solution."],[129.36,131.94,"Your turn. Say: compromise solution."],[134.64,136.1,"compromise solution."],[137.08,138.97,"Now let's listen to a conversation."],[139.27,141.86,"What convinced you to vote for the new school policy?"],[143.15,147.24,"What convinced me was the evidence. The argument was really logical."],[148.55,150.68,"Wasn't there a lot of rhetoric in the debate?"],[151.98,156.58,"Yes, but it was the data that changed my point of view, not the emotional appeal."],[157.88,159.06,"And the other side?"],[160.35,164.5,"What they wanted was a compromise solution, and that's what we finally agreed on."],[165.78,168.99,"Grammar focus: Cleft sentences for emphasis."],[169.29,172.78,"Use cleft sentences to emphasise the most important information."],[173.08,176.6,"What plus clause plus is, or it was plus focus plus that."],[176.9,181.94,"For example: What convinced me was the evidence. It was the data that changed my mind."],[182.24,186.86,"Cleft sentences are useful in speeches and debates to highlight your key point."],[187.85,191.03,"Now read and listen. Ethos, Pathos and Logos."],[191.32,196.27,"Over two thousand years ago, Aristotle described three ways to persuade people."],[197.58,202.12,"Ethos is about trust: what matters is whether the speaker seems reliable."],[203.42,207.6,"Pathos is emotional appeal, which moves the audience's feelings."],[208.88,211.81,"Logos is logical, evidence-based reasoning."],[213.12,216.64,"It is the combination of all three that makes a speech truly convincing."],[217.95,220.39,"Quiz time! Choose the correct answer."],[220.69,224.37,"Persuasive language, sometimes without real meaning, is blank."],[224.66,227.84,"A, rhetoric. B, debate. C, evidence."],[231.85,233.73,"The answer is A: rhetoric."],[235.25,237.07,"blank I need is a long holiday."],[237.38,240.06,"A, That. B, What. C, Which."],[244.05,245.37,"The answer is B: What."],[246.85,249.29,"It was my teacher blank encouraged me to apply."],[249.59,252.61,"A, what. B, that. C, which."],[256.62,258.37,"The answer is B: that."],[259.88,262.6,"An answer where both sides give up something is a blank."],[262.9,267.3,"A, point of view. B, compromise solution. C, emotional appeal."],[271.28,273.82,"The answer is B: compromise solution."],[275.32,277.69,"According to the text, logos means blank."],[277.99,281.15,"A, trust. B, emotion. C, logical reasoning."],[285.15,287.31,"The answer is C: logical reasoning."],[288.82,293.09,"Now it's your turn to speak. Try to convince me that learning English is important."],[298.39,304.63,"What really matters is opportunity. It's English that opens doors to better jobs, travel and knowledge."],[304.93,306.5,"Excellent answer, Nita!"],[307.52,312.15,"Great work today! You learned eight new words and cleft sentences for emphasis."],[312.45,315.9,"Today's value is respect. Thank the people who help us."],[316.2,318.48,"See you in Unit fourteen. Goodbye!"],[318.78,321.51,"Thank you, Mr. Daniel! Bye, everyone!"]],"OC-Upper-Intermediate-Unit14-Money-Matters":[[0.35,4.85,"Hello, everyone! I'm Mr. Daniel. Welcome to Online Upper-Intermediate."],[5.15,8.18,"Hi! I'm Nita. Let's learn together!"],[8.48,14.1,"Unit fourteen: Money Matters. In this unit, you will talk about finances, regrets and wishes."],[15.12,15.96,"mortgage."],[16.66,18.95,"mortgage means a loan to buy a house."],[19.25,21.43,"They'll pay off their mortgage in twenty years."],[22.13,24.2,"Your turn. Say: mortgage."],[26.9,27.83,"mortgage."],[28.85,29.64,"pension."],[30.34,33.6,"pension means money paid regularly to someone after they retire."],[33.9,36.08,"A good pension makes retirement easier."],[36.78,38.6,"Your turn. Say: pension."],[41.3,42.05,"pension."],[43.05,43.83,"tax."],[44.53,46.84,"tax means money people pay to the government."],[47.14,49.72,"Income tax pays for schools and roads."],[50.42,52.79,"Your turn. Say: tax."],[55.49,56.31,"tax."],[57.32,58.31,"stock market."],[59.01,62.47,"stock market means where shares in companies are bought and sold."],[62.77,65.06,"The stock market fell sharply last week."],[65.76,68.38,"Your turn. Say: stock market."],[71.08,72.51,"stock market."],[73.52,74.62,"cost-
