sh they had learned financial literacy at school."],[195.28,198.16,"Without it, people often take loans they cannot afford."],[199.45,202.66,"Some end up in bankruptcy because of high loan repayments."],[203.95,208.42,"Understanding tax, pensions and the stock market helps people plan for the future."],[209.72,213.88,"As one expert said: if only schools taught money as well as maths!"],[215.18,217.42,"Quiz time! Choose the correct answer."],[217.72,219.54,"A loan to buy a house is a blank."],[219.84,223.07,"A, mortgage. B, pension. C, tax."],[227.08,229.15,"The answer is A: mortgage."],[230.65,232.74,"I wish I blank more time to study."],[233.04,235.91,"A, have. B, had. C, will have."],[239.92,241.52,"The answer is B: had."],[243.02,245.96,"If only I blank that phone. It broke after a week!"],[246.26,249.63,"A, didn't buy. B, hadn't bought. C, don't buy."],[253.65,255.73,"The answer is B: hadn't bought."],[257.22,259.83,"When a company cannot pay its debts, it is blank."],[260.13,264.23,"A, cost-effective. B, bankruptcy. C, stock market."],[268.22,270.47,"The answer is B: bankruptcy."],[271.98,276.19,"According to the text, many adults wish they had learned blank at school."],[276.49,280.15,"A, financial literacy. B, history. C, sport."],[284.15,286.58,"The answer is A: financial literacy."],[288.08,292.21,"Now it's your turn to speak. What financial advice would you give your younger self?"],[297.51,303.1,"I wish I had started saving earlier. If only someone had explained how loans and interest work!"],[303.4,305.09,"Excellent answer, Nita!"],[306.08,309.51,"Great work today! You learned eight new words and wish and if only."],[309.81,313.43,"Today's value is responsibility. Help at home and do your jobs."],[313.73,316.14,"See you in Unit fifteen. Goodbye!"],[316.44,319.14,"Thank you, Mr. Daniel! Bye, everyone!"]],"OC-Upper-Intermediate-Unit15-Heritage-and-Identity":[[0.35,5.2,"Hello, everyone! I'm Mr. Daniel. Welcome to Online Upper-Intermediate."],[5.5,8.5,"Hi! I'm Nita. Let's learn together!"],[8.8,14.95,"Unit fifteen: Heritage and Identity. In this unit, you will discuss culture, heritage and identity."],[15.95,17.27,"cultural heritage."],[17.96,23.01,"cultural heritage means traditions, buildings and art passed down through generations."],[23.31,26.02,"Angkor is part of Cambodia's cultural heritage."],[26.73,29.3,"Your turn. Say: cultural heritage."],[32.0,33.33,"cultural heritage."],[34.35,35.27,"identity."],[35.97,39.61,"identity means who a person or group is; what makes them different."],[39.91,42.65,"Language is an important part of our identity."],[43.35,45.5,"Your turn. Say: identity."],[48.2,49.28,"identity."],[50.28,51.24,"ancestry."],[51.94,55.12,"ancestry means the people in your family who lived long ago."],[55.42,57.94,"She traced her ancestry back to Battambang."],[58.64,60.94,"Your turn. Say: ancestry."],[63.64,64.69,"ancestry."],[65.68,66.73,"tradition-bound."],[67.43,70.52,"tradition-bound means strongly following old customs."],[70.82,72.96,"The village is quite tradition-bound."],[73.66,76.65,"Your turn. Say: tradition-bound."],[79.35,80.69,"tradition-bound."],[81.68,82.56,"folklore."],[83.26,86.5,"folklore means traditional stories and beliefs of a community."],[86.8,88.93,"Khmer folklore is full of clever rabbits."],[89.63,91.67,"Your turn. Say: folklore."],[94.37,95.27,"folklore."],[96.28,97.38,"craftsmanship."],[98.08,100.98,"craftsmanship means the skill of making things by hand."],[101.28,104.27,"The craftsmanship of the silver bowls is amazing."],[104.97,107.67,"Your turn. Say: craftsmanship."],[110.37,111.8,"craftsmanship."],[112.78,113.83,"silk weaving."],[114.53,118.43,"silk weaving means making cloth from silk thread on a loom."],[118.73,121.37,"Silk weaving is a traditional skill on Koh Dach."],[122.07,124.72,"Your turn. Say: silk weaving."],[127.42,128.59,"silk weaving."],[129.58,130.71,"shadow puppetry."],[131.41,135.16,"shadow puppetry means theatre using leather puppets in front of a light."],[135.47,139.17,"Sbek Thom is a famous form of Khmer shadow puppetry."],[139.87,142.62,"Your turn. Say: shadow puppetry."],[145.32,146.54,"shadow puppetry."],[147.55,149.54,"Now let's listen to a conversation."],[149.84,152.99,"Nita, you visited Koh Dach last weekend, didn't you?"],[154.28,159.18,"Yes! Walking through the village, I saw families doing silk weaving."],[160.48,162.45,"Their craftsmanship is incredible."],[163.75,167.83,"Having watched them for an hour, I understood how much patience it takes."],[169.12,170.87,"Did you see any shadow puppetry?"],[172.18,177.22,"Yes. Performed by young artists, the show told stories from Khmer folklore."],[178.52,181.29,"Grammar focus: Participle clauses."],[181.59,185.07,"Participle clauses make writing shorter and more advanced."],[185.37,193.44,"Use -ing for actions at the same time, having plus past participle for completed actions, and a past participle for a passive meaning."],[193.74,198.48,"For example: Having finished the tour, we had lunch. Made by hand, the scarf is unique."],[198.78,205.37,"The subject of the participle clause must be the same as the main clause: 'Walking home, I saw ...', not 'Walking home, the rain started'."],[206.38,209.19,"Now read and listen. Keeping Traditions Alive."],[209.49,213.22,"Many traditional skills in Cambodia were almost lost during the war."],[214.52,219.3,"Rebuilt by dedicated artists, shadow puppetry is now performed again in Siem Reap."],[220.62,224.49,"Having trained young people, master weavers are passing on the art of silk weaving."],[225.78,229.83,"Folklore is also being recorded in books and videos for future generations."],[231.12,235.83,"Protecting cultural heritage helps people understand their identity and ancestry."],[237.12,239.53,"Quiz time! Choose the correct answer."],[239.82,242.73,"Traditional stories and beliefs of a community are blank."],[243.03,246.51,"A, folklore. B, ancestry. C, identity."],[250.52,252.3,"The answer is A: folklore."],[253.78,256.11,"blank the museum, we went to a café."],[256.41,259.91,"A, Having visited. B, Visited. C, Have visited."],[263.92,265.8,"The answer is A: Having visited."],[267.32,270.54,"blank in the 12th century, the temple is very old."],[270.83,273.99,"A, Building. B, Built. C, Having building."],[277.98,279.5,"The answer is B: Built."],[280.98,283.3,"The skill of making things by hand is blank."],[283.6,287.95,"A, craftsmanship. B, tradition-bound. C, silk weaving."],[291.95,294.16,"The answer is A: craftsmanship."],[295.65,298.82,"According to the text, what is now performed again in Siem Reap?"],[299.12,303.22,"A, silk weaving. B, shadow puppetry. C, folklore."],[307.22,309.8,"The answer is B: shadow puppetry."],[311.28,316.14,"Now it's your turn to speak. Which tradition from your culture would you like to protect, and why?"],[321.44,329.51,"Having seen how few people learn it now, I'd like to protect traditional Khmer music, because it is part of our identity."],[329.81,331.29,"Excellent answer, Nita!"],[332.28,336.53,"Great work today! You learned eight new words and participle clauses."],[336.83,340.51,"Today's value is love of country. Love and take care of Cambodia."],[340.81,343.07,"See you in Unit sixteen. Goodbye!"],[343.37,345.86,"Thank you, Mr. Daniel! Bye, everyone!"]],"OC-Upper-Intermediate-Unit16-Sport-and-Society":[[0.35,4.77,"Hello, everyone! I'm Mr. Daniel. Welcome to Online Upper-Intermediate."],[5.07,8.46,"Hi! I'm Nita. Let's learn together!"],[8.76,15.36,"Unit sixteen: Sport and Society. In this unit, you will discuss sport, fairness and big events."],[16.35,17.65,"professional sport."],[18.35,21.45,"professional sport means sport played as a job for money."],[21.75,24.13,"Professional sport is a huge business."],[24.83,27.55,"Your turn. Say: professional sport."],[30.25,31.69,"professional sport."],[32.68,33.55,"doping."],[34.24,37.78,"doping means using illegal drugs to improve sports performance."],[38.08,40.02,"The cyclist was banned for doping."],[40.72,42.86,"Your turn. Say: doping."],[45.56,46.47,"doping."],[47.48,48.77,"fair play rules."],[49.48,53.27,"fair play rules means rules that make sure competitions are honest."],[53.57,56.18,"Both teams must respect fair play rules."],[56.88,59.6,"Your turn. Say: fair play rules."],[62.3,63.7,"fair play rules."],[64.68,65.68,"sponsorship."],[66.38,70.02,"sponsorship means money from a company to support a team or event."],[70.32,73.08,"The tournament has sponsorship from a phone company."],[73.78,76.15,"Your turn. Say: sponsorship."],[78.85,80.0,"sponsorship."],[81.02,82.11,"fan culture."],[82.81,86.7,"fan culture means the shared habits and passion of sports supporters."],[87.0,89.91,"Football fan culture includes songs and colours."],[90.61,92.91,"Your turn. Say: fan culture."],[95.61,96.95,"fan culture."],[97.95,98.91,"match-fixing."],[99.6,103.59,"match-fixing means dishonestly deciding the result of a game in advance."],[103.89,106.53,"Match-fixing is a serious crime in sport."],[107.23,109.59,"Your turn. Say: match-fixing."],[112.29,113.49,"match-fixing."],[114.48,115.55,"world record."],[116.25,119.6,"world record means the best result ever achieved in the world."],[119.9,122.18,"She broke the world record in the marathon."],[122.88,125.53,"Your turn. Say: world record."],[128.23,129.31,"world record."],[130.32,131.36,"esports."],[132.06,136.06,"esports means video games played as professional competitions."],[136.36,138.56,"Esports now has millions of fans."],[139.26,142.12,"Your turn. Say: esports."],[144.82,145.8,"esports."],[146.78,148.91,"Now let's listen to a conversation."],[149.21,151.48,"Did you hear about the match-fixing scandal?"],[152.78,156.47,"Yes. Never before had the league faced such a serious problem."],[157.78,160.84,"And a famous runner was banned for doping last month."],[162.15,166.68,"Rarely do we see so many scandals in one year. Fair play rules must be stricter."],[167.98,171.53,"At least esports is growing fast with new sponsorship."],[172.82,176.92,"True. Not only is it popular, but it's also creating new careers."],[178.22,181.59,"Grammar focus: Inversion after negative adverbials."],[181.89,186.14,"In formal English, we can start a sentence with a negative adverb for emphasis."],[186.44,189.68,"After never, rarely or not only, use question word order."],[189.98,193.47,"For example: Never have I seen such a fast runner."],[193.77,197.97,"After these negative words at the start of a sentence, use question word order."],[198.98,201.87,"Now read and listen. The Changing Face of Sport."],[202.17,206.61,"Professional sport today depends heavily on sponsorship and television money."],[207.92,211.45,"Never before have athletes earned so much, or faced so much pressure."],[212.75,216.9,"Scandals like doping and match-fixing have damaged trust in some sports."],[218.18,222.74,"At the same time, esports and new fan culture are attracting young audiences."],[224.05,228.53,"Not only is sport entertainment, but it also shapes national identity."],[229.85,232.15,"Quiz time! Choose the correct answer."],[232.45,235.43,"Using illegal drugs to improve performance is blank."],[235.73,239.78,"A, doping. B, sponsorship. C, esports."],[243.78,245.31,"The answer is A: doping."],[246.82,248.7,"Never blank such a beautiful goal."],[249.0,252.47,"A, I have seen. B, have I seen. C, I saw."],[256.48,258.41,"The answer is B: have I seen."],[259.92,261.63,"Rarely blank late for training."],[261.93,264.87,"A, he is. B, is he. C, he was."],[268.88,270.52,"The answer is B: is he."],[272.02,274.76,"The best result ever achieved in the world is a blank."],[275.06,278.64,"A, world record. B, fan culture. C, match-fixing."],[282.65,284.48,"The answer is A: world record."],[285.98,288.82,"According to the text, what is attracting young audiences?"],[289.12,293.94,"A, doping. B, esports and new fan culture. C, sponsorship."],[297.95,300.91,"The answer is B: esports and new fan culture."],[302.42,306.19,"Now it's your turn to speak. Should esports be considered a real sport?"],[311.5,318.05,"Not only does esports need skill and teamwork, but it also has millions of fans, so I think it should."],[318.35,319.88,"Excellent answer, Nita!"],[320.88,325.49,"Great work today! You learned eight new words and inversion after negative adverbials."],[325.79,329.56,"Today's value is fair play. Play fairly and follow the rules."],[329.87,332.24,"See you in Unit seventeen. Goodbye!"],[332.54,335.3,"Thank you, Mr. Daniel! Bye, everyone!"]],"OC-Upper-Intermediate-Unit17-Law-and-Order":[[0.35,5.11,"Hello, everyone! I'm Mr. Daniel. Welcome to Online Upper-Intermediate."],[5.41,8.5,"Hi! I'm Nita. Let's learn together!"],[8.8,14.3,"Unit seventeen: Law and Order. In this unit, you will talk about justice and the legal system."],[15.28,16.25,"justice."],[16.95,19.99,"justice means fair treatment according to the law."],[20.29,22.32,"The victims' families want justice."],[23.02,25.69,"Your turn. Say: justice."],[28.39,29.44,"justice."],[30.45,31.17,"trial."],[31.87,35.11,"trial means a formal examination of a case in a court."],[35.41,37.27,"The trial lasted three weeks."],[37.97,39.87,"Your turn. Say: trial."],[42.57,43.31,"trial."],[44.32,45.27,"sentence."],[45.97,48.6,"sentence means the punishment given by a judge."],[48.9,51.35,"He received a sentence of five years in prison."],[52.05,54.33,"Your turn. Say: sentence."],[57.03,57.96,"sentence."],[58.95,59.68,"jury."],[60.38,63.88,"jury means a group of citizens who decide if someone is guilty."],[64.18,65.98,"The jury found him not guilty."],[66.68,68.59,"Your turn. Say: jury."],[71.29,72.09,"jury."],[73.08,74.26,"legal system."],[74.96,77.89,"legal system means the laws and courts of a country."],[78.19,81.11,"Every legal system should be fair and independent."],[81.81,84.66,"Your turn. Say: legal system."],[87.36,88.59,"legal system."],[89.58,90.86,"human rights law."],[91.56,95.27,"human rights law means laws that protect people's basic freedoms."],[95.57,98.09,"Human rights law protects freedom of speech."],[98.79,101.4,"Your turn. Say: human rights law."],[104.1,105.35,"human rights law."],[106.35,107.08,"appeal."],[107.78,110.68,"appeal means asking a higher court to change a decision."],[110.98,113.12,"His lawyer will appeal against the decision."],[113.82,116.05,"Your turn. Say: appeal."],[118.75,119.62,"appeal."],[120.62,121.62,"prosecutor."],[122.32,125.41,"prosecutor means a lawyer who argues that someone is guilty."],[125.71,127.81,"The prosecutor presented new evidence."],[128.51,130.71,"Your turn. Say: prosecutor."],[133.41,134.48,"prosecutor."],[135.48,137.51,"Now let's listen to a conversation."],[137.81,140.55,"My uncle got his car stolen last month."],[141.85,145.0,"I'm sorry to hear that. Did the police catch the thief?"],[146.32,149.99,"Yes, and he's getting his case heard in court next week."],[151.28,153.06,"Will there be a trial with a jury?"],[154.35,159.25,"Cambodia's legal system doesn't use juries. A judge decides the sentence."],[160.55,163.41,"I see. And if he disagrees, he can appeal."],[164.72,167.32,"Grammar focus: Passive with get and have."],[167.62,172.88,"Get plus past participle is an informal passive, often for unexpected events."],[173.18,177.48,"Have plus something plus past participle can describe something bad that happened to you."],[177.78,182.28,"For example: She had her bag stolen at the market, and the thief got caught on camera."],[182.58,187.23,"Have something done can describe a service (I had my hair cut) or an unpleasant event (I had my phone stolen)."],[188.25,190.51,"Now read and listen. How Courts Work."],[190.81,194.36,"Different countries organise their legal systems in different ways."],[195.65,200.34,"In some countries, a jury of ordinary citizens decides whether a person is guilty."],[201.65,206.03,"In others, like Cambodia, professional judges hear the case and decide the sentence."],[207.32,211.39,"Both the prosecutor and the defence lawyer present evidence during the trial."],[212.68,216.53,"If either side believes the decision is unfair, they can make an appeal."],[217.82,220.31,"Quiz time! Choose the correct answer."],[220.61,224.43,"A group of citizens who decide if someone is guilty is a blank."],[224.73,227.96,"A, jury. B, trial. C, prosecutor."],[231.95,233.58,"The answer is A: jury."],[235.08,237.08,"He got blank for driving too fast."],[237.38,240.26,"A, stop. B, stopped. C, stopping."],[244.25,246.05,"The answer is B: stopped."],[247.55,249.55,"I had my wallet blank on the bus."],[249.85,253.11,"A, steal. B, stolen. C, stealing."],[257.12,258.62,"The answer is B: stolen."],[260.12,263.12,"Asking a higher court to change a decision is an blank."],[263.42,266.57,"A, appeal. B, sentence. C, justice."],[270.58,272.21,"The answer is A: appeal."],[273.72,277.02,"According to the text, who decides the sentence in Cambodia?"],[277.32,281.17,"A, a jury. B, professional judges. C, the police."],[285.18,287.85,"The answer is B: professional judges."],[289.35,293.65,"Now it's your turn to speak. Why is a fair legal system important for a country?"],[298.95,305.85,"It protects everyone equally. If people get treated unfairly, they lose trust in justice and in the government."],[306.15,307.85,"Excellent answer, Nita!"],[308.85,312.65,"Great work today! You learned eight new words and passive with get and have."],[312.95,315.96,"Today's value is honesty. Always tell the truth."],[316.26,318.4,"See you in Unit eighteen. Goodbye!"],[318.7,321.25,"Thank you, Mr. Daniel! Bye, everyone!"]],"OC-Upper-Intermediate-Unit18-Breakthroughs":[[0.35,4.61,"Hello, everyone! I'm Mr. Daniel. Welcome to Online Upper-Intermediate."],[4.91,7.99,"Hi! I'm Nita. Let's learn together!"],[8.29,14.91,"Unit eighteen: Breakthroughs. In this unit, you will talk about science, research and plans that changed."],[15.92,17.42,"laboratory research."],[18.12,21.8,"laboratory research means scientific work done in a lab."],[22.1,25.04,"Years of laboratory research led to the new medicine."],[25.74,28.53,"Your turn. Say: laboratory research."],[31.23,32.84,"laboratory research."],[33.85,34.99,"clinical trial."],[35.69,39.07,"clinical trial means a test of a new medicine on volunteers."],[39.37,42.02,"The vaccine passed its final clinical trial."],[42.72,45.05,"Your turn. Say: clinical trial."],[47.75,48.95,"clinical trial."],[49.95,50.99,"space mission."],[51.69,54.57,"space mission means a planned journey into space."],[54.87,56.89,"The space mission landed on the Moon."],[57.59,59.91,"Your turn. Say: space mission."],[62.61,63.84,"space mission."],[64.85,66.14,"telescope image."],[66.84,70.45,"telescope image means a picture of space taken by a telescope."],[70.75,73.88,"The new telescope image shows a distant galaxy."],[74.58,77.24,"Your turn. Say: telescope image."],[79.94,81.33,"telescope image."],[82.32,83.49,"quantum computing."],[84.19,87.71,"quantum computing means a new, extremely powerful type of computing."],[88.01,90.65,"Quantum computing could solve problems in seconds."],[91.35,94.06,"Your turn. Say: quantum computing."],[96.76,98.08,"quantum computing."],[99.08,100.34,"nanotechnology."],[101.04,105.6,"nanotechnology means technology using extremely tiny materials."],[105.91,108.98,"Nanotechnology is used in sunscreen and medicine."],[109.68,112.42,"Your turn. Say: nanotechnology."],[115.12,116.69,"nanotechnology."],[117.68,119.08,"renewable battery."],[119.78,123.82,"renewable battery means a battery made from sustainable materials."],[124.12,127.16,"Scientists developed a renewable battery from seaweed."],[127.86,130.56,"Your turn. Say: renewable battery."],[133.26,134.7,"renewable battery."],[135.68,136.95,"scientific method."],[137.65,141.66,"scientific method means testing ideas through observation and experiments."],[141.96,144.66,"The scientific method starts with a question."],[145.36,147.89,"Your turn. Say: scientific method."],[150.59,152.02,"scientific method."],[153.02,154.97,"Now let's listen to a conversation."],[155.27,158.22,"I read that the space mission was going to launch last month."],[159.52,162.78,"Yes, but it was delayed because of a technical problem."],[164.08,167.24,"Scientists were about to announce a new battery too, weren't they?"],[168.55,173.19,"Right. They were going to publish the results, but the clinical trial took longer."],[174.48,178.14,"That's the scientific method: you can't rush good research."],[179.45,184.48,"Exactly. I was going to study chemistry, but now I'm thinking about physics!"],[185.78,188.33,"Grammar focus: Future in the past."],[188.63,192.81,"Use the future in the past to talk about plans or predictions made in the past."],[193.11,195.2,"Was going to, would, and was about to."],[195.5,198.07,"For example: I was going to call you, but I forgot."],[198.37,201.11,"Was going to often suggests that the plan did not happen."],[202.12,205.49,"Now read and listen. Science Doesn't Always Go to Plan."],[205.79,209.22,"The famous telescope was going to launch in 2007."],[210.52,214.37,"Engineers knew it would be the most powerful telescope ever built."],[215.68,218.83,"However, problems delayed the space mission for many years."],[220.12,225.59,"When it finally launched in 2021, its first telescope image amazed the world."],[226.88,230.16,"The story shows that patience is part of the scientific method."],[231.45,233.84,"Quiz time! Choose the correct answer."],[234.13,237.01,"A test of a new medicine on volunteers is a blank."],[237.31,242.04,"A, clinical trial. B, space mission. C, nanotechnology."],[246.05,248.55,"The answer is A: clinical trial."],[250.05,252.29,"I blank visit you, but my car broke down."],[252.59,256.18,"A, will. B, was going to. C, am going to."],[260.18,262.23,"The answer is B: was going to."],[263.72,265.67,"We were blank leave when the phone rang."],[265.97,269.29,"A, about to. B, going. C, would."],[273.28,275.09,"The answer is A: about to."],[276.58,280.09,"Technology using extremely tiny materials is blank."],[280.39,284.75,"A, quantum computing. B, nanotechnology. C, renewable battery."],[288.75,291.25,"The answer is B: nanotechnology."],[292.75,296.5,"According to the text, when did the telescope finally launch?"],[296.8,301.76,"A, 2007. B, 2015. C, 2021."],[305.75,308.74,"The answer is C: 2021."],[310.25,313.75,"Now it's your turn to speak. Talk about a plan you had that changed."],[319.05,325.24,"I was going to study medicine, but after an internship I realised I would be happier in engineering."],[325.54,326.94,"Excellent answer, Nita!"],[327.95,331.43,"Great work today! You learned eight new words and future in the past."],[331.73,335.55,"Today's value is curiosity. Ask questions and find out."],[335.85,338.39,"See you in Unit nineteen. Goodbye!"],[338.69,341.43,"Thank you, Mr. Daniel! Bye, everyone!"]],"OC-Upper-Intermediate-Unit19-Home-and-Lifestyle":[[0.35,4.97,"Hello, everyone! I'm Mr. Daniel. Welcome to Online Upper-Intermediate."],[5.27,8.54,"Hi! I'm Nita. Let's learn together!"],[8.84,15.48,"Unit nineteen: Home and Lifestyle. In this unit, you will discuss homes, lifestyles and comparisons."],[16.48,17.38,"minimalism."],[18.08,22.04,"minimalism means living with only the things you really need."],[22.34,24.71,"Minimalism helped her save money and time."],[25.41,27.7,"Your turn. Say: minimalism."],[30.41,31.43,"minimalism."],[32.42,33.3,"decluttering."],[34.0,36.94,"decluttering means removing things you don't need from your home."],[37.24,39.51,"Decluttering my room made me feel calmer."],[40.21,42.64,"Your turn. Say: decluttering."],[45.34,46.39,"decluttering."],[47.38,48.23,"eco-home."],[48.93,52.65,"eco-home means a house designed to have little impact on the environment."],[52.95,55.84,"Their eco-home uses rainwater and solar power."],[56.55,58.79,"Your turn. Say: eco-home."],[61.49,62.43,"eco-home."],[63.45,64.52,"tiny house."],[65.22,68.49,"tiny house means a very small, often mobile, home."],[68.79,71.38,"They live in a tiny house of twenty square metres."],[72.08,74.64,"Your turn. Say: tiny house."],[77.34,78.43,"tiny house."],[79.42,80.67,"interior design."],[81.37,84.24,"interior design means planning the inside of a building."],[84.54,86.89,"She studied interior design in Bangkok."],[87.59,90.09,"Your turn. Say: interior design."],[92.79,94.26,"interior design."],[95.25,96.13,"smart home."],[96.84,100.7,"smart home means a house where devices are controlled by phone or voice."],[101.0,103.89,"In our smart home, the lights turn on automatically."],[104.59,107.24,"Your turn. Say: smart home."],[109.94,110.97,"smart home."],[111.98,113.04,"open-plan."],[113.74,116.6,"open-plan means without walls dividing the rooms."],[116.9,119.48,"The flat has an open-plan kitchen and living room."],[120.18,122.8,"Your turn. Say: open-plan."],[125.5,126.53,"open-plan."],[127.55,128.41,"co-living."],[129.11,132.82,"co-living means sharing a home and spaces with other people."],[133.12,135.62,"Co-living is popular with young professionals."],[136.32,138.48,"Your turn. Say: co-living."],[141.18,142.02,"co-living."],[143.02,144.99,"Now let's listen to a conversation."],[145.29,149.29,"I've started decluttering my flat. The less I own, the happier I feel!"],[150.58,153.86,"That's minimalism. The more you buy, the more you have to clean."],[155.15,157.42,"I'm even thinking about a tiny house."],[158.72,162.01,"Interesting! The smaller the house, the lower the bills."],[163.32,167.12,"Exactly. I'd love an eco-home with an open-plan design."],[168.42,170.99,"The sooner you start saving, the sooner you'll have one."],[172.28,175.11,"Grammar focus: Double comparatives."],[175.41,180.01,"Use the plus comparative, the plus comparative, to show that two things change together."],[180.31,183.09,"For example: The less I own, the happier I feel."],[183.38,186.05,"A common phrase is: the sooner, the better."],[186.35,189.13,"This structure shows that two things change together."],[190.15,192.88,"Now read and listen. Less Space, More Life."],[193.18,196.26,"Around the world, more people are choosing smaller homes."],[197.55,201.06,"Supporters of minimalism say that the less you own, the freer you are."],[202.35,206.82,"Tiny houses and co-living spaces are popular with young people in big cities."],[208.12,212.08,"Eco-homes reduce energy bills by using solar power and natural light."],[213.38,216.81,"The more we think about how we live, the better choices we can make."],[218.12,220.55,"Quiz time! Choose the correct answer."],[220.85,223.27,"Living with only the things you need is blank."],[223.57,227.39,"A, minimalism. B, interior design. C, co-living."],[231.38,233.59,"The answer is A: minimalism."],[235.08,237.07,"The more you practise, blank you become."],[237.37,240.25,"A, better. B, the better. C, the best."],[244.25,245.84,"The answer is B: the better."],[247.35,249.65,"blank the weather, the more people go to the beach."],[249.95,253.11,"A, Hotter. B, The hotter. C, Hottest."],[257.12,259.11,"The answer is B: The hotter."],[260.62,263.13,"A home without walls between rooms is blank."],[263.43,266.94,"A, open-plan. B, tiny house. C, smart home."],[270.95,272.95,"The answer is A: open-plan."],[274.45,278.21,"According to the text, eco-homes reduce bills by using blank."],[278.51,283.32,"A, air conditioners. B, solar power and natural light. C, bigger windows."],[287.32,290.02,"The answer is B: solar power and natural light."],[291.52,296.08,"Now it's your turn to speak. Would you prefer a big traditional house or a small modern home?"],[301.38,308.01,"A small modern home. The smaller the space, the less time I spend cleaning and the more I can enjoy life."],[308.31,309.51,"Excellent answer, Nita!"],[310.52,314.39,"Great work today! You learned eight new words and double comparatives."],[314.69,317.93,"Today's value is good habits. Do good things every day."],[318.23,320.42,"See you in Unit twenty. Goodbye!"],[320.72,323.35,"Thank you, Mr. Daniel! Bye, everyone!"]],"OC-Upper-Intermediate-Unit20-Social-Responsibility":[[0.35,4.84,"Hello, everyone! I'm Mr. Daniel. Welcome to Online Upper-Intermediate."],[5.14,8.46,"Hi! I'm Nita. Let's learn together!"],[8.76,15.88,"Unit twenty: Social Responsibility. In this unit, you will discuss how businesses and people help society."],[16.88,18.93,"corporate social responsibility."],[19.63,24.74,"corporate social responsibility means a company's duty to help society and the environment."],[25.04,28.91,"The bank's corporate social responsibility programme builds schools."],[29.61,32.82,"Your turn. Say: corporate social responsibility."],[35.52,37.58,"corporate social responsibility."],[38.58,39.52,"philanthropy."],[40.22,43.43,"philanthropy means giving money and time to help other people."],[43.73,46.28,"His philanthropy funded three hospitals."],[46.98,49.33,"Your turn. Say: philanthropy."],[52.03,53.08,"philanthropy."],[54.08,55.53,"social enterprise."],[56.23,60.48,"social enterprise means a business whose main goal is to help society."],[60.78,63.95,"The café is a social enterprise that trains young people."],[64.65,67.36,"Your turn. Say: social enterprise."],[70.06,71.55,"social enterprise."],[72.55,73.47,"fair trade."],[74.17,77.47,"fair trade means trade that pays producers a fair price."],[77.77,80.58,"This coffee is fair trade, so farmers earn more."],[81.28,84.17,"Your turn. Say: fair trade."],[86.87,87.84,"fair trade."],[88.85,90.11,"ethical business."],[90.81,94.47,"ethical business means a company that acts honestly and responsibly."],[94.77,97.67,"Customers prefer to buy from an ethical business."],[98.37,101.13,"Your turn. Say: ethical business."],[103.83,105.2,"ethical business."],[106.22,107.25,"volunteerism."],[107.95,111.61,"volunteerism means the practice of doing unpaid work to help others."],[111.91,114.92,"Volunteerism is growing among Cambodian students."],[115.62,117.84,"Your turn. Say: volunteerism."],[120.55,121.66,"volunteerism."],[122.65,123.78,"charity work."],[124.48,127.52,"charity work means work done to help people in need."],[127.82,130.39,"She does charity work at an orphanage on weekends."],[131.09,133.67,"Your turn. Say: charity work."],[136.37,137.54,"charity work."],[138.55,139.89,"community outreach."],[140.59,144.53,"community outreach means programmes that bring services to local people."],[144.83,148.01,"The hospital's community outreach team visits villages."],[148.71,151.59,"Your turn. Say: community outreach."],[154.29,155.77,"community outreach."],[156.78,158.68,"Now let's listen to a conversation."],[158.98,162.7,"I'm considering working for a social enterprise after graduation."],[163.98,166.66,"That's admirable. Do you mind telling me why?"],[167.95,172.15,"I'd like to avoid working only for profit. I want to make a difference."],[173.45,177.16,"Many companies now invest in corporate social responsibility too."],[178.45,183.05,"True, but I prefer helping directly, like through community outreach."],[184.35,187.44,"Then you might enjoy combining a job with some charity work."],[188.75,192.55,"Grammar focus: Gerunds and infinitives (advanced)."],[192.85,195.05,"Some verbs change meaning with -ing or to."],[195.35,200.59,"Remember plus -ing is about a past memory; remember plus to is about something you must do."],[200.88,205.95,"For example: I remember volunteering at the orphanage. Remember to donate before Friday."],[206.25,210.7,"Some verbs change meaning depending on whether they are followed by -ing or to + verb."],[211.72,214.43,"Now read and listen. Business with a Purpose."],[214.73,217.76,"More and more young people want to work for an ethical business."],[219.05,223.07,"Social enterprises try to make a profit while solving social problems."],[224.38,229.06,"Many large companies have stopped seeing corporate social responsibility as just marketing."],[230.35,234.16,"Fair trade products help farmers earn enough to send their children to school."],[235.45,239.12,"Philanthropy and volunteerism remind us that everyone can contribute."],[240.42,242.76,"Quiz time! Choose the correct answer."],[243.06,245.83,"Trade that pays producers a fair price is blank."],[246.13,250.02,"A, fair trade. B, philanthropy. C, volunteerism."],[254.02,256.04,"The answer is A: fair trade."],[257.55,259.81,"Please remember blank the door when you leave."],[260.11,262.96,"A, locking. B, to lock. C, lock."],[266.95,269.02,"The answer is B: to lock."],[270.52,273.43,"I'll never forget blank the Angkor sunrise for the first time."],[273.73,276.76,"A, seeing. B, to see. C, see."],[280.75,282.66,"The answer is A: seeing."],[284.15,287.43,"A business whose main goal is to help society is a blank."],[287.73,292.34,"A, social enterprise. B, community outreach. C, charity work."],[296.35,298.73,"The answer is A: social enterprise."],[300.22,303.39,"According to the text, fair trade helps farmers to blank."],[303.69,308.17,"A, buy cars. B, send their children to school. C, travel abroad."],[312.15,314.96,"The answer is B: send their children to school."],[316.45,320.77,"Now it's your turn to speak. Should companies be responsible for helping society?"],[326.07,333.46,"Yes. I'd like companies to stop focusing only on profit and start investing in education and the environment."],[333.76,335.21,"Excellent answer, Nita!"],[336.22,340.55,"Great work today! You learned eight new words and gerunds and infinitives (advanced)."],[340.85,344.14,"Today's value is community. Help the people in your town."],[344.44,346.98,"See you in Unit twenty-one. Goodbye!"],[347.28,349.86,"Thank you, Mr. Daniel! Bye, everyone!"]],"OC-Upper-Intermediate-Unit21-Workplace-Communication":[[0.35,5.04,"Hello, everyone! I'm Mr. Daniel. Welcome to Online Upper-Intermediate."],[5.34,8.35,"Hi! I'm Nita. Let's learn together!"],[8.65,14.51,"Unit twenty-one: Workplace Communication. In this unit, you will use formal and informal language at work."],[15.52,16.43,"agenda."],[17.12,20.46,"agenda means a list of topics to discuss at a meeting."],[20.76,22.96,"Let's look at the first item on the agenda."],[23.66,26.08,"Your turn. Say: agenda."],[28.78,29.7,"agenda."],[30.68,31.5,"minutes."],[32.2,34.96,"minutes means a written record of what was said at a meeting."],[35.26,36.79,"Could you take the minutes today?"],[37.49,39.72,"Your turn. Say: minutes."],[42.42,43.4,"minutes."],[44.42,45.43,"feedback loop."],[46.13,49.91,"feedback loop means a regular process of giving and using feedback."],[50.2,52.59,"A quick feedback loop helps the team improve."],[53.29,55.74,"Your turn. Say: feedback loop."],[58.44,59.64,"feedback loop."],[60.65,61.76,"conference call."],[62.46,65.73,"conference call means a phone or video call with several people."],[66.03,68.67,"We have a conference call with the Singapore office."],[69.37,72.01,"Your turn. Say: conference call."],[74.71,76.05,"conference call."],[77.05,77.8,"memo."],[78.5,81.39,"memo means a short official note sent inside a company."],[81.69,84.09,"The manager sent a memo about the new policy."],[84.8,86.59,"Your turn. Say: memo."],[89.29,90.19,"memo."],[91.18,92.32,"prioritise."],[93.02,96.3,"prioritise means to decide which tasks are most important."],[96.6,99.2,"You need to prioritise your tasks this week."],[99.9,102.44,"Your turn. Say: prioritise."],[105.14,106.19,"prioritise."],[107.18,108.01,"workflow."],[108.71,111.06,"workflow means the order in which work is done."],[111.36,113.4,"The new software improved our workflow."],[114.1,116.51,"Your turn. Say: workflow."],[119.21,120.41,"workflow."],[121.42,123.39,"follow-up email."],[124.09,128.47,"follow-up email means an email sent after a meeting to confirm details."],[128.77,131.14,"I'll send a follow-up email this afternoon."],[131.84,134.72,"Your turn. Say: follow-up email."],[137.42,139.59,"follow-up email."],[140.58,142.66,"Now let's listen to a conversation."],[142.96,146.46,"Nita, could you circulate the agenda before the conference call?"],[147.75,150.73,"Of course. Shall I also take the minutes?"],[152.02,155.73,"That would be great, thanks. Please prioritise the budget item."],[157.02,161.17,"No problem. Should I send a follow-up email afterwards?"],[162.48,166.17,"Yes, please. Just a short memo summarising the decisions."],[167.48,170.02,"Sure thing! I'll get it done by five."],[171.32,174.92,"Grammar focus: Formal vs informal language."],[175.22,179.03,"At work, we choose formal or informal language depending on the person."],[179.33,184.4,"Formal: I would be grateful if you could send the report. Informal: Can you send me the report?"],[184.7,187.69,"Use formal language with clients and senior managers."],[187.99,193.27,"Choose formal language for clients and senior managers, and informal language for close colleagues."],[194.28,196.84,"Now read and listen. Meetings That Work."],[197.14,199.75,"Many employees say that meetings waste their time."],[201.05,204.33,"A clear agenda, sent in advance, helps everyone prepare."],[205.62,208.99,"Someone should take the minutes, so decisions are not forgotten."],[210.28,214.49,"After the meeting, a short follow-up email confirms who will do what."],[215.78,218.9,"A good feedback loop keeps the workflow moving smoothly."],[220.18,222.6,"Quiz time! Choose the correct answer."],[222.9,224.98,"A written record of a meeting is the blank."],[225.28,228.17,"A, agenda. B, minutes. C, memo."],[232.18,233.89,"The answer is B: minutes."],[235.38,236.65,"Which is more formal?"],[236.95,241.67,"A, Can you help me?. B, I would be grateful if you could help me.. C, Help me, please!."],[245.68,248.54,"The answer is B: I would be grateful if you could help me.."],[250.05,252.77,"'Please find attached ...' is used in blank emails."],[253.07,256.31,"A, informal. B, formal. C, text."],[260.32,262.11,"The answer is B: formal."],[263.62,266.65,"To decide which tasks are most important is to blank."],[266.95,270.35,"A, prioritise. B, workflow. C, memo."],[274.35,276.64,"The answer is A: prioritise."],[278.15,281.11,"According to the text, what ntemporary art scene is growing quickly."],[203.15,207.39,"Young painters, composers and playwrights are telling new stories about modern life."],[208.68,212.72,"A choreographer in Phnom Penh mixes classical Apsara with hip-hop."],[214.02,217.17,"Art critics say the results are absolutely fascinating."],[218.45,222.81,"Exhibition halls and small galleries now host shows almost every weekend."],[224.12,226.62,"Quiz time! Choose the correct answer."],[226.92,229.06,"A person who writes plays is a blank."],[229.36,233.49,"A, composer. B, playwright. C, choreographer."],[237.48,239.17,"The answer is B: playwright."],[240.68,242.09,"The view was blank amazing."],[242.39,245.53,"A, very. B, absolutely. C, fairly."],[249.55,251.56,"The answer is B: absolutely."],[253.05,255.74,"The film was blank good, but not great."],[256.04,259.71,"A, absolutely. B, fairly. C, completely."],[263.72,265.79,"The answer is B: fairly."],[267.28,270.1,"A time when you can't think of new ideas is blank."],[270.4,274.68,"A, installation. B, creative block. C, contemporary."],[278.68,281.0,"The answer is B: creative block."],[282.48,286.51,"According to the text, the choreographer mixes Apsara with blank."],[286.81,290.9,"A, ballet. B, hip-hop. C, folk dance."],[294.88,296.63,"The answer is B: hip-hop."],[298.12,302.13,"Now it's your turn to speak. Describe an artwork, film or show that impressed you."],[307.43,314.51,"The light installation at the museum was absolutely breathtaking. I found it completely different from anything I'd seen."],[314.81,316.41,"Excellent answer, Nita!"],[317.42,322.65,"Great work today! You learned eight new words and adverbs of degree and extreme adjectives."],[322.95,326.6,"Today's value is creativity. Use your imagination when you play."],[326.9,330.4,"See you in Unit twenty-three. Goodbye!"],[330.7,333.41,"Thank you, Mr. Daniel! Bye, everyone!"]],"OC-Upper-Intermediate-Unit23-Health-Systems":[[0.35,4.71,"Hello, everyone! I'm Mr. Daniel. Welcome to Online Upper-Intermediate."],[5.01,8.23,"Hi! I'm Nita. Let's learn together!"],[8.54,15.31,"Unit twenty-three: Health Systems. In this unit, you will discuss healthcare and speculate about the past."],[16.32,17.19,"healthcare."],[17.89,20.75,"healthcare means medical services provided to people."],[21.05,23.55,"Good healthcare should be available to everyone."],[24.25,26.86,"Your turn. Say: healthcare."],[29.57,30.54,"healthcare."],[31.55,32.74,"public hospital."],[33.44,35.92,"public hospital means a hospital run by the government."],[36.22,38.43,"Treatment at the public hospital is cheaper."],[39.13,41.69,"Your turn. Say: public hospital."],[44.39,45.68,"public hospital."],[46.68,47.68,"private clinic."],[48.38,52.1,"private clinic means a clinic run by a company, where patients pay more."],[52.4,54.99,"She went to a private clinic for faster treatment."],[55.69,58.5,"Your turn. Say: private clinic."],[61.2,62.37,"private clinic."],[63.38,64.87,"health insurance plan."],[65.57,69.37,"health insurance plan means an arrangement that pays your medical costs."],[69.67,71.98,"Our company offers a health insurance plan."],[72.68,75.74,"Your turn. Say: health insurance plan."],[78.44,80.02,"health insurance plan."],[81.02,81.92,"epidemic."],[82.62,85.91,"epidemic means a disease that spreads quickly in one area."],[86.21,88.96,"There was a dengue epidemic last year."],[89.66,91.84,"Your turn. Say: epidemic."],[94.54,95.56,"epidemic."],[96.55,97.44,"pandemic."],[98.13,102.12,"pandemic means a disease that spreads across many countries."],[102.42,104.33,"The pandemic changed how we work."],[105.03,107.26,"Your turn. Say: pandemic."],[109.96,110.97,"pandemic."],[111.98,113.11,"vaccination."],[113.81,117.36,"vaccination means giving a vaccine to protect against disease."],[117.66,120.1,"Vaccination saved millions of lives."],[120.8,123.18,"Your turn. Say: vaccination."],[125.88,126.89,"vaccination."],[127.88,128.87,"outbreak."],[129.57,132.18,"outbreak means the sudden start of a disease."],[132.48,134.63,"Health workers stopped the outbreak quickly."],[135.33,137.68,"Your turn. Say: outbreak."],[140.38,141.38,"outbreak."],[142.38,144.48,"Now let's listen to a conversation."],[144.78,147.17,"Did you hear about the outbreak in the next province?"],[148.48,153.19,"Yes. It must have started in the rainy season, because of mosquitoes."],[154.48,157.56,"The village clinic can't have been ready for so many patients."],[158.85,161.8,"They might have sent people to the public hospital in the city."],[163.12,166.27,"Luckily, the vaccination campaign has started now."],[167.55,170.33,"Good. It could have become an epidemic without it."],[171.62,174.17,"Grammar focus: Speculating about the past."],[174.47,178.11,"Use must have, might have and can't have to speculate about the past."],[178.41,183.72,"Must have means you're sure; might have means it's possible; can't have means you're sure it didn't happen."],[184.02,186.87,"For example: It must have spread through mosquitoes."],[187.17,191.65,"Could have can also mean something was possible but didn't happen: It could have been worse."],[192.65,195.56,"Now read and listen. Lessons from the Pandemic."],[195.86,199.96,"The pandemic showed how important strong healthcare systems are."],[201.25,205.06,"Countries with good public hospitals must have saved many lives."],[206.35,210.45,"In some places, private clinics could have helped more if they had worked together."],[211.75,215.55,"Vaccination campaigns were the key to stopping new outbreaks."],[216.85,220.5,"Experts say that preparing for the next epidemic must start now."],[221.78,224.19,"Quiz time! Choose the correct answer."],[224.49,227.71,"A disease that spreads across many countries is a blank."],[228.01,231.41,"A, pandemic. B, epidemic. C, outbreak."],[235.42,237.73,"The answer is A: pandemic."],[239.22,242.15,"The streets are wet. It blank rained last night."],[242.45,246.31,"A, must have. B, can't have. C, should have."],[250.32,252.35,"The answer is A: 38,178.11,"Use the third conditional to imagine a different past and its result."],[178.41,181.05,"Use wish plus past perfect to express regret."],[181.35,186.94,"For example: If she had done research, she would have chosen better. I wish I had accepted the offer."],[187.24,190.69,"Contracted forms are common in speech: If I'd known, I'd have helped."],[191.68,194.66,"Now read and listen. What Founders Wish They'd Known."],[194.96,197.9,"Most new ventures fail within their first five years."],[199.22,202.7,"Many founders say they wish they had done more market research."],[204.02,207.15,"Others admit that their business model wasn't clear enough."],[208.45,212.63,"If they had found an angel investor earlier, some could have scaled up successfully."],[213.92,218.19,"Learning from these stories can help new entrepreneurs grow their revenue faster."],[219.48,221.99,"Quiz time! Choose the correct answer."],[222.28,224.76,"Money needed to start a business is blank."],[225.06,228.53,"A, revenue. B, start-up capital. C, venture."],[232.52,234.56,"The answer is B: start-up capital."],[236.05,238.21,"If I blank harder, I would have passed."],[238.51,241.9,"A, studied. B, had studied. C, would study."],[245.88,247.87,"The answer is B: had studied."],[249.38,252.56,"I wish I blank that job. It was a great opportunity."],[252.86,255.59,"A, took. B, had taken. C, take."],[259.58,261.42,"The answer is B: had taken."],[262.92,265.5,"Raising money from many people online is blank."],[265.8,269.95,"A, crowdfunding. B, market research. C, scale up."],[273.95,276.23,"The answer is A: crowdfunding."],[277.72,281.58,"According to the text, many founders wish they had done more blank."],[281.88,285.77,"A, advertising. B, market research. C, travelling."],[289.78,292.35,"The answer is B: market research."],[293.85,298.51,"Now it's your turn to speak. Is there a decision you regret? What would have happened differently?"],[303.81,309.42,"If I had started learning English earlier, I would have had more job opportunities after university."],[309.72,311.19,"Excellent answer, Nita!"],[312.18,316.12,"Great work today! You learned eight new words and third conditional and regrets."],[316.42,320.05,"Today's value is hard work. Work hard and never give up."],[320.35,323.33,"See you in Unit twenty-five. Goodbye!"],[323.63,326.55,"Thank you, Mr. Daniel! Bye, everyone!"]],"OC-Upper-Intermediate-Unit25-Transport-of-the-Future":[[0.35,5.13,"Hello, everyone! I'm Mr. Daniel. Welcome to Online Upper-Intermediate."],[5.43,8.41,"Hi! I'm Nita. Let's learn together!"],[8.71,15.16,"Unit twenty-five: Transport of the Future. In this unit, you will make predictions about transport and cities."],[16.15,17.5,"autonomous car."],[18.2,22.07,"autonomous car means a car that drives itself without a human driver."],[22.37,25.18,"Autonomous cars are being tested in many cities."],[25.88,28.54,"Your turn. Say: autonomous car."],[31.24,32.66,"autonomous car."],[33.65,34.91,"high-speed rail."],[35.61,40.66,"high-speed rail means trains that travel at over 250 km per hour."],[40.96,44.34,"High-speed rail connects Tokyo and Osaka in two hours."],[45.04,47.63,"Your turn. Say: high-speed rail."],[50.34,51.89,"high-speed rail."],[52.88,53.79,"hyperloop."],[54.49,59.21,"hyperloop means a proposed transport system using pods in low-pressure tubes."],[59.51,61.91,"The hyperloop could travel faster than a plane."],[62.61,64.78,"Your turn. Say: hyperloop."],[67.48,68.4,"hyperloop."],[69.38,70.51,"electric scooter."],[71.21,74.65,"electric scooter means a small electric vehicle you stand on."],[74.95,77.57,"Electric scooters are popular with students."],[78.27,81.25,"Your turn. Say: electric scooter."],[83.95,85.39,"electric scooter."],[86.38,87.4,"car sharing."],[88.1,91.62,"car sharing means renting cars for short periods from a shared group."],[91.92,94.84,"Car sharing reduces the number of cars on the road."],[95.55,97.72,"Your turn. Say: car sharing."],[100.42,101.48,"car sharing."],[102.48,103.74,"congestion charge."],[104.44,108.19,"congestion charge means a fee for driving into a busy city centre."],[108.49,111.78,"London introduced a congestion charge in 2003."],[112.48,115.2,"Your turn. Say: congestion charge."],[117.9,119.25,"congestion charge."],[120.25,121.16,"cycle lane."],[121.86,124.97,"cycle lane means a part of the road only for bicycles."],[125.27,128.11,"The city built new cycle lanes along the river."],[128.81,131.1,"Your turn. Say: cycle lane."],[133.8,135.06,"cycle lane."],[136.05,137.04,"flying taxi."],[137.74,142.2,"flying taxi means a small electric aircraft carrying passengers in cities."],[142.5,145.73,"Flying taxis may appear in some cities within ten years."],[146.43,148.76,"Your turn. Say: flying taxi."],[151.46,152.67,"flying taxi."],[153.68,155.61,"Now let's listen to a conversation."],[155.91,158.68,"Do you think autonomous cars will replace taxis?"],[159.98,163.38,"They're likely to, but probably not for another twenty years."],[164.68,167.85,"What about high-speed rail in Southeast Asia?"],[169.15,172.71,"It's bound to expand. Several projects are already planned."],[174.02,175.62,"And flying taxis?"],[176.92,181.65,"They're unlikely to be cheap at first, but cycle lanes and electric scooters will definitely grow."],[182.95,185.53,"Grammar focus: Making predictions."],[185.83,189.04,"Use different expressions to show how certain your prediction is."],[189.34,193.71,"Bound to means almost certain; likely to means probable; may well means possible."],[194.0,199.45,"For example: Traffic is bound to get worse, and electric cars are likely to become cheaper."],[199.75,203.67,"These expressions show how sure you are, from almost certain to just possible."],[204.68,208.32,"Now read and listen. How Will We Travel in 2050?."],[208.62,213.92,"Experts agree that transport is likely to change more in the next thirty years than in the last hundred."],[215.22,218.24,"Autonomous cars are bound to become common on motorways."],[219.55,223.49,"Many cities may well introduce a congestion charge to reduce traffic."],[224.78,229.16,"Cycle lanes and electric scooters are likely to replace short car journeys."],[230.45,234.89,"Hyperloops and flying taxis are exciting, but they are unlikely to be cheap at first."],[236.18,238.39,"Quiz time! Choose the correct answer."],[238.69,240.83,"A car that drives itself is an blank."],[241.13,245.41,"A, autonomous car. B, electric scooter. C, flying taxi."],[249.42,251.54,"The answer is A: autonomous car."],[253.05,255.55,"Prices blank rise next year; they always do."],[255.85,259.83,"A, are bound to. B, are unlikely to. C, may well not."],[263.82,265.49,"The answer is A: are bound to."],[266.98,269.74,"It's blank to rain today. The sky is clear."],[270.04,272.94,"A, bound. B, likely. C, unlikely."],[276.95,278.61,"The answer is C: unlikely."],[280.12,283.36,"A fee for driving into a busy city centre is a blank."],[283.66,287.71,"A, cycle lane. B, congestion charge. C, car sharing."],[291.72,294.54,"The answer is B: congestion charge."],[296.05,299.23,"According to the text, what will replace short car journeys?"],[299.53,304.98,"A, hyperloops. B, cycle lanes and electric scooters. C, flying taxis."],[308.98,312.05,"The answer is B: cycle lanes and electric scooters."],[313.55,318.22,"Now it's your turn to speak. How do you think people in your city will travel in 2050?"],[323.52,329.91,"Most people are likely to use electric vehicles, and the city is bound to build a metro or more cycle lanes."],[330.21,331.71,"Excellent answer, Nita!"],[332.72,336.47,"Great work today! You learned eight new words and making predictions."],[336.77,340.86,"Today's value is caring for nature. Care for plants, birds and our planet."],[341.16,344.07,"See you in Unit twenty-six. Goodbye!"],[344.37,347.11,"Thank you, Mr. Daniel! Bye, everyone!"]],"OC-Upper-Intermediate-Unit26-Sustainable-Tourism":[[0.35,4.9,"Hello, everyone! I'm Mr. Daniel. Welcome to Online Upper-Intermediate."],[5.2,8.43,"Hi! I'm Nita. Let's learn together!"],[8.73,15.33,"Unit twenty-six: Sustainable Tourism. In this unit, you will discuss responsible travel and its impact."],[16.32,17.33,"overtourism."],[18.03,21.77,"overtourism means too many tourists in one place, causing problems."],[22.07,24.8,"Overtourism has damaged some beaches in Thailand."],[25.5,27.85,"Your turn. Say: overtourism."],[30.55,31.62,"overtourism."],[32.62,33.77,"ecotourist."],[34.47,38.26,"ecotourist means a tourist who travels in a way that protects nature."],[38.56,41.24,"Ecotourists often stay with local families."],[41.94,44.35,"Your turn. Say: ecotourist."],[47.05,48.13,"ecotourist."],[49.12,50.19,"carbon offset."],[50.89,55.44,"carbon offset means paying to reduce carbon somewhere else to balance your emissions."],[55.74,57.86,"She bought a carbon offset for her flight."],[58.56,60.98,"Your turn. Say: carbon offset."],[63.68,65.0,"carbon offset."],[66.02,67.34,"responsible travel."],[68.04,72.6,"responsible travel means travelling in a way that respects people and the environment."],[72.9,75.95,"Responsible travel means respecting local customs."],[76.65,79.39,"Your turn. Say: responsible travel."],[82.09,83.62,"responsible travel."],[84.62,85.87,"tourist footprint."],[86.57,90.13,"tourist footprint means the environmental impact of tourists."],[90.43,93.01,"Hotels are trying to reduce their tourist footprint."],[93.71,96.12,"Your turn. Say: tourist footprint."],[98.82,100.17,"tourist footprint."],[101.15,102.44,"nature reserve."],[103.14,106.71,"nature reserve means an area where wildlife and plants are protected."],[107.01,109.81,"The Prek Toal nature reserve is home to rare birds."],[110.51,113.34,"Your turn. Say: nature reserve."],[116.03,117.41,"nature reserve."],[118.42,120.0,"wildlife sanctuary."],[120.7,124.03,"wildlife sanctuary means a safe place for wild animals."],[124.33,127.06,"The wildlife sanctuary rescues sun bears."],[127.76,130.51,"Your turn. Say: wildlife sanctuary."],[133.21,134.88,"wildlife sanctuary."],[135.88,137.2,"conservation area."],[137.9,141.82,"conservation area means land protected because of its natural value."],[142.12,145.31,"Visitors must follow strict rules in the conservation area."],[146.01,148.73,"Your turn. Say: conservation area."],[151.43,152.94,"conservation area."],[153.95,156.01,"Now let's listen to a conversation."],[156.31,158.91,"Have you ever visited a wildlife sanctuary, Nita?"],[160.22,165.57,"Yes, the one in Mondulkiri. Visitors are asked to be recorded in a guest book first."],[166.88,170.85,"Interesting. Overtourism is a big problem in some places."],[172.15,176.26,"Exactly. Animals don't like being disturbed by large groups."],[177.55,179.78,"As an ecotourist, what do you do differently?"],[181.08,185.72,"I try to reduce my tourist footprint, and I always buy a carbon offset for flights."],[187.02,190.13,"Grammar focus: Passive infinitives and gerunds."],[190.43,197.17,"The passive infinitive is to be plus past participle. The passive gerund is being plus past participle."],[197.47,202.24,"For example: Wildlife needs to be protected. Animals don't like being disturbed."],[202.53,205.28,"Choose the form that the first verb normally takes."],[205.58,212.71,"Use the passive infinitive after verbs like need, want, expect; use the passive gerund after like, hate, avoid, enjoy."],[213.72,216.45,"Now read and listen. Travelling Without Harm."],[216.75,221.94,"Tourism brings money to many communities, but overtourism can damage the places people love."],[223.25,227.12,"Fragile areas need to be protected from large crowds and pollution."],[228.42,232.62,"Responsible travel means choosing local guides and respecting customs."],[233.92,238.69,"Many ecotourists prefer being taken to small nature reserves instead of busy resorts."],[239.98,244.86,"Every traveller can reduce their tourist footprint with small, thoughtful choices."],[246.15,248.71,"Quiz time! Choose the correct answer."],[249.01,251.15,"Too many tourists in one place is blank."],[251.45,255.41,"A, overtourism. B, ecotourist. C, carbon offset."],[259.42,261.56,"The answer is A: overtourism."],[263.05,265.78,"The temple needs blank before more damage happens."],[266.08,270.35,"A, to repair. B, to be repaired. C, repairing."],[274.35,276.3,"The answer is B: to be repaired."],[277.82,279.28,"Nobody likes blank at."],[279.58,282.84,"A, laughing. B, being laughed. C, to laugh."],[286.85,288.64,"The answer is B: being laughed."],[290.15,292.66,"A safe place for wild animals is a blank."],[292.96,297.77,"A, wildlife sanctuary. B, tourist footprint. C, responsible travel."],[301.78,304.19,"The answer is A: wildlife sanctuary."],[305.68,308.87,"According to the text, what can damage places people love?"],[309.17,313.57,"A, local guides. B, overtourism. C, nature reserves."],[317.58,319.71,"The answer is B: overtourism."],[321.22,325.66,"Now it's your turn to speak. How can tourists travel more responsibly in Cambodia?"],[330.96,336.94,"Tourists should stay in homestays, hire local guides, and avoid being part of huge crowds at the temples."],[337.24,338.84,"Excellent answer, Nita!"],[339.85,344.53,"Great work today! You learned eight new words and passive infinitives and gerunds."],[344.83,348.8,"Today's value is caring for nature. Care for plants, birds and our planet."],[349.1,352.31,"See you in Unit twenty-seven. Goodbye!"],[352.61,355.23,"Thank you, Mr. Daniel! Bye, everyone!"]],"OC-Upper-Intermediate-Unit27-Privacy-in-the-Digital-Age":[[0.35,4.75,"Hello, everyone! I'm Mr. Daniel. Welcome to Online Upper-Intermediate."],[5.05,8.17,"Hi! I'm Nita. Let's learn together!"],[8.47,15.18,"Unit twenty-seven: Privacy in the Digital Age. In this unit, you will discuss surveillance, data and digital rights."],[16.18,17.43,"facial recognition."],[18.13,22.33,"facial recognition means technology that identifies people from their faces."],[22.63,25.53,"Some airports use facial recognition at the gates."],[26.23,29.16,"Your turn. Say: facial recognition."],[31.86,33.22,"facial recognition."],[34.22,35.31,"data protection."],[36.01,40.08,"data protection means laws and actions that keep personal information safe."],[40.38,42.6,"Europe has strict data protection laws."],[43.3,46.3,"Your turn. Say: data protection."],[49.0,50.21,"data protection."],[51.22,52.11,"consent."],[52.81,55.32,"consent means permission for something to happen."],[55.62,58.78,"Apps should ask for your consent before using your location."],[59.48,61.59,"Your turn. Say: consent."],[64.29,65.26,"consent."],[66.25,67.23,"encryption."],[67.93,71.42,"encryption means changing information into a secret code."],[71.72,74.53,"Messaging apps use encryption to protect chats."],[75.23,77.5,"Your turn. Say: encryption."],[80.19,81.24,"encryption."],[82.25,83.08,"tracking."],[83.78,86.73,"tracking means recording where people go or what they do online."],[87.03,89.84,"Website tracking follows you from page to page."],[90.54,92.86,"Your turn. Say: tracking."],[95.56,96.35,"tracking."],[97.35,98.55,"targeted ads."],[99.25,102.9,"targeted ads means advertisements chosen for you based on your data."],[103.2,105.94,"I see targeted ads for shoes after searching online."],[106.64,109.42,"Your turn. Say: targeted ads."],[112.12,113.36,"targeted ads."],[114.35,115.48,"cyber attack."],[116.18,120.72,"cyber attack means an attempt to damage or steal from computer systems."],[121.02,123.3,"The hospital was hit by a cyber attack."],[124.0,126.2,"Your turn. Say: cyber attack."],[128.9,130.31,"cyber attack."],[131.32,132.64,"privacy policy."],[133.34,137.22,"privacy policy means a document explaining how a company uses your data."],[137.52,140.8,"Nobody reads the privacy policy before clicking accept."],[141.5,144.38,"Your turn. Say: privacy policy."],[147.08,148.61,"privacy policy."],[149.62,151.71,"Now let's listen to a conversation."],[152.01,155.51,"I keep seeing targeted ads for things I only talked about!"],[156.82,160.57,"Tracking is everywhere. Did you read the app's privacy policy?"],[161.88,165.87,"No. I just clicked accept. I admit not reading it."],[167.18,171.82,"Most people do the same. Companies are accused of collecting data without real consent."],[173.12,176.57,"My friend refused to use facial recognition at her bank."],[177.88,181.66,"Wise. I'd recommend turning on encryption and checking your settings."],[182.95,186.7,"Grammar focus: Verb patterns with reporting verbs."],[187.0,189.58,"Many reporting verbs have their own patterns."],[189.88,192.86,"Accuse someone of doing, recommend doing, refuse to do."],[193.16,198.57,"For example: They accused the company of selling data, and experts recommend using encryption."],[198.87,204.32,"Some reporting verbs need a preposition: accuse of, blame for, apologise for, insist on."],[205.32,207.88,"Now read and listen. Who Owns Your Data?."],[208.18,211.79,"Every time we go online, our actions create valuable data."],[213.08,217.14,"Companies use tracking to show us targeted ads and predict our choices."],[218.45,222.25,"Critics accuse some tech firms of collecting data without clear consent."],[223.55,227.42,"Governments have introduced data protection laws to give people more control."],[228.72,233.64,"Experts recommend reading the privacy policy and using encryption whenever possible."],[234.95,237.31,"Quiz time! Choose the correct answer."],[237.61,239.68,"Permission for something to happen is blank."],[239.98,243.5,"A, consent. B, tracking. C, encryption."],[247.48,249.48,"The answer is A: consent."],[250.98,252.51,"They accused him blank the money."],[252.81,256.26,"A, to steal. B, of stealing. C, for steal."],[260.25,262.2,"The answer is B: of stealing."],[263.72,266.61,"I recommend blank two-step verification."],[266.91,270.02,"A, to use. B, using. C, use."],[274.02,275.54,"The answer is B: using."],[277.05,280.06,"Changing information into a secret code is blank."],[280.36,284.37,"A, facial recognition. B, encryption. C, cyber attack."],[288.38,290.09,"The answer is B: encryption."],[291.58,295.96,"According to the text, why have governments introduced data protection laws?"],[296.26,301.29,"A, to sell data. B, to give people more control. C, to stop the internet."],[305.28,308.47,"The answer is B: to give people more control."],[309.98,314.39,"Now it's your turn to speak. Are you worried about your privacy online? Why?"],[319.69,327.57,"Yes. Many apps are accused of tracking us, so I recommend checking privacy settings and refusing unnecessary permissions."],[327.87,329.38,"Excellent answer, Nita!"],[330.38,335.07,"Great work today! You learned eight new words and verb patterns with reporting verbs."],[335.37,339.73,"Today's value is online safety. Keep your password secret and be kind online."],[340.03,342.83,"See you in Unit twenty-eight. Goodbye!"],[343.13,345.69,"Thank you, Mr. Daniel! Bye, everyone!"]],"OC-Upper-Intermediate-Unit28-Emotional-Intelligence":[[0.35,5.01,"Hello, everyone! I'm Mr. Daniel. Welcome to Online Upper-Intermediate."],[5.31,8.49,"Hi! I'm Nita. Let's learn together!"],[8.79,16.14,"Unit twenty-eight: Emotional Intelligence. In this unit, you will discuss emotions and reflect on past behaviour."],[17.15,18.43,"self-awareness."],[19.13,22.79,"self-awareness means understanding your own feelings and behaviour."],[23.09,26.16,"Self-awareness helps you improve your relationships."],[26.86,29.37,"Your turn. Say: self-awareness."],[32.07,33.49,"self-awareness."],[34.48,35.98,"emotional intelligence."],[36.68,40.99,"emotional intelligence means the ability to understand and manage emotions."],[41.29,43.66,"Good leaders have high emotional intelligence."],[44.37,47.13,"Your turn. Say: emotional intelligence."],[49.83,51.48,"emotional intelligence."],[52.48,53.59,"self-control."],[54.29,57.83,"self-control means the ability to control your actions and feelings."],[58.13,60.82,"It takes self-control not to shout when you're angry."],[61.52,64.05,"Your turn. Say: self-control."],[66.75,67.99,"self-control."],[68.98,70.22,"social skills."],[70.92,74.7,"social skills means the ability to communicate well with others."],[75.0,78.06,"Team sports help children develop social skills."],[78.76,81.44,"Your turn. Say: social skills."],[84.14,85.76,"social skills."],[86.75,88.08,"conflict resolution."],[88.78,92.32,"conflict resolution means ending a disagreement in a peaceful way."],[92.62,95.28,"The course teaches conflict resolution at work."],[95.98,99.25,"Your turn. Say: conflict resolution."],[101.95,103.55,"conflict resolution."],[104.55,105.91,"burnout recovery."],[106.61,110.78,"burnout recovery means the process of getting well after extreme work stress."],[111.08,113.48,"Burnout recovery can take several months."],[114.18,116.83,"Your turn. Say: burnout recovery."],[119.53,120.8,"burnout recovery."],[121.78,122.69,"gratitude."],[123.39,125.84,"gratitude means the feeling of being thankful."],[126.14,128.97,"Writing three things you're grateful for builds gratitude."],[129.67,132.33,"Your turn. Say: gratitude."],[135.03,136.14,"gratitude."],[137.15,138.19,"vulnerability."],[138.89,142.24,"vulnerability means being open about your feelings and weaknesses."],[142.54,144.88,"Showing vulnerability can build trust."],[145.58,148.01,"Your turn. Say: vulnerability."],[150.71,151.89,"vulnerability."],[152.88,154.96,"Now let's listen to a conversation."],[155.26,158.71,"I shouted at a colleague yesterday. I shouldn't have done that."],[160.02,160.84,"What happened?"],[162.15,165.75,"I was exhausted. I ought to have taken a break before the meeting."],[167.05,170.76,"Self-awareness is the first step. Did you apologise?"],[172.05,175.39,"Yes. Showing some vulnerability actually helped."],[176.68,181.12,"That's emotional intelligence. Conflict resolution starts with honesty."],[182.42,184.85,"Grammar focus: should have / ought to have."],[185.15,188.47,"Use should have or ought to have for things that were right but didn't happen."],[188.77,191.45,"Use shouldn't have for things that were wrong but did happen."],[191.75,195.74,"For example: I should have listened more carefully. I shouldn't have shouted."],[196.04,200.51,"Use these forms to reflect on mistakes and to criticise past actions politely."],[201.52,204.11,"Now read and listen. Why EQ Matters."],[204.41,208.67,"For many years, people believed that intelligence was the key to success."],[209.98,213.81,"Today, researchers say emotional intelligence is just as important."],[215.12,219.11,"People with strong self-awareness and self-control handle stress better."],[220.42,224.02,"Social skills and conflict resolution help teams work together."],[225.32,228.71,"Many leaders admit they should have focused on these skills much earlier."],[230.02,232.33,"Quiz time! Choose the correct answer."],[232.63,234.82,"The feeling of being thankful is blank."],[235.12,239.38,"A, gratitude. B, vulnerability. C, self-control."],[243.38,245.24,"The answer is A: gratitude."],[246.75,249.33,"I failed the test. I blank studied more."],[249.63,253.19,"A, should have. B, shouldn't have. C, must have."],[257.18,259.16,"The answer is A: should have."],[260.65,263.3,"You blank said that. It hurt her feelings."],[263.6,267.04,"A, should have. B, shouldn't have. C, ought have."],[271.05,272.93,"The answer is B: shouldn't have."],[274.45,276.7,"Ending a disagreement peacefully is blank."],[277.0,281.95,"A, conflict resolution. B, burnout recovery. C, social skills."],[285.95,288.63,"The answer is A: conflict resolution."],[290.15,293.54,"According to the text, what is just as important as intelligence?"],[293.84,297.33,"A, money. B, emotional intelligence. C, luck."],[301.35,304.01,"The answer is B: emotional intelligence."],[305.52,309.86,"Now it's your turn to speak. Describe a situation you would handle differently now."],[315.16,320.27,"I once argued with a friend. I should have listened first and shouldn't have raised my voice."],[320.57,321.97,"Excellent answer, Nita!"],[322.98,326.81,"Great work today! You learned eight new words and should have / ought to have."],[327.11,330.31,"Today's value is empathy. Think about how others feel."],[330.61,333.46,"See you in Unit twenty-nine. Goodbye!"],[333.76,336.52,"Thank you, Mr. Daniel! Bye, everyone!"]],"OC-Upper-Intermediate-Unit29-Disaster-and-Response":[[0.35,4.5,"Hello, everyone! I'm Mr. Daniel. Welcome to Online Upper-Intermediate."],[4.8,7.92,"Hi! I'm Nita. Let's learn together!"],[8.22,15.32,"Unit twenty-nine: Disaster and Response. In this unit, you will describe emergencies and humanitarian action."],[16.32,17.65,"humanitarian aid."],[18.35,22.69,"humanitarian aid means help such as food and medicine for people in a crisis."],[22.99,25.51,"Humanitarian aid arrived within two days."],[26.21,28.83,"Your turn. Say: humanitarian aid."],[31.53,32.99,"humanitarian aid."],[33.98,35.23,"evacuation."],[35.93,39.54,"evacuation means moving people away from a dangerous place."],[39.84,42.56,"The evacuation of the village took six hours."],[43.26,45.95,"Your turn. Say: evacuation."],[48.65,49.84,"evacuation."],[50.85,51.78,"relief effort."],[52.48,56.45,"relief effort means organised work to help people after a disaster."],[56.76,59.17,"Thousands of volunteers joined the relief effort."],[59.87,62.52,"Your turn. Say: relief effort."],[65.22,66.41,"relief effort."],[67.42,68.44,"early warning."],[69.14,72.72,"early warning means information about danger given before it happens."],[73.02,75.45,"An early warning saved many lives."],[76.15,78.6,"Your turn. Say: early warning."],[81.3,82.43,"early warning."],[83.42,84.87,"disaster preparedness."],[85.57,89.53,"disaster preparedness means being ready for a disaster before it happens."],[89.83,92.54,"Schools teach disaster preparedness every year."],[93.24,95.8,"Your turn. Say: disaster preparedness."],[98.5,100.15,"disaster preparedness."],[101.15,102.2,"aftershock."],[102.9,105.86,"aftershock means a smaller earthquake that follows a big one."],[106.16,108.4,"Several aftershocks were felt during the night."],[109.1,111.66,"Your turn. Say: aftershock."],[114.36,115.49,"aftershock."],[116.48,117.54,"tsunami warning."],[118.24,122.31,"tsunami warning means an alert that a giant wave may hit the coast."],[122.61,125.32,"A tsunami warning was issued after the earthquake."],[126.02,128.4,"Your turn. Say: tsunami warning."],[131.1,132.23,"tsunami warning."],[133.22,134.29,"flash flood."],[134.99,138.46,"flash flood means a sudden flood caused by heavy rain."],[138.76,140.88,"A flash flood blocked the mountain road."],[141.58,144.18,"Your turn. Say: flash flood."],[146.88,147.91,"flash flood."],[148.92,150.97,"Now let's listen to a conversation."],[151.27,154.28,"I heard there was a flash flood in the north. What happened?"],[155.58,159.74,"It had been raining for three days when the river suddenly rose."],[161.05,162.72,"Was there an early warning?"],[164.02,168.75,"Yes. People were being evacuated while the water was still rising."],[170.05,171.6,"How did the relief effort go?"],[172.88,177.02,"Humanitarian aid had already been prepared, so it arrived quickly."],[178.32,181.15,"Grammar focus: Narrative tenses (advanced)."],[181.45,184.03,"Advanced narratives combine several tenses."],[184.33,192.39,"Past perfect continuous for long background, past continuous passive for actions in progress, past perfect passive for things completed earlier."],[192.69,196.82,"For example: It had been raining for days, and people were being evacuated."],[197.12,201.55,"Mixing these tenses makes stories and news reports more precise and dramatic."],[202.55,205.24,"Now read and listen. Ready Before the Storm."],[205.54,210.22,"In 2004, few coastal towns in Asia had heard a tsunami warning before."],[211.52,214.93,"Since then, early warning systems have been built across the region."],[216.22,221.15,"When an earthquake struck in 2018, people were being moved inland within minutes."],[222.45,226.68,"Emergency supplies had been prepared, and the relief effort began immediately."],[227.98,232.53,"Disaster preparedness turned a potential tragedy into a successful evacuation."],[233.82,236.27,"Quiz time! Choose the correct answer."],[236.57,238.91,"Moving people away from danger is blank."],[239.21,242.98,"A, evacuation. B, aftershock. C, relief effort."],[246.98,248.9,"The answer is A: evacuation."],[250.42,253.01,"They blank for hours when the rescue team arrived."],[253.31,256.37,"A, had been waiting. B, have waited. C, wait."],[260.38,262.28,"The answer is A: had been waiting."],[263.78,265.55,"The road blank when we got there."],[265.85,269.83,"A, was being repaired. B, repaired. C, is repairing."],[273.82,276.19,"The answer is A: was being repaired."],[277.68,280.3,"A smaller earthquake after a big one is an blank."],[280.6,284.54,"A, aftershock. B, early warning. C, flash flood."],[288.55,290.42,"The answer is A: aftershock."],[291.92,296.85,"According to the text, what turned a potential tragedy into a successful evacuation?"],[297.15,300.92,"A, luck. B, disaster preparedness. C, the weather."],[304.92,307.52,"The answer is B: disaster preparedness."],[309.02,313.56,"Now it's your turn to speak. How can communities prepare for natural disasters?"],[318.86,324.95,"They should have early warning systems, practise evacuations and keep emergency supplies ready."],[325.25,326.71,"Excellent answer, Nita!"],[327.72,331.86,"Great work today! You learned eight new words and narrative tenses (advanced)."],[332.15,335.37,"Today's value is being prepared. Get ready before you go."],[335.67,337.92,"See you in Unit thirty. Goodbye!"],[338.22,340.83,"Thank you, Mr. Daniel! Bye, everyone!"]],"OC-Upper-Intermediate-Unit30-Global-Citizenship":[[0.35,5.05,"Hello, everyone! I'm Mr. Daniel. Welcome to Online Upper-Intermediate."],[5.35,8.46,"Hi! I'm Nita. Let's learn together!"],[8.76,14.85,"Unit thirty: Global Citizenship. In this unit, you will discuss global issues and contrast ideas."],[15.85,16.99,"global citizen."],[17.69,21.35 , we arrived on time."],[269.77,273.6,"A, Whereas. B, Despite. C, Nevertheless."],[277.58,279.32,"The answer is B: Despite."],[280.82,283.68,"My brother loves sport, blank I prefer reading."],[283.98,287.68,"A, despite. B, whereas. C, nevertheless."],[291.68,293.67,"The answer is B: whereas."],[295.18,297.55,"Involving two or more cultures is blank."],[297.85,301.9,"A, cross-cultural. B, sustainable. C, multiculturalism."],[305.92,308.36,"The answer is A: cross-cultural."],[309.85,313.64,"According to the text, real change often starts with blank."],[313.94,318.61,"A, big governments. B, small local actions. C, international banks."],[322.62,325.88,"The answer is B: small local actions."],[327.38,331.17,"Now it's your turn to speak. What does being a global citizen mean to you?"],[336.47,344.02,"It means caring about people everywhere. Despite living in Cambodia, I can support global causes through my choices."],[344.32,345.8,"Excellent answer, Nita!"],[346.82,353.09,"Great work today! You learned eight new words and linking contrast: whereas · despite · nevertheless."],[353.39,356.64,"Today's value is kindness. Be kind to everyone."],[356.94,359.31,"See you in Unit thirty-one. Goodbye!"],[359.61,362.08,"Thank you, Mr. Daniel! Bye, everyone!"]],"OC-Upper-Intermediate-Unit31-Image-and-Influence":[[0.35,4.63,"Hello, everyone! I'm Mr. Daniel. Welcome to Online Upper-Intermediate."],[4.93,7.99,"Hi! I'm Nita. Let's learn together!"],[8.29,14.54,"Unit thirty-one: Image and Influence. In this unit, you will discuss social media, image and identity."],[15.55,16.49,"self-image."],[17.19,19.43,"self-image means the way you see yourself."],[19.73,22.72,"Social media can damage teenagers' self-image."],[23.42,26.03,"Your turn. Say: self-image."],[28.73,29.8,"self-image."],[30.78,32.2,"influencer marketing."],[32.9,37.12,"influencer marketing means companies paying influencers to promote products."],[37.42,40.09,"Influencer marketing is a billion-dollar industry."],[40.79,43.57,
