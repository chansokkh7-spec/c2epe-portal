<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>C2-EPE Young Learners Test</title>
<link rel="preconnect" href="https://fonts.gstatic.com"><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Khmer:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0f2147;--navy2:#24407f;--gold:#c9973a;--gold2:#e8c36a;--ink:#1d1d1f;--ok:#1e8e3e;--bad:#d93025;--bg:#f4f6fb}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,"Noto Sans Khmer","Noto Color Emoji",sans-serif;background:var(--bg);color:var(--ink);font-size:17px}
header{background:radial-gradient(circle at 30% 20%,var(--navy2),var(--navy) 70%);color:#fff;padding:14px 16px 16px;border-bottom:4px solid var(--gold)}
header .top{display:flex;align-items:center;gap:12px;max-width:760px;margin:0 auto}
header img{height:52px}
header .lv{color:var(--gold2);font-weight:700;font-size:13px;letter-spacing:.5px;text-transform:uppercase}
header h1{margin:2px 0 0;font-size:20px;line-height:1.25}
header .sub{font-size:13px;opacity:.8;margin-top:3px}
main{max-width:760px;margin:0 auto;padding:14px 12px 120px}
.who{display:flex;gap:8px;margin-bottom:12px}
.who{flex-wrap:wrap}
.who input{flex:1;min-width:120px;padding:10px 12px;border:1.5px solid #d6dbe8;border-radius:10px;font-size:16px}
.who input.need,.who select.need{border-color:var(--bad);background:#fdecea}
.me{background:#fff;border:1px solid #e6e9f2;border-radius:12px;padding:10px 12px;flex:1;display:flex;align-items:center;gap:8px;font-weight:600}
.me small{color:#1e8e3e;font-weight:700}
.sent{font-size:13px;margin-top:2px}
.card{background:#fff;border-radius:14px;padding:14px;margin:0 0 14px;box-shadow:0 1px 3px #0001;border:1px solid #e6e9f2}
.card h2{display:flex;gap:10px;align-items:center;font-size:16px;margin:0 0 10px}
.card h2 .n{background:var(--gold);color:#fff;border-radius:50%;width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;flex:none;font-size:14px}
.text{background:#fbf6ea;border-left:4px solid var(--gold);border-radius:8px;padding:10px 12px;line-height:1.55;margin-bottom:10px;white-space:pre-line}
.bank{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;background:#fbf6ea;border-radius:10px;padding:8px}
.bank span{background:#fff;border:1px solid #e3cf9c;border-radius:20px;padding:4px 10px;font-size:15px;color:#8a6420;font-weight:600}
.it{padding:10px 0;border-top:1px dashed #e3e6ee}
.it:first-of-type{border-top:none}
.q{display:flex;gap:8px;align-items:flex-start;line-height:1.45}
.q .k{color:#1e6fd9;font-weight:700;min-width:20px}
.pic{font-size:44px;line-height:1;margin:2px 0 6px 28px;display:block}
.pic .emo{font-family:"Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",sans-serif}
.pic svg{width:52px;height:52px}
.many{display:flex;flex-wrap:wrap;gap:2px;margin:2px 0 6px 28px;max-width:260px}
.many .pic{font-size:26px;margin:0;display:inline-block}
.many .pic svg{width:28px;height:28px}
.opts button .pic{font-size:40px;margin:0;display:inline-block}
.opts button .pic svg{width:44px;height:44px}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 0 28px}
.opts button{border:1.5px solid #cdd4e4;background:#fff;border-radius:22px;padding:8px 14px;font-size:16px;cursor:pointer;color:var(--ink);text-align:left}
.opts.big button{font-size:22px;font-weight:700;min-width:58px;text-align:center}
.opts button.sel{background:var(--navy);border-color:var(--navy);color:#fff}
.opts button.right{background:var(--ok);border-color:var(--ok);color:#fff}
.opts button.wrong{background:var(--bad);border-color:var(--bad);color:#fff}
input.ans,textarea{width:calc(100% - 28px);margin:8px 0 0 28px;padding:10px 12px;border:1.5px solid #cdd4e4;border-radius:10px;font-size:16px;font-family:inherit}
textarea{min-height:64px}
input.ans.right{border-color:var(--ok);background:#eaf6ee}
input.ans.wrong{border-color:var(--bad);background:#fdecea}
.fix{margin:6px 0 0 28px;font-size:14px;color:var(--ok);font-weight:600}
.note{font-size:13px;color:#666;margin:6px 0 0 28px}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:3px solid var(--gold);padding:10px 12px;box-shadow:0 -2px 10px #0002}
.bar .in{max-width:760px;margin:0 auto;display:flex;gap:10px;align-items:center}
.bar .score{flex:1;font-weight:700;color:var(--navy);font-size:18px}
.btn{background:linear-gradient(145deg,#f0cf7c,#b8862b);color:var(--navy);border:none;border-radius:24px;padding:12px 20px;font-size:16px;font-weight:700;cursor:pointer}
.btn.alt{background:var(--navy);color:var(--gold2)}
.list a{display:block;background:#fff;border:1px solid #e6e9f2;border-radius:12px;padding:12px 14px;margin-bottom:8px;color:var(--navy);text-decoration:none;font-weight:600}
.list h3{color:var(--gold);margin:18px 0 8px}
.trk{margin-bottom:12px}
.trk audio{width:100%;margin-top:8px}
.msg{background:#fff;border-radius:14px;padding:20px;text-align:center}
.big{font-size:40px}

.paper{background:var(--navy);color:#fff;border-radius:12px;padding:10px 14px;margin:18px 0 12px;display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px}
.paper small{color:var(--gold2);font-weight:600;font-size:13px;margin-left:auto}
.pt{color:var(--gold);font-weight:800;font-size:13px;letter-spacing:.5px;text-transform:uppercase;margin-bottom:2px}
.card h2 .q5{font-weight:400;color:#555;font-size:13px;margin-left:auto}
svg.scene{width:100%;height:auto;display:block;border-radius:10px;border:1.5px solid #d6dbe8;background:#fff;touch-action:manipulation}
svg.scene text.e{font-family:"Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",sans-serif;dominant-baseline:central;text-anchor:middle;cursor:pointer;user-select:none}
svg .nm rect{fill:#fff;stroke:var(--navy);stroke-width:1.6}
svg .nm text{font:700 15px system-ui,Arial;fill:var(--navy);dominant-baseline:central;text-anchor:middle;pointer-events:none}
svg .nm{cursor:pointer}
svg .nm.sel rect{fill:var(--gold2)}
svg .nm.used rect{fill:#e8eefc}
svg .nm.ex rect{fill:#eee;stroke:#999}
svg .pp.hl text.e{filter:drop-shadow(0 0 4px #c9973a)}
.hint{font-size:13px;color:#666;margin:6px 2px}
.hint b{color:var(--navy)}
.exrow{background:#f3f5fa;border-radius:10px;padding:8px 10px;margin-bottom:8px;font-size:15px;color:#555}
.exrow .a{font-family:"Comic Sans MS","Segoe Print",cursive;color:#1e6fd9;font-weight:700;border-bottom:1.5px solid #1e6fd9;padding:0 8px}
.bigpic{font-size:64px;text-align:center;font-family:"Noto Color Emoji","Apple Color Emoji",sans-serif;letter-spacing:6px;margin:4px 0 8px}
.abc{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 2px}
.abc button{background:#fff;border:2px solid #cdd4e4;border-radius:12px;padding:8px 4px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}
.abc button .e{font-size:46px;line-height:1.1;font-family:"Noto Color Emoji","Apple Color Emoji",sans-serif}
.abc button .lt{display:flex;align-items:center;gap:6px;font-weight:700;color:#555}
.abc button .bx{width:22px;height:22px;border:2px solid #555;border-radius:3px;display:inline-flex;align-items:center;justify-content:center;font-size:17px;color:#1e6fd9}
.abc button.sel{border-color:var(--navy);background:#eef2fb}
.abc button.right{border-color:var(--ok);background:#eaf6ee}
.abc button.wrong{border-color:var(--bad);background:#fdecea}
.pal{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 4px}
.pal button{width:40px;height:40px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1.5px #999;cursor:pointer}
.pal button.sel{box-shadow:0 0 0 3px var(--navy);transform:scale(1.1)}
.tk{display:flex;align-items:center;gap:12px;padding:8px 0;border-top:1px dashed #e3e6ee}
.tk .e{font-size:44px;width:60px;text-align:center;font-family:"Noto Color Emoji","Apple Color Emoji",sans-serif}
.tk .s{flex:1}
.tk .bt{display:flex;gap:6px}
.tk .bt button{width:42px;height:42px;border:2px solid #555;background:#fff;border-radius:6px;font-size:22px;cursor:pointer;color:#1e6fd9}
.tk .bt button.sel{background:#eef2fb;border-color:var(--navy)}
.tk .bt button.right{background:#eaf6ee;border-color:var(--ok)}
.tk .bt button.wrong{background:#fdecea;border-color:var(--bad)}
.tk.ex{opacity:.75}
.yn{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px dashed #e3e6ee}
.yn .s{flex:1}
input.w{width:110px;padding:8px 10px;border:1.5px solid #cdd4e4;border-radius:8px;font-size:16px;font-family:inherit}
input.w.right{border-color:var(--ok);background:#eaf6ee}
input.w.wrong{border-color:var(--bad);background:#fdecea}
.fx{font-size:13px;color:var(--ok);font-weight:700;margin-left:6px}
.lt3{display:flex;align-items:center;gap:12px;padding:8px 0;border-top:1px dashed #e3e6ee;flex-wrap:wrap}
.lt3 .e{font-size:44px;width:60px;text-align:center;font-family:"Noto Color Emoji","Apple Color Emoji",sans-serif}
.lt3 .letters{display:flex;gap:4px}
.lt3 .letters span{width:26px;height:26px;border-radius:50%;background:#fbf6ea;border:1.5px solid #e3cf9c;display:inline-flex;align-items:center;justify-content:center;font-weight:700;color:#8a6420}
.wb{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:10px}
.wb div{background:#fbf6ea;border:1px solid #e3cf9c;border-radius:10px;text-align:center;padding:4px 2px;font-size:14px;font-weight:600;color:#8a6420}
.wb div .e{display:block;font-size:30px;font-family:"Noto Color Emoji","Apple Color Emoji",sans-serif}
.gtext{line-height:2.3;font-size:16px}
.gtext input.w{width:105px;padding:4px 8px}
.gtext .a{font-family:"Comic Sans MS","Segoe Print",cursive;color:#1e6fd9;font-weight:700;border-bottom:1.5px solid #1e6fd9;padding:0 6px}
.frame{background:#f7f9fd;border:1px solid #e3e6ee;border-radius:12px;padding:8px 10px;margin-bottom:10px}
.frame .bigpic{font-size:42px;letter-spacing:2px}
.fq{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:5px 0}
.fq .s{flex:1;min-width:180px}
.res{background:#fff;border-radius:14px;padding:14px;border:2px solid var(--gold);margin-bottom:14px;text-align:center}
.res .row{display:flex;justify-content:space-around;flex-wrap:wrap;gap:10px;margin-top:8px}
.res .row div{min-width:130px}
.res .sh{font-size:26px;letter-spacing:2px}
.res b{font-size:22px;color:var(--navy)}
.scr{font-size:13px;color:#555;margin-top:8px}

.trk{background:#f3f5fa;border-radius:8px;padding:6px 10px;font-size:13px;color:#555;margin-bottom:8px}
input.w.kv,.tk .bt button.kv{color:#d93025;font-weight:700;border-color:#d93025}
.abc button.kv{border-color:#d93025}.abc button.kv .bx{color:#d93025;border-color:#d93025}
body.print{background:#fff}
body.print .hint,body.print .pal,body.print .bar{display:none}
body.print main{padding-bottom:0}
body.print .card{break-inside:avoid;box-shadow:none;border:1px solid #d6dbe8}
body.print .paper.pb{break-before:page}
body.print header{print-color-adjust:exact;-webkit-print-color-adjust:exact}
body.print input.w{border:none;border-bottom:1.5px solid #333;border-radius:0;background:transparent}
@media print{ body{print-color-adjust:exact;-webkit-print-color-adjust:exact} }
body.print input.w::placeholder{color:transparent}
</style>
</head>

<script>
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function norm(s){return String(s).toLowerCase().replace(/[‘’`]/g,"'").replace(/[.!?,]+$/,'').replace(/\s+/g,' ').replace(/\s+([.?!,])/g,'$1').trim();}
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v);}catch(e){return null;}}

function who(){
  try{ var s=JSON.parse(localStorage.getItem('c2epe_student_session')||'null');
       if(s&&(s.name||s.studentId)) return {studentId:s.studentId||'', name:s.name||s.studentId, cls:s.cls||'', login:true}; }catch(e){}
  try{ var w=JSON.parse(store('c2p-who')||'null'); if(w&&w.name) return {studentId:'', name:w.name, cls:w.cls||'', login:false}; }catch(e){}
  return null;
}
/* send a score; if it fails (offline / not loaded yet) keep it and retry next time */
function queue(){ try{ return JSON.parse(store('c2p-queue')||'[]'); }catch(e){ return []; } }
function send(d, sc){
  var tag=function(t,c){ if(sc){ var x=document.createElement('div'); x.className='sent'; x.style.color=c; x.textContent=t; sc.appendChild(x);} };
  if(!window.C2SAVE){ var q=queue(); q.push(d); store('c2p-queue', JSON.stringify(q.slice(-50))); tag('⏳ Score saved – will send to teacher later','#b26a00'); return; }
  window.C2SAVE(d).then(function(){ tag('📤 Sent to your teacher ✓','#1e8e3e'); })
    .catch(function(e){ var q=queue(); q.push(d); store('c2p-queue', JSON.stringify(q.slice(-50))); tag('⏳ Not sent yet ('+((e&&(e.code||e.message))||'offline')+') – will try again','#b26a00'); });
}
window.C2FLUSH=function(){
  var q=queue(); if(!q.length||!window.C2SAVE) return; store('c2p-queue','[]');
  q.forEach(function(d){ window.C2SAVE(d).catch(function(){ var k=queue(); k.push(d); store('c2p-queue', JSON.stringify(k.slice(-50))); }); });
};
setTimeout(function(){ if(window.C2FLUSH) window.C2FLUSH(); }, 3000);

        d=$('<div class="fq"><span class="k" style="color:#1e6fd9;font-weight:700">'+n+'</span><span class="s">'+esc(qs)+'</span><span style="white-space:nowrap">'+(lead?esc(lead)+' ':'')+'</span></div>');
        var inp=winput(''); d.lastChild.appendChild(inp); ins.push([inp,unk(q.k)]); }
      fr.appendChild(d); });
    c.appendChild(fr); });
  main.appendChild(c);
  RCHK.push({n:5, check:function(){ var r=0; ins.forEach(function(x){ r+=textCheck(x[0],x[1]); }); return r; }, reset:function(){ ins.forEach(function(x){textReset(x[0]);}); },
    key:function(){ ins.forEach(function(x){ x[0].value=x[1][0]; x[0].readOnly=true; x[0].classList.add('kv'); }); }});
}

/* ---------------- page ---------------- */
function shields(r,t){ var n=Math.max(1,Math.min(5,Math.round(r/t*5))); return '🛡️'.repeat(n)+'<span style="opacity:.25">'+'🛡️'.repeat(5-n)+'</span>'; }
function start(D){
  document.title=D.title+' – C2-EPE';
  document.getElementById('lv').textContent='C2-EPE Young Learners · '+D.level;
  document.getElementById('ttl').textContent=D.title;
  document.getElementById('sub').textContent='Listening (20) · Reading & Writing (25)';
  if(PRINT){ document.body.classList.add('print'); document.getElementById('sub').textContent=(KEY?'Teacher\'s edition · answers':'Student\'s edition')+' · Listening (20) · Reading & Writing (25)';
    [L1,L2,L3,L4].forEach(function(f,i){ if(i===0) main.appendChild($('<div class="paper">🎧 Listening <small>4 parts · 20 questions · about 20 minutes</small></div>')); f(D, D.L[i]); });
    main.appendChild($('<div class="paper pb">📖 Reading &amp; Writing <small>5 parts · 25 questions · 20 minutes</small></div>'));
    [R1,R2,R3,R4,R5].forEach(function(f,i){ f(D, D.R[i]); });
    if(KEY) LCHK.concat(RCHK).forEach(function(c){ c.key(); });
    window.YLE_READY=true; return; }
  var ME=who();
  if(ME&&ME.login){ main.innerHTML='<div class="who"><div class="me">👤 '+esc(ME.name)+(ME.cls?' · '+esc(ME.cls):'')+' <small>✓ signed in</small></div></div>'; }
  else { main.innerHTML='<div class="who"><input id="nm" placeholder="Your name / ឈ្មោះ"><input id="cl" placeholder="Class / ថ្នាក់"></div>';
    var w0=ME||{}; document.getElementById('nm').value=w0.name||''; document.getElementById('cl').value=w0.cls||''; }
  if(EMBED) main.insertBefore($('<button type="button" class="btn alt" style="margin-bottom:10px" onclick="openTest(null)">← All tests</button>'), main.firstChild);
  var res=$('<div class="res" style="display:none"></div>'); main.appendChild(res);
  main.appendChild($('<div class="paper">🎧 Listening <small>4 parts · 20 questions · about 20 minutes</small></div>'));
  [L1,L2,L3,L4].forEach(function(f,i){ f(D, D.L[i]); });
  main.appendChild($('<div class="paper">📖 Reading &amp; Writing <small>5 parts · 25 questions · 20 minutes</small></div>'));
  [R1,R2,R3,R4,R5].forEach(function(f,i){ f(D, D.R[i]); });
  var bar=$('<div class="bar"><div class="in"><span class="score" id="sc">45 questions</span><button class="btn" id="go">Finish &amp; check ✓</button></div></div>');
  document.body.appendChild(bar);
  var go=document.getElementById('go'), sc=document.getElementById('sc'), done=false;
  go.onclick=function(){
    if(!done){
      if(!(ME&&ME.login)){
        var a=document.getElementById('nm'), b=document.getElementById('cl');
        a.classList.toggle('need',!a.value.trim());
        if(!a.value.trim()){ sc.innerHTML='<span style="color:var(--bad);font-size:15px">✍️ Write your name / សរសេរឈ្មោះ</span>'; window.scrollTo({top:0,behavior:'smooth'}); a.focus(); return; }
        if(!confirm('Finish the test and check your answers? / បញ្ចប់តេស្ត?')) return;
        store('c2p-who', JSON.stringify({name:a.value.trim(), cls:b.value.trim()})); ME=who();
      } else if(!confirm('Finish the test and check your answers? / បញ្ចប់តេស្ត?')) return;
      var lr=0, rr=0, lp=[], rp=[];
      LCHK.forEach(function(c){ var x=c.check(); lr+=x; lp.push(x); }); RCHK.forEach(function(c){ var x=c.check(); rr+=x; rp.push(x); });
      var tot=lr+rr, pct=Math.round(tot*100/45), star=pct>=90?'🌟':pct>=70?'⭐':pct>=50?'👍':'💪';
      res.innerHTML='<div style="font-size:18px;font-weight:700;color:var(--navy)">'+star+' '+tot+' / 45'+(ME&&ME.name?' – '+esc(ME.name):'')+'</div>'
        +'<div class="row"><div>🎧 Listening<br><b>'+lr+' / 20</b><div class="sh">'+shields(lr,20)+'</div><div class="scr">Parts: '+lp.join(' · ')+'</div></div>'
        +'<div>📖 Reading &amp; Writing<br><b>'+rr+' / 25</b><div class="sh">'+shields(rr,25)+'</div><div class="scr">Parts: '+rp.join(' · ')+'</div></div></div>';
      res.style.display='block';
      sc.textContent=star+' '+tot+' / 45'; go.textContent='Try again ↺'; go.className='btn alt'; done=true; window.scrollTo({top:0,behavior:'smooth'});
      try{ if(window.parent!==window) window.parent.postMessage({type:'gameroom-score', score:tot, total:45, level:'Starters'}, '*'); }catch(e){}
      var n=parseInt(store('c2p-n-'+D.id)||'0',10)+1; store('c2p-n-'+D.id, String(n));
      var now=new Date();
      send({prefix:'yle-s', level:D.level, setId:D.id, setTitle:D.title, kind:'yle-test',
            studentId:ME.studentId||'', studentName:ME.name, cls:ME.cls||'', login:!!ME.login,
            score:tot, total:45, pct:pct, listening:lr, readingWriting:rr, parts:{L:lp, R:rp}, attempt:n,
            at:now.toISOString(), day:now.toISOString().slice(0,10)}, res);
    } else {
      if(!confirm('Start again? Your answers will be cleared. / ចាប់ផ្ដើមម្ដងទៀត?')) return;
      LCHK.concat(RCHK).forEach(function(c){c.reset();}); res.style.display='none'; sc.textContent='45 questions'; go.textContent='Finish & check ✓'; go.className='btn'; done=false;
    }
  };
}

</script>
