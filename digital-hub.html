<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEG Digital Hub</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Kantumruy Pro', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b1736;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 20px;
        }

        .dashboard-container {
            width: 100%;
            max-width: 1200px;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
            position: relative;
        }

        .header h1 {
            color: #38bdf8;
            font-size: 2.2rem;
            margin-bottom: 8px;
        }

        .header-logo {
            width: 84px;
            height: auto;
            margin: 0 auto 10px;
            display: block;
            filter: drop-shadow(0 4px 14px rgba(212, 160, 23, 0.35));
        }

        .site-footer {
            margin-top: 30px;
            padding: 18px 20px;
            text-align: center;
            border-top: 1px solid #1d3e80;
            color: #6b7fae;
            font-size: 0.8rem;
            line-height: 1.6;
        }

        .site-footer img {
            width: 34px;
            height: auto;
            margin-bottom: 8px;
            opacity: 0.85;
        }

        .site-footer .footer-brand {
            color: #9db4de;
            font-weight: 700;
        }

        .lang-switch {
            position: absolute;
            top: 0;
            right: 0;
            display: flex;
            gap: 6px;
            background: #132a5a;
            border: 1px solid #1d3e80;
            border-radius: 8px;
            padding: 4px;
        }

        .lang-btn {
            padding: 6px 14px;
            background: transparent;
            border: none;
            border-radius: 6px;
            color: #9db4de;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
        }

        .lang-btn:hover {
            color: #fff;
        }

        .lang-btn.active {
            background: #d4a017;
            color: #0b1b3d;
        }

        @media (max-width: 600px) {
            .lang-switch {
                position: static;
                justify-content: center;
                margin-bottom: 12px;
                width: fit-content;
                margin-left: auto;
                margin-right: auto;
            }
        }

        .marquee-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #132a5a;
            padding: 12px 20px;
            border-radius: 10px 10px 0 0;
            border: 1px solid #1d3e80;
            border-bottom: none;
        }

        .marquee-header h3 {
            color: #38bdf8;
            font-size: 1.1rem;
        }

        /* Elements with .admin-only (upload button, delete-X buttons, edit
         * gear icons) are hidden from normal visitors. They only appear
         * once admin mode is unlocked via the lock button in the header. */
        body:not(.admin-mode) .admin-only {
            display: none !important;
        }

        .admin-lock-btn {
            padding: 6px 12px;
            background: transparent;
            border: none;
            border-radius: 6px;
            color: #9db4de;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
        }

        .admin-lock-btn:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.08);
        }

        body.admin-mode .admin-lock-btn {
            color: #d4a017;
        }

        .upload-marquee-btn {
            background: #d4a017;
            color: #0b1b3d;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
            display: inline-block;
        }

        .upload-marquee-btn:hover {
            background: #c19012;
        }

        .marquee-container {
            width: 100%;
            overflow: hidden;
            margin-bottom: 25px;
            background: #132a5a;
            border: 1px solid #1d3e80;
            border-radius: 0 0 12px 12px;
            padding: 15px 0;
            position: relative;
        }

        .marquee-track {
            display: flex;
            gap: 20px;
            width: max-content;
            animation: scroll 60s linear infinite;
        }

        .marquee-container:hover .marquee-track {
            animation-play-state: paused;
        }

        .marquee-item-wrapper {
            position: relative;
            display: inline-block;
        }

        .marquee-item {
            height: 180px;
            width: 320px;
            border-radius: 8px;
            object-fit: cover;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            display: block;
        }

        .delete-img-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(239, 68, 68, 0.85);
            color: #fff;
            border: none;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            opacity: 0;
            transition: opacity 0.2s, background 0.2s;
            z-index: 10;
        }

        .marquee-item-wrapper:hover .delete-img-btn {
            opacity: 1;
        }

        .delete-img-btn:hover {
            background: rgba(220, 38, 38, 1);
        }

        @keyframes scroll {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        .controls-section {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            background: #132a5a;
            padding: 15px 20px;
            border-radius: 10px;
            border: 1px solid #1d3e80;
        }

        .search-box input {
            width: 300px;
            padding: 10px 15px;
            border-radius: 6px;
            border: 1px solid #3b82f6;
            background: #0b1736;
            color: #fff;
            font-size: 15px;
            outline: none;
        }

        .search-box input:focus {
            border-color: #d4a017;
        }

        .filter-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 8px 16px;
            border: 1px solid #3b82f6;
            background: transparent;
            color: #38bdf8;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.3s;
        }

        .filter-btn.active, .filter-btn:hover {
            background: #3b82f6;
            color: #ffffff;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
        }

        .system-card {
            background-color: #132a5a;
            border: 2px solid #1d3e80;
            border-radius: 12px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            position: relative;
            transition: all 0.3s ease;
            min-height: 320px;
            overflow: hidden;
        }

        .system-card:hover {
            transform: translateY(-5px);
            border-color: #d4a017;
            box-shadow: 0 8px 20px rgba(212, 160, 23, 0.2);
        }

        .card-category {
            font-size: 0.75rem;
            color: #38bdf8;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
            font-weight: bold;
        }

        .level-chip {
            display: inline-block;
            background: rgba(212, 160, 23, 0.18);
            color: #d4a017;
            border: 1px solid rgba(212, 160, 23, 0.4);
            border-radius: 10px;
            padding: 1px 8px;
            font-size: 0.68rem;
            text-transform: none;
            letter-spacing: 0.2px;
            margin-left: 4px;
            font-weight: 700;
        }

        .level-filter-buttons {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px dashed #1d3e80;
        }

        .level-filter-buttons .level-btn {
            font-size: 0.8rem;
            padding: 6px 14px;
        }

        .card-header-logo {
            width: 35px;
            height: 35px;
            object-fit: contain;
            margin-bottom: 6px;
            border-radius: 4px;
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: #e0e0e0;
            text-align: center;
            margin-bottom: 4px;
        }

        .card-desc {
            font-size: 0.85rem;
            color: #aaa;
            text-align: center;
            margin-bottom: 10px;
            max-height: 40px;
            overflow: hidden;
        }

        .edit-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.6);
            border: none;
            color: #fff;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            transition: background 0.2s;
            z-index: 20;
        }

        .edit-btn:hover {
            background: #d4a017;
            color: #0b1b3d;
        }

        .carousel-container {
            width: 100%;
            height: 160px;
            position: relative;
            overflow: hidden;
            border-radius: 8px;
            margin-bottom: 12px;
            background-color: #0b1b3d;
        }

        .carousel-slide {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.8s ease-in-out, visibility 0.8s ease-in-out;
            z-index: 1;
        }

        .carousel-slide.active {
            opacity: 1;
            visibility: visible;
            z-index: 2;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal {
            background: #132a5a;
            border: 1px solid #d4a017;
            border-radius: 12px;
            width: 90%;
            max-width: 550px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h2 {
            color: #d4a017;
            font-size: 1.4rem;
        }

        .close-btn {
            background: none;
            border: none;
            color: #fff;
            font-size: 1.5rem;
            cursor: pointer;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            color: #ccc;
            font-size: 0.9rem;
        }

        .form-group input[type="text"],
        .form-group select,
        .form-group textarea,
        .form-group input[type="file"] {
            width: 100%;
            padding: 10px;
            background: #0b1736;
            border: 1px solid #1d3e80;
            border-radius: 6px;
            color: #fff;
            outline: none;
        }

        .form-group input[type="text"]:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            border-color: #d4a017;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .tab {
            flex: 1;
            padding: 8px;
            background: #0b1736;
            border: 1px solid #1d3e80;
            color: #ccc;
            border-radius: 6px;
            cursor: pointer;
            text-align: center;
            font-size: 0.9rem;
        }

        .tab.active {
            background: #d4a017;
            color: #0b1b3d;
            font-weight: bold;
            border-color: #d4a017;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .btn-save {
            width: 100%;
            padding: 12px;
            background: #d4a017;
            border: none;
            border-radius: 6px;
            color: #0b1b3d;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn-save:hover {
            background: #c19012;
        }

        /* ---------------------------------------------------------------
         * Safe content viewer: renders "Embed Code" systems inside a
         * SANDBOXED <iframe> instead of writing them into a popup window.
         * This is the fix for the unsafe window.open()+document.write()
         * pattern — see onCardClick() in the script for the full
         * explanation of why that was risky.
         * ------------------------------------------------------------- */
        .viewer-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            z-index: 2000;
            padding: 20px;
            align-items: center;
            justify-content: center;
        }

        .viewer-overlay.open {
            display: flex;
        }

        .viewer-box {
            width: 100%;
            height: 100%;
            max-width: 1100px;
            background: #0b1736;
            border: 1px solid #1d3e80;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .viewer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 16px;
            background: #132a5a;
            border-bottom: 1px solid #1d3e80;
            flex-shrink: 0;
        }

        .viewer-header h3 {
            color: #38bdf8;
            font-size: 1rem;
        }

        .viewer-frame {
            flex: 1;
            width: 100%;
            border: none;
            background: #fff;
        }

        /* ---------------------------------------------------------------
         * Per-student access control: a system can be marked "restricted"
         * by the teacher/admin; only students explicitly assigned to it
         * (by Student ID) can open it. Everyone else sees a locked card.
         * ------------------------------------------------------------- */
        .student-id-btn {
            padding: 6px 12px;
            background: transparent;
            border: 1px solid #1d3e80;
            border-radius: 6px;
            color: #9db4de;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
            white-space: nowrap;
        }

        .student-id-btn:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.08);
        }

        .student-id-btn.logged-in {
            border-color: #22c55e;
            color: #4ade80;
        }

        .manage-students-btn {
            padding: 8px 16px;
            border: 1px solid #d4a017;
            background: transparent;
            color: #d4a017;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.3s;
        }

        .manage-students-btn:hover {
            background: #d4a017;
            color: #0b1b3d;
        }

        .system-card.is-locked {
            cursor: pointer;
            opacity: 0.55;
            filter: grayscale(60%);
        }

        .system-card.is-locked:hover {
            opacity: 0.8;
            filter: grayscale(30%);
        }

        .lock-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.6);
            color: #d4a017;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.95rem;
            z-index: 20;
        }

        .lock-reason {
            font-size: 0.75rem;
            color: #d4a017;
            font-weight: 700;
            margin-top: 4px;
        }

        .student-list {
            max-height: 260px;
            overflow-y: auto;
            border: 1px solid #1d3e80;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .student-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            border-bottom: 1px solid #1d3e80;
            cursor: pointer;
        }

        .student-row:last-child {
            border-bottom: none;
        }

        .student-row:hover {
            background: #0b1736;
        }

        .student-row .sid {
            color: #d4a017;
            font-weight: 700;
            font-size: 0.85rem;
        }

        .student-row .sname {
            color: #ccc;
            font-size: 0.85rem;
        }

        .student-row .del-student {
            background: none;
            border: none;
            color: #ef4444;
            cursor: pointer;
            font-size: 1rem;
        }

        .system-checklist {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 8px;
            max-height: 280px;
            overflow-y: auto;
            border: 1px solid #1d3e80;
            border-radius: 8px;
            padding: 10px;
        }

        .checklist-group-label {
            grid-column: 1 / -1;
            font-size: 0.72rem;
            font-weight: 800;
            color: #d4a017;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 6px;
            padding-bottom: 3px;
            border-bottom: 1px solid #1d3e80;
        }

        .checklist-group-label:first-child {
            margin-top: 0;
        }

        .system-checklist label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
            color: #ccc;
            cursor: pointer;
        }

        .restrict-toggle {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 15px;
            padding: 10px;
            background: #0b1736;
            border: 1px solid #1d3e80;
            border-radius: 8px;
        }

        .restrict-toggle label {
            font-size: 0.9rem;
            color: #ccc;
            cursor: pointer;
        }
    </style>
</head>

        <div class="header">
            <div class="lang-switch">
                <button class="student-id-btn" id="studentIdBtn" onclick="openStudentIdModal()">🔑 Student ID</button>
                <button class="admin-lock-btn" id="adminLockBtn" onclick="toggleAdminMode()" title="Admin">🔒</button>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <div class="modal-header">
                <h2 id="modalTitle">Edit System</h2>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>

            <div class="form-group">
                <label for="systemTitleInput" id="labelTitle">System Name / Title:</label>
                <input type="text" id="systemTitleInput" placeholder="Enter system name...">
            </div>

            <div class="form-group">
                <label for="systemCategoryInput" id="labelCategory">Category (fixed by slot — always exactly 12 per category):</label>
                <select id="systemCategoryInput" disabled style="opacity:0.7; cursor:not-allowed;">
                    <option value="english" id="catEnglishOption">English</option>
                    <option value="health" id="catHealthOption">Health</option>
                    <option value="tech" id="catTechOption">Technology</option>
                </select>
            </div>

            <div class="form-group">
                <label for="systemDescInput" id="labelDesc">Description:</label>
                <textarea id="systemDescInput" rows="2" placeholder="Short description..."></textarea>
            </div>

            <div class="restrict-toggle">
                <input type="checkbox" id="restrictedInput" onchange="toggleAssignedList()">
                <label for="restrictedInput">🔒 Restrict — only assigned students can see/open this</label>
            </div>
            <div class="form-group" id="assignedStudentsWrap" style="display:none;">
                <label>Students with access to this system (manage via "👥 Manage Students & Access"):</label>
                <div id="assignedStudentsList" style="font-size:0.85rem; color:#9db4de; padding:8px 0;"></div>
            </div>

            <div class="form-group">
                <label for="iconFileInput" id="labelIcon">Logo / Icon Image (Upload):</label>
                <input type="file" id="iconFileInput" accept="image/*">
            </div>

            <div class="form-group">
                <label for="sliderFileInput" id="labelSlides">Slide Images (multiple allowed):</label>
                <input type="file" id="sliderFileInput" accept="image/*" multiple>
            </div>

            <div class="form-group">
                <label for="videoUrlInput" id="labelVideo">Video (Video URL Link):</label>
                <input type="text" id="videoUrlInput" placeholder="https://example.com/video.mp4">
            </div>

            <div class="tabs">
                <div class="tab active" id="tabUrlBtn" onclick="switchTab('url')">URL Link</div>
                <div class="tab" id="tabCodeBtn" onclick="switchTab('code')">Embed Code</div>
            </div>

            <div id="tab-url" class="tab-content active">
                <div class="form-group">
                    <label for="urlInput" id="labelUrl">Link URL (e.g. https://google.com):</label>
                    <input type="text" id="urlInput" placeholder="https://...">
                </div>
            </div>

            <div id="tab-code" class="tab-content">
                <div class="form-group">
                    <label for="codeInput" id="labelCode">HTML / Embed Code / Video Link:</label>
                    <textarea id="codeInput" rows="4" placeholder="<iframe src='...'></iframe>"></textarea>
                </div>
            </div>

            <button class="btn-save" id="btnSave" onclick="saveSystemData()">Save</button>
        </div>
    </div>

    <!-- Safe content viewer: the ONLY place embedded "code" systems are
         rendered. Always a sandboxed iframe — never document.write(). -->
    <div class="viewer-overlay" id="viewerOverlay">
        <div class="viewer-box">
            <div class="viewer-header">
                <h3 id="viewerTitle">System</h3>
                <button class="close-btn" onclick="closeViewer()">&times;</button>
            </div>
            <iframe id="viewerFrame" class="viewer-frame"
                sandbox="allow-scripts allow-forms allow-modals allow-popups allow-popups-to-escape-sandbox"
                allow="microphone"
                referrerpolicy="no-referrer"></iframe>
        </div>
    </div>

    <!-- Student ID gate: lets a student unlock any "restricted" systems
         that a teacher has assigned to them, without needing a full
         account/password — matches the Student ID pattern already used
         elsewhere (e.g. the parent/student portal). -->
    <div class="modal-overlay" id="studentIdOverlay">
        <div class="modal" style="max-width:400px;">
            <div class="modal-header">
                <h2>🔑 Student ID</h2>
                <button class="close-btn" onclick="closeStudentIdModal()">&times;</button>
            </div>
            <div id="studentIdLoggedOutView">
                <div class="form-group">
                    <label>Enter your Student ID (ask your teacher if you don't have one):</label>
                    <input type="text" id="studentIdInputField" placeholder="e.g. C2-0142" onkeydown="if(event.key==='Enter') submitStudentId();">
                </div>
                <p id="studentIdError" style="color:#ef4444; font-size:0.85rem; margin-bottom:10px; display:none;"></p>
                <button class="btn-save" onclick="submitStudentId()">Confirm</button>
            </div>
            <div id="studentIdLoggedInView" style="display:none;">
                <p style="margin-bottom:15px;">Logged in as: <b id="studentIdCurrentName" style="color:#d4a017;"></b></p>
                <button class="btn-save" style="background:#ef4444;" onclick="switchStudent()">🚪 Switch ID / Log out</button>
            </div>
        </div>
    </div>

    <!-- Admin-only: create/edit students and choose which systems each one
         may open. Assignment is stored per-student (allowedSystems: [1,3,5]),
         not per-system, so one student list works across all 12 systems. -->
    <div class="modal-overlay" id="manageStudentsOverlay">
        <div class="modal" style="max-width:520px;">
            <div class="modal-header">
                <h2>👥 Manage Students & Access</h2>
                <button class="close-btn" onclick="closeManageStudents()">&times;</button>
            </div>

            <div class="form-group">
                <input type="text" id="studentSearchInput" placeholder="Search by Student ID or name..." onkeyup="renderStudentList()">

            <hr style="border-color:#1d3e80; margin:15px 0;">

            <div class="form-group">
                <label id="studentFormHeading">➕ Add New Student</label>

            <div class="form-group">
                <label>Systems/lessons this student can access:</label>

                <button class="btn-save" onclick="saveStudent()">💾 Save Student</button>
                <button class="btn-save" style="background:#374151; color:#fff;" onclick="resetStudentForm()">✚ New Student</button>

        </div>
    </div>

    <script>
        let activeSystemId = null;
        let activeTab = 'url';
        let currentCategory = 'all';
        let currentLevel = 'all'; // sub-filter within English: Kindergarten/Primary/Secondary/Master Level
        let systemsData = {};
        let marqueeImages = [];
        let carouselIntervals = {};

        // ---- Per-student access control state ----
        let currentStudent = null;
        try { currentStudent = JSON.parse(localStorage.getItem('seg_student') || 'null'); } catch (e) { currentStudent = null; }
        let allStudentsCache = {}; // id -> {name, allowedSystems}
        let editingStudentId = null; // which student the admin form is currently editing

        const TOTAL_SYSTEMS = 36; // 12 systems per category (English / Health / Technology)

        // Blank/unassigned slots default into even thirds — 1-12 English,
        // 13-24 Health, 25-36 Technology — instead of every empty slot
        // falling into one category. Admins can still change any system's
        // category later in its edit modal; this only decides the
        // starting point before that.
        function defaultCategoryFor(i) {
            if (i <= 12) return 'english';
            if (i <= 24) return 'health';
            return 'tech';

        // systems each, so students/teachers can find or assign the right
        // level quickly instead of scanning all 12 at once. Returns null
        // for Health/Technology slots (no sub-levels there).
        const ENGLISH_LEVELS = ['Kindergarten', 'Primary', 'Secondary', 'Master Level'];
        function defaultLevelFor(i) {
            if (i > 12) return null;
            return ENGLISH_LEVELS[Math.floor((i - 1) / 3)];
        }

        // Default title shows a 1-12 number local to its own category
        // (e.g. "Health 1"..."Health 12") until the admin renames it to
        // something real in the edit modal. For English, it uses the
        // sub-level name + a 1-3 number local to that level instead
        // (e.g. "Kindergarten 1", "Primary 2") since that's more useful
        // than a flat 1-12 count once levels are in play.
        function defaultTitleFor(i) {
            const level = defaultLevelFor(i);
            if (level) {
                const localNum = ((i - 1) % 3) + 1;
                return `${level} ${localNum}`;
            }
            const cat = defaultCategoryFor(i);
            const label = cat === 'health' ? 'Health' : 'Technology';
            const localNum = ((i - 1) % 12) + 1;

        function initData() {
            systemsCollectionRef.onSnapshot((snapshot) => {
                const newSystemsData = {};
                snapshot.forEach((doc) => {
                    newSystemsData[doc.id] = doc.data();

                systemsData = newSystemsData;

                for (let i = 1; i <= TOTAL_SYSTEMS; i++) {
                    if (!systemsData[i]) {
                        systemsData[i] = { title: defaultTitleFor(i), category: defaultCategoryFor(i), desc: '', icon: '', slides: [], video: '', type: 'url', content: '' };
                    }
                }
                renderGrid();
            }, (err) => {
                console.error('Failed to load systems from Firestore, using defaults:', err);
                systemsData = defaultInitialData;
                for (let i = 1; i <= TOTAL_SYSTEMS; i++) {
                    if (!systemsData[i]) {
                        systemsData[i] = { title: defaultTitleFor(i), category: defaultCategoryFor(i), desc: '', icon: '', slides: [], video: '', type: 'url', content: '' };
                    }
                }
                renderGrid();
            });

            marqueeDocRef.onSnapshot((docSnap) => {
                const data = docSnap.data();
                marqueeImages = (data && data.images && data.images.length > 0) ? data.images : defaultMarqueeImages;
                renderMarquee();
            }, (err) => {
                console.error('Failed to load marquee from Firestore, using defaults:', err);
                marqueeImages = defaultMarqueeImages;
                renderMarquee();
            });
        }

        function renderMarquee() {
            const track = document.getElementById('marqueeTrack');
            track.innerHTML = '';

            const displayList = [...marqueeImages, ...marqueeImages];

            displayList.forEach((imgSrc, idx) => {
                const wrapper = document.createElement('div');
                wrapper.className = 'marquee-item-wrapper';

                const img = document.createElement('img');
                img.src = imgSrc;
                img.className = 'marquee-item';
                img.alt = `Banner ${idx + 1}`;

                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'delete-img-btn admin-only';
                deleteBtn.innerHTML = '✕';
                deleteBtn.title = 'Delete this image';
                deleteBtn.onclick = (e) => {
                    e.stopPropagation();
                    deleteMarqueeImage(idx % marqueeImages.length);
                };

                wrapper.appendChild(img);
                wrapper.appendChild(deleteBtn);
                track.appendChild(wrapper);
            });
        }

        async function deleteMarqueeImage(index) {
            if (marqueeImages.length <= 1) {
                alert(t('alertMinOneImage'));
                return;
            }
            const previous = marqueeImages.slice();
            marqueeImages.splice(index, 1);
            try {
                await marqueeDocRef.set({ images: marqueeImages }, { merge: true });
                renderMarquee();
            } catch (e) {
                console.error('Failed to delete marquee image:', e);
                marqueeImages = previous;
                alert(t('alertUpdateFail'));
            }
        }

        async function uploadMarqueeImages(event) {
            const files = Array.from(event.target.files);
            if (files.length === 0) return;

            let newImages = [];
            for (let file of files) {
                const compressed = await new Promise(res => compressImage(file, 600, 350, 0.7, res));
                if (compressed) newImages.push(compressed);
            }

            if (newImages.length === 0) {
                alert(t('alertBadImages'));
                event.target.value = '';
                return;
            }

            const previous = marqueeImages.slice();
            marqueeImages = newImages;
            try {
                await marqueeDocRef.set({ images: marqueeImages }, { merge: true });
                renderMarquee();
                alert(t('alertMarqueeSaved'));
            } catch (e) {
                console.error('Failed to save marquee images:', e);
                marqueeImages = previous;
                alert(t('alertMarqueeSaveFail'));
            } finally {
                event.target.value = '';
            }
        }

                sys.category = defaultCategoryFor(i);
                const iconSrc = sys.icon ? sys.icon : defaultIcon;

                const matchesSearch = sys.title.toLowerCase().includes(searchInput);
                const matchesCategory = (currentCategory === 'all' || sys.category === currentCategory);
                const sysLevel = defaultLevelFor(i);
                const matchesLevel = (currentLevel === 'all' || sysLevel === currentLevel);

                // Admins always see and can open everything (so they can manage

                const card = document.createElement('div');
                card.className = 'system-card' + (unlocked ? '' : ' is-locked');
                card.style.display = (matchesSearch && matchesCategory && matchesLevel) ? 'flex' : 'none';

                let contentHtml = `<button class="edit-btn admin-only" title="${escapeHtml(t('editBtnTitle'))}" onclick="event.stopPropagation(); openModal(${i});">⚙️</button>`;

                    contentHtml += `<div class="lock-badge" title="This system is restricted">🔒</div>`;
                }

                if (sys.slides && sys.slides.length > 0) {
                    let slidesImg = sys.slides.map((img, idx) => 
                        `<img src="${img}" class="carousel-slide ${idx === 0 ? 'active' : ''}" alt="Slide ${idx}">`
                    ).join('');
                    contentHtml += `<div class="carousel-container" id="carousel-${i}">${slidesImg}</div>`;
                } else {
                    contentHtml += `<div class="carousel-container" style="display:flex; justify-content:center; align-items:center;"><img src="${iconSrc}" style="width:70px; height:70px; object-fit:contain;" alt="System Icon"></div>`;
                }

                const catLabel = sys.category === 'english' ? t('filterEnglish') : (sys.category === 'health' ? t('filterHealth') : t('filterTech'));
                const levelBadge = sysLevel ? ` <span class="level-chip">${escapeHtml(sysLevel)}</span>` : '';

                    <div class="card-category">${catLabel}${levelBadge}</div>

                card.innerHTML = contentHtml;

        /* Only http/https links are ever opened — blocks javascript:, data:,
         * vbscript: and similar URI schemes that could run code if a title/
         * link field were ever manipulated. */
        function isSafeUrl(url) {
            try {
                const u = new URL(url, window.location.href);
                return u.protocol === 'http:' || u.protocol === 'https:';
            } catch (e) {
                return false;
            }
        }

        /* -----------------------------------------------------------------
         * SECURITY NOTE — why this function looks the way it does:
         *
         * The previous version rendered "Embed Code" systems with
         * `window.open('', '_blank')` followed by `newWin.document.write(...)`.
         * A window opened that way shares the SAME ORIGIN as this dashboard,
         * so any script pasted into "Embed Code" (by an admin, or by anyone
         * who later gains admin access) would run with full access to
         * `window.opener` — meaning it could read/write this page's DOM,
         * localStorage, and the live Firebase Auth session, then silently
         * rewrite or delete every system via `systemsCollectionRef`.
         *
         * The fix: embedded code now only ever runs inside the sandboxed
         * <iframe id="viewerFrame"> declared above, using `srcdoc` (never
         * document.write). Because the iframe has a `sandbox` attribute
         * WITHOUT `allow-same-origin`, the browser gives it a unique,
         * opaque origin — it can run JavaScript (`allow-scripts`), but it
         * cannot reach `window.parent`, this page's cookies/localStorage,
         * or the Firebase session, even though it lives in the same tab.
         * `allow-same-origin` must never be added back alongside
         * `allow-scripts` for untrusted content — that combination is what
         * cancels the isolation out.
         * ----------------------------------------------------------------- */
        function onCardClick(id) {
            const sys = systemsData[id];
            if (!sys || (!sys.content && !sys.video)) {
                openModal(id);
                return;
            }

            if (sys.video) {
                openViewer(sys.title, `<video controls autoplay style="max-width:100%;max-height:100vh;display:block;margin:auto;"><source src="${escapeHtml(sys.video)}"></video>`);
            } else if (sys.type === 'url' && sys.content) {
                if (isSafeUrl(sys.content)) {
                    window.open(sys.content, '_blank', 'noopener,noreferrer');
                } else {
                    alert('Invalid link URL (must be http/https).');
                }
            } else {
                // type === 'code': render in the sandboxed viewer, not a popup.
                openViewer(sys.title, sys.content);
            }
        }

        function openViewer(title, html) {
            document.getElementById('viewerTitle').innerText = title || '';
            const frame = document.getElementById('viewerFrame');
            frame.removeAttribute('src');
            frame.srcdoc = html;
            document.getElementById('viewerOverlay').classList.add('open');
        }

        function closeViewer() {
            document.getElementById('viewerOverlay').classList.remove('open');
            const frame = document.getElementById('viewerFrame');
            frame.srcdoc = ''; // stop any audio/video/timers running inside
        }

        function openModal(id) {
            activeSystemId = id;
            const sys = systemsData[id] || {};

            document.getElementById('modalTitle').innerText = t('modalTitleEdit')(id);
            document.getElementById('systemTitleInput').value = sys.title || defaultTitleFor(id);
            document.getElementById('systemCategoryInput').value = defaultCategoryFor(id);
            document.getElementById('systemDescInput').value = sys.desc || '';
            document.getElementById('urlInput').value = sys.type === 'url' ? sys.content : '';
            document.getElementById('codeInput').value = sys.type === 'code' ? sys.content : '';
            document.getElementById('iconFileInput').value = '';
            document.getElementById('sliderFileInput').value = '';
            document.getElementById('videoUrlInput').value = sys.video || '';
            document.getElementById('restrictedInput').checked = !!sys.restricted;
            toggleAssignedList();

            switchTab(sys.type || 'url');
            document.getElementById('modalOverlay').style.display = 'flex';
        }

        function toggleAssignedList() {
            const restricted = document.getElementById('restrictedInput').checked;
            document.getElementById('assignedStudentsWrap').style.display = restricted ? 'block' : 'none';
            if (!restricted) return;
            const names = Object.keys(allStudentsCache)
                .filter(sid => (allStudentsCache[sid].allowedSystems || []).includes(activeSystemId))
                .map(sid => `${allStudentsCache[sid].name || sid} (${sid})`);
            document.getElementById('assignedStudentsList').innerText = names.length
                ? names.join(', ')
                : 'No students have been granted access yet.';
        }

        function closeModal() {
            document.getElementById('modalOverlay').style.display = 'none';
        }

        function switchTab(tab) {
            activeTab = tab;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

            if (tab === 'url') {
                document.querySelectorAll('.tab')[0].classList.add('active');
                document.getElementById('tab-url').classList.add('active');
            } else {
                document.querySelectorAll('.tab')[1].classList.add('active');
                document.getElementById('tab-code').classList.add('active');
            }
        }

        function compressImage(file, maxWidth, maxHeight, quality, callback) {
            const reader = new FileReader();
            reader.onerror = function() {
                console.error('Failed to read file:', file && file.name);
                callback(null);
            };
            reader.onload = function(e) {
                const img = new Image();
                img.onerror = function() {
                    console.error('Failed to decode image:', file && file.name);
                    callback(null);
                };
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;

                    if (width > height) {
                        if (width > maxWidth) {
                            height = Math.round((height * maxWidth) / width);
                            width = maxWidth;
                        }
                    } else {
                        if (height > maxHeight) {
                            width = Math.round((width * maxHeight) / height);
                            height = maxHeight;
                        }
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    callback(canvas.toDataURL('image/jpeg', quality));
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        async function saveSystemData() {
            const title = document.getElementById('systemTitleInput').value.trim() || defaultTitleFor(activeSystemId);
            // Category is locked to the slot's position (see defaultCategoryFor)
            // so it's saved from there directly, not read from the disabled
            // dropdown — guarantees exactly 12 systems per category forever.
            const category = defaultCategoryFor(activeSystemId);
            const desc = document.getElementById('systemDescInput').value.trim();
            const restricted = document.getElementById('restrictedInput').checked;
            const iconFile = document.getElementById('iconFileInput').files[0];
            const slideFiles = Array.from(document.getElementById('sliderFileInput').files);
            const videoUrl = document.getElementById('videoUrlInput').value.trim();
            const content = activeTab === 'url' 
                ? document.getElementById('urlInput').value.trim() 
                : document.getElementById('codeInput').value.trim();

            const saveBtn = document.getElementById('btnSave');
            const originalBtnText = saveBtn ? saveBtn.textContent : '';
            if (saveBtn) { saveBtn.disabled = true; saveBtn.textContent = t('savingText'); }

            let iconBase64 = systemsData[activeSystemId]?.icon || '';
            let slidesArray = systemsData[activeSystemId]?.slides || [];

            try {
                if (iconFile) {
                    const compressed = await new Promise(res => compressImage(iconFile, 120, 120, 0.7, res));
                    if (compressed) iconBase64 = compressed;
                    else alert(t('alertIconFail'));
                }

                if (slideFiles.length > 0) {
                    const compressedSlides = [];
                    for (let file of slideFiles) {
                        const slideImg = await new Promise(res => compressImage(file, 500, 320, 0.6, res));
                        if (slideImg) compressedSlides.push(slideImg);
                    }
                    if (compressedSlides.length > 0) slidesArray = compressedSlides;
                    else alert(t('alertSlideFail'));
                }

                const newEntry = {
                    title,
                    category,
                    desc,
                    restricted,
                    icon: iconBase64,
                    slides: slidesArray,
                    video: videoUrl,
                    type: activeTab,
                    content
                };

                try {
                    await systemsCollectionRef.doc(String(activeSystemId)).set(newEntry, { merge: false });
                    systemsData[activeSystemId] = newEntry;
                    renderGrid();
                    closeModal();
                } catch (storageErr) {
                    console.error('Failed to save system data:', storageErr);
                    alert(t('alertSaveFail'));
                }
            } finally {
                if (saveBtn) { saveBtn.disabled = false; saveBtn.textContent = originalBtnText; }
            }
        }

        // =================================================================
        // STUDENT ID GATE — lets a student unlock systems a teacher has
        // marked "restricted" and assigned to them by Student ID. This is
        // the same trust model as the "enter your child's Student ID"
        // pattern used elsewhere: no password, just a shared secret code
        // the teacher hands out. It keeps casual/accidental access out,
        // but — like that other system — a technically determined user
        // could still read Firestore directly from devtools, since the
        // real enforcement here is client-side. For a hard guarantee,
        // Firestore Security Rules would need to check a signed-in
        // student's UID against the allowedSystems list server-side.
        // =================================================================
        function updateStudentIdBtn() {
            const btn = document.getElementById('studentIdBtn');
            if (currentStudent) {
                btn.textContent = `🔑 ${currentStudent.name || currentStudent.id}`;
                btn.classList.add('logged-in');
            } else {
                btn.textContent = '🔑 Student ID';
                btn.classList.remove('logged-in');
            }
        }

        function openStudentIdModal(fromLockedCard) {
            document.getElementById('studentIdError').style.display = 'none';
            document.getElementById('studentIdInputField').value = '';
            const loggedIn = !!currentStudent;
            document.getElementById('studentIdLoggedOutView').style.display = loggedIn ? 'none' : 'block';
            document.getElementById('studentIdLoggedInView').style.display = loggedIn ? 'block' : 'none';
            if (loggedIn) document.getElementById('studentIdCurrentName').innerText = `${currentStudent.name || ''} (${currentStudent.id})`;
            document.getElementById('studentIdOverlay').style.display = 'flex';
        }

        function closeStudentIdModal() {
            document.getElementById('studentIdOverlay').style.display = 'none';
        }

        async function submitStudentId() {
            const raw = document.getElementById('studentIdInputField').value.trim();
            const errEl = document.getElementById('studentIdError');
            errEl.style.display = 'none';
            if (!raw) return;
            const id = raw.toUpperCase();
            try {
                const doc = await studentsCollectionRef.doc(id).get();
                if (!doc.exists) {
                    errEl.textContent = 'Student ID not found — please ask your teacher.';
                    errEl.style.display = 'block';
                    return;
                }
                const data = doc.data();
                currentStudent = { id, name: data.name || '', allowedSystems: data.allowedSystems || [] };
                localStorage.setItem('seg_student', JSON.stringify(currentStudent));
                updateStudentIdBtn();
                renderGrid();
                closeStudentIdModal();
            } catch (e) {
                console.error('Failed to look up student:', e);
                errEl.textContent = 'Could not verify right now — please try again.';
                errEl.style.display = 'block';
            }
        }

        function switchStudent() {
            currentStudent = null;
            localStorage.removeItem('seg_student');
            updateStudentIdBtn();
            renderGrid();
            closeStudentIdModal();
        }

        // =================================================================
        // ADMIN: manage the student roster and per-student system access.
        // =================================================================
        async function loadAllStudents() {
            try {
                const snap = await studentsCollectionRef.get();
                allStudentsCache = {};
                snap.forEach(doc => { allStudentsCache[doc.id] = doc.data(); });
            } catch (e) {
                console.error('Failed to load students:', e);
            }
        }

        function openManageStudents() {
            document.getElementById('studentSearchInput').value = '';
            loadAllStudents().then(() => {
                renderStudentList();
                resetStudentForm();
                document.getElementById('manageStudentsOverlay').style.display = 'flex';
            });
        }

        function closeManageStudents() {
            document.getElementById('manageStudentsOverlay').style.display = 'none';
        }

        function renderStudentList() {
            const q = document.getElementById('studentSearchInput').value.trim().toLowerCase();
            const container = document.getElementById('studentListContainer');
            const ids = Object.keys(allStudentsCache)
                .filter(id => !q || id.toLowerCase().includes(q) || (allStudentsCache[id].name || '').toLowerCase().includes(q))
                .sort();
            if (ids.length === 0) {
                container.innerHTML = `<div class="student-row" style="cursor:default;"><span class="sname">No students added yet</span></div>`;
                return;
            }
            container.innerHTML = ids.map(id => {
                const s = allStudentsCache[id];
                const count = (s.allowedSystems || []).length;
                return `<div class="student-row" onclick="loadStudentIntoForm('${id.replace(/'/g,"\\'")}')">
                    <span><span class="sid">${escapeHtml(id)}</span> — <span class="sname">${escapeHtml(s.name || '')} (${count} System)</span></span>
                    <button class="del-student" title="Delete this student" onclick="event.stopPropagation(); deleteStudentRow('${id.replace(/'/g,"\\'")}')">✕</button>
                </div>`;
            }).join('');
        }

        function buildSystemChecklist(checkedIds) {
            checkedIds = checkedIds || [];
            const wrap = document.getElementById('studentSystemChecklist');
            let html = '';
            let lastGroup = null;
            for (let i = 1; i <= TOTAL_SYSTEMS; i++) {
                const title = (systemsData[i] && systemsData[i].title) ? systemsData[i].title : defaultTitleFor(i);
                const checked = checkedIds.includes(i) ? 'checked' : '';
                const level = defaultLevelFor(i);
                const cat = defaultCategoryFor(i);
                const groupLabel = level ? `English — ${level}` : (cat === 'health' ? 'Health' : 'Technology');
                if (groupLabel !== lastGroup) {
                    html += `<div class="checklist-group-label">${escapeHtml(groupLabel)}</div>`;
                    lastGroup = groupLabel;
                }
                html += `<label><input type="checkbox" value="${i}" ${checked}> ${escapeHtml(title)}</label>`;
            }
            wrap.innerHTML = html;
        }

        // Looks at every existing Student ID matching the "C2-EPE-####"
        // pattern, finds the highest number used, and suggests the next
        // one — so the admin doesn't have to remember or count by hand.
        // IDs that don't follow the pattern (custom ones) are ignored for
        // this calculation but are never touched or renumbered.
        function suggestNextStudentId() {
            const prefix = 'C2-EPE-';
            let maxNum = 0;
            Object.keys(allStudentsCache).forEach(id => {
                const m = id.match(/^C2-EPE-(\d{4,})$/i);
                if (m) {
                    const n = parseInt(m[1], 10);
                    if (n > maxNum) maxNum = n;
                }
            });
            const next = String(maxNum + 1).padStart(4, '0');
            return prefix + next;
        }

        function resetStudentForm() {
            editingStudentId = null;
            document.getElementById('studentFormHeading').innerText = '➕ Add New Student';
            document.getElementById('editStudentId').value = suggestNextStudentId();
            document.getElementById('editStudentId').disabled = false;
            document.getElementById('editStudentName').value = '';
            buildSystemChecklist([]);
        }

        function loadStudentIntoForm(id) {
            const s = allStudentsCache[id];
            if (!s) return;
            editingStudentId = id;
            document.getElementById('studentFormHeading').innerText = `✏️ Edit Student: ${id}`;
            document.getElementById('editStudentId').value = id;
            document.getElementById('editStudentId').disabled = true; // Student ID is the doc key — create a new entry to rename
            document.getElementById('editStudentName').value = s.name || '';
            buildSystemChecklist(s.allowedSystems || []);
        }

        async function saveStudent() {
            const idField = document.getElementById('editStudentId');
            const id = idField.value.trim().toUpperCase();
            const name = document.getElementById('editStudentName').value.trim();
            if (!id) { alert('Please enter a Student ID.'); return; }
            const allowedSystems = Array.from(document.querySelectorAll('#studentSystemChecklist input:checked')).map(cb => parseInt(cb.value));
            try {
                await studentsCollectionRef.doc(id).set({ name, allowedSystems }, { merge: false });
                allStudentsCache[id] = { name, allowedSystems };
                renderStudentList();
                resetStudentForm();
                // If this student is the one currently browsing on this device, refresh their live permissions.
                if (currentStudent && currentStudent.id === id) {
                    currentStudent = { id, name, allowedSystems };
                    localStorage.setItem('seg_student', JSON.stringify(currentStudent));
                    updateStudentIdBtn();
                }
                renderGrid();
            } catch (e) {
                console.error('Failed to save student:', e);
                alert('Could not save — please try again.');
            }
        }

        async function deleteStudentRow(id) {
            if (!confirm(`Delete student ${id}?`)) return;
            try {
                await studentsCollectionRef.doc(id).delete();
                delete allStudentsCache[id];
                renderStudentList();
                if (editingStudentId === id) resetStudentForm();
                renderGrid();
            } catch (e) {
                console.error('Failed to delete student:', e);
                alert('Could not delete — please try again.');
            }
        }

        document.getElementById('viewerOverlay').addEventListener('click', (e) => {
            if (e.target.id === 'viewerOverlay') closeViewer();
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeViewer();
        });

        updateStudentIdBtn();
        document.getElementById('footerYear').textContent = new Date().getFullYear();
        document.documentElement.lang = currentLang;
        applyStaticTranslations();
        updateAdminLockIcon();
        initData();
    </script>
</body>
</html>
