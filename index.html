<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Listening Library · C2-EPE Digital School</title>
<style>
:root{--navy:#000080;--navy2:#0b1a5c;--gold:#FFD700;--gold2:#c9973a;--ink:#14204a;--bg:#f4f6fb}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--ink)}
header{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;border-bottom:4px solid var(--gold)}
.top{max-width:1060px;margin:0 auto;display:flex;align-items:center;gap:16px;padding:16px 18px}
.top img{height:62px}
.top h1{margin:0;font-size:1.45rem;color:var(--gold)}
.top p{margin:4px 0 0;font-size:.88rem;opacity:.9}
.mode{margin-left:auto;font-size:.75rem;font-weight:700;padding:5px 10px;border-radius:12px;background:rgba(255,215,0,.15);color:var(--gold);border:1px solid rgba(255,215,0,.4);white-space:nowrap}
main{max-width:1060px;margin:0 auto;padding:18px 16px 40px}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.bar input{flex:1;min-width:220px;padding:10px 12px;border:1.5px solid #cfd6ea;border-radius:10px;font-size:.95rem}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1.5px solid var(--navy);background:#fff;color:var(--navy);border-radius:18px;padding:7px 14px;font-weight:700;font-size:.82rem;cursor:pointer}
.chip.on{background:var(--navy);color:var(--gold)}
.lvl{margin:18px 0 8px;font-weight:700;color:var(--navy);font-size:1.05rem;border-bottom:2px solid var(--gold);padding-bottom:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.book{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,128,.08);cursor:pointer;border:1px solid #e3e8f5;transition:transform .12s}
.book:hover{transform:translateY(-3px)}
.cov{height:120px;background:linear-gradient(140deg,var(--navy),#1c3470);display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--gold);font-weight:700;text-align:center;padding:10px;border-bottom:3px solid var(--gold)}
.cov .ic{font-size:2rem}
.cov .lv{font-size:.75rem;color:#fff;opacity:.85;margin-top:4px}
.bi{padding:10px 12px}
.bi b{display:block;font-size:.95rem}
.bi span{font-size:.8rem;color:#6b7390}
.back{display:inline-flex;gap:6px;align-items:center;background:#fff;border:1.5px solid var(--navy);color:var(--navy);border-radius:10px;padding:7px 14px;font-weight:700;cursor:pointer;margin-bottom:12px}
.bh{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.bh h2{margin:0;color:var(--navy)}
.bh small{color:#6b7390}
.spd select{padding:7px;border-radius:8px;border:1.5px solid #cfd6ea}
.tip{background:#fff8d6;border-left:4px solid var(--gold);padding:10px 14px;border-radius:8px;font-size:.88rem;margin-bottom:14px;line-height:1.5}
.sec{background:#fff;border-radius:14px;box-shadow:0 2px 10px rgba(0,0,128,.08);margin-bottom:14px;overflow:hidden;border:1px solid #e3e8f5}
.sh{background:var(--navy);color:var(--gold);padding:11px 16px;font-weight:700;display:flex;justify-content:space-between;gap:8px}
.sh small{color:#fff;opacity:.8;font-weight:400}
.tr{padding:12px 16px;border-top:1px solid #eef1f8}
.tr:first-of-type{border-top:none}
.trh{display:flex;align-items:center;gap:10px}
.num{background:var(--gold2);color:#fff;border-radius:50%;min-width:28px;height:28px;padding:0 6px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem}
.trt{font-weight:700;flex:1}
.dur{font-size:.8rem;color:#6b7390}
audio{width:100%;margin-top:8px;height:40px}
.row{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
.btn{background:#fff;border:1.5px solid var(--navy);color:var(--navy);border-radius:8px;padding:6px 12px;font-size:.82rem;font-weight:700;cursor:pointer;text-decoration:none}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--navy)}
.script{display:none;margin-top:9px;background:#f7f9ff;border-radius:10px;padding:10px 14px;font-size:.9rem;line-height:1.6}
.script.on{display:block}
.script ol{margin:0 0 6px;padding-left:22px}
.ans{color:#0a7a3a;font-weight:700}
.empty{text-align:center;color:#6b7390;padding:30px}
footer{text-align:center;color:#6b7390;font-size:.8rem;padding:20px}
</style>
</head>

<script>
/* Teacher mode (?teacher=1) shows scripts and answers. Student mode hides them. */
const TEACHER = new URLSearchParams(location.search).get('teacher') === '1' || window.TEACHER_DEFAULT === true;
const LIB = (window.LIBRARY || []);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mmss = s => s ? Math.floor(s/60) + ':' + String(s%60).padStart(2,'0') : '';
let level = 'All', q = '';
$('#mode').textContent = TEACHER ? '👩‍🏫 Teacher mode' : '🎒 Student mode';

function home(){
  const levels = ['All', ...new Set(LIB.map(b => b.level))];
  const list = LIB.filter(b => (level === 'All' || b.level === level) &&
     (!q || (b.title + ' ' + b.level + ' ' + (b.subtitle||'')).toLowerCase().includes(q)));
  const by = {};
  list.forEach(b => (by[b.level] = by[b.level] || []).push(b));
  $('#app').innerHTML = `
    <div class="bar"><input id="q" type="search" placeholder="Search a book or level…" value="${esc(q)}"></div>
    <div class="chips">${levels.map(l => `<button class="chip ${l===level?'on':''}" data-l="${esc(l)}">${esc(l)}</button>`).join('')}</div>
    ${Object.keys(by).length ? Object.entries(by).map(([lv, bs]) => `
      <div class="lvl">${esc(lv)}</div>
      <div class="grid">${bs.map(b => `
        <div class="book" data-id="${esc(b.id)}"><div class="cov"><div class="ic">${esc(b.icon || '🎧')}</div>${esc(b.title)}<div class="lv">${esc(b.level)}</div></div>
        <div class="bi"><b>${esc(b.subtitle || b.title)}</b><span>${b.sections.reduce((n,s)=>n+s.tracks.length,0)} tracks</span></div></div>`).join('')}</div>`).join('')
      : '<div class="empty">No book found.</div>'}`;
  $('#q').oninput = e => { q = e.target.value.trim().toLowerCase(); home(); $('#q').focus(); $('#q').setSelectionRange(99,99); };
  document.querySelectorAll('.chip').forEach(c => c.onclick = () => { level = c.dataset.l; home(); });
  document.querySelectorAll('.book').forEach(c => c.onclick = () => { location.hash = 'book=' + c.dataset.id; });
}

function bookView(b){
  const groups = [...new Set(b.sections.map(s => s.group || ''))];
  let g = groups[0];
  const draw = () => {
    const secs = b.sections.filter(s => (s.group || '') === g);
    $('#app').innerHTML = `
      <button class="back" onclick="location.hash=''">← All books</button>
      <div class="bh"><div><h2>${esc(b.title)}</h2><small>${esc(b.level)}${b.subtitle ? ' · ' + esc(b.subtitle) : ''}</small></div>
      <label class="spd"><b>Speed</b> <select id="spd"><option>0.8</option><option>0.9</option><option selected>1</option><option>1.1</option></select></label></div>
      ${b.note ? `<div class="tip">${esc(b.note)}</div>` : ''}
      ${groups.length > 1 ? `<div class="chips" style="margin-bottom:12px">${groups.map(x => `<button class="chip ${x===g?'on':''}" data-g="${esc(x)}">${esc(x)}</button>`).join('')}</div>` : ''}
      ${secs.map((s, si) => `<div class="sec"><div class="sh"><span>${esc(s.title)}</span><small>${esc(s.info || '')}</small></div>
        ${s.tracks.map((t, ti) => { const id = `s${si}_${ti}`; const hasScript = TEACHER && (t.script || t.key); return `
        <div class="tr"><div class="trh"><span class="num">${esc(t.n ?? ti + 1)}</span><span class="trt">${esc(t.title)}</span><span class="dur">${t.secs ? '⏱ ' + mmss(t.secs) : ''}</span></div>
        <audio controls preload="none" src="${esc(encodeURI(b.folder + '/' + t.file))}"></audio>
        <div class="row">${hasScript ? `<button class="btn" onclick="document.getElementById('${id}').classList.toggle('on')">📄 Script &amp; answers</button>` : ''}
        ${TEACHER ? `<a class="btn gold" href="${esc(encodeURI(b.folder + '/' + t.file))}" download>⬇ MP3</a>` : ''}</div>
        ${hasScript ? `<div class="script" id="${id}">${t.script ? `<ol>${t.script.map(x => `<li>${esc(x)}</li>`).join('')}</ol>` : ''}${t.key ? `<div class="ans">Answers: ${esc(t.key)}</div>` : ''}</div>` : ''}
        </div>`; }).join('')}</div>`).join('')}`;
    document.querySelectorAll('[data-g]').forEach(c => c.onclick = () => { g = c.dataset.g; draw(); });
    const spd = $('#spd');
    const setRate = () => document.querySelectorAll('audio').forEach(a => a.playbackRate = parseFloat(spd.value));
    spd.onchange = setRate;
    document.querySelectorAll('audio').forEach(a => a.onplay = () => { a.playbackRate = parseFloat(spd.value);
      document.querySelectorAll('audio').forEach(o => { if (o !== a) o.pause(); }); });
  };
  draw();
}

function route(){
  const m = location.hash.match(/book=([^&]+)/);
  const b = m && LIB.find(x => x.id === decodeURIComponent(m[1]));
  b ? bookView(b) : home();
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);
route();
</script>
</body>
